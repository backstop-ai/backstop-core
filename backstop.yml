project: backstop-core
packs:
    backstop-ai/backstop-core-architecture: 0.1.8
    backstop-ai/backstop-design-system: 0.1.5
    backstop-ai/backstop-self: 1.1.3
    backstop-ai/bash-toolchain: 0.1.2
    backstop-ai/ci-workflows: 0.1.2
    backstop-ai/cobra-cli-standards: 0.2.1
    backstop-ai/documentation-semantics: 0.1.1
    backstop-ai/go-contracts: 1.4.0
    backstop-ai/go-standards: 1.2.1
    backstop-ai/go-substantiveness: 1.2.1
    backstop-ai/go-toolchain: 1.9.0
enforcement:
    policy:
        artifact_status_drift:
            applies-to: new-code
            level: block
        artifact_validation:
            level: block
        contract_signature:
            applies-to: new-code
            level: block
        coverage_threshold:
            applies-to: new-code
            level: block
        pack_engines:
            applies-to: new-code
            level: block
            sources:
                backstop-ai/backstop-self:
                    applies-to: all-code
                    level: block
        test_substantiveness:
            applies-to: new-code
            level: block
        test_verification:
            level: block
