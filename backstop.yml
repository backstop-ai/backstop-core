project: backstop-core
packs:
    backstop-ai/cobra-cli-standards: 0.2.1
    backstop/contracts: local
    backstop/go-standards: local
    backstop/go-toolchain: local
    backstop/self: local
    backstop/substantiveness: local
enforcement:
    policy:
        artifact_status_drift:
            applies-to: new-code
            level: block
        artifact_validation:
            level: block
        contract_signature:
            applies-to: new-code
            level: block
        coverage_threshold:
            applies-to: new-code
            level: block
        pack_engines:
            applies-to: new-code
            level: block
            sources:
                backstop/self:
                    applies-to: all-code
                    level: block
        test_substantiveness:
            applies-to: new-code
            level: block
        test_verification:
            level: block
