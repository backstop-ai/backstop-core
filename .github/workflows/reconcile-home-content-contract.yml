name: Reconcile homepage content contract

on:
  push:
    branches: [codex/split-site-verification-pages]

permissions:
  contents: write

jobs:
  reconcile:
    if: >-
      github.event.head_commit.message == 'chore: reconcile homepage content contract'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/split-site-verification-pages
          fetch-depth: 0

      - name: Classify discovery presentation and reconcile artifacts
        run: |
          python3 - <<'PY'
          from pathlib import Path

          verifier = Path('scripts/verify-public-product-model.sh')
          text = verifier.read_text()
          old = """'docs/index.md':{
 'Evaluate the control surface, learn the operating model, or move directly into a small working adoption. The site follows those decisions instead of mirroring the repository tree.':'navigation connective'},"""
          blocks = [
            ('<p class="home-lede">The problem is not generating more code. The problem is knowing whether the code that arrived is the code you actually asked for, whether it still follows the standards you intended to preserve, and whether a green result means the same thing tomorrow that it means today.</p>', 'HOME-001 discovery framing'),
            ('''<div class="home-capabilities" data-home-capabilities>
  <article>
    <span>01</span>
    <h3>Define the work</h3>
    <p>Use explicit artifacts to make intent inspectable before implementation begins. Larger work moves from bundle to spec to plan; smaller reactive work can move from issue to plan. Both paths create a concrete acceptance boundary instead of asking an agent to infer one.</p>
  </article>
  <article>
    <span>02</span>
    <h3>Enforce your standards</h3>
    <p>Put mechanical engineering decisions in versioned packs and run them while the agent works and again at integration. Architecture boundaries, test expectations, dependency policy, and implementation patterns stop being prompt suggestions and become blocking rules.</p>
  </article>
  <article>
    <span>03</span>
    <h3>Detect drift</h3>
    <p>Compare standards against an explicit baseline and requirements against implementation evidence. Existing debt can remain visible without becoming permanent permission for new debt, while completion claims stay tied to the tests and evidence that make them true.</p>
  </article>
</div>''', 'HOME-002 define/enforce/drift discovery summary'),
            ('''<div class="home-gate-proof" data-home-gate-proof aria-label="Example Backstop gate result">
  <div class="home-gate-command"><span aria-hidden="true">$</span> backstop gate</div>
  <div class="home-gate-results">
    <span>✓ pack integrity</span>
    <span>✓ artifacts</span>
    <span>✓ engineering standards</span>
    <span>✓ tests</span>
    <span>✓ requirements</span>
    <strong>PASS · exit 0</strong>
  </div>
</div>''', 'HOME-002 illustrative gate presentation'),
            ('Backstop does not make probabilistic systems deterministic. It makes the important boundaries around them deterministic: what work was promised, which standards apply, what evidence must exist, and what conditions are allowed to produce a passing verdict.', 'HOME-002 discovery connective'),
            ('You do not have to adopt the entire framework at once. Start with the failure you need to control, then add the pieces that make that boundary enforceable.', 'visitor decision connective'),
            ('''<div class="home-paths" data-home-paths>
  <article>
    <span>Evaluate</span>
    <h3>Decide whether Backstop fits</h3>
    <p>Start with the failure class, guarantees, limits, compatibility boundary, and evidence model before changing a repository.</p>
    <a href="/evaluate/">Evaluate the control surface →</a>
  </article>
  <article>
    <span>Understand</span>
    <h3>See how the pieces reinforce one another</h3>
    <p>Follow the artifact lifecycle, enforcement loop, ownership boundaries, and the point where deterministic checks replace agent judgment.</p>
    <a href="/model/">Read the operating model →</a>
  </article>
  <article>
    <span>Adopt</span>
    <h3>Put one real standard behind the gate</h3>
    <p>Install Backstop, initialize the repository, choose a maintained pack, and prove that a violation actually blocks before expanding the surface.</p>
    <a href="/adopt/">Start a working adoption →</a>
  </article>
</div>''', 'visitor decision navigation'),
            ('The framework is composable: artifacts can make delivery intent traceable without policy packs; packs and the gate can enforce standards without the full artifact chain; recipes can provide deterministic scaffolding without owning enforcement. The pieces are stronger together, but each should earn its place by controlling a real failure.', 'discovery composition connective'),
            ("> If it has to be right, it must be deterministic. If it's green, it ships.", 'brand thesis connective'),
          ]
          entries = [" 'Evaluate the control surface, learn the operating model, or move directly into a small working adoption. The site follows those decisions instead of mirroring the repository tree.':'navigation connective'"]
          entries += [f" {block!r}:{reason!r}" for block, reason in blocks]
          new = "'docs/index.md':{\n" + ",\n".join(entries) + "},"
          if text.count(old) != 1:
            raise SystemExit('homepage allowance insertion point changed')
          text = text.replace(old, new, 1)
          verifier.write_text(text)

          spec = Path('specs/SPEC-075-static-public-site-design-system.spec.md')
          text = spec.read_text()
          edits = [
            ('spec_version: 1.0.16', 'spec_version: 1.0.17'),
            ('      and two animation frames. Before interaction checks, each page must expose the exact SPEC-072\n      `required_blocks` for its canonical route as a rendered completeness contract.',
             '      and two animation frames. Before interaction checks, the shared page-hero include must expose the exact SPEC-072\n      `required_blocks` for its canonical route as a rendered completeness contract on `section[data-page-hero][data-required-blocks]`.'),
          ]
          for old_text, new_text in edits:
            if text.count(old_text) != 1:
              raise SystemExit(f'spec replacement changed: {old_text!r}')
            text = text.replace(old_text, new_text, 1)
          spec.write_text(text)

          plan = Path('plans/PLAN-SPEC-075-static-public-site-design-system.plan.yml')
          text = plan.read_text()
          edits = [
            ('spec_version: "1.0.16"', 'spec_version: "1.0.17"'),
            ("          after fonts/two frames. Read each route's exact required-block IDs from the rendered topology\n          contract; require one visible heading per ID, >=80 normalized content characters, <=160px to",
             "          after fonts/two frames. Read each route's exact required-block IDs from the shared page-hero\n          rendered topology contract; require one visible heading per ID, >=80 normalized content characters, <=160px to"),
          ]
          for old_text, new_text in edits:
            if text.count(old_text) != 1:
              raise SystemExit(f'plan replacement changed: {old_text!r}')
            text = text.replace(old_text, new_text, 1)
          plan.write_text(text)
          PY
          rm .github/workflows/reconcile-home-content-contract.yml

      - name: Validate governed artifacts and product truth
        run: |
          go build -o ./bin/backstop ./cmd/backstop
          ./bin/backstop artifact validate --all
          ./scripts/verify-public-product-model.sh
          git diff --check

      - name: Commit reconciliation
        run: |
          git config user.name "backstop-content-reconciler"
          git config user.email "actions@users.noreply.github.com"
          git add scripts/verify-public-product-model.sh \
            specs/SPEC-075-static-public-site-design-system.spec.md \
            plans/PLAN-SPEC-075-static-public-site-design-system.plan.yml \
            .github/workflows/reconcile-home-content-contract.yml
          git commit -m "spec(SPEC-075): classify substantive discovery presentation"
          git push origin HEAD:codex/split-site-verification-pages
