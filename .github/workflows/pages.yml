name: Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Verify site before deployment
    uses: ./.github/workflows/site-verification.yml
    permissions:
      contents: read
      pages: read

  deploy:
    name: Deploy verified public site
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    outputs:
      page-url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128

  verify-deployment:
    name: Verify authoritative deployment identity
    needs: [build, deploy]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      deployments: read
      pages: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Verify Pages APIs, retained artifact, and HTTPS routes
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          ./scripts/verify-pages-deployment.sh
          --repository "$GITHUB_REPOSITORY"
          --run-id "$GITHUB_RUN_ID"
          --commit "$GITHUB_SHA"
          --artifact-id "${{ needs.build.outputs.artifact-id }}"
          --page-url "${{ needs.deploy.outputs.page-url }}"
