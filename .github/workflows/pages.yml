name: Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build and verify public site
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    outputs:
      artifact-id: ${{ steps.upload.outputs.artifact_id }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b
        with:
          ruby-version: "3.3.4"
          bundler-cache: true
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: npm
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b
        with:
          static_site_generator: jekyll
      - name: Install browser verifier
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Build the Backstop CLI
        run: go build -o ./bin/backstop ./cmd/backstop
      - name: Install the remote pack fleet
        run: ./bin/backstop pack install
      - name: Build and verify the complete public site
        env:
          BACKSTOP_SITE_OUTPUT: _site
          BACKSTOP_SITE_RETAIN: "1"
          BACKSTOP_SITE_COMMIT: ${{ github.sha }}
        run: ./scripts/verify-public-site.sh
      - name: Stamp deployment identity
        run: ./scripts/stamp-pages-artifact.sh --commit "$GITHUB_SHA" --run-id "$GITHUB_RUN_ID" _site
      - name: Upload verified Pages artifact
        id: upload
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b
        with:
          path: _site
          include-hidden-files: true

  deploy:
    name: Deploy verified public site
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    outputs:
      page-url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e

  verify-deployment:
    name: Verify authoritative deployment identity
    needs: [build, deploy]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      deployments: read
      pages: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Verify Pages APIs, retained artifact, and HTTPS routes
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          ./scripts/verify-pages-deployment.sh
          --repository "$GITHUB_REPOSITORY"
          --run-id "$GITHUB_RUN_ID"
          --commit "$GITHUB_SHA"
          --artifact-id "${{ needs.build.outputs.artifact-id }}"
          --page-url "${{ needs.deploy.outputs.page-url }}"
