name: Site Verification

on:
  pull_request:
    branches: [main]
  workflow_call:
    outputs:
      artifact-id:
        description: Verified Pages artifact ID
        value: ${{ jobs.verify.outputs.artifact-id }}

# This workflow proves the site artifact only. Deployment authority lives in pages.yml.
permissions: {}

jobs:
  verify:
    name: Build and verify public site
    runs-on: ubuntu-latest
    env:
      # ruby/setup-ruby installs gems beneath ./vendor/bundle. Go otherwise
      # mistakes that Ruby-owned directory for a Go vendor tree after setup.
      GOFLAGS: -mod=readonly
    permissions:
      contents: read
      pages: read
    outputs:
      artifact-id: ${{ steps.upload.outputs.artifact_id }}
    steps:
      - name: Verify workflow Pages build mode
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mode="$(gh api "repos/${GITHUB_REPOSITORY}/pages" --jq .build_type)"
          if [ "$mode" != "workflow" ]; then
            echo "Pages build_type must be workflow; observed: $mode" >&2
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b
        with:
          ruby-version: "3.3.4"
          bundler-cache: true
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
          cache: npm
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d
      - name: Install browser verifier
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Install the design-system engine at its allowlist pin
        run: pipx install semgrep==1.156.0
      - name: Build the Backstop CLI
        run: go build -o ./bin/backstop ./cmd/backstop
      - name: Install the remote pack fleet
        run: ./bin/backstop pack install
      - name: Build and verify the complete public site
        env:
          BACKSTOP_SITE_OUTPUT: _site
          BACKSTOP_SITE_RETAIN: "1"
          BACKSTOP_SITE_COMMIT: ${{ github.sha }}
        run: ./scripts/verify-public-site.sh
      - name: Stamp deployment identity
        run: ./scripts/stamp-pages-artifact.sh --commit "$GITHUB_SHA" --run-id "$GITHUB_RUN_ID" _site
      - name: Upload verified Pages artifact
        id: upload
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9
        with:
          path: _site
          include-hidden-files: true
