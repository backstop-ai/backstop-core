name: Reconcile homepage copy
on:
  push:
    branches: [codex/split-site-verification-pages]
permissions:
  contents: write
jobs:
  reconcile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/split-site-verification-pages
      - name: Reconcile closed-world homepage copy
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          page = Path('docs/index.md').read_text()
          verifier_path = Path('scripts/verify-public-product-model.sh')
          verifier = verifier_path.read_text()

          def between(start_marker, end_marker):
              start = page.index(start_marker)
              end = page.index(end_marker, start)
              return page[start:end].strip()

          blocks = [
              (between('<p class="home-lede">', '\n\n<div class="home-capabilities"'), 'HOME-001 discovery framing'),
              (between('<div class="home-capabilities"', '\n\n<div class="home-gate-proof"'), 'HOME-002 define/enforce/drift summary'),
              (between('<div class="home-gate-proof"', '\n\nBackstop does not make probabilistic systems deterministic.'), 'HOME-002 illustrative gate presentation'),
              ('Backstop does not make probabilistic systems deterministic. It makes the important boundaries around them deterministic: what work was promised, which standards apply, what evidence must exist, and what conditions are allowed to produce a passing verdict.', 'HOME-002 discovery connective'),
              ('You do not have to adopt the entire framework at once. Start with the failure you need to control, then add the pieces that make that boundary enforceable.', 'visitor decision connective'),
              (between('<div class="home-paths"', '\n\nThe framework is composable:'), 'visitor decision paths'),
              ('The framework is composable: artifacts can make delivery intent traceable without policy packs; packs and the gate can enforce standards without the full artifact chain; recipes can provide deterministic scaffolding without owning enforcement. The pieces are stronger together, but each should earn its place by controlling a real failure.', 'HOME-003 composability summary'),
              ("> If it has to be right, it must be deterministic. If it's green, it ships.", 'product principle presentation'),
          ]

          marker = "'docs/index.md':{\n"
          start = verifier.index(marker) + len(marker)
          end = verifier.index("},\n'docs/evaluate.md':{", start)
          current = verifier[start:end].strip().rstrip(',')
          entries = ([current] if current else []) + [repr(block) + ':' + repr(reason) for block, reason in blocks]
          verifier_path.write_text(verifier[:start] + ',\n '.join(entries) + verifier[end:])
          PY
          rm .github/workflows/reconcile-home-copy.yml
          git config user.name backstop-reconcile
          git config user.email actions@users.noreply.github.com
          git add scripts/verify-public-product-model.sh .github/workflows/reconcile-home-copy.yml
          git commit -m "fix(site): classify homepage presentation copy"
          git push origin HEAD:codex/split-site-verification-pages
