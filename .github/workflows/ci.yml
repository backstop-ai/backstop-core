name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  gate:
    name: Lint + Test + Coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Lint
        run: go tool golangci-lint run ./...

      - name: Test with coverage
        run: go test -race -coverprofile=cover.out -covermode=atomic ./...

      - name: Enforce coverage threshold
        run: |
          THRESHOLD=90
          COVERAGE=$(go tool cover -func=cover.out | grep '^total:' | awk '{print int($3)}')
          echo "Coverage: ${COVERAGE}%  (threshold: ${THRESHOLD}%)"
          if [ "$COVERAGE" -lt "$THRESHOLD" ]; then
            echo "::error::Coverage ${COVERAGE}% is below threshold ${THRESHOLD}%"
            exit 1
          fi

  baseline:
    name: Generate + Publish Baseline Artifact
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    needs: gate
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Build backstop CLI
        run: go build -o ./backstop ./cmd/backstop

      - name: Generate baseline
        run: |
          # Full-scope baseline generation contract: equivalent to `./backstop gate --all --json`.
          # This remains separable from publication and preserves latest successful main semantics for pull.
          ./backstop baseline generate

      - name: Publish baseline
        uses: actions/upload-artifact@v4
        with:
          name: backstop-baseline-v1
          path: .backstop/baseline.json

      # Baseline pull selects the latest successful main run artifact.
