name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  # The blocking job runs BACKSTOP GATE — not lint, test and coverage beside it.
  #
  # ISSUE-020's premise is that the Linux sandbox defect stayed invisible because
  # this repo's CI never called its own product. Running the underlying tools
  # directly is not a weaker version of the same check; it is the gap. Every
  # dimension here comes from an installed pack, reached through the gate.
  #
  # FOUNDER SEMANTICS, stated here so they are not folklore: this job blocks on
  # findings in DIFF-SCOPED files only — "green if the diff is green" — and a file
  # that enters the diff carries ALL of its findings, including ones that predate
  # the change.
  gate:
    name: Backstop Gate
    runs-on: ubuntu-latest
    permissions:
      # A JOB-LEVEL permissions block REPLACES the workflow-level one outright,
      # and every scope it does not list becomes `none`. contents:read is
      # RE-DECLARED for that reason, not for symmetry: without it actions/checkout
      # fails, and it reads as a mystery rather than as a permissions error.
      contents: read
      # WHY THIS JOB NEEDS actions:read, and why only this job. `backstop gate`
      # self-heals a missing .backstop/baseline.json before it runs -
      # resolveBaselineCache -> refreshBaselineFromRemote -> runBaselinePull -
      # and that pull calls `gh api repos/.../actions/runs` and
      # `.../actions/artifacts`. Without this scope both 403 and the gate
      # degrades SILENTLY to a nil baseline (ISSUE-176). It is READ-ONLY, and it
      # is scoped here rather than at the workflow level so the baseline job and
      # every future job keep the unwidened `contents: read`.
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history. The base commit is not in a shallow clone, so without
          # this the base guard below cannot resolve it and every run either falls
          # back or exits 2.
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          # ONE authority for the toolchain version. A second hardcoded go-version
          # here would drift against go.mod silently.
          go-version-file: go.mod

      - name: Install Layer-0 analyzer binaries
        # TWO FACTS, and consolidating these pins later brings the break back:
        #
        #  1. It must be a real BINARY on PATH. provisionEngines resolves the
        #     executable BY NAME, so `go tool golangci-lint` does not satisfy it.
        #  2. It must be v2. The go-toolchain pack declares
        #     `golangci-lint run --output.sarif.path stdout --show-stats=false`,
        #     which is v2-only syntax — and go.mod's tool directive pins v1.64.8
        #     for unrelated reasons, so installing THAT breaks the lint dimension
        #     with an unknown-flag error.
        run: |
          curl -sSfL https://raw.githubusercontent.com/golangci/golangci-lint/HEAD/install.sh \
            | sh -s -- -b "$(go env GOPATH)/bin" v2.6.0
          # Declared by backstop-core-architecture as an assume-present Layer-0
          # analyzer; the pack owns the command and requires this pinned version.
          go install github.com/fe3dback/go-arch-lint@v1.16.0
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Install provisioned engine tools at their allowlist pins
        # These versions are the pins in pkg/pack/engine/allowlist.go. The dispatch
        # gate compares what it finds against those pins and refuses a mismatch
        # with an exit-2 config error, so nothing here floats.
        #
        # Nothing is installed for the SANDBOX, deliberately. The mechanism is
        # Landlock + seccomp: kernel APIs with no package to install. The
        # ruled-out alternative measured present-and-broken on this exact runner
        # image — see pkg/packval/testdata/ubuntu-runner-probe.txt. The sandbox's
        # real requirement is a kernel property, and it is asserted by
        # pkg/packval/sandbox_linux_exec_test.go, which fails loudly on a host
        # without Landlock and runs inside the gate below.
        run: |
          pipx install semgrep==1.156.0
          curl -sSfL "https://github.com/ast-grep/ast-grep/releases/download/0.43.0/app-x86_64-unknown-linux-gnu.zip" -o ast-grep.zip
          mkdir -p "$HOME/.local/bin"
          unzip -o -q ast-grep.zip -d "$HOME/.local/bin"
          chmod +x "$HOME/.local/bin/ast-grep"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Build the backstop CLI
        run: go build -o ./bin/backstop ./cmd/backstop

      - name: Install the pack fleet
        # MUST precede the gate. Against an empty .backstop/packs/ every dimension
        # reports capability_absent and the job passes having checked nothing —
        # which is the failure ISSUE-020 was filed about.
        run: ./bin/backstop pack install

      - name: Resolve the diff base
        # WHY THE BASE IS EXPLICIT: a CI checkout is pristine, so bare diff mode
        # resolves `merge-base HEAD origin/main` to HEAD on a push and finds
        # nothing to check. Simplifying this step away restores a vacuous green.
        #
        # The two events carry the base in different places, and the guard is on
        # RESOLVABILITY rather than on a magic string. One `git rev-parse --verify`
        # covers all three ways the derived value goes bad:
        #   - empty (the event payload field is absent)
        #   - the all-zeros SHA (branch creation, which INCLUDES the very first
        #     push of this history to a new remote)
        #   - non-zero but UNREACHABLE (the force-push shape: github.event.before
        #     names a commit no longer in the fetched history)
        # The third is the one a zero-SHA comparison misses entirely: it does not
        # fire, the dead sha flows through, and the gate exits 2 on an ordinary
        # force-push.
        env:
          EVENT_NAME: ${{ github.event_name }}
          PULL_REQUEST_BASE: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
        run: |
          if [ "$EVENT_NAME" = "pull_request" ]; then
            CANDIDATE="$PULL_REQUEST_BASE"
          else
            CANDIDATE="$PUSH_BEFORE"
          fi

          if [ -n "$CANDIDATE" ] && git rev-parse --verify --quiet "${CANDIDATE}^{commit}" >/dev/null; then
            BASE="$CANDIDATE"
          else
            echo "::warning::derived base '${CANDIDATE}' does not resolve to a commit; falling back to HEAD^"
            if ! git rev-parse --verify --quiet 'HEAD^{commit}' >/dev/null; then
              echo "::error::neither the derived base '${CANDIDATE}' nor HEAD^ resolves; refusing to gate with no base"
              exit 1
            fi
            BASE="$(git rev-parse 'HEAD^')"
          fi

          echo "Diff base: ${BASE}"
          echo "BASE=${BASE}" >> "$GITHUB_ENV"

      # TWO STEPS, ONE GATE — and the split is structural on purpose. The CLI
      # renders EITHER the human table OR --json to stdout, never both, and no flag
      # writes JSON to a file (ISSUE-099 tracks closing that gap, which would
      # collapse these back into one step). Both surfaces are load-bearing: the
      # table is what a person reads in this log, while the JSON carries what no
      # other surface reports - per-file coverage detail, and the in-scope path LIST
      # behind the "in-scope files: N" count.
      #
      # Splitting them into separate STEPS rather than one script is the lesson of
      # the retired linux-sandbox probe workflow, every step of which ended in
      # `exit 0`: in-script exit handling makes a job's shape misleading to someone
      # skimming it. As two steps, which one gates is visible from the step list
      # alone, with no comment required to explain it.
      - name: Capture the gate report as JSON (diagnostic only - does not gate)
        # Runs BEFORE the blocking step, deliberately: a failing gate aborts the job,
        # so a capture placed after it would be skipped on exactly the runs worth
        # diagnosing. The `|| echo` records the exit instead of acting on it - this
        # step reports, the next step decides.
        #
        # THE TOKEN IS BOUND AT THE STEP, NOT AT THE JOB, and the difference is not
        # cosmetic: a job-level env: would hand it to every step in this job,
        # including the two remote installers that pipe `curl | sh` and run
        # `pipx install` and the one that clones eight pack repositories. None of
        # those needs it. This step does, because `backstop gate` runs the
        # self-healing baseline pull, whose ensureGitHubAuth shells `gh auth
        # status` before anything reaches the GitHub API (ISSUE-176).
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./bin/backstop gate --base "$BASE" --json > gate-report.json || echo "diagnostic capture exited $? - the blocking run is the next step"

      - name: Run the gate
        # The id is what the confirmation step below addresses this step by
        # (steps.run_gate.conclusion). Adding an `id:` is safe where an `if:`
        # would not be: TestCIWorkflow_PackInstallFailureFailsTheJob fails any
        # step whose script contains the gate invocation AND declares a
        # condition, and it does not look at ids.
        id: run_gate
        # Diff-scoped with an explicit base. NEVER the all-scope flag (ISSUE-091's
        # under-report is FIXED - the all scope now dispatches its own explicit
        # file list and agrees with a diff-scoped run over the same files - so
        # that defect no longer justifies the ban; the flag stays out of the
        # blocking job pending a founder decision) and never the per-file flag
        # (ISSUE-093's crash-on-unclaimed-scope and silent repeat-dropping are
        # both FIXED - a package-scoped engine is now skipped with a loud advisory
        # when the dispatching pack claims nothing in scope, and --file
        # accumulates across occurrences - so that defect no longer justifies the
        # ban either; this flag likewise stays out of the blocking job pending a
        # founder decision).
        #
        # THIS is the blocking invocation. Its exit is the job's, unchanged.
        #
        # Same step-level token binding as the diagnostic capture above, and for
        # the same reason: this invocation also runs resolveBaselineCache.
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./bin/backstop gate --base "$BASE"

      - name: Confirm the self-healing baseline pull landed a file
        # WHY THIS IS NOT A `baseline pull` STEP: the pull already runs INSIDE the
        # gate, in resolveBaselineCache, before the pack_engines step spawns the
        # test subprocess. A pull step placed BEFORE the gate would create this
        # file itself and prove nothing. This step runs after, and only observes.
        #
        # WHY IT EXISTS AT ALL: ApplyPolicy overwrites baseline_comparison's
        # reason unconditionally on this repo's dogfood policy, so neither the
        # printed table nor --json can tell anyone whether the pull worked. This
        # step can. (ISSUE-176)
        #
        # THE GUARD IS NOT `always()` ALONE. This job can die at tool install, at
        # build, or at pack install - unobserved in the last 78 runs, but one
        # `curl | sh` away - and then "Run the gate" never executes. Under a bare
        # always() this step would still run, find no baseline (nothing had a
        # chance to fetch one), and blame ISSUE-176 for a failure that happened
        # three steps earlier. Skipping when the gate was SKIPPED keeps the
        # diagnosis attributable, which is the entire point of the step. A FAILED
        # gate still runs it - that is the informative case.
        if: always() && steps.run_gate.conclusion != 'skipped'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ -f .backstop/baseline.json ]; then
            echo "baseline present: $(wc -c < .backstop/baseline.json) bytes"
            exit 0
          fi
          echo "::error::.backstop/baseline.json absent after the gate ran - the self-healing pull did not succeed (ISSUE-176)"
          ./bin/backstop baseline pull || echo "bare baseline pull exited $?"
          exit 1

      - name: Upload the gate JSON report
        # always(), because the run worth diagnosing is the one that FAILED - a
        # success-only upload would publish the report exactly when nobody needs it.
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gate-report
          # cover.out is the go-toolchain producer's RAW Go coverage profile
          # (pack.yml declares it as the coverage engine's stdout_artifact). The
          # gate JSON carries per-FILE totals only, so the raw profile is the sole
          # surface that can answer WHICH FUNCTIONS carry zero counters — the
          # question the sandbox_linux.go diagnosis turns on.
          path: |
            gate-report.json
            cover.out
          if-no-files-found: warn

  baseline:
    name: Generate + Publish Baseline Artifact
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    needs: gate
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      # THE SAME LAYER-0 TOOLS THE GATE JOB INSTALLS, and they are not optional here.
      # `baseline generate` runs a FULL-SCOPE gate, and provisionEngines fails loud
      # (exit 2) when a nil-Provision tool is absent from PATH. This job shipped
      # without them and its first ever run (main, 30398137055) died exactly that way.
      # Job parity is asserted by TestCIWorkflow_BaselineJobInstallsTheSameToolsAsGate
      # so the two cannot silently diverge again.
      - name: Install Layer-0 analyzer binaries
        # TWO FACTS, and consolidating these pins later brings the break back:
        #
        #  1. It must be a real BINARY on PATH. provisionEngines resolves the
        #     executable BY NAME, so `go tool golangci-lint` does not satisfy it.
        #  2. It must be v2. The go-toolchain pack declares
        #     `golangci-lint run --output.sarif.path stdout --show-stats=false`,
        #     which is v2-only syntax — and go.mod's tool directive pins v1.64.8
        #     for unrelated reasons, so installing THAT breaks the lint dimension
        #     with an unknown-flag error.
        run: |
          curl -sSfL https://raw.githubusercontent.com/golangci/golangci-lint/HEAD/install.sh \
            | sh -s -- -b "$(go env GOPATH)/bin" v2.6.0
          # Declared by backstop-core-architecture as an assume-present Layer-0
          # analyzer; the pack owns the command and requires this pinned version.
          go install github.com/fe3dback/go-arch-lint@v1.16.0
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Install provisioned engine tools at their allowlist pins
        # These versions are the pins in pkg/pack/engine/allowlist.go. The dispatch
        # gate compares what it finds against those pins and refuses a mismatch
        # with an exit-2 config error, so nothing here floats.
        #
        # Nothing is installed for the SANDBOX, deliberately. The mechanism is
        # Landlock + seccomp: kernel APIs with no package to install. The
        # ruled-out alternative measured present-and-broken on this exact runner
        # image — see pkg/packval/testdata/ubuntu-runner-probe.txt. The sandbox's
        # real requirement is a kernel property, and it is asserted by
        # pkg/packval/sandbox_linux_exec_test.go, which fails loudly on a host
        # without Landlock and runs inside the gate below.
        run: |
          pipx install semgrep==1.156.0
          curl -sSfL "https://github.com/ast-grep/ast-grep/releases/download/0.43.0/app-x86_64-unknown-linux-gnu.zip" -o ast-grep.zip
          mkdir -p "$HOME/.local/bin"
          unzip -o -q ast-grep.zip -d "$HOME/.local/bin"
          chmod +x "$HOME/.local/bin/ast-grep"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Build backstop CLI
        run: go build -o ./backstop ./cmd/backstop

      - name: Install the pack fleet
        # The locked fleet is git-sourced (PLAN-ISSUE-020 TASK-003). VerifyLock
        # SKIPS local entries but HARD-FAILS git entries whose directories are
        # absent, and baseline generate has no install step of its own — so
        # without this the published artifact carries SIX missing_pack failures
        # instead of one, straight into the reference main's ratchet compares
        # against. This is the minimum change; ISSUE-086 owns the broader question
        # of what a pack-ful baseline should mean.
        run: ./backstop pack install

      - name: Generate baseline
        run: |
          # Full-scope baseline generation contract: equivalent to
          # `./backstop gate --all --json`. This remains separable from
          # publication and preserves latest successful main semantics for pull.
          # The --all here is the BASELINE's scope and is unrelated to the
          # blocking job above, which is diff-scoped with an explicit base.
          ./backstop baseline generate

      - name: Publish baseline
        uses: actions/upload-artifact@v4
        with:
          name: backstop-baseline-v1
          path: .backstop/baseline.json

      # Baseline pull selects the latest successful main run artifact.
