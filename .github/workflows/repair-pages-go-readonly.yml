name: Repair Pages Go module isolation

on:
  push:
    branches: [codex/pages-go-module-mode]

permissions:
  contents: write

jobs:
  repair:
    if: >-
      github.event.head_commit.message == 'chore: stage read-only Pages repair'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: codex/pages-go-module-mode
          fetch-depth: 0

      - name: Apply fail-closed module-mode contract
        run: |
          python3 - <<'PY'
          from pathlib import Path

          replacements = {
              ".github/workflows/pages.yml": [
                  ("GOFLAGS: -mod=mod", "GOFLAGS: -mod=readonly"),
              ],
              "scripts/sitecheck/pages.go": [
                  ("GOFLAGS: -mod=mod", "GOFLAGS: -mod=readonly"),
              ],
              "scripts/sitecheck/pages_test.go": [
                  ("GOFLAGS: -mod=mod", "GOFLAGS: -mod=readonly"),
              ],
              "specs/SPEC-075-static-public-site-design-system.spec.md": [
                  ("force Go module mode so Ruby's", "force read-only Go module mode so Ruby's"),
                  ("forces Go module mode across the build job", "forces read-only Go module mode across the build job"),
                  ("missing or changed Go module-mode isolation", "missing or changed read-only Go module-mode isolation"),
              ],
              "plans/PLAN-SPEC-075-static-public-site-design-system.plan.yml": [
                  ("explicit Go module mode isolating Ruby's", "explicit read-only Go module mode isolating Ruby's"),
                  ("with explicit module mode, and build main/manual from source", "with explicit read-only module mode, and build main/manual from source"),
              ],
          }

          for filename, edits in replacements.items():
              path = Path(filename)
              text = path.read_text()
              for old, new in edits:
                  count = text.count(old)
                  if count != 1:
                      raise SystemExit(f"{filename}: expected one occurrence of {old!r}, observed {count}")
                  text = text.replace(old, new, 1)
              path.write_text(text)
          PY
          gofmt -w scripts/sitecheck/pages.go scripts/sitecheck/pages_test.go
          rm .github/workflows/repair-pages-go-readonly.yml

      - name: Reproduce the Ruby vendor collision and prove the repair
        run: |
          test ! -e vendor
          mkdir -p vendor/bundle
          if env -u GOFLAGS go build -o /tmp/backstop-default ./cmd/backstop > /tmp/default-build.log 2>&1; then
            echo "default Go build unexpectedly accepted Ruby's vendor/bundle" >&2
            exit 1
          fi
          grep -F "inconsistent vendoring" /tmp/default-build.log
          GOFLAGS=-mod=readonly go build -o ./bin/backstop ./cmd/backstop
          rm -rf vendor

      - name: Verify governed contract and artifacts
        env:
          GOFLAGS: -mod=readonly
        run: |
          go test ./scripts/sitecheck/... -run 'TestSiteCheck_PagesWorkflow' -count=1
          ./bin/backstop artifact validate
          git diff --check
          test -z "$(git status --porcelain --untracked-files=all | grep -v '^ M \|^M  \|^ D \|^D  ' || true)"

      - name: Commit the verified repair
        run: |
          git config user.name "backstop-repair"
          git config user.email "actions@users.noreply.github.com"
          git add .github/workflows/pages.yml \
            scripts/sitecheck/pages.go \
            scripts/sitecheck/pages_test.go \
            specs/SPEC-075-static-public-site-design-system.spec.md \
            plans/PLAN-SPEC-075-static-public-site-design-system.plan.yml \
            .github/workflows/repair-pages-go-readonly.yml
          git commit -m "fix(Pages): enforce read-only Go module mode"
          git push origin HEAD:codex/pages-go-module-mode
