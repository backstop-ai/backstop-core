name: Website Scope Validate

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    if: github.head_ref == 'codex/website-expansion-scope'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Build current Backstop CLI
        run: go build -o /tmp/backstop ./cmd/backstop
      - name: Validate website scope artifacts
        run: |
          set -euo pipefail
          /tmp/backstop artifact validate bundles/BUNDLE-032-website-expansion.bundle.md
          /tmp/backstop artifact validate specs/SPEC-071-website-expansion.spec.md
          /tmp/backstop artifact validate plans/PLAN-SPEC-071-website-expansion.plan.yml
