name: Website Scope CLI Bootstrap

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build-cli:
    if: github.head_ref == 'codex/website-expansion-scope'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Build current Backstop CLI
        run: go build -o backstop ./cmd/backstop
      - name: Upload Backstop CLI
        uses: actions/upload-artifact@v4
        with:
          name: backstop-cli-linux-amd64
          path: backstop
          if-no-files-found: error
          retention-days: 1
