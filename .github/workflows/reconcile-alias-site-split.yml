name: Reconcile alias proof with site split

on:
  push:
    branches: [codex/split-site-verification-pages]
    paths: [.github/workflows/reconcile-alias-site-split.yml]

permissions:
  contents: write

jobs:
  reconcile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/split-site-verification-pages
          fetch-depth: 0
      - name: Preserve live alias proof while retaining split workflow contract
        run: |
          python3 - <<'PY'
          from pathlib import Path

          spec = Path('specs/SPEC-075-static-public-site-design-system.spec.md')
          text = spec.read_text()
          edits = [
            ('spec_version: 1.0.14', 'spec_version: 1.0.15'),
            ('the exact commit/run meta marker matching the standalone marker; five aliases redirect once;\n      downgrade, certificate/host drift, stale identity, 4xx/5xx, wrong content, or partial API-only,',
             'the exact commit/run meta marker matching the standalone marker; each of the five live static alias\n      bodies must reproduce its exact canonical link, immediate meta refresh, and ordinary fallback link\n      without client script;\n      downgrade, certificate/host drift, stale identity, 4xx/5xx, wrong content, or partial API-only,'),
            ('text: Downloaded or retained artifact tree digest, HTTPS standalone marker, route commit/run metadata, ten canonical routes, and five one-hop aliases agree without conflating archive and tree digests.\n    tests: [TestPagesDeployment_HTTPSMarkerAndRouteMatrixPasses]',
             'text: Downloaded or retained artifact tree digest, HTTPS standalone marker, route commit/run metadata, ten canonical routes, and the exact canonical-link/meta-refresh/fallback-link content of five live one-hop static aliases agree without conflating archive and tree digests.\n    tests: [TestPagesDeployment_HTTPSMarkerAndRouteMatrixPasses, TestPagesDeployment_LiveStaticAliasProofPinned]'),
            ('text: API-only, action-only, smoke-only, redirect-following, HTTP downgrade, certificate/host drift, stale marker, or route/alias/content error fails post-deploy proof.\n    tests: [TestPagesDeployment_RejectsPartialOrStaleProofMatrix]',
             'text: API-only, action-only, smoke-only, an impossible server-side redirect assumption, HTTP downgrade, certificate/host drift, stale marker, or route/alias/content error fails post-deploy proof.\n    tests: [TestPagesDeployment_RejectsPartialOrStaleProofMatrix, TestPagesDeployment_LiveStaticAliasProofPinned]'),
          ]
          for old, new in edits:
            if text.count(old) != 1:
              raise SystemExit(f'spec reconciliation mismatch: {old[:80]!r} count={text.count(old)}')
            text = text.replace(old, new, 1)
          spec.write_text(text)

          plan = Path('plans/PLAN-SPEC-075-static-public-site-design-system.plan.yml')
          text = plan.read_text()
          edits = [
            ('spec_version: "1.0.14"', 'spec_version: "1.0.15"'),
            ('prove five one-hop aliases without redirects. Reject partial channels, downgrade, host/\n          certificate drift, stale identity, content error, and archive/tree conflation.',
             'prove the exact canonical-link, immediate-meta-refresh, fallback-link, and no-script contract\n          in five live one-hop static alias bodies without assuming impossible HTTP redirects. Reject partial channels, downgrade, host/\n          certificate drift, stale identity, content error, and archive/tree conflation.'),
            ('test_names: [TestPagesDeployment_AuthoritativeAPIIdentityPasses, TestPagesDeployment_HTTPSMarkerAndRouteMatrixPasses, TestPagesDeployment_RejectsPartialOrStaleProofMatrix]',
             'test_names: [TestPagesDeployment_AuthoritativeAPIIdentityPasses, TestPagesDeployment_HTTPSMarkerAndRouteMatrixPasses, TestPagesDeployment_LiveStaticAliasProofPinned, TestPagesDeployment_RejectsPartialOrStaleProofMatrix]'),
          ]
          for old, new in edits:
            if text.count(old) != 1:
              raise SystemExit(f'plan reconciliation mismatch: {old[:80]!r} count={text.count(old)}')
            text = text.replace(old, new, 1)
          plan.write_text(text)

          tests = Path('scripts/sitecheck/pages_test.go')
          text = tests.read_text()
          anchor = '''func TestSiteCheck_SiteVerificationHasNoDeploymentAuthority(t *testing.T) {\n'''
          addition = '''func TestPagesDeployment_LiveStaticAliasProofPinned(t *testing.T) {\n\tscript := readRepositoryFile(t, "scripts/verify-pages-deployment.sh")\n\tfor _, needle := range []string{`href="https://backstop.sh`, `content="0; url=`, `contains a client-scripted redirect`} {\n\t\tif !strings.Contains(script, needle) {\n\t\t\tt.Fatalf("live serverless-alias proof %q missing", needle)\n\t\t}\n\t}\n\tfor _, forbidden := range []string{`30[1278]`, `^location:`} {\n\t\tif strings.Contains(script, forbidden) {\n\t\t\tt.Fatalf("impossible HTTP redirect proof %q remains", forbidden)\n\t\t}\n\t}\n}\n\n'''
          if 'func TestPagesDeployment_LiveStaticAliasProofPinned' not in text:
            if text.count(anchor) != 1:
              raise SystemExit('pages test insertion anchor mismatch')
            text = text.replace(anchor, addition + anchor, 1)
          tests.write_text(text)
          PY
          gofmt -w scripts/sitecheck/pages_test.go
          rm .github/workflows/reconcile-alias-site-split.yml
          git diff --check
      - name: Commit reconciled proof
        run: |
          git config user.name "backstop-rebase-reconciler"
          git config user.email "actions@users.noreply.github.com"
          git add specs/SPEC-075-static-public-site-design-system.spec.md \
            plans/PLAN-SPEC-075-static-public-site-design-system.plan.yml \
            scripts/sitecheck/pages_test.go \
            .github/workflows/reconcile-alias-site-split.yml
          git commit -m "spec(SPEC-075): preserve alias proof across site split"
          git push origin HEAD:codex/split-site-verification-pages
