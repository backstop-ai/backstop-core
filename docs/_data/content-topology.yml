adoption_instructions:
  - instruction_id: ADOPT-INSTALL
    owner_route: "/adopt/"
    owner_anchor: install
    command_text: "GOBIN=./.backstop-bin go install github.com/backstop-ai/backstop-core/cmd/backstop@v0.2.0"
    command_sha256: sha256:54523aa4d4d52abcfa3b58816f5cae70ddb58773f9d90a782ebfe3afd4420ced
    executable: go
    argv: [install, "github.com/backstop-ai/backstop-core/cmd/backstop@v0.2.0"]
    environment: {GOBIN: "<disposable-root>/.backstop-bin"}
    working_directory: "<disposable-root>"
    provenance: {kind: go-module-version, coordinate: "github.com/backstop-ai/backstop-core/cmd/backstop@v0.2.0"}
    expected_exit_code: 0
    expected_outputs: ["executable-file:<disposable-root>/.backstop-bin/backstop"]
  - instruction_id: ADOPT-CONFIGURE
    owner_route: "/adopt/"
    owner_anchor: configure
    command_text: "backstop init"
    command_sha256: sha256:0ebe03e241fa9eddc23c902c17397044d2bc5d38f980405b8c66c024e9d74198
    executable: "<disposable-root>/.backstop-bin/backstop"
    argv: [init]
    environment: {}
    working_directory: "<disposable-root>"
    provenance: {kind: instruction-output, instruction_id: ADOPT-INSTALL, path: "<disposable-root>/.backstop-bin/backstop"}
    expected_exit_code: 0
    expected_outputs: ["file:<disposable-root>/backstop.yml"]
  - instruction_id: ADOPT-ENFORCE
    owner_route: "/adopt/"
    owner_anchor: verify-enforcement
    command_text: "backstop gate"
    command_sha256: sha256:85ffedc97983c354f036e2c3a5b71e4e0df3c850c7e2f0511ca3cc05ff2976a3
    executable: "<disposable-root>/.backstop-bin/backstop"
    argv: [gate]
    environment: {}
    working_directory: "<disposable-root>"
    provenance: {kind: instruction-output, instruction_id: ADOPT-INSTALL, path: "<disposable-root>/.backstop-bin/backstop"}
    expected_exit_code: 0
    expected_outputs: ["verdict:exit-0"]
