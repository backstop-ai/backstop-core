sources:
  - source: docs/index.html
    useful_units:
      - {unit_id: HOME-001, source_locator: "html:.hero", topic: "Landing failure/category framing", summary: "Frames configuration drift as the public failure class.", disposition: rewrite, target_routes: ["/"], rationale: "Discovery owns the initial problem statement."}
      - {unit_id: HOME-002, source_locator: "html:#system through adjacent .system-section blocks", topic: "Define / enforce / drift model", summary: "Explains the define, enforce, and drift loop.", disposition: decompose, target_routes: ["/", "/model/"], rationale: "Discovery needs a summary while the model owns the mechanism."}
      - {unit_id: HOME-003, source_locator: "html:.composition", topic: "Composable adoption modes", summary: "Describes incremental adoption choices.", disposition: decompose, target_routes: ["/evaluate/", "/use-cases/"], rationale: "Fit and problem-oriented paths are separate visitor decisions."}
      - {unit_id: HOME-004, source_locator: "html:.cta", topic: "Adoption call to action", summary: "Routes an interested visitor into setup.", disposition: rewrite, target_routes: ["/adopt/"], rationale: "The adoption page owns the executable sequence."}
  - source: docs/getting-started.md
    useful_units:
      - {unit_id: GET-001, source_locator: "#before-you-start", topic: "Before you start", summary: "Lists setup prerequisites.", disposition: merge, target_routes: ["/adopt/"], rationale: "Prerequisites belong beside installation."}
      - {unit_id: GET-002, source_locator: "#a-project-to-point-it-at through #one-command", topic: "Project, install, configure, first run", summary: "Provides the initial setup sequence.", disposition: merge, target_routes: ["/adopt/"], rationale: "One adoption owner prevents command drift."}
      - {unit_id: GET-003, source_locator: "#see-what-it-caught through #fix-it-watch-it-go-green", topic: "Failure-to-green walkthrough", summary: "Shows a failing gate repaired to green.", disposition: decompose, target_routes: ["/adopt/", "/use-cases/"], rationale: "Procedure and scenario selection need different summaries."}
      - {unit_id: GET-004, source_locator: "#when-something-looks-wrong", topic: "Troubleshooting", summary: "Explains common setup failures.", disposition: merge, target_routes: ["/reference/"], rationale: "Exact diagnosis is reference material."}
      - {unit_id: GET-005, source_locator: "#what-backstop-did-not-do", topic: "What Backstop did not do", summary: "Names boundaries of the first run.", disposition: decompose, target_routes: ["/evaluate/", "/status/"], rationale: "Evaluation summarizes boundaries and status owns them."}
  - source: docs/concepts.md
    useful_units:
      - {unit_id: CON-001, source_locator: "#the-premise", topic: "Premise and trust thesis", summary: "Defines deterministic enforcement of declared intent.", disposition: decompose, target_routes: ["/evaluate/", "/model/"], rationale: "Evaluation introduces the thesis and model owns it."}
      - {unit_id: CON-002, source_locator: "#packs-backstop-ships-zero-checks", topic: "Packs and zero bundled checks", summary: "Explains standards-pack composition.", disposition: decompose, target_routes: ["/model/", "/packs/"], rationale: "Model defines packs while ecosystem guides selection."}
      - {unit_id: CON-003, source_locator: "#thin-executor-why-its-not-a-linter", topic: "Thin-executor distinction", summary: "Separates Core execution from pack policy.", disposition: merge, target_routes: ["/model/"], rationale: "This is a canonical ownership boundary."}
      - {unit_id: CON-004, source_locator: "#the-gate", topic: "Gate, dimensions, severity, policy", summary: "Describes gate policy composition.", disposition: decompose, target_routes: ["/model/", "/reference/"], rationale: "Concept and exact interface need separate owners."}
      - {unit_id: CON-005, source_locator: "#baseline-and-the-ratchet through #waivers", topic: "Baselines and waivers", summary: "Describes controlled exceptions and ratchets.", disposition: merge, target_routes: ["/model/"], rationale: "The canonical lifecycle model owns these concepts."}
      - {unit_id: CON-006, source_locator: "#artifacts-briefly through #putting-it-together", topic: "Artifacts and system composition", summary: "Explains intent artifacts and their relations.", disposition: merge, target_routes: ["/model/"], rationale: "The product model is the sole conceptual owner."}
  - source: docs/artifact-workflow.md
    useful_units:
