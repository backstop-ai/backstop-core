      - {unit_id: PACK-005, source_locator: "#validate-pack-check through #iterate-against-a-real-project", topic: "Check, test, findings, iteration", summary: "Describes the pack feedback loop.", disposition: merge, target_routes: ["/extend/"], rationale: "Extension owns the author workflow."}
      - {unit_id: PACK-006, source_locator: "#publishing through #beyond-a-first-pack", topic: "Publishing and ecosystem continuation", summary: "Explains release and contribution paths.", disposition: decompose, target_routes: ["/extend/", "/contributing/"], rationale: "Publishing and participation have distinct owners."}
