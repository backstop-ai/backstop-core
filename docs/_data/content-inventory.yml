      - {unit_id: ART-003, source_locator: "#lifecycle", topic: "Lifecycle states", summary: "Lists artifact state transitions.", disposition: decompose, target_routes: ["/model/", "/reference/"], rationale: "Meaning belongs in model and exact states in reference."}
      - {unit_id: ART-004, source_locator: "#closing-an-issue-delivered_by-vs-resolved-by", topic: "Closure and traceability", summary: "Connects terminal outcomes to evidence.", disposition: decompose, target_routes: ["/model/", "/reference/"], rationale: "Model explains provenance while reference enumerates fields."}
