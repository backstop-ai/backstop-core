      - {unit_id: PACK-003, source_locator: "#rules-claims-and-fixtures through #which-tools-you-can-name", topic: "Rules, claims, fixtures, and tools", summary: "Describes enforceable pack contents.", disposition: decompose, target_routes: ["/extend/", "/reference/"], rationale: "Workflow and exact shapes serve different jobs."}
