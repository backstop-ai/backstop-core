    claim_type: mechanism
    owner: {route: "/model/", anchor: operating-model}
    mechanism_summary: "Versioned bundle, issue, spec, and plan schemas encode work tracks, lifecycle state, and closure provenance."
    guarantee_boundary: "The model governs recorded repository work, not external scheduling."
    known_limitations: "Terminal vocabularies vary by artifact kind."
    adoption_implications: "Choose terminal state and closure lineage according to the governing schema."
    direction: "Keep lifecycle transitions and closure evidence explicit."
    evidence_refs:
