    guarantee_boundary: "The CLI returns the verdict; the caller must honor its exit status."
    known_limitations: "External runtimes can ignore the process result."
    adoption_implications: "Make the gate required locally or in CI."
    direction: "Keep execution deterministic and pack-owned."
