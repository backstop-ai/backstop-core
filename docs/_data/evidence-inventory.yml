    mechanism_summary: "The CLI emits an inspectable result at a defined ownership seam."
    guarantee_boundary: "Continuation is guidance only."
    known_limitations: "Organizational enforcement cannot be supplied by a repository tool."
    adoption_implications: "Assign an explicit owner beyond the verdict."
    direction: "Keep seams visible."
