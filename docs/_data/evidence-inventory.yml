    guarantee_boundary: "The caller remains responsible for honoring nonzero status."
    known_limitations: "Repository-wide scope can expose unrelated existing failures."
    adoption_implications: "Choose scope deliberately and preserve the exit code."
    direction: "Keep scope and verdict behavior stable."
