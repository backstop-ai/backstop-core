<header class="site-header">

      <input id="site-nav-toggle" class="site-nav-input" type="checkbox" tabindex="-1">

      <div class="navigation-groups">
        <nav aria-label="Primary">
          <a href="/evaluate/"{% if page.permalink == '/evaluate/' %} aria-current="page"{% endif %}>Evaluate</a>

          <a href="/adopt/"{% if page.permalink == '/adopt/' %} aria-current="page"{% endif %}>Adopt</a>
          <a href="/pack/"{% if page.permalink == '/pack/' or page.permalink == '/pack/guide/' or page.permalink == '/pack/examples/' %} aria-current="page"{% endif %}>Pack</a>
        </nav>
        <nav aria-label="Utility">
          <a href="/contributing/"{% if page.permalink == '/contributing/' %} aria-current="page"{% endif %}>Contributing</a>
        </nav>
      </div>
    </div>
  </div>
</header>
