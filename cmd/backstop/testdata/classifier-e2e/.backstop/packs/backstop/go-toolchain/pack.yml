# E2E fixture toolchain pack. Carries the pack-declared classification block (the
# unit under test) plus a DECLARED coverage engine so the coverage capability is
# present by declaration (ISSUE-063: capability keys on a declared gate_type engine,
# not the pack name/suffix). The engine has NO rule bound to it, so dispatchPackCoverage
# never runs it — the e2e stays hermetic (no real `go test`). The merged classifier's
# source globs (**/*.go) classify pkg/x/foo.go as measurable; with no coverage record
# the no-record guard reds it (CLM-021).
name: backstop/go-toolchain
version: 1.0.0
language: go
archetype: code
description: >
  E2E classifier fixture: go-toolchain classification block + a declared (unbound)
  coverage engine.
engines:
  go-coverage:
    input_mode: none
    scope_kind: project-wide
    category: mechanism
    gate_type: coverage
classification:
  source:
    - "**/*.go"
  test:
    - "**/*_test.go"
    - "**/testdata/**"
content:
  sdk:
    module: example/go-toolchain-fixture
    version: 1.0.0
    provides:
      - classification
