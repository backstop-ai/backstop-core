name: backstop/rungroup-gate
version: 1.0.0
language: typescript
archetype: enforcement
description: ISSUE-068 cross-step shared run-key fixture — one suite run fanned to test + coverage
engines:
  suite-test:
    command: rungroup-suite
    input_mode: none
    scope_kind: project-wide
    category: mechanism
    gate_type: test
    convert: scripts/test-convert.sh
    run_group: suite
  suite-coverage:
    command: rungroup-suite
    input_mode: none
    scope_kind: project-wide
    category: mechanism
    gate_type: coverage
    convert: scripts/coverage-convert.sh
    run_group: suite
content:
  ruleset:
    version: 1.0.0
    rules:
      - id: suite-test-rule
        engine: suite-test
        risk_class: correctness
      - id: suite-coverage-rule
        engine: suite-coverage
        risk_class: correctness
