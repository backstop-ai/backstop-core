name: backstop/typescript-toolchain
version: 1.0.0
language: typescript
archetype: enforcement
description: >
  FIXTURE typescript-toolchain MECHANISM pack (SPEC-040 REQ-004 worked example,
  the NON-Go bridge proof). Mirrors the go-toolchain pack shape for a second
  language: it routes the TS lint/build/test passes through the engine-dispatch
  substrate and normalizes their output to SARIF via pack-relative convert
  scripts. Mechanism only — no opinionated coding-standards rules. This fixture
  exists to exercise the LANGUAGE-AGNOSTIC resolve-from-disk path (the on-disk
  name is derived from the declared language, not hardcoded to go-toolchain); a
  real authored typescript-toolchain pack is an ISSUE-027 follow-up. The engines
  are assume-present (no provision block) like the go-toolchain native engines,
  so they ride provisionEngines' on-PATH fail-loud, not the allowlist+lock pin.
engines:
  ts-lint:
    command: eslint --format json
    input_mode: none
    convert: scripts/lint-to-sarif.sh
    scope_kind: project-wide
    project_target: "."
    category: mechanism
    gate_type: lint
    crash_guard: true
  ts-build:
    command: tsc --noEmit
    input_mode: none
    convert: scripts/build-to-sarif.sh
    scope_kind: project-wide
    project_target: "."
    category: mechanism
    gate_type: build
    crash_guard: true
  ts-test:
    command: npm test
    input_mode: none
    convert: scripts/test-to-sarif.sh
    scope_kind: project-wide
    project_target: "."
    category: mechanism
    gate_type: test
    crash_guard: true
content:
  ruleset:
    version: 1.0.0
    rules:
      - id: ts-lint
        engine: ts-lint
        risk_class: correctness
        category: toolchain
        justification: Native TS lint pass via eslint, normalized to SARIF.
      - id: ts-build
        engine: ts-build
        risk_class: correctness
        category: toolchain
        justification: Native TS build pass via tsc, normalized to SARIF.
      - id: ts-test
        engine: ts-test
        risk_class: correctness
        category: toolchain
        justification: Native TS test pass, normalized to SARIF.
