# PACK-AUTHORED ast-grep project config (ISSUE-028 / CLM-003).
# Backstop never generates or parses this file; the pack author writes it
# alongside the ast-grep rules. The dispatch resolves the rule's rule_path to
# THIS file and emits `ast-grep scan --config <this file> --json`, running every
# rule under ruleDirs in one invocation. ruleDirs is resolved relative to this
# file's directory (ast-grep/); proof-rule.yml is the rule body it loads.
ruleDirs:
  - .
