name: backstop/go-toolchain
version: 1.1.0
language: go
archetype: enforcement
description: >
  Reusable Go native-toolchain MECHANISM pack (SPEC-034 REQ-007): runs the Go
  build/test/lint passes through the engine-dispatch substrate and normalizes
  their output to SARIF. Mechanism only — it carries NO coding-standards rules
  (those live in the separate, opinionated backstop-go-pack). Convention:
  one <lang>-toolchain pack bundles a language's whole native toolchain.
classification:
  # File classification (SPEC-043 REQ-001): the pack-declared source/test globs the
  # language-neutral coverage consumer reads INSTEAD of a baked `.go` literal. Once
  # coverageMeasurablePath's baked literal is deleted, a `.go` file is measurable
  # ONLY because this block declares it — the dogfood lockstep that keeps
  # backstop-core measuring its own coverage. The fixture/testdata convention is
  # folded into the test list (no separate baked testdata dimension).
  source:
    - "**/*.go"
  test:
    - "**/*_test.go"
    - "**/testdata/**"
# Test-name extraction DATA (SPEC-045 REQ-002): the pack-declared regex whose
# capture group 1 is the Go test name. The language-neutral gate deletes its baked
# `funcPattern`; a consumer discovers `func Test...` tests ONLY because this block
# declares the pattern. The gate merges this across declared packs into a
# TestNameMatcher; the binary holds no baked Go test-name literal.
test_name_patterns:
  - "^\\s*func\\s+(Test\\w+)\\s*\\("
engines:
  # Coverage: the FIRST coverage PRODUCER (SPEC-042 REQ-007). Declared via the
  # pack's engines: block (the SPEC-035 declared substrate) — NOT a baked
  # DefaultRegistry binding. gate_type coverage routes its convert output to the
  # NEW coverage-records channel (check.ParsePackCoverage), DISTINCT from the SARIF
  # findings channel. The command runs `go test -coverprofile`; the pack-relative
  # convert (scripts/coverage-to-records.sh) turns the Go coverage profile into
  # per-file coverage-records JSON stamped metric "statement" (Go's -coverprofile
  # granularity). All Go-toolchain coverage knowledge lives in this pack DATA; the
  # dispatch stays tool/language-blind.
  go-coverage:
    command: go test -coverprofile=cover.out ./...
    # The UN-SANDBOXED producer (ISSUE-045 option (ii)): the dispatch runs THIS
    # packRoot-resolved script via the runner IN PLACE of the plain command, so its
    # `go test`/`go list` run with full toolchain access and fold the module path +
    # gofile list into cover.out for the sandboxed parse-only convert.
    producer: scripts/coverage-produce.sh
    # The Go coverage profile lands in the FILE cover.out (the -coverprofile
    # target), while go test's stdout is only the test SUMMARY (and failure
    # lines). Declare that file as the engine's real-output artifact so the
    # dispatch feeds the PROFILE — not the summary stdout — into the convert.
    stdout_artifact: cover.out
    input_mode: none
    convert: scripts/coverage-to-records.sh
    scope_kind: project-wide
    project_target: "./..."
    category: mechanism
    gate_type: coverage
  # Build: findings engine (SPEC-034 / ISSUE-027). `go build ./...` stdout is
  # normalized to SARIF by the pack-relative convert script (parseGoBuildErrors
  # relocated OUTSIDE the binary, DD-2). CrashGuard distinguishes a compiler crash
  # from a finding-free green; ExemptFromScopeFilter stamps build violations
  # project-wide so an unchanged-file build break still REDs a diff-scoped gate
  # (SPEC-041 CLM-011). Declared HERE, not in the deleted baked DefaultRegistry.
  go-build:
    command: go build
    input_mode: none
    scope_kind: project-wide
    project_target: "./..."
    convert: scripts/build-to-sarif.sh
    crash_guard: true
    category: mechanism
    gate_type: build
    exempt_from_scope_filter: true
  # Test: findings engine. `go test ./...` stdout normalized to SARIF by the pack
  # convert script (parseGoTestFailures relocated, DD-2). PackageScoped runs it per
  # Go package. Declared as pack DATA, not a baked binding (ISSUE-027).
  go-test:
    command: go test
    input_mode: none
    scope_kind: project-wide
    project_target: "./..."
    convert: scripts/test-to-sarif.sh
    crash_guard: true
    category: mechanism
    gate_type: test
    package_scoped: true
  # Lint: golangci-lint v2 as a config-file engine on native SARIF (no converter;
  # v2 emits SARIF on stdout). The pack-owned .golangci.yml is the optional config.
  # strict_sarif keys the strict-SARIF shape guard off THIS flag, not a name sniff.
  # Declared as pack DATA, not a baked binding (ISSUE-027).
  golangci:
    command: golangci-lint run --output.sarif.path stdout --show-stats=false
    input_mode: config-file
    input_flag: "--config"
    scope_kind: project-wide
    project_target: "./..."
    category: mechanism
    strict_sarif: true
    gate_type: lint
content:
  ruleset:
    version: 1.0.0
    rules:
      # Lint: golangci-lint v2 as a config-file engine. Native v2 SARIF on
      # stdout (no converter); the pack-owned .golangci.yml is the config
      # (OQ-1 resolved: pack-defined). rule_path binds the pack config.
      - id: go-lint
        engine: golangci
        rule_path: .golangci.yml
        risk_class: correctness
        category: toolchain
        justification: Native Go lint pass via golangci-lint v2 SARIF.
      # Build: findings engine; `go build ./...` stdout normalized to SARIF by
      # the pack convert script (parseGoBuildErrors relocated, DD-2).
      - id: go-build
        engine: go-build
        risk_class: correctness
        category: toolchain
        justification: Native Go build pass; compiler errors normalized to SARIF.
      # Test: findings engine; `go test ./...` stdout normalized to SARIF by the
      # pack convert script (parseGoTestFailures relocated, DD-2).
      - id: go-test
        engine: go-test
        risk_class: correctness
        category: toolchain
        justification: Native Go test pass; test failures normalized to SARIF.
      # Coverage: the coverage PRODUCER rule binding the go-coverage engine
      # (SPEC-042 REQ-007/CLM-020). Routes to the coverage-records channel.
      - id: go-coverage
        engine: go-coverage
        risk_class: correctness
        category: toolchain
        justification: Native Go coverage pass; profile normalized to per-file coverage records.
