name: acme/valid-pack
version: "1.0.0"
archetype: rule-pack
description: A valid test pack for distribution tests
rules:
  - id: RULE-001
    severity: error
    risk_class: high
    description: Test rule one
    pattern: "test-pattern-1"
  - id: RULE-002
    severity: warning
    risk_class: medium
