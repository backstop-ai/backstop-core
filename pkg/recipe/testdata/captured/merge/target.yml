# GENERATED by src/ingest/ci-template.ts (buildIngestWorkflow). Do not edit by hand —
# the freshness test pins this file to the generator output.
name: backstop-ingest

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  id-token: write
  contents: read

jobs:
  gate-and-ingest:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install pinned backstop binary
        run: |
          curl -sSfL "https://github.com/bclabs/backstop/releases/download/v0.64.0/backstop-linux-x64" -o /usr/local/bin/backstop
          chmod +x /usr/local/bin/backstop

      - name: Run backstop gate
        run: backstop gate --all --json > gate-report.json

      - name: Produce neutral test report via the vitest adapter
        run: |
          vitest run --reporter=json --outputFile=vitest.json --coverage
          npx tsx scripts/adapters/vitest-adapter.ts < vitest.json > neutral-report.json

      - name: Collect coverage report
        run: cp coverage/coverage-summary.json coverage-report.json

      - name: Assemble the cohort-stamped envelope and POST it over OIDC
        env:
          PORTAL_INGEST_URL: ${{ secrets.PORTAL_INGEST_URL }}
          PORTAL_DEFAULT_BRANCH: ${{ vars.PORTAL_DEFAULT_BRANCH }}
          PORTAL_SCHEMA_COHORT: ${{ vars.PORTAL_SCHEMA_COHORT }}
        run: |
          # Mint the GitHub Actions OIDC token that authenticates the POST (runner-provided
          # request token; no secret literal).
          OIDC_TOKEN=$(curl -sSf -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=${{ vars.PORTAL_OIDC_AUDIENCE }}" | jq -r '.value')
          # Read the three report files, assemble + cohort-stamp the envelope (buildReportEnvelope),
          # and POST it to the ONE configured prod ingest endpoint. The cohort-stamping IP lives in
          # the tested in-repo script, never forked into inline bash. Run via tsx (a devDependency)
          # so the runner resolves the TypeScript entrypoint AND its TS-style ".js" import specifiers;
          # raw node cannot resolve those to their ".ts" sources in this noEmit repo (no build step).
          npx tsx scripts/post-ingest-envelope.ts --oidc "$OIDC_TOKEN"

  browser-e2e:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install the Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Start the local Supabase stack
        run: supabase start

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps

      - name: Typecheck the browser-e2e tier
        run: pnpm typecheck:e2e

      - name: Run the gated browser-e2e tier
        run: pnpm test:e2e

  seam:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run the gated real-Postgres seam tier
        run: pnpm test:seam
