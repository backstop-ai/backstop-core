name: acme/patternarg
version: 1.0.0
language: go
archetype: enforcement
description: >
  THE HONEST PATTERN-ARG PACK. Its rule declares NO rule source file at all — only an
  inline pattern:, the declaration style a pattern-arg engine consumes as a command
  ARGUMENT rather than a file on disk. packval's authoring-time Rule model never
  carried that key, so it was dropped at unmarshal and phase 3's dispatch guard —
  which asked only for a rule SOURCE PATH — was permanently false (ISSUE-142). Its
  fixtures carry BUNDLE-005 REQ-011 polarity: the positive fixture does NOT violate
  the rule, the negative one DOES. Verified by running the engine directly:
  `semgrep --sarif --lang go -e 'forbiddenCall(...)'` yields 1 result on
  fixtures/invalid/violating.go and 0 on fixtures/valid/clean.go.
engines:
  semgrep-pattern:
    command: semgrep --sarif --lang go
    input_mode: pattern-arg
    input_flag: -e
    scope_kind: file-args
    category: opinion
    gate_type: lint
content:
  ruleset:
    rules:
      - id: no-forbidden-call
        engine: semgrep-pattern
        risk_class: correctness
        pattern: "forbiddenCall(...)"
        claims:
          - id: C-001
            fixtures:
              positive:
                - fixtures/valid/clean.go
              negative:
                - fixtures/invalid/violating.go
