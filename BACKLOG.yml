# Backstop Project Backlog
# Position = priority. First = highest. Reorder to reprioritize.
# See artifacts/directive/v1/backlog-schema.json for format.

# Reordered 2026-07-26 per founder direction: the three launch blockers
# (recipes / remote pack consumption / Linux+CI viability) take positions
# 1-3, ahead of everything else. Order among the three is "finish what's
# already in flight" — argue with it if that's wrong. DIR-003 (Baseline)
# moves to position 4, behind the pack work but not behind everything, per
# the founder's own words ("it's definitely behind all of the pack issues
# we're working through") — an earlier pass over-applied this to dead
# last and was corrected back to just behind the three blockers. DIR-002
# (backstop init) is explicitly tiered down out of the top-3 but otherwise
# kept near its old neighbors. Everything else preserves its prior relative
# order. See DIR-026 Notes for a caveat on the recipes/DIR-019 progress
# claim underlying this ordering.
#
# UPDATED 2026-07-27 (founder-ratified): the "positions 1-3" claim above is
# now historical, not current, and stale on two counts. DIR-027 (Pack Fleet
# Publication & Migration) has since taken position 3, pushing Linux/CI
# viability (DIR-024) to position 4. Separately, the founder tiered a
# fourth launch blocker on 2026-07-27 — CI-driven releases (DIR-001) — and
# ratified moving it to position 5 (after DIR-024, ahead of
# DIR-003/DIR-002), reflected in the list below. The current four-blocker
# set is: recipes (DIR-019), remote pack consumption (DIR-026), Linux+CI
# viability (DIR-024), and CI-driven releases (DIR-001) — see those
# directives' Description/Notes for detail.

