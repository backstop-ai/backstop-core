rules:
  - id: go.security.no-hardcoded-credentials
    patterns:
      - pattern-either:
          - pattern: $SECRETVAR = "..."
          - pattern: $SECRETVAR := "..."
      - metavariable-regex:
          metavariable: $SECRETVAR
          regex: (?i).*(password|passwd|pwd|token|secret|apikey|api_key|key).*
    message: "Hardcoded credentials detected. Load secrets from secure configuration."
    severity: ERROR
    languages: [go]
    metadata:
      backstop:
        category: security
        rule_id: GO-060
        compliance_tier: baseline
        rationale: "Hardcoded credentials are high-risk secret exposure."
        references:
          - CWE-798
          - OWASP A07

  - id: go.security.no-weak-password-hashing
    pattern-either:
      - pattern: md5.$FUNC(...)
      - pattern: sha1.$FUNC(...)
    message: "Weak hash detected for password/security contexts. Use bcrypt/argon2."
    severity: ERROR
    languages: [go]
    metadata:
      backstop:
        category: security
        rule_id: GO-061
        compliance_tier: baseline
        rationale: "MD5/SHA1 are cryptographically broken for password hashing."
        references:
          - CWE-327
          - OWASP A02

  - id: go.security.no-sql-concatenation
    pattern-regex: (?i)"\s*(select|insert|update|delete)[^"\n]*"\s*\+\s*[A-Za-z_][A-Za-z0-9_]*
    message: "SQL string concatenation detected. Use parameterized queries."
    severity: ERROR
    languages: [go]
    metadata:
      backstop:
        category: security
        rule_id: GO-062
        compliance_tier: baseline
        rationale: "String concatenation in SQL increases SQL injection risk."
        references:
          - CWE-89
          - OWASP A03

  - id: go.security.no-sensitive-data-in-logs
    patterns:
      - pattern-either:
          - pattern: log.$METHOD(..., $SENSITIVE, ...)
          - pattern: fmt.Printf(..., $SENSITIVE, ...)
      - metavariable-regex:
          metavariable: $SENSITIVE
          regex: (?i).*(password|passwd|pwd|token|secret|apikey|api_key|key).*
    message: "Sensitive data in logs detected. Redact secrets before logging."
    severity: WARNING
    languages: [go]
    metadata:
      backstop:
        category: security
        rule_id: GO-063
        compliance_tier: standard
        rationale: "Logs are frequently retained and exported; secrets must be excluded."
        references:
          - CWE-532
          - OWASP A09
