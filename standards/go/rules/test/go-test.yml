rules:
  - id: go.test.no-time-sleep-in-tests
    pattern: |
      time.Sleep(...)
    message: "Do not use time.Sleep in tests. Use synchronization primitives."
    severity: ERROR
    languages: [go]
    paths:
      include:
        - "*_test.go"
    metadata:
      backstop:
        category: testing
        rule_id: GO-032
        compliance_tier: baseline
        rationale: "Sleep-based tests are flaky and non-deterministic."
