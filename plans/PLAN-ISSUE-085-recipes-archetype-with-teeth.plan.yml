            ./bin/backstop artifact validate --plan PLAN-ISSUE-085
  Every test run is `-race -count=1`. Report TRUE exit codes; never mask a
  non-zero exit behind a pipe.

  ── REQUIREMENTS / CLAIMS (plan-local, derived from the issue's Decision) ──
    REQ-001: A recipes-primary pack has a valid archetype end to end.
      CLM-001  packval phase1 accepts `archetype: recipes`.
      CLM-002  packval's PackManifest parses the top-level `recipes:` index
               (id -> pack-relative dir); Content is unchanged and phase1's
               content-required rule is untouched.
      CLM-003  phase4's recipes branch requires NO ruleset and imposes NO
               pairs_with obligation — scaffolds + recipes with no ruleset
               passes, with no decoy rule, engine binding or pairs_with wiring.
      CLM-004  the field-guide pack, UNPADDED, also LOADS through
               pack.ParseManifestFile — the gate-time seam (pack_gate.go:168)
               that `pack add` never touches. Not "loads if padded": the pack
               that installs is the pack that must load.
      CLM-015  under `archetype: recipes` pkg/pack's scaffold requirements
               (tier, test_command, use_when, assumes, pairs_with) do not apply,
               while a DECLARED tier is still validated and every non-recipes
               archetype keeps all five requirements.
    REQ-002: The teeth — recipes carry their own drift story.
      CLM-005  a `scaffolding`-kind recipe with no enforcement.rules FAILS
               phase4, naming the recipe id.
      CLM-006  an `implementing`-kind recipe with no enforcement.rules FAILS
               phase4, naming the recipe id.
      CLM-007  a `templating`-kind recipe is EXEMPT, and declaring
               enforcement.rules on one anyway is not an error.
      CLM-008  `enforcement:` present with an EMPTY `rules:` list counts as
               absent and fails.
      CLM-009  a `recipes` pack declaring no recipes at all FAILS — the
               archetype is not a rule-less escape hatch.
      CLM-010  a declared recipe whose recipe.yml is missing or unparseable
               FAILS LOUD naming the id — never silently exempt from CLM-005/6.
    REQ-003: Proven live through the shipped CLI, both directions.
      CLM-011  the field-guide-shaped pack passes the real `backstop pack check`
               AND installs through the real `backstop pack add` (which runs
               check AND test unconditionally since SPEC-055 REQ-008).
      CLM-012  the same pack with one non-templating recipe stripped of
               enforcement.rules FAILS `pack check` with a non-zero exit and a
               diagnostic naming the offending recipe.
    REQ-004: Nothing else moves.
      CLM-013  `code` and `enforcement` verdicts are unchanged and an unknown
               archetype is still rejected — the enum grew by exactly one.
      CLM-014  a recipes-ONLY pack (no scaffolds/rules/sdk) still fails phase1
