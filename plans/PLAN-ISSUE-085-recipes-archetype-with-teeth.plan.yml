      - id: TASK-004
        type: test
        title: "Failing CLI e2e: the field-guide pack passes `pack check` and installs via `pack add`; the toothless one fails `pack check` non-zero"
        description: |
          The unit tests drive RunArchetype directly. Only the shipped CLI proves
          the issue's actual complaint — that the pack is UNINSTALLABLE — because
          `pack add` runs the packval pipeline in BOTH modes unconditionally
          since SPEC-055 REQ-008 (pkg/pack/distribution/command.go:154,157 via
