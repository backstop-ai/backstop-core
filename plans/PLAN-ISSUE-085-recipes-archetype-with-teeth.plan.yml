              run the real command over TASK-001's committed GREEN fixture:
              executeCommand(NewRootCommand(), "pack", "check", "--format",
              "json", filepath.Join("testdata", "recipes-archetype-pack")).
              Assert: no error returned (exit 0) and the rendered result reports
