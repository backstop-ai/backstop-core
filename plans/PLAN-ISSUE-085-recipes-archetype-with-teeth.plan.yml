          - TASK-004

      - id: TASK-006
        type: implementation
        title: "pkg/pack — admit `recipes` at the load seam: the archetype enum AND archetype-conditional scaffold requirements"
        description: |
          Make TASK-003's tests pass. TWO production edits in pkg/pack/manifest.go
          plus one mechanical test-call-site update.

          Why this file at all, since packval is where the archetype model lives:
          cmd/backstop/pack_gate.go:168 parses EVERY declared pack through
          pack.ParseManifestFile on EVERY gate run and returns `parsing %s: %w`
          on failure, aborting the run. Nothing in pkg/pack/distribution calls
          ParseManifestFile, so `pack add` never reaches these checks. Skip this
          task and a recipes pack installs cleanly and then makes `backstop gate`
          unrunnable for the whole project — a silent trap strictly worse than
          today's honest install-time rejection.

          1. manifest.go:482 `validateArchetype` accepts "recipes" alongside
             "enforcement" and "code", and its error message names all three.

          2. manifest.go:642 `validateScaffold` becomes archetype-aware:

               func validateScaffold(s Scaffold, archetype string) error

             and the single production call site in the scaffold loop
             (manifest.go:355) passes `manifest.Archetype`.

             Under `archetype: recipes`, these five REQUIREMENTS do not apply:
             a valid `tier`, `test_command`, `use_when`, `assumes`,
             `pairs_with`. Under every other archetype they apply exactly as
             today — do not restructure, reorder or reword the existing checks.

             The relaxation drops REQUIREMENTS, never VALIDATION. Under
             `recipes` an EMPTY tier is fine but a DECLARED tier must still be
             complete|skeleton (call validateScaffoldTier only when s.Tier != ""),
             and the sample_config string check still runs for every archetype.
             A blanket early-return for recipes would pass TASK-003's first case
             and fail its tier-bogus and sample_config cases — write the branch,
             not the shortcut.

             Rationale to put in the doc comment, so this is not "harmonized"
             back later: under a recipes pack there is no ruleset for a scaffold
             to pair with, and the scaffold is a recipe's payload rather than a
             rule's paired fixture — its authoring contract is the recipe's, and
             the recipe's own contract is enforced at the recipe grain by
             packval phase4 (enforcement.rules on every non-templating recipe).
             Mirror the branching shape phase4 already uses.

          3. Mechanically add the archetype argument at the EIGHT existing
             validateScaffold call sites in pkg/pack/manifest_test.go — lines
             ~478/493/511/526/541/556/572/589, belonging to
             TestValidateScaffold_{WithTestCommand, MissingTestCommand,
             AllFieldsPresent, MissingUseWhen, MissingAssumes, MissingPairsWith,
             EmptyUseWhen, SampleConfigNonString}.

             EIGHT, not six. The count is stated exactly because an implementer
             who patches only the first six hits a compile error at :572 and
             :589 and may fix it ad hoc — and :572 (EmptyUseWhen) is a NEGATIVE
             assertion, so an ad-hoc "recipes" there guts it silently while the
             mandated test name survives.

             PASS AN EXPLICIT "code" AT ALL EIGHT. The dangerous value is
             "recipes", which is the one archetype that relaxes the requirements:
             under it, five of these tests (MissingTestCommand, MissingUseWhen,
             MissingAssumes, MissingPairsWith, EmptyUseWhen) assert a MISSING
             field FAILS and would pass VACUOUSLY — mandated name intact,
             assertion gutted. Empty string "" would take the strict path under
             the natural `== "recipes"` branch and so is not itself unsafe, but
             pass "code" anyway: it states the intent at the call site instead of
             depending on how the branch happens to be written, so a later
             refactor to `switch archetype` cannot quietly flip five negatives to
             green. (SampleConfigNonString at :589 survives either way — that
             check still runs under recipes — but take "code" there too for
             consistency.)

             After the edit, confirm the five negatives still FAIL-when-expected
             by reading the run output, not by assuming. Nothing else in that
             file changes.

          Change NOTHING else in manifest.go. Specifically leave alone:
            * line 317, the ruleset-version default (enforcement-keyed; a
              recipes pack with no ruleset is unaffected);
            * line 350, the scaffold semver check (already conditional on a
              non-empty version);
            * the content-is-required check ending at manifest.go:287 —
              widening it to count `recipes:` is SPEC-054's named three-site
              follow-up, explicitly not this plan's (the field-guide pack
              carries a scaffold and clears it today);
            * validateRecipesIndex, which stays STRUCTURAL — it must not start
              parsing recipe.yml, because pkg/recipe imports this package and
              doing so would invert the dependency (its own comment says so).
          Do NOT touch pkg/pack/validate_manifest.go: its archetype branches are
          enforcement-only plus an `m.Archetype != "code"` early return, so a
          recipes pack flows through unchanged, and it has no production caller.

          Then run: go test ./pkg/pack/... -race -count=1
        files:
          - pkg/pack/manifest.go
          - pkg/pack/manifest_test.go
        claims:
          - CLM-004
          - CLM-013
          - CLM-015
        depends_on:
