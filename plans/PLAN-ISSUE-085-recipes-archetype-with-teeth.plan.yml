      - id: TASK-007
        type: verification
        title: "Package verification — packval, pack and the CLI e2e suites green under race"
        description: |
          Run, and report the TRUE exit code:

            go test ./pkg/packval/... ./pkg/pack/... ./cmd/backstop/... -race -count=1

          Confirm:
