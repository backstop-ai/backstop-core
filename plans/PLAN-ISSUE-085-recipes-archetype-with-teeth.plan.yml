  # ═══════════════════════════════════════════════════════════════════════
  # Phase 2: TDD green — two parallel implementations + package verification
  # ═══════════════════════════════════════════════════════════════════════
  - id: phase-2
    name: "Phase 2: TDD Green — The recipes Archetype in packval, the Enum and the Scaffold Seam in pkg/pack"
    tasks:
      - id: TASK-005
        type: implementation
        title: "pkg/packval — parse the recipes index, admit `archetype: recipes`, and enforce per-recipe enforcement.rules in phase4"
        description: |
          Make TASK-002's and TASK-004's tests pass. Four production edits plus
          two mechanical test-call-site updates.

          1. pkg/packval/manifest.go — add ONE field to PackManifest (top level,
             beside ToolConfig/Engines, NOT inside Content):

               Recipes map[string]string `json:"recipes,omitempty" yaml:"recipes,omitempty"`

             Document it the way the runtime model documents its twin
             (pkg/pack/manifest.go:55-63): a stable recipe id mapped to the
             pack-relative directory holding that recipe's recipe.yml and
             payload; a DISTINCT top-level key from Content.Scaffolds; the two
             never populate each other; zero-value (nil) when absent. Do NOT
             touch the Content struct and do NOT add a Recipes field to it.

          2. pkg/packval/phase1.go:42 — widen the archetype enum to admit
             "recipes" alongside "code" and "enforcement". Do NOT touch the
             content-required check on line 45-47: a recipes-ONLY pack still
             failing there is deliberate and TASK-002 pins it (SPEC-054's named
             three-site widening follow-up is not this plan's).

          3. pkg/packval/phase4.go — change the signature to
             `RunArchetype(pack *PackManifest, packDir string)` and add the
             recipes branch. Bump the PhaseResult Checks count from 2 to 3 and
             extend its comment (archetype-rules, co-occurrence,
             recipe-enforcement).

             The branch, in order:
               (a) `len(pack.Recipes) == 0` -> ValidationError{Check:
                   "recipes-required", ManifestPath: "recipes"} — a recipes pack
                   that declares no recipes is an empty pack, and this is what
                   stops the archetype becoming the rule-less escape hatch
                   direction 2 was rejected for.
               (b) iterate the recipe ids in SORTED order (mirror
                   validateRecipesIndex, pkg/pack/manifest.go:436-438) so error
                   order is deterministic. For each: read
                   filepath.Join(packDir, dir, "recipe.yml"); on a read error OR
                   a recipe.ParseRecipeManifest error emit ValidationError{Check:
                   "recipe-manifest", Rule: <recipe id>, ManifestPath:
                   "recipes."+id} carrying the underlying error, and CONTINUE to
                   the next recipe — never fall through to (c) with a zero-value
                   manifest, which would silently exempt an unreadable recipe.
                   The MESSAGE must NAME THE RECIPE ID, e.g.
                     recipe "adopt-lint": reading recipes/adopt-lint/recipe.yml: <err>
               (c) when Kind is recipe.KindScaffolding or recipe.KindImplementing
                   and (Enforcement == nil || len(Enforcement.Rules) == 0), emit
                   ValidationError{Check: "recipe-enforcement", Rule: <recipe
                   id>, ManifestPath: "recipes."+id}. The MESSAGE must NAME THE
                   RECIPE ID and the kind, e.g.
                     recipe "adopt-lint": implementing-kind recipe must declare enforcement.rules

               The id-in-message requirement in (b) and (c) is load-bearing, not
               style: the text renderer prints only Phase, Check and Message
               (pkg/packval/format.go:27) and DISCARDS Rule, and text is the
               human default for `pack check`. An id that lives only in Rule
               cannot be seen by the pack author at the terminal — and TASK-004's
               substring assertion and TASK-008's step-5 acceptance both read
               that default output. Populate Rule as well, for JSON consumers.
               Do NOT widen the formatter to print Rule: that would change every
               existing pack's diagnostics and is a separate change.
               (d) recipe.KindTemplating: no obligation, and declaring
                   enforcement.rules anyway is NOT an error.

             Compare kinds against the pkg/recipe constants (KindScaffolding /
             KindImplementing / KindTemplating) — do not retype the strings, so
             the two packages cannot drift. This is the import that makes the
             check possible: pkg/recipe does not import packval (verified:
             `go list -deps ./pkg/recipe` = pack/engine, pack, waiver), so
             packval -> recipe adds no cycle, and pkg/pack deliberately cannot
             host this check because recipe imports IT (its own comment,
             manifest.go:427-431).

             SCOPE GUARD: the check is PRESENCE-ONLY. Do not resolve, look up or
             validate the strings inside enforcement.rules against anything —
             there is no pack ruleset to resolve them against, and inventing one
             re-imports the enforcement-pack assumption this archetype exists to
             escape.

             Leave the `code` and `enforcement` branches byte-unchanged. The
             recipes branch imposes NO ruleset requirement and NO pairs_with
             obligation; rules are permitted but never required. Add a short doc
             comment on RunArchetype stating the three-archetype contract and
             WHY the enforcement unit for a recipes pack is the recipe rather
             than the pack (the applier is the drift enforcement for
             regenerating kinds; templating is check-free by design), so the
             next reader does not "harmonize" it back to a pack-level ruleset.

          4. pkg/packval/pipeline.go:66 — pass p.packDir into RunArchetype.

          5. Mechanically add the new argument at the ten existing call sites in
             packval_phase456_pipeline_test.go (8) and coverage_error_paths_test.go
             (2), passing t.TempDir(). NOTHING ELSE in those two files may change
             — no assertion weakened, retargeted or deleted. If one of them goes
             red, the new branch leaked into the code/enforcement paths and the
             branch is wrong, not the test.

          Do NOT touch pkg/pack (TASK-006 owns it), phase2/3/5/6, or the
          Content struct. Then run:
            go test ./pkg/packval/... ./cmd/backstop/... -race -count=1

          EXPECT ONE RESIDUAL RED, and do not chase it: TASK-006 is a PARALLEL
          SIBLING, not a predecessor, so if it has not landed yet
          TestPackAdd_RecipesArchetypePackInstalls still fails on its closing
          pack.ParseManifestFile assertion — the unpadded field-guide scaffold is
          rejected by pkg/pack's unconditional validateScaffold until TASK-006
          makes it archetype-conditional. That failure is TASK-006's to clear.
          Do NOT "fix" it by padding the fixture with tier / test_command /
          use_when / assumes / pairs_with, and do NOT weaken the assertion:
          either move re-introduces the exact whack-a-mole shape this plan
          exists to remove and makes CLM-004 vacuous. Everything else in the run
          must be green.
        files:
          - pkg/packval/manifest.go
          - pkg/packval/phase1.go
          - pkg/packval/phase4.go
          - pkg/packval/pipeline.go
          - pkg/packval/packval_phase456_pipeline_test.go
          - pkg/packval/coverage_error_paths_test.go
        claims:
