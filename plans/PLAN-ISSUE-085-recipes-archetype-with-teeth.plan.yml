      - id: TASK-002
        type: test
        title: "Failing pkg/packval tests: the recipes archetype, its teeth, its exemption, and the two boundaries it must NOT cross"
        description: |
          Add pkg/packval/archetype_recipes_test.go in package `packval_test`
          (matching packval_phase456_pipeline_test.go), driving the EXPORTED
          API — RunStructural, RunArchetype, ParseManifest — never an internal.

          Each phase4 case constructs a packval.PackManifest inline and writes
