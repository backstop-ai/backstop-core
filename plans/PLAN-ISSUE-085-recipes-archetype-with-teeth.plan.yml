    tasks:
      - id: TASK-001
        type: setup
        title: "Commit the two acceptance fixture packs: the field-guide shape (green) and the missing-enforcement shape (red)"
        description: |
          These two committed packs ARE the live acceptance bar from the issue's
          reproduction: a pack whose whole point is to hand out recipes and
          paired scaffolds, with no ruleset and none of the whack-a-mole padding
          (no decoy rule, no engines: binding, no pairs_with wiring).

          (1) cmd/backstop/testdata/recipes-archetype-pack/ — the GREEN one.

              pack.yml (top-level keys only, no `engines:`, no `content.ruleset`):
                name: demo-org/recipes-field-guide
                version: 1.0.0
                language: any
                archetype: recipes
                description: <one line — pkg/pack requires a non-empty description>
                recipes:
                  scaffold-service: recipes/scaffold-service   # scaffolding kind
                  adopt-lint:       recipes/adopt-lint         # implementing kind
                  readme-badge:     recipes/readme-badge       # templating kind
                content:
                  scaffolds:
                    - id: service-base
                      path: scaffolds/service-base

              The scaffold is BARE — id and path only. That is the point of the
              fixture, not an oversight: no tier, no test_command, no use_when,
              no assumes, no pairs_with. Those five are exactly what pkg/pack's
              validateScaffold demands unconditionally today (manifest.go:642,
              called from the loop at :355) and four of them are the
              enforcement-pack padding the issue's reproduction documents.
              TASK-006 makes that requirement archetype-conditional; until it
              lands, TASK-003's load test fails here, which is the intended red.
              DO NOT repair the red by padding this scaffold — padding it
              silently reintroduces the whack-a-mole shape and makes CLM-004
              vacuous.

              Leaving `tier:` off also keeps `pack add`'s test-mode run hermetic:
              phase3 only acts on tier `complete` / `skeleton`
              (phase3.go:145-206), so no test command is ever executed. The
              scaffold PATH must exist (phase1.go:74-80 stats it), so put one
              small file under scaffolds/service-base/.

              recipes/scaffold-service/recipe.yml — kind: scaffolding, version
                1.0.0, ONE create op writing a declared target from
                payload/service.json, and an `enforcement:` block with a
                non-empty `rules:` list.
              recipes/adopt-lint/recipe.yml — kind: implementing, version 1.0.0,
                ONE create op, and a non-empty enforcement.rules.
              recipes/readme-badge/recipe.yml — kind: templating, version 1.0.0,
                ONE insert op (target + anchor + snippet + manual — insert
                REQUIRES manual, pkg/recipe/manifest.go), and NO `enforcement:`
                block at all. This recipe is the exemption's proof: it must pass
