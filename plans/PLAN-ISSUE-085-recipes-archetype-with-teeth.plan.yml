            - TestPackCheck_RecipesArchetypeMissingEnforcementFails (CLM-012) —
              the same command over the committed RED fixture
              (recipes-archetype-pack-no-enforcement), but run it in the DEFAULT
              TEXT format, not JSON. Assert: a non-nil error (non-zero exit) AND
              the printed report names the offending RECIPE ID and the
              enforcement obligation.

              Text specifically, because that is the human default and the
              renderer prints only Phase/Check/Message while DISCARDING the Rule
              field (pkg/packval/format.go:27) — a JSON-only assertion would pass
              while the operator at the terminal still cannot tell which recipe
              failed. This test is what holds TASK-005's id-in-message
