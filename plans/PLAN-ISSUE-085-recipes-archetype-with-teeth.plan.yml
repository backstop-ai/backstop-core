notes: |
  Implements ISSUE-085 under its founder-ratified Decision (2026-07-27),
  DIRECTION 1: a new archetype in pkg/packval that admits scaffolds + recipes
  with no pack-level ruleset, and that REQUIRES `enforcement.rules` on every
  non-templating recipe the pack ships. Direction 2 (relaxing `code`) and
  direction 3 (padding the field guide with a decoy rule) are ruled out by the
  issue and are not re-litigated here.

  ── THE NAME: `recipes` (decided, not left open) ────────────────────────────
  The Decision text says "`recipes`/scaffolding archetype". This plan picks
  `recipes` and the implementer must not substitute `scaffolding`. Grounds:
  `scaffolding` is ALREADY taken twice in this vocabulary — it is one of the
  three recipe KINDS (pkg/recipe/manifest.go:19 `KindScaffolding`) and it is the
  root of `content.scaffolds`. An archetype spelled `scaffolding` whose teeth are
  "every scaffolding-KIND recipe needs enforcement.rules" is a sentence nobody
  can read twice. `recipes` names what the pack ships.

  ── WHAT PACKVAL LEARNS ABOUT RECIPES (the narrow path, deliberately) ───────
  packval's `Content` struct (pkg/packval/manifest.go:51-54) is NOT touched, and
  phase1's "content is required" check (phase1.go:45-47) is NOT widened. Those
  are the three-site widening SPEC-054 named as a tracked follow-up (its
  "A RECIPES-ONLY pack does not validate yet" sharp edge, plus the matching
  follow-up entry), and the issue says that work is COUPLED but NOT BLOCKING.
  This plan does not absorb it.

  CITE SPEC-054 BY HEADING, NEVER BY LINE NUMBER, anywhere in this plan or in
  the code comments it produces. The issue's own `:1419-1427` citation is STALE
  (the passage is further down the file), and PLAN-ISSUE-081 — zero file overlap
  with this plan, so it may land in either order — edits SPEC-054 and shifts
  every offset again. Grep the heading text.

  Instead packval gains ONE new field: a top-level `Recipes map[string]string`
  on `PackManifest`, mirroring the runtime model's own top-level index
  (pkg/pack/manifest.go:63). `recipes:` IS a top-level pack.yml key, not a
  `content:` key, so this is the honest parse — not a back door into the content
  model. Consequence, stated so nobody is surprised: a recipes-ONLY pack (no
  scaffolds, no rules, no sdk) STILL fails phase1 "content is required" after
  this plan. CLM-014 pins that as a live falsifiable marker rather than a silent
  gap, so the SPEC-054 follow-up has a test that flips when it lands.

  ── WHY THE ENFORCEMENT CHECK BELONGS IN PACKVAL AND NOWHERE ELSE ──────────
  Verified against the import graph, not assumed:
    * `pkg/pack` CANNOT do it. Its own comment says so — validateRecipesIndex
      (pkg/pack/manifest.go:427-431) is structural ONLY because "the recipe.yml
      itself is parsed at resolve time by the recipe package, WHICH IMPORTS THIS
      ONE; validating its contents here would invert that dependency."
    * `pkg/packval` CAN. `go list -deps ./pkg/recipe` = {pack/engine, pack,
      waiver} — pkg/recipe does NOT import packval, so packval -> recipe adds no
      cycle. packval already imports pkg/pack and pkg/pack/engine.
  So the content-level check (kind + enforcement.rules per recipe) lands in
  packval phase4 via `recipe.ParseRecipeManifest`, which is the ONE parser for
  recipe.yml. No second recipe-manifest model is created anywhere.

  ── SIGNATURE CHANGE (declared cost, not a surprise) ───────────────────────
  phase4 must read files, so `RunArchetype(pack *PackManifest)` becomes
  `RunArchetype(pack *PackManifest, packDir string)` — symmetric with
  RunCoherence / RunFixtures / RunLayer, which already take packDir. Call sites:
    * pkg/packval/pipeline.go:66 (production)
    * pkg/packval/packval_phase456_pipeline_test.go — 8 calls
    * pkg/packval/coverage_error_paths_test.go:157,171 — 2 calls
  Those two existing test files are in TASK-005's file scope for the MECHANICAL
  argument addition ONLY (pass `t.TempDir()`). No existing assertion may be
  weakened, retargeted or deleted; if one goes red, the new branch is wrong.

  ── EDIT-SET HONESTY: THE INSTALL PATH AND THE LOAD PATH ARE DIFFERENT ─────
  A pack manifest is validated at THREE seams, not one, and they do not agree.
  Widening only packval's would ship a pack that installs cleanly and then makes
  the project ungateable:
    1. pkg/packval/phase1.go:42 (archetype enum) — reached by `pack check`,
       `pack test` and `pack add` (PackvalValidator, unconditional since
       SPEC-055 REQ-008). This is the INSTALL path.
    2. pkg/pack/manifest.go:482 `validateArchetype` — reached by
       `pack.ParseManifestFile`, which cmd/backstop/pack_gate.go:168 calls for
       EVERY declared pack on EVERY gate run, hard-failing the run on a parse
       error ("parsing %s: %w"). This is the LOAD path.
    3. pkg/pack/manifest.go:642 `validateScaffold`, called UNCONDITIONALLY from
       the scaffold loop at manifest.go:355 with NO archetype branch. Also the
       LOAD path.

  Seam 3 is the reviewer-found blocker, and it is decisive because the two paths
  are DISJOINT: nothing in pkg/pack/distribution calls ParseManifestFile (grep:
  the only caller in the tree is pack_gate.go:168), so `pack add` never runs
  seams 2 or 3. A field-guide pack would therefore INSTALL successfully and then
  abort every subsequent `backstop gate` at load — strictly worse than today's
  honest install-time rejection, and exactly the silent trap TASK-006 exists to
  prevent.

  What seam 3 demands of EVERY scaffold today, regardless of archetype: a valid
  `tier` (complete|skeleton — empty fails), a `test_command`, a non-empty
  `use_when`, a non-empty `assumes`, and a non-empty `pairs_with`. That is five
  cascading failures for the field-guide pack's bare {id, path} scaffold, and
  four of the five are the SAME enforcement-pack padding the issue's
  reproduction documents. There is no way around it from the fixture side: a
  recipes-ONLY pack (dropping scaffolds to dodge seam 3) fails content-is-
  required at BOTH phase1 and manifest.go:287, which is SPEC-054's follow-up,
  not this plan's. So seam 3 becomes archetype-conditional in TASK-006, mirroring
  how phase4 already branches per archetype.

  The relaxation is scoped, not a hole: under `archetype: recipes` those five
  requirements do not APPLY, but everything still VALIDATES — a declared tier
  must still be complete|skeleton, sample_config values must still be strings,
  and a declared scaffold version must still be semver. And non-recipes
  archetypes keep every requirement byte-for-byte (CLM-013/CLM-015).

  Production edit set, complete:
    pkg/packval/{manifest,phase1,phase4,pipeline}.go + pkg/pack/manifest.go.
  Verified NOT to need changes (do not edit them):
    * pkg/pack/validate_manifest.go — its archetype branches are `enforcement`-
      only plus an `m.Archetype != "code"` early return, so a `recipes` pack
      flows through untouched. It also has NO production caller (grep:
      definition only), so it is not on the install or gate path at all.
    * pkg/pack/manifest.go:317 — ruleset-version defaulting is `enforcement`-
      keyed; a recipes pack with no ruleset is unaffected.
    * pkg/pack/manifest.go:350 — the scaffold semver check is already
      conditional on a non-empty version.
    * pkg/pack/distribution/** — no manifest re-validation to widen; the whole
      point above is that it never reaches seams 2 or 3.
    * pkg/pack/distribution/list.go — echoes the archetype string for display.
    * artifacts/**/schema.json — no pack.yml JSON schema declares archetype
      (swept: zero hits for "archetype" under artifacts/).

  ── THE TEETH, EXACTLY ─────────────────────────────────────────────────────
  For `archetype: recipes`, phase4:
    (a) FAILS if the pack declares no `recipes:` at all — check `recipes-
        required`. This is what keeps the new archetype from becoming the
        rule-less escape hatch direction 2 was rejected for. A pack with no
        recipes and no ruleset is not a recipes pack; it is an empty pack.
    (b) FAILS, per recipe, if `<packDir>/<dir>/recipe.yml` is missing,
        unreadable, or unparseable — check `recipe-manifest`. An unreadable
        manifest must NEVER be silently exempt from (c); that is the vacuous
        green this whole issue is about.
    (c) FAILS, per recipe, when `kind` is `scaffolding` or `implementing` and
        `enforcement.rules` is absent or EMPTY — check `recipe-enforcement`.
        `enforcement:` present with `rules: []` counts as ABSENT (CLM-008): an
        empty list is not a declaration.
    (d) EXEMPTS `kind: templating` entirely (no drift story to enforce). A
        templating recipe that declares enforcement.rules anyway is NOT an
        error — the obligation is one-directional.
    (e) imposes NO ruleset requirement and NO `pairs_with` obligation. Those are
        `code`-archetype enforcement semantics and they are exactly the
        whack-a-mole the issue documents.
  Rules are PERMITTED but not required under `recipes` — the guard against
  abuse is (a), not a prohibition nobody ratified.

  SCOPE GUARD on (c): the check is PRESENCE-ONLY. packval must not resolve,
  cross-reference or validate the rule strings inside `enforcement.rules`
  against anything — there is no pack ruleset to resolve them against, and
  inventing one would re-import the enforcement-pack assumption this archetype
  exists to escape.

  DETERMINISM: `Recipes` is a map. Sort the ids before iterating so error order
  is stable, exactly as validateRecipesIndex (pkg/pack/manifest.go:436-438)
  already does.

  ERROR SHAPE: reuse the existing ValidationError slots — `Check` as named
  above, `Rule` carrying the RECIPE ID (phase1 already puts scaffold ids in that
  slot, phase1.go:77), `ManifestPath` as `recipes.<id>`.

  AND PUT THE RECIPE ID IN THE MESSAGE TEXT TOO. This is not redundancy: the
  text renderer prints `ERROR [%s/%s] %s` over Phase, Check and Message ONLY
  (pkg/packval/format.go:27) and DISCARDS the Rule field entirely. Text is the
  human default for `pack check` (the --json flag selects JSON), so a recipe id
  that lives only in Rule is invisible to the pack author standing at the
  terminal — the one person the diagnostic exists for. Shape each message so it
  names the recipe and states the obligation, e.g.

    recipe "adopt-lint": implementing-kind recipe must declare enforcement.rules

  Keep populating Rule as well, for the JSON consumers and for symmetry with
  phase1. Widening the text formatter is NOT in scope for this plan — it would
  change every existing pack's diagnostic output, which is a separate change
  with its own blast radius.

  ── SWEEP: WHAT ELSE DECLARES AN ARCHETYPE (verified 2026-07-27) ───────────
  Nothing changes verdict, and the claim is falsifiable rather than asserted:
    * Published + installed packs — .backstop/packs/{backstop/self, go-toolchain,
      go-standards, contracts, substantiveness}, .backstop/packs/backstop-ai/
      cobra-cli-standards, packs/{contracts,substantiveness,base-engines}, and
      the external backstop-packs suite (typescript-{standards,toolchain,
      contracts,substantiveness}, secrets): ALL `archetype: enforcement`. None
      declares `code`; none declares `recipes`.
    * Fixtures declaring `code` (recipe-apply-e2e x3, recipe-divergence-e2e,
      classifier-e2e, spec045-discovery, pkg/recipe demo-pack, pkg/pack/testdata/
      recipes/{valid,missing-dir}): the `code` branch is byte-unchanged, so they
      keep their current verdict. pkg/pack/testdata/recipes/valid is the closest
      LOOKING case (code + scaffolds + recipes, no ruleset) but it is NOT the
      field-guide shape and must not be cited as proof that the shape parses
      today: its scaffold carries the full padding — tier: skeleton,
      test_command, use_when, assumes AND pairs_with — which is precisely WHY it
      survives seam 3. It parses because it pays the tax the issue is about. It
      is deliberately LEFT ALONE: it is a pkg/pack index-validation fixture that
      never runs packval, and retrofitting it would widen this plan's blast
      radius for zero coverage.
    * pkg/pack/distribution/testdata/* declare `archetype: rule-pack`, invalid in
      BOTH enums today and still invalid after. Those fixtures run against mock
      validators. Unchanged.
    * Existing negative tests use "hybrid" (packval coverage_error_paths_test.go:
      156) and "library" (pkg/pack/manifest_test.go:279,913). Both remain
      invalid — CLM-013 pins that the enum grew by exactly one member.

  ── FIXTURE POLICY (read before invoking "capture, don't fabricate") ───────
  The captured-from-real-output rule governs TOOL OUTPUT fixtures (SARIF,
  coverage reports). A pack.yml / recipe.yml is a DECLARATION, not captured
  output, and authoring one by hand is correct here. What must not be fabricated
  is the EXPECTED REPORT: assertions go on the check name and the recipe id in
  the real pipeline result, never on a hand-written golden blob of `pack check`
  output.

  ── VERIFICATION COMMANDS (`backstop code check` does NOT exist) ───────────
    middle: go test ./pkg/packval/... ./pkg/pack/... ./cmd/backstop/... -race -count=1
    final:  go build -o bin/backstop ./cmd/backstop/   (REBUILD — a stale binary
            gates the OLD code and reports a vacuous green)
