      - id: TASK-003
        type: test
        title: "Failing pkg/pack tests: the UNPADDED field-guide pack loads at the gate-time seam — archetype enum AND archetype-conditional scaffold requirements"
        description: |
          Widening packval alone would ship a pack that installs and then breaks
          `backstop gate`: cmd/backstop/pack_gate.go:168 parses EVERY declared
          pack through pack.ParseManifestFile on every gate run and hard-fails
          the run on a parse error. Nothing in pkg/pack/distribution calls
          ParseManifestFile, so `pack add` never sees these checks — install and
          load disagree, and that is the trap. Pin BOTH halves here.

          Add pkg/pack/manifest_recipes_archetype_test.go.

          Mandated test names (exact):

            - TestValidateArchetype_Recipes (CLM-004) — validateArchetype
              ("recipes") returns nil. Same test re-asserts
              validateArchetype("library") still errors, so the enum grew by
              exactly one member.

