              (CLM-015) — the blocker's own unit. validateScaffold is called
              unconditionally from the manifest.go:355 loop and today demands a
              valid tier, a test_command, use_when, assumes AND pairs_with of
              EVERY scaffold. Table it:
                * a BARE Scaffold{ID, Path} under archetype "recipes" -> nil
                  error. This is the case that fails five ways today.
                * the SAME bare scaffold under "code" AND under "enforcement" ->
                  still errors. This is the CLM-013 falsifier: a relaxation that
                  leaked past the recipes branch would silently gut FIVE existing
                  negative assertions in manifest_test.go
                  (TestValidateScaffold_{MissingTestCommand, MissingUseWhen,
                  MissingAssumes, MissingPairsWith, EmptyUseWhen}).
                * under "recipes", a scaffold declaring `tier: bogus` -> STILL
                  errors, and one declaring `tier: skeleton` -> nil. The
                  requirement is dropped; the validation is not. Without this
                  case the branch could be written as a blanket early-return and
                  look green.
                * under "recipes", a scaffold whose sample_config holds a
                  non-string value -> still errors.

            - TestParseManifestFile_RecipesArchetypePackLoads (CLM-004,
              CLM-015) — the integration of the two above at the seam the gate
              actually uses. Write an UNPADDED field-guide-shaped pack.yml to a
