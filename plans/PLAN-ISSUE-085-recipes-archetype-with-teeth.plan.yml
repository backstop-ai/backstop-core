              index, content.scaffolds holding ONE scaffold with id and path
              ONLY, and NO ruleset. Also create the recipe dirs + recipe.yml
              files the index names — validateRecipesIndex (manifest.go:432)
              fail-louds on an index entry with no recipe.yml, so the dirs must
              be real. Assert: no error, Archetype == "recipes", and the parsed
              Recipes map holds the declared entries.

              The scaffold MUST stay unpadded. If this test goes red, the fix is
              TASK-006's conditional, never adding tier/test_command/use_when/
              assumes/pairs_with to the fixture — padding it would make CLM-004
