               ./bin/backstop gate

             Every dimension, no scoping down, no per-dimension selection. This
             run also re-proves CLM-004 in production: the gate loads every
             declared installed pack through pack.ParseManifestFile, the exact
             seam TASK-006 widened. Fix real violations in the owning task's
             files; do not waive, do not baseline. Violations in files THIS
             change touched must be fixed outright — no grandfathering on
