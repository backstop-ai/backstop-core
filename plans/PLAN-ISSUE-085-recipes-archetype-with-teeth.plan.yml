              produces NO error whose Check is "archetype". Falsifier in the same
              test: the SAME manifest with archetype "hybrid" still produces one.

            - TestPackVal_Manifest_ParsesTopLevelRecipesIndex (CLM-002) — write a
              pack.yml with a top-level `recipes:` block plus a `content:` block
