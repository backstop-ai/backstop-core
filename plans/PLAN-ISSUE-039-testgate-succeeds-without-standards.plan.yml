            - `backstop gate` — the full kill chain passes AND the
              test_substantiveness finding on TestGate_SucceedsWithoutStandards
              clears: with the file now in diff scope the substantiveness dimension
              evaluates it and no longer reports it hollow. Confirm no new red is
