  - id: phase-1
    name: "Phase 1: Restore CLM-015 Assertion and Verify via Gate"
    tasks:
      - id: TASK-001
        type: refactor
        title: "Restore real gate-success assertion in TestGate_SucceedsWithoutStandards"
        description: |
          Replace the hollow scaffold body of TestGate_SucceedsWithoutStandards
          (currently writes backstop.yml + main.go, MkdirAll/os.Stat(.backstop) and
          asserts only that .backstop exists) with a REAL assertion that a gate run
          SUCCEEDS on a no-standards project — restoring SPEC-030 CLM-015.

          CHOSEN PATTERN (assembled steps, sandbox-safe — see notes):
            - Build a no-standards temp project: a backstop.yml declaring NO packs
              (e.g. "project: no-standards\n"), a main.go, NO specs/ dir, and an
              absent/empty .backstop/rules (no STD-GO-001 artifact, no compiled
              standards dir). Add a small local fixture helper in THIS file if it
              keeps the test readable.
            - Compute a scope (gate.ComputeGateScope with GateScopeModeAll, or the
              existing helper style) and drive the ASSEMBLED gate:
                g := gate.New(gate.WithSteps(buildGateSteps(projectRoot, scope)))
                result, exitCode := g.Run(context.Background())
              This mirrors TestGateIntegration_ReadOnlyExecution /
              gate_discovery_e2e_test.go — NOT full runGate (which drags in baseline
              remote pull + external toolchain the sandbox can't provide).
            - ASSERT (meaningful, red-if-broken):
                * the gate actually RAN — result enumerates steps (len(result.Steps)
                  > 0); this is the anti-vacuous guard the original test lacked.
                * exitCode == 0 (the gate SUCCEEDS on a no-standards project).
                * NO StepResult carries ConfigErr == true (no config error).
                * NO step violation message matches a missing-standard pattern
                  (STD-GO-001 / "missing standard" / "manifest") (no missing-standard
                  error).
              If an unrelated deferred dimension (e.g. nil-baseline comparison) blocks
              a clean exit 0, inject a permissive empty baseline via gate.WithBaseline
              OR scope the predicate to the discrete CLM-015 conditions above — keep
              it MEANINGFUL, never coupled to dimensions outside CLM-015.

          FENCE: modify ONLY TestGate_SucceedsWithoutStandards (and add a local
          helper if needed). Leave the four sibling kind:absence tests in this file
          untouched. No production-code and no backstop.yml change.

          Typed `refactor` because it modifies existing code (see notes/TASK-TYPE);
          its substance is test authoring held to the meaningfulness bar.
