  `filterDueMandatedTests` (line 353) → `contractsAreDue(status)` which is
  literally `status == "implemented"` (`step_testverify.go:190-192`). SPEC-999 is
  forced to `draft`, so its only mandated test (`TestCompute_ReturnsNil`) is
  filtered out BEFORE the capability guard and the discovery walk, and the step
  hits the `len(mandated) == 0` early return (`step_testverify.go:355-361`) — an
  unconditional clean pass. The gate is behaving exactly as ISSUE-054 designed;
  the FIXTURE is what is out of date. The ISSUE-075 fix changes NO production
  code.

