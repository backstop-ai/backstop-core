  # ═══════════════════════════════════════════════════════════════════════════
  # Phase 3: TDD Green — widen the seam and block the silent clobber
  # ═══════════════════════════════════════════════════════════════════════════
  - id: phase-3
    name: "Phase 3: TDD Green — Diagnostics-Carrying Verdict and Fail-Loud Malformed Token"
    tasks:
      - id: TASK-004
        type: implementation
        title: "Widen WaiverReader to a DivergenceVerdict, fail loud on a malformed token, report the covered-and-malformed case, and record regenerated divergences"
        description: |
          Make TASK-002's tests pass. Read the current apply.go before editing —
          the line numbers below are pre-079 ORIENTATION, NOT ADDRESSES, and
          TASK-000 should already have corrected them.

          1. NEW exported type (pkg/recipe/apply.go, beside WaiverReader):

                 // DivergenceVerdict is what the waiver-adjudication seam reports.
                 type DivergenceVerdict struct {
                     Covered     bool
                     Diagnostics []waiver.Diagnostic
                 }

             Reuse waiver.Diagnostic rather than mirroring it: pkg/recipe already
             imports pkg/waiver, and a parallel type would be a second lossy
             narrowing — the exact defect being fixed. Document on the type that
             Diagnostics is what adjudication REPORTED, never something the
             applier synthesized, so the seam stays a read path.

          2. WIDEN the seam (apply.go:63):

                 type WaiverReader func(rule string, file string) DivergenceVerdict

             Keep and extend the existing doc comment: a nil reader still selects
             adjudicateDivergence, and the seam still exists so a caller can supply
             a different SOURCE — never so the mechanism can be stubbed out.

          3. adjudicateDivergence (apply.go:353-372) returns the verdict. Keep the
             per-line finding synthesis and the LINE CONTRACT comment verbatim —
             they are load-bearing and unrelated to this change. Call Adjudicate
             ONCE, hold the Result, and return:
               Covered:     len(res.Suppressed) > 0
               Diagnostics: res.Malformed followed by res.NonWaivable
             Carry BOTH kinds even though a nil Policy makes NonWaivable
             structurally unreachable today — narrowing to just Malformed would
             re-create this issue the moment a Policy is supplied. Note that in
             the comment. On the rawFileLines error path, return the zero verdict
             (unreadable file, nothing adjudicated) as it does today.

          4. coveredDivergence (apply.go:324-337) accumulates ACROSS RULES:

                 func coveredDivergence(resolved *ResolvedRecipe, opts ApplyOptions, target string) (rule string, covering string, diagnostics []waiver.Diagnostic, covered bool)

             For each declared enforcement rule, call the reader and APPEND the
             verdict's diagnostics — DEDUPED by token identity {File, Line,
             Message}, first-seen order preserved. The dedupe is required, not
             cosmetic: the same token is re-adjudicated once per declared rule, so
             N rules would otherwise yield N identical entries (CLM-013).

             DO NOT return early on the first covering verdict before the
             diagnostics have been collected — dropping them on the covered branch
             is the same silent-drop defect one `if` later (CLM-012). Consult every
             declared rule, accumulate throughout, and return the FIRST covering
             rule + coveringWaiverText(target, rule) + the full deduped diagnostics
             + true. If no rule covers, return the accumulated diagnostics and
             false. A recipe with no declared rules returns nothing and false, and
             the reader is never called (CLM-006).

          5. preserveOrRegenerate (apply.go:282-318) gains the decision. Replace
             the (preserved, done, error) triple with a small verdict struct so the
             third outcome is explicit rather than encoded in a bare bool:

                 type divergenceOutcome struct {
                     Preserved      *PreservedDivergence
                     Final          bool                 // true: the caller must not write
                     OverDivergence bool                 // the pending write overwrites unaccounted-for divergence
                     Diagnostics    []waiver.Diagnostic  // non-fatal, surfaced by the caller
                 }

             RE-ANCHORED (TASK-000): 079's parameter list is (resolved, op, opts,
             params, own, declaredTarget, target) and is KEPT verbatim — only the
             RETURN changes, from (*PreservedDivergence, bool, error) to
             (divergenceOutcome, error). `declaredTarget` is already the
             SUBSTITUTED value, so the fail-loud error names it directly.

             After the diff shows a divergence and coveredDivergence returns:
               * COVERED -> outcome{Preserved: …, Final: true, Diagnostics: all}.
                 The apply succeeds and the diagnostics ride out on the result.
               * NOT COVERED, and any diagnostic has
                 Kind == waiver.DiagnosticMalformed -> RETURN AN ERROR naming the
                 target as reported, the diagnostic's Line, and its Message (which
                 carries `unknown reason-code "<value>"`). Word it so the
                 operator's two honest exits are stated: fix the reason code to one
                 of the closed enum, or remove the token. Do NOT rewrite the file —
                 the error propagates through applyCreate -> opFailure -> Apply and
                 the consumer's bytes stay on disk.
               * NOT COVERED, no malformed diagnostic ->
                 outcome{Final: false, OverDivergence: true, Diagnostics: all} and
                 the caller regenerates.

          6. ApplyResult (apply.go:99-103) gains TWO fields:

                 Regenerated []string
                 Diagnostics []waiver.Diagnostic

             Regenerated holds the targets whose diverged bytes were overwritten —
             a strict SUBSET of Written, recorded in the SAME value form
             recordWritten uses, so the subset property survives templated targets
             (see TASK-000 item 2). Diagnostics holds the non-fatal adjudication
             findings the run observed. Document both as reporting channels the CLI
             reads, never inputs to a decision. applyCreate appends the op's
             reported target to Regenerated after a successful write exactly when
             the outcome carried OverDivergence, and appends the outcome's
             Diagnostics to result.Diagnostics on every branch that produced them.

          7. pkg/recipe/apply_templating_test.go: spyWaiverReader.read (line 71) is
             the only test-supplied reader in the repo. Update its signature to
             return DivergenceVerdict{} and keep its recording behavior — the
             templating claim it guards (the seam is NEVER consulted for a
             one-shot recipe) is unchanged and must stay asserted.

          Do NOT touch: the transform/insert/merge executors, adoption record
          shape, coveringWaiverText, the KindTemplating short-circuit, or
          cmd/backstop (TASK-006 owns the CLI).
        files:
          - pkg/recipe/apply.go
          - pkg/recipe/apply_templating_test.go
        claims:
