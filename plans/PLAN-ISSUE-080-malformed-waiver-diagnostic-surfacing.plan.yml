          These tests fail to COMPILE until TASK-004 widens the seam (they name
          DivergenceVerdict, ApplyResult.Regenerated and ApplyResult.Diagnostics)
          — that is the intended red state, not a defect in the tests.

          Mandated test names (exact):

            - TestApply_WaiverReaderVerdict_CarriesAdjudicationDiagnostics
              (CLM-001/CLM-002): supply ApplyOptions.ReadWaivers explicitly and
              assert the seam's TYPE carries diagnostics — the reader returns a
              DivergenceVerdict, and a verdict with Covered=false plus a
              DiagnosticMalformed entry reaches the applier's decision (observable
              as the blocked apply below) while a verdict with Covered=false and
              NO diagnostics regenerates. This is the type-level claim: a bool
              seam cannot express the difference.
              Additionally assert the PRODUCTION reader, with ReadWaivers left
              NIL, produces the diagnostics from the real pkg/waiver read path —
              exactly ONE waiver.DiagnosticMalformed entry for a single malformed
              token, NOT one per synthesized per-line finding (Adjudicate dedupes
