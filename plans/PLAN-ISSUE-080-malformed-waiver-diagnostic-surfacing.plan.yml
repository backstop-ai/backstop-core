  ── FIXTURE POLICY (why a NEW consumer project) ───────────────────────────────
  The E2E needs a recipe whose op family is CREATE (the only family that reaches
  divergence adjudication) with a declared `enforcement.rules` entry. The existing
  cmd/backstop/testdata/recipe-apply-e2e fixture ships only TRANSFORM recipes, and
  adding a recipe to its demo-org/recipe-pack would stale that project's committed
  backstop.lock content_hash. A fabricated replacement hash is exactly the
  fabricated-fixture failure mode this repo has already been burned by, so the new
  fixture ships NO backstop.lock: nothing on the `recipe apply` path reads one
  (loadInstalledPacks, cmd/backstop/pack_gate.go:147-176, reads backstop.yml and
  the packs directory; the lock is read only by the gate's pack_lock_verification
  step). Its absence is deliberate and must be commented as such in the fixture.

  The fixture is HERMETIC: the pack declares one provisioned ast-grep@0.43.0
  binding purely to satisfy `provisionedEngineBinding`'s exactly-one requirement
  and the trust gate, and NO transform op ever dispatches — so no tool is executed
  and no binary needs installing.

  The E2E does NOT ship a pre-baked adoption record either. It drives the built
  binary TWICE: apply (creates the file, writes backstop-recipes.lock), then the
  test writes the diverged bytes + the token variant, then apply again. The adopted
  state is thus PRODUCED by the real command rather than staged by hand.

  ── VERIFICATION (per founder instruction: no `backstop code check`) ──────────
  `backstop code check` does not exist on this CLI. Middle-phase verification is
  `go test ... -race -count=1` on the touched packages. Final verification REBUILDS
  the binary first (`make build`) — a stale bin/backstop has silently verified the
  wrong code before — then runs `./bin/backstop artifact validate` and
  `./bin/backstop gate`.

  ── REQUIREMENTS / CLAIMS (plan-local, derived from the issue's Expected) ─────
    REQ-001: The waiver-adjudication seam carries adjudication DIAGNOSTICS.
      CLM-001  WaiverReader returns a DivergenceVerdict{Covered bool;
               Diagnostics []waiver.Diagnostic}; adjudicateDivergence populates
               Diagnostics from the waiver.Result it already receives (Malformed +
               NonWaivable) instead of discarding everything but .Suppressed.
      CLM-002  coveredDivergence accumulates the verdict's diagnostics across
               every declared enforcement rule and hands them to
               preserveOrRegenerate, so "malformed token" and "no token" are
               distinguishable at the decision point.
      CLM-013  Accumulation dedupes by token identity {File, Line, Message}, so a
               recipe declaring N enforcement rules reports ONE diagnostic per
               token, not N — proven on a MULTI-RULE fixture, since every
               single-rule fixture passes a naive accumulator.
    REQ-002: A malformed token on an UNCOVERED divergence fails loud.
      CLM-003  A divergence whose file carries a token with an illegal reason code
               FAILS the apply with a diagnostic naming the target as reported,
               the token's line, and the unknown reason code; the operator's bytes
               are left on disk byte-for-byte.
      CLM-004  The unregressed twins: the same file with NO token still regenerates
               (CLM-061) and with a VALID active token is still preserved
               (CLM-021), and Apply still never authors a token (CLM-062).
      CLM-005  A MALFORMED token naming a rule other than the recipe's declared
               enforcement rule ALSO blocks (an unparseable token declares no
               trustworthy rule), while a VALID wrong-rule token still regenerates.
      CLM-006  A recipe declaring NO enforcement rules never adjudicates, so a
               malformed token in its output cannot block — that path is unchanged.
    REQ-003: A COVERED divergence preserves AND still reports token hygiene.
      CLM-012  A divergence covered by a VALID token that ALSO carries a separate
               malformed token is PRESERVED and exits 0, and the malformed token is
               still surfaced as a warning naming the file, line and bad reason
               code. Falsifier: a covered divergence with no malformed token
               reports NO diagnostics.
    REQ-004: recipe apply's success output names what it actually did.
      CLM-007  The success output lists each WRITTEN target, each PRESERVED path
               with the covering token (or marked consumer-owned), and marks any
               target REGENERATED over an unaccounted-for divergence — so a clobber
               is visibly different from a clean re-apply.
      CLM-008  ApplyResult carries Regenerated (the reported targets whose diverged
               bytes were overwritten — a strict subset of Written, recorded as the
               SUBSTITUTED `declaredTarget` value recordWritten itself uses
               (apply.go:274), so the subset property survives templated targets)
               and Diagnostics (non-fatal adjudication findings), so the CLI
               reports from DATA rather than re-deriving the distinction.
    REQ-005: The fix is proven through the SHIPPED binary.
      CLM-009  A process-level E2E drives the built binary: apply -> operator
               diverges the recipe-owned output with
               @waiver:<rule>:intentional-fork:<future> -> re-apply exits non-zero
               with the diagnostic on STDERR naming the target and
               "intentional-fork", and the operator's edit survives on disk.
      CLM-010  Further E2E arms prove the success-output surfacing on a clean
               apply, a valid-token preserve, a regenerate-over-divergence, and the
               covered-plus-malformed warning, through the same binary.
    REQ-006: SPEC-054 stops describing a signature the code does not have.
      CLM-011  SPEC-054's contract entries for WaiverReader, DivergenceVerdict and
               ApplyResult are textually equal to the type declarations parsed out
               of the shipped source, asserted by a TEST — because the contracts
               dimension compiles every type entry to an existence-only
               `type <Name> $$$` pattern and cannot catch signature drift.

