  # ═══════════════════════════════════════════════════════════════════════════
  # Phase 5: Spec reconciliation + the congruence test that can actually fail
  # ═══════════════════════════════════════════════════════════════════════════
  - id: phase-5
    name: "Phase 5: Spec Reconciliation — SPEC-054 Contracts and a Signature-Congruence Test"
    tasks:
      - id: TASK-008
        type: documentation
        title: "Reconcile SPEC-054's contracts with the widened WaiverReader via /spec"
        description: |
          SPEC-054 is `implemented` and DECLARES the seam this plan changed. Left
          alone, it describes a signature the code does not have — which misleads
          every future reader and every agent that treats the spec as the contract.

          BE CLEAR ABOUT WHY THIS IS NOT OPTIONAL AND ALSO NOT GATE-FORCED: the
          contracts compiler (packs/contracts/scripts/compile-signature.sh) reduces
          every `kind: type` entry to the existence-only ast-grep pattern
          `type <Name> $$$`, so the old and new signatures compile identically and
          NEITHER can red the gate. This task is a correctness obligation on the
          artifact corpus; TASK-009 is what supplies the mechanical catcher.

          ROUTING: do NOT hand-edit specs/SPEC-054-recipe-apply-and-manifest.spec.md.
          Per the repo's artifact workflow, spec evolution goes through /spec
          (spec-author). If this task is being executed by an agent that cannot
          dispatch /spec, STOP and hand the delta below to the parent for routing
          rather than editing the file directly.

          The delta the spec-author must apply:

            1. contracts — UPDATE:
                 WaiverReader:
                   "type WaiverReader func(rule string, file string) DivergenceVerdict"
                 ApplyResult:
                   "type ApplyResult struct { Written []string; Preserved []PreservedDivergence; Regenerated []string; Diagnostics []waiver.Diagnostic; Adoption AdoptionEntry }"
               and refresh both `notes`: the seam reports adjudication DIAGNOSTICS
               alongside coverage; Regenerated is the subset of Written that
               overwrote an unaccounted-for divergence; Diagnostics carries
               non-fatal adjudication findings the CLI surfaces as warnings.
               The field ORDER in the signature string must match the shipped
               struct — TASK-009 compares these textually.

            2. contracts — ADD:
                 DivergenceVerdict:
                   "type DivergenceVerdict struct { Covered bool; Diagnostics []waiver.Diagnostic }"
               with notes recording that it exists because narrowing adjudication
               to a bool silently dropped waiver.DiagnosticMalformed (ISSUE-080),
               and that it carries what adjudication REPORTED — the applier still
               never authors a token (CLM-062).

            3. ApplyOptions notes: mention that ReadWaivers now yields the verdict.
               Its SIGNATURE string is unchanged (the field type name is the same),
               so do not edit the signature line.

            4. REQ-004 / claims: record the three behaviors the spec currently
               leaves unspecified between CLM-021 and CLM-061 — (a) a malformed
               covering token on an UNCOVERED divergence FAILS LOUD and leaves the
               file unmodified; (b) a COVERED divergence carrying a separate
               malformed token is still preserved AND the malformed token is still
               reported; (c) one token yields one diagnostic regardless of how many
               enforcement rules the recipe declares. Any claim added here must
               name a test THIS PLAN ACTUALLY DELIVERS (the eight pkg/recipe names
               in TASK-002 and the two cmd/backstop names in TASK-003); the gate
               enforces mandated tests on an `implemented` spec, so a claim citing
               a test that does not exist is an immediate broken promise.

            5. spec_version bump. TASK-000 read the post-079 baseline off the file
               on 2026-07-26: spec_version is 1.3.0 (079 bumped it from 1.2.1) and
               the highest claim id present is CLM-078. So bump to 1.4.0 — one
               MINOR, because a widened contract is a minor change, not a patch —
               and allocate any new CLM ids from CLM-079 up. Re-read both values
               before authoring in case another lane moved them. Add a Version
               History entry naming
               ISSUE-080, the seam widening, and the reason a second diagnostics
               channel was rejected (an optional nil-defaulted hook reproduces the
               silent drop by shape).

          Do not restate the plan's rationale at length in the spec — the spec
          records the contract and the claim; this plan's notes hold the argument.
        files:
          - specs/SPEC-054-recipe-apply-and-manifest.spec.md
        claims:
          - CLM-011
        depends_on:
          - TASK-004
          - TASK-006
          - TASK-009

      - id: TASK-009
        type: test
        title: "Add the test that diffs SPEC-054's declared signatures against the shipped type declarations"
        description: |
          CLM-011 needs a check that CAN FAIL. The contracts gate dimension cannot
          provide one — it compiles every type entry to `type <Name> $$$`, an
          existence check that both the stale and the corrected signature satisfy.
          So this plan supplies the catcher as a Go test.

          Add pkg/recipe/contract_signature_test.go with the mandated test:

            - TestContract_SPEC054_DeclaredSignaturesMatchShippedTypes (CLM-011)

          It must:
            1. Read specs/SPEC-054-recipe-apply-and-manifest.spec.md (from
               pkg/recipe that is "../../specs/…"). A missing or unreadable file is
               a FAILURE, never a skip — a skip here would be exactly the vacuous
               green this plan exists to remove.
            2. Extract the `signature:` string for each of the contract entries
               named WaiverReader, DivergenceVerdict and ApplyResult. Parse the
               spec's YAML frontmatter rather than regexing the whole document, so
               a prose mention of a signature cannot be picked up as the contract.
               An entry that is ABSENT is a failure — that is how a forgotten
               DivergenceVerdict entry gets caught.
            3. Parse apply.go with go/parser WITHOUT parser.ParseComments (so
               go/printer will not emit doc or field comments into the rendered
               form), find each corresponding *ast.TypeSpec, and render it with
               go/printer.
            4. Canonicalize BOTH sides identically — strip ';', collapse every
               whitespace run to a single space, trim — and assert textual
               EQUALITY. On mismatch, print both canonical forms in the failure
               message; a diff nobody can read gets suppressed rather than fixed.

               THE `type` KEYWORD IS THE TRAP. go/printer on an *ast.TypeSpec
               renders "WaiverReader func(...)" — WITHOUT the leading `type` the
               spec's signature string carries, so a naive equality assert fails
               on every entry for a reason that has nothing to do with drift.
               Resolve it by printing the ENCLOSING *ast.GenDecl (which carries
               the keyword), or by normalizing the keyword on BOTH sides. Do NOT
               resolve it by loosening to a substring / HasSuffix comparison: a
               substring check is exactly the lossy form that would let a real
               signature change slip through, which is the failure this whole task
               exists to prevent.

          Assert on ALL THREE types, not just the one that changed: the point is a
          standing guard against spec/code drift on this contract surface, not a
          one-off check of this plan's edit.

          Expected RED until TASK-008 lands the spec delta — that is the normal TDD
          state for this phase, not a defect. If it passes BEFORE TASK-008 runs,
          the canonicalization is too lossy to detect the drift it exists to
          detect; tighten it.
        files:
          - pkg/recipe/contract_signature_test.go
        claims:
          - CLM-011
        test_names:
          - TestContract_SPEC054_DeclaredSignaturesMatchShippedTypes
        depends_on:
          - TASK-005
          - TASK-007

