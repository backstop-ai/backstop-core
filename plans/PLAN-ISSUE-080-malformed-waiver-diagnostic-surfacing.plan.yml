          Stage TASK-001's fixture into a temp root with copyTree
          (gate_waiver_e2e_test.go:13), following stageRecipeE2EProject's shape;
          add a local stageRecipeDivergenceProject helper for the new project
          rather than changing the existing one. Read the pinned ref, the declared
