  ── SEAM POSITION: WIDEN THE TYPE (not a second diagnostics channel) ──────────
  The issue names the choice explicitly: `WaiverReader` is closed, so surfacing the
  diagnostics means either widening that type or adding a second channel
  (e.g. a `ReportDiagnostics func(...)` field on ApplyOptions). THIS PLAN WIDENS
  THE TYPE. The reasoning, so a reviewer can check it rather than take it:

    1. A second channel re-creates the defect BY SHAPE. An optional reporting hook
       is nil by default, and nil means "drop it" — which is precisely the silent
       drop this issue exists to close. The widened return has no nil default: a
       reader that computes a verdict cannot fail to hand back what it computed.
    2. The two facts come from ONE call. `covered` and "why not covered" are both
       read off a single `waiver.Result`. Splitting them across two seams lets them
       disagree — a reader could report covered=false while the diagnostics came
       from a different adjudication — and nothing would catch it.
    3. The blast radius is small and fully in-repo. The seam has exactly ONE
       production implementation (`adjudicateDivergence`), ONE nil-default
       selection site (apply.go:326-329), and ONE test-supplied reader
       (`spyWaiverReader.read`, pkg/recipe/apply_templating_test.go:71). All three
       are in this plan's file scope. (Sweep performed 2026-07-26 over the whole
       tree excluding .backstop/: no other referent exists.)
    4. The seam stays a READ path. `Apply` still never authors a token (CLM-062
       unregressed); the widened return carries only what adjudication REPORTED.
    5. The verdict reuses `waiver.Diagnostic` rather than mirroring it into a
       recipe-local type. pkg/recipe already imports pkg/waiver, and a parallel
       diagnostic type would be a second lossy narrowing — the same class of
       mistake as the bool.

  The counter-argument for a second channel is that it preserves the signature
  SPEC-054 v1.2.1 declares. That is a paperwork argument, not a design one, and the
  right answer is to RECONCILE THE SPEC, which Phase 5 does.

  ── WHY THE SPEC SYNC IS A REVIEW OBLIGATION, NOT GATE-FORCED ────────────────
  Stated plainly because an earlier draft of this plan got it WRONG and claimed the
  contracts dimension would red on the signature change. It will not. The contracts
  compiler (packs/contracts/scripts/compile-signature.sh, the `"type "*` arm)
  collapses EVERY type entry to the ast-grep pattern `type <Name> $$$` — an
  EXISTENCE check. `type WaiverReader func(rule string, file string) (covered bool)`
  and `type WaiverReader func(rule string, file string) DivergenceVerdict` compile
  to the identical pattern and both match the shipped declaration. Same for
  `ApplyResult`. Neither a stale signature nor a corrected one can move that
  dimension.

  So Phase 5 exists because an `implemented` spec that describes a signature the
  code does not have is WRONG — it misleads every future reader and every agent
  that treats the spec as the contract — not because a machine will catch it. And
  because nothing mechanical catches it, this plan supplies the catcher itself:
  TASK-009 adds a Go test that reads SPEC-054's declared signature strings and
  diffs them, textually, against the type declarations parsed out of the shipped
  source. That test CAN fail, which is the whole point; CLM-011 would otherwise be
  a claim no evidence could falsify.

  ── WHAT A MALFORMED TOKEN DOES: FAIL LOUD, DO NOT REWRITE ────────────────────
  An UNCOVERED divergence whose file carries a malformed token makes the apply FAIL
  (exit 1 via the existing ExitViolations wrap at cmd/backstop/recipe_apply.go:70,
  printed on stderr by SPEC-055's reportError) and leaves the diverged file
  UNTOUCHED. Rejected alternatives and why:

    * Regenerate-but-warn: the operator's edit is still destroyed. A warning after
      the fact does not give it back, and exit 0 says the apply did what was asked.
    * Preserve-silently (treat malformed as covering): a typo would become a
      permanent opt-out of regeneration, and the recipe's declared output would
      silently never land — vacuous green in the other direction.

  Fail-loud is the only outcome that destroys nothing AND lies about nothing. It
  also keeps waiver semantics intact: a malformed token still does NOT suppress —
  the apply refuses rather than accepting it. The operator has two honest exits:
  fix the reason code (→ preserved, accountable) or remove the token
  (→ regenerated, as before).

  ── COVERED **AND** MALFORMED: PRESERVE, AND STILL REPORT ────────────────────
  A diverged file can carry a VALID covering token AND, separately, an unparseable
  one. Coverage and hygiene are INDEPENDENT FACTS, so the two are answered
  independently: the divergence IS covered, so the file is PRESERVED and the apply
  succeeds (exit 0) — but the malformed token is still SURFACED, as a warning on
  stderr naming the file, the line and the bad reason code.

  Getting this wrong reproduces the issue's own defect on the other branch: an
  implementation that returns early on `covered` and drops the diagnostics is the
  same silent drop, just one `if` later. That is exactly what the current code
  would do if the verdict were only consulted on the uncovered path, so it is
  pinned by its own claim (CLM-012), its own unit test, and its own E2E arm, with a
  falsifying twin (a covered divergence with NO malformed token must report NO
  diagnostics) so the assertion cannot pass vacuously.

  Blocking on this case was rejected: the operator DID account for the divergence
  with a valid token, and refusing to honor it because of an unrelated typo
  elsewhere in the same file would punish the accountable path.

  ── ONE TOKEN, ONE DIAGNOSTIC — ACROSS RULES TOO ─────────────────────────────
  Two multiplication sources, only one of which is already handled:

    * WITHIN one adjudication: `adjudicateDivergence` synthesizes one finding PER
      LINE (the line contract), but `waiver.Adjudicate` dedupes harvested tokens by
      {file,line,col}, so one token yields ONE Malformed entry. Already correct.
    * ACROSS rules: `coveredDivergence` calls the reader ONCE PER DECLARED
      ENFORCEMENT RULE. With N declared rules the SAME token is adjudicated N times
      and yields N identical Malformed entries. NOT handled, and invisible today
      because every recipe fixture in the repo declares exactly ONE enforcement
      rule — which is precisely why a multi-rule fixture is mandated (CLM-013):
      without one, a naive accumulator passes every test in the suite.

  The accumulation therefore dedupes by token identity — {File, Line, Message} —
  preserving first-seen order for determinism.

  ── OTHER SHARP EDGES THE TESTS MUST PIN ──────────────────────────────────────
    * NO ENFORCEMENT RULES → NO ADJUDICATION. `coveredDivergence` loops
      `enforcementRules(resolved)`; a recipe declaring no `enforcement.rules` never
      calls the reader at all, so a malformed token in its output can never block.
      That path is unchanged and must stay unchanged (CLM-006).
    * A MALFORMED TOKEN NAMING A DIFFERENT RULE ALSO BLOCKS. A VALID token naming
      another rule does not preserve (existing behavior, pinned by
      TestApply_DivergedWithActiveWaiver_PreservedViaRealWaiverReadPath's
      wrong_rule_id_does_not_cover case) — because it PARSED, so we know it is not
      about us. A MALFORMED token parses into nothing: `ParseToken` errors before
      any field is trustworthy, so it cannot be dismissed as someone else's. This
      asymmetry is DELIBERATE and is pinned by its own test (CLM-005) so it cannot
      be silently "fixed" later.
    * PARTIAL APPLY ON FAILURE. Failing at this op aborts the run, so ops that
      already executed keep their writes and `Apply` returns the ZERO result —
      identical to every other op failure. No new failure semantics.
    * TEMPLATING NEVER REACHES HERE. `preserveOrRegenerate` short-circuits
      KindTemplating before reading the file or consulting the seam, so one-shot
      recipes are untouched by all of this.
    * SPEC-054 AND apply.go ARE NOW A COUPLED PAIR. TASK-009's congruence test
      compares the spec's declared signature strings to the shipped type
      declarations textually, so a signature edit on EITHER side alone now fails
      `go test ./pkg/recipe/...` — not merely the gate. It has since been WIDENED
      from three types to ALL SEVEN `kind: type` entries SPEC-054 declares for
      `pkg/recipe/apply.go`: ApplyMode, ApplyOptions, TransformDispatch,
      WaiverReader, DivergenceVerdict, ApplyResult and PreservedDivergence. All
      seven were verified textually congruent at the time of widening, so it went
      green with no spec edits needed. Field NAMES, field TYPES and field ORDER are
      all load-bearing on both sides — falsifiability was DEMONSTRATED rather than
      assumed: a pure field-ORDER swap in ApplyOptions, with identical field names
      and identical types, is caught. The test also carries a COMPLETENESS check: if
      the spec later declares a type entry for that file which the test does not
      compare, the test FAILS naming it, so the guard cannot silently narrow over
      time into a record of one past edit. This is the intended design rather than
      an accident: the contracts dimension compiles every `kind: type` entry to the
      existence-only ast-grep pattern `type <Name> $$$`, which both a stale and a
      corrected signature satisfy, so nothing mechanical would otherwise catch the
      drift. The cost is that the spec and the source have to move in the SAME
      change. Do not resolve a future red by loosening the comparison to a substring
      or suffix check — that is the lossy form the test exists to eliminate; fix
      whichever side is actually wrong.
    * THE GUARD STOPS AT apply.go — FIVE TYPE ENTRIES ARE UNGUARDED. The spec writes
      its `signature:` strings WITHOUT Go struct tags while go/printer emits them, so
      the tag-bearing types declared in the OTHER pkg/recipe sources — RecipeManifest,
      Op and ParamSpec in the manifest source, AdoptionEntry and AdoptionRecord in the
      adoption source — compare as mismatches that are pure FORMATTING rather than
      real drift. Extending the guard past apply.go therefore first requires deciding
      whether the spec's signature convention includes struct tags: that is a
      convention call, not something a test should settle by quietly stripping them.
      Until it is made, those five entries are unguarded by the test AND invisible to
      the gate, which sees only the existence-only pattern above.
    * WIDENING A RETURN TYPE DOES NOT RESTATE ITS HOLDERS. `ApplyOptions` embeds
      `ReadWaivers WaiverReader`, so widening what `WaiverReader` RETURNS did NOT
      change `ApplyOptions`' signature string — the field's type NAME is unchanged.
      Only the type whose OWN declaration changed needed a spec edit. Do not
      "helpfully" edit every spec entry that merely mentions the seam.
    * DEFERRED — THE SPEC-AUTHOR-FACING FORM OF THE COUPLING WARNING IS NOT YET IN
      SPEC-054. This is a DELIBERATE deferral recorded here so it is not a silent
      drop, not an oversight. The completeness check described above lands its
      failure on a SPEC AUTHOR, not on a Go author: adding a new `kind: type` entry
