            - TestApply_DivergedWithMalformedWaiverToken_FailsLoudAndPreservesConsumerBytes
              (CLM-003): adopt the scaffolding fixture, write a divergence
              carrying "# @waiver:<declared rule>:intentional-fork:2099-01-01 ..."
              on line 4 via divergedWithTokenLine, re-apply with ReadWaivers nil.
              Assert Apply returns a NON-NIL error, and that the file on disk is
              STILL the consumer's diverged bytes byte-for-byte (the regenerated
              payload must NOT be there). Assert the returned ApplyResult is the
              zero value, matching Apply's existing failure contract.

            - TestApply_DivergedWithMalformedWaiverToken_DiagnosticNamesFileLineAndReasonCode
              (CLM-003): on the same setup, assert the error text names (a) the
              target AS REPORTED (the same value ApplyResult would carry — never a
              raw un-substituted declaration), (b) the token's line number, and
              (c) the illegal reason code "intentional-fork". Read the reason code
              back from the token the test wrote rather than retyping it. The
              underlying parse error is `waiver: unknown reason-code
              "intentional-fork"` (pkg/waiver/waiver.go:158); assert on the reason
              code substring, not on the whole sentence, so a wording change does
              not falsely red.

            - TestApply_CoveredDivergenceWithSeparateMalformedToken_PreservesAndReportsDiagnostic
              (CLM-012): write a divergence carrying BOTH a VALID covering token
              ("@waiver:<declared rule>:accepted-risk:2099-01-01") AND, on a
              different line, a separate malformed one
              ("@waiver:<declared rule>:intentional-fork:2099-01-01"). Assert:
                * Apply SUCCEEDS (coverage and hygiene are independent facts — an
                  unrelated typo must not revoke an accountable divergence);
                * the consumer's bytes are preserved verbatim and the target is
                  reported in result.Preserved with the VALID token as its
                  CoveringWaiver;
                * result.Diagnostics carries exactly ONE
                  waiver.DiagnosticMalformed entry naming the malformed token's
                  line and "intentional-fork".
              FALSIFYING TWIN, in the same test: the identical divergence with the
              valid token ONLY must yield an EMPTY result.Diagnostics. Without
              that twin, an implementation that stuffed every adjudication artifact
              into Diagnostics would pass.

            - TestApply_MultipleEnforcementRules_MalformedTokenReportedOnce
              (CLM-013): build a scaffolding recipe declaring THREE enforcement
              rules (a local template string in this file — do NOT edit
              regenerateRecipe, which other tests depend on). Diverge its output
              with ONE malformed token, re-apply, and assert exactly ONE
              DiagnosticMalformed is reported, not three. Supply an ApplyOptions
              .ReadWaivers wrapper that COUNTS its invocations and assert it was
              called once per declared rule — otherwise a "only the first rule is
              ever consulted" bug would pass this test for the wrong reason. Both
              halves are load-bearing: the count proves N adjudications happened,
              the dedupe proves they collapse to one report.

            - TestApply_MalformedTokenForAnotherRule_AlsoBlocks
              (CLM-005): two sub-cases on the same fixture, pinning the deliberate
              asymmetry.
                * "@waiver:some.other.rule:intentional-fork:2099-01-01" (MALFORMED,
