                  valid-token-only arm's empty stderr is what makes this
                  falsifiable: a preserve-and-drop implementation leaves stderr
                  empty in both.
              Assert the four stdout forms differ from each other where the plan
              says they must. The whole point of this claim is that a clobber is no
              longer indistinguishable from a clean re-apply, so an assertion
