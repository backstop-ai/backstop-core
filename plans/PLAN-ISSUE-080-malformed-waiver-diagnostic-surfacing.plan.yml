          own pack.yml / recipe.yml (the stagedRecipe convention,
          recipe_apply_e2e_test.go:57-80) — do not retype any of them as literals.

          Mandated test names (exact):

            - TestRecipeApply_CLI_MalformedWaiverTokenSurfacesDiagnosticOnStderr
              (CLM-009) — the issue's live field repro, end to end:
                1. Run `recipe apply <ref>`; assert exit 0 and that the declared
                   target now exists with the payload's bytes. This first run is
                   what makes the target RECIPE-OWNED (it writes
                   backstop-recipes.lock); the adopted state is produced by the
                   real command, never staged by hand.
                2. Overwrite the target with a consumer divergence carrying
                   "@waiver:<declared rule>:intentional-fork:2099-01-01" on a line
                   that is neither the first nor the second (the line contract).
                3. Run `recipe apply <ref>` again. Assert:
                     * exit code == ExitViolations (1);
                     * stderr is NON-EMPTY and names the target AND
                       "intentional-fork";
                     * stdout does NOT carry "applied recipe" — a run that
                       destroyed nothing and applied nothing must not claim success;
                     * the file on disk is STILL the consumer's diverged bytes,
                       byte-for-byte. This last assertion is the one that would
                       have caught the shipped defect: the pre-fix binary passes
                       every stream assertion trivially by exiting 0, and fails
                       this one.

            - TestRecipeApply_CLI_SuccessOutputNamesWrittenPreservedAndRegenerated
              (CLM-007/CLM-010/CLM-012) — the compounding gap, through the same
              binary. FOUR arms over fresh staged copies:
                * clean first apply -> stdout names the WRITTEN target, not merely
                  "applied recipe <ref>";
                * diverge + a VALID active token
                  ("@waiver:<rule>:accepted-risk:2099-01-01") -> re-apply exits 0,
                  the consumer bytes survive, stdout marks the target PRESERVED and
                  quotes the covering token, and stderr is EMPTY (no warning where
                  there is nothing to warn about);
                * diverge with NO token -> re-apply exits 0, the payload is back,
                  and stdout marks the target as REGENERATED OVER a local
                  divergence — textually DISTINCT from the clean-apply arm;
                * diverge with a VALID covering token PLUS a separate malformed one
                  -> re-apply exits 0, the consumer bytes survive, stdout marks the
                  target PRESERVED, and STDERR carries the malformed-token warning
