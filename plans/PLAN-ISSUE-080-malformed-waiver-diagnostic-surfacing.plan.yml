          closure (recipe_apply.go:73), which never sees the result. Change the
          signature to:

              func runRecipeApply(ref string, projectRoot string) (recipe.ApplyResult, error)

          Every existing early-return in that function returns
          `recipe.ApplyResult{}, <err>` (the zero result on failure, matching
          Apply's own contract). The tail returns the result alongside
          recordRecipeAdoption's error. In RunE, capture both, keep the existing
          ConfigError / ExitCodeError handling on the error EXACTLY as it is, and
          print the report from the returned result. Do not introduce a
          package-level variable or a second Apply call to get at the result.

          THE REPORT. Keep the existing headline (`applied recipe <ref>`) as the
          first line so nothing that already asserts on it breaks, then, on the
          SAME stream (cmd.Printf -> stdout), emit one line per outcome in the
          result's own slice order (which is the recipe's declared op order — never
          sorted, for the same reason Apply never sorts ops):

            - each result.Written target: name it as written, and when it also
              appears in result.Regenerated, mark that it OVERWROTE a local
              divergence with no covering waiver. That marking is the whole point
              of CLM-007: the operator must be able to see a clobber.
            - each result.Preserved entry: name the path, and when CoveringWaiver
              is non-empty quote the token that accounted for it; when it is empty
              say the file is the consumer's own (the user-owned branch never
              adjudicated anything, so there is no token to quote).
            - a run that wrote and preserved nothing says so explicitly rather
              than printing a bare headline that reads identically to a run that
              did work.

          THE WARNINGS. Each result.Diagnostics entry is printed to STDERR
          (cmd.PrintErrf), naming the file, the line and the diagnostic's message.
          Stream choice, deliberately: the REPORT of a successful run goes to
          stdout undivided — splitting a report across streams is what makes stream
          assertions unfalsifiable — while a WARNING is not part of the report and
          belongs on stderr, where it is separately assertable. The
          valid-token-only E2E arm asserting EMPTY stderr and the
          covered-plus-malformed arm asserting a warning there are what make this
          choice falsifiable in both directions.

          Do NOT add an Explained wrap for recipe apply: it is deliberately not one
          of SPEC-055's four explained sites, and the malformed-token diagnostic
          reaches stderr precisely BECAUSE reportError prints an unexplained
          ExitCodeError. Leave the error wrap at recipe_apply.go:60-71 as it is;
          the malformed-token error is a plain error, so it becomes ExitViolations
          and prints. Do not touch recordRecipeAdoption, the trust gate,
          provisionedEngineBinding, or transformDispatch.
        files:
          - cmd/backstop/recipe_apply.go
        claims:
          - CLM-007
          - CLM-009
          - CLM-010
          - CLM-012
        depends_on:
          - TASK-003
          - TASK-004

      - id: TASK-007
        type: verification
        title: "Run the cmd/backstop suite under -race -count=1 including the built-binary E2E"
        description: |
          Verify Phase 4 with the toolchain directly (no `backstop code check`
          command exists):

              go test ./cmd/backstop/... -race -count=1

          The E2E builds and drives the real binary, so this run proves the shipped
          command's behavior, not a library call. Confirm:
            - TestRecipeApply_CLI_MalformedWaiverTokenSurfacesDiagnosticOnStderr
              passes, INCLUDING its byte-for-byte survival assertion on the
              operator's edit — that assertion is the one the pre-fix binary fails;
            - TestRecipeApply_CLI_SuccessOutputNamesWrittenPreservedAndRegenerated
              passes with all four arms, including the empty-stderr /
              warning-on-stderr contrast between the valid-token-only and
              covered-plus-malformed arms;
            - the existing recipe CLI suites are unregressed —
              recipe_apply_e2e_test.go (in particular
              TestRecipeApply_CLI_UnreachableTargetRelaysDeclaredManualVerbatim),
              recipe_apply_trustgate_test.go, recipe_selfpack_test.go, and
              exit_surfacing_streams_test.go's
              TestExitSurfacing_RecipeApply_PrintsDiagnostic (SPEC-055 CLM-075 —
              the mechanism this plan builds on must stay green).

          If TestExitSurfacing_RecipeApply_PrintsDiagnostic reds, the error wrap or
          the Explained set was touched — revert that, it is out of scope. If a
          compile error points at runRecipeApply's callers, the signature change
          missed one; find them all rather than reverting the plumbing.
        files:
          - cmd/backstop/recipe_apply.go
          - cmd/backstop/recipe_apply_divergence_e2e_test.go
        claims:
          - CLM-007
          - CLM-009
          - CLM-010
          - CLM-012
        depends_on:
