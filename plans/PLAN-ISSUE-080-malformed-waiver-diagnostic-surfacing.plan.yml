      stays GREEN throughout, so the artifact tooling gives the editor no signal.
      That instruction currently lives ONLY in the test's own doc comment, which is
      discoverable only by someone already reading the test — exactly not the person
      who will trip it. WHAT IS DEFERRED: a bullet in SPEC-054's OWN Sharp Edges
      section stating the coupling in spec-author terms (add a type entry here → add
      the name to `contractedTypes()` in the same change). WHERE IT SHOULD LAND: the
      next natural SPEC-054 touch rather than a commit of its own — ISSUE-081
      (recipe authoring surface underspecified) is the likely one, since it already
      reopens the recipe authoring surface. WHY DEFERRED: SPEC-054 had just been
