      - id: TASK-003
        type: test
        title: "Write the failing process-level E2E driving the built binary over a malformed token"
        description: |
          Add cmd/backstop/recipe_apply_divergence_e2e_test.go. Every test here
          drives the BUILT BINARY — buildBackstopBinary (pack_authoring_loop_test.go:15)
          + runBackstopStreams (run_backstop_streams_test.go:31), the SEPARATED
          stdout/stderr helper. Do NOT use a merged CombinedOutput helper: against
          one buffer, "the diagnostic is on stderr" is unfalsifiable (the reasoning
