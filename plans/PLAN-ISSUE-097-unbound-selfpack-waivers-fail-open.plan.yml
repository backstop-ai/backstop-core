        files:
          - pkg/waiver/unbound_test.go
        claims:
          - CLM-004
          - CLM-005
          - CLM-006
          - CLM-007
        depends_on: []
        test_names:
          - TestWaiver_Unbound_FlagsTokenWhosePackNamespaceIsNotInstalled
          - TestWaiver_Unbound_BindsTokenWhosePackNamespaceIsInstalled
          - TestWaiver_Unbound_ExemptsRuleIDWithoutExtractablePackName
          - TestWaiver_Unbound_EmptyNamespaceSetYieldsNoDiagnostics
          - TestWaiver_HarvestTokens_ReadsTokenWithNoFindingPresent

      - id: TASK-002
        type: implementation
        title: "Implement HarvestTokens and Unbound in pkg/waiver"
        description: |
          Create pkg/waiver/unbound.go (NEW FILE). Do not edit adjudicate.go beyond
          what is unavoidable — and it should be avoidable entirely: `scanOccurrences`
          and `ParseToken` are already reachable from within the package.

          Add the third diagnostic kind constant beside the existing two. Put it in
          unbound.go, not adjudicate.go, so the new surface is one file:

            DiagnosticUnbound = "unbound"

          `HarvestTokens(file string, lines []string) []Waiver` — for each line, use
          the EXISTING `scanOccurrences` to find every `@waiver:` byte offset, then
          `ParseToken(line[col:], Location{File: file, Line: i+1})`. Append only
          tokens that parse without error. Lines are 1-INDEXED to match every other
          location in this package. Reuse both helpers; do not write a second scanner
          — the zero-baked byte-scan property (package doc, REQ-002) is a single
          implementation or it is nothing.

          `Unbound(tokens []Waiver, namespaces []string) []Diagnostic` —
            · Return nil immediately when len(namespaces) == 0 (SE3, CLM-006).
            · For each token, extract the candidate pack name: split RuleID on "/";
              if fewer than 3 segments, SKIP (CLM-005); else candidate is
              segments[0] + "/" + segments[1].
            · If candidate is in namespaces, skip. Otherwise emit
              Diagnostic{RuleID: token.RuleID, File: token.File, Line: token.Line,
              Kind: DiagnosticUnbound, Message: ...}.
            · The Message must name BOTH the unresolvable pack name and the remedy,
              because the reader's next question is always "so what do I type": say
              that the token's pack namespace matches no pack in backstop.lock, and
              that the token suppresses nothing until it is re-keyed or removed.
            · Preserve input order. Determinism is not decoration here — this string
              lands in gate output that gets diffed across runs.

          The three-segment rule is a property of `pack.NamespacedRuleID`'s
          `<org>/<pack>` + `/` + rule-id construction. Say that in a comment, in one
          line, because a future reader will otherwise read it as an arbitrary
          magic number. Do NOT import pkg/pack to express it — pkg/waiver is pure and
          takes no pack dependency.

          SE5 applies to the split written here.
        files:
          - pkg/waiver/unbound.go
        claims:
          - CLM-004
          - CLM-005
          - CLM-006
          - CLM-007
        depends_on:
          - TASK-001

      - id: TASK-003
        type: verification
        title: "Gate the pure unbound classifier"
        description: |
          Run `./bin/backstop gate --file pkg/waiver/unbound.go` and
          `./bin/backstop gate --file pkg/waiver/unbound_test.go`.

          NEVER invoke a bare `backstop` — always `./bin/backstop`, and rebuild it
          first if the binary predates this phase's edits. Export
          `PATH=/Users/bmanson/go/bin:$PATH` so go-arch-lint resolves; without it the
          architecture engine silently no-ops and the run is vacuously green.

          All five TASK-001 tests must now pass. Confirm the RED output recorded in
          TASK-001 is genuinely resolved by TASK-002 and not by a test edit.
        files:
          - pkg/waiver/unbound.go
          - pkg/waiver/unbound_test.go
        claims:
          - CLM-004
          - CLM-005
          - CLM-006
          - CLM-007
        depends_on:
          - TASK-002

