             the repo on a tree with no lock. Stay silent instead.
             TESTS: TestWaiver_Unbound_EmptyNamespaceSetYieldsNoDiagnostics

    CLM-007  THE HARVEST IS FINDING-INDEPENDENT. `HarvestTokens` byte-scans raw
             lines for the literal `@waiver:` marker and returns well-formed
             tokens with NO Finding ever constructed — the architectural break
             from `Adjudicate`'s two-line association window, stated as a test.
             Multiple tokens on one line are all returned; malformed tokens are
             SKIPPED rather than returned half-parsed, because `Adjudicate` owns
             malformed reporting and duplicating it would double-report. The
             zero-baked property is preserved: no language identifier, no comment
             lexer, raw bytes only, reusing the existing `scanOccurrences` and
             `ParseToken`.
             TESTS: TestWaiver_HarvestTokens_ReadsTokenWithNoFindingPresent

    CLM-008  LOUD BUT NON-BLOCKING. An unbound token surfaces as a
             waiver_resolution Violation at severity exactly "warning", for which
             the REAL `blocksVerdict` predicate returns false, so `GateResult.Pass`
             stays true and the exit code stays 0 — a routine pack rename stays
             landable. The `waiverReason` string gains a `; N unbound (<rule-ids>)`
             clause naming EVERY unbound rule-id beside the existing active /
             expiring / unused clauses, which are unchanged.
             TESTS: TestGate_WaiverUnbound_SurfacesAsNonBlockingWarning,
                    TestGate_WaiverUnbound_DoesNotFlipGateVerdict,
                    TestGate_WaiverUnbound_ReasonNamesEachUnboundRuleID

    CLM-009  THE PRODUCTION PATH IS WIRED, LOCK-KEYED, AND SCOPE-INDEPENDENT.
             Namespaces come from the TRACKED `backstop.lock`, not the gitignored
             `.backstop/packs/`, so a fresh clone does not declare every pack
             waiver unbound. The scan is reached through the REAL gate
             construction site — a unit test of the harvest function alone cannot
             detect an unwired Option, which is exactly how SPEC-049 shipped a
             subsystem that suppressed nothing. And the harvest computes its own
             all-mode file list rather than reading the gate run's active scope,
             so a diff-scoped run and an `--all` run report an IDENTICAL unbound
             clause and count.
             TESTS: TestUnboundWaiverNamespaces_ReadFromLockNotInstalledPacks,
                    TestGate_UnboundWaiverScanWiredAtConstructionSite,
                    TestGate_UnboundWaiverScan_IdenticalAcrossScopes

    CLM-010  `backstop waiver list` NAMES UNBOUND TOKENS in an always-labeled
             section, present even at count ZERO, matching how the Active /
             Expiring / Unused sections are always labeled. A section that
             disappears when empty is how this class of rot hid in the first
             place.
             TESTS: TestWaiverList_NamesUnboundTokens

    CLM-011  PRECISION — THE FILTERS THAT MAKE THE WARNING WORTH READING.
             Artifact KIND directories are excluded (F1) and `testdata` directory
             SEGMENTS are excluded (F2) via the existing `excludeTestdataPaths`,
             with no second implementation and no inlined literal. F1 resolves
             per-kind `Root.Dir(kind)` paths and NOT `Root.Path`: this repo
             declares no `artifact_root`, so a `Root.Path` prefix test would drop
             every file in the repository and the check would report nothing,
             forever. The unconfigured-root leg is the load-bearing half of the
             test for that reason.
             TESTS: TestUnboundWaiverHarvest_ExcludesArtifactRootAndTestdata

    CLM-012  THE STEP VERDICT BECOMES SEVERITY-DERIVED. `computeWaiverResult`'s
             hardcoded `status := "pass"; if len(wv) > 0 { status = "fail" }` is
             replaced by `StepVerdict(wv)`. That raw count is only ACCIDENTALLY
             correct today, because every diagnostic it emits is severity
             `error`; adding a warning-severity kind turns a warning into a hard
             gate failure. With only unbound diagnostics the step reports
             "warning" — not "fail", and not "pass", which would make a surfaced
             warning invisible — while a malformed token still reports "fail",
             proving the existing error path was not softened.
             TESTS: TestGate_WaiverUnbound_StepStatusIsWarningNotFail

