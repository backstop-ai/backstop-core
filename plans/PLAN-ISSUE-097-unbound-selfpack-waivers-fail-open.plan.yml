  ARCHITECTURE — three layers, deliberately separated
  ══════════════════════════════════════════════════════════════════════════════
  LAYER 1 · `pkg/waiver/unbound.go` (PURE). Two exported functions, no file I/O,
  no pack knowledge, no config:
    · `HarvestTokens(file string, lines []string) []Waiver` — byte-scans raw
      lines for the literal `@waiver:` marker using the EXISTING
      `scanOccurrences` + `ParseToken`, and returns the well-formed tokens.
      Malformed tokens are SKIPPED here; `Adjudicate` owns malformed reporting
      and duplicating it would double-report. (Tree-wide malformed detection is
      a real residual gap — see FOLLOW-ONS.) The zero-baked property is
      preserved unchanged: no language identifier, no comment lexer, raw bytes
      only.
    · `Unbound(tokens []Waiver, namespaces []string) []Diagnostic` — returns one
      `Diagnostic{Kind: DiagnosticUnbound}` per token whose extracted
      `<org>/<pack>` name is in none of `namespaces`. Implements F3.
    Plus the new `DiagnosticUnbound = "unbound"` kind constant alongside
    `DiagnosticMalformed` / `DiagnosticNonWaivable`.

  LAYER 2 · `pkg/gate` (SURFACING). A new Option carries the already-harvested
  tokens and the known namespaces into the Gate; `computeWaiverResult` calls
  `waiver.Unbound` and appends the diagnostics as violations at severity
  `warning`, and renders `; N unbound (<rule-ids>)` into `waiverReason`.
  pkg/gate does no file walking and reads no lock.

  LAYER 3 · `cmd/backstop` (PRODUCTION HARVEST + CLI). Enumerates files, applies
  F1/F2, reads the namespaces from `backstop.lock`, and wires both the gate
  construction site and `backstop waiver list`.

  ══════════════════════════════════════════════════════════════════════════════
  WHY `backstop.lock` IS THE NAMESPACE AUTHORITY, NOT THE INSTALLED MANIFESTS
  ══════════════════════════════════════════════════════════════════════════════
  `buildWaiverPolicy` reads namespaces from `loadInstalledPacks`, which walks
  `.backstop/packs/` — a GITIGNORED directory. On a fresh clone, or any tree
  where packs have not been installed, that returns nothing, and a check keyed
  to it would declare EVERY pack-namespaced waiver in the repo unbound. That is
  a false-positive storm triggered by a normal, supported state.

  `backstop.lock` is TRACKED and is the project's durable record of pack
  identity (CLAUDE.md: "the lock file is the durability boundary"). Its entries'
  `name` field is the same normalized `<org>/<pack>` that
  `pack.NamespacedRuleID` prefixes findings with, so it is not merely available
  — it is the correct authority. Read it via
  `distribution.ReadLockfile(filepath.Join(projectRoot, "backstop.lock"))`.
  The issue's own acceptance criterion says `backstop.lock` in as many words.

  ══════════════════════════════════════════════════════════════════════════════
  WHY THE CHECK IS SCOPE-INDEPENDENT (verified, not assumed)
  ══════════════════════════════════════════════════════════════════════════════
  ISSUE-097's 2026-08-16 "Additional evidence" entry requires the fix to surface
  "regardless of gate scope, not just on a full sweep", because this project's
  day-to-day loop is the diff-scoped `backstop gate`. Two facts make that
  achievable and were both confirmed against the tree:

    · The production harvest computes its OWN file list via
      `gate.ComputeGateScope(projectRoot, gate.GateScopeModeAll, nil)` — the
      single existing authority on "every file in the project" — and NEVER reads
      the gate run's active scope. So a diff-scoped run harvests the same tree
      an `--all` run does.
    · `waiver_resolution` violations are NOT scope-filtered — but NOT for the
      reason an earlier revision of this plan gave. That revision claimed a
      single `FilterViolations` call site; there are FOUR. Measured, non-test:
      the EXPORTED `(*GateScope).FilterViolations` is called once, at
      `cmd/backstop/gate.go`'s pack_engines dispatch; the unexported
      `filterViolations` is called three more times, at `pkg/gate/baseline.go`
      (inside `CompareBaseline`) and twice in `pkg/gate/step_delegate.go`.

      THE REAL MECHANISM is `accumulatedViolations` in `pkg/gate/gate.go`, which
      builds the slice handed to `CompareBaseline` and EXPLICITLY SKIPS
      `StepWaiverResolution` (along with `StepBaselineComparison` and
      `StepLedgerIntegrity`). So the baseline call site never sees a waiver-step
      violation to filter. The `step_delegate.go` sites filter only delegated
      steps' own violations, and `waiver_resolution` is not one; the pack_engines
      site filters only engine findings. `ApplyPolicy` touches only steps that
      carry an explicit policy entry. The conclusion stands — nothing downstream
      drops a waiver-step violation for being outside the diff — but it stands on
      `accumulatedViolations`'s skip list, and THAT is the line to re-check if
      this ever regresses.

  ══════════════════════════════════════════════════════════════════════════════
  WHY `warning`, AND WHY THAT IS ALREADY FIRST-CLASS
  ══════════════════════════════════════════════════════════════════════════════
  CLAUDE.md: "Loud ≠ blocking. Block defects + broken promises; warn-with-
  guidance for un-adopted capability." An unbound waiver is rot, not a broken
  promise, and blocking on it would make a routine pack rename un-landable.

  The vocabulary already exists and must be REUSED, not reinvented:
  `blocksVerdict` (`pkg/gate/policy.go`) treats severity `warning` — and ONLY
  `warning` — as non-blocking, and `StepVerdict` returns the tri-state
  pass/warning/fail so a warning-only step reports "warning" (counted in
  `StepsWarned`, visible in the summary) rather than "pass" (invisible).

  ONE REAL CHANGE FALLS OUT OF THIS. `computeWaiverResult` currently hardcodes
  `status := "pass"; if len(wv) > 0 { status = "fail" }`. Today that is
  ACCIDENTALLY correct because every diagnostic it emits (malformed,
  non-waivable) is severity `error`. Add a warning-severity diagnostic and that
  line turns a warning into a hard gate failure. It must become
  `StepVerdict(wv)` — behavior-identical for the existing two kinds, correct for
  the third. This is CLM-012 and it is not optional cleanup.

