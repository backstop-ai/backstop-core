phases:
  - id: phase-1
    name: "Phase 1: Tree-driven harvest and unbound classification (pure core)"
    tasks:
      - id: TASK-001
        type: test
        title: "Falsify the unbound-waiver classifier and the finding-independent harvest"
        description: |
          Create pkg/waiver/unbound_test.go (NEW FILE — do not extend any existing
          adjudicate_*_test.go, all of which belong to Adjudicate's finding-driven
          path this work deliberately leaves alone).

          Every fixture is SYNTHETIC and in-memory: a `[]string` of raw lines and a
          hand-written `[]string` of namespaces. No file I/O, no lock, no real pack
          names required (SE6). These tests must still pass unchanged after
          TASK-011 re-keys the live tree.

          MANDATED TESTS:

          TestWaiver_Unbound_FlagsTokenWhosePackNamespaceIsNotInstalled (CLM-004) —
            THE FALSIFICATION. Harvest a token keyed
            `backstop/self/backstop.packs.backstop.self.rules.no-structural-name-split-on-spine`
            and call Unbound with namespaces `["backstop-ai/backstop-self"]`.
            Assert exactly one Diagnostic, its Kind is DiagnosticUnbound, and its
            RuleID is the token's full rule-id (not the extracted pack name — the
            reader needs the string they must edit). Assert File and Line carry the
            token's own location so the warning is navigable.
            MUST FAIL on the current tree — the symbol does not exist. Record it.

          TestWaiver_Unbound_BindsTokenWhosePackNamespaceIsInstalled (CLM-004) —
            the assertion that keeps the one above honest. The SAME token re-keyed to
            `backstop-ai/backstop-self/...`, same namespace list, yields ZERO
            diagnostics. Without this leg a function returning one diagnostic per
            token unconditionally would pass the test above.

          TestWaiver_Unbound_ExemptsRuleIDWithoutExtractablePackName (CLM-005) —
            table-driven over ids with fewer than three `/`-segments, each against a
            namespace list that contains none of them. EVERY one yields zero
            diagnostics.

            Use ids MEASURED as real F3 removals in this repo, not plausible-looking
            invented ones: `coverage_threshold` (no slash at all — a real core
            dimension id waived at cmd/backstop/pack_upgrade.go), `pkg-rule` and `r`
            (pkg/waiver/waiver_grammar_test.go), `mystery-rule`
            (pkg/waiver/adjudicate_core_test.go), and `some.other.rule`
            (pkg/recipe/apply_regenerate_test.go). One-segment and two-segment cases
            are both represented, which is the axis that matters.

            DO NOT use `pkg/rule-a`, `pkg/ghost`, `pkg/expiring`, `secrets/aws-key`
            or `go-standards/line-length` and DO NOT describe them as this repo's
            measured F3 surface. An earlier revision did; measurement showed every
            occurrence of those is dropped as MALFORMED before F3 runs, so citing
            them as F3's justification misstates why the filter is needed. They are
            fine as ADDITIONAL synthetic shapes if you want more table rows — just
            do not claim provenance they do not have.

          TestWaiver_Unbound_EmptyNamespaceSetYieldsNoDiagnostics (CLM-006) — SE3.
            A perfectly ordinary three-segment token plus a nil namespace slice, and
            separately an empty non-nil slice, both yield ZERO diagnostics. Assert
            with a token that DOES produce a diagnostic under a populated list, so
            the test proves the empty-set guard fired rather than that the token was
            unclassifiable.

          TestWaiver_HarvestTokens_ReadsTokenWithNoFindingPresent (CLM-007) — the
            architectural claim, stated as a test. Hand HarvestTokens raw lines
            containing an `@waiver:` token and assert it is returned WITHOUT any
            Finding ever being constructed. Assert the parsed Waiver's RuleID,
            Reason, Expiry and Line are all populated from the raw bytes. Include a
