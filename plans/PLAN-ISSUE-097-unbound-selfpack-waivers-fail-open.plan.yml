  ══════════════════════════════════════════════════════════════════════════════
  WHY A TREE-DRIVEN HARVEST IS THE WHOLE POINT
  ══════════════════════════════════════════════════════════════════════════════
  `waiver.Adjudicate` NEVER scans the tree. It reads only the two-line
  association window of each finding it was HANDED (`harvestWindow` /
  `windowLines`, `pkg/waiver/adjudicate.go`). A token on a line where its own
  rule no longer fires is never read into the `tokens` map at all — so it cannot
  even reach the `Unused` bucket, which classifies only tokens that WERE
  harvested. That is why `waiver_resolution` prints "clean — no active waivers"
  (`pkg/gate/step_waiver.go`, `waiverReason`) over a tree carrying five dead
  tokens.

  ISSUE-097's own "Measured confirmation" entry is the dated proof: before
  PLAN-ISSUE-091 landed, two of these tokens happened to sit one line above a
  live finding, so `harvestWindow` caught them and they showed up as
  "2 unused/dangling". After 091 landed, no finding lands there under any
  dispatch shape, and the count for those two went 2 → 0. THE EVIDENCE
  DISAPPEARED; THE DEFECT DID NOT. A dangling count that falls because the
  witness left is a loss of honesty, not a cleanup. The check built here does
  not depend on a witness.

