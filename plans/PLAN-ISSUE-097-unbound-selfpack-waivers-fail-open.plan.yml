  SHARP EDGES
  ══════════════════════════════════════════════════════════════════════════════
  SE1 · RE-KEY MEANS RE-KEY. ONLY the rule-id changes. The three
        `tests/smoke/smoke_test.go` tokens carry `deferred:2026-10-24` because
        self-pack scoping over backstop-core's OWN test harness is an ESCALATED,
        undecided founder posture question. Silently promoting them to
        `false-positive` would launder an open decision into a settled one and
        would extend their life from ~2 months to a year. Preserve reason-code,
        expiry date, and the full trailing note BYTE-FOR-BYTE. Same for the two
        `false-positive:2027-07-17` tokens.

  SE2 · RE-KEYING CAN CONVERT AN INVISIBLE FAIL-OPEN INTO A HARD RED, AND THAT
        WOULD BE CORRECT BEHAVIOR — but it must not be a surprise. A token
        binding a rule the pack declares `non_waivable: true` does NOT suppress;
        `computeWaiverResult` emits a severity-`error` NonWaivable diagnostic and
        the gate goes red. Grep of `.backstop/packs/backstop-ai/backstop-self/
        pack.yml` at v1.1.3 found NO `non_waivable` key at all, so this is
        currently safe — but the pack is external and versioned independently.
        RE-VERIFY at implementation time. If any of the three rules has since
        gained `non_waivable: true`: STOP, do not re-key that token, and
        escalate — the correct answer is a posture decision, not a plan edit.

  SE3 · AN EMPTY OR ABSENT LOCK MUST YIELD ZERO DIAGNOSTICS, NOT EVERYTHING.
        "No namespaces known" is indistinguishable from "no pack is legitimate",
        and the fail-loud reading flags every pack waiver in the repo. Stay
        silent instead. This is CLM-006 and it gets its own mandated test.

  SE4 · DO NOT ADD A DOT-DIRECTORY SKIP. `resolveGateScopeAll` already skips
        every `.`-prefixed directory, which is what keeps `.backstop/packs/`
        rule files and `.claude/agent-memory/` notes (both of which contain
        @waiver examples) out of the harvest. Adding a second skip would create
        a second authority that drifts from the first.

  SE5 · THE IMPLEMENTER'S OWN SPLIT MAY TRIP A SELF-PACK RULE. Extracting
        `<org>/<pack>` from a rule id is a string split, and
        `no-structural-name-split-on-spine` is exactly the rule the first two
        stale tokens waive. If it fires on the new code: fix it if the finding is
        real, or waive it with a CORRECTLY-keyed token derived from the current
        pack name. Under NO circumstances copy the stale `backstop/self` prefix
        from the neighbouring lines — that would author a seventh instance of the
        very defect this plan closes.

  SE6 · THE UNIT TESTS MUST NOT ASSERT AGAINST THE LIVE TREE. After TASK-011 the
        repo holds ZERO unbound tokens, so any unit test that measured the real
        repo would be vacuously green forever. Every test in Phases 1–3 uses
        synthetic in-memory fixtures. EXACTLY ONE test reads the live tree —
        TASK-010's — and its whole value is that it is RED before TASK-011 and
        GREEN after. Capture that red output; a repo-invariant test that was
        never observed failing is indistinguishable from one that cannot fail.

  SE7 · THE RE-KEYED TOKENS WILL STILL SUPPRESS NOTHING, AND THAT IS THE
        INTENDED END STATE. ISSUE-151 owns the separate defect (explicit-file
        dispatch is blind to directory-prefixed `paths.include` globs) that keeps
        `no-structural-name-split-on-spine` from producing a finding under any
        current dispatch shape. This plan does NOT fix that and must not try. The
        deliverable for part (a) is a CORRECTLY-KEYED DORMANT waiver — one that
        will bind the instant the rule fires again — not a live suppression. Do
        not go hunting for the finding, and do not conclude the re-key failed
        because `gate --file --json` shows nothing.

  SE8 · CONCURRENT EDITS IN THE cmd/backstop FILES. `pack_gate.go` and
        `pack_gate_provision.go` were both edited by other lanes tonight
        (PLAN-ISSUE-091, -112, -134 among them). Locate every token by its
        ENCLOSING FUNCTION (`splitCommand`, `engineToolName`) and by the rule-id
        string. Every line number in this plan is ORIENTATION, NOT AN ADDRESS.

  SE9 · INHERITED RED AT `gate --all` IS NOT THIS PLAN'S TO WAIVE. Several lanes
        landed tonight. If the final sweep shows a failure this plan did not
        cause, prove it with a clean-HEAD control reading, name the owning issue,
        and RECORD it. Never waive it, and never weaken a test to clear it.

  SE10 · CROSS-LANE COLLISION ON `pkg/gate/step_verdict_severity_test.go`. That
        file's `TestClass3Sites_ViolationsAreErrorSeverityByConstruction` has
        several numbered SITE blocks, and TWO in-flight plans edit it right now.
        The ownership split is EXPLICIT and RECIPROCAL:

          · THIS PLAN (PLAN-ISSUE-097) OWNS SITE 1 — the `waiverDiagToViolation`
            block. TASK-005 changes that function's signature and deletes the
            raw-count premise SITE 1 was written to protect.
          · PLAN-ISSUE-106 OWNS SITE 2 — the substantiveness JOIN block. It is
            being told the mirror image of this note in its own fix round.

        Whichever plan lands second inherits a file the other already edited.
        Before considering its own task complete, the SECOND lander must re-read
        the whole test, confirm it still compiles and asserts what it claims, and
        re-run `go test ./pkg/gate/... -race -count=1`. An implementer who finds
        an UNEXPECTED change at the site this plan does NOT own must STOP and
        report a genuine collision rather than silently resolving it — a quiet
        merge here produces a test that compiles while asserting nothing.

