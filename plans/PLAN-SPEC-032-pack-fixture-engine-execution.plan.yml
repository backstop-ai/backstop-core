        title: "Rewrite RunFixtures onto engine dispatch"
        description: |
          Modify pkg/packval/phase3.go.

          Replace the per-tool RunSemgrep/RunToolConfig loops with a single
          findings dispatch over both Content.Ruleset.Rules and ToolConfig
          entries (containers stay separate; both resolve a binding and run
          through RunEngine):

          1. Resolve the binding. For each findings rule and each
             ToolConfigEntry, resolve its EngineBinding from the shared Registry
             (pkg/pack/engine) by map lookup keyed on the declared engine
             (ToolConfigEntry defaults to the config-file binding keyed by
             `tool` when engine is empty). On a miss, append a hard, blocking
             ValidationError naming the rule and the unresolved engine — no
             silent skip, no semgrep fallback (REQ-007, CLM-027/028/029).
          2. Rule-ID precheck (engine-keyed). ENFORCE the existing
             semgrepFileContainsRuleID check ONLY for the rule-flags input mode;
             SKIP it for none, config-file, and rule-dir (ast-grep out of scope)
             — never run-and-fail for a mode it does not cover (REQ-008,
             CLM-030..033, CLM-037).
          3. Go-mod-tidy pre-check (conditioned). Run goModTidyTempCopy ONLY when
             the resolved engine is the Go config-file engine (golangci-lint);
             never for semgrep, ast-grep, or a non-Go config-file linter
             (REQ-010, CLM-038/039/040).
          4. Gather + run via executor.RunEngine, passing the resolved binding,
             rule ID, rule files, and fixture path.
          5. Apply the fixture contract on Flagged (ExecutionResult.Passed):
             positive passes iff NOT flagged; negative passes iff flagged. A
             RunEngine error is a hard fixture error (REQ-004, CLM-016..020).
          6. On a negative fixture that is not flagged, emit the existing
             engine-limitation fix hint on the ValidationError, for EVERY
             findings engine (REQ-005, CLM-021/022).

