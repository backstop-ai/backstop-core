                by the issue is
                `TestSubstantivenessFixtures_RealPackTestPassesPhase3`
                (`cmd/backstop/substantiveness_fixture_polarity_test.go`).
            ★ THE VIOLATION COUNT IS NOT A CONFIRMATION CRITERION — DO NOT COMPARE IT TO
            THE 62. The two numbers are not comparable, because the runs are not
            comparably scoped: CI's blocking gate is DIFF-SCOPED (`gate --base "$BASE"`,
