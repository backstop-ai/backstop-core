        title: "Hand the real verification to CI: name what to watch, record the ceiling, file the adjacent hole, close nothing early"
        description: |
          THIS TASK IS THE POINT OF THE PLAN'S CAREFULNESS. Everything before it proves the
          edit is safe; only this proves it WORKED — and it cannot be discharged from this
          machine (see the VERIFICATION CEILING section).

          EVERY ARTIFACT TOUCH HERE IS ROUTED THROUGH `/issue` (the issue-author agent).
