      - id: TASK-003
        type: verification
        title: "Verify everything darwin CAN verify — compile, vet, the two new pins, and the unchanged package suite"
        description: |
          ★ READ THE VERIFICATION CEILING SECTION IN THIS PLAN'S HEADER BEFORE STARTING.
          This task deliberately does NOT ask you to reproduce ISSUE-163 or to confirm the
