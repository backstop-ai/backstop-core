          (2) NAME THE CI RUN TO WATCH, AND WHAT WOULD COUNT AS CONFIRMATION.
          Workflow `.github/workflows/ci.yml`, job `gate` (display name "Backstop Gate"),
          `runs-on: ubuntu-latest`. Blocking step: `./bin/backstop gate --base "$BASE"`.
          The step before it writes `gate-report.json`, uploaded as the `gate-report`
