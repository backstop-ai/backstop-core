  ★★ THE VERIFICATION CEILING — READ THIS BEFORE PLANNING ANY "PROVE IT" STEP ★★
  ══════════════════════════════════════════════════════════════════════════════
  THIS DEFECT CANNOT BE REPRODUCED OR CONFIRMED-FIXED ON THIS MACHINE. Not "is hard
  to", not "was not tried" — CANNOT. `pkg/packval/sandbox_linux.go` and
  `pkg/packval/sandbox_linux_helper.go` carry `//go:build linux`; on darwin they are
  not compiled at all, `newSandboxHelperCommand` does not exist, no re-exec ever
  happens, and `MaybeRunSandboxHelper` resolves to the `!linux` stub
  (`pkg/packval/sandbox_nonlinux.go`: `func MaybeRunSandboxHelper() error { return nil }`).
  Setting `BACKSTOP_SANDBOX_HELPER_SPEC` by hand on darwin proves NOTHING — the stub
  ignores it.

  So NO TASK IN THIS PLAN MAY MANDATE "run the failing test and watch it pass." Any
  report claiming a local repro or a local fix-confirmation of the Linux behavior is
  FALSE GROUNDING and must be rejected in review.

  What is genuinely establishable locally, and is therefore what Phase 2 asks for:
    (a) the module still builds and vets — `go build ./...`, `go vet ./cmd/backstop/...`;
    (b) the darwin side is PROVABLY UNCHANGED — the whole `cmd/backstop` package suite
        still passes, which is only possible if `TestMain`'s build-and-run path still
        works, because every test in the package depends on the `binaryPath` it builds;
    (c) the guard is STRUCTURALLY in the right place — asserted by AST, not by eye.
  (b) is a real proof, not a consolation prize: it is exactly the risk the edit carries
  on the platform we can measure. It is NOT a proof of (the Linux fix).

