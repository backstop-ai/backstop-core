          WRITE A SHORT COMMENT ABOVE THE GUARD, in your own words, carrying the two facts
          a future reader needs and cannot infer: (i) under `go test` the sandbox
          trampoline re-execs THIS TEST BINARY with its working directory set to the pack
          directory, so without this gate the unconditional `go build` below dies with
          "no Go files in <dir>" before the helper is ever recognised — which is ISSUE-163;
          (ii) a successful call in helper mode NEVER RETURNS, and a non-nil error means
          this process IS a helper whose sandbox failed to install, so running the suite
          at that point would hand the parent the suite's output as the sandboxed
          command's output. Point at `pkg/packval/main_test.go` and `cmd/backstop/main.go`'s
          `runWith` as the other two members of the same wiring family.

          DO NOT TOUCH `cmd/backstop/main.go`, `pkg/packval/**`, `tests/smoke/**`, or
          `.github/workflows/ci.yml`. All are already correct or deliberately out of scope.

          Run `backstop gate` after this task, as the implementer contract requires.
        files:
