notes: |
  ISSUE-163 — `cmd/backstop/integration_test.go`'s `TestMain` runs `go build -o <tmp> .`
  as its very first action with no sandbox-helper check. On Linux, any test in package
  `cmd/backstop` that triggers real sandboxed dispatch causes the sandbox trampoline to
  RE-EXEC THIS TEST BINARY with `Dir` set to the pack directory — so the re-exec'd copy
  re-enters `TestMain`, tries `go build` in a directory with no `.go` files, prints
  `failed to build binary: ... no Go files in <dir>` and `os.Exit(1)` BEFORE
  `runSandboxHelper` ever reads `BACKSTOP_SANDBOX_HELPER_SPEC`. The pack's real command
  never runs.

  ★ THE FIX IS FIVE LINES AND FULLY PRECEDENTED. `pkg/packval/main_test.go`'s `TestMain`
  already does it correctly, and `cmd/backstop/main.go`'s `run()` does it for the SHIPPED
  BINARY via `runWith(stdout, stderr, packval.MaybeRunSandboxHelper, NewRootCommand)`.
  This plan is deliberately small. Its real weight is not the edit — it is the HONEST
  VERIFICATION CEILING (see the next section), and the two structural pins that stop the
  pattern from failing to propagate a third time.

