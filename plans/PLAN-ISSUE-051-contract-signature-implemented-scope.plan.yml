notes: |
  ─────────────────────────────────────────────────────────────────────────
  THE CHANGE (one predicate + one filter + tests) — from the verified
  investigation attached to ISSUE-051; do NOT re-derive
  ─────────────────────────────────────────────────────────────────────────
  Root cause: ExtractContractEntries (pkg/gate/step_testverify.go:509) skips
  ONLY terminal specs (`if isTerminalSpecStatus(fm.Status) { continue }`,
  :526-528). It therefore extracts contracts from `draft` and
  `ready-for-implementation` specs whose code does not exist yet, and hands
  them to the Go signature compiler, which correctly reports "symbol not
  found" — 104 false positives, all from the unbuilt init/release suite
  SPEC-020..029 (children of BUNDLE-003).

  Spec lifecycle (artifacts/spec/v1/schema.json):
    LIVE     = draft → ready-for-implementation → implemented
    TERMINAL = replaced / canceled / deprecated / obsoleted
  Contracts are only DUE at `implemented`. A draft / ready-for-implementation
  spec's contracts describe intended future code, not a broken promise.

  ─────────────────────────────────────────────────────────────────────────
  CHOSEN SHAPE — positive predicate `contractsAreDue` (NOT the isTerminal
  extension). Rationale locked; do NOT re-open.
  ─────────────────────────────────────────────────────────────────────────
  Add one small unexported helper in step_testverify.go, mirroring
  isTerminalSpecStatus as the single source of truth for this exclusion:

      // contractsAreDue reports whether a spec's contracts are held as a live
      // promise. Contracts are due ONLY once a spec reaches `implemented`
      // (ISSUE-051): pre-implementation specs (draft, ready-for-implementation)
      // describe intended future code, and all terminal specs (replaced,
      // canceled, deprecated, obsoleted) are retired — neither is enforced.
      func contractsAreDue(status string) bool {
          return status == "implemented"
      }

  In ExtractContractEntries, REPLACE the terminal-only skip (:526-528) with:

      if !contractsAreDue(fm.Status) {
          continue // contracts are due only at `implemented` (ISSUE-051)
      }

  WHY the positive form is chosen over extending isTerminalSpecStatus:
    1. It excludes draft + ready-for-implementation AND every terminal status
       in ONE predicate — no need to enumerate the pre-impl statuses AND keep
       the terminal skip.
    2. It closes a PRE-EXISTING GAP for free: isTerminalSpecStatus
       (:166-173) returns true for replaced/canceled/deprecated but NOT
       `obsoleted` (obsoleted is terminal per the schema; the helper predates
       ISSUE-048 adding it). The positive predicate excludes obsoleted
       correctly on the contract path WITHOUT touching isTerminalSpecStatus —
       so the shared helper (still used by the deferred ExtractSpecVerifications
       and the mandated-test step) keeps its exact current behavior and blast
       radius stays zero outside ExtractContractEntries.
    Note the obsoleted-in-isTerminalSpecStatus gap only as an observation; do
    NOT widen scope to fix isTerminalSpecStatus here — that shared helper feeds
    the deferred sibling and other steps.

  ─────────────────────────────────────────────────────────────────────────
  EXPLICITLY OUT OF SCOPE — the deferred sibling (leave alone, say so)
  ─────────────────────────────────────────────────────────────────────────
  ExtractSpecVerifications (step_testverify.go:465), feeding test_verification
  and coverage_threshold, has the IDENTICAL terminal-only filter (:482-484)
  and the same latent "pull enforcement from unbuilt draft specs" behavior.
  Fixing it is EXPLICITLY DEFERRED — the founder has parked the 342-finding
  test_verification broken-promise backlog (see ISSUE-012). This plan touches
  ONLY the contract path. isTerminalSpecStatus and ExtractSpecVerifications
  MUST remain byte-for-byte unchanged; CLM-005 pins that.

  ─────────────────────────────────────────────────────────────────────────
  RECONCILIATION BLAST RADIUS (existing tests that assumed non-implemented
  specs get their contracts extracted — they must flip to `implemented`)
  ─────────────────────────────────────────────────────────────────────────
  Several existing tests stage specs that are NOT `implemented` yet assert
  their contracts ARE extracted. Under the fix they extract 0 and break. They
  are correct in INTENT (scope-population, absence parsing, happy-path
  extraction, e2e violation-firing) and orthogonal to status — reconcile by
  setting the fixture status to `implemented`. The full blast radius is SEVEN
  files across pkg/gate AND cmd/backstop (an independent grep of every
  ExtractContractEntries caller — do NOT trust the pkg/gate-only list):
    - step_testverify_test.go:327  TestGate_ExtractContractEntries_HappyPath
      (fixture `status: draft`, :334) — expects 1 contract.
    - step_contract_parser_absence_test.go  TestGate_ExtractContractEntries_
      AbsentFieldParsed (:13, draft) and _AbsentDefaultsFalse (:106, draft).
    - extract_scope_test.go  TestExtract_ContractEntryScopePopulatedFrom
      Declaration / _PathScopedAbsenceScopeReachesGrepProbe / _ContractEntry
      ExtractionDoesNotParseOrCompile — these fixtures declare NO `status`
      field (empty ≠ implemented), so they also break; add `status:
      implemented` to each fixture (via the writeSpec frontmatter).
    - pkg/gate/testdata/terminal/spec-active-broken.spec.md (`status: draft`,
      :5) — the SHARED "active" fixture. terminal_exclusion_test.go's
      TestExtractContractEntries_SkipsTerminalSpecs (:76) asserts its
      `DeletedActiveSymbol` IS extracted, which breaks under implemented-only.
      Flip the fixture to `status: implemented`; its terminal-exclusion
      assertions (the deprecated/replaced siblings stay SKIPPED) remain valid —
      only the active fixture's status changes. VERIFIED SAFE: the sibling
      TestExtractSpecVerifications_SkipsTerminalSpecs and
      TestExtractMandatedTests_SkipsTerminalSpecs stay green because
      isTerminalSpecStatus treats draft and implemented identically as
      non-terminal.
    - cmd/backstop/gate_contract_wiring_test.go — the `writeContractSpec`
      helper writes `status: draft` (:51); 3 tests assert extraction/violation.
    - cmd/backstop/gate_contract_e2e_harness_test.go — `newContractE2EWorkspace`
      writes `status: draft` (:66); drives the whole e2e suite asserting fired
      violations.
    - cmd/backstop/gate_contract_novacuous_test.go — writes `status: draft`
      (:63); 3 "no vacuous green" tests assert the step fires.
  NOTE (do NOT conflate active/non-terminal with still-extracted): under the
  OLD terminal-only filter, a non-terminal draft spec's contracts were
  extracted; under implemented-only they are NOT. So every draft "active"
  fixture above must move to `implemented`, INCLUDING the terminal-test's
  active fixture. Terminal-exclusion assertions themselves stay valid.

  Because these fixtures span cmd/backstop, reconciliation must be proven with
  `go test ./...` (or at minimum `./pkg/gate/... ./cmd/backstop/...`), NOT
  `./pkg/gate/...` alone — otherwise the cmd/backstop breakage surfaces only at
  the final gate with no remediation task behind it.

  ANTI-GAMING COMPOSITION (relied upon, not re-asserted here): implemented-only
  scoping is safe from a park-a-spec-in-draft-forever dodge because the
  independent `artifact_status_drift` gate dimension keeps status honest — a
  spec whose code is actually built cannot legitimately linger in draft. This
  plan RELIES on that composition but does NOT re-test it (that would exercise a
  separate dimension); it is acknowledged only.

  ─────────────────────────────────────────────────────────────────────────
  EMPIRICAL ACCEPTANCE (verify via the gate itself — this is the proof)
  ─────────────────────────────────────────────────────────────────────────
  After the change, `backstop gate --all` shows contract_signature dropping
  from 143 → ~39 violations (the 104 unbuilt init/release contracts stop being
  extracted) with new_violations: 0 (NO regression). The residual ~39 is
  genuine drift on already-implemented specs (ISSUE-038, ~30) plus non-Go
  artifact contracts the Go compiler cannot compile regardless of status
  (ISSUE-053, ~7). contract_signature carries `baseline: true` in
  backstop.yml, so after the fix REFRESH the baseline (`backstop baseline
  generate`, writes gitignored .backstop/baseline.json) so it reflects the
  corrected smaller set rather than the polluted one, and confirm
  contract_signature still passes.

  ─────────────────────────────────────────────────────────────────────────
  CLAIMS (this plan defines its own — ISSUE-051 has no claims[] array)
  ─────────────────────────────────────────────────────────────────────────
  CLM-001 — Predicate: `contractsAreDue(status) bool` returns true ONLY for
    `implemented`; false for draft, ready-for-implementation, and every
    terminal status (replaced / canceled / deprecated / obsoleted).
  CLM-002 — Scoping: ExtractContractEntries extracts contracts ONLY from
    `implemented` specs — draft and ready-for-implementation are skipped (the
    104 planned-not-built false positives evaporate, not by retiring a real
    contract but by correctly not-yet-enforcing unbuilt work).
  CLM-003 — Enforcement preserved: an `implemented` spec's contracts are STILL
    extracted (no vacuous-green hole; real drift on live specs still fires).
  CLM-004 — Terminal + obsoleted excluded: terminal specs remain excluded, and
    `obsoleted` (which isTerminalSpecStatus does NOT cover) is now correctly
    excluded on the contract path via the positive predicate — without editing
    isTerminalSpecStatus.
  CLM-005 — Sibling untouched: ExtractSpecVerifications and isTerminalSpecStatus
    are left byte-for-byte unchanged; the test_verification/coverage sibling
    fix stays explicitly deferred.
  CLM-006 — Empirical acceptance: `backstop gate --all` contract_signature
    drops 143 → ~39 with new_violations: 0; the contract_signature baseline is
    refreshed to the corrected set; `backstop gate` and `backstop artifact
    validate` pass.

  ─────────────────────────────────────────────────────────────────────────
  VERIFICATION
  ─────────────────────────────────────────────────────────────────────────
  Unit-level in pkg/gate — exercise ExtractContractEntries and contractsAreDue
  directly against temp-specDir fixtures over the full status vocabulary; no
  engine run. Middle verification runs `backstop code check` + `go test
  ./pkg/gate/...`. The final phase runs the full `backstop gate` kill chain,
  the `backstop gate --all` acceptance measurement, the baseline refresh, and
  `backstop artifact validate --plan PLAN-ISSUE-051`. The code change touches
  only .go files (no artifact edits), so `backstop gate` subsumes code
  verification.

