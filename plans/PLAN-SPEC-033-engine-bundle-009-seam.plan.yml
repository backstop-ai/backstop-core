          TestSeam_RealRuleInBundle010_IsViolation tests pass. Covers Sharp Edges
          3 (scope osmosis) and 5 (go/parser mis-assignment).
        files:
          - tools/seam-check/seam.go
        claims:
          - CLM-010
          - CLM-011
          - CLM-012
          - CLM-013
          - CLM-014
        depends_on:
          - TASK-009

      - id: TASK-011
        type: verification
        title: "Verify not-delivered checker via backstop code check"
        description: |
          Run the diff-scoped fast inner-loop check over the not-delivered
