---
plan_id: PLAN-SPEC-033
spec_id: SPEC-033
spec_version: 1.0.0
created: "2026-06-16"
status: draft
test_command: "go run ./tools/seam-check ./specs/SPEC-033-engine-bundle-009-seam.spec.md"
coverage_threshold: 90

notes: |
  SPEC-033 is a contract-lock / boundary-definition deliverable: it ships no
  package code that implements an engine. The implementable artifact is the
  static seam checker `tools/seam-check`, whose job is to parse SPEC-033's
  frontmatter (requirements + claims) and Seam Ledger table and assert the seam
  is internally consistent and frozen. The spec's verification.test_command is
  exactly this tool, so the tool both backs the spec's static verification and is
  the unit under test here.

  The checker validates five seam invariants, one per requirement:
    - REQ-001 (CLM-001..006): the delivered hand-off artifact set is enumerated
      and closed — exactly the five named artifacts cross as "Delivered", and no
      artifact outside the enumerated list is claimed delivered.
    - REQ-002 (CLM-007..009): exactly one trivial proof rule, labeled a wiring
      witness; a second proof rule or a proof rule promoted to a real rule is a
      violation.
    - REQ-003 (CLM-010..014): the not-delivered set (substantiveness packs,
      contract packs, traceability-step wiring, go/parser migration) is assigned
      to BUNDLE-009; a real substantiveness/contract rule in any BUNDLE-010 spec
      is a violation.
    - REQ-004 (CLM-015..017): the ast-grep→SARIF converter is author-once by
      BUNDLE-010 and reused unmodified; a re-authored converter is a violation.
    - REQ-005 (CLM-018..020): the producer→consumer edge is one-way
      (BUNDLE-010 → BUNDLE-009); a reciprocal BUNDLE-010→BUNDLE-009 dependency is
      a violation.

  Sharp edges drive the negative tests: each "RejectsXxx"/"IsViolation" claim has
  a dedicated negative-case test name mandated by the spec, asserted against
  malformed-seam fixtures rather than the canonical spec.

  Ordering: a single shared model/validator lives in tools/seam-check/seam.go, so
  the five validation areas cannot author disjoint files in parallel. They are
  sequenced TDD test→implementation per area against the shared validator, each
  implementation directly preceded by its test task, with a verification gate per
  phase and a final full `backstop gate` over both the spec artifact and the new
  Go tool.

phases:
  - id: phase-1
    name: "Phase 1: Seam-check scaffold and ledger-parse fixtures"
    tasks:
      - id: TASK-001
        type: setup
        title: "Scaffold seam-check tool package and CLI entrypoint"
        description: |
          Create the tools/seam-check Go package skeleton: a main.go that accepts
          a single spec-path argument, reads it, and delegates to a CheckSeam
          entry function that will live in seam.go. Stub CheckSeam to return an
          empty result so the package compiles and `go run ./tools/seam-check`
          exits cleanly before the validators are implemented. This is the shared
          surface every later validation area builds on; no seam logic yet.
        files:
          - tools/seam-check/main.go
          - tools/seam-check/seam.go
        claims:
          - CLM-001
          - CLM-007
          - CLM-010
          - CLM-015
          - CLM-018
        depends_on: []

      - id: TASK-002
        type: setup
        title: "Create canonical and malformed seam fixtures for checker tests"
        description: |
          Create testdata fixtures the seam-check tests assert against: a copy of
          the canonical SPEC-033 seam (valid) plus malformed variants exercising
          each negative case — an extra delivered artifact outside the enumerated
          set, a second/promoted proof rule, a real substantiveness rule placed in
          a BUNDLE-010 spec, a re-authored ast-grep converter, and a reciprocal
          BUNDLE-010→BUNDLE-009 dependency. These fixtures back the pass and
          negative TestSeam_* cases across all five validation areas.
        files:
          - tools/seam-check/testdata/seam-valid.spec.md
          - tools/seam-check/testdata/seam-extra-delivered.spec.md
          - tools/seam-check/testdata/seam-extra-proof-rule.spec.md
          - tools/seam-check/testdata/seam-real-rule-in-bundle010.spec.md
          - tools/seam-check/testdata/seam-reauthored-converter.spec.md
          - tools/seam-check/testdata/seam-reciprocal-dependency.spec.md
        claims:
          - CLM-006
          - CLM-009
          - CLM-014
          - CLM-017
          - CLM-020
        depends_on: []

  - id: phase-2
    name: "Phase 2: Delivered hand-off artifact set (REQ-001)"
    tasks:
      - id: TASK-003
        type: test
        title: "Write failing tests for the delivered seam artifact set and its closure"
        description: |
          Add failing tests asserting the checker recognizes each enumerated
          delivered hand-off artifact and treats the delivered set as closed.
          Mandated test names:
            - TestSeam_Delivers_EngineFieldAndDispatchTable (CLM-001)
            - TestSeam_Delivers_AstGrepWired (CLM-002)
            - TestSeam_Delivers_AstGrepConverter (CLM-003)
            - TestSeam_Delivers_ParseSarifContract (CLM-004)
            - TestSeam_Delivers_InputModeAndLayout (CLM-005)
            - TestSeam_DeliveredSet_IsClosed (CLM-006) — asserts the
              seam-extra-delivered fixture is flagged because an artifact outside
              the enumerated list is claimed delivered.
        files:
          - tools/seam-check/seam_delivered_test.go
        claims:
          - CLM-001
          - CLM-002
          - CLM-003
          - CLM-004
          - CLM-005
          - CLM-006
        depends_on:
          - TASK-001
          - TASK-002
          # Phases 2-5 share tools/seam-check/seam.go and are serialized via the
          # test tasks chaining on the prior phase's verification (REQ-010) so they
          # are never parallel-eligible (D-081). Phase 2 is the chain head.

      - id: TASK-004
        type: implementation
        title: "Implement delivered-set parsing and closure validation"
        description: |
          Parse the spec's Seam Ledger and frontmatter to extract the "Delivered"
          rows, expose each enumerated artifact (engine field + dispatch table,
          ast-grep wired, ast-grep convert executable, parseSarif contract,
          input_mode/input_flag seam + pack layout), and assert the delivered set
          is closed: any artifact claimed delivered that is outside the enumerated
          allowlist is reported as a violation. Make the TestSeam_Delivers_* and
          TestSeam_DeliveredSet_IsClosed tests pass.
        files:
          - tools/seam-check/seam.go
        claims:
          - CLM-001
          - CLM-002
          - CLM-003
          - CLM-004
          - CLM-005
          - CLM-006
        depends_on:
          - TASK-003

      - id: TASK-005
        type: verification
        title: "Verify delivered-set checker via backstop code check"
        description: |
          Run the diff-scoped fast inner-loop check over the seam-check tool and
          its delivered-set tests.

          Commands:
            - backstop code check
        files:
          - tools/seam-check/seam.go
          - tools/seam-check/seam_delivered_test.go
        claims:
          - CLM-001
          - CLM-002
          - CLM-003
          - CLM-004
          - CLM-005
          - CLM-006
        depends_on:
          - TASK-004

