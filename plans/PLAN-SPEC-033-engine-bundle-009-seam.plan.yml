        files:
          - tools/seam-check/seam.go
        claims:
          - CLM-007
          - CLM-008
          - CLM-009
        depends_on:
          - TASK-006

      - id: TASK-008
        type: verification
        title: "Verify proof-rule checker via backstop code check"
        description: |
          Run the diff-scoped fast inner-loop check over the proof-rule validator
          and its tests.

          Commands:
            - backstop code check
        files:
          - tools/seam-check/seam.go
          - tools/seam-check/seam_proofrule_test.go
        claims:
          - CLM-007
          - CLM-008
          - CLM-009
        depends_on:
          - TASK-007

