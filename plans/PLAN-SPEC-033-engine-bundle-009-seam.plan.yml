          - TASK-005

      - id: TASK-007
        type: implementation
        title: "Implement proof-rule cardinality and labeling validation"
        description: |
          Extend the checker to find proof-rule declarations in the seam, assert
          exactly one exists, assert it is labeled a non-domain wiring witness, and
          flag a second proof rule or any proof rule presented/extended as a real
