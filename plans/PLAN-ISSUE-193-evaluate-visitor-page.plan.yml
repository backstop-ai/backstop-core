  CLM-017 — RECEIPT REACHABILITY: TWO SHORT-CIRCUITS DECIDE WHICH DIAGNOSTIC A TASK CAN
    ACTUALLY OBSERVE, SO NO TASK MAY DEMAND A RECEIPT ITS OWN STATE MAKES UNREACHABLE. Line
    numbers are `origin/main` coordinates.

    (a) `verify-website-capabilities.sh` IS PREREQUISITE-GATED AND IS UNUSABLE AS A JOURNEY
    RECEIPT UNTIL THE WHOLE SITE IS GREEN. Its `run_prerequisites()` (lines 86-103, invoked
    at line 168 before any journey work) executes `./scripts/verify-public-product-model.sh`,
    `./scripts/verify-documentation-semantics-integration.sh`, `./scripts/verify-product-truth.sh`,
    and `./scripts/verify-public-site.sh` in order, and `fail`s with
    `governed dependency <command> failed before traversal` on the first non-zero exit.
    `go test ./scripts/websitejourney/` does not run until all four pass. Consequences this
    plan is built around: during Phase 1 the product-model verifier is deliberately red, so
    the script aborts on prerequisite one and can never produce a journey diagnostic — every
    Phase 1 journey receipt is therefore scoped to
    `go test ./scripts/websitejourney -run ...`, which reads the feature files and
    `ExpectedWebsiteJourneys()` directly. Equally, `verify-public-site.sh` is the FOURTH
    prerequisite and stays red until TASK-010 lands the paper/ink surface that TASK-006
    asserts, so no task before TASK-010 may require `verify-website-capabilities.sh` either.
    The first point in this plan where the script can legitimately run end to end is
    TASK-011, after Phase 3.

    (b) BUILT-SITE TRAVERSAL CANNOT DETECT A MISSING ANCHOR ON A REAL PAGE, because the tree
    it traverses is SYNTHESIZED FROM THE MAP. `WriteAcceptedBuiltTree`
    (`scripts/websitejourney/traversal.go:101`) walks `m.Journeys`, calls `ParseHop` on each
    hop, and writes `<section id="%s"></section>` into an in-memory page for any fragment not
    already present. Every hop the map declares is therefore satisfied by construction. A
    retargeted hop can only ever fail as a map-versus-expectation mismatch — the
    `hop sequence [...], want [...]` diagnostic from `ValidateScenarioAndCoverageMatrix`, or a
    `website-capability-map.yml` obligation mismatch — never as a built-site traversal miss
    against `docs/*.md`. Do not write a receipt that predicts a traversal failure for a
    missing `#working-state` or relocated `/reference/` anchor; that failure mode does not
    exist in this package.

    (c) THE PRODUCT-MODEL VERIFIER SHORT-CIRCUITS JLINK CARDINALITY BEFORE THE CLOSED-WORLD
    POLICY, BY DESIGN. Lines 422-423 carry the explicit comment "Diagnose declared-link
    loss/cardinality before the closed-block policy so page mutations retain the responsible
    stable journey ID", the marker/link cardinality loop runs at lines 424-428, and
    `check_closed_blocks` is not called until lines 429-430. `fail()` exits immediately. So
    while any declared JLINK is missing from its source page, the allowance dict is NEVER
    evaluated and no `unclassified final-copy block` diagnostic can be produced. TASK-007
    lands the page and retargets `content-topology.yml`, but the relocated markers do not
    reach `/model/` and `/reference/` until TASK-008 — so the closed-world allowance proof is
    unreachable inside TASK-007 and is claimed at TASK-009 instead, once both halves are in.

  CLM-016 — THE FENCE. Only the files enumerated in this plan's tasks change. Specifically
    unchanged: `docs/index.html`, `docs/index.md`, `docs/assets/css/backstop.css`,
    `docs/assets/css/backstop-tokens.css`, `docs/_includes/site-header.html`,
    `docs/_includes/site-footer.html`, `docs/adopt.md`, `docs/use-cases.md`,
    `docs/packs.md`, `docs/extend.md`, `docs/contributing.md`, the seven-primary /
    two-utility navigation membership in `content-topology.yml` and `scripts/sitecheck/`,
    `docs/_data/content-inventory.yml`, `docs/_data/derived-product-truth.yml`,
    `docs/_data/product-model.yml`, `docs/_includes/generated/**`, `playwright.config.ts`,
    `tests/public-site-helpers.ts`, `.github/workflows/**`,
    `.backstop/seed4-delivery-inventory.yml` (expected; see CLM-014), every other
    `capabilities/**` scenario, every entity page, the pack-fleet routes, and
    `bundles/BUNDLE-032-website-expansion.bundle.md`. No waiver, suppression, baseline
    entry, skipped test, `testMatch` widening, or relaxed assertion is acceptance.

  ══════════════════════════════════════════════════════════════════════════════
  SHARP EDGES
  ══════════════════════════════════════════════════════════════════════════════
  1. Seven files, one hero string (CLM-002). Missing the change-fence mutation literal in
     `site_contract_test.go` does not fail loudly — it makes a negative mutation match
     nothing, which is a vacuous test, not a red one.
  2. Raw hex in the prototype CSS (CLM-005). Copy the card, not the `#ef5b50` fallback.
  3. `[data-page-kind="home"] .nav` inside the 56rem media query (CLM-006). Preserve it
     verbatim; it belongs to ISSUE-189/ISSUE-190, not to this plan.
  4. CLAIM-005 on `docs/status.md` wraps JLINK-024 INSIDE its own claim region and has an
     exact-layout assertion (`--claim-005-layout-only` mode plus the `status.count(exact)==1`
     check in `discovery-evaluation-adoption-status.sh`). Insert CLAIM-018 as a separate
     region after `<!-- /backstop-claim -->` without perturbing one byte of CLAIM-005.
  5. Closed-world keys split on BLANK lines (CLM-011). One multi-line div is one key with
     embedded `\n`. Reflowing the HTML, changing a smart quote, or inserting a blank line
     inside a div invalidates the allowance even though the page looks identical.
  6. `{% raw %}` asymmetry (CLM-012). `canonical_payload` strips the tags before comparing,
     the page keeps them, and `extend-reference-contributing.sh` has no `visible()` helper
     today. Add the helper when CLAIM-007 arrives or the test reds on byte mismatch.
  7. The gherkin feature files are silent consumers (CLM-010). They are not under
     `docs/` and not in the Seed 4 matrix, so no inventory row or page test names them.
     `ValidateScenarioAndCoverageMatrix` compares them against `ExpectedWebsiteJourneys()`
     for exact hop equality, so `artifacts.go` and the features are ONE atomic contract:
     changing either side alone reds the matrix.
  8. Moving the Liquid `presentation` assign above `<!doctype html>` (CLM-004) changes
     `default.html` for all nine inner routes. Keep `data-page-kind="{{ presentation.page_kind }}"`
     and the unconditional `next-action` nav exactly as they are; the `page.page_kind`
     fallback and the conditional next action on the prototype branch exist for entity
     pages that do not exist here.
  9. Sibling plans may land first (see EXISTENCE-IN-WORLD). Treat `paper_kinds` in
     `default.html` and the `html:has(...)` selector list in `site.css` as append-only
     sets, and reconcile a relocated claim into its renamed destination section rather
     than deleting it.
  10. `--check-diff` reads committed history from base
     `89f4138aa97e7ba1e8d7c67595cfaee1caefa797`. If the branch is rebased and a change
     letter genuinely flips, reconcile the letter, never the matrix (CLM-014).
  11. FOUR RECEIPTS LOOK OBVIOUS AND ARE WRONG (CLM-017). (a) `verify-website-capabilities.sh`
     runs four whole-site verifiers as prerequisites before any journey code, so it is
     unusable as a journey receipt until TASK-011 — during Phase 1 and Phase 2 it aborts on
     a prerequisite and says nothing about hops. (b) Built-site traversal cannot catch a
     missing anchor, because `WriteAcceptedBuiltTree` synthesizes the tree from the map;
     hop errors surface only as map-versus-expectation mismatches. (c) The JLINK cardinality
     loop short-circuits ahead of `check_closed_blocks`, so the allowance dict is unreachable
     while any relocated marker is in flight — the closed-world proof lands at TASK-009, not
     TASK-007. (d) The page tests raise `KeyError: '/evaluate/'`, not `AssertionError`, when a
     claim is asserted in a corpus that does not include its current owner route.
  12. `tests/website-capabilities.spec.ts` hardcodes `first:` routes for seven journeys but is
     executed by nothing (`testMatch` is `public-site.spec.ts`; no inventory row). Repoint its
     six moved rows for honesty, expect no receipt from doing so, and do not wire it up.

