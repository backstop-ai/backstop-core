  ── F7. THREE DEEPER DEFECTS FOUND IN REVIEW — DEFERRED, NOT FIXED HERE ─────
  Review established that this lane's headline evidence could NOT be produced
  against the two real in-repo packs, for three reasons that are separate from
  this defect, deeper than it, and each cross-cutting on its own. RULING
  (2026-08-16): narrow this plan's evidence onto a synthetic corpus rather than
  widen it to absorb all three. Each is verified below at HEAD, then deferred.

    (F7-a) `packs/contracts` CAN NEVER DISPATCH, EVEN AFTER THIS LANE.
      All seven of its rules declare `input_mode: pattern-arg` and carry an
      inline `pattern:` — none declares `file:` or `rule_path:`. So the accessor
      this plan introduces (CLM-001) returns EMPTY for every one of them and the
      dispatch guard stays false. This is a THIRD instance of the same drift
      family: `pkg/pack/manifest.go`'s runtime `Rule` has a `Pattern string
      \`yaml:"pattern"\`` field, added by SPEC-035 REQ-004; `pkg/packval`'s
      authoring-time `Rule` has no `Pattern` field AT ALL. packval cannot even
      see the rule source a pattern-arg rule declares. Fixing this is modelling
      work on top of CLM-001, not a variation of it.

    (F7-b) packval's EXECUTOR NEVER APPLIES `binding.Convert`.
      `packs/substantiveness` declares `convert: ast-grep/to-sarif.sh` on its
      engine. Only the real gate dispatch path applies it — `binding.Convert`
      appears in `cmd/backstop/pack_gate.go` and NOWHERE in
      `pkg/packval/executor.go`. packval feeds raw `ast-grep scan --json` output
      (a JSON ARRAY) straight into `check.ParsePackFindings` → `parseSarif`,
      whose `json.Unmarshal` into a `sarifLog` STRUCT fails on an array. So the
      moment substantiveness dispatches, `RunEngine` returns a parse error —
      which under this lane's own CLM-005 is a distinct, loud engine error, and
      phase 3 FAILS. Correct behavior for a genuinely broken pipeline; wrong
      conclusion about the pack. The fix belongs in `pkg/packval/executor.go`,
      which this lane does not own (F6).

    (F7-c) THE `semgrep-rule-id` CROSS-CHECK IS BAKED AND UNCONDITIONAL.
      ★ FOLDED INTO THIS PLAN 2026-08-16 by team-lead ruling — see F9. It is
      recorded here as originally found, because F9's design depends on the
      diagnosis being right.
      In `RunFixtures`, once a rule has a source file the code reads it and runs
      `semgrepFileContainsRuleID` REGARDLESS of the rule's declared engine.
      `packs/substantiveness` declares `rule_path: ast-grep/sgconfig.yml`, an
      ast-grep project config whose entire content is `ruleDirs: [rules]` — it
      contains no semgrep-shaped rule-ID list and never will. So the check
      returns false and emits a `semgrep-rule-id` error: a SECOND, fully
      independent reason substantiveness can never reach `phase3-fixtures:
      pass`. It is also a live violation of the thin-executor invariant — baked
      semgrep knowledge applied to a non-semgrep engine.

