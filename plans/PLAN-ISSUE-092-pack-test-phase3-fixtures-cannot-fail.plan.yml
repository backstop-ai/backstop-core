  ── F6. WHY `pkg/packval/executor.go` IS NOT IN SCOPE ───────────────────────
  ISSUE-092 Direction item 2 asks that an engine/schema error be made loud and
  distinct from a genuine non-firing fixture. There are two halves:

    (a) phase3 THROWS AWAY the distinction it is already handed. The positive
        loop's `if err != nil || !r.Passed` folds a returned engine error into
        the fixture verdict "positive fixture failed"; the negative loop
        discards the error text entirely. Fixable wholly in `phase3.go`.
        THIS LANE OWNS (a) — CLM-005.

    (b) the EXECUTOR cannot always tell a broken run from a clean one:
        `parseSarif` returns `(nil, nil)` for empty stdout, so a started-but-
        errored engine yields `Passed:false, ExitCode:0, nil` — indistinguish-
        able from a clean negative. That is `pkg/packval/executor.go`'s
        `RunEngine`, which is EXACTLY the surface of ISSUE-140 (filed today,
        "packval executor's narrow never-started check", plan being authored
        concurrently). THIS LANE DOES NOT TOUCH `executor.go`.

