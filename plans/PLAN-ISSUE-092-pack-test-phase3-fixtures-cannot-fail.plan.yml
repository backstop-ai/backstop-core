  - id: phase-4
    name: "Phase 4: Engine errors made distinct, and the retired Layer gate removed"
    tasks:
      - id: TASK-008
        type: test
        title: "Test that an engine error is its own failure and that validator dispatch ignores Layer"
        description: |
          `TestPackVal_P3_EngineErrorIsDistinctFromFixtureVerdict` (CLM-005) — with a
          MockExecutor whose `RunEngine` returns a non-nil error, assert phase 3
          reports an error whose `Check` is a dedicated engine-error identifier, NOT
          `semgrep-positive`, and whose message CONTAINS the underlying engine error
          text. Today the positive loop's `if err != nil || !r.Passed` launders a
          broken engine into the fixture verdict "positive fixture failed", which
          sends a pack author to inspect a fixture that was never the problem.

          `TestPackVal_P3_EngineErrorIsNotAPassingNegative` (CLM-005) — with the same
          erroring mock, assert a NEGATIVE fixture's engine error is reported as the
          engine error and never absorbed into a pass. This is the vacuous-green
          direction and is the one that matters most.

          `TestPackVal_P3_EngineSchemaErrorOnRealEngine` (CLM-005) — run
          `testdata/engine-error-pack` through the REAL `DefaultExecutor` and assert
          phase 3 does not report `pass`. Build the assertion against what TASK-001
          observed the engine actually doing with a malformed rule file. If the
          engine turns out to emit parseable-but-empty SARIF rather than erroring,
          the distinction cannot be drawn from inside phase 3 — in that case assert
          what IS reachable here, and say explicitly in the test comment that the
          remaining half is `executor.go`'s and belongs to ISSUE-140. Do not reach
          into `executor.go` to close it, and do not quietly drop the test.

          `TestPackVal_P3_ValidatorDispatchDoesNotGateOnRetiredLayerField` (CLM-007) —
          a manifest declaring a `validator:` rule with an engine and NO `layer:`
          (the shape a pack written against the current runtime model would have,
          since `Layer` was retired from it) must dispatch `RunValidator`. Assert
          via a recording mock that the call happened. Today the count is zero.

          ★ REWRITE `TestPhase3_DispatchErrorBranches`
          (`pkg/packval/pack_declared_setup_test.go`). It asserts
          `e.Check == "semgrep-negative" && strings.Contains(e.Message, "run
          failed")` for a mock whose engine RETURNS AN ERROR on the negative
          fixture. CLM-005 deliberately re-homes engine errors onto a dedicated
          engine-error `Check`, so that assertion is pinned to the behavior this
          task removes and it CANNOT stay as written. Keep the name and keep the
          test's other half (the `validator-multi-file` assertion) intact; change
          only the engine-error half, to assert the dedicated `Check` and that the
          underlying engine message survives. See F6: rewriting this body is
          THIS lane's own consequence and PLAN-ISSUE-140 does not conflict with
          it — PLAN-140 touches neither phase3.go nor this test, and its own
          "ORDER SENSITIVITY" section already tells its implementer to record
          the real observation if this lane landed first. Do not resolve
          anything here by weakening CLM-005.

          ── THE LAYER-GUARD BLAST RADIUS, ENUMERATED (do not re-derive) ──
          Replacing `rule.Layer == 3 && rule.Validator != ""` with a validator-only
          guard makes validators dispatch for ANY rule declaring one. Enumerated at
          HEAD by grepping every `Validator:` and `Layer:` declaration in
          `pkg/packval/*_test.go`, the result is: NO SHIPPED TEST CHANGES BEHAVIOR.
          Every test that declares a `Validator` AND calls `RunFixtures` already
          declares `Layer: 3` (`baseManifest()` in packval_test_helpers_test.go;
          `pack_declared_setup_test.go`; and coverage_error_paths_test.go's
          `ValidatorPositiveFails` / `ValidatorNegativePassesUnexpectedly` /
          multi-file cases), so the guard's outcome is unchanged for all of them.
          The one `Validator`-without-`Layer` declaration in the package —
          `TestPackVal_P1_MissingValidatorFile` in coverage_error_paths_test.go —
          calls `RunStructural`, not `RunFixtures`, so the phase-3 guard never
          sees it.
          Both files are nevertheless in this task's scope: pack_declared_setup_test.go
          because of the CLM-005 rewrite above, and coverage_error_paths_test.go
          because it holds the densest cluster of Layer-3 validator assertions and
          is where an unintended change would surface first. CONFIRM the enumeration
          rather than trusting it — if a validator dispatch appears where the list
          says it should not, stop and report before adjusting any test.
          Also worth stating plainly, because CLM-007's wording implies otherwise:
          NO in-repo pack declares `validator:` at all. This change removes a dead
          gate keyed on a retired field; it does not light up a real pack's sandbox
          rule today. That is still worth doing — a dispatch guarded on a field the
          runtime model deleted is the same defect as the `File` guard — but the
          claim should not be read as delivering live validator coverage.
        files:
          - pkg/packval/phase3_engine_error_test.go
          - pkg/packval/phase3_validator_dispatch_test.go
          - pkg/packval/pack_declared_setup_test.go
          - pkg/packval/coverage_error_paths_test.go
        claims:
          - CLM-005
          - CLM-007
        test_names:
          - TestPackVal_P3_EngineErrorIsDistinctFromFixtureVerdict
          - TestPackVal_P3_EngineErrorIsNotAPassingNegative
          - TestPackVal_P3_EngineSchemaErrorOnRealEngine
          - TestPackVal_P3_ValidatorDispatchDoesNotGateOnRetiredLayerField
        depends_on:
          - TASK-007

      - id: TASK-009
        type: implementation
        title: "Give engine errors their own check, and dispatch validators on the validator field"
        description: |
          In `pkg/packval/phase3.go` `RunFixtures`:

          Split the engine-error case out of the fixture verdict. In both claim loops
          (ruleset and `tool_config`), when `executor.RunEngine` returns a non-nil
          error, append a ValidationError under a dedicated engine-error `Check`
          whose message carries the underlying error, and do NOT additionally emit a
          positive/negative fixture verdict for that fixture — a fixture whose engine
          never produced a usable answer has no verdict to report. Critically, an
          engine error must never leave a negative fixture looking clean.

          THE ENGINE-ERROR `ValidationError` MUST CARRY `Rule` AND `Claim`, both
          populated from the rule and claim the loop is currently processing —
          stated explicitly here so the new error is not built as a bare
          `{Phase, Check, Message}`. `packval.ValidationError` already declares
          both fields (`pkg/packval/result.go`) and every other phase-3 error
          populates them; an engine error that omits them is strictly less useful
          than the fixture verdict it replaces, since a pack author would learn
          that SOMETHING broke without learning which rule broke it. It is also
          a CROSS-LANE requirement: PLAN-ISSUE-140's `pkg/packval/
          phase3_never_started_test.go` — a separate, already-committed and
          already-executing lane whose file THIS PLAN MUST NOT TOUCH — asserts
          `e.Rule == "R1" && e.Claim == "C1"` against exactly this error, so
          omitting the fields reds another plan's test across the lane boundary.

          Replace the `rule.Layer == 3` dispatch guards on the validator branches
          (positive, negative, and the multi-file branch) with a guard on the rule
          declaring a validator. `Layer` was retired from the runtime model and no
          real pack sets it, so gating on it is the same dead-dispatch bug as the
          `File` guard, one field over. Keep the `input_scope == "multi-file"`
          condition on the multi-file branch — that field is still live.

          Leave `pkg/packval/phase5.go`'s own use of `Layer` alone: phase 5 already
          handles engine-model rules explicitly by exempting them, and it is not part
          of this defect.

          `pkg/packval/executor.go` IS OUT OF SCOPE — see F6. If a case here appears
          to need an executor change, stop and report it rather than editing the file
          ISSUE-140 owns.
        files:
          - pkg/packval/phase3.go
        claims:
          - CLM-005
          - CLM-007
        depends_on:
          - TASK-008

      - id: TASK-010
        type: verification
        title: "Gate the error-distinctness and validator-dispatch changes"
        description: |
          Run `backstop gate` over the diff.

          Confirm the whole `pkg/packval` suite is green and that the phase-2 and
          phase-3 claims did not regress — in particular that the falsification test
          is still green after the error-handling restructure, since that change
          touches the same claim loops.
        files:
          - pkg/packval/phase3.go
          - pkg/packval/phase3_engine_error_test.go
          - pkg/packval/phase3_validator_dispatch_test.go
        claims:
          - CLM-005
          - CLM-007
        depends_on:
          - TASK-009

  - id: phase-5
    name: "Phase 5: Narrow the rule-ID cross-check to the input mode it was written for"
    tasks:
      - id: TASK-011
        type: test
        title: "Test that the rule-ID cross-check keys on declared input_mode, not on the engine's name"
        description: |
          ★ FOLDED INTO THIS LANE 2026-08-16 by the F8 ruling (it was F7-c, a
          deferred follow-on). READ F9 BEFORE WRITING ANYTHING — it carries the
          design and one collateral finding that a naive implementation breaks.

          The one-line summary: `semgrepFileContainsRuleID` runs today for ANY
          rule that declares a source file, regardless of what engine the rule
          declared. It must run ONLY when the rule's RESOLVED engine binding
          declares `input_mode: rule-flags` — the mode under which the declared
          file IS a list of rules carrying ids.

          `TestPackVal_P3_RuleIDCrossCheckSkippedForConfigFileEngine` (CLM-010) —
          a manifest whose rule declares an engine resolving to
          `input_mode: config-file` (the `ast-grep` shape) and a rule-source file
          that does NOT contain the pack's rule id. Assert phase 3 reports NO
          `semgrep-rule-id` error. This is the `packs/substantiveness` case:
          its declared `ast-grep/sgconfig.yml` is a project config naming rule
          DIRECTORIES and can never contain a rule id.

          `TestPackVal_P3_RuleIDCrossCheckStillRunsForNonSemgrepRuleFlagsEngine`
          (CLM-010) — ★ THE ANTI-REGRESSION TEST, and the more important of the
          two. A manifest whose rule declares a PACK-DECLARED engine that is NOT
          named `semgrep` but DOES declare `input_mode: rule-flags`, with a rule
          file that does not contain the id. Assert the `semgrep-rule-id` error
          IS still reported. This test exists to fail loudly if someone later
          "simplifies" the condition to `rule.Engine == "semgrep"` — which would
          be a baked engine-name literal AND would silently un-fail
          `hermetic/fixture-fail-pack` (F9). Say so in a comment on the test.

          `TestPackVal_P3_RuleIDCrossCheckSkippedWhenEngineDoesNotResolve`
          (CLM-010) — a rule declaring an UNRESOLVABLE engine and a rule file.
          Assert the loud `engine-resolve` error is still reported and that no
          `semgrep-rule-id` error rides along: with no binding there is no
          declared input mode, so the cross-check has nothing to key on. This
          pins the ordering change TASK-012 must make.

          ── COLLATERAL, ENUMERATED AT HEAD (confirm, do not re-derive) ──
          ★ CORRECTED 2026-08-16. An earlier revision of this task asserted that
          EVERY existing `semgrep-rule-id` test declares `Engine: "semgrep"` and
          therefore all survive unchanged. That is FALSE, and the exception is
          the one this task must repair:

            · `pkg/packval/packval_phase3_exec_test.go` — the `semgrep-rule-id`
              assertion in the rule-ID pair DOES declare `Engine: "semgrep"`
              (`input_mode: rule-flags`), so it survives unchanged. Leave it.

            · `pkg/packval/coverage_error_paths_test.go` —
              `TestPackVal_P3_SemgrepRuleFileReadError` declares NO `Engine`
              field at all (`{ID: "r1", File: "nonexistent.yml"}`) and asserts a
              `semgrep-rule-id` error for the missing rule file. Verified by real
              execution at HEAD: it emits BOTH `semgrep-rule-id` (the read
              failure) AND `engine-resolve` (unknown engine ""), and its
              assertion only looks for the former. Under TASK-012 the resolve
              runs FIRST and `resolveEngine(pack, "")` cannot resolve — no
              binding, so no declared input mode, so the read-and-rule-ID branch
              never runs and only `engine-resolve` survives. The assertion goes
              RED. THIS TASK MUST REPAIR IT.

          REPAIR, and why this repair and not the other one. Give the rule an
          explicit `Engine: "semgrep"` field, leaving `File: "nonexistent.yml"`
          and the `semgrep-rule-id` assertion exactly as they are. `semgrep`
          resolves out of the base registry at `input_mode: rule-flags`
          (`packs/base-engines/pack.yml`), so the read-failure branch — which
          TASK-012 moves INSIDE the rule-flags condition — still executes and the
          test still discriminates. The alternative (repoint the test to expect
          `engine-resolve` instead) was considered and REJECTED: it would leave
          the relocated read-failure branch with zero coverage, which is the
          exact vacuity this whole lane exists to remove.

          The only `engine-resolve` assertion in the package
          (`pkg/packval/pack_declared_setup_test.go`) is on the `tool_config`
          loop, not the ruleset loop, so the reorder does not touch it.
          CONFIRM this enumeration by running the package rather than trusting
          it; if a test moves that this list says should not — anything beyond
          the one named repair above — STOP and report before adjusting it.
        files:
          - pkg/packval/phase3_ruleid_inputmode_test.go
          - pkg/packval/coverage_error_paths_test.go
