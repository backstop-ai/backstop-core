  `phase3.go`'s findings branches assert the EXACT OPPOSITE. `RunEngine`'s
  `Passed` means "the engine FIRED" (`Passed: len(findings) > 0`, stated in its
  own doc comment). The positive loop raises an error when `!r.Passed` — i.e.
  it demands the positive fixture FIRE. The negative loop raises an error when
  `r.Passed` — i.e. it demands the negative fixture NOT fire.

  THE DECISIVE INTERNAL EVIDENCE that the branch is the bug and the spec is
  right: the negative branch's message is "negative fixture not triggered" and
  its FixHint opens "This negative fixture did not trigger the rule..." — and
  both are attached to the branch that fires when the negative fixture DID
  trigger. Message and hint agree with SPEC-014; the condition they hang off
  does not. The condition was flipped and the prose was left behind.

  The `tool_config` loop carries the same inversion. The layer-3 validator
  branches are CORRECT — and that is the mechanism worth naming: `RunValidator`
  returns `Passed` meaning "exited 0", while `RunEngine` returns `Passed`
  meaning "fired". Two seams whose `Passed` means opposite things, and ONE
  conditional shape applied to both. That is why only half the file is wrong.

