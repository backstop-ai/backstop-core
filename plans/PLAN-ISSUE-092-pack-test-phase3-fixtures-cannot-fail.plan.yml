          WHOLE `pack test` pipeline, not just `RunFixtures`, so the proof covers
          the path a pack author actually takes. Use `NewPipeline(dir,
          PipelineOptions{Mode: "test", Executor: <real>}).Run()` with the REAL
          `DefaultExecutor`. A mocked engine cannot prove the tool ran.

          Two packs, and the test must DISCRIMINATE between them — a test that
          reds on both is keying on something other than fixture content and
          proves nothing:
            · `testdata/rulepath-pack` — the phase-3 result is `pass`, AND a
              non-zero number of engine dispatches occurred, AND no earlier phase
              came back `skipped`. The skipped check is load-bearing:
              `Pipeline.Run` stops at the first failing phase, so a manifest
              defect in phases 1-2 would render phase 3 `skipped` and a naive
              assertion could read that as "not failed".
            · `testdata/rulepath-pack-broken-negative` — the phase-3 result is
              `fail`, and the errors name the offending rule and claim.

          THE DISPATCH COUNT IS THE POINT, not the pass. Asserting only
          `Status == "pass"` would reproduce this lane's own defect inside its own
          regression test. Observe the count with a counting decorator that
          delegates to `DefaultExecutor`, defined IN THE TEST FILE — do not modify
          `executor.go` (F6).

          Skip loudly if the semgrep binary is absent, and never assert success on
          a skipped run.
