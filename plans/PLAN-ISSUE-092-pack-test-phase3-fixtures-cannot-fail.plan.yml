  ── F1. THE DRIFT IS REAL, AND IT IS TWO INDEPENDENT STRUCTS ────────────────
  `pkg/pack/manifest.go`'s gate-runtime `Rule` declares `RulePath string
  \`yaml:"rule_path"\`` and has NO `File` field. `pkg/packval/manifest.go`'s
  separate authoring-time `Rule` declares `File string \`yaml:"file,omitempty"\``
  and has NO `rule_path` handling. Confirmed by grep across `packs/` and
  `.backstop/packs/`: ZERO real pack.yml declares `file:` under a rule. Every
  one declares `rule_path:`. packval reads a key nothing writes.

  ── F2. THE DEAD-DISPATCH BLAST RADIUS IS FOUR SITES, NOT TWO ───────────────
  The issue names two. There are four, all keyed on a field the runtime model
  does not have:

    1. `phase3.go` RunFixtures, the `rule.File != ""` branch — the semgrep
       rule-ID cross-check AND the engine resolve that sets `haveBinding`.
    2. `phase3.go` RunFixtures, the positive and negative claim loops, guarded
       `rule.File != "" && haveBinding` — `executor.RunEngine` is never called.
    3. `phase1.go`, the `rule.File != ""` branch that stats the rule file —
       NOT NAMED IN THE ISSUE. phase 1's "the rule file you declared exists"
       structural check is dead for every real pack too.
    4. `phase3.go`'s layer-3 validator dispatch, guarded `rule.Layer == 3`.
       `Layer` was RETIRED from the runtime model (SPEC-031 REQ-002 removed the
       field and its yaml key); no real pack declares `layer:`; and `phase5.go`
       EXEMPTS engine-model rules from the layer 1..3 requirement precisely
       because they carry an engine instead. So `rule.Layer` is 0 for every
       real pack and `RunValidator` is never dispatched either. This answers
       ISSUE-092 Direction item 4 for the validator path: same drift family —
       dispatch gated on a field the runtime model retired.

  The `tool_config` loop is the one path that DOES execute today: it is not
  `File`-guarded. No real pack declares `tool_config`, so it is dead in
  practice but live in code — which matters for F3.

