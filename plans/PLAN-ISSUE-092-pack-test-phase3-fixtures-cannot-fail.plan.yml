  that a naive implementation would break.

  CONDITION ON THE DECLARED `input_mode`, NOT ON THE ENGINE'S NAME. The obvious
  reading of "condition the check on the rule's declared engine actually being
  semgrep" is `rule.Engine == "semgrep"`. DO NOT IMPLEMENT IT THAT WAY. A baked
  engine-name literal in the binary is the exact thing CLAUDE.md's first
  principle forbids, and it would replace one thin-executor violation with a
  smaller one. The engine model already declares the property the check actually
  depends on.

  WHAT THE CHECK ACTUALLY DEPENDS ON: `semgrepFileContainsRuleID` assumes the
  declared file IS A LIST OF RULES, each carrying an `id`, and that the pack's
  rule id must name one of them. That is precisely the semantics of
  `input_mode: rule-flags` — "repeat input_flag once per RULE FILE". Under
  `input_mode: config-file` the declared file is a PROJECT CONFIG, not a rule:
  it names rule DIRECTORIES and carries no ids at all, so the cross-check is not
  merely failing, it is categorically inapplicable. Read from
  `packs/base-engines/pack.yml` at HEAD:
    · `semgrep`  → `input_mode: rule-flags`  (field_contract requires
      `rule_path` — independent corroboration for CLM-001)
    · `ast-grep` → `input_mode: config-file`
  and from `packs/substantiveness/pack.yml`, its pack-declared
  `ast-grep-substantiveness` → `input_mode: config-file`.
  So gating on `binding.InputMode == engine.InputModeRuleFlags`
  (`pkg/pack/engine/binding.go`) is a DECLARED, tool-neutral condition that
  keeps the check exactly where it applies and removes it exactly where it never
  could. It is strictly more faithful to BUNDLE-005 REQ-012's own wording, which
  speaks only of "the semgrep rule ID in the referenced rule file" — the check
  was never mandated for engines the requirement predates.

  ⚠ THE COLLATERAL THE ENGINE-NAME READING WOULD HAVE BROKEN — and the reason
  input-mode conditioning is not merely tidier but REQUIRED.
  `cmd/backstop/testdata/hermetic-remote/fixture-fail-pack/pack.yml` exists for
  one purpose: to PASS `pack check` and FAIL `pack test` in phase3-fixtures, so
  a consumer can tell a check failure from a fixture failure. Verified at HEAD,
  its single rule is CLAIMLESS — it declares no fixtures at all — so the
  `semgrep-rule-id` mismatch is its ONLY failure mechanism. And it declares
  `engine: marker-scan`, a pack-declared engine, NOT semgrep. Under
  `rule.Engine == "semgrep"` that pack would silently start PASSING `pack test`,
  breaking at minimum:
    · `TestPackvalValidator_RunPackTest_FixtureFailureReturnsValidationError`
      (`pkg/pack/distribution/validator_test.go`) — shipped and green, asserts
      RunPackCheck passes AND RunPackTest fails in `phase3-fixtures`.
    · SPEC-069 / PLAN-SPEC-069 (`backstop init`, plan committed and in
      implementation), which state that `fixture-fail-pack` fails `pack test`.
  `marker-scan` declares `input_mode: rule-flags`, so under the INPUT-MODE
  condition the check still runs on it, the pack still fails for the same
  reason, and there is ZERO collateral on either. The implementer must confirm
  this by running, not assume it.

  TWO MECHANICAL CONSEQUENCES IN `phase3.go`, both easy to miss:
    · ORDER. The rule-ID block currently runs BEFORE `resolveEngine`, so the
      binding — and therefore its InputMode — is not yet in hand where the
      condition is needed. The engine resolve must move AHEAD of the rule-ID
      check. A failed resolve already emits its own `engine-resolve` error;
      preserve that, and simply do not run the rule-ID check when no binding
      resolved.
    · THE READ-FAILURE BRANCH moves with the check. The "failed to read rule
      file" error also lives under `semgrep-rule-id` today. Let it move inside
      the rule-flags condition: rule-source-file EXISTENCE is phase 1's job for
      every engine under CLM-006, so nothing is lost, and a `config-file`
      engine's config is no longer read by a phase that cannot interpret it.

  THE `semgrep-rule-id` CHECK STRING IS DELIBERATELY NOT RENAMED. It is a baked
  semgrep noun and it is not lovely, but it appears in `fixture-fail-pack`'s
  README and pack.yml comments and is the vocabulary SPEC-069's in-flight work
  reads. Renaming it is churn with cross-lane risk and no behavioral gain.
  Recorded in the FOLLOW-ONS list alongside the REQ-012 question, where it
  belongs.

  ── ISSUE-091 MEASUREMENT TRAP: ALREADY SATISFIED, PINNED BY TEST ───────────
  ISSUE-092 warns that restoring execution must invoke the engine with explicit
  FILE targets, not a directory scan, or it inherits ISSUE-091's undercount of
  `*_test.go` findings. phase3 already builds `[]string{<rule file>, f.Path}` —
  explicit files. Nothing to change; CLM-002 pins it with a test so a later
  refactor cannot regress into a directory target.

  ── SHARP EDGE: `pack test` BECOMES TOOL-DEPENDENT ──────────────────────────
  Once dispatch is live, `pack test` on a real pack actually runs semgrep /
  ast-grep. A missing engine binary will now make `pack test` go RED where it
  was green. That is the CORRECT outcome — a vacuous green is the defect — but
  it is a real behavior change for anyone without the tools on PATH. Verified
  present in this environment: `semgrep` and `ast-grep` both resolve. TASK-015
  must confirm the live run genuinely executes rather than passing because a
  tool was quietly absent.

  The same sharp edge is what makes F8 a blocker rather than an inconvenience:
  "goes RED where it was green" is not hypothetical for `packs/substantiveness`,
  and two shipped `cmd/backstop` tests are standing exactly there.

  ── EXISTENCE-IN-WORLD CHECK: NO LIVE COLLISION, ONE REAL DRAFT OVERLAP ────
  Searched committed and working-tree `plans/` and `specs/` for this surface.

    · SPEC-032 / PLAN-SPEC-032 (both `status: draft`) — ★ RE-CHECKED AND
      CORRECTED 2026-08-16. An earlier revision of this plan said SPEC-032
      "KEPT `rule.File` and touched neither the key drift nor polarity —
      adjacent, not subsuming." That is true ONLY of the `rule.File` half, and
      it was wrong about the rest. Three of this plan's claims are already owned
      by SPEC-032, claim for claim:

        THIS PLAN         SPEC-032 (already specifies the same behavior)
        ─────────         ──────────────────────────────────────────────
        CLM-004           CLM-016 / CLM-017 / CLM-018 / CLM-019 (REQ-004) —
        (polarity)        the same positive-clean-passes / positive-flagged-
                          fails / negative-flagged-passes / negative-not-
                          flagged-fails matrix, split four ways.
        CLM-005           CLM-020 (REQ-004) — a command/convert/SARIF-parse
        (distinct         failure is a HARD fixture error, distinct from a
        engine error)     clean run and never treated as not-flagged.
        CLM-010           CLM-030 / CLM-031 / CLM-032 / CLM-033 / CLM-037
        (rule-ID          (REQ-008) — the rule-ID precheck ENFORCED for the
        precheck by       rule-flags input mode and SKIPPED for `none`,
        input mode)       `config-file`, and `rule-dir`. Note honestly: this
                          is the SAME input_mode-based conditioning the F9
                          finding arrived at independently. F9 was a correct
                          design call, but it was not a NOVEL one — SPEC-032
                          specified it first, and F9's framing as a fresh
                          design correction overstated its originality.

      WHY THIS DOES NOT BLOCK THIS PLAN. Both artifacts are `draft`, so neither
      is in flight, neither is enforced by the gate's test_verification or
      status_drift dimensions, and no implementation is racing this one. This
      plan proceeds as the owner of the three claims above.

      WHY IT STILL NEEDS RESOLVING. SPEC-032 mandates its OWN test names for
      exactly this behavior — `TestPackVal_EngineContract_*` and
      `TestPackVal_EnginePrecheck_*` — which this plan does not write and will
      not cause to exist. If SPEC-032 is later picked up as-written after this
      plan lands, it would either strand those mandated names permanently or
      drive a SECOND, separate implementation of behavior that already shipped.
      Recorded as FOLLOW-ON 9 below; deliberately NOT decided from this lane.

    · PLAN-ISSUE-101, PLAN-SPEC-067, PLAN-ISSUE-113, DIR-024, DIR-032 and
      BACKLOG.yml all reference ISSUE-092 and every one of them explicitly
      DEFERS the fix to it, several while building documented workarounds
      (`scripts/falsify.sh`) around it.
    · ISSUE-140 is adjacent on `executor.go` and disjoint by the F6 split.

  Verdict: no committed or in-flight artifact owns this surface, and this plan
  is the owner. The one real overlap is with a draft spec that has never been
  implemented, and it is carried as a required follow-on rather than silently
  passed over.

  ═══════════════════════════════════════════════════════════════════════════
  CLAIM LEDGER
  ═══════════════════════════════════════════════════════════════════════════

  CLM-001  packval's rule-source key is reconciled onto `rule_path` — the key
           the gate-runtime `Rule` reads and every real pack.yml declares.
           `file:` survives only as a back-compat alias, and exactly ONE
           accessor decides which is in force, so no future caller can re-derive
           the choice differently.

  CLM-002  phase 3 GENUINELY DISPATCHES for a `rule_path:`-declared rule:
           `executor.RunEngine` is invoked, once per fixture, with EXPLICIT FILE
           targets (rule file + fixture path) and never a directory — the latter
           pinned by test against ISSUE-091's undercount trap.

  CLM-003  ★ PHASE 3 CAN FAIL. A pack declaring its rule via `rule_path:`, whose
           negative fixture has been rewritten to no longer violate, turns
           `phase3-fixtures` to `fail` and `pack test` to a non-zero exit.
           This is the central deliverable; absent it every other claim here is
           another vacuous green.

  CLM-004  Fixture polarity matches BUNDLE-005 REQ-011 on BOTH findings paths: a positive
           fixture that FIRES is a failure (false positive); a negative fixture
           that does NOT fire is a failure. Applied to the ruleset loop and the
           `tool_config` loop alike. The layer-3 validator branches, which are
           already correct because `RunValidator.Passed` means "exited 0", are
           left alone.

  CLM-005  An engine/schema error is a DISTINCT, loud phase-3 error carrying the
           underlying engine message — never folded into "positive fixture
           failed", never silently absorbed into a passing negative.

  CLM-006  phase 1's rule-file-existence structural check is live for
           `rule_path:`-declared rules.

  CLM-007  Layer-3 validator dispatch no longer gates on the RETIRED `Layer`
           field; it keys on the rule declaring a validator, so a real
           engine-model pack's sandbox rule is actually exercised.

  CLM-008  ★ RESCOPED 2026-08-16 (F7 ruling). END TO END THROUGH THE CLI, on a
           SEMGREP-ONLY SYNTHETIC PACK CORPUS: `backstop pack test` over the
           honest `rulepath-pack` reaches `phase3-fixtures: pass` having actually
           dispatched (non-zero dispatch count, non-trivial duration), and over
           `rulepath-pack-broken-negative` reaches `phase3-fixtures: fail` with a
           non-zero exit. The claim is deliberately proven on a corpus that
           exercises THIS lane's mechanism — the struct drift, the dead dispatch,
           the inverted polarity — and nothing else.
           WHAT THIS CLAIM NO LONGER ASSERTS, and why: the earlier wording
           promised that `packs/substantiveness` and `packs/contracts` execute
           fixtures and pass. Neither can, for three defects that are not this
           one (F7), so that promise was unachievable and has been withdrawn
           rather than quietly weakened. The real-fleet assertion moves to the
           F7 follow-ons, where the packs can first be made able to dispatch.

  CLM-009  A drift guard fails the build if the authoring-time and gate-runtime
           `Rule` structs ever again disagree about which yaml key names a
           rule's source file. This is what stops the whole class from
           recurring silently, which is ISSUE-092 Direction item 1's actual ask.

  CLM-010  ★ FOLDED IN 2026-08-16 (F8 ruling). The `semgrep-rule-id` cross-check
           runs ONLY for a rule whose RESOLVED engine binding declares
           `input_mode: rule-flags` — the mode under which the declared file IS
           a list of rules carrying ids. A `config-file` engine, whose declared
           file names rule DIRECTORIES and carries no ids, is no longer failed
           by a check written for a different file shape. The condition is the
           DECLARED input mode, NEVER the engine's name: a baked engine-name
           literal would trade one thin-executor violation for a smaller one,
           and would also silently un-fail `hermetic/fixture-fail-pack` (F9).

  ═══════════════════════════════════════════════════════════════════════════
  CITATION DISCIPLINE
  ═══════════════════════════════════════════════════════════════════════════
  `pkg/packval/phase3.go` is edited by three separate phases of this plan, so
