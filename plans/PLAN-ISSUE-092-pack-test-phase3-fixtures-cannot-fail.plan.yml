      - id: TASK-012
        type: implementation
        title: "Condition the rule-ID cross-check on the resolved binding's declared input mode"
        description: |
          In `pkg/packval/phase3.go` `RunFixtures`, in the RULESET rule loop
          (locate by the `semgrep-rule-id` `Check` string, not by line number).

          1. REORDER. Move the `resolveEngine` call AHEAD of the rule-source-file
             read and the rule-ID cross-check. The binding's `InputMode` is the
             condition, and it is not in hand until the resolve has run. Keep the
             existing fail-loud `engine-resolve` error exactly as it is (ISSUE-019
             — an unknown engine must never be a silent skip), and keep
             `haveBinding` meaning what it means today.

          2. CONDITION. Run the rule-source-file read and
             `semgrepFileContainsRuleID` only when a binding resolved AND
             `binding.InputMode == engine.InputModeRuleFlags`
             (`pkg/pack/engine/binding.go`). The read-failure branch moves inside
             the same condition — file EXISTENCE is phase 1's job for every engine
             under CLM-006, so nothing is lost, and a config-file engine's project
             config is no longer read by a phase that cannot interpret it.

          ⚠ DO NOT CONDITION ON `rule.Engine == "semgrep"`. A baked engine-name
          literal in the binary violates the thin-executor first principle, and
          F9 records the concrete damage: `hermetic/fixture-fail-pack` declares a
          pack-declared `marker-scan` engine and a CLAIMLESS rule, so the rule-ID
          mismatch is its ONLY failure mechanism — under a name check it would
          silently start PASSING `pack test`, breaking a shipped distribution
          test and SPEC-069's in-flight work. It declares `input_mode:
          rule-flags`, so the input-mode condition keeps it failing. Read F9.

          Leave the `semgrep-rule-id` `Check` string and
          `semgrepFileContainsRuleID`'s own name and YAML parsing ALONE. Renaming
          them is churn with cross-lane risk (the string appears in
          fixture-fail-pack's README and pack.yml and in SPEC-069's vocabulary)
          and no behavioral gain; the naming question is recorded as a
          non-blocking follow-on note alongside BUNDLE-005 REQ-012.

          Leave the `tool_config` loop alone — it has no rule-ID cross-check.
          `pkg/packval/executor.go` remains OUT OF SCOPE (F6).
        files:
          - pkg/packval/phase3.go
        claims:
          - CLM-010
        depends_on:
          - TASK-011

