  - id: phase-3
    name: "Phase 3: Correct fixture polarity to the BUNDLE-005 REQ-011 contract"
    tasks:
      - id: TASK-005
        type: test
        title: "Rewrite the defect-pinned mandated tests and add explicit polarity tests"
        description: |
          The four polarity tests in
          `pkg/packval/packval_phase3_exec_test.go` currently assert the INVERSE of
          what their names say (see F5). THEIR NAMES SURVIVE; rewrite the BODIES.
          To be precise about why, because an earlier revision overstated it (F5):
          SPEC-014 is `draft` and enforces nothing mechanically, so this is NOT a
          mandated-test-name obligation. The names are kept for CONTINUITY (they
          are cited in SPEC-014 and the issue record) and to avoid churning the
          one part that was already correct — the names always stated the contract
          properly; only the bodies asserted its inverse.

          First fix the helper that made the inversion invisible: `newFixtureMock`'s
          parameters are named `passPos, failNeg` but actually control whether each
          fixture FIRES. Rename them to `posFires, negFires` and make the body read
          straightforwardly (`Passed: negFires` for negative targets, `Passed:
          posFires` otherwise). The old `Passed: !failNeg` double negative is a large
          part of why this survived review.

          Then rewrite each test to the BUNDLE-005 REQ-011 contract:
            · `TestPackVal_P3_SemgrepPositivePass` — positive does NOT fire ⇒ pass.
            · `TestPackVal_P3_SemgrepPositiveFalsePositive` — positive DOES fire ⇒
              fail, and the error's `Check` identifies the positive path.
            · `TestPackVal_P3_SemgrepNegativeAllTrigger` — negative DOES fire ⇒ pass.
            · `TestPackVal_P3_SemgrepNegativeNotTriggered` — negative does NOT fire ⇒
              fail. This is the case the FixHint was always written for.
          These four must no longer be three byte-identical calls: give each the mock
          configuration its own name describes, so each genuinely discriminates.

          `TestPackVal_P3_NegativeFixtureEngineLimitationHint` — keep the name, and
          re-point it at the corrected branch: the hint must appear when the negative
          fixture did NOT fire, which is the only case its wording ever described.

          Same correction for the tool_config trio, names preserved:
          `TestPackVal_P3_ToolConfigPositiveClean` (positive does not fire ⇒ pass),
          `TestPackVal_P3_ToolConfigNegativeNotTriggered` (negative does not fire ⇒
          fail), `TestPackVal_P3_ToolConfigNegativeTriggered` (negative fires ⇒ pass).

          Add two new tests stating the contract in one place so it is greppable:
          `TestPackVal_P3_PositiveFixtureThatFiresIsAFailure` and
          `TestPackVal_P3_NegativeFixtureThatDoesNotFireIsAFailure` (CLM-004).

          Add `TestPackVal_P3_ValidatorPolarityUnchangedByFindingsFix` (CLM-004) —
          a guard that the layer-3 validator branches were NOT flipped along with the
          findings branches. Their `Passed` means "exited 0", so they are already
          correct; this test exists to stop a well-meaning sweep from inverting them
          on the theory that the whole file was backwards.

          ★ THE REST OF THE COLLATERAL — the part an earlier revision of this task
          missed. F5 enumerates it in full; this task owns ALL of it. Every
          `newFixtureMock(true, true)` call site currently expects a pass and goes
          RED under the correction, because `(true, true)` is the false-positive
          FAILURE case once the contract is honored. Work the list from F5, do not
          work from the four polarity tests alone. In particular, and by name:

            · `TestPackVal_P3_SemgrepRuleIDMatch` — a byte-identical
              `(true, true)`-expects-pass call. Rewrite it so it asserts the
              rule-ID match with a mock configuration that is polarity-CORRECT,
              i.e. its pass verdict comes from the rule ID matching rather than
              from fixtures that happen not to fail.
            · `TestPackVal_P3_SemgrepRuleIDMismatch` — this one may still be green
              afterwards, which is the trap. It must be RE-VERIFIED, not merely
              observed: confirm it still fails for the RULE-ID reason and not for
              the polarity reason. A test that goes red for the wrong reason and
              green for the wrong reason has stopped discriminating.

            · THE SAME TRAP, FOUR MORE TIMES. F5 enumerates SIX `(true, true)`
              call sites that expect a FAIL, not one. After the polarity
              correction `(true, true)` means the positive fires AND the negative
              does not — BOTH fixtures fail — so a fail-expecting assertion is
              satisfied INCIDENTALLY, whether or not the test's own discriminating
              logic still works. Each of these four (SemgrepRuleIDMismatch above is
              the fifth; `ToolConfigNegativeNotTriggered` is the sixth and is
              already covered by the tool_config trio rewrite above — do NOT
              rewrite it twice) must be given a POLARITY-CORRECT base mock, so that
              its `fail` verdict is provably still produced by its own override.
              RE-VERIFY the fail verdict in each case, do not merely observe green:
                - `TestPackVal_P3_Layer3PositiveExitNonZero`
                  (`packval_phase3_exec_test.go:320` at HEAD) — the fail must still
                  come from its own `ValidatorFn` override returning `Passed:false`.
                - `TestPackVal_P3_Layer3NegativeExitZero`
                  (`packval_phase3_exec_test.go:334` at HEAD) — the fail must still
                  come from its own `ValidatorFn` override returning `Passed:true`.
                - `TestPackVal_P3_CompleteScaffoldTestFails`
                  (`packval_phase3_exec_test.go:366` at HEAD) — the fail must still
                  come from its own `ScaffoldTestFn` override returning
                  `Passed:false`.
                - `TestPackVal_P3_SDKProvidesMissing`
                  (`packval_phase3_exec_test.go:417` at HEAD) — the fail must still
                  come from the empty entry in `SDK.Provides`.
              In each case confirm the fail does NOT come from the mock's polarity
              having gone silently vacuous. The cheapest honest check is to
              neutralize the test's own override (or, for SDKProvidesMissing, its
              manifest edit) against the corrected base mock and confirm the test
              then PASSES — proving the override, not the base polarity, is what
              produces the fail.
            · `TestPackVal_P3_ToolConfigDispatchesGeneric`,
              `TestPackVal_P3_Layer3SingleFileInvocation`,
              `TestPackVal_P3_Layer3MultiFileInvocation`,
              `TestPackVal_P3_Layer3PositiveExitZero`,
              `TestPackVal_P3_Layer3NegativeExitNonZero` — none is ABOUT findings
              polarity, but each runs a `baseManifest()` whose findings fixtures
              dispatch, so the phase verdict they assert on moves underneath them.
              Give each the mock configuration its own subject requires.
            · any scaffold/SDK test in the same file built on `baseManifest()`.
              Sweep the file rather than trusting this list to be exhaustive:
              grep `newFixtureMock(` and account for EVERY hit.

            · `pkg/packval/packval_phase456_pipeline_test.go` — one
              `NewPipeline(..., Executor: newFixtureMock(true, true)).Run()` over a
              manifest declaring `file: rules/r1.yml`. It dispatches and reds. This
              file was in no task's scope before; it is in this one now.

            · `pkg/packval/coverage_error_paths_test.go` — package `packval`, so it
              does NOT use `newFixtureMock` and a grep for that helper misses it
              entirely. TWO tests there are pinned to the inverted contract and both
              must be rewritten:
                - `TestPackVal_P3_SemgrepPositiveFixtureFails` drives a mock
                  returning `Passed:false` for everything and expects a
                  `semgrep-positive` error. Under the correction a non-firing
                  positive is a PASS; the error now comes from the non-firing
                  NEGATIVE. Rewrite it to assert the false-positive case its name
                  is closest to, or rename-in-place is NOT required — keep the name
                  and make the body assert `semgrep-positive` for a positive that
                  FIRES.
                - `TestPackVal_P3_SemgrepNegativeNotTriggered` (a DIFFERENT function
                  that happens to share a name with one in the `packval_test`
                  package — do not confuse them) drives `Passed:true` for everything
                  and expects the `semgrep-negative` FixHint. Under the correction a
                  firing negative PASSES. Rewrite it to drive a non-firing negative,
                  which is the case its name and the FixHint always described.
        files:
          - pkg/packval/packval_phase3_exec_test.go
          - pkg/packval/packval_phase456_pipeline_test.go
          - pkg/packval/coverage_error_paths_test.go
          - pkg/packval/phase3_polarity_test.go
        claims:
