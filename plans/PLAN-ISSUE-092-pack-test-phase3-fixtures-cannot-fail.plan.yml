phases:
  - id: phase-1
    name: "Phase 1: Fixture packs that can actually falsify"
    tasks:
      - id: TASK-001
        type: setup
        title: "Scaffold testdata packs: an honest rule_path pack, a broken-negative pack, and an engine-error pack"
        description: |
          Create three testdata packs under `pkg/packval/testdata/`. These are the
          substrate every later claim is proven against, so they must be REAL —
          genuine semgrep rule files and genuine Go fixtures that genuinely do and
          do not violate. A hand-waved fixture here produces a hand-waved proof
          later (fixtures-from-real-output is founder law).

          (1) `rulepath-pack/` — the honest pack. `pack.yml` declares ONE rule with
              `engine: semgrep` and `rule_path: rules/no-global.yml`, and NO `file:`
              key. Its claim declares fixtures in BUNDLE-005 REQ-011 polarity:
                positive: fixtures/valid/clean.go      (does NOT violate)
                negative: fixtures/invalid/violating.go (DOES violate)
              `rules/no-global.yml` must be a real semgrep rule whose `id` equals
              the pack's declared rule id — the rule-ID cross-check keys on that
              equality and this pack must satisfy it.

              VERIFY BY RUNNING, not by inspection: invoke semgrep directly on both
              fixtures with this rule file and confirm it reports a finding on
              `violating.go` and zero findings on `clean.go`. Capture what the tool
              actually emitted. If the rule does not fire, fix the FIXTURE or the
              RULE until it does — do not proceed with a fixture pair that cannot
              falsify, because CLM-003 is worthless on top of one.

          (2) `rulepath-pack-broken-negative/` — THE FALSIFICATION PACK, the direct
              analogue of the reproduction recorded in ISSUE-092. Identical to (1)
              in every respect EXCEPT that its negative fixture is a compliant file
              that violates nothing. This pack MUST make phase 3 fail once the lane
              lands; it is the entire evidentiary basis of CLM-003.

          (3) `engine-error-pack/` — identical to (1) except `rules/broken.yml` is
              structurally invalid to the engine (a malformed rule entry), mirroring
              the "silent schema-break false-pass" trap ISSUE-092 records. Confirm by
              direct invocation that the engine ERRORS on it rather than quietly
              reporting zero findings, and record in a comment what it actually did —
              CLM-005's test is built against observed behavior, not assumed behavior.

          Do NOT add a `file:` key to any of these. The whole point is that they
          declare rules the way real packs do.

          SEMGREP ONLY, DELIBERATELY. Every pack here declares `engine: semgrep`
          and a semgrep rule file. Do not reach for ast-grep or a pattern-arg
          engine to "cover more" — F7 records three separate defects that make
          non-semgrep engines unable to complete phase 3 at all, none of which
          this lane fixes. A semgrep-only corpus is the corpus that genuinely
          exercises THIS lane's mechanism, and CLM-008 rests on it.

          ★ THE PACKS MUST BE COMPLETE ENOUGH TO REACH PHASE 3 — this is the
          difference between the plan's central CLI evidence existing and not.
          `Pipeline.Run` (pkg/packval/pipeline.go) runs phases in order and STOPS
          at the first `fail`, marking everything after it `skipped`. Phases 1
          and 2 run BEFORE phase 3, so a manifest that trips either one yields
          `phase3-fixtures: skipped` — never `fail` and never `pass` — and
          TASK-015's evidence silently never materializes. Phases 4, 5 and 6 run
          AFTER phase 3, so they do not gate phase 3 itself, but they DO gate the
          overall `pack test` exit code that TASK-015 step 1 reports on.
          So: all of 1, 2, 4, 5 and 6 must genuinely pass for the honest pack.

          Do not hand-derive the required field set from the schema — VERIFY BY
          RUNNING. Iterate `./bin/backstop pack check <pack-dir>` (which runs
          phases 1/2/4/5/6 and skips phase 3 by design) until it is CLEAN for
          each of the three packs, and only then move on. Two known traps worth
          naming so they are not rediscovered the hard way:
            · phase 6 requires a `bypass_attempt: true` fixture on every claim of
              any rule declaring `risk_class: security`. Declare
              `risk_class: correctness` on these rules — they are testing
              dispatch mechanics, not a security property, so `correctness` is
              the honest declaration AND it sidesteps the requirement.
            · phase 2 requires every claim to carry BOTH a non-empty positive and
              a non-empty negative fixture list.
          `engine-error-pack` is expected to reach phase 3 and FAIL THERE; it must
          still clear phases 1 and 2 to get that far, so it needs a rule file that
          EXISTS (phase 1 stats it) while being invalid to the ENGINE.
        files:
          - pkg/packval/testdata/rulepath-pack/pack.yml
          - pkg/packval/testdata/rulepath-pack/rules/no-global.yml
          - pkg/packval/testdata/rulepath-pack/fixtures/valid/clean.go
          - pkg/packval/testdata/rulepath-pack/fixtures/invalid/violating.go
          - pkg/packval/testdata/rulepath-pack-broken-negative/pack.yml
          - pkg/packval/testdata/rulepath-pack-broken-negative/rules/no-global.yml
          - pkg/packval/testdata/rulepath-pack-broken-negative/fixtures/valid/clean.go
          - pkg/packval/testdata/rulepath-pack-broken-negative/fixtures/invalid/compliant.go
          - pkg/packval/testdata/engine-error-pack/pack.yml
          - pkg/packval/testdata/engine-error-pack/rules/broken.yml
        claims:
          - CLM-002
          - CLM-003
          - CLM-005
        depends_on: []

  - id: phase-2
    name: "Phase 2: Reconcile the rule-source key onto rule_path"
    tasks:
      - id: TASK-002
        type: test
        title: "Write the dispatch, drift-guard, phase-1 existence and central falsification tests — all red"
        description: |
          Write the tests that prove packval reads the key real packs declare. All
          of these are RED at authoring time; several stay red until Phase 3's
          polarity correction lands, which is expected and is called out per test.

          `TestPackVal_ManifestRuleSourceKeyMatchesGateRuntimeModel` (CLM-001,
          CLM-009) — THE DRIFT GUARD. Reflect over BOTH `packval.Rule` and
          `pack.Rule` and assert they agree on the yaml key that names a rule's
          source file: `pack.Rule` must expose `rule_path`, and `packval.Rule` must
          expose it too. This test must FAIL if either struct later drops or renames
          that key. Assert on the STRUCT TAGS via reflection — not on a hand-copied
          string constant, which would drift in exactly the way this guards against.

          `TestPackVal_RuleSourcePathPrefersRulePathAndFallsBackToFile` (CLM-001) —
          the single accessor: `rule_path` alone resolves to it; `file` alone
          resolves to it; both present resolves to `rule_path` (runtime model wins);
          neither present resolves to empty.

