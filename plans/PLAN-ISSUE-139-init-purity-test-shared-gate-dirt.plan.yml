          - TASK-003

      - id: TASK-005
        type: verification
        title: "Validate the artifacts this lane moves, and hand off the spec amendment"
        description: |
          This lane closes an issue and completes a plan, so both artifacts move and
          both must validate:

              ./bin/backstop artifact validate --plan PLAN-ISSUE-139
              ./bin/backstop artifact validate --issue ISSUE-139

          Report true exit codes for both.

          ARTIFACT STATUS IS NOT THE IMPLEMENTER'S TO FLIP BY HAND. Route the status
          transitions and any close-out banner through the purpose-built agents
          (`/plan` for this plan, `/issue` for ISSUE-139). This task VERIFIES that
          the artifacts validate; it does not author them.

          ── A SPEC AMENDMENT IS OWED (sharp edge 7). SURFACE IT, DO NOT MAKE IT ──
          SPEC-069 CLM-063's text reads "this spec's implementation changes no file
          under `pkg/gate`" — a description of the mechanism this lane retires. The
          claim's INTENT is unchanged and still enforced; its WORDING now describes
          something the test no longer does. Hand this to the spec-author agent with
          the substance already worked out, so it is not re-derived:

            * the enforced property is now "no file under `pkg/gate` references
              init", asserted over file content rather than working-tree state;
            * the reason is ISSUE-139 — a `git status` snapshot in a working tree
              shared by concurrent sessions attributes nothing, so the old wording
              described an unenforceable check;
            * CLM-063's second half (the remoteless message is not masked) is
              unchanged and its subtest was carried forward unedited;
            * REQ-013's own text and SPEC-069's design section 9 stay TRUE as
              written and need no edit — it is the CLAIM text alone that drifted.

          Two further notes for whoever writes ISSUE-139's resolution, both findings
          rather than tidying:

            1. THE ISSUE'S PREFERRED FIX WAS UNBUILDABLE. Its Solution section
               suggested a static check that init's source "import or reference no
               `pkg/gate` symbol". `cmd/backstop/init_seams.go` is in the init
               source set and legitimately imports `pkg/gate` to build
               `initGateRunner`, so that check would have red on arrival. REQ-013
               forbids CHANGING gate files, not CONSUMING gate API — a distinction
               the issue did not draw and the resolution should.
            2. THE DEFECT WAS NOT LIVE AT FIX TIME. By 2026-08-16 the tree was clean
               under both paths, so the shipped check was passing VACUOUSLY rather
               than failing. That does not reduce the defect — a check with no teeth
