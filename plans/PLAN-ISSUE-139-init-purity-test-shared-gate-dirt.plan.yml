          (2) ADD THE WALK. `gatePackageFiles(t *testing.T) []string` enumerates
              every `.go` file under `repositoryRoot(t)/pkg/gate` recursively,
              INCLUDING `_test.go` files — a gate test that knows about init is the
              same leak — but SKIPPING every `testdata/` directory it encounters
              (`filepath.SkipDir` on a directory entry named `testdata`). It
              `t.Fatal`s on an empty enumeration, in the spirit of `initSourceSet`'s
              own emptiness guard (sharp edge 5).

              THE `testdata/` EXCLUSION IS PRESCRIBED, NOT OPTIONAL. `pkg/gate/
              testdata/` holds synthetic fixture projects with invented artifact IDs
              (SPEC-900…999); a fixture exercising the gate against an init-created
              project may legitimately contain the words "backstop init" in prose,
              and fataling on that would blame fixture DATA for a property only
              gate SOURCE can violate. Put that reason in the helper's docstring so
              a later reader does not simplify the skip away.

              At planning time this yields 108 files (133 under `pkg/gate` in total,
              25 of them under `testdata/`). Do NOT hard-code either number — assert
              non-empty. The count is stated here so an implementer seeing a wildly
              different enumeration knows the walk is wrong.

          (3) REWRITE THE MANDATED SUBTEST. In
              `TestInit_ChangesNoGatePackageFileAndDoesNotMaskTheRemotelessMessage`,
              replace the FIRST subtest's body entirely:

                * DELETE the `exec.LookPath("git")` skip, both
                  `exec.Command("git", "status", "--porcelain", …)` constructions,
                  the `t.Fatalf` that blames all `pkg/gate` dirt on init, and the
                  unreachable non-vacuity skip guard that followed it. They retire
                  together — the guard exists only to compensate for the snapshot.
                * DROP `"os/exec"` from the import block (sharp edge 3).
                * ADD: for each file from `gatePackageFiles`, read it and `t.Fatalf`
                  on any `initReferencesIn` match, naming the file, the matched
                  substring, and why it is a violation — gate machinery that knows
                  about init is init reaching into a package REQ-013 puts off
                  limits, and its owner is ISSUE-056.
                * RENAME the `t.Run` sub-name to state what is now asserted (sharp
                  edge 2 — grep the old string first, and report rather than rename
                  if anything holds it).
                * REWRITE the ★ comment above it. The current one argues
                  working-tree-vs-HEAD over merge-base for attribution reasons; that
                  argument is now retired and leaving it would mislead. Replace it
                  with the reason the scan runs in the OTHER direction: `pkg/gate`
                  has no legitimate reason to name init, so a reference there is
                  attributable, whereas a `git status` snapshot of a shared tree
                  attributes nothing. Name ISSUE-139.
                * STATE THE ACCEPTED RESIDUAL in that comment: this does not catch a
                  `pkg/gate` edit that never mentions init, no test in a shared tree
                  can, and that residual is left to diff-scoped `backstop gate` and
                  review. An honest limitation in the docstring is the point.

          LEAVE THE SECOND SUBTEST ("the remoteless message is not masked") ENTIRELY
          UNEDITED (CLM-004). It is the other half of CLM-063 and it is not defective.

          DO NOT rename the top-level test function (sharp edge 1). DO NOT edit any
          file under `pkg/gate` or `cmd/backstop` — in particular, do not "clean up"
          `init_seams.go`'s `pkg/gate` import, which is legitimate and load-bearing
          (CLM-005). If your diff has two files, stop.
        files:
          - pkg/initialize/sourceset_scan_test.go
        claims:
          - CLM-001
          - CLM-002
          - CLM-003
          - CLM-004
          - CLM-005
        depends_on:
