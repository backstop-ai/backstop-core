      - id: TASK-003
        type: verification
        title: "Gate the change diff-scoped, and prove both directions by falsification"
        description: |
          Inner loop first, then the diff-scoped gate:

              go build ./... && go test ./pkg/initialize/ -race -count=1
              go build -o bin/backstop ./cmd/backstop/
              ./bin/backstop gate

          Then TWO falsification passes. These are the evidence this lane is judged
          on — a green suite alone proves nothing here, because the new assertion is
          true on arrival.

          (A) THE LEAK IS CAUGHT. Use an UNTRACKED PROBE FILE — never an edit to a
              tracked `pkg/gate` file. Create `pkg/gate/zz_issue139_probe.go`
              containing exactly a package clause and an init-referencing comment:

                  package gate

                  // accommodation for backstop init

              The new check reads the FILESYSTEM, not git state, so an untracked
              file exercises it just as well as an edit would. Re-run the mandated
              test and confirm it FATALS, naming `zz_issue139_probe.go` and the
              matched substring. Then DELETE the probe file (`rm`). Confirm
              `git status --porcelain -- pkg/gate` is back to its pre-probe reading
              and report both readings.

              WHY A PROBE AND NOT AN EDIT-AND-REVERT: `git checkout -- <file>` on a
              tracked `pkg/gate` file destroys any uncommitted work another live
              lane has in that file — the same destruction class this project's bare
              `git stash` ban exists to prevent (sharp edge 8). This lane runs NO
              `git checkout` at all. Deleting a file you yourself created a moment
              earlier can harm nobody; discarding changes to a file you did not
              write can. That also makes (A) symmetric with (B) below, which already
              works this way.

          (B) THE FALSE POSITIVE IS GONE — the direct proof ISSUE-139 was filed for.
              Create an UNTRACKED probe file under `pkg/gate` (e.g.
              `pkg/gate/zz-issue139-probe.txt`, content irrelevant). Confirm
              `git status --porcelain -- pkg/gate` now reports it. With that dirt
              present, re-run the mandated test and confirm it PASSES. Delete the
              probe file.

              This is exactly the state that fataled before this lane: `pkg/gate`
              dirty, `pkg/initialize` committed and clean. Report the observed
              tree state alongside the result rather than asserting it — if
              `pkg/initialize` happens to carry your own uncommitted work at that
              moment, say so, because it changes which branch of the OLD code would
              have run and therefore what the comparison means.

          Also confirm, from the diffstat, that exactly ONE file changed in this
          lane: `pkg/initialize/sourceset_scan_test.go` (CLM-005). Report true exit
          codes for every command. If `gate` reports a violation this lane did not
          cause, name it and leave it — the tree is shared and chasing it from
          inside this lane is how scope leaks.
        files:
          - pkg/initialize/sourceset_scan_test.go
        claims:
          - CLM-001
          - CLM-002
          - CLM-003
          - CLM-005
        depends_on:
          - TASK-002

  - id: phase-2
    name: "Phase 2: Full-sweep verification and artifact validation"
    tasks:
      - id: TASK-004
        type: verification
        title: "Full unscoped kill chain"
        description: |
          Run the complete gate, unscoped:

              ./bin/backstop gate --all

          Every dimension, no diff scoping. Report the true exit code and the
          per-dimension verdicts. This is the reading that covers test_verification,
          substantiveness, coverage, contracts and artifact_status_drift — the last
          of which is the one that matters most here, because sharp edge 1's pinned
          test name is exactly what it reads.

          Also confirm the full suite:

              go test ./... -race -count=1

          IF OTHER AGENTS ARE MID-FLIGHT IN THIS SHARED WORKING TREE, a full
          `gate --all` or `go test ./...` reads THEIR half-finished work as well as
          yours. Check first. If the tree is contended, say so, run the targeted
          `./pkg/initialize/` sweep instead, and hand off the full reading as
          explicitly NOT taken rather than reporting a number you cannot attribute.
          A carried-forward gap named honestly beats an unattributable green — which
          is, in miniature, the same lesson this whole lane is about.
        files:
          - pkg/initialize/sourceset_scan_test.go
        claims:
          - CLM-001
          - CLM-002
          - CLM-003
          - CLM-004
          - CLM-005
