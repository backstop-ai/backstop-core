  through the SAME `buildGateSteps` assembly `backstop gate` uses, because a second
  assembly would make init observe a different gate than `backstop gate` runs
  (init_seams.go's own docstring says so).

  REQ-013 forbids CHANGING files under `pkg/gate`. It does not forbid CONSUMING the
  gate's exported API. A scan that conflated the two would force an implementer to
  either delete init's gate wiring or waive the check — both worse than the defect.

  ── THE MECHANISM THIS LANE ADOPTS: INVERT THE DIRECTION OF THE SCAN ───────
  The shipped check asks "did anything under pkg/gate change?" — a property of a
  CHANGE SET. A `git status` snapshot of a working tree shared by concurrent
  sessions cannot observe a change set, which is exactly ISSUE-139 Part 1.

  The answerable question, asked in the opposite direction, is:

      DOES ANY FILE UNDER pkg/gate KNOW ABOUT INIT?

  A leak of the kind REQ-013 exists to prevent — an init implementer reaching into
  gate machinery to make init's story come out right — leaves a trace IN pkg/gate:
  an import of `pkg/initialize`, an `initialize.` selector, or an accommodation
  comment naming init or SPEC-069. `pkg/gate` has no other reason to name init; the
  dependency runs the other way, through `cmd/backstop`, by design.

  This property is:
    * ATTRIBUTABLE — a reference to init inside gate is init's, not another lane's;
    * SHARED-TREE-INDEPENDENT — it reads file CONTENT, never `git status`, so a
      concurrent lane's uncommitted work under pkg/gate cannot trip it;
    * ALWAYS-ON — it holds in a committed tree, which is where the shipped check
      has no teeth at all.

  THE SCAN BOUNDARY IS DECIDED HERE, NOT LEFT TO THE IMPLEMENTER: every `.go` file
  under `pkg/gate` INCLUDING `_test.go`, EXCLUDING anything under a `testdata/`
  directory. That is 108 files at planning time, out of 133 under the tree as a
  whole — the 25-file difference is entirely `pkg/gate/testdata/`.

  THE EXCLUSION IS DELIBERATE AND LOAD-BEARING. `pkg/gate/testdata/` holds synthetic
  fixture PROJECTS — whole miniature repos carrying invented artifact IDs
  (SPEC-900/901/902/903/904/905/906/999) that exist to drive gate behavior. They are
  test INPUT, not gate source, and a future fixture exercising the gate against an
  init-created project could legitimately contain the prose "backstop init" in a
  fixture spec or README. Scanning them would fatal this claim on data that proves
  nothing about whether gate SOURCE knows about init — the question CLM-001 actually
  asks. Fixture content may reference anything; source may not.

  MEASURED BEFORE BEING PRESCRIBED. Run while planning, over exactly that 108-file
