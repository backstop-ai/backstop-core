              behavior (the new classifier is separate and TYPE-aware).
            - TestResolveArtifactStatus_ExportedForReuse (CLM-013): the resolver
              entrypoint and record type are exported (assert by calling them as
              package consumers would), proving ISSUE-043 can reuse the
              status+mandated-test resolution without touching step internals.
            - TestResolveArtifactStatus_IssueToPlanLinkage (CLM-014): the resolver
              indexes plans by `spec_id` and exposes, for an issue ISSUE-NNN, the
