            directive queued/active/specced→non-terminal, done→success,
            replaced/canceled→retired; plan draft/ready/implementing→non-terminal,
            completed→success, replaced/canceled→retired.
  CLM-003 — TERMINAL-RETIRED artifacts (replaced/canceled/deprecated) STAY
            excluded — no delivery obligation, no violation — preserving
            ISSUE-031's retired-exclusion; isTerminalSpecStatus and the
            test_verification/coverage/contracts exclusions are left untouched.
  CLM-004 — success-terminal + any mandated test ABSENT (existence, full-sweep) →
            BLOCK, reusing the ClassDeclaredIntentUnmet broken-promise treatment.
            This carves the success-terminal case back IN from today's blanket
            terminal exclusion. It is the drift dimension's ONE independent,
            sound, novel BLOCK contribution. Under the applies-to:new-code policy
            + refreshed baseline (CLM-015) pre-existing absences grandfather; only
            NEW success-terminal-with-absent-test blocks.
  CLM-005 — A FAILING (but present) mandated test on a success-terminal artifact
            is NOT independently attributed by the drift dimension — the gate
