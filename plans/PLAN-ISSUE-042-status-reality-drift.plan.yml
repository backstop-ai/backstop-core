            validator can lean on the same issue→plan resolution.
  CLM-002 — A per-artifact-TYPE status classifier maps each declared status to
            exactly one of {non-terminal, success-terminal, retired-terminal}:
            issue open/ready/in-progress/blocked→non-terminal, closed→success,
            replaced/canceled→retired; spec draft/ready-for-implementation→
            non-terminal, implemented→success, replaced/canceled/deprecated→
