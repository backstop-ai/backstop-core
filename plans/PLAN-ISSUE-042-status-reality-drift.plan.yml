          - pkg/gate/testdata/artifact_status/README.md
        claims:
          - CLM-001
          - CLM-002
          - CLM-003
          - CLM-013
          - CLM-014
        depends_on: []

      - id: TASK-002
        type: implementation
        title: "Implement the exported artifact-status resolver + type-aware three-class status classifier"
        description: |
          Add pkg/gate/artifact_status.go: an EXPORTED resolver that walks a
          project root's issues/ specs/ directives/ plans/ directories and
          returns per-artifact records of (id, kind, declared status, mandated
