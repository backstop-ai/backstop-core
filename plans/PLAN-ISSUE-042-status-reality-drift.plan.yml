notes: |
  ─────────────────────────────────────────────────────────────────────────
  WHAT THIS DELIVERS (ISSUE-042, parent DIR-016 — issue/plan lifecycle hardening)
  ─────────────────────────────────────────────────────────────────────────
  A NEW NATIVE gate dimension that cross-checks each artifact's declared `status`
  against the observable reality of its mandated tests, making status↔reality
  drift LOUD. This is the ENFORCEMENT half; ISSUE-043 (the cheap-close half)
  FOLLOWS and reuses this plan's resolver substrate — build the resolver clean
  and reusable (CLM-001, CLM-013).

  ─────────────────────────────────────────────────────────────────────────
  POLARITY (PINNED — mirrors pkg/gate/traceability_polarity.go's broken-promise
  model; reuse its vocabulary, do NOT invent new classes)
  ─────────────────────────────────────────────────────────────────────────
  - Delivered-but-not-terminal (issue open/ready/in-progress/blocked; spec
    draft/ready-for-implementation; directive queued/active/specced; plan
    draft/ready/implementing) + ALL mandated tests PRESENT → WARN (non-blocking,
    exit 0, guidance-only; loudness on the report surface).
  - Success-terminal (issue `closed`; spec `implemented`; directive `done`; plan
    `completed`) + any mandated test ABSENT → BLOCK (exit 2), reusing
    ClassDeclaredIntentUnmet's treatment. This is the broken-promise direction.
  HARD CONSTRAINT (do NOT silently upgrade): "delivered" is a HEURISTIC not a
  proof — present named tests suggest their claims are covered, not the whole
  intent. That asymmetry is WHY WARN≠BLOCK. Keep the delivered-but-open direction
  WARN, non-blocking, forever; never make it exit-2.

  ─────────────────────────────────────────────────────────────────────────
  PASS/FAIL IS NOT INDEPENDENTLY SOURCEABLE — the drift dim checks EXISTENCE only
  (review blocker #1 — the "gate already computes a per-test verdict" premise was
  FACTUALLY FALSE and is corrected here)
  ─────────────────────────────────────────────────────────────────────────
  Traced against the real gate: it yields only (a) the PRESENT test-name set via
  collectTestFuncNames (existence, full-sweep, real); (b) a WHOLE-SUITE pass/fail
  from pack_engines (`go test ./...` → SARIF — NO per-test-name outcome map); and
  (c) per-FILE coverage. There is NO per-test pass/fail verdict type anywhere in
  the gate. So the drift dimension CANNOT independently attribute a failing test
  to an artifact, and MUST NOT pretend to.
  Lean on the whole-suite invariant instead: because pack_engines runs the WHOLE
  suite, if the test step is GREEN then every present test (mandated included)
  passed; if any mandated test FAILS, pack_engines is ALREADY red (exit 2). So
  "success-terminal + FAILING mandated test → BLOCK" is SUBSUMED by the existing
  pack_engines/test step — the drift dimension does not re-derive it. The drift
  dimension's sourceable, novel, sound contributions are exactly TWO:
    (i)  success-terminal + ABSENT mandated test → BLOCK (full-sweep existence —
         real, cheap, sound; the existing test_verification step only checks
         existence for NON-terminal specs, and skips ALL terminal artifacts, so
         success-terminal existence is genuinely un-covered today), and
    (ii) delivered-but-open (present tests) → WARN.
  Do NOT add a per-test-verdict field, do NOT thread a fictional failing-test set,
  do NOT re-run the suite in this step.

  ─────────────────────────────────────────────────────────────────────────
  ISSUE-031 NEEDLE (critical — do NOT break retired-exclusion)
  ─────────────────────────────────────────────────────────────────────────
  Today ALL terminal artifacts are EXCLUDED from gate enforcement
  (isTerminalSpecStatus at pkg/gate/step_testverify.go:123/166/482/526 folds
  replaced/canceled/deprecated together and skips them). This dimension must
  distinguish:
    - TERMINAL-RETIRED (replaced/canceled/deprecated) — legitimately excluded,
      no delivery obligation, STAYS excluded, emits NO violation.
    - TERMINAL-SUCCESS (issue closed / spec implemented / directive done / plan
      completed) — carved back IN: its mandated tests MUST be PRESENT (existence),
      else BLOCK. (Failing-but-present is already caught by pack_engines — see the
      premise-correction note; the drift dim contributes the ABSENCE check only.)
  Do NOT weaken the existing retired-exclusion used by test_verification /
  coverage / contracts; introduce a SEPARATE status classifier that names the
  three classes (non-terminal / success-terminal / retired-terminal) per
  artifact TYPE, and leave isTerminalSpecStatus untouched.

  ─────────────────────────────────────────────────────────────────────────
  SCOPE — FULL-SWEEP for the cheap static checks (PINNED, not diff-scope only)
  ─────────────────────────────────────────────────────────────────────────
  Motivating case: ISSUE-018/034/035/036 shipped in d5efd5b while still
  `status: open`, their issue FILES not in the diff — diff-scope alone provably
  misses this. So:
    - Status parse + mandated-test EXISTENCE resolution runs FULL-SWEEP over ALL
      artifacts (issues/ specs/ directives/ plans/) every gate run. This is
      cheap: a frontmatter read plus test-name presence against the SAME
      found-test set collectTestFuncNames already builds (a whole-repo test-file
      walk that is already full-sweep). Existence does NOT consult activeScope.
      EXISTENCE is the ONLY signal this dimension computes.
    - PASS/FAIL is NOT this dimension's job (see the premise-correction note
      above): a failing mandated test is already caught by the whole-suite
      pack_engines/test step (exit 2), so the drift dim does not re-derive it and
      threads no failing-test set. The only sweepable-cheap signal here is
      EXISTENCE.

  ─────────────────────────────────────────────────────────────────────────
  BLAST RADIUS + BASELINE (review blocker #2 — wiring the full-sweep BLOCK naively
  turns the REAL gate RED; un-vacuum→baseline pattern, see MEMORY
  project_unvacuum_baseline_ratchet)
  ─────────────────────────────────────────────────────────────────────────
  Measured real-tree drift is NOT "maybe one stale artifact" — it is ~84 stranded
  mandated tests on success-terminal artifacts from DELIBERATE prior eradications:
    - 5 closed issues (ISSUE-002/003/005/006/008) mandating deleted TestCodeCheck_*
      (~30 absent, from the `backstop code check` eradication), and
    - completed PLAN-SPEC-001 with 54/54 mandated tests absent (the standards-
      compiler, eradicated in the packs-only cutover).
  Under a naive CLM-004 (success-terminal + absent → BLOCK, full-sweep) that is
  ~84 NEW blocking violations on the CLEAN tree — directly contradicting CLM-012
  ("gate stays green"). Blast radius is ONLY closed-issues + the completed-plan:
  implemented SPECS already flow through test_verification and are green (not a
  new risk); done DIRECTIVES carry tests:0 (won't block).
  RESOLUTION (the blessed un-vacuum→baseline ratchet, NOT masking):
    1. Pin THIS dimension's backstop.yml policy to `applies-to: new-code` (+ level
       block), so pre-existing success-terminal broken promises grandfather
       against the baseline and only GOING-FORWARD closes-with-absent-tests block.
    2. Refresh the baseline (`backstop baseline generate`, full scope) so the ~84
       historical stranded promises are captured as the floor.
    3. Do NOT reconcile the 84 inline. File a FOLLOW-UP ISSUE (via issue-author)
       capturing the stranded-lineage reconciliation — retire/repoint the
       closed-issue + completed-plan mandated tests deliberately deleted by the
       code-check / standards eradications. FLAG the retirement-vocab GAP: a
       delivered-THEN-obsoleted artifact fits none of replaced/canceled/deprecated
       cleanly (this is deletion-strands-lineage). That drain is a separate track.
  TRADEOFF, stated explicitly: historical eradication-stranded promises are
  grandfathered (not fixed now); every NEW success-terminal-with-absent-test
  blocks. This is the ratchet, not amnesty.

  ─────────────────────────────────────────────────────────────────────────
  NATIVE GATE STEP, NOT A PACK (PINNED)
  ─────────────────────────────────────────────────────────────────────────
  This enforces backstop's OWN artifact lifecycle (status vs mandated tests) —
  backstop-domain like test_verification / traceability_polarity, all native.
  The "dogfood rules as packs" rule targets LANGUAGE/tool knowledge, which this
  is NOT. Do NOT force this into a semgrep/ast-grep pack. It carries no baked
  language noun (it reads artifact frontmatter + reuses the pack-declared
  discovery already merged into the gate), so it stays thin-executor clean.

  ─────────────────────────────────────────────────────────────────────────
  REUSE / WHERE IT LIVES
  ─────────────────────────────────────────────────────────────────────────
  New resolver + step alongside pkg/gate/step_testverify.go and
  pkg/gate/traceability_polarity.go, consuming ExtractMandatedTests /
  MandatedTest / ResolveMandatedTestPaths / collectTestFuncNames — do NOT
  reimplement mandated-test discovery. Wired into buildGateSteps
  (cmd/backstop/gate.go). The dimension gets a canonical StepName (result.go)
  and a backstop.yml enforcement.policy entry (level: block, applies-to:
  new-code, per the ISSUE-041 applies-to model). The intrinsic WARN direction is
  NOT a policy knob — it is the step's own non-blocking status; the policy entry
  governs the BLOCK direction the way every other dimension's does.

  ISSUE→PLAN LINKAGE (review fix #4): the Phase-1 resolver additionally builds the
  cross-artifact issue→plan linkage — which plan delivers which issue — by indexing
  plans by their `spec_id` field (a plan for ISSUE-NNN carries `spec_id: ISSUE-NNN`;
  confirmed the convention across the existing PLAN-ISSUE-* files). This is a REAL
  resolver OUTPUT (not just a claim of reusability): ISSUE-043's delivered_by /
  close-friction validator reuses it directly, and it is useful HERE too (resolving
  a closed issue's backing plan). Cheap — one pass indexing plans by spec_id.

  ─────────────────────────────────────────────────────────────────────────
  VERIFICATION COMMANDS
  ─────────────────────────────────────────────────────────────────────────
  Inner-loop verification tasks run `go test` scoped to the touched packages
  (`backstop code check` is REMOVED — do not prescribe it). The final phase runs
  `backstop baseline generate` (to grandfather the ~84 historical stranded
  promises) THEN the full `backstop gate` kill chain AND `backstop artifact
  validate` (this change touches backstop artifact/config surface — this plan
  file and backstop.yml — in addition to .go files, so both are required). The
  new full-sweep dimension WILL surface the ~84 real historical broken promises
  on this repo's own artifacts; under applies-to:new-code + a refreshed baseline
  they grandfather (green), and the stranded-lineage drain is tracked in the
  follow-up issue (CLM-016) — NOT reconciled inline, NOT masked.

  ─────────────────────────────────────────────────────────────────────────
  CLAIMS (enumerated from the issue Solution + the pinned decisions + the
  acceptance list; every task maps ≥1; every claim mapped by ≥1 task)
  ─────────────────────────────────────────────────────────────────────────
  CLM-001 — A unified artifact RESOLVER extends the currently spec-shaped
            frontmatter parsing to also parse issues/ plans/ directives/ (plus
            specs/) for `status` + mandated tests, REUSING ExtractMandatedTests /
            MandatedTest machinery (not reimplementing mandated-test discovery).
