phases:
  # ═══════════════════════════════════════════════════════════════════════
  # Phase 1: Shared resolver substrate — status + mandated tests across ALL
  # artifact types (reused by ISSUE-043)
  # ═══════════════════════════════════════════════════════════════════════
  - id: phase-1
    name: "Phase 1: TDD — Unified Artifact Status + Mandated-Test Resolver"
    tasks:
      - id: TASK-001
        type: test
        title: "Failing resolver tests: parse status + mandated tests across issues/specs/directives/plans; classify status into three classes"
        description: |
          Add pkg/gate/artifact_status_test.go plus fixtures under
          pkg/gate/testdata/artifact_status/ (a tiny issues/ specs/ directives/
          plans/ tree) exercising the REAL resolver and status classifier the
          drift dimension will consume. This is the substrate ISSUE-043 also
          reuses (CLM-001, CLM-013), so test it as a first-class exported unit,
          NOT only through the eventual step.

          The resolver MUST reuse ExtractMandatedTests / MandatedTest for
          spec-shaped mandated-test discovery and must NOT reimplement test-name
          extraction; the new code only ADDS status classification and the
          issues/plans/directives frontmatter parsing the spec path lacks.

          Mandated test names (exact):
            - TestResolveArtifactStatus_ParsesAllArtifactKinds (CLM-001): the
              resolver walks issues/ specs/ directives/ plans/ under a fixture
              root and returns one record per artifact carrying (id, kind,
              declared status, mandated test names). Assert an issue's
              claims→tests and a spec's claims→tests are both surfaced via the
              reused ExtractMandatedTests machinery, and that a directive/plan
              record carries its declared status even when it declares no own
              tests.
            - TestClassifyArtifactStatus_ThreeClassesPerType (CLM-002): table
              over every status enum value for each type — issue
              (open/ready/in-progress/blocked/closed/replaced/canceled), spec
              (draft/ready-for-implementation/implemented/replaced/canceled/
