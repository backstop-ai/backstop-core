  CLM-006 — non-terminal status + ALL mandated tests PRESENT → WARN (non-blocking,
            exit 0), guidance to advance/close. Never upgraded to exit-2 — the
            delivered-heuristic-not-proof asymmetry is preserved.
  CLM-007 — FULL-SWEEP: status parse + mandated-test EXISTENCE resolution runs
            over ALL artifacts every gate run (not diff-scope only), so a stale
            status on an artifact whose FILE is not in the diff is still caught
