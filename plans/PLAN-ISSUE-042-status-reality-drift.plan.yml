  CLM-008 — EXISTENCE is the ONLY signal this dimension computes: it is sweepable-
            cheap (a frontmatter read + test-name presence against the full-repo
            found-test set) and runs full-sweep regardless of scope. Pass/fail is
            explicitly OUT of this dimension's scope (subsumed by pack_engines,
