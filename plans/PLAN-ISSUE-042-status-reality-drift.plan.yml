        claims:
          - CLM-003
          - CLM-004
          - CLM-005
          - CLM-006
          - CLM-008
        depends_on:
          - TASK-003

      - id: TASK-005
        type: implementation
        title: "Implement the drift classifier + StepResult builder (WARN/BLOCK/excluded) and register the canonical StepName"
        description: |
          Add pkg/gate/status_drift.go: consume the Phase-1 resolver records plus
          ONE supplied signal — the PRESENT test-name set (from
          collectTestFuncNames, full-sweep) — and emit a StepResult per the pinned
          polarity. The classifier takes NO pass/fail set (there is no per-test
