             is the CLM-004 guard, and it MUST test the record's Class, never
             isTerminalSpecStatus (they disagree on "obsoleted"; see CLM-004).

             Add a comment at this site recording SE1: this works only because the plan
             walk runs LAST in this function, after specs / bundles / issues /
