    CLM-001  THE FIX. A plan record's MandatedTests is DERIVED from its tasks'
             `claims[]` entries resolved against the source artifact's (its
             `spec_id`) claim→tests map, so a plan whose mandated tests live only
             in task-description prose becomes machine-visible without any edit to
             the plan file. Closes the issue's core finding that a plan's prose
             mandated tests and its machine-readable MandatedTests are two
             independent, unsynchronised representations.

    CLM-002  THE DIR-032 VERIFICATION BAR, MET LITERALLY. A NON-TERMINAL plan whose
             derived mandated tests are ALL PRESENT produces an
             `artifact_status_drift_advisory` warning. DIR-032 item 11 states this
             bar in terms and explicitly rejects a fixture that is only a `completed`
             plan ("re-proves the already-working path and nothing else"), so the
             fixture for this claim is a `draft` plan carrying NO test_names.

    CLM-003  THE NEGATIVE CONTROL THAT KEEPS CLM-002 HONEST. A non-terminal plan with
             ANY derived mandated test ABSENT produces NO advisory. Without it,
             CLM-002 could be satisfied by code that warns on every non-terminal plan
             unconditionally — which would be a worse defect wearing a fix's clothes.

    CLM-004  A RETIRED SOURCE CONTRIBUTES NOTHING. When the source artifact's record
             class is `ClassRetiredTerminal` (replaced / canceled / deprecated /
             obsoleted), its claims are RETRACTED and the plan inherits none of them.
             A plan must never be held to, or credited with, a promise its source has
             withdrawn.

             THE GUARD MUST KEY ON THE RECORD'S `Class`, NEVER ON
             `isTerminalSpecStatus`. The two genuinely disagree: `isTerminalSpecStatus`
             (pkg/gate/step_testverify.go) returns false for `obsoleted`, while
             `ClassifyArtifactStatus` returns ClassRetiredTerminal for it. So an
             `obsoleted` SPEC still flows through ExtractMandatedTests and DOES carry
             MandatedTests on its record — which is precisely why this guard is
             load-bearing rather than redundant, and why its fixture is an obsoleted
             SPEC and not an obsoleted issue.

    CLM-005  UNION AND DEDUPE. Explicit `test_names` keep working EXACTLY as today —
             derivation is additive, never a replacement — and a name reachable BOTH
             explicitly and by derivation appears in MandatedTests exactly ONCE.
             Duplication is not cosmetic here: two identical MandatedTest entries
             yield two byte-identical drift violations on the same file with the same
             message, i.e. a doubled baseline identity for one real finding.

    CLM-006  AN UNRESOLVED CLAIM REFERENCE IS SILENT, NOT A FINDING. A task claim that
             resolves to nothing — because the source declares no `claims[].tests`, or
             declares no claim by that id — contributes zero mandated tests and emits
             no violation of any kind. Measured: 3506 of 9402 plan-task claim
             references in the current corpus do not resolve, overwhelmingly because
             131 of 148 issues carry no claims block at all. Making that a finding
             would red the corpus for a documentation gap this plan is not scoped to
             close. See the RESIDUALS section.

    CLM-007  THE SUCCESS-TERMINAL DIRECTION GAINS THE SAME REACH. A `completed` plan
             with a DERIVED mandated test that is ABSENT blocks as a broken promise,
             identically to one declared via explicit `test_names`. Derivation must
             not be a second-class channel that only ever warns.

    CLM-008  THE ADVISORY REMAINS STRUCTURALLY NON-BLOCKING. Every violation the
             derived path adds on the non-terminal side carries severity `warning`
             and routes to `StepArtifactStatusDriftAdvisory` via `SplitDriftResult`,
             never to the policied `StepArtifactStatusDrift` block surface. The
             delivered-heuristic-is-not-proof asymmetry is preserved exactly.

    CLM-009  THE SCHEMA STOPS MISDESCRIBING THE MECHANISM. artifacts/plan/v1/schema.json's
             `task_test_names_description` currently reads as though `test_names` is
             the ONLY channel by which a plan's mandated tests reach
             artifact_status_drift. After this change that sentence is false, and a
             false schema description is how the next author re-derives the wrong
             mental model. `test_names` STAYS OPTIONAL — no structural schema change,
             description text only.

  ── SHARP EDGES ───────────────────────────────────────────────────────────
    SE1  RESOLUTION ORDER IS LOAD-BEARING AND ALREADY CORRECT — DO NOT REORDER.
         `ResolveArtifactStatus` walks specs, then bundles, then issues, then
         directives, then PLANS LAST. Derivation depends on that: the source records
         it reads must already be appended to res.Records when the plan walk runs.
         Building the claim index from the already-appended records is therefore a
         single pass with no second walk of specs/ or issues/. If a future change
         moves the plan walk earlier, derivation silently resolves nothing and every
         test in this plan goes green-but-vacuous. TASK-005 must add a comment at the
         plan-walk site saying so.

    SE2  DERIVED ATTRIBUTION POINTS AT THE PLAN, NOT THE SOURCE. A derived
         MandatedTest carries `SpecFile` = the PLAN's path and `SpecID` = the PLAN's
         id, matching `planTaskMandatedTests` exactly, so the drift violation
         attributes to the plan whose status is wrong. Pointing SpecFile at the source
         spec would file the finding against an artifact that is not drifting.
         `ClaimID` for a DERIVED entry carries the SOURCE CLAIM id (CLM-NNN), because
         `driftBrokenPromiseMessage` renders it as ", claim %s" and the source claim
         is what explains why the test is owed. Note that `planTaskMandatedTests`
         puts the TASK id in that same field for explicit entries; that pre-existing
         choice is left UNCHANGED — do not churn it, and do not "harmonise" the two.

    SE3  DEDUPE ON FUNCTION NAME, WITHIN ONE PLAN ONLY. Two tasks legitimately claim
         the same CLM, and a task legitimately lists a name its claim also yields.
         The dedupe key is the mandated test FUNCTION NAME within a single plan's
         record. It must NOT be global across plans — two different plans may each
         legitimately owe the same test name.

    SE4  EXPLICIT WINS THE DEDUPE. When a name is reachable both ways, keep the
         EXPLICIT entry (with its task-id ClaimID), not the derived one. Explicit
         declaration is the author's direct statement and its attribution is the more
         specific of the two. State this in the code, because either choice passes a
         naive "appears once" assertion and only one is intended.

    SE5  A `nil`/absent claims array on a task is normal and silent. `planTaskNode`
         gains `Claims []string` and yaml simply leaves it nil for a task that has
         none. No error, no default, no warning.

    SE6  DO NOT TOUCH `looksDelivered`. Its `len(rec.MandatedTests) == 0` early
         return is correct and is NOT the defect — see WHY THE MECHANISM IS NOT THE
         BUG above. An implementer who "fixes" it there converts a starved advisory
         into an advisory that fires on every non-terminal artifact in the repo.

    SE7  DO NOT TOUCH pkg/validate/plan.go. Direction (a) is rejected on measured
         grounds recorded above. Adding a test_names requirement there is out of
         scope and would red 52 plans against a non-grandfathering policy.

    SE8  FIXTURES LIVE UNDER testdata/ AND ARE EXCLUDED FROM THE CORPUS SCANS BY
         NAME. `pkg/artifact/layout.go`'s `nonCorpusDirNames` is exactly
         {".git", "testdata", "prototype"}, so the artifact-shaped .spec.md /
         .issue.md / .plan.yml fixtures this plan adds cannot trip
         `FindUngatedArtifacts` and cannot enter `backstop artifact validate`.
         Verified by reading that list. A fixture placed anywhere else WOULD trip it,
         and artifact_validation does not grandfather.

    SE9  THE FIXTURE SET MUST FALSIFY, NOT ILLUSTRATE. Fixture-derived expectations
         are chosen so a broken implementation fails: the retired-source plan's
         withdrawn test name IS in the present-set, so a missing retired guard makes
         its plan look delivered and fires a spurious advisory; the completed union
         plan's derived-absent test is what proves CLM-007 rather than assuming it.

  ── FALSIFICATION BAR ─────────────────────────────────────────────────────
  Every mandated test named in TASK-003 and TASK-004 MUST be observed FAILING on the
  pre-fix tree before TASK-005 begins, and the observed failure mode must be the
  predicted one — the plan records resolve with EMPTY MandatedTests and
  ClassifyStatusDrift emits no advisory — not a compile error, not a missing fixture,
  not a helper panic. An implementer who cannot produce the predicted red must STOP
  and report rather than proceed to green.

  ONE DOCUMENTED EXCEPTION IS ALLOWED, and only this one:
  TestResolveArtifactStatus_PlanUnresolvedClaimRefContributesNothing (CLM-006) asserts
  that an unresolvable claim yields NOTHING, which is already true pre-fix. It is a
  non-regression guard whose whole purpose is that the new derivation does not start
  inventing entries for unresolved claims. Making it fail first would require breaking
  the behavior it exists to protect. Report it as this exception; do not manufacture a
  false red for it.

