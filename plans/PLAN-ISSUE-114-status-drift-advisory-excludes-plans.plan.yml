  ── THE FIX: DERIVE, DO NOT MANDATE ────────────────────────────────────────
  ISSUE-114 offers two directions and prescribes neither. DIR-032 additionally
  requires the planner to state explicitly whether the fix is retroactive. Both
  directions were measured on the real corpus before choosing.

  DIRECTION (a) — make `test_names` load-bearing in pkg/validate/plan.go —
  IS REJECTED, on measured grounds:
    * 47 of 48 `draft` plans and 5 of 6 `ready` plans declare no test_names, so an
      error-severity rule reds 52 plans at once.
    * backstop.yml policies `artifact_validation` as `level: block` with NO
      `applies-to: new-code`. Verified by reading backstop.yml. It therefore does
      NOT grandfather against .backstop/baseline.json — unlike artifact_status_drift,
      which does. Every one of those 52 findings would block immediately, taking
      `backstop gate --all` hard red with no baseline relief, mid-launch.
    * 23 of 70 `completed` plans also lack the field, and completed plans are never
      rewritten (the convention ISSUE-149 states in terms). A blanket requirement
      would red immutable records that cannot legitimately be fixed.
    * A warning-severity variant avoids the red but changes no data, so the advisory
      stays starved — it would be ceremony, not a fix.

  DIRECTION (b) — task-claims-derived mandated tests — IS ADOPTED. Every plan task
  ALREADY carries a required `claims: [CLM-NNN]` array (D-080 enforces it), and the
  source spec/issue ALREADY carries the structured `claims[].tests` those ids point
