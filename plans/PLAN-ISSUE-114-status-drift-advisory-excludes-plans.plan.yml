             — for each phase, each task, each claim id, look up (fm.SpecID, claimID) and
             emit one MandatedTest per source test name with:
               FuncName = the source test name
               SpecFile = `path`        (the PLAN's path — SE2)
               SpecID   = fm.PlanID     (the PLAN's id  — SE2)
               ClaimID  = the SOURCE claim id (CLM-NNN) (SE2)
