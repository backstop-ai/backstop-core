          MANDATED TEST NAMES (exact — do not rename, do not add suffixes):

            TestResolveArtifactStatus_PlanDerivesMandatedTestsFromTaskClaims (CLM-001)
              PLAN-SPEC-850's record carries a MandatedTest named TestPlanDerive_Present,
              derived purely from its task's claims: [CLM-001] against SPEC-850 —
              the plan file declares no test_names anywhere. Assert BOTH that the name is
              present AND (SE2) that the entry's SpecFile is the PLAN's path and SpecID is
              "PLAN-SPEC-850", never SPEC-850's, and that ClaimID is "CLM-001".

            TestResolveArtifactStatus_PlanDerivationSkipsRetiredSource (CLM-004)
              PLAN-SPEC-856's record carries ZERO MandatedTests, because SPEC-856 is
              `obsoleted`. Assert len == 0 and, to keep the test honest, assert in the
              same test that SPEC-856's OWN record DOES carry TestPlanDerive_RetiredOnly —
              proving the source is non-empty and the plan's emptiness is the guard's
              doing, not an empty-input artifact.

            TestResolveArtifactStatus_PlanDerivationReadsRecordClassNotIsTerminalSpecStatus (CLM-004)
              Pin the disagreement the guard depends on: assert
              isTerminalSpecStatus("obsoleted") == false while
              ClassifyArtifactStatus(KindSpec, "obsoleted") == ClassRetiredTerminal, and
              that PLAN-SPEC-856 derives nothing. A future refactor that reaches for
