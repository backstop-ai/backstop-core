            TestResolveArtifactStatus_PlanDerivationUnionsExplicitTestNamesWithoutDuplicates (CLM-005)
              PLAN-SPEC-854 declares test_names: [TestPlanDerive_Present] AND derives
              {TestPlanDerive_Present, TestPlanDerive_Absent} from CLM-001. Assert the
              record's MandatedTests contains TestPlanDerive_Present EXACTLY ONCE (count
              it — a `contains` check cannot fail here) and TestPlanDerive_Absent once, so
              exactly two entries total. Assert (SE4) the surviving Present entry is the
