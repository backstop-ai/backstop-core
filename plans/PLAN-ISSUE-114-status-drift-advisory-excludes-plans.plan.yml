  ── CONTAINMENT: WHO ELSE READS rec.MandatedTests ──────────────────────────
  Enlarging a plan record's MandatedTests is safe, but NOT because the field has a
  single consumer — it has TWO real non-test readers. Enumerate them REPO-WIDE, not
  just under pkg/gate/ (a pkg/gate/-only sweep misses the second one entirely):
    `grep -rn "MandatedTests" --include='*.go' . | grep -v '_test\.go'`
  That sweep yields exactly two reads of the field:
    1. pkg/gate/status_drift.go:42,76,79 — `ClassifyStatusDrift` and `looksDelivered`.
       This is the consumer this plan is deliberately enlarging.
    2. cmd/backstop/gate.go:1094-1095 — inside `computeDriftSurfaces` (defined at
       :1092), which aggregates EVERY record's MandatedTests into a local `all`, then
       feeds it `ResolveMandatedTestPaths` -> `ResolvePresentTestNames`. That is the
       construction of the PRESENT-SET that `ClassifyStatusDrift` is judged against.
  Every remaining hit is a write, a doc comment in artifact_status.go, or a reference
  to the separate `ExtractMandatedTests` function (not the record field).

  Consumer 2 does not break containment; it is the reason containment holds, and the
  reason is a strict-subset argument rather than a non-consumption argument. The names
  this plan derives for a plan record are its source artifact's claim tests — names
  that already reach `all` via that SOURCE record's own MandatedTests. So the derived
  names are a STRICT SUBSET of what `computeDriftSurfaces` already aggregates:
  measured ZERO novel names across the corpus, i.e. the present-set is bit-identical
  before and after this fix. Enlarging the plan record therefore changes only which
  records are CLASSIFIED, never the set they are classified against.
    * test_verification and test_substantiveness do NOT read the field at all — both
      source their mandated tests from `gate.ExtractMandatedTests(specDir)`, SPECS
      ONLY. Confirmed at pkg/gate/step_testverify.go:393 and cmd/backstop/gate.go:1243.
      Derived plan tests therefore cannot reach the blocking test_verification step.
    * requirement_traceability consumes ArtifactStatusRecord but reads status /
      BundleName / BundleReqs, never MandatedTests.
  This containment argument is WHY the change is safe. If a future lane adds a THIRD
  consumer of rec.MandatedTests, it must re-establish it — and must run the repo-wide
  sweep above, not a package-scoped one.

  ── CLAIMS ────────────────────────────────────────────────────────────────
  This plan is issue-sourced and ISSUE-114 carries no claims[] block, so the plan
