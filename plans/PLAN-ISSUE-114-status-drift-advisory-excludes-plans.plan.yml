             one plan record (SE3). Leave `planTaskMandatedTests` itself UNCHANGED,
             including its task-id-in-ClaimID convention.

          5. Update the `planFrontmatter` doc comment, whose current text —
             "yaml ignores tasks that carry no test_names, so plans authored before this
             field carry no MandatedTests (unchanged)" — becomes FALSE with this change
