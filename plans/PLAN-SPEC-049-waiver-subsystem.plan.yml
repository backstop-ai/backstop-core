        title: "Write the DSL grammar + closed reason-code enum tests (ParseToken)"
        description: |
          pkg/waiver/waiver_grammar_test.go — failing-first over ParseToken and the
          ReasonCode enum:
            - a well-formed @waiver:<rule>:<reason>:<expiry> token parses into a
              populated Waiver (CLM-001);
            - an optional trailing free-text note is captured (CLM-002);
            - an optional issue reference is captured (CLM-003);
            - each of the four closed reason-codes false-positive / accepted-risk /
