      harvests tokens by reading RAW line bytes via LineReader over the finding's
      association window (same-line-trailing OR the single line immediately above),
      parses each via ParseToken, suppresses ONLY on an EXACT rule-id match with
      per-finding location identity (no file/rule blanket), and records malformed
      tokens as Diagnostic{Kind:"malformed"}. Adjudicate takes NO language
      identifier and invokes NO comment parser (the load-bearing zero-baked
      property — CLM-011 absence). Three parallel failing-first test files (disjoint)
      feed ONE core implementation; expiry, unused detection, and non-waivable
      enforcement are layered in Phases B and C.
