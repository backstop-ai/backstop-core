              short-lived default (CLM-016..018);
            - an ACTIVE (unexpired) waiver suppresses its finding (CLM-019);
            - an EXPIRED waiver does NOT suppress — the finding re-fires under normal
              enforcement at the instant of expiry (CLM-020, Sharp Edge 5);
            - a loud pre-expiry warning is emitted within the grace window before a
              waiver expires (CLM-021).
        files:
