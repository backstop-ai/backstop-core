  # ═══════════════════════════════════════════════════════════════════════
  - id: phase-c
    name: "Phase C: Declared Non-Waivable Tier"
    description: |
      Add the non-waivable check to Adjudicate (pkg/waiver/adjudicate.go) and a
      concrete DECLARED Policy (pkg/waiver/policy.go) constructed from a supplied
      non-waivable set (rule-ids + a critical-severity predicate) — NOT a
      core-hardcoded list (CLM-027). When policy.Waivable(ruleID, severity) is false,
      the token does not suppress and becomes a Diagnostic{Kind:"non-waivable"} gate
      error; a normal (undeclared) rule remains waivable. The shipped configuration
      places backstop/self rules and critical-severity secrets in the non-waivable
      set. The non-waivable guarantee is airtight only for engine-EMITTED findings
      (backstop/self via SARIF), not engine-native allows — Sharp Edge 3, out of
      scope by design. Two parallel failing-first test files feed one implementation.
    tasks:
