  # ═══════════════════════════════════════════════════════════════════════
  # PHASE C — Seed C: the DECLARED non-waivable tier. Waivability is decided by
  # a Policy supplied to adjudication (never core-hardcoded); a @waiver on a
  # policy-declared non-waivable rule is a gate ERROR (Diagnostic{Kind:
