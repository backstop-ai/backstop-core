  # ═══════════════════════════════════════════════════════════════════════
  # PHASE B — Seed B: lifecycle & expiry. Reason-code default durations,
  # active-suppresses / expired-re-fires, the loud pre-expiry warning, and
  # unused/dangling detection (incl. the pack-rename -> unused path). Covers
  # REQ-004 and REQ-005 (+ CLM-040 rename). Edits pkg/waiver (sequential on A).
  # ═══════════════════════════════════════════════════════════════════════
  - id: phase-b
    name: "Phase B: Lifecycle, Expiry & Unused/Dangling Detection"
    description: |
      Layer the lifecycle onto pkg/waiver: DefaultDuration(rc) and the Waiver.Expired
      method (pkg/waiver/waiver.go), and Adjudicate's lifecycle classification pass
      (pkg/waiver/adjudicate.go) — an ACTIVE (unexpired) matched waiver suppresses;
      an EXPIRED waiver does NOT (the finding re-fires immediately, no post-expiry
      grace — Sharp Edge 5); waivers inside the grace window are recorded Expiring
      for the loud pre-expiry warning; and any token whose associated location has
      no matching live finding is recorded Unused (a WARNING), including the
      pack-rename case where a stale rule-id matches nothing. Two parallel
      failing-first test files feed one implementation; sequential on Phase A.
    tasks:
