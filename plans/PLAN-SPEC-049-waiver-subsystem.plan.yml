notes: |
  Implements SPEC-049 (BUNDLE-013 waiver subsystem) as ONE coupled plan phased
  along the spec's four seeds A -> B -> C -> D, each phase built failing-first
  (TDD) and closed by a middle-phase `backstop code check`; a final phase runs the
  full `backstop gate`.

  ════════════════════════════════════════════════════════════════════════════
  THE LOAD-BEARING PROPERTY IS ZERO-BAKED ADJUDICATION (Phase A / Sharp Edge 1)
  ════════════════════════════════════════════════════════════════════════════
  Adjudicate(findings, LineReader, policy, now) receives NO language identifier
  and invokes NO comment/source parser — it byte-scans the RAW bytes of the
  finding's own SARIF-reported association window (the finding's start line and
  the single line immediately above it) for a literal `@waiver:` occurrence.
  CLM-011 is an absence claim asserting exactly this. Any language/comment
  parameter on the suppression path is a defect, not a feature. The pkg/waiver
  core (Phase A) is fully unit-testable with an in-memory LineReader — no gate,
  no engine, no fixture.

  ════════════════════════════════════════════════════════════════════════════
  PHASE D IS THE INTEGRATION-GAP RISK — PROVE THE WIRING, NOT JUST THE UNITS
  ════════════════════════════════════════════════════════════════════════════
  Suppression is a Run-loop RECONCILIATION pass (computeWaiverResult) modeled on
  the shipped computeBaselineResult (pkg/gate/gate.go:163): a StepFunc returns
  only its OWN result and CANNOT delete a preceding step's violations, so waiver
  suppression MUST be a reconciliation pass that mutates the ALREADY-accumulated
  results. It collects the WAIVABLE surface — the LIVE `pack_engines` and
  `test_substantiveness` dimensions (NOT the removed `code_check`; feeding a dead
  dimension = an EMPTY waivable surface = vacuous green AND the backstop/self
  gate-ERROR path never fires — Sharp Edge 6), recasts those Violations into
  []waiver.Finding, calls the pure Adjudicate, REMOVES the Suppressed findings
  from the accumulated Violation slices (CLM-067 — the actual subtraction, else it
  suppresses nothing), adds Malformed/NonWaivable diagnostics as gate findings
  (a @waiver on a pack_engines backstop/self rule is thus a gate ERROR — CLM-025),
  persists the active []waiver.Waiver onto a NEW GateResult.ActiveWaivers carrier
  (needed because GateResult/Violation carry no reason-code/expiry — REQ-015), and
  emits the distinct `PASS · N waivers` waiver_resolution StepResult.

  To close the recurring pack-provisioning integration gap, Phase D carries a
  COMMITTED installed-pack fixture and a REAL end-to-end proof (TASK-020) driven
  by a REAL check.CommandRunner over a committed POSIX fake engine — NOT a stubbed
  dispatcher: a @waiver token actually SUPPRESSES a real pack_engines finding in a
  full gate Run (green -> PASS·N-waivers), and a @waiver on a policy-declared
  non-waivable backstop/self rule produces a gate ERROR. The e2e is authored
  failing-first (before the Phase-D impl, which depends on it), so an implementer
  following the DAG observes it RED against the stub and greens it with real
  wiring. Unit isolation alone is INSUFFICIENT for Phase D.

  ════════════════════════════════════════════════════════════════════════════
  THE SHIPPED GATE MUST NOT BE DARK — DEFINED IS NOT ENABLED (REQ-016/REQ-017)
  ════════════════════════════════════════════════════════════════════════════
  Defining computeWaiverResult + the WithWaiver Option in pkg/gate is NOT enough:
  the reconciliation only runs in shipped `backstop gate` if the CONSTRUCTION SITE
  (cmd/backstop/gate.go) actually CALLS WithWaiver — mirroring its gate.WithBaseline
  call (~:114) — with the runtime inputs the pass consumes: a scope LineReader
  (buildWaiverLineReader), the current time, and a PRODUCTION Policy
  (buildWaiverPolicy) built by EXTRACTING the declared non-waivable sets from the
  INSTALLED pack manifests (CLM-027 realized in production, not a hardcoded list).
  TASK-027..032 close this reviewer-flagged gap (no prior task scoped
  cmd/backstop/gate.go): TASK-027 unit-proves the WithWaiver-guarded swap; TASK-029's
  CLI-path proofs drive the REAL shipped construction path (not gate.New in-package),
  failing-first against the dark gate. Ordering matters too: the assembled step list
  currently runs baseline (:707) before waiver (:708); TASK-031 REVERSES it so
  StepWaiverResolution precedes StepBaselineComparison — otherwise an active-waived
  finding is still counted as a NewViolation by baseline_comparison and the ratchet
  (REQ-013) is defeated (REQ-017).

  ════════════════════════════════════════════════════════════════════════════
  THIN-EXECUTOR INVARIANT
  ════════════════════════════════════════════════════════════════════════════
  No language/tool literal enters the adjudication path. The non-waivable set is
  supplied by a declared Policy (pack manifest / enforcement policy), never a
  core-hardcoded list (CLM-027). The e2e fake engine is a committed POSIX script
  (no real semgrep/go/bun in backstop-core's Go CI); backstop does 100% of the
  suppressing because `@waiver` is a token foreign to every engine.

phases:
