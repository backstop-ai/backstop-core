        type: test
        title: "Write tests for manifest loading and file-type routing"
        description: |
          Write failing tests in pkg/check/manifest_test.go covering manifest
          loading, RouteFile logic, and built-in defaults.

          Tests (all mandated by spec):
            - TestCodeCheck_Routing_GoFileAllPasses (CLM-014): load Go-all
              manifest, route a .go file, expect lint+build+test+semgrep
            - TestCodeCheck_Routing_UnmatchedFileNoChecks (CLM-015): route a
              file that matches no manifest entry, expect empty check list
            - TestCodeCheck_Routing_DefaultsWhenNoManifest (CLM-016): load from
              empty directory, verify built-in defaults (Go -> all 4, others ->
              semgrep only)
            - TestCodeCheck_Routing_PathPatternMatching (CLM-017): load manifest
              with path patterns (e.g., "pkg/**/*.go"), verify routing

          Additional edge cases:
            - Multiple extensions (foo.test.go) route correctly
            - Files with no extension route to semgrep-only default
            - Manifest with overlapping patterns uses most specific match
        files:
          - pkg/check/manifest_test.go
        claims:
          - CLM-014
          - CLM-015
          - CLM-016
          - CLM-017
        depends_on:
          - TASK-001

      - id: TASK-006
        type: implementation
        title: "Implement manifest loading and RouteFile"
        description: |
          Create pkg/check/manifest.go with:

          Type CheckType int:
            - CheckTypeLint, CheckTypeBuild, CheckTypeTest, CheckTypeSemgrep

          Type Manifest struct:
            - Rules []ManifestRule
            - Has built-in default rules as fallback

          Type ManifestRule struct:
            - Extensions []string
            - PathPatterns []string
            - CheckTypes []CheckType

          Function LoadManifest(dir string) (*Manifest, error):
            - Read .manifest.json files from dir
            - Parse into Manifest struct
            - If no manifest files found, return Manifest with built-in defaults

          Method (m *Manifest) RouteFile(path string) []CheckType:
            - Match file against manifest rules by extension and path pattern
            - Return applicable CheckTypes
            - Files matching no rules return empty slice

          Built-in defaults (when no manifest):
            - .go files -> lint, build, test, semgrep
            - All other files -> semgrep only (if matching rules exist)

          Sharp edges handled:
            - Multiple extensions (.test.go) — check rightmost first
            - No extension — falls through to path pattern matching
            - Empty manifest directory triggers defaults
        files:
          - pkg/check/manifest.go
        claims:
          - CLM-014
          - CLM-015
          - CLM-016
          - CLM-017
        depends_on:
          - TASK-005

      - id: TASK-007
        type: verification
        title: "Verify manifest loading tests pass"
        description: |
