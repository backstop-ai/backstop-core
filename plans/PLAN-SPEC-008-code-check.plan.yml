---
plan_id: PLAN-SPEC-008
spec_id: SPEC-008
spec_version: 1.0.0
created: "2026-04-04"
status: draft
target_repo: backstop-core
target_module: github.com/bmanson/backstop-core
test_command: "go test ./cmd/backstop/... ./pkg/check/... -run \"TestCodeCheck\" -race -coverprofile=cover.out"
coverage_threshold: 80

notes: |
  Implements backstop code check — four validation passes (lint, build, test,
  semgrep) across three scope modes (diff/all/file) with file-type routing via
  compiled manifests, semgrep auto-install, 2-second budget for --file mode,
  and concurrent invocation safety.

  Depends on SPEC-005 (CLI foundation: config loading, output formatting, exit
  codes), SPEC-009 (pack compile: enforcement manifests), SPEC-012 (Go standards).

  Six feature areas with distinct file scopes:
    1. Scope resolution (pkg/check/scope.go) — git cascade, 3 modes
    2. Manifest loading (pkg/check/manifest.go) — file-type routing
    3. Semgrep management (pkg/check/semgrep.go) — auto-install, locking
    4. Validation engine (pkg/check/check.go) — pass orchestration, timeout
    5. Cobra adapter (cmd/backstop/code_check.go) — thin CLI wiring
    6. Concurrency + integration tests

  Areas 1-3 are independent (disjoint file sets) and can develop in parallel.
  Area 4 depends on 1-3 (orchestrates them). Area 5 depends on 4.
  Area 6 tests cross-cutting concerns after assembly.

  Structure:
    Phase 1: Setup — scaffold pkg/check/, test fixtures
    Phase 2: Scope resolution (test -> impl -> verify) — parallel track A
    Phase 3: Manifest loading (test -> impl -> verify) — parallel track B
    Phase 4: Semgrep management (test -> impl -> verify) — parallel track C
    Phase 5: Validation engine core — pass types + orchestration (test -> impl -> verify)
    Phase 6: Output, exit codes, config integration (test -> impl -> verify)
    Phase 7: Cobra adapter (test -> impl -> verify)
    Phase 8: Concurrency and timeout (test -> impl -> verify)
    Phase 9: Comprehensive verification

  Phases 2-4 are parallel-eligible (disjoint file sets, no dependency chains).

phases:
  # ═══════════════════════════════════════════════════════════════════════
  # Phase 1: Setup — Scaffold and Fixtures
  # ═══════════════════════════════════════════════════════════════════════
  - id: phase-1
    name: "Phase 1: Setup — Scaffold pkg/check/ and Test Fixtures"
    tasks:
