  # ═══════════════════════════════════════════════════════════════════════
  # Phase 5: Validation Engine — Pass Types and Orchestration
  # ═══════════════════════════════════════════════════════════════════════
  - id: phase-5
    name: "Phase 5: Validation Engine — Pass Orchestration and Result Aggregation"
    tasks:
      - id: TASK-011
        type: test
        title: "Write tests for validation engine orchestration"
        description: |
          Write failing tests in pkg/check/check_test.go covering the Run function,
          pass ordering, continuation after violations, and non-applicable pass
          skipping.

          Tests (all mandated by spec):
            - TestCodeCheck_AllPassesRun (CLM-001): mock all 4 passes, verify
              each was invoked and produced violations in result
            - TestCodeCheck_PassesContinueAfterViolation (CLM-002): first pass
              produces violations, verify remaining passes still execute
            - TestCodeCheck_NonApplicablePassSkipped (CLM-003): manifest routes
              file to only lint+build, verify test+semgrep are skipped
            - TestCodeCheck_PassOrderLintBuildTestSemgrep (CLM-004): record
              invocation order, verify lint->build->test->semgrep sequence

          Tool availability tests:
            - TestCodeCheck_Lint_SkippedWhenGolangciLintMissing (CLM-042):
              golangci-lint not on PATH, verify lint skipped with warning
            - TestCodeCheck_Lint_OtherPassesContinueWithoutLint (CLM-043):
              golangci-lint missing, verify build+test+semgrep still run

          Use pass executor interfaces to mock individual pass behavior.
          The engine should accept pass executors as dependencies for testability.
        files:
          - pkg/check/check_test.go
        claims:
          - CLM-001
          - CLM-002
          - CLM-003
          - CLM-004
          - CLM-042
          - CLM-043
        depends_on:
          - TASK-004
          - TASK-007
          - TASK-010

      - id: TASK-012
        type: implementation
        title: "Implement validation engine with pass orchestration"
        description: |
          Create pkg/check/check.go with:

          Type Options struct:
            - Mode ScopeMode
            - FilePath string (for ScopeModeFile)
            - ManifestDir string
            - BackstopDir string
            - PinnedSemgrepVersion string
            - Timeout time.Duration (0 means no timeout)

          Type Violation struct:
            - Pass CheckType
            - File string
            - Line int
            - Message string
            - Severity string

          Type PassResult struct:
            - Pass CheckType
            - Violations []Violation
            - Skipped bool
            - SkipReason string

          Type Result struct:
            - PassResults []PassResult
            - Warnings []string
            - ExitCode int
            - Methods: HasViolations() bool, ViolationCount() int

          Interface PassExecutor:
            - Execute(ctx context.Context, files []string) (*PassResult, error)

          Function Run(ctx context.Context, opts Options) (*Result, error):
            1. Resolve scope via ResolveScope
            2. Load manifest via LoadManifest
            3. Ensure semgrep via EnsureSemgrep (handle ConfigError vs DegradedError)
            4. For each pass in order (lint, build, test, semgrep):
               a. Check manifest routing for applicable files
               b. If no files apply, skip silently
               c. Check tool availability (golangci-lint for lint)
               d. Execute pass via PassExecutor
               e. If context cancelled (timeout), record timeout violation, break
               f. Collect violations
            5. Aggregate into Result

          Default pass executors:
            - LintExecutor: shells out to golangci-lint
            - BuildExecutor: shells out to go build
            - TestExecutor: shells out to go test (package scope for --file mode)
            - SemgrepExecutor: shells out to semgrep with rules from manifest

          Sharp edges handled:
            - golangci-lint not on PATH -> skip lint with warning (CLM-042/043)
            - Context cancellation checked between passes and during execution
            - Test pass in --file mode scopes to file's own package only
        files:
          - pkg/check/check.go
        claims:
          - CLM-001
          - CLM-002
          - CLM-003
          - CLM-004
          - CLM-042
          - CLM-043
        depends_on:
          - TASK-011

      - id: TASK-013
        type: verification
        title: "Verify validation engine tests pass"
        description: |
          Run validation engine tests and lint:
            - go test ./pkg/check/ -run "TestCodeCheck_AllPassesRun|TestCodeCheck_PassesContinue|TestCodeCheck_NonApplicable|TestCodeCheck_PassOrder|TestCodeCheck_Lint" -race -v
            - go vet ./pkg/check/
        files:
          - pkg/check/check.go
          - pkg/check/check_test.go
        claims:
          - CLM-001
          - CLM-004
          - CLM-042
        depends_on:
          - TASK-012

