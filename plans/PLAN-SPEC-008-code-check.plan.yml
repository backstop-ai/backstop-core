            - BACKSTOP_CONFIG env var override
            - Missing .backstop/ directory -> return exit code 2

          Sharp edges handled:
            - NO_COLOR with any value (including empty string) disables color
            - JSON output never contains ANSI codes regardless of NO_COLOR
            - schema_version field is always present in JSON
        files:
