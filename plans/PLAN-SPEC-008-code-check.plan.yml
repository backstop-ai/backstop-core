    tasks:
      - id: TASK-008
        type: test
        title: "Write tests for semgrep auto-install and version management"
        description: |
          Write failing tests in pkg/check/semgrep_test.go covering auto-install,
          version pinning, and failure modes.

          Tests (all mandated by spec):
            - TestCodeCheck_Semgrep_AutoInstallWhenMissing (CLM-018): semgrep not
              on PATH, verify download to .backstop/tools/semgrep
            - TestCodeCheck_Semgrep_WrongVersionExitCode2 (CLM-019): semgrep
              installed at wrong version vs pin, expect config error (not degraded)
            - TestCodeCheck_Semgrep_InstallFailureDegradedMode (CLM-020): simulate
              network failure, expect warning + skip (not exit code 2)
            - TestCodeCheck_Semgrep_UsesPathWhenAvailable (CLM-021): semgrep on
              PATH, verify no auto-install attempted

          Use an installer interface to mock download behavior. Tests should
          verify the distinct failure modes: version mismatch is hard stop (2),
          install failure is degraded mode (warning only).

          Sharp edge coverage: partial binary from killed install, concurrent
          install attempts (tested in phase 8), .backstop/tools/ not existing
          on first invocation.
        files:
          - pkg/check/semgrep_test.go
        claims:
          - CLM-018
          - CLM-019
          - CLM-020
          - CLM-021
        depends_on:
          - TASK-001

      - id: TASK-009
        type: implementation
        title: "Implement semgrep auto-install with version pinning"
        description: |
          Create pkg/check/semgrep.go with:

          Function EnsureSemgrep(backstopDir string, pinnedVersion string) (string, error):
            - Check PATH for existing semgrep binary
            - If found on PATH: verify version if pin exists, return path
            - If not on PATH:
              a. Check .backstop/tools/semgrep exists
              b. If exists: verify version matches pin
              c. If not exists: attempt auto-install
            - Version mismatch -> return typed ConfigError (exit code 2)
            - Install failure -> return typed DegradedError (warning, skip semgrep)

          Type ConfigError struct — signals hard stop (exit 2)
          Type DegradedError struct — signals degraded mode (warning, continue)

          Internal install function:
            - Create .backstop/tools/ directory if not exists
            - Download to temp file in .backstop/tools/
            - Atomic rename to .backstop/tools/semgrep on success
            - Clean up temp file on failure

          Internal version check function:
            - Run semgrep --version
            - Compare against pinned version

          Sharp edges handled:
            - .backstop/tools/ directory creation on first invocation
            - Atomic rename prevents partial binary on kill
            - Temp file cleanup on download failure
        files:
          - pkg/check/semgrep.go
        claims:
          - CLM-018
          - CLM-019
          - CLM-020
          - CLM-021
        depends_on:
          - TASK-008

      - id: TASK-010
        type: verification
        title: "Verify semgrep management tests pass"
        description: |
          Run semgrep management tests and lint:
            - go test ./pkg/check/ -run "TestCodeCheck_Semgrep" -race -v
            - go vet ./pkg/check/
        files:
