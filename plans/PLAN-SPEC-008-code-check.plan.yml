  # ═══════════════════════════════════════════════════════════════════════
  # Phase 3: Manifest Loading (parallel track B)
  # ═══════════════════════════════════════════════════════════════════════
  - id: phase-3
    name: "Phase 3: Manifest Loading — File-Type Routing"
    tasks:
