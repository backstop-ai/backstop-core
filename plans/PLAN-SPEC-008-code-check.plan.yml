  # ═══════════════════════════════════════════════════════════════════════
  # Phase 2: Scope Resolution (parallel track A)
  # ═══════════════════════════════════════════════════════════════════════
  - id: phase-2
    name: "Phase 2: Scope Resolution — Git Cascade and Three Modes"
    tasks:
      - id: TASK-002
        type: test
        title: "Write tests for scope resolution (3 modes + git cascade)"
        description: |
          Write failing tests in pkg/check/scope_test.go covering the three scope
          modes and the 4-step git merge-base cascade.

          Scope mode tests:
            - TestCodeCheck_DefaultScope_UsesGitMergeBase (CLM-005): verify diff
              mode calls git merge-base with origin/main
            - TestCodeCheck_DefaultScope_NonGitFallsBackToAll (CLM-006): non-git
              directory returns all-scope file list with warning
            - TestCodeCheck_AllFlag_FullCodebase (CLM-007): ScopeModeAll walks
              directory for all files, no git invocation
            - TestCodeCheck_AllFlag_NoGitCall (CLM-008): verify ScopeModeAll does
              not shell out to git at all
            - TestCodeCheck_DefaultScope_LocalStagedAndUnstaged (CLM-041): verify
              local scope captures both staged and unstaged changes

          Git cascade tests:
            - TestCodeCheck_ChangedFiles_MergeBaseOriginMain (CLM-037): step 1,
              merge-base with origin/main succeeds
            - TestCodeCheck_ChangedFiles_FallbackOriginMaster (CLM-038): step 2,
              origin/main fails, falls back to origin/master
            - TestCodeCheck_ChangedFiles_FallbackLocalStagedUnstaged (CLM-039):
              step 3, neither remote exists, falls back to local diff with warning
            - TestCodeCheck_ChangedFiles_NonGitFallbackToAll (CLM-040): step 4,
              not a git repo, falls back to --all with warning

          Use a git executor interface to mock git commands in tests without
          requiring real git repos for most cases. One test should use a real
          temp git repo for the happy path.

          Sharp edge coverage: detached HEAD states (CI environments), repos
          with no remote named origin.
        files:
          - pkg/check/scope_test.go
        claims:
          - CLM-005
          - CLM-006
          - CLM-007
          - CLM-008
          - CLM-037
          - CLM-038
          - CLM-039
          - CLM-040
          - CLM-041
        depends_on:
          - TASK-001

      - id: TASK-003
        type: implementation
        title: "Implement scope resolution with git cascade"
        description: |
          Create pkg/check/scope.go with:

          Type ScopeMode int:
            - ScopeModeDiff = 0 (default)
            - ScopeModeAll = 1
            - ScopeModeFile = 2

          Interface GitExecutor:
            - MergeBase(remote string) (string, error)
            - DiffNameOnly(base string) ([]string, error)
            - DiffLocal() ([]string, error)
            - IsGitRepo() bool

          Type DefaultGitExecutor struct:
            - Implements GitExecutor by shelling out to git
            - Working directory configurable

          Function ResolveScope(mode ScopeMode, filePath string) ([]string, error):
            - ScopeModeDiff: execute 4-step cascade
              1. git merge-base HEAD origin/main, then git diff --name-only
              2. Fallback: try origin/master
              3. Fallback: git diff --name-only (local staged+unstaged)
              4. Fallback: return all files (non-git)
            - ScopeModeAll: walk project directory for all relevant files
            - ScopeModeFile: verify file exists, return single-element slice

          Sharp edges handled:
            - Detached HEAD in CI
            - Non-origin remote names fall through to local diff
            - File existence check for --file mode
        files:
          - pkg/check/scope.go
        claims:
          - CLM-005
          - CLM-006
          - CLM-007
          - CLM-008
          - CLM-037
          - CLM-038
          - CLM-039
          - CLM-040
          - CLM-041
        depends_on:
          - TASK-002

      - id: TASK-004
        type: verification
        title: "Verify scope resolution tests pass"
        description: |
          Run scope resolution tests and lint:
            - go test ./pkg/check/ -run "TestCodeCheck_DefaultScope|TestCodeCheck_AllFlag|TestCodeCheck_ChangedFiles" -race -v
            - go vet ./pkg/check/
        files:
