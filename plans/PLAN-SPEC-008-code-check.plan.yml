        title: "Implement output formatting, exit code logic, and config integration"
        description: |
          Create pkg/check/output.go with:

          Type OutputMode int:
            - OutputModeHuman, OutputModeJSON

          Type JSONOutput struct:
            - SchemaVersion string (e.g., "check/v1")
            - Violations []Violation
            - Warnings []string
            - PassResults []PassResult summary
            - ExitCode int

          Function FormatResult(result *Result, mode OutputMode) (string, error):
            - OutputModeJSON: marshal to indented JSON with schema_version
            - OutputModeHuman: format as human-readable table/list
              - Respect NO_COLOR env var for ANSI codes

          Function DetermineExitCode(result *Result, configErr error, flagConflict bool) int:
            - If configErr != nil or flagConflict: return 2
            - If result has violations: return 1
            - Otherwise: return 0
            - Exit code 2 takes precedence over 1

          Config integration in Run function:
