  # ═══════════════════════════════════════════════════════════════════════
  # Phase 7: Cobra Adapter (cmd/backstop/code_check.go)
  # ═══════════════════════════════════════════════════════════════════════
  - id: phase-7
    name: "Phase 7: Cobra Command Adapter — backstop code check"
    tasks:
      - id: TASK-017
        type: test
        title: "Write tests for Cobra code check command adapter"
        description: |
          Write failing tests in cmd/backstop/code_check_test.go covering the
          thin Cobra adapter: flag parsing, flag conflict detection, and
          delegation to pkg/check.Run.

          Tests:
            - TestCodeCheck_FileFlag_RoutesByType (CLM-009): invoke command with
              --file flag pointing to .go file, verify pkg/check.Run called with
              ScopeModeFile and correct file path
            - TestCodeCheck_FileAndAllConflict_ExitCode2 (CLM-010): invoke with
              both --file and --all, verify exit code 2 before any checks run

          The adapter tests verify CLI wiring only — pass execution is tested
          in pkg/check/. Use a mock check.Run function to verify the adapter
          correctly translates flags to Options.
        files:
          - cmd/backstop/code_check_test.go
        claims:
          - CLM-009
          - CLM-010
        depends_on:
          - TASK-016

      - id: TASK-018
        type: implementation
        title: "Implement Cobra code check command adapter"
        description: |
          Create cmd/backstop/code_check.go with:

          Variable codeCheckCmd *cobra.Command:
            - Use: "check"
            - Short: "Run implementation validation"
            - Long: detailed description
            - Flags: --all (bool), --file (string), --json (bool)

          RunE handler:
            1. Validate flag combinations (--file + --all -> exit 2)
            2. Load backstop.yml via shared config loader (SPEC-005)
            3. Determine scope mode from flags
            4. Construct check.Options from flags and config
            5. If --file: set context timeout to 2 seconds
            6. Call check.Run(ctx, opts)
            7. Format result via shared output formatter
            8. Set exit code via shared exit code handler

          Init function:
            - Register codeCheckCmd under codeCmd namespace

