        type: setup
        title: "Scaffold pkg/check/ directory and test fixtures"
        description: |
          Create the pkg/check/ directory structure and test fixtures.

          Directories:
            - pkg/check/
            - pkg/check/testdata/

          Test fixtures in pkg/check/testdata/:
            - testdata/manifest-go-all.json — manifest routing .go to all 4 passes
            - testdata/manifest-mixed.json — manifest with multiple file types
            - testdata/manifest-empty.json — empty manifest (triggers defaults)
            - testdata/backstop-valid.yml — valid backstop.yml with semgrep version pin
            - testdata/backstop-no-pin.yml — valid backstop.yml without semgrep version
            - testdata/backstop-invalid.yml — invalid backstop.yml for config error tests

          These fixtures support scope, manifest, semgrep, and engine tests across
