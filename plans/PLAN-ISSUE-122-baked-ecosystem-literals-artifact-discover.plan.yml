  - id: phase-4
    name: "Phase 4: End-to-end falsification and the pack-side declarations"
    tasks:
      - id: TASK-010
        type: test
        title: "E2E falsification — vendor and node_modules excluded BECAUSE a pack declares them"
        description: |
          The regression proof the whole plan is judged against. Build a fixture
          project under cmd/backstop/testdata/ containing:
            - a real backstop.yml declaring one local pack,
            - that pack's pack.yml declaring
              `classification: {dependency_dirs: ["vendor", "node_modules"]}`,
            - a legitimate corpus (e.g. specs/SPEC-901-….spec.md),
            - vendor/SPEC-902-….spec.md,
            - node_modules/some-dep/ISSUE-902-….issue.md,
            - a deeply nested pkg/sub/vendor/SPEC-903-….spec.md,
            - a regular FILE named `vendor` (not a directory) sitting beside the
              corpus.

          cmd/backstop/artifact_discover_e2e_test.go (new):
            - TestArtifactDiscoveryE2E_VendorAndNodeModulesExcludedByPackDeclaration —
              discovery over the fixture returns the legitimate corpus and NONE of the
              three planted files.
            - TestArtifactDiscoveryE2E_ExclusionDisappearsWhenDeclarationRemoved — THE
              FALSIFIER. Copy the fixture to a temp dir, strip `dependency_dirs` from
              the pack.yml, re-run discovery, and assert all three planted files ARE
              discovered. Without this, the first test would still pass if someone
              re-added a core literal — it would prove the behavior, not the
              mechanism.
            - TestArtifactDiscoveryE2E_NestedDependencyDirExcludedAndFileNamedVendorUnaffected —
              proves the match is on the directory BASE NAME at any depth, and that a
              plain file named `vendor` neither triggers a skip nor disappears. This
              is the "scoped wrong" guard.
            - TestArtifactDiscoveryE2E_InventedEcosystemDirHonoredWithNoCoreEdit —
              CLM-008. The fixture pack additionally declares a directory name that
              appears in NO core source file (use something clearly invented, e.g.
              "_thirdparty_deps"); a planted artifact-shaped file under it is
              excluded. Before asserting, grep the core tree to confirm the chosen
              name really is absent from cmd/ and pkg/ — a name that happens to
              collide would make the test vacuous.

          Drive these through the same entry point production uses (build the set via
          loadInstalledPacks + mergeDependencyDirs from the fixture project root), not
          by hand-constructing artifact.NewNonCorpusDirs — otherwise the test proves
          the walk and skips the wiring, which is where this class of defect actually
          hides.
        files:
          - cmd/backstop/artifact_discover_e2e_test.go
          - cmd/backstop/testdata/noncorpus-declared/
        claims:
          - CLM-007
          - CLM-008
        test_names:
          - TestArtifactDiscoveryE2E_VendorAndNodeModulesExcludedByPackDeclaration
          - TestArtifactDiscoveryE2E_ExclusionDisappearsWhenDeclarationRemoved
          - TestArtifactDiscoveryE2E_NestedDependencyDirExcludedAndFileNamedVendorUnaffected
          - TestArtifactDiscoveryE2E_InventedEcosystemDirHonoredWithNoCoreEdit
        depends_on:
          - TASK-009

      - id: TASK-011
        type: implementation
        title: "Declare vendor in the go-toolchain pack, bump and relock"
        description: |
          Put the Go ecosystem's noun where it belongs, durably.

          The DURABLE edit is in the pack's own source repo:
          /Users/bmanson/src/projects/backstop-go-toolchain-pack/pack.yml — add
          `dependency_dirs: ["vendor"]` to the existing `classification:` block
          (which already declares source/test globs), with a comment saying this is
          the Go ecosystem's vendored-dependency directory and that core excludes it
          from artifact-corpus walks ONLY because this pack declares it. Bump the
          pack version, run `backstop pack check` and `backstop pack test` in that
          repo, commit, and tag `v<version>` — a version bump with no matching git
          tag will not resolve for consumers.

          Then in backstop-core: update `backstop.yml`'s pinned version and reinstall
          / relock so `.backstop/packs/backstop-ai/go-toolchain/pack.yml` and
          `backstop.lock` reflect the new content hash. Editing the INSTALLED copy
          alone is not durable — `.backstop/packs/` is gitignored and a reinstall
          would silently revert it.

          backstop-core has no `vendor/` directory, so this is expected to be a
          no-op for this repo's own corpus. That is the point: the declaration is
          proven by the phase-4 fixture, and this task makes real Go consumers keep
          the behavior they had.
        files:
          - /Users/bmanson/src/projects/backstop-go-toolchain-pack/pack.yml
          - .backstop/packs/backstop-ai/go-toolchain/pack.yml
          - backstop.yml
          - backstop.lock
        claims:
          - CLM-006
          - CLM-009
        depends_on:
          - TASK-010

      - id: TASK-012
        type: implementation
        title: "Declare node_modules in the TypeScript and Bun toolchain packs"
        description: |
          Close the Node-ecosystem half of the window. These packs are NOT installed
          in backstop-core, so this repo's gate cannot verify them — the proof is
          `backstop pack check` and `backstop pack test` in each pack's own repo, and
          this task is done only when both report green there.

          In each of:
            /Users/bmanson/src/projects/backstop-packs/typescript-toolchain/pack.yml
            /Users/bmanson/src/projects/backstop-bun-toolchain-pack/pack.yml
          add `dependency_dirs: ["node_modules"]` to the `classification:` block,
          bump the version, commit and tag as in TASK-011.

          Confirm both paths exist before editing; if the bun pack has no
          `classification:` block at all, add one carrying only `dependency_dirs`
          rather than inventing source/test globs it never declared.

          If either repo is mid-flight or the founder would rather sequence these
          separately, STOP and report — do not force a version bump into a pack repo
          someone else is holding. The core change is complete without this task;
          this task is what keeps Node consumers from regressing, and saying so out
          loud is better than a silent partial.
        files:
          - /Users/bmanson/src/projects/backstop-packs/typescript-toolchain/pack.yml
          - /Users/bmanson/src/projects/backstop-bun-toolchain-pack/pack.yml
        claims:
          - CLM-009
        depends_on:
          - TASK-010

      - id: TASK-013
        type: verification
        title: "Gate the fixture and the relock"
        description: |
          Run bare `backstop gate` and confirm green. The relock in TASK-011 changes
          backstop.lock, so pack_lock_verification runs against new content — a hash
          mismatch here means the installed tree and the lock disagree and must be
          reconciled with a real reinstall, never by hand-editing the lock. Confirm
          the new fixture project under cmd/backstop/testdata/ did not perturb any
          other e2e fixture's expectations.
        files:
          - cmd/backstop/artifact_discover_e2e_test.go
          - backstop.lock
          - .backstop/packs/backstop-ai/go-toolchain/pack.yml
        claims:
          - CLM-007
          - CLM-009
        depends_on:
          - TASK-011
          - TASK-012

