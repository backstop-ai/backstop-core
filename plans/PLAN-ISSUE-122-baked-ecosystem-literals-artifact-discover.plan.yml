          before dispatching and apply TASK-014's FINDING test to each hit. See
          TASK-014's METHOD block for why both sweeps are mandatory, why one without
          the other has now missed drift twice, and why no third sweep exists.

          THE SAME STALE ENUMERATION APPEARS IN THREE PLACES, NOT ONE. All three were
          located on 2026-08-16 in the canonical signature sweep's output, filtered to
          this spec. TASK-002 adds a third
          field (`DependencyDirs []string `yaml:\"dependency_dirs\"``), so ALL THREE
          become false the moment this plan lands. Extend the enumeration at each —
          same instruction, same new field:

            :301     THE CONTRACT SIGNATURE, and the highest-stakes of the three:
                     "type Classification struct { Source []string `yaml:\"source\"`;
                                                   Test []string `yaml:\"test\"` }"
                     A contract note that enumerates a struct's fields is a promise
                     about the type's shape; leaving it stale means the contracts
