  - id: phase-4
    name: "Phase 4: End-to-end falsification and the pack-side declarations"
    tasks:
      - id: TASK-010
        type: test
        title: "E2E falsification — vendor and node_modules excluded BECAUSE a pack declares them"
        description: |
          The regression proof the whole plan is judged against. Build a fixture
          project under cmd/backstop/testdata/ containing:
            - a real backstop.yml declaring one local pack,
            - that pack's pack.yml declaring
              `classification: {dependency_dirs: ["vendor", "node_modules"]}`,
            - a legitimate corpus (e.g. specs/SPEC-901-….spec.md),
            - vendor/SPEC-902-….spec.md,
            - node_modules/some-dep/ISSUE-902-….issue.md,
            - a deeply nested pkg/sub/vendor/SPEC-903-….spec.md,
            - a regular FILE named `vendor` (not a directory) sitting beside the
              corpus.

          EVERY PLANTED ARTIFACT MUST BE A VALID, PARSEABLE ARTIFACT — not a stub
          with the right filename. The discovery tests below do not care, but the
          wiring tests do: `artifact validate` returns a CONFIG ERROR on the first
          unparseable file it discovers (artifact_validate.go:181-184), so a
          malformed planted file would make the degraded row assert on a parse
          diagnostic instead of on the per-artifact record set — a fragile signal
          that would also mask a genuine wiring regression behind an exit-2.

          ONE FIXTURE DETAIL IS LOAD-BEARING FOR TWO SEPARATE FALSIFIERS, so build it
          deliberately rather than discovering later that a test cannot go red:
          `vendor/SPEC-902-….spec.md` must be a SCHEMA-VALID spec that nonetheless
          carries `requirements[0].supports: "BUNDLE-999:REQ-001@1.0.0"` naming a
          bundle that exists NOWHERE in the fixture, and its status must NOT be
          terminal (CollectSupportRefs skips terminal citers outright,
          pkg/validate/supports_resolution.go:131). Schema validity and ref
          RESOLVABILITY are independent axes: the per-artifact schema pass is
          structural and never resolves a supports ref, so this file validates clean
          per-artifact while being the only thing in the fixture that can make the
          corpus resolution pass speak at all. The gate's ValidateConfig.NonCorpus hop
          and the collectTraceRefs hop BOTH falsify through it, each explained at its
          own test below. Give it a basename that collides with nothing else in the
          fixture: ResolveSupports reports its citing file by BASENAME (parseSupportRef
          is handed art.Filename, not a path), so a duplicated basename would let an
          assertion match the wrong file.

          cmd/backstop/artifact_discover_e2e_test.go (new):
            - TestArtifactDiscoveryE2E_VendorAndNodeModulesExcludedByPackDeclaration —
              discovery over the fixture returns the legitimate corpus and NONE of the
              three planted files.
            - TestArtifactDiscoveryE2E_ExclusionDisappearsWhenDeclarationRemoved — THE
              FALSIFIER, and the one place this task can go vacuously green. Copy the
              fixture to a temp dir, strip `dependency_dirs`, re-run discovery, and
              assert all three planted files ARE discovered.

              STRIP IT FROM THE INSTALLED COPY, i.e. from
              `<tmp>/.backstop/packs/<pack-name>/pack.yml`. That is the ONLY manifest
              production reads: loadInstalledPacks (cmd/backstop/pack_gate.go:147)
              resolves each pack declared in backstop.yml to
              `<projectRoot>/.backstop/packs/<name>/pack.yml` and parses THAT
              (pack_gate.go:158-168). It never reads a pack's source tree. So if the
              fixture also carries the pack's sources somewhere else in the directory
              and the test strips the declaration from THAT file instead, the
              installed manifest still declares `vendor` — the exclusion still
              happens, the assertion still fails to fire the way the author expected,
              and the falsifier proves nothing while looking like it passes. Name the
              exact path being edited in the test so a reviewer can see which manifest
              was touched.
            - TestArtifactDiscoveryE2E_NestedDependencyDirExcludedAndFileNamedVendorUnaffected —
              proves the match is on the directory BASE NAME at any depth, and that a
              plain file named `vendor` neither triggers a skip nor disappears. This
              is the "scoped wrong" guard.
            - TestArtifactDiscoveryE2E_InventedEcosystemDirHonoredWithNoCoreEdit —
              CLM-008. The fixture pack additionally declares a directory name that
              appears in NO core source file (use something clearly invented, e.g.
              "_thirdparty_deps"); a planted artifact-shaped file under it is
              excluded. Before asserting, grep the core tree to confirm the chosen
              name really is absent from cmd/ and pkg/ — a name that happens to
              collide would make the test vacuous.

          Drive these through the same entry point production uses (build the set via
          loadInstalledPacks + mergeDependencyDirs from the fixture project root), not
          by hand-constructing artifact.NewNonCorpusDirs — otherwise the test proves
          the walk and skips the wiring, which is where this class of defect actually
          hides.

          ── THE WIRING TESTS: THE FOUR CALL SITES, NOT THE WALK ────────────────
          Everything above proves the WALK and the MERGE. NONE of it proves the four
          production call sites CLM-005 names actually thread the merged set through,
          because every test above assembles the set itself and then calls
          DiscoverArtifacts / FindUngatedArtifacts DIRECTLY. An implementer who
          silently passed `artifact.NonCorpusDirs{}` at all four call sites in
          TASK-008 would keep every test above — and every test in phase 3 — GREEN
          while reintroducing exactly the regression this phase exists to prevent.
          That is a structural gap, not a hypothetical: unit-level green, wiring
          unverified. The two tests below close it by driving REAL production entry
          points over the SAME fixture.

          cmd/backstop/noncorpus_wiring_test.go (new):

            - TestNonCorpusWiring_RealCommandsHonorPackDeclarationAcrossPackLoadOutcomes
              ONE TABLE, FOUR ROWS: {`doctor`, `artifact validate`} × {packs load,
              packs do NOT load}. Each row COPIES the fixture to a temp dir and drives
              the REAL root command there through the existing harness —
              runDoctorInProject / runDoctorJSON (cmd/backstop/doctor_harness_test.go
              :107 and :234), which chdirs and calls NewRootCommand().Execute(), i.e.
              the genuine article. Assert on DECODED/RENDERED output, never on an
              internal helper's return value; the whole point is that the helper is
              already known to work and the wiring to it is not.

                PACKS LOAD (happy rows): `doctor --json`'s `artifact-layout` entry
                  names NONE of the planted files, and `artifact validate --all --json`
                  reports no per-artifact record for any of them.
                PACKS DO NOT LOAD (degraded rows): delete
                  `<tmp>/.backstop/packs/<pack-name>/` while LEAVING backstop.yml's
                  declaration in place. loadInstalledPacks then fails for real
                  ("declared pack %s is missing from %s", cmd/backstop/pack_gate.go
                  :163-165) — the production failure, not a stub. BOTH commands must
                  STILL RUN AND STILL REPORT (doctor never aborts; `artifact validate`
                  must not fail on a pack-load error, which TASK-008 mandates and
                  nothing else tests), and BOTH must now surface the planted files:
                  `artifact-layout` lists them as deviations, `artifact validate`
                  carries records for them.

              THE TABLE CATCHES BOTH DIRECTIONS BY CONSTRUCTION, which is why it is
              one table and not two unrelated tests. A call site that hardcodes the
              zero value fails the HAPPY rows. A call site that "softens" the degraded
              path by defaulting the ecosystem names back into core — the alternative
              TASK-008 explicitly forbids, and which nothing in this plan currently
              catches — fails the DEGRADED rows. Neither branch needs the plan to
              choose a preferred behavior; the test pins that the wiring does not
              regress in either direction.

            - TestGateSteps_ExclusionSetWiredIntoArtifactValidation
              THE GATE'S ARTIFACT-VALIDATION HOP, end to end through the real builder.
              Call `buildGateSteps(projectRoot, rootAtDir(t, projectRoot))`
              (cmd/backstop/gate.go — the same entry gate_buildsteps_test.go:22 and
              gate_discovery_e2e_test.go:42 already drive) over the fixture.

              buildGateSteps returns `[]gate.StepFunc`, and a step's identity is only
              knowable by CALLING it — there is no way to invoke one step in isolation,
              and `requirement_traceability` sits well down the reordered assembly
              buildGateSteps returns from its tail, behind pack_lock_verification and
              pack_engines. So
              EXECUTE the returned slice IN ORDER, collect every StepResult, key them by
              StepResult.StepName, and assert ONLY on the `artifact_validation` entry:
              no violation may name SPEC-902, ISSUE-902 or SPEC-903. Assert on NOTHING
              else — the other steps' verdicts have nothing to do with the exclusion set
              and a test that can fail for unrelated reasons is a test nobody trusts.
              (The fixture pack declares only `classification:` and NO `engines:`, so
              pack_engines provisions nothing and the run stays fast; that assertion
              boundary is also what keeps a future fixture edit from making this test
              turn on an engine.)

              TWO INDEPENDENT PRODUCTION SITES FALSIFY HERE, BY TWO DIFFERENT
              MECHANISMS, and knowing which is which is what makes the falsification
              step below meaningful (both sites live in
              `(*realArtifactValidator).ValidateAll` — find them by name, not by line;
              see the LANE STATUS block):
                THE `gate.FindUngatedArtifacts` CALL — reverting its argument to
                  `artifact.NonCorpusDirs{}` makes all three planted files ungated
                  findings. That walk reads the PROJECT root and reports every
                  artifact-shaped file whose parent directory is not root.Dir(kind)
                  (pkg/gate/artifact_status.go:558-590), REGARDLESS of the file's
                  validity, and UngatedFindingsToViolations names their paths. This
                  half is solid on its own.
                THE `ValidateConfig{…}.NonCorpus` FIELD — this one does NOT surface
                  through the ungated scan, and its falsifier is subtler than it looks.
                  A planted file that is VALID produces no per-artifact schema
                  violation, so if the per-artifact pass were cfg.NonCorpus's only
                  consumer, reverting it would be invisible and this half would be
                  documentation. It is not its only consumer: cfg.NonCorpus also
                  reaches buildResolutionViolations (artifact_validate.go:308, whose
                  two DiscoverArtifacts calls are :309 and :322), and that corpus
                  resolution pass runs UNCONDITIONALLY on every ValidateArtifacts run
                  (:269). With that field reverted, `vendor/SPEC-902-….spec.md` is
                  discovered as a citer, its supports ref to the nonexistent BUNDLE-999
                  fails ResolveSupports, and an error violation naming
                  `SPEC-902-….spec.md` lands in this step's output. THAT is why the
                  fixture requirement above is not decoration, and why the fixture
                  validity rule needs no carve-out — the planted file is valid AND
                  independently observable.
              ASSERT BY BASENAME, not by full path: the ungated findings carry full
              paths, but the resolution violation carries only the citing artifact's
              basename, and a full-path assertion would silently never match it.

            - TestCollectTraceRefs_HonorsPackDeclaredDependencyDirs
              THE TRACEABILITY HOP, asserted at the only observable that can actually
              go red. Do NOT attempt to prove this hop through the
              `requirement_traceability` step's violations: that step's output is
              STRUCTURALLY INSENSITIVE to the exclusion set, so a test written against
              it would pass identically with the wiring reverted — a falsifier that
              cannot fire. The mechanism, traced end to end on 2026-08-16:
                computeRequirementTraceabilitySurfaces emits violations
                ONLY through ClassifyRequirementTraceability(res.Records, refs).
                res.Records comes from ResolveArtifactStatus (pkg/gate/
                artifact_status.go:180), which reads only root.Dir(kind) through
                walkArtifactDir (:412) — a NON-RECURSIVE os.ReadDir that skips
                subdirectories outright, and is documented as deliberately
                non-recursive. ClassifyRequirementTraceability then DROPS any ref whose
                CitingPath is absent from `citers` (pkg/gate/requirement_traceability
                .go:79-82), and `citers` is built from those same non-recursive
                records. A file planted at ANY nested path is therefore never a record,
                so its refs are discarded before they can add a violation OR suppress
                one by wrongly marking a bundle REQ covered. The violation set is
                identical either way.
              The observable that DOES move is the ref set collectTraceRefs returns.
              Call `collectTraceRefs(rootAtDir(t, projectRoot), set)` TWICE over the
              same fixture:
                with `set` built THE PRODUCTION WAY (loadInstalledPacks +
                  mergeDependencyDirs from the fixture project root — never a
                  hand-constructed artifact.NewNonCorpusDirs), assert NO returned
                  TraceRef has a CitingPath under `vendor/`, `node_modules/` or the
                  invented dependency dir;
                with `artifact.NonCorpusDirs{}`, assert the vendor spec's ref IS
                  present, carrying BundleName "BUNDLE-999".
              THE SECOND HALF IS A BUILT-IN FALSIFIER: it proves the hop is genuinely
              sensitive to its parameter without anyone hand-reverting production code.
              It is also why the planted spec must carry a supports ref at all — a
              planted spec with no `requirements[].supports` yields zero refs from
              CollectSupportRefs, so both halves would assert emptiness and the test
              would be vacuous in precisely the way it exists to prevent.

              STATE THE RESIDUAL IN THE TEST'S OWN COMMENT rather than hiding it. This
              test proves the hop CONSUMES the set it is handed; it cannot prove that
              buildGateSteps HANDS that hop the pack-derived set rather than a literal
              zero value, because — per the mechanism above — that difference has no
              behavioral consequence anywhere downstream, so no test in this repository
              can observe it. What guards that seam instead is TASK-008's
              explicit-parameter rule (no variadic, no package-level default, so every
              call site must pass something a reviewer can see) plus TASK-008's
              requirement that the set be derived ONCE into a single local in
              buildGateSteps and that SAME variable threaded to all five sites. Do not
              paper the residual over by asserting on an unexported field and calling
              it behavior; write the honest comment and move on.

            FALSIFY BEFORE DECLARING DONE, one site at a time, restoring each before
            reverting the next:
              cmd/backstop/artifact_validate.go:423 (the CLI construction site) →
                the wiring table's HAPPY rows must go RED.
              the `gate.FindUngatedArtifacts` argument in ValidateAll →
                TestGateSteps_ExclusionSetWiredIntoArtifactValidation
                must go RED on the ungated-finding paths.
              the `ValidateConfig{…}.NonCorpus` field in ValidateAll → the SAME test
                must go RED again, this time on the
                resolution violation naming SPEC-902. IF IT DOES NOT, the fixture's
                supports ref is missing, its status is terminal, or BUNDLE-999 actually
                exists in the fixture — fix the fixture, because the test is not yet
                proving what it claims.
            TestCollectTraceRefs_HonorsPackDeclaredDependencyDirs needs no manual
            revert; its zero-value half IS the falsifier. A wiring test that still
            passes with the wiring removed is precisely the failure this task exists to
            prevent, and it is cheap to check.
        files:
          - cmd/backstop/artifact_discover_e2e_test.go
          - cmd/backstop/noncorpus_wiring_test.go
          - cmd/backstop/testdata/noncorpus-declared/
        claims:
          - CLM-004
          - CLM-005
          - CLM-007
          - CLM-008
        test_names:
          - TestArtifactDiscoveryE2E_VendorAndNodeModulesExcludedByPackDeclaration
          - TestArtifactDiscoveryE2E_ExclusionDisappearsWhenDeclarationRemoved
          - TestArtifactDiscoveryE2E_NestedDependencyDirExcludedAndFileNamedVendorUnaffected
          - TestArtifactDiscoveryE2E_InventedEcosystemDirHonoredWithNoCoreEdit
          - TestNonCorpusWiring_RealCommandsHonorPackDeclarationAcrossPackLoadOutcomes
          - TestGateSteps_ExclusionSetWiredIntoArtifactValidation
          - TestCollectTraceRefs_HonorsPackDeclaredDependencyDirs
        depends_on:
          - TASK-009

      - id: TASK-011
        type: implementation
        title: "Declare vendor in the go-toolchain pack, bump 1.4.0 → 1.5.0, and relock"
        description: |
          Put the Go ecosystem's noun where it belongs, durably. This task IS still
          required — re-derived 2026-08-16 against the pack repo's real state: its
          `classification:` block declares `source` and `test` globs and carries NO
          `dependency_dirs` key, so without this edit core drops `vendor` in TASK-005
          and nothing puts it back. Go consumers with a `vendor/` tree would regress.

          ── VERSION: BUMP FROM 1.4.0, DO NOT RE-TAG v1.4.0 ────────────────────
          The pack repo /Users/bmanson/src/projects/backstop-go-toolchain-pack is at
          version 1.4.0 as of 2026-08-16 — commit 7d55256, tag `v1.4.0`, ALREADY
          PUSHED by PLAN-ISSUE-129 (go-test exempt_from_scope_filter). This repo's
          backstop.yml now pins `1.4.0` too — PLAN-ISSUE-129's relock has landed, so
          pack repo and consumer pin agree.

          Therefore: bump `version:` in pack.yml to **1.5.0** and tag **v1.5.0**.
          NEVER re-tag or force-move v1.4.0 — that tag is live and a consumer may
          already have resolved it; moving it changes content under a version someone
          has pinned and hashed, which is indistinguishable from tampering to
          `pack install`. Re-read pack.yml's `version:` field before bumping rather
          than trusting this paragraph: if PLAN-ISSUE-129 or another lane has since
          shipped a further bump, bump from THAT version instead and tag to match.

          ── THE EDIT ──────────────────────────────────────────────────────────
          /Users/bmanson/src/projects/backstop-go-toolchain-pack/pack.yml — add
          `dependency_dirs: ["vendor"]` to the existing `classification:` block
          (which already declares source/test globs), with a comment saying this is
          the Go ecosystem's vendored-dependency directory and that core excludes it
          from artifact-corpus walks ONLY because this pack declares it. Then run
          `backstop pack check` and `backstop pack test` in that repo, commit, and tag
          `v1.5.0` — a version bump with no matching git tag will not resolve for
          consumers. That repo's CI asserts tag/version agreement on tag push
          (commit a7f1370), so a mismatched pair fails there, not here.

          Then in backstop-core: update `backstop.yml`'s `backstop-ai/go-toolchain`
          pin — it read `1.4.0` on 2026-08-16, matching the pack repo — to the version
          you just tagged, and reinstall / relock so
          `.backstop/packs/backstop-ai/go-toolchain/pack.yml` and `backstop.lock`
          reflect the new content hash. Editing the INSTALLED copy alone is not
          durable — `.backstop/packs/` is gitignored and a reinstall would silently
          revert it. If PLAN-ISSUE-129 has already moved the pin by the time this
          runs, that is fine and expected: this task moves it forward from wherever it
          sits, it does not assert a starting value.

          ── STATED RISK: A SIBLING LANE CAN MOVE THE PIN BACKWARD AFTER YOU ───
          PLAN-ISSUE-129's relock has ALREADY landed (backstop.yml reads 1.4.0), so
          the specific collision an earlier revision warned about is discharged. The
          hazard class is not: any sibling lane that relocks go-toolchain writes the
          pin IT was authored against, and if that lands AFTER this task pins 1.5.0 it
          drags backstop.yml BACKWARD and silently drops `dependency_dirs` with it,
          because the older manifest does not carry the key. Nothing in backstop-core
          would look broken: this repo has no `vendor/` tree, so the regression is
          invisible here and shows up only for a downstream Go consumer that has one.
          Therefore: before writing the pin, READ backstop.yml's actual current value
          rather than assuming it; and after any relock in any lane, re-read it
          and confirm it still names the version whose manifest declares
          `dependency_dirs`. If you find it moved backward, re-pin forward and say so
          — do not treat a green gate as evidence the pin is right.

          backstop-core has no `vendor/` directory, so this is expected to be a
          no-op for this repo's own corpus. That is the point: the declaration is
          proven by the phase-4 fixture, and this task makes real Go consumers keep
          the behavior they had.
        files:
          - /Users/bmanson/src/projects/backstop-go-toolchain-pack/pack.yml
          - .backstop/packs/backstop-ai/go-toolchain/pack.yml
          - backstop.yml
          - backstop.lock
        claims:
          - CLM-006
          - CLM-009
        depends_on:
          - TASK-010

