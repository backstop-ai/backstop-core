            :59-60   REQ-001's REQUIREMENT TEXT: "These parse onto a new
                     `pack.Manifest.Classification` field (`type Classification struct
                     { Source []string; Test []string }`)". This is an exhaustive,
                     unhedged field enumeration in requirement text — the SAME SHAPE
