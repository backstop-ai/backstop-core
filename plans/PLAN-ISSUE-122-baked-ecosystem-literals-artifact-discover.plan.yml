              tolerates an empty/nil injection.
            - TestNonCorpusDirs_ZeroValueFallsBackToGenericBase — the ZERO VALUE
              excludes ".git", "testdata" and "prototype" and excludes nothing else.
              This is CLM-004's falsifier: a caller that forgets to wire the packs
              must degrade to today-minus-declarations, never to walking .git.

          pkg/artifact/layout_test.go — UPDATE the existing
          TestLayout_NonCorpusDirNamesAreSharedAndExcludeDotBackstop (layout_test.go:204).
          It currently pins the five-name list and will fail. KEEP ITS NAME and keep
          its two other assertions (".backstop" is absent because each caller layers
          its own rule; the function returns a COPY so a caller cannot mutate the
          shared list). Change only the expected names. Do NOT delete this test — it
          is SPEC-068's pin on the shared-list invariant, and deleting a test to make
          a change pass is exactly what the gate exists to catch.
        files:
          - pkg/artifact/noncorpus_test.go
          - pkg/artifact/layout_test.go
        claims:
          - CLM-001
          - CLM-004
        test_names:
          - TestNonCorpusDirNames_ContainsNoEcosystemNoun
          - TestNewNonCorpusDirs_UnionsGenericBaseWithPackDeclared
          - TestNonCorpusDirs_ZeroValueFallsBackToGenericBase
          - TestLayout_NonCorpusDirNamesAreSharedAndExcludeDotBackstop
        depends_on: []

      - id: TASK-005
        type: implementation
        title: "Shrink the shared list to tool-agnostic names and add artifact.NonCorpusDirs"
        description: |
          Make TASK-004 green, in pkg/artifact/layout.go.

          1. nonCorpusDirNames (layout.go:116-118) becomes
             {".git", "testdata", "prototype"}. Rewrite the doc comment: it no longer
             claims to hold every non-corpus name — it holds the TOOL-AGNOSTIC ones,
             and ecosystem-specific names arrive injected from pack declarations
             because core bakes no ecosystem knowledge. Keep the existing explanation
             of why ".backstop" is absent (each caller layers its own root-relative
             rule); that reasoning is unchanged and still load-bearing.
             NonCorpusDirNames() keeps its signature — SPEC-068's contract block
             declares it and the signature is what that contract pins.

          2. Add the injected set:

               type NonCorpusDirs struct { declared map[string]bool }
               func NewNonCorpusDirs(declared []string) NonCorpusDirs
               func (n NonCorpusDirs) Excludes(base string) bool

             Excludes returns true for any name in the generic base OR in the
             injected set, and its ZERO-VALUE behavior (nil map) is the generic base
             — write that as a comment stating WHY (a zero value excluding nothing
             would send a mis-wired walk into .git, a silent failure at a call site
             the author forgot; degrading to today-minus-declarations is the honest
             failure mode). Empty names in the injection are ignored.

          STDLIB ONLY. Do not import pkg/pack to reach the manifests — the injection
          parameter is precisely what keeps this package importable by pkg/gate,
          pkg/validate, pkg/scaffold, pkg/config and cmd/backstop with no cycle.
          Do not add a `vendor`/`node_modules` default "for safety"; that would move
          the bake rather than remove it, and TASK-004 falsifies it.
        files:
          - pkg/artifact/layout.go
        claims:
          - CLM-001
          - CLM-004
        depends_on:
          - TASK-004

      - id: TASK-006
        type: verification
        title: "Gate the pkg/artifact change"
        description: |
          Run `backstop gate --file pkg/artifact/layout.go`, then bare
          `backstop gate` to catch anything the narrowed run scoped out. Expect
          compile failures in the two walk consumers to be ABSENT at this point —
