  - id: phase-5
    name: "Phase 5: Predating-artifact reconciliation and full verification"
    tasks:
      - id: TASK-014
        type: documentation
        title: "Dispatch spec-author to reconcile SPEC-068 — the seven enumerations AND three drifted contract signatures"
        description: |
          SPEC-068 drifts on this change in TWO distinct ways, and only the first is
          findable by grepping for the ecosystem nouns. Both are in scope.

          ── THE METHOD, WHICH IS THE ACTUAL DELIVERABLE HERE ──────────────────
          Reconciliation is done by TWO SWEEPS ACROSS THE WHOLE `specs/` DIRECTORY,
          never by grepping the one spec that looks relevant. Run BOTH before
          dispatching, and hand spec-author the CURRENT line numbers, since earlier
          edits in this phase may shift them:

            PROSE sweep:      grep -rn 'node_modules\|vendor' specs/
            SIGNATURE sweep:  grep -rn 'FindUngatedArtifacts\|DiscoverArtifacts\|realArtifactValidator\|Classification' specs/

          THESE ARE THE CANONICAL COMMAND LINES from the plan notes' METHOD block,
          reproduced BYTE FOR BYTE. TASK-016 and TASK-015 use the identical pair.
          There is no third sweep and no narrower alternation — an earlier revision of
          this plan carried four differently-worded variants of the signature sweep in
          four places, which is exactly the drift these sweeps exist to catch.

          NEITHER SWEEP FINDS THE OTHER'S HITS, and that is not a caveat — it is why
          this plan missed drift in two consecutive review rounds. A signature literal
          contains no ecosystem noun, so the prose sweep cannot see it (round 2's
          miss). And a sibling spec can restate the enumeration in REQUIREMENT TEXT
          while never naming a changed symbol, so the signature sweep cannot see it
          either (round 3's miss — SPEC-070 REQ-007, which the whole-directory prose
          sweep finds and a SPEC-068-only grep never would).

          A LATER MISS WAS NOT A COVERAGE GAP AT ALL. Three SPEC-070 sites (:651,
          :896, :1198) were believed to need a third "mechanism" axis; they never did
          — the SIGNATURE sweep above returns them, and always did, because it
          alternates on `FindUngatedArtifacts`. They were passed over by EYE in a long
          result set. Read the output line by line rather than adding commands.

          Apply the notes' FINDING test to each hit: a hit is a finding when it
          restates the SHAPE of `Classification`, `DiscoverArtifacts`,
          `FindUngatedArtifacts` or `realArtifactValidator`, or enumerates the
          non-corpus exclusion set as something core carries. Every such hit is
          enumerated in this task, TASK-016 or TASK-017; the near-miss hits checked
          and cleared are listed in TASK-015 step 5. A qualifying hit on none of those
          lists is a FINDING to report, not a false positive to wave off.

          ── PART A: THE FIVE-NAME ENUMERATION, IN SEVEN PLACES ────────────────
          All seven were located on 2026-08-16 by the prose sweep above, filtered to
          SPEC-068. The SPEC-070 and SPEC-069 hits from that same sweep belong to
          TASK-017; the THREE SPEC-043 hits from the signature sweep (one contract
          signature at :301 plus two prose restatements at :59-60 and :540-541) belong
          to TASK-016.

            :299   REQ-007's discovery skip list
            :714   CLM-062's CLAIM TEXT  ← THE IMPORTANT ONE, see below
            :801   the `NonCorpusDirNames` contract note
            :863   the `FindUngatedArtifacts` contract note
            :1169  REQ-008's narrative ("still skip")
            :1463  Sharp Edge 12's statement of the bake
            :1474  Sharp Edge 12's enumeration

          ── WHY CLM-062 (:714) GETS EXPLICIT EMPHASIS ─────────────────────────
          Its text asserts the scan "excludes exactly the enumerated non-corpus trees
          — .git, vendor, node_modules, testdata, prototype and .backstop/packs". This
          plan makes that sentence FALSE, and the failure is silent by construction:
          the artifact_status_drift dimension resolves a claim's mandated test by
          EXISTENCE of the test NAME, and TASK-007 deliberately preserves that name.
          So the dimension goes on passing while the claim's prose quietly says
          something untrue about the shipped system. Correcting the test body without
          correcting this claim text is exactly the vacuous green this repo exists to
          prevent. Tell spec-author this claim is the priority, not an afterthought
          bundled behind the REQ texts.

          Sharp Edge 12 also says the bake is "being filed as its own issue (ID
          pending; cite it here once relayed)" — that ID is now ISSUE-122, and the
          sharp edge should record that it is RESOLVED by this plan rather than
          knowingly propagated.

          ── PART B: THREE DRIFTED CONTRACT SIGNATURES (the prose sweep is blind) ─
          The prose sweep locates Part A and NOTHING ELSE, because a signature literal
          contains no ecosystem noun. It is therefore structurally incapable of
          surfacing the drift below, and this section exists because relying on that
          sweep alone previously missed it. These are not prose
          hygiene: SPEC-068 is `status: implemented` and its `contract_signature`
          policy is `{applies-to: new-code, level: block}`, so the contracts
          dimension BLOCKS on a signature that no longer matches the code
          (pkg/gate/contract_verdict.go:92-100). Locate each with the SIGNATURE sweep
          above — run over `specs/` as a whole, then filtered to this spec — rather
          than trusting these line numbers.

            :862  `signature: "func FindUngatedArtifacts(projectRoot string,
                  root artifact.Root) ([]UngatedArtifact, error)"`
                  TASK-008 adds a THIRD parameter, `nonCorpus artifact.NonCorpusDirs`.
                  The signature must be updated to whatever TASK-008 actually landed —
                  read the real function in pkg/gate/artifact_status.go and copy it,
                  do not transcribe from this plan.

            :936  `signature: "func DiscoverArtifacts(root artifact.Root,
                  typeFilters []string) ([]DiscoveredArtifact, error)"`
                  Same — TASK-008 adds `nonCorpus artifact.NonCorpusDirs` here too.
                  ALSO update this contract's accompanying NOTE at :937, which still
                  describes the pre-change shape ("The skip list at line 48 currently
                  SkipDirs `.backstop` unconditionally…"). Once the skip logic reads
                  the injected parameter, that description is stale: the note should
                  say the exclusion set arrives as a parameter (tool-agnostic base
                  plus pack-declared names) while the ROOT-RELATIVE `.backstop` /
                  `.backstop/packs` rule stays local to the walk and unchanged.

            :1007 `signature: "type realArtifactValidator struct { projectRoot string;
                  root artifact.Root; cohort schema.Cohort }"`
                  This is an EXHAUSTIVE field enumeration with no hedge, unlike the
                  neighbouring ValidateConfig contract at :961 which writes
                  `{ /* existing fields */ Root artifact.Root }` and is safe from
                  drift by construction. TASK-008 adds a NonCorpus field to this
                  struct, so the literal becomes false and — depending on how the
                  contracts step matches struct-literal contracts — may be a real
                  blocking mismatch, not merely a stale sentence. Extend the
                  enumeration with the new field.

            :1012 is a call-form EXAMPLE inside the ValidateAll note, reading
                  `gate.FindUngatedArtifacts(projectRoot, root)`. It must be updated
                  in the same pass so the example stays consistent with the :862
                  signature it illustrates. An example that contradicts its own
                  contract is the kind of small lie a reader trusts.

          ROUTE THIS THROUGH spec-author. Do NOT hand-edit the spec — CLAUDE.md
          forbids it and freeform prose edits drift from the schema. Ask spec-author
          to state the exclusion set everywhere as "the tool-agnostic base (.git,
          testdata, prototype) plus whatever installed packs declare via
          classification.dependency_dirs", to keep the mandated test name
          TestFindUngatedArtifacts_ExcludesEnumeratedNonCorpusTreesButWalksDotBackstop
          UNCHANGED, and to preserve the `.backstop` / `.backstop/packs` asymmetry
          wording (unchanged by this plan and still load-bearing).

          SCOPED CLEARANCE, NOT A BLANKET ONE: the `NonCorpusDirNames` SIGNATURE
          contract specifically is UNCHANGED — that function keeps its signature and
          only the names it returns change, so for THAT contract only the note's
          enumeration is stale. This says nothing about the rest of the spec, and
          must not be read as "no signatures in SPEC-068 change." THREE OTHER
          CONTRACTS IN THIS SAME SPEC DO CHANGE — FindUngatedArtifacts (:862),
          DiscoverArtifacts (:936) and realArtifactValidator (:1007), all enumerated
          in Part B above.

          Then run `backstop artifact validate --spec SPEC-068` and confirm it passes.
        files:
          - specs/SPEC-068-trustworthy-green-guards.spec.md
        claims:
          - CLM-001
          - CLM-005
        depends_on:
          - TASK-013

      - id: TASK-016
        type: documentation
        title: "Dispatch spec-author to reconcile SPEC-043's Classification contract signature"
        description: |
          The SECOND drifted implemented spec, and the one an earlier revision of
          this plan missed entirely.

          ── METHOD, NOT JUST FIX ──────────────────────────────────────────────
          This drift is found ONLY by the SIGNATURE sweep run across the WHOLE specs/
          directory — the canonical one, byte for byte, the same line TASK-014 and
          TASK-015 use:

            grep -rn 'FindUngatedArtifacts\|DiscoverArtifacts\|realArtifactValidator\|Classification' specs/

          Do NOT substitute a narrower `grep -rn 'Classification' specs/`; one
          canonical sweep, used identically everywhere, is the whole point. The PROSE
