plan_id: PLAN-ISSUE-122
spec_id: ISSUE-122
created: "2026-08-15"
status: draft
target_repo: backstop-core
target_module: github.com/backstop-ai/backstop-core
test_command: "go test ./pkg/artifact/... ./pkg/pack/... ./pkg/gate/... ./cmd/backstop/... -race -count=1"
coverage_threshold: 90

notes: |
  Implements ISSUE-122 — `vendor` (a Go noun) and `node_modules` (a Node/npm noun)
  are baked into core as artifact-corpus exclusion literals. This is the
  zero-baked-language invariant's own target: CLAUDE.md's first principle says core
  bakes NO language or tool knowledge and that such knowledge lives in packs as
  DATA. The fix moves the two nouns out of core and into pack declarations; it does
  NOT delete the exclusion behavior.

  ── WHERE THE DEFECT ACTUALLY LIVES NOW (re-verified on the tree 2026-08-15) ──
  ISSUE-122 cites `cmd/backstop/artifact_discover.go:47-49` and a `switch base`
  statement. That switch NO LONGER EXISTS. SPEC-068 (in flight, working tree) has
  already centralized the list — `artifact_discover.go:48-51` now reads it from
  `artifact.NonCorpusDirNames()`, and the literals live in ONE place:

    pkg/artifact/layout.go:116-118
      var nonCorpusDirNames = []string{
        ".git", "vendor", "node_modules", "testdata", "prototype",
      }

  SPEC-068 did that DELIBERATELY and said so — its Sharp Edge 12 records the bake as
  "knowingly propagated", explains why it was kept off that seed's critical path, and
  instructs whoever fixes the follow-on that there must be ONE site to change, not
  two. This plan is that follow-on, and the centralization SPEC-068 performed is
  exactly what makes it small.

  There are TWO consumers of the shared list, and both are in scope:
    1. `DiscoverArtifacts` (cmd/backstop/artifact_discover.go:42) — feeds
       `artifact validate` (artifact_validate.go:158, :309, :322) and the gate's
       traceability ref collection (gate.go:1082).
    2. `FindUngatedArtifacts` (pkg/gate/artifact_status.go:536) — SPEC-068 REQ-008's
       ungated-artifact surfacing scan, called from gate.go:1705 and
       doctor_checks.go:411.
  The issue text names only the first. Fixing one and leaving the other would leave
  the bake in place AND reintroduce the drift SPEC-068's single list exists to
  prevent. Both move together.

  ── THE MECHANISM, AND WHY THIS ONE ──────────────────────────────────────────
  DECIDED: ecosystem-specific dependency directory names become PACK-DECLARED DATA,
  merged across the installed-pack set and INJECTED into both walks. Core keeps only
  the three genuinely tool-agnostic names.

    pack.yml (a toolchain pack, versioned, in its own repo):
      classification:
        source: ["**/*.go"]
        test:   ["**/*_test.go"]
        dependency_dirs: ["vendor"]        # NEW — the ecosystem's own noun

    pkg/pack:      Classification gains DependencyDirs []string
    cmd/backstop:  mergeDependencyDirs(packs) unions the field across the FULL
                   installed-pack set (new file pack_dependency_dirs.go)
    pkg/artifact:  nonCorpusDirNames shrinks to {.git, testdata, prototype};
                   a new NonCorpusDirs value = generic base ∪ injected names
    both walks:    take artifact.NonCorpusDirs explicitly

  WHY `classification:` AND NOT A NEW TOP-LEVEL BLOCK. `classification` is already
  the pack→core PATH-CLASSIFICATION data channel (SPEC-043): a pack declares which
  paths are source and which are test, core merges the declarations across every
  installed pack in `mergeSourceClassifier` (cmd/backstop/gate.go:1335) and injects
  the result. "This directory is a dependency tree, not authored content" is the
  same kind of statement, made by the same declarer, consumed the same way. Reusing
  the block means one merge shape, one mental model, and no new top-level concept.

  WHY NOT `EngineBinding.StdoutArtifact`, WHICH THE ISSUE CITES AS THE PRECEDENT.
  StdoutArtifact is PER-ENGINE and per-binding — it describes what one engine
  invocation writes. A dependency directory is a property of the whole ecosystem the
  pack speaks for, independent of any engine, and is consumed by walks that have no
  engine in hand at all. `classification` is the closer precedent; the issue's
  Solution section recorded direction, not a binding choice, and says so.

  WHY NOT A `backstop.yml` KEY. A consumer-side exclusion list would let the same
  fact be stated in two places (config and pack) and drift, which is precisely the
  failure mode SPEC-068's single shared list was built to eliminate. It would also
  put ecosystem knowledge back in a consumer file instead of in the pack that owns
  that ecosystem. Considered and rejected; recorded here so a reviewer can see it was
  weighed rather than missed.

  WHY NOT "JUST STOP SKIPPING" — the option the team lead asked to be considered
  explicitly. Deleting the two entries with no replacement is not neutral: a
  third-party tree can plausibly ship a file whose name matches an artifact pattern
  (`*.spec.md` is a common enough shape), and `DiscoverArtifacts` feeds
  `artifact validate`, so a discovered stray becomes a SCHEMA VIOLATION and turns the
  consumer's gate red on a file they did not write. That is a real regression, not a
  hypothetical, and the issue calls it out. The skip behavior is correct; only its
  SOURCE is wrong.

  THE ACCEPTANCE BAR THE MECHANISM IS CHOSEN AGAINST: adding support for the next
  ecosystem's vendoring convention must require ZERO core edits. CLM-008 makes that
  falsifiable — a pack declaring an INVENTED directory name that appears in no core
  file is honored end to end.

  ── ZERO-VALUE SEMANTICS: A DECIDED SHARP EDGE, NOT AN OVERSIGHT ─────────────
  `artifact.NonCorpusDirs{}` (the zero value, what a caller that forgets to wire the
  packs would produce) EXCLUDES THE GENERIC BASE — `.git`, `testdata`, `prototype` —
  rather than excluding nothing. A zero value that excluded nothing would send the
  walk into `.git`, and the resulting garbage would be a silent, confusing failure at
  a call site the author forgot. Degrading to "today's behavior minus the
  pack-declared names" is the honest failure. CLM-004 pins it and TASK-005's test
  falsifies it.

  ── THE WINDOW, NAMED HONESTLY ───────────────────────────────────────────────
  Between core landing this and a pack declaring the names, a repo with `vendor/` or
  `node_modules/` has those trees WALKED. This plan closes the window in the same
  delivery for the ecosystems that exist today rather than leaving it open:
  phase 4 declares `vendor` in the go-toolchain pack (the one backstop-core itself
  installs) and `node_modules` in the TypeScript and Bun toolchain packs. Ecosystems
  with no pack yet were never gated by backstop at all, so there is nothing to
  regress for them.

  ── LANE BOUNDARY — READ THIS BEFORE STARTING ────────────────────────────────
  Every production file this plan touches is ACTIVE, UNCOMMITTED working-tree
  surface for in-flight work as of 2026-08-15:
    pkg/artifact/layout.go, cmd/backstop/artifact_discover.go,
    pkg/gate/artifact_status.go   — SPEC-068 (trustworthy-green guards)
    cmd/backstop/doctor_checks.go — SPEC-070 (backstop doctor)
    cmd/backstop/gate.go          — both
  DO NOT START THIS PLAN UNTIL SPEC-068, SPEC-069 AND SPEC-070 HAVE LANDED AND
  COMMITTED. Running it concurrently means editing files another implementer holds,
  and the signature changes here (`DiscoverArtifacts`, `FindUngatedArtifacts`) break
  every caller at compile time — loudly, in someone else's tree. If the situation has
  changed when this plan is picked up, re-verify the line references above before
  trusting them.

  ── PREDATING ARTIFACTS THAT MUST BE RECONCILED, NOT QUIETLY BROKEN ──────────
  SPEC-068 pins the five-name list in three places: REQ-007's text, REQ-008's text,
  and the `NonCorpusDirNames` contract note. Its mandated test
  `TestFindUngatedArtifacts_ExcludesEnumeratedNonCorpusTreesButWalksDotBackstop`
  MUST KEEP ITS NAME (the artifact_status_drift dimension resolves mandated names by
  existence — renaming it manufactures a broken promise). Its BODY changes to prove
  the exclusion set is generic-plus-declared. The spec text itself is reconciled in
  phase 5 by dispatching spec-author — NEVER by hand-editing the spec, per CLAUDE.md.

  ── OUT OF SCOPE, DELIBERATELY ───────────────────────────────────────────────
  - The four/three generic names (`.git`, `testdata`, `prototype`, and each caller's
    own `.backstop` rule) stay as core literals. The issue scopes them out; they name
    no language or tool.
  - The `.backstop` and `.backstop/packs` per-caller rules are UNCHANGED. Their
    asymmetry is load-bearing (SPEC-068 REQ-008: inheriting discovery's `.backstop`
    skip would make the ungated scan vacuous on its own motivating case).
  - The coverage/source-classification walks are NOT given this set. Different
    consumer, different question; folding them in would be a second change wearing
    this one's clothes.
  - The `backstop/self` dogfood pack's coverage gap for skip-list literals (the
    issue's own secondary finding) is the self-pack's follow-on, not this plan's.

  ── REQUIREMENTS / CLAIMS (plan-local, derived from the issue's Solution) ────
    CLM-001  pkg/artifact's shared non-corpus list contains ONLY tool-agnostic names
             (`.git`, `testdata`, `prototype`). No language, framework, package
             manager or ecosystem noun appears anywhere in pkg/artifact, and the
             package still imports stdlib ONLY, so every consumer keeps importing it
             with no cycle.
    CLM-002  A pack declares its ecosystem's dependency directory names as DATA via
             `classification.dependency_dirs`. Parsing is purely additive: a manifest
             with no `classification` block, or a `classification` block with no
             `dependency_dirs`, contributes nothing and parses exactly as before.
    CLM-003  cmd/backstop merges `dependency_dirs` across the FULL installed-pack set
             into one deduplicated list — nil-manifest safe, empty for zero packs,
             carrying no pack-name literal, no language branch and no toolchain
             pre-filter — mirroring mergeSourceClassifier's contract.
    CLM-004  artifact.NonCorpusDirs is the ONE exclusion authority both walks consume:
             the generic base UNIONED with the injected pack-declared names. Its ZERO
             VALUE excludes the generic base rather than nothing, so a caller that
             forgets to wire the packs degrades to today-minus-declarations instead of
             walking `.git`.
    CLM-005  DiscoverArtifacts and FindUngatedArtifacts take the exclusion set as an
             EXPLICIT parameter, and every production call site — the gate's artifact
             validation step, the gate's traceability collection, `artifact validate`,
             and `doctor` — populates it from the installed packs already loaded in
             that command. The per-caller `.backstop` / `.backstop/packs` rules are
             byte-for-byte unchanged.
    CLM-006  Behavior preservation: with the go-toolchain pack declaring `vendor`, a
             repo containing `vendor/` excludes it from both walks exactly as before
             this change, and backstop-core's own corpus discovery is unchanged.
    CLM-007  FALSIFIER — the exclusion is proven to come from the DECLARATION. A
             fixture project with `vendor/` and `node_modules/` each holding an
             artifact-shaped file EXCLUDES both when a pack declares them, and
             DISCOVERS both when the declaration is removed. Scoping is proven too: a
             dependency directory nested several levels deep is excluded, and a
             regular FILE named `vendor` is unaffected.
    CLM-008  ECOSYSTEM-AGNOSTICISM — a pack declaring a directory name that appears in
             no core source file is honored end to end, with zero core edits. Adding
             the next ecosystem's vendoring convention is a pack change, never a
             `case` in cmd/backstop.
    CLM-009  The ecosystem knowledge lands in the packs that own it, versioned: the
             go-toolchain pack declares `vendor`; the TypeScript and Bun toolchain
             packs declare `node_modules`. backstop-core's own lock records the
             go-toolchain bump.

phases:
  - id: phase-1
    name: "Phase 1: Pack-declared dependency directories (the data channel)"
    tasks:
      - id: TASK-001
        type: test
        title: "Failing tests for classification.dependency_dirs parsing and the cross-pack merge"
        description: |
          Write the RED tests for the pack→core data channel.

          pkg/pack/manifest_dependency_dirs_test.go:
            - TestManifest_ClassificationDependencyDirsParse — a pack.yml declaring
              `classification: {dependency_dirs: ["vendor", "_thirdparty"]}` parses
              into Classification.DependencyDirs in declaration order.
            - TestManifest_ClassificationAbsentYieldsNoDependencyDirs — a manifest
              with no `classification` block, and one with `classification` carrying
              only source/test, both parse successfully with an EMPTY DependencyDirs
              and with source/test unchanged. This is the additive-parse proof
              (CLM-002); pack.ParseManifestFile uses non-strict yaml.Unmarshal
              (manifest.go:259), so an existing manifest must be unaffected.

          cmd/backstop/pack_dependency_dirs_test.go:
            - TestMergeDependencyDirs_UnionsAcrossPacksDedupedAndNilSafe — three
              manifests where two declare overlapping names and one declares none,
              plus a nil entry in the slice, produce the deduplicated union without
              panicking.
            - TestMergeDependencyDirs_ZeroPacksYieldsEmpty — no installed packs
              yields an empty result, never a defaulted list. A default here would
              re-bake the nouns one layer down, which is the exact failure this plan
              exists to prevent.

          Both files must FAIL TO COMPILE at this point (the field and the function
          do not exist yet). That is the intended red.
        files:
          - pkg/pack/manifest_dependency_dirs_test.go
          - cmd/backstop/pack_dependency_dirs_test.go
        claims:
          - CLM-002
          - CLM-003
        test_names:
          - TestManifest_ClassificationDependencyDirsParse
          - TestManifest_ClassificationAbsentYieldsNoDependencyDirs
          - TestMergeDependencyDirs_UnionsAcrossPacksDedupedAndNilSafe
          - TestMergeDependencyDirs_ZeroPacksYieldsEmpty
        depends_on: []

      - id: TASK-002
        type: implementation
        title: "Add Classification.DependencyDirs and mergeDependencyDirs"
        description: |
          Make TASK-001 green.

          pkg/pack/manifest.go — add to the existing Classification struct
          (manifest.go:74):

            DependencyDirs []string `yaml:"dependency_dirs"`

          Document it on the field: these are bare directory NAMES (not globs, not
          paths) that the declaring pack's ecosystem uses for vendored or installed
          dependency trees, and core excludes them from artifact-corpus walks. Say
          why the field lives on Classification rather than on an engine binding —
          it is a whole-pack, whole-walk property with no engine in hand, and
          Classification is already the merged path-classification channel. Do NOT
          add validation that the names are non-empty ecosystem-plausible strings;
          core has no opinion about what an ecosystem calls its dependency tree, and
          inventing one would re-bake the knowledge as a validator.

          cmd/backstop/pack_dependency_dirs.go — NEW FILE holding
          mergeDependencyDirs([]*pack.Manifest) []string. Model it on
          mergeSourceClassifier (gate.go:1335): take the WHOLESALE installed-pack set
          with no toolchain pre-filter (a pack declaring nothing contributes zero to
          the union, so no filter is needed or wanted), skip nil manifests, dedupe
          while preserving first-seen order for determinism. It lives in a new file
          rather than in gate.go so the merge is not buried in gate wiring and so
          this phase does not collide with phase 3's edits to gate.go.

          Deliberately NOT done here: no call site consumes the merge yet. Wiring is
          phase 3's job, after the injection type exists.
        files:
          - pkg/pack/manifest.go
          - cmd/backstop/pack_dependency_dirs.go
        claims:
          - CLM-002
          - CLM-003
        depends_on:
          - TASK-001

      - id: TASK-003
        type: verification
        title: "Gate the data-channel change"
        description: |
          Run `backstop gate` (bare, diff-scoped) and confirm it is green over the
          two production files and two test files this phase touched. Investigate any
          finding rather than scoping it away — in particular, confirm no pack-related
          test elsewhere in pkg/pack broke on the additive struct field.
        files:
          - pkg/pack/manifest.go
          - cmd/backstop/pack_dependency_dirs.go
        claims:
          - CLM-002
          - CLM-003
        depends_on:
          - TASK-002

  - id: phase-2
    name: "Phase 2: De-baking pkg/artifact and the injected exclusion set"
    tasks:
      - id: TASK-004
        type: test
        title: "Failing tests for the tool-agnostic base list and artifact.NonCorpusDirs"
        description: |
          Write the RED tests for the core side. pkg/artifact imports STDLIB ONLY and
          that is load-bearing (layout.go:5-9) — these tests must not import pkg/pack
          or pkg/config either.

          pkg/artifact/noncorpus_test.go (new):
            - TestNonCorpusDirNames_ContainsNoEcosystemNoun — the shared list is
              exactly {".git", "testdata", "prototype"} in that order, and contains
