      - id: TASK-017
        type: documentation
        title: "Dispatch spec-author to reconcile SPEC-070's REQ-007 mechanism, its three other stale FindUngatedArtifacts sites, and SPEC-069's Sharp Edge 5"
        description: |
          The THIRD drifted implemented spec plus one stale narrative site in a fourth,
          found by running the canonical PROSE sweep across the WHOLE specs/ directory
          rather than against the one spec that looked relevant —
          `grep -rn 'node_modules\|vendor' specs/` returns SPEC-068, SPEC-069 AND
          SPEC-070, and an earlier revision of this plan caught only the first. See
          TASK-014's METHOD block; re-run BOTH canonical sweeps and hand spec-author
          CURRENT line numbers, since earlier phase-5 edits may shift them.

          ── THERE IS NO THIRD SWEEP. READ THE SECOND ONE PROPERLY. ────────────
          Three of this task's six sites (:651, :896, :1198) carry NO ecosystem noun
          and NO `Classification` literal, so the PROSE sweep is genuinely blind to
          them — they drift on the MECHANISM, describing what `FindUngatedArtifacts`
          carries or restating its parameter list, and TASK-008 changes both. An
          earlier revision concluded a THIRD sweep axis was therefore needed. That was
          wrong: the canonical SIGNATURE sweep alternates on `FindUngatedArtifacts` and
          has always returned every one of them. Run it, byte for byte, BEFORE
          dispatching:

            grep -rn 'FindUngatedArtifacts\|DiscoverArtifacts\|realArtifactValidator\|Classification' specs/

          Its SPEC-070 hits on 2026-08-16 were :208, :651, :683, :896, :1022, :1198,
          :1268, :1409 and :1560 — nine hits, all from that one command. The earlier
          miss was a READING failure, eyeballing past real drift in a long result set.
          Sites 1-5 below are the drifting subset; the rest are cleared explicitly at
          the end of this task so nobody re-derives them. Every one of the nine is
          accounted for in one place or the other; treat any hit that is not as a
          FINDING to report.

          ── SITE 1 (LOAD-BEARING): SPEC-070 REQ-007, :207-213 ─────────────────
          This is REQUIREMENT TEXT in a `status: implemented` spec, not narrative, and
          it is the reason this task exists. REQ-007 requires doctor's `artifact-layout`
          check to source its deviation set from `FindUngatedArtifacts`, and justifies
          that on the ground that the helper "also carries the exclusion set
          (`testdata`, `vendor`, `node_modules`, `.git`, `.backstop/packs`,
          `prototype`) without which this repository alone contributes 67
          artifact-shaped files that are deliberately not corpus."

          After TASK-008 that is false. The helper no longer CARRIES the ecosystem
          names — they arrive as an INJECTED PARAMETER (`artifact.NonCorpusDirs`), and
          `cmd/backstop/doctor_checks.go:411` populates it from `ctx.Packs`.

          FIX THE MECHANISM PROPERLY — do NOT soften the sentence into vagueness by
          deleting the enumeration and leaving "the exclusion set" undescribed. The
          corrected text must say all of:
            - the deviation set still comes from `FindUngatedArtifacts` and doctor
              still must not walk the corpus itself (REQ-007's CONCLUSION is unchanged
              and is what the requirement actually binds);
            - the exclusion set is now the TOOL-AGNOSTIC BASE (`.git`, `testdata`,
              `prototype`, plus the walk's own `.backstop/packs` rule) UNIONED with
              whatever installed packs declare via `classification.dependency_dirs`;
            - doctor obtains its set the same way every other call site does — from the
              packs it has already loaded (`ctx.Packs`) — which is what keeps doctor
              and the gate from disagreeing about which trees are corpus;
            - and the NAMED CONSEQUENCE on the degraded path: when the pack load fails
              (`ctx.PacksErr != nil`) doctor passes the zero value, so the set is the
              generic base only and artifact-shaped files inside dependency trees ARE
              reported as deviations. That is the honest failure — the alternative is
              core knowing the nouns, which is the bake ISSUE-122 removes — and the
              packs check failing on the same run is the diagnosis that explains it.
              Recording it in the spec is what stops a future reader filing it as a bug.
          The "67 artifact-shaped files" figure is about THIS repository's testdata and
          is unaffected by this change; keep it if it is still accurate, and say so
          either way rather than silently dropping it.

          ── SITE 2 (LOAD-BEARING): SPEC-070:890-900, the REQ-007 mechanism ────
          The Implementation section's processing-steps entry for `checkArtifactLayout`
          states it "performs no walk of its own, holds no suffix list, joins no
          type-directory name, and carries no exclusion list — all four come from the
          shared helper, which is what makes 'what doctor calls a deviation' and 'what
          the gate calls ungated' one predicate by construction." After TASK-008 the
          FOURTH of those four is false in its stated form: doctor derives the
          exclusion set from `ctx.Packs` and INJECTS it, so the set comes from the
          packs doctor loaded rather than from inside the helper.

          FIX THE MECHANISM, KEEP THE POINT. The sentence's actual claim — doctor and
          the gate share ONE predicate rather than two implementations that agree today
          — is still true and is MORE true after this change, because both now derive
          the injected set the same way from the same installed-pack manifests. Say
          that. Do not delete the four-part enumeration and leave the paragraph vague,
          and do not weaken it to "doctor holds no exclusion list" without saying where
          the set now comes from. THIS SENTENCE IS MIRRORED VERBATIM IN CODE at
          `cmd/backstop/doctor_checks.go:360-366`, which TASK-008 corrects in the same
          way; the two must not be left saying different things, so read TASK-008's
          instruction before writing this one and match it.

          ── SITE 3 (SIGNATURE): SPEC-070:1198 ─────────────────────────────────
          The related-artifacts entry for SPEC-068 restates the helper's signature
          verbatim: "`pkg/gate`'s `FindUngatedArtifacts(projectRoot, root)
          ([]UngatedArtifact, error)` returning `UngatedArtifact{Path, Kind,
          ExpectedDir, Root}`". TASK-008 adds a third parameter
          (`nonCorpus artifact.NonCorpusDirs`), so the parameter list is stale; the
          RETURN type and the `UngatedArtifact` field list are unchanged and must be
          left exactly as they are. Extend the signature to match the real one — the
          same extend-to-match instruction TASK-014 applies to SPEC-068:862 (the
          PROVIDING contract for this same symbol) and TASK-016 applies to SPEC-043's
          three Classification sites. A restated signature is a promise about shape
          wherever it appears, including in a related-artifacts note.

          ── SITE 4 (CONTRACT NOTES): SPEC-070:651 ─────────────────────────────
          FOUND BY THE MECHANISM SWEEP ON 2026-08-16 AND NOT NAMED BY ANY EARLIER
          REVISION OF THIS PLAN — surfaced here rather than left for someone to trip
          over. The `provides:` entry for `checkArtifactLayout` carries a `notes:`
          field that drifts TWICE in one sentence: it restates the call as
          "`gate.FindUngatedArtifacts(projectRoot, root)`" (stale parameter list, same
          fix as site 3) and asserts checkArtifactLayout holds "no exclusion list of
          its own, or it becomes the fourth hardcoding REQ-029 exists to remove" (same
          mechanism drift as site 2).

          THIS IS THE HIGHEST-STAKES OF SITES 2-4 despite reading like a footnote: a
          contract `notes:` field sits on a `provides:` entry, so it is part of what
          the contracts dimension carries forward as this spec's promise about
          `checkArtifactLayout`'s shape — the same reasoning TASK-016 gives for
          SPEC-043:301. `checkArtifactLayout`'s OWN signature
          (`func checkArtifactLayout(ctx doctorContext) doctorResult`) does NOT change
          — it derives the set from the `ctx` it already receives — so leave the
          `signature:` field alone and edit only `notes:`. Preserve the rest of that
          note verbatim, including the `Config.ArtifactRoot` / typed-root-error
          sentences, which this plan does not touch.

          ── SITE 5 (NARRATIVE): SPEC-070:1268-1278, ONE BULLET ────────────────
          This is a SINGLE related-artifacts bullet that BOTH sweeps hit — the
          signature sweep at its head (:1268, `FindUngatedArtifacts`) and the prose
          sweep at its tail (:1271, :1276) — which is why it is scoped as one site
          rather than two. The two halves get DIFFERENT treatment, so read before
          editing:

            :1268, THE HEAD, IS NOT DRIFT AND MUST BE LEFT ALONE. It says SPEC-068's
              symbols (`ResolveRoot`, `Root`, `Root.Dir`, `ClassifyFilename`, the
              typed root errors, `Config.ArtifactRoot`, `FindUngatedArtifacts`) are
              "all consumed here and none restated". That stays TRUE after TASK-008:
              this bullet restates no signature, so an added parameter cannot falsify
              it. The bullet that DOES restate the signature is a different one at
              :1198 — site 3 above — and the two must not be conflated.

            :1271-1278, THE TAIL, IS THE DRIFT. It restates the same five-name
              enumeration and describes `cmd/backstop/artifact_discover.go:47-49` as
              an "UNCONDITIONAL `switch base` list" — already false before this plan
              (SPEC-068 removed the switch), and doubly so after it. Lower stakes than
              site 1 because it is narrative rather than requirement text, but it
              closes with "a DD-13 concern raised separately", and that concern is now
              RESOLVED by ISSUE-122. Update it to describe the shipped shape and cite
              ISSUE-122 as the resolution.

          ── SITE 6 (NARRATIVE): SPEC-069 Sharp Edge 5, :2792-2807 ─────────────
          Same treatment TASK-014 gives SPEC-068's Sharp Edge 12. This sharp edge
          enumerates the five names, describes the `switch base` at `:47` with its
          literals at `:48` as live code (false — SPEC-068 deleted it), and explicitly
          hands the `node_modules` literal off: "is ALREADY FILED as ISSUE-122 … no new
          issue is needed and none should be filed." That hand-off is DISCHARGED once
          this plan lands, and the sharp edge should record it as RESOLVED by ISSUE-122
          rather than reading as an open referral. Its OTHER half — the `.backstop`
          skip and the CLM-103 tripwire — is untouched by this plan and must be
          preserved verbatim.

          SPEC-069:3124 and :3198 (the related-artifacts and references entries that
          call ISSUE-122 "open") and :3216 (the `artifact_discover.go:47-49` reference
          entry naming the `node_modules`/`vendor` literals) carry the same stale
          referral and should be updated in the same pass for consistency. They are
          bookkeeping, not requirements — do not let them displace site 1's priority.

          ── THE SIGNATURE-SWEEP HITS THAT ARE GENUINELY CLEAR ─────────────────
          Four of the nine SPEC-070 hits. Verified individually on 2026-08-16;
          recorded so nobody re-derives them and so an unlisted future hit reads as new
          rather than as already-considered. With sites 1-5 above (:208, :651, :896,
          :1198, :1268) these four account for all nine:
            :683   the `consumes:` entry `name: FindUngatedArtifacts`. Names the symbol
                   without restating its shape — `consumes:` entries carry no
                   signature, so an added parameter cannot make it false.
            :1022  narrative about the RENAME to `FindUngatedArtifacts` ("the old name
                   encoded the wrong predicate"). About the name, not the signature or
                   the exclusion set.
            :1409  the close-out Review-Question answer: `checkArtifactLayout`
                   "delegates per-KIND deviation to `gate.FindUngatedArtifacts` and
                   performs no root-containment reduction of its own." STILL TRUE after
                   TASK-008 — it claims delegation and a per-KIND predicate, neither of
                   which changes, and it makes no claim about the exclusion set. Leave
                   it alone; "adjacent to a drifting sentence" is not drift.
            :1560  "the shared helper to `FindUngatedArtifacts`, which this spec now
                   consumes" — a rename/consumption note, no shape claim.

          ROUTE ALL OF THIS THROUGH spec-author. Do NOT hand-edit — CLAUDE.md forbids
          it. Do NOT touch either spec's requirements beyond REQ-007's stated mechanism
          (site 1), and do not touch any claim or mandated test name in either spec.
          The ONE contract edit in scope is site 4's `notes:` field on
          `checkArtifactLayout`, and it is bounded there: no `signature:` field in
          either spec changes, because `checkArtifactLayout`'s own signature is
          unchanged and `FindUngatedArtifacts`'s PROVIDING contract lives in
          SPEC-068:862 where TASK-014 owns it. SPEC-069 has no contract on this surface
          at all. This task changes stale PROSE, one requirement's REASONING, one
          restated signature and one contract note's mechanism description; it changes
          no promise either spec makes.

          Then run `backstop artifact validate --spec SPEC-070` and
          `backstop artifact validate --spec SPEC-069` and confirm both pass.
        files:
          - specs/SPEC-070-backstop-doctor.spec.md
          - specs/SPEC-069-backstop-init.spec.md
        claims:
          - CLM-001
          - CLM-005
        depends_on:
          - TASK-013

      - id: TASK-015
        type: verification
        title: "Full kill chain and artifact validation"
        description: |
          Final comprehensive verification of everything this plan delivered.

          1. `backstop gate --all` — the full unscoped kill chain: artifact
             validation, findings engines, test verification, substantiveness,
             coverage, contracts, status drift, traceability, waiver resolution,
             baseline comparison, ledger integrity. It must be GREEN with no new
             waivers. A waiver added to pass this is a plan failure, not a pass.
          2. `backstop artifact validate --plan PLAN-ISSUE-122`,
             `backstop artifact validate --spec SPEC-068`,
             `backstop artifact validate --spec SPEC-043`,
             `backstop artifact validate --spec SPEC-070` and
             `backstop artifact validate --spec SPEC-069` — all five pass. All four
             specs are reconciled in this phase (TASK-014, TASK-016, TASK-017) and all
             four must validate; a green gate with a stale contract signature — or with
             a requirement whose stated mechanism no longer describes the code — is the
             failure mode this step exists to catch.
          3. Grep confirmation of the actual invariant, since that is what the issue
             is about: `grep -rn "node_modules\|\"vendor\"" --include="*.go" pkg/ cmd/`
             returns hits ONLY in test files and testdata fixtures — no production
             Go source under pkg/ or cmd/ carries either noun. If a production hit
             remains, the defect is not fixed, whatever the gate says.
          4. Confirm `backstop gate --all` was run from a clean tree with the packs
             installed, not from a stale build — rebuild ./bin/backstop first.
          5. RE-RUN BOTH CANONICAL CORPUS-WIDE SWEEPS, byte for byte as the plan
             notes' METHOD block and TASK-014 state them —
             `grep -rn 'node_modules\|vendor' specs/` and
             `grep -rn 'FindUngatedArtifacts\|DiscoverArtifacts\|realArtifactValidator\|Classification' specs/`
             — and confirm every surviving hit describes the SHIPPED shape. This plan
             missed a drifted spec in two consecutive review rounds by grepping one
             spec instead of the corpus, and missed three more by skimming a long
             result set; this step is the standing guard against a third failure of
             either kind. Apply the notes' FINDING test: a hit that still enumerates
             `vendor`/`node_modules` as something core carries, or that restates a
             signature/field list predating TASK-008, is an unreconciled site — report
             it, do not rationalize it.

             THESE SWEEPS RETURN DOZENS OF HITS AND MOST ARE NOT DRIFT. The following
             were each opened and checked on 2026-08-16 and are GENUINELY CLEAR —
             listed here, in the same spirit as TASK-016's SPEC-047:428 / TASK-017's
             SPEC-070:683 clearances, so this step does not hand back a pile of
             unexplained reports and so a genuinely NEW hit reads as new:
               SPEC-014:1250 — "the full vendor tree" in a tool_config fidelity-gap
                 note about temp Go modules. The adjective, not the skip list.
               SPEC-045:14, :462, :751 — all name `pack.Manifest.Classification` as
                 the field SPEC-043 adds and this spec consumes. None restates the
                 struct's fields, so an added field cannot falsify them. (:338 and
                 :575 likewise: both say the TestNamePatterns field is DISJOINT from
                 Classification — a disjointness claim, not a shape claim.)
               SPEC-047:90, :478 — the same: `pack.Manifest.Classification` named as
                 a consumed field, no field enumeration. Consistent with :428, already
                 cleared in TASK-016.
               SPEC-050:23, :352, :535, :687, :747 — `realArtifactValidator.ValidateAll`
                 and `DiscoverArtifacts` named as the symbols this spec's corpus
                 resolution pass runs behind. :352 explicitly says "Unchanged
                 signature"; none of the five restates a parameter list or a struct's
                 fields, and TASK-008 changes neither ValidateAll's signature nor the
                 resolution pass's behavior. (:542 says the type filter is passed "to
                 `DiscoverArtifacts`" — still true; TASK-008 adds a parameter beside
                 it, it does not remove the filter.)
             Also verified: `buildResolutionViolations` — the function TASK-008 threads
             cfg.NonCorpus into — appears in NO spec at all, so it carries no contract
             to reconcile. Its behavior is specified only through ValidateArtifacts,
             which SPEC-050:352 already declares signature-unchanged.
             The remaining sweep hits are test names, section headings, `consumes:`
             entries and prose uses of "vendored" as an adjective; none meets the
             FINDING test.

          TASK-012 (the Node-ecosystem pack declarations) is DELIBERATELY ABSENT from
          this task's dependencies. That task is designed to STOP and report if either
          pack repo is mid-flight elsewhere, and a legitimate stop must not make this
          plan permanently unfinishable. The core change is complete without it; if
          TASK-012 did stop, say so plainly in the close-out rather than treating this
          verification as blocked.
        files:
