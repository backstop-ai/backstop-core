        description: |
          Add test functions to specs/tests/spec-003-agent-hooks-test.sh for
          core hook behavior: reading agent name from env, reading file path
          from stdin, handling no agent name, and handling malformed input.

          Test functions (mandated names from spec):
            - TestHook_ScriptExists — verify file exists at expected path
            - TestHook_ScriptIsExecutable — verify file has execute permission
            - TestHook_ReadsAgentNameFromEnv — set CLAUDE_AGENT_NAME=spec-author,
              pipe valid JSON with .spec.md path, assert exit 0
            - TestHook_ReadsFilePathFromStdin — set agent to spec-author, pipe
              JSON with file_path field, verify hook processes correctly
            - TestHook_NoAgentName_Allows — set CLAUDE_AGENT_NAME="" (empty),
              pipe any file path, assert exit 0
            - TestHook_UnsetAgentName_Allows — unset CLAUDE_AGENT_NAME entirely,
              pipe any file path, assert exit 0
            - TestHook_EmptyStdin_Allows — set agent name, provide empty stdin,
              assert exit 0
            - TestHook_InvalidJson_Allows — set agent name, pipe "not json" on
              stdin, assert exit 0
            - TestHook_UnknownAgent_Blocks — set CLAUDE_AGENT_NAME="rogue-agent",
              pipe any file path, assert exit 2

          All tests should fail initially since the hook is just a placeholder.
        files:
          - specs/tests/spec-003-agent-hooks-test.sh
        claims:
          - CLM-001
          - CLM-002
          - CLM-003
          - CLM-030
          - CLM-031
