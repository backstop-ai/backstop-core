      - id: TASK-007
        type: implementation
        title: "Implement per-agent allowlist matching in hook script"
        description: |
          Fill in the case statement branches in backstop-agent-guard.sh for
          all 9 agent types.

          Case branches:
            bundle-author:
              Allow if file_path ends with .bundle.md, block otherwise.

            spec-author:
              Allow if file_path ends with .spec.md, block otherwise.

            adr-author:
              Allow if file_path ends with .adr.md, block otherwise.

            issue-author:
              Allow if file_path ends with .issue.md, block otherwise.

            planner:
              Allow if file_path ends with .plan.yml, block otherwise.

            implementer:
              Allow if:
                - file_path ends with .go, OR
                - basename is go.mod, go.sum, or Makefile, OR
                - file_path ends with .json or .yml AND path contains
                  .backstop/ or artifacts/ as path segments
              Block otherwise.

            spec-reviewer|plan-reviewer|impl-reviewer:
              Always block (exit 2 with JSON reason).

            * (default):
              Block (unknown agent, default-deny).

          Sharp edge: implementer's scoped directory matching must check for
          path segments (.backstop/ and artifacts/) not arbitrary substrings.
          Use pattern matching like */\.backstop/* or */artifacts/* to avoid
          false positives on paths like pkg/artifacts-legacy/schema.json.

          All block outputs must use the JSON format:
            {"decision":"block","reason":"agent <name> not permitted to write <path>"}
        files:
          - .claude/hooks/backstop-agent-guard.sh
