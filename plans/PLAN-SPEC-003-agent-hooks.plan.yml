          The file must contain:
            {
              "hooks": {
                "PreToolUse": [
                  {
                    "matcher": "Edit",
                    "hooks": [
                      {
                        "type": "command",
                        "command": ".claude/hooks/backstop-agent-guard.sh"
                      }
                    ]
                  },
                  {
                    "matcher": "Write",
                    "hooks": [
                      {
                        "type": "command",
                        "command": ".claude/hooks/backstop-agent-guard.sh"
                      }
                    ]
                  }
                ]
              }
            }

          Note: .claude/settings.local.json already exists with permissions.
          settings.json is a separate file — do not merge them. Claude Code
          reads both files.
