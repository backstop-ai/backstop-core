---
plan_id: PLAN-SPEC-003
spec_id: SPEC-003
spec_version: 1.0.0
created: "2026-03-31"
status: draft
target_repo: backstop-core
test_command: "bash specs/tests/spec-003-agent-hooks-test.sh"
coverage_threshold: 80

notes: |
  Implements a PreToolUse hook script (.claude/hooks/backstop-agent-guard.sh)
  that enforces per-agent file-type write restrictions. Nine agent types are
  supported with specific allowlists. Reviewer agents are blocked from all
  writes. Unknown agents default to deny. No agent name defaults to allow.

  This is shell script + JSON config, not Go code. Tests are a bash test
  harness at specs/tests/spec-003-agent-hooks-test.sh that invokes the hook
  as a subprocess with controlled env vars and stdin JSON.

  The hook script and settings.json are the two deliverables. The test harness
  is the single test file. Since all three are independent files, some
  parallelism is possible between test-writing and settings.json work.

  Structure:
    Phase 1: Setup — directories and test harness scaffold
    Phase 2: Core hook behavior — input parsing, no-agent, malformed input
    Phase 3: Per-agent allowlist enforcement — all 9 agent types
    Phase 4: Settings.json registration + exit code semantics
    Phase 5: Comprehensive verification

phases:
  # ═══════════════════════════════════════════════════════════════════════
  # Phase 1: Setup — Directory Structure and Test Harness Scaffold
  # ═══════════════════════════════════════════════════════════════════════
  - id: phase-1
    name: "Phase 1: Setup — Directory Structure and Test Harness Scaffold"
    tasks:
      - id: TASK-001
        type: setup
        title: "Create directories and scaffold test harness"
        description: |
          Create the directory structure and scaffold the test harness.

          Directories to create:
            - .claude/hooks/ (for the hook script)
            - specs/tests/ (for the test harness)

          Create specs/tests/spec-003-agent-hooks-test.sh with:
            - Shebang (#!/usr/bin/env bash)
            - set -euo pipefail
            - SCRIPT_DIR and PROJECT_ROOT resolution
            - HOOK path variable pointing to .claude/hooks/backstop-agent-guard.sh
            - PASS/FAIL/TOTAL counters
            - Helper functions:
              - run_hook(agent_name, file_path) — sets CLAUDE_AGENT_NAME, pipes
                JSON stdin to the hook, captures exit code and stdout
              - assert_allowed(test_name, agent_name, file_path) — runs hook,
                asserts exit 0
              - assert_blocked(test_name, agent_name, file_path) — runs hook,
                asserts exit 2, validates JSON output has decision and reason
              - report() — prints pass/fail summary, exits non-zero if any failed
            - A jq availability check at the top (skip all tests if jq missing)
            - Placeholder comment for test functions to be added in later phases

          Create .claude/hooks/backstop-agent-guard.sh as an empty executable
          placeholder (just shebang and exit 0) so the test harness can be
          validated structurally.
        files:
          - specs/tests/spec-003-agent-hooks-test.sh
          - .claude/hooks/backstop-agent-guard.sh
        claims:
          - CLM-001
        depends_on: []

