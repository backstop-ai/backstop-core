      - id: TASK-003
        type: implementation
        title: "Implement core hook script with input parsing"
        description: |
          Replace the placeholder .claude/hooks/backstop-agent-guard.sh with
          the full core implementation.

          The script must:
            1. Read CLAUDE_AGENT_NAME from environment. If empty or unset,
               exit 0 immediately.
            2. Read all of stdin into a variable. If empty, exit 0.
            3. Parse stdin JSON with jq to extract .tool_input.file_path.
               If jq fails (invalid JSON), exit 0.
            4. Store the agent name and file path for allowlist matching
               (matching logic added in Phase 3).
            5. For now, implement the default-deny case: if agent name is
               not recognized by the case statement, output block JSON
               ({"decision":"block","reason":"..."}) and exit 2.
            6. Add empty case branches for all 9 known agents as stubs
               that exit 0 (to be filled in Phase 3).

          The script must use #!/usr/bin/env bash, never exit 1.

          Block JSON format:
            printf '{"decision":"block","reason":"agent %s not permitted to write %s"}\n'
        files:
          - .claude/hooks/backstop-agent-guard.sh
        claims:
          - CLM-001
