  # ═══════════════════════════════════════════════════════════════════════
  # Phase 2: TDD Red — the delivered_by trace behavior test
  # ═══════════════════════════════════════════════════════════════════════
  - id: phase-2
    name: "Phase 2: TDD Red — delivered_by Trace Validation Tests"
    tasks:
      - id: TASK-005
        type: test
        title: "Write failing delivered_by trace tests (path-anchored, cross-context)"
        description: |
          Add pkg/validate/issue_delivered_by_test.go exercising the REAL
          validate.Issue path against the Phase 1 fixtures, and extend
          pkg/artifact/parse_test.go to pin the SourcePath field. No mocks — real
          parsing, real Plan validation of the backing plan.

          RESOLUTION IS SOURCE-PATH ANCHORED, NOT CWD: each validate.Issue subtest
          parses the target issue via artifact.ParseFile(<full fixture path>) and
          runs validate.Issue. The backing plan resolves relative to the issue's
          own SourcePath, so the tests do NOT rely on t.Chdir into the fixture
          root. These FAIL until TASK-006 lands: the parse test fails because
          ParsedArtifact has no SourcePath yet (package will not compile — an
          acceptable red), and the thin ISSUE-901 case reports missing
          requirements/claims because validateIssueTraceability today requires the
          full REQ/CLM chain for every closed issue.

          Mandated test names (exact):

            - TestParse_PopulatesSourcePath (CLM-012): artifact.Parse /
              artifact.ParseFile populate art.SourcePath with the full path passed
              in (Filename stays the base name — no regression to existing Filename
              assertions).
            - TestIssueDeliveredBy_ValidTraceClosesWithoutOwnClaims (CLM-001):
              ISSUE-901 (thin: delivered_by + Resolution, no REQ/CLM) validates
              with ZERO violations. Assert specifically that no
              issue/requirements-required or issue/claims-required violation is
              present.
            - TestIssueDeliveredBy_ResolvesFromArtifactPath_NotCWD (CLM-012,
              integration): validate ISSUE-901 while the process working directory
              is an UNRELATED dir (e.g. t.Chdir(t.TempDir()) — deliberately NOT
              the fixture root/plans parent). The trace must STILL resolve the
              backing plan via the artifact's own SourcePath and validate clean.
              This proves the production wiring (path anchoring), not a
              happy-aligned CWD; it is the guard against the integration-gap of a
              fixture whose CWD coincidentally equals the plans parent.
            - TestIssueDeliveredBy_MalformedPointer_Errors (CLM-002): ISSUE-902
              (delivered_by "garbage") yields an error violation on the
              delivered_by format rule, before any filesystem lookup.
            - TestIssueDeliveredBy_MissingPlanFile_Errors (CLM-003): ISSUE-903
              (delivered_by names a plan with no file, but plans/ resolves) yields
              a plan-not-found error.
            - TestIssueDeliveredBy_PlansDirUnresolvable_Errors (CLM-011):
              ISSUE-911 (under no-plans-dir/, with NO sibling plans/) yields a
              fail-loud plans-unresolvable error — NOT a silent trace-satisfied
