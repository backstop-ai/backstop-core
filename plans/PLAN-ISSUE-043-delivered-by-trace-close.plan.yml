  # ═══════════════════════════════════════════════════════════════════════
  # Phase 3: TDD Green — implement the delivered_by trace relaxation
  # ═══════════════════════════════════════════════════════════════════════
  - id: phase-3
    name: "Phase 3: TDD Green — delivered_by Trace Logic"
    tasks:
      - id: TASK-006
        type: implementation
        title: "Add ParsedArtifact.SourcePath, then the path-anchored delivered_by trace"
        description: |
          Make the Phase 2 tests pass. Three cohesive edits:

          1. Source-path plumbing (pkg/artifact):
             - Add a `SourcePath string` field to ParsedArtifact
               (pkg/artifact/artifact.go).
             - In artifact.Parse (pkg/artifact/parse.go), set
               `art.SourcePath = filename` from the same `filename` argument that
               already feeds `Filename: filepath.Base(filename)` at line 25.
               Filename stays the base name (no regression). This is additive and
               does NOT touch the ValidatorFunc(art, sch) signature.

          2. New file pkg/validate/delivered_by.go — a static, exec-free helper:
             - `deliveredByRe` = ^PLAN-ISSUE-[0-9]{3}$.
             - resolvePlansDir(art): anchor on the ISSUE's own path, NOT CWD.
               Compute `dir := filepath.Dir(art.SourcePath)`; the plans dir is its
               sibling `filepath.Join(dir, "..", "plans")`. If art.SourcePath is
               empty or directory-less (filepath.Dir == "." for a base-only
               synthetic filename), OR the resolved plans/ dir does not exist
               (os.Stat), return a fail-loud "unresolvable" signal — NEVER treat
               unresolvable as trace-satisfied. Pure filesystem: filepath.Dir/Join
               + os.Stat only.
             - a helper that, given the parsed issue art, the delivered_by id, and
               the closing issue's id, returns a []Violation (empty == trace
               satisfied):
                 * format check → issue/delivered-by-malformed (CLM-002);
                 * plans dir unresolvable (per resolvePlansDir) →
                   issue/delivered-by-plans-unresolvable (CLM-011), fail-loud;
                 * filepath.Glob(<plansDir>/PLAN-ISSUE-NNN-*.plan.yml); zero
                   matches → issue/delivered-by-plan-not-found (CLM-003);
                 * artifact.ParseFile + validate.Plan on the matched plan; any
                   plan violation → issue/delivered-by-plan-invalid (CLM-005) —
                   REUSE validate.Plan, do not reimplement;
                 * plan status != "completed" (read status/spec_id from the parsed
                   plan frontmatter) → issue/delivered-by-plan-not-completed
                   (CLM-004) — draft/implementing AND retired replaced/canceled all
                   reject (only `completed` is a delivered success);
                 * plan spec_id != closing issue id →
                   issue/delivered-by-spec-mismatch (CLM-006).
             - This file MUST NOT import pkg/gate and MUST NOT import os/exec
               (CLM-009). It re-derives the issue→plan linkage locally, resolved
               from the artifact's SourcePath (CLM-012) so it is a pure function of
               its inputs, independent of ambient CWD / BACKSTOP_CONFIG.

          3. Wire into pkg/validate/issue.go validateIssueTraceability (~line 342):
