---
plan_id: PLAN-ISSUE-043
spec_id: ISSUE-043
created: "2026-07-08"
status: draft
target_repo: backstop-core
target_module: github.com/bmanson/backstop-core
test_command: "go test ./pkg/validate/... -run TestIssueDeliveredBy -race"
coverage_threshold: 90

notes: |
  Implements ISSUE-043 (DIR-016 cheap-close half). Closing a plan-backed issue
  currently forces re-authoring the plan's requirements/claims/verification onto
  the issue — the schema's `closed-requires-traceability` rule requires REQ+CLM
  from `ready` onward, and validateIssueTraceability (pkg/validate/issue.go:342)
  runs the full REQ→CLM→tests + verification + implementation + contracts chain
  for every status in traceabilityRequired, including `closed`. This plan removes
  that re-authoring tax by letting a CLOSED issue satisfy the obligation by
  TRACING to its delivered backing plan via an explicit `delivered_by` pointer.

  PINNED DECISIONS (settled in discussion — constraints, NOT open questions):

    1. Explicit top-level `delivered_by: PLAN-ISSUE-NNN` frontmatter field on the
       issue (mirrors the existing top-level `replaced-by` convention from
       ISSUE-031 — greppable, self-describing). NOT schema-side plan
       auto-discovery.

    2. Conditional relaxation: when status == "closed" AND a valid `delivered_by`
       is present, the issue's own requirements/claims/verification/implementation/
       contracts arrays are NOT required — the traced plan carries the delivered
       claims of record. Static conditions the validator checks (all fail-loud
       ERRORs; a delivered_by pointing at a missing/non-completed/invalid/wrong
       plan does NOT silently pass the close):
         - `delivered_by` matches PLAN-ISSUE-NNN format;
         - the named plan FILE exists under the resolved plans/ directory;
         - the plan's `status` is `completed` (the plan success-terminal; the enum
           is draft/ready/implementing/completed/replaced/canceled — `replaced`
           and `canceled` are RETIRED and must NOT satisfy a delivered trace);
         - the plan itself validates clean (reuse pkg/validate's existing Plan
           validator — do NOT reimplement plan validation);
         - the plan actually backs THIS issue: plan.spec_id == the closing issue's
           id (re-derives the ISSUE-042 issue→plan linkage pattern by spec_id).

    3. Validator stays STATIC — do NOT run the plan's tests. Trust the plan's
       terminal state; liveness (do the plan's task-tests still pass) is the
       GATE's job, already shipped by ISSUE-042's drift dimension. pkg/validate
       has NO os/exec today and MUST keep it that way. The delivered_by helper may
       read the filesystem (os.Stat / os.ReadDir / filepath.Glob — pure static
       reads) but MUST NOT shell out. This static-trust is sound BECAUSE 042 now
       enforces terminal-success ⟹ mandated-tests-exist at the gate.

    4. Conditional, not general: an issue that reaches `closed` WITHOUT a
       `delivered_by` still requires the full requirements/claims/verification
       chain (no regression). Statuses before `closed` (ready/in-progress/blocked)
       are unchanged — `delivered_by` is honored ONLY at `closed`.

    5. Minimum standalone content: a `delivered_by`-closed issue must still be
       independently readable — it must carry a `Resolution` prose section (an
       already-optional schema section) in addition to the `delivered_by` pointer.
       A pure-pointer issue with no Resolution is an ERROR. (The existing
       closed-requires-date rule still applies unchanged.)

  ARCHITECTURE CONSTRAINT (verified against the import graph):
    The issue→plan linkage is RE-DERIVED inside pkg/validate, NOT imported from
    pkg/gate. pkg/gate consumes validators (it calls validate.Plan-shaped logic),
    so importing pkg/gate into pkg/validate would invert the layering and block
    gate from ever importing validate. The delivered_by helper reuses the PATTERN
    from ISSUE-042's BackingPlan resolver (scan plans, index by spec_id ==
    issue-id) re-implemented on top of pkg/validate's OWN plan parsing
    (artifact.ParseFile + validate.Plan). Do NOT add a pkg/gate import.

  PLANS-DIRECTORY RESOLUTION (design note for the implementer — SOURCE-PATH
  ANCHORED, CWD-INDEPENDENT):
    The delivered_by check must READ the backing plan file, so pkg/validate
    gaining STATIC filesystem reads is unavoidable for this feature (fine — just
    no os/exec). Resolve the plan RELATIVE TO THE ISSUE FILE, never from the
    ambient CWD (CWD diverges from projectRoot under BACKSTOP_CONFIG, producing
    false RED/GREEN on a rule every closed issue hits).

    Enabling change: artifact.Parse ALREADY receives the full path in its
    `filename` argument and today discards the directory at
    pkg/artifact/parse.go:25 (`Filename: filepath.Base(filename)`). Add a
    `SourcePath` field to ParsedArtifact (pkg/artifact/artifact.go) and populate
    it from that same `filename` in artifact.Parse. This does NOT change the
    ValidatorFunc(art, sch) signature — `art` already flows through — so there is
    no blast radius across the other five validators / the route table.

    The helper then resolves the plans/ directory as the issue file's sibling:
    `filepath.Join(filepath.Dir(art.SourcePath), "..", "plans")`, then globs
    `plans/PLAN-ISSUE-NNN-*.plan.yml`. Production: issue at
    `<root>/issues/ISSUE-NNN.issue.md` → `<root>/plans`. Tests: fixture issue at
    `.../root/issues/ISSUE-NNN.issue.md` → `.../root/plans`, resolved from the
    artifact's own path regardless of the test's working directory. Parse may be
    called with a synthetic/base-only filename in some contexts, so an empty or
    directory-less SourcePath, or a non-existent plans/ sibling, must be handled
    fail-loud (see CLM-011), NEVER a silent trace-satisfied pass. Static reads
    only (filepath.Dir/Join, os.Stat, filepath.Glob, artifact.ParseFile); no
    os/exec.

  KNOWN INTERACTION (note, not a blocker): a `delivered_by` issue carries no own
    claims, so it is invisible to ISSUE-042's issue-claim drift check, and its
    plan's task-tests are not gate-checked until ISSUE-048 Problem 3 (plan-task-
    test coverage) lands. Acceptable — the plan reaching `completed` meant its
    gate passed at delivery (static trust); ongoing liveness is deferred to
    ISSUE-048 P3.

  CLAIMS (this plan's own; the issue is `open` and carries none yet):
    CLM-001 A closed issue with a valid delivered_by pointer + a Resolution
            section validates clean WITHOUT its own requirements/claims/
            verification/implementation/contracts arrays.
    CLM-002 A delivered_by value that does not match PLAN-ISSUE-NNN is a
            validation error (fail-loud), before any plan lookup.
    CLM-003 A delivered_by naming a plan file that does not exist under the
            resolved plans/ dir is a validation error.
    CLM-004 A delivered_by plan whose status is not `completed` (draft/
            implementing, or a RETIRED replaced/canceled) is a validation error.
    CLM-005 A delivered_by plan that itself fails plan validation is a validation
            error (the trace reuses validate.Plan, not a reimplementation).
    CLM-006 A delivered_by plan whose spec_id != the closing issue's id (backs a
            different issue) is a validation error.
    CLM-007 A closed issue WITHOUT delivered_by still requires the full
            requirements/claims/verification chain — a bare close fails; a fully
            traced close still passes (no regression).
    CLM-008 A delivered_by-closed issue lacking a Resolution section is a
            validation error (minimum standalone content).
    CLM-009 The trace logic lives in pkg/validate, re-derives the issue→plan
            linkage, does NOT import pkg/gate, and introduces NO os/exec (static
            file reads only).
    CLM-010 The optional `delivered_by` field is documented in the issue schema.
    CLM-011 A delivered_by present on a closed issue whose plans/ directory is
            unresolvable (no sibling plans/ dir, or an empty/directory-less
            SourcePath) is a fail-loud validation ERROR (plans-unresolvable),
            NEVER a silent trace-satisfied pass.
    CLM-012 The backing plan is resolved relative to the issue's OWN source path
            (via a SourcePath field on ParsedArtifact populated by
            artifact.Parse), CWD-INDEPENDENT — the trace resolves correctly when
            the validator runs from a working directory other than the plans
            parent.

