            - ISSUE-834-resolved-no-resolution.issue.md — resolved-by: a valid
              commit SHA, no REQ/CLM, and DELIBERATELY NO `## Resolution` section.
              Must FAIL on issue/resolved-by-resolution-required (CLM-006).
            - ISSUE-835-bare-close.issue.md — status: closed, NO resolved-by, NO
              delivered_by, NO requirements/claims. Must FAIL (full traceability
              still required) — the no-regression negative half (CLM-007).
            - ISSUE-836-both-pointers.issue.md — status: closed carrying BOTH
              delivered_by: PLAN-ISSUE-830 AND resolved-by: a valid commit SHA, plus
              a Resolution section. Must FAIL fail-loud on
              issue/close-pointer-conflict — at most one close pointer (CLM-007,
