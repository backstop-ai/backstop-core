          - pkg/gate/testdata/status_drift_vocab/root/plans/PLAN-SPEC-840-plantests.plan.yml
          - pkg/gate/testdata/status_drift_vocab/root/plans/PLAN-SPEC-841-allpresent.plan.yml
        claims:
          - CLM-008
          - CLM-009
        depends_on: []

      - id: TASK-004
        type: documentation
        title: "Document obsoleted / obsoleted-by / resolved-by / test_names in the schemas"
        description: |
          Record the new vocabulary in the artifact schemas. NOTE: the SPEC status
          enum is LOAD-BEARING (spec.go reads sch.StatusEnum from this file), so the
          spec enum edit here is what makes the spec `obsoleted` fixture validate;
