              ISSUE-018. Proves the resolver classifies obsoleted as retired-terminal
              so ClassifyStatusDrift EXCLUDES it (CLM-008).
            - plans/PLAN-SPEC-840-plantests.plan.yml — status: completed,
              spec_id: SPEC-840, with phases[].tasks[].test_names declaring at least
              two names, e.g. [TestDriftVocab_Present, TestDriftVocab_Absent]. Drives
