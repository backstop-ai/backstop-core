            - issues/ISSUE-822-obsoleted-malformed-by.issue.md — status: obsoleted,
              obsoleted-by: "garbage" (not a typed ref). Must FAIL on
              obsoleted-by-malformed (CLM-002).
            - specs/SPEC-820-obsoleted-valid.spec.md — status: obsoleted,
              obsoleted-by: ISSUE-018, otherwise minimal. Must validate CLEAN once
              the spec status enum + terminal handling land (CLM-001, CLM-003).
            - specs/SPEC-821-obsoleted-no-by.spec.md — status: obsoleted, NO
              obsoleted-by. Must FAIL on spec/obsoleted-by-required (CLM-002).
            - plans/PLAN-ISSUE-820-obsoleted.plan.yml — status: obsoleted,
              obsoleted-by: ISSUE-018, spec_id: ISSUE-820, minimal phases. Must
              validate CLEAN once planStatuses accepts obsoleted (CLM-001, CLM-003).
            - plans/PLAN-ISSUE-821-obsoleted-no-by.plan.yml — status: obsoleted, NO
              obsoleted-by. Must FAIL on plan/obsoleted-by-required (CLM-002).

          These are real fixtures, not stubs — verify by construction that each
          intended-clean fixture is otherwise schema-valid and each intended-fail
          fixture fails ONLY on the obsoleted-by rule under test.
        files:
          - pkg/validate/testdata/terminal_vocab/issues/ISSUE-820-obsoleted-valid.issue.md
          - pkg/validate/testdata/terminal_vocab/issues/ISSUE-821-obsoleted-no-by.issue.md
          - pkg/validate/testdata/terminal_vocab/issues/ISSUE-822-obsoleted-malformed-by.issue.md
          - pkg/validate/testdata/terminal_vocab/specs/SPEC-820-obsoleted-valid.spec.md
          - pkg/validate/testdata/terminal_vocab/specs/SPEC-821-obsoleted-no-by.spec.md
          - pkg/validate/testdata/terminal_vocab/plans/PLAN-ISSUE-820-obsoleted.plan.yml
          - pkg/validate/testdata/terminal_vocab/plans/PLAN-ISSUE-821-obsoleted-no-by.plan.yml
        claims:
          - CLM-001
          - CLM-002
          - CLM-003
        depends_on: []

      - id: TASK-002
        type: setup
        title: "Scaffold resolved-by close-path closing-issue fixtures (structured-ref boundary)"
        description: |
          Create real .issue.md fixtures under
          pkg/validate/testdata/resolved_by/issues/ that drive the resolved-by
          close path, the structured-ref accept-boundary, the typed-ref existence
          check, the no-regression guard, and the both-pointers conflict. Each is
          status: closed with issue.closed set.

            - ISSUE-830-resolved-commit.issue.md — resolved-by: a hex commit SHA
              (e.g. "a1b2c3d4e5"), a `## Resolution` section, NO requirements/claims/
              verification/implementation/contracts and NO delivered_by. The thin
              COMMIT-ref accept case (the ISSUE-014 no-test/no-plan shape) — must
