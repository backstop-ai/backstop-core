            - ISSUE-838-referenced.issue.md — a minimal, schema-valid issue (any
              non-terminal status) that EXISTS as the sibling target ISSUE-831's
              typed resolved-by resolves to. Support fixture only.
            - ISSUE-832-resolved-prose.issue.md — resolved-by: "just fixed it"
              (arbitrary prose, matches neither the typed-ref nor the commit/PR
