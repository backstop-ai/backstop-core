  - id: phase-3
    name: "Phase 3: TDD Green — Terminal Vocab & resolved-by Validator"
    tasks:
      - id: TASK-006
        type: implementation
        title: "Implement obsoleted terminal rule + resolved-by close path"
        description: |
          Make the Phase 2 tests pass. Cohesive edits across the shared terminal
