          3. resolved-by close path — new file pkg/validate/resolved_by.go + wiring
             in issue.go validateIssueTraceability:
             - two compiled-regex singletons (package idiom, like deliveredByRe):
               resolvedByTypedRefRe = ^(BUNDLE|SPEC|ISSUE|PLAN|DIR)-[0-9]{3}$ and
               resolvedByCommitRe = ^[0-9a-f]{7,40}$ (a PR-URL shape is also
               accepted — a simple https://.../pull/ or /pulls/ prefix check).
             - a static helper validateResolvedBy(art, resolvedBy) []Violation:
                 * empty/blank/non-typed-non-commit-non-PR (arbitrary prose) ->
                   issue/resolved-by-malformed (CLM-005). This is the accept-boundary
                   that closes the vacuous-close hatch.
                 * if resolvedBy matches the TYPED-ref shape: statically verify the
                   referenced artifact FILE EXISTS via the SAME sibling-resolution
                   delivered_by already uses (resolve the artifact's own SourcePath
                   dir, glob the sibling type-dir for <REF>-*.<ext> — issues/,
                   specs/, plans/, bundles/, directives/ keyed by the ref prefix);
                   zero matches (or an unresolvable sibling dir) ->
                   issue/resolved-by-artifact-not-found (CLM-005, existence half).
                   Static reads only (filepath.Dir/Join, os.Stat, filepath.Glob) —
                   NO os/exec, NO pkg/gate import (parity with delivered_by layering).
                 * if resolvedBy matches the COMMIT/PR shape: shape-only, existence is
                   SKIPPED (a static validator cannot confirm a SHA) — accept.
             - in validateIssueTraceability, AFTER the existing delivered_by branch
