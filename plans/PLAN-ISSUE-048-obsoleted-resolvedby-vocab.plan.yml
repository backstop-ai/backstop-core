notes: |
  Implements ISSUE-048 (DIR-016 keystone follow-up to ISSUE-042). This plan builds
  the CODE MECHANISM ONLY — three coexisting terminal/close paths and the drift-
  dimension extension. It does NOT apply the vocabulary to the 39 stranded artifacts
  (ISSUE-002/003/005/006/008/018/036 + SPEC-041) nor resolved-by-close the 5 fixed-
  directly issues (011/014/015/016/017); that reconciliation is a DOWNSTREAM author-
  agent effort orchestrated after this ships. All tasks build+test against fixtures.

  PINNED DECISIONS (settled with the user — constraints, NOT open questions):

    1. NEW TERMINAL STATE `obsoleted` + `obsoleted-by: <artifact-id>` pointer, for
       artifacts DELIVERED + verified then had their capability (and tests) REMOVED
       by later superseding work with NO 1:1 successor (e.g. ISSUE-002 obsoleted-by
       ISSUE-018). Mirrors the EXISTING replaced/replaced-by rule (ISSUE-031,
       pkg/validate/terminal.go validateRetirementFields): `obsoleted` REQUIRES a
       non-empty, typed `obsoleted-by` (BUNDLE|SPEC|ISSUE|PLAN|DIR-NNN). Distinct
       from `replaced` (no successor equivalent — removed, not replaced) and
       `canceled` (obsoleted DID ship). Applied to issue/spec/plan.

    2. NEW `resolved-by: <structured-ref>` close path, for issues fixed DIRECTLY
       (a real commit) with NO issue->plan track, so `delivered_by` (ISSUE-043,
       requires a `completed` backing plan) cannot apply. A `status: closed` issue
       carrying `resolved-by` satisfies closed-requires-traceability by pointing at
       the resolving work WITHOUT own requirements/claims and WITHOUT a mandated test
       or a completed plan — critically it works for a fix with NO test (e.g.
       ISSUE-014 is a prompt-only plan-reviewer change: it points at its fix COMMIT
       SHA). Still requires a `## Resolution` section (standalone-readable), same as
       delivered_by. Static / trust-based (no test execution), consistent with
       delivered_by.

       resolved-by must be a STRUCTURED ref — NOT free-text — so it cannot become a
       vacuous-close hatch (a bare `resolved-by: done` + a Resolution heading would
       otherwise bypass ALL REQ->CLM->test rigor AND be invisible to the drift
       dimension, since a resolved-by close carries no claims). Accepted shapes:
         (a) a TYPED artifact ref `^(BUNDLE|SPEC|ISSUE|PLAN|DIR)-[0-9]{3}$`; OR
         (b) a COMMIT/PR ref — a hex SHA `^[0-9a-f]{7,40}$` OR a PR URL.
       Anything else (arbitrary prose) is a fail-loud issue/resolved-by-malformed
       error. ADDITIONALLY, when resolved-by is a TYPED artifact ref, statically
       verify the referenced artifact FILE EXISTS (sibling-file check, exactly the
       layering-consistent static read delivered_by already does — os.Stat/Glob/
       artifact.ParseFile, NO os/exec). Existence is SKIPPED for commit/PR refs — a
       static validator cannot confirm a SHA — those stay shape-only / trust. This
       keeps resolved-by no looser than the rest of the pointer family (delivered_by
       resolves to a real completed plan; replaced-by/obsoleted-by are typed refs).
       NOTE the asymmetry vs obsoleted-by/replaced-by, which stay SHAPE-ONLY (no
       existence check — the existing retirement-field trust level; do NOT expand
       existence checking to them).

    3. EXTEND the ISSUE-042 drift dimension (facet 3):
       (a) `obsoleted` joins the RETIRED-terminal set the drift dimension EXCLUDES
           (ClassifyArtifactStatus in pkg/gate/artifact_status.go, alongside
           replaced/canceled/deprecated -> ClassRetiredTerminal). An obsoleted
           artifact's absent mandated tests therefore no longer flag as a broken
           promise — self-documenting via obsoleted-by, replacing the permanent
           baseline grandfather.
       (b) EXTEND the resolver to parse completed-plan `phases[].tasks[].test_names`
           (plans currently carry status only) and populate the plan record's
           MandatedTests, so a `completed` plan is subject to the SAME success-
           terminal absent-test BLOCK already applied to issues/specs. No change to
           ClassifyStatusDrift is needed — KindPlan+completed already resolves to
           ClassSuccessTerminal, whose absent-test branch blocks.

  THREE CLOSE/RETIRE PATHS COEXIST COHERENTLY (no double-counting, no silent green):
    - delivered_by (ISSUE-043): closed issue -> its own `completed` backing plan.
    - resolved-by (this plan): closed issue fixed elsewhere, no plan, maybe no test.
    - obsoleted + obsoleted-by (this plan): delivered then removed; a RETIRED
      terminal, exempt from the drift broken-promise check.
    delivered_by and resolved-by are BOTH honored ONLY at `closed`; a closed issue
    with NEITHER still runs the full REQ->CLM->tests rigor (no regression).

  FAIL-LOUD (mirroring delivered_by / replaced-by): `obsoleted` without a typed
  `obsoleted-by` is an ERROR; a malformed `obsoleted-by` is an ERROR; an empty /
  blank `resolved-by` is an ERROR; a resolved-by close missing its Resolution
  section is an ERROR. No defect silently satisfies a close/retire.

  ENFORCEMENT-SURFACE NOTES (verified against current source, do NOT trust memory):
    - `isTerminalStatus` (pkg/validate/terminal.go) and the shared
      `validateRetirementFields` are TYPE-AGNOSTIC and called by issue.go, spec.go,
      plan.go. Adding `obsoleted` there covers all three types' terminal-exemption
      AND the obsoleted-by-required rule in one place.
    - Issue + plan status enums are HARDCODED maps in code (issueStatuses in
      issue.go, planStatuses in plan.go) -> `obsoleted` must be added there (load-
      bearing impl). The SPEC status enum is SCHEMA-DRIVEN (spec.go reads
      sch.StatusEnum, populated from artifacts/spec/v1/schema.json status.enum) ->
      the spec enum edit in the schema task is LOAD-BEARING, not documentary. Spec
      needs NO spec.go edit — validateRetirementFields + isTerminalStatus cover it.
    - The drift dimension is native, wired in cmd/backstop/gate.go
      (buildStatusDriftSteps -> computeDriftSurfaces) over pkg/gate primitives
      ResolveArtifactStatus + ClassifyStatusDrift + SplitDriftResult. The mechanism
      edits live in pkg/gate/artifact_status.go; the wiring already sweeps all
      records, so a plan gaining MandatedTests flows through unchanged.

  ARCHITECTURE CONSTRAINT (unchanged from ISSUE-043): the resolved-by helper lives
  in pkg/validate, is STATIC (no os/exec; pure filesystem reads at most), and MUST
  NOT import pkg/gate (pkg/gate consumes validators). resolved-by needs no plan
  lookup at all (no backing-plan requirement), so it is even lighter than
  delivered_by — it reuses the delivered_by close-branch plumbing in
  validateIssueTraceability but requires neither a plan nor a test.

  CLAIMS (this plan's own; ISSUE-048 is `open` and carries none yet):
    CLM-001 The new terminal status `obsoleted` is ACCEPTED by the issue, spec, and
            plan validators (no longer rejected as invalid-status).
    CLM-002 status `obsoleted` REQUIRES a non-empty, TYPED `obsoleted-by`
            (BUNDLE|SPEC|ISSUE|PLAN|DIR-NNN); absent -> fail-loud
            <type>/obsoleted-by-required error; malformed/non-typed -> fail-loud
            <type>/obsoleted-by-malformed error. Mirrors replaced-by, for
            issue/spec/plan.
    CLM-003 `obsoleted` is a TERMINAL status (isTerminalStatus true): an obsoleted
            artifact is exempt from the live-work REQ->CLM->tests / completeness
            rigor, exactly as replaced/canceled/deprecated are.
    CLM-004 A `closed` issue carrying a valid `resolved-by` + a `## Resolution`
            section validates CLEAN WITHOUT its own requirements/claims/verification/
            implementation/contracts arrays, WITHOUT a mandated test, and WITHOUT a
            completed backing plan.
    CLM-005 A `resolved-by` must be a STRUCTURED ref: a typed artifact ref
            (BUNDLE|SPEC|ISSUE|PLAN|DIR-NNN) OR a commit/PR ref (hex SHA
            ^[0-9a-f]{7,40}$ or a PR URL). Empty / blank / non-string / arbitrary
            prose is a fail-loud issue/resolved-by-malformed error. When it is a
            TYPED artifact ref, the referenced artifact FILE must EXIST (static
            sibling-file check) else issue/resolved-by-artifact-not-found; commit/PR
            refs are shape-only (existence not statically checkable).
    CLM-006 A `resolved-by`-closed issue lacking a `## Resolution` section is a
            validation error (issue/resolved-by-resolution-required) — minimum
            standalone content.
    CLM-007 `resolved-by` is honored ONLY at `closed`; a closed issue with NEITHER
            resolved-by NOR delivered_by still requires the full traceability chain
            (no regression); and a closed issue carrying BOTH delivered_by AND
            resolved-by is a fail-loud issue/close-pointer-conflict error (at most
            one close pointer) — no silent precedence, no double-counting.
    CLM-008 The drift classifier ClassifyArtifactStatus maps `obsoleted` to
            ClassRetiredTerminal for every artifact type, so the drift dimension
            EXCLUDES obsoleted artifacts — an obsoleted artifact's absent mandated
            tests do NOT flag as a broken promise.
    CLM-009 ResolveArtifactStatus parses completed-plan `phases[].tasks[].test_names`
            and populates the plan record's MandatedTests, so a `completed` plan
            with an ABSENT task test_name blocks under the success-terminal drift
            check, while one whose task test_names are all PRESENT does not.
    CLM-010 The new vocabulary is documented in the schemas: `obsoleted` +
            `obsoleted-by` in the issue/spec/plan schemas, `resolved-by` in the
            issue schema, and `test_names` as an optional plan-task field.

phases:
  # ═══════════════════════════════════════════════════════════════════════
