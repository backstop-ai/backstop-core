          - pkg/validate/testdata/resolved_by/issues/ISSUE-831-resolved-typedref.issue.md
          - pkg/validate/testdata/resolved_by/issues/ISSUE-838-referenced.issue.md
          - pkg/validate/testdata/resolved_by/issues/ISSUE-832-resolved-prose.issue.md
          - pkg/validate/testdata/resolved_by/issues/ISSUE-833-resolved-missing-ref.issue.md
          - pkg/validate/testdata/resolved_by/issues/ISSUE-834-resolved-no-resolution.issue.md
          - pkg/validate/testdata/resolved_by/issues/ISSUE-835-bare-close.issue.md
          - pkg/validate/testdata/resolved_by/issues/ISSUE-836-both-pointers.issue.md
        claims:
