          `obsoleted-by` validator behavior. Each is a real artifact whose
          frontmatter matches its schema so the ONLY variable under test is the
          obsoleted/obsoleted-by shape.

            - issues/ISSUE-820-obsoleted-valid.issue.md — status: obsoleted,
              obsoleted-by: ISSUE-018 (a typed ref), issue.closed set, NO
              requirements/claims. The happy-path terminal that must validate CLEAN
              once impl lands (CLM-001, CLM-003).
            - issues/ISSUE-821-obsoleted-no-by.issue.md — status: obsoleted, NO
