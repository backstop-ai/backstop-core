            - artifacts/issue/v1/schema.json:
                * add `obsoleted` to the issue.status enum + its description (a
                  retired terminal: delivered then removed with no 1:1 successor,
                  requires obsoleted-by);
                * add an optional top-level `obsoleted-by` property (pattern
                  ^(BUNDLE|SPEC|ISSUE|PLAN|DIR)-[0-9]{3}$, description mirroring
                  replaced-by but for removal-without-successor);
                * add an optional top-level `resolved-by` property (description: a
                  closed issue fixed directly with no plan; a valid resolved-by +
                  Resolution section satisfies close-requires-traceability without
                  own REQ/CLM or a mandated test — lighter than delivered_by, needs
                  no completed plan);
                * update the closed-requires-traceability enforcement note to name
                  resolved-by as a second relaxation alongside delivered_by.
            - artifacts/spec/v1/schema.json: add `obsoleted` to the status enum
              (LOAD-BEARING) + description; add an optional `obsoleted-by` property.
            - artifacts/plan/v1/schema.json: add `obsoleted` to the metadata.status
              enum + description; add `obsoleted-by` to metadata.optional with its
              property; add `test_names` to the plan-task shape as an optional task
              key (documentary — the drift resolver reads it), with a description
