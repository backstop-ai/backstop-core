      - id: TASK-008
        type: implementation
        title: "Implement pack number resolution"
        description: |
          Implement ResolvePackNumber in pkg/pack/number.go.

          ResolvePackNumber(language string, projectRoot string) (int, error):
            1. Compute dir path: filepath.Join(projectRoot, "standards", language)
            2. If dir does not exist: return 1, nil
            3. List files matching STD-<LANG>-<NNN>-*.standard.md pattern
               where <LANG> is strings.ToUpper(language)
            4. Extract 3-digit numbers from matching filenames via regex
            5. Find max number among all matches
            6. Return max + 1, nil
            7. If no matches found: return 1, nil

          Edge cases:
            - Directory exists but empty: returns 1
            - Files with non-matching names are ignored
            - Only counts files for the requested language prefix
        files:
          - pkg/pack/number.go
        claims:
          - CLM-025
          - CLM-026
          - CLM-027
          - CLM-028
        depends_on:
