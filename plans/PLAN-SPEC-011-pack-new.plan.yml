              standards/<language>/ within the temp project dir. Used by number
              resolution and conflict tests.
            - seedRecipeDir(t *testing.T, root, language, slug string) — creates
              recipes/<language>/<slug>/ directory within the temp project dir.
              Used by code pack conflict tests.

          These helpers reduce boilerplate across 42 claim tests.
