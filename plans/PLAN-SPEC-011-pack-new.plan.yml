      - id: TASK-016
        type: implementation
        title: "Implement Cobra command adapter"
        description: |
          Implement NewPackNewCommand in cmd/backstop/pack_new.go.

          NewPackNewCommand() *cobra.Command:
            1. Create cobra.Command with Use: "new", Short description
            2. Register flags: --type (string, required), --language (string,
               required), --slug (string, required), --json (bool)
            3. RunE function:
               a. Read --type flag; if empty return usage error (exit 2)
               b. Validate type against pack.ValidPackTypes; if invalid return
                  validation error (exit 2)
               c. Read --language flag; if empty return usage error (exit 2)
               d. Validate language via pack.ValidateLanguage; if invalid return
                  error (exit 2)
               e. Read --slug flag; if empty return usage error (exit 2)
               f. Validate slug via pack.ValidateSlug; if invalid return error
                  (exit 2)
               g. For rule packs: resolve number via pack.ResolvePackNumber
               h. Build pack.ScaffoldOptions with all fields
               i. Call pack.ScaffoldPack(opts)
               j. If error (including conflict): return error (exit 2)
               k. Format output: if --json, marshal ScaffoldResult as JSON;
                  otherwise print human-readable output
               l. Return nil (exit 0)

          The command function is a thin adapter: no scaffolding logic, no
          template rendering, no directory creation. All logic delegated to
          pkg/pack/.

          Exit code mapping uses cobra SilenceErrors + a wrapper that maps
          errors to exit code 2 (consistent with SPEC-005 conventions).
        files:
          - cmd/backstop/pack_new.go
        claims:
