notes: |
  Implements backstop pack new command for scaffolding rule packs (--type rule)
  and code packs (--type code). Logic lives in pkg/pack/ (new package), with a
  thin Cobra adapter in cmd/backstop/pack_new.go.

  pkg/pack/ does not exist yet. cmd/backstop/ has only a .gitkeep placeholder.
  pkg/scaffold/ does not exist (slug validation lives in pkg/pack/).

  Dependency: SPEC-005 (CLI foundation) provides Cobra skeleton, output layer,
  and exit code conventions. The command integrates with that foundation.

  Structure maximizes parallelism via disjoint file sets:
    - Phase 2 has two parallel task pairs: language validation (number.go) and
      type+slug validation (scaffold.go)
    - Phase 3 has two parallel task pairs: number resolution (number.go) and
      rule pack scaffolding (scaffold.go)
    - Phase 4 is sequential: code pack + conflict + output (scaffold.go)
    - Phase 5 is sequential: Cobra command adapter (pack_new.go)
    - Phase 6: comprehensive verification

