        type: implementation
        title: "Implement rule pack scaffolding"
        description: |
          Implement rule pack scaffolding within ScaffoldPack in pkg/pack/scaffold.go.

          ScaffoldPack(opts ScaffoldOptions) (*ScaffoldResult, error):
            For type == "rule":
            1. Compute lang prefix: strings.ToUpper(opts.Language)
            2. Compute filename: fmt.Sprintf("STD-%s-%03d-%s.standard.md",
               langPrefix, opts.Number, opts.Slug)
            3. Compute dir: filepath.Join(opts.ProjectRoot, "standards", opts.Language)
            4. Create dir with os.MkdirAll
            5. Compute full path: filepath.Join(dir, filename)
            6. If path exists: return error identifying conflicting path
            7. Render frontmatter YAML:
               - title: derived from slug (capitalize, replace hyphens with spaces)
               - number: STD-<LANG>-<NNN>
               - created: today's date (time.Now().Format("2006-01-02"))
               - status: active
               - schema_version: standard/v1
               - language: opts.Language
               - pack: opts.Language
               - scope: language
               - rules: array with one template rule entry containing id, name,
                 category, severity, description, compliance_tier, and detection
                 block placeholder fields
            8. Write file
            9. Return ScaffoldResult with path, pack ID, type, language, slug

          Uses text/template or fmt for rendering. Does NOT call
          ResolvePackNumber — the caller (command adapter) resolves the number
          and passes it in opts.Number.
        files:
