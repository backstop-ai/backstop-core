            * cmd/backstop/pack_gate_errors_test.go — 4 direct calls.
            * cmd/backstop/pack_gate_helpers_test.go — 4 direct calls.
            * cmd/backstop/pack_gate_gotoolchain_test.go — 6 direct calls
              (the existing TestGoToolchain_BuildTestArgShapingScopeKindAware
              project-wide assertion must still hold — pass full-scope sentinel).
            * cmd/backstop/pack_gate_test.go — 7 direct calls.
            * cmd/backstop/code_check_test.go — 4 `dispatchPackEnginesFn = func(
