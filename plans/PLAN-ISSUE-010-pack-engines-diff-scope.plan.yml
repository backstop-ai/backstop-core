  # Phase 1: TDD Red — Failing Tests for Diff-Scoped Findings Engines
  # ═══════════════════════════════════════════════════════════════════════
  - id: phase-1
    name: "Phase 1: TDD Red — Failing Tests for Diff-Scoped Rule-Fed Findings Engines"
    tasks:
      - id: TASK-001
        type: test
        title: "Write failing tests pinning runFindingsEngine/dispatchPackEngines scope behavior"
        description: |
          Add failing tests to a new cmd/backstop/pack_gate_scope_test.go that
          drive dispatchPackEngines for a rule-fed findings engine (semgrep- or
          ast-grep-shaped binding, ScopeKindFileArgs) through the existing
          fixtureRunner (cmd/backstop/pack_gate_gotoolchain_test.go) so each
          assertion inspects fixtureRunner.calls to see the exact scan targets
          the engine was invoked with. These tests fail today because
          dispatchPackEngines has no scope parameter and runFindingsEngine
          unconditionally appends projectRoot (pack_gate.go ~289-290).

          The tests must reference the NEW scoped signature of
          dispatchPackEngines (the threaded changed-file scope) so the package
          does not compile until Phase 2 lands the parameter — this is the red
          state, intentional.

          Mandated test names (exact):

            - TestPackEngines_DiffScope_FindingsEngineScansChangedFilesOnly
              (CLM-001): a rule-fed findings engine dispatched with a diff scope
              whose Files = {changed_a.go, changed_b.go}. Assert the recorded
              invocation's trailing scan targets are EXACTLY the in-scope changed
              files (changed_a.go, changed_b.go) and DO NOT include projectRoot.

            - TestPackEngines_DiffScope_ExcludesUntouchedFileViolations
              (CLM-002): wire the fixtureRunner to emit SARIF findings for both an
              in-scope changed file and an untouched out-of-scope file. With a
              diff scope limited to the changed file, assert the engine is only
              pointed at the changed file (so the untouched-file finding can never
              be produced) — pinning that the 245-violations-from-untouched-files
              regression cannot recur.

            - TestPackEngines_DiffScope_EmptyIntersectionScansNothing (CLM-003):
              diff scope is non-empty but NONE of its files are targets for the
              engine (e.g. scope = {README.md} against a Go-only rule set, or an
              explicitly empty resolved target set). Assert the engine is NOT
              invoked against projectRoot and yields ZERO findings — there must be
              NO whole-repo fallback. This is the no-vacuous-green inverse: narrow
              correctly, but never silently widen back to the whole repo.

            - TestPackEngines_AllScope_RestoresWholeRepoScan (CLM-004): with scope
              == nil AND separately with scope.Mode == GateScopeModeAll, assert the
              engine's scan target is projectRoot exactly as today (the explicit
              --all whole-repo escape hatch is preserved).

            - TestPackEngines_ProjectWideToolchainStaysProjectWide (CLM-005):
              dispatch a ScopeKindProjectWide engine with a ProjectTarget (e.g.
              go-build ./... / golangci ./...) under a NARROW diff scope. Assert
              its scan target remains ProjectTarget ("./...") and that projectRoot
              / the changed-file list is NOT appended — the project-wide branch is
              untouched by scoping, so unchanged-file breakage still fails.

            - TestPackEngines_DiffScope_IncludesUntrackedChangedFiles (CLM-007): a
              diff scope whose Files contains an untracked changed file (mirroring
              resolveGateScopeDiff's untracked inclusion). Assert that untracked
              changed file appears in the engine's scan targets, so a brand-new
              file's findings are still enforced.

          Use the existing fixtureRunner and stubSandboxedRunStdout helpers; do
          not stand up live semgrep/ast-grep. Keep fixtures Go-shaped so the
          rule-fed binding under test is unambiguous.

