plan_id: PLAN-ISSUE-010
spec_id: ISSUE-010
created: "2026-06-20"
status: draft
target_repo: backstop-core
target_module: github.com/bmanson/backstop-core
test_command: "go test ./cmd/backstop/... -run \"TestPackEngines|TestGate\" -race -coverprofile=cover.out"
coverage_threshold: 90

notes: |
  Implements ISSUE-010 — the gate's `pack_engines` step is not diff-scoped, so
  rule-fed findings engines (semgrep, ast-grep) scan the WHOLE repository on
  every run. A 15-changed-file gate run returns 245 violations across ~20
  untouched files, permanently red-locking `gate-on-implement` against a
  pre-existing repo-wide backlog. This directly blocks PLAN-SPEC-034 (native
  toolchain engine cutover), but this plan is scoped to the diff-scope fix ONLY.

  ── ROOT CAUSE (verified against the code) ─────────────────────────────────
  `runFindingsEngine` (cmd/backstop/pack_gate.go ~272) shapes its scan target in
  the scope-kind arg-shaping block (~287-291):

      if binding.ScopeKind == engine.ScopeKindProjectWide && binding.ProjectTarget != "" {
          cmdArgs = append(cmdArgs, binding.ProjectTarget)   // go build ./..., golangci-lint run ./...
      } else {
          cmdArgs = append(cmdArgs, projectRoot)             // ← rule-fed engines scan the WHOLE repo
      }

  The `else` branch fires for ScopeKindFileArgs rule-fed engines (semgrep
  --config X <root>, ast-grep scan --rule DIR <root>) and unconditionally
  appends `projectRoot`. The gate already computed a changed-file scope, but
  `dispatchPackEngines` (~130) has no scope parameter in its signature, so the
  changed-file list never reaches this branch.

  ── REAL CALL CHAIN THE FIX THREADS SCOPE THROUGH ──────────────────────────
    runGate (gate.go:91)               computes scope := ComputeGateScope(...)
      → buildGateSteps(projectRoot, scope)  (gate.go:99 / 282; activeScope)
        → packValidatorStep closure         (gate.go:391-416)
          → dispatchPackEngines(dispatchPacks, packDir, projectRoot, runner)  (gate.go:398)
            → runFindingsEngine(... binding, rules, runner)                   (pack_gate.go:168)
              → else-branch append(cmdArgs, projectRoot)                      (pack_gate.go:289-290)

  scope.Files (gate/scope.go GateScope) is the same diff-scoped, untracked-
  inclusive changed-file list code_check consumes (resolveGateScopeDiff appends
  `git ls-files --others --exclude-standard`). It is available at the
  packValidatorStep call site via the captured activeScope; threading it is the
  whole fix.

  ── THE FIX (design intent — verify exact seams against the code) ──────────
    1. Add a scope parameter to dispatchPackEngines and runFindingsEngine
       carrying the gate's changed-file list + mode (the GateScope, or the
       {mode, files} it needs). The packValidatorStep closure passes activeScope.
    2. In runFindingsEngine's `else` branch (rule-fed ScopeKindFileArgs
       engines): when a diff/file scope is present, append the IN-SCOPE changed
       files as scan targets instead of projectRoot. The in-scope set is the
       intersection of scope.Files with the files the engine actually applies to
       — at minimum, pass scope.Files as the targets so semgrep/ast-grep scan
       only changed files (they self-filter by file type / rule language).
    3. FULL-SWEEP fallback: when scope is nil OR scope.Mode == GateScopeModeAll,
       preserve the current behavior — append projectRoot (the explicit
       whole-repo escape hatch via `gate --all`).
    4. PROJECT-WIDE toolchain passes (the `if` branch:
       ScopeKindProjectWide && ProjectTarget != "" — go build ./..., go test
       ./..., golangci-lint run ./...) STAY project-wide and UNCHANGED. Per
       Ratified Design Constraint 3, a change to a.go that breaks unchanged b.go
       must still fail the gate. Do NOT file-scope these.
    5. EMPTY-INTERSECTION (Sharp Edge): when NONE of the changed files are
       targets for a rule-fed engine (diff scope present but the resulting target
       list is empty), the engine scans NOTHING and yields zero findings — it
       must NOT silently fall back to scanning the whole repo. The full-repo scan
       is reachable ONLY via --all / GateScopeModeAll, never as a default for an
       empty target set.

  ── NO-VACUOUS-GREEN GUARDRAIL (strangler principle) ───────────────────────
  Narrowing scope must NOT silently drop real in-scope findings. The tests pin
  that an in-scope changed file with a real violation is still reported, while
  identical violations on untouched files are excluded. The project-wide
  toolchain branch keeps its full-repo reach so unchanged-file breakage still
  fails the gate.

  ── SIGNATURE BLAST RADIUS (integration-gap accounting) ────────────────────
  Changing dispatchPackEngines's SIGNATURE (new scope param) radiates across the
  whole cmd/backstop package — every caller and every test that overrides the
  `dispatchPackEnginesFn` seam (or mirrors its type) must update its arity or the
  package will NOT compile. The plan's file scope MUST include them. Enumerated
  from the code (`grep -rln "dispatchPackEngines" cmd/backstop`), the forced
  surface is:

    Production (won't compile until updated) — in TASK-002:
      • cmd/backstop/code_check.go — holds the seam `dispatchPackEnginesFn =
        dispatchPackEngines` (~line 18) and a call (~line 140) under a deliberate
        "always full scope" comment (~line 132). When the signature changes, both
        the seam's inferred type and the call must update. See the code_check
        full-scope DECISION below.

    Test files that CALL dispatchPackEngines directly (arity update) — in TASK-001:
      • cmd/backstop/dispatch_engines_test.go
      • cmd/backstop/bridge_test.go
      • cmd/backstop/pack_gate_errors_test.go
      • cmd/backstop/pack_gate_helpers_test.go
      • cmd/backstop/pack_gate_gotoolchain_test.go
      • cmd/backstop/pack_gate_test.go

    Test files that OVERRIDE the dispatchPackEnginesFn seam / mirror its type
    (the func-literal override OR the stubCodeCheckFns helper's `dispatch
    func(...)` param type must match the new signature) — in TASK-001:
      • cmd/backstop/code_check_test.go
      • cmd/backstop/code_check_errors_test.go

    Reference-only — NOT in scope (string/source-inspection, no typed call, no
    arity change): cmd/backstop/gate_buildsteps_test.go,
    cmd/backstop/dogfood_enforcement_test.go.

  ── code_check FULL-SCOPE DECISION (state explicitly so it is not narrowed) ──
  `backstop code check` MUST KEEP its "always full scope" pack-engine behavior
  (code_check.go comment ~line 132). It is intentionally NOT diff-scoped: it
  passes the explicit full-scope sentinel (nil scope, equivalently
  GateScopeModeAll) for the new scope param, which the runFindingsEngine design
  already maps to the projectRoot whole-repo fallback (CLM-004). ONLY the gate's
  pack_engines step passes activeScope (a real diff scope). The implementer must
  NOT accidentally narrow code_check's scope when updating its call site — the
  call gains the sentinel argument and otherwise behaves identically. (CLM-008)

  ── SCOPE GUARDS ───────────────────────────────────────────────────────────
  File scope stays tight: cmd/backstop/pack_gate.go (signature + else branch),
  cmd/backstop/gate.go (thread activeScope into packValidatorStep),
  cmd/backstop/code_check.go (seam + full-scope sentinel call), and the
  enumerated test files (arity updates only). Do NOT broaden beyond what the
  signature change forces. Do NOT touch pkg/gate project-wide-violation
  semantics (filterViolations / ProjectWide) beyond what threading scope
  requires; that exemption already exists, and the project-wide engine branch and
  runSandboxEngine are unchanged.

  ── REQUIREMENTS / CLAIMS (plan-local, derived from the issue) ─────────────
    REQ-001: The pack_engines gate step must scope rule-fed findings engines to
             the gate's changed-file diff scope.
      CLM-001  diff-scoped rule-fed findings engine scans only the changed files
               (in-scope targets), not projectRoot.
      CLM-002  violations on untouched files outside the diff scope are excluded.
      CLM-003  empty-intersection (no changed file is a target) scans nothing —
               zero findings, NO whole-repo fallback.
      CLM-004  `gate --all` (GateScopeModeAll) / nil scope restores the
               whole-repo scan (projectRoot) — the explicit escape hatch.
      CLM-005  the project-wide toolchain branch stays project-wide
               (./...): unchanged-file breakage still fails the gate.
      CLM-006  the changed-file scope is threaded end-to-end from the
               packValidatorStep call site through dispatchPackEngines into
               runFindingsEngine (gate-wiring integration).
      CLM-007  in-scope changed files include untracked files (parity with the
               gate diff resolver), so a brand-new file's findings are reported.
      CLM-008  `backstop code check` keeps its full-scope pack-engine behavior:
               it passes the full-scope sentinel (nil / GateScopeModeAll) for the
               new scope param and is intentionally NOT diff-scoped; the signature
               change updates its call site and every dispatchPackEngines caller /
               seam override in cmd/backstop so the package still compiles.

  Structure:
    Phase 1: TDD red — failing unit tests pinning runFindingsEngine /
             dispatchPackEngines scope behavior (diff-only, exclusion,
             empty-intersection, --all fallback, project-wide unchanged).
    Phase 2: TDD green — thread scope through dispatchPackEngines +
             runFindingsEngine; scope-aware else branch.
    Phase 3: TDD red+green — gate-wiring: packValidatorStep passes activeScope;
             integration test that a diff-scoped gate excludes untouched-file
             pack findings (untracked included).
    Phase 4: Comprehensive verification — full gate kill chain.

