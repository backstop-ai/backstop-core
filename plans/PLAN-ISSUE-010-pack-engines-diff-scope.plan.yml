        title: "Thread the gate diff scope through dispatchPackEngines into runFindingsEngine"
        description: |
          Make the Phase 1 tests pass with the minimum diff-scope fix in
          cmd/backstop/pack_gate.go. Realize the design intent in the notes;
          verify the exact seams against the code before editing.

          1. dispatchPackEngines (~130): add a scope parameter carrying the
             gate's changed-file list and mode — pass the *gate.GateScope (or the
             {mode, files} it needs) through. Forward it to every runFindingsEngine
             call (~168). Leave the runSandboxEngine branch's signature as-is
             unless a target-shaping change is required (it walks projectRoot for
             single-file scope and is NOT a rule-fed findings engine — out of
             scope for this fix; do not file-scope it here).

          2. runFindingsEngine (~272): replace the scope-kind arg-shaping `else`
             branch (~289-290 `append(cmdArgs, projectRoot)`) so that:
               - if binding.ScopeKind == ScopeKindProjectWide && ProjectTarget !=
                 "" → UNCHANGED: append ProjectTarget (CLM-005).
               - else (rule-fed ScopeKindFileArgs / config-file with no target):
                   * if scope is nil OR scope.Mode == GateScopeModeAll → append
                     projectRoot (whole-repo escape hatch, CLM-004).
                   * else → compute the in-scope target list from scope.Files
                     (the changed files, untracked included; project-relative as
                     they arrive from the gate scope) and append those targets
                     instead of projectRoot (CLM-001/CLM-007). When the resulting
                     target list is EMPTY, append NOTHING and let the engine scan
                     nothing — do NOT fall back to projectRoot (CLM-003).

          3. Preserve everything downstream unchanged: the runner.RunStdout call,
             the convert step, ParsePackFindings, the CrashGuard guard, and the
             namespaced-violation mapping. Targets are appended after `inputs`,
             exactly where projectRoot is appended today.

          4. cmd/backstop/code_check.go — the SIGNATURE CHANGE forces this
             production file to update or the package will not compile. It holds
             the seam `dispatchPackEnginesFn = dispatchPackEngines` (~line 18) and
             a call (~line 140) under a deliberate "always full scope" comment
             (~line 132). DECISION (CLM-008): `backstop code check` MUST KEEP its
             full-scope pack-engine behavior — it is intentionally NOT diff-scoped.
             Update the call to pass the FULL-SCOPE SENTINEL (nil scope, or an
             explicit GateScopeModeAll scope) for the new param, which the
             runFindingsEngine design maps to the projectRoot whole-repo fallback
             (CLM-004). Do NOT narrow code_check to a diff scope; the seam's
             inferred type updates with the signature and the call gains only the
             sentinel argument — behavior is otherwise identical. Keep the
             "always full scope" comment accurate.

          Do NOT alter pkg/gate filterViolations / ProjectWide semantics, the
          project-wide engine branch, or runSandboxEngine's projectRoot walk.

          The implementer runs `backstop code check` after this task per the
          implementer contract; this plan does not duplicate that per-task check.
