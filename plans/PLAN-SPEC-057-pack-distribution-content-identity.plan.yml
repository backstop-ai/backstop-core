      - id: TASK-005
        type: implementation
        title: "Apply the same predicate inside copyDirRecursive's walk"
        description: |
          Edit pkg/pack/distribution/add.go ONLY, and only inside
          copyDirRecursive (add.go:222-247). It already computes `rel` before
          its IsDir branch, so this is an insert with no reorder — but it
          does NOT normalize to slashes today, so the call must:

            rel, relErr := filepath.Rel(src, path)
            if relErr != nil {
                return relErr
            }
            if isRootRepositoryMetadata(filepath.ToSlash(rel)) {
                if info.IsDir() {
                    return filepath.SkipDir
                }
                return nil
            }
            target := filepath.Join(dst, rel)
            // ...unchanged...

          CONSUME the predicate TASK-002 added to hash.go. Do not re-declare
          it, do not inline an equivalent comparison, do not add a `.git`
          literal to this file — add.go already has one at line 109 (the
          `https://github.com/…​.git` URL suffix) and that is the only one it
          is allowed to have.

          SkipDir for the directory shape only, nil otherwise — same
          reasoning as TASK-002: SkipDir on a non-directory abandons the
          remaining siblings and silently truncates the copy.

          DO NOT TOUCH ANY CALL SITE. All seven inherit this. Specifically,
          and deliberately:
            * command.go:466 and command.go:477 — install's rollback snapshot
              and restore — walk .backstop/packs/, where a pack's metadata
              sits at `<org>/<name>/.git`, three segments deep and NOT equal
              to ".git". They correctly keep copying it, so a rollback
              restores exactly what it snapshotted. Do NOT "fix" this.
            * command.go:48 (RunValidationOnScratchCopy) now validates a
              `.git`-free tree. BENIGN and pre-checked: pkg/packval has no
              `.git` reference in any non-test file. Do not restore the
              metadata for it.
            * command.go:554 and command.go:988 are fed by an ExecGitCloner
              clone whose root `.git` was already stripped, so they have
              nothing left to exclude — EXCEPT command.go:554's
              opts.CachePath branch (command.go:509-513), which reads a
              pre-populated cache no cloner touched. That branch is exactly
              why the exclusion belongs at the copy rather than being trusted
              to the clone.

          NO signature change, NO new exported symbol, NO new diagnostic. Run
          TASK-004's five tests; all green.
        files:
