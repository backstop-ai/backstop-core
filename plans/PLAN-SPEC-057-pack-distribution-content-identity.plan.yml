  # ═══════════════════════════════════════════════════════════════════════
  # Phase 2: The copy boundary — REQ-002, the same predicate, second walk
  # ═══════════════════════════════════════════════════════════════════════
  - id: phase-2
    name: "Phase 2: The copy boundary — no installed pack carries root metadata (REQ-002)"
    tasks:
      - id: TASK-004
        type: test
        title: "Write the five lifecycle tests for the copy boundary and local hash convergence"
        description: |
          Create pkg/pack/distribution/add_metadata_test.go, `package
          distribution_test`, with these five mandated names verbatim:

            TestAddCommand_Run_LocalSourceRootGitNotInstalled         (CLM-011)
            TestAddCommand_Run_LocalSourceHashMatchesMetadataFreeCopy (CLM-012)
            TestAddCommand_Run_LocalSourceNestedGitStillInstalled     (CLM-013)
            TestInstallCommand_Run_LocalSourceGitChurnStillVerifies   (CLM-014)
            TestRelock_LocalPackReproducesAddTimeHash                 (CLM-015)

          TDD RED PHASE. Write, run, confirm all five red before TASK-005.

          Drive these through the COMMAND CONSTRUCTORS, not free functions —
          `distribution.Add/Install/Update/Upgrade` were DELETED by SPEC-055
          and the commands exist only via New*Command constructors that error
          on any nil dependency (command.go). Read the existing add_test.go /
          install_test.go / relock_test.go setup helpers and REUSE them
          rather than inventing a second harness.

          Fixture shape, per test:

            * CLM-011 — a local pack source directory with a valid pack.yml
              AND a real root `.git/` holding files. Run the add, then assert
              os.Stat(.backstop/packs/<name>/.git) is IsNotExist. ALSO assert
              the authored files ARE present, so a copy that dropped
              everything cannot pass.
            * CLM-012 — build TWO byte-identical local sources from the same
              file map, give one a root `.git/` and the other none, add each
              in a SEPARATE project directory (an add refuses an
              already-installed pack), and assert the two recorded lock
              content_hash values are EQUAL. Assert they are also non-empty;
              two empty strings are equal.
            * CLM-013 — a local source with `rules/.git/` (nested, NOT root)
              holding a file. Assert the installed tree still contains
              .backstop/packs/<name>/rules/.git/<file> with content intact.
              This PINS the residual root-relativity buys; it is not a bug
              (spec Review Question 3).
            * CLM-014 — add a local pack whose source carries a root `.git/`,
              then MUTATE that `.git/` after the add (write a new file into
              it, change an existing one — standing in for reflog churn),
              then run install and assert it SUCCEEDS. materializeLocalPack
              hashes the SOURCE directory (install.go:78), so this is the
              test proving the HASH boundary — not just the copy boundary —
              reaches the local install path. The lock entry needs a
              `local_path` for install to materialize it: set the fixture up
              so the add records one, or pass InstallOptions.LocalPackDir. A
              run erroring with "no recorded source path" proves nothing and
              is a fixture bug, not a code bug.
            * CLM-015 — add a local pack with a root `.git/` source, capture
              the recorded hash, then run Relock against the INSTALLED
              directory and assert the returned ContentHash EQUALS the
              add-time hash. Note relock takes a filesystem PATH containing a
              pack.yml, not a pack name (relock.go:29, the ISSUE-074 residual
              this plan does not touch) — pass .backstop/packs/<name>.

          Every `.git` fixture is built with os.MkdirAll and os.WriteFile so
          it is a real directory with real bytes. A test whose "source
          repository" is an EMPTY directory named `.git` passes whether or
          not the exclusion works, because an empty directory contributes no
          manifest entries either way.

          This task must NOT depend on TASK-002 — it is a test task and TDD
          ordering forbids it. It may be written in parallel with TASK-001
          and TASK-007; the three file scopes are disjoint.
        files:
          - pkg/pack/distribution/add_metadata_test.go
        claims:
          - CLM-011
          - CLM-012
          - CLM-013
          - CLM-014
          - CLM-015
        test_names:
