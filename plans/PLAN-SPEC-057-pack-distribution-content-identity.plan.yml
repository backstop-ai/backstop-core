  - id: phase-3
    name: "Phase 3: Local/remote convergence end to end, and the in-repo lock reconciliation this plan owes"
    tasks:
      - id: TASK-007
        type: test
        title: "Add the local/remote hash convergence E2E test beside the existing round trip"
        description: |
          Extend cmd/backstop/pack_remote_e2e_test.go with ONE new test:

            TestE2E_PackAdd_LocalAndRemoteHashesConverge   (CLM-016)

          CLM-017's mandated test,
          TestE2E_PackAddThenInstall_RoundTripHashesMatch, ALREADY EXISTS in
          this file at line 191 (delivered by SPEC-055 as its CLM-065).
          SPEC-057 re-cites it deliberately, because REQ-002's convergence
          clause is meaningless without naming the remote baseline the local
          half must meet. DO NOT rewrite it, rename it, or duplicate it —
          this task asserts it still passes UNCHANGED and adds the local
          counterpart next to it.

          THE FIXTURE MUST BE ONE PACK, TWO DELIVERY PATHS (spec Review
          Question 6). Use testdata/hermetic-remote/valid-pack as the single
          authored source for BOTH sides, so a failure means the algorithms
          diverged and never that the two fixtures were never the same pack:

            * REMOTE side — remoteE2ESetup(t, validPackFixture, "v1.0.0")
              builds a hermetic repository from that fixture, redirects the
              production URL at it, and returns the coordinate plus a fresh
              consumer project. Run `pack add <name>@1.0.0` there and read
              the recorded hash with remoteE2ELockEntry.
            * LOCAL side — copy the SAME testdata/hermetic-remote/valid-pack
              tree into a t.TempDir(), give the copy a real root `.git/` with
              files in it, and run `pack add <that path>` in a SEPARATE
              consumer project (newConsumerProject). Read its recorded hash
              the same way.

          Assert the two hashes are EQUAL and non-empty.

          THE LOCAL `.git` IS LOAD-BEARING. Without it the test proves only
          that two copies of the same files hash the same, which was true
          before this spec and would pass on an unmodified tree.

          The remote clone arrives already `.git`-stripped by ExecGitCloner
          (SPEC-055 CLM-101/CLM-102), so the equality holds only if the local
          path now computes the same function of the same authored bytes.
          That is the whole claim.

          HERMETICITY IS NOT OPTIONAL. Go through remoteE2ESetup, which
          PROVES the GIT_CONFIG_GLOBAL insteadOf redirect actually reaches
          the child process. A hand-rolled remote silently sends the child to
          github.com and the suite becomes network-dependent with nothing
          turning red.

          This is a test task and must not depend on any implementation task.
          Its file scope is disjoint from TASK-001's and TASK-004's, so all
          three may be written in parallel.
        files:
          - cmd/backstop/pack_remote_e2e_test.go
        claims:
          - CLM-016
          - CLM-017
        test_names:
          - TestE2E_PackAdd_LocalAndRemoteHashesConverge
          - TestE2E_PackAddThenInstall_RoundTripHashesMatch
        depends_on: []

      - id: TASK-008
        type: implementation
        title: "Relock the three .git-contaminated local entries in this repository's backstop.lock"
        description: |
          THE SPEC'S STATED OBLIGATION, not a follow-up. Landing phases 1 and
          2 moves three of this repository's own lock hashes, and nothing
          warns about it.

          REBUILD FIRST — relock recomputes through the NEW
          ComputeContentHash, and a stale binary would rewrite the lock with
          the OLD contaminated values, which is strictly worse than not
          relocking at all:

            go build -o bin/backstop ./cmd/backstop

          RE-MEASURE BEFORE AND AFTER. The spec says re-measure rather than
          trust a number, and it is right — a review pass first counted one
          entry; the real count is three. Run:

            ./bin/backstop pack list

          and record the LOCK STATUS column. Expect exactly THREE entries
          reading `stale` — backstop/self, backstop/go-standards,
          backstop/go-toolchain — with the other three (backstop/contracts,
          backstop/substantiveness, backstop-ai/cobra-cli-standards) still
          current/locked. Any other set means re-measure and REPORT; do not
          proceed on the plan's numbers over the tool's.

          Then relock exactly those three. `pack relock` takes a filesystem
          PATH to a directory containing a pack.yml (the ISSUE-074 residual
          this plan does not touch) and recomputes over the INSTALLED
          directory, so point it at the installed trees:

            ./bin/backstop pack relock .backstop/packs/backstop/self
            ./bin/backstop pack relock .backstop/packs/backstop/go-standards
            ./bin/backstop pack relock .backstop/packs/backstop/go-toolchain

          EXPECTED RESULTS, measured 2026-07-27 as a cross-check — report any
          disagreement rather than forcing the file to match:

            backstop/self          3eb4324c85cb1be7… → cdb5c64f…
            backstop/go-standards  a3fdd4a2c15b3b23… → bf58849d…
            backstop/go-toolchain  be64300ee7f3b40d… → 7c0486ad…

          RELOCK ALONE IS SUFFICIENT — checked, not assumed. The installed
          copies still physically carry their `.git` (the copy boundary only
          affects FUTURE copies), but relock hashes them through the new
          ComputeContentHash, which prunes it, so the recomputed value IS the
          metadata-free authored hash. DO NOT delete `.git` from
          .backstop/packs/**: it changes no hash, it touches gitignored
          content, and no claim asks for it.

          DO NOT run `./bin/backstop pack install` as a success check. It
          fails in this repository TODAY, before this change, for an
          unrelated pre-existing reason — four local lock entries carry no
          `local_path` and materializeLocalPack (install.go:63-66) refuses
          `backstop/contracts` by name before any hash is computed. Fixing
          that is NOT in scope, and backfilling `local_path` here would be
          scope creep. The plan notes carry the verbatim error.

          backstop.lock is TRACKED. These three hash updates and their
          refreshed install_date fields are part of this phase's commit. The
          file's other three entries must be left byte-identical — a diff
          touching contracts, substantiveness, or cobra-cli-standards means
          relock was pointed at the wrong tree.

          This task writes ONLY backstop.lock. It does not touch backstop.yml,
          any pack source, or anything under .backstop/packs/.
        files:
          - backstop.lock
        claims:
          - CLM-012
          - CLM-015
        depends_on:
          - TASK-007
          - TASK-005

