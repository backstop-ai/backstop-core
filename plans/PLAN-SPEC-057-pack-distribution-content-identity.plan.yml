  ─────────────────────────────────────────────────────────────────────────
  THE HASH WALK NEEDS A REORDER, NOT JUST AN INSERT
  ─────────────────────────────────────────────────────────────────────────
  This is the one non-obvious edit, worth stating precisely because the
  naive insert produces a suite that skips nothing.

  ComputeContentHash (hash.go:17-42) today returns early on directories
  BEFORE it computes `rel`:

      if info.IsDir() { return nil }              // line 24
      rel, relErr := filepath.Rel(dir, path)      // line 28
      rel = filepath.ToSlash(rel)                 // line 33

  The predicate takes `rel`, so `rel` must be computed FIRST and the
  predicate tested BEFORE the IsDir early return. The resulting shape:

      rel, relErr := filepath.Rel(dir, path)
      if relErr != nil { return fmt.Errorf("computing relative path: %w", relErr) }
      rel = filepath.ToSlash(rel)
      if isRootRepositoryMetadata(rel) {
          if info.IsDir() { return filepath.SkipDir }
          return nil
      }
      if info.IsDir() { return nil }
      ...unchanged...

  Insert the predicate AFTER the existing `if info.IsDir() { return nil }`
  instead and a root `.git` DIRECTORY is never tested at all — the walk
  returns nil for it, descends into it, and hashes every object file inside
  under paths like `.git/objects/…`. CLM-001 and CLM-005 red immediately,
  which is the intended safety net, but the failure looks like a predicate
  bug rather than an ordering bug and costs a debugging cycle.

  SkipDir versus nil is load-bearing in the same edit. Returning nil for a
  `.git` DIRECTORY skips the directory entry and descends anyway; only
  filepath.SkipDir prunes the subtree. Returning SkipDir for a `.git` FILE
  or SYMLINK would skip THE REST OF THE PARENT DIRECTORY — every sibling
  after it in walk order silently vanishes from the manifest, a correctness
  defect no claim in this spec would catch.

  copyDirRecursive (add.go:222-247) already computes `rel` before its IsDir
  branch, so it needs the insert without the reorder — but it does NOT
  currently normalize to slashes, so the predicate call must pass
  filepath.ToSlash(rel).

  ─────────────────────────────────────────────────────────────────────────
  ROOT-RELATIVE IS A CONSTRAINT, NOT AN IMPLEMENTATION DETAIL
  ─────────────────────────────────────────────────────────────────────────
  Two of copyDirRecursive's seven call sites are NOT pack-root copies:
  install's rollback snapshot (command.go:466, packsDir → snapshotDir) and
  its restore (command.go:477, back again). Their walk root is
  .backstop/packs/, so a pack's metadata sits at `<org>/<name>/.git` —
  three segments deep, NOT equal to ".git" — and is therefore correctly NOT
  excluded. A rollback restores exactly what it snapshotted.

  "Improving" the predicate to match `.git` at any depth breaks that, and it
  also breaks the point of the spec: the cloner strips exactly ONE path
  (gitcloner.go:258), so a depth-agnostic copy boundary would stop agreeing
  with the clone and the local/remote convergence would be silently lost.
  Exact name equality at the walk's own root. Nothing else.

