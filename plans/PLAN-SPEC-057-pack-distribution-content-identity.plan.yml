  the assertion. Do NOT write a task claiming `pack install` succeeds
  in-repo, and do NOT expand scope to make it succeed — if the reconciliation
  tempts someone to backfill `local_path`, that is a separate issue.

  ★ DOES RELOCK ALONE SUFFICE? YES — CHECKED, NOT ASSUMED ★

  `pack relock <path>` reads the pack NAME from the pack.yml at <path>, then
  recomputes the hash over the INSTALLED directory .backstop/packs/<name>
  (relock.go:54). The installed copies still physically carry their `.git`
  — the copy boundary only affects FUTURE copies — but relock hashes them
  through the NEW ComputeContentHash, which prunes it. The recomputed value
  is therefore exactly the metadata-free authored hash in the table above.
  Relock alone is sufficient; no re-add, no re-install, no cleaning.

  The physical `.git` left inside .backstop/packs/backstop/{self,
  go-standards,go-toolchain} is COSMETIC RESIDUAL after this lands: no code
  path reads it, every hash of it now excludes it, and any future re-add or
  re-install produces a clean tree. DO NOT DELETE IT as part of this plan —
  deleting changes no hash, touches gitignored content the operator may be
  using, and no claim asks for it.

