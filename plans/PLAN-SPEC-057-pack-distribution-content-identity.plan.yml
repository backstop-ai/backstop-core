             no strings.HasSuffix, no strings.Contains, no filepath.Base, no
             depth walk. One equality.

             Document WHY it is root-relative: the cloner strips exactly one
             path (gitcloner.go:258) and this predicate mirrors that scope,
             which is what makes local and remote identity CONVERGE rather
             than merely both change. Note that the walk root itself arrives
             as "." and is therefore never excluded.

          2. THE WALK. Restructure ComputeContentHash's filepath.Walk
