  MECHANISM — WHY CONSUMES CLEARS THE PROBE (read before implementing)
  ════════════════════════════════════════════════════════════════════════════════
  `gate.ExtractContractEntries` (pkg/gate/step_testverify.go) iterates
  `fm.Contracts` and builds one `ContractEntry` per **`provides`** item only. It
  never reads `consumes`. The contract step
  (`buildContractStep` → `produceContractEngineResults` → the installed go-contracts
  pack → `gate.StepContractSignatureScopedFunc` → `gate.VerifyContractVerdict`)
  therefore has NOTHING to probe for a `consumes`-only contract entry: no
  `ContractEntry`, no ast-grep dispatch, no verdict, no violation.

  That is the whole fix. There is no suppression anywhere in that chain — the entry
  simply stops being a machine-probed promise and becomes a declared dependency,
  exactly as `content-topology.yml` and `evidence-inventory.yml` already are.
  `pkg/validate/contracts.go` accepts a consumes-only contract entry
  (`TestContracts_ConsumesOnlyValid`), so the spec still validates.

  The REAL enforcement of these five worlds never lived in the Go probe. It lives in
  `scripts/verify-public-product-model.sh` and its children, which are untouched and
  must still pass — that is what the `consumes` edge now names.

  ════════════════════════════════════════════════════════════════════════════════
