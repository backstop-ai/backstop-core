  CLM-008 — SPEC-073's CONSUMES SURVIVE BECAUSE CONSUMES ARE NEVER RESOLVED AS A
    PROVIDER GRAPH. specs/SPEC-073-documentation-semantics-integration.spec.md lines
    86-94 consume `canonical_product_model` from docs/_data/product-model.yml and
    `legacy_content_disposition_inventory` from docs/_data/content-inventory.yml.
    A repo-wide search for `broken.consume` / `BrokenConsume` finds NOTHING in Go —
    Core validates consumes STRUCTURALLY (`validateConsumesItem`: source, name, kind)
    and never demands a matching `provides` anywhere. So the SPEC-072 conversion
    cannot break SPEC-073, and the test's job is to PROVE that absence of coupling
    rather than assume it.

  CLM-009 — THE FENCE. The only file this plan may modify under `specs/`, `docs/`,
    `scripts/`, `cmd/`, or `.backstop/` outside its own two new test files is
