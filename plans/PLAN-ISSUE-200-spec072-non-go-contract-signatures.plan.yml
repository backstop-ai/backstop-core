  ════════════════════════════════════════════════════════════════════════════════
  SHARP EDGES
  ════════════════════════════════════════════════════════════════════════════════
  1. COST. `./bin/backstop gate --file docs/_data/content-inventory.yml` takes ~8
     minutes. It is spent EXACTLY ONCE, in TASK-005. Every red/green receipt before
     that is bought from `gate.ExtractContractEntries` + `buildContractStep` +
     `gate.VerifyContractVerdict` driven directly in-process, which is the same
     production code path at a fraction of the wall clock.

  2. THE RED MUST BE A REAL PROBE FAILURE, NOT A COMPILE ERROR. The new tests call
     only existing exported/package symbols (`gate.ExtractContractEntries`,
     `gate.ContractEntry`, `gate.GateScope`, `buildContractStep`, `repoRoot(t)`), so
     a build break is a defect in the test file, not this task's RED evidence.

  3. NEVER GREP FOR `sources[]` IN THE YAML. The issue forbids it explicitly. The
     signal is the extracted contract set and the Gate verdict, never raw file bytes
     of docs/_data/content-inventory.yml.

  4. NO VACUOUS GREEN ON AN UNINSTALLED PACK, AND THE CONTROL HAS TWO PRECONDITIONS
     THAT ARE EASY TO GET WRONG. `produceContractEngineResults` yields NO results
     when the contracts pack is not installed, which would make "no violation for
     this symbol" true for the wrong reason. Each probe test must first establish
     that the pack path is live via a control entry — an artificial `provides` over a
     non-Go file — that still produces a `contract_signature` violation through the
     same production call, failing loudly if the pack is unresolvable rather than
     skipping. Two preconditions govern that control:

       (a) `projectRoot` passed to the producer must be the REAL repository root
           (`repoRoot(t)`), never a `t.TempDir()`. Pack resolution goes through
           `resolveContractsPacks(projectRoot)` -> `loadInstalledPacks`, which reads
           `<projectRoot>/backstop.yml`, `<projectRoot>/backstop.lock`, and
           `<projectRoot>/.backstop/packs/`. A temp root resolves no pack, produces
           no results, and the control silently stops controlling anything.

       (b) The control entry's target file must EXIST ON DISK, and the control must
           assert `Scanned == true` on the returned `ContractEngineResult` rather
           than settling for "a violation was raised".

           Read `VerifyContractVerdict` (pkg/gate/contract_verdict.go) before
           writing this: the `!Scanned` LOUD CONFIG ERROR branch lives INSIDE
           `if r.Entry.Absent`. A present contract — `Absent: false`, which is what
           this control is — never reaches it. It falls straight through to
           `if r.Matched`, so an unscanned or missing scope degrades to
           `Matched: false` and returns the ordinary "symbol %s signature not found
           or mismatched in %s: expected %q" violation, BYTE-INDISTINGUISHABLE from
           a genuine scanned miss.

           That is precisely why the file must exist and why `Scanned` is asserted
           DIRECTLY. A raised violation is not evidence the engine ran: point the
           control at a nonexistent path and it still "raises", proving nothing.
           `Scanned: true` on the result is the only field that says ast-grep
           actually opened the file. Do NOT use "the violation is not a config
           error" as the discriminator — for `Absent: false` there is no config-error
           branch to discriminate against.

           Write the synthetic non-Go file into a `t.TempDir()` and pass its
           ABSOLUTE path as `File` (extraction only joins RELATIVE paths onto
           projectRoot, so an absolute path is passed through untouched) while still
           handing the producer the real repo root from (a).

  5. `TestGate_ArchitectureDiagramContractSignatureProbeClearsOnEdit` must exercise
     ALL THREE `.mmd` files, one subtest each. A single-diagram assertion passes
     against a two-of-three conversion.

  6. THE FENCE TEST FENCES COMMITTED SURFACES ONLY, AND NEVER SKIPS.
     `TestArtifact_Spec072ContractConversionContainsNoForbiddenWorkarounds` runs in
     CI where a merge base may be unavailable, so its floor is observable repository
     STATE over TRACKED files: no `# sources[]` comment; no Go file under docs/_data
     or docs/_diagrams; no `@waiver:` marker keyed to `contract_signature`;
     `backstop.yml` still carrying `contract_signature` with `applies-to: new-code`
     and `level: block`; the closed world still 6 sources / 31 units. A merge-base
     `git diff --name-only` check is ADDED when a base resolves, never SUBSTITUTED
     for the state floor and never a reason to skip.

     `.backstop/baseline.json` IS OUT OF BOUNDS FOR THIS TEST. It is gitignored
     (.gitignore line 43), untracked, CI-published, and machine-absolute, and it
     ALREADY carries entries for all five symbols. An assertion that it holds no
     `contract_signature` entry for these files would be false on every checkout
     that has pulled a baseline and vacuously true on every fresh clone that has
     not. Assert nothing about its contents. The only honest baseline statement is a
     DELTA — this change adds no baseline entry and runs no `backstop baseline`
     command — which belongs in the diff fence, not in a content probe.

  7. NO VERIFIER-SCRIPT BYTE PINS. `scripts/verify-public-product-model.sh` and
     everything under `scripts/tests/public-product-model/` are LIVING files that
     other lanes edit. A sha256 pin over them turns an unrelated, legitimate change
     into a red in this lane. TASK-004 already proves them by RUNNING them, which is
     the stronger and more durable statement. Where "unchanged by this lane" needs
     saying, say it with a merge-base `git diff --name-only` filename check that
     degrades to silence when no base resolves.

  8. PLAN-SPEC-072 STAYS `completed` AND ITS `spec_version: "1.0.8"` PIN STAYS PUT —
     BUT THE 1.0.9 ENTRY IS NOT A "CONVERSION BUMPS THE SPEC" PRECEDENT, AND MUST NOT
     BE CITED AS ONE. The git history is explicit: `284a3e5` bumped 1.0.8 -> 1.0.9 and
     authored the 1.0.9 entry for the CAP-004 / JLINK-001 canonical-homepage retarget.
     The ISSUE-053 topology/evidence conversion landed AFTER it in `d13be4d`, which
     left `spec_version` at 1.0.9 and FOLDED two sentences into that already-open
     entry. Both squashed to `main` as `e412f1f`. So ISSUE-053 bumped nothing; it rode
     an in-flight bump.

     The 1.0.10 bump here is therefore required by ISSUE-200 REQ-005 on its own terms
     — a contract edit to an `implemented` spec with no in-flight entry to fold into —
     NOT by an ISSUE-053 precedent. What the 1.0.9 entry DOES establish, and what
     survived both commits verbatim, is the other half: a SPEC-072 amendment does not
     retarget the completed PLAN-SPEC-072 pin. Retargeting it is out of scope.

  9. DO NOT REWRITE THE 1.0.9 HISTORY ENTRY. Add a 1.0.10 entry above it and leave
     1.0.9 verbatim — including the ISSUE-053 sentences `d13be4d` folded into it,
     which are the record of the two-file precedent this change extends.

  10. SEED 4 CLOSED MATRIX IS NOT IMPLICATED. `expectedRole()` in
      scripts/sitecheck/inventory.go returns "" for `specs/**`, `plans/**`,
      `issues/**`, and `cmd/backstop/**`, and `inventoryDiff` skips every path
      outside the matrix. No `.backstop/seed4-delivery-inventory.yml` row is needed
      or permitted here.

  11. TASK-001 and TASK-002 run in PARALLEL into the same Go package (`main` in
      cmd/backstop). Their helper functions must not collide by name. Prefix
      TASK-001's helpers `spec072Probe*` and TASK-002's `spec072Fence*`, and reuse the
      existing `repoRoot(t)` from pack_gate_test.go rather than redefining it.

  12. `./bin/backstop` IS UNTRACKED, IS REMOVED BY `make clean`, AND GOES STALE. Every
      task that spends a `./bin/backstop` receipt must run `make build` (which is just
      `go build -o bin/backstop ./cmd/backstop/`) IMMEDIATELY BEFORE IT, so the gate
      being reported is HEAD and not a binary from a previous branch. Do NOT run `make
      baseline` anywhere in this plan: it is a network call to the CI-published
      artifact and is deliberately not a prerequisite of `test` or `ci` (ISSUE-176).

  13. THE FIVE SYMBOLS ARE ALREADY SEEDED IN `.backstop/baseline.json`, SO A CLEARED
      PROBE SHOWS UP AS `FixedViolations`. Once the conversion lands, the five entries
      stop being raised, and `CompareToBaseline` reclassifies them from seeded to
      FIXED. `FixedViolations` is a report-only field on `StepResult` — it never
      contributes to `Pass` and never fails a step. Expect to SEE them on a `--all`
      run against a pulled baseline, expect them to persist until CI republishes the
      baseline, and do NOT try to make them disappear by editing, regenerating, or
      deleting the gitignored baseline file.

