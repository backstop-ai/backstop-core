  6. THE FENCE TEST MUST BE STATE-BASED, NOT SKIP-PRONE.
     `TestArtifact_Spec072ContractConversionContainsNoForbiddenWorkarounds` runs in
     CI where a merge base may be unavailable. It asserts observable repository
     STATE (no `# sources[]` comment; no Go file under docs/_data or docs/_diagrams;
