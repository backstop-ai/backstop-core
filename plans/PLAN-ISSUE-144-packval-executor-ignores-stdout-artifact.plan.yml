          - TASK-003

      - id: TASK-005
        type: verification
        title: "Validate the plan artifact"
        description: |
          Run `./bin/backstop artifact validate --plan PLAN-ISSUE-144` and read the
          result. This lane modifies an artifact file (this plan) alongside Go source,
          so the final phase must verify BOTH work categories.

          Do NOT flip this plan's `status` or ISSUE-144's `status` as part of
          implementation — plan close-out and issue resolution are separate,
          agent-routed steps (planner close-out and issue-author respectively), and
