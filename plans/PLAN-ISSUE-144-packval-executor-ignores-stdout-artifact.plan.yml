  THE REASON NOTHING DISPATCHES IS FIXTURE ABSENCE, NOT RULE ABSENCE. State it
  precisely, because the obvious-sounding version is wrong: a rule DOES declare that
  engine (`- id: go-coverage` / `engine: go-coverage`, same file). What that rule does
  not have is FIXTURES — `grep -n "fixtures\|positive\|negative"` over
  go-toolchain's pack.yml returns ZERO matches, for every rule in the pack.
  `pkg/packval/phase3.go` only ever reaches `RunEngine` from INSIDE
  `claim.Fixtures.Positive` / `claim.Fixtures.Negative` loops (four call sites, all
  within those loops). No fixture, no dispatch — regardless of how many rules name the
  engine. `phase3.go` applies NO `gate_type` filter when resolving a rule's engine to a
  binding, so a coverage-typed engine is dispatched exactly like a findings one once a
  fixture exists.

  THIS CONDITION IS FRAGILE, WHICH STRENGTHENS THE CASE FOR FIXING IT NOW — BUT STATE
  THE TRIGGER PRECISELY, BECAUSE THE OBVIOUS-SOUNDING VERSION IS WRONG. A fixture ALONE
  is not sufficient. Verified 2026-08-17 by reading `pkg/packval/phase3.go`: the two
  fixture dispatch sites inside the `claim.Fixtures.Positive` / `claim.Fixtures.Negative`
  loops are BOTH additionally guarded by `ruleSource != ""` (from
  `rule.RuleSourcePath()`), and the two remaining `RunEngine` call sites are reached
  only from the `pack.ToolConfig` loop. So dispatch of a `stdout_artifact`-declaring
  engine requires a fixture AND either a rule source path (`rule_path`, or its
  back-compat `file` alias) or a `tool_config` entry.

  For the ONLY such binding today, go-toolchain's `go-coverage`, NEITHER additional
  condition holds: its rule (`- id: go-coverage` / `engine: go-coverage`) declares
  neither `rule_path` nor `file`, so `RuleSourcePath()` returns "" for it, and
  go-toolchain's pack.yml has NO `tool_config` block at all (grep: zero matches).
  Adding a fixture to that rule would therefore NOT by itself make packval dispatch it.

  This holds even after PLAN-ISSUE-142's widening of dispatch: 142's scope is
  `input_mode: pattern-arg` specifically, while `go-coverage` declares
  `input_mode: none`, so 142's new path does not reach it either.

  The gap is still held shut by an absence rather than a guard — a pack author who adds
  BOTH a fixture and a rule source path (or a tool_config entry) to a
  `stdout_artifact`-declaring engine, each an ordinary and encouraged pack-authoring
  act, starts getting the lying verdict CLM-001 describes with no warning; the pack
  would simply validate clean. The trigger is a two-part combination, not one edit.

