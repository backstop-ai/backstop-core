          `pkg/packval/manifest.go`, `packs/contracts/`, 142's own test files,
          `pkg/packval/pathscope.go`, `pkg/packval/phase2.go`,
          `pkg/packval/testdata/path-scope/`, or 151's own test files — is evidence for
          the report, checked against BOTH siblings' known windows before it is treated
          as a surprise.
        files:
          - pkg/packval/executor.go
          - pkg/packval/executor_stdout_artifact_test.go
        claims:
          - CLM-001
          - CLM-002
          - CLM-003
          - CLM-004
          - CLM-005
          - CLM-006
          - CLM-007
          - CLM-008
        depends_on:
