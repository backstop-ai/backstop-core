---
plan_id: PLAN-SPEC-012
spec_id: SPEC-012
spec_version: 1.0.0
created: "2026-04-04"
status: draft
target_repo: backstop-core
target_module: github.com/bmanson/backstop-core
test_command: "go test ./pkg/compile/ -run TestGoStandard -race -coverprofile=cover.out"
coverage_threshold: 80

notes: |
  Populates the Go standards pack with enforceable rule content across three
  bootstrap categories: core, test, and security. This is a content spec —
  writing semgrep YAML rules, testdata Go fixtures, and updating STD-GO-001.
  No new Go library code in pkg/ is required; tests in pkg/compile/ verify
  the content round-trips through the compiler correctly.

  The work splits into five parallel streams that converge for integration:
    1. STD-GO-001 updates (new rule definitions)
    2. Core semgrep rules + testdata
    3. Test semgrep rules + testdata
    4. Security semgrep rules + testdata
    5. Deferred category scaffolding (accessibility/)

  Streams 2-4 depend on stream 1 (STD-GO-001 must have the rules before
  semgrep YAML can reference them). Streams 2, 3, and 4 have disjoint file
  sets and can execute in parallel after stream 1 completes. Stream 5 is
  independent of everything.

  Structure:
    Phase 1: Setup — accessibility directory, test helpers
    Phase 2: STD-GO-001 updates (new rules GO-004..GO-006, GO-060..GO-063)
    Phase 3: Core semgrep rules + core testdata (parallel-eligible)
    Phase 4: Test semgrep rules + test testdata (parallel with Phase 3)
    Phase 5: Security semgrep rules + security testdata (parallel with Phase 3, 4)
    Phase 6: Rule format validation + semgrep OSS compatibility tests
    Phase 7: Compiler integration + detection strategy mapping tests
    Phase 8: Comprehensive verification

phases:
  # ═══════════════════════════════════════════════════════════════════════
  # Phase 1: Setup — Scaffolding and Test Helpers
  # ═══════════════════════════════════════════════════════════════════════
  - id: phase-1
    name: "Phase 1: Setup — Scaffolding and Test Helpers"
    tasks:
      - id: TASK-001
        type: setup
        title: "Create accessibility directory and test helper scaffolding"
        description: |
          Create the missing accessibility/ directory under standards/go/rules/
          to complete the ten-category directory structure per ADR-0006.

          Create pkg/compile/go_standards_helpers_test.go with shared test
          helpers for the GoStandard test suite:
            - loadSemgrepRulesFile(t, path) — reads and parses a semgrep YAML
              rules file, returns the parsed rules array
            - loadStandardArtifact(t) — reads and parses STD-GO-001, returns
              the parsed frontmatter including rules array
            - findRuleByID(rules, id) — finds a rule entry by its semgrep id
              field
            - findSTDRuleByID(rules, id) — finds a rule in STD-GO-001 by its
              rule id field (GO-NNN)
            - allSemgrepRuleFiles(t) — globs standards/go/rules/**/*.yml and
              returns all rule file paths

          Add a .gitkeep file to standards/go/rules/accessibility/ to ensure
          the empty directory is tracked by git.
        files:
          - standards/go/rules/accessibility/.gitkeep
          - pkg/compile/go_standards_helpers_test.go
        claims:
          - CLM-043
        depends_on: []

