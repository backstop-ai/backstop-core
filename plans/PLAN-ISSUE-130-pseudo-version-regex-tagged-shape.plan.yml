        type: verification
        title: "Validate the artifacts this lane moves"
        description: |
          This lane closes an issue and completes a plan, so both artifacts move
          and both must validate:

              ./bin/backstop artifact validate --plan PLAN-ISSUE-130
              ./bin/backstop artifact validate --issue ISSUE-130

          Report true exit codes for both.

          ARTIFACT STATUS IS NOT THE IMPLEMENTER'S TO FLIP BY HAND. Route the
          status transitions and any close-out banner through the purpose-built
          agents (`/plan` for this plan, `/issue` for ISSUE-130) — hand-editing
