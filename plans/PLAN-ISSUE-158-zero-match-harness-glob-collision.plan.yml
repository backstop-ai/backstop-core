  ── SHARP EDGES ───────────────────────────────────────────────────────────────
   1. ROOT-ANCHORED, NEVER `**/`-PREFIXED. A `**/` variant PASSES `pack test`, so it
      looks correct, and leaks 2 `referenced-symbol-go` findings the moment hidden
      directories are scanned. Measured above. Do not "simplify" the derived paths by
      prefixing `**/`, and do not replace an exact fixture path with a `*.go` glob
      unless you re-measure BOTH the `--no-ignore hidden` and explicit-file shapes.
   2. NEVER `t.Skip` ANY OF THE FOUR TESTS. `requireAstGrepE2E`
      (`gate_substantiveness_e2e_test.go`) is `t.Fatalf` BY DESIGN. A skipped
      real-engine E2E is silent vacuous green. Same for the new tests.
   3. NEVER WEAKEN A FIXTURE. `packs/substantiveness/**` is out of scope entirely. If
      you find yourself editing a fixture, you have taken the forbidden fix.
   4. THE IN-REPO PACK SOURCE IS NEVER MUTATED BY A TEST. Copy to a temp dir and patch
      the COPY — editing `packs/substantiveness` from a test corrupts this repo's own
      dogfood install. This already holds; keep it holding.
   5. SCOPE THE CLM-003 ASSERTION TO `referenced-symbol-go`, NOT TO "zero findings".
      Under `--no-ignore hidden` the installed pack's own `negative.go` still yields
      ONE `hollow-test-go` finding. That rule is untouched and out of scope; a
      "zero findings of any rule" assertion would drag it into this lane and go red
      for a reason this plan does not own.
   6. NO DIRECT `exec.Command` IN `cmd/backstop` TESTS. Route every ast-grep
      invocation through the package's sanctioned `execCommand` seam
      (`cmd/backstop/root_test.go`). PLAN-ISSUE-148 tripped backstop-self's
      `no-baked-tool-exec` on exactly this and had to reroute before landing. And
      pass the tool name as DATA, not as an inline `"ast-grep"` literal — see sharp
      edge 15, which is the other half of the same trap.
   7. LOCATE EDIT SITES BY NAME, NEVER BY THE LINE NUMBERS QUOTED HERE.
      `func (w *e2eWorkspace) installZeroMatchSubstantivenessPack`, the `patched :=`
      string concatenation that appends the `files:` block, and the comment block
      beginning "WHY THE PATCHED PACK STILL PASSES". This file has moved repeatedly
      across recent lanes.
   8. SHARED TREE. Never bare `git stash` (it sweeps another agent's uncommitted
      edits). Do not run the whole suite or a full `gate --all` concurrently with a
      mid-flight implementer in this tree.
   9. ONE LITERAL FOR THE RULE ID. The harness already spells `referenced-symbol-go`
      in a `filepath.Join`; the manifest join needs the same id. Introduce ONE
      package-level constant and use it for both, or the two spellings drift and the
      derivation silently patches a rule whose fixtures it did not read.
  10. AN EMPTY DERIVATION MUST FAIL LOUD. If the manifest declares no fixtures for
      that rule, an empty `files:` list is a silent trap — return an error naming the
      rule id and the manifest path, never write an empty block.
  11. DO NOT TOUCH `pkg/pack/engine/allowlist.go` OR CI's SEMGREP INSTALL STEPS. The
      stale 1.96.0 pin was found and fixed by a separate lane earlier tonight. It is
      not this plan's scope and re-touching it would collide.
  12. ISSUE-151 IS ADJACENT, NOT THE SAME. That defect is semgrep `paths.include` under
      the live gate's explicit-file dispatch; this one is ast-grep `files:` under two
      different WORKING DIRECTORIES. Different tool, different mechanism, different
      surface. Do
      not route this fix through that one's conclusions — and note this lane MEASURED
      that ast-grep's `files:` is NOT inert under explicit-file dispatch.
  13. NO PARALLELISM IS AVAILABLE AND NONE IS FAKED. The lane touches exactly two
      files, one of which every task after Phase 1 must read. The phases are a strict
      chain on purpose; splitting them to look parallel would only create file-set
      collisions under D-081.
  14. THE FAKE REPO ROOT IS THE REFUSAL SEAM — DO NOT ADD A NEW EXPORTED HELPER FOR
      IT. `installZeroMatchSubstantivenessPack(repoRoot)` resolves its source through
      `substantivenessSourceDir(repoRoot)` = `<repoRoot>/packs/substantiveness`, so a
      `t.TempDir()` holding a doctored `packs/substantiveness/` copy drives the
      derivation's refusal branches through the EXISTING signature. Extracting a new
      helper just to test them would make TASK-001 reference a not-yet-written symbol
      and break the package's compile for every other lane (sharp edge 8).
  15. `const astGrepTool = "ast-grep"` ALREADY EXISTS at package scope in
      `cmd/backstop/substantiveness_fixture_polarity_test.go`. REUSE IT. Redeclaring
      it makes `cmd/backstop` fail to compile — the exact hazard TASK-001 is written
      to avoid — and inlining the `"ast-grep"` literal instead reds backstop-self's
      `no-baked-tool-exec` (precedent documented in that same file, above
      `scanWithCombinedRuleset`). Also note `scanWithCombinedRuleset` cannot be
      reused for the CLM-003 scan: its argv is fixed and carries neither
      `--no-ignore hidden` nor a working directory. Build that one invocation
      locally rather than widening a helper whose existing callers depend on its
      shape.
  16. NEVER HARDCODE THE INSTALLED PACK PATH. The manifest name is
      `backstop/substantiveness`, so `pack add` installs to
      `.backstop/packs/backstop/substantiveness` — TWO segments. Read
      `ws.installInfo.InstalledPath` (`*distribution.AddResult`). A hardcoded
      `.backstop/packs/substantiveness` is wrong and fails on the first run; this was
      caught in review, not in the loop, which is exactly why it is written down.
  17. ★ TO FORCE AN EMPTY DERIVATION, DROP THE WHOLE `claims:` BLOCK — NOT JUST
      `fixtures:`. MEASURED: `validateFixtures` (`pkg/pack/manifest.go`, invoked from
      `ParseManifestFile`'s rule loop) hard-requires at least one positive AND one
      negative fixture per claim, so a claim with `fixtures:` removed makes
      `ParseManifestFile` itself fail with
      `rule "referenced-symbol-go" claim "sub-referenced-symbol-go" fixtures:
      fixtures.positive must contain at least one entry`. TASK-002 (b) parses BEFORE
      (c) checks, so that doctoring never reaches the refusal branch at all — and the
      subtest STILL GOES GREEN, because a parse error is also a non-nil error naming
      the rule id and the manifest path. That is a vacuous green pinning the wrong
      code path, and it was caught in review rather than in the loop.
      There is NO rule-level "claims must be non-empty" check (the `len(Claims) == 0`
      requirement in that file is for `tool_configs`, not rules), so dropping the whole
      block parses clean and derives zero paths — VERIFIED. The lesson generalizes:
      when a test doctors artifact DATA to reach a branch, prove the doctored input
      still parses, and assert the branch's OWN message, not merely "an error".

