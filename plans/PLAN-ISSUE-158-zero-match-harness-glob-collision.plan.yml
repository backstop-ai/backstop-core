            * If the `--no-ignore hidden` measurement shows the pack's own
              `negative.go` yielding a `hollow-test-go` finding in a way that turns out
              to matter for the live gate (it does not today — `.backstop/` is hidden
              and the substantiveness classifier excludes `**/testdata/**`), that is a
