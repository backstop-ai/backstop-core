          - cmd/backstop/gate_substantiveness_zero_match_harness_test.go
          - plans/PLAN-ISSUE-158-zero-match-harness-glob-collision.plan.yml
          - issues/ISSUE-158-zero-match-harness-patch-makes-pack-unvalidatable.issue.md
        claims:
