notes: |
  ISSUE-158 — the zero-match E2E harness patches a copy of `packs/substantiveness`'s
  `referenced-symbol-go` rule with `files: ["harness/fixtures/**/*.go"]` to starve the
  consumer workspace of Q2 evidence. That same glob also takes the PACK'S OWN fixture
  tree out of the rule's scope, so the pack's declared negative fixture can no longer
  trigger and `pack add` — which runs the full packval pipeline unconditionally on a
  scratch copy — refuses the patched copy at `phase3-fixtures`. Four E2E tests die at
  install, before the code under test is ever reached.

  This is the LAST KNOWN REAL BLOCKER before v0.2.0 can go CI-green: these four are the
  only non-advisory findings in a real `backstop gate` run matching CI's blocking-job
  scope. A separate, already-fixed lane owns the stale semgrep pin — see sharp edge 11.

  ══════════════════════════════════════════════════════════════════════════════
  ★★ THE DESIGN DECISION, AND THE MEASUREMENTS THAT MADE IT ★★
  ══════════════════════════════════════════════════════════════════════════════
  The issue deliberately left the mechanism open. It is decided HERE, and it is
  decided on measurement, not taste. All numbers below were taken 2026-08-17 with
  real ast-grep 0.43.0 against scratch copies of `packs/substantiveness` at the
  current working tree — never by mutating the in-repo pack.

  ── THE MECHANISM: TWO DIFFERENT WORKING DIRECTORIES ──────────────────────────
  ast-grep has no "scan root" concept — it resolves a rule's `files:` globs against
  the INVOKING PROCESS'S WORKING DIRECTORY. The two contexts that must disagree run
  the engine from different working directories:

    packval phase3   `DefaultExecutor.RunEngine` (`pkg/packval/executor.go`) sets
                     `cmd.Dir = packDir` and passes the PACK-RELATIVE fixture path.
                     So the fixture's path IS
                     `testdata/fixtures/rules/referenced-symbol-go/negative.go`.

    consumer gate    `buildTestSubstantivenessStep` (`cmd/backstop/gate.go`) builds
                     `&check.ExecCommandRunner{Dir: projectRoot}`; the four E2E
                     tests pass a NIL scope, so `runFindingsEngine` appends
                     `projectRoot` as a DIRECTORY target. The very same fixture
                     files, now installed, sit under the workspace's
                     `.backstop/packs/<manifest name>/testdata/fixtures/...` —
                     see the INSTALL PATH note below; it is NOT what you would
                     guess from the source directory's name.

  A ROOT-ANCHORED glob (no leading wildcard segment) therefore matches the pack's own
  fixture when the engine runs from the pack directory and matches NOTHING when it
  runs from the consumer's project directory — and nothing in the consumer's own tree
  matches it either. That is exactly the property
  ISSUE-113 wants, and it is arguably a MORE faithful reproduction of the
  bclabs-portal defect than the fictional `harness/fixtures/**`: the glob is now
  literally baked to the PACK AUTHOR'S OWN repo layout.

  ── ★ THE INSTALL PATH IS NOT `.backstop/packs/substantiveness` ★ ─────────────
  MEASURED, and it is the single most likely way a first implementation run dies.
  `pkg/pack/distribution/add.go` installs to
  `filepath.Join(projectDir, ".backstop", "packs", packName)` where `packName` is the
  MANIFEST NAME, and `packs/substantiveness/pack.yml` declares
  `name: backstop/substantiveness`. So a real `pack add` of that source materializes at

      <ws.root>/.backstop/packs/backstop/substantiveness

  — a TWO-SEGMENT path, not the one-segment path the SOURCE directory's name suggests.
  DO NOT HARDCODE EITHER SPELLING. `installZeroMatchSubstantivenessPack` already
  records `w.installInfo = res`, and `distribution.AddResult` carries
  `InstalledPath` (`add.go`), so every consumer reads
  `ws.installInfo.InstalledPath`. This plan's own "derivation, not a literal" doctrine
  applies to its tests exactly as it applies to the glob: a literal here would drift
  the instant a manifest name changed, which is the same silent-drift class as the
  defect being fixed.

  ── THE CHOSEN FIX ────────────────────────────────────────────────────────────
  Keep the harness mechanism (copy → patch the copy's `referenced-symbol-go.yml` →
  real `pack add`). Replace the hardcoded fictional glob with a `files:` list
  DERIVED FROM THE COPY'S OWN `pack.yml`: the pack-relative fixture paths that
  manifest declares for rule `referenced-symbol-go`, used verbatim.

      files:
        - "testdata/fixtures/rules/referenced-symbol-go/positive.go"
        - "testdata/fixtures/rules/referenced-symbol-go/negative.go"

  Derivation, not a literal, is the point: a hardcoded path is exactly the silent-drift
  class this issue IS. If the pack's fixture layout ever moves, a derived list moves
  with it and a hardcoded one goes stale and re-breaks `pack add`.

  MEASURED — chosen shape:
    * `backstop pack test <copy>`  → `status: pass`, all six phases, phase3-fixtures
      PASS. (Control: the shipped `harness/fixtures/**/*.go` patch → `status: fail`,
      `ERROR [phase3-fixtures/semgrep-negative] negative fixture not triggered` — the
      issue's measurement reproduced byte-for-byte.)
    * Consumer workspace (3 `subject_*_test.go` + the installed pack), DIRECTORY
      dispatch, ast-grep defaults → ZERO results, of any rule.
    * Same workspace with `--no-ignore hidden` (the STRICT shape, which forces the
      installed `.backstop/packs/**` tree into the scan) → ZERO `referenced-symbol-go`
      results. One `hollow-test-go` result on the pack's own `negative.go`; that is the
      OTHER rule, untouched — see sharp edge 5.
    * EXPLICIT-FILE dispatch (the shape `--all` collapsed onto elsewhere): the three
      subject files → ZERO; the pack's own `negative.go` handed over explicitly from
      the consumer root → ZERO. So the darkness survives BOTH dispatch shapes.
      Control on the PRISTINE pack, explicit-file dispatch: 6 `referenced-symbol-go`
      results. ast-grep's `files:` is therefore NOT inert under explicit-file dispatch
      — unlike semgrep's `paths.include` (ISSUE-151). Stated because it was measured,
      not assumed.

  ── THE ALTERNATIVE THAT LOOKS RIGHT AND IS WRONG (this is sharp edge 1) ──────
  A `**/`-prefixed glob is the obvious "make it match the fixtures" move and it PASSES
  `pack test`, so nothing in the ordinary loop catches it. Measured:

      files: ["**/testdata/fixtures/rules/referenced-symbol-go/*.go"]  → pack test PASS
      files: ["**/fixtures/rules/**/*.go"]                             → pack test PASS

  Both are consumer-dark under ast-grep's defaults and both LEAK 2
  `referenced-symbol-go` findings from the installed pack's own `negative.go` under
  `--no-ignore hidden`. Their zero-match property is an accident of ast-grep skipping
  hidden directories — `.backstop/` is hidden — not a property of the glob. That is a
  vacuous green waiting to happen. The root-anchored form is dark for a STRUCTURAL
  reason, and CLM-003's test pins the difference by scanning hidden directories on
  purpose.

  ── APPROACHES CONSIDERED AND REJECTED ────────────────────────────────────────
    * Patch the INSTALLED copy under `.backstop/packs/` after `pack add` instead of
      before. Sidesteps packval entirely, but throws away the property ISSUE-113
      built the harness to demonstrate — that a REAL, VALID, INSTALLABLE pack can be
      consumer-dark. Rejected.
    * Weaken or delete the pack's negative fixture. Explicitly forbidden by the issue,
      and it would gut the pack's own phase3 coverage. Rejected.
    * `t.Skip` the four tests. Explicitly forbidden; `requireAstGrepE2E` is `t.Fatalf`
      BY DESIGN and a skipped real-engine E2E is silent vacuous green. Rejected.
    * Change `packs/substantiveness` itself. Nothing is wrong with the pack — it has
      no `files:` key at all; the glob is purely a harness construct. `packs/**` stays
      byte-identical to HEAD (CLM-006). Rejected.
    * Teach packval to ignore a rule's `files:` scope during fixture runs. That would
      make packval blind to a real pack defect — the exact opposite of what ISSUE-092
      closed. Rejected.

  ── THE SECOND, SMALLER DEFECT: THE DOCSTRING IS NOW ACTIVELY MISLEADING ──────
  The comment block above `installZeroMatchSubstantivenessPack` beginning "WHY THE
  PATCHED PACK STILL PASSES `pack test`" asserts that packval never runs these
  fixtures because `rule.File == ""` under a `rule_path:` declaration, and cites
  ISSUE-092 as tracking that hole. ISSUE-092 CLOSED it: phase3 now reads
  `rule.RuleSourcePath()`, does run the fixtures, and does notice the patch. The
  comment tells a future reader the exact opposite of the truth, and it is the reason
  the patch looked safe for as long as it did. It is corrected in the same edit
  (CLM-005) and a source-scan test keeps the falsified phrases out.

