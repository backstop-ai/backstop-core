            Assert `ws.installInfo` is non-nil first, so a future harness change that
            stops recording the result fails with a legible message rather than a nil
            dereference.
            Assert `result.Status == "pass"` AND that the phase results contain
            `phase3-fixtures` with status `pass`. Asserting only the overall status
            would let a SKIPPED phase3 read as success — the exact vacuous shape this
            DIR-032 cluster exists to prevent. On failure print every error entry with
            its Phase, Check, Rule, Claim and Message so the red state is legible
            without a second run.
            PRE-FIX STATE: fails at the install call with "pack validation (test) of
            the validation copy failed in phase3-fixtures: 1 validation error(s)".

          TestZeroMatchHarnessGlob_IsManifestDerivedAndRootAnchored (CLM-002).
            After the same install, read the INSTALLED
            `ast-grep/rules/referenced-symbol-go.yml` — resolved as
            `filepath.Join(ws.installInfo.InstalledPath, "ast-grep", "rules", ...)`,
            never from a hardcoded install path — parse it as YAML, and take its
            top-level `files:` list. Assert:
              * the key EXISTS and the list is NON-EMPTY;
              * NO entry begins with a wildcard segment — reject any entry whose first
                path segment contains `*`, and reject any entry containing `**`
                anywhere. This is the assertion that forbids the `**/`-prefixed
                variant structurally rather than by convention;
              * the SET of entries EQUALS the set of pack-relative fixture paths the
                INSTALLED `pack.yml` declares for rule id `referenced-symbol-go`
                (again under `ws.installInfo.InstalledPath`), read through the real
                manifest reader `pack.ParseManifestFile` and walking
                `Content.Ruleset.Rules[].Claims[].Fixtures.Positive/Negative`.
                Compare as SETS so declaration order is not load-bearing.
            Say WHY in the body: equality-with-the-manifest is what makes the patch
            immune to a fixture-layout move. A hardcoded path here would be the same
            silent-drift class as the defect being fixed.
            PRE-FIX STATE: fails at install; if driven past that, the shipped list is
            `["harness/fixtures/**/*.go"]`, which fails all three assertions.

          TestZeroMatchHarnessDerivation_RefusesLoudlyRatherThanPatchingBlind (CLM-002).
            THE FAIL-LOUD PIN, and it needs no new production symbol — it feeds the
            harness a FAKE repo root. `installZeroMatchSubstantivenessPack` resolves
            its source through `substantivenessSourceDir(repoRoot)` =
            `<repoRoot>/packs/substantiveness`, so a `t.TempDir()` containing a
            `packs/substantiveness/` copy is a fully valid input (sharp edge 14).
            Build each doctored source with `copyPackSourceTree` from the real pack,
            then rewrite ONLY the COPY's `pack.yml`. Two subtests:
              * EMPTY DERIVATION — remove the ENTIRE `claims:` block from the
                `referenced-symbol-go` rule. ★ NOT just its `fixtures:` block, and
                this is not a stylistic preference — see sharp edge 17. Assert the
                call returns a NON-NIL error, assert its message contains the
                derivation's OWN distinguishing refusal phrase (TASK-002 (c) fixes
                that phrase; state the literal exactly ONCE in the test), and assert
                it names the rule id AND the resolved manifest path. Then assert
                NOTHING was installed: no `.backstop/packs` tree under the workspace,
                and `ws.installed` still false. An empty `files:` block written
                silently is the trap this pins (sharp edge 10).
                THE DISTINGUISHING-PHRASE ASSERTION IS LOAD-BEARING, NOT BELT-AND-
                BRACES. "non-nil error mentioning the rule id and the manifest path"
                is ALSO true of a manifest PARSE error, so an assertion that stops
                there passes while exercising a completely different code path —
                which is exactly what the weaker doctoring recipe did (sharp edge 17).
                Comment that in the test body.
              * WILDCARD-LED PATH — rewrite one declared fixture path to a
                wildcard-led value such as `**/negative.go`. This one parses clean
                (verified: 2 derived paths, wildcard present), so branch (d) is
                genuinely reached. Assert the same fail-loud shape, against branch
                (d)'s own distinguishing phrase, with the offending value quoted in
                the message. This is what keeps the anchoring property (sharp edge 1)
                from being silently un-anchored by pack DATA rather than by code.
            The refusal MUST be ordered before `pack add` runs — TASK-002 (c)/(d)
            place it there — so these subtests must NOT depend on packval's verdict.
            Say WHY in the body: both branches are cheap to write and impossible to
            notice once broken, because a silently-wrong scope still installs and
            still looks green.
            PRE-FIX STATE: fails — today's harness has no derivation and no refusal,
            so it proceeds to `pack add` and dies with the phase3-fixtures error
            instead of the expected named refusal.

          TestZeroMatchHarnessGlob_LeavesReferencedSymbolDarkEvenInHiddenDirs (CLM-003).
            THE DISCRIMINATING TEST. After the same install, run real ast-grep over the
            WHOLE workspace with hidden directories FORCED INTO THE SCAN:
              ast-grep scan --json --no-ignore hidden \
                --config <installed>/ast-grep/sgconfig.yml \
                <ws.root>
            where `<installed>` is `ws.installInfo.InstalledPath`, run with the process
            working directory set to `ws.root`, via `execCommand` using the EXISTING
            `astGrepTool` const. The existing helper `scanWithCombinedRuleset`
            (`substantiveness_fixture_polarity_test.go`) CANNOT be reused here — its
            argv is fixed and carries no `--no-ignore hidden` and no working-directory
            control — so build the command locally rather than widening that helper,
            whose current callers depend on its exact shape.
            Assert ZERO results whose `ruleId` is `referenced-symbol-go`.
            SCOPE THE ASSERTION TO THAT RULE ID (sharp edge 5): the pack's own
            `negative.go` legitimately yields one `hollow-test-go` result under this
            flag, and that rule is out of scope.
            Comment the flag's purpose in the body, because it looks gratuitous and is
            not: WITHOUT `--no-ignore hidden` this test passes for a `**/`-prefixed
            glob too, since ast-grep skips the hidden `.backstop/` tree by default —
            the assertion would be accidentally satisfied rather than discriminating.
            MEASURED 2026-08-17, real ast-grep 0.43.0, on scratch copies:
              root-anchored (chosen)                        -> 0 referenced-symbol-go
              "**/testdata/fixtures/rules/.../*.go"         -> 2 referenced-symbol-go
              "**/fixtures/rules/**/*.go"                   -> 2 referenced-symbol-go
            Also assert the DEFAULT-flags shape yields zero `referenced-symbol-go`
            results, as a second subtest, so the everyday dispatch is pinned too.
            PRE-FIX STATE: fails at install.

          TestZeroMatchHarnessDocstring_DropsTheFalsifiedPhase3Premise (CLM-005).
            Read `cmd/backstop/gate_substantiveness_e2e.go` from disk (resolve it under
            `repoRoot(t)`, do not hardcode a relative path from the test's CWD) and
            assert that NEITHER of these two byte-identical phrases appears anywhere in
            the file:
              packval never RUNS these fixtures at all
              rule.File == ""
            Both are present TODAY, on single lines, inside the falsified block. State
            each literal exactly ONCE in the test, in a slice the loop reads, so the
            two spellings cannot drift into variants.
            Say WHY in the body: ISSUE-092 closed the hole those sentences describe, so
            the comment now asserts the opposite of the truth, and it is precisely why
            the patch looked safe for as long as it did. This is a PROSE-DRIFT GUARD,
            not style policing — an unfalsifiable comment about a validation hole is
            how a validation hole gets re-opened.
            PRE-FIX STATE: fails on both literals.
        files:
          - cmd/backstop/gate_substantiveness_zero_match_harness_test.go
        claims:
          - CLM-001
          - CLM-002
          - CLM-003
          - CLM-005
        depends_on: []
        test_names:
          - TestZeroMatchHarnessPack_InstallsAndPassesAllPackvalPhases
          - TestZeroMatchHarnessGlob_IsManifestDerivedAndRootAnchored
          - TestZeroMatchHarnessDerivation_RefusesLoudlyRatherThanPatchingBlind
          - TestZeroMatchHarnessGlob_LeavesReferencedSymbolDarkEvenInHiddenDirs
          - TestZeroMatchHarnessDocstring_DropsTheFalsifiedPhase3Premise

  # ═══════════════════════════════════════════════════════════════════════════
  # Phase 2: GREEN — derive the scope from the manifest, correct the docstring
  # ═══════════════════════════════════════════════════════════════════════════
  - id: phase-2
    name: "Phase 2: GREEN — manifest-derived anchored scope + docstring correction"
    tasks:
      - id: TASK-002
        type: implementation
        title: "Derive the zero-match files: scope from the copy's own pack.yml and correct the falsified docstring"
        description: |
          Edit `cmd/backstop/gate_substantiveness_e2e.go`. Two changes, one file, one
          task — they are inseparable: the comment explains the code being changed.

          (1) THE PATCH CONSTRUCTION, inside
          `(*e2eWorkspace).installZeroMatchSubstantivenessPack`. Today it appends a
          hardcoded `files:\n  - "harness/fixtures/**/*.go"\n` to the COPY's
          `ast-grep/rules/referenced-symbol-go.yml`. Replace the hardcoded list with
          one DERIVED from the copy's own manifest, AFTER `copyPackSourceTree` and
          BEFORE `newProductionAddCommand().Run(...)`:
            a. Introduce ONE package-level constant for the rule id
               (`referenced-symbol-go`) and use it BOTH for the `filepath.Join` that
               builds the rule file path AND for the manifest lookup (sharp edge 9).
            b. `pack.ParseManifestFile(filepath.Join(packCopy, "pack.yml"))`; walk
               `Content.Ruleset.Rules` for the rule whose `ID` equals that constant;
               collect every `Claims[].Fixtures.Positive[].Path` and
               `.Negative[].Path`, de-duplicated, in declaration order.
            c. REFUSE LOUDLY on an empty result (sharp edge 10): return an error
               naming the rule id and the resolved manifest path. Never write an empty
               `files:` block — an empty scope is a silent trap that would make the
               copy either match everything or nothing depending on the tool's mood.
            d. REFUSE LOUDLY on a path that is not a clean pack-relative path:
               normalize to forward slashes and reject anything absolute, anything
               starting with `.` or `..`, and anything whose first segment contains a
               wildcard. The anchoring is the whole mechanism (sharp edge 1); a
               manifest that ever declared a wildcard-led fixture path would silently
               un-anchor the scope, so refuse rather than emit it.
            ★ GIVE (c) AND (d) DISTINCT, DISTINGUISHING MESSAGE TEXT. Each refusal
               must carry a phrase that appears in NO other error reachable from this
               function — in particular not in a `ParseManifestFile` failure, which
               also names a rule id and a path. TASK-001's refusal subtests assert
               those exact phrases, and that assertion is the only thing standing
               between "the branch refused" and "something upstream refused first"
               (sharp edge 17). Do not reword them afterwards without updating the
               single literal in the test.
            e. Append the block as valid YAML, each entry double-quoted, preserving a
               short explanatory comment above it. The rule file ships with NO
               top-level `files:` key, so a plain top-level append is well-formed —
               verify that the patched YAML still parses before handing it to
               `pack add`.
          The resulting scope, at today's manifest:
            files:
              - "testdata/fixtures/rules/referenced-symbol-go/positive.go"
              - "testdata/fixtures/rules/referenced-symbol-go/negative.go"

          NOTHING ELSE ABOUT THE HARNESS CHANGES. The copy-then-patch-then-real-
          `pack add` shape, the temp dir placed BESIDE `w.root` (never inside it, or
          the pack tree gets swept into the engine's own scan targets), the untouched
          `hollow-test-go.yml` / `sgconfig.yml` / convert script / `pack.yml`, and the
          in-repo pack source staying unmutated (sharp edge 4) all stay exactly as they
          are.

          (2) THE DOCSTRING. Rewrite the block beginning "WHY THE PATCHED PACK STILL
          PASSES `pack test`". It currently claims packval never runs these fixtures
          because `rule.File == ""` under a `rule_path:` declaration, and cites
          ISSUE-092 as an open hole. ISSUE-092 IS CLOSED — phase3 reads
          `rule.RuleSourcePath()`, RUNS the fixtures, and WOULD refuse a patch that
          took them out of scope. The replacement must say, in the author's own words:
            * packval DOES run these fixtures now, so the patched copy must stay
              validatable — `pack add` validates unconditionally;
            * the scope is derived from the pack's OWN declared fixture paths, so the
              pack's negative fixture still triggers under packval;
            * it is ROOT-ANCHORED, and that is load-bearing: ast-grep resolves a
              rule's `files:` globs against the INVOKING PROCESS'S WORKING DIRECTORY,
              and packval runs the engine from the PACK dir while the gate runs it
              from the PROJECT dir — so the same anchored path matches the fixture in
              one context and nothing in the other;
            * a `**/`-prefixed variant would also pass `pack test` while being
              consumer-dark only by accident of ast-grep skipping hidden directories —
              name that trap so nobody "simplifies" the glob into it;
            * ISSUE-158 is the reference, ISSUE-113 keeps the intent citation.
          Do NOT leave either falsified phrase in the file — TASK-001's guard scans for
          them (sharp edge 7: find the block by its opening words, not by line number).

          Run `backstop gate` after this task, as the implementer contract requires.
        files:
          - cmd/backstop/gate_substantiveness_e2e.go
        claims:
          - CLM-001
          - CLM-002
          - CLM-003
          - CLM-004
          - CLM-005
        depends_on:
          - TASK-001

      - id: TASK-003
        type: verification
        title: "Verify the changed harness and the new pins against the diff-scoped gate"
        description: |
          Run the diff-scoped gate over the two files this lane touches:

              backstop gate --file cmd/backstop/gate_substantiveness_e2e.go
              backstop gate --file cmd/backstop/gate_substantiveness_zero_match_harness_test.go

          Then run the Phase 1 tests and require all five GREEN:

              go test ./cmd/backstop/ -run "TestZeroMatchHarness" -race -count=1

          Record the actual output. Two findings classes to expect and FIX AT SOURCE
          rather than waive:
            * `no-baked-tool-exec` on the new test file if any ast-grep invocation
              bypassed the `execCommand` seam (sharp edge 6);
            * any backstop-self finding on the edited harness file.
          If a violation belongs to another lane, attribute it explicitly (name the
          path and the owning lane) rather than absorbing or waiving it.
        files:
          - cmd/backstop/gate_substantiveness_e2e.go
          - cmd/backstop/gate_substantiveness_zero_match_harness_test.go
        claims:
          - CLM-001
          - CLM-002
          - CLM-003
          - CLM-005
        depends_on:
          - TASK-002

  # ═══════════════════════════════════════════════════════════════════════════
  # Phase 3: the four named regression tests + full-sweep verification
  # ═══════════════════════════════════════════════════════════════════════════
  - id: phase-3
    name: "Phase 3: regression proof on the four named tests, then the full sweep"
    tasks:
      - id: TASK-004
        type: verification
        title: "Re-verify the four named E2E tests unmodified, and prove the non-regression"
        description: |
          ★ EVERY PATH IN THIS TASK'S `files:` IS READ-ONLY. They are the SUBJECTS of
          the verification — the two test files that must run unchanged, and the four
          `packs/substantiveness` paths whose byte-identity to HEAD is the measurement.
          Listing them is D-080 scope declaration, NOT an edit license. If this task
          produces a diff in any of them, the task has failed.

          THE REGRESSION CHECK IS THE FOUR EXISTING TESTS, RUN UNCHANGED (CLM-004).
          No assertion softened, no `t.Skip`, no `requireAstGrepE2E` change (sharp
          edges 2 and 3).

              go test ./cmd/backstop/ -run "TestE2E_ZeroMatchClassification|TestE2E_HollowEvidenceBlocks" -race -count=1

          Require all of these GREEN, and confirm from the output that each one
          REACHED the code under test rather than merely stopping at a clean install —
          they were failing at `pack add` before, so "no install error" alone is not
          the proof:
            TestE2E_ZeroMatchClassification_RefusesInsteadOfPerTestViolations
            TestE2E_ZeroMatchClassification_RefusalIsNotWaivable
            TestE2E_HollowEvidenceBlocksZeroMatchRefusal
            TestE2E_HollowEvidenceBlocksRefusal_IsNotVacuous
          `TestE2E_ZeroMatchClassification_ControlPackReportsNoViolations` installs the
          PRISTINE pack via a different helper and was already green; it must STAY
          green — a regression there would mean the edit leaked out of the harness.

          THEN PROVE THE NON-REGRESSION (CLM-006), by measurement:
            * `git status --porcelain packs/substantiveness` → EMPTY, and
              `git diff --stat packs/substantiveness` → EMPTY. Byte-identical to HEAD.
            * `git diff` over the TWO test files carrying the four named tests
              (`gate_substantiveness_zero_match_e2e_test.go`,
              `gate_substantiveness_refusal_boundary_e2e_test.go`) → EMPTY. State the
              command and its output; do not assert it from memory.
            * grep those same two files for `t.Skip` → zero hits.
            * run the broader substantiveness suite and report the result:
              `go test ./cmd/backstop/ -run "Substantiveness" -race -count=1`.
          If any test outside this lane's scope is red, establish whether it was red
          BEFORE by measuring a control (a detached worktree at clean HEAD is the
          reliable way; a carried reading is not), and attribute it to its owning lane
          by name. Never absorb another lane's red and never waive one.
        files:
          - cmd/backstop/gate_substantiveness_zero_match_e2e_test.go
          - cmd/backstop/gate_substantiveness_refusal_boundary_e2e_test.go
          - packs/substantiveness/pack.yml
          - packs/substantiveness/ast-grep/rules/referenced-symbol-go.yml
          - packs/substantiveness/testdata/fixtures/rules/referenced-symbol-go/positive.go
          - packs/substantiveness/testdata/fixtures/rules/referenced-symbol-go/negative.go
        claims:
          - CLM-004
          - CLM-006
        depends_on:
          - TASK-002
          - TASK-003
        test_names:
          - TestE2E_ZeroMatchClassification_RefusesInsteadOfPerTestViolations
          - TestE2E_ZeroMatchClassification_RefusalIsNotWaivable
          - TestE2E_HollowEvidenceBlocksZeroMatchRefusal
          - TestE2E_HollowEvidenceBlocksRefusal_IsNotVacuous

      - id: TASK-005
        type: verification
        title: "Full kill chain: backstop gate --all plus artifact validation"
        description: |
          THE FINAL, UNSCOPED SWEEP. Run both, and read the results:

              backstop gate --all
              backstop artifact validate --plan PLAN-ISSUE-158
              backstop artifact validate --issue ISSUE-158

          `gate --all` covers the code half (pack lock verification, pack engines,
          test verification, substantiveness, coverage, contracts, status drift,
          traceability, waivers, baseline, ledger integrity); `artifact validate`
          covers the artifact half, since this lane's plan artifact is itself new.

          ATTRIBUTION IS THE DELIVERABLE, NOT THE RAW COUNT. This repo carries
          inherited reds from other lanes. For every violation, decide and STATE
          whether it is this lane's:
            * grep the full violation set explicitly for each path this lane touched
              (`cmd/backstop/gate_substantiveness_e2e.go`,
              `cmd/backstop/gate_substantiveness_zero_match_harness_test.go`) and
              report the hit count, zero or otherwise;
            * anything attributable to this lane is FIXED AT SOURCE, never waived and
              never made green by weakening a test (sharp edges 2, 3).
          Record honest caveats rather than smoothing them: if the reading was taken in
          a worktree lacking `.backstop/baseline.json` it is STRICTER, not more
          permissive; pack-derived rule ids embed the install path, which can resurface
          bound waivers as spuriously unused. If sibling commits landed between control
          and treatment, say so and do not claim a clean whole-repo delta.

          THE HEADLINE THIS LANE OWES THE RELEASE: report whether the four
          `go-test`-channel reds that ISSUE-158 owns are GONE from `gate --all`, and
          what the remaining non-advisory blocking set is. That is the v0.2.0 CI-green
          question this plan exists to answer.
        files:
