          - TASK-004

      - id: TASK-006
        type: documentation
        title: "File follow-ons for anything surfaced; absorb nothing"
        description: |
          Discharge the follow-on obligation EXPLICITLY, even if the answer is "none",
          and hand ISSUE-158 itself off for closure.

          EVERY ARTIFACT TOUCH IN THIS TASK IS ROUTED THROUGH `/issue` (the
          issue-author agent). This lane never hand-edits an artifact file — that is
          why `issues/ISSUE-158-...` appears in this task's `files:`: it is the file
          the ROUTED close-out writes, not a file this task opens in an editor.

          (1) REQUEST THE CLOSE-OUT OF ISSUE-158 via `/issue`, handing over TASK-004's
          and TASK-005's measured results (the four tests green, the attribution
          reading, the byte-identity checks) as the evidence. Do NOT flip a status
