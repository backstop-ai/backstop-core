  Implements SPEC-048: the two PROVEN findings-engine dispatch fixes in
  cmd/backstop/pack_gate.go (self-targeting arg-shaping + stdout_artifact honoring),
  the LOAD-BEARING real end-to-end proof over an installed-pack fixture driven by a
  REAL check.CommandRunner, and the two surfaced-debt alignments (the runCoverageEngine
  %v->%w wrap + the phantom SPEC-040 contract retire). The reference implementation is
  .claude/acceptance-notes/PROVEN-dispatch-fix.diff — small, hand-verified, and already
  known to work; the RISK is concentrated in the TESTS that prove it, so every fix is
  authored failing-FIRST (TDD).

  ════════════════════════════════════════════════════════════════════════════
  THE STUB IS WHY BOTH BUGS SHIPPED — THE E2E MUST USE A REAL RUNNER (Sharp Edge 1)
  ════════════════════════════════════════════════════════════════════════════
  SPEC-043..047 all proved the dispatch through a canned-stdout fixtureRunner (the
  fixtureRunner{byCmd:…} in cmd/backstop/bun_fixture_e2e_test.go) that returns bytes
  directly AS stdout — it never writes a stdout_artifact FILE and never observes the
  appended args, so it masked BOTH defects. REQ-003's proof (Phase 3) is worthless if
  it reuses that stub. It MUST drive a REAL check.CommandRunner (check.ExecCommandRunner
  with Dir=projectRoot) executing a COMMITTED POSIX fake-engine script, and it MUST FAIL
  against the pre-fix dispatch. The fake engine self-targets (reads its own config /
  scans its cwd), writes its findings to the declared stdout_artifact FILE, prints only
  human NOISE to stdout, and is arg-SENSITIVE — it SUPPRESSES its seeded finding if a
  stray path arg is bolted on — so the one e2e regression-guards DEFECT-1 (a bolted-on
  projectRoot would silence the finding = vacuous green) AND DEFECT-2 (stdout noise has
  no findings). DEFECT-1 is ALSO guarded independently by CLM-001's recording-runner
  unit test; the e2e and the unit test are complementary, not redundant.

  Sharp Edge 2 (CLEAN must be green for the RIGHT reason): the CLEAN variant goes GREEN
  because the fake self-targeted and genuinely found nothing — NOT because a stray arg
  made it scan nothing. The fake's arg-sensitivity encodes exactly this: with correct
  (empty) arg-shaping it scans its self-target and reports honestly (seeded->finding,
  clean->none); a bolted-on arg would make even the SEEDED variant read clean, which
  CLM-009's seeded->RED assertion forbids.

  ════════════════════════════════════════════════════════════════════════════
  TESTDATA PACK FILES ARE COMMITTABLE (verified 2026-06-30)
  ════════════════════════════════════════════════════════════════════════════
  The gitignore rule `.backstop/packs/` does NOT bite the testdata tree: the existing
  cmd/backstop/testdata/bun-toolchain/.backstop/packs/… pack.yml + scripts are TRACKED
  (git ls-files confirms; git check-ignore returns not-ignored). So the committed fake
  pack for the e2e lives under a testdata sibling and is committed, not gitignored. The
  fake pack is placed at cmd/backstop/testdata/bun-dispatch-e2e/ (a sibling of the
  coverage-shaped bun-toolchain fixture) so the existing coverage e2e is left undisturbed.
  The fake engine command must be pinned/allowlisted in the fixture pack.yml so the
  dispatch trust gate (checkEngineToolAllowed) passes over a REAL runner.

  ════════════════════════════════════════════════════════════════════════════
  ONE FILE, ONE IMPL TASK FOR THE DISPATCH FIX; DEBT LANDS BEFORE THE FINAL GATE
  ════════════════════════════════════════════════════════════════════════════
  REQ-001 (self-target), REQ-002 (stdout_artifact) and REQ-004a (%w) all edit the SAME
  file (cmd/backstop/pack_gate.go), so they are ONE implementation task fed by two
  parallel test tasks — not serialized impl-on-impl. Editing pack_gate.go pulls the
  whole file into diff scope, so `backstop gate` will NOT go green until BOTH debt items
  are resolved: REQ-004a (%w, same file) AND REQ-004b (the phantom SPEC-040 contract).
  REQ-004b therefore lands (Phase 4) BEFORE the final full-gate phase. The SPEC-040 edit
  MUST be routed through the spec-author agent by the implementer (NOT hand-edited) and
  MUST NOT be a re-baseline/waiver — the phantom dispatchBuildViolationProjectWide symbol
  is REALIGNED to the shipped EngineBinding.ExemptFromScopeFilter -> gate.Violation.ProjectWide
  mechanism so contract_signature is honest.

  ════════════════════════════════════════════════════════════════════════════
  THIN-EXECUTOR INVARIANT
  ════════════════════════════════════════════════════════════════════════════
  project_target and stdout_artifact are pack DATA. No tsc/bun/go literal enters the
  arg-shaping or payload-selection code — the fix stays tool/language-blind, and the
  fake engine is a POSIX script (NO real bun/tsc/oxlint/go in backstop-core's Go CI).

phases:
  # ═══════════════════════════════════════════════════════════════════════
  # Phase 1: Setup — the COMMITTED fake-engine installed-pack fixture the
  # load-bearing real-runner e2e (Phase 3) drives. DATA only, no production code.
  # ═══════════════════════════════════════════════════════════════════════
  - id: phase-1
    name: "Phase 1: Committed Fake-Engine Installed-Pack Fixture"
    description: |
      Create the committed installed-pack fixture the REQ-003 real-runner e2e executes
      over — a sibling of the coverage-shaped bun-toolchain fixture so the existing
      coverage tests are undisturbed. The fixture declares a PROJECT-WIDE findings engine
      with an EMPTY project_target and a declared stdout_artifact, executed by a COMMITTED
      deterministic POSIX fake-engine script that emulates the self-targeting-toolchain
      I/O contract: it writes its real machine-readable (SARIF) findings to the declared
      stdout_artifact FILE, prints only human-summary NOISE to stdout, self-targets (reads
      its cwd / own config — does NOT depend on a bolted-on projectRoot arg), and is
      arg-SENSITIVE (suppresses its seeded finding if a stray path arg is appended, so the
      e2e regression-guards DEFECT-1). The fake command is pinned/allowlisted in pack.yml
      so the dispatch trust gate passes over a real runner. Seeded vs clean is driven by a
      marker in the self-targeted source (the test swaps it via a temp copy, mirroring the
      existing lcov-seeded pattern). No production code changes here.
    tasks:
      - id: TASK-001
        type: setup
        title: "Scaffold committed fake-engine findings-pack fixture for the real-runner e2e"
        description: |
          Under cmd/backstop/testdata/bun-dispatch-e2e/ create the committed installed-pack
          fixture the Phase-3 e2e drives via a REAL check.CommandRunner:
            - backstop.yml declaring the fake pack as an ordinary pack (NO language field,
              SPEC-046 convention).
            - the fake pack.yml declaring a PROJECT-WIDE findings engine (gate_type
              findings, scope project-wide) with an EMPTY project_target and a declared
              stdout_artifact (the FILE the engine writes findings to), plus a findings
              rule that fills it. The engine command is the committed POSIX script,
              pinned/allowlisted so checkEngineToolAllowed passes over a real runner.
            - scripts/fake-engine.sh: a deterministic POSIX fake that (i) writes SARIF
              findings to the declared stdout_artifact FILE (a finding when the
              self-targeted source carries the seeded marker; NONE when clean), (ii) prints
              only human-summary NOISE to stdout (no SARIF/<result>), (iii) SELF-TARGETS
              (reads cwd=projectRoot / its own config — never requires a projectRoot arg),
              and (iv) is arg-SENSITIVE: if a stray path arg is appended it scans nothing
              and emits NO finding (so a bolted-on projectRoot would vacuous-green even the
              seeded variant — the DEFECT-1 trap the e2e guards).
            - src/app.ts: the self-targeted source carrying the seeded-vs-clean marker.
          Committed testdata (verified committable — the .backstop/packs gitignore does not
          bite testdata). Fixture DATA only; the e2e assertions live in the Phase-3 test.
        files:
          - cmd/backstop/testdata/bun-dispatch-e2e/backstop.yml
          - cmd/backstop/testdata/bun-dispatch-e2e/.backstop/packs/backstop/bun-dispatch-e2e/pack.yml
          - cmd/backstop/testdata/bun-dispatch-e2e/.backstop/packs/backstop/bun-dispatch-e2e/scripts/fake-engine.sh
          - cmd/backstop/testdata/bun-dispatch-e2e/src/app.ts
        claims:
