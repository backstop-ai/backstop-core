      a SINGLE edit to cmd/backstop/pack_gate.go: (1) the project-wide branch condition
      changes from `ScopeKind==ProjectWide && ProjectTarget != ""` to `ScopeKind==ProjectWide`,
      appending ProjectTarget ONLY when non-empty (keeping the fileModeTestTarget package-
      selector edge) and NOTHING when empty (self-target — DEFECT-1 fix); the file-args
      else branch is untouched. (2) A payload-selection step mirroring runCoverageEngine:
      when binding.StdoutArtifact != "" read filepath.Join(projectRoot,
      filepath.FromSlash(StdoutArtifact)) as the payload and feed it to BOTH
      requireLintSarifShape AND the convert (sarifBytes := payload), fail-loud (%w) naming
