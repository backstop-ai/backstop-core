        description: |
          RUN THIS AFTER TASK-044'S KILL CHAIN PASSES, not before — the map must
          describe what actually shipped, and until the gate is green "what
          shipped" is not settled.

          docs/CODEBASE-MAP.md is PROSE, not a schema'd artifact: `backstop
