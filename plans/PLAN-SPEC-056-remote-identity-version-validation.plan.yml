  # ═══════════════════════════════════════════════════════════════════════
  # Phase 12: End to end, through the built binary, against hermetic remotes
  # ═══════════════════════════════════════════════════════════════════════
  - id: phase-12
    name: "Phase 12: The end-to-end claims — real git, real binary, separated streams, hermetic throughout"
    tasks:
      - id: TASK-042
        type: test
        title: "Write the ten end-to-end claims against hermetic repositories through the built binary"
        description: |
          Create cmd/backstop/pack_identity_e2e_test.go. Every test builds the
          binary with buildBackstopBinary, sets up a hermetic remote, PROVES
          the redirect reached a child process (assertPackURLRedirected), and
          drives the binary with runBackstopStreams — which captures stdout and
          stderr INDEPENDENTLY. Never runBackstop's CombinedOutput; never
          executeCommand's merged buffer.

            TestE2E_PackAdd_VersionlessReferenceRefusesWithGuidance (CLM-011)
              `pack add <org/name>` with no version and no --version: exit
              non-zero, the diagnostic on STDERR naming both ways to supply a
              version, and NO git error about a nonexistent branch. Today
              parsePackRef returns "" and the pipeline clones the ref "v", so
              the operator's diagnostic is git complaining about a branch. That
              regression is what this asserts against.

            TestE2E_PackAdd_ManifestVersionDriftRefusesLoudly (CLM-022)
              Against version-drift-pack built with
              newHermeticRemoteKeepingManifestVersion: exit non-zero, the
              mismatch on stderr, and NO success line on stdout. IF THIS
              FIXTURE IS BUILT WITH newHermeticRemote THE DRIFT WAS REWRITTEN
              AWAY AND THE CLAIM IS VACUOUS (spec Review Question 7).

            TestE2E_GateResolvesPackAssetsUnderManifestName (CLM-031)
              After a DIVERGENT add, run `backstop gate` in the consumer and
              require it resolves the pack's declared rule file under the
              MANIFEST-name asset root with no missing-asset finding. This is
              the claim that ties the whole spec back to the reported defect:
              the harness consumer's `missing convert script`.

            TestE2E_DivergentNamePack_AddThenInstallRoundTrip (CLM-062)
              Add a divergent pack in one project, copy ONLY backstop.yml and
              backstop.lock into a FRESH consumer, run `pack install`, and
              require it installs green with MATCHING content hashes. This is
              the claim that proves REQ-005 makes REQ-003 survivable: without
              the recorded coordinate the fresh consumer would try to clone
              `other/renamed-pack` and find nothing.

            TestE2E_PackAdd_DivergentIdentityWarnsOnStderrAndSucceeds (CLM-070)
              Exit ZERO, the divergence diagnostic on STDERR, the success line
              on STDOUT. All three, on separated streams.

            TestE2E_ScaffoldConfigPack_AddThenInstallHashesMatch (CLM-090)
              THE CLAIM REQ-008 EXISTS FOR. Add scaffold-config-pack (the
              corpus's first tier:complete declaration), then install it into a
              fresh consumer from the lock, and require the hashes MATCH.
              Before the scratch copy, packval's phase-3 rendering leaves files
              present at add-hash time and absent at install-hash time, and the
              install fails with a mismatch that looks exactly like tampering.
              This must drive a REAL pack declaring a real scaffold — a
              mock-validator proof does not reach packval at all.

            TestE2E_IdentityRefusalNeverExitsSilently (CLM-097)
              For EACH refusal shape — unresolvable version, version mismatch,
              invalid manifest name — exit non-zero AND stderr non-empty. An
              exit-1 with empty stderr satisfies `if code != 1` and is the
              exact defect class this repo has shipped before.

            TestE2E_IdentityRefusalEmitsNoStackTrace (CLM-098)
              Neither stream contains "goroutine " or a `.go:NN` panic frame.
              pack_add.go's AddOptions once carried a nil GitCloner that
              nil-dereferenced (ISSUE-073); a panic is not a diagnostic.

            TestE2E_WarningDoesNotChangeExitCode (CLM-113)
              A divergent add exits 0 while emitting a warning; a fallback
              install exits 0 while emitting one. Read the PROCESS exit code.

            TestE2E_WarningsAndOutputOccupySeparateStreams (CLM-114)
              With the streams read separately, warnings appear ONLY on stderr
              and command output ONLY on stdout. Assert BOTH directions: a
              renderer writing to both satisfies either half alone.

          HERMETICITY IS LOAD-BEARING AND FRAGILE. The mechanism is a
          `url.<file://repo>.insteadOf = https://github.com/<org>/<pack>.git`
          rewrite installed via GIT_CONFIG_GLOBAL, and it only survives the
          process boundary because runBackstopStreams passes os.Environ()
          through (run_backstop_streams_test.go:37). Do not build a filtered
          env for any child here; a scrubbed env sends the clone to GitHub and
          the suite goes silently network-dependent with nothing turning red.

          The redirect for a DIVERGENT pack is keyed on the COORDINATE the ref
          names — `hermetic/divergent-name-pack` — not on the manifest name. A
          redirect registered against the manifest name simply MISSES, and the
          clone reaches the network.
        files:
          - cmd/backstop/pack_identity_e2e_test.go
        claims:
          - CLM-011
          - CLM-022
          - CLM-031
          - CLM-062
          - CLM-070
          - CLM-090
          - CLM-097
          - CLM-098
          - CLM-113
          - CLM-114
        depends_on:
          - TASK-041

      - id: TASK-043
        type: verification
        title: "Verify the end-to-end suite is hermetic, stream-separated, and driving real packs rather than doubles"
        description: |
          `backstop code check` DOES NOT EXIST (ISSUE-076) — do not run it.

          Run, in order, reading TRUE exit codes:
            1. go build -o bin/backstop ./cmd/backstop
            2. go test ./cmd/backstop/... -race -count=1
            3. go test ./... -race -count=1
            4. ./bin/backstop gate

          THEN ANSWER EACH OF THESE EXPLICITLY, by grepping or by reading the
