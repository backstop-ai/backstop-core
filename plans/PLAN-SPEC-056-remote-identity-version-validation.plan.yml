          have RENDERED the sample_config file into it. That rendered file is
          the mutation this whole requirement exists to contain; do not commit
          it, and do not "fix" the fixture by authoring it.

          Plain tree, no .git. These are DATA. No Go source is added here.
        files:
          - cmd/backstop/testdata/hermetic-remote/scaffold-config-pack/pack.yml
          - cmd/backstop/testdata/hermetic-remote/scaffold-config-pack/rules/forbidden-marker.yml
          - cmd/backstop/testdata/hermetic-remote/scaffold-config-pack/README.md
