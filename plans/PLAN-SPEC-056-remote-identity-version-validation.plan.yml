      - id: TASK-003
        type: setup
        title: "Author the corpus's FIRST tier:complete scaffold fixture, with a POSIX-builtin test command"
        description: |
          Create cmd/backstop/testdata/hermetic-remote/scaffold-config-pack/ —
          the fixture REQ-008's whole observable contract rests on. No pack.yml
