      - id: TASK-017
        type: implementation
        title: "Write pkg/pack/distribution/identity.go: the tuple, the three typed errors, and the five pure functions"
        description: |
          Create pkg/pack/distribution/identity.go carrying exactly what
          SPEC-056's contracts declare for that file, and nothing else. NOTHING
          CALLS IT YET — that is deliberate, so this phase is verifiable on its
          own.

            type RemoteIdentity struct {
              Coordinate, EffectiveVersion, Tag, ManifestName, InstallName string
              Diverged bool
            }
              Coordinate is the requested org/repository VERBATIM.
              EffectiveVersion is the normalized X.Y.Z with NO prefix; Tag is
              that value re-prefixed with exactly one "v" and is what Clone is
              called with. InstallName aliases ManifestName so the field that
              builds the install path, the backstop.yml key, the lock key and
              the engine asset root READS as an identity rather than as a name
              that happens to be reused. Diverged is a FIELD, not a
              recomputation, so the comparison rule lives in one place.

            func ResolveEffectiveVersion(reference, overrideVersion string)
                (coordinate string, version string, err error)
            func ValidateRemoteIdentity(coordinate, effectiveVersion, packDir string)
                (*RemoteIdentity, error)
            func ReadManifestIdentity(packDir string) (name, version string, err error)
            func CoordinateForEntry(packName string, entry LockEntry)
                (coordinate string, warning string)
            func RemoteURLForEntry(packName string, entry LockEntry)
                (url string, warning string)

            type VersionUnresolvedError struct { Reference, Problem string }
            type VersionMismatchError struct { Coordinate, Tag, ManifestVersion, ExpectedVersion string }
            type IdentityError struct { Coordinate, Tag, Field, Problem string }

          SIX CONSTRAINTS, EACH LOAD-BEARING:

          1. REUSE parseVersionComponents (versionresolver.go:151). Do not add
             a second normalizer. That helper is what TagVersionResolver
             already applies to tags, and reusing it is what makes a tag, a
             manifest version and a resolved version mean the same thing
             everywhere. It strips at most ONE prefix, which is exactly
             CLM-008/CLM-020's rule.

             ITS SIGNATURE TAKES THE PATTERN AS A PARAMETER:
               func parseVersionComponents(value string,
                   strictSemver *regexp.Regexp) (versionComponents, bool)
             so identity.go must compile `strictSemverPattern`
             (versionresolver.go:18) and pass it in. Do NOT introduce a second
             package-level pattern constant, and do NOT
             regexp.MustCompile inside a hot path — the existing callers
             (ResolveLatestCompatible, IsMajorBump) each compile once per call
             and identity.go should follow whichever convention the reviewer
             of that file prefers rather than inventing a third.

          2. CALL pack.ValidatePackName. Do not restate the rule (spec Review
             Question 14). This is the import that makes TASK-009 worth doing.

          3. ReadManifestIdentity MUST TOLERATE A MISSING VERSION. Read only
             the two identity fields; error for an ABSENT, UNPARSEABLE or
             NAMELESS manifest, and return "" for an absent version.
             pkg/pack/distribution/testdata/local-pack/pack.yml declares NO
             version and four existing local-path add tests expect it to
             install. Version strictness belongs in ValidateRemoteIdentity,
             which only the remote path calls.

          4. ReadManifestIdentity REPLACES the inline yaml.Unmarshal into
             map[string]interface{} at command.go:770-779. Do not leave the
             inline reader standing; phase 8 rewires resolveLocalPackSource
             onto this function so local and remote read identity through ONE
             implementation (CLM-038).

          5. NO CASE FOLDING ANYWHERE. Diverged is `ManifestName != Coordinate`
             — byte-exact on the full org/name strings. No strings.ToLower, no
             EqualFold, no suffix stripping. Case-insensitivity is a GITHUB
             property; packs may be hosted anywhere, and DD-31 removed that
             assumption on purpose (spec Review Question 12).

          6. ValidateRemoteIdentity MUST NOT MUTATE packDir and must not touch
             the consumer project at all. Calling it is always safe, which is
             what lets REQ-007 put it before every write.

          THE FIVE CHECKS RUN IN THIS ORDER and a refusal at any one means none
          of the later ones ran: version available → version strict → manifest
          readable with a name → manifest version equals effective → name
          valid. Divergence is computed AFTER check five and is a diagnostic,
          never a sixth refusal.
        files:
          - pkg/pack/distribution/identity.go
        claims:
          - CLM-001
          - CLM-002
          - CLM-003
          - CLM-004
          - CLM-005
          - CLM-006
          - CLM-007
          - CLM-008
