notes: |
  ─────────────────────────────────────────────────────────────────────────
  WHAT THIS PLAN BUILDS (BUNDLE-006 identity seed, REQ-039@1.1.0 / DD-31)
  ─────────────────────────────────────────────────────────────────────────
  One new production file (pkg/pack/distribution/identity.go) carrying the
  identity gate and three typed errors; one exported name rule in pkg/pack;
  one new lock field; one shared scratch-copy validation seam; warning
  carriers on three result types and renderers on four CLI commands; and the
  rewiring of add / install / update / upgrade so the MANIFEST name is the
  install identity and the RECORDED coordinate is the repository.

  ─────────────────────────────────────────────────────────────────────────
  VERIFICATION COMMAND REALITY — READ THIS BEFORE EVERY VERIFICATION TASK
  ─────────────────────────────────────────────────────────────────────────
  `backstop code check` DOES NOT EXIST (ISSUE-076). Any agent definition or
  precedent telling you to run it is stale. The real verification loop is:

      go build -o bin/backstop ./cmd/backstop     # ALWAYS — see below
      go test <the packages this phase touched> -race -count=1
      ./bin/backstop gate                          # the full kill chain

  THE REBUILD IS UNCONDITIONAL, in every verification task, not "when cmd/
  changed". bin/backstop statically links everything under pkg/ as well as
  cmd/backstop, so a phase that adds only pkg/pack/distribution/identity.go
  still changes what the gate binary would contain. Running the gate against
  a stale binary reports a verdict about code that is not in the binary and
  it is indistinguishable from a real green (ISSUE-077 is that class).

  TRUE EXIT CODES, NEVER A GREP PIPE. Run the command and read `$?` from the
  command itself. `go test ... | grep -q FAIL` reports grep's exit status,
  not the suite's, and a suite that fails to BUILD produces no "FAIL" line at
  all — so the pipe reports success for a tree that does not compile.

  ALL gate dimensions run at EVERY verification step (the no-check-filtering
  razor). Verification tasks never scope or categorize what was touched.

  ─────────────────────────────────────────────────────────────────────────
  COMPILE-SAFETY — WHY THE PHASE ORDER IS WHAT IT IS
  ─────────────────────────────────────────────────────────────────────────
  Every phase boundary must hand off a tree that COMPILES and a suite that is
  GREEN. Three orderings are load-bearing and must not be "optimized":

  1. THE LOCK FIELD (phase 4) LANDS BEFORE THE IDENTITY MODULE (phase 5).
     CoordinateForEntry takes a LockEntry and reads SourceCoordinate off it.
     Writing identity.go first means it does not compile.

  2. THE WARNING CARRIERS (phase 6) LAND BEFORE ANYTHING PRODUCES A WARNING
     (phases 8/10/11). UpdateResult and UpgradeResult have NO warning field
     today (update.go:28-34, upgrade.go:22-29) and pack update / pack upgrade
     render nothing of the kind. A divergence diagnostic computed before its
     carrier exists is computed and dropped, which is worse than not
     computing it because the code looks right (spec REQ-011).

  3. THE SCRATCH-COPY SEAM (phase 7) LANDS BEFORE THE IDENTITY REWIRING
     (phase 8+). Phases 8-12 assert on recorded content hashes. If validation
     is still contaminating the hashed tree when those assertions are
     written, they pin the WRONG hash and the later fix reds tests that were
     green for the wrong reason.

  ─────────────────────────────────────────────────────────────────────────
  THE EDIT SET — RE-DERIVED AGAINST THE CURRENT TREE, NOT TAKEN ON FAITH
  ─────────────────────────────────────────────────────────────────────────
  SPEC-056 names TWO invalidated tests. THE REAL COUNT IS ELEVEN ITEMS ACROSS
  SIX FILES: the five (A)–(E) below, plus the six individual tests of item (F).
  Ten of the eleven are single test functions; item (E) is a whole suite
  (~22 test functions in one file, one mechanical repair). The nine items the
  spec does not name are not defects in the spec — they are the kind of thing
  only a mechanical sweep surfaces — but they ARE breakage, and an implementer
  who meets one mid-phase will mistake it for a bug in their own change.

  METHOD CORRECTION, RECORDED BECAUSE IT IS THE REUSABLE PART. This plan's
  first sweep was scoped to "the six distribution suites" — the named list
  SPEC-055 and spec015_lineage_test.go use — and it MISSED six breakages,
  because pkg/pack/distribution holds TWENTY-NINE _test.go files. DERIVE AN
  EDIT-SET SWEEP FROM FIXTURE-VERSUS-REF PAIRINGS ACROSS THE WHOLE PACKAGE:
  grep every cloneDir literal and every Run() ref in `*_test.go`, pair them,
  and check each pair against the new refusal. NEVER sweep from a named suite
  list — that list describes where tests used to live, and the compiler does
  not honor it.

  SECOND METHOD POINT, AND IT IS THE ONE THAT COSTS MOST: for every hit, check
  the FAILURE MODE, not just that it is a hit. A test that already expects an
  error and snapshots state passes VACUOUSLY under a new, earlier refusal —
  the mandated name survives while the property it asserts is gone. One of the
  eleven is exactly that shape (item (F) below) and NOTHING TURNS RED to
  prompt the fix.

  The eleven, grouped by disposition:

  (A) TestPackAdd_MergeToolConfigErrorRollsBack (add_test.go:1229)
      NAMED BY THE SPEC. Builds a git-source pack whose pack.yml is binary
      garbage ("\x00\x01\x02 binary garbage") and asserts the failure text
      contains "merging tool_config". After phase 8 that pack is rejected far
      earlier by ReadManifestIdentity. NOT a mandated name (verified: it
      appears in no spec's tests: list). DISPOSITION: rewrite in place —
      keep the identifier and the rollback assertions, and reach the merge
      failure the way the test intends, with a manifest that PARSES and
      identity-validates (name acme/bad-pack, version 1.0.0) but carries a
      tool_config entry MergeToolConfig cannot apply.

  (B) TestPackAdd_LocalPathValidatesInPlace (add_test.go:710)
      NAMED BY THE SPEC. IS MANDATED — SPEC-015 CLM-071 lists it
      (specs/SPEC-015-pack-distribution.spec.md:819). DISPOSITION: THE NAME
      SURVIVES VERBATIM; the assertion updates. It is re-listed under
      SPEC-056 CLM-087 as the local half of that claim: a local-path add
      still validates and still succeeds, and the operator's source directory
      is unchanged afterward. Today the test body only asserts success — it
      does not assert the in-place mechanism — so the update is an ADDITION
      of the not-mutated assertion, not a rewrite. Do not delete, do not
      rename, do not merge it into another test.

  (C) TestPackAdd_LocalPathMissingName (add_test.go:841) — NOT NAMED BY THE
      SPEC. Points add at a local directory whose pack.yml declares only a
      version, and asserts the error text contains the exact string
      "local pack manifest missing name" (command.go:778). Phase 8 routes the
      local branch through ReadManifestIdentity, which returns an
      *IdentityError with different wording. NOT mandated (verified absent
      from every spec's tests: list). DISPOSITION: keep the identifier,
      update the assertion to require an *IdentityError via errors.As AND a
      message naming the `name` field. Asserting the TYPE rather than a
      literal is the stronger form and is what CLM-033 asserts for the remote
      side, so the two halves agree.

  (D) TestPackUpdate_AppliesPatchVersion (update_test.go:242) — NOT NAMED BY
      THE SPEC, AND IT IS MANDATED (SPEC-015 CLM-061,
      specs/SPEC-015-pack-distribution.spec.md:750). Its cloner serves
      testdata/valid-pack (manifest version 1.0.0) while its resolver returns
      "1.0.1", so after REQ-002 the identity gate refuses with a
      *VersionMismatchError and the test reds. DISPOSITION: THE NAME SURVIVES
      VERBATIM and the FIXTURE moves — repoint the cloner at a directory
      whose manifest declares 1.0.1. testdata/tamper-pack-severity-downgrade
      and testdata/tamper-pack-rule-removed already declare
      name: acme/valid-pack / version: "1.0.1", but they exist to carry
      TAMPER shapes and reusing one here would couple a patch-version claim
      to a tamper fixture. TASK-004 authors testdata/valid-pack-v1-0-1/ for
      this. Do NOT change the resolver to "1.0.0" — that would turn the test
      into the already-at-latest no-op case and silently delete the patch
      claim.

  (E) THE ENTIRE UPGRADE SUITE — NOT NAMED BY THE SPEC, AND IT IS THE LARGEST
      ITEM. Every one of the ~22 tests in upgrade_test.go calls
      `upgrade.Run("acme/valid-pack@2.0.0", …)` while its cloner serves
      testdata/valid-pack-v2, whose manifest declares version "1.1.0". After
      REQ-002 the identity gate refuses ALL of them (effective 2.0.0 vs
      manifest 1.1.0). DISPOSITION: this is a FIXTURE repair, not a test
      repair. TASK-004 authors testdata/valid-pack-v3/ as a byte-for-byte
      copy of valid-pack-v2 with the version line changed to "2.0.0" — the
      tool_config block, the rules, and testdata/fixture.json must all
      survive, because TestPackUpgrade_UpdatesToolConfig,
      TestPackUpgrade_ToolConfigConflictExitsNonZero and
      TestPackUpgrade_MergeToolConfigError all depend on that content. Then
      phase 11 repoints every upgrade_test cloneDir from valid-pack-v2 to
      valid-pack-v3. EVERY TEST IDENTIFIER IN upgrade_test.go SURVIVES
      VERBATIM; only the cloneDir literal changes. Several are SPEC-015
      mandated names. TASK-039 owns it.

  (F) SIX MORE OF THE SAME SHAPE, IN THREE FILES THE FIRST SWEEP NEVER LOOKED
      AT — the six that make the count eleven. Identical cause: an `@2.0.0`
      ref against a cloner serving valid-pack-v2 (manifest "1.1.0"). Identical
      repair: repoint the cloneDir at valid-pack-v3. Every identifier survives;
      five of the six are SPEC-055 MANDATED NAMES. TASK-040 owns it.

        upgrade_capability_test.go:55   TestUpgradeCommand_ScannerInvokedUnconditionally       (SPEC-055 CLM-056)
        upgrade_capability_test.go:87   TestUpgradeCommand_RemediationFailureAbortsUpgrade      (SPEC-055 CLM-057)
        upgrade_capability_test.go:124  TestUpgradeCommand_PropagatesCapabilityUnavailableError (SPEC-055 CLM-058)
        upgrade_capability_test.go:164  TestUpgradeCommand_UnavailableCapabilityFailsBeforeMutation (SPEC-055 CLM-059)
        validation_gate_test.go:190     TestUpgradeCommand_ValidatesBeforeInstall               (SPEC-055 CLM-053)
        command_test.go:387             TestUpgradeCommandRun_UsesReceiverDependencies          (unmandated)

      THE LAST OF THESE — CLM-059's
      TestUpgradeCommand_UnavailableCapabilityFailsBeforeMutation — IS THE
      DANGEROUS ONE, AND IT IS THE REASON THE FAILURE-MODE CHECK IS A METHOD
      POINT ABOVE. It asserts only that Run errors and that five artifacts are
      unchanged. A *VersionMismatchError satisfies BOTH — it errors, and it
      refuses before any mutation — so THE TEST GOES ON PASSING while the
      property it exists for (the scanner is reached, and its unavailability is
      what fails the upgrade) silently stops being tested. A mandated name
      surviving with its meaning gutted is worse than a red, because a green
      suite is indistinguishable from a correct one. TASK-040 repoints it
      ANYWAY and adds the missing scanner-was-invoked assertion.

      TWO NEAR-MISSES IN THOSE SAME FILES THAT MUST NOT BE TOUCHED:
      validation_gate_test.go's three AddCommand tests use @1.0.0 against
      valid-pack and are unaffected; command_test.go:359
      TestUpdateCommandRun_UsesReceiverDependencies serves valid-pack-v2 but is
      an UPDATE whose resolver returns "1.1.0", which MATCHES. Repointing
      either would break a passing test.

  IF YOU FIND A TWELFTH, STOP AND REPORT IT. This enumeration is now derived
  from a package-wide fixture-versus-ref pairing over all 29 test files, not
  from a suite list, so it should be closed. A twelfth means the pairing method
  missed a class too, which is worth knowing before it is absorbed silently as
  "just fixing a test".

  ─────────────────────────────────────────────────────────────────────────
  THE THREE COINCIDENCES THIS PLAN DEPENDS ON (verify, do not assume)
  ─────────────────────────────────────────────────────────────────────────
  The corpus survives REQ-002 and REQ-003 mostly by luck, and the luck is
  worth naming so nobody "tidies" it away:

  1. pkg/pack/distribution/testdata/valid-pack/pack.yml declares
     name: acme/valid-pack and version: "1.0.0". Every add_test git call site
     uses the ref acme/valid-pack@1.0.0 AND newTestAddOptions (add_test.go:85)
     sets Version: "1.0.0". So coordinate == manifest name (no divergence
     warning) and effective version == manifest version (no mismatch). The
     ad-hoc inline fixtures — acme/with-deps, acme/sdk-pack,
     acme/no-config-pack, acme/simple-pack — each declare a manifest name
     equal to their coordinate and version "1.0.0" too. Rename any fixture
     directory or edit any of those version literals and dozens of tests turn
     into divergence or mismatch cases.

  2. cmd/backstop/testdata/hermetic-remote/{valid,invalid,fixture-fail}-pack
     each declare `hermetic/<directory>`, which is exactly what remoteE2ESetup
     builds the coordinate from — and newHermeticRemote rewrites pack.yml's
     version to each tag, so the manifest always agrees with the tag. SPEC-055's
     whole remote e2e suite therefore stays green through REQ-002/REQ-003. That
     rewrite is ALSO why REQ-010 needs a second constructor: with
     newHermeticRemote, a version-drift fixture is silently repaired into a
     passing one and CLM-016 tests nothing.

  3. testdata/local-pack/pack.yml declares name: internal/local-rules and NO
     VERSION AT ALL. TestPackAdd_LocalPathRelativeDot,
     TestPackAdd_LocalPathRelativeParent,
     TestPackAdd_DeclaredButNotMaterializedInstalls and
     TestPackAdd_LocalPathValidatesInPlace all expect it to add successfully.
     CONSEQUENCE, AND IT IS A DESIGN CONSTRAINT ON identity.go:
     ReadManifestIdentity MUST NOT reject a missing version. It returns
     (name, version, err) and errors only for an absent, unparseable, or
     NAMELESS manifest. Version strictness — CLM-017's missing version,
     CLM-018's non-strict version, CLM-019's prerelease, CLM-020's doubled
     prefix — is decided in ValidateRemoteIdentity, which only the REMOTE
     tag-cloning path calls. Put the version check in ReadManifestIdentity
     and every local-path add in the corpus reds.

  ─────────────────────────────────────────────────────────────────────────
  STREAM SEPARATION — THE MERGED-BUFFER TRAP HAS TWO CALLERS, NOT ONE
  ─────────────────────────────────────────────────────────────────────────
  executeCommand (root_test.go:17-23) points cobra's SetOut AND SetErr at the
  SAME bytes.Buffer. Against it, "renders to stderr" passes for a command that
  printed to stdout. TWO existing tests read install's warnings through that
  merged buffer and BOTH stay green through the stdout→stderr move in phase 6:

    • TestPackInstallCommand_PrintsStaleLockWarning (pack_install_test.go:26,
      asserting at :73-79)
    • TestPackInstallE2E_StaleLockWarnsInstallsDeclared
      (pack_install_e2e_test.go:83, asserting at :122-128)

  That is convenient and it is a trap: it means the existing suite CANNOT tell
  the two streams apart, so every stream claim in this spec has to be driven
  either through cobra with SEPARATE SetOut/SetErr buffers (the CLM-109..112
  renderer unit claims) or through runBackstopStreams
  (run_backstop_streams_test.go:31) against the BUILT binary (CLM-113/114 and
  every e2e claim). NO SPEC-056 stream claim may be driven by executeCommand
  or by runBackstop's CombinedOutput. Leave both existing tests alone — they
  legitimately do not care about streams — but do not mistake their green for
  evidence.

  ─────────────────────────────────────────────────────────────────────────
  THE CONTRACTS GATE CANNOT SEE A STRUCT FIELD — THE CLAIMS ARE THE ENFORCEMENT
  ─────────────────────────────────────────────────────────────────────────
  packs/contracts/scripts/compile-signature.sh reduces ANY signature whose
  leading token is `type ` to the ast-grep pattern `type <Name> $$$` (its
  "type "* branch), and for an interface to `type <Name> interface { $$$ }`.
  It NEVER compares a field list. So:

    • LockEntry.SourceCoordinate (REQ-004)
    • AddResult.Warnings / UpdateResult.Warnings / UpgradeResult.Warnings
      (REQ-011)
    • RemoteIdentity's six fields

  are ALL invisible to the contracts dimension. The contract entries in
  SPEC-056 for those types are satisfied by the bare type existing. CLM-040
  through CLM-050 and CLM-105 through CLM-112 are the only things that
  actually hold those fields. Do not drop any of them as "already covered by
  the contract" — that is exactly the reduction that would make them vacuous.
  This plan therefore does NOT add a contracts congruence test of its own:
  SPEC-056 mandates no name for one, and a bespoke congruence mechanism is
  outside this seed. The disposition is recorded here so the absence is a
  decision rather than an oversight.

  ─────────────────────────────────────────────────────────────────────────
  THE LINE-1 WAIVER ON cmd/backstop/pack_upgrade.go IS UNTOUCHABLE
  ─────────────────────────────────────────────────────────────────────────
  pack_upgrade.go carries a `@waiver:coverage_threshold:…` token on LINE 1.
  coverage_threshold is a LOCATIONLESS gate dimension — its violations carry a
  file but no line — so the gate anchors them at the file's first line and
  scans THAT LINE ALONE for an annotation (pkg/gate/step_waiver.go:19,
  coverageAnnotationLine). Phase 6 adds a warning-rendering loop to this file.
  Add it INSIDE newPackUpgradeCommand's RunE. Do not move, reflow, reformat,
  or prepend anything above the token. Moving it down onto the function, where
  a reader would naturally expect it, makes it a DANGLING waiver AND brings
  the coverage red back — two failures for one tidy.

  ─────────────────────────────────────────────────────────────────────────
  ANTI-VACUOUS-GREEN GUARDS (the ways this ships dark)
  ─────────────────────────────────────────────────────────────────────────
  1. A DRIFT FIXTURE BUILT WITH newHermeticRemote. It rewrites pack.yml's
     version to match every tag, so the drift is repaired before the test
     runs and CLM-016 passes over a fixture that cannot fail. Spec Review
     Question 7. TASK-005's constructor exists for exactly this and CLM-100's
     test asserts the drift SURVIVES tagging.
  2. A SCRATCH-COPY SEAM PROVEN ONLY BY A TEST DOUBLE. A mockValidator that
     writes a file proves the seam plumbing; it does not prove packval's real
     phase-3 rendering is contained. CLM-080 characterizes the real mutation
     and CLM-090 drives a REAL tier:complete pack through add→install with
     hash equality. Spec Review Question 6. Neither may be dropped as
     redundant with the other.
  3. SCRATCH VALIDATION IN add ONLY. update (command.go:539) and upgrade
     (command.go:654) carry the identical defect. Spec Review Question 3.
     CLM-083/084 are what catch a partial fix.
  4. SCRATCH VALIDATION ON THE REMOTE BRANCH ONLY. For a local-path add the
     directory packval mutates is the OPERATOR'S OWN WORKING TREE. Spec
     Review Question 4. CLM-087 is what catches it.
  5. A CASE-FOLDED COMPARISON. `strings.EqualFold` or `strings.ToLower`
     anywhere in the identity path silently reintroduces the GitHub host
     assumption DD-31 removed. Spec Review Question 12. CLM-041 and CLM-066
     are what catch it.
  6. AN EXIT-CODE-ONLY ASSERTION. An exit-1 with empty stderr satisfies
     `if code != 1`. Every refusal claim asserts on the DIAGNOSTIC TEXT, on
     the correct stream (CLM-097 asserts the non-empty stderr directly).
  7. A FALLBACK WARNING EMITTED TWICE. pack update resolves the coordinate at
     two points — once for ls-remote, once for the clone. Two independent
     resolutions produce two identical warnings for one invocation, which
     trains operators to ignore the signal. CLM-059 is what holds it.
  8. THE IDENTITY GATE LEAKING INTO INSTALL. install is the hash-verified
     restore path and re-validates nothing (DD-12). Spec Review Question 13.
     CLM-025 is what catches it.

  ─────────────────────────────────────────────────────────────────────────
  ZERO BAKED LANGUAGE/TOOL KNOWLEDGE (the standing invariant)
  ─────────────────────────────────────────────────────────────────────────
  `git` is distribution's declared TRANSPORT (BUNDLE-006 DD-1) and `sh` is
  what packval's DefaultExecutor.RunScaffoldTest already invokes
  (executor.go:107-112); both are on backstop/self Family A's allowed exec
  literal list. NOTHING ELSE is. Family B2 (no-baked-language-token) is GLOBAL
  and blocking and matches whole tokens in ANY .go file including testdata, so
  the scaffold fixture's test_command, sample_config keys, and file paths must
  carry no foreign-language token — and its test_command must be a POSIX
  SHELL BUILTIN (REQ-010 / CLM-103), which is also what makes it hermetic.

  ─────────────────────────────────────────────────────────────────────────
  WHAT THIS PLAN DOES *NOT* DELIVER (do not widen scope to "make it work")
  ─────────────────────────────────────────────────────────────────────────
  • The shared staged-filesystem transaction coordinator and rollback for
    failures AFTER the identity gate (bundle REQ-040@1.1.0). REQ-007
    guarantees nothing is written BEFORE the gate; it guarantees nothing
    about after. AddCommand.Run's existing best-effort `rollback` closure
    stays exactly as it is, with all its existing gaps.
  • The legacy Git-metadata-inclusive hash migration and pack relock's
    argument shape (REQ-041@1.1.0 / ISSUE-074). relock still takes a
    filesystem PATH while remove/update/upgrade take a NAME. Do not fix it
    here.
  • The general authored-content copy/hash boundary for ALL sources including
    local-path `.git` exclusion (REQ-021@1.1.0). This spec closes only the
    VALIDATOR-CONTAMINATION half and deliberately does not claim the
    requirement. Widening the boundary would mark REQ-021 covered at its
    current version in the traceability gate while two thirds of it remain
    unbuilt.
  • The hermetic lifecycle parity suite (REQ-042@1.1.0).
  • resolveGitURL's hardcoded GitHub host (ISSUE-083, post-launch). The URL
    builder keeps its current construction; only the STRING it is handed
    changes, from the pack name to the recorded coordinate.
  • pkg/pack's validateSemver stays UNEXPORTED. Exporting it alongside
    ValidatePackName would invite exactly the prerelease-accepting reuse
    REQ-002 forbids (spec Review Question 14).

  ─────────────────────────────────────────────────────────────────────────
  PLAN VERSION HISTORY
  ─────────────────────────────────────────────────────────────────────────
  - Folded against SPEC-056 v1.1.0, with four reviewer-sanctioned amendments
    applied at authoring time rather than through a spec revision:
