phases:
  # ═══════════════════════════════════════════════════════════════════════
  # Phase 1: The fixture corpus and the harness variant (setup only)
  # ═══════════════════════════════════════════════════════════════════════
  - id: phase-1
    name: "Phase 1: Hermetic fixtures, the edit-set repair fixtures, and the manifest-version-preserving harness (setup only)"
    tasks:
      - id: TASK-001
        type: setup
        title: "Author the version-drift hermetic fixture: manifest 0.1.3 against tags that stop at v0.1.1"
        description: |
          Create cmd/backstop/testdata/hermetic-remote/version-drift-pack/ —
          a pack SOURCE reproducing the shape of the PUBLISHED harness
          toolchain pack (DIR-027 item 2), which is this check's waiting first
          customer: the manifest declares 0.1.3 while the repository's tags
          stop at v0.1.1.

          pack.yml must declare:
            - name: hermetic/version-drift-pack
            - version: 0.1.3   ← DELIBERATELY not any tag this fixture gets
            - the same claimless engine-model shape valid-pack/pack.yml uses,
              so `pack check` reaches its verdict without executing anything.
              READ cmd/backstop/testdata/hermetic-remote/valid-pack/pack.yml
              and copy its `engines:` + `content:` structure; do not invent a
              new one.

          The fixture is a PLAIN TREE. It carries no .git — TASK-005's
          constructor is what turns it into a tagged repository at test time,
          and newHermeticRemote already fatals if a source arrives carrying
          one.

          THIS FIXTURE IS INERT WITHOUT TASK-005. Built through the EXISTING
          newHermeticRemote, its version line is rewritten to match each tag
          and the drift disappears silently. That is spec Review Question 7
