          errors.As arms:

            jsonErrorKindVersion  = "version"   ← *VersionUnresolvedError
                                                  AND *VersionMismatchError
            jsonErrorKindIdentity = "identity"  ← *IdentityError

          The arms go BESIDE the existing git/validation/dependency/capability
          arms and BEFORE the `unknown` default. NO EXISTING CLASSIFICATION
          CHANGES. Use errors.As, never a type assertion, for the reason the
          file's own comment at :61-64 already gives.

          THREE TYPES, TWO KINDS, DELIBERATELY. VersionUnresolvedError and
          VersionMismatchError share a kind because both mean "the version is
          wrong"; IdentityError is separate because its remedy is different —
          fix the manifest versus retag the repository — and a consumer
