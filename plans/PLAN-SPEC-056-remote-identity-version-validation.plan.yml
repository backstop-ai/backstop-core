  - id: phase-13
    name: "Phase 13: Final verification — the whole module with race, the full gate, artifact validation, then reconcile the codebase map"
    tasks:
      - id: TASK-044
        type: verification
        title: "Full kill chain: rebuild, whole-module race suite, backstop gate, artifact validate"
        description: |
          THE FINAL KILL CHAIN. `backstop code check` DOES NOT EXIST
          (ISSUE-076) — do not run it.

          Run, in order, reading each command's TRUE exit code, and read every
          result:

            1. go build -o bin/backstop ./cmd/backstop
               NON-OPTIONAL. This plan changed both pkg/pack/distribution and
               cmd/backstop extensively; a gate run against a stale binary
               reports a verdict about code that is not in the tree and it
               looks exactly like a real green.
            2. go test ./... -race -count=1
               The WHOLE module, not the four packages the spec's test_command
               names. The identity gate reaches further than it looks: pkg/pack
               gained an export, pkg/packval gained a characterization test,
               and pkg/gate consumes installed packs by name.
            3. ./bin/backstop gate
               The full chain: pack lock verification, artifact validation,
               pack engines (backstop/self over this diff), test verification,
               substantiveness, coverage, contracts, status drift, requirement
               traceability, waiver resolution, baseline comparison, ledger
               integrity. ALL DIMENSIONS, NEVER FILTERED to what was touched.
            4. ./bin/backstop artifact validate --all
               This plan's own artifacts (PLAN-SPEC-056, SPEC-056) plus the
               corpus.

          COVERAGE. The spec's threshold is 80 at integration level over
          ./pkg/pack/distribution/... ./cmd/backstop/... ./pkg/packval/...
          ./pkg/pack/.... That is a FLOOR ON THE COMBINED PROFILE, not a
          per-package target, and identity.go must not benefit from it: it is
          new production code with a claim on every branch. Run
            go test <those four> -race -coverprofile=cover.out
            go tool cover -func=cover.out | grep identity.go
          and read it. A gap names a claim whose test is missing, not a
          threshold to lower.

          THE WAIVER LEDGER. Confirm the gate reports NO dangling waiver. The
          only waiver this plan interacts with is
          cmd/backstop/pack_upgrade.go's line-1 coverage token, which must
          still be on line 1 (`head -1` it) and must still be adjudicating.

          FINAL HONESTY CHECKS — answer each explicitly rather than assuming:
            - Does every use of a pack name to build a filesystem path, a
              backstop.yml key, a lock key, or an engine asset root read the
              MANIFEST name, with no surviving path from parsePackRef's first
              return to any of the four? (Review Question 1)
            - Is scratch-copy validation applied in all THREE validating
              commands and on BOTH the remote and the local branch? (Review
              Questions 3 and 4)
            - Does a validation failure quote the original coordinate or local
