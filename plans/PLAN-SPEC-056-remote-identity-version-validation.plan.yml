  - id: phase-6
    name: "Phase 6: Warnings []string on three result types and a stderr renderer on all four commands — landed BEFORE anything produces a warning"
    tasks:
      - id: TASK-019
        type: test
        title: "Write the failing carrier tests for AddResult, UpdateResult, UpgradeResult, and InstallResult"
        description: |
          Add to pkg/pack/distribution/result_warnings_test.go (new file):

            TestAddResult_CarriesWarnings (CLM-105)
            TestUpdateResult_CarriesWarnings (CLM-106)
            TestUpgradeResult_CarriesWarnings (CLM-107)
            TestInstallResult_CarriesReconciliationAndFallbackWarningsTogether (CLM-108)

          A FIELD ASSERTION ALONE IS NOT ENOUGH and must not be written that
          way. `result.Warnings = []string{"x"}; if result.Warnings[0] != "x"`
          tests the Go compiler. Each test must drive the COMMAND and require
          a warning the command PRODUCED to arrive on the result:

            CLM-105 — a divergent-name add (a mock cloner serving a pack whose
              manifest name differs from the ref) yields a non-empty
              AddResult.Warnings. This test stays RED until phase 8 wires the
              divergence diagnostic. THAT IS CORRECT AND EXPECTED: write it
              here, mark it t.Skip with an explicit "wired in TASK-027"
              message, and REMOVE the skip in TASK-027. Do not weaken it into
              a field test to make this phase green — a field test would still
              pass after someone deleted the diagnostic.

              (Same disposition for CLM-106/107: their producing paths land in
              TASK-035. CLM-108's producing path — install's fallback warning
              alongside its existing stale-lock warning — lands in TASK-031.)

            CLM-108 specifically requires BOTH KINDS AT ONCE: an install over a
            lock holding a stale entry AND a git entry with no
            source_coordinate must yield both the reconciliation warning and
            the coordinate fallback warning. An implementation that OVERWRITES
            Warnings rather than appending passes each kind alone and fails
            only this test.

          The carriers themselves are still what makes the file compile, so the
          suite is red on arrival for the right reason.
