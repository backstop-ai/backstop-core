          CLAUDE.md AUTO-LOADS it into every session, so a confidently wrong
          map misinforms every future agent. Verify each edit against the
          AS-BUILT code before writing; do not transcribe this description.

          FIVE EDITS:

          1. "## Pack lifecycle (`pack add <ref>`)" is FALSIFIED in its
             central claim. It currently describes the flow as
             `parsePackRef` → `resolveGitURL` → clone → "copy →
             .backstop/packs/<org>/<name>/". After this spec the install path,
             the backstop.yml key and the lock key all come from the MANIFEST
             name, and the flow gains ResolveEffectiveVersion before the clone
             and ValidateRemoteIdentity immediately after it. Rewrite the
             section around the gate.

          2. The "Common tail" in that same section must gain the SCRATCH-COPY
