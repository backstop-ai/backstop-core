          pack.yml declares, alongside the usual name / version 1.0.0 /
          engines / content shape copied from valid-pack:

            scaffolds:
              - id: <id>
                tier: complete
                path: <a directory that EXISTS in the fixture>
                test_command: ":"         ← EXACTLY this; see below
                sample_config:
                  <relPath>: "<contents>"
                use_when: [...]
                assumes: [...]
                pairs_with: { rules: [...] }

          FOUR CONSTRAINTS, EACH VERIFIED AGAINST THE CURRENT CODE:

          1. THE sample_config TARGET MUST NOT EXIST IN THE AUTHORED TREE.
             CLM-102 asserts exactly this. pkg/packval/phase3.go:145-169
             renders each entry to <packDir>/<scaffold.path>/<relPath>; if the
             file is already authored there, a rendered file is
             INDISTINGUISHABLE from an authored one and CLM-081/082's
             "validator writes do not reach the installed tree" assertions
             cannot fail.

          2. test_command MUST BE `:` — THE POSIX SPECIAL BUILTIN, NOT `true`.
             DefaultExecutor.RunScaffoldTest (executor.go:107-112) runs
             exec.Command("sh", "-c", testCommand) UNCONDITIONALLY for a
             tier:complete scaffold, and PackvalValidator supplies no executor
             (validator.go's runPackvalPipeline passes none on purpose), so a
             shell subprocess is UNAVOIDABLE on this path. The hermetic
             property is therefore "reaches no network and no toolchain or
             provisioned binary", NOT "spawns no process" — writing the claim
             the other way would be false by construction.

             "BUILTIN" IS NOT ENOUGH; IT MUST HAVE NO EXTERNAL COUNTERPART.
             CLM-103's mandated test asserts that exec.LookPath ERRORS on the
             command's first word, and `true` FAILS that assertion. Measured on
             the base system:

               LookPath("true") → "/usr/bin/true", err = nil     ✗ CLM-103 reds
               LookPath(":")    → "", err = not found in $PATH   ✓ CLM-103 passes

             `true` is a REGULAR builtin: the shell resolves it internally, but
             a real /usr/bin/true also exists, so LookPath finds it and the
             claim cannot hold. `:` is a POSIX SPECIAL builtin — resolved
             before any PATH search, with no external counterpart on any POSIX
             system (`/usr/bin/:` does not and cannot exist, since `:` is not a
             legal filename component in a command word the shell would search
             for). `sh -c ':'` exits 0, which is what the scaffold test needs.

             An earlier revision of this plan specified `true` on the premise
             that it was "the builtin". THAT PREMISE WAS FALSE and the fixture
             would have failed its own claim. Do not revert it, and do not
             substitute any other command without running LookPath against it
             first.

