            - Is there exactly ONE place a lock entry becomes a coordinate, and
              does pack update emit the fallback warning once rather than
              twice? (Review Question 8)
            - Do UpdateResult and UpgradeResult actually CARRY a Warnings
              field, and do pack update and pack upgrade actually RENDER it?
              The contracts gate checks that the symbols exist, not their
              shape — `type X $$$` in compile-signature.sh never compares a
              field list — so only the claims catch a warning that is computed
              and dropped. (Review Question 9)
            - Are all four commands rendering to stderr, with the stream claims
              driven through the BUILT BINARY rather than executeCommand's
