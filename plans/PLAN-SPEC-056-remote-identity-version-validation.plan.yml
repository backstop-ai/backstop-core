      - id: TASK-020
        type: test
        title: "Write the failing CLI renderer tests with genuinely separated cobra streams"
        description: |
          Create cmd/backstop/pack_warnings_render_test.go:

            TestPackAddCommand_RendersWarningsToStderr (CLM-109)
            TestPackInstallCommand_RendersWarningsToStderr (CLM-110)
            TestPackUpdateCommand_RendersWarningsToStderr (CLM-111)
            TestPackUpgradeCommand_RendersWarningsToStderr (CLM-112)

          DO NOT USE executeCommand. root_test.go:17-23 points SetOut AND
          SetErr at the SAME bytes.Buffer, so "renders to stderr" passes for a
          command that printed to stdout, and every one of these four claims
          would be vacuous. Build the cobra command directly and give it TWO
          buffers:

            cmd := newPackAddCommand(boolPtr(false))
            var out, errBuf bytes.Buffer
            cmd.SetOut(&out); cmd.SetErr(&errBuf)

          Then assert the warning text appears in errBuf and NOT in out. The
          negative half is the load-bearing half: a renderer that writes to
          BOTH satisfies the positive assertion alone.

          FOR install (CLM-110) the claim is specifically that the EXISTING
          loop at pack_install.go:32 MOVES from cmd.Printf (stdout) to
          cmd.ErrOrStderr(). Assert the stale-lock warning lands on stderr and
          the "Installed N packs" summary lands on stdout, so the move is
          pinned in both directions.

          FOR update and upgrade (CLM-111/112) the path renders NOTHING of the
          kind today. Say so in each test's comment — a reader who assumes a
          loop exists will look for a bug rather than adding the loop.

          THREE OF THE FOUR MUST BE SKIPPED IN THIS PHASE, AND THE REASON IS A
          MISSING SEAM RATHER THAN MISSING EFFORT. A renderer test needs a
          warning to EXIST before it can assert where the warning is printed.
          Only install produces one today (its reconciliation warnings —
          command.go:332/347/388), so only CLM-110 can be driven for real here.
          add, update and upgrade produce their first warnings in phase 8 and
          phase 10.

          AND A cmd/backstop TEST CANNOT MANUFACTURE ONE. All four RunE bodies
          assemble their command internally through a ZERO-ARGUMENT production
          constructor — newProductionAddCommand() (pack_add.go),
          newProductionUpdateCommand() (pack_update.go),
          newProductionUpgradeCommand() (pack_upgrade.go) — and none of them
          takes an injectable dependency. There is no seam through which a test
          can substitute a command whose result carries a warning. That is
          SPEC-055's design working as intended (production assembles its own
          dependencies), not a gap to fix here, and adding an injection seam to
          make three tests green early would dismantle the property SPEC-055
          exists to establish.

          SO: t.Skip CLM-109, CLM-111 and CLM-112, each naming the task that
          removes the skip — TASK-027 for add, TASK-035 for update and upgrade.
          DO NOT substitute a weaker assertion to avoid the skip. The two
          tempting forms are both vacuous and both forbidden by TASK-019's
          reasoning: reading the SOURCE to assert a rendering loop exists tests
          the file, not the behavior; asserting an EMPTY Warnings slice prints
          nothing passes against a command with no loop at all.

          EXIT CODES ARE UNCHANGED BY A WARNING. Each of the four asserts the
          command returned no error while emitting the warning. CLM-113
          re-asserts this end-to-end through the process exit code; asserting
          it here too localizes a regression to the renderer.

          LEAVE THE TWO MERGED-BUFFER TESTS ALONE.
          TestPackInstallCommand_PrintsStaleLockWarning (pack_install_test.go:26)
          and TestPackInstallE2E_StaleLockWarnsInstallsDeclared
          (pack_install_e2e_test.go:83) both read a merged buffer and both stay
          green through the stdout→stderr move. That is convenient and it is
          also the trap: their green is not evidence about streams.
        files:
          - cmd/backstop/pack_warnings_render_test.go
        claims:
