          (:101-277). REORDERED, NOT REWRITTEN — the pipeline's steps and its
          existing rollback closure survive; what changes is their order and
          which string they use.

          THE GIT BRANCH BECOMES:
            ResolveEffectiveVersion(packRef, opts.Version)   ← before any git
            → Clone at identity.Tag
            → ValidateRemoteIdentity(coordinate, effectiveVersion, tmpDir)
            → isPackInstalledAndCurrent(projectDir, identity.InstallName)
            → runValidationOnScratchCopy(...)
            → mutate

          THE ALREADY-INSTALLED-AND-CURRENT CHECK MOVES (currently :134-136,
          before the clone). It is keyed on the INSTALL name, which for a git
          source is not knowable until the manifest is read. CONSEQUENCE,
          DELIBERATE AND STATED IN THE SPEC'S SHARP EDGES: re-adding a current
          git pack now costs one shallow single-ref clone. The alternative —
          keying the short-circuit on the coordinate — would reintroduce
          exactly the coordinate-as-identity assumption this spec removes. Do
          not "optimize" it back.

          THE LOCAL BRANCH keeps its position (a local pack's manifest is
          readable without cloning) but routes its manifest read through
          ReadManifestIdentity, RETIRING the inline yaml.Unmarshal into
          map[string]interface{} at :770-779 inside resolveLocalPackSource.
          One implementation for both sources (CLM-038).

          REPLACE EVERY REMAINING USE of the parsePackRef-derived name with
          identity.InstallName, at all four sites:
            :162  installedPath := filepath.Join(projectDir, ".backstop", "packs", packName)
            :230  mergeResult.Merged[i].SourcePack = packName
            :239  updateBackstopYml(projectDir, packName, …)
            :251  lf.Packs[packName] = LockEntry{Name: packName, …}
          and AddResult.PackName, which is now the MANIFEST name — what the
          CLI's success line should have been printing all along.

          parsePackRef IS UNCHANGED IN SHAPE BUT DEMOTED IN MEANING: its first
          return is the source COORDINATE, never the pack name.
          ResolveEffectiveVersion should be its only caller that reads a
          version from it.

