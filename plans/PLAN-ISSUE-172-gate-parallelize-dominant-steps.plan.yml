  ★ READ THIS FIRST — THE INVESTIGATION CHANGED THE ANSWER.
  ══════════════════════════════════════════════════════════════════════════════

  ISSUE-172 asked a plan to pick between (A) in-process concurrency in
  `(*Gate).Run` and (B) CI-level parallel jobs, and told the plan to first do the
  investigation the issue itself declined to do: prove whether `pack_engines` and
  `coverage_threshold` are genuinely independent.

  That investigation was done (2026-08-19, findings and citations below). It
  produced TWO facts that neither the issue nor its two candidate approaches
  anticipated:

    1. THE INDEPENDENCE INFERENCE IS FALSE. `pack_engines` and `test_verification`
       share an unsynchronized mutable channel that `(*Gate).Run` structurally
       cannot see, and whose documented safety rests ENTIRELY on the sequential
       assembly order. Breaking that order does not error — it SILENTLY DOWNGRADES
       a `critical` `mandated_test_failed` violation into a non-blocking advisory.
       See CLM-002 / CLM-003.

    2. THE TWO DOMINANT STEPS ARE NOT TWO JOBS — THEY ARE THE SAME GO TEST SUITE,
       RUN TWICE. `go-test` and `go-coverage` each dispatch an independent
       whole-module `go test`. This is EXACTLY the ISSUE-068 double-run defect, in
       the one toolchain whose remediation that issue explicitly parked and nobody
       ever did. See CLM-005 / CLM-006.

  Both (A) and (B) parallelize REDUNDANT WORK. A third approach — call it (C) —
  DELETES it, for the same wall-clock win, at HALF today's CI compute, with ZERO
  change to `pkg/gate`, and with a proven reference implementation already shipped
  in a sibling pack.

  ── (C) — THE RECOMMENDED APPROACH ───────────────────────────────────────────
  Adopt the ISSUE-068 single-run convention in `backstop-ai/go-toolchain`:
  `go-test`'s command carries `-coverprofile=cover.out`, so ONE whole-module run
  emits both the test output AND the profile; `go-coverage`'s producer gains a
  reuse-if-fresh check and skips its redundant second suite run. This is a
  PACK-DATA change plus a producer-script change — no core orchestration touched.

  Projected effect on the measured CI run (32151610956): `coverage_threshold`
  612148ms -> near-zero (a parse of an existing file); `pack_engines` 629797ms ->
  roughly unchanged (its `go test` gains coverage instrumentation, which the
  measurement already shows costs ~0: the coverage step's instrumented run took
  612148ms against pack_engines' uninstrumented 629797ms MINUS ~17.6s of build and
  lint). Gate critical path ~20.7min -> ~10.6min. The same endpoint the issue
  projected for (A), obtained by removing work rather than overlapping it.

  ── WHY NOT (A) — IN-PROCESS CONCURRENCY ─────────────────────────────────────
  Three independent reasons, in descending order of force:

    · IT IS UNSAFE AS THE ISSUE IMAGINES IT. The issue's own caveat ("a step could
      still have a hidden dependency `Run` never sees") is CORRECT and the hidden
      dependency EXISTS — CLM-002. A bare parallel loop with a mutex-guarded
      `results` append, which is exactly what the issue proposes, fixes the append
      and leaves the real hazard untouched: `collectedVerdicts` is written by
      pack_engines and read by test_verification with no synchronization at all,
      and the consequence of losing the race is a SILENT ENFORCEMENT GAP, not a
      crash. `-race` would catch the race; nothing catches the silence.

    · THE SPEEDUP ARITHMETIC DOES NOT HOLD. `max(10.5, 10.2)` assumes the two
      steps are independent in RESOURCE terms. They are not: both saturate CPU
      running the SAME whole-module Go suite (which `go test` already parallelizes
      across packages up to GOMAXPROCS), on a shared runner. See CLM-009 — and
      note the citation trap recorded there: ISSUE-068's Problem section reads
      like empirical corroboration for this and ISSUE-068 ITSELF RETRACTED IT.
      Do not cite it.

    · IT IS THE WRONG FIX EVEN IF IT WORKED. Overlapping a duplicated suite run
      makes the duplication cheaper and therefore permanent. (C) removes it.

    (A) IS NOT PLANNED HERE. What this plan DOES deliver from the (A) line of
    inquiry is the finding itself, pinned as an executable regression guard
    (TASK-002), so that if anyone revisits in-process concurrency later, the
    ordering contract is stated in a test rather than in a comment.

  ── WHY NOT (B) — CI-LEVEL PARALLEL JOBS ─────────────────────────────────────
    · IT REINTRODUCES ISSUE-068 BY CONSTRUCTION. The issue flagged this as a
      hazard to check. Checked: it is not a hazard, it is a certainty. Two
      `backstop gate` invocations on two runners each dispatch their own
      whole-module `go test` (CLM-005), so the split PRESERVES the double run and
      merely pays for it on two machines — ~2x compute minutes for a wall-clock
      result (C) reaches at ~0.5x today's compute.
    · IT NEEDS A CORE MECHANISM THAT DOES NOT EXIST. CI runs exactly ONE gate
      invocation (`.github/workflows/ci.yml:195`, ISSUE-099's collapse, shipped
      hours ago). There is no `--only <dimension>` flag and no dimension-subset
      scope; inventing one is a larger core change than (A), in the same
      enforcement-critical surface, with a new silent-narrowing failure mode of its
      own (a dimension that lands in neither job gates nothing and says nothing).
    · IT COMPLICATES A SURFACE JUST SIMPLIFIED. ISSUE-099 spent this session
      collapsing two gate invocations into one. Splitting back into two, days
      later, for a worse outcome, would be churn.

  ── WHAT IS AND IS NOT A FOUNDER CALL ────────────────────────────────────────
  The choice between (A) and (B) is NOT a taste call and this plan does not defer
  it: the investigation produced a technical fact (the double run) that dominates
  both. What IS founder-owned, and what this plan STOPS for, is TWO things:

    GATE 1 (TASK-001, phase 1) — the REDIRECT itself. ISSUE-172 is titled and
      framed as a parallelization issue; this plan answers it with de-duplication.
      That is a change in what the issue is about, it lands in the permanent
      record, and it decides whether ISSUE-172 CLOSES on (C) or stays open for a
      residual. Phase 2 must not begin without an explicit go.

    GATE 2 (TASK-008, phase 4) — PUBLISHING the pack. Tagging and pushing
      `backstop-ai/go-toolchain` v1.7.0 is an irreversible act against a public
      repo that other consumers install from. TASK-007 commits locally and STOPS;
      TASK-008 must not start without explicit authorization.

  Both gates are TASK BOUNDARIES, not paragraphs (the PLAN-ISSUE-157 convention).

