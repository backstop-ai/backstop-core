  ══════════════════════════════════════════════════════════════════════════════
  DESIGN OF THE FIX — the exact shape TASK-005 implements
  ══════════════════════════════════════════════════════════════════════════════
  Three edits, mirrored (NOT copied — CLM-013) into the pack source and the core
  fixture:

  (1) `pack.yml`, `go-test` engine — the command gains the profile flag:
        command: go test -coverprofile=cover.out
      The dispatch appends the target itself (`./...` in project scope, narrowed
      packages in file scope — CLM-011), so the flag goes on the COMMAND, never a
      hardcoded `./...`. `go-coverage`'s own `command:` is UNCHANGED — its
      producer replaces the invoked tool anyway, so editing it would be noise.

  (2) `scripts/test-produce.sh` — write a STAMP after a whole-module run:
      after `go "$@" 2>&1`, capture `status=$?` FIRST (CLM-012 — this is the
      catastrophic line), then, ONLY when the argument list contains the literal
      `./...` AND `cover.out` now exists, `mkdir -p .backstop` and truncate the
      stamp `.backstop/go-coverage-fresh`; finally `exit "$status"`.
      THE `./...` CONDITION IS THE WHOLE POINT: a file-mode run produces a PARTIAL
      profile (CLM-011) and must NOT stamp it as reusable.

  (3) `scripts/coverage-produce.sh` — reuse if stamped, else behave exactly as
      today. Before the existing `go test -coverprofile=... || true` line:
      reuse only when the stamp exists AND `cover.out` exists AND `cover.out` is
      not older than the stamp (`[ ! cover.out -ot <stamp> ]`); in every other
      case run the tool as today. EITHER WAY, REMOVE THE STAMP before continuing.
      Everything downstream of that line — the `#backstop-module`,
      `#backstop-gofile` and `#backstop-coverage-exclude` enrichment — is
      UNCHANGED and still runs, because the convert depends on it.

      WHY CONSUME-ONCE IS BETTER THAN THE TS PRECEDENT. The TS reuse check
      compares two files that could BOTH be stale from an earlier run, and would
      then reuse a stale summary. Deleting the stamp makes reuse structurally
      impossible without a test run in THIS invocation having written it: no
      stamp, no reuse, fall back to running the tool. The degraded path is
      slow-but-correct, exactly as the precedent says.

      RESIDUAL, STATED HONESTLY: a crash between the stamp write and the coverage
      step leaves a stamp on disk that a LATER coverage-only invocation could
      honour against a matching-age `cover.out`. The window is one gate
      invocation, the profile in question is a real whole-module profile, and the
      consequence is a slightly-stale coverage number rather than a suppression.
      Accepted; recorded here rather than engineered away.

  ══════════════════════════════════════════════════════════════════════════════
  SHARP EDGES
  ══════════════════════════════════════════════════════════════════════════════
   1. THE EXIT-STATUS LINE (CLM-012). `test-produce.sh` currently ENDS on the tool
      invocation. Appending anything after it changes what the script's status is.
      Capture `$?` immediately and `exit "$status"` last. A `|| true`, a bare
      trailing command, or an `exit 0` turns every failing suite GREEN — the worst
      possible outcome of this plan, and invisible.
   2. DO NOT SYNC THE FIXTURE TO THE SOURCE (CLM-013). Two independent edits, same
      semantics. A copy silently renames the pack, jumps its version and imports a
      feature the fixture deliberately lacks.
   3. THE FIX MAKES THE STAMP FILE PART OF THE CONTRACT. `.backstop/` is
      gitignored (`.gitignore:41-43` covers `packs/`, provenance and baseline);
      confirm the new stamp path is ignored too and add a line if not. A tracked
      stamp would make every gate run dirty the tree.
   4. `cover.out` IS ALREADY GITIGNORED (`.gitignore:30` `/cover.out`, `:32`
      `/cover*.out`) and CI already uploads it as an artifact
      (`.github/workflows/ci.yml`, the gate-report upload). Having `go-test` write
      it changes WHO writes it, not whether it exists. No CI edit needed.
   5. A FAILING SUITE STILL PRODUCES A PARTIAL PROFILE, BOTH BEFORE AND AFTER.
      Today `coverage-produce.sh` tolerates a non-zero exit (`|| true`) and parses
      whatever profile exists; after the change the reused profile comes from the
      same failing run. Behaviour is equivalent — say so, do not "improve" it here.
   6. VERSION RESOLUTION IS GIT-TAG-BASED. A `pack.yml` version bump with no
      matching `v<version>` tag pushed will NOT resolve via `pack update`. The bump
      (TASK-005), the commit (TASK-007) and the tag+push (TASK-008) are three
      different acts and only the last one makes the version installable.
