  Design decisions taken by this plan (reviewer to rule; see also task text):
    D-1 Engine-error marker. Each failed engine becomes
        gate.Violation{Rule: gate.StepPackEngines, Severity: "error",
        File: "", ProjectWide: true, Message: <today's wrapped error text>}
        and SourcePack deliberately EMPTY (the Message already names the pack
        and engine). Rule = the step's own rule name (as the issue directs)
        keeps it distinct from namespaced pack-rule findings. SourcePack must
        stay empty because gate.FormatHuman (pkg/gate/output.go:130-131)
        prefixes Rule with SourcePack, which would render
        "[org/pack/pack_engines]" (the namespaced pack-rule shape engine
        errors must stay distinct from) and would add source_pack to JSON
        output; with it empty the human row renders "[pack_engines] <msg>"
        exactly as today's synthetic violation does. ProjectWide: true is the
        scope-filter exemption, reusing the documented dispatchAdvisory
        precedent (pack_gate.go:1027-1056: a core-emitted dispatch decision
        not attributable to one scoped file); it is json:"-" and outside
        baseline identity. FilterViolations is NOT modified.
    D-2 Aggregate error. errors.Join over each wrapped engine error in dispatch
        order; signature (packEngineDispatchResult, error) unchanged. With a
        single failure err.Error() is byte-identical to today, and errors.As
        (e.g. *check.ConfigError) still resolves through the join.
    D-3 The failing engine's own partial output is discarded (today's
        behavior for that engine); only its NativeSandboxApplied bit is kept.
    D-4 configErrorDiagnostic: for each ConfigErr step, if ANY violation has
        Rule == step.StepName, render Reason plus only those violations'
        messages (dispatch order); otherwise render exactly as today. Generic
        on the step's own rule name, no baked step literal; steps whose
        config-error violations use other rule names (e.g. traceability
        polarity "<dim>_broken_declared", pkg/gate/traceability_polarity.go
        :244/:258) are unaffected.
    D-5 Verdict collector (ISSUE-118): NOT published on the error path. The
        consuming step (test_verification) runs after pack_engines and is
        always skipped by the ConfigErr halt, so a partial publish is
        unobservable today; publishing would only matter once the deferred
        halt question is decided, and should be decided with it. Recorded as
        a code comment; no test (nothing observable to pin).
    D-6 Seam fallback. If the pack_engines caller gets err != nil but no
        returned violation carries Rule == gate.StepPackEngines (e.g. a seam
        stub returning (nil, err)), it appends today's synthetic
        {Rule: pack_engines, Message: err.Error(), Severity: error} so the
        step never fails without naming its error.
    D-7 Fail-whole callers (substantiveness gate.go:1510-1524, contract entry
        gate.go:1944-1946) need no behavioral edit: each already returns on
        err without reading the violations. They get an explicit comment and
        a guard test each. Note: within the substantiveness dispatch, engines
        AFTER a failing one now also execute (results still discarded); the
        step outcome is unchanged.

  Acceptance claims defined here because ISSUE-209 has no formal CLM array:
    CLM-001: dispatchPackEnginesWithEvidence continues past a failed engine of
      any kind (findings engine, sandbox engine, registry-lookup failure):
      every later engine in the same pack and every later pack is still
      dispatched, and findings from engines before AND after the failure are
      returned in result.Violations alongside a non-nil error.
    CLM-002: each failed engine is recorded as its own engine-error violation
      with the D-1 shape (Rule pack_engines, Severity error, File "",
      ProjectWide true, SourcePack empty, so human output renders
      "[pack_engines] <msg>" and JSON carries no source_pack) and a Message
      equal to today's wrapped text
      ("dispatching findings engine %q for pack %s: ...", "dispatching
      sandbox engine %q for pack %s: ...", "pack %s: <lookup error>"). The
      returned error is the D-2 aggregate; for one failure err.Error() is
      byte-identical to today and errors.As still finds *check.ConfigError.
      The failing engine's own partial output is not included (D-3).
    CLM-003: output is deterministic: violations (findings and engine-error
      violations interleaved) appear in dispatch order, pack order then
      per-pack rule-declared engine order; no sorting or de-duplication; real
      findings' identity fields (Rule, File, Message, Severity, SourcePack)
      are unchanged by an unrelated engine's failure.
    CLM-004: NativeSandboxApplied is the OR across every engine that ran,
      including engines after a failure, and survives the registry-lookup
      failure path (which today returns an empty result).
    CLM-005: the pack_engines step (gate.go:1179-1185), on dispatch error,
      reports the preserved violations after activeScope.FilterViolations
      (out-of-scope non-exempt findings dropped, ProjectWide findings kept,
      engine-error violations always kept via D-1), falls back per D-6, and
      keeps Status "fail" and ConfigErr true so Gate.Run exits 2. The verdict
      collector is not published on this path (D-5). Preserved findings are
      informational only: no baseline grandfathering, no waivers (ConfigErr
      halt and ApplyPolicy's ConfigErr skip are unchanged).
    CLM-006: substantiveness stays fail-whole: when the dispatcher (or seam)
      returns violations alongside an error, the step emits exactly one
      violation {Rule: test_substantiveness, Message prefixed
      "dispatching substantiveness pack: ", Severity error}, Status fail,
      ConfigErr true, and no hollow-conversion or Q2 noTarget violation.
    CLM-007: the contract-entry call (dispatchContractEntryWithSandbox,
      gate.go:1944-1946) still fails whole: an engine error returns a non-nil
      error and a zero ContractEngineResult (Matched false, Scanned false),
      never reading the engine-error violation now present in the result as
      a match. The contract loop is unchanged (deferred).
    CLM-008: configErrorDiagnostic (cmd/backstop/baseline.go:322-340) follows
      D-4: a pack_engines ConfigErr step carrying preserved findings renders
      only its engine-failure messages; steps without a Rule == StepName
      violation render exactly as today; the three existing diagnostic tests
      and TestRunBaselineGenerate_SurfacesTheGatesOwnConfigErrorAndRefusesToWrite
      stay green unmodified.
    CLM-009: existing coverage is kept honest: the three error-path tests that
      assert zero violations are strengthened (not weakened) to assert zero
      FINDING violations and exactly one engine-error violation; every other
      direct wrapper caller, WithEvidence caller and seam stub is unmodified
      and green; stale comments listed in the issue are corrected.

