          ast-grep/to-sarif.sh, Provision: pinned}) so registering a new engine is a
          declaration, not an executor edit. The package must import none of pkg/check,
          pkg/packval, or cmd/backstop so all three can import it without a cycle.
        files:
          - pkg/pack/engine/binding.go
          - pkg/pack/engine/registry.go
        claims:
          - "CLM-033: EngineBinding lives in pkg/pack/engine importable without an import cycle"
          - "CLM-034: EngineBinding field shape with optional convert+provision and no format"
          - "CLM-021: no format selector on EngineBinding"
          - "CLM-044: input_mode config-file value"
          - "CLM-045: input_mode rule-flags value"
          - "CLM-046: input_mode rule-dir value"
          - "CLM-047: input_mode none value"
          - "CLM-048: unrecognized input_mode value is a blocking config error"
          - "CLM-020: unknown engine name fail-loud lookup"
        depends_on:
          - TASK-002
      - id: TASK-004
        type: verification
        title: "Verify EngineBinding leaf package via backstop code check"
        description: |
          Run `backstop code check` over the new pkg/pack/engine package to confirm
