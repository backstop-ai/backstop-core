      - id: TASK-002
        type: test
        title: "Write tests for EngineBinding, InputMode, Provision, Registry, and no-import-cycle"
        description: |
          Write failing tests for the new leaf package pkg/pack/engine covering:
          the EngineBinding shape (Command, InputMode, InputFlag, ScopeKind, optional
          Convert, optional Provision, and explicitly NO Format field); the InputMode
          enum's four values and ParseInputMode's fail-loud on an unknown value; the
          Provision descriptor (empty for assumed-present, pinned for introduced);
          the Registry seeding semgrep/ast-grep/sandbox/config-file and fail-loud
          lookup of an unknown engine; ScopeKind being the engine package's own int
          type that mirrors but does not import pkg/check.ScopeKind; and a guard that
          the package imports none of pkg/check, pkg/packval, or cmd/backstop.
        files:
          - pkg/pack/engine/binding_test.go
        claims:
          - "CLM-033: EngineBinding lives in pkg/pack/engine importable without an import cycle"
          - "CLM-034: EngineBinding carries command/input_mode/input_flag/scope_kind/optional convert+provision and no format"
          - "CLM-021: EngineBinding has no format field; findings output always parsed as SARIF"
          - "CLM-044: input_mode config-file value"
          - "CLM-045: input_mode rule-flags value"
          - "CLM-046: input_mode rule-dir value"
          - "CLM-047: input_mode none value"
          - "CLM-048: unrecognized input_mode value is a blocking config error"
          - "CLM-020: unknown engine name is a fail-loud config error, not a silent skip"
        depends_on:
          - TASK-001
      - id: TASK-003
        type: implementation
        title: "Implement pkg/pack/engine binding, InputMode enum, Provision, and Registry"
        description: |
          Create pkg/pack/engine/binding.go implementing EngineBinding
          {Command, InputMode, InputFlag, ScopeKind, Convert?, Provision?} with no
          Format field; the InputMode string enum (config-file, rule-flags, rule-dir,
          none) plus ParseInputMode returning a fail-loud error on unknown input;
          the Provision struct (pinned install descriptor, empty for assumed-present);
          a parallel ScopeKind int type mirroring pkg/check.ScopeKind without importing
          it; and the Registry (map[string]EngineBinding) seeding the built-in
          semgrep/ast-grep/sandbox/config-file bindings with fail-loud lookup of an
          unknown engine. The ast-grep binding is seeded here as a first-class built-in
