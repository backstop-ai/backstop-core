        files:
          - pkg/pack/engine/binding.go
          - pkg/pack/engine/registry.go
          - pkg/pack/engine/binding_test.go
        claims:
          - "Verifies CLM-033, CLM-034, CLM-021, CLM-020, CLM-044..CLM-048 for the engine leaf package"
        depends_on:
