  - id: phase-4
    name: "Phase 4: Clean stdout capture (runner + sandbox)"
    tasks:
      - id: TASK-008
        type: test
        title: "Write tests for RunStdout and SandboxedRunStdout clean-stdout capture"
        description: |
          Write failing tests covering: the CommandRunner gaining a stdout-only
          RunStdout method whose returned bytes are uncontaminated by stderr (a
          command writing a banner to stderr yields clean stdout); and a clean-stdout
          sandbox capture variant (SandboxedRunStdout) that returns only the
          executable's stdout so a converter writing a banner/warning to stderr still
          yields parseable bytes on stdout. Assert the existing CombinedOutput-based
          Run / SandboxedRun remain present and unchanged for the build/test and
          exit-code sandbox-validator paths (additive, not a global swap).
        files:
          - pkg/check/runner_stdout_test.go
          - pkg/packval/sandbox_stdout_test.go
        claims:
          - "CLM-028: dispatch runner returns stdout uncontaminated by stderr"
          - "CLM-065: convert step uses the clean-stdout sandbox variant, never CombinedOutput"
        depends_on:
          - TASK-001
      - id: TASK-009
        type: implementation
        title: "Implement RunStdout and SandboxedRunStdout"
        description: |
          Add a stdout-only RunStdout method to the CommandRunner interface in
          pkg/check/runner.go, implemented on ExecCommandRunner via cmd.Output() / an
          explicit stdout buffer rather than CombinedOutput(); leave the existing Run
          (CombinedOutput) method untouched so build/test executors do not regress.
          Add SandboxedRunStdout to pkg/packval/sandbox.go: a clean-stdout variant of
          SandboxedRun using the same sandbox trust model but capturing only stdout via
          an explicit stdout buffer, leaving the CombinedOutput-based SandboxedRun in
          place for the exit-code sandbox-validator path.
        files:
          - pkg/check/runner.go
          - pkg/packval/sandbox.go
        claims:
          - "CLM-028: RunStdout returns stdout uncontaminated by stderr"
          - "CLM-065: SandboxedRunStdout clean-stdout variant for the convert step"
        depends_on:
          - TASK-008
      - id: TASK-010
        type: verification
        title: "Verify clean-stdout capture additions via backstop code check"
        description: |
          Run `backstop code check` over pkg/check and pkg/packval to confirm
          RunStdout and SandboxedRunStdout build and pass and that existing
          CombinedOutput callers remain green.
        files:
          - pkg/check/runner.go
          - pkg/packval/sandbox.go
          - pkg/check/runner_stdout_test.go
          - pkg/packval/sandbox_stdout_test.go
        claims:
          - "Verifies CLM-028 and CLM-065 for the clean-stdout capture additions"
        depends_on:
          - TASK-009

  - id: phase-5
    name: "Phase 5: Group-by-engine gate dispatch"
    tasks:
      - id: TASK-011
        type: test
        title: "Write tests for dispatchPackEngines: grouping, input_mode gathering, provisioning, parser resolution"
        description: |
          Write failing tests for the new dispatchPackEngines path covering: grouping
          a pack's rules by declared engine and running each engine once via the
          EngineBinding table; a newly registered binding dispatching without editing
          the executor switch; input gathering per input_mode (config-file appends
          the single optional pack config or nothing; rule-flags repeats input_flag
          per rule file; rule-dir collects files into one dir passed once; none injects
          nothing) resolved relative to the per-engine pack dir; a missing declared
          input path failing loud naming pack and path; the parser resolving only
          parseSarif via lookupParser with no golangci-json/eslint-json reference; an
          unknown engine failing loud; split provisioning (empty Provision Layer-0 fails
          loud when binary absent and is never installed; pinned Provision routed
          through VerifyLock/backstop.lock; EnsureSemgrep's bespoke install retired);
          and dispatch replacing the mergePackRules/ExtraSemgrepConfigs feeder.
          The retirement assertion lives in pkg/check (provision_retired_test.go):
          assert EnsureSemgrep's bespoke installer in pkg/check/semgrep.go is removed
          (or reduced to routing through the declared provision mechanism) and that the
          semgrepExecutor/SemgrepEnsurer install wiring in pkg/check/check.go and
          pkg/check/registry.go no longer performs a bespoke install, so an executing
          agent cannot satisfy CLM-043 by merely not calling EnsureSemgrep from the new
          gate path while leaving the installer intact.
        files:
          - cmd/backstop/dispatch_engines_test.go
          - cmd/backstop/dispatch_inputmode_test.go
          - cmd/backstop/dispatch_provision_test.go
          - pkg/check/provision_retired_test.go
        claims:
          - "CLM-002: gate groups rules by declared engine and runs each engine once"
          - "CLM-003: a newly registered EngineBinding dispatches without editing the executor switch"
          - "CLM-019: dispatch resolves the SARIF parser via lookupParser and owns no engine enumeration"
          - "CLM-031: dispatch replaces mergePackRules/ExtraSemgrepConfigs with group-by-engine execution"
          - "CLM-035: build/test passes retain ToolchainEntry.Format and do not route through parseSarif"
          - "CLM-036: pack engine dispatch resolves only parseSarif, never golangci-json/eslint-json"
          - "CLM-039: config-file engine runs the tool's own rules tuned by an optional pack config"
          - "CLM-040: adding a config-driven linter is a declaration with no new dispatch Go"
          - "CLM-041: Layer-0 engine with empty provision fails loud when binary absent, never auto-installed"
          - "CLM-042: backstop-introduced engine with pinned provision is provisioned/verified via the lock path"
          - "CLM-043: EnsureSemgrep's bespoke install logic retired into the declared provision mechanism"
          - "CLM-044: input_mode config-file gathering"
          - "CLM-045: input_mode rule-flags gathering"
          - "CLM-046: input_mode rule-dir gathering"
          - "CLM-047: input_mode none gathering"
          - "CLM-049: engine inputs resolved relative to the per-engine pack directory"
          - "CLM-050: missing declared input path is a blocking broken-pack error naming pack and path"
        depends_on:
          - TASK-001
          - TASK-002
      - id: TASK-012
        type: test
        title: "Write tests for the convert pipe and the sandbox/none exit-code terminal branch"
        description: |
          Write failing tests for the SARIF convert pipe and the exit-code branch:
          engine stdout piped to the convert executable's stdin with its stdout becoming
          the SARIF input; the convert executable resolved relative to the pack dir and
          run sandboxed via the clean-stdout SandboxedRunStdout (not CombinedOutput); an
          empty convert sending engine stdout directly to parseSarif with no pipe; a
          SARIF-native engine parsing directly with empty convert; non-SARIF output
          reaching parseSarif without conversion failing loud with engine/pack
          provenance; an engine stderr banner not corrupting SARIF on stdout; a convert
          script stderr banner not corrupting SARIF on its stdout; and the sandbox /
