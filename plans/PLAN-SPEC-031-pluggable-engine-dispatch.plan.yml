---
plan_id: PLAN-SPEC-031
spec_id: SPEC-031
spec_version: 1.0.0
created: "2026-06-16"
status: draft
target_module: cmd/backstop
test_command: "go test ./cmd/backstop/ ./pkg/check/ ./pkg/pack/ ./pkg/pack/engine/ ./pkg/packval/ -race -coverprofile=cover.out -v"
coverage_threshold: 80

notes: |
  Implements SPEC-031 (BUNDLE-010 pillar 1, Spec Seed 2): first-class `engine`
  field + EngineBinding table dispatch replacing the implicit layer==2 ⇒ semgrep
  routing. Gate-time locus (locus A) only; fixture-time (pkg/packval) is SPEC-032,
  packs-only removal is SPEC-030, BUNDLE-009 seam is SPEC-033.

  Build order is dictated by the import graph and the flag-day migration sharp edge:
    1. The leaf `pkg/pack/engine` package (EngineBinding/InputMode/Provision/Registry)
       lands first because pkg/pack, pkg/check, and cmd/backstop all import it.
    2. Manifest `engine` field + `layer` retirement + engine-keyed field-contract
       validation, and the clean-stdout capture (runner + SandboxedRunStdout), are
       independent of each other and run as disjoint parallel phases.
    3. Group-by-engine dispatch (dispatchPackEngines) consumes all of the above:
       input gathering by input_mode, the sandboxed convert pipe, the sandbox/none
       exit-code terminal branch re-keyed from rule.Layer==3, split provisioning.
    4. ast-grep wired end-to-end with a fixture proof rule + stub converter, and the
       flag-day go-pack migration (engine: semgrep, retain standard, no grandfather)
       proven against the migrated reader via fixtures.

  Sharp edges addressed by task ordering:
    - Flag-day migration (no safety net, N=1): the manifest reader change (engine
      required, layer key removed, no layer:2→semgrep alias) and the migration
      proof land together; a layer-only rule reaching the migrated reader is a
      blocking ConfigError (TASK in phase 3 + proof in phase 6).
    - layer-3 sandbox branch must move, not break: dispatchPackEngines folds in
      runPackValidators' branch re-keyed from rule.Layer==3 to engine==sandbox,
      preserving single-file/multi-file fan-out and SandboxedRun (CombinedOutput).
    - convert capture corruption: the convert step uses SandboxedRunStdout
      (clean stdout) so a converter's stderr banner cannot interleave into SARIF;
      legacy CombinedOutput SandboxedRun is retained only for the exit-code branch.
    - leaf-package cycle: pkg/pack/engine imports none of check/packval/cmd, and
      ScopeKind is a parallel int type mirroring (not importing) pkg/check.ScopeKind.
    - sandbox/none must never enter parseSarif; unknown engine / unknown input_mode
      are fail-loud config errors, never silent skips or inferred fallbacks.

phases:
  - id: phase-1
    name: "Phase 1: Engine dispatch test fixtures"
    tasks:
      - id: TASK-001
        type: setup
        title: "Scaffold engine-organized pack fixtures and stub converter scripts"
        description: |
          Create testdata fixtures under cmd/backstop/testdata that exercise the
          full engine dispatch path without a live ast-grep/semgrep binary:
            - an engine-organized pack with per-engine dirs (semgrep/, ast-grep/,
              linter/, scripts/) and rules declaring `engine` (no `layer`);
            - a trivial ast-grep proof rule plus a stub stdin->SARIF converter
              script (ast-grep/to-sarif.sh) that emits canned SARIF on stdout and a
              banner on stderr (to prove clean-stdout capture);
            - a mixed-engine pack (semgrep + ast-grep rules) for cross-feed checks;
            - a pack with a missing declared input path (broken-pack fixture);
            - a legacy `layer: 2`-only rule fixture (no `engine`) for the
              no-grandfather migration proof.
          These fixtures back the dispatch, convert, input_mode, layout, and
          migration claims and are consumed by tests in later phases.
        files:
          - cmd/backstop/testdata/engine-dispatch/backstop.yml
          - cmd/backstop/testdata/engine-dispatch/backstop.lock
          - cmd/backstop/testdata/engine-dispatch/.backstop/packs/test-org/engine-pack/pack.yml
          - cmd/backstop/testdata/engine-dispatch/.backstop/packs/test-org/engine-pack/ast-grep/to-sarif.sh
          - cmd/backstop/testdata/engine-dispatch/.backstop/packs/test-org/engine-pack/scripts/check.sh
        claims:
          - "CLM-030: ast-grep proof rule fixture for end-to-end dispatch"
          - "CLM-027: ast-grep pack ships its own stdin->SARIF converter script"
          - "CLM-032: mixed semgrep+ast-grep pack fixture for cross-feed checks"
          - "CLM-038: legacy layer-2-only rule fixture for no-grandfather proof"
          - "CLM-050: missing declared input path broken-pack fixture"
        depends_on: []

  - id: phase-2
