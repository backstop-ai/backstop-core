notes: |
  Implements ISSUE-026 — `pack add <local-path>` conflates "the pack NAME is already
  declared in backstop.yml" with "already installed and up to date" (a FALSE equivalence),
  so a pack that is DECLARED but NOT materialized on disk (or whose lock is diverged/missing)
  makes `pack add` short-circuit — no install, no lock update, no honest output — instead of
  installing it. This is the last launch-critical piece of DIR-017 distribution work; its
  sibling ISSUE-025 (commit 83fb200) already shipped the install materialization path, the
  reusable `materializeLocalPack` helper, and `LockEntry.LocalPath`. Two downstream projects
  are about to depend on `pack add`/install actually working, so the acceptance is a REAL
  end-to-end against the CLI, not a stub. REUSE 025's work — do NOT reimplement materialization.

  ─────────────────────────────────────────────────────────────────────────────
  TREE VERIFICATION (read 2026-07-09 — current post-025 code, line numbers may drift)
  ─────────────────────────────────────────────────────────────────────────────
  THE DEFECT — pkg/pack/distribution/add.go:
    • `isPackInstalled(projectDir, packName)` (~line 311) reads backstop.yml ONLY and returns
      `_, exists := yml.Packs[packName]`. It keys off MANIFEST MEMBERSHIP, never checking
      whether the pack is materialized on disk (`.backstop/packs/<name>/`) or whether the lock
      has a consistent entry. So "declared" ⇒ "installed" — the false equivalence.
    • The Add gate (~line 131): `if isPackInstalled(...) { return nil, fmt.Errorf("pack %s is
      already installed; use pack update or pack upgrade instead", packName) }`. When the pack
      is declared-but-absent-on-disk (or the lock diverged, as in the issue's `slotly/...` vs
      `backstop/...` rename), this ERRORS/short-circuits instead of installing. The rest of the
      Add pipeline below this gate ALREADY materializes correctly (copies packDir →
      `.backstop/packs/<name>/` at ~line 166, records `LockEntry.LocalPath` post-025 at
      ~line 261) — the ONLY thing standing between a declared-but-absent pack and a correct
      install is this over-eager gate. So the fix is to make the gate HONEST, not to
      reimplement the install/materialize (which 025 already made correct).

  ADJACENT DEFECT — empty version on local-pack success (cmd/backstop/pack_add.go:29):
    `cmd.Printf("Added %s@%s (hash: %s)\n", result.PackName, result.Version, result.ContentHash)`.
    Local packs have no semver (the isLocal branch never sets `version`), so the success line
    renders a bare trailing `@`: `Added backstop/go-standards@ (hash: ...)`. Fix is display-only:
    omit the `@version` when the version is empty (versionless local pack).

  ─────────────────────────────────────────────────────────────────────────────
  FIX DESIGN (reuse 025; minimal, honest):
    1. DISTINGUISH DECLARED FROM INSTALLED. Replace `isPackInstalled`'s manifest-membership
       check with a real installed-and-current predicate: the pack is INSTALLED only when its
       artifact is MATERIALIZED on disk (`.backstop/packs/<name>/` exists AND is non-empty) AND
       backstop.lock has a consistent entry for that name. A declared-but-absent pack, or one
       whose lock entry is missing/diverged, is NOT installed.
    2. WHEN DECLARED-BUT-NOT-INSTALLED → INSTALL IT. Let Add proceed through its EXISTING
       materialize/lock pipeline (which post-025 copies into `.backstop/packs/<name>/` and
       records `LockEntry.LocalPath`) — do NOT early-return, do NOT reimplement materialization.
       WHEN GENUINELY INSTALLED + CURRENT (on disk + lock consistent) → return an honest signal
       (AddResult gains `AlreadyCurrent bool`, nil error) so the CLI prints a clear
       "already installed and up to date" message; NEVER a silent zero-output exit 0 and NEVER
       the misleading "use pack update/upgrade" error for a pack that is not actually on disk.
    3. LOCAL-PACK SUCCESS LINE — omit the `@version` when version is empty (no bare `@`).

  ─────────────────────────────────────────────────────────────────────────────
  PREDATING-TEST REALIGNMENT (do this openly, do NOT work around it):
    pkg/pack/distribution/add_test.go:522 `TestPackAdd_AlreadyInstalledExitsNonZero` ENCODES
    THE DEFECT — it lists a pack in backstop.yml (NOT on disk) and asserts Add errors with
    "already installed". Under the fix that exact scenario (declared-but-not-materialized) must
    now PROCEED to install, not error. This stale test is realigned in TASK-001: the
    declared-but-absent case asserts a real install (materialize + lock), and a NEW genuinely-
    installed-and-current case asserts the honest no-op message. See MEMORY
    [[feedback_align_predating_artifacts]].

  ─────────────────────────────────────────────────────────────────────────────
  ACCEPTANCE (launch bar — REAL e2e, not stubbed):
    Reproduce the issue's exact scenario in a temp project: backstop.yml declares a local pack,
    `.backstop/packs/` empty (or lock diverged) → run the REAL `pack add <local-path>` → assert
    it MATERIALIZES the pack under `.backstop/packs/<name>/` (not a no-op), updates the lock,
    and prints a NON-EMPTY success line. PLUS: a genuinely-installed-and-current pack → honest
    "already installed" message (no silent no-op, no misleading error); the local-pack success
    line has NO bare `@`. Proven in Phase 3 against the REAL CLI, plus per-behavior units.

  ─────────────────────────────────────────────────────────────────────────────
  TOOLING NOTE: `backstop code check` was REMOVED from this repo (ISSUE-018) — do NOT prescribe
    it. Middle-phase verification uses `go test` (package-scoped) against the REAL Add API and
    pack CLI. The FINAL phase runs `backstop gate` (full kill chain over the .go changes:
    build/lint/test/semgrep/coverage/contracts) + `backstop artifact validate` (covers this
    plan artifact). All NEW code covered to 90%; errors handled explicitly (wrap with %w;
    `_ =` for genuine fire-and-forget cleanup). Any NEW package-level regex/map var must carry
    the `// nosemgrep: go.core.no-global-mutable-state` suppression the codebase uses (none is
    anticipated here). If constructor-injection touches struct literals, note the go-standards
    `.*cache.*`-regex false-positive quirk (hoist cache fields out of the literal) — not
    expected to arise in this change.

  ─────────────────────────────────────────────────────────────────────────────
  CLAIMS (this plan's own; issues carry no formal CLM-NNN):
    CLM-001 — the installed-and-current predicate (formerly `isPackInstalled`) distinguishes
              DECLARED from INSTALLED: it returns true ONLY when the pack is MATERIALIZED on
              disk (`.backstop/packs/<name>/` exists AND is non-empty) AND backstop.lock holds a
              consistent entry for that name — NOT on backstop.yml membership alone. A
              declared-but-absent pack, or one whose lock entry is missing/diverged, is NOT
              installed.
    CLM-002 — when a pack is DECLARED-BUT-NOT-INSTALLED (absent on disk or lock diverged), Add
              PROCEEDS through its existing materialize/lock pipeline (reusing 025's work —
              copies into `.backstop/packs/<name>/`, records `LockEntry.LocalPath`) so the pack
              dir + files genuinely land on disk and the lock is updated — never the old
              short-circuit no-op / misleading "use pack update" error.
    CLM-003 — when a pack is GENUINELY installed and current (on disk + lock consistent), Add
              returns an HONEST signal (`AddResult.AlreadyCurrent`, nil error) instead of a
              silent zero-output exit 0 or a misleading error; the predating
              `TestPackAdd_AlreadyInstalledExitsNonZero` (which asserted the defect) is
              realigned to the corrected behavior.
    CLM-004 — the local-pack success line no longer renders a bare trailing `@`: for a
              versionless local pack the `@version` is omitted (display-only, no behavior change).
    CLM-005 — the `pack add` CLI surfaces the honest already-installed message for a
              genuinely-current pack (never silent) and prints a real, non-empty Added line
              (with the corrected version display) when it materializes a declared-but-absent
              pack.
    CLM-006 — REAL end-to-end against the CLI: a temp project declaring a local pack with
              `.backstop/packs/` empty (or lock diverged) → real `pack add <local-path>`
              MATERIALIZES the pack under `.backstop/packs/<name>/`, updates the lock, and
              prints a non-empty success line; a genuinely-installed-and-current pack yields the
              honest message (no silent no-op); the local success line has no bare `@`.

