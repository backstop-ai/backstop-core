          Make TASK-001 pass (CLM-001, CLM-002, CLM-003), in add.go only.
          (a) Rework the installed check (rename `isPackInstalled` → e.g.
          `isPackInstalledAndCurrent(projectDir, packName)`): return true ONLY when
          `.backstop/packs/<name>/` exists AND is non-empty on disk AND backstop.lock (via the
