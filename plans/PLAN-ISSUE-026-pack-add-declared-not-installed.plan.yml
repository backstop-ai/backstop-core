          longer counts. Handle read/stat errors explicitly (a missing dir / unreadable lock ⇒
          not-current ⇒ proceed), no silent swallow (CLM-001).
          (b) At the Add gate (~line 131), when the pack is genuinely installed-and-current,
          return `&AddResult{PackName: packName, AlreadyCurrent: true}` with NIL error (honest
