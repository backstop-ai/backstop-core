          with NO `.backstop/packs/<name>/` on disk is NOT installed; a pack with an EMPTY
          `.backstop/packs/<name>/` dir is NOT installed; a pack whose disk dir exists but has
          NO matching backstop.lock entry (diverged/missing) is NOT installed; a pack that IS
          materialized on disk (non-empty) AND has a consistent lock entry IS installed. Assert
          via the observable Add outcome for each case (since the predicate is unexported).
          (2) Declared-but-not-installed → INSTALLS (CLM-002): with backstop.yml already
          declaring the pack name but `.backstop/packs/` empty (or the lock diverged), Add on
          the LOCAL pack source PROCEEDS — after it returns, `.backstop/packs/<name>/` exists
          with a representative file on disk, and the backstop.lock entry is written/updated
          (populated LocalPath). No error, no short-circuit.
          (3) Genuinely-installed-and-current → HONEST no-op (CLM-003): with the pack already
          materialized on disk AND a consistent lock entry, Add returns nil error and
          `AddResult.AlreadyCurrent == true` (does not re-copy / error). Assert AlreadyCurrent,
