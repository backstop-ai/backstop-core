  ── GAP 2 CONTRACT (pin the flag's grammar; do not improvise) ───────────────
    * `--param` is registered as a pflag StringArray, NOT StringSlice.
      StringSlice comma-splits its values, which would silently truncate
      `--param greeting=a,b` into two params. CLM-010 exists to fail that choice.
    * Read the flag INSIDE RunE via `cmd.Flags().GetStringArray("param")` rather
      than binding a captured variable. NewRootCommand() is constructed fresh per
      test; a captured var invites cross-invocation bleed and trips
      go.core.no-global-mutable-state if it is ever hoisted.
    * `key=value` splits on the FIRST `=` only, so a value may contain `=`.
    * An EMPTY value (`--param x=`) is legal and supplies the empty string — that
      is a supplied value, meaningfully distinct from unsupplied.
    * MALFORMED (no `=`, or an empty key) is a fail-loud *check.ConfigError
      (exit 2), naming the offending argument verbatim.
    * A DUPLICATE key is likewise a fail-loud ConfigError, not last-wins. A map
      write silently keeps the last; saying so out loud is the honest behavior
      and costs the operator nothing.
    * An UNDECLARED param name (not in the resolved recipe's `params:`) is a
      fail-loud ConfigError. JUDGMENT CALL, stated so the reviewer can weigh it:
      the founder Decision says only "threaded into ApplyOptions.Params," but
      without this check a typo (`--param app_nmae=x`) is silently dropped and
      resurfaces as an unresolvable-`{{ app_name }}` failure the operator cannot
      attribute — the SAME undiagnosable shape ISSUE-081 was filed about. It is
      implemented at the CLI layer ONLY, after ResolveRecipe and before Apply, so
      pkg/recipe.Apply and every SDLC-mediated library caller are UNCHANGED.
    * Exit-code placement follows runRecipeApply's existing documented split
      (recipe_apply.go:160-166): everything that happens BEFORE the apply is a
      ConfigError/exit 2 because nothing was applied and the INVOCATION is what
      must change. Every rejection above is pre-apply.
    * `effectiveParams` (apply.go:1157-1170) is NOT changed. Supplied params
      already override declared defaults, and a required-no-default param already
      has a supplied-value path — the CLI simply never populated it.

