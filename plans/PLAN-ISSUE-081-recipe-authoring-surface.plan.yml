    tasks:
      - id: TASK-006
        type: implementation
        title: "pkg/recipe/manifest.go — refuse a non-path `fragment:` on a merge op at parse time"
        description: |
          Make TASK-003's tests pass. Extend validateRecipeOps (manifest.go:
          168-220) with the fragment-form check, applied to `merge` ops only.

