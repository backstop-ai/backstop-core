              already landed by the time this task runs, `code` still validates,
              so `code` is correct either way.

              ENGINES — LOAD-BEARING, do not skip: runRecipeApply calls
              provisionedEngineBinding UNCONDITIONALLY (recipe_apply.go:190),
              before Apply and regardless of op family, and it requires EXACTLY
              ONE provisioned engine binding. A pack declaring none fails with a
              config error before the recipe ever runs. Declare the same single
              allowlisted ast-grep binding at the version
              engine.TrustedToolAllowlist() pins. The recipe below is create-only,
