              evidence. Keep the "this omission is a DECISION, not a gap"
              framing that the paragraph already carries.

            * MANIFEST-VALIDATION TABLE (spec:1157-1167). Add a row for op
              `fragment:` (merge): required on a merge op; must be a
              recipe-directory-relative path — an inline value, a `{{`
              placeholder, or an empty value is a fail-loud validation error
