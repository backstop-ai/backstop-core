  ── DECISION: WIDENING THE PARSE-TIME `{{` REJECTION ────────────────────────
  ISSUE-079's plan deliberately narrowed the parse-time placeholder rejection to
  `rule:` ALONE, PENDING this issue's decision — see PLAN-ISSUE-079:475-480 and
  the scope-guard comment at pkg/recipe/manifest_ruleplaceholder_test.go:18-24,
  which says in terms that widening the check "would decide that question
  silently." SPEC-054 records the same deferral at spec:212-213, spec:1110-1114,
