  THE DECISION HAS NOW LANDED, so the widening is sanctioned — but ONLY as far
  as the decision actually reaches:

    WIDEN TO `fragment:`  — YES. Under path-only canon, a fragment PATH is
      handed to resolveUnder verbatim and is never substituted (only the fragment
      FILE'S CONTENT is — apply.go:892, the spec matrix row that stays unchanged).
      A `{{` in `fragment:` is therefore GUARANTEED-DEAD syntax whose only
      possible outcome is an ENOENT at apply time. Rejecting it at parse is not a
      new policy: it is the direct consequence of the founder's "inline block =
      parse error with a clear message," whose whole purpose is to make the
      fragment form unambiguous at parse rather than at apply.

    WIDEN TO `payload:`   — NO. The founder Decision (issue:205-234) pins
      `fragment:` explicitly and is SILENT on payload, and the two fields are not
      in the same evidentiary position. Fragment had a live THREE-WAY
      contradiction (applier says path, spec says nothing, committed fixture says
      inline). Payload has none: apply.go's renderPayload resolves it under the
      recipe dir, every committed fixture declares it as a path, and no artifact
      disagrees. Deciding payload's templatability here would settle a question
      from the wrong place on no evidence — precisely the discipline ISSUE-079
      applied to fragment. The asymmetry is justified by evidence, not timidity,
      and it is stated in the spec (TASK-010) so the next reader can tell a
      decision from an oversight. `Op.Payload`'s form/templatability remains a
      RESIDUAL ISSUE-081 facet alongside Gap 3.

  The narrowed scope guard is what keeps this honest and falsifiable from below:
  manifest_ruleplaceholder_test.go's `templatedPayloadAndFragmentManifest` splits
  into a payload-only ACCEPT case (still parses clean) and a fragment REJECT
  case. A future uniformity refactor that widens to payload fails the accept
  case, exactly as the current guard was designed to.

  ── THE "NOT A PATH" PREDICATE (pin it; do not invent more) ─────────────────
  A `merge` op's `fragment:` is REFUSED at manifest validation when the declared
  value:
    1. is empty or whitespace-only        — a merge op cannot merge nothing, and
                                            the apply-time failure today is a
                                            bare "the op declares no path";
    2. contains a newline                 — a path never spans lines; this is the
                                            YAML block-scalar shape the committed
                                            `starter` and `second` fixtures use,
                                            i.e. the exact form the Decision
                                            names;
    3. contains the `{{` open delimiter   — dead syntax, per the widening
                                            rationale above.

  DELIBERATELY NOT REFUSED: a single-line, placeholder-free value that is really
  inline content but is syntactically a valid relative filename (e.g.
  `fragment: '{"a": 1}'`). Nothing at parse can distinguish that from a file
  named `{"a": 1}` without a CONTENT SNIFF — guessing at document syntax the
  manifest reader has no business knowing. Do NOT add a leading-`{`/`[` sniff.
  That residual case fails at APPLY, and CLM-004 requires that failure to name
  the path-only contract instead of leaking a bare ENOENT. Two layers, one canon,
  both stated.

  Scope of the check: `m.Ops` only, NOT variant ops — variants validate
  structurally only (manifest.go:166-167), and this plan does not change that.
  Do not add an escape-path (`../`) check either: resolveUnder already refuses
  escapes at apply, and widening there is not this issue's.

