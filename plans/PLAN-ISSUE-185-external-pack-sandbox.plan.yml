  ACKNOWLEDGEMENT CONTRACT. Linux uses a dedicated inherited control pipe, never
  stdout/stderr: the parent passes the write FD in the helper request/ExtraFiles; after
  PR_SET_NO_NEW_PRIVS, Landlock, and seccomp all succeed, the helper writes one fixed
  acknowledgement byte, closes the FD, then unix.Exec's the pack child. The parent
  reads the control pipe separately and sets true only for that byte. Setup failure,
  missing/malformed acknowledgement, or no sandboxed invocation yields false. Darwin
  runs the Backstop helper under sandbox-exec; once that helper is demonstrably inside
  the profile it writes/closes the same control FD before starting the pack child, so
  stdout/SARIF/coverage remain byte-clean. Unsupported platforms still refuse. The
  evidence is returned per invocation and OR-reduced; no global state is introduced.

  DARWIN TYPED HELPER COMPLETION. No shell trampoline, `/usr/bin/env` reconstruction,
  new helper production file, global/init, waiver, or coverage exclusion is introduced.
  sandbox_nonlinux.go remains `!linux` and portable. sandbox-exec re-execs the current
  Backstop/test binary with BACKSTOP_SANDBOX_HELPER_SPEC. On Darwin only, the existing
  MaybeRunSandboxHelper entry decodes that typed request, writes and closes the inherited
  acknowledgement FD, then launches the requested target with portable os/exec.Cmd from
  inside the already-applied Seatbelt profile. Cmd receives request.Command and Args
  through explicit fields, request.Dir directly, and the sanitized environment through
  direct Cmd.Env assignment. The pure check.WithoutEnvironment result still preserves
  duplicate/order exactly and remains tested as such. At process start, Go os/exec may
  apply its documented last-value behavior for duplicate keys; the plan does not promise
  impossible duplicate preservation across exec. Effective unrelated values survive and
  every BACKSTOP_PACK_SANDBOX duplicate is absent.
  Stdin/Stdout/Stderr are the helper process streams, so target output and status flow
  through unchanged. Resolve request.Command with exec.LookPath first, then construct
  exec.Command with the resolved path so bare PATH commands and observed argv[0] match
  the current Linux unix.Exec behavior; pathful names containing `=` remain direct data.
  After Wait, the helper returns a non-nil unexported typed completion error whose
  ExitCode() method carries the target code, including zero.

  MaybeRunSandboxHelper keeps its public `func() error` signature. Nil means “not a
  helper” (or Linux success never returned). Ordinary decode/ack/lookpath/start/wait
  setup errors retain diagnostic/exit 126 handling. cmd/backstop main/runWith and all
  three TestMain guards use errors.As against a small local
  `interface{ ExitCode() int }` before ordinary-error handling and return/os.Exit that
  code before Cobra/tests. The concrete completion error remains unexported; no public
  result type or signature changes. On non-Darwin non-Linux, helper env is a loud error
  and executes nothing; absent helper env is nil.

  Signal termination is helper/result plumbing under REQ-004, not confinement policy.
  Map to conventional 128+signal only when a portable signal number is available. When
  it is not, return one documented fixed fail-closed nonzero fallback and test that exact
  fallback. Do not promise exact signal propagation or add platform-specific files.

  The parent sandbox-exec command passes the ack writer through ExtraFiles, closes its
  copy after start, and reads exactly one byte plus EOF out-of-band. The Darwin helper
  closes the descriptor before target Start, so the target cannot retain it. Seatbelt is
  already installed around the helper and inherited by its os/exec child. Linux's helper
  policy/application/non-return behavior remains unchanged.

  SEATBELT LITERALS. Every dynamic path inserted into the Seatbelt profile goes through
  one internal encoder for Seatbelt string-literal syntax; raw `%s` path interpolation is
  forbidden. Quotes and backslashes are escaped, and control characters are either
  encoded with syntax proven against real sandbox-exec or rejected loudly before child
  execution when no accepted representation exists. An adversarial packDir can never
  terminate a `(subpath ...)` clause or inject allow network/write/read rights. This is
  profile encoding only and does not absorb ISSUE-147's separate relative-path defect.

  PRE-EXISTING DARWIN BLOCKER. The full cmd/backstop pack-backed gate executes
  TestPackAuthoringLoop_EndToEnd, which is RED solely because open ISSUE-147 passes a
  relative packDir to sandbox-exec. ISSUE-147 is unrelated, has no validated plan, and
