      branch is committed. Verified today: 70 declared paths, exit 0, no row needed.
  12. `./scripts/verify-public-product-model.sh` takes roughly 45 seconds and internally
      dispatches the content-inventory, content-topology, product-model, evidence-inventory,
      structural-verifier, and three page tests. Run it whole; do not shortcut to one stage.
  13. Never hand-edit the ISSUE-199 or PLAN-ISSUE-199 artifacts to make a check pass. Route any
      artifact evolution back through the purpose-built agents.

phases:
  - id: phase-1
    name: "Phase 1: RED — specify the landed lifecycle machine and the paper/ink chrome"
    tasks:
      - id: TASK-001
        type: test
        title: "RED: assert the lifecycle machine, its live vocabulary, and reference paper/ink"
        description: |
          Add named, mutation-proved bash test functions to the EXISTING
          `scripts/tests/public-product-model/pages/extend-reference-contributing.sh`, and call
          each one explicitly at the bottom of the file so it actually executes under
          `./scripts/verify-public-product-model.sh`. Follow the shipped idiom in that file and
          in its siblings: a parameterized validation helper, positive assertions against the
          real tree, then negative mutations proving the helper rejects them. Do not weaken,
          rename, reorder, or delete any existing assertion, including the `responsibilities`
          list, the eight `production_delete_reject` calls, and the trailing
          unmarked-consequential-addition proof.

          PRESERVE BYTE-FOR-BYTE the ART-003 needle
          ``Bundles progress through `idea`, `exploring`, `defined`, and `ready` `` and the
          ART-004 needle ``  `delivered_by` names a completed plan `` in both the
          `responsibilities` list and their `production_delete_reject` calls (CLM-004). The
          approved preview branch rewrote ART-003 to `blocked waits on named work`; this lane
          does not.

          `verify_reference_artifact_lifecycle_machine` must read
          `docs/reference.md`, isolate the section between
          `## Artifact lifecycle and closure {#artifact-lifecycle-and-closure}` and the next
          explicitly anchored `##` heading, and require: the heading present verbatim and once;
          `### Issue`, `### Spec`, `### Bundle`, and `### Plan` each present exactly once inside
          it; exactly four `<div class="tactics-matrix">` panels inside it, each whose `<thead>`
          row names the four columns State, Before you can enter it, the validator/gate column,
          and Enables; one `state-index` live-state panel and one `state-coupling` panel; the
          CLAIM-030 and CLAIM-031 regions both inside the section; and the ART-003 and ART-004
          needles each occurring EXACTLY ONCE in the whole file (CLM-004). It must also require
          the CLAIM-030 region body to equal `docs/_data/evidence-inventory.yml` CLAIM-030
          `statement_markdown` byte-for-byte, and CLAIM-030's `evidence_refs` to include a
          `schema` ref for each of `artifacts/bundle/v2/schema.json`,
          `artifacts/issue/v1/schema.json`, `artifacts/spec/v1/schema.json`, and
          `artifacts/plan/v1/schema.json` (CLM-005).

          `verify_reference_artifact_lifecycle_state_vocabulary_is_live` must bind the copy to
          the schemas rather than to a hardcoded list: load the `status` / `status.maturity`
          enums out of `artifacts/plan/v1/schema.json`, `artifacts/issue/v1/schema.json`,
          `artifacts/spec/v1/schema.json`, and `artifacts/bundle/v2/schema.json`, and require
          every state the section names for a given noun to be a member of that noun's live
          enum. It must require the section's plan sequence to be `draft` → `ready` →
          `implementing` → `completed`, require the literal words `approved` and `in-progress`
          to be absent from every plan-facing sentence in the section while `in-progress`
          remains present as an issue state, and require the bundle preconditions to name all
          five `matureSections` values from `pkg/validate/bundle.go` including
          `Current Thinking` (CLM-001, CLM-003). Its negative half must prove non-vacuity by
          copying the corpus, reintroducing `approved` as a plan state in the temp copy, and
          requiring the helper to reject it with a diagnostic naming the offending state.

          `verify_reference_artifact_lifecycle_rejects_unallowed_block` must copy the corpus the
          way `production_delete_reject` does, append one new unmarked prose block INSIDE the
          lifecycle section, run
          `BACKSTOP_PUBLIC_MODEL_ROOT=<tmp> BACKSTOP_PUBLIC_MODEL_GIT_ROOT=<root>
          BACKSTOP_PUBLIC_MODEL_SKIP_DISPATCH=1 scripts/verify-public-product-model.sh`, and
          require failure with `unclassified final-copy block`. It must separately delete one
          allowance-bearing block from the temp copy and require the verifier to fail too, so
          the allowance table is proved to be exact-bytes and not a pattern (CLM-006).

          `verify_reference_no_missing_route_links` must require that no `](/…)` Markdown link
          and no `href="/…"` attribute inside the lifecycle section targets a route absent from
          `canonicalRoutes()` in `scripts/sitecheck/site.go`, naming `/directive/`, `/adr/`, and
          `/capability/` explicitly as forbidden on this baseline, and must prove it rejects a
          temp copy in which such a link is reintroduced (CLM-007).

          `verify_reference_paper_ink_chrome` must implement a
          `validate_paper_ink <layout-file> <stylesheet-file>` helper requiring: the layout to
          assign a `paper_kinds` list whose split members CONTAIN `reference`; the layout to
          link `/assets/css/backstop-tokens.css` only under a
          `{% if paper_kinds contains page_kind %}` guard and only after `site.css`; the
          `presentation` assignment to precede `<head>` so `page_kind` resolves there; the
          stylesheet to carry the paper shell rules for the `reference` kind and
          `[data-page-kind="reference"]` rules for `.state-index`, `.state-coupling`, and
          `.tactics-matrix`; and the stylesheet to contain no `#hex`, `rgb(`, `rgba(`, `hsl(`,
          or `hsla(` literal, keeping `:focus-visible` and `prefers-reduced-motion` present
          (CLM-008). Prove non-vacuity with four temp-copy mutations, each rejected with its own
          diagnostic: `reference` dropped from `paper_kinds`; the `backstop-tokens.css` link
          unguarded; the `[data-page-kind="reference"] .state-index` rules deleted; and a raw
          hex literal introduced into the stylesheet.

          `verify_reference_paper_ink_preserves_home_navigation` must require
          `docs/assets/css/site.css` to still contain the `[data-page-kind="home"] .nav` and
          `[data-page-kind="home"] .nav-links` rules inside their responsive media query, and
          must prove it rejects a temp copy with those rules removed (CLM-008).

          RED receipt, required before any production edit: run
          `bash scripts/tests/public-product-model/pages/extend-reference-contributing.sh` and
          require the run to reach and FAIL the new assertions on their intended conditions —
          the missing `### <noun>` subsections, the missing `tactics-matrix` panels, the
          `approved`/`in-progress` plan vocabulary still present in CLAIM-030, the CLAIM-030
          bytes not matching `evidence-inventory.yml`, the absent `paper_kinds` assignment, and
          the absent `[data-page-kind="reference"]` rules. A syntax error, an unbound variable,
          a missing interpreter, or a corpus-load failure is NOT this task's RED evidence; fix
          the test file rather than accepting such a failure. Record the diagnostics.
        files:
          - scripts/tests/public-product-model/pages/extend-reference-contributing.sh
        claims:
          - CLM-001
          - CLM-002
          - CLM-003
          - CLM-004
          - CLM-005
          - CLM-006
          - CLM-007
          - CLM-008
        test_names:
          - verify_reference_artifact_lifecycle_machine
          - verify_reference_artifact_lifecycle_state_vocabulary_is_live
          - verify_reference_artifact_lifecycle_rejects_unallowed_block
          - verify_reference_no_missing_route_links
          - verify_reference_paper_ink_chrome
          - verify_reference_paper_ink_preserves_home_navigation
        depends_on: []

  - id: phase-2
    name: "Phase 2: GREEN — land the lifecycle machine with its claim and allowance lockstep"
    tasks:
      - id: TASK-002
        type: implementation
        title: "GREEN: land the approved section, CLAIM-030 bytes, and the closed-world allowances"
        description: |
          Land the approved lifecycle machine on the existing anchor, and make the three
          byte-coupled edits together in one task because any one of them alone leaves the
          verifier red.

          In `docs/reference.md`, replace the body of
          `## Artifact lifecycle and closure {#artifact-lifecycle-and-closure}` with the
          approved section, ported from
          `git show 0a6010c0e45b290cbacc6713b83d5da4f5704ba9:docs/reference.md` and corrected
          against the live tree. Keep the heading line byte-identical. Keep the section between
          `#pack-artifact` and `#source-traceability`; add no heading with an explicit anchor
          inside it, so `anchored_section` still covers the whole machine. Required corrections
          to the ported copy:
            • Replace the lede's claim that per-noun Status tables "live on the entity pages"
              with language that names the owning artifact schemas, because `/directive/`,
              `/adr/`, and `/capability/` do not exist on this baseline (CLM-007). Keep the
              lede's load-bearing point that status is a DECLARED field, set by authors, not
              inferred from git or CI.
            • Change "Product code is not written until a plan is approved" to the live `ready`
              state (CLM-001).
            • Add `Current Thinking` to the bundle `defined`/`ready` precondition cell so all
              five `matureSections` values are named (CLM-003).
            • Re-author the closing vocabulary-pointer paragraph so it names Directive, ADR, and
              Capability and states that they are not paths into implementation, WITHOUT
              linking to their routes and WITHOUT reproducing their Status tables — ISSUE-197
              owns those (CLM-007).
            • Place the ART-003 needle ``Bundles progress through `idea`, `exploring`,
              `defined`, and `ready` `` verbatim in a NON-CLAIM Markdown prose block inside the
              section, exactly once in the file, and keep CLAIM-031's ART-004 needle exactly
              once (CLM-004, CLM-005).
            • Keep every state name inside its noun's live enum, and give each noun a `Live:`
              sequence line plus a four-column `tactics-matrix` table answering what states
              exist, which transitions are legal, what must be true first, what begins being
              enforced, and what the state enables, with terminal and successor rules stated per
              noun (CLM-002, CLM-003). Use `<code>` elements inside the HTML panels and tables,
              never backticks, and keep each panel free of internal blank lines (CLM-006).
          Do not add, remove, or renumber a `JLINK`. Do not change the page's frontmatter, its
          `hero_question`, or any other section. Do not mix lifecycle or status semantics into
          `#source-traceability`.

          In `docs/_data/evidence-inventory.yml`, update ONLY the CLAIM-030 record: set
          `statement_markdown` to the exact bytes of the CLAIM-030 region body as it now appears
          in `docs/reference.md`; set `statement` to the plain-prose equivalent naming the same
          four live sequences with the live plan states `draft` → `ready` → `implementing` →
          `completed` and no `approved` or `in-progress` plan state; retarget EVIDENCE-044 to
          the live `artifacts/bundle/v2/schema.json`; and add unique `schema` refs — continuing
          the sequence after the current maximum EVIDENCE-051 — for
          `artifacts/issue/v1/schema.json`, `artifacts/spec/v1/schema.json`, and
          `artifacts/plan/v1/schema.json`, each with an honest `relevance` naming the enum it
          defines. Refresh `known_limitations` only insofar as it must stay true. Leave
          `claim_type`, `owner`, CLAIM-031, `corpus_roles`, and every other claim untouched
          (CLM-005).

          In `scripts/verify-public-product-model.sh`, add one allowance entry per new
          non-claim, non-heading, non-journey-link block under `allowances['docs/reference.md']`,
          preserving the existing `'Durable references use repository paths…'` entry. Each key
          must be the block's exact stripped bytes and each value a short honest
          nonconsequential rationale such as `'lifecycle machine connective'`,
          `'ART-003 live-state responsibility'`, `'coupled-state presentation'`,
          `'per-noun live sequence'`, `'per-noun state matrix presentation'`, or
          `'terminal and successor rule'`. Do not touch `legacy_responsibilities`, and in
          particular do not rewrite the ART-003 needle on line `'ART-003':[…]` (CLM-004,
          CLM-006). Do not introduce a pattern, prefix, regex, or catch-all allowance, and do
          not touch any other page's allowances.

          GREEN evidence: rerun `bash
          scripts/tests/public-product-model/pages/extend-reference-contributing.sh` and require
          the copy-facing and allowance-facing functions from TASK-001 to pass; then run
          `./scripts/verify-public-product-model.sh` and require `public-product-model: PASS`
          with no `unclassified final-copy block`, no `claim linkage/bytes CLAIM-030`, and no
          `missing final-copy responsibility` diagnostic. The paper/ink functions are expected
          to remain RED until TASK-004; say so explicitly rather than reporting a clean run.
        files:
          - docs/reference.md
          - docs/_data/evidence-inventory.yml
          - scripts/verify-public-product-model.sh
        claims:
          - CLM-001
          - CLM-002
          - CLM-003
          - CLM-004
          - CLM-005
          - CLM-006
          - CLM-007
          - CLM-010
        depends_on:
          - TASK-001

      - id: TASK-003
        type: verification
        title: "Verify the landed section, its claim bytes, and the closed-world allowances"
        description: |
          Run `./bin/backstop gate --file docs/reference.md --file
          docs/_data/evidence-inventory.yml --file scripts/verify-public-product-model.sh` as
          the diff-scoped cadence gate for this phase's files, then
          `./scripts/verify-public-product-model.sh` as the owning pipeline.

          Require: `public-product-model: PASS` from every dispatched stage, including
          `verify-content-inventory.sh`, `verify-content-topology.sh`,
          `verify-evidence-inventory.sh`, and all three page tests; ART-003 and ART-004 needles
          resolving inside `anchored_section('/reference/','artifact-lifecycle-and-closure')`
          and each occurring exactly once in `docs/reference.md`; CLAIM-030's page bytes equal
          to `statement_markdown`; the claim-region bijection intact with no duplicate and no
          orphaned claim; and every new block classified by an exact-bytes allowance.

          Read the gate report for `documentation-semantics` findings — the
          `unique-canonical-definition-anchor` rule forbids a repeated explicit heading anchor
          within one document, so confirm no explicit anchor was duplicated inside
          `docs/reference.md`. Confirm the `/reference/` presentation row, `hero_question`,
          `treatments`, `next_action`, `content-topology.yml`, `content-inventory.yml`, and
          `.backstop/seed4-delivery-inventory.yml` are all unchanged (CLM-010). A waiver, a
          baseline entry, a suppression, a skipped test, or a loosened assertion is a failure,
