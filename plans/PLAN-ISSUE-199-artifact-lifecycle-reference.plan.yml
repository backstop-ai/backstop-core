          `artifacts/issue/v1/schema.json`, `artifacts/spec/v1/schema.json`, and
          `artifacts/plan/v1/schema.json` (CLM-005).

          `verify_reference_artifact_lifecycle_state_vocabulary_is_live` must bind the copy to
          the schemas rather than to a hardcoded list: load the `status` / `status.maturity`
          enums out of `artifacts/plan/v1/schema.json`, `artifacts/issue/v1/schema.json`,
