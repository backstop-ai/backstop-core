  CLM-005 — CLAIM-030 IS BYTE-BOUND TO `docs/_data/evidence-inventory.yml`, AND THAT BINDING IS
    WHY THE NEEDLE CANNOT LIVE INSIDE THE CLAIM. `canonical_payload()` in
    `scripts/verify-public-product-model.sh` returns the claim body verbatim for every claim
    except CLAIM-005 (it only strips `{% raw %}` markers), and the verifier then requires
    `statement_markdown` to equal those exact bytes (`claim linkage/bytes CLAIM-030`).
    `scripts/render-public-site-contracts/main.go` `bindClaims()` rewrites the claim markers
    into `<article data-evidence-card data-claim-id="CLAIM-030">`, so the claim body is emitted
    as raw HTML. Kramdown does not process Markdown inside a raw HTML block element, so a
    backticked needle placed inside the approved `<div class="state-index">` panel would render
    as literal backticks. Therefore: CLAIM-030's region is the approved `state-index` panel
    (HTML, `<code>` elements, no backticks), `evidence-inventory.yml` CLAIM-030
    `statement_markdown` is updated to those exact bytes, `statement` is updated to the plain
    prose equivalent naming the same four live sequences with the live plan states, and the
    ART-003 needle lives in a NON-CLAIM prose block inside the same section. CLAIM-030 is a
    `mechanism` claim, so `verify-evidence-inventory.sh` requires at least one `evidence_refs`
    entry of kind `source`, `schema`, `test`, or `implementation-commit`; its only current ref
    is EVIDENCE-044 pointing at `artifacts/bundle/v1/schema.json`. Because the statement now
    enumerates four artifact kinds, the refs must cover them: retarget the bundle ref to the
    LIVE `artifacts/bundle/v2/schema.json` and add `schema` refs for
    `artifacts/issue/v1/schema.json`, `artifacts/spec/v1/schema.json`, and
    `artifacts/plan/v1/schema.json`. New `evidence_id` values must be unique and continue the
    sequence after the current maximum, EVIDENCE-051. CLAIM-031's bytes do not change.
    YAML SERIALIZATION IS PART OF THE BYTE CONTRACT, NOT A STYLE CHOICE. `claim_start` is
    `^<!-- backstop-claim: ([A-Z0-9-]+) -->\n` so the body begins immediately after that
    newline, and `claim_regions` then strips exactly ONE trailing newline
    (`if body.endswith('\n'): body=body[:-1]`), so the canonical body ends at the last
    non-newline byte before `\n<!-- /backstop-claim -->`. CLAIM-030's `statement_markdown` is
    multi-line HTML, so it MUST be written as a literal block scalar with strip chomping —
    `statement_markdown: |-` — which yields a value carrying the internal newlines verbatim and
    NO trailing newline. A plain `|` (clip) appends a trailing newline and fails
    `claim linkage/bytes CLAIM-030`; a folded `>-` collapses the internal newlines into spaces
    and fails the same check; a quoted single-line scalar with `\n` escapes is unreadable and
    invites drift. CLAIM-030's `statement` stays a single-line prose scalar.

