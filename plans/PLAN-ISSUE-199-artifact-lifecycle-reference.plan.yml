    edit. `docs/_data/content-topology.yml` needs no edit either: `artifact-lifecycle-and-closure`
    is already in `/reference/` `required_blocks` and ART-003 / ART-004 are already in its
    `source_material`.

  CLM-011 — THE FENCE. Only these six files change:
    `docs/reference.md`, `docs/_data/evidence-inventory.yml`,
    `scripts/verify-public-product-model.sh`,
    `scripts/tests/public-product-model/pages/extend-reference-contributing.sh`,
    `docs/_layouts/default.html`, `docs/assets/css/site.css` — plus the committed ISSUE-199 and
    PLAN-ISSUE-199 artifacts themselves. `/reference/#source-traceability` (CLAIM-007 /
    CLAIM-008 gate-evidence provenance), `/reference/#pack-artifact`, every other Reference
    section, `docs/model.md` (including ARCH-001 and `#delivery-lifecycle`), `docs/evaluate.md`,
    `docs/adopt.md`, `docs/extend.md`, `docs/packs.md`, `docs/use-cases.md`, `docs/status.md`,
    `docs/contributing.md`, the entity pages, `docs/_includes/*`, `docs/_data/site-presentation.yml`,
    `docs/_data/content-topology.yml`, `docs/_data/content-inventory.yml`,
    `.backstop/seed4-delivery-inventory.yml`, `scripts/sitecheck/*`, `playwright.config.ts`,
    `tests/*`, `backstop.yml`, `backstop.lock`, and `specs/*` are UNTOUCHED. BUNDLE-032's
    visitor-journey charter is not reopened and is not marked delivered. No waiver, no
    baseline entry, no suppression, no skipped test, and no relaxed assertion is acceptance.

  ════════════════════════════════════════════════════════════════════════════════
  SHARP EDGES
  ════════════════════════════════════════════════════════════════════════════════
   1. Needle cardinality (CLM-004). Each of the two Reference needles must appear EXACTLY once
      in `docs/reference.md`. Two occurrences invert the page test's deletion proof into a
      false green and a red test.
   2. Backticks do not render inside raw HTML blocks (CLM-005). The needle must sit in a
      Markdown prose block, not inside the `state-index` panel.
   3. Allowance keys are exact bytes (CLM-006). A reflowed line, a changed dash, a stray
      trailing space, or a blank line inside an HTML panel changes the key and reds the page.
   4. Links to `/directive/`, `/adr/`, `/capability/` red on `main` (CLM-007). So does any
      fragment that is not exactly one id on its target route.
   5. AN EXPLICIT ANCHOR ON A `### <noun>` HEADING IS FORBIDDEN, AND THE COLLISION IT WOULD
      GUARD AGAINST CANNOT OCCUR. `docs/_config.yml` sets `kramdown.auto_ids: true`, so
      `### Issue`, `### Spec`, `### Bundle`, and `### Plan` render the auto-ids `issue`, `spec`,
      `bundle`, `plan`, and `routeIDs()` requires every rendered id on `/reference/` to be
      unique. Verified on this baseline: the only other ids on the route are `main` (from
      `docs/_layouts/default.html`) and the auto-ids of the page's own `##` headings —
      `compatibility`, `artifact-schema-catalog`, `configuration`, `cli-conventions`,
      `troubleshooting`, `gate`, `pack-commands`, `pack-artifact`,
      `artifact-lifecycle-and-closure`, `source-traceability`, `cli-command-catalog`, plus
      `path-filter-diagnostics` once PLAN-ISSUE-198 lands. None is `issue`, `spec`, `bundle`, or
      `plan`; the header, footer, hero, and generated includes emit no `id=` attribute; and
      `routeIDs()` is per-route, so ISSUE-197's entity pages cannot collide. So there is no
      collision to remedy. If a future edit ever introduced one, the remedy is to RENAME THE
      VISIBLE HEADING TEXT (for example `### Issue lifecycle`) so Kramdown derives a different
      auto-id. Adding `{#lifecycle-<noun>}` is NOT the remedy and would break three things at
      once: `anchored_section` bounds the section at the next `^#{1,6} .+ \{#[a-z0-9-]+\}$`
      match, so an explicit anchor on `### Issue` truncates the lifecycle section right after
      the lede and drops CLAIM-031's ART-004 needle out of scope
      (`ART-004: missing final-copy responsibility`); the verifier derives a claim's owner
      anchor from the LAST explicitly anchored heading before it, so CLAIM-031's derived anchor
      would become `lifecycle-issue` and mismatch `evidence-inventory.yml`
      `owner.anchor: artifact-lifecycle-and-closure` (`claim linkage/bytes CLAIM-031`); and it
      directly contradicts TASK-002's instruction to add no explicitly anchored heading inside
      the machine.
   6. `matureSections` has FIVE entries (CLM-003). The prototype's bundle table lists four.
      Name `Current Thinking` too.
   7. `approved` is not a plan status (CLM-001). The prototype's own connective sentence
      "until a plan is approved" reproduces the defect being fixed. Use `ready`.
   8. `no-raw-colors` scans `site.css` (CLM-008). One hex literal blocks the gate.
   9. Do not delete `[data-page-kind="home"] .nav` / `.nav-links` (CLM-008). That is an
      ISSUE-190 regression, not a cleanup.
  10. `paper_kinds` may already exist by the time this lands (CLM-008). Append, never replace.
  11. The seed4 `--check-diff` reads committed history from base
      `89f4138aa97e7ba1e8d7c67595cfaee1caefa797`, so treat it as authoritative only after the
      branch is committed. Verified today: 70 declared paths, exit 0, no row needed.
  12. `public-product-model: PASS` IS NOT AN ACCEPTANCE SIGNAL. That banner is printed by the
      embedded Python block, which finishes BEFORE the bash tail dispatches
      `verify-content-inventory.sh`, `verify-content-topology.sh`, `verify-product-model.sh`,
      `verify-evidence-inventory.sh`, `verify-structural-verifier.sh`, and the three page tests.
      A run can print PASS several times and still exit non-zero from a page test. Acceptance is
      EXIT STATUS 0 from the whole `./scripts/verify-public-product-model.sh` invocation with
      `BACKSTOP_PUBLIC_MODEL_SKIP_DISPATCH` unset, observed as `$?`, never a grep for the
      banner. The full run takes roughly 45 seconds. Run it whole; do not shortcut to one stage
      and do not set the skip-dispatch escape hatch except inside a mutation harness that is
      itself asserting a failure.
  13. `statement_markdown` MUST be a `|-` literal block scalar (CLM-005). `|` adds a trailing
      newline and `>-` folds the internal ones; either one reds
      `claim linkage/bytes CLAIM-030` while looking correct in a diff.
  14. THE PRECEDING SECTION'S IDENTITY IS NOT AN INVARIANT. PLAN-ISSUE-198 inserts
      `#path-filter-diagnostics` immediately before the lifecycle machine, so any assertion or
      instruction phrased as "between `#pack-artifact` and `#source-traceability`" is already
      stale. Assert only what `anchored_section` consumes: the machine's own heading line, no
      explicitly anchored heading inside it, and `#source-traceability` as the next explicitly
      anchored heading after it.
  15. Never hand-edit the ISSUE-199 or PLAN-ISSUE-199 artifacts to make a check pass. Route any
      artifact evolution back through the purpose-built agents.

phases:
  - id: phase-1
    name: "Phase 1: RED — specify the landed lifecycle machine and its byte contracts"
    tasks:
      - id: TASK-001
        type: test
        title: "RED: assert the lifecycle machine, its live vocabulary, and the lane's negative obligations"
        description: |
          Add named, mutation-proved bash test functions to the EXISTING
          `scripts/tests/public-product-model/pages/extend-reference-contributing.sh`, and call
          each one explicitly at the bottom of the file so it actually executes under
          `./scripts/verify-public-product-model.sh`. Follow the shipped idiom in that file and
          in its siblings: a parameterized validation helper, positive assertions against the
          real tree, then negative mutations proving the helper rejects them. This task adds
          ONLY the copy-facing and negative-obligation functions; the paper/ink functions are
          TASK-004's, so that the full pipeline is legitimately green at TASK-003 rather than
          carrying a red this phase cannot resolve.

          PRESERVATION OBLIGATION, SCOPED TO WHAT THIS LANE OWNS. Preserve BYTE-FOR-BYTE the
          ART-003 needle ``Bundles progress through `idea`, `exploring`, `defined`, and `ready` ``
          and the ART-004 needle ``  `delivered_by` names a completed plan `` in both the
          `responsibilities` list and their `production_delete_reject` calls (CLM-004). The
          approved preview branch rewrote ART-003 to `blocked waits on named work`; this lane
          does not. Preserve the existing claim-bytes loop, the `responsibilities` loop, the
          terse-contributing assertion, and the trailing unmarked-consequential-addition proof.
          Do NOT pin the number of `production_delete_reject` calls and do NOT pin the PACK-004
          row's route: PLAN-ISSUE-198 moves PACK-004 from `/extend/` onto `/reference/` in this
          same file, so this lane must neither perform that move nor revert it, and any
          assertion it adds must remain true on both sides of it.

          `verify_reference_artifact_lifecycle_machine` must read `docs/reference.md` and
          isolate the section using PRODUCTION SEMANTICS, not a `##`-only heuristic: locate
          `^#{1,6} .+ \{#artifact-lifecycle-and-closure\}\s*$` with `re.M`, then bound the
          section at the next `^#{1,6} .+ \{#[a-z0-9-]+\}\s*$` match after it — the exact regexes
          `anchored_section()` uses in `scripts/verify-public-product-model.sh` — so the test
          measures the same bytes the production verifier measures. Require: the heading
          `## Artifact lifecycle and closure {#artifact-lifecycle-and-closure}` present verbatim
          and exactly once; NO explicitly anchored heading inside the isolated section; the next
          explicitly anchored heading after it to be `## Source traceability {#source-traceability}`
          (do not assert the identity of the PRECEDING section — PLAN-ISSUE-198 inserts
          `#path-filter-diagnostics` there, sharp edge 14); `### Issue`, `### Spec`,
          `### Bundle`, and `### Plan` each present exactly once inside it; exactly four
          `<div class="tactics-matrix">` panels inside it, each whose `<thead>` row names the
          four columns State, Before you can enter it, the validator/gate column, and Enables;
          one `state-index` live-state panel and one `state-coupling` panel; the CLAIM-030 and
          CLAIM-031 regions both inside the isolated section; and the ART-003 and ART-004
          needles each occurring EXACTLY ONCE in the whole file (CLM-004). It must also require
          the CLAIM-030 region body — computed the way `claim_regions()` computes it, taking the
          bytes after `<!-- backstop-claim: CLAIM-030 -->\n` and stripping exactly one trailing
          newline — to equal `docs/_data/evidence-inventory.yml` CLAIM-030 `statement_markdown`
