          `verify_reference_artifact_lifecycle_allowances_are_exact_bytes` must prove the
          closed-world allowance table is byte-exact and not a pattern, using the corpus-copy
          idiom of `production_delete_reject` and running
          `BACKSTOP_PUBLIC_MODEL_ROOT=<tmp> BACKSTOP_PUBLIC_MODEL_GIT_ROOT=<root>
          BACKSTOP_PUBLIC_MODEL_SKIP_DISPATCH=1 "$root/scripts/verify-public-product-model.sh"`
          against each mutated copy. Three mutations, each of which must make that invocation
          FAIL with `unclassified final-copy block`:
            (a) append one new unmarked prose block INSIDE the lifecycle section;
            (b) BYTE-MUTATE an allowance-bearing block in place without changing its block
                count — swap one em dash or en dash for an ASCII hyphen, or reflow one internal
                line break of a multi-line panel into a space;
            (c) add a trailing space to the end of a NON-FINAL line inside a multi-line
                allowance-bearing panel.
          Do NOT use deletion of an allowance-bearing block as the proof: `check_closed_blocks`
          only classifies blocks that are PRESENT, so removing one proves nothing about the
          allowance table and only fails, if at all, through some other assertion. Mutation (c)
          must target a non-final line because `re.split(r'\n[ \t]*\n', masked)` is followed by
          `.strip()`, which would silently discard whitespace appended to the block's last line;
          state that in the test so the mutation cannot be "simplified" into a no-op. Each
          mutation must also be shown to leave the block count unchanged, so the diagnostic is
          attributable to the changed bytes rather than to a new block.

