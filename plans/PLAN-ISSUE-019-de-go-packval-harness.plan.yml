          lands. Mandated names:
            - TestPhase3_GoModTidyPreflightGone (CLM-006): source-grep phase3.go and
              assert "goModTidyTempCopy" and exec.Command("go", "mod", "tidy") are
              absent (deletion assertion); the tool_config fixture path no longer runs
              a baked Go module-tidy pre-flight.
            - TestScaffoldSkeleton_UsesPackDeclaredIndicator (CLM-007): a skeleton
              scaffold whose pack-DECLARED test indicator (a new manifest field, e.g.
