        claims:
          - CLM-009
        depends_on:
          - TASK-004

      - id: TASK-006
        type: implementation
        title: "Author go-build/go-test/golangci engine bindings into the EXTERNAL go-toolchain pack repo"
        description: |
          Make TASK-005 green by authoring the three Go engine bindings into the
          engines: block of the EXTERNAL pack source
          ~/src/projects/backstop-go-toolchain-pack/pack.yml (a SEPARATE repo — this
