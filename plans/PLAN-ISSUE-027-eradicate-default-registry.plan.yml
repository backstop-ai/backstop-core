notes: |
  KEYSTONE of the thin-executor eradication finish (DIR-014). Deletes the baked
  engine.DefaultRegistry() / engine.DefaultFieldContracts() / engineFieldClaim
  map + claimFor() so the binary holds ZERO baked engine or language knowledge —
  every engine binding + field-contract resolves from PACK DATA. Accounts for 6
  of the 10 backstop/self findings (all on pkg/pack/engine/binding.go); expected
  to go 6 -> 0.

  ── ISSUE-TEXT STALENESS RECONCILED (for the user) ────────────────────────────
  The issue (2026-06-22) frames the work as "cannot be planned or implemented
  independently of BUNDLE-011 … MUST be sequenced after BUNDLE-011 resolves the
  go-toolchain ownership question." That precondition is RESOLVED: BUNDLE-011 +
  BUNDLE-012 are DELIVERED on main (the native-toolchain cutover, squash 824530e).
  The go-toolchain pack EXISTS as an external installed pack (backstop.lock,
  source_type: local, sibling repo ~/src/projects/backstop-go-toolchain-pack). So
  BUNDLE-011 is NO LONGER A BLOCKER — this plan proceeds and OWNS authoring the
  three Go engine bindings into that already-existing external pack. Treat the
  issue's "blocked on / sequence after BUNDLE-011" language as stale.

  ── SCOPING-FORK ANSWER: the external go-toolchain pack does NOT yet declare its
     go engines ──────────────────────────────────────────────────────────────
  VERIFIED against ~/src/projects/backstop-go-toolchain-pack/pack.yml AND the
  installed copy .backstop/packs/backstop/go-toolchain/pack.yml: the engines:
  block declares ONLY `go-coverage`. `go-build`, `go-test`, and `golangci` appear
  ONLY as RULE `engine:` references (content.ruleset.rules) — they currently
  resolve through the baked DefaultRegistry fallback. Therefore the three Go
  bindings (commands `go build` / `go test` / `golangci-lint run …`, the Convert
  scripts scripts/build-to-sarif.sh + scripts/test-to-sarif.sh, crash_guard,
  project_target, gate_type, strict_sarif, package_scoped, exempt_from_scope_filter)
  MUST be authored into the EXTERNAL pack's engines: block FIRST, and the pack
  reinstalled, BEFORE DefaultRegistry can be deleted — otherwise every go-* rule
  becomes an unknown-engine fail-loud. This is the load-bearing sequencing of the
  plan: Phase 3 (external authoring + reinstall) precedes Phase 4 (deletion).

  ── DURABILITY CONSTRAINT (load-bearing) ──────────────────────────────────────
  The go-toolchain pack is EXTERNAL. Editing the installed copy under
  .backstop/packs/ is NON-DURABLE. The engine authoring (Phase 3) MUST land in the
  external repo ~/src/projects/backstop-go-toolchain-pack (its own commit), then be
  reinstalled here via remove+add so the in-repo backstop.lock content_hash and the
  installed copy pick it up. `pack add` refuses an already-installed pack and
  `pack install` verifies the locked hash (rejecting edited source), so remove+add
  is the only correct reinstall path for an edited local pack. backstop.lock (the
  tracked durability boundary) is the in-repo artifact that captures the reinstall.

  ── THE EMBEDDED BASE-ENGINES PACK (central architectural decision) ────────────
  The 4 generic engines (semgrep, ast-grep, sandbox, config-file) move to a
  backstop-owned base ENGINE pack, source at packs/base-engines/pack.yml, that is
  EMBEDDED in the binary via //go:embed and always-loaded — NOT installed via the
  lock like ordinary packs. This is the deliberate exception: the binary ships the
  base engine DATA as an embedded pack.yml and loads it through the normal pack
  PARSE path, so the Go code holds zero engine knowledge (all engine facts are
  DATA in the embedded pack). Prior art: root embed.go + cmd/backstop/embed.go
  (//go:embed of artifacts/). Each base engine declares its FieldContract INLINE
  via the already-parseable engines:.field_contract surface (EngineSpec.FieldContract,
  pkg/pack/manifest.go) — which eliminates DefaultFieldContracts entirely.

  ── KEY OPEN QUESTION FOR THE USER (surface, do not silently pick) ─────────────
  How the base registry reaches the VALIDATION path is the one genuinely open
  layering call. resolveEngineRegistry (the GATE path, cmd/backstop/pack_gate.go)
  trivially swaps engine.DefaultRegistry() -> baseengines.Registry() because
  cmd/backstop owns the embed. But resolveEngineRegistryForValidation +
  validateEngine + ExpectedLayout live in the LOWER pkg/pack layer, which cannot
  import the embed loader (baseengines imports pkg/pack to parse the pack.yml — the
  reverse import is a cycle). Discovery that shapes the choice: ValidateManifest
  has ZERO non-test production callers today (only *_test.go + ExpectedLayout call
  it), so the base-into-validation ripple is almost entirely test-facing.
  Options:
    (a) INJECT an `base engine.Registry` PARAM into ValidateManifest /
        resolveEngineRegistryForValidation / validateEngine / ExpectedLayout;
        the CLI passes baseengines.Registry(); pkg/pack tests construct a base in a
        _test.go helper (self-pack no-baked scan excludes *_test.go, so a test-only
        Go literal is compliant). Cleanest layering, no hidden global, self-pack
        safe. COST: mechanical signature ripple across ~12 pkg/pack test files.
        ** RECOMMENDED — this plan is authored around (a). **
    (b) A lazy package-level SEAM in pkg/pack (var without initializer, set by the
        CLI at init) — mirrors the existing cmd/backstop seams but risks tripping
        go-standards' no-global-mutable-state rule and hides the dependency.
    (c) A shared low-level packbase package owning embed+parse, imported by both —
        blocked by the parse cycle (parsing needs pkg/pack).
  If the user prefers (b) or a different mechanism, Phase 4 TASK-011 + the two
  test-migration tasks change; flag before implementing. Additionally: the "no
  production ValidateManifest caller" finding suggests CLI pack validation may be
  partly dark — NOTED as out-of-scope here (this plan eradicates the bake, it does
  not wire a new production validation caller), raise separately if wanted.

  ── engineFieldClaim / claimFor DISPOSITION ───────────────────────────────────
  Once base bindings carry inline FieldContracts, contractForEngine reads the
  binding's FieldContract only and the DefaultFieldContracts fallback dies. The
  16-entry engineFieldClaim map + claimFor() (per-(engine|field|kind) CLM codes)
  are baked data with no home on the FieldContract struct (Requires/Forbids only);
  per the issue's blessed option they are DELETED and the field-contract
  ValidationError.Rule uses a single generic code (e.g. "CLM-020-engine-field-contract").
  Granular per-field claim traceability is intentionally dropped (the issue
  explicitly permits this) rather than growing FieldContract to carry codes.

  ── CASCADE RISK (KEY SHARP EDGE) ─────────────────────────────────────────────
  Deleting DefaultRegistry breaks EVERY path that silently relied on the baked
  fallback. Enumerated + handled by this plan:
    * cmd/backstop test seam `engineRegistry = engine.DefaultRegistry()` (dispatch_*
      / dogfood_enforcement / exempt_test_helpers / migration tests) — migrated to
      baseengines.Registry() (Phase 4 TASK-014). migration_test.go asserts the OQ-1
      FALLBACK behavior being deleted — those tests are removed/rewritten, not
      seam-swapped (the issue: "delete tests that assert on the baked defaults").
    * pkg/pack validation resolving semgrep/sandbox/etc. contracts — rewired to the
      injected base (Phase 4 TASK-011); pkg/pack tests get the base param (TASK-012/013).
    * go-* rules resolving their engine — pre-handled by Phase 3 (external authoring
      + reinstall) so they resolve from pack DATA, not the deleted fallback.
    * The 6 backstop/self findings on binding.go MUST clear 6 -> 0; the final gate
      (Phase 5) confirms that AND enumerates any NEWLY-lit gate reds as triage
      (a genuinely new red is the eradication doing its job, not silently absorbed).

  ── VERIFICATION VEHICLE ──────────────────────────────────────────────────────
  `backstop code check` was DELETED (ISSUE-018 codecheck collapse). Middle-phase
  verification uses scoped `go test … -race`; the FINAL phase uses `backstop gate`
  (full kill chain incl. artifact validation for the plan file + the self-pack
  no-baked dimension over binding.go).

phases:
  - id: phase-1
    name: "Phase 1: Author the embedded base-engines pack DATA"
    tasks:
      - id: TASK-001
        type: setup
        title: "Author packs/base-engines/pack.yml declaring the 4 generic engines with inline field_contract"
        description: |
          Create the backstop-owned base ENGINE pack SOURCE (pure DATA, no Go) at
          packs/base-engines/pack.yml, alongside the other in-repo dogfood pack
          sources (packs/contracts, packs/substantiveness). Declare an engines:
          block with the 4 generic engines, each faithfully re-keyed from the
          current engine.DefaultRegistry() literals AND carrying its FieldContract
          INLINE via engines:.<name>.field_contract (the already-parseable
          EngineSpec.FieldContract surface):
            - semgrep: command "semgrep --sarif --quiet", input_mode rule-flags,
              input_flag "--config", scope_kind file-args,
              provision {tool: semgrep, version: 1.96.0}, category opinion;
              field_contract requires [rule_path, standard], forbids
              [category, input_scope, validator].
            - ast-grep: command "ast-grep scan --json", input_mode config-file,
              input_flag "--config", scope_kind file-args,
              convert "ast-grep/to-sarif.sh",
              provision {tool: ast-grep, version: 0.43.0}, category opinion;
              field_contract requires [rule_path], forbids
              [category, input_scope, validator].
            - sandbox: command "", input_mode none, scope_kind file-args;
              field_contract requires [validator, input_scope, category],
              forbids [rule_path].
            - config-file: command "", input_mode config-file, input_flag "--config",
              scope_kind project-wide; field_contract requires [], forbids
              [rule_path, category, input_scope, validator].
          This is DATA only — no rules, no Go. The base pack is parsed for its
          engines: block by the Phase-2 loader; it is NOT dispatched as an ordinary
          pack and is NOT subject to the rule/fixture ValidateManifest checks (it
          has no rules). Do NOT add it to backstop.yml packs: — it is embedded and
          always-loaded, not lock-installed. Keep a header comment stating the pack
          is the embedded base engine substrate and that adding an engine here is a
          DATA edit, never a binary edit.
        files:
          - packs/base-engines/pack.yml
        claims:
          - CLM-001
          - CLM-005
        depends_on: []

  - id: phase-2
    name: "Phase 2: Embed + load the base-engines pack through the normal parse path (TDD)"
    tasks:
      - id: TASK-002
        type: test
        title: "Write failing base-engines loader tests (embedded pack -> engine.Registry with inline contracts)"
        description: |
          New Go test pkg/baseengines/base_engines_test.go proving the loader reads
          the EMBEDDED base pack and yields the 4 built-in bindings with their
          contracts — RED until the loader + embed land. Mandated test names:
            - TestBaseRegistry_ContainsFourGenericEngines (CLM-002): Registry()
              returns exactly semgrep, ast-grep, sandbox, config-file (no go-*
              engine — those are the toolchain pack's, not the base pack's).
            - TestBaseRegistry_SemgrepBindingFromPackData (CLM-002): semgrep's
              binding carries Command "semgrep --sarif --quiet", InputModeRuleFlags,
              Provision{semgrep,1.96.0}, EngineCategoryOpinion — proving the values
              come from the embedded pack.yml, not a Go literal.
            - TestBaseRegistry_AstGrepCarriesConvert (CLM-002): ast-grep binding has
              Convert "ast-grep/to-sarif.sh" and InputModeConfigFile.
            - TestBaseRegistry_InlineFieldContractsPresent (CLM-001): each engine's
              binding.FieldContract matches the DefaultFieldContracts values it
              replaces (semgrep requires rule_path+standard/forbids the three;
              sandbox requires validator+input_scope+category/forbids rule_path;
              config-file forbids the four; ast-grep requires rule_path).
            - TestBaseRegistry_SourcedFromEmbeddedFS (CLM-002): the loader parses the
              embedded FS (not a disk path), so it works with no working-directory
              dependency (parse the embedded bytes, assert non-empty engines).
          Substantive assertions on real parsed values — no canned plumbing.
        files:
          - pkg/baseengines/base_engines_test.go
        claims:
          - CLM-001
          - CLM-002
        depends_on:
          - TASK-001

      - id: TASK-003
        type: implementation
        title: "Embed the base pack via //go:embed and implement baseengines.Registry()"
        description: |
          Make TASK-002 green. Two pieces:
            1. Extend the root embed.go with a BaseEnginesFS //go:embed of
               packs/base-engines (mirroring the existing SchemaFS artifacts embed —
               //go:embed cannot reference above the module-root package, so the FS
               is declared at the module root exactly like the schemas).
            2. New package pkg/baseengines with Registry() engine.Registry: read the
               embedded base pack.yml bytes from BaseEnginesFS, parse via
               pack.ParseManifest (the NORMAL pack parse path — no bespoke YAML), and
               project the parsed manifest's Engines map into an engine.Registry
               (name -> EngineBinding, contracts inline). Parse ONCE (guard against
               re-parse cost) and return a fresh copy so callers cannot mutate the
               shared table. baseengines imports pkg/pack + pkg/pack/engine; NOTHING
               imports baseengines except cmd/backstop (no cycle: pkg/pack does not
               import baseengines).
          The loader is engine-BLIND: it enumerates whatever the embedded pack.yml
          declares. It must fail loud (not silently return empty) if the embedded
          pack is missing or unparseable.
        files:
          - embed.go
          - pkg/baseengines/base_engines.go
        claims:
          - CLM-001
          - CLM-002
        depends_on:
          - TASK-002

      - id: TASK-004
        type: verification
        title: "go test the base-engines loader"
        description: |
          Inner-loop verification (backstop code check is deleted — use go test):
          run `go test ./pkg/baseengines/... -race` and confirm the loader tests
          (TASK-002) pass green: the embedded base pack parses through the normal
          pack path and yields the 4 engines with inline FieldContracts. Confirm the
