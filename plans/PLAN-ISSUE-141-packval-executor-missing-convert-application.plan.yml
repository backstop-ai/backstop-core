  ── CLAIMS ────────────────────────────────────────────────────────────────
  This plan is issue-sourced, so it defines its own claims. Every one is mapped to at
  least one task below.

    CLM-001  THE DEFECT. `DefaultExecutor.RunEngine` applies the binding's declared
             `Convert` script to the engine's stdout BEFORE `check.ParsePackFindings`.
             A binding whose engine emits NON-SARIF output and declares `convert:`
             yields real, counted findings — where today it yields the
             "produced no parseable SARIF" hard error.
             Mandated test name is SPEC-032 CLM-015's, adopted verbatim:
             TestPackVal_EngineConvert_NonSarifPipesThroughConvert

    CLM-002  THE ASSERTION THAT KEEPS CLM-001 HONEST — non-regression on the
             no-convert path. A binding with `Convert == ""` parses stdout DIRECTLY,
             unchanged, and spawns no convert process. Without this, CLM-001 could be
             satisfied by a change that mangles every SARIF-native pack.
             Mandated test name is SPEC-032 CLM-014's, adopted verbatim:
             TestPackVal_EngineConvert_NativeSarifNoConvert

    CLM-003  A DECLARED-BUT-MISSING convert script is a fail-loud error naming the
             resolved path — NEVER a silent fall-through to the raw payload. A
             fall-through would re-open the exact defect as a soft failure, which is
             strictly worse than today because it would look fixed. Mirrors the gate
             side's `os.Stat`-with-IsDir refusal.

    CLM-004  A convert script that RUNS AND FAILS (non-zero exit) is attributed to the
             CONVERT STEP BY NAME, not misreported as the engine producing unparseable
             SARIF. Misattribution here sends a pack author to debug the wrong program.

    CLM-005  THE CONVERT RUNS THROUGH THE PRODUCTION SANDBOX SEAM — the same-package
             `SandboxedRunStdout`, with its stdout-only capture and stdin pipe, so a
             converter's stderr banner cannot corrupt the SARIF bytes and the packval
             path carries the SAME sandboxing guarantee as the gate path rather than an
             approximation of it. This is ISSUE-141 Direction item 3, answered
             operationally rather than by assertion.

    CLM-006  NO-DRIFT GUARD. Both convert application sites — `RunEngine` here and
             `runFindingsEngine` in cmd/backstop/pack_gate.go — stat-check the resolved
             script path and pipe the payload through `SandboxedRunStdout` before
             parsing. This is ISSUE-141 Direction item 2's explicit mandate ("ensure it
             does not drift from the gate-side behavior the way ISSUE-140's
             never-started check drifted"), and it is what holds R1's line until the
             consolidation is planned.

             THE pack_gate.go HALF MUST BE WINDOWED TO `runFindingsEngine`, NOT SCANNED
             WHOLE-FILE. cmd/backstop/pack_gate.go contains TWO INDEPENDENT convert-
             application blocks — one in `runCoverageEngine` and one in
             `runFindingsEngine` — and EACH independently contains `binding.Convert`,
             `resolveSandboxedRunStdout`, and an `os.Stat`+IsDir refusal. A whole-file
             scan therefore CANNOT FAIL even if `runFindingsEngine`'s block were deleted
             outright, because the coverage block alone would still satisfy it. That is a
             vacuous guard. The scan must isolate the `runFindingsEngine` body — locate
             `func runFindingsEngine(` and read to the next top-level `func `
             declaration — and assert the mechanisms inside THAT WINDOW.

             THE GUARD IS A CONTENT SCAN, NOT A TREE-STATE CHECK. It reads both files
             and asserts each REFERENCES the two mechanisms. It must NOT assert on
             `git status`, `git diff`, working-tree cleanliness, or line numbers: this
             is a shared tree with concurrent lanes, so a tree-state assertion blames
             whoever happens to run it. cmd/backstop/pack_gate.go is READ ONLY here and
             is deliberately ABSENT from every task's `files` list.

  ── SHARP EDGES ───────────────────────────────────────────────────────────
    SE1  ORDER IS LOAD-BEARING. Convert goes AFTER the `check.NeverStarted` refusal and
         BEFORE `check.ParsePackFindings`. See the CROSS-LANE section above for why
         both halves of that sandwich matter.

    SE2  THE SANDBOX IS PLATFORM-GATED, AND THE GUARD MUST NOT BE DARWIN-ONLY.
         `SandboxedRunStdout` dispatches at BUILD time: sandbox_linux.go (Landlock +
         seccomp), sandbox_nonlinux.go (sandbox-exec on darwin, hard REFUSAL elsewhere).
         The existing darwin-only tests in pkg/packval/sandbox_stdout_test.go guard with
         `if runtime.GOOS != "darwin" { t.Skip("sandbox-exec is macOS-only") }`.
         COPYING THAT GUARD HERE WOULD BE A VACUOUS GREEN IN CI, which runs Linux —
         every convert test would skip on the only machine that gates merges.
         REQUIRED GUARD for the convert-executing tests: skip only where the sandbox
         genuinely does not exist, using the same-package predicate that already
         encodes that answer —
             if err := sandboxPlatformSupported(runtime.GOOS); err != nil { t.Skip(...) }
         so the tests RUN FOR REAL on darwin (dev) and linux (CI) alike.
         `pkg/packval/sandbox_linux_exec_test.go` carries a "DO NOT ADD t.Skip TO THIS
         FILE" banner for the same reason; honor its spirit.

    SE3  NO STUBBED SANDBOX. Do not introduce a package-level injectable
         `sandboxedRunStdoutFn` seam in packval to dodge SE2. The gate side has such a
         seam for its own reasons; adding one here to make tests platform-free would
         make the falsification test prove that a stub was called, not that a real
         converter reshaped real bytes. Real script, real sandbox, real pipe.

    SE4  THE FIXTURE CONVERTER MUST GENUINELY TRANSFORM ITS STDIN. A convert script that
         ignores stdin and prints a canned SARIF document would pass CLM-001 without
         proving the pipe carries the engine's bytes. The converter's OUTPUT must be
         DERIVED from its INPUT (e.g. the SARIF result count follows from the number of
         records the engine emitted), so that a broken pipe produces a wrong answer
         rather than a right one by accident.

    SE5  FIXTURE SCRIPTS ARE WRITTEN AT RUNTIME INTO `t.TempDir()` AT MODE 0o755 — not
         committed under `pkg/packval/testdata/`. Two reasons: PLAN-ISSUE-092 owns
         several `pkg/packval/testdata/` subtrees and this lane must not add neighbours
         into contended ground, and a committed script's exec bit is a durability hazard
         that presents as an unrelated failure. The sandbox confines to `packDir`, so
         `t.TempDir()` IS the pack dir — the precedent is
         pkg/packval/sandbox_stdout_test.go and pkg/packval/sandbox_realconvert_test.go,
         both of which already do exactly this.

    SE6  THE ENGINE FIXTURE MUST DECLARE NO `provision:` BLOCK. `RunEngine` runs
         `engine.CheckToolAllowed` FIRST when `binding.Provision != nil`, and a
         fixture script is not on the trusted-tool allowlist — a provision block would
         make every test fail at the allowlist gate, before the code under test is
         ever reached, and the failure would look like a convert bug.

    SE7  ERROR WORDING FOLLOWS RunEngine'S OWN `engine %q ...` PREFIX, NOT THE GATE'S
         `pack %s ...`. The gate's messages name the pack because `runFindingsEngine`
         holds a manifest; `RunEngine` holds only `packDir` and `binding`, so naming a
         pack it cannot see would require inventing one. Keep the gate's STRUCTURE
         (missing-script refusal names the resolved path; convert failure names the
         declared convert) and RunEngine's SUBJECT.

