  ── THE ARCHITECTURE ANSWER: THERE IS NO IMPORT BOUNDARY TO CROSS ──────────
  ISSUE-141's Direction asks (items 1–3) whether the conversion logic can be shared
  between cmd/backstop and pkg/packval, whether packval needs its own copy, and whether
  the sandboxed-run mechanism is reusable from packval. Checked against the live policy
  file, `.backstop/packs/backstop-ai/backstop-core-architecture/architecture/backstop-core.yml`,
  not assumed:

      cli:     { anyProjectDeps: true }
      packval: { mayDependOn: [baseengines, check, pack_engine, recipe] }

  The question dissolves, because the sandbox seam ALREADY LIVES IN packval:

      pkg/packval/sandbox.go:  func SandboxedRunStdout(cmd string, args []string,
                                                       packDir string, stdin []byte) ([]byte, error)

  `cmd/backstop`'s `resolveSandboxedRunStdout()` (pack_gate.go) is a TEST SEAM whose
  production value IS `packval.SandboxedRunStdout` — asserted by a shipped funcPtr
  identity test, `cmd/backstop/pack_gate_resolvers_test.go`
  (TestResolvers... comparing `funcPtr(resolveSandboxedRunStdout())` to
  `funcPtr(packval.SandboxedRunStdout)`). The gate side has always been calling INTO
  this package for its convert.

  Therefore:
    - NO new import edge. The convert step calls a SAME-PACKAGE function.
    - NO architecture-policy edit. If the implementer finds themselves editing
      backstop-core.yml, they have taken a wrong turn and should stop.
    - NO copy of the sandboxing guarantee, so no second thing to drift. The sandboxing
      is not reimplemented or approximated — it is literally the same function object
      the gate path invokes, with the same stdout-only capture (a converter's stderr
      banner cannot interleave into the SARIF bytes) and the same stdin pipe.

  This is the OPPOSITE shape from PLAN-ISSUE-118's wall (pkg/gate may not import
  pkg/pack/engine) that ISSUE-141 warned might recur, and it is even cheaper than
  ISSUE-140's answer (which had to HOME a new predicate in pkg/check). Here the shared
  home already exists, downstream of both consumers, and both consumers already use it.

