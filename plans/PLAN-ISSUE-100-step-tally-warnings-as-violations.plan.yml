  ── DESIGN DECISION 1: ONE AUTHORITY FOR "BLOCKING", REUSED, NEVER COPIED ──
  pkg/gate/policy.go already holds the single ratified predicate:

      func blocksVerdict(v Violation) bool {
          return !strings.EqualFold(strings.TrimSpace(v.Severity), "warning")
      }

  result.go and output.go are in package `gate`, so this is directly callable.
  The tally MUST be implemented over it. A tally that re-derives blockingness
  can drift from the verdict, and a reader would then see a count that
  contradicts the pass/fail it sits beside — which is the ISSUE-100 defect
  reintroduced one layer over. Concretely: `Severity == "error"` (the spelling
  ISSUE-100's own Solution (b) proposes) classifies an UNSET severity as a
  NOTICE while the verdict still BLOCKS on it — a fail-OPEN inversion that
  under-counts a real failure. See SE1; that is the plan correcting its source,
  deliberately and on the record.

  The shared helper lands in result.go (a result-summary concern), NOT in
  policy.go — policy.go is the verdict authority and this lane has no business
  editing it (SE2). Shape:

      // tallyBySeverity partitions violations by the SAME predicate the verdict
      // uses. Reporting only: it never filters what is reported.
      func tallyBySeverity(violations []Violation) (blocking, warnings int)

  INVARIANT the tests pin: blocking + warnings == len(violations), always. No
  entry is dropped and no entry is double-counted.

  ── DESIGN DECISION 2: total_violations CHANGES MEANING; total_warnings IS NEW
  `total_violations` becomes the count of BLOCKING entries. `total_warnings` is
  added alongside it. This is the shape ISSUE-100's Solution (b) recommends and
  DIR-032 item 7 restates, and it is the only shape that actually fixes the
  defect: option (B) — leave total_violations counting everything and add new
  fields beside it — would leave the lying field as the one every existing
  consumer reads.

  WHAT THIS COSTS AND WHY IT IS ACCEPTABLE:
    - It is a MEANING change to an existing field under an UNCHANGED gate/v1.
      There is NO gate JSON schema file (verified: `artifacts/` holds artifact
      schemas only; the gate envelope's contract is the Go struct plus its
      tests), so no schema bump is available to take and none is needed.
    - NOTHING IS LOST: total_violations + total_warnings reconstructs the old
      number exactly, and any consumer wanting the old semantics can add them.
    - NO IN-REPO CONSUMER READS IT FOR A VERDICT. Verified: `TotalViolations`
      has exactly three non-test references — its declaration, the accumulator,
      and the human footer. `Pass` is computed independently from step statuses.
    - SPEC-010 REQ-008's prose goes stale. See SE6 — flagged, not fixed here.

  `TotalWarnings int \`json:"total_warnings"\`` carries NO omitempty, matching
  `total_violations` and `steps_warned`: zero is the common and meaningful value
  and must stay readable in --json.

  ── DESIGN DECISION 3: "warning", NOT "notice" ────────────────────────────
  ISSUE-100 and DIR-032 both SUGGEST the human line read `(1 blocking, 1
  notice)`, hedged as "something like". This plan uses **warning** instead, and
  the deviation is deliberate: the codebase already speaks one word for this
  concept everywhere — `Violation.Severity == "warning"`, the step status
  "warning", `GateResult.StepsWarned` rendered as "N warned", and
  `blocksVerdict`'s own comment. Introducing "notice" as a third noun for the
  same thing makes the human output teach a vocabulary the JSON does not use.
  A reviewer checking congruence-to-source should read this as an intentional,
  argued departure from an explicitly illustrative suggestion, not a drift.

  ── DESIGN DECISION 4: ZERO CHURN ON THE COMMON CASE ──────────────────────
  A step with only blocking entries renders BYTE-IDENTICALLY to today, and a run
  with zero warnings renders its footer BYTE-IDENTICALLY to today. Only the
  mixed and warning-only cases change. This is not timidity — it is what keeps
  the change reviewable (the diff's blast radius is exactly the cases the issue
  is about) and it is what keeps the SPEC-036 output tests
  (pkg/gate/output_warning_test.go) and the cmd/backstop human-output e2e
  assertions green without editing them. Rendering table, per step:

      blocking > 0, warnings == 0  ->  "  (%d violations)"          UNCHANGED
      blocking == 0, warnings > 0  ->  "  (%d warnings)"            NEW
      blocking > 0, warnings > 0   ->  "  (%d blocking, %d warnings)"  NEW
      both zero                    ->  nothing emitted              UNCHANGED

  Footer:

      warnings == 0  ->  "  Total violations: %d\n"                 UNCHANGED
      warnings > 0   ->  "  Total violations: %d (+%d warnings)\n"  NEW

  Note the existing formatter emits "1 violations" for a single entry. Do NOT
  add pluralization — it is out of scope, it would churn the common case this
  decision exists to protect, and no claim asks for it.

