      StepVerdict            = "fail"
      TotalViolations        = 2   (blocking entries = 1)
      HUMAN: "  coverage_threshold        fail  (2 violations)"
      HUMAN: "  coverage_threshold violations:"
      HUMAN: "  Total violations: 2"
      unset-severity verdict = "fail"

  That is the CI-run-30389988184 instance from the issue, reproduced exactly:
  ONE blocking problem reported as TWO. The last line is the second half of the
  measurement and it is what SE1 hangs on — an unset severity BLOCKS today, so
  the tally's split must classify it as blocking too.

  THREE SEVERITY-BLIND SITES CONFIRMED LIVE (located by name, not line):
    1. pkg/gate/result.go, inside `NewGateResultWithScope` — the accumulator
       `r.TotalViolations += len(s.Violations)`. Feeds the JSON
       `total_violations` field.
    2. pkg/gate/output.go, inside `FormatHuman`'s summary-table loop — the local
