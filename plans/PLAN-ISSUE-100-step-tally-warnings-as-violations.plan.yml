phases:
  - id: phase-1
    name: "Phase 1: Severity-aware tally in the JSON envelope"
    tasks:
      - id: TASK-001
        type: test
        title: "Write the failing severity-tally tests for NewGateResultWithScope"
        description: |
          Create pkg/gate/result_severity_tally_test.go (NEW FILE — do not extend
          pkg/gate/result_test.go, which holds the SPEC-010-mandated tests SE7
          protects).

          RE-READ pkg/gate/result.go AND pkg/gate/policy.go FIRST. Locate the
          accumulator by name — the `r.TotalViolations += len(s.Violations)`
          statement inside `NewGateResultWithScope` — not by line number.

          EVERY TEST IN THIS TASK MUST FAIL ON THE CURRENT TREE except where
          explicitly noted below as a non-regression guard. Record the observed
          pre-fix output for each. The measured baseline to reproduce is in the
          plan notes: the motivating shape yields TotalViolations = 2 where
          exactly 1 entry blocks.

          MANDATED TESTS:

          TestSeverityTally_TotalViolationsCountsBlockingOnly (CLM-001) — THE
            FALSIFICATION. Build the issue's motivating instance: ONE
            coverage_threshold step whose Violations are
            {Severity: "error"} (the shortfall) and {Severity: "warning"} (the
            coverage-exclusion notice). Assert TotalViolations == 1.
            MUST FAIL pre-fix with the value 2 — record it.

          TestSeverityTally_TotalWarningsCountsExplicitWarnings (CLM-002) — on
            the same fixture, assert the new envelope field TotalWarnings == 1,
            and assert it appears in FormatJSON output under the key
            "total_warnings". Also assert it is present (not omitted) with value
            0 on a warning-free result — the field carries no omitempty and a
            consumer must be able to read the zero.

          TestSeverityTally_PartitionIsTotal (CLM-002) — across a multi-step
            fixture mixing error / warning / unset severities over several
            steps, assert TotalViolations + TotalWarnings == the total count of
            entries in every step's Violations slice. Nothing dropped, nothing
            double-counted. Compute the expected total by summing the fixture's
            own slices, NOT by writing a literal — a literal would stop
            falsifying the moment someone edits the fixture.

          TestSeverityTally_UnsetSeverityCountsAsBlocking (CLM-003) — a
            Violation with NO Severity field set counts toward TotalViolations
            and NOT toward TotalWarnings. This is the fail-closed rule and the
            direct guard against SE1's wrong spelling. Assert BOTH directions
            (in the blocking count, absent from the warning count) — asserting
            only the first would pass under an implementation that
            double-counts.

          TestSeverityTally_CaseAndWhitespaceNormalizedLikeVerdict (CLM-003) —
            severities "Warning", "WARNING" and " warning " each count as
            WARNINGS, matching blocksVerdict's EqualFold+TrimSpace
            normalization. A hand-rolled `== "warning"` copy fails this; so does
            SE1's `== "error"` spelling. Pair it with a same-fixture assertion
            that `StepVerdict` classifies those identical values the same way,
            so the test proves the tally AGREES WITH the verdict rather than
            merely being case-insensitive on its own.

          TestSeverityTally_NoSecondBlockingDefinition (CLM-004) — THE DRIFT
            GUARD, and it is written HERE, in phase 1, deliberately: the
            hand-rolled copy it exists to catch can be written into result.go
            during TASK-002, and the case/whitespace test above only catches a
            naive `== "warning"` copy, not an inlined
            `EqualFold(TrimSpace(...))` one. Writing it here is what keeps the
            red inside a task whose file scope still contains result.go.
            Read pkg/gate/result.go AND pkg/gate/output.go as SOURCE TEXT
            (os.ReadFile on the two paths) and assert NEITHER contains the
            FIELD-ACCESS form `.Severity` (leading dot included). That is the
            forbidding predicate — not `Severity ==` / `Severity !=`, which an
            inlined `strings.EqualFold(strings.TrimSpace(v.Severity),
            "warning")` would slip past while creating exactly the second
            definition CLM-004 forbids (and that shape is the natural in-repo
            idiom — pkg/gate/baseline.go already writes
            `strings.TrimSpace(v.Severity)`). `.Severity` catches every
            hand-rolled approach, naive or EqualFold-inlined, because any of
            them must read the field to compare it. The two `==`/`!=` forms MAY
            additionally be listed to produce a sharper failure message when
            they specifically match, but `.Severity` is the assertion that
            decides pass/fail. Do NOT forbid the bare token `Severity` without
            the dot — result.go legitimately DECLARES the `Violation.Severity`
            struct field and comments mention it.
            MEASURED: `grep -n "\.Severity" pkg/gate/result.go
            pkg/gate/output.go` returns NOTHING at HEAD, so the guard is
            genuinely green pre-fix; and it stays green post-fix, because
            tallyBySeverity passes whole `Violation` structs to blocksVerdict
            rather than reading the field, and TASK-005 step 3 mandates the same
            `blocksVerdict(violation)` call for the detail-line rendering.
            A CONTENT scan only: no `git status`, no `git diff`, no tree-state
            assertion, because this tree is shared and a tree-state check blames
            whoever runs it. Failure message must name blocksVerdict as the
            single authority these files are required to call. This test PASSES
