  ── SHARP EDGES ───────────────────────────────────────────────────────────
    SE1  DO NOT WRITE `Severity == "error"` — THE ISSUE'S OWN SUGGESTED SPELLING
         IS WRONG, and this plan overrides it deliberately and on the record.
         ISSUE-100's Solution (b) proposes that total_violations "becomes a
         count of `severity == \"error\"` entries". The ratified contract
         (pkg/gate/policy.go, the block above `blocksVerdict`) says otherwise:
         an explicit "warning" is exempt; ANY other value — INCLUDING AN ABSENT
         ONE — blocks, fail-closed. Measured on the live tree while authoring: a
         Violation with no Severity set yields StepVerdict "fail". So
         `== "error"` would count an unset-severity violation as a NOTICE while
         the gate blocks on it — under-reporting a real failure, fail-OPEN, and
         strictly worse than the over-reporting bug this lane exists to fix.
         Call `blocksVerdict`. Do not inline it, copy it, or "simplify" it to a
         string equality.

    SE2  pkg/gate/policy.go IS OUT OF SCOPE — THE VERDICT HALF IS ALREADY FIXED.
         The severity-aware verdict landed in 2e49745 and is locked end to end
         by cmd/backstop/pack_severity_contract_test.go (3ac6e7f), a
         founder-ratified contract; PLAN-ISSUE-105 then propagated it to the
         step builders. policy.go appears in NO task's `files` list and must not
         be edited, "tidied", or made the home of the tally helper. If the tally
         appears to need a policy.go change, that is a signal the tally is being
         written wrong — re-read SE1.

    SE3  THE LITERAL `Total violations:` PREFIX IS LOAD-BEARING.
         cmd/backstop/exit_surfacing_streams_test.go asserts on that exact
