  RENDERER HALF IS NOT IN SCOPE ... Do not 'fix' the renderer here."

  THIS LANE IS THE RENDERER/TALLY HALF ONLY. It changes what a reader is TOLD
  about a set of violations. It changes NOTHING about Pass, step Status, exit
  code, or which findings block. pkg/gate/policy.go is in NO task's file scope.

