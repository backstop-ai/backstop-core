  ── THE DEFECT, MEASURED FOR REAL (not transcribed from the issue) ─────────
  Reproduced 2026-08-16 in a detached worktree at HEAD via a standalone program
  against the EXPORTED pkg/gate API, feeding the issue's motivating shape: one
