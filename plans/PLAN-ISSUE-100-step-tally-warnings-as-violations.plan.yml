         DIR-032 item 7 says it "should be planned together or after this
         item" — and it will look tempting the moment the tally is
         severity-aware. It is still NOT this lane: it decides which STATUS a
         step reports (a verdict question) where this lane decides how findings
         are COUNTED (a reporting question). Widening to catch it would put a
         verdict change inside a renderer fix — exactly the mixing
         PLAN-ISSUE-105 refused in the other direction. step_coverage.go
         appears in no task's `files` list.

    SE6  SPEC-010 REQ-008's PROSE GOES STALE — SURFACE IT, DO NOT EDIT THE SPEC.
         specs/SPEC-010-gate.spec.md REQ-008 defines the field as
         "total_violations (integer count of all violations across all steps)".
         CLM-001 makes that sentence wrong. DO NOT hand-edit the spec —
         CLAUDE.md routes all artifact evolution through the purpose-built
         agents, and a planner/implementer editing spec prose is the drift that
         rule exists to prevent. DO NOT bend the fix to preserve the stale
         sentence either. Why nothing goes red meanwhile: SPEC-010 is
         `status: draft`, and the gate enforces contracts/traceability only over
