         `requireReportThenNoErrorLine(...)` call passing "Total violations:"
         and "Steps:" as its markers, NOT by line number. That test has nothing
         to do with severity and must not be edited by this lane. The footer
         change APPENDS to the line; it never rewrites the prefix.

    SE4  THE COMMON CASE MUST RENDER BYTE-IDENTICALLY — AN ASSERTION, NOT A
         HOPE. Per Design Decision 4: a blocking-only step keeps
         "(N violations)" and a warning-free run keeps "Total violations: N".
         Pinned by TestSeverityTally_HumanUnchangedWhenNoWarnings precisely so
