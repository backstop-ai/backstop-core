    The fix is page-front-matter fallbacks (`page.page_kind`, `page.hero_question`,
    `page.hero_lede`) plus guarding the next-action block on a present `next_action`.
    The empty href is not cosmetic: it becomes a hard `link-resolution` finding the
    moment CLM-009 lands.

