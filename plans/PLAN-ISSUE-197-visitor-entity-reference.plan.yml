         `scripts/entityref/main.go` is production Go outside the declared architecture.
      2. `backstop-ai/backstop-self/...no-baked-language-token` on main.go — the
         `"go.mod"` string literal in `repoRoot()`. The rule's regex enumerates
         `go\.mod` explicitly and does NOT exclude non-test files.
      3. `backstop-ai/backstop-self/...no-baked-tool-exec` on main_test.go —
         `exec.Command("go", "run", "./scripts/entityref", "-check")`. The rule's only
         path exclusion is `tests/smoke/**`; `*_test.go` is NOT excluded, and `go` is
         not on the allowed literal-infra list (git, gh, sh, /bin/sh, sandbox-exec).
      4. `backstop-ai/cobra-cli-standards/...exit-code-discipline` on main.go —
         `os.Exit(1)` inside `fatal()`, outside `main()`.
      5. `backstop-ai/go-toolchain/staticcheck` S1011 on main.go — the
         `for _, k := range sortedKeys(ent.StatusMeanings)` append loop in the status
         fallback should be a variadic append.
      6. `coverage_threshold`: `scripts/entityref/main.go` 5/310 statements (1.61%,
         independently reproduced with `go tool cover`) against the 80% per-file floor.
    Two `go-standards/error-wrapping-required` warnings also land on main.go.
