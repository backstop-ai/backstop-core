  SHARP EDGES
  ══════════════════════════════════════════════════════════════════════════════
  1. Two roles gate the ledger, not one (CLM-012): `allowedRoles()` AND
     `expectedRole()`. Fixing one alone leaves the row rejected.
  2. `expectedRole("docs/unlisted.md")` must keep returning "" — the entity-page
     mapping is an exact eight-path set, never a `docs/*.md` prefix or glob.
     `TestDeliveryInventory_PathRoleMatrix` asserts that negative today.
  3. The architecture-pack version is UNKNOWN until adoption. ISSUE-192's
     `websitejourney` release may take the next number. Resolve the real tag, commit,
     and content hash; never write a placeholder or edit installed pack bytes.
  4. The prototype's `main_test.go` name `TestGeneratedPagesMatchCommitted` is being
     replaced, not preserved — its subprocess IS finding 3. Do not keep a
     "parameterised executable" variant of it; there is no reason for this package to
     spawn a process at all.
  5. Coverage is measured PER FILE from the profile, not as a package total. 5/310
     needs ~248 covered statements; the deep helpers (`humanizePattern`, `fieldForm`,
     `lookupProp`, `mergeBase`, `mdCode`, `sectionTable`, `statusValues`) must be
     driven by real assertions, not by a smoke test that merely executes them.
  6. `-check` reads committed page bytes. Regenerate and commit in the same change, or
     the drift guard reports a false red against a stale file.
  7. The `data-page-kind` fallback is what activates the ink remap. If it is added to
     `default.html` but the `html:has(...)` selector is not extended, the pages render
     with dark-theme tokens on paper chrome — visually broken, mechanically green.
  8. Adding entity routes to the linkable catalog turns on link checking for pages that
     were previously unchecked (CLM-009). Expect the two ISSUE-198 pack links to fail
     first (CLM-010); that is the catalog working, not a regression.
  9. Do not resolve any finding by adding `scripts/entityref/main.go` to
     `.backstop/coverage-exclusions`, by adding a `@waiver:` comment, or by moving the
     generator under an already-classified `scripts/` package to borrow its component.

