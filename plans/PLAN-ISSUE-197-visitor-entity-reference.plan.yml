  CLM-003 — MAKING THE GENERATOR UNIT-TESTABLE IN-PROCESS IS THE SINGLE CHANGE THAT
    RETIRES THREE FINDINGS AT ONCE. The shipped `main_test.go` is one function that
    shells out to `go run ./scripts/entityref -check`; that subprocess is finding 3,
