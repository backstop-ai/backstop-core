     the built HTML (CLM-004). Proven by build, not by reading.
  2. Blank lines inside hidden containers decide whether the closed-world block splitter
     sees a legal journey-link block or unclassified copy (CLM-007).
  3. The hero string must occur exactly once per source file and exactly once in the
     rendered `<h1 data-page-question>` (CLM-002).
  4. Claim owner anchors are derived from the LAST heading preceding the region. Moving a
     `.canonical-note` past a heading silently re-owns its claim and fails
     `claim linkage/bytes`.
  5. `origin/main` is the baseline. Whole-file copies from the prototype import the
     Evaluate rewrite, `/pack/examples/` + `/pack/guide/`, entity pages, the four-item
     navigation, and the claim relocations — five other issues (CLM-006, CLM-013).
  6. The `@media (max-width: 56rem)` and `(max-width: 30rem)` blocks already carry
     load-bearing home rules and a literal asserted by a shipped test; add to them, never
     rewrite them (CLM-009).
  7. `tests/public-site-helpers.ts` is read as SOURCE TEXT by
     `TestSiteCheck_ChromiumNoJSExactInteractionMatrixPasses`,
     `TestSiteCheck_ActualRootFontRelayoutPasses`, and
     `TestSiteCheck_LocalOverflowAndNavigationModesPass`. The literals `toBeVisible()`,
     `primaryNavigation`, `utilityNavigation`, `toBe("./b backstop.sh")`,
     `assertRequiredSurface`, `assertContentCompleteness`, `assertKeyboardOrderAndBounds`,
     `assertLocalOverflow`, `data-overflow-region`, `ArrowRight`, and the three viewport
     tuples must all survive the edit.
  8. `docs/assets/css/backstop-tokens.css` is `retired-bootstrap`, deletion-only. Link it;
     any modification is unrepresentable in the closed matrix.
  9. New CSS uses design tokens only. The installed design-system pack's `no-raw-colors`
     rule runs over the built stylesheet; a raw hex literal in the model block is a gate
     failure, and a waiver is not the remedy. If the `#0c0d0d` `theme-color` meta in the
     layout is flagged, report it rather than suppressing it.
  10. `verify-public-product-model.sh` is the closed-world verifier AND this plan's
     `test_command`. Editing its `heroes` list or `allowances` map is authoring the
     contract, which is why it lands in the RED phase, before the page.
  11. PLAN-ISSUE-193 may land before or after this plan, and both orders must produce the
     same tree. Every shared-file edit therefore begins with a detection read and is a
     cell-scoped merge (CLM-014). The failure mode is silent in both directions: reverting
     193's evaluate allowances, its retargeted JLINK sources, its relocated CLAIM-011 /
     CLAIM-020 regions, or its `model-use-cases-packs.sh` widening still builds, and so
     does re-landing an edit 193 already made. Read the file; do not assume `origin/main`.
  12. The prototype branch is separately red on `--check-diff` because it carries 171
     changed matrix-and-non-matrix paths against a 70-row inventory. That red belongs to
     the sibling issues. On a branch cut from `origin/main` carrying only this plan's
     files, no inventory row changes (CLM-012); report any residue truthfully instead of
     absorbing it.

phases:
  - id: phase-1
    name: "Phase 1: RED — state the Model contract before the page exists"
    tasks:
      - id: TASK-001
        type: test
        title: "RED: retarget the closed-world verifier at the approved Model page"
        description: |
          Author the source-of-truth contract in scripts/verify-public-product-model.sh
          FIRST, so the page that follows has something to satisfy.

          Step 0, before editing: read the file and decide the landing order (CLM-014).
          Grep it for a JLINK-005, JLINK-006, JLINK-008, or JLINK-021 tuple whose SOURCE
          route is '/model/', and for the size of `allowances['docs/evaluate.md']`.
          - If those tuples still source from '/evaluate/' and the evaluate allowance map
            still holds its three Seed 1 entries, PLAN-ISSUE-193 has NOT landed: the file
            is at origin/main and the two edits below apply to those bytes.
          - If they source from '/model/' and the evaluate map holds twelve entries,
            PLAN-ISSUE-193 HAS landed: the file is NOT at origin/main, and the two edits
            below apply to the CURRENT bytes. Do not diff against origin/main, do not
            restore the '/evaluate/' hero cell, do not restore the three-entry evaluate
            allowance map, and do not re-source any JLINK tuple back to '/evaluate/'. In
            that state '/model/' is the source route for JLINK-005, JLINK-006, JLINK-008,
            and JLINK-021 as well as JLINK-010/011/014, and TASK-005 must satisfy all
            seven — record which set is live so TASK-005 reads it rather than re-deciding.
          Either way this task never edits
          scripts/tests/public-product-model/pages/model-use-cases-packs.sh: the CLAIM-011
          and CLAIM-020 widening of its tuple is PLAN-ISSUE-193's, kept if present and
          left un-made if absent.

          Two edits, nothing else. First, in the `heroes` list, replace index 2 —
          'How does Backstop turn intent into a trustworthy verdict?' — with
          'How it works'. Leave the other nine hero strings AS THEY CURRENTLY STAND — at
          origin/main values if 193 has not landed, at 193's retargeted /evaluate/ value if
          it has — and leave the `paths` list and the `sources` list untouched: this plan
          does not know about /pack/examples/ or /pack/guide/, and importing the
          prototype's route lists would silently absorb ISSUE-198/199. Second, replace the
          `allowances['docs/model.md']` sub-dict wholesale with the exact block set of the
          approved page, and leave every other page's allowance map byte-for-byte
          untouched — including `allowances['docs/evaluate.md']` in whichever of its two
          legal states it is in (CLM-014). Wholesale replacement is order-safe for the
          MODEL sub-dict specifically, and only for it: PLAN-ISSUE-193's own TASK-001
          replaces `allowances['docs/evaluate.md']` and never writes a key under
          `docs/model.md`, so there is nothing of 193's to revert here. Replacing any
          other page's sub-dict — or rebuilding the whole `allowances` dict from
          origin/main rather than editing the one key — would revert 193's twelve evaluate
          entries and is the failure sharp edge 11 names.

          Derive the allowance keys mechanically from docs/model.md at
          0a6010c0e45b290cbacc6713b83d5da4f5704ba9, adjusted for the hidden-container
          `markdown="1"` attribute this plan requires (CLM-004). Define the work
          contributes exactly TWO prose keys — its ONE lede and its ONE caption — because
          the section is lede, `.work-topology`, caption, `.work-paths`, and not two ledes
          (CLM-001); a third prose key there means a second lede was transcribed. The full
          key set: that lede, that caption, the `.work-topology` figure, the `.work-paths`
          figure, `<div class="canonical-note" markdown="1">` and its `</div>`,
          'Packs own standards, engines, and proof.', the `.pack-figure`, the
          `<p class="figure-bridge">…</p>` bridge, the `.pack-compose` figure, the two
          Detect drift ledes, the `.ratchet-figure` and `.claim-figure`, the enforcement
          lede, the `.loop-figure`, the ARCH-002 note block, the two ownership
          paragraphs, the ARCH-003 architecture-source paragraph, and
          `<div class="canonical-anchors" markdown="1">` with its `</div>`. Every key is
          a description of a real delivered block, not a wildcard, and each carries a
          short nonconsequential-classification value in the established style
          ('visitor operating guide', 'visitor operating table', 'canonical source note',
          'canonical claim anchors', 'architecture-source identification').

          Honor the masking semantics recorded in CLM-007 when deciding which strings are
          separate keys: a masked claim region separates the container open tag from its
          closing `</div>`, so both are their own blocks; a journey-link block is exempt
          only when it fullmatches marker plus link with nothing else in the block.

          That masking is why the allowance map is the SAME in both landing orders: the
          extra CLAIM-011 / CLAIM-020 regions and the extra JLINK-005 / JLINK-006 /
          JLINK-008 / JLINK-021 blocks that 193 puts on this page are masked or exempt, so
          they contribute no allowance key. Do not add speculative keys for them, and do
          not remove a key when they are absent.

          Do not touch the claim-region logic, the JLINK cardinality logic, the concept
          or architecture-view owner checks, the legacy-responsibility table, the
          adoption-instruction contract, the evidence truth contract, or the dispatch
          list at the bottom of the script. Do not relax any check to accommodate the new
          page.

          RED receipt, required before any page edit: run
          `./scripts/verify-public-product-model.sh` against the pre-rewrite tree and
          require it to fail with `docs/model.md: hero_question` — the topology YAML still
          carries the verdict question while the verifier now demands 'How it works'. A
          YAML/parse/interpreter error is NOT this task's RED evidence; if the script
          cannot run, repair the script. If 193 landed first, require additionally that
          the run reports no NEW `docs/evaluate.md` diagnostic and no JLINK source-anchor
          diagnostic, which is the receipt that this edit merged into 193's file instead
          of reverting it.
        files:
          - scripts/verify-public-product-model.sh
        claims:
          - CLM-001
          - CLM-002
          - CLM-005
          - CLM-006
          - CLM-007
          - CLM-014
        depends_on: []

      - id: TASK-002
        type: test
        title: "RED: retarget the content-topology hero assertion at 'How it works'"
        description: |
          In scripts/tests/public-product-model/verify-content-topology.sh, replace index 2
          of the `heroes` list — 'How does Backstop turn intent into a trustworthy
          verdict?' — with 'How it works'.

          Change nothing else, and take the rest of the file AS IT STANDS rather than from
          origin/main: PLAN-ISSUE-193 mirrors its own hero and JLINK edits into this same
          script, so if it landed first the /evaluate/ hero cell and four JLINK source
          anchors are already retargeted and must be kept exactly as 193 left them
          (CLM-014). The `paths` and `sources` lists keep /packs/ and /extend/, the
          neighborhood owner list keeps its Seed 1 owners, the navigation assertion keeps
          seven primary and two utility routes, and the JLINK edge/label matrix stays
          twenty-four rows wide with whatever source anchors are currently declared. Those
          belong to the pack-fleet and Evaluate issues, and rewriting them here would both
          exceed the fence and desynchronize this script from
          docs/_data/content-topology.yml, which this plan changes only in the Model hero
          cell (CLM-003).

          RED receipt: run
          `./scripts/tests/public-product-model/verify-content-topology.sh` against the
          pre-rewrite tree and require the assertion
          `docs/model.md: hero_question` to fail. Also record that the same script still
          passes every other assertion, proving the edit is a one-cell retarget rather
          than a broad loosening.
        files:
          - scripts/tests/public-product-model/verify-content-topology.sh
        claims:
          - CLM-002
          - CLM-003
          - CLM-014
        depends_on: []

      - id: TASK-003
        type: test
        title: "RED: assert the Model hero, the paper/ink chrome, and the home reflow fence"
        description: |
          Work only inside the already-declared scripts/sitecheck/presentation_test.go.
          Do not add a new file to scripts/sitecheck: a new path would need a Seed 4
          inventory row, and CLM-012 keeps this plan out of that matrix.

          First, in `canonicalPresentation()`, change the /model/ row's HeroQuestion to
          "How it works". Leave Route, PageKind "model", Treatments
          {"evidence-cards", "local-overflow"}, and NextAction "/adopt/" alone, and leave
          all nine other rows AS THEY CURRENTLY STAND — not as origin/main has them. If
          PLAN-ISSUE-193 landed first, its /evaluate/ row already carries that page's own
          hero and NextAction "/model/", and reverting it to origin/main would red
          `TestSiteCheck_NavigationMatrixPasses` against a site-presentation.yml this plan
          is not allowed to edit (CLM-014). The prototype's rows for /adopt/,
          /use-cases/, /pack/examples/, /pack/guide/, /reference/, and /contributing/
          belong to other issues and are neither imported nor anticipated. This
          immediately reds
          `TestSiteCheck_NavigationMatrixPasses`, whose byte-match against
          docs/_data/site-presentation.yml now fails on the Model hero, and it keeps
          `TestSiteCheck_NavigationMatrixRejectsInvalidCell`'s Pages[2] hero mutation
          meaningful.

          Second, add `TestSiteCheck_ModelPaperInkChromeAndHomeReflowPasses` to the same
          file. It reads docs/_layouts/default.html and docs/assets/css/site.css from the
          repository root and requires, positively: a paper-kind list in the layout that
          CONTAINS `model`; `<meta name="theme-color" content="#0c0d0d">` emitted on the
          paper branch; a conditional `/assets/css/backstop-tokens.css` stylesheet link;
          `<meta name="color-scheme" content="dark">` retained on the non-paper branch;
          in the stylesheet an `html:has(` remap whose selector list INCLUDES
          `[data-page-kind="model"]` and which maps `--ds-canvas`, `--ds-text`,
          `--ds-accent`, and `--ds-border` onto the paper/ink tokens; a
          `[data-page-kind="model"] .canonical-anchors` / `.canonical-note` rule carrying
          `clip: rect(0, 0, 0, 0)`; and the model figure surfaces
          (`.work-topology`, `.work-paths`, `.model-figure`, `.figure-bridge`,
          `.loop-core`).

          Both membership assertions are POSITIVE and OPEN, never exhaustive. Assert
          `model` is a member of the paper-kind list and that `[data-page-kind="model"]`
          is one of the selectors in the `html:has(...)` list; do NOT assert either
          collection equals {model} or {model, evaluation}, and do NOT assert a length.
          An exhaustive allowlist would red the moment PLAN-ISSUE-193 adds `evaluation` or
          ISSUE-196/197 add their own kinds — a sibling landing must never turn this test
          red (CLM-014). Parse the list into a set and make membership claims against it.

          Assert `.work-paths` SUBORDINATION rather than its existence (CLM-001): the
          `[data-page-kind="model"] .work-paths` rule carries a `border-top` divider whose
          color is a `var(--ds-border)` token reference and a `padding-top`, and the
          `.work-path-label` rule sets `color: var(--ds-muted)` at a `font-size` strictly
          below the surrounding lede size. A `.work-paths` block with no divider and
          unmuted labels renders the bounded-fix path as a peer feature row, which is a
          rejected treatment, so a presence-only assertion would pass on the defect.

          Its negative half is the regression fence and is what distinguishes an additive
          restyle from a sitewide one. Require that the 56rem media block still contains
          `[data-page-kind="home"] .nav ` and `[data-page-kind="home"] .nav-links`, that
          `grid-template-columns: minmax(0, 1fr) minmax(0, 1fr)` is still present, that
          `.model-figure` and `.work-topology` carry no `background:` or `border:`
          declaration (no slide frames), and that the model-scoped stylesheet block
          introduces no raw hex color literal. The one negative membership claim is
          `home`: assert `home` is NOT in the paper-kind list, because the homepage owns
          its own chrome and PLAN-ISSUE-190 fences it. Make no claim about any other kind.

          RED receipt: run
          `go test ./scripts/sitecheck -run '^(TestSiteCheck_NavigationMatrixPasses|TestSiteCheck_ModelPaperInkChromeAndHomeReflowPasses)$' -count=1 -v`
          against the pre-rewrite tree. Both must EXECUTE and FAIL on their intended
          assertions — the hero byte-match, and the absent `model` paper-kind membership
          and absent model stylesheet block. A compile failure is not RED evidence. If 193
          landed first, the paper-kind list and the `html:has(...)` list already exist
          carrying `evaluation`; the new test must still red on `model` membership
          specifically, and must not red on `evaluation` being present.
        files:
          - scripts/sitecheck/presentation_test.go
        claims:
          - CLM-002
          - CLM-008
          - CLM-009
          - CLM-014
        test_names:
          - TestSiteCheck_ModelPaperInkChromeAndHomeReflowPasses
        depends_on: []

      - id: TASK-004
        type: test
        title: "RED: partition the browser completeness contract into visitor and hidden blocks"
        description: |
          Teach tests/public-site-helpers.ts that a required block can be a canonical
          topology anchor rather than visitor copy, and fence that new contract with a Go
          source assertion. Do not edit tests/public-site.spec.ts and do not touch
          playwright.config.ts: `testMatch` stays `public-site.spec.ts` (CLM-010).

          Neither of this task's two files is shared with PLAN-ISSUE-193, so it needs no
          detection step: 193 lists tests/public-site-helpers.ts and playwright.config.ts
          in its own unchanged fence and never edits
          scripts/sitecheck/pipeline_contract_test.go. Write these two files against their
          current bytes and make no claim about 193 here. The order-freedom this task must
          still honor is in WHAT it asserts: the eleven-anchor /model/ inventory below is
          the same in either order, because 193 relocates claims and journey-link sources
          ONTO existing `/model/` anchors and adds no new heading (CLM-014). Do not add a
          twelfth anchor in anticipation of a sibling, and do not assert the number of
          claim regions or journey links the container holds — that count is what changes
          with landing order, and the marker-level contract belongs to
          verify-public-product-model.sh, not to the browser lane.

          In `assertContentCompleteness`, keep reading `data-required-blocks` and keep
          `toHaveCount(1)` for every id. Then partition. A required block whose element
          has a `.canonical-anchors` ancestor is a HIDDEN ANCHOR: assert it is present
          exactly once and that it is not visitor-visible, by evaluating in the page that
          the nearest `.canonical-anchors` ancestor has a bounding box no larger than 1px
          in each axis and a computed `clip` of `rect(0px, 0px, 0px, 0px)`. Do not assert
          `toBeVisible()` on it, and do not assert substantive visible text for it — a
          1px clipped box can satisfy Playwright's visibility heuristic, so an unchanged
          assertion would pass vacuously rather than prove anything. A required block
          with no such ancestor is a VISITOR BLOCK and keeps every existing assertion
          unchanged: visible, at least one visible sibling block, at least 80 characters
          of visible text, first-content gap at most 160px.

          Add a `/model/`-specific assertion in the same helper: the route exposes exactly
          one `.canonical-anchors` container, that container holds `#intent-artifacts`,
          `#work-tracks`, `#bounded-execution`, `#recipes`, `#gates-and-policy`,
          `#waivers`, `#capabilities-and-journeys`, `#provenance-and-verification`,
          `#harness-integration`, `#product-category`, and `#delivery-lifecycle`, each
          present exactly once and each not visitor-visible, and the four
          `data-required-blocks` ids resolve to three visitor blocks plus
          `delivery-lifecycle` as a hidden anchor. That assertion is what stops the Seed 1
          appendix from ever becoming the visitor page again, and it is what would fail if
          a future edit un-hid the container instead of keeping the anchors.

          Preserve every literal that sitecheck reads out of this file as source text —
          `toBeVisible()`, `primaryNavigation`, `utilityNavigation`,
          `toBe("./b backstop.sh")`, `assertRequiredSurface`, `assertContentCompleteness`,
          `assertKeyboardOrderAndBounds`, `assertLocalOverflow`, `data-overflow-region`,
          `ArrowRight`, and the three viewport tuples — and leave `canonicalRoutes`,
          `primaryNavigation`, and `utilityNavigation` at their Seed 1 membership.

          In scripts/sitecheck/pipeline_contract_test.go add
          `TestSiteCheck_HiddenCanonicalAnchorBrowserContractPasses`, in the established
          source-reading style of that file. It requires
          tests/public-site-helpers.ts to contain the partition (a `.canonical-anchors`
          containment test, the clip/1px hidden assertion, and the retained
          visible-and-substantive branch) and the `/model/` canonical-anchor inventory;
          and it requires tests/public-site.spec.ts and playwright.config.ts to be
          unchanged in the ways that matter, by re-asserting `testMatch` is
          `public-site.spec.ts` and that the spec still iterates `canonicalRoutes` twice.
          Do not weaken or rename the existing tests in that file.

          RED receipt: build the current Seed 1 tree and run the browser lane for the
          Model route only —
          `npx playwright test tests/public-site.spec.ts --grep "/model/"` — and require
          failure on the missing `.canonical-anchors` container. Then run
          `go test ./scripts/sitecheck -run '^TestSiteCheck_HiddenCanonicalAnchorBrowserContractPasses$' -count=1 -v`
          and require it to pass only once the helper carries the new contract, so the
          Go test is a durable fence over a browser assertion the Go suite cannot execute.
        files:
          - tests/public-site-helpers.ts
          - scripts/sitecheck/pipeline_contract_test.go
        claims:
          - CLM-004
          - CLM-010
          - CLM-014
        test_names:
          - TestSiteCheck_HiddenCanonicalAnchorBrowserContractPasses
        depends_on: []

  - id: phase-2
    name: "Phase 2: GREEN — land the approved page and its paper/ink chrome"
    tasks:
      - id: TASK-005
        type: implementation
        title: "GREEN: replace the Seed 1 appendix with the approved Model visitor page"
        description: |
          Replace docs/model.md with the locked copy from
          0a6010c0e45b290cbacc6713b83d5da4f5704ba9, transcribed rather than rewritten,
          and retarget the two hero cells. The locked section order, ledes, captions, and
