  CLM-010 — THE BROWSER COMPLETENESS CONTRACT MUST ASSERT HIDDENNESS RATHER THAN ASSUME
    VISIBILITY. `assertContentCompleteness` in `tests/public-site-helpers.ts` reads
    `data-required-blocks` off the rendered hero and, for every id, requires
    `toHaveCount(1)`, `toBeVisible()`, at least one visible sibling block, at least 80
    characters of visible text, and a first-content gap under 160px. After the rewrite
    `delivery-lifecycle` is a hidden canonical anchor. Leaving the assertion unchanged is
    not safe in either direction: with the anchor absent it fails on cardinality, and once
    the anchor renders inside the 1px clipped container Playwright's visibility heuristic
    (non-empty bounding box, no `visibility: hidden`) can report it VISIBLE and pass
    vacuously. The contract is therefore partitioned — required blocks inside
    `.canonical-anchors` must be present exactly once and provably not visitor-visible;
    required blocks outside it keep the full visible-and-substantive assertions. The
    appendix is not un-hidden, `playwright.config.ts` `testMatch` stays
    `public-site.spec.ts`, and packs stay external.

