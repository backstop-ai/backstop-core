            `[Find adjacent guidance](/status/#adjacent-guidance)` under
            `{#product-category}`, JLINK-006
            `[Review support and limits](/status/#supported-and-limited)` under
            `{#gates-and-policy}`, JLINK-008
            `[Check compatibility details](/reference/#compatibility)` under
            `{#harness-integration}`, and JLINK-021
            `[Trace the sources](/reference/#source-traceability)` under
            `{#provenance-and-verification}`. Transcribe every one of them into the
            rewritten page inside the hidden `.canonical-anchors` container, each under the
            heading its record names and each as the LAST block of its hidden section
