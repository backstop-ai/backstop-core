          Record which state is live and reconcile it with what TASK-001 observed; if the
          two disagree, stop and re-read rather than guessing.

          Frontmatter keeps `title: Product Model`, `layout: default`,
          `permalink: /model/`, sets `hero_question: "How it works"`, and adds
          `hero_lede: "Define the work. Enforce your standards. Detect drift."`.

          Three deliberate departures from the prototype file, each required by evidence:

          (a) Every hidden container carries `markdown="1"` —
          `<div class="canonical-anchors" markdown="1">` and each
          `<div class="canonical-note" markdown="1">`. Without it kramdown passes the
          block through raw, the eleven canonical heading ids never reach the built page,
          and `#delivery-lifecycle` — a declared required_block — does not exist at all
          (CLM-004).

          (b) The three journey links /model/ owns at origin/main stay on the page,
          hidden — plus any link Step 0 found relocated onto /model/: JLINK-010
          `[Inspect artifact schemas](/reference/#artifact-schema-catalog)` under the
          `{#operating-model}` heading, JLINK-014
          `[Read the gate reference](/reference/#gate)` under `{#enforcement-loop}`, and
          JLINK-011 `[Review project boundaries](/status/#project-boundaries)` under
          `{#ownership-boundaries}` — each as its own marker-plus-link block, blank-line
          separated, inside a `markdown="1"` hidden container, and each after the heading
          that content-topology names as its `source_anchor` (CLM-005, CLM-007).

          (c) The page carries the four claim regions /model/ owns at origin/main —
          CLAIM-022 under `{#operating-model}`, CLAIM-010 under `{#ownership-boundaries}`,
          CLAIM-019 under `{#harness-integration}`, CLAIM-023 under
          `{#delivery-lifecycle}` — with bodies byte-identical to their
          `statement_markdown` in docs/_data/evidence-inventory.yml, plus exactly the
          regions Step 0 found already relocated onto the page. This plan never PERFORMS a
          relocation: if 193 has not landed, CLAIM-011 and CLAIM-020 belong to /evaluate/
          and importing them would force edits to evidence-inventory.yml,
          website-capability-map.yml, websitejourney, and docs/evaluate.md (CLM-006); if it
          has landed, they are already here and deleting them would red the claim-region
          bijection, the owner-anchor check, and 193's widened
          `model-use-cases-packs.sh` tuple. Either way their headings survive as hidden
          anchors so the thirteen product-model concepts and three ARCH views keep their
          declared owners — and so 193 has a destination if it lands second.

          Keep the `.canonical-anchors` heading set complete: Intent artifacts, Work
          tracks, Bounded execution, Recipes, Gates and policy, Waivers, Capabilities and
          journeys, Provenance and verification, Harness integration, Product category,
          and Delivery lifecycle. Keep the literal strings
          `docs/_diagrams/ARCH-001-delivery-lifecycle.mmd`,
          `docs/_diagrams/ARCH-002-enforcement-loop.mmd`, and
          `docs/_diagrams/ARCH-003-ownership-boundaries.mmd` on the page, and keep the
          two legacy-responsibility needles `Terminal state records whether work was
          delivered` and `` `delivered_by` or a direct typed artifact `` inside the
          `{#operating-model}` section — `pages/model-use-cases-packs.sh` deletes each of
