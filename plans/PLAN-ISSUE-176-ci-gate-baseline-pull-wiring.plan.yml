  ISSUE-176 — CI's `gate` job runs `backstop gate` against a worktree with no
  `.backstop/baseline.json`, and three ratchet tests in
  `cmd/backstop/bun_ratchet_flip_test.go` fail identically on every run as a result.

  THE DIAGNOSIS IS NOT RE-DERIVED HERE. ISSUE-176's "## Root cause, sharpened"
  section carries it in full with file:line citations: the self-healing pull already
  exists end to end (`resolveBaselineCache` → `refreshBaselineFromRemote` →
  `runBaselinePull`, `cmd/backstop/gate.go` / `cmd/backstop/baseline.go`), runs
  unconditionally before `g.Run()`, and degrades silently to a nil baseline. The gap
  is CI wiring: no `GH_TOKEN` anywhere in `.github/workflows/ci.yml` (so
  `ensureGitHubAuth`'s `gh auth status` fails first), and no `actions: read` (so the
  pull's `gh api .../actions/runs` and `.../actions/artifacts` calls would 403 even
  with a token). This plan decides and sequences the FIX.

