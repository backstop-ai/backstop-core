             PLAN-ISSUE-176 to read `status: completed`. `delivered_by` re-validates
             the backing plan IN FULL, so a plan that stopped validating clean
             surfaces here as `issue/delivered-by-plan-invalid` rather than as a
             plan-level error — do not be misled by the rule name.

             ★ IF `issue/delivered-by-plan-not-completed` APPEARS, TASK-010's
               ordering was inverted (issue closed before the plan flipped). Fix the
               ORDER — never by removing `delivered_by`, never by softening the
               close.

             ALSO validate the follow-on issue TASK-007 filed, by its assigned id.

          2. RE-SCOPED GATE over everything this lane changed, artifacts included:

               ./bin/backstop gate

             `artifact_validation` and `status_drift` must both be clean against the
             POST-mutation tree. `status_drift` is the one the flip ARMS: it reads a
             `completed` plan's mandated tests as promises, so confirm all SEVEN
             mandated test names are present AND passing. A `completed` plan whose
             mandated test is absent or red is a broken promise, and TASK-010 is
             what makes that check live.

             Run the plan's own `test_command` here with `-v` and count the RUN
             lines (sharp edge 15) — seven names, none missing.

          3. INHERITED REDS: sharp edge 12's clause applies unchanged. Prove
             inheritance, name the owner, record — never waive, never absorb.

          IF THE LANE STOPPED at TASK-010's precondition, this task validates the
          UNCHANGED artifacts instead: ISSUE-176 still `open`, PLAN-ISSUE-176 still
          `draft`. That is a legitimate passing end state for a stopped lane and must
