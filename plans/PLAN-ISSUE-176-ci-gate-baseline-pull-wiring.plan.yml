      - id: TASK-009
        type: verification
        title: "Confirm on real Linux CI — the only run that can prove Fix 1"
        description: |
          ★ THIS IS A CI-ONLY OBLIGATION AND MUST NOT BE CLAIMED FROM A LOCAL
