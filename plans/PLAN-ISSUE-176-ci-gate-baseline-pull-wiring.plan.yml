      ANY `if:` on a step whose script contains `backstop gate`, so "Run the gate"
      can never carry a condition of its own. Condition-false is therefore
      UNREACHABLE for it, and `conclusion == 'skipped'` can only mean one thing:
      an earlier step killed the job before it ran. That is exactly the case worth
      suppressing, and nothing else lands in it.

      THE MECHANISM IS CONFIRMED ON THIS REPOSITORY'S OWN HISTORY, not assumed: run
      `30398137055`'s `baseline` job records step 6 "Generate baseline" → `failure`
      followed by step 7 "Publish baseline" → `skipped`. A later step in a
      job killed by an earlier one really does report `skipped`. Unlike the
      frequency claim above, this half was measured before it was written down.

      ★ AND THE ID-CONSISTENCY ASSERTION EXISTS BECAUSE A BAD ID FAILS **OPEN**, NOT
      CLOSED. An earlier draft of this plan stated the opposite — that a guard naming
      a nonexistent id "silently evaluates to a permanent skip" — and that is
      BACKWARDS under GitHub Actions expression semantics. Trace it: a missing
      context property resolves to `null`; comparing `null != 'skipped'` compares
      mismatched types, so both are COERCED TO NUMBER (`null` → 0, and the string
      `'skipped'` → NaN because it does not parse as a number); every comparison
      involving NaN is false, so `null == 'skipped'` is FALSE and the `!=` is TRUE.
      The condition collapses to `always() && true` and the step runs on EVERY run —
      including the early-death runs this guard exists to suppress. A typo'd id
      therefore silently restores the bare-`always()` misattribution bug while
      looking correct in the diff. This matters beyond wording because the failure
      message TASK-001 writes will carry this rationale to whoever trips it: it must
      say the guard goes INERT, not that it fails safe.

phases:
  - id: phase-1
    name: "Phase 1: Fix 1 — authorize the self-healing pull in CI's gate job"
    tasks:
      - id: TASK-001
        type: test
        title: "RED: pin the token binding, the job-scoped permissions and the post-gate proof"
        description: |
          Extend root-level `workflows_test.go` — this repo's existing home for
          assertions on PARSED `ci.yml` structure — with FOUR tests that fail
          against today's file (four, matching this task's `test_names` below; an
          earlier draft said three and dropped the uniqueness falsifier from the
          count). No runner and no network needed: today's `ci.yml` has zero
          `GH_TOKEN` occurrences, no job-level `permissions:` on `gate`, no
          post-gate confirmation step, and — the fourth, and the one most easily
          forgotten because absence-of-a-second-thing reads like nothing at all —
          no step establishing that a `baseline pull` occurs exactly once and after
          the gate. All FOUR therefore RED immediately (see WHAT "TDD RED" MEANS,
          item A).

          FIRST, EXTEND THE PARSER. `workflowJob` decodes neither `env` nor
          `permissions`, and `workflowStep` does not decode `id` (sharp edge 9). Add
          all three. `permissions:` accepts the scalar
          forms `read-all`/`write-all` as well as a mapping, so decode it the way
          `workflowStringList` handles scalar-or-sequence: fail loudly naming the
          shape found rather than silently yielding an empty map, or the permissions
          assertions become vacuously green on a scalar.

          TestCIWorkflow_GateJobAuthenticatesTheSelfHealingBaselinePull (CLM-001).
          DERIVE the set of steps that need the token rather than listing indices:
          every gate-job step whose decommented script shells `gh` — which is every
          step invoking `backstop gate` (TWO of them, the `--json` diagnostic
          capture and the blocking run, both running `resolveBaselineCache`) plus
          every step invoking `baseline pull` (the confirmation step's failure
          branch). Assert the set is non-empty first, or the loop below is
          vacuous. For EACH member assert `GH_TOKEN` (or `GITHUB_TOKEN`) is declared
          in THAT STEP'S OWN `env:`, and name the offending step in the failure
          message (sharp edge 10). Assert its value references
          `secrets.GITHUB_TOKEN` or `github.token` (sharp edge 11).

          ★ THEN THE NEGATIVE LEG, WITHOUT WHICH CLM-001's "step-level, not
          job-level" HALF IS UNPINNED PROSE. An earlier draft of this test accepted
          the token "from that step's own `env:` OR from the job's `env:`" — which
          means a job-level binding, the exact spelling round 1 moved away from
          because it hands the token to `curl | sh`, `pipx install` and an
          eight-repo clone, would have passed every assertion in this plan. A claim
          whose forbidden alternative also passes is not a claim. Assert BOTH:
            * NO gate-job step OUTSIDE the derived set declares `GH_TOKEN` or
              `GITHUB_TOKEN` in its `env:` — enumerate the offenders by step name in
              the failure message;
            * the gate JOB's own `env:` block declares neither name (an absent job
              `env:` satisfies this trivially and correctly).
          These two are what make the narrowing real rather than intended, exactly
          as CLM-002's workflow-level assertion does for the permission scope.

          Then assert NO other `secrets.` reference appears anywhere in the gate
          job — a hand-rolled PAT must fail this test. SCAN SURFACE, stated
          explicitly because a parsed-only scan would miss the most likely
          smuggling route: the union of (a) every step's `env:` values, (b) every
          step's `with:` values, (c) the job's own `env:` values, and (d) every
          step's RAW `run:` script — raw, not decommented, since a `secrets.`
          expression interpolated directly into a script body is the case that
          matters most and a comment mentioning one is worth flagging anyway. The
          existing `stepMentions` helper covers (a) and the decommented script
          only, so this needs its own scan; do not reuse it and assume coverage.

          The failure message should name `ensureGitHubAuth`'s `gh auth status`
          shell-out as what goes wrong without the token, so the next reader does
          not have to re-derive ISSUE-176.

          TestCIWorkflow_GateJobGrantsActionsReadWithoutWideningTheWorkflow
          (CLM-002). Assert the `gate` job's OWN `permissions:` block is exactly
          `{contents: read, actions: read}` — both keys present, `actions` exactly
          `read`, and no third scope and no `write` value anywhere in it. THE
          `contents: read` LEG IS NOT REDUNDANT: a job-level block replaces the
          workflow-level one and unlisted scopes become `none`, so omitting it
          breaks `actions/checkout` (sharp edge 1) — say that in the failure
          message. Then assert the WORKFLOW-level block is still exactly
          `{contents: read}` with no `actions` key: that is the blast-radius fence
          (sharp edge 2), and it is the assertion that makes the narrow scoping a
          test rather than a comment.

          TestCIWorkflow_GateJobProvesTheBaselineLandedAfterTheGate (CLM-003(ii)).
          Assert a gate-job step exists whose decommented script references
          `.backstop/baseline.json`; that it does not swallow with `|| true`; and —
          sharp edge 4 — that its decommented
          script does NOT contain the literal `backstop gate`, which would drag it
          into `TestCIWorkflow_PackInstallFailureFailsTheJob`'s fence and fail on
          the `if:`.

          ★ THE `if:` GUARD IS ASSERTED PRECISELY, NOT AS "declares `if: always()`"
          (sharp edge 19). Assert the condition contains `always()` AND references
          the blocking gate step's `id` with a `!= 'skipped'` comparison. Then
          assert the blocking gate step actually DECLARES that `id`, and CHECK THE
          TWO HALVES AGAINST EACH OTHER — extract the id the `if:` references and
          require the gate step to declare that exact value — rather than matching
          both against a hardcoded literal, which would pass a pair that agrees with
          the test and with nothing else.

          ★ THE FAILURE MESSAGE MUST SAY THE GUARD GOES **INERT**, NOT THAT IT FAILS
          SAFE (sharp edge 19). A guard naming an id no step declares does not skip
          the step — GitHub resolves the missing context to `null`, coerces both
          sides of `null != 'skipped'` to number (`null` → 0, `'skipped'` → NaN),
          and every NaN comparison is false, so the `!=` is TRUE and the condition
          collapses to `always() && true`. The step then runs on every run,
          including the early-death runs the guard exists to suppress. Getting this
          backwards in the message would tell a future reader a typo fails closed
          when it fails OPEN, which is the more dangerous direction and the reason
          this assertion is here at all.

          `workflowStep` does not decode `id` today, so extend it alongside `env`
          and `permissions` (sharp edge 9).

          THE ORDERING LEG MUST NOT USE `stepIndex` (sharp edge 16). That helper
          returns the FIRST match and `ci.yml` invokes the gate TWICE, so it
          resolves to step 7 (the `--json` capture) rather than step 8 ("Run the
          gate"). Collect ALL gate-invoking step indices, assert there are exactly
          two — so a third cannot silently re-anchor this — and compare against the
          LAST of them. Do not modify `stepIndex` itself — six call sites across
          three tests rely on its first-match semantics (sharp edge 16 enumerates
          them). Add a last-match helper beside it.

          TestCIWorkflow_TheOnlyBaselinePullFollowsEveryGateInvocation
          (CLM-003(i)). ★ THE LOAD-BEARING FALSIFIER, and it is deliberately
          INDEX-FREE. Collect every gate-job step whose decommented script contains
          `baseline pull` and assert there is EXACTLY ONE — the confirmation step
          itself. Uniqueness, not ordering, is what actually closes the hole: an
          ordering fence anchored on the first gate invocation lets a forging pull
          step inserted BETWEEN indices 7 and 8 sit at index 8, greater than the
          anchor, and pass. Uniqueness has no such hole at any index. Then, as a
          second leg, assert that one step's index exceeds the LAST gate-invoking
          index. The failure message must explain WHY a second `baseline pull`
          anywhere in this job is disqualifying: it would create the file the
          confirmation step checks for, making the proof self-fulfilling (sharp
          edge 3).
        files:
          - workflows_test.go
        claims:
          - CLM-001
          - CLM-002
          - CLM-003
        depends_on: []
        test_names:
          - TestCIWorkflow_GateJobAuthenticatesTheSelfHealingBaselinePull
          - TestCIWorkflow_GateJobGrantsActionsReadWithoutWideningTheWorkflow
          - TestCIWorkflow_GateJobProvesTheBaselineLandedAfterTheGate
          - TestCIWorkflow_TheOnlyBaselinePullFollowsEveryGateInvocation

      - id: TASK-002
        type: implementation
        title: "GREEN: wire GH_TOKEN plus job-scoped actions:read, and add the post-gate proof step"
        description: |
          Edit `.github/workflows/ci.yml`. Three changes, all inside the `gate` job;
          the workflow-level `permissions:` block at lines 9-10 is NOT touched.

          (1) JOB-LEVEL `permissions:` ON `gate`:

                  permissions:
                    contents: read   # RE-DECLARED: a job-level block REPLACES the
                                     # workflow-level one and every unlisted scope
                                     # becomes `none` — without this, checkout fails.
                    actions: read    # the pull's `gh api repos/.../actions/runs`
                                     # and `.../actions/artifacts` calls 403 without it.

          (2) STEP-LEVEL `env:` ON THE THREE STEPS THAT SHELL `gh`, and on no
              others:

                  env:
                    GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

              added to "Capture the gate report as JSON", to "Run the gate" (both
              run `resolveBaselineCache`), and to the confirmation step from (3),
              whose failure branch runs a bare `baseline pull`. All three, or the
              wiring is half-done (sharp edge 10). The auto-generated token, never a
              PAT (sharp edge 11).

              ★ STEP-LEVEL, NOT JOB-LEVEL, AND THIS IS A DELIBERATE REVERSAL. A
              job-level `env:` is the obvious spelling and was this plan's first
              draft; it hands the token to all ten steps, including the two that
              pipe `curl | sh` and run `pipx install` and the one that clones eight
              remote pack repositories. None of those needs it. Note the asymmetry
              with (1) and do not "simplify" the two into agreement: ISSUE-176
              recommends job-level for the PERMISSION and says nothing about env
              placement, and the narrowest correct answer differs between them.

          (3) A CONFIRMATION STEP, placed AFTER "Run the gate" and before (or after)
              the artifact upload:

                  - name: Confirm the self-healing baseline pull landed a file
                    # WHY THIS IS NOT A `baseline pull` STEP: the pull already runs
                    # INSIDE the gate, in resolveBaselineCache, before the pack_engines
                    # step spawns the test subprocess. A pull step placed BEFORE the
                    # gate would create this file itself and prove nothing. This step
                    # runs after, and only observes.
                    #
                    # WHY IT EXISTS AT ALL: ApplyPolicy overwrites baseline_comparison's
                    # reason unconditionally on this repo's dogfood policy, so neither
                    # the printed table nor --json can tell anyone whether the pull
                    # worked. This step can. (ISSUE-176)
                    #
                    # THE GUARD IS NOT `always()` ALONE. This job can die at tool
                    # install, at build, or at pack install - unobserved in the last
                    # 78 runs, but one `curl | sh` away - and then "Run the gate"
                    # never executes. Under a bare always() this
                    # step would still run, find no baseline (nothing had a chance to
                    # fetch one), and blame ISSUE-176 for a failure that happened
                    # three steps earlier. Skipping when the gate was SKIPPED keeps
                    # the diagnosis attributable, which is the entire point of the
                    # step. A FAILED gate still runs it - that is the informative case.
                    if: always() && steps.run_gate.conclusion != 'skipped'
                    env:
                      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                    run: |
                      if [ -f .backstop/baseline.json ]; then
                        echo "baseline present: $(wc -c < .backstop/baseline.json) bytes"
                        exit 0
                      fi
                      echo "::error::.backstop/baseline.json absent after the gate ran - the self-healing pull did not succeed (ISSUE-176)"
                      ./bin/backstop baseline pull || echo "bare baseline pull exited $?"
                      exit 1

              ★ THE COMMENT'S HEDGE IS DELIBERATE AND SHIPS AS WRITTEN. "unobserved
              in the last 78 runs, but one `curl | sh` away" is the MEASURED claim
              (notes section 4: 0 pre-gate deaths in 40 failures). An earlier draft
              of this plan said "it has done so", which is false. This comment is
              PERMANENT IN-REPO COMMENTARY that will outlive this plan's notes, so
              it is the one place the overstatement would have survived every
              correction — do not "tighten" it back into a claim of past occurrence.

              …which requires giving the blocking step an id:

                  - name: Run the gate
                    id: run_gate
                    ...

              ADDING `id:` IS SAFE AND `if:` WOULD NOT BE.
              `TestCIWorkflow_PackInstallFailureFailsTheJob` scans steps whose
              script contains `backstop gate` and fails them on a non-empty `if:`,
              on `continue-on-error:` and on `|| true`. "Run the gate" is such a
              step: it gets an `id:` only, which that test does not look at, and
              nothing else about it changes. The CONFIRMATION step's script contains
              neither `pack install` nor `backstop gate`, so its own `if:` is
              outside that test's scope (sharp edge 4) — and its `if:` expression
              references `steps.run_gate`, not the forbidden literal.

              `if: always()` because the run worth diagnosing is the one that failed
              — same reasoning as the existing artifact-upload step. `|| echo` and
              not `|| true` (sharp edge 5); `bash -e` would abort on a bare
              `cmd; status=$?`. The decommented script must not contain the literal
              `backstop gate` (sharp edge 4).

          DO NOT touch `.gitignore` — sharp edge 6 gives both reasons it is already
          covered. DO NOT add `actions: read` at the workflow level (sharp edge 2).
          DO NOT add a pre-gate `baseline pull` step (sharp edge 3).
        files:
          - .github/workflows/ci.yml
        claims:
          - CLM-001
          - CLM-002
          - CLM-003
        depends_on:
          - TASK-001

      - id: TASK-003
        type: verification
        title: "Verify the CI wiring: diff-scoped gate plus the four workflow tests"
        description: |
          Run and read the results:

              backstop gate --file .github/workflows/ci.yml
              backstop gate
              go test . -run "TestCIWorkflow_" -count=1 -v

          ★ `-v`, AND COUNT THE `=== RUN` LINES (sharp edge 15). `go test -run`
          exits 0 printing `[no tests to run]` when the pattern matches nothing, so
          a bare exit code proves nothing. Report the executed count and confirm all
          four new test names appear by name in the output. A count that does not
          include them is a FAILED verification.

          THE WHOLE `TestCIWorkflow_` FAMILY, not just the four new tests. SIXTEEN
          existing tests assert on this same file and three of them sit close enough
          to the new step to fire (sharp edge 4): `PackInstallFailureFailsTheJob`,
          `BlockingJobHasNoRawToolInvocations`, and anything routing through
          `ciBlockingJob`'s exactly-one-job `findJob`. A run scoped to only the new
          names would miss exactly the regressions this edit can cause.

          Also re-parse the edited file and STATE, from the parse rather than from
          the diff: the workflow-level `permissions:` block still reads exactly
          `contents: read`; the `gate` job's block reads exactly `contents: read` +
          `actions: read`; and `gh api`-facing scopes appear nowhere else.

          ★ REPORT HONESTLY WHAT THIS CANNOT SHOW. This verification proves the
          workflow file now DECLARES the wiring. It proves nothing about whether the
          pull SUCCEEDS — the three ratchet tests are green on darwin before and
          after (sharp edge 12, measured in section 1). Say so plainly and hand the
          behavioral question to TASK-009 rather than implying a local green
          resolves ISSUE-176.
        files:
          - .github/workflows/ci.yml
          - workflows_test.go
        claims:
          - CLM-001
          - CLM-002
          - CLM-003
        depends_on:
          - TASK-002

  - id: phase-2
    name: "Phase 2: Fix 2 — make the non-gate test paths fail actionably, not mysteriously"
    tasks:
      - id: TASK-004
        type: test
        title: "RED: pin the actionable remedy message, the no-skip fence and the opt-in Makefile target"
        description: |
          PARALLEL-ELIGIBLE WITH PHASE 1 — the two file sets are disjoint and there
          is no dependency between them (D-081).

          TWO FILES, AND THE SPLIT IS NOT COSMETIC — it is what makes each red
          legible on its own.

          ── (A) `cmd/backstop/baseline_prerequisite_test.go` (NEW) ──────────────
          RED by COMPILE FAILURE (see WHAT "TDD RED" MEANS, item C).

          TestCommittedBaselineAbsence_FailsWithActionableRemedy (CLM-005). Call the
          helper TASK-005 will add — a function that takes a PATH PARAMETER and
          returns `([]byte, error)` — against a path that certainly does not exist
          (a `t.TempDir()` child). Assert an error is returned, and that its text
          names BOTH remedies verbatim: `backstop baseline pull` and
          `make baseline`. Assert it also names the file it could not read, so the
          message is self-locating. Assert it does NOT contain "skip". The helper is
          undefined today, so the package does not compile.

          TestRatchetBaselineRead_NeverSkipsAndNeverPullsImplicitly (CLM-005,
          CLM-006). A source sweep over `cmd/backstop/bun_ratchet_flip_test.go`.
          Three legs, and the middle one's SHAPE IS PRESCRIBED because the obvious
          spelling is unsatisfiable (sharp edge 17):
            * no `t.Skip` and no `t.Skipf` anywhere in the file — whole-file, which
              is correct here because neither belongs in it at all (sharp edge 8);
            * ★ NO SINGLE LINE CONTAINS BOTH `os.ReadFile` AND `baseline.json`.
              NOT a whole-file `!contains("os.ReadFile")` check: that file will
              still contain `os.ReadFile` twice after TASK-005 — once inside the new
              helper, and once at the pre-existing line 194 that reads SOURCE files
              for `pillarASitesClean` and is unrelated to the baseline. The
              line-scoped form is satisfiable precisely because the helper takes the
              path as a parameter, and it forbids exactly the thing worth
              forbidding: re-inlining the bare baseline read. Say so in the failure
              message, or the next person "fixes" it by loosening it;
            * ★ THE TEST PATH NEVER SHELLS OUT AND NEVER OPENS A SOCKET, asserted
              STRUCTURALLY: the file's imports include neither `os/exec` nor
              `net/http`, and no line calls `exec.Command` or
              `exec.CommandContext`. (Measured: it imports `encoding/json`, `os`,
              `path/filepath`, `strings`, `testing`, plus two internal packages, and
              contains zero `exec.` references — so this is satisfiable today and
              stays satisfiable after TASK-005.)

              ★ IT IS DELIBERATELY NOT "the file contains no `baseline pull`", which
              is the SAME INVERTED-POLARITY TRAP sharp edge 17 documents for
              `os.ReadFile`, and it took a second review round to spot in this
              second location. Measured: `baseline pull` appears ZERO times in that
              file today, so such a leg would be GREEN at RED time and go RED after
              the GREEN task — because TASK-004(A) REQUIRES the helper's error text
              to name `backstop baseline pull` verbatim. The plan would mandate a
              string in one task and forbid it in another. The remedy text is a
              STRING LITERAL and must stay one; what actually needs forbidding is
              EXECUTION, and imports plus `exec.` call sites are what distinguish
              executing a command from naming one.

          ── (B) `makefile_test.go` (NEW, ROOT PACKAGE `backstopcore_test`) ──────
          TestMakefile_DeclaresOptInBaselineTargetOutsideTestAndCI (CLM-006). Parse
          `Makefile`: assert a `baseline:` target exists and its recipe invokes
          `baseline pull`; assert `.PHONY` names it; assert it declares `build` as a
          prerequisite (sharp edge 18); and assert NEITHER the `test:` NOR the `ci:`
          target lists `baseline` among its prerequisites (sharp edge 13). The
          failure message should say why: wiring it in would make every `make test`
          hit the network, which is the thing ISSUE-176 rules out.

          ★ ROOT PACKAGE, NOT `cmd/backstop`, FOR TWO INDEPENDENT REASONS.
            (1) CONVENTION: repo-structural assertions live at the root in
                `package backstopcore_test` — `workflows_test.go`,
                `module_path_test.go`, `pack_fleet_test.go`, `release_config_test.go`,
                `embed_test.go`. The `Makefile` is repo structure, and no test
                asserts on it today, so this establishes the file rather than
                displacing anything.
            (2) THE RED STAYS LEGIBLE. In `cmd/backstop` this test would share a
                package with the compile-failure red from (A), so it could never
                show its OWN specific failure — every run would die at the build
                step. In the root package it fails on its own terms, naming the
                missing target.
          It is a SEPARATE file from `workflows_test.go` so TASK-004 and TASK-001
          stay file-disjoint and Phase 1 / Phase 2 parallel-eligibility survives
          (D-081). Do not merge the two.
        files:
          - cmd/backstop/baseline_prerequisite_test.go
          - makefile_test.go
        claims:
          - CLM-005
          - CLM-006
        depends_on: []
        test_names:
          - TestCommittedBaselineAbsence_FailsWithActionableRemedy
          - TestRatchetBaselineRead_NeverSkipsAndNeverPullsImplicitly
          - TestMakefile_DeclaresOptInBaselineTargetOutsideTestAndCI

      - id: TASK-005
        type: implementation
        title: "GREEN: route the baseline read through one remedy-naming helper, add the opt-in make target"
        description: |
          Two edits.

          (1) `cmd/backstop/bun_ratchet_flip_test.go`. Add the helper TASK-004
          calls — a path-taking, error-returning read that wraps the underlying
          `os.ReadFile` failure in a message naming the file, both remedies
          (`backstop baseline pull` and `make baseline`) and, in one line, WHY the
          file is absent: it is a generated, gitignored artifact published by CI's
          `baseline` job, not committed source. Then rewire
          `committedBaselineNeutralSpineFiles` to call it and `t.Fatalf` with the
          returned error.

          ★ THE PATH IS A PARAMETER, NOT BAKED INTO THE HELPER, and this is a
          CONSTRAINT rather than a style note (sharp edge 17). TASK-004 asserts that
          no single line contains both `os.ReadFile` and `baseline.json`. A helper
          that builds the path internally puts both on one line and cannot satisfy
          it; a parameter puts the `os.ReadFile` in the helper and the
          `baseline.json` literal at the call site. It is also what lets
          TestCommittedBaselineAbsence_FailsWithActionableRemedy point the helper at
          a `t.TempDir()` child at all. If this feels like the test dictating the
          signature — it is, and that is TDD working: the message-shape assertion
          needs a seam to reach.

          ★ THE REMEDY TEXT IS A STRING LITERAL AND NOTHING MORE. The helper NAMES
          `backstop baseline pull`; it must never RUN it. Do not add an `os/exec`
          or `net/http` import to this file, and do not "helpfully" shell the pull
          when the read fails — TASK-004's structural sweep forbids exactly that,
          and it is the whole point of the opt-in direction (CLM-006): the test path
          never hits the network, so a developer's `go test ./...` cannot silently
          acquire a network dependency.

          WHAT DOES NOT CHANGE, and this is the point: the failure stays a FATAL.
          No `t.Skip`, no network call, no conditional. The three ratchet tests
          protect exactly the property they protected before; only the message
          improves. Keep the helper in this `_test.go` file — it is test support,
          and putting it in `cmd/backstop/baseline.go` would add dead production
          code for a test-only concern.

          (2) `Makefile`. Add an OPT-IN target:

                  baseline: build
                          ./bin/backstop baseline pull

              `build` IS REQUIRED, not decoration (sharp edge 18): the recipe runs
              `./bin/backstop`, and `bin/` is untracked and removed by `make clean`,
              so on a clean tree the bare target fails with "no such file or
              directory" — the exact class of unhelpful error this whole lane exists
              to remove.

              Add `baseline` to `.PHONY`, with a short comment recording that it is
              a PREREQUISITE for the ratchet tests and is deliberately NOT a
              prerequisite of `test:` or `ci:` — no local `go test` run may hit the
              network by default (CLM-006, sharp edge 13). That comment plus the
              remedy-naming error message together ARE the "documented local
              prerequisite" direction this plan chose; there is no third place to
              keep it in sync.
        files:
          - cmd/backstop/bun_ratchet_flip_test.go
          - Makefile
        claims:
          - CLM-005
          - CLM-006
        depends_on:
          - TASK-004

      - id: TASK-006
        type: verification
        title: "Verify Fix 2 by real falsification: move the baseline aside and read the message"
        description: |
          Run and read the results:

              backstop gate
              go test ./cmd/backstop/ -run "TestCommittedBaselineAbsence|TestRatchetBaselineRead|TestRatchet_" -count=1 -v
              go test . -run "TestMakefile_DeclaresOptIn" -count=1 -v

          ★ NOTE THE PACKAGE ARGUMENTS AND VERIFY THE COUNTS (sharp edge 15). The
          Makefile test is in the ROOT package (`.`), the other two are in
          `./cmd/backstop/`; this plan's first draft had them crossed, and
          `go test . -run "TestMakefile_DeclaresOptIn"` returned
          `ok github.com/backstop-ai/backstop-core 0.523s [no tests to run]` —
          exit 0, zero tests executed, a verification that checked nothing. Run both
          with `-v`, count the `=== RUN` lines, and report the executed test names.
