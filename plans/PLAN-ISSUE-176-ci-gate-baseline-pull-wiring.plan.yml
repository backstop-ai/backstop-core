  - id: phase-5
    name: "Phase 5: Close-out — flip the plan, close the issue, then re-validate"
    tasks:
      - id: TASK-010
        type: documentation
        title: "Flip PLAN-ISSUE-176 to completed, then close ISSUE-176 with delivered_by"
        description: |
          Route BOTH edits through their purpose-built agents (`/plan`, `/issue`) —
          never hand-edit an artifact's freeform prose.

          ★★ ORDER IS LOAD-BEARING: STEP 1 BEFORE STEP 2. A `delivered_by` close is
             only valid when the backing plan is ALREADY `completed`
             (`pkg/validate/delivered_by.go` step 5). Closing the issue first yields
             `issue/delivered-by-plan-not-completed`. PLAN-ISSUE-157 learned this in
             its own round 3; this task mirrors the shape that then validated clean
             rather than rediscovering it.

          ── PRECONDITION: DO NOT CLOSE ON AN UNPROVEN LANE ───────────────────────
          This close is gated on TASK-009's REAL CI EVIDENCE, not on a local green.
          CLM-004 is the claim being closed against and it is CI-only (sharp edge
          12).

          ★ THE TRIGGER IS THE EVIDENCE, NOT THE CONFIRMATION STEP'S OWN VERDICT,
          and the distinction is load-bearing rather than pedantic. Under the
          SOFTENED verdict mode the second flagged decision offers
          (`::warning::` + `exit 0`), an absent baseline produces a PASSING step —
          so a precondition phrased as "if the confirmation step failed" would never
          fire, and a lane with CLM-004 unproven would satisfy it literally while
          proving nothing. The step's exit code is NOT the discriminator in that
          mode. Key on the two facts CLM-004 actually asserts, both of which
          TASK-009 reports regardless of verdict mode:
            (a) was `.backstop/baseline.json` PRESENT after the gate ran; and
            (b) what is the real state of the three named ratchet tests in the CI
                run — gone, or still failing with the `no such file or directory`
                message, or failing with a DIFFERENT message (which is a different
                defect, not a partial pass).

          IF EITHER IS UNPROVEN — including the case where TASK-009 could not run at
          all — the lane is NOT complete: PLAN-ISSUE-176 stays `draft`, ISSUE-176
          stays `open` with the measured CI observation recorded in it, and this task
          reports a stopped lane. Never dress an unproven lane as a closed one, and
          never flip a status to quiet a validator.

          ── STEP 1: FLIP THIS PLAN TO `completed` (routed `/plan` dispatch) ──────
          `plans/PLAN-ISSUE-176-ci-gate-baseline-pull-wiring.plan.yml`:
          `status: draft` → `status: completed`, per this repo's close-out
          convention — prepend an AS-BUILT banner to `notes` recording what actually
          happened versus what was planned, and NEVER rewrite the tasks themselves.
          The banner should name, at minimum: which verdict mode shipped (the second
          flagged decision), and whether the first real pull fetched the predicted
          ≥2-day-stale artifact from run 31921681066.

          The plan must still VALIDATE CLEAN after the flip — `validateDeliveredBy`
          re-runs the full `validate.Plan` and treats ANY violation as
          `issue/delivered-by-plan-invalid`. Run
          `./bin/backstop artifact validate --plan PLAN-ISSUE-176` after editing.

          ── STEP 2: CLOSE ISSUE-176 (routed `/issue` dispatch) ───────────────────
          `issues/ISSUE-176-ci-gate-missing-baseline-json.issue.md` needs ALL THREE.
          A `## Resolution` section alone is NOT a valid close:
            (i)   `issue.status: closed` AND `issue.closed: "<YYYY-MM-DD>"` —
                  omitting the date is `issue/closed-requires-date`.
            (ii)  `delivered_by: PLAN-ISSUE-176` at TOP-LEVEL frontmatter (a sibling
                  of `schema_version`, NOT nested under `issue:`). Carry
                  `delivered_by` OR `resolved-by`, never both
                  (`issue/close-pointer-conflict`); `delivered_by` is correct here
                  because this lane has a real backing plan.
            (iii) A `## Resolution` section — still required even with
                  `delivered_by` (`issue/delivered-by-resolution-required`).
                  Record: the two CI-wiring changes (step-level `GH_TOKEN` on the
                  three `gh`-shelling steps, job-level `permissions: contents+actions
                  read`); the guarded confirmation step and its first real verdict;
                  the three named ratchet tests' CI state as measured by TASK-009;
                  and Fix 2's shape (remedy-naming helper plus opt-in `make
                  baseline`, no network in the test path).

          ALSO RECORD IN THE RESOLUTION, WITHOUT ABSORBING:
            · The follow-on issue TASK-007 filed for
              `resolveLatestSuccessfulMainRun`'s unused `Name` filter — by its
              assigned id, so the two are linked in both directions.
            · CLM-007(b)/(c): the stale-artifact expectation and the ~2026-11-14
              retention deadline. These are OBSERVATIONS carried forward, not
              defects this lane fixed.
            · ISSUE-086 and PLAN-SPEC-019 REMAIN OPEN and were never this lane's.
              Closing ISSUE-176 does not touch the producer-side gaps they own.
            · Whether the gate job is now green OVERALL. Almost certainly not —
              other lanes' failures are not this lane's to fix or to claim (sharp
              edge 12). Say plainly that this close means "the three named ratchet
              failures are resolved", not "CI is green".
        files:
          - plans/PLAN-ISSUE-176-ci-gate-baseline-pull-wiring.plan.yml
          - issues/ISSUE-176-ci-gate-missing-baseline-json.issue.md
        claims:
