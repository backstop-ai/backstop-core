  ══════════════════════════════════════════════════════════════════════════════
  THE DECISION FIX 2 LEAVES OPEN, AND WHY THIS PLAN CHOOSES AS IT DOES
  ══════════════════════════════════════════════════════════════════════════════
  ISSUE-176 deliberately does not prescribe Fix 2's shape. It names two hard
  constraints: no network on every local `go test` by default, and no silent
  `t.Skip` (which would quietly stop protecting the ratchet property). It names two
  plausible directions: a `TestMain`-level pull gated on file absence, or a
  documented local prerequisite.

  THIS PLAN TAKES THE DOCUMENTED-PREREQUISITE DIRECTION, made ACTIONABLE. Reasons,
  in order of weight:

    * A `TestMain` pull gated on absence still hits the network on a fresh clone,
      inside `go test`, invisibly — the exact "every local run may hit the network"
      shape the constraint rules out, merely made rarer. It also puts a network
      dependency inside the unit-test path of a package whose tests are otherwise
      hermetic, and it would make `go test` behavior depend on whether `gh` is
      authenticated on the developer's machine.
    * The current failure is already LOUD; what it is not is ACTIONABLE. It reads
      `read committed baseline: open .../.backstop/baseline.json: no such file or
      directory` and names no remedy. Turning that into a message that names
      `backstop baseline pull` / `make baseline` costs one helper, changes the
      ratchet property not at all, and is the smallest change that resolves the
      real complaint.
    * The remedy becomes runnable rather than folkloric: an OPT-IN `make baseline`
      target that neither `test:` nor `ci:` depends on. The prerequisite is
      documented in the one place a developer running `make test` will look.
    * `t.Skip` is off the table outright and TASK-004 pins its absence by sweep, so
      a future edit cannot quietly reintroduce it.

