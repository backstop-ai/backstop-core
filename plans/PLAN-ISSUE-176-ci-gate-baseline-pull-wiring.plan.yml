  - id: phase-3
    name: "Phase 3: Record the adjacent findings rather than absorbing them"
    tasks:
      - id: TASK-007
        type: documentation
        title: "File the workflow-name-filter follow-on and record the stale-artifact expectation"
        description: |
          CLM-007. Two findings surfaced while grounding this plan. Neither is in
          this lane's fix, and neither may be silently dropped
          ([[feedback_thorough_followons]]).

          (a) FILE A FOLLOW-ON ISSUE for `resolveLatestSuccessfulMainRun`
          (`cmd/backstop/baseline.go`). It queries
          `repos/<repo>/actions/runs?branch=main&status=success&per_page=20`, DECODES
          each run's `Name` field, and then filters only on `HeadBranch == "main"`
          and `Conclusion == "success"` — the decoded `Name` is never read. So it
          returns the newest successful main run of ANY workflow, and
          `resolveBaselineArtifactID` then fails with "missing artifact" when that
          run is not the one publishing `backstop-baseline-v1`. MEASURED TODAY: all
          20 rows are workflow `CI`, so the gap is LATENT, not firing — say that in
          the issue, with the query and its output, so the next reader knows the
          severity. It becomes live the moment a second workflow runs on main.
          Route it properly: `backstop artifact new issue --slug <kebab>` for the
          id, then the issue agent — never hand-written (sharp edge 14). Cite this
          plan and ISSUE-176 as the lane that surfaced it.

          (b) RECORD, in ISSUE-176 itself via a routed `/issue` dispatch, that the
          first artifact this fix pulls will be ≥2 days stale, with the reason: the
          `baseline` job is `needs: gate`, and the gate job has failed on every main
          push for 21 consecutive runs since 2026-08-16, so the newest publishable
          baseline is run 31921681066's (`generated_at 2026-08-16T02:26:32Z`). This
          is an EXPECTED, NON-BLOCKING consequence that resolves itself the first
          time a main push gates green. It is recorded so that a stale pull during
          TASK-009 reads as predicted rather than as a new defect — and explicitly
          so that nobody scopes this lane around forcing a green gate.
        files:
