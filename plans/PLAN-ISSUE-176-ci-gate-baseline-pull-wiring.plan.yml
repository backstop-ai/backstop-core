      - id: TASK-011
        type: verification
        title: "Re-validate AFTER the artifact mutations, not before"
        description: |
          ★ WHY THIS EXISTS AND WHY TASK-008 DOES NOT COVER IT. TASK-008 runs its
            `artifact validate --issue ISSUE-176` BEFORE TASK-010 mutates anything,
            so it inspects the PRE-CLOSE state — a still-`open` issue with no
            requirements, which passes trivially. That is VACUOUS with respect to
            the close TASK-010 actually produces. Validating the state before the
            change is precisely the wrong side of it, and because the gate is
            DIFF-SCOPED, skipping this would let the lane end green locally while
            handing a RED `artifact_validation` to whoever touches the repo next.

          1. VALIDATE BOTH MUTATED ARTIFACTS, individually and by name:

               ./bin/backstop artifact validate --plan  PLAN-ISSUE-176
               ./bin/backstop artifact validate --issue ISSUE-176

             Both must pass. Expect ISSUE-176 to carry `issue.closed`, top-level
