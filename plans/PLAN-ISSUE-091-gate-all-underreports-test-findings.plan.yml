  # ═══════════════════════════════════════════════════════════════════════
  # Phase 2: TDD Green — one branch collapse in runFindingsEngine.
  # ═══════════════════════════════════════════════════════════════════════
  - id: phase-2
    name: "Phase 2: TDD Green — Hand Every Non-Nil Scope Its Explicit File List"
    tasks:
      - id: TASK-004
        type: implementation
        title: "Collapse the all-scope directory target into the explicit file list"
        description: |
          Edit `runFindingsEngine` in `cmd/backstop/pack_gate.go` — locate it BY
          NAME, not by line number (this file moved substantially during tonight's
          ISSUE-112/113/118/122 batch, and any line citation is already suspect).

          The change is inside the `else` arm of the
          `if binding.ScopeKind == engine.ScopeKindProjectWide` conditional — the
          rule-fed / config-file findings-engine arm. Today that arm reads, in
          substance: if `scope == nil || scope.Mode == gate.GateScopeModeAll`,
          append `projectRoot`; else append `excludeTestdataPaths(scope.Files)...`.

          Change the condition so ONLY a nil scope takes the directory branch:

              if scope == nil {
                  cmdArgs = append(cmdArgs, projectRoot)
              } else {
                  cmdArgs = append(cmdArgs, excludeTestdataPaths(scope.Files)...)
              }

          That is the entire behavioral change. Resist enlarging it. In
          particular do NOT: add a semgrep flag, add an engine-name special case,
          introduce a mode-keyed lookup, or touch `pkg/gate/scope.go`. The
          all-scope file list ALREADY EXISTS on the scope object — verified at
          HEAD, `ComputeGateScopeWithBase`'s `GateScopeModeAll` arm calls
          `resolveGateScopeAll` and stores the result via `newGateScope`, which
          normalizes each path to the repo-relative form the diff branch already
          passes. The dispatch was simply ignoring it.

          REWRITE THE COMMENT BLOCK above the branch. The existing comment asserts
          the very equivalence this issue disproves ("A nil scope or
          GateScopeModeAll is the explicit whole-repo escape hatch ... scan
          projectRoot exactly as before"). Replace it with the real rationale,
          stated TOOL-AGNOSTICALLY (CLM-007) — this is core, and a `semgrep`
          literal here would be baked tool knowledge:
            * A directory target and the file list that directory contains are
              NOT equivalent inputs. Handed a directory, an engine performs its
              OWN discovery and applies its OWN default ignore set; handed
              explicit paths, it typically bypasses that ignore set. Backstop
              cannot see, predict, or override a given engine's default ignores,
              so it must not depend on them agreeing with its own scope.
            * Therefore every scope that HAS a file list hands that list over, so
              all scopes traverse ONE engine code path and `--all` is a genuine
              superset of a diff-scoped run over the same files.
            * A nil scope has no list and keeps the directory target — the honest
              behavior for a caller that supplied no scope, not a grandfather
              clause.
            * Cite ISSUE-091, and preserve the existing ISSUE-010 CLM-003
              anti-fallback note: an empty list appends NOTHING and must never
              fall through to the directory branch. The collapsed form preserves
              that by construction, and saying so is what stops a future reader
              from "helpfully" restoring a fallback.
            * Preserve the surrounding SPEC-034 REQ-010/CLM-034 Ratified Design
              Constraint 3 reference — that constraint (a rule-fed engine must
              get a scan target) is INTACT and unchallenged; only the claim that
              the target may be the whole directory is being retracted.

          THE CORRECTIONS ARE A SET OF NINE IN THIS TASK, NOT ONE — and ELEVEN
          across the plan (9 here + 2 in TASK-003's steps 3 and 5, inside
          `cmd/backstop/pack_gate_scope_test.go`). The branch comment above is
          correction 1; EIGHT more follow, numbered 2-9 below. COUNT THE
          NUMBERED ITEMS; do not trust a remembered total. Corrections 2-6 are
          stale-equivalence text in `cmd/backstop/`; corrections 7-9 are the
          three SOURCE sites outside `cmd/backstop/` that state ISSUE-091 as
          still-live (see the notes' "THREE SOURCE SITES" section).

          THIS COUNT HAS BEEN WRONG IN EVERY PRIOR REVISION — "one", then
          "three", then "a set of five, complete this time", then "six" stated
          against a plan-wide total of "seven" that the enumeration itself
          contradicted. Two causes, both still live: the stale claims WRAP
          ACROSS LINE BREAKS so single-line greps miss them, and the earlier
          sweeps were scoped to artifact directories and `cmd/backstop/` only.
          If you re-sweep, sweep with a TWO-LINE WINDOW and sweep the WHOLE
          REPO, not one package. All nine here must be corrected in this task,
          or the code will contradict itself and a future reader will trust the
          stale sentence.

          CORRECTION 2, SAME FILE, EASY TO MISS: the doc comment on
          `excludeTestdataPaths` itself (locate it BY NAME — it is well below
          `runFindingsEngine`). It currently reads "Applied only INSIDE
          runFindingsEngine's diff-scope else branch; a testdata-only diff
          filters to an empty slice and the caller appends nothing." The first
          clause is FALSE the moment the branch collapses — which is the whole
          point of this change — and it is the sentence a future reader would
          trust when reasoning about `--all`. Rewrite it to say the filter is
          applied to EVERY scope that carries a file list (all-scope included),
          and keep the second clause: an all-testdata file list filters to an
          empty slice and the caller appends nothing, which is CLM-004 restated
          at the filter. Leave the rest of that comment — the segment-equality
          semantics, the `testdata_util.go` non-match note, the ISSUE-040
          citation, the `go help packages` universal-convention rationale —
          EXACTLY as it is; none of it changes and it is deliberately
          tool-agnostic.

          CORRECTION 3, SAME FILE: the `dispatchPackEngines` DOC COMMENT — the
          long block documenting the engine fan-out, well ABOVE
          `runFindingsEngine`. Locate it BY NAME (the paragraph beginning "The
          scope parameter carries the gate's changed-file diff scope"). It
          currently asserts, verbatim: "A nil scope or a GateScopeModeAll scope
          is the explicit whole-repo escape hatch; `backstop code check` and
          `gate --all` pass that sentinel." BOTH halves of that sentence are
          wrong after this change and one was ALREADY wrong before it:
            * the GateScopeModeAll half is exactly the claim CLM-007 retracts;
            * `backstop code check` NO LONGER EXISTS — the command was removed
              and its absence is asserted by a shipped test. Do not preserve the
              reference, and do not "fix" it by naming some replacement command.
          Rewrite so only a NIL scope is described as the whole-repo path, drop
          the removed-command clause entirely, and keep the rest of the
          paragraph (the ISSUE-010 diff-scope rationale, and the note that the
          project-wide toolchain branch is unaffected by scope) unchanged.

          CORRECTION 4, DIFFERENT FILE — `cmd/backstop/gate.go`, which is why
