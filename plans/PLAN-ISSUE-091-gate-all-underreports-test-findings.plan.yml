  ── THE ISSUE'S DIAGNOSIS IS REFINED, NOT OVERTURNED ────────────────────────
  The issue hypothesized that semgrep's `paths.include` GLOB RESOLUTION differs
  between directory-walk and explicit-file dispatch. That is NOT the mechanism.
  Falsified directly: a rule with NO `paths:` block at all still yields 0 under a
  directory target and 1 under an explicit file target. The real cause is the
  engine's DEFAULT IGNORE FILE — semgrep ships a built-in `.semgrepignore` that
  excludes test files, and it applies that ignore set ONLY when discovering files
  itself (directory walk). An explicitly-named target bypasses it. The include
  glob is a red herring; the ignore-set asymmetry is the defect.

  This REFINEMENT MATTERS for the fix. A glob problem would be the pack's to fix
  (rewrite `paths.include`). An engine-default-ignore problem is BACKSTOP's,
  because it is a property of WHICH DISPATCH SHAPE backstop chooses — and no pack
  can opt out of a directory target backstop hands it.

