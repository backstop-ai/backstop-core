  ── THE FIX ────────────────────────────────────────────────────────────────
  `runFindingsEngine` in `cmd/backstop/pack_gate.go`: the two-branch scan-target
  logic collapsed to

      if scope == nil { cmdArgs = append(cmdArgs, projectRoot) }
      else            { cmdArgs = append(cmdArgs, excludeTestdataPaths(scope.Files)...) }

  A nil scope — the only caller that genuinely supplies no file list — keeps the
  directory target. EVERY scope that carries a file list, all-scope now included,
  hands that list over explicitly. The ISSUE-010 CLM-003 anti-fallback contract
  survives BY CONSTRUCTION rather than by condition: an empty list appends
  nothing and cannot fall through to the directory branch. That structural
  property, and the reason a future reader must not "helpfully" restore a
  fallback, are both stated in-file above the branch.

  The defect this closes is the counter-intuitive one the plan was written
  around: `gate --all` was NOT a superset of the diff-scoped gate. Handed a
  directory, the engine performed its OWN discovery under its OWN default ignore
  set — which backstop can neither see nor override — and systematically dropped
  test-file findings that the diff-scoped run reported.

