  and nowhere else. A task's prose may elaborate a claim; it never introduces
  one. If an assertion is not in this ledger it is not a claim of this plan.

    CLM-001  ALL-SCOPE DISPATCHES ITS EXPLICIT FILE LIST. Under a non-nil scope
             whose Mode is `GateScopeModeAll`, `runFindingsEngine` appends the
             scope's own (testdata-pruned) file list as the engine's scan
             targets, and does NOT append `projectRoot`. The all-scope file list
             already exists on the scope object — `ComputeGateScopeWithBase`'s
             all arm fills it via `resolveGateScopeAll`/`newGateScope`; the
             dispatch was simply ignoring it. Asserted over the production scope
             resolver, never a hand-built GateScope literal.

    CLM-002  THE DEFECT, AT THE REAL ENGINE. An all-scope dispatch through the
             real production path (`dispatchPackEngines` + a real
             `check.ExecCommandRunner` + a real installed pack + the real engine
             binary) REPORTS a rule violation living in a `*_test.go` file —
             the finding it drops today. This is the verdict-honesty claim;
             CLM-001 alone is an arg-shape assertion and cannot stand in for it.

    CLM-003  ALL-SCOPE PRUNES `testdata` SEGMENTS. The file list handed over
             under all-scope passes through `excludeTestdataPaths`, so a path
             with a `testdata` directory SEGMENT is not a scan target — the same
             ISSUE-040 treatment the diff scope has had, now applied to both
             scopes instead of one. This is the cure for the over-report half,
             and it is subtractive by design.

    CLM-004  ANTI-FALLBACK, EXTENDED TO ALL-SCOPE. A non-nil scope whose
             (post-pruning) file list is EMPTY appends ZERO scan targets. The
             engine scans nothing and yields nothing. It must NEVER fall through
             to the `projectRoot` directory target. This is ISSUE-010's CLM-003
             contract, now covering the all-scope path it previously excluded,
             and it is the single guard whose failure would silently restore the
             whole defect.

    CLM-005  THE NIL-SCOPE BRANCH IS PRESERVED, AND IS NOT A GRANDFATHER CLAUSE.
             A `nil` scope has no file list to substitute, so it retains exactly
             one scan target: `projectRoot`. This is the honest behavior for a
             caller that supplied no scope, and it is what keeps the fix
             surgical — the nil-scope callers (`baseline_identity_dispatch_e2e`,
