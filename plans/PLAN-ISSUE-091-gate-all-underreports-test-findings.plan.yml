    CLM-007  THE COMMENT TELLS THE TRUTH, TOOL-AGNOSTICALLY. The comment block
             above the collapsed branch no longer asserts that a directory target
             and the file list that directory contains are equivalent inputs. It
             states the real rationale — an engine handed a directory performs
             its OWN discovery under its OWN default ignore set, which backstop
             can neither see nor override — WITHOUT naming any tool, engine, or
             language literal, cites ISSUE-091, and preserves the ISSUE-010
             CLM-003 anti-fallback note and the SPEC-034 REQ-010/CLM-034 Ratified
             Design Constraint 3 reference.

    CLM-008  `--all` AND A DIFF-SCOPED RUN AGREE OVER THE SAME FILES. Dispatched
             twice over the identical file set — once via a `GateScopeModeAll`
             scope, once via a `GateScopeModeFile` scope naming those files — the
             two finding sets are EQUAL, compared as sorted (File, Rule, Line)
             tuples. This is the property ISSUE-091 actually demands, and it is
             stronger than either count alone. It is scoped to "over the same
             files": it does NOT claim `--all` only ever gains rows relative to
             its own pre-fix output (see THIRD DIVERGENCE).

    CLM-009  THE CONSEQUENCES ARE FILED, NOT ABSORBED. Every consequence this
             fix creates that falls outside its scope is recorded in a
             first-class artifact rather than buried in a completed plan or a
             commit message: PLAN-ISSUE-010's superseded CLM-004 prose, the
             deliberate loss of `testdata/` visibility under `--all`, the
             path-scoped-rule blindness of the THIRD DIVERGENCE, the RETRACTION
             OF PLAN-ISSUE-020'S MANDATED `--all` BAN RATIONALE together with
             the founder-level CI-scope policy question it opens (filed
             UNRESOLVED — this plan corrects the stale rationale TEXT at three
             source sites and changes no CI behavior), and the newly-visible
             repo-wide debt (which routes into the EXISTING ISSUE-094 rather
             than a further tracker). Filing is via `artifact new issue` + the
             issue-author agent; none of it is hand-written, none of it is fixed
             here, and the policy question is DEFERRED TO THE FOUNDER rather
             than decided by any agent in this lane.

phases:
  # ═══════════════════════════════════════════════════════════════════════
  # Phase 1: TDD Red — falsify the divergence at the dispatch shape AND at
  # the real engine, and invert the shipped assertion that pins the defect.
  # All three tasks are parallel-eligible: disjoint files, no dependencies.
  # ═══════════════════════════════════════════════════════════════════════
  - id: phase-1
    name: "Phase 1: TDD Red — Prove the All-Scope Dispatch Divergence"
    tasks:
      - id: TASK-001
        type: test
        title: "Dispatch-shape falsifiers: all-scope must receive the explicit file list"
        description: |
          Create `cmd/backstop/pack_gate_issue091_regression_test.go`. These are
          ARG-SHAPE tests over the real `dispatchPackEngines` with a recording
          runner — they prove WHAT backstop hands the engine. They are necessary
          but NOT sufficient on their own; TASK-002 supplies the real-engine proof
          that the shape change actually changes the finding set. Do not treat
          either task as redundant with the other.

          Build on the harness ALREADY in `cmd/backstop/pack_gate_scope_test.go`
          — do not invent a parallel one. Reuse, by name:
            * `semgrepScopeManifest(t)`      — rule-flags (semgrep-shaped) manifest
            * `astGrepLikeScopeManifest(t)`  — config-file (ast-grep-shaped) manifest
            * `scopeTargetRunner`            — recording runner
            * its `scanTargets(t)` helper    — extracts the appended scan targets
          If any of these has been renamed since this plan was authored, locate
          the current equivalent BY READING THE FILE — do not guess, and do not
          fork a copy.

          Write these four tests:

          1. `TestIssue091_AllScopeDispatchesExplicitFileListNotProjectRoot`
             (CLM-001). Populate a `t.TempDir()` projectRoot with a small tree
             containing at least one `*_test.go` file and one plain `.go` file in
             a SUBDIRECTORY (nesting matters — it is what a naive basename-only
             fix would miss). Derive a REAL scope via
             `gate.ComputeGateScope(projectRoot, gate.GateScopeModeAll, nil)` —
             do NOT hand-construct a GateScope literal, because the claim is about
             what the production scope resolver yields. Assert the recorded scan
             targets equal the scope's own file list, and assert explicitly that
             `projectRoot` is NOT among the targets. Run it for BOTH manifest
             shapes (rule-flags and config-file) — the defect is per-dispatch-
             shape, not per-pack, and `runFindingsEngine`'s branch serves both.
             FAILS pre-fix: the recorded target is the bare projectRoot directory.

          2. `TestIssue091_AllScopeExcludesTestdataPaths` (CLM-003). Same setup,
             but plant a file under a `testdata/` directory segment inside the
             temp projectRoot. Assert the testdata path is NOT among the scan
             targets while the non-testdata siblings ARE. This pins the inverse
             over-report half. FAILS pre-fix for a different reason than test 1
             (pre-fix there is exactly one target, the directory, so the testdata
             path is neither included nor excluded — it is delegated to the
             engine). Assert on the CURRENT target list, not on absence alone, so
             the test cannot pass vacuously against an empty target list.

          3. `TestIssue091_AllScopeEmptyFileListAppendsNoTarget` (CLM-004). An
             EMPTY `t.TempDir()` projectRoot yields an all-scope with zero files.
             Assert ZERO scan targets are appended — the engine scans nothing and
             yields nothing. It must NOT fall back to the projectRoot directory.
             This is the ISSUE-010 CLM-003 anti-fallback contract, now extended to
             cover all-scope; it is the single most important guard in this file,
             because a fallback here would silently restore the whole defect.

          4. `TestIssue091_NilScopeStillTargetsProjectRoot` (CLM-005). A `nil`
             scope has NO file list to substitute, so it MUST retain the
             projectRoot directory target. This is not a grandfather clause — it
             is the honest behavior for a caller that supplied no scope. Assert
             exactly one target, equal to projectRoot. This test PASSES pre-fix
             and post-fix by design: it is the guard that the fix is surgical and
             does not disturb the nil-scope callers that
             `baseline_identity_dispatch_e2e_test.go` depends on.

          CLM-006 IS WHAT MAKES THIS FILE PARAMETERIZED, NOT REPETITIVE. All
          FOUR tests run against BOTH manifest shapes — `semgrepScopeManifest`
          (rule-flags) and `astGrepLikeScopeManifest` (config-file) — not test 1
          alone. The claim is that ONE dispatch site serves every non-project-wide
          engine shape regardless of pack or tool, so asserting it for one shape
          proves half of it. Use a table/subtest over the two manifest builders
          so adding a third shape later is a one-line addition; do not copy-paste
          eight test bodies.

          NEGATIVE CONTROL, not optional: at least one assertion must FAIL if the
          fix over-reaches — test 4 is that control. A fix that replaced the
          projectRoot target unconditionally would pass tests 1-3 and fail 4.
        files:
          - cmd/backstop/pack_gate_issue091_regression_test.go
        test_names:
          - TestIssue091_AllScopeDispatchesExplicitFileListNotProjectRoot
          - TestIssue091_AllScopeExcludesTestdataPaths
          - TestIssue091_AllScopeEmptyFileListAppendsNoTarget
          - TestIssue091_NilScopeStillTargetsProjectRoot
        claims:
          - CLM-001
          - CLM-003
          - CLM-004
          - CLM-005
          - CLM-006
        depends_on: []

      - id: TASK-002
        type: test
        title: "Real-engine e2e: an all-scope run must report the test-file finding it drops today"
        description: |
          Create `cmd/backstop/pack_gate_issue091_e2e_test.go` with
          `TestIssue091_AllScopeReportsTestFileFindings_RealEngine` (CLM-002,
          CLM-008).

          THIS IS THE LOAD-BEARING TASK. TASK-001 proves backstop changed what it
          HANDS the engine; only this proves the engine's REPORTED FINDINGS
          changed. Without it, "fixed" would be an arg-shape assertion dressed up
          as a verdict-honesty fix — precisely the vacuous-green class ISSUE-091
          belongs to.

          Model it on the existing real-engine precedent in
          `cmd/backstop/dogfood_enforcement_test.go`
          (`TestDogfoodPack_FlagsKnownGoViolation`): resolve the binary with
          `exec.LookPath`, and `t.Skip` with a clear reason when it is absent.
          Match that skip convention exactly — a hard failure on a machine
          without the engine is not this test's job.

          TWO PREMISES, TWO DIFFERENT POLARITIES — do not collapse them into one
          guard. The engine BINARY and the installed PACK are separate
          preconditions, and only one of them may be skipped:
            * MISSING BINARY -> `t.Skip`, as above. Environmental, and TASK-005
              already forbids reporting this plan verified on a skipped e2e, so
              a skip cannot masquerade as a pass.
            * MISSING PACK -> `t.Fatal`, with its OWN named check and its OWN
              message. The positive assertion depends on the gitignored
              `backstop-ai/go-standards` pack being installed under
              `.backstop/packs/`. If that pack is absent, the load-bearing "the
              `*_test.go` finding is reported" assertion fails for a reason
              INDISTINGUISHABLE from the defect being unfixed — a false negative
              that reads as "the fix does not work". Stat the pack's declared
              rule file (resolve it from the pack's own `pack.yml` rule_path;
              do not hard-code a rules/ path that a pack release may move) and
              fail with a message naming the pack and pointing at
              `backstop pack install`. A silent skip here is WRONG: an absent
              pack in this repo is a broken working tree, not a portability
              condition, and packs being gitignored is by design (they are
              reinstallable from `backstop.lock`), not a durability gap.

          Construction, precisely:
            * Build the fixture tree in `t.TempDir()`, NOT under the repo's
              `cmd/backstop/testdata/`. This is REQUIRED, not stylistic: this
              plan makes the all-scope path prune `testdata` segments, so a
              fixture living under `testdata/` would be filtered out of its own
              test's scope and the test would pass vacuously with zero findings.
            * Plant TWO files that both violate the SAME real rule from the
              installed `backstop-ai/go-standards` pack: one named `*_test.go`
              and one plain `.go` sibling. `go.core.no-global-mutable-state` is
              the rule Probe B (see notes) confirmed still fires on test files
              under explicit dispatch — verify it still does before relying on
              it, and if the pack has moved on, pick another rule that has NO
              `paths:` restriction and record which one in the test comment.
              Do NOT use `go.core.no-ignored-errors`: it now excludes
              `*_test.go` and would prove nothing.
            * Drive the REAL production path: `dispatchPackEngines` with a real
              `&check.ExecCommandRunner{Dir: projectRoot}` and an all-scope from
              `gate.ComputeGateScope`. Do not shortcut to a bare `exec.Command`
              semgrep invocation — the claim is about backstop's dispatch, and a
              direct invocation would bypass the very branch under change.

          Assertions:
            * POSITIVE: the returned violations include a finding whose File is
              the `*_test.go` fixture. This is the assertion that FAILS pre-fix —
              confirm it fails before writing the fix, and record the observed
              pre-fix count in the task's completion note, LABELLED WITH ITS
              LAYER. Any count taken here is inherently the ACTIVE layer:
              `dispatchPackEngines` returns violations that have already passed
              through `parseSarif`, so suppressed rows are gone before the test
              ever sees them. Say "ACTIVE" explicitly anyway — the plan's
              measurement discipline applies to every count without exception,
              and an unlabelled number is what caused a wrong prediction once.
              Keep the fixture free of `nosemgrep` annotations so the two layers
              coincide for this test and the count cannot be ambiguous.
            * CONTROL: the plain `.go` sibling is ALSO reported, both pre- and
              post-fix. If the control ever stops firing, the fixture or the rule
              is broken and the positive assertion is meaningless — the test must
              say so rather than silently degrading.
            * SUPERSET (CLM-008): run the same dispatch a second time with a
              `GateScopeModeFile` scope naming the SAME two files, and assert the
              two finding sets are EQUAL. This is the property ISSUE-091 actually
              demands — that `--all` is not a stranger to the diff-scoped gate —
              and it is stronger than either count alone. Compare on
              (File, Rule, Line) tuples, sorted; do not compare raw slices, whose
              order is engine-determined.
        files:
          - cmd/backstop/pack_gate_issue091_e2e_test.go
        test_names:
          - TestIssue091_AllScopeReportsTestFileFindings_RealEngine
        claims:
