notes: |
  ─────────────────────────────────────────────────────────────────────────
  SPEC-050 — Seed 1 of BUNDLE-014 (requirement-traceability). Four
  mechanically-separable pieces, all inside core's own artifact-validation
  domain (ZERO language/tool knowledge):
    (F1) REQ-004 + REQ-005 — bundle REQ per-REQ semver `version:` + version
         LOG well-formedness, and `requirements[]` required at `delivered`,
         both inside validateBundleRequirements (pkg/validate/bundle.go).
    (F2) REQ-002 — tighten the shared `supportsRe` to REQUIRE the mandatory
         exact-semver pin `bundle-name:REQ-NNN@MAJOR.MINOR.PATCH` on spec AND
         issue requirements (pkg/validate/spec.go owns the regex, shared by
         pkg/validate/issue.go).
    (F3) REQ-001 + REQ-003 — pure corpus-resolution functions in the NEW
         pkg/validate/supports_resolution.go (BuildBundleReqCatalog,
         CollectSupportRefs, ResolveSupports). No filesystem, no language
         knowledge; operate on already-parsed artifacts.
    (F4) REQ-001 wiring — ValidateArtifacts (cmd/backstop/artifact_validate.go)
         runs the resolution pass over the discovered corpus so the CLI and the
         gate's realArtifactValidator.ValidateAll share ONE verdict.

  ─────────────────────────────────────────────────────────────────────────
  CO-LAND SEQUENCING — the enforcement flip must NOT go live before SPEC-051's
  backfill. This is a merge-sequencing constraint, NOT a runtime toggle; the
  END state is unconditionally on with no grandfather path (Sharp Edge 1).
  ─────────────────────────────────────────────────────────────────────────
  The moment `supportsRe` requires the `@X.Y.Z` pin (F2), REQ-004 requires a
  `version:` FIELD on every bundle REQ (F1), and the error-severity resolution
  pass is wired (F4), the ENTIRE existing unpinned/unversioned corpus goes red
  — BY DESIGN. SPEC-050's code turns that corpus green ONLY once SPEC-051's
  Seed-2 backfill (which stamps `version: 1.0.0` and `@1.0.0` pins across the
  corpus, and retires the stale SPEC-002/003/004 drafts) co-lands in the SAME
  atomic change-train.
  Consequence for verification:
    • `go test ./...` is FIXTURE-based and is the per-phase GREEN PROOF of
      SPEC-050's own correctness — it stays green throughout (each SPEC-050
      test operates on in-test fixtures, independent of the live corpus).
    • `./bin/backstop gate` and a full-corpus `backstop artifact validate` red
      on the un-backfilled corpus until SPEC-051 lands. That red is the signal
      to land the backfill, NOT a defect in this plan's code. The final phase
      runs the full gate on the ASSEMBLED change-train (SPEC-050 code +
      SPEC-051 backfill applied together).
  Per repo law (no check filtering, no scoping down) every verification task
  still runs the FULL command set — no dimension is cherry-picked out; the
  corpus-red is understood and annotated, never dodged.

  ─────────────────────────────────────────────────────────────────────────
  STRICT SEMVER — one notion for BOTH the version field and the pin (REQ-002 /
  REQ-004). Use the strict `^\d+\.\d+\.\d+$` shape (the existing `semverRe`,
  pkg/validate/bundle.go:14) for the version field and the log entries, and the
  `@\d+\.\d+\.\d+$` tail on `supportsRe` for the pin. DO NOT reuse
  pkg/pack/manifest.go's `validateSemver` — it PERMITS `-prerelease`/`+build`
  suffixes, so it would accept `1.0.0-rc1` as a version-field value while the
  pin regex rejects `@1.0.0-rc1`, producing a version no pin could match and
  breaking the one-strict-M.M.P seam SPEC-052's stale-pin comparison depends on.
  Monotonic-ascending ordering and duplicate detection compare SEMVER
  numerically (1.10.0 > 1.9.0), NOT string order; "newest" is the semver-max
  (= last element of a well-formed ascending list).

  ─────────────────────────────────────────────────────────────────────────
  B2 COUPLED EXISTING TESTS (must be migrated, NOT worked around — do NOT
  weaken the regex to make them pass). Tightening `supportsRe` breaks fixtures
  asserting the OLD unpinned format:
    • pkg/validate/spec_test.go:988 TestSpec_RequirementValidSupports asserts
      the unpinned `my-feature:REQ-001` produces no supports-format violation —
      migrate the fixture value to `my-feature:REQ-001@1.0.0`, keep the
      assertion.
    • pkg/validate/issue_test.go:23 validIssueArtifact() carries an unpinned
      `my-feature:REQ-003` (issue_test.go:78) that ~20+ tests ride through the
      Pass() assertion (issue_test.go:127) — migrate the fixture ref to
      `my-feature:REQ-003@1.0.0` so the shared fixture stays green.
  These migrations are TASK-006 so the implementer does not hit unexplained
  reds.

  ─────────────────────────────────────────────────────────────────────────
  FULL-CORPUS CATALOG UNDER TYPE-SCOPING (REQ-001 / CLM-031). ValidateArtifacts
  passes the type filter to DiscoverArtifacts (artifact_validate.go:112), so a
  `--spec`-scoped run discovers ONLY specs. If the resolution catalog were
  built from that filtered set it would contain ZERO bundles and ResolveSupports
  would false-red every ref as "missing bundle." The catalog MUST be built from
  a SEPARATE, unfiltered bundle discovery (or discover-all-then-filter only for
  the per-artifact loop), so a scoped run resolves identically to an unscoped
  run and to the gate. CLM-031 is the guard.

  ─────────────────────────────────────────────────────────────────────────
  TERMINAL EXEMPTION (REQ-001 / CLM-035 / CLM-036). CollectSupportRefs SKIPS
  terminal-status citers (replaced / canceled / deprecated / obsoleted),
  mirroring the per-artifact exemption at spec.go:175 / issue.go:349 /
  isTerminalStatus — a format-exempt-but-resolution-checked split would be
  incoherent and would pin a retired artifact's stale ref red forever. This is
  the seam SPEC-051 relies on to clear SPEC-002/003/004's dangling refs and keep
  `replaced` SPEC-039 out of resolution.

  This plan's own file (PLAN-SPEC-050) is the only artifact it authors; it emits
  NO report/summary files. REQ-005's `delivered` extension lives in the
  requiresDefined condition at bundle.go:531 (NOT the terminal exemption at
  bundle.go:94 — `delivered` is not terminal, so validateBundleRequirements
  already runs for it), leaving replaced/canceled/deprecated exempt untouched.

