  - id: phase-1
    name: "Phase 1: Test Fixtures and Scaffolding"
    tasks:
      - id: TASK-001
        type: setup
        title: "Scaffold lcov convert-input fixtures (line+branch, BRF:0 N/A)"
        description: |
          Create the lcov `.info` input fixtures the Phase-3 convert tests run the real
          scripts/coverage-to-records.sh over:
            - a normal lcov block with per-file LF/LH (line) AND BRF/BRH (branch) counts for
              a measured `.ts` source file (drives CLM-015/016/017/020/021).
            - an lcov block for a file with NO branchable code (BRF:0) alongside real LF/LH —
              the branch-N/A fixture (drives CLM-018: branch record total:0, line still
              measured).
            - an lcov block exercising raw-counts-not-aggregated (e.g. line 95/100, branch
              60/100) so the convert is proven to emit two raw-count records, never a rolled-up
              number (drives CLM-021).
          DATA only — the convert + parser assertions live in the Phase-3 test task.
        files:
          - cmd/backstop/testdata/bun-coverage/lcov-line-branch.info
          - cmd/backstop/testdata/bun-coverage/lcov-no-branch-na.info
          - cmd/backstop/testdata/bun-coverage/lcov-raw-counts.info
        claims:
          - CLM-015
          - CLM-016
          - CLM-017
          - CLM-018
          - CLM-020
          - CLM-021
        depends_on: []

      - id: TASK-002
        type: setup
        title: "Scaffold the in-repo static bun-toolchain end-to-end fixture (non-pack DATA)"
        description: |
          Create the in-repo static fixture's NON-pack DATA under
