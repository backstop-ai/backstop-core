        description: |
          Run `backstop code check` over pkg/config/config.go + pkg/gate/policy.go +
          cmd/backstop/gate.go + their tests. Confirms a pack-scoped entry parses + is backward
          compatible (unscoped behaves as today), and on the shared pack_engines dimension the
          backstop/self flip BLOCKS a fresh neutral-spine finding while go-standards AND
          go-toolchain baselined debt stay grandfathered, with NO whole-dimension zero-baseline.
          Middle-phase verification.
        files:
          - pkg/config/config.go
          - pkg/gate/policy.go
          - cmd/backstop/gate.go
          - pkg/config/config_perpack_test.go
          - pkg/gate/policy_perpack_test.go
        claims:
