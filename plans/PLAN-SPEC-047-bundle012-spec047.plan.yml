  # ═══════════════════════════════════════════════════════════════════════
  # Phase 3: The lcov coverage convert (REQ-003) — emits the SPEC-044 bun
  # producer record-shape: two canonical check.CoverageRecords per file
  # (line LF/LH, branch BRF/BRH), raw counts, through the EXISTING
  # check.ParsePackCoverage with NO new type/field/schema fork.
  # ═══════════════════════════════════════════════════════════════════════
  - id: phase-3
    name: "Phase 3: lcov → line+branch Coverage Convert"
    tasks:
      - id: TASK-008
        type: test
        title: "Write the lcov convert line+branch record-shape tests"
        description: |
          cmd/backstop/bun_coverage_convert_test.go — RED before scripts/coverage-to-records.sh
          exists. Runs the REAL convert over the Phase-1 lcov fixtures and parses its stdout
          through the EXISTING check.ParsePackCoverage (the SPEC-044 contract, consumed not
          redefined):
            - TestBunCoverageConvert_EmitsLineAndBranchPerFileSharingPath: for each measured
              source file the convert emits EXACTLY TWO records sharing the same Path — one
              metric "line", one metric "branch" — never a single collapsed record (CLM-015).
            - TestBunCoverageConvert_LineCountsFromLcovLfLh: the line record carries raw
              covered=LH, total=LF — not a pre-computed percentage (CLM-016).
            - TestBunCoverageConvert_BranchCountsFromLcovBrfBrh: the branch record carries raw
              covered=BRH, total=BRF — not a pre-computed percentage (CLM-017).
            - TestBunCoverageConvert_NoBranchableCodeEmitsTotalZeroBranchRecord: a BRF:0 file
              emits a branch record with total:0 (the N/A cell, never coerced to 0%) carrying
              metric:"branch" + measured:true, while its line record is still measured (CLM-018;
              empty-metric fail-loud sharp edge — the N/A cell must still carry the metric label).
            - TestBunCoverageConvert_RecordsParseThroughCanonicalParsePackCoverageNoNewType: the
              emitted records parse through the EXISTING check.ParsePackCoverage into canonical
              check.CoverageRecords with NO new type/field/schema fork — DisallowUnknownFields
              accepts the exact {path,covered,total,measured,excluded,metric} keys and rejects
              any stray field (CLM-019, sharp edge).
            - TestBunCoverage_LineAndBranchIndexUnderPathMetricNoCollision: the line+branch
              records index under the SPEC-044 (path, metric) key for one Path with NO collision
              — both metrics survive (CLM-020).
            - TestBunCoverageConvert_RawCountsNotPrecomputedPercentNoAggregation: DENYLIST —
              feeding line 95/100 + branch 60/100 yields two raw-count records, never one
              aggregated/averaged value or a pre-computed percent (CLM-021).
          Red — the convert script does not exist yet.
        files:
          - cmd/backstop/bun_coverage_convert_test.go
        claims:
          - CLM-015
          - CLM-016
          - CLM-017
          - CLM-018
          - CLM-019
          - CLM-020
          - CLM-021
        depends_on:
          - TASK-001
          - TASK-007

      - id: TASK-009
        type: implementation
        title: "Write scripts/coverage-to-records.sh (lcov → line+branch records)"
        description: |
          cmd/backstop/testdata/bun-toolchain/.backstop/packs/backstop/bun-toolchain/scripts/coverage-to-records.sh:
          POSIX awk (macOS system awk, like go-toolchain's convert), reading lcov on stdin,
          accumulating per-`SF:` file LF/LH (line) and BRF/BRH (branch), and emitting a JSON
          array of canonical records — TWO per file: {metric:"line", covered:LH, total:LF} and
          {metric:"branch", covered:BRH, total:BRF}, both measured:true, excluded:false. Raw
          counts only — NO percent, NO aggregation, NO collapsed record (CLM-015/016/017/021).
          A BRF:0 file emits a branch record carrying total:0 + metric:"branch" (the N/A cell,
          never coerced to 0%) while its line record is still measured (CLM-018). The output
          uses EXACTLY the canonical {path,covered,total,measured,excluded,metric} keys so it
          parses through the EXISTING check.ParsePackCoverage with NO new field
          (CLM-019/020) — DisallowUnknownFields is unforgiving. A converter banner on stderr
          exercises clean-stdout capture (as go-toolchain does). Make TASK-008 green.
        files:
          - cmd/backstop/testdata/bun-toolchain/.backstop/packs/backstop/bun-toolchain/scripts/coverage-to-records.sh
        claims:
          - CLM-015
          - CLM-016
          - CLM-017
          - CLM-018
          - CLM-019
          - CLM-020
          - CLM-021
        depends_on:
          - TASK-008

      - id: TASK-010
        type: verification
        title: "Verify the lcov coverage convert (code check)"
        description: |
          Run `backstop code check` over scripts/coverage-to-records.sh + its test. Confirms the
          convert emits two raw-count records per file (line LF/LH, branch BRF/BRH) through the
          existing check.CoverageRecord/ParsePackCoverage with no new type/field, the (path,
          metric) index has no collision, and a BRF:0 file yields a branch record with total:0
          carrying metric:"branch". Middle-phase verification.
        files:
          - cmd/backstop/testdata/bun-toolchain/.backstop/packs/backstop/bun-toolchain/scripts/coverage-to-records.sh
          - cmd/backstop/bun_coverage_convert_test.go
        claims:
          - CLM-015
          - CLM-016
          - CLM-017
          - CLM-018
          - CLM-019
          - CLM-020
          - CLM-021
        depends_on:
          - TASK-009

