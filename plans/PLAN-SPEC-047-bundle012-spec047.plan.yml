          DATA only — the end-to-end gate assertions live in the Phase-4 test task. The pack
          itself (pack.yml + convert scripts) is authored separately so this setup is
          file-disjoint from the pack-authoring tasks.
        files:
          - cmd/backstop/testdata/bun-toolchain/backstop.yml
          - cmd/backstop/testdata/bun-toolchain/src/app.ts
          - cmd/backstop/testdata/bun-toolchain/src/app.test.ts
          - cmd/backstop/testdata/bun-toolchain/coverage/lcov.info
          - cmd/backstop/testdata/bun-toolchain/coverage/lcov-seeded-defect.info
        claims:
          - CLM-022
          - CLM-023
          - CLM-024
          - CLM-025
          - CLM-026
