notes: |
  Implements SPEC-047 (BUNDLE-012 Spec Seed 5 of 5) — the INTEGRATION + PROOF spec. It
  consumes SPEC-043/044/045/046 contracts as FIXED interfaces and edits NONE of their core
  logic. Its owned surfaces are small: the `backstop/bun-toolchain` pack DATA (pack.yml +
  convert scripts, authored under the in-repo testdata fixture path, which is the tracked
  durable copy), the in-repo static fixture, the guarded external acceptance test +
  `bunAcceptanceEnabled()`, the trust-allowlist entries, the per-PACK/per-rule-SOURCE
  enforcement-policy extension (pkg/config + pkg/gate.ApplyPolicy + the cmd/backstop
  gatePolicyFromConfig mapping seam), and the dogfood baseline + `backstop/self` enforcement
  flip.

  ════════════════════════════════════════════════════════════════════════════
  CROSS-PLAN SEQUENCING — THIS PLAN IS LAST OF FIVE
  ════════════════════════════════════════════════════════════════════════════
  Phase 7 (REQ-006, the ratchet → block flip) is BLOCKED ON and sequenced AFTER
  PLAN-SPEC-043, PLAN-SPEC-044, PLAN-SPEC-045, and PLAN-SPEC-046 being IMPLEMENTED and their
  Pillar-A sites de-Go'd and CLEAN. The flip un-grandfathers the `backstop/self` neutral-spine
  findings in this strict order — (1) coverage measurable-path (SPEC-043) → (2) test-verify
  discovery (SPEC-045) → (3) go-package/`./...` matchers (SPEC-043) — and only then flips
  `backstop/self` to `block` + ZERO baseline. depends_on can only reference task IDs WITHIN
  this plan; the cross-PLAN gate is enforced by ordering Phase 7 last AND by the implementer
  refusing to apply the terminal flip while any of the three sites still flags (CLM-035 is the
  ordering guard). Performing the flip early would RED backstop-core's own dogfood gate on the
  not-yet-de-Go'd sites — backstop gate MUST stay GREEN throughout (CLAUDE invariant).

  ════════════════════════════════════════════════════════════════════════════
  PACKS ARE ALWAYS EXTERNAL — THE IN-REPO COPY IS GITIGNORED DATA
  ════════════════════════════════════════════════════════════════════════════
  The authoritative `backstop/bun-toolchain` pack lives in its OWN repo, hand-authored from
  the `backstop/go-toolchain` pack.yml template (OQ-5: the pack-authoring CLI is broken; the
  reboot is Track-B / ISSUE-032, OUT of scope — do not use `pack new`). The `.backstop/packs/`
  copy is gitignored, so the DURABLE tracked artifact in this repo is the testdata-fixture copy
  under cmd/backstop/testdata/bun-toolchain/.backstop/packs/backstop/bun-toolchain/ (the
  contracts' declared paths). The external repo MUST carry the same pack DATA — flagged for the
  implementer's durability note.

  ════════════════════════════════════════════════════════════════════════════
  ZERO BUN DEPENDENCY IN GO CI (REQ-004 vs REQ-005)
  ════════════════════════════════════════════════════════════════════════════
  The in-repo fixture proof (Phase 4) STUBS the runner — it feeds the PRE-CAPTURED lcov into
  the COVERAGE channel (gate_type coverage, NOT the SARIF channel) and runs only the real
  POSIX-shell convert over DATA. No real bun/oxlint/tsc/prettier process ever runs in
  backstop-core's Go CI (CLM-025). The REQUIRED external executed gate (Phase 5) runs on the
  real Bun fork (backstop-runtime) and is a guarded test that SKIPS (never FAILS) when
  bunAcceptanceEnabled() is false. Because the Go-CI guard makes it auto-skip, REQ-005 is
  CLOSED only by a documented MANUAL run on the fork with the captured RED-then-green
  `backstop gate` output recorded as run-evidence in the implementation verification log — the
  executed proof, not the skipped Go-CI stub.

  ════════════════════════════════════════════════════════════════════════════
  SHARED gate.go — SERIALIZED, NOT PARALLEL
  ════════════════════════════════════════════════════════════════════════════
  cmd/backstop/gate.go is touched by TWO tasks: TASK-013 (bunAcceptanceEnabled, REQ-005) and
  TASK-018 (gatePolicyFromConfig per-pack scope mapping, REQ-007). They are serialized via an
  explicit dependency (TASK-018 → TASK-014) so they are never parallel-eligible over the shared
  file (D-081). The bun pack itself is dispatched by SPEC-046's UNIFORM toolchain-pack dispatch
  with NO per-pack branch — bunAcceptanceEnabled() is the ONLY new production symbol in gate.go.

  ════════════════════════════════════════════════════════════════════════════
  go-toolchain's OWN classification block is SPEC-043's deliverable — NOT this plan's
  ════════════════════════════════════════════════════════════════════════════
  This plan authors ONLY the BUN pack's classification + test globs. SPEC-043 adds the
  classification block (and SPEC-045 the test_name_patterns) to the go-toolchain pack in
  lockstep with the baked-literal deletions. Do not duplicate or move the go block here
  (cross-consistency seam item, flagged for the BUNDLE-012 final pass).

phases:
  # ═══════════════════════════════════════════════════════════════════════
