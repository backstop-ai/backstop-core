  # ═══════════════════════════════════════════════════════════════════════
  # Phase 5: The REQUIRED external executed acceptance (REQ-005), guarded so
  # the real bun toolchain stays OUT of backstop-core's Go CI.
  # bunAcceptanceEnabled() is the ONLY new production symbol.
  # ═══════════════════════════════════════════════════════════════════════
  - id: phase-5
    name: "Phase 5: Guarded External Bun-Fork Acceptance"
    tasks:
      - id: TASK-012
        type: test
        title: "Write the guarded external Bun-fork acceptance test (skip-when-bun-absent)"
        description: |
          cmd/backstop/bun_acceptance_test.go — RED before bunAcceptanceEnabled() exists. The
          REQUIRED external executed gate, guarded so it SKIPS (never FAILS) in Go CI:
            - TestAcceptance_SkippedWhenBunToolchainAbsentKeepsGoCIBunFree: the test calls
              t.Skip() when bunAcceptanceEnabled() is false (bun absent / the acceptance env var
              unset), so backstop-core's Go CI never invokes the real bun toolchain (CLM-029).
            - TestAcceptance_ForkBunGateRedThenGreenOnSeededDefect: when enabled, it runs the
              real `backstop gate` over the Bun fork (backstop-runtime) wired packs-only
              (backstop.yml declaring backstop/bun-toolchain + `pack add` from its own repo),
              and asserts RED on a seeded lint/format/type/test/coverage defect, then green when
              fixed — RED-then-green (CLM-027).
            - TestAcceptance_ForkGatesPacksOnlyViaDeclaredBunToolchainPack: the fork gates
              PACKS-ONLY via the declared bun pack — no baked language path participates; the bun
              pack's engines are the only toolchain source (CLM-028).
          Document the minimal fork wiring (the single-acceptance backstop.yml + `pack add`);
          productionizing the fork CI is OUT of scope. Note for the implementer: REQ-005 is
          CLOSED only by a documented MANUAL run on the fork capturing the RED-then-green
          `backstop gate` output as run-evidence — the skipped Go-CI stub does not close it.
        files:
          - cmd/backstop/bun_acceptance_test.go
        claims:
          - CLM-027
          - CLM-028
          - CLM-029
        depends_on:
          - TASK-007

      - id: TASK-013
        type: implementation
        title: "Add bunAcceptanceEnabled() guard to gate.go"
        description: |
          cmd/backstop/gate.go: add `func bunAcceptanceEnabled() bool` (the ONLY new production
          symbol) — true ONLY when the bun toolchain is on PATH AND the acceptance env var is
          set. The guarded acceptance test calls t.Skip() when this is false, so backstop-core's
          Go CI never invokes the real bun/oxlint/tsc/prettier toolchain. The live dispatch of
          the bun pack is SPEC-046's UNIFORM toolchain-pack dispatch — do NOT add a per-pack
          branch. Make TASK-012's CLM-027/028/029 green (the enabled path runs in the fork's env;
          in Go CI the guard returns false and the test skips). Touches gate.go, which TASK-018
          also edits — serialized via TASK-018 → TASK-014 so the two gate.go edits are never
          parallel (D-081).
        files:
          - cmd/backstop/gate.go
        claims:
          - CLM-027
          - CLM-028
          - CLM-029
        depends_on:
          - TASK-012

      - id: TASK-014
        type: verification
        title: "Verify the guarded acceptance + bunAcceptanceEnabled (code check)"
        description: |
          Run `backstop code check` over cmd/backstop/gate.go (bunAcceptanceEnabled) + the
          acceptance test. Confirms the acceptance SKIPS when bun is absent (Go CI stays
          bun-free), and that when enabled it gates the fork packs-only RED-then-green on a
          seeded defect. Middle-phase verification — the manual fork run-evidence is captured
          separately (see TASK-012). Also the serialization anchor for the shared gate.go edit
          (TASK-018 depends on this).
        files:
          - cmd/backstop/gate.go
          - cmd/backstop/bun_acceptance_test.go
        claims:
          - CLM-027
          - CLM-028
          - CLM-029
        depends_on:
          - TASK-013

  # ═══════════════════════════════════════════════════════════════════════
  # Phase 6: Per-PACK / per-rule-SOURCE enforcement granularity (REQ-007) —
  # the mechanism REQ-006's flip is expressed through. Scope a policy entry
  # to a pack (keyed off gate.Violation.SourcePack) so backstop/self flips
  # to block + zero baseline WITHOUT disturbing go-standards/go-toolchain's
  # baselined style debt on the shared pack_engines dimension.
  # ═══════════════════════════════════════════════════════════════════════
  - id: phase-6
    name: "Phase 6: Per-Pack Enforcement Policy Granularity"
    tasks:
      - id: TASK-015
        type: test
        title: "Write config per-pack policy parse + backward-compat tests"
        description: |
          pkg/config/config_perpack_test.go — RED before config.DimensionPolicy gains the
          per-pack/source scope:
            - TestPolicy_PackScopedEntryParsesAndUnscopedEntryUnchanged: a pack-scoped policy
              entry (e.g. `pack_engines` scoped to source `backstop/self` with level block +
              baseline false) parses onto the EXTENDED config Enforcement.Policy /
              DimensionPolicy structure, AND an unscoped (dimension-only) entry keeps its current
              behavior — backward compatible (CLM-036).
          Red — the config schema has no per-pack/source scope yet.
        files:
          - pkg/config/config_perpack_test.go
        claims:
          - CLM-036
        depends_on: []

      - id: TASK-016
        type: test
        title: "Write the shared-dimension per-pack enforcement matrix tests"
        description: |
          pkg/gate/policy_perpack_test.go — RED before ApplyPolicy gains per-PACK/per-rule-SOURCE
          scoping. With backstop/self flipped to block + ZERO baseline via the scoped key, on the
          SHARED pack_engines dimension:
            - TestPolicy_SelfPackFlipBlocksFreshNeutralSpineFinding: a FRESH neutral-spine
              (baked-language) finding sourced from backstop/self BLOCKS the gate (fails)
              (CLM-037).
            - TestPolicy_SelfPackFlipLeavesGoStandardsBaselinedFindingGrandfathered: a baselined
              go-standards style finding on the same dimension does NOT block — stays
              grandfathered, unaffected by the backstop/self-scoped flip (CLM-038).
            - TestPolicy_SelfPackFlipLeavesGoToolchainBaselinedFindingGrandfathered: a baselined
              go-toolchain style finding on the same dimension does NOT block — stays
              grandfathered (CLM-039).
            - TestPolicy_FlipUsesPerPackKeyNotWholeDimensionZeroBaseline: DENYLIST — the flip is
              delivered via the per-pack/source key (filtering on gate.Violation.SourcePack), NOT
              a whole-dimension pack_engines:{level:block, baseline:false} entry (which would
              wrongly block go-standards/go-toolchain baselined debt); the whole-dimension
              zero-baseline is proven ABSENT (CLM-040).
          Red — ApplyPolicy keys strictly per-dimension today.
        files:
          - pkg/gate/policy_perpack_test.go
        claims:
          - CLM-037
          - CLM-038
          - CLM-039
          - CLM-040
        depends_on: []

      - id: TASK-017
        type: implementation
        title: "Extend config DimensionPolicy with per-pack/source scope"
        description: |
          pkg/config/config.go: extend Enforcement.Policy / DimensionPolicy so a policy entry can
          SCOPE to a pack/rule-source (keyed off gate.Violation.SourcePack) — the backstop.yml
          mirror of the policy row gains the per-PACK/per-rule-SOURCE scoping so a `pack_engines`
          entry can target backstop/self's findings independently. Backward compatible: an
          unscoped (dimension-only) entry parses and behaves exactly as today. Exact shape
          (nested per-source overrides vs. composite key) is this plan's call; the constraint is
          a scoped entry must not change enforcement for OTHER packs on the same dimension. Make
          TASK-015's CLM-036 green. File-disjoint from TASK-018, so parallel-eligible.
        files:
          - pkg/config/config.go
        claims:
          - CLM-036
        depends_on:
          - TASK-015

      - id: TASK-018
        type: implementation
        title: "Apply per-pack/source scoping in gate.ApplyPolicy + the config→gate mapping"
        description: |
          pkg/gate/policy.go: extend gate.DimensionPolicy + ApplyPolicy so a SCOPED entry's
          level+baseline apply ONLY to findings whose gate.Violation.SourcePack matches the
          scope, while every OTHER pack's findings on the same dimension keep their default (or
          separately-configured) grandfathered policy. ApplyPolicy's EXTERNAL signature stays
          UNCHANGED; an unscoped (dimension-only) entry keeps current behavior. Also update
          cmd/backstop/gate.go gatePolicyFromConfig to carry the new per-pack/source scope from
          config.DimensionPolicy into gate.DimensionPolicy (the mapping seam). Makes CLM-037/038/
          039/040 green. Depends on TASK-016 (test, TDD) and TASK-014 (verification) — the latter
          SERIALIZES this task's gate.go edit after TASK-013's gate.go edit so the two are never
          parallel-eligible over the shared file (D-081). The cross-package wiring (config scope
          → gate scope → ApplyPolicy filtering) honors the integration-gap lesson: the matrix is
          proven through the live policy path, not a constructed DimensionPolicy.
        files:
          - pkg/gate/policy.go
          - cmd/backstop/gate.go
        claims:
          - CLM-037
          - CLM-038
          - CLM-039
          - CLM-040
        depends_on:
          - TASK-016
          - TASK-014

      - id: TASK-019
        type: verification
