          Create the pkg/scaffold/ package directory and the initial scaffold.go file
          containing the type registry infrastructure.

          Define:
            - ArtifactTypeConfig struct with fields: Directory, FilenameTemplate,
              IDPrefix, DigitCount, DefaultStatus, RequiredFrontmatter, BodySections
            - ValidArtifactTypes map[string]ArtifactTypeConfig with all 7 types registered:
              spec, plan, issue, adr, directive, bundle, capability
            - Each entry maps to its correct directory (specs/, plans/, issues/, adrs/,
              directives/, bundles/, capabilities/), digit count (3 for most, 4 for adr),
              and default status (draft, open, or idea)

          Also create stub files for idresolver.go and slug.go with package declarations
          so the package compiles.
        files:
          - pkg/scaffold/scaffold.go
          - pkg/scaffold/idresolver.go
          - pkg/scaffold/slug.go
        claims:
