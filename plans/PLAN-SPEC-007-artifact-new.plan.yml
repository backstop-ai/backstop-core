      - id: TASK-017
        type: implementation
        title: "Implement NewArtifactNewCommand Cobra adapter"
        description: |
          Implement the thin Cobra command adapter in cmd/backstop/artifact_new.go.

          NewArtifactNewCommand() *cobra.Command:
            1. Define Cobra command: Use "new" as command name, "artifact new <type>"
               usage pattern
            2. Define flags: --slug (required string), --source (optional string),
               --json (bool for JSON output)
            3. RunE function:
               a. Validate exactly one positional arg exists (exit 2 if missing)
               b. Validate type is in ValidArtifactTypes (exit 2 if invalid)
               c. Validate slug via ValidateSlug (exit 2 if invalid)
               d. If type is "plan":
                  - Validate --source is present (exit 2 if missing)
                  - Validate --source via ValidateSource (exit 2 if invalid)
               e. Call ResolveID(artifactType, opts) to get next ID
                  - On tag conflict exhaustion error: exit 2
                  - Other errors propagate
               f. Call Scaffold(artifactType, id, slug, today, sourceID) to render
               g. Compute target dir via TargetDir, create if needed (os.MkdirAll)
               h. Compute filename via Filename
               i. Check if file exists: if yes, exit 1 (conflict)
               j. Write file to disk
               k. Format output (JSON or human mode)
               l. Return exit 0

          The command must be a thin adapter: no template logic, no ID logic,
          only flag parsing + wiring + file I/O + output formatting.
