---
plan_id: PLAN-SPEC-007
spec_id: SPEC-007
spec_version: 1.0.0
created: "2026-04-04"
status: draft
target_repo: backstop-core
target_module: github.com/bmanson/backstop-core
test_command: "go test ./cmd/backstop/... ./pkg/scaffold/... -run TestArtifactNew -race -coverprofile=cover.out"
coverage_threshold: 90

notes: |
  Implements the backstop artifact new <type> command for all seven artifact types
  (spec, plan, issue, adr, directive, bundle, capability) with git annotated tag
  ID reservation, offline fallback, type-specific template rendering, and the
  --source flag for plan scaffolding.

  The implementation spans two packages: pkg/scaffold/ (type registry, slug
  validation, source validation, ID resolution, template rendering, filename/dir
  logic) and cmd/backstop/ (thin Cobra command adapter). The pkg/scaffold/ work
  is split across four files with disjoint concerns, enabling parallel phases.

  Dependency: SPEC-005 (CLI foundation). The cmd/backstop/ adapter consumes
  the output formatter and exit code conventions from SPEC-005. If SPEC-005
  is not yet implemented, the adapter can define a minimal interface.

  Structure:
    Phase 1: Setup — scaffold package and type registry
    Phase 2: Parallel TDD — slug validation, source validation (disjoint files)
    Phase 3: TDD — ID resolution (git tags + local fallback)
    Phase 4: TDD — template rendering, filename, and directory logic
    Phase 5: TDD — Cobra command adapter (thin adapter wiring)
    Phase 6: TDD — output modes and exit codes
    Phase 7: Comprehensive verification

phases:
  # ═══════════════════════════════════════════════════════════════════════
  # Phase 1: Setup — Package Scaffolding and Type Registry
  # ═══════════════════════════════════════════════════════════════════════
  - id: phase-1
    name: "Phase 1: Setup — Package Scaffolding and Type Registry"
    tasks:
