      - id: TASK-009
        type: implementation
        title: "Implement GitTagResolver and ResolveID"
        description: |
          Implement git tag ID resolution in pkg/scaffold/idresolver.go.

          Define GitExecutor interface:
            - ListTags(pattern string) ([]string, error)
            - CreateAnnotatedTag(name, message string) error
            - PushTag(name string) error
            - FetchTags() error
            - IsGitRepo() bool
            - IsGitAvailable() bool

          Implement GitTagResolver struct:
            - Fields: executor GitExecutor, maxRetries int (default 3)
            - Resolve(artifactType, slug string) (string, error):
              1. Check IsGitAvailable and IsGitRepo — if not, return sentinel error
              2. FetchTags — on non-conflict error, return sentinel for fallback
              3. ListTags("backstop/<type>/*") to get existing tags
              4. Parse numeric suffixes, find max, compute next
              5. Create annotated tag with timestamp and slug in message
              6. Push tag — on conflict, retry with incremented number (up to maxRetries)
              7. On non-conflict push failure, return sentinel for fallback
              8. Return formatted ID string (e.g., "003")

          Implement LocalScanResolver struct:
            - Resolve(artifactType, targetDir string) (string, error):
              1. Read directory listing
              2. Match filenames against type's filename pattern
              3. Extract numeric IDs
              4. Return next sequential number

          Implement ResolveID(artifactType string, opts IDOptions) (string, error):
            - Try GitTagResolver first
            - On fallback sentinel error, use LocalScanResolver
            - On tag conflict exhaustion, return error (exit 2)

          Implement real GitExecutor (RealGitExecutor) that shells out to git.
        files:
          - pkg/scaffold/idresolver.go
        claims:
