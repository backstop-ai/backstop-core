notes: |
  ISSUE-214: scripts/tests/public-product-model/pages/extend-reference-contributing.sh:282,
  inside verify_reference_paper_ink_chrome, runs GNU-only `sed -i '<script>' file`.
  BSD sed (macOS) treats the script as the backup suffix and the path as the
  script, so under `set -euo pipefail` the page check exits 1 and
  scripts/verify-public-product-model.sh stops right after
  "CLAIM-005 layout PASS". The bash-test engine runs that verifier, so
  `backstop gate` fails on macOS. Linux CI uses GNU sed and never sees it.
  Authoring base: branch fix/engine-evidence-integrity at b8be04a.

  Scope (issue Direction 1 and 3, plus the trap from the issue Notes):
    - Swap line 282 for the portable write-to-temp-then-mv form:
        sed '<same script>' "$tmp/layout.html" > "$tmp/layout.new" && mv "$tmp/layout.new" "$tmp/layout.html"
      The sed script text (strip `{% if paper_kinds contains page_kind %}`
      and `{% endif %}`) stays byte-identical, so the "unguarded-tokens
      mutation" keeps its meaning.
    - Add one EXIT trap scoped to verify_reference_paper_ink_chrome that
      removes that function's current mktemp scratch dir if the function
      aborts partway. The function reuses one `tmp` variable for its four
      mktemp -d dirs, so a single `trap 'rm -rf "${tmp:-}"' EXIT` set at
      function entry covers every one (rm -rf on an already-removed path or
      an empty string does nothing). Clear it with `trap - EXIT` just before
      the function returns normally. The script defines no other trap today
      (grep at b8be04a), and verify-public-product-model.sh runs it as its
      own process, so nothing else is affected.
    - The existing explicit `rm -rf "$tmp"` calls stay unchanged.

  Out of scope:
    - Issue Direction 2 (a macos-latest CI leg). No workflow invokes this
      verifier directly; it runs through the gate's bash-test engine, so a
      macOS leg means a new job with a Go build, pack install and gate run
      on macOS. That is not trivial, so it is deferred and no CI file changes.
    - mktemp cleanup in the script's other functions, and the
      verify-documentation-semantics-integration.sh observation the issue
      excludes on purpose.
    - ISSUE-209 (engine dispatch error discards other engines' findings).

  Existence-in-world: grep of plans/ and issues/ (committed and working tree)
  for ISSUE-214, extend-reference-contributing and `sed -i` found only
  PLAN-ISSUE-087, which mentions `sed -i ''` in release-pipeline prose (a
  different surface). No artifact owns this fix.

  Acceptance claims (ISSUE-214 has no formal CLM array):
    CLM-001: on macOS (BSD sed), scripts/verify-public-product-model.sh runs
      past the paper-ink chrome check and exits 0. The page check's in-place
      edit uses only syntax that GNU and BSD sed both accept.
    CLM-002: the unguarded-tokens mutation is unchanged: the same two Liquid
      guards are stripped and validate_paper_ink still rejects the mutated
      layout. The other three mutations in that function are untouched.
    CLM-003: if verify_reference_paper_ink_chrome aborts partway, its current
      mktemp scratch dir is still removed (one EXIT trap). The trap is cleared
      on normal return so it does not run for later checks.

  Red / green commands (on a macOS host):
    red:   scripts/verify-public-product-model.sh; echo rc=$?
           (expect rc=1, stopping after "CLAIM-005 layout PASS" with a
           `sed: 1: ...` error), plus the issue's scratch reproduction.
    green: scripts/verify-public-product-model.sh; echo rc=$?   (expect rc=0)
    gate:  `backstop gate`, run with a backstop binary built from this
           branch's HEAD (e.g. `make build` → bin/backstop, or
           `go build ./cmd/backstop`), since an older installed binary may
           predate fixes such as ISSUE-154.

  File allowlist: scripts/tests/public-product-model/pages/extend-reference-contributing.sh
  (production change). The plan file is touched only by validation. No new
  test file: the existing verifier run on macOS is the failing check.
phases:
