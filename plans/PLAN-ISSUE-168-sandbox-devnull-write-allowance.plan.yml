  ── SHARP EDGES ─────────────────────────────────────────────────────────────────
   1. NEVER CLAIM A LOCAL LINUX REPRO OR FIX-CONFIRMATION. `sandbox_linux*.go` do not
      compile here. Cross-compile + pure-derivation tests are the ceiling (see the
