  THE DARWIN FIX, EXACTLY
  ══════════════════════════════════════════════════════════════════════════════
  FILE: `pkg/packval/sandbox_nonlinux.go`, `darwinSandboxProfile`.

  (D1) The `fmt.Sprintf` format string becomes, with the new clause APPENDED AT THE
       VERY END (the rest byte-identical):

         "(version 1)(import \"bsd.sb\")(deny default)(allow process*)(allow file-read*%s)(deny network*)(deny file-write*)(allow file-write* (literal \"/dev/null\"))"

  (D2) ORDER IS MANDATED: after `(deny file-write*)`. Verified in the
       production-shaped profile (M1); last-match-wins is Seatbelt's documented
       evaluation order. M3 found the reverse order also worked in a probe — that is
       recorded so nobody re-derives it, NOT as permission to move the clause.

  (D3) `literal`, NOT `subpath`. `(subpath "/dev")` would grant write to every device
       node — a genuine widening. `/dev/null` is not a symlink on macOS, so unlike
       `packDir` it needs no `EvalSymlinks` treatment; M1/M4 confirm a bare literal
       matches.

  (D4) ★ THE DARWIN RED IS STRUCTURAL, NOT BEHAVIOURAL — SAY SO, DO NOT DRESS IT UP.
       M4 measured that darwin ALREADY permits `/dev/null` writes under the unfixed
       profile, as an emergent Seatbelt property that the profile text never states.
       So a behavioural darwin test asserting "the idiom succeeds" IS GREEN BEFORE THE
       FIX. It is a REGRESSION LOCK — it goes red if a future macOS tightens Seatbelt,
       or if someone removes the clause believing it was decorative — and it is the
       real local measurement this lane owes the darwin half. It is NOT a red→green.
       The darwin RED that genuinely flips is the PROFILE-LITERAL pin (CLM-006).
       A report describing the behavioural darwin test as the red phase is wrong and
       must be corrected in review.

