    tasks:
      - id: TASK-007
        type: verification
        title: "Full kill chain: backstop gate --all plus artifact validation of the plan and its issue"
        description: |
          THE FINAL, UNSCOPED SWEEP. Run all three and read the results:

              backstop gate --all
              backstop artifact validate --plan PLAN-ISSUE-168
              backstop artifact validate --issue ISSUE-168

          `gate --all` covers the code half (pack lock verification, artifact validation,
          pack engines, test verification, substantiveness, coverage, contracts, status
          drift, requirement traceability, waivers, baseline, ledger integrity);
          `artifact validate` covers the artifact half, since this lane's plan artifact
          is new and its source issue is in flight.

          ATTRIBUTION IS THE DELIVERABLE, NOT THE RAW COUNT. This repo carries inherited
          reds from other lanes. For every violation, decide and STATE whether it is this
          lane's:
            * grep the full violation set explicitly for each of the six paths this lane
              touched and report the hit count, zero or otherwise;
            * anything attributable to this lane is FIXED AT SOURCE — never waived, never
              made green by weakening a test;
