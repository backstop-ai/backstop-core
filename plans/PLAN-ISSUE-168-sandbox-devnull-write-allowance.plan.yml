        * PLAN-ISSUE-165 (`draft`, authored tonight) — files
          `pkg/packval/sandbox_wiring_guard_test.go` (new) and
          `pkg/packval/sandbox_linux_errors_test.go`. Its own sharp edge 11 fences
          THIS lane's files out explicitly; the two file sets are disjoint.
        * PLAN-ISSUE-163 (`draft`) — `cmd/backstop/**` only.
      ★ PLAN-ISSUE-165's TASK-001 DELIBERATELY LEAVES `pkg/packval`'s TEST BUILD
      NON-COMPILING for a window (its sharp edge 12). If a `pkg/packval` build error
      names `probeABI` or `sandbox_linux_errors_test.go`, IT IS THAT LANE — attribute
