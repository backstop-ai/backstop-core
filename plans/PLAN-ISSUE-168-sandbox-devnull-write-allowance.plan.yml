             write under the same profile is still refused. Classified honestly as a
             REGRESSION LOCK (M4/D4), not as a red→green.
    CLM-008  THE CEILING IS RECORDED AND THE CI HANDOFF IS DISCHARGED: the Linux half
             is unverifiable locally; confirmation is a read of the ubuntu-latest
