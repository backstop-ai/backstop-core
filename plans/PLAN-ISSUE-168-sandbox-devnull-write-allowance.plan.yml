          COORDINATE BEFORE RUNNING IT. `gate --all` in a shared tree with a mid-flight
          sibling implementer produces a reading that belongs to nobody (sharp edge 7).
          If the tree is not quiet, say so plainly and run it when it is — do not
          substitute a scoped run and describe it as the full chain.

          ENVIRONMENT CAVEATS GET RECORDED, NOT SMOOTHED. Two shapes that have produced
          misleading readings in this repo before: a `pack_engines` step exiting 2 with
          `required tool "..." not found on PATH` is an ENVIRONMENT artefact and NOT a
