          dimension silently contributes nothing; and a reading taken in a worktree
          lacking `.backstop/baseline.json` is STRICTER, not more permissive. If either
          applies, say so and do not report the run as authoritative.

          ★ AND STATE THE CEILING AGAIN HERE: a green `gate --all` on darwin does not
          confirm ISSUE-168's Linux fix. This machine never compiles `sandbox_linux*.go`
