             network defect are routed into BOTH artifacts that carry the premise,
             through their OWN channels — `issues/ISSUE-168-...` via `/issue`, and
             `directives/DIR-024-gate-engine-quality.directive.md` via the
             directive-owning backlog-pm lane (never hand-edited, and coordinated
