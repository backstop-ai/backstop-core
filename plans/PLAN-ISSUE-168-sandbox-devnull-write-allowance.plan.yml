  # ═══════════════════════════════════════════════════════════════════════════
  # Phase 2: GREEN — the two platform edits, then everything darwin CAN prove
  # ═══════════════════════════════════════════════════════════════════════════
  - id: phase-2
    name: "Phase 2: GREEN — grant /dev/null narrowly on Linux and on darwin, then verify to the real ceiling"
    tasks:
      - id: TASK-004
        type: implementation
        title: "Grant /dev/null in the Linux derivation: one rule, an exact mask, Required"
        description: |
          Edit `pkg/packval/sandbox_capability.go` ONLY. Locate
          `func DeriveSandboxRestrictions` BY NAME (sharp edge 8). Implement exactly (L1)
          and (L2) from this plan's header:

            * a package-level `const sandboxDevNullPath = "/dev/null"` — a const, not a
              var and not a slice; this file's neighbours are functions specifically to
              avoid mutable package state, and an immutable const is the right shape for
              a single path;
            * `func landlockDevNullRights() uint64` returning
              `AccessFSReadFile | AccessFSWriteFile | AccessFSTruncate | AccessFSIoctlDev`;
            * one appended `SandboxPathRule{Path: sandboxDevNullPath, AllowedAccess:
              narrowToABI(landlockDevNullRights(), capability.LandlockABI), Required: true}`
              after the readable and writable loops, with the `make(..., 0, N)` capacity
              hint grown by one.

          DOCUMENT THE FOUR RIGHTS INDIVIDUALLY on `landlockDevNullRights`, in your own
          words, carrying the facts a future reader cannot infer (L4): WRITE_FILE is the
          point; TRUNCATE is there because `>` opens O_TRUNC and TRUNCATE is a HANDLED
          right from ABI 3, so omitting it risks the redirect still being refused on
          exactly the kernels CI runs; IOCTL_DEV is there because `/dev/null` is a
          CHARACTER DEVICE and IOCTL_DEV is handled from ABI 5, so an un-granted
          `isatty`/TCGETS on a redirected fd would EACCES; READ_FILE is there because
          `</dev/null` is the same idiom family and reading the null device reads
          nothing. State that EXECUTE is deliberately absent because the mechanism leaves
          EXECUTE unhandled.

          DOCUMENT THE PLACEMENT DECISION on the appended rule (L3): it is emitted for
          EVERY capability because the rationale is universal — a sink that discards data
          cannot leak or persist anything — which is also exact parity with darwin, whose
          profile literal is unconditional and not derived from the capability struct at
          all. And state the rejected alternative and why: putting `/dev/null` in
          `WritablePaths` would hand it the generic writable mask (MAKE_REG, MAKE_DIR,
          REMOVE_FILE, READ_DIR, ...), inert only because the Linux host's inode-type
          narrowing strips it at install time, while the DERIVED DATA — the only artefact
          this mechanism can be reviewed through off-Linux — would claim rights nobody
          intends.

          AMEND THE `WritablePaths` FIELD DOCSTRING. It currently says the set is EMPTY
          for convert/validator work because darwin denies `file-write*` outright and
          parity is the spec. That is still true and must stay; add that the sole write
          the mechanism grants is the `/dev/null` sink, emitted by
          `DeriveSandboxRestrictions` for every capability and matched one-for-one by
          darwin's `(allow file-write* (literal "/dev/null"))`, so an empty
          `WritablePaths` still means "this POLICY grants no writable path". Without this
          the next reader deletes the rule to "restore parity".

          NOTE THE ORDERING CONTRAST briefly (L7): Landlock rules UNION and have no
          precedence — unlike Seatbelt, where the darwin clause's position after the deny
          is load-bearing. Say it once, here, so nobody mirrors the darwin ordering rule
          into the derivation or vice versa.

          DO NOT TOUCH `narrowRuleToInodeType`, `landlockDirectoryOnlyRights`,
          `linuxSystemReadPaths`, `ConvertValidatorCapability`'s `WritablePaths` value,
          the handled mask, or `sandbox_linux_helper.go` (sharp edges 4, 5; the helper
          file's header forbids growing its coverage exclusion).

          Run `backstop gate` after this task, as the implementer contract requires.
        files:
          - pkg/packval/sandbox_capability.go
        claims:
          - CLM-001
          - CLM-002
          - CLM-003
          - CLM-004
          - CLM-005
        depends_on:
          - TASK-001
          - TASK-003

      - id: TASK-005
        type: implementation
        title: "Add the scoped /dev/null write allow to the darwin sandbox-exec profile"
        description: |
          Edit `pkg/packval/sandbox_nonlinux.go` ONLY. Locate `func darwinSandboxProfile`
          BY NAME (sharp edge 8) and append ONE clause to the END of the `fmt.Sprintf`
          format string, leaving every other byte of that literal untouched (D1):

              ...(deny network*)(deny file-write*)(allow file-write* (literal \"/dev/null\"))

          AFTER the blanket deny, not before (D2), and `literal`, never `subpath` (D3).

          Extend the function's docstring — do not replace it. The existing text
          describes the trust model as HARD: `(deny default)`, `(deny file-write*)`,
          `(deny network*)`. Add, in your own words: the ONE scoped exception is
          `/dev/null`, a sink that discards everything written to it, so the write denial
          is unchanged for every path that can hold state; Seatbelt evaluates
          last-match-wins, which is why the clause follows the deny; and this exists for
          parity with the Linux Landlock rule in `sandbox_capability.go`, because
          `command -v foo >/dev/null 2>&1` is a universal shell idiom that a
          pack-supplied convert or validator script has every right to use (ISSUE-168).

          RECORD THE ONE NON-OBVIOUS FACT A FUTURE READER CANNOT RECOVER, AND RECORD IT
          IN THIS ORDER — THE MEASUREMENT FIRST, THE FRAMING SECOND:
            (i) THE MEASURED FACT: on darwin today this clause CHANGES NO OBSERVABLE
                BEHAVIOUR. `/dev/null` writes already succeeded under the unfixed
                profile — measured 2026-08-18 through real `sandbox-exec` — as an
                emergent Seatbelt property of device nodes generally (`/dev/zero`
                behaves the same), which the profile text never stated. Meanwhile
                Linux's Landlock enforced the same stated intent literally and broke
                the idiom. THAT ASYMMETRY IS THE WHOLE DEFECT.
            (ii) THEN THE FRAMING: what the clause buys is that darwin's stated intent
                now matches its actual behaviour and the two platforms' profiles say
                the same thing — a guarantee where there was an accident, which is what
                stops a future macOS tightening (or a reader deleting the clause as
                decorative) from silently re-opening ISSUE-168 on the platform where it
                currently happens to work.
          ★ DO NOT INVERT THAT ORDER, and do not let (ii) leak into the commit message
          as "this fixes darwin." It does not fix darwin's behaviour today; it fixes
          darwin's PROMISE. Overclaiming here is the exact false grounding this plan's
          D4/M4 section exists to prevent.

          DO NOT touch `readSubpaths`, `sandboxExecCommand`, `MaybeRunSandboxHelper`, the
          `!linux` build tag (narrowing it silently disarms the Linux sandbox — the file
          header and `TestNonLinuxSandboxHelperTagIsNotNarrowed` both say so), or either
          `platformSandboxedRun*` function.

          Run `backstop gate` after this task, as the implementer contract requires.
        files:
          - pkg/packval/sandbox_nonlinux.go
        claims:
          - CLM-006
          - CLM-007
        depends_on:
          - TASK-002

      - id: TASK-006
        type: verification
        title: "Verify to the real ceiling: real darwin sandbox behaviour, the pure derivation, the full package suite, and the Linux cross-target"
        description: |
          ★ READ THE TWO-CEILINGS SECTION IN THIS PLAN'S HEADER FIRST. The darwin half
          gets a REAL behavioural verdict here. The Linux half does not, and no wording
          in this report may suggest otherwise (sharp edge 1).

          (1) THE DARWIN HALF, FOR REAL (CLM-006, CLM-007) — this is the task's
              centrepiece, not a formality:
                go test ./pkg/packval/ -run "TestSandboxProfileGrantsDevNullWriteAndNothingElse|TestSandboxDarwin_DevNullIdiomRunsUnderTheRealProfile|TestSandboxProfileAllowsDyldLibraries|TestSandboxSecurityDenialsHold|TestSandboxConvertWithRealInterpreter" -race -count=1 -v
              Report PER-TEST results, not a package-level `ok`. These drive real
              `sandbox-exec` on this host: the idiom is genuinely executed under the
              production profile, and `TestSandboxSecurityDenialsHold` /
              `TestSandboxDeniesFileWrite` are the anti-widening counterweight — an
              ordinary write must STILL be refused. If either direction is wrong, the
              carve-out is wrong.

          (2) THE PURE DERIVATION (CLM-001..CLM-005):
                go test ./pkg/packval/ -run "TestSandboxCapability_|TestNarrowRuleToInodeType_|TestConvertValidatorCapability_" -race -count=1
              This is the whole locally-provable surface of the LINUX change. State
              plainly in the report that it proves the ARITHMETIC and not the kernel's
              verdict.

          (3) THE LINUX CROSS-TARGET (CLM-008) — the only Linux instrument available:
                GOOS=linux GOARCH=amd64 go build ./...
                GOOS=linux GOARCH=amd64 go test -c -o /dev/null ./pkg/packval/
              Both must be clean. The second COMPILES AND LINKS the package's test
              binary including every `//go:build linux` test file, which is what makes
              TASK-003's new test checkable at all — and it is the same instrument
              PLAN-ISSUE-165 mandates for this package tonight, so the two lanes'
              readings are directly comparable. Both were clean at authoring (M6), so a
              failure here is this lane's UNLESS it names `probeABI` or
              `sandbox_linux_errors_test.go` (sharp edge 7).
              DO NOT SUBSTITUTE `go vet` FOR THE SECOND COMMAND. Vet type-checks; it
              does not link, and a link failure is exactly the class this instrument
              exists to catch.
              AND DO NOT REACH FOR DOCKER TO GO FURTHER — the ceiling section records
              the evidence that a Docker-Desktop LinuxKit kernel reports Landlock ABI 0
              and is REFUSED by design; hitting that refusal is not a finding.

          (4) THE FULL PACKAGE SUITE, as the non-regression measurement:
                go test ./pkg/packval/ -race -count=1
              CONTROL READING (M5): `go test ./pkg/packval/ -count=1` was `ok ...
              69.948s` on this host at authoring, so this package was GREEN before this
              lane. Budget ~70s+ under `-race`; do not substitute a narrower `-run` and
              call it the suite (sharp edge 11).
              ★ ATTRIBUTION, NOT ABSORPTION. PLAN-ISSUE-165 is live in THIS package and
              its TASK-001 deliberately leaves the test build non-compiling for a window
              (sharp edge 7). A build error naming `probeABI` or
              `sandbox_linux_errors_test.go` is THAT lane — name it, do not fix it, do
              not absorb it. For any other red, establish whether it predates this lane
              by measuring a control at clean HEAD in a DETACHED WORKTREE (a carried
              reading is not evidence) and attribute it by name. Never waive.

          (5) DIFF-SCOPED GATE over every file this lane touched:
                backstop gate --file pkg/packval/sandbox_capability.go
                backstop gate --file pkg/packval/sandbox_nonlinux.go
                backstop gate --file pkg/packval/sandbox_devnull_test.go
                backstop gate --file pkg/packval/sandbox_capability_test.go
                backstop gate --file pkg/packval/sandbox_darwin_test.go
                backstop gate --file pkg/packval/sandbox_linux_exec_test.go
              Fix anything attributable to this lane AT SOURCE — never by weakening a
              test, never by a waiver. Expect substantiveness attention on the new test
              functions (sharp edge 9) and a possible coverage remark on
              `sandbox_capability.go`; the answer to the latter is a better test, never
              moving code into the excluded helper file (sharp edge 10).

          (6) STATE THE CEILING EXPLICITLY IN THE REPORT. It must contain, in substance:
              "the darwin half is verified behaviourally on this host; NOTHING above
              verifies the Landlock behaviour ISSUE-168 describes, which is confirmed
              only by the CI reading TASK-008 owns." A report listing green checks
              without that sentence is incomplete.
        files:
