      exist.
   6. THE DARWIN CLAUSE GOES AFTER `(deny file-write*)` (D2), and it is `literal`,
      never `subpath` (D3). A `subpath "/dev"` grants write to every device node.
   7. SHARED TREE, LIVE SIBLING LANES — enumerated at authoring, not sampled. Command:
      `for f in plans/*.plan.yml; do grep -l "pkg/packval/sandbox" ...; done` over all
