notes: |
  ISSUE-168 — neither sandbox profile grants write access to `/dev/null`, so the
  universal POSIX idiom `command -v foo >/dev/null 2>&1` (and every `2>/dev/null`
  noise-suppression) fails inside a sandboxed convert/validator script. On Linux it
  fails LOUDLY AND WRONGLY: bash/dash report `cannot create /dev/null: Permission
  denied` and exit 127, which reads as a broken converter rather than as a sandbox
  decision.

  THE GRANT IS SAFE AND THE ISSUE IS RIGHT ABOUT WHY. `/dev/null` is a write-only
  sink: nothing persists, nothing leaks, nothing is corruptible. Granting write on it
  and NOTHING else does not weaken either profile's actual security property. What
  this plan must not do is reach that outcome by widening the write surface even
  slightly further than that one inode.

