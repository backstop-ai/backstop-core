  THE LINUX FIX, EXACTLY — AND WHY IT IS SHAPED THIS WAY
  ══════════════════════════════════════════════════════════════════════════════
  FILE: `pkg/packval/sandbox_capability.go` (untagged, pure, compiles everywhere).

  (L1) A package-level CONST for the path and a named rights helper:

         const sandboxDevNullPath = "/dev/null"

         func landlockDevNullRights() uint64 {
             return AccessFSReadFile | AccessFSWriteFile | AccessFSTruncate | AccessFSIoctlDev
         }

       A `const` string, NOT a `var` and NOT a slice — the file's own convention
       (`linuxSystemReadPaths`, `seccompDeniedSyscalls` are functions specifically to
       avoid mutable package state a caller could widen). A const string cannot be
       mutated, so it is the right shape here.

  (L2) In `DeriveSandboxRestrictions`, AFTER the readable and writable loops, append
       exactly one rule:

         rules = append(rules, SandboxPathRule{
             Path:          sandboxDevNullPath,
             AllowedAccess: narrowToABI(landlockDevNullRights(), capability.LandlockABI),
             Required:      true,
         })

       and grow the `make(..., 0, N)` capacity hint by one.

  (L3) WHY IN `DeriveSandboxRestrictions` AND NOT IN `ConvertValidatorCapability`.
       Two candidate shapes were considered; this one is chosen deliberately.
         * REJECTED: `WritablePaths: []string{"/dev/null"}`. The generic writable loop
           grants `landlockReadRights()|landlockWriteRights()|AccessFSTruncate` — i.e.
           MAKE_REG, MAKE_DIR, MAKE_SYM, REMOVE_FILE, READ_DIR and the rest. Those are
           inert on a character device ONLY because `narrowRuleToInodeType` strips them
           at install time on the Linux host. The DERIVED DATA would still claim them,
           and the derived data is exactly what every darwin-side test in this package
           reads. A spec that says "you may create directories under /dev/null" is a
           lie in the one artefact this mechanism can be reviewed through.
         * CHOSEN: an explicit rule with an exact mask, emitted for EVERY capability.
           The rationale for the grant (a universally safe sink) is universal, so it is
           a FLOOR of the mechanism rather than a property of one capability — which is
           also the exact parity of the darwin side, where the profile literal is
           unconditional and not derived from the struct at all. It keeps
           `WritablePaths` meaning what its docstring says: paths the POLICY grants.
       The `WritablePaths` docstring must be amended to say this explicitly, so the
       next reader does not "restore parity" by deleting the rule.

  (L4) WHY THESE FOUR RIGHTS, EACH ONE ON PURPOSE.
       * WRITE_FILE — the point.
       * TRUNCATE — REQUIRED, not decoration. The shell's `>` opens with O_TRUNC, and
         Landlock gained a TRUNCATE right at ABI 3 which is HANDLED by this
         mechanism's mask. Granting WRITE_FILE alone risks the redirect still being
         refused on exactly the modern kernels CI runs (ubuntu-latest reports ABI 4+).
         Whether the kernel actually demands it for a character device is
         version-dependent; granting it costs nothing on a sink that discards data,
         and NOT granting it risks shipping a fix that does not fix anything.
       * IOCTL_DEV — `/dev/null` IS a character device, and IOCTL_DEV (ABI 5) is in
         the handled mask. Programs routinely `isatty()`/`TCGETS` a redirected fd; an
         un-granted ioctl on an ABI-5 kernel returns EACCES. Inert on /dev/null,
         cheap, and it removes a whole class of future ABI-5-only breakage.
       * READ_FILE — `</dev/null` (feeding a command empty stdin) is the same idiom
         family and is just as safe. Granting read on the null device grants access to
         nothing.
       EXECUTE is deliberately absent: the mechanism leaves EXECUTE UNHANDLED, and
       `TestSandboxCapability_SystemPathsKeepInterpreterReadable` asserts no rule
       grants it back. Do not add it.

  (L5) CHARACTER-DEVICE CORRECTNESS — THE PART THAT COULD SILENTLY TAKE THE WHOLE
       SANDBOX DOWN. `landlock_add_rule` rejects a `path_beneath` rule carrying a
       directory-only right against a non-directory, and ONE rejected rule aborts the
       ENTIRE restriction install — CI run 30383453888 is this repo's recorded
       instance (mask 0xc against the regular file `/etc/ld.so.cache`). The four
       rights in (L4) are all in Landlock's file-applicable class, and this repo's
       `landlockDirectoryOnlyRights()` contains none of them, so
       `narrowRuleToInodeType(mask, false)` returns the mask UNCHANGED and the kernel
       cannot EINVAL on it. THE EXISTING NARROWING LOGIC NEEDS NO CHANGE — a character
       device is simply "not a directory" to `applyLandlock`'s `Fstat` test
       (`stat.Mode&unix.S_IFMT == unix.S_IFDIR`), which is already correct for
       S_IFCHR. CLM-003's test pins that as an intentional property rather than an
       accident, because the accident is what aborts the install.

  (L6) `Required: true`, ON PURPOSE. A host with no `/dev/null` then REFUSES loudly
       ("open required sandbox path /dev/null: ...") instead of silently reproducing
       this exact defect. Loud over silent is this repo's standing posture, and
       `/dev/null` is present on every Linux system that can run a shell at all. The
       choice is pinned by a test so a later reader flips it deliberately, not idly.

  (L7) LANDLOCK HAS NO RULE PRECEDENCE — DO NOT MIRROR THE DARWIN ORDERING RULE HERE.
       Landlock denies via the handled mask and grants via rules; rules union, there
       is no "deny rule" and no last-match-wins. Position of the appended rule in the
       slice is irrelevant to the kernel. It is appended last only for readability.
       (Contrast the darwin side, where ordering IS mandated — see D2.)

