  THE PREMISE CORRECTION (M7) — DO NOT DROP THIS
  ══════════════════════════════════════════════════════════════════════════════
  ISSUE-168 states that the `/dev/null` denials visible in
  `TestLinuxSandbox_NetworkAllowedControlLegSucceeds`'s output are a real instance of
  this defect but are "NOT what makes this particular test fail" — that its actual
  failure is TCP and UDP both being blocked under a capability that PERMITS the
  network. Reading the probe makes that doubtful.

  `networkProbeBody` (`pkg/packval/sandbox_linux_exec_test.go`) emits:

      if (exec 3<>/dev/tcp/127.0.0.1/%d) 2>/dev/null; then echo TCP_OPEN; else echo TCP_BLOCKED; fi
      if (exec 4<>/dev/udp/127.0.0.1/%d) 2>/dev/null; then echo UDP_OPEN; else echo UDP_BLOCKED; fi

  The `2>/dev/null` is attached to the `if` CONDITION. A shell performs a command's
  redirections BEFORE running it, so if `/dev/null` cannot be opened for write the
  subshell never attempts the socket at all, exits non-zero, and the `else` branch
  prints ..._BLOCKED. MEASURED LOCALLY, PLATFORM-INDEPENDENTLY (real bash, an open
  loopback port, one leg redirecting to `/dev/null` and one to an unopenable path):

      A_OPEN            <- redirect target writable: the socket really opened
      B_BLOCKED         <- SAME port, redirect target unopenable
      PROBE_COMPLETED
      stderr: line 5: /no-such-dir/x: No such file or directory

  That is byte-for-byte the shape of the CI output ISSUE-168 quotes: the denial
  message on the original stderr, immediately followed by the _BLOCKED marker. So the
  most likely truth is that BOTH failing tests are ISSUE-168, and the control leg's
  TCP_BLOCKED/UDP_BLOCKED are an ARTEFACT of the `/dev/null` denial rather than
  evidence of a network-permission defect.

  ★ THIS IS A HYPOTHESIS WITH LOCAL MECHANISM EVIDENCE, NOT A FACT ABOUT THE CI RUN.
  A genuine network defect could ALSO be present and simply masked. So:
    * this lane does NOT claim to fix the control-leg test;
    * TASK-008 reads the CI run and DECIDES: control leg green -> ISSUE-168 fixed
      both, no residual to file, and say so; control leg still red with the
      `/dev/null` stderr lines GONE -> a genuine, now-unmasked network defect, which
      is filed as its own issue with the newly-clean evidence;
    * TASK-008 routes a correction of this premise into BOTH artifacts that currently
      carry it, because the issue is not the only place it lives:
        - `issues/ISSUE-168-...` — its own text asserts the distinction "matters for
          whoever fixes the network-blocking failure separately", and it may not exist.
        - `directives/DIR-024-gate-engine-quality.directive.md` — VERIFIED AT
          AUTHORING, it states verbatim: "the `/dev/null` denials are NOT what makes
          `TestLinuxSandbox_NetworkAllowedControlLegSucceeds` fail ... Its
          network-blocking failure is a separate, still-unfiled defect; only the
          `/dev/null` denials belong to ISSUE-168."
      ★ DIR-024 IS THE ONE THAT MATTERS MOST. It is the committed BACKLOG layer a
      future session reads FIRST — before any individual issue — so leaving it stale
      defeats the entire purpose of correcting the issue: someone would still be sent
      after a defect that may not exist, just via a different door. Correcting only
      ISSUE-168 is a half-discharge, and TASK-008 is failed by it.

