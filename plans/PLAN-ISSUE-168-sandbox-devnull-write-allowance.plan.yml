  Every design decision below rests on one of these readings, not on recollection.

  (M1) SBPL HONOURS A SCOPED WRITE ALLOW ALONGSIDE A BLANKET DENY. Real
       `sandbox-exec` probe, production-shaped profile (bsd.sb imported, deny
       default, scoped file-read*, deny network*, deny file-write*) plus
       `(allow file-write* (literal "/private/tmp/.../allowed.txt"))` appended AFTER
       the deny:
         touch <the literal>        -> exit 0, file created
         touch <a sibling path>     -> "Operation not permitted", exit 1, not created
       So the override is real AND it is narrow. The syntax
       `(allow file-write* (literal "<path>"))` parses and works.
  (M2) A MALFORMED CLAUSE IS LOUD, NOT SILENT. `sandbox-exec` on a profile with a
       bogus operation name exits 65 with `unbound variable: ... at <input string>,
       line 1, column 33`. A typo in the new clause therefore fails every sandboxed
       run visibly; it cannot silently widen or silently no-op.
  (M3) ORDERING: the same allow placed BEFORE the deny also worked in a probe. The
       plan still mandates AFTER, because that is the arrangement measured in the
       PRODUCTION-shaped profile (M1) and because last-match-wins is the documented
       Seatbelt evaluation order. Do not read M3 as licence to move it.
  (M4) DARWIN ALREADY PERMITS /dev/null WRITES UNDER THE CURRENT, UNFIXED PROFILE.
       Running the exact current profile literal (no carve-out) through real
       `sandbox-exec`: `command -v jq >/dev/null 2>&1; echo IDIOM_OK` -> exit 0,
       IDIOM_OK printed; and under that same profile `echo x > <a temp file>` ->
       "Operation not permitted", file not created. This CONFIRMS the issue's
       empirical finding and has a sharp consequence for how the darwin tests are
       classified — see "THE DARWIN RED IS STRUCTURAL, NOT BEHAVIOURAL" below.
       ── AND THE PROPERTY IS GENERAL, NOT /dev/null-SPECIFIC: writes to `/dev/zero`
