      - id: TASK-008
        type: documentation
        title: "Hand the Linux half to CI: name the run, adjudicate the network control leg, correct the issue's premise, close nothing early"
        description: |
          THIS TASK IS THE POINT OF THE PLAN'S CAREFULNESS FOR THE LINUX HALF. Everything
          before it proves the edit is safe and that darwin works; only this proves the
          Linux fix WORKED — and it cannot be discharged from this machine.

          EVERY ARTIFACT TOUCH HERE IS ROUTED THROUGH `/issue` (the issue-author agent).
          This lane never hand-edits an artifact file — which is why the ISSUE-168 file
          appears in this task's `files:`: it is the file a ROUTED author writes, not one
          this task opens in an editor.

          (1) RECORD THE ASYMMETRIC CEILING IN THE ARTIFACT, NOT IN A CHAT MESSAGE
          (CLM-008). Hand the routed author the exact statement: the DARWIN half was
          verified behaviourally on a real macOS host (the idiom executed under the
          production `sandbox-exec` profile, with an ordinary write still refused under
          the same profile); the LINUX half is unverifiable locally because
          `pkg/packval/sandbox_linux.go` and `sandbox_linux_helper.go` are
          `//go:build linux` and never compile here, so local evidence for it is limited
          to the pure derivation's arithmetic plus a `GOOS=linux` cross-compile and a
          full test-binary link (`go test -c -o /dev/null ./pkg/packval/`) — which
          establishes that the linux-tagged code COMPILES AND LINKS, never that the
          kernel accepts the rule.

          (2) NAME THE CI RUN TO WATCH AND WHAT COUNTS AS CONFIRMATION.
          Workflow `.github/workflows/ci.yml`, job `gate` (display name "Backstop Gate"),
          `runs-on: ubuntu-latest`. Blocking step `./bin/backstop gate --base "$BASE"`;
          the step before it writes `gate-report.json`, uploaded as the `gate-report`
          artifact with `if: always()` — download it, as ISSUE-163's investigation did.
          Confirmation is a CONJUNCTION and each half must be READ, never inferred:
            (a) `pkg/packval` is actually IN SCOPE for that run. CI gates DIFF-SCOPED,
                and every file this lane changes lives in `pkg/packval/`, so the package's
                tests are EXPECTED to run — expected, not established. Read the path list
                at `.scope.files` in `gate-report.json` (`GateResult.Scope` is
                `json:"scope"`, `GateScope.Files` is `json:"files"` —
                `pkg/gate/result.go`, `pkg/gate/scope.go`). If `pkg/packval` is not in
                it, the run proves nothing about this fix and you must say so rather than
                reading its green as success.
            (b) THE `/dev/null` SIGNATURE IS GONE. Search the report and the job log for
                the literal `cannot create /dev/null`, `/dev/null: Permission denied`,
                and `exit status 127` in the packval channel. The primary reproducing
                test is `TestLinuxSandbox_RealInterpreterRunsUnderTheFilter`
                (`pkg/packval/sandbox_linux_exec_test.go`), driving
                `pkg/packval/testdata/sandbox/convert-jq.sh` line 14. This lane's own new
                test `TestLinuxSandbox_DevNullWriteIsPermittedAndOtherWritesAreNot` is
                the direct assertion — read its verdict specifically, and read
                `TestLinuxSandbox_WriteInsidePackDirIsDenied` alongside it, because a
                green on the first with a red on the second would mean the carve-out
                widened rather than fixed.
          ★ THE VIOLATION COUNT IS NOT A CONFIRMATION CRITERION. CI's blocking gate is
          diff-scoped, so counts across differently-scoped runs are not comparable and
          "the number went down" is trivially true of a run where nothing was fixed.
          Report the remaining blocking set as CONTEXT, clearly labelled as context.
          The change has to reach a branch CI runs on before any of this exists. WHETHER
          AND WHEN TO PUSH IS THE FOUNDER'S CALL — deliver the watch instruction and the
          criteria, and if no CI run has happened yet, say exactly that rather than
          implying one did.

          (3) ★ ADJUDICATE THE NETWORK CONTROL LEG, AND CORRECT THE ISSUE'S PREMISE
          (CLM-008). ISSUE-168 asserts that the `/dev/null` denials in
          `TestLinuxSandbox_NetworkAllowedControlLegSucceeds` are NOT what makes that
          test fail. This plan's header records a local, platform-independent measurement
          (M7) that makes that doubtful: `networkProbeBody` attaches `2>/dev/null` to the
          `if` CONDITION, and a real-bash probe on an OPEN loopback port showed that an
          unopenable redirect target makes the shell take the ELSE branch — printing
          _BLOCKED — without ever attempting the socket, reproducing the CI output's
          exact shape. Read the CI run and decide, ON EVIDENCE:
            * control leg GREEN -> ISSUE-168 accounted for BOTH failing tests. Say so,
              and file NOTHING for the network.
            * control leg still RED, with the `/dev/null` stderr lines GONE -> a genuine,
              previously MASKED network-permission defect. File it as its own issue,
              with the now-clean evidence attached and the masking history stated.
            * `/dev/null` lines still present -> this fix did not reach that path; do not
              claim it did, and investigate before filing anything.
          ★ ROUTE THE CORRECTION INTO BOTH ARTIFACTS THAT CARRY THE PREMISE, IN EVERY
          BRANCH ABOVE — stating what was MEASURED and what was INFERRED, and marking
          M7 as a hypothesis confirmed-or-refuted by the run you actually read:
            (i) `issues/ISSUE-168-...`, through `/issue`. Its text says the distinction
                "matters for whoever fixes the network-blocking failure separately".
            (ii) `directives/DIR-024-gate-engine-quality.directive.md` — VERIFIED
                STALE AT AUTHORING; it states verbatim that "the `/dev/null` denials
                are NOT what makes `TestLinuxSandbox_NetworkAllowedControlLegSucceeds`
                fail ... Its network-blocking failure is a separate, still-unfiled
                defect". DIR-024 IS THE COMMITTED BACKLOG LAYER A FUTURE SESSION READS
                FIRST, before any individual issue, so correcting only (i) leaves the
                misdirection fully operative through the door people actually use.
                Correcting only ISSUE-168 does NOT discharge this task.
          ⚠ DIR-024 IS A DIRECTIVE AND IT IS CURRENTLY MODIFIED IN THE WORKING TREE BY
          THE backlog-pm LANE (confirmed by `git status` at authoring: ` M
          directives/DIR-024-gate-engine-quality.directive.md`). So:
            * NEVER hand-edit it — artifact authoring is routed, always;
            * route it through the backlog/directive-owning agent (backlog-pm), handing
              over the exact stale passage and the exact replacement finding;
            * COORDINATE FIRST rather than writing over an uncommitted edit. If that
              lane is mid-flight, say so plainly and hand off the correction with the
              evidence attached instead of forcing it in — a silent overwrite of
              another agent's uncommitted work is a defect in this repo, not a
              shortcut. If the correction cannot be landed in this task's window, the
              task reports it as OWED, by name, rather than as done.

          (4) DO NOT CLOSE ISSUE-168 ON LOCAL EVIDENCE. `closed` has real teeth in this
          repo. Request closure through `/issue` ONLY once (2)(a) and (2)(b) have both
          been READ from a real run, handing the routed author that reading as the
          evidence. Until then the honest status is "fix landed, darwin half verified
          locally, Linux half awaiting CI confirmation."

          (5) FILE ANYTHING ELSE SURFACED, and if nothing needed filing, SAY SO
          EXPLICITLY — silence is not a discharge. Then report the terminal state
          plainly: what landed, what was measured (and on which platform), what was NOT
          measurable and why, what was filed, and what is still owed.
        files:
          - issues/ISSUE-168-sandbox-devnull-write-denied-breaks-idiomatic-scripts.issue.md
          - directives/DIR-024-gate-engine-quality.directive.md
        claims:
