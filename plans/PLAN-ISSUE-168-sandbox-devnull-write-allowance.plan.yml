phases:
  # ═══════════════════════════════════════════════════════════════════════════
  # Phase 1: RED — three independent pin sets, disjoint files, fully parallel
  # ═══════════════════════════════════════════════════════════════════════════
  - id: phase-1
    name: "Phase 1: RED — pin the narrow grant (derivation), the darwin profile, and the Linux behaviour"
    tasks:
      - id: TASK-001
        type: test
        title: "Pin the /dev/null grant in the PURE derivation, and amend the two shipped tests the grant reds (RED)"
        description: |
          The derivation is untagged and pure, so this is the one part of the LINUX fix
          that is genuinely falsifiable on this machine. Everything here must run and be
          read on darwin.

          ── (A) NEW FILE `pkg/packval/sandbox_devnull_test.go`, `package packval`, NO
          BUILD TAG. Reuse the existing helpers in `sandbox_capability_test.go`
          (`convertCapabilityForTest`, `findPathRule`) rather than re-deriving them —
          same package, same file set.

          TestSandboxCapability_DevNullCarriesANarrowWriteGrant (CLM-001, CLM-002).
            Derive at ABI 7 from the convert/validator capability. Assert:
              * `findPathRule(spec, "/dev/null")` FINDS a rule — and assert exactly ONE
                rule has that path (walk the slice and count); a duplicate would mean
                someone also added it to a path list (sharp edge 4).
              * its `AllowedAccess` EQUALS
                `AccessFSReadFile|AccessFSWriteFile|AccessFSTruncate|AccessFSIoctlDev` —
                an EQUALITY assertion, not a bitwise-contains one. Containment would
                pass a mask that also carried MAKE_DIR, which is the exact over-grant
                this lane refuses (L3). Print both masks in hex on failure.
              * `Required` is true (CLM-005), with the failure message explaining that a
                non-required rule silently reproduces ISSUE-168 on a host without
                `/dev/null`.
              * NO OTHER derived rule carries any bit of `landlockWriteRights()` or
                `AccessFSTruncate` — the anti-widening half (CLM-002). Name the
                offending rule and right in the message.
            PRE-FIX STATE: fails at the first assertion; there is no such rule today.

          TestSandboxCapability_DevNullGrantIsCharDeviceSafe (CLM-003).
            THE ONE THAT PREVENTS A WHOLE-INSTALL ABORT. `/dev/null` is S_IFCHR, so
            `applyLandlock` computes `isDir == false` for it and passes the rule's mask
            through `narrowRuleToInodeType`. Assert:
              * `narrowRuleToInodeType(rule.AllowedAccess, false)` EQUALS
                `rule.AllowedAccess` — the mask survives non-directory narrowing intact;
              * `rule.AllowedAccess & landlockDirectoryOnlyRights() == 0` — stated as the
                REASON the line above holds, so a future reader sees the mechanism and
                not a coincidence.
            Comment the stakes in the test: `landlock_add_rule` rejects a directory-only
            right against a non-directory with EINVAL, and ONE rejected rule aborts the
            ENTIRE restriction install — this repo's recorded instance is CI run
            30383453888, mask 0xc against `/etc/ld.so.cache`. That is why the grant is
            checked against the classification rather than eyeballed.

          TestSandboxCapability_DevNullGrantNarrowsWithTheRunningABI (CLM-004).
            Derive at ABI 1, 3 and 7 and assert on the `/dev/null` rule at each:
              * ABI 1: WRITE_FILE and READ_FILE PRESENT; TRUNCATE (ABI 3) and IOCTL_DEV
                (ABI 5) ABSENT.
              * ABI 3: TRUNCATE present, IOCTL_DEV absent.
              * ABI 7: both present.
            Say why in a comment: `landlock_create_ruleset` returns EINVAL for a right
            the kernel does not recognise, so an un-narrowed grant does not degrade — it
            fails the whole ruleset creation on Ubuntu 22.04 (kernel 5.15 = ABI 1).

          TestSandboxCapability_DevNullGrantIsIndependentOfTheCapabilityFields (CLM-001).
            The grant is a FLOOR of the mechanism, not a property of one capability
            (L3). Derive from at least: the default convert/validator capability; the
            same with `Network = true`; and a hand-built capability with empty
            `ReadablePaths`, empty `WritablePaths` and an empty `PackDir`. The
            `/dev/null` rule must be present with the identical mask in every one.
            PRE-FIX STATE: fails on all three.

          ── (B) AMEND, IN `pkg/packval/sandbox_capability_test.go`, EXACTLY TWO TEST
          BODIES. Names stay byte-identical (sharp edge 3) — both are named by the
          `completed` PLAN-ISSUE-020 and an absent mandated test blocks as a broken
          promise.

          TestSandboxCapability_HandlesWriteRightsAndGrantsNone (CLM-002).
            Its "no rule may grant a write right" loop must now EXEMPT the `/dev/null`
            rule — and exempt it BY PATH, precisely, never by loosening the assertion.
            Keep the handled-mask half exactly as it is. Extend the docstring (do not
            replace it) with: the write family is still HANDLED and still granted
            NOWHERE except the null device, which is a sink that cannot leak or persist
            anything; ISSUE-168 is the reason; and the narrow shape of that one
            exemption is asserted by
            `TestSandboxCapability_DevNullCarriesANarrowWriteGrant`. Point at it by name
            so the exemption is never widened here where nothing checks its shape.
            PRE-FIX STATE: with the exemption in place this test PASSES before and after
            the fix — it is an anti-widening guard, not a red. Say so in the report
            rather than implying a red.

          TestSandboxCapability_SystemPathsKeepInterpreterReadable (CLM-002).
            Its loop treats every non-`/tmp/packdir` rule as a system READ path and
            requires READ_DIR. Skip the `/dev/null` rule explicitly (`continue` on the
            path), with a comment: it is a character device, READ_DIR is directory-only
            and is deliberately absent, and the rule's real shape is asserted in
            `sandbox_devnull_test.go`. Leave the `systemRules == 0` anti-vacuous guard
            and the EXECUTE assertions untouched — the new rule grants no EXECUTE, so
            those still hold and still mean what they say.

          RUN THE FILE AND RECORD THE ACTUAL FAILURE OUTPUT before TASK-004 — "it should
          fail" is not evidence:
            go test ./pkg/packval/ -run "TestSandboxCapability_" -count=1
        files:
          - pkg/packval/sandbox_devnull_test.go
          - pkg/packval/sandbox_capability_test.go
        claims:
          - CLM-001
          - CLM-002
          - CLM-003
          - CLM-004
          - CLM-005
        depends_on: []
        test_names:
          - TestSandboxCapability_DevNullCarriesANarrowWriteGrant
          - TestSandboxCapability_DevNullGrantIsCharDeviceSafe
          - TestSandboxCapability_DevNullGrantNarrowsWithTheRunningABI
          - TestSandboxCapability_DevNullGrantIsIndependentOfTheCapabilityFields

      - id: TASK-002
        type: test
        title: "Pin the darwin profile literal (the real RED) and measure the idiom through real sandbox-exec on this host"
        description: |
          Both tests go in `pkg/packval/sandbox_darwin_test.go` (`//go:build darwin`,
          already exists). That file's build tag IS the platform guard — new tests there
          need no `runtime.GOOS` check. LEAVE `TestSandboxProfileAllowsDyldLibraries`
          BYTE-IDENTICAL, including its now-redundant `runtime.GOOS` guard: its
          docstring records that CLM-016 requires it unmodified.

          TestSandboxProfileGrantsDevNullWriteAndNothingElse (CLM-006).
            ★ THIS IS THE ACTUAL DARWIN RED — the one assertion that is false before the
            fix and true after. Build the profile via `darwinSandboxProfile` on a
            symlink-resolved temp packDir (`mustEvalSymlinks`, untagged helper in
            `sandbox_realconvert_test.go`) and assert:
              * it CONTAINS `(allow file-write* (literal "/dev/null"))`;
              * it STILL CONTAINS `(deny file-write*)` — the carve-out is an addition,
                never a replacement;
              * ORDERING: `strings.Index` of the allow clause is GREATER than
                `strings.Index` of `(deny file-write*)`. Comment why (D2/M1/M3): Seatbelt
                evaluates last-match-wins, this is the arrangement measured working in a
                production-shaped profile, and the reverse order — although it also
                worked in an authoring probe — is not what this profile ships;
              * NO BLANKET `(allow file-write*)` appears — mirror the existing blanket
                `(allow file-read*)` guard in this file. Note in a comment that the new
                clause does not contain that substring (the closing paren differs), so
                the guard is not self-defeating;
              * `(subpath "/dev")` does NOT appear anywhere — the carve-out is one inode,
                not a device tree (D3).
            PRE-FIX STATE: fails on the first assertion.

          TestSandboxDarwin_DevNullIdiomRunsUnderTheRealProfile (CLM-007, CLM-002).
            THE REAL LOCAL MEASUREMENT THE DARWIN HALF OWES — production path, real
            `sandbox-exec`, no stub. Write a script into a symlink-resolved temp packDir
            shaped exactly like the fixture's line 14 idiom, e.g.

                #!/bin/sh
                if command -v jq >/dev/null 2>&1; then echo IDIOM_OK; else echo IDIOM_OK_NO_JQ; fi
                echo probe > /dev/null 2>&1
                echo DEVNULL_PROBE_COMPLETED

            and drive it with `SandboxedRunStdout("/bin/sh", []string{script}, packDir,
            nil)`. Assert a nil error AND the presence of `DEVNULL_PROBE_COMPLETED` in
            the captured stdout — the completion marker is what distinguishes "the write
            was permitted" from "the sandbox never started", which is this package's
            standing rule (see the `sandbox_linux_exec_test.go` header on
            `ubuntu-runner-probe.txt`). Do NOT assert on jq's presence; the idiom, not
            jq, is under test.
            THEN THE ANTI-WIDENING LEG, IN THE SAME TEST (CLM-002): under the SAME
            profile, `SandboxedRun("/usr/bin/touch", []string{<a path inside packDir>},
            packDir)` must still FAIL and must not create the file. Without this leg the
            test cannot tell a narrow carve-out from a profile that stopped denying
            writes at all.
            ★ CLASSIFY IT HONESTLY IN THE DOCSTRING (D4, M4): darwin ALREADY permits
            `/dev/null` writes under the unfixed profile — measured 2026-08-18 by running
            the current profile literal through real `sandbox-exec` — as an emergent
            Seatbelt property the profile text never stated. So this test PASSES BEFORE
            THE FIX and is a REGRESSION LOCK: it goes red if a future macOS enforces the
            blanket deny, or if someone deletes the clause believing it decorative. It is
            NOT the red phase; `TestSandboxProfileGrantsDevNullWriteAndNothingElse` is.

          RUN BOTH AND RECORD THE OUTPUT before TASK-005:
            go test ./pkg/packval/ -run "TestSandboxProfileGrantsDevNullWriteAndNothingElse|TestSandboxDarwin_DevNullIdiomRunsUnderTheRealProfile" -count=1 -v
        files:
          - pkg/packval/sandbox_darwin_test.go
        claims:
          - CLM-002
          - CLM-006
          - CLM-007
        depends_on: []
        test_names:
          - TestSandboxProfileGrantsDevNullWriteAndNothingElse
          - TestSandboxDarwin_DevNullIdiomRunsUnderTheRealProfile

      - id: TASK-003
        type: test
        title: "Add the Linux behavioural leg to the trampoline suite — CI-only, type-checked here (RED, unrunnable locally)"
        description: |
          Add ONE test to `pkg/packval/sandbox_linux_exec_test.go` (`//go:build linux`).
          IT CANNOT RUN ON THIS MACHINE AND MUST NOT BE CLAIMED TO (sharp edge 1), and
          a Docker container does not lift that ceiling either — the repo already
          records why (see the ceiling section's LinuxKit paragraph). What IS
          establishable locally is that it COMPILES AND LINKS, via the cross-target
          instrument this plan mandates and PLAN-ISSUE-165 mandates for the same
          package on the same night:

              GOOS=linux GOARCH=amd64 go test -c -o /dev/null ./pkg/packval/

          Run that and read it. It is the whole local discharge of this task. It was
          clean before this lane (M6), so a failure here is either this task's or —
          if it names `probeABI` or `sandbox_linux_errors_test.go` — PLAN-ISSUE-165's
          deliberate red window (sharp edge 7). Attribute; do not absorb.

          NOTE ON THIS PLAN'S `test_command`: it includes this test's name in its
          `-run` alternation. On darwin that member matches nothing (the file is
          linux-tagged) and is harmless; on a Linux runner it is the ONLY member that
          exercises the Landlock half at all, which is why it must stay in.

          READ THAT FILE'S HEADER FIRST. Two of its standing rules bind this test:
          NO `t.Skip` in this file ever — an unavailable Landlock is a loud FAILURE via
          `requireLandlock(t)`, not a skip; and every denial assertion needs a POSITIVE
          CONTROL and a completion marker, because a bare non-zero exit cannot
          distinguish "denied correctly" from "never started".

          TestLinuxSandbox_DevNullWriteIsPermittedAndOtherWritesAreNot (CLM-001, CLM-002).
            Use the file's existing helpers exactly as its neighbours do:
            `requireLandlock(t)`, `sandboxPackDir(t)`, `requireExecutable(t, "bash")` (or
            `"sh"`), `writeProbeScript(t, packDir, "devnull-probe.sh", body)`, and the
            production entry point `SandboxedRun`.
            The probe carries BOTH legs and a marker, in this order:
              1. POSITIVE: `echo probe >/dev/null 2>&1` — and, to exercise the exact
                 reported idiom, `command -v definitely-not-a-real-binary >/dev/null 2>&1`
                 (its non-zero result is irrelevant; the REDIRECT is what is under test,
                 so do not let the probe's exit status depend on it). Print
                 `DEVNULL_WRITE_OK` when the redirect itself did not fail.
              2. NEGATIVE CONTROL, in a subshell so a failed redirection cannot abort the
                 probe (the same reason `networkProbeBody` parenthesises its legs):
                 attempt to create a file inside packDir; print `PACKDIR_WRITE_BLOCKED`
                 on failure and `PACKDIR_WRITE_LEAKED` on success.
              3. `DEVNULL_PROBE_COMPLETED`.
            Assert, on the combined output: the completion marker is present (else fail
            with "the probe never ran; nothing below is readable as a permission");
            `DEVNULL_WRITE_OK` is present; `PACKDIR_WRITE_BLOCKED` is present and
            `PACKDIR_WRITE_LEAKED` is absent; and `os.Stat` confirms the packDir target
            was not created.
            ★ WRITE THE FAILURE MESSAGES FOR A CI READER WHO CANNOT ATTACH A DEBUGGER.
            Name ISSUE-168, quote the expected marker, and dump the whole report.
            PRE-FIX STATE ON LINUX: `DEVNULL_WRITE_OK` absent (the redirect is refused).
            THIS IS AN ASSERTION ABOUT CI, NOT AN OBSERVATION — say so in the docstring.

          ALSO ADD A SHORT NOTE IN THE PROBE'S COMMENT pointing at
          `networkProbeBody`'s `2>/dev/null` legs and this plan's premise correction
