      - id: TASK-041
        type: test
        title: "RED: ungated findings survive diff-scoped filtering and reach the gate's output end to end"
        description: |
          Two files.

          pkg/gate/ungated_scope_test.go:
            TestUngatedArtifactFindings_SurviveDiffScopedFiltering (CLM-064)
