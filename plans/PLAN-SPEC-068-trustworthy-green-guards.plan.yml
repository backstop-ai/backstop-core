      - id: TASK-005
        type: implementation
        title: "GREEN: pkg/artifact/layout.go — Kind, LayoutFor, Kinds, ClassifyFilename, Root, ResolveRoot, the two typed errors, Dir"
        description: |
          Create pkg/artifact/layout.go with the full SPEC-068 contract surface.
          ONE file, as the spec's implementation steps 1 and 2 specify.

          THE IMPORT SET IS LOAD-BEARING. pkg/artifact imports only stdlib and
          gopkg.in/yaml.v3 today, and that is exactly why every consumer —
          pkg/gate, pkg/validate, pkg/scaffold, pkg/config, cmd/backstop — can
          import it with no cycle. layout.go must add nothing beyond
          path/filepath, os and strings. In particular it must NOT import
          pkg/config: ResolveRoot takes the declared STRING, not a *Config, and
          that is the decision that keeps the package importable everywhere.

          The layout table (Directory, Extension) per kind, matching what the
          codebase already recognizes in the three places this replaces:
            spec→specs/.spec.md, plan→plans/.plan.yml, adr→adrs/.adr.md,
            bundle→bundles/.bundle.md, issue→issues/.issue.md,
            directive→directives/.directive.md,
            capability→capabilities/.capability.yml
          Directory is the bare NAME, never a path — joining it to a root is
          Dir's job, which is what keeps the root in exactly one place.

          ClassifyFilename subsumes cmd/backstop's artifactPatterns map
          (artifact_discover.go:18-26) INCLUDING its adr special case (ADR-
          prefix AND .adr.md suffix). Preserve it exactly; trap E depends on
          the capability suffix test staying `.capability.yml`.

          ResolveRoot: filepath.Abs the projectRoot FIRST, then Clean, so
          Root.Path is absolute and cleaned for every caller (trap C). Empty
          declared → {Path: absProjectRoot, Declared: "", Configured: false},
          nil error. Non-empty declared → reject absolute and reject escaping
          (compare the cleaned join against the cleaned project root with
          filepath.Rel, not with string prefixes — a "..\" segment and a
          sibling directory sharing a name prefix are different failures and a
          prefix test conflates them) with *RootInvalidError; otherwise
          {Path: joined, Declared: declared, Configured: true}.

          THE TWO ERROR TYPES SPLIT ON *WHY*, NOT ON WHERE THE CHECK LIVES, and
          the split is the spec's, verbatim on the RootInvalidError contract
          note: "Covers absolute, escaping, and not-a-directory declarations
          (CLM-035/036/037)." So, after os.Stat on the joined path:

            - ABSENT from disk        → *RootMissingError{Declared, Path}
                                        (CLM-033)
            - EXISTS BUT IS NOT A DIR → *RootInvalidError{Declared,
                                        Reason: "not a directory"} (CLM-035)

          RootMissingError has NO Reason field, so putting not-a-directory
          there makes the actual reason unnameable by any caller. This is not
          an internal tidiness point: PLAN-SPEC-070's doctor branches on these
          two types with errors.As — *RootMissingError → FAIL naming the
          declared value, *RootInvalidError → FAIL naming the reason — so a
          not-a-directory artifact_root routed to RootMissingError would be
          reported to an operator as "missing" with no reason available. Every
          *RootInvalidError this function returns carries a populated,
          human-readable Reason (absolute / escaping / not a directory); a
          bare-Reason RootInvalidError is a defect even though it compiles.

          ALSO ADD, in this file, the SHARED NON-CORPUS DIRECTORY NAME LIST
          (trap B / Sharp Edge 12): one exported deterministic accessor
          returning the five common names — .git, vendor, node_modules,
          testdata, prototype. It has ONE home because both CLI discovery
          (TASK-027) and the ungated scan (TASK-040) need it and their two
          rules differ only in how each treats .backstop. Two hand-typed copies
          can drift, and a drift makes the set of files the gate picks up and
          the set it reports leaving out disagree — the precise property the
          shared ClassifyFilename predicate exists to guarantee. Do NOT put a
          .backstop entry in the shared list; each caller adds its own rule.

          SPEC/PLAN SURFACE MISMATCH, DELIBERATELY FLAGGED RATHER THAN DODGED.
          This accessor is an ELEVENTH exported symbol in pkg/artifact/layout.go
          and SPEC-068's contract block for that file declares only ten (Kind,
          LayoutFor, KindLayout, Kinds, ClassifyFilename, Root, ResolveRoot,
          RootMissingError, RootInvalidError, Dir). The contracts gate checks
          declared-present and declared-absent, not undeclared-extra, so this
          will not turn a dimension red — which is exactly why it has to be
          written down instead of noticed later.

          IT MUST BE EXPORTED; unexporting it is not an available way out. The
          two callers live in DIFFERENT PACKAGES — cmd/backstop (TASK-027) and
          pkg/gate (TASK-040) — so an unexported name cannot reach both, and
          the only alternatives are the two hand-typed copies trap B forbids.
          Sharp Edge 12 demands one list; one list across two packages is an
          exported symbol.

          THEREFORE: a COMPANION SPEC EDIT IS REQUIRED — add this accessor to
          SPEC-068's contract block for pkg/artifact/layout.go, through the
          artifact agents, never by hand. TASK-044 reports it to the founder
          alongside Review Question 13 and Sharp Edge 7. It matters beyond
          bookkeeping because SPEC-069 and SPEC-070 read SPEC-068's contract
          block as the list of what pkg/artifact offers them, and a symbol
          absent from that list reads as a symbol they may not depend on.
        files:
          - pkg/artifact/layout.go
        claims:
