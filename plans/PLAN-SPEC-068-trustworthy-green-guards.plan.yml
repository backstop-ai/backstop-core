              same ID from a second FS whose directory entries are presented in
              a different order (an fstest.MapFS built from the same content
              is the cheapest way to vary it).

            TestComputeCohort_IDChangesOnSchemaSetAddition (CLM-003)
              baseline/ vs added/.
            TestComputeCohort_IDChangesOnSchemaSetRemoval (CLM-003)
              baseline/ vs baseline-minus-one (built at test time).

            TestComputeCohort_PerSchemaDigestForEveryEmbeddedSchema (CLM-004)
              Every extension schema in the FS has a Digests entry keyed by the
              `<type>/v<N>` identity artifacts declare in schema_version — NOT
              by file path. Drive the expected key set from the fixture's
              schema_version consts.

            TestCohort_UnknownSchemaVersionReportsUncoveredNotZeroValue (CLM-005)
              DigestFor("nope/v9") returns ok=false. Assert BOTH halves: ok is
              false AND the returned string is empty. The forbidden shape is
              ("", true) — an uncovered schema reading as covered-with-no-
              content — and only asserting ok catches half of it.

            TestCohort_SchemaIdentityCoversResolvedBaseSchema (CLM-017)
              baseline/ vs base-revised/: the extension schema is untouched and
              ONLY artifacts/base/schema.json changed, yet
              SchemaIdentity("<type>/v<N>") must differ. LoadArtifactSchema
              merges base into extension (pkg/schema/load.go:99-144), so an
