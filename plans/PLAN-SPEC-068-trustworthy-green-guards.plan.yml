  ─────────────────────────────────────────────────────────────────────────
  WHAT THIS PLAN BUILDS (BUNDLE-003 guards seed, first of three)
  ─────────────────────────────────────────────────────────────────────────
  Two NEW authorities — pkg/artifact/layout.go (the one artifact-layout table
  and the one root resolver) and pkg/schema/cohort.go (the content-derived
  schema cohort) — then FIVE consumers adopt the layout authority, three
  output surfaces adopt the cohort and the build identity, and one new scan
  (FindUngatedArtifacts) surfaces the artifact-shaped files the gate's status
  walk cannot reach.

  THE FIFTH CONSUMER IS SPEC-068 v1.2.1's 2026-08-14 CORRECTION and it landed
  in this plan AFTER the first review pass: `buildGateSteps`
  (cmd/backstop/gate.go:652) hardcodes `filepath.Join(projectRoot, "specs")`
  and feeds it to FOUR gate dimensions. It is CLM-069 and phase-7b, and it is
  no longer on the reported-not-fixed list.

  Everything here is CORE. There is no init code and no doctor code in this
  plan. SPEC-069 (init) and SPEC-070 (doctor) CONSUME the signatures this plan
  makes real — `artifact.ResolveRoot`, `artifact.Root`, `artifact.Kind`,
  `gate.FindUngatedArtifacts`, `gate.UngatedArtifact` — so those names are
  contract, not suggestion. If a signature has to change during
  implementation, that is a STOP-AND-REPORT, not a local decision.

  ─────────────────────────────────────────────────────────────────────────
  VERIFICATION COMMAND REALITY — READ THIS BEFORE EVERY VERIFICATION TASK
  ─────────────────────────────────────────────────────────────────────────
  `backstop code check` DOES NOT EXIST (ISSUE-076). Any agent definition or
  precedent telling you to run it is stale — verified against
  `./bin/backstop --help` on 2026-08-14: the command set is artifact,
  baseline, commands, gate, pack, recipe, version, waiver. The real loop is:

      go build -o bin/backstop ./cmd/backstop     # ALWAYS — see below
      go test <the packages this phase touched> -race -count=1
      ./bin/backstop gate                          # the full kill chain

  THE REBUILD IS UNCONDITIONAL, in every verification task, not "when cmd/
  changed". bin/backstop statically links everything under pkg/ as well as
  cmd/backstop, so a phase that adds only pkg/artifact/layout.go still changes
  what the gate binary would contain. Running the gate against a stale binary
  reports a verdict about code that is not in the binary, and it is
  indistinguishable from a real green (that is the ISSUE-077 class).

  TRUE EXIT CODES, NEVER A GREP PIPE. Read `$?` from the command itself.
  `go test ... | grep -q FAIL` reports grep's status, and a tree that fails to
  BUILD emits no FAIL line at all — so the pipe reports success for a tree
  that does not compile.

  ALL gate dimensions run at EVERY verification step (the no-check-filtering
  razor). Verification tasks never scope or categorize what was touched.

  THIS PLAN EDITS AN ARTIFACT SCHEMA (artifacts/backstop-yml/v1/schema.json),
  so `./bin/backstop artifact validate --all` is part of the final phase, not
  only `gate`.

  ─────────────────────────────────────────────────────────────────────────
  SANCTIONED TEST RETIREMENT — DO NOT DELETE ANYTHING ELSE
