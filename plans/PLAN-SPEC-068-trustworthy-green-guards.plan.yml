        type: implementation
        title: "GREEN: the validate envelope gains the record array and the binary identity, read once by both renderings"
        description: |
          Edit cmd/backstop/output.go.

          jsonEnvelope (lines 47-52) gains BinaryVersion, SchemaCohort,
          ArtifactsAsserted, ScannedRoot and an Artifacts []jsonArtifactRecord
          array. Add:

            type jsonArtifactRecord struct {
              Path string `json:"path"`; Type string `json:"type"`
              SchemaIdentity string `json:"schema_identity,omitempty"`
              Schemaless bool `json:"schemaless,omitempty"`
            }

          OMITEMPTY IS NOT UNIFORM AND THE EXCEPTION IS DELIBERATE.
          ArtifactsAsserted carries NO omitempty: encoding/json drops a zero
          int under omitempty, and ZERO is exactly the value that must stay
          legible — an omitted count on an empty pass is the illegibility
