      - id: TASK-040
        type: implementation
        title: "GREEN: FindUngatedArtifacts and UngatedArtifact in pkg/gate/artifact_status.go"
        description: |
          Add FindUngatedArtifacts and UngatedArtifact to
          pkg/gate/artifact_status.go — the same file as ResolveArtifactStatus,
          because the status walk is the scan's CALIBRATION POINT and the two
          must be read together.

          The algorithm, exactly:
            1. filepath.Abs the projectRoot ON ENTRY. Root.Path is already
               absolute by ResolveRoot's guarantee; comparing an absolute
               Root.Dir(kind) against a relative walk path yields either zero
               findings or one per artifact (trap C).
            2. Walk projectRoot. Skip the ENUMERATED non-corpus trees: the five
               shared names from TASK-005's accessor — .git, vendor,
               node_modules, testdata, prototype — PLUS installed pack trees
               under .backstop/packs. `.backstop` ITSELF IS WALKED, unlike in
               discovery's skip set. Do not express this as "whatever discovery
               skips" (trap B): discovery skips .backstop wholesale except when
               it is the root, and inheriting that by reference makes this
               clause report nothing in the unconfigured motivating case.
            3. Classify each remaining file with artifact.ClassifyFilename —
               the SAME predicate discovery uses, so the set the gate picks up
               and the set it reports leaving out are defined by one rule.
            4. Report every classified file whose PARENT DIRECTORY is not
               Root.Dir(kind). PER KIND, NOT ROOT CONTAINMENT (trap A). The
               helper is named FindUngatedArtifacts — renamed from an earlier
               FindOutOfRootArtifacts — precisely so the name cannot re-suggest
               containment.
            5. Populate ExpectedDir = Root.Dir(Kind) and Root = root.Path.
               ExpectedDir is what makes the report actionable rather than
               merely accusatory, and it is the same string SPEC-070's REQ-025
               consumes.

          UNGATED IS NOT UNDISCOVERED and the report must not conflate them:
          CLI discovery walks the resolved root RECURSIVELY, so a file nested
          below its own type directory is discovered and schema-validated while
          still being ungated by the non-recursive status walk. Every file in
          the surfaced set IS ungated; describe it as such, and only say
          undiscovered where discovery genuinely does not reach.

          ALSO ADD, in pkg/gate, the conversion from []UngatedArtifact to
          []Violation, with ProjectWide set to true on every one. It lives here,
          in ONE place, so the marking cannot be forgotten at a call site —
          TASK-042 consumes it and CLM-064 tests it.
        files:
          - pkg/gate/artifact_status.go
        claims:
