               dimension; giving it refs would make these layout fixtures a
               traceability fixture too, by accident.

          THE MATCHED PAIR IS ENUMERATED IN files: BELOW, AND THAT IS THE
          POINT. CLM-052 is an EQUALITY assertion — "a .backstop/-rooted
          project discovers the same corpus a byte-identical repo-root project
          does" — and an equality is only as real as the two sides being
          genuinely byte-identical. Three kinds appear on each side (spec,
          bundle, plan) so the comparison spans more than one layout entry;
          the two sides carry the SAME filenames under the SAME type directory
          names, differing ONLY in the `.backstop/` prefix. Author each pair by
