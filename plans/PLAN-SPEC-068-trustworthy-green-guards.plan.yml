  ─────────────────────────────────────────────────────────────────────────
  FIVE TRAPS THE SPEC'S SHARP EDGES NAME, RESTATED AS PLAN LAW
  ─────────────────────────────────────────────────────────────────────────
  A. THE SURFACING PREDICATE IS PER KIND, NOT ROOT CONTAINMENT (Sharp Edge 2).
     A file deviates when it is not DIRECTLY in Root.Dir(kind). A containment
     test passes every other test in the CLM-057..063 family and fails only
     CLM-058, which is the motivating case (backstop-runtime puts
     .backstop/bundles/ in a repo that configures no root, so those files are
     INSIDE the default root). If CLM-058 is the only red, the predicate is
     the bug.

  B. THE EXCLUSION SET IS ENUMERATED, NOT INHERITED (REQ-008, Sharp Edge 12).
     FindUngatedArtifacts excludes .git, vendor, node_modules, testdata,
     prototype and .backstop/packs — and WALKS .backstop itself. It must NOT
     be expressed as "whatever discovery skips": discovery skips .backstop
     wholesale except when .backstop IS the root, and inheriting that by
     reference makes the clause report NOTHING in the unconfigured case, which
     is the case it exists for. This was a real review defect; do not regress
     it. The five common names live in ONE shared place (TASK-005) and each
     caller adds its own .backstop rule on top — one list, two rules, never
     two hand-typed copies.

  C. PATHS ARE ABSOLUTE BY CONTRACT (Sharp Edge 10). ResolveRoot absolutizes
     projectRoot; FindUngatedArtifacts absolutizes its own projectRoot on
     entry. runGate passes the literal "." whenever DiscoverConfigPath fails
     (gate.go:77), and a relative root compared against an absolute walk path
     yields either zero findings or one per artifact — both of which look like
     a working implementation.

  D. AN EXISTING-BUT-EMPTY ROOT IS A PASS (Sharp Edge 5). The refusal is
     scoped strictly to "I found something I cannot prove I can validate."
     Tightening "empty is suspicious" into "empty is a failure" breaks the
     init seed's acceptance bar before it is written. Absent-and-configured
     fails; existing-and-empty passes; both are tested in the same file.
     "PASSES" HERE MEANS ROOT RESOLUTION AND artifact_validation, NOT the
     aggregate verdict — CLM-056 was narrowed to exactly that in spec v1.2.2,
     and TASK-036 says how to assert it.

  E. LEAVE THE CAPABILITY PATTERN ALONE (Sharp Edge 11).
     capabilities/CAP-001-pack-gate-enforcement/capability.yml is nested a
     level deeper than the layout expects AND is named `capability.yml`, not
     `CAP-001-….capability.yml`. It escapes ClassifyFilename's `.capability.yml`
     suffix test today and must keep escaping it. "Improving" the pattern to
     also match the bare name turns this repo's own gate red on a file nobody
     asked you to touch.

