      - id: TASK-002
        type: setup
        title: "Author the layout-profile fixture projects: repo-root, .backstop-rooted, absent root, empty root, and the backstop-runtime shape"
        description: |
          Create cmd/backstop/testdata/layout-profiles/ — five fixture PROJECTS
          that carry the whole REQ-007/REQ-008 matrix. Tests copy a fixture to
          a t.TempDir() before running against it, so no test mutates the
          fixture in place.

            repo-root/
              backstop.yml with NO artifact_root. specs/, bundles/, plans/
              at the project root. This is backstop-core's own OQ-1 framework
              exception, and it is CLM-051's control.

            dotbackstop-root/
              backstop.yml declaring `artifact_root: .backstop`. Its artifact
              content under .backstop/specs/, .backstop/bundles/,
              .backstop/plans/ must be BYTE-IDENTICAL to repo-root/'s — that
              byte-identity is what makes CLM-052's "discovers an equivalent
              corpus" an equality assertion rather than a vibe. It ALSO carries
              .backstop/packs/test-org/sample-pack/specs/SPEC-999-installed-pack.spec.md,
              an artifact-shaped file inside an installed pack tree, which
              CLM-046 requires be neither discovered nor surfaced.

            configured-absent-root/
              backstop.yml declaring `artifact_root: .backstop` with NO
              .backstop directory on disk. CLM-055's loud failure.

            configured-empty-root/
              backstop.yml declaring `artifact_root: .backstop` with
              .backstop/ PRESENT, and .backstop/specs/ PRESENT AND EMPTY.
              Both directories carry a .gitkeep — git cannot track an empty
              directory. CLM-056's legitimate pass. D above: this and
              configured-absent-root are a PAIR and their tests live in one
              file or the distinction drifts.

              THE EXISTING-BUT-EMPTY specs/ IS THE POINT, NOT INCIDENTAL. An
              ABSENT .backstop/specs/ is not a state `backstop init` can
              produce — REQ-007 says in those words that SPEC-069's profile
              "creates the directory it configures" — so a fixture without it
              models an unreachable shape. It also matters to CLM-069: with
              specDir resolved to the artifact root's spec directory, the four
              spec-reading dimensions call gate.ExtractMandatedTests, whose
              os.ReadDir SUCCEEDS on an existing empty directory and ERRORS
              loudly on an absent one (pkg/gate/step_testverify.go:113-116).
              Modeling the existing-but-empty case is what makes this fixture
              a real greenfield init output rather than a hard-fail no real
              project reaches.

            unconfigured-dotbackstop-bundles/
              THE BACKSTOP-RUNTIME SHAPE, and the reason the surfacing
              predicate is per kind. backstop.yml with NO artifact_root, and a
              bundle at .backstop/bundles/BUNDLE-001-sample.bundle.md. The file
              is INSIDE the default (project) root, so a root-containment test
              reports nothing here — CLM-058 and CLM-065 both key on it.

          Every artifact file must be minimally SCHEMA-VALID for its type, or
          the equivalence assertions will compare two piles of violations
          rather than two corpora.

          THE SAMPLE SPEC IS PINNED `status: implemented` AND CARRIES AT LEAST
          ONE CLAIM WITH A MANDATED TEST NAME — on BOTH sides of the matched
          pair (repo-root/specs/SPEC-001-sample.spec.md AND
          dotbackstop-root/.backstop/specs/SPEC-001-sample.spec.md, byte-identical
          per CLM-052). THIS IS LOAD-BEARING FOR CLM-069, NOT COSMETIC.
          test_verification applies an implemented-only scope BEFORE its
          capability guard — filterDueMandatedTests / contractsAreDue
          (pkg/gate/step_testverify.go:190-212) keeps a mandated test only when
          its spec's status is exactly "implemented". A `draft` sample spec
          yields ZERO mandated tests, the step takes the len==0 early return
          (step_testverify.go:355-361) and reports a clean "pass" with zero
          violations — BYTE-IDENTICAL to what it reports after reading an EMPTY
          spec directory. TASK-045's positive arm cannot distinguish "read the
          resolved root" from "read nothing" against a draft fixture, which is
          precisely the vacuity this spec is named after.
          Use a mandated test name that exists NOWHERE in this repository (e.g.
          TestLayoutProfileSampleMandatedNeverExists) so no accidental match in
          backstop-core's own tree can make the fixture's signal ambiguous.

          THREE KNOCK-ONS OF `implemented`, ALL CHECKED 2026-08-14, NONE
          BLOCKING, AND ALL THREE ARE INSTRUCTIONS TO WHOEVER WRITES TESTS OVER
          THESE FIXTURES:
            1. artifact_validation is UNAFFECTED. `implementation` and
               `verification` nested blocks are required of EVERY spec by
               artifacts/spec/v1/schema.json regardless of status, so
               `implemented` adds no new required frontmatter key — the fixture
               needed those blocks to be schema-valid as a draft too.
            2. artifact_status_drift WILL REPORT A VIOLATION over both fixtures,
               and that is EXPECTED. An implemented spec classifies
               ClassSuccessTerminal (pkg/gate/artifact_status.go:95-98) and
               computeDriftSurfaces (cmd/backstop/gate.go:946-959) checks its
               mandated name for EXISTENCE with NO capability guard — unlike
               test_verification, it does not short-circuit on a pack-less
               project — so a fixture with no packs and no test files reports the
               name as a broken promise. NO TEST OVER THESE FIXTURES MAY ASSERT
               AN AGGREGATE result.Pass(). Assert per-dimension, which TASK-036
               (CLM-056) and TASK-045 already do for their own reasons. If a
               test needs an aggregate green over a fixture, that is a signal the
               assertion is wrong, not that this pin is.
            3. requirement_traceability keys coverage on implemented specs
               (SupportsCoverage, pkg/gate/requirement_traceability.go:20-22), so
               leave the sample spec's `supports` refs EMPTY and leave the paired
               sample BUNDLE at a non-delivered status. An implemented spec with
