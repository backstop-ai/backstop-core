               (TASK-027 item 3). It does NOT resolve a second one. A second
               resolution in the same run is the class of bug this whole spec
               is about.
             - THE SIXTH ROOT HARDCODING, IN THE SAME FILE AND OUTSIDE
               buildGateSteps: runGate's terminal-exclusion notice at :188 does
               its OWN `filepath.Join(projectRoot, "specs")` —
               `if notice := terminalExclusionNotice(filepath.Join(projectRoot, "specs")); notice != ""`.
               It becomes
               `if notice := terminalExclusionNotice(root.Dir(artifact.KindSpec)); notice != ""`,
               reading the SAME already-resolved root runGate threads to :124
               (:188 is inside runGate, which spans :63-216, so the variable is
               already in scope — no second resolution, no new plumbing).
               terminalExclusionNotice itself (:218) is UNCHANGED: it keeps
               taking a specDir string, and the caller keeps being the one that
               knows where specs live.
               THIS IS A CONSISTENCY FIX RIDING REQ-007'S GENERAL CLAUSE, NOT A
               NEW CLAIM. CLM-069 establishes the pattern — everything reading a
               spec directory reads the RESOLVED one — and the notice-computation
               site is part of that same pattern even though it is not itself
               claimed. Nothing here needs its own claim or its own test:
               CountTerminalSpecs errors on a missing directory and
               terminalExclusionNotice swallows that error (`if err != nil ||
               count == 0 { return "" }`, :219-222), so under a `.backstop/`-rooted
