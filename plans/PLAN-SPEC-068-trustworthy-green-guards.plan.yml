  - id: phase-4
    name: "Phase 4: pkg/schema/cohort.go — the cohort becomes a function of schema BYTES"
    tasks:
      - id: TASK-010
        type: test
        title: "RED: cohort identity changes on bytes, is order-independent, and covers the base schema through extends"
        description: |
          Write pkg/schema/cohort_test.go against the contract:

            type Cohort struct { ID string; Digests map[string]string }
            func ComputeCohort(fsys fs.FS) (Cohort, error)
            func (c Cohort) DigestFor(schemaVersion string) (string, bool)
            func (c Cohort) SchemaIdentity(schemaVersion string) (string, bool)

          Every test drives ComputeCohort through os.DirFS over the TASK-001
          fixture trees — never by editing the real embedded schemas, which
          would churn the whole corpus (spec Verification note).

            TestComputeCohort_IDChangesOnInPlaceSchemaRevision (CLM-001)
              baseline/ vs revised/. ASSERT THE PATH SETS ARE IDENTICAL FIRST
              (walk both, compare sorted path lists) and only then assert the
              IDs differ. Without that first assertion the test passes for a
