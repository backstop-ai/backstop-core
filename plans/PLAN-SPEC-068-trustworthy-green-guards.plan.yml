                  Violations: result.Violations,
              }
              ... outputResult(cmd, &jsonFlag, valResult)

          validate.ValidationResult has exactly ONE field (pkg/validate/result.go:12
          — `Violations []Violation`), so ArtifactsAsserted, ScannedRoot,
          Records and the binary identity are all dropped at this line and
          CLM-013/014/022/023 can be "implemented" in the struct while
          `artifact validate --json` shows none of them. Verified at HEAD:
