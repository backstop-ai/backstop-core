  NO OTHER TEST MAY BE DELETED OR WEAKENED. In particular
  TestCLI_Version_HumanOutput (root_test.go:132) and TestCLI_Version_JSONOutput
  (:148) are SPEC-005's CLM-022/CLM-023, they assert loose content and field
