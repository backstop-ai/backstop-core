  - id: phase-1
    name: "Phase 1: Cohort fixture filesystems and layout-profile fixture projects (setup only)"
    tasks:
      - id: TASK-001
        type: setup
        title: "Author the cohort fixture schema trees: in-place revision, set addition, set removal, base-schema revision"
        description: |
          Create pkg/schema/testdata/cohort/ — four sibling schema TREES that
          ComputeCohort can be pointed at through an fs.FS (os.DirFS), so the
          in-place-revision claims are provable WITHOUT editing the real
          embedded schemas.

          Trees to author, each mirroring the real `artifacts/<type>/v<N>/schema.json`
          shape (plus `artifacts/base/schema.json`):

            baseline/   — two extension schemas (a spec/v1-shaped and a
                          bundle/v2-shaped file) plus a base schema. Each
                          extension pins "schema_version": {"const": "<type>/v<N>"}
                          and declares `extends` so LoadArtifactSchema's merge
                          path is exercised.
            revised/    — BYTE-IDENTICAL PATH SET to baseline/, with the
                          bundle/v2 extension schema's CONTENT changed in place
                          (add a required metadata key, exactly the shape
                          BUNDLE-014's revision had). Its schema_version const
                          is UNCHANGED. This pair is the whole point: same
                          paths, different bytes.
            added/      — baseline/ plus one additional extension schema.
            base-revised/ — baseline/ with ONLY artifacts/base/schema.json
                          changed. This is CLM-017's fixture: the extension
                          schema is untouched, so an identity that covers only
                          the extension will NOT change and the claim fails.

          The set-REMOVAL case (CLM-003's second test) is derived from
          baseline/ by pointing ComputeCohort at a sub-FS or by omitting one
          file at test time — no separate tree is needed, and authoring one
          would invite it to drift from baseline/.

          These are DATA. No Go source is added by this task.
