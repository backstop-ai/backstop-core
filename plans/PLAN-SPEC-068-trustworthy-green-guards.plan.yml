            TestValidateArtifacts_UncoveredSchemaVersionRefusesGreen (CLM-007)
              An artifact declaring a schema_version absent from the binary's
              cohort refuses. The diagnostic must name ALL THREE: the artifact
              PATH, the declared SCHEMA_VERSION, and the cohort IDENTIFIER.
              Assert all three substrings. Today's failure is a generic wrapped
              `loading schema for %s` (artifact_validate.go:178) naming none of
              them, so a test asserting only "it errored" passes against the
