      TestCLI_ComputeCohortID_Empty      (cmd/backstop/root_test.go:323)
      TestCLI_ComputeCohortID_NonEmpty   (cmd/backstop/root_test.go:329)

  They call the function DIRECTLY and assert its literal path-derived output
  ("empty", "1-schemas[spec/v1]"). Verified 2026-08-14: nothing in specs/
