        type: implementation
        title: "GREEN: ValidateAll appends the ungated findings, ProjectWide-marked, from the single call site"
        description: |
          Edit cmd/backstop/gate.go. realArtifactValidator.ValidateAll keeps its
          signature and WIDENS ITS RETURN SET: after converting
