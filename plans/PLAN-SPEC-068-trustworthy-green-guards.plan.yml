  ─────────────────────────────────────────────────────────────────────────
  COMPILE-SAFETY — WHY THE PHASE ORDER IS WHAT IT IS
  ─────────────────────────────────────────────────────────────────────────
  Every phase boundary must hand off a tree that COMPILES and a suite that is
  GREEN. Four orderings are load-bearing and must not be "optimized":

  1. pkg/artifact (phase 2) LANDS BEFORE EVERY CONSUMER (phases 5, 7, 10).
     Root, Kind, LayoutFor and ClassifyFilename are what those phases import.

  2. pkg/config + the backstop.yml JSON schema (phase 3) LAND BEFORE THE
     ENTRY-POINT WIRING (phase 7). The wiring reads cfg.ArtifactRoot, and the
     schema is additionalProperties:false at the top level — adding only the
     struct field passes the yaml decoder and then fails the JSON-schema pass
     (spec Review Question 8).

  3. pkg/schema/cohort.go (phase 4) LANDS BEFORE THE VERSION REWRITE (phase 6)
     AND THE ASSERTION (phase 8). Both read Cohort.ID / DigestFor /
     SchemaIdentity.

  4. THE DISCOVERY SIGNATURE CHANGE (phase 7) LANDS BEFORE THE ASSERTION
     (phase 8) AND THE GATE SURFACES (phase 9). DiscoverArtifacts gains a
     `artifact.Root` parameter, which breaks its call sites in
     artifact_validate.go (lines 126, 225, 238) and gate.go (line 1015). Doing
     the assertion first means writing it against a root that has not been
     resolved yet.

