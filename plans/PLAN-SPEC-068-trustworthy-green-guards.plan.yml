      - id: TASK-011
        type: implementation
        title: "GREEN: ComputeCohort folds a sorted path:digest manifest; DigestFor and SchemaIdentity read it"
        description: |
          Create pkg/schema/cohort.go.

          ComputeCohort(fsys fs.FS): fs.WalkDir every *.json under artifacts/,
          sha256 each file's BYTES, build a SORTED `path:digest` manifest, and
          fold that manifest into one sha256 for Cohort.ID. Sorting is what
          makes it deterministic and walk-order independent (CLM-002) while any
          single byte still moves the ID (CLM-001). Adding or removing a file
          changes the manifest and therefore the ID (CLM-003) for free — that
          is the property, not a special case to code.

          Digests is keyed by the `<type>/v<N>` identity artifacts DECLARE in
          schema_version, not by path, so REQ-003's per-artifact record is a
          lookup rather than a second computation. Derive the key from the
          schema's own declared const where present; falling back to the path
          shape is acceptable ONLY as a derivation of the same identity, never
          as a second vocabulary.

          Each per-schema digest MUST fold the extension schema AND the base
          schema resolved through `extends` (CLM-017). If the extension
          declares no extends, the base is not part of its identity.

          DigestFor returns ok=false for an uncovered schema_version and MUST
          NEVER return ("", true) — that shape is what would let an uncovered
          schema read as covered-with-no-content, and REQ-002's refusal keys on
          exactly this boolean.

          SchemaIdentity renders `<schema_version>@<digest>` and returns the
          same ok=false on uncovered.

          The fs.FS parameter is not a testing convenience, it is the contract:
          production passes backstopcore.SchemaFS, tests pass a fixture FS, and
          that is what makes the in-place-revision claims provable at all.
        files:
          - pkg/schema/cohort.go
        claims:
          - CLM-001
          - CLM-002
          - CLM-003
          - CLM-004
          - CLM-005
          - CLM-017
        depends_on:
          - TASK-010

      - id: TASK-012
        type: verification
        title: "Verify the cohort: content-derived, order-independent, base-covering"
        description: |
          `backstop code check` DOES NOT EXIST (ISSUE-076) — do not run it.

          Run, in order, reading TRUE exit codes:
            1. go build -o bin/backstop ./cmd/backstop
            2. go test ./pkg/schema/... -race -count=1
            3. go test ./... -race -count=1
            4. ./bin/backstop gate

          Then confirm:
            - `grep -n "sha256" pkg/schema/cohort.go` shows the digest is a
              content hash, not a path join or a length count.
            - `grep -rn "schemas\[" pkg/schema/cohort.go` returns NOTHING — the
              old `N-schemas[…]` shape must not be reproduced here.
            - Run TestComputeCohort_DeterministicAndOrderIndependent with
              -count=5. A map-iteration order leak passes at -count=1 and fails
              intermittently later, which is the worst place to find it.
        files:
          - pkg/schema/cohort.go
          - pkg/schema/cohort_test.go
        claims:
          - CLM-001
          - CLM-002
          - CLM-017
        depends_on:
          - TASK-011

