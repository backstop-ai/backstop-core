  # ═══════════════════════════════════════════════════════════════════════
  # Phase 10: The surfacing scan (REQ-008) — the clause that actually closes
  # the backstop-runtime case
  # ═══════════════════════════════════════════════════════════════════════
  - id: phase-10
    name: "Phase 10: FindUngatedArtifacts — per-kind, enumerated exclusions, ProjectWide findings"
    tasks:
      - id: TASK-039
        type: test
        title: "RED: the per-kind predicate, on every shape including the one a containment test cannot see"
        description: |
          Write pkg/gate/ungated_artifacts_test.go against the contract:

            func FindUngatedArtifacts(projectRoot string, root artifact.Root) ([]UngatedArtifact, error)
            type UngatedArtifact struct { Path string; Kind artifact.Kind; ExpectedDir string; Root string }

          Build trees with t.TempDir() so the walk starts inside a tree you
          control. Every finding must carry Path, Kind, ExpectedDir
          (== Root.Dir(Kind), where discovery WOULD have found it) and Root.

            TestFindUngatedArtifacts_SurfacesFileOutsideItsExpectedTypeDirectory
              (CLM-057) A .spec.md sitting in docs/ is surfaced, with
              ExpectedDir naming specs/.

            TestFindUngatedArtifacts_SurfacesInsideDefaultRootButWrongTypeDirectory
              (CLM-058) THE CLAIM THAT SEPARATES A CORRECT IMPLEMENTATION FROM
              A PLAUSIBLE ONE. An UNCONFIGURED root, with bundles at
              .backstop/bundles/. Those files sit INSIDE the default root — the
              project root contains itself — so a root-containment test reports
              NOTHING here while passing every other test in this family. This
              is the backstop-runtime shape the requirement was written for. If
              this is your only red, the predicate is containment, not per
              kind.

            TestFindUngatedArtifacts_SurfacesFileOutsideConfiguredRoot (CLM-059)
              With a CONFIGURED root, a file outside it is surfaced by the SAME
              per-kind rule — one rule covers both shapes.

            TestFindUngatedArtifacts_CorrectlyPlacedCorpusProducesNoFindings
              (CLM-060) A corpus whose artifact-shaped files all sit directly
              in their expected type directories produces ZERO findings. This
              is why backstop-core passes without a framework-exception
              carve-out — because its files are placed correctly, not because
              it is exempt.

            TestFindUngatedArtifacts_ReportsWithoutWideningRootOrTypeDirectories
              (CLM-061) Surfacing reports without ADOPTING: after the scan the
              scanned root and type directories are unchanged and the surfaced
              files are not validated as corpus. Assert discovery over the same
              tree still excludes them.

            TestFindUngatedArtifacts_ExcludesEnumeratedNonCorpusTreesButWalksDotBackstop
              (CLM-062) Plant artifact-shaped files under .git/, vendor/,
              node_modules/, testdata/, prototype/ and .backstop/packs/ and
              require ZERO findings from them — while an artifact-shaped file
              directly under .backstop/ IS reachable by the scan. Both halves
              in one test: the exclusions must not be so wide that the
              unconfigured motivating case is excluded away before it can be
              found (trap B).

            TestFindUngatedArtifacts_NestedArtifactIsUngatedButStillDiscovered
              (CLM-063) A .spec.md nested one level BELOW specs/ IS surfaced —
              the status walk is non-recursive (os.ReadDir, walkArtifactDir at
              artifact_status.go:379-404) so it genuinely never reaches it —
              while remaining DISCOVERED and schema-validated by the recursive
              CLI walk. Assert BOTH facts, and assert the finding does not
              describe the file as undiscovered. Also assert a bare
              SUBDIRECTORY inside a type directory is NOT itself a finding;
              only artifact-shaped FILES' locations are judged.

            TestFindUngatedArtifacts_RelativeAndAbsoluteProjectRootAgree
              (CLM-067) Call it with the relative and the absolute form of ONE
              project root and require IDENTICAL findings. A mixed pair yields
              zero findings or one per artifact and both look like a working
              implementation (trap C, spec Review Question 10).
        files:
          - pkg/gate/ungated_artifacts_test.go
        claims:
          - CLM-057
          - CLM-058
          - CLM-059
          - CLM-060
          - CLM-061
          - CLM-062
          - CLM-063
          - CLM-067
