          their empty value means genuinely absent.

          This record type exists rather than reusing GateResult's flat
          SchemaIdentities []string because CLM-013 requires an identity for
          EACH validated artifact and a flat per-SCHEMA list cannot express
          that binding. Collapsing the two would silently weaken this claim.

          THE RENDER PATH — THE DESIGN CALL IS MADE HERE, NOT LEFT OPEN.
          The spec left "widen the parameter or add a second method" to the
          plan. THIS PLAN ADDS A SECOND ENTRY POINT AND LEAVES `outputResult`
          ALONE. Concretely, in cmd/backstop/root.go, alongside the existing
          `outputResult(cmd *cobra.Command, jsonFlag *bool, result
          validate.ValidationResult) error` (root.go:221-238), add:

              func outputValidateResult(cmd *cobra.Command, jsonFlag *bool,
                                        result ValidateResult) error

          shaped identically — one branch on jsonFlag, JSONFormatter on one
          side, HumanFormatter on the other — but carrying the widened type, so
          both formatters see ArtifactsAsserted, ScannedRoot, Records and the
          binary identity. Give the two formatters a method that takes
          ValidateResult; the existing FormatResult(validate.ValidationResult)
          stays for the narrow callers.

          WHY NOT WIDEN `outputResult`'S PARAMETER. Verified at HEAD: two tests
          call it with a bare validate.ValidationResult —
          TestCLI_OutputResult_UsesJSONFormatter (root_test.go:274) and
          TestCLI_OutputResult_HumanMode (root_test.go:424) — so widening the
          parameter is a compile break in BOTH. This plan sanctions the
          retirement of exactly TWO tests (TestCLI_ComputeCohortID_Empty and
          _NonEmpty) and says in its notes that a THIRD compile break is a
          STOP-AND-REPORT. Widening would manufacture two more and put an
          implementer in the position of editing SPEC-005-era tests to make a
          build pass — the precise thing the retirement section exists to
          prevent. There is also a live caller that SHOULD keep the narrow
          type: artifact_validate.go:340 renders `configResult` on the
          CONFIG-ERROR path, where no corpus was scanned and there is nothing
          to report an asserted count or a scanned root about.

          A SECOND ENTRY POINT IS NOT A SECOND RENDERING PATH. The invariant is
          that the human and JSON renderings of ONE result read ONE resolved
          value (CLM-014/CLM-023), mirroring how the version command shares
          reportedVersion across its two branches (root.go:107) —
          outputValidateResult branches on jsonFlag over a single
          ValidateResult, so both sides read the same struct. Two formatting
          paths that each RECOMPUTE are the drift this requirement forbids.

          THEN REWRITE THE DROP SITE THIS TASK OWNS: replace the lossy
          conversion at artifact_validate.go:353-356 (`valResult :=
          validate.ValidationResult{Violations: result.Violations}`) and its
