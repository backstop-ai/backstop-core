  - id: phase-7b
    name: "Phase 7b: buildGateSteps takes the resolved Root — the fifth REQ-007 consumer, on all three call sites"
    tasks:
      - id: TASK-045
        type: test
        title: "RED: the four spec-reading dimensions read the resolved root's spec directory, and the project-root form fails"
        description: |
          Write cmd/backstop/gate_specdir_root_test.go — ONE new file, one
          mandated test.

            TestBuildGateSteps_SpecDirectoryConsumersReadResolvedArtifactRoot
              (CLM-069) Copy the dotbackstop-root fixture (TASK-002) to a
              t.TempDir(). Its specs live at .backstop/specs/ and there is NO
              specs/ at the project root — that asymmetry IS the test.

              Resolve the root the way runGate does — artifact.ResolveRoot on
              the temp project root with the fixture's declared `.backstop` —
              hand it to buildGateSteps alongside the project root, run the
              returned steps, and require that NONE of the four spec-reading
              dimensions reports a spec-directory read failure:
              test_verification, test_substantiveness, coverage and contracts.
              Then require POSITIVELY that the mandated test name declared in
              .backstop/specs/SPEC-001-sample.spec.md was actually SEEN — an
              absence-of-error assertion alone passes for a step that read an
              empty directory, which is the vacuous shape this whole spec is
              named after.

              NAME THE POSITIVE SIGNAL EXACTLY, BECAUSE IT IS NOT "PASS": the
              observable difference is test_verification's STATUS, and it is a
              WARNING, not a clean pass. Trace it, because getting this wrong
              silently reintroduces the vacuity:
                - TASK-002 pins the fixture spec `status: implemented` with one
                  mandated test name, so filterDueMandatedTests
                  (step_testverify.go:190-212) keeps it and `len(mandated) != 0`.
                - The fixture declares NO packs, so classifier.HasTestGlobs()
                  and matcher.HasPatterns() are both false and the step returns
                  testDiscoveryCapabilityAbsent — Status "warning", with a Reason
                  NAMING the missing discovery inputs (step_testverify.go:366-368).
                - Read an EMPTY spec directory instead and mandated is empty, so
                  the step takes the len==0 early return BEFORE that guard
                  (step_testverify.go:355-361) and returns Status "pass" with
                  zero violations.
              So assert test_verification's status is the capability-absent
              WARNING and NOT "pass". That single assertion is what separates
              "read the resolved root's spec directory and found the mandated
              name" from "read an empty directory" — and it is why the fixture
              spec MUST be `implemented`. A draft fixture makes both shapes
              return the identical clean pass and this arm becomes decorative.
              DO NOT reach for a mandated-test-FOUND assertion instead: with no
              pack test globs nothing can be found, and adding a pack to the
              fixture to make one findable widens these layout fixtures into
              pack fixtures for no gain.

              THE FALSIFICATION ARM IS PART OF THE TEST, NOT A SEPARATE ONE.
              Run the SAME assembly a second time with the pre-fix root shape —
              a Root whose Path is the project root rather than the resolved
              `.backstop` — and require test_verification FAILS with the
              extract error. gate.ExtractMandatedTests does os.ReadDir(specDir)
              and returns a wrapped error on a missing directory
              (pkg/gate/step_testverify.go:113-116), and the step converts that
              into Status "fail" (step_testverify.go:338-345), so the failure is
              observable without reaching into unexported state. Without this
              arm the test passes on a build where specDir still comes from the
              project root, because a repo that happens to have BOTH directories
              cannot tell the two apart.

          DO NOT "FIX" ExtractMandatedTests TO TOLERATE AN ABSENT DIRECTORY.
          Its intolerance is the reason CLM-069 is a defect and not a
          refinement (REQ-007's 2026-08-14 correction says so in those words),
          and softening it would make this test unfalsifiable AND silently
