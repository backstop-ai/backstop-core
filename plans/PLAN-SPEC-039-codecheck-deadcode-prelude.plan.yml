notes: |
  Implements SPEC-039 — Seed 1 of BUNDLE-011, the behavior-preserving DEAD-CODE
  PRELUDE that lands FIRST (before SPEC-040's pkg/check.Run cutover) to shrink the
  surface pkg/check/manifest.go presents to the rewrite. Two verified-dead /
  verified-no-op deletions, both inside pkg/check/manifest.go, and nothing else.

  STRICT SCOPE FENCE (belongs to siblings — MUST NOT be authored here):
    - SPEC-040 (Seed 2, DOWNSTREAM consumer): the wholesale pkg/check.Run Step-2
      cutover, builtinToolchain/realCodeChecker deletion, the go-toolchain pack,
      the gate step, and the golden-equivalence harness. This plan does NOT touch
      realCodeChecker / builtinToolchain / any gate STEP.
    - SPEC-041 (Seed 3): coverage / step_coverage.go / CheckType-consumer catalog.
    - ISSUE-030: the .standard.md SCAFFOLDER (pkg/pack/scaffold.go) — only the
      READER is in scope here; the scaffolder is asserted UNTOUCHED (CLM-018).

  THE TWO DELETIONS (pkg/check/manifest.go ONLY):
    REQ-010 — DELETE the ENTIRE dead .manifest.json reader (compiled AND legacy
      arms) AND the rule-matching path it strands: compiledManifestFile + its
      methods (routableExtensions/isCompiled/hasSemgrepSignal/legacyRules/
      deriveRules); combinedRule; languageExtensions; manifestFile;
      parseCheckTypes (PLURAL); hasRoutableRule; the .manifest.json-walking body
      of LoadManifest (incl. the manifest-path zero-routable ConfigError
      EMISSION); and the stranded matchesRule/matchGlobPattern/
      matchDoubleStarPattern/ManifestRule plus Manifest.rules/Manifest.isDefaults.
      RESULT: LoadManifest reduces to read-dir-or-skip → return defaultManifest();
      RouteFile collapses to return m.routeFileDefaults(path); Manifest becomes an
      EMPTY struct; defaultManifest() returns &Manifest{}.
    REQ-007 — DELETE the already-no-op non-Go catch-all in routeFileDefaults (the
      `default: return []CheckType{CheckTypeFindings}` arm). The .go/.ts/.tsx
      all-four-passes case is PRESERVED BYTE-FOR-BYTE; a non-matching extension
      then returns the EMPTY slice.

  PRESERVE (explicit prohibition on deletion): the ConfigError TYPE
    (pkg/check/errors.go) + every .manifest.json-INDEPENDENT trigger
    (missing-toolchain in registry.go via resolveToolchain/validateToolchainKeys,
    no-command, unknown-format in parsers.go); parseCheckType (SINGULAR — used by
    validateToolchainKeys); RouteFile; routeFileDefaults; defaultManifest; the
    CheckType enum and all four pass constants; the registry.go executor-building
    code; pkg/pack/scaffold.go.

  DELETION-TDD MODEL (matches PLAN-ISSUE-018 / SPEC-034 pattern):
    Each deletion is a REFACTOR (it MODIFIES existing code) guarded by a preceding
    TEST task that supplies (a) DELETION-ASSERTION tests — scan non-test .go
    sources under pkg/check and assert the deleted symbols are ABSENT (model:
    pkg/validate/deletion_assertion_test.go) — and (b) BEHAVIOR-PRESERVING tests
    that pin the surviving routing/gate RESULT. The deletion-assertion tests are
    RED while the symbols exist and go GREEN only after the refactor, preventing
    silent reintroduction.

  ORPHAN RECONCILIATION IS IN-PHASE WITH THE DELETION (compile-coupling): the
    .manifest.json arm is referenced by TEST callers in BOTH swept packages
    (pkg/check/manifest_test.go, pkg/check/ts_routing_test.go,
    cmd/backstop/code_check_test.go, cmd/backstop/gate_scope_test.go). Per the
    align-predating-artifacts principle, every orphan is deleted or rewritten to
    the post-deletion truth IN THE SAME REFACTOR TASK as the deletion that orphans
    it — otherwise the package will not compile. Four orphan families: (a)
    .manifest.json-reader orphans → DELETE; (b) routing-schema/ConfigError "ride
    the arm" orphans → DELETE or REWRITE off the fixture; (c) rule-matching
    orphans → DELETE; (d) surviving-API-altered-by-REQ-007 → REWRITE the assertion
    to non-Go → empty.

  SHARP EDGE — behavior-preserving assertion must pin VIOLATIONS + EXIT, NOT the
    PassResults list. Post-REQ-007 a non-Go file routes to nothing, so its
    Skipped("no executor configured") findings PassResult vanishes — an intended,
    observable delta to the PassResults inventory (could nudge StepsSkipped) that
    does NOT change the violation set or exit code. CLM-005's
    TestCodeCheck_NonGoFile_GateResultUnchangedAfterCatchAllRemoval MUST assert
    violations + exit, never an exact PassResults list, or it will spuriously fail.

  SHARP EDGE — STOP-AND-REPORT if any deletion's dead/no-op premise is FALSE: a
    production .manifest.json writer, a non-test caller of deriveRules/isCompiled/
    etc., a SECOND .manifest.json-tied ConfigError trigger, or a pkg/check findings
    executor. Do not author the deletion around a live edge.

  COVERAGE GREEN ON A NET-NEGATIVE DIFF (90% threshold over pkg/check):
    This is mostly deletion — the denominator (surviving routing layer) shrinks to
    LoadManifest + RouteFile + routeFileDefaults + defaultManifest + parseCheckType.
    The behavior-preserving tests authored in the test tasks call directly into
    every surviving line: LoadManifest over a missing dir AND the repo's
    .backstop/rules path (both → defaults); RouteFile/routeFileDefaults for
    .go/.ts/.tsx (all-four) and a non-Go file (empty); parseCheckType is exercised
    via validateToolchainKeys (registry path). Sequencing keeps the gate green:
    the deletion-assertion + behavior-preserving tests are authored in the SAME
    task batch as the deletion and DELETE the dead code's now-orphaned tests in the
    same change, so no covered-but-deleted code strands a test and no surviving
    line goes uncovered. Net effect: coverage RISES (dead uncovered-by-meaningful-
    -assertions code leaves; small surviving surface is exhaustively pinned).

  STRUCTURE:
    Phase 1: Deletion-assertion + behavior-preserving test scaffolding (TDD red)
             for BOTH requirements, in disjoint NEW test files so they parallelize.
    Phase 2: REQ-010 — delete the whole .manifest.json reader + stranded
             rule-matching path; reconcile its orphans across both packages;
             middle-phase verification.
    Phase 3: REQ-007 — delete the non-Go catch-all; reconcile its orphans;
             middle-phase verification. (Sequenced AFTER Phase 2 because both edit
             the single shared file pkg/check/manifest.go — D-081.)
    Phase 4: Comprehensive final verification (backstop gate + artifact validate).

phases:
