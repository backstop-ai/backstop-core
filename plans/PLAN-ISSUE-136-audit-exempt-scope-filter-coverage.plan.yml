               2026-08-17, so a later reader does not re-open this): SPEC-041's
               contracts entry for this field reads "The go-build and go-test
               engines declare it true; golangci declares it false/unset", which
               is CORRECT against both go-toolchain manifests — `go-test`
               declares `exempt_from_scope_filter: true` in each. Commit 140efc9
               ("spec(SPEC-041): invert go-test exemption claims for ISSUE-129")
               already corrected it, along with the matching CLM-017/REQ-004 and
               C-1 prose. `binding.go` is the ONE place the inversion was never
               propagated, which is why it is the only surface this claim owns.
               No spec-author follow-on is owed.

  Structure:
    Phase 1: Fixture corpus (two parallel setup tasks, disjoint trees).
    Phase 2: TDD for the advisory — red unit tests, then packval implementation.
    Phase 3: TDD for the audit census + CLI-level non-blocking proof and the
             doc-comment source pin, then the base-engines declaration and the
             de-enumeration those tests gate.
    Phase 4: Comprehensive verification — full kill chain + artifact validation.

phases:
  # ═══════════════════════════════════════════════════════════════════════
  # Phase 1: Fixture corpus
  # ═══════════════════════════════════════════════════════════════════════
  - id: phase-1
    name: "Phase 1: Tri-state fixture corpus"
    tasks:
      - id: TASK-001
        type: setup
        title: "Minimal packval fixture packs covering the exempt tri-state"
        description: |
          Create five MINIMAL fixture manifests under
          `pkg/packval/testdata/exempt-decision/`. They exist to drive
          `RunCoherence` (and `ParseManifest`) DIRECTLY in unit tests, so they
          need only the fields the checks read — they are deliberately NOT
          complete packs, and are not run through the full pipeline.

          Follow the shape already used by `pkg/packval/testdata/bad-engine-pack`
          for a manifest-only fixture. Each declares an `engines:` block:

            projectwide-undeclared/pack.yml
              one engine, `scope_kind: project-wide`, NO
              `exempt_from_scope_filter` key. The positive case: this is the
              shape the advisory must name.

            projectwide-explicit-false/pack.yml
              one engine, `scope_kind: project-wide`,
              `exempt_from_scope_filter: false`. The tri-state's whole point:
              the SAME effective value as the case above, but recorded — the
              advisory must be silent here. If this fixture and the one above
              cannot be told apart, the feature is not built.

            projectwide-explicit-true/pack.yml
              one engine, `scope_kind: project-wide`,
              `exempt_from_scope_filter: true`. Silent.

            filearg-undeclared/pack.yml
              one engine, `scope_kind: file-args`, NO key. Silent — a file-args
              engine only ever reports on files handed to it, so the scope
              filter is a no-op for it and no decision is owed.

            no-engines/pack.yml
              a manifest with NO `engines:` block at all. Exists for CLM-005:
              parsing it must still produce a NON-NIL declared-key record.

          GATE_TYPE ASSIGNMENT IS LOAD-BEARING — get it exactly right, or
          CLM-004's falsifier goes vacuous:
            * the three `projectwide-*` fixtures carry DIFFERENT gate_type
              values (`lint`, `coverage`, `test`), so an implementation keying on
              gate_type cannot reproduce "warn on undeclared, silent on either
              explicit value" across them;
            * `filearg-undeclared` carries THE SAME gate_type value as
              `projectwide-undeclared` (both `lint`). This is the half that makes
              the guard real. If the file-args fixture were given a FOURTH
              distinct gate_type, an implementation keying on
              `gate_type ∈ {lint,coverage,test} AND key absent` — deriving from
              entirely the wrong signal — would still pass all seven tests. Made
              identical, the two fixtures are indistinguishable to any
              gate_type-based rule while differing ONLY in `scope_kind`, so such
              an implementation necessarily warns on `filearg-undeclared` and
              fails `TestExemptDecision_FileArgsEngineNeverWarns`.
          `scope_kind` is therefore the only field that separates the warn set
          from the silent set across the whole corpus.

          Do not add fixtures beyond these five; do not touch any existing
          fixture pack.
        files:
          - pkg/packval/testdata/exempt-decision/projectwide-undeclared/pack.yml
          - pkg/packval/testdata/exempt-decision/projectwide-explicit-false/pack.yml
          - pkg/packval/testdata/exempt-decision/projectwide-explicit-true/pack.yml
          - pkg/packval/testdata/exempt-decision/filearg-undeclared/pack.yml
          - pkg/packval/testdata/exempt-decision/no-engines/pack.yml
        claims:
          - CLM-001
          - CLM-002
          - CLM-004
          - CLM-005
        depends_on: []

      - id: TASK-002
        type: setup
        title: "Complete fixture pack for the end-to-end pack check exit-code proof"
        description: |
          CLM-003 is a CLI-level claim — the real `pack check` command must
          report the advisory and STILL exit 0 — so it needs a pack that passes
          the whole pipeline, not a manifest stub. TASK-001's fixtures cannot
          serve: they fail phase 1 (`content is required`), exactly as
          `packs/base-engines` does (SE-4), and a failing pack would exit
          non-zero for an unrelated reason and prove nothing.

          Build one COMPLETE fixture pack under
          `cmd/backstop/testdata/exempt-decision-pack/`, modelled on
          `pkg/packval/testdata/engine-pack` — take its STRUCTURE (`pack.yml`
          with `language: generic`, `archetype: enforcement`, an `engines:`
          block, and a `content:`/`ruleset:` block whose one claimed rule names
          its engine; `rules/sample.yml`; and the `fixtures/valid/` +
          `fixtures/invalid/` files that rule's claim references).

          USE `engine-pack`, NOT `pkg/packval/testdata/valid-pack`. Measured
          2026-08-17: `pack check pkg/packval/testdata/valid-pack` reports
          `status: fail` with three `phase1-structural/file-exists` errors —
          that directory contains ONLY `pack.yml`, so it cannot model a pack
          this task requires to pass clean. `engine-pack` reports `status: pass`
          with ZERO errors and ZERO warnings, and already carries a real
          `engines:` block, so it is both correct and the closer structural fit.
          (`cmd/backstop/testdata/hermetic-remote/valid-pack` also passes clean
          but has no engines block, so it is the weaker model.) A copy of
          `engine-pack` retargeted to this path was confirmed still
          `status: pass` before this plan was written.

          The ONE thing that distinguishes the new fixture: its `engines:` block
          declares EXACTLY ONE engine, with `scope_kind: project-wide` and NO
          `exempt_from_scope_filter` key — so the advisory count is unambiguously
          one. Do NOT carry over engine-pack's three engines: `mybuild` declares
          the key explicitly and `mycoverage`/`mylint` would each add a second
          and third advisory, muddying the assertion.

          DO NOT COPY THE `content:` BLOCK VERBATIM — A VERBATIM COPY MEASURABLY
          FAILS. `engine-pack` declares TWO rules, and they name DIFFERENT
          engines: `claimed-engine-rule` -> `mylint` and `mechanism-engine-rule`
          -> `mybuild`. Reducing the engines block to one engine while carrying
          both rules across leaves `mechanism-engine-rule` pointing at an engine
          that no longer exists. Measured on a scratch copy 2026-08-17:
          `status: fail`, `ERROR [phase2-coherence/engine-resolve] resolving rule
          engine "mybuild": unknown engine "mybuild": no EngineBinding
          registered`, exit 1 — destroying CLM-003's exit-0 proof for a reason
          with NOTHING to do with the exempt-scope advisory, which is exactly the
          confound this task exists to avoid.

          `mechanism-engine-rule` must therefore be DROPPED (or repointed at the
          one surviving engine). THE MEASURED-WORKING SHAPE, recorded here so it
          need not be rediscovered: a single engine `mylint` (`scope_kind:
          project-wide`, `input_mode: config-file`, NO `exempt_from_scope_filter`
          key) paired with only `claimed-engine-rule` -> `mylint` — verified
          `status: pass`, zero errors, zero warnings, all five phases pass.

          Verify the fixture is genuinely clean apart from the advisory BEFORE
          the feature exists, so the exit-0 proof cannot be confounded later:

            go build -o ./bin/backstop ./cmd/backstop
            ./bin/backstop pack check cmd/backstop/testdata/exempt-decision-pack

          It must report `status: pass` with zero errors AND zero warnings
          today. Record that output — it is the pre-state half of CLM-003.
        files:
          - cmd/backstop/testdata/exempt-decision-pack/pack.yml
          - cmd/backstop/testdata/exempt-decision-pack/rules/sample.yml
          - cmd/backstop/testdata/exempt-decision-pack/fixtures/valid/sample-ok.go
          - cmd/backstop/testdata/exempt-decision-pack/fixtures/invalid/sample-bad.go
        claims:
          - CLM-003
        depends_on: []

  # ═══════════════════════════════════════════════════════════════════════
  # Phase 2: The advisory
  # ═══════════════════════════════════════════════════════════════════════
  - id: phase-2
    name: "Phase 2: The exempt-scope-decision advisory"
    tasks:
      - id: TASK-003
        type: test
        title: "Red tests for the advisory, the tri-state, and the no-derivation guard"
        description: |
          Write `pkg/packval/exempt_decision_test.go`. Every test parses its
          fixture through the real `ParseManifest` and drives the real
          `RunCoherence` — no hand-built `PackManifest` literals, because a
          literal has no declared-key record and would make these tests
          vacuously green (SE-6).

          All of these must be observed RED before Phase 2's implementation
          begins; capture the failure output.

          TestExemptDecision_ProjectWideEngineOmittingKeyWarns
            `projectwide-undeclared` yields exactly one `exempt-scope-decision`
            warning naming the engine, on the coherence phase. (CLM-001)

          TestExemptDecision_ExplicitFalseIsSilent
            `projectwide-explicit-false` yields NO such warning. This is the
            tri-state proof: same effective boolean as the case above, opposite
            outcome, so the check demonstrably reads key PRESENCE and not the
            value. (CLM-002)

          TestExemptDecision_ExplicitTrueIsSilent
            `projectwide-explicit-true` yields no such warning. (CLM-002)

          TestExemptDecision_FileArgsEngineNeverWarns
            `filearg-undeclared` yields no such warning even though its key is
            absent — no decision is owed for a file-args engine. (CLM-001)

          TestExemptDecision_PromptsWithoutDerivingTheValue
            Across all four engine fixtures: the parsed
            `binding.ExemptFromScopeFilter` value is IDENTICAL before and after
            validation (nothing is inferred or rewritten), and the warn/silent
            outcome tracks `scope_kind` + key presence ALONE — the fixtures
            deliberately carry differing `gate_type` values, and an
            implementation keying on gate_type must fail this test. (CLM-004)

          TestExemptDecision_ParseManifestAlwaysRecordsDeclaredKeys
            `no-engines/pack.yml` parses to a NON-NIL declared-key record, and
            so does every other fixture; the record for
            `projectwide-explicit-false` contains the
            `exempt_from_scope_filter` key while the record for
            `projectwide-undeclared` does not. (CLM-005)

          TestExemptDecision_AdvisoryNeverFailsTheRun
            After `RunCoherence` on `projectwide-undeclared`, the phase status
            is NOT `fail`, the warning is in `Warnings` and NOT in `Errors`, and
            a `Result` carrying only this warning finalises to `pass` through
            the real `FinalizeStatus`. (CLM-003)
        files:
          - pkg/packval/exempt_decision_test.go
        claims:
          - CLM-001
          - CLM-002
          - CLM-003
          - CLM-004
          - CLM-005
        test_names:
          - TestExemptDecision_ProjectWideEngineOmittingKeyWarns
          - TestExemptDecision_ExplicitFalseIsSilent
          - TestExemptDecision_ExplicitTrueIsSilent
          - TestExemptDecision_FileArgsEngineNeverWarns
          - TestExemptDecision_PromptsWithoutDerivingTheValue
          - TestExemptDecision_ParseManifestAlwaysRecordsDeclaredKeys
          - TestExemptDecision_AdvisoryNeverFailsTheRun
        depends_on:
          - TASK-001

      - id: TASK-004
        type: implementation
        title: "Record declared engine keys at parse time and emit the advisory"
        description: |
          Two edits, both located by SYMBOL, not line number (SE-9).

          `pkg/packval/manifest.go`:
            * Give `PackManifest` an UNEXPORTED field recording, per engine
              name, the set of manifest keys the author actually wrote — e.g.
              `declaredEngineKeys map[string]map[string]bool`. Unexported keeps
              it out of the JSON/YAML surface; packval's own tests share the
              package.
            * In `ParseManifest`, after the existing `yaml.Unmarshal`, run a
              SECOND, deliberately loose unmarshal of the same bytes into a
              presence probe — `struct{ Engines map[string]map[string]yaml.Node
              \`yaml:"engines"\` }` — and populate the field from its key sets.
              This is a PRESENCE PROBE, not a second parser: it reads which keys
              exist and nothing about what they mean. It lives here rather than
              on `engine.EngineBinding` so the shared binding type consumed by
              the gate hot path (`cmd/backstop/pack_gate.go` stamps
              `Violation.ProjectWide` from it) keeps its plain `bool` and is not
              disturbed by a validator concern.
            * ALWAYS assign a non-nil map, including when the manifest has no
              `engines:` block, so "not parsed" stays distinguishable from "no
              keys declared" (SE-6 / CLM-005).
            * Add an EXPORTED, sorted accessor —
              `func ExemptDecisionPending(m *PackManifest) []string` — returning
              the names of engines declared `scope_kind: project-wide` whose
              record lacks `exempt_from_scope_filter`. It returns nil for a
              manifest whose record is nil (never parsed). This is the SINGLE
              authority for "a decision is owed here"; Phase 3's census test
              calls this same function rather than re-deriving the rule.

          `pkg/packval/phase2.go`:
            * In `RunCoherence`, iterate `ExemptDecisionPending(pack)` and
              append one `ValidationWarning` per engine to `res.Warnings` with
              `Phase: res.Phase`, `Check: "exempt-scope-decision"`, a `Message`
              naming the engine and
              stating BOTH consequences plainly (true => its violations still RED
              a diff-scoped gate when they land on an unchanged file; false =>
              they are filtered out), a `FixHint` telling the author to add
              `exempt_from_scope_filter: true|false` to that engine's block, and
              `Files: []string{"pack.yml"}`.
              `Phase` IS NOT OPTIONAL: both existing phase-2 warnings
              (`pairs_with` and `orphan-fixture`, located by their `Check`
              strings) set it, and the renderer prints `WARN [%s/%s]` from
              `Phase` and `Check` — omitting it renders the literal
              `WARN [/exempt-scope-decision]` with an empty phase segment, which
              a CLI-output assertion in TASK-006 would then be pinning as
              correct. Match the neighbours exactly.
            * Append to `Warnings` ONLY. Never to `Errors` (SE-5).
            * Bump the hard-coded `Checks: 6` to 7 and extend its enumerating
              comment (SE-7).

          Consult `scope_kind` and key presence ONLY. No `gate_type` branch, no
          engine-name or tool-name branch, no default inferred, no binding value
          rewritten (SE-1).
        files:
          - pkg/packval/manifest.go
          - pkg/packval/phase2.go
        claims:
          - CLM-001
          - CLM-002
          - CLM-003
          - CLM-004
          - CLM-005
        depends_on:
          - TASK-003

      - id: TASK-005
        type: verification
        title: "Gate the packval lane diff-scoped and re-run the real falsification"
        description: |
          Build the binary fresh — never invoke a bare `backstop` (SE-8):

            go build -o ./bin/backstop ./cmd/backstop
            export PATH=/Users/bmanson/go/bin:$PATH

          Gate this lane's files:

            ./bin/backstop gate --file pkg/packval/manifest.go
            ./bin/backstop gate --file pkg/packval/phase2.go
            ./bin/backstop gate --file pkg/packval/exempt_decision_test.go

          Then run the package suite for real:

            go test ./pkg/packval/... -race -count=1

          Confirm and report:
            - all seven TASK-003 tests PASS, and each was observed RED first;
            - no OTHER packval test regressed — `RunCoherence`'s check-count
              change and the new warning stream touch shared assertions, so
              re-read any phase-2 test that counts checks or warnings;
            - the ORIGINAL falsification now inverts. Re-run the exact command
              from CLM-001 against the real installed pack:

                ./bin/backstop pack check .backstop/packs/backstop-ai/go-toolchain

              It reported `status: pass` with zero warnings on 2026-08-17. It
              must now report `status: pass` (still exit 0 — SE-5) WITH two
              `exempt-scope-decision` advisories, naming `golangci` and
              `go-coverage`. Both are EXPECTED and correct (SE-3): they are
              genuinely un-recorded decisions in an EXTERNAL pack this plan does
              not edit. Do not silence them, and do not edit that manifest or
              its in-repo fixture mirror. Report the exact output.
        files:
          - pkg/packval/manifest.go
          - pkg/packval/phase2.go
          - pkg/packval/exempt_decision_test.go
        claims:
          - CLM-001
          - CLM-002
          - CLM-003
          - CLM-004
          - CLM-005
        depends_on:
          - TASK-004

  # ═══════════════════════════════════════════════════════════════════════
  # Phase 3: The audit census, the CLI proof, and the recorded decisions
  # ═══════════════════════════════════════════════════════════════════════
  - id: phase-3
    name: "Phase 3: Executable audit census and recorded decisions"
    tasks:
      - id: TASK-006
        type: test
        title: "Red tests for the engine census and the CLI exit-code proof"
        description: |
          Write `cmd/backstop/exempt_audit_test.go`. It reaches the repo root
          through the existing `repoRoot(t)` helper and parses manifests through
          `packval.ParseManifest`, calling `packval.ExemptDecisionPending` so
          there is ONE definition of "a decision is owed" (TASK-004).

          THE CORPUS is every COMMITTED pack source in this repo — globbed
          `packs/*/pack.yml` (so deleting a stale pack directory shrinks the
          corpus instead of breaking the test) PLUS the one committed mirror of
          a released pack,
          `cmd/backstop/testdata/go-toolchain/.backstop/packs/backstop/go-toolchain/pack.yml`.
          Deliberately EXCLUDE the rest of `testdata/`: those are synthetic
          fixtures, not real engine declarations, and sweeping them in would
          drown the audit in noise.

          TestExemptAudit_EveryCommittedPackEngineHasAnIntentRow
            A table keyed `<pack source path>|<engine name>` gives every engine
            in the corpus a row carrying its scope kind, whether it declares the
            key, the intended value, and a WHY string. The test asserts, in both
            directions, that the table and the corpus agree exactly: an engine
            with no row FAILS (this is the ratchet — a newly added engine cannot
            join unaudited), and a row naming an engine that no longer exists
            FAILS (the record cannot outlive its subject). Each row's declared
            flag and value must match what the manifest actually says.
            (CLM-006)

            The WHY strings are the audit, and must carry the grounding, not a
            restatement: `golangci` cites ISSUE-070's delivered behaviour;
            `config-file` cites being the generic shape golangci instantiates;
            each file-args engine cites the by-construction argument; the
            go-toolchain fixture's `golangci` and `go-coverage` rows are marked
            PENDING an explicit declaration and name the follow-on that owns it
            (SE-3). (CLM-007)

          TestExemptAudit_PackCheckReportsAdvisoryAndExitsZero
            Drive the REAL `pack check` command against
            `cmd/backstop/testdata/exempt-decision-pack` the way the other
            command-level tests in this package do. Assert: the reported status
            is `pass`, the command returns NO error (exit 0), and the output
            carries an `exempt-scope-decision` advisory naming the fixture's
            project-wide engine. An advisory that blocks is the failure mode
            this pins (SE-5). (CLM-003)

            THIS ONE IS A GREEN-ON-ARRIVAL PIN, NOT A RED-FIRST TEST — do not
            try to observe it red, and do not "fix" anything if it passes on the
            first run. It depends on TASK-002 (the fixture) and TASK-005 (which
            already gated TASK-004's implementation), so by the time this task
            executes, both halves it exercises have landed and it CANNOT be red.
            That is not a TDD gap: CLM-003's genuine red-first falsification
            already lives in TASK-003's
            `TestExemptDecision_AdvisoryNeverFailsTheRun`, observed red before
            TASK-004 existed. What this test adds is END-TO-END reach — the real
            CLI command and its real exit code, which a package-level test on
            `FinalizeStatus` cannot cover. Its job is to LOCK the exit code
            against future regression, so run it and confirm green.

          Observe `TestExemptAudit_EveryCommittedPackEngineHasAnIntentRow` RED
          first. It must be red specifically because `packs/base-engines/pack.yml`'s
          `config-file` row expects an explicit declaration that TASK-007 has not
          made yet — capture that failure text; it is the falsification for
          CLM-008.
        files:
          - cmd/backstop/exempt_audit_test.go
        claims:
          - CLM-003
          - CLM-006
          - CLM-007
          - CLM-008
        test_names:
          - TestExemptAudit_EveryCommittedPackEngineHasAnIntentRow
          - TestExemptAudit_PackCheckReportsAdvisoryAndExitsZero
        depends_on:
          - TASK-002
          - TASK-005

      - id: TASK-011
        type: test
        title: "Red source-text pin forbidding an engine roster in the binding doc comment"
        description: |
          CLM-009 without this task is a comment-only edit with nothing stopping
          the identical silent rot from recurring the next time someone
          "helpfully" documents which engines declare what. This makes the
          de-enumeration ENFORCED rather than merely done.

          Write `pkg/pack/engine/exempt_doc_test.go`, in the SAME package as
          `binding.go` so it can read the source relatively. Follow the shipped
          precedent `TestPhase3_GoModTidyPreflightGone`
          (`pkg/packval/pack_declared_setup_test.go`), which does exactly this
          shape: `os.ReadFile` on a same-package source file, then
          `strings.Contains` over banned literals.

          TestExemptDoc_BindingCommentNamesNoEngine
            Read `binding.go`. Isolate ONLY the doc comment block attached to the
            `ExemptFromScopeFilter` field, anchoring on the field DECLARATION and
            never on a line number (SE-9).

            THE ANCHOR MUST EXCLUDE COMMENT LINES, OR IT SELECTS THE WRONG BLOCK.
            The string `ExemptFromScopeFilter` occurs TWICE in `binding.go`
            (measured 2026-08-17): once as the FIRST WORD of this field's own doc
            comment (Go doc convention — the comment opens `// ExemptFromScopeFilter,
            when true, ...`) and once as the actual field declaration ten lines
            below it. A naive first-match scan on the bare field name therefore
            hits the COMMENT line, walks backward, and collects the doc comment
            belonging to the PRECEDING field (`FieldContract`) instead — a block
            that names no engine, so the negative assertion passes vacuously,
            while the positive `ScopeKind` assertion fails with a confusing
            message pointing at entirely the wrong target.

            Anchor on the DECLARATION line specifically. Either is acceptable and
            both were verified to select uniquely:
              * the line whose TRIMMED text begins with `ExemptFromScopeFilter`
                AND does NOT begin with `//` (i.e. Go source, not prose); or
              * the yaml tag literal `yaml:"exempt_from_scope_filter"`, which
                occurs EXACTLY ONCE in the file.
            The target block is then the contiguous run of `//`-prefixed lines
            immediately ABOVE that declaration line, terminated upward by the
            first non-comment line (verified: the run ends at the preceding
            `FieldContract` field declaration).

            Assert that block contains none of the engine-name literals:
            `go-build`, `go-test`, `golangci`, `go-coverage`, `go-arch-lint`,
            `semgrep`, `ast-grep`, `sandbox`, `config-file`.

            THE BLOCK ISOLATION IS LOAD-BEARING, NOT TIDINESS. `binding.go`
            legitimately names engines and tools in OTHER doc comments — the
            `StrictSarif` comment cites the `golangci-lint` command-prefix sniff
            it replaced, and `PackageScoped` cites the `go test` sniff. A
            whole-file scan would therefore be permanently red for reasons this
            claim has no business touching, and the obvious "fix" would be to
            gut those unrelated, accurate comments. Scope to the one block.

            Assert positively too, so the test cannot be satisfied by deleting
            the comment outright: the block must still be non-empty and must
            still reference `ScopeKind` (the decoupling semantics it is required
            to state).

          Observe RED first: today that block reads "the go-build engine declares
          it true; golangci and go-test declare it false/unset", so `go-build`,
          `golangci` and `go-test` all hit. Capture that failure text — it is
          CLM-009's falsification, and it is also the direct evidence that the
          comment is wrong (`go-test` has declared `true` since ISSUE-129).
        files:
          - pkg/pack/engine/exempt_doc_test.go
        claims:
          - CLM-009
        test_names:
          - TestExemptDoc_BindingCommentNamesNoEngine
        depends_on:
          - TASK-006

      - id: TASK-007
        type: implementation
        title: "Record base-engines' own exempt decision explicitly"
        description: |
          In `packs/base-engines/pack.yml`, add
          `exempt_from_scope_filter: false` to the `config-file` engine binding —
          the only project-wide engine in a committed in-repo pack source — with
          a comment giving the reason, not just the value: `config-file` is the
          generic native-linter shape (a tool that runs its own built-in rules
          project-wide from one config file), `golangci` is its instance, and
          ISSUE-070 established that such findings on files outside the change
          MUST be filtered rather than red the gate. Leave `semgrep`, `ast-grep`
          and `sandbox` untouched — they are `file-args` and no decision is owed.

          This is a RECORDING change, not a behaviour change: `false` is the
          zero value the binding already resolved to. Prove that rather than
          asserting it — the embedded registry (`pkg/baseengines`, which reads
          this exact file through `backstopcore.BaseEnginesFS`) must resolve the
          `config-file` binding identically before and after:

            go test ./pkg/baseengines/... -race -count=1

          If any base-engines test changes behaviour, stop: something other than
          a recorded zero value was edited.
        files:
          - packs/base-engines/pack.yml
        claims:
          - CLM-006
