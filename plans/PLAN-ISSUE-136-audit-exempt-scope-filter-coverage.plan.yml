  THE MECHANISM THAT MAKES ALL OF THIS NON-BREAKING, stated so it is verified
  rather than silently true: warnings never reach a verdict on any of these
  paths. `Result.FinalizeStatus` keys status purely on `len(r.Errors)` (SE-5),
  and `runPackvalPipeline` (`pkg/pack/distribution/validator.go`, located by
  symbol) returns nil unless `result.Status` is the fail status — it reads the
  status and DISCARDS `result.Warnings` entirely. `engine-pack` in particular is
  consumed only through `ParseManifest` in unit tests, never through a
  warning-counting assertion.

  CONSEQUENCE FOR THE IMPLEMENTER: if a pre-existing packval or distribution test
  goes red on a WARNING COUNT after TASK-004, that is a real assertion this sweep
  missed — read it and report it, do NOT relax it. Adding an
  `exempt_from_scope_filter` key to an existing fixture to quiet the advisory is
  forbidden: those fixtures encode other checks' inputs, and silencing a correct
  advisory by editing its subject is the failure mode this plan exists to bound.

  ── WHY THIS IS NOT BAKED LANGUAGE/TOOL KNOWLEDGE ──────────────────────────
  ISSUE-136 Direction item 3 cautions that any such check "must be a pack rule,
  not baked core logic." The advisory added here names NO language, NO tool and
  NO engine: it reads `scope_kind` and `exempt_from_scope_filter`, which are
  backstop's OWN manifest vocabulary, exactly as `pkg/packval` phase 2 already
  reads `engine` (the `engine-resolve` check) and phase 5 reads the same field.
  It is manifest-schema validation, the same category as every other packval
  check, and it is where the audit's teeth have to live: `pack check` runs in
  the PACK AUTHOR's loop, including for packs in repositories this one will
  never see. A repo-scoped rule pack cannot reach those manifests. If a reviewer
  disagrees with this reading, that is a judgment call to escalate BEFORE
  implementing, not to route around.

  ── SHARP EDGES ────────────────────────────────────────────────────────────
  SE-1. THE ADVISORY PROMPTS; IT MUST NEVER DERIVE. SPEC-041 CLM-017 requires
        the exempt VALUE to be DECOUPLED from ScopeKind, and SPEC-041 REQ-004
        prohibits deriving it from any structural signal. This advisory keys on
        `scope_kind` to decide WHETHER A DECISION IS OWED, and never to decide
        WHAT THE DECISION IS: it accepts `true` and `false` identically, changes
        no binding value, and consults neither `gate_type` nor any engine name.
        CLM-004 exists to pin that distinction. Any implementation that infers a
        default, rewrites a binding, or special-cases a gate_type violates
        SPEC-041 and must be rejected.
  SE-2. DO NOT "FIX" `golangci`. Conclusion 3 above: its non-exempt state is
        ISSUE-070's shipped behaviour. This plan edits no go-toolchain manifest.
  SE-3. THE go-toolchain PACK IS EXTERNAL AND MIRRORED. Its released manifest
        lives in another repository and `cmd/backstop/testdata/go-toolchain/
        .backstop/packs/backstop/go-toolchain/pack.yml` is an in-repo fixture
        copy of it; the two must move together (that lockstep is exactly
        ISSUE-137's open hazard). This plan touches NEITHER. Adding the explicit
        `exempt_from_scope_filter: false` to `golangci` and `go-coverage` is a
        pack-manifest edit + version bump + tag + relock + fixture sync, and
        ISSUE-136 Direction item 2 says to file it as its own defect — the
        implementer MUST surface it as a follow-on rather than absorbing it.
        Consequently, after this plan lands, `pack check` on the go-toolchain
        pack WILL emit two advisories. That is the advisory working correctly on
        a genuinely un-recorded decision, and it is non-blocking. It is an
        expected outcome, not a regression, and must not be silenced.
  SE-4. `packs/base-engines` CANNOT BE `pack check`ed. Verified 2026-08-17:
        `go run ./cmd/backstop pack check packs/base-engines` fails phase 1 with
        "content is required" — it is an engines-only pack with no `content:`
        block. Its decision is therefore recorded by the census test (c), not by
        the advisory. Do not "fix" base-engines by inventing a content block.
  SE-5. THE ADVISORY MUST NEVER CHANGE AN EXIT CODE. `Result.FinalizeStatus`
        keys status purely on `len(r.Errors)`, and `cmd/backstop/pack_check.go`
        exits non-zero only on `result.Status == "fail"`. Emit into
        `PhaseResult.Warnings` ONLY. Never append to `Errors`.
  SE-6. A NIL DECLARED-KEY MAP IS A VACUOUS-GREEN TRAP. Key presence is knowable
        only from a parsed manifest; a `PackManifest` built as a Go literal in a
        test has no key record. The rule is: `ParseManifest` ALWAYS initialises
        the map (non-nil, possibly empty), so "not parsed" is distinguishable
        from "no keys declared", and CLM-005's test pins that invariant. Without
        it the advisory can silently never fire and still look green.
  SE-7. `RunCoherence` HARD-CODES ITS CHECK COUNT (`Checks: 6`, with a comment
        enumerating them). Adding a check without bumping it to 7 and extending
        that comment leaves the reported phase summary lying.
  SE-8. OTHER AGENTS ARE ACTIVE IN THIS WORKTREE. Do not run a bare
        `go test ./...` or `backstop gate --all` while another implementer is
        mid-flight; coordinate first or the readings are noise. Never invoke a
