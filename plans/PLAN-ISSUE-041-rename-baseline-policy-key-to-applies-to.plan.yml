        claims:
          - CLM-001
          - CLM-002
        depends_on: []

      - id: TASK-002
        type: test
        title: "Failing consumer + bridge tests: new-code grandfathers, all-code blocks total, absent defaults all-code, sources override, level orthogonal"
        description: |
          The pkg/gate + cmd/backstop half of the RED wave — the grandfathering
