      - id: TASK-003
        type: implementation
        title: "Rename Baseline -> AppliesTo on both DimensionPolicy structs, the bridge, and the two grandfathering decision sites"
        description: |
          Land the coordinated Go rename in one wave so the module compiles
          (go-toolchain builds ./... — a half-renamed module will not build).

          pkg/config/config.go — on `DimensionPolicy` (line 73) replace
          `Baseline bool \`yaml:"baseline,omitempty" json:"baseline,omitempty"\``
          with `AppliesTo string \`yaml:"applies-to,omitempty"
          json:"applies-to,omitempty"\``. The nested `Sources
          map[string]DimensionPolicy` is self-referential, so the rename covers
          the nested key automatically. Update the struct doc comment (lines
          58-70) to describe applies-to (new-code|all-code) instead of the
          baseline boolean; note the absent-key default is all-code.

          pkg/gate/policy.go — on `DimensionPolicy` (line 29) replace
          `Baseline bool` with `AppliesTo string`. Introduce the enum constants
          alongside the existing PolicyOff/Warn/Block block (lines 9-13), e.g.
          `AppliesToNewCode = "new-code"` and `AppliesToAllCode = "all-code"`.
          Change the two grandfathering decision sites to branch on new-code:
            - ApplyPolicy line 98: `if p.Baseline && baseline != nil` ->
              `if p.AppliesTo == AppliesToNewCode && baseline != nil`.
            - applyScopedPolicy line 167: `if eff.Baseline && baseline != nil`
              -> `if eff.AppliesTo == AppliesToNewCode && baseline != nil`.
          Absent/empty AppliesTo therefore falls through to counting ALL
          violations (all-code) — preserving the key-absent strict default
          (CLM-002). Update the doc comments at lines 15-31 and 124-133 to speak
          in applies-to terms (new-code grandfathers, all-code / absent blocks
          on total) rather than the baseline boolean.

          cmd/backstop/gate.go — the bridge at lines 311-315 that copies
          config.DimensionPolicy into gate.DimensionPolicy: replace
          `Baseline: p.Baseline` and the per-source `Baseline: sp.Baseline` with
          `AppliesTo: p.AppliesTo` / `AppliesTo: sp.AppliesTo` so the parser
          value flows through unchanged.

          This is a pure rename: NO change to grandfathering math, to
          CompareBaseline, to nil-baseline fail-loud, or to the Sources
          resolution — only the field name/type and the two conditionals.
          After this task the four Phase-1 test tasks (TASK-001, TASK-002)
          go green and the module compiles module-wide.
        files:
          - pkg/config/config.go
          - pkg/gate/policy.go
          - cmd/backstop/gate.go
        claims:
          - CLM-001
          - CLM-002
          - CLM-003
          - CLM-004
        depends_on:
