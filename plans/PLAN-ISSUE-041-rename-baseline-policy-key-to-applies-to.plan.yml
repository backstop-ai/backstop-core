  # ═══════════════════════════════════════════════════════════════════════
  - id: phase-1
    name: "Phase 1: TDD — Rename Baseline to applies-to Across Parser, Consumer, and Bridge"
    tasks:
      - id: TASK-001
        type: test
        title: "Failing parser tests: applies-to parses to new-code/all-code, absent defaults to all-code, nested sources override parses"
        description: |
          Update pkg/config/config_perpack_test.go to the new key and add the
          default-behavior assertions. This is the pkg/config half of the RED
          wave — it will not compile until TASK-004 renames the struct field,
          which is the intended TDD-red state.

          Rewrite the existing Baseline-referencing assertions (lines 48,49,56,
          57,69,70) to read `AppliesTo`:
            - pack_engines dimension default: AppliesTo == "new-code"
              (was baseline true), Level == "block".
            - the backstop/self-scoped override: AppliesTo == "all-code"
              (was baseline false — the zero-tolerance flip), Level == "block".
            - the unscoped coverage_threshold entry: AppliesTo == "new-code"
              (was baseline true), Level == "block".
          The fixture backstop.yml the test loads must use the new
          `applies-to:` key (new-code / all-code) so parsing is exercised
