notes: |
  ─────────────────────────────────────────────────────────────────────────
  WHAT THIS IS — a pure key rename, semantics-preserving
  ─────────────────────────────────────────────────────────────────────────
  Rename the ambiguous per-dimension enforcement key
  `enforcement.policy.<dim>.baseline: true/false` to an explicit
  `applies-to: new-code | all-code` enum (SonarQube New-Code/Overall-Code
  framing). The mechanism is UNCHANGED — only the field name and its value
  vocabulary change, and the schema is taught to describe the block it has
  silently carried since SPEC-047.

    baseline: true         -> applies-to: new-code  (grandfather pre-existing;
                                                     block only net-new — the ratchet)
    baseline: false/absent -> applies-to: all-code  (block on TOTAL; zero tolerance)

  `level` (off|warn|block) stays a SEPARATE orthogonal key: applies-to decides
  WHICH violations count, level decides WHAT happens once they do. They must
  not be merged (applies-to:new-code + level:warn is a valid combination).

  ─────────────────────────────────────────────────────────────────────────
  THE COUPLING THAT DRIVES PHASE SHAPE (verified in tree 2026-07-07)
  ─────────────────────────────────────────────────────────────────────────
  The field lives on TWO structs plus a bridge, and the go-toolchain pack
  builds/tests the WHOLE module (pack.yml: `project_target: "./..."`), so the
  module must COMPILE at every verification point — the rename cannot be
  verified one package at a time:
    - pkg/config/config.go:71-75 — `DimensionPolicy` (the parser struct), field
      `Baseline bool` with yaml/json tag `baseline`, plus its nested
      `Sources map[string]DimensionPolicy` self-reference (SPEC-047 REQ-007).
    - pkg/gate/policy.go:27-31 — a SECOND `DimensionPolicy` (the consumer
      struct; pkg/gate does NOT import pkg/config's type). Same `Baseline bool`
      + nested Sources. Grandfathering decision sites: `ApplyPolicy` line 98
      (`if p.Baseline && baseline != nil`, unscoped) and `applyScopedPolicy`
      line 167 (`if eff.Baseline && baseline != nil`, per-pack sources path).
    - cmd/backstop/gate.go:311-315 — the BRIDGE that copies
      config.DimensionPolicy -> gate.DimensionPolicy, reading `.Baseline` on
      BOTH sides (top-level and per-source). Renaming either struct alone
      breaks this line, so the module won't build until config + gate + bridge
      all land together — this is why the Go rename is ONE coordinated
      implementation task, not one-per-package.
    - Existing tests already assert `.Baseline` / `Baseline:` and must be
      updated to `AppliesTo` in the SAME wave or the module won't compile:
      pkg/config/config_perpack_test.go (48,49,56,57,69,70),
      pkg/gate/policy_test.go (33,34),
      pkg/gate/policy_perpack_test.go (20,22,168),
      cmd/backstop/bun_ratchet_flip_test.go (114,115,144,216). Per
      feedback_align_predating_artifacts these are UPDATED to the new key
      openly (in the Phase-1 test tasks), not worked around.

  ─────────────────────────────────────────────────────────────────────────
  SCHEMA GAP — fixed in the same change (issue Solution step 4)
  ─────────────────────────────────────────────────────────────────────────
  artifacts/backstop-yml/v1/schema.json has NO `policy` property under
  `enforcement` at all (verified: zero `polic` matches), despite `enforcement`
  declaring additionalProperties:false — the whole policy block is currently
  unvalidated. Phase 2 adds `enforcement.policy` describing: a per-dimension
  object with `applies-to` (enum new-code|all-code), `level` (enum
  off|warn|block), and a nested `sources` map whose values are that same
  object shape (the per-pack override). Both the top-level policy AND the
  nested sources override are in scope. Adding it with additionalProperties
  false makes the schema REJECT the legacy `baseline:` key and an unknown key,
  and ACCEPT the new `applies-to` form.

  ─────────────────────────────────────────────────────────────────────────
  MIGRATION — clean one-time cutover, no back-compat alias (Solution step 5)
  ─────────────────────────────────────────────────────────────────────────
  This repo is the only consumer of enforcement.policy today (pre-public,
  project_pack_distribution / project_launch_plan), so a dual-accepting
  `baseline:` shim is rejected: it would buy migration safety nobody needs and
  leave a dead alias + double-parse branch. The 5 committed backstop.yml
  entries are rewritten in the same change:
    contract_signature   baseline:true  -> applies-to:new-code
    coverage_threshold   baseline:true  -> applies-to:new-code
    pack_engines         baseline:true  -> applies-to:new-code
      sources.backstop/self baseline:false -> applies-to:all-code  (the
        zero-baked-checks non-negotiable — feedback_zero_baked_checks; the
        one entry easiest to miss in a mechanical find/replace)
    test_substantiveness baseline:true  -> applies-to:new-code
  (artifact_validation and test_verification carry no baseline key today —
  already all-code-equivalent — and only gain the schema-legal explicit form
  if touched; leaving them bare stays valid since applies-to is optional and
  defaults to all-code.)

  ─────────────────────────────────────────────────────────────────────────
  DEFAULT SEMANTICS — the safety invariant that must NOT drift (step 2)
  ─────────────────────────────────────────────────────────────────────────
  An absent `applies-to` key (or an absent policy entry entirely) MUST resolve
  to all-code (block on total), matching today's key-absent = block-on-total
  strict default. The rename must not silently turn a bare dimension into a
  grandfathered one. new-code is opt-in; all-code is the floor.

  ─────────────────────────────────────────────────────────────────────────
  VERIFICATION COMMANDS
  ─────────────────────────────────────────────────────────────────────────
  Middle-phase verification runs `backstop code check` — with go-toolchain's
  `project_target: "./..."` this builds+tests the whole module, so it both
  proves the coordinated rename compiles module-wide and runs the touched
  pkg/config, pkg/gate, and cmd/backstop unit tests (the issue's
  `go test ./pkg/config/... ./pkg/gate/... -run Policy` is subsumed). The
  change touches BOTH .go files AND artifact/config files (schema.json,
  backstop.yml), so the FINAL phase runs the full `backstop gate` kill chain
  PLUS `backstop artifact validate`. The acceptance bar is a PURE RENAME:
  `backstop gate`'s pass/fail verdict on the current tree — every
  policy-governed dimension (contract_signature, coverage_threshold,
  pack_engines including the backstop/self scoped override,
  test_substantiveness) — must be byte-for-byte the same grandfathering
  behavior as before the rename.

  ─────────────────────────────────────────────────────────────────────────
  CLAIMS (enumerated from the issue's Solution steps + Verification; issue has
  no formal CLM frontmatter — status-gated. Every task maps >=1; every claim
  mapped by >=1 task.)
  ─────────────────────────────────────────────────────────────────────────
  CLM-001 — Both DimensionPolicy structs (pkg/config/config.go:73 parser,
            pkg/gate/policy.go:29 consumer) AND the cmd/backstop/gate.go bridge
            rename `Baseline bool` -> `AppliesTo string` with yaml/json tag
            `applies-to` and enum values "new-code"/"all-code", covering the
            nested Sources.<pack> entries on both structs (not just the
            top-level field).
  CLM-002 — An absent `applies-to` key (or an absent policy entry) resolves to
            all-code (block on total) — today's key-absent strict default is
            preserved and does NOT silently change; `applies-to: new-code`
            grandfathers pre-existing findings (net-new only).
  CLM-003 — ApplyPolicy (unscoped, line 98) and applyScopedPolicy (per-pack
            sources, line 167) branch on `AppliesTo == "new-code"` in place of
            `Baseline == true`, producing byte-identical grandfathering
            behavior — including the nil-baseline fail-loud path.
  CLM-004 — `level` stays a SEPARATE orthogonal key: a dimension can be
            applies-to:new-code + level:warn (surface net-new without failing)
            just as validly as applies-to:all-code + level:block; the two are
            never merged or conflated.
  CLM-005 — enforcement.policy is ADDED to backstop-yml/v1/schema.json (closing
            the pre-existing gap): per-dimension object with `applies-to` enum
            (new-code|all-code), `level` enum (off|warn|block), and a nested
            `sources` map of the same shape; the schema now REJECTS an unknown
            / legacy `baseline:` policy key and ACCEPTS the new `applies-to`
            form.
  CLM-006 — The 5 committed backstop.yml policy entries are migrated
            baseline -> applies-to in a clean one-time cutover (no back-compat
            alias, no dead double-parse branch remains);
            pack_engines.sources.backstop/self maps to applies-to:all-code,
            preserving backstop/self's zero-tolerance on its own dogfood
            dimension.
  CLM-007 — The full `backstop gate` verdict on the current tree is UNCHANGED
            after the rename (pure rename, same semantics): contract_signature,
            coverage_threshold, pack_engines (+ the backstop/self override),
            and test_substantiveness resolve to the same grandfathering
            outcome as before; no dimension's pass/fail flips.

phases:
  # ═══════════════════════════════════════════════════════════════════════
  # Phase 1: Coordinated Go rename — Baseline -> AppliesTo across both structs
