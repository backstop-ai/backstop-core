          its existing "already reported by the verification step" comment, then the
          scope filter), then append to an `eligible []gate.MandatedTest` when
          gate.JoinEligibleForNoTarget(mt, testFileColocatedWithTarget(mt.FilePath,
          mt.TargetPkg)) is true. Order matters: an out-of-scope or unresolved test
          must never inflate the eligible count, or a diff-scoped run could refuse
          over tests it was not even looking at.

          THE REFUSAL. Immediately after pass 1:
            if v, refuse := gate.SubstantivenessEvidenceRefusal(len(eligible), len(extraction), len(hollow)); refuse {
                return gate.StepResult{
                    StepName:   gate.StepTestSubstantiveness,
                    Status:     "fail",
                    ConfigErr:  true,
                    Violations: []gate.Violation{v},
                }
            }
          Pass `len(hollow)` — the ROUTED partition length, NOT len(violations) (the
          scope-filtered hollow violations). Refusing is the drastic action, so any
          pack output at all, even for a file this run is not looking at, must block
          it. Comment that choice; a later reader "tidying" it to the filtered count
          makes the refusal MORE likely to fire, which is the wrong direction.

          WHAT THIS RETURN DISCARDS (CLM-004) — and precisely how much: the return
          drops whatever is in `violations`, which at this point can only be
          scope-filtered hollow violations. But the refusal requires len(hollow) == 0,
          and a scope filter cannot manufacture violations out of an empty partition —
          so on the refusal path `violations` is provably EMPTY, so no HOLLOW verdict
          is lost. The per-test noTarget verdicts pass 2 would have raised are declined
          by design; under the bare-helper-assertion shape (Residual 2) they can be
          true, which is why the refusal message names that as a candidate cause. Say
