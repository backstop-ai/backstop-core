  ── THE REGRESSION FIXTURE, AND WHY IT NEEDS A CONTROL ────────────────────
  A test that only shows "one violation after the fix" proves nothing — a step that
  always returned one violation would pass it. The fixture is therefore a THREE-WAY
  proof over the SAME workspace and the SAME real dispatch path:
    control  UNPATCHED pack           → 0 violations   (the tests are genuinely fine)
    before   ZERO-MATCH pack, pre-fix → 3 noTarget violations, all FALSE
    after    ZERO-MATCH pack, post-fix→ exactly 1 refusal, ConfigErr true
  The control is what makes the middle row a proven FALSEHOOD rather than an assertion
  about it, and it is the reason the fixture's tests must genuinely call their target
  package. Three mandated tests (not one) is also load-bearing: the whole defect is
  "N misleading violations instead of 1", and N must be > 1 for the fix to be visibly
  a collapse rather than a rewording.

  RE-OBSERVE THE RED. Every assertion below was reasoned from the code, NOT measured.
  Run the tests against unmodified production code and record the actual failures
  before touching either production file. A test written after the fix and never seen
  failing is worth nothing here.

  ── CLAIM LEDGER (ISSUE-113 carries no CLM ids; this lane defines them) ────
    CLM-001  JoinEligibleForNoTarget is DEFINED as the noTarget decision table
             evaluated against an EMPTY ReferencedSymbolSet — a test is join-eligible
             iff empty evidence would make it raise. No predicate (FilePath, absence,
             TargetPkg, same-package) is restated anywhere else.
    CLM-002  SubstantivenessEvidenceRefusal returns exactly ONE violation when the
             join-eligible count is >= 1 AND the extraction count is 0 AND the hollow
             count is 0, and returns NO refusal when any one of those fails — in
             particular it does NOT refuse when hollow evidence exists, because a pack
             that emitted hollow findings demonstrably ran and demonstrably classified
             test files, and refusing would destroy those true findings.
    CLM-003  the refusal message states the observed fact (the pack produced no
             substantiveness findings of any kind) and names ALL THREE candidate causes
             without asserting any one of them — its engine did not run, OR its
             classification matched 0 test files, OR the scanned tests genuinely make no
             package-qualified calls while still satisfying the pack's assertion
             vocabulary (in which case the declined verdicts were true). It also reports
             the join-eligible count and states that the step is refusing INSTEAD OF
             reporting that many "does not call package" violations. There is exactly
             ONE message; no hollow-count fork, and the substring "hollow" never appears
             in it.
    CLM-004  the production step SHORT-CIRCUITS on refusal: it returns the single
             refusal violation with ConfigErr true and ZERO per-test noTarget
             violations. Because the refusal requires hollow == 0, the short-circuit
             provably discards NO hollow verdict; the observable boundary is that a run
             with hollow evidence present does NOT refuse and its hollow violations
             survive and are reported normally.
    CLM-005  end-to-end regression over the REAL dispatch path: a substantiveness pack
             whose referenced-symbol rule classification matches zero test files, over
             a workspace with three mandated tests, yields three false "does not call
             package gate" violations before the fix and exactly one config-error
             refusal after.
    CLM-006  non-vacuity control: the SAME workspace run against the UNPATCHED pack
             yields ZERO violations, proving the three pre-fix violations were false
             and that the refusal is not masking genuine ones.
    CLM-007  non-regression: with evidence present in EITHER channel, the noTarget
             join, hollow conversion, scope filtering and the `kind: absence` skip
             behave exactly as before, and the refusal does not fire — pinned
             exhaustively over the (eligible, extraction, hollow) space so that refusal
             holds if and only if eligible >= 1 && extraction == 0 && hollow == 0. This
             is what mechanically prevents the (a)&&(b)-only false refusal from being
             reintroduced by a later "simplification".
    CLM-008  the refusal is structurally unsuppressible: because ConfigErr halts the
             run at this step, waiver_resolution never executes and ApplyPolicy skips
             the step, so no inline waiver and no baseline entry can silence it.

  ── VERIFICATION COMMANDS ──────────────────────────────────────────────────
    inner: go build ./... &&
           go test ./pkg/gate/... ./cmd/backstop/... -race -count=1
    full:  go test ./... -race -count=1
    gate:  ./bin/backstop gate                        (diff-scoped inner loop)
           ./bin/backstop gate --all                  (full kill chain)
           ./bin/backstop artifact validate --plan PLAN-ISSUE-113
           ./bin/backstop artifact validate --issue ISSUE-113

  ── ENVIRONMENT / TOOLING FACTS ────────────────────────────────────────────
  1. `backstop code check` DOES NOT EXIST. The shipped top-level commands are
     artifact, baseline, commands, completion, gate, help, pack, recipe, version,
     waiver. `go test` is the inner loop; `./bin/backstop gate` is the outer one.
  2. ast-grep must be on PATH for the e2e tests. They sit behind the existing
     fail-loud guards (requireAstGrepE2E). NEVER convert one to t.Skip — a skipped
     real-engine test is silent vacuous green, and this package says so already.
  3. REBUILD bin/backstop BEFORE ANY GATE RUN. A stale binary gates the OLD step and
     reports a green that proves nothing about this change.
  4. Report TRUE exit codes (`echo $?`); never mask a non-zero behind a pipe.
  5. `installSubstantivenessLocalPack`'s receiver and signature are PINNED — four
     existing call sites in gate_substantiveness_e2e_test.go depend on that exact
     shape. ADD a sibling method; do not change it.

phases:
  - id: phase-1
    name: "Phase 1: Red-first, then refuse instead of mass-joining"
    tasks:
      - id: TASK-001
        type: setup
        title: "Zero-match harness: a workspace with three real mandated tests and an installable pack whose Q2 classification matches nothing"
        description: |
          Extend cmd/backstop/gate_substantiveness_e2e.go with the fixture machinery
          TASK-003 drives. Production code is NOT touched here and no assertions are
          written here — this task exists so the e2e test file and the join fix can be
          authored in parallel against a settled harness shape.

          Add TWO things, both as siblings of the existing helpers. Do NOT modify
          newE2EWorkspace or installSubstantivenessLocalPack — four existing call sites
          in gate_substantiveness_e2e_test.go depend on their current shape (their doc
          comment says so explicitly).

          (1) newZeroMatchE2EWorkspace(tmp string) (*e2eWorkspace, error)

          Mirrors newE2EWorkspace's structure (same backstop.yml `project: e2e` +
          `packs: {}`, same specs/ dir) but writes:
            • ONE spec, specs/zeromatch.spec.md, status `implemented`,
              implementation.package `pkg/gate` (so the reduced target token is
              `gate`, matching TargetPackageName's last-segment reduction), mandating
              THREE tests across three claims:
                TestZeroMatchAlpha, TestZeroMatchBravo, TestZeroMatchCharlie
              Copy the frontmatter shape of newE2EWorkspace's spec verbatim and add
              CLM-002/CLM-003 with their own `tests:` entries. `implemented` status is
              REQUIRED — ContractsAreDue filters anything else out and the workspace
              would silently have zero due tests.
            • THREE *_test.go files at the workspace ROOT (subject_alpha_test.go,
              subject_bravo_test.go, subject_charlie_test.go), each of this shape:

                package sample_test

                import "testing"

                // Genuinely substantive AND genuinely calls its target package:
                //   - gate.Build() is a package-qualified call, so the pack's Q2
                //     referenced-symbol rule extracts symbol=gate and the noTarget
                //     set-join is SATISFIED when the pack works. This is what makes
                //     the zero-match run's violations provably FALSE (CLM-006).
                //   - t.Fatalf matches the Q1 hollow rule's assertion vocabulary
                //     regex, so these tests are NOT hollow and the hollow partition
                //     stays EMPTY. This is STRUCTURALLY load-bearing, not count
                //     hygiene: the refusal requires hollow == 0 (condition (c)), so
                //     one hollow test in this workspace would BLOCK the refusal and
                //     TASK-003's falsifier would never fire. Removing t.Fatalf does
                //     not weaken this fixture — it disables it.
                func TestZeroMatchAlpha(t *testing.T) {
                    if gate.Build() == "" {
                        t.Fatalf("Build returned empty")
                    }
                }

              Root placement is load-bearing: filepath.Base(filepath.Dir(path)) for a
              root-level file is not "gate", so testFileColocatedWithTarget is false
              and the tests are genuinely join-eligible. Putting them in a `gate/`
              subdirectory would make them same-package and silently disable the whole
              fixture.
              These files never compile or run as Go — they are ast-grep INPUT only,
              which is why an unresolved `gate` import is fine (newE2EWorkspace's
              existing fixture calls an undefined doSubject() for the same reason).
              Say this in the harness comment.

          (2) (w *e2eWorkspace) installZeroMatchSubstantivenessPack(repoRoot string) error

          Installs a PATCHED COPY of packs/substantiveness through the SAME real
          newProductionAddCommand() path installSubstantivenessLocalPack uses:
            • recursively copy substantivenessSourceDir(repoRoot) into a temp dir
              beside w.root (NEVER mutate the in-repo pack source — a test that edits
              packs/substantiveness would corrupt this repo's own dogfood install);
            • in the copy, rewrite ast-grep/rules/referenced-symbol-go.yml to add a
              `files:` restriction naming a path that exists nowhere in the workspace,
              e.g. `files: ["harness/fixtures/**/*.go"]`. That is the bclabs-portal
              defect verbatim: a real, valid, installable pack whose Q2 classification
              globs are baked to the pack author's own harness layout;
            • leave hollow-test-go.yml, sgconfig.yml, the convert script and pack.yml
              UNTOUCHED, so the engine still runs, still exits 0, and the pack still
              passes `pack check`/`pack test` on install. The point of this fixture is
              a HEALTHY-LOOKING pack producing zero Q2 evidence — not a broken install.
          Set w.installed/w.installInfo exactly as the existing method does.

          WHY THE PATCHED PACK STILL PASSES `pack test` (the real reason — an earlier
          revision of this plan stated a wrong one, so do not re-derive it from
          intuition): it is NOT that the patched rule's fixtures still match. It is
          that packval NEVER RUNS THESE FIXTURES AT ALL. packval's own Rule struct
          reads the YAML key `file` (pkg/packval/manifest.go:78), while
          packs/substantiveness/pack.yml declares `rule_path:` for both rules — so
          `rule.File == ""` and every fixture-execution site in
          pkg/packval/phase3.go (:31, :62, :76) is guarded behind `rule.File != ""`
          and skipped. The install therefore cannot notice the patch. This underlying
          pack-validation hole is ALREADY TRACKED as ISSUE-092 ("Pack Test Phase3
          Fixtures Cannot Fail", open, well-evidenced). This lane does NOT fix it and
          must not try to — cite ISSUE-092 in the harness comment and move on.

          Header-comment WHY this fixture breaks globs rather than PATH: ISSUE-112
          owns the missing-tool root cause, and a tool-present fixture stays valid and
          red-provable on both sides of that lane's fix.
        files:
          - cmd/backstop/gate_substantiveness_e2e.go
        claims:
          - CLM-005
          - CLM-006
        depends_on: []

      - id: TASK-002
        type: test
        title: "Unit pins for the eligibility predicate and the refusal decision (RED)"
        description: |
          Create pkg/gate/substantiveness_zero_evidence_test.go. It must FAIL before
          TASK-004 — the two functions under test do not exist yet, so the package will
          not compile; RECORD THAT as the red and re-run for a real assertion failure
          once TASK-004 lands. Runs in parallel with TASK-001 and TASK-003 (disjoint
          files, no dependency between them).

          TestJoinEligibleForNoTarget_MatchesTheNoTargetDecisionTable (CLM-001)
            Table-driven over the FOUR dispositions the decision table already
            distinguishes, asserting eligibility agrees with "would raise on empty
            evidence" in every one:
              • ordinary test, TargetPkg "gate", samePackage false      → eligible
              • TargetPkg "" (the empty-subject skip)                   → NOT eligible
              • samePackage true                                        → NOT eligible
              • IsAbsence true (the ISSUE-035 Category 2 skip)          → NOT eligible
            For each row ALSO call NoTargetViolationForTest(mt, ReferencedSymbolSet{},
            samePackage) directly and assert the two agree. That cross-check is the
            point of the test: it is what mechanically prevents the predicate from
            drifting away from the table it guards, and it stays meaningful if a fifth
            disposition is ever added.

          TestSubstantivenessEvidenceRefusal_FiresOnlyOnStarvedJoin (CLM-002)
            Table-driven over (eligible, extraction, hollow):
              • (3, 0, 0)  → refusal
              • (1, 0, 0)  → refusal          (one eligible test is enough)
              • (0, 0, 0)  → NO refusal       (nothing would have been raised)
              • (0, 0, 5)  → NO refusal
              • (3, 1, 0)  → NO refusal       (extraction exists; the join is honest)
              • (3, 0, 2)  → NO refusal       ← THE B1 ROW. Hollow evidence proves the
                pack ran and classified test files, so this is NOT a zero-match
                classification and refusing would delete two real hollow violations.
                Name the row `hollow_evidence_blocks_refusal` and comment it with the
                measured case it guards: the shipped `newE2EWorkspace` fixture
                (eligible 1 / extraction 0 / hollow 1) whose refusal would break
                TestE2E_SubstantivenessInstalledLocalPack_RealGate_HollowRed.
              • (3, 7, 2)  → NO refusal
              • (1, 0, 1)  → NO refusal       (the newE2EWorkspace shape exactly)
            Assert the returned Violation's Rule == StepTestSubstantiveness (this file
            is `package gate` — NO `gate.` qualifier) and Severity == "error" on the
            refusal rows, and that the zero-value Violation is returned on the others.

          TestSubstantivenessEvidenceRefusal_MessageNamesTheCause (CLM-003)
            ONE message; there is no hollow-count fork (condition (c) removed the
            second variant's whole reachable state). Drive (3, 0, 0) and assert the
            message:
              • contains the eligible count "3";
              • states the observed fact — that the pack produced no substantiveness
                findings of any kind;
              • names ALL THREE candidate causes, with a SEPARATE substring assertion
                per cause so that dropping any one of them fails this test:
                  (1) the engine having not run;
                  (2) the classification having matched 0 test files;
                  (3) the tests genuinely making no package-qualified calls despite
                      satisfying the pack's assertion vocabulary.
                Cause (3) is the bare-helper-assertion case, where the refusal is
                suppressing TRUE noTarget verdicts; naming it is the only mitigation
                available for that residual, so its pin is not optional garnish.
                Comment the row with the empirically-verified example
                (`assertEqual(t, got, "x")` → zero findings from BOTH rules) so a future
                editor who deletes the cause knows what they are hiding.
              • states that the step is refusing INSTEAD OF reporting per-test "does
                not call package" violations.
            Assert on stable substrings, not the whole sentence — the wording is meant
            to be improvable without breaking the pin. ALSO assert the message does NOT
            contain "hollow": a message mentioning hollow findings would describe a
            state that can no longer refuse, and its reappearance is the regression
            this catches. Note in a comment that cause (3) must therefore be worded
            without that substring — the two assertions are compatible by design, and if
            they ever conflict it is the WORDING that gives, never the pin.
        files:
          - pkg/gate/substantiveness_zero_evidence_test.go
        claims:
          - CLM-001
          - CLM-002
          - CLM-003
        depends_on: []
        test_names:
          - TestJoinEligibleForNoTarget_MatchesTheNoTargetDecisionTable
          - TestSubstantivenessEvidenceRefusal_FiresOnlyOnStarvedJoin
          - TestSubstantivenessEvidenceRefusal_MessageNamesTheCause

      - id: TASK-003
        type: test
        title: "End-to-end regression: N false violations collapse to ONE refusal over the real dispatch path (RED)"
        description: |
          Create cmd/backstop/gate_substantiveness_zero_match_e2e_test.go, driving
          TASK-001's harness. It must FAIL before TASK-005 — run it and RECORD THE
          ACTUAL FAILURE (expect three "does not call package gate" violations and
          ConfigErr false) before touching cmd/backstop/gate.go.

          Reuse the harness in-package; build NO parallel one and hand-construct NO
          violations. Every test calls requireAstGrepE2E(t) first — the fail-loud
          engine guard. NEVER downgrade it to t.Skip.

          TestE2E_ZeroMatchClassification_ControlPackReportsNoViolations (CLM-006,
          THE NON-VACUITY CONTROL — write and run this FIRST, and note that unlike
          the other two it is GREEN on both sides of the fix, which is exactly its
          job). newZeroMatchE2EWorkspace + the EXISTING
          installSubstantivenessLocalPack (unpatched pack) +
          runProductionSubstantivenessStep. Assert:
            • Status == "pass" and len(Violations) == 0;
            • ConfigErr is false.
          If this test is red, the fixture is wrong (bad target token, tests placed
          same-package, hollow bodies, ast-grep not seeing the files) and the other
          two tests below prove NOTHING. Fail with the full violation dump so the
          cause is readable, and say in a comment that a red here invalidates the
          rest of the file.

          TestE2E_ZeroMatchClassification_RefusesInsteadOfPerTestViolations (CLM-005,
          THE FALSIFIER). Same workspace, but installZeroMatchSubstantivenessPack.
          Assert, in this order, so a reader can tell WHICH hop broke:
            1. len(Violations) == 1. Pre-fix this is 3 and the red lands here —
               dump all three, including their messages, so the recorded failure
               literally shows the false "does not call package gate" wall this
               issue is about.
            2. that violation's Message does NOT contain "does not call package".
            3. res.ConfigErr is true.
            4. Status == "fail".
            5. the Message names the cause: contains "3" (the join-eligible count) and
               names the pack having produced no findings of any kind. Note in a
               comment that these fixtures are deliberately NON-hollow, so hollow == 0
               and condition (c) is satisfied — that is WHY the refusal is reachable
               here at all. If this assertion fails on the count while assertions 1-4
               pass, suspect a hollow finding leaking into the workspace (a fixture
               body that lost its t.Fatalf), not the message wording.
          Expected pre-fix red: three violations, each "test function TestZeroMatchX
          does not call package gate", ConfigErr false.

          TestE2E_ZeroMatchClassification_RefusalIsNotWaivable (CLM-008). Feed the
          zero-match step result into a waiver-enabled gate the way
          gate_substantiveness_waiver_e2e_test.go already does — gate.New with
          WithSteps([the step result, gate.StepWaiverResolutionScopedFunc(nil)]) and
          WithWaiver(reader, nil, now) — with a reader supplying a syntactically valid
          @waiver:test_substantiveness token. Assert:
            • Run returns exit code 2;
            • the returned GateResult contains NO waiver_resolution step at all (the
              ConfigErr halt breaks the loop before it runs) and len(ActiveWaivers)
              == 0;
            • the refusal violation is still present in the substantiveness step.
          Copy the LineReader / waiver-reader shape from the existing waiver e2e file
          rather than inventing one. Pre-fix this is red because the step never sets
          ConfigErr, so the run continues and exits 1.
        files:
          - cmd/backstop/gate_substantiveness_zero_match_e2e_test.go
        claims:
          - CLM-005
          - CLM-006
          - CLM-008
        depends_on:
          - TASK-001
        test_names:
          - TestE2E_ZeroMatchClassification_ControlPackReportsNoViolations
          - TestE2E_ZeroMatchClassification_RefusesInsteadOfPerTestViolations
          - TestE2E_ZeroMatchClassification_RefusalIsNotWaivable

      - id: TASK-008
        type: test
        title: "The refusal BOUNDARY end-to-end: hollow evidence blocks the refusal and its violations survive (RED)"
        description: |
          Create cmd/backstop/gate_substantiveness_refusal_boundary_e2e_test.go. This
          is the task that makes CLM-004's distinctive behavior observable rather than
          asserted, and it is the standing regression guard against the false refusal
          the (a)&&(b)-only condition would have shipped. Runs in parallel with
          TASK-003 (disjoint file, both drive TASK-001's harness).

          It needs NO new fixture: the ALREADY-SHIPPED newE2EWorkspace
          (cmd/backstop/gate_substantiveness_e2e.go) has exactly the shape required —
          one root-level hollow mandated test against target package `gate`, giving
          eligible 1 / extraction 0 / hollow 1. Do not build a variant of it.

          Call requireAstGrepE2E(t) first in every test. NEVER downgrade to t.Skip.

          TestE2E_HollowEvidenceBlocksZeroMatchRefusal (CLM-004, CLM-007) —
          newE2EWorkspace + installZeroMatchSubstantivenessPack (the PATCHED, Q2-starved
          pack from TASK-001), then runProductionSubstantivenessStep. This is the
          adversarial pairing: the Q2 classification matches nothing (the ISSUE-113
          trigger) but the Q1 rule still fires. Assert, in this order:
            1. res.ConfigErr is FALSE — the refusal must NOT fire;
            2. hasSubstantivenessHollowViolation(res) is TRUE — the real hollow
               violation SURVIVED and was reported, not swallowed by a short-circuit;
            3. no violation's Message contains the refusal's stable substring;
            4. Status == "fail" (the hollow finding still blocks — this is a RED gate
               reporting a true finding, which is the whole point).
          Comment the measurement this pins: under the rejected (a)&&(b)-only
          condition this run refuses, discards the hollow violation, and breaks
          TestE2E_SubstantivenessInstalledLocalPack_RealGate_HollowRed
          (gate_substantiveness_e2e_test.go:49, mandated by
          specs/SPEC-037-traceability-substantiveness-pack.spec.md:621) plus
          TestE2E_SubstantivenessUninstalled_NoVacuousGreen's cross-check (:76/:99,
          mandated at :632). Name both tests in the comment so a future editor who
          weakens condition (c) is told exactly what they are about to break.

          TestE2E_HollowEvidenceBlocksRefusal_IsNotVacuous (CLM-004) — the control that
          keeps the test above honest. SAME workspace, SAME patched pack, but assert
          the Q2 starvation is REAL: at least one violation whose Message contains
          "does not call package" is present.

          STATE THE RATIONALE PRECISELY IN THE FILE COMMENT — this is ROBUSTNESS, not
          detection, and an earlier revision of this plan got it wrong in a way worth
          not repeating. It is NOT true that "without this control the test above would
          pass identically against an unpatched pack": newE2EWorkspace's test body is
          `doSubject()`, an unqualified call, which produces NO Q2 extraction finding
          even under the UNPATCHED pack. For THIS workspace the patch changes nothing
          observable, so this control cannot detect whether the pack was patched. What
          the patched pack buys is that extraction == 0 is a STRUCTURAL guarantee — true
          regardless of what newE2EWorkspace's body happens to contain — rather than an
          accident of that one fixture's body. If a future edit changes newE2EWorkspace's
          test body to something that WOULD produce a Q2 match, the boundary cell this
          file pins (eligible 1 / extraction 0 / hollow 1) stays put.
          And say what this control actually proves: that Q2 starvation is genuinely
          reproducible in THIS run — the join really did come up empty and really did
          raise a noTarget verdict — not that "the patch took effect". Pinning the
          reproduction is what stops the test above from going green because the join
          stopped running at all.
          (The unpatched-pack control for this workspace is already shipped as
          TestE2E_SubstantivenessInstalledLocalPack_RealGate_HollowRed — do not
          duplicate it here; reference it in a comment instead.)

          Pre-fix RED: both tests fail to compile/behave only insofar as TASK-005 has
          not landed; before TASK-005 the step never sets ConfigErr, so assertion 1
          passes vacuously. RECORD THAT. Re-run BOTH tests after TASK-005 lands — this
          file's real value is post-fix, and the implementer must confirm it is green
          for the right reason (ConfigErr false because hollow > 0, not because the
          refusal does not exist yet). State that explicitly in the file header.
        files:
          - cmd/backstop/gate_substantiveness_refusal_boundary_e2e_test.go
        claims:
          - CLM-004
          - CLM-007
        depends_on:
          - TASK-001
        test_names:
          - TestE2E_HollowEvidenceBlocksZeroMatchRefusal
          - TestE2E_HollowEvidenceBlocksRefusal_IsNotVacuous

      - id: TASK-009
        type: test
        title: "Non-regression pins: the join is untouched under evidence, and the refusal boundary is exhaustive (RED)"
        description: |
          Create pkg/gate/substantiveness_join_nonregression_test.go — CLM-007's
          dedicated home, so the claim rests on its own pins rather than leaning on the
          pre-existing E2E suite. Runs in parallel with TASK-001/002/003/008 (disjoint
          files, no dependency between them). It will not compile until TASK-004 adds
          SubstantivenessEvidenceRefusal; RECORD that as the red and re-run for a real
          assertion result once TASK-004 lands.

          TestSubstantivenessEvidenceRefusal_ExhaustiveBoundary (CLM-007, CLM-002)
            Sweep eligible, extraction, hollow each over 0..3 (64 combinations) and
            assert, for EVERY combination:
              refused == (eligible >= 1 && extraction == 0 && hollow == 0)
            Write the expected side as that expression literally, so the test states
            the boundary rather than enumerating it. This is the pin that mechanically
            prevents condition (c) from being dropped as a "redundant" term by a later
            simplification — the exact regression this plan revision exists to close.
            On failure, print the triple so the offending cell is readable.

          TestNoTargetJoinUnchangedUnderEvidence (CLM-007)
            The noTarget decision table with a NON-empty ReferencedSymbolSet still
            behaves exactly as documented at
            pkg/gate/substantiveness_join.go:63-94 — target in set → satisfied; target
            absent from a non-empty set → raised; samePackage → satisfied; empty
            targetPkg → skipped. TASK-004 adds functions to this file and must change
            none of this.

          TestAbsenceSkipAndHollowConversionUnchanged (CLM-007)
            • NoTargetViolationForTest with mt.IsAbsence true still skips even when the
              referenced set is non-empty and the target is absent (the ISSUE-035
              Category 2 behavior).
            • HollowFindingsToViolations still forwards File and, critically, Line —
              the ISSUE-116 regression this file's header warns about. A refusal added
              nearby must not re-zero it.
        files:
          - pkg/gate/substantiveness_join_nonregression_test.go
        claims:
          - CLM-002
          - CLM-007
        depends_on: []
        test_names:
          - TestSubstantivenessEvidenceRefusal_ExhaustiveBoundary
          - TestNoTargetJoinUnchangedUnderEvidence
          - TestAbsenceSkipAndHollowConversionUnchanged

      - id: TASK-004
        type: implementation
        title: "The eligibility predicate and the refusal decision, in the language-agnostic join"
        description: |
          Add TWO exported functions to pkg/gate/substantiveness_join.go, siting them
          immediately after NoTargetViolationForTest so a reader meets the guard right
          after the table it guards. Change NOTHING else in the file — NoTargetViolation,
          NoTargetViolationForTest, RouteSubstantivenessFindings, ReferencedSetForTest,
          IsTestHollow and HollowFindingsToViolations keep their current behavior
          exactly (CLM-007). This file stays pure string/set logic with no I/O, no pack
          knowledge and no language knowledge; both additions honor that.

          func JoinEligibleForNoTarget(mt MandatedTest, samePackage bool) bool
            Implemented AS the decision table, not as a copy of its predicates:
              _, raised := NoTargetViolationForTest(mt, ReferencedSymbolSet{}, samePackage)
              return raised
            Doc-comment WHY (CLM-001): "join-eligible" means precisely "an EMPTY
            evidence set would make this test raise", so the guard and the loop can
            never disagree about which tests are at stake. Anyone who replaces this
            with an explicit FilePath/absence/TargetPkg/same-package conjunction has
            re-opened the drift this construction closes — say that in the comment.
            Note that FilePath is NOT part of the table and is filtered by the caller
            before this is consulted.

          func SubstantivenessEvidenceRefusal(eligible, extraction, hollow int) (Violation, bool)
            Returns (Violation{}, false) unless ALL THREE hold: eligible >= 1 AND
            extraction == 0 AND hollow == 0. On refusal returns ONE Violation with
            Rule: StepTestSubstantiveness, Severity: "error", and a SINGLE message
            (there is no hollow-count fork) along these lines:
              the substantiveness pack produced no findings of any kind while
              <eligible> mandated tests were join-eligible — its engine did not run, its
              classification matched 0 test files, or those tests genuinely make no
