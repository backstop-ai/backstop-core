      - id: TASK-004
        type: implementation
        title: "The eligibility predicate and the refusal decision, in the language-agnostic join"
        description: |
          Add TWO exported functions to pkg/gate/substantiveness_join.go, siting them
          immediately after NoTargetViolationForTest so a reader meets the guard right
          after the table it guards. Change NOTHING else in the file — NoTargetViolation,
          NoTargetViolationForTest, RouteSubstantivenessFindings, ReferencedSetForTest,
          IsTestHollow and HollowFindingsToViolations keep their current behavior
          exactly (CLM-007). This file stays pure string/set logic with no I/O, no pack
          knowledge and no language knowledge; both additions honor that.

          func JoinEligibleForNoTarget(mt MandatedTest, samePackage bool) bool
            Implemented AS the decision table, not as a copy of its predicates:
              _, raised := NoTargetViolationForTest(mt, ReferencedSymbolSet{}, samePackage)
              return raised
            Doc-comment WHY (CLM-001): "join-eligible" means precisely "an EMPTY
            evidence set would make this test raise", so the guard and the loop can
            never disagree about which tests are at stake. Anyone who replaces this
            with an explicit FilePath/absence/TargetPkg/same-package conjunction has
            re-opened the drift this construction closes — say that in the comment.
            Note that FilePath is NOT part of the table and is filtered by the caller
            before this is consulted.

          func SubstantivenessEvidenceRefusal(eligible, extraction, hollow int) (Violation, bool)
            Returns (Violation{}, false) unless eligible >= 1 AND extraction == 0.
            On refusal returns ONE Violation with Rule: StepTestSubstantiveness,
            Severity: "error", and a message chosen by the hollow count:
              • hollow == 0: the substantiveness pack produced no findings of any kind
                while <eligible> mandated tests were join-eligible — its engine did not
                run or its classification matched 0 test files; refusing instead of
                reporting <eligible> unfounded "does not call package" violations.
              • hollow > 0: the substantiveness pack produced <hollow> hollow findings
                but 0 referenced-symbol findings while <eligible> mandated tests were
                join-eligible — its referenced-symbol classification matched 0 test
                files; refusing instead of reporting <eligible> unfounded "does not
                call package" violations.
            Word them so both name the count, the cause, and what is being refused
            (CLM-003). Doc-comment the ISSUE-113 provenance and the ISSUE-020 lineage,
            and note that the CALLER — not this function — is what sets ConfigErr; this
            function decides, it does not dispose.

          No File is set on the refusal violation: the refusal is about the pack's
          configuration, not about any one file, and attaching an arbitrary test file
          would re-personalize a finding whose whole point is that it belongs to none
          of them. State that in the comment.
        files:
          - pkg/gate/substantiveness_join.go
        claims:
