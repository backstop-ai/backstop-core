  ── THE DEFECT IN ONE PARAGRAPH ────────────────────────────────────────────
  The production substantiveness step (cmd/backstop/gate.go:1236-1253) runs its Q2
  noTarget set-join per mandated test: for each test it assembles a referenced-symbol
  set from the pack's routed extraction findings and raises "does not call package X"
  when the target token is absent from that set. The loop makes NO distinction between
  "this one test genuinely does not call its target" and "the pack produced no
  extraction evidence AT ALL, so EVERY set is empty." In the second case the step emits
  one false violation per mandated test — 397 of them in the observed bclabs-portal
  incident — and names the real cause (the pack's classification matched zero test
  files) nowhere. The fix: detect the empty-evidence state BEFORE the loop and REFUSE
  with a single config-error naming the cause, exactly as ISSUE-020 established for
  broken configuration.

  ── WHY A CONFIG-ERROR AND NOT JUST A BETTER MESSAGE ──────────────────────
  A starved join does not produce a WRONG verdict about the code — it produces no
  verdict at all, dressed as N verdicts. That is a broken TOOL, not broken code, and
  the ISSUE-020 philosophy already has the shape for it: `StepResult.ConfigErr`.
  Setting it has three properties this lane WANTS, all of them mechanical
  (pkg/gate/gate.go:162-165, :175-177 and pkg/gate/policy.go:188), not aspirational:
    1. `Gate.Run` HALTS the remaining steps and returns exit code 2, so the operator
       reads one message instead of scrolling past a wall of downstream noise;
    2. because the run halts at this step, `waiver_resolution` (which is ordered AFTER
       substantiveness) NEVER runs — the refusal is structurally UNWAIVABLE. A broken
       classifier cannot be papered over with an inline token;
    3. `ApplyPolicy` skips ConfigErr steps, so the refusal can never be
       baseline-grandfathered into silence either.
  These are the reasons the refusal is a config-error rather than an ordinary
  `error`-severity violation. Say so in the code comment; a future reader who
  "simplifies" ConfigErr away removes all three at once.

  ── THE REFUSAL CONDITION, STATED EXACTLY ─────────────────────────────────
  Refuse when ALL THREE hold, evaluated after routing and after scope filtering:
    (a) at least ONE mandated test is JOIN-ELIGIBLE, and
    (b) the routed referenced-symbol (extraction) partition is EMPTY, and
    (c) the routed hollow partition is EMPTY.
  "Join-eligible" is DEFINED as "an empty referenced set would make this test raise a
  noTarget violation" — which is precisely `NoTargetViolationForTest(mt,
  ReferencedSymbolSet{}, samePackage)` returning raised==true. Defining it that way
  rather than re-listing the predicates (FilePath != "", not absence, TargetPkg != "",
  not same-package) is deliberate: the noTarget decision table
  (pkg/gate/substantiveness_join.go:63-94) stays the SINGLE authority, so the refusal
  can never drift out of agreement with the loop it is guarding. Anyone tempted to
  hand-roll the predicate list is re-opening the drift.

  Condition (a) is what makes the refusal precise rather than paranoid: it fires ONLY
  when the step is about to emit at least one violation it cannot justify. A project
  whose mandated tests are all same-package, all `kind: absence`, or all out of scope
  legitimately produces an empty evidence set and MUST still pass.

  ── WHY (c) EXISTS: THE FALSE-REFUSAL THIS CONDITION IS NARROWED TO AVOID ──
  An earlier revision of this plan refused on (a) && (b) alone. That was WRONG, and
  measurably so: the already-shipped fixture `newE2EWorkspace`
  (cmd/backstop/gate_substantiveness_e2e.go:43-99 — one root-level
  `func TestE2EHollowSubject(t *testing.T) { doSubject() }`, mandated by a spec whose
  implementation.package is `pkg/gate`) produces eligible==1, extraction==0, hollow==1.
  Under (a) && (b) that run REFUSES and, via the short-circuit return, throws away the
  REAL hollow violation — breaking two SPEC-037-mandated tests
  (TestE2E_SubstantivenessInstalledLocalPack_RealGate_HollowRed and
  TestE2E_SubstantivenessUninstalled_NoVacuousGreen's cross-check) and, far worse,
  turning a diff-scoped `backstop gate` over one changed hollow test file into an
  exit-2 that blames the pack's configuration while SUPPRESSING the true finding. That
  is precisely the misleading-gate class this lane exists to eliminate; shipping it
  would have traded one silent-wrong behavior for another.

  The derivation, from the real semantics of the two partitions:
    • The absence of extraction findings is inherently AMBIGUOUS between (i) the Q2
      classification matched zero files — the ISSUE-113 defect — and (ii) the scanned
      test files genuinely contain zero package-qualified calls — a legitimate
      all-noTarget state that MUST still raise. Core cannot tell these apart directly:
      packs are opaque (thin executor), so the only observable is the empty result.
      The refusal is therefore a HEURISTIC, and it must be tuned so that a wrong guess
      cannot destroy a true finding.
    • The hollow partition is core's ONLY independent evidence that the pack's engine
      actually ran and actually classified test files. Any hollow finding at all is
      proof of pack output.
  So the two branches are NOT symmetric:
    • hollow == 0 && extraction == 0: the pack produced NOTHING over a scope containing
      at least one eligible mandated test. Every channel is silent, so core has no
      evidence at all on which to found a per-test verdict — refusing replaces N
      unfounded noTarget violations with one honest "I have no evidence". REFUSE.

      THIS BRANCH IS NOT COST-FREE, and an earlier revision of this plan wrongly said
      it was ("no true finding to lose", "strictly better in every case"). It is not.
      A THIRD cause can land here, distinct from the two the message names, and it
      carries a real true finding:

          func TestUsesBareHelperAssertion(t *testing.T) {
              got := Build()
              assertEqual(t, got, "x")
          }

      Run through REAL ast-grep against the shipped pack, this yields ZERO findings
      from BOTH rules. Not hollow: the Q1 assertion-vocabulary regex matches "assert"
      inside `assertEqual`. No Q2 extraction finding either: the Q2 rule requires the
      call's `function` field to be a `selector_expression`, so `t.Fatalf` produces a
      match but a BARE `assertEqual`/`mustEqual` call produces nothing. Result:
      eligible >= 1, extraction == 0, hollow == 0 → REFUSE — suppressing a genuinely
      TRUE noTarget verdict (this test really does not call its target package) while
      the refusal message blames the pack.
      That is a real cost paid on this branch, stated plainly rather than argued away.
      It is ACCEPTED, not overlooked: core has no observable that separates this case
      from the legitimately-refusing one — packs are opaque, and all three causes
      present to core as the identical empty result. Narrowing further would require
      inventing information the pack does not provide. The mitigation available is
      HONESTY: the message names all THREE candidate causes, so an operator reading it
      over a bare-helper-assertion codebase is pointed at their own test style as one
      of the possibilities rather than being told, falsely, that their pack is broken.
    • hollow > 0 && extraction == 0: the pack DID produce findings. Refusing here (1)
      deletes M real, correctly-attributed hollow violations the operator must act on,
      and (2) prints a diagnosis ("its classification matched 0 test files") that the
      suppressed findings themselves FALSIFY — the Q1 classification demonstrably
      matched. And there is no vacuous green to prevent: the gate is already RED with
      true findings pointing at the same files. The residual noise (N false noTarget
      alongside M true hollow) is a strictly lesser harm than deleting the true ones.
      DO NOT REFUSE.

  KNOWN, DELIBERATE RESIDUALS — TWO of them, both traded away on purpose. Do not
  silently widen or narrow the condition to "fix" either.

  RESIDUAL 1 — UNDER-refusal, at hollow > 0. If a pack bakes its globs on the Q2 rule
  ONLY, leaving Q1 healthy, that run lands in the hollow > 0 branch and this lane does
  NOT collapse its noTarget wall. Covering it requires either suppressing true hollow
  findings (harm above) or suppressing the noTarget violations while reporting hollow —
  which would silently swallow the legitimate case (ii) and manufacture exactly the
  vacuous green this codebase treats as the enemy. Both observed incidents in
  ISSUE-113 (the missing-ast-grep case, and the published typescript-substantiveness
  1.1.0 whose baked globs starved the whole scan) land in the hollow == 0 branch and
  ARE covered. If the Q2-only sub-case is ever observed in the wild, it is a NEW issue
  with new evidence — not a quiet loosening of this predicate.

  RESIDUAL 2 — OVER-refusal, at hollow == 0: the BARE-HELPER-ASSERTION case derived
  above. A test whose only assertion is an unqualified helper call (`assertEqual(t,
  ...)`) matches the Q1 vocabulary regex (so it is not hollow) and fails the Q2 rule's
  `selector_expression` requirement (so it yields no extraction finding) — empirically
  confirmed against real ast-grep. A workspace made entirely of such tests reaches
  eligible >= 1 / extraction 0 / hollow 0 and REFUSES, suppressing noTarget verdicts
  that were TRUE. This is not fixable by narrowing the condition: core sees the same
  empty result here as in the genuinely-starved case and has no observable that tells
  them apart. It is bounded by honesty instead — the message names this as one of the
  three candidate causes rather than asserting the pack is broken. If this is ever
  observed in the wild, it too is a NEW issue with new evidence (its plausible fix
  lives in the PACK — a Q2 rule that also extracts bare-call symbols — not in a core
  predicate), never a quiet tightening of this one.

  SCOPE-FILTER ASYMMETRY, ON PURPOSE: `eligible` is counted AFTER the scope filter (an
  out-of-scope test must never inflate it), but `hollow` and `extraction` are the
  ROUTED, PRE-scope-filter partition lengths. Refusing is the drastic action, so any
  evidence the pack emitted at all — even for a file this run is not looking at —
  blocks it. The two counts pull in the same conservative direction: both make the
  refusal LESS likely, never more.

  ── WHAT THIS LANE DELIBERATELY DOES NOT DO ───────────────────────────────
  ISSUE-113's Direction names two triggers: "the classifier matches zero test files"
