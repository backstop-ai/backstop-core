          lost," which would contradict the adjacent
          pkg/gate/substantiveness_join.go comment TASK-004 mandates. Say WHY the guard is what
          makes it true: an earlier design refused on (eligible, extraction) alone and
          therefore DID discard real hollow violations, silently converting a correct
          RED into an exit-2 that blamed the pack's config for a finding the operator
          needed to see. TASK-008 pins that boundary end-to-end. Do not "simplify"
          len(hollow) out of the call.

          Note also, in the same comment, the three mechanical consequences of
          ConfigErr that make this a refusal rather than a loud violation: Gate.Run
