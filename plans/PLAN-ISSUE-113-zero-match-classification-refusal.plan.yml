          files, no dependency between them).

          TestJoinEligibleForNoTarget_MatchesTheNoTargetDecisionTable (CLM-001)
            Table-driven over the FOUR dispositions the decision table already
            distinguishes, asserting eligibility agrees with "would raise on empty
            evidence" in every one:
              • ordinary test, TargetPkg "gate", samePackage false      → eligible
              • TargetPkg "" (the empty-subject skip)                   → NOT eligible
              • samePackage true                                        → NOT eligible
              • IsAbsence true (the ISSUE-035 Category 2 skip)          → NOT eligible
            For each row ALSO call NoTargetViolationForTest(mt, ReferencedSymbolSet{},
            samePackage) directly and assert the two agree. That cross-check is the
            point of the test: it is what mechanically prevents the predicate from
            drifting away from the table it guards, and it stays meaningful if a fifth
            disposition is ever added.

          TestSubstantivenessEvidenceRefusal_FiresOnlyOnStarvedJoin (CLM-002)
            Table-driven over (eligible, extraction, hollow):
              • (3, 0, 0)  → refusal
              • (3, 0, 2)  → refusal
              • (1, 0, 0)  → refusal          (one eligible test is enough)
              • (0, 0, 0)  → NO refusal       (nothing would have been raised)
              • (0, 0, 5)  → NO refusal
              • (3, 1, 0)  → NO refusal       (evidence exists; the join is honest)
              • (3, 7, 2)  → NO refusal
            Assert the returned Violation's Rule == gate.StepTestSubstantiveness and
