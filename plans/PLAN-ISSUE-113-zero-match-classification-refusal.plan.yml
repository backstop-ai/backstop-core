  ── THE CONDITION AS SHIPPED, AND WHY EACH TERM IS LOAD-BEARING ────────────
  The predicate is expressed as its NEGATION and refuses iff all three hold:
      if eligible < 1 || extraction > 0 || hollow > 0 { return no refusal }
  i.e. refuse iff `eligible >= 1 && extraction == 0 && hollow == 0`.
    • eligible >= 1 makes the refusal PRECISE rather than paranoid: it fires only
      when the step is about to emit at least one violation it cannot justify. A
      project whose mandated tests are all same-package, all `kind: absence`, or all
      out of scope legitimately produces an empty evidence set and MUST still pass.
      Eligibility is `NoTargetViolationForTest(mt, ReferencedSymbolSet{}, ...)` —
      the decision table itself, not a copy of its predicates — so the guard and the
      loop it guards cannot drift apart.
    • extraction == 0 is the starved-join signal the lane exists for.
    • hollow == 0 is the term a later reader is most likely to delete as redundant,
      and deleting it reintroduces a MEASURED false refusal. Hollow evidence is
      core's only independent proof that the pack's engine ran and classified test
      files, so hollow > 0 FALSIFIES the very diagnosis the message makes; refusing
      there would also discard true hollow findings with no vacuous green to
      prevent (the gate is already RED on the same files). The concrete case: the
      shipped newE2EWorkspace fixture is (eligible 1, extraction 0, hollow 1) and
      without this term refuses, discarding its true hollow violation and breaking
      TestE2E_SubstantivenessInstalledLocalPack_RealGate_HollowRed.
  The short-circuit passes `len(hollow)` — the ROUTED partition, deliberately NOT
  the scope-FILTERED violation count. Both counts pull the same conservative way:
  any pack output at all, even for a file this run is not looking at, blocks the
  refusal. "Tidying" it to the filtered count makes refusal MORE likely, which is
  the wrong direction.

  ── ConfigErr: UNSUPPRESSIBLE BY CONSTRUCTION, NOT BY CONVENTION ───────────
  The refusal is disposed as StepResult.ConfigErr, and that flag does three
  mechanical jobs — remove it "for tidiness" and all three go at once:
    1. Gate.Run halts the remaining steps and returns exit 2, so the operator reads
       ONE message instead of scrolling a wall;
    2. waiver_resolution is ordered AFTER substantiveness and therefore never
       executes — the refusal is STRUCTURALLY UNWAIVABLE, not merely un-waived.
       TestE2E_ZeroMatchClassification_RefusalIsNotWaivable proves this with the
       most permissive reader constructible: a LineReader handing out a valid,
       non-expired @waiver:test_substantiveness token for EVERY line queried. It
       suppresses nothing.
    3. ApplyPolicy skips ConfigErr steps, so it cannot be baseline-grandfathered
       into silence either.

