      - id: TASK-005
        type: implementation
        title: "Short-circuit the production Q2 loop: refuse once instead of raising N"
        description: |
          Rework the Q2 section of buildTestSubstantivenessStep
          (cmd/backstop/gate.go, currently lines 1236-1253) into two passes. Touch
          NOTHING else in gate.go — the extraction, the ContractsAreDue filter, the
          path resolution, the pack resolution, the dispatch, the routing, and the Q1
          hollow loop all stay byte-for-byte as they are.

          Pass 1 — collect, do not raise. Walk `mandated` applying the SAME two skips
          the current loop applies FIRST and in the same order (FilePath == "" with
          its existing "already reported by the verification step" comment, then the
          scope filter), then append to an `eligible []gate.MandatedTest` when
          gate.JoinEligibleForNoTarget(mt, testFileColocatedWithTarget(mt.FilePath,
          mt.TargetPkg)) is true. Order matters: an out-of-scope or unresolved test
          must never inflate the eligible count, or a diff-scoped run could refuse
          over tests it was not even looking at.

          THE REFUSAL. Immediately after pass 1:
