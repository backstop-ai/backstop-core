  SECOND is implementable here, and the first is already handled elsewhere — this is a
  scope decision, not an omission, and it must not be quietly widened:
    • The CORE classifier failing to resolve any mandated test file leaves every
      MandatedTest.FilePath == "", which the loop already `continue`s on
      (cmd/backstop/gate.go:1238-1240) with the comment "not found — already reported
      by the verification step". That path emits ZERO misleading violations today. The
      `test_verification` step owns "mandated test not found" and reports it per test
      with the right words. Duplicating it here would produce two reports of one fact.
    • The PACK's OWN classification (its ast-grep rule globs) is what actually failed
      in both observed incidents, and core cannot inspect a pack's globs — packs are
      opaque by design (thin executor). The only thing core CAN observe is the
      consequence: zero evidence. So the refusal message names the pack's classification
      as ONE candidate cause among the three it lists — never as a diagnosis — and
      reports the counts that let the operator work out which one they have.
  Net: ONE refusal condition and ONE message, which names every cause core cannot
  distinguish from the empty result (see below).

  ── ONE MESSAGE, NOT TWO ──────────────────────────────────────────────────
  Because condition (c) restricts the refusal to hollow == 0, there is exactly ONE
  diagnostic state to describe and therefore exactly ONE message. (An earlier revision
  specified two variants forked on the hollow count; the hollow > 0 variant described a
  state that, post-(c), no longer refuses at all, so it is REMOVED — do not reintroduce
  it.) The message must:
    • state the OBSERVED FACT first — the pack produced no substantiveness findings of
      ANY kind — because that is the only thing core actually knows;
    • name ALL THREE candidate causes, none of them asserted as THE cause:
        (1) the pack's engine did not run;
        (2) the pack's classification matched 0 test files;
        (3) the scanned tests genuinely make no package-qualified calls while still
            satisfying the pack's assertion-vocabulary check — the bare-helper-assertion
            shape derived in the condition section, where the noTarget verdicts the step
            is declining to report would have been TRUE;
    • report the join-eligible count, so the operator can see the scale of what would
      otherwise have been reported; and
    • say IN WORDS that the step is refusing INSTEAD OF reporting N "does not call
      package" violations. The operator who has seen the 397-violation wall needs to
      recognize this message as its replacement.
  Naming all three is the WHOLE mitigation for Residual 2, and the reason the message
  must not be trimmed to a confident single diagnosis: under cause (3) the refusal is
  WRONG, and an operator whose tests use bare helper assertions can only recognize that
  if the message admits it as a possibility. ISSUE-112 owns the upstream half of cause
  (1) (a missing engine tool that returns empty SARIF instead of failing loud). Core
  cannot distinguish the three from the empty result alone and must not pretend
  otherwise.

  WORD CAUSE (3) WITHOUT THE SUBSTRING "hollow" — TASK-002 pins that the message never
  contains it, because a message discussing hollow findings would describe a state
  condition (c) makes unreachable. Cause (3) is fully expressible without the word (as
  phrased above); that constraint is required, not stylistic.

