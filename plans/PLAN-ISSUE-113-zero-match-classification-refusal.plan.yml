          - CLM-006
        depends_on: []

      - id: TASK-002
        type: test
        title: "Unit pins for the eligibility predicate and the refusal decision (RED)"
        description: |
          Create pkg/gate/substantiveness_zero_evidence_test.go. It must FAIL before
          TASK-004 — the two functions under test do not exist yet, so the package will
          not compile; RECORD THAT as the red and re-run for a real assertion failure
