          (1) newZeroMatchE2EWorkspace(tmp string) (*e2eWorkspace, error)

          Mirrors newE2EWorkspace's structure (same backstop.yml `project: e2e` +
          `packs: {}`, same specs/ dir) but writes:
            • ONE spec, specs/zeromatch.spec.md, status `implemented`,
              implementation.package `pkg/gate` (so the reduced target token is
              `gate`, matching TargetPackageName's last-segment reduction), mandating
              THREE tests across three claims:
                TestZeroMatchAlpha, TestZeroMatchBravo, TestZeroMatchCharlie
              Copy the frontmatter shape of newE2EWorkspace's spec verbatim and add
              CLM-002/CLM-003 with their own `tests:` entries. `implemented` status is
              REQUIRED — ContractsAreDue filters anything else out and the workspace
              would silently have zero due tests.
            • THREE *_test.go files at the workspace ROOT (subject_alpha_test.go,
              subject_bravo_test.go, subject_charlie_test.go), each of this shape:

                package sample_test

                import "testing"

                // Genuinely substantive AND genuinely calls its target package:
                //   - gate.Build() is a package-qualified call, so the pack's Q2
                //     referenced-symbol rule extracts symbol=gate and the noTarget
                //     set-join is SATISFIED when the pack works. This is what makes
                //     the zero-match run's violations provably FALSE (CLM-006).
                //   - t.Fatalf matches the Q1 hollow rule's assertion vocabulary
                //     regex, so these tests are NOT hollow and the hollow partition
                //     stays empty. Do not remove it: without it every test also
                //     produces a hollow finding and the violation counts this
                //     fixture asserts stop meaning what they say.
                func TestZeroMatchAlpha(t *testing.T) {
                    if gate.Build() == "" {
                        t.Fatalf("Build returned empty")
                    }
                }

              Root placement is load-bearing: filepath.Base(filepath.Dir(path)) for a
              root-level file is not "gate", so testFileColocatedWithTarget is false
              and the tests are genuinely join-eligible. Putting them in a `gate/`
              subdirectory would make them same-package and silently disable the whole
              fixture.
              These files never compile or run as Go — they are ast-grep INPUT only,
              which is why an unresolved `gate` import is fine (newE2EWorkspace's
              existing fixture calls an undefined doSubject() for the same reason).
              Say this in the harness comment.

          (2) (w *e2eWorkspace) installZeroMatchSubstantivenessPack(repoRoot string) error

          Installs a PATCHED COPY of packs/substantiveness through the SAME real
          newProductionAddCommand() path installSubstantivenessLocalPack uses:
            • recursively copy substantivenessSourceDir(repoRoot) into a temp dir
              beside w.root (NEVER mutate the in-repo pack source — a test that edits
              packs/substantiveness would corrupt this repo's own dogfood install);
            • in the copy, rewrite ast-grep/rules/referenced-symbol-go.yml to add a
              `files:` restriction naming a path that exists nowhere in the workspace,
              e.g. `files: ["harness/fixtures/**/*.go"]`. That is the bclabs-portal
              defect verbatim: a real, valid, installable pack whose Q2 classification
              globs are baked to the pack author's own harness layout;
            • leave hollow-test-go.yml, sgconfig.yml, the convert script and pack.yml
              UNTOUCHED, so the engine still runs, still exits 0, and the pack still
              passes `pack check`/`pack test` on install. The point of this fixture is
              a HEALTHY-LOOKING pack producing zero Q2 evidence — not a broken install.
          Set w.installed/w.installInfo exactly as the existing method does.

          Header-comment WHY this fixture breaks globs rather than PATH: ISSUE-112
          owns the missing-tool root cause, and a tool-present fixture stays valid and
          red-provable on both sides of that lane's fix.
        files:
