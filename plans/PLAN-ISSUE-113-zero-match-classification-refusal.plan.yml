                pack's referenced-symbol classification.
            Both must state that the step is refusing INSTEAD OF reporting per-test
            "does not call package" violations. Assert on stable substrings, not on
            the whole sentence — the wording is meant to be improvable without
            breaking the pin. Assert the two variants are DIFFERENT from each other;
