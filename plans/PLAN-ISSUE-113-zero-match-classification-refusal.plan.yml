notes: |
  Implements ISSUE-113. Two production files, one new harness helper, two new test
  files, two verification passes. Seven tasks. Nothing else is in scope.

  ── THE DEFECT IN ONE PARAGRAPH ────────────────────────────────────────────
  The production substantiveness step (cmd/backstop/gate.go:1236-1253) runs its Q2
  noTarget set-join per mandated test: for each test it assembles a referenced-symbol
  set from the pack's routed extraction findings and raises "does not call package X"
  when the target token is absent from that set. The loop makes NO distinction between
  "this one test genuinely does not call its target" and "the pack produced no
  extraction evidence AT ALL, so EVERY set is empty." In the second case the step emits
  one false violation per mandated test — 397 of them in the observed bclabs-portal
  incident — and names the real cause (the pack's classification matched zero test
  files) nowhere. The fix: detect the empty-evidence state BEFORE the loop and REFUSE
  with a single config-error naming the cause, exactly as ISSUE-020 established for
  broken configuration.

  ── WHY A CONFIG-ERROR AND NOT JUST A BETTER MESSAGE ──────────────────────
  A starved join does not produce a WRONG verdict about the code — it produces no
  verdict at all, dressed as N verdicts. That is a broken TOOL, not broken code, and
  the ISSUE-020 philosophy already has the shape for it: `StepResult.ConfigErr`.
  Setting it has three properties this lane WANTS, all of them mechanical
  (pkg/gate/gate.go:162-165, :175-177 and pkg/gate/policy.go:188), not aspirational:
    1. `Gate.Run` HALTS the remaining steps and returns exit code 2, so the operator
       reads one message instead of scrolling past a wall of downstream noise;
    2. because the run halts at this step, `waiver_resolution` (which is ordered AFTER
       substantiveness) NEVER runs — the refusal is structurally UNWAIVABLE. A broken
       classifier cannot be papered over with an inline token;
    3. `ApplyPolicy` skips ConfigErr steps, so the refusal can never be
       baseline-grandfathered into silence either.
  These are the reasons the refusal is a config-error rather than an ordinary
  `error`-severity violation. Say so in the code comment; a future reader who
  "simplifies" ConfigErr away removes all three at once.

  ── THE REFUSAL CONDITION, STATED EXACTLY ─────────────────────────────────
  Refuse when BOTH hold, evaluated after routing and after scope filtering:
    (a) at least ONE mandated test is JOIN-ELIGIBLE, and
    (b) the routed referenced-symbol (extraction) partition is EMPTY.
  "Join-eligible" is DEFINED as "an empty referenced set would make this test raise a
  noTarget violation" — which is precisely `NoTargetViolationForTest(mt,
  ReferencedSymbolSet{}, samePackage)` returning raised==true. Defining it that way
  rather than re-listing the predicates (FilePath != "", not absence, TargetPkg != "",
  not same-package) is deliberate: the noTarget decision table
  (pkg/gate/substantiveness_join.go:63-94) stays the SINGLE authority, so the refusal
  can never drift out of agreement with the loop it is guarding. Anyone tempted to
  hand-roll the predicate list is re-opening the drift.

  Condition (a) is what makes the refusal precise rather than paranoid: it fires ONLY
  when the step is about to emit at least one violation it cannot justify. A project
  whose mandated tests are all same-package, all `kind: absence`, or all out of scope
  legitimately produces an empty evidence set and MUST still pass.

  ── WHAT THIS LANE DELIBERATELY DOES NOT DO ───────────────────────────────
  ISSUE-113's Direction names two triggers: "the classifier matches zero test files"
  OR "the substantiveness evidence set is empty while mandated tests exist." Only the
  SECOND is implementable here, and the first is already handled elsewhere — this is a
  scope decision, not an omission, and it must not be quietly widened:
    • The CORE classifier failing to resolve any mandated test file leaves every
      MandatedTest.FilePath == "", which the loop already `continue`s on
      (cmd/backstop/gate.go:1238-1240) with the comment "not found — already reported
      by the verification step". That path emits ZERO misleading violations today. The
      `test_verification` step owns "mandated test not found" and reports it per test
      with the right words. Duplicating it here would produce two reports of one fact.
    • The PACK's OWN classification (its ast-grep rule globs) is what actually failed
      in both observed incidents, and core cannot inspect a pack's globs — packs are
      opaque by design (thin executor). The only thing core CAN observe is the
      consequence: zero evidence. So the refusal message names the pack's classification
      as the probable cause and reports the counts that let the operator confirm it.
  Net: ONE refusal condition, TWO message variants distinguishing "the pack produced
  nothing at all" from "the pack produced hollow findings but zero extraction."

  ── WHY TWO MESSAGE VARIANTS, AND WHY THEY MATTER ─────────────────────────
  The hollow (Q1) count is the operator's fork in the diagnostic road, and it is free
  to compute — routing already partitions it:
    • hollow == 0 AND extraction == 0 → the pack's engine produced NOTHING. That is
      the missing-tool signature (ISSUE-112's surface: ast-grep absent from PATH →
      empty SARIF → starved join). Point at the engine/tool.
    • hollow > 0 AND extraction == 0 → the engine RAN and produced findings; only the
      referenced-symbol rule matched nothing. That is the harness-baked-globs signature
      (typescript-substantiveness 1.1.0). Point at the pack's Q2 rule classification.
  Both variants must state the join-eligible count and both must say, in words, that
  the step is refusing INSTEAD OF reporting N "does not call package" violations —
  the operator who has seen the 397-violation wall needs to recognize this message as
  its replacement.

  ── RELATIONSHIP TO ISSUE-112 (checked, not assumed) ──────────────────────
  ISSUE-112 was filed alongside this one and describes the SAME incident from the
  upstream end (missing engine tool → silently empty SARIF → vacuous pack_engines pass
  → starved join). PLAN-ISSUE-112 was still an empty scaffold (`phases: []`) when this
  plan was authored on 2026-08-15, so its file list was inferred from ISSUE-112's own
  Direction section, which names its surfaces explicitly:
  `cmd/backstop/pack_gate_provision.go` (the assume-present fail-loud that exempts
  provision-declared tools) and the gate dispatch path's discarded `runErr`
  (`cmd/backstop/pack_gate.go` / `pkg/check/runner.go`).

  FILE SCOPE: DISJOINT. This lane touches `pkg/gate/substantiveness_join.go` and
  `cmd/backstop/gate.go` (buildTestSubstantivenessStep only) plus its own new test
  files. Neither appears in ISSUE-112's named surfaces. Re-confirm with a real read of
  PLAN-ISSUE-112 before starting if it has since been authored; if it HAS grown a task
  touching either of this lane's two production files, stop and reconcile rather than
  racing.

  SEQUENCING: cleanly separable, either order works, and they are NOT redundant. 112
  removes one root cause (a missing tool now fails loud instead of returning empty
  SARIF); 113 is the BACKSTOP for every other way the evidence set can come back empty
  — including the harness-baked-globs case, where the tool is present, the engine
  exits 0, and 112's fix is silent by design. If they must be serialized, land 112
  first: it is the noisier of the two roots and its fix shrinks the population that
  ever reaches this refusal. THE FIXTURE BELOW IS DELIBERATELY TOOL-PRESENT (it breaks
  the pack's globs, not the PATH), so it stays red-provable and meaningful on both
  sides of 112's change. Do not rewrite it into a missing-tool fixture.

  ── THE REGRESSION FIXTURE, AND WHY IT NEEDS A CONTROL ────────────────────
  A test that only shows "one violation after the fix" proves nothing — a step that
  always returned one violation would pass it. The fixture is therefore a THREE-WAY
  proof over the SAME workspace and the SAME real dispatch path:
    control  UNPATCHED pack           → 0 violations   (the tests are genuinely fine)
    before   ZERO-MATCH pack, pre-fix → 3 noTarget violations, all FALSE
    after    ZERO-MATCH pack, post-fix→ exactly 1 refusal, ConfigErr true
  The control is what makes the middle row a proven FALSEHOOD rather than an assertion
  about it, and it is the reason the fixture's tests must genuinely call their target
  package. Three mandated tests (not one) is also load-bearing: the whole defect is
  "N misleading violations instead of 1", and N must be > 1 for the fix to be visibly
  a collapse rather than a rewording.

  RE-OBSERVE THE RED. Every assertion below was reasoned from the code, NOT measured.
  Run the tests against unmodified production code and record the actual failures
  before touching either production file. A test written after the fix and never seen
  failing is worth nothing here.

  ── CLAIM LEDGER (ISSUE-113 carries no CLM ids; this lane defines them) ────
    CLM-001  JoinEligibleForNoTarget is DEFINED as the noTarget decision table
             evaluated against an EMPTY ReferencedSymbolSet — a test is join-eligible
             iff empty evidence would make it raise. No predicate (FilePath, absence,
             TargetPkg, same-package) is restated anywhere else.
    CLM-002  SubstantivenessEvidenceRefusal returns exactly ONE violation when the
             join-eligible count is >= 1 AND the extraction count is 0, and returns no
             refusal when either the eligible count is 0 or any extraction evidence
             exists.
    CLM-003  the refusal message NAMES the cause, reports the join-eligible count, and
             distinguishes "the pack produced no findings of any kind" (hollow == 0)
             from "the pack produced hollow findings but zero referenced-symbol
             evidence" (hollow > 0).
    CLM-004  the production step SHORT-CIRCUITS on refusal: it returns the single
             refusal violation with ConfigErr true and ZERO per-test noTarget
             violations, and does not mix hollow violations into the refusal result.
    CLM-005  end-to-end regression over the REAL dispatch path: a substantiveness pack
             whose referenced-symbol rule classification matches zero test files, over
             a workspace with three mandated tests, yields three false "does not call
             package gate" violations before the fix and exactly one config-error
             refusal after.
    CLM-006  non-vacuity control: the SAME workspace run against the UNPATCHED pack
             yields ZERO violations, proving the three pre-fix violations were false
             and that the refusal is not masking genuine ones.
    CLM-007  non-regression: with evidence present, the noTarget join, hollow
             conversion, scope filtering and the `kind: absence` skip behave exactly as
             before, and the refusal does not fire on a healthy run.
    CLM-008  the refusal is structurally unsuppressible: because ConfigErr halts the
             run at this step, waiver_resolution never executes and ApplyPolicy skips
             the step, so no inline waiver and no baseline entry can silence it.

  ── VERIFICATION COMMANDS ──────────────────────────────────────────────────
    inner: go build ./... &&
           go test ./pkg/gate/... ./cmd/backstop/... -race -count=1
    full:  go test ./... -race -count=1
    gate:  ./bin/backstop gate                        (diff-scoped inner loop)
           ./bin/backstop gate --all                  (full kill chain)
           ./bin/backstop artifact validate --plan PLAN-ISSUE-113
           ./bin/backstop artifact validate --issue ISSUE-113

  ── ENVIRONMENT / TOOLING FACTS ────────────────────────────────────────────
  1. `backstop code check` DOES NOT EXIST. The shipped top-level commands are
     artifact, baseline, commands, completion, gate, help, pack, recipe, version,
     waiver. `go test` is the inner loop; `./bin/backstop gate` is the outer one.
  2. ast-grep must be on PATH for the e2e tests. They sit behind the existing
     fail-loud guards (requireAstGrepE2E). NEVER convert one to t.Skip — a skipped
     real-engine test is silent vacuous green, and this package says so already.
  3. REBUILD bin/backstop BEFORE ANY GATE RUN. A stale binary gates the OLD step and
     reports a green that proves nothing about this change.
  4. Report TRUE exit codes (`echo $?`); never mask a non-zero behind a pipe.
  5. `installSubstantivenessLocalPack`'s receiver and signature are PINNED — four
     existing call sites in gate_substantiveness_e2e_test.go depend on that exact
     shape. ADD a sibling method; do not change it.

phases:
