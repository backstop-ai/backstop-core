    name: "Phase 1: Red-first, then refuse instead of mass-joining"
    tasks:
      - id: TASK-001
        type: setup
        title: "Zero-match harness: a workspace with three real mandated tests and an installable pack whose Q2 classification matches nothing"
        description: |
          Extend cmd/backstop/gate_substantiveness_e2e.go with the fixture machinery
          TASK-003 drives. Production code is NOT touched here and no assertions are
          written here — this task exists so the e2e test file and the join fix can be
          authored in parallel against a settled harness shape.

          Add TWO things, both as siblings of the existing helpers. Do NOT modify
          newE2EWorkspace or installSubstantivenessLocalPack — four existing call sites
          in gate_substantiveness_e2e_test.go depend on their current shape (their doc
