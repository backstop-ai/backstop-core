          `cmd/backstop/integration_test.go`'s `TestMain` as the sibling PLAN-ISSUE-163 added).

          DO NOT TOUCH `pkg/pack/engine/**`, `pkg/packval/**`, `cmd/backstop/integration_test.go`,
          `cmd/backstop/main.go`, or `.github/workflows/ci.yml`. All are already correct or
