              func TestMain(m *testing.M) {
                  if err := packval.MaybeRunSandboxHelper(); err != nil {
                      fmt.Fprintf(os.Stderr, "backstop sandbox helper: %v\n", err)
                      os.Exit(126)
                  }
                  os.Exit(m.Run())
              }

          Imports: `fmt`, `os`, `testing`, and
          `github.com/backstop-ai/backstop-core/pkg/packval` in its own group after the
          stdlib block (gofmt grouping, matching the package's other test files).

          ★ THE LITERAL `126` IS CORRECT HERE AND IS NOT DRIFT (sharp edge 2).
          `sandboxHelperExitCode` is unexported in `cmd/backstop`'s `package main` and cannot
          be referenced from here; `pkg/packval` exports no equivalent. Do NOT declare a new
          package-level constant for it, and do NOT invent a different code —
          `pkg/packval/main_test.go:46` spells this same literal for this same reason, and
          126 is the fail-closed "refused to run pack code it could not confine" code
          documented at `pkg/packval/sandbox_diagnostic.go:17-19`.

          `package distribution_test`, NOT `package distribution` (sharp edge 1). The package
          already has one internal test file (`islocalpath_export_test.go`) and 42 external
          ones; both compile into a single test binary and Go permits `TestMain` in only one.
          Declare it once, in the external package.

          NO BUILD TAG on the function or the file (sharp edge 3). `MaybeRunSandboxHelper`
          resolves on every platform by design: on Linux it is the real gate, on darwin it is
          `sandbox_nonlinux.go:47`'s `return nil`. That stub is precisely what makes this edit
          provably inert on the platform we can measure — the call returns nil immediately and
          control falls straight into `m.Run()`.

          `os.Exit(m.Run())`, never a bare `m.Run()` (sharp edge 6).

          WRITE A HEADER COMMENT carrying the facts a future reader needs and cannot infer:
            (i) the Linux sandbox is a RE-EXEC TRAMPOLINE — `newSandboxHelperCommand`
                (`pkg/packval/sandbox_linux.go`) spawns `os.Executable()`, which under
                `go test` is THIS package's own compiled test binary, with
                `BACKSTOP_SANDBOX_HELPER_SPEC` set and `helper.Dir` pointed at the pack
                directory;
            (ii) without this gate Go's DEFAULT generated test main does not recognise that
                env var, so the re-exec'd process reruns this package's ENTIRE suite from a
                directory off any `go.mod` ancestry, dies, and exits 1 — and because Go's
                testing framework writes to STDOUT while
                `foldHelperStderrIntoError` (`pkg/packval/sandbox_diagnostic.go`) reads only
                STDERR, the parent reports "the sandboxed command wrote no diagnostic" and the
                real output vanishes. That is ISSUE-180, and it is what broke
                `TestInstallContractsLocalPack_InstallsWithSuppliedCommand` on Linux CI;
            (iii) a successful call in helper mode NEVER RETURNS, and a non-nil error means
                this process IS a helper whose sandbox failed to install — running the suite
                at that point would hand the parent the suite's output as the sandboxed
                command's output;
            (iv) this package reaches the real pipeline through
                `pkg/pack/distribution/validator.go`'s `packval.NewPipeline(packDir, …).Run()`,
                which is why it is a re-exec target at all.
          Name the other two members of the wiring family: `pkg/packval/main_test.go`'s
