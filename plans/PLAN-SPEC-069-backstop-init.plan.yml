      - id: TASK-053
        type: refactor
        title: "Return the resolved recipe's declared kind from runRecipeApply so ONE resolve feeds both the apply and the preserve classifier"
        description: |
          cmd/backstop/recipe_apply.go. `runRecipeApply(ref, projectRoot,
          suppliedParams) (recipe.ApplyResult, error)` already resolves the
          recipe (`recipe.ResolveRecipe`, :215) and therefore already HOLDS
          `resolved.Manifest.Kind` — it just does not return it. Widen the
          return so the caller gets the declared kind alongside the result.

          WHY THIS IS A REFACTOR AND NOT AN OPTIONAL TIDY. `ApplyOutcome`
          (seams.go) carries `RecipeKind`, because REQ-035's classifier splits
          the empty Rule/CoveringWaiver pair on the recipe's declared kind.
          The production RecipeApplier (TASK-054) must therefore report the
          kind of the recipe that was actually applied. Its only two options
          are: take it from the resolve that already happened, or call
          `ParseRecipeRef` + `ResolveRecipe` a SECOND time to ask what kind it
          was. The second is a second derivation of "which recipe is this
          ref", drifting from the one the apply actually used — the same
          one-authority-not-a-copy hazard REQ-018 refuses for local-path
          classification and SPEC-056 settled for pack names. Take it from the
          resolve.

          BEHAVIOR IS UNCHANGED. No resolution order changes, no error text
          changes, no param handling changes, nothing under pkg/recipe is
          touched (REQ-009 forbids that). Update the existing caller in
          `runRecipeApply`'s cobra command and keep every existing
          recipe-apply test passing — an existing test going red here means
          the widening changed behavior, and that is this task's own defect.
