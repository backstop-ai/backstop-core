      - id: TASK-003
        type: setup
        title: "Author the DD-7 evidence fixture pack: one scaffold recipe AND one entrypoint that reds over an empty project"
        description: |
          CLM-139 binds DD-7's motivating evidence to a test rather than a
          story: the SAME declared entrypoint that exits NON-ZERO over a
          project with no source file exits ZERO over the same project once
          the scaffold recipe has run, with the scaffolded file as the ONLY
          difference between the two runs. That is the "a compiler run over an
          empty repo can RED on no inputs" failure (observed: tsc TS18003),
          and it is what regresses silently if a later refactor moves the
          scaffold step after the toolchain step.

          ONE pack source declaring BOTH:
            • a recipe (one `create` op, one target, `kind: scaffolding`);
            • one engine with `gate_type: test` (or `build`) whose declared
              command exits non-zero when the recipe's declared target is
              absent and zero when it is present.

          THE PACK AUTHOR'S COMMAND IS WHAT ENCODES THE FAILURE, and core
          supplies none of it — that is the point of the claim. Use an
          allowlisted, hermetic, no-provisioning tool; a `grep`-shaped
          presence probe over the recipe's declared target is sufficient and
          keeps the fixture dependency identical to TASK-001's.

          Also declare the entrypoint's own executable if the command needs
          one, under this fixture's tree, and make it executable. Nothing here
          may reach outside the fixture directory.

          ★★ THE ENTRYPOINT ENGINE IS ALSO DISPATCHED BY INIT'S OWN OBSERVE
          STEP, AND WITHOUT A CONVERT SCRIPT THAT DISPATCH IS A BROKEN-PACK
          ERROR. This is the trap that makes an otherwise-correct fixture fail
          in a way that looks like an init defect. `gateTypeHasDedicatedStep`
          (cmd/backstop/pack_gate.go:107-114) returns true for substantiveness,
          contracts and coverage ONLY — so a `test` (or `build`) engine
          SURVIVES `excludeDedicatedStepRules` and dispatches through the
          GENERIC pack_engines path as well. CLM-139's test installs this pack
          through init, and init's step 10 (observe) runs the gate, so this
          engine WILL be dispatched there. On that path the engine's stdout is
          expected to be SARIF unless a `convert:` script is declared; with no
          convert, `runFindingsEngine` hands raw output to the SARIF parse
          (pack_gate.go:686-691 is the paired "broken pack: missing convert
          script" failure for the declared-but-absent case).

          So DECLARE A CONVERT SCRIPT for this engine, exactly as TASK-001
          does for its lint engine, and ship it in this fixture's tree
          (base it on packs/contracts/grep/to-sarif.sh). It normalizes the
          presence-probe's output to SARIF for the findings dispatch and is
          IGNORED by the toolchain path — `packEntrypointProber` (TASK-042)
          reads exit status and combined output and never consults `convert`.
          One fixture, two dispatch routes, and this is the field that keeps
          the second one honest.

          Do NOT declare `crash_guard: true`. It is an explicit opt-in field
          (pkg/pack/manifest.go:104), not something derived from `gate_type`,
          and turning it on would make the empty-project non-zero exit — the
          very state CLM-139 sets up on purpose — a fail-loud gate error
          during the observe step.

          THE PACK MUST PASS `pack check` AND `pack test` (`pack add` runs
          both unconditionally). Declare `archetype: enforcement`: it has a
          real ruleset, so phase 1's content requirement is satisfied by
          `content.ruleset.rules` and it must NOT declare `content.scaffolds`
          (phase4 rejects scaffolds on an enforcement pack). Every rule needs
          a valid `risk_class` (phase 1), and the rule needs positive and
          negative fixtures that genuinely falsify, captured from a real run
          — same bar as TASK-001. Under `archetype: enforcement`,
          `checkRecipeEnforcement` does not run, so phase 4 imposes no
          `enforcement.rules` obligation on this pack's `kind: scaffolding`
          recipe — declare one ANYWAY. It is never an error, and it keeps the
          fixture valid if a later reader flips the archetype to `recipes`.

          Run `./bin/backstop pack check <dir>` and `./bin/backstop pack test
          <dir>` and paste both PASS results before declaring this task done.
        files:
          - cmd/backstop/testdata/hermetic-remote/scaffold-entrypoint-pack/pack.yml
          - cmd/backstop/testdata/hermetic-remote/scaffold-entrypoint-pack/recipes/first-source/recipe.yml
