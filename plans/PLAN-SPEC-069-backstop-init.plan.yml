      - id: TASK-002
        type: setup
        title: "Author scaffold-RECIPE fixture packs at two declared kinds, for the scaffold step and its preserve classes"
        description: |
          CLM-130 needs a pack declaring a real `pkg/recipe` RECIPE — one
          `create` op with a payload and a declared target. The existing
          `scaffold-config-pack` fixture is NOT it: its `scaffolds:` block is
          packval's `tier: complete` scaffold declaration, a DIFFERENT
          mechanism.

          Author TWO fixture pack sources, identical but for the declared
          recipe `kind`, because the kind is one of the only two observables
          REQ-035's classifier has:

            scaffold-recipe-pack     — recipes[].kind: scaffolding
                                       (empty Rule/CoveringWaiver pair here is
                                        UNAMBIGUOUSLY user-owned: CLM-140)
            scaffold-templating-pack — recipes[].kind: templating
                                       (empty pair here is INDETERMINATE:
                                        CLM-142)

          Each declares one recipe with one `create` op writing one target at
          a path the RECIPE names. The payload is arbitrary bytes chosen to
          prove byte-identical landing; it is pack DATA, so a filename or
          extension here does NOT put a literal in the init source set
          CLM-131 scans.

          Declare NO required-without-default param on either. Init supplies
          no param to any apply (CLM-136); a required param would make these
          fixtures untestable through init by construction.

          ★★ BOTH PACKS MUST ACTUALLY PASS `pack check` AND `pack test`, AND
          AS ORIGINALLY SCOPED THEY WOULD NOT HAVE. `pack add` runs both
          pipelines UNCONDITIONALLY before install, so a fixture that fails
          either cannot be installed and every claim riding on it dies with
          it. Two shipped obligations are easy to miss, both verified against
          the code rather than assumed:

            (a) PHASE 1 CONTENT (pkg/packval/phase1.go:45). A pack with an
                EMPTY `content.ruleset.rules` AND no `content.scaffolds` AND
                no `content.sdk` fails structural validation with "content is
                required". These are recipe-only packs, so they carry NO
                ruleset — each must therefore declare a `content.scaffolds`
                block. A BARE scaffold entry is enough (`id` and `path`
                only): the directory must exist and hold a file, and it must
                NOT be padded with `tier`/`sample_config`/`pairs_with`
                authoring metadata. Padding is not harmless — `tier: complete`
                makes packval phase 3 RENDER the scaffold, and `pairs_with`
                is `code`-archetype vocabulary these packs deliberately do not
                use. The shipped proof is
                cmd/backstop/testdata/recipes-archetype-pack, whose bare
                `service-base` scaffold passes both pipelines today; copy its
                shape.

            (b) PHASE 4 RECIPE ENFORCEMENT (pkg/packval/phase4.go:137-149).
                Declare `archetype: recipes` on both — that is what these
                packs ARE, and it is the archetype that imposes no ruleset and
                no pairs_with obligation. It also switches ON
                `checkRecipeEnforcement`: a `kind: scaffolding` or
                `kind: implementing` recipe MUST declare `enforcement.rules`,
                and an `enforcement:` block present with an EMPTY rules list
