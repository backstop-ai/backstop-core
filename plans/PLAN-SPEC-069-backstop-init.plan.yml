      - id: TASK-045
        type: implementation
        title: "Implement newInitCommand and wire it into the command tree"
        description: |
          cmd/backstop/init.go — thin by construction, mirroring
          cmd/backstop/recipe_apply.go. It holds four things and nothing else:
          flag definitions, flag→Options translation, report rendering, and
          exit-code mapping.

          IT CONSTRUCTS THE RUNNER FROM THE ADAPTERS TASK-054 BUILT AND
          BUILDS NONE OF ITS OWN: `initPackInstaller`, `initRecipeApplier`,
          `initGateRunner` and `unavailableBaselineSeeder` (all
          cmd/backstop/init_seams.go) plus `packToolchainProber`
          (cmd/backstop/init_toolchain.go, TASK-042). Five arguments,
          positional, in NewRunner's declared order. A NewRunner error is a
          CONFIG error (exit 2) naming the nil dependency — surface it, do not
          fall back to a partial runner, and do not substitute a fake for a
          seam that failed to construct.

          The toolchain prober's `Runner` is `check.ExecCommandRunner{Dir:
          …}` rooted at the resolved project root — that is the ONLY place the
          working directory is bound, because `check.CommandRunner` takes no
          per-call directory (pkg/check/runner.go:28-30) and a second rooting
          mechanism would be a second execution path in miniature (TASK-042).

          FLAGS: `--no-<cap>` (seven), `--only <cap>` (repeatable),
          `--pack <ref>` (repeatable), `--ci <pack>:<recipe>@<version>`,
          `--scaffold <pack>:<recipe>@<version>`. Both ref flags carry WHOLE
          OPAQUE STRINGS into Options. No param flag on either.

          EXIT MAPPING: 0 / non-zero / 2, per the matrix TASK-044 pins.
          Compute it from THE REQUEST, not from the resulting filesystem state
          (Sharp Edge 11).

          NEVER READ STDIN. Init does not prompt, so it must behave identically
