      targetPkg == ""                            → SKIP
      samePackage                                → satisfied
      !samePackage && referenced[targetPkg]      → satisfied
      !samePackage && !referenced[targetPkg]     → noTarget VIOLATION

  So a mandated test satisfies its subject by living IN the subject package
  OR by REFERENCING it. That second row is not a loophole — it is what lets
