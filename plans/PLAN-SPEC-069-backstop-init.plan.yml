      - id: TASK-030
        type: implementation
        title: "Implement the CI step over the RecipeApplier seam"
        description: |
          pkg/initialize/step_ci.go. Step 9, governed SOLELY by the presence
          of `--ci`. It is NOT a capability: there is no `--no-ci` because
          omission IS the opt-out (Sharp Edge 8), and adding `ci` to the
          capability set would give one outcome two report paths and two
          justifications. No `ci` verb or subcommand.

          The step does exactly three things:
            1. hands the `--ci` value to ParseRecipeRef byte-identically;
            2. on ANY resolve failure, surfaces that error VERBATIM attributed
               to the CI step, lets every other step complete, and marks the
               step a broken promise;
            3. on success, applies through the shipped path and reads the
               result's Written and Preserved slices, running EVERY preserve
               through the phase-4 classifier.

          The shipped errors already name what was missing and what IS
          available, which is precisely why init adds nothing. Init implements
          NO CI DETECTION: it never enumerates installed packs looking for a
          CI pack, never probes for a platform config file, and adds no
          guidance text of its own (CLM-085, scanned in TASK-047 — and the
          guard SPEC-070 defers to for keeping doctor guidance off this step).

          Supply NO recipe param. A recipe declaring a param required with no
          default cannot be applied by init at all; the shipped apply's own
          error surfaces verbatim and the consumer finishes with
          `backstop recipe apply --param`. Deriving one — most temptingly the
          project basename already computed for `project:` — is core
          constructing recipe INPUT, the same defect one layer in as core
          constructing the `<pack>:` half of a ref (Sharp Edge 20).

          Three live constraints inherited whole-cloth, none of which init may
          work around: ISSUE-119 (brownfield CI adoption preserves rather than
          wires — REQ-035 reports it honestly and does NOT fix it; init must
          never edit the consumer's existing CI file), ISSUE-081 Gap 3
          (`insert` placement is unpinned — do not depend on it), ISSUE-110
          (no escape syntax for foreign `{{ }}` template content — a `--ci`
          ref pointing at such a recipe fails at substitution time and init's
          only correct move is to surface that failure).
