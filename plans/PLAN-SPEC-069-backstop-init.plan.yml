    tasks:
      - id: TASK-047
        type: test
        title: "Scan the pkg/initialize half of the init source set — ten denylist claims plus one positive pin over a GLOB-BOUNDED boundary"
        description: |
          These are DENYLIST claims whose entire content is that a literal is
          ABSENT. They are written LAST on purpose: a scan authored before the
          source exists is a vacuous green that only bites later.

          ★ SHARP EDGE 10 — THE SCAN BOUNDARY IS THE CLAIM. Every one of these
          scans "the init source set" = `cmd/backstop/init*.go` plus
          `pkg/initialize/**`, EXCLUDING `_test.go`. A future implementer who
          moves init logic into a helper OUTSIDE that glob (a new
          pkg/initcore/, a function parked in cmd/backstop/root.go) silently
          EMPTIES these claims without failing them. Define the boundary by
          ENUMERATING THE GLOB at test time — never a hardcoded file list —
          and assert the enumeration is NON-EMPTY before scanning, so an
          empty-set scan fails loudly instead of passing trivially. Review
          Question 5 asks the founder whether an import-graph assertion should
          additionally pin it; until answered, the glob enumeration plus the
          non-empty guard is the bar.

            TestInit_SourceSetHoldsNoLanguageFrameworkOrPlatformLiteral CLM-044
              — no language name, framework name, ecosystem-manifest filename,
              or CI-platform name. The teeth of the zero-detection invariant.
            TestInit_AuthorsNoSourceFileContentOfItsOwn CLM-048
              — ★ WORDING MATTERS AND AN EARLIER SPEC DRAFT GOT IT WRONG
              (Sharp Edge 21). The denylist is on core AUTHORING the content,
              NEVER on init DELIVERING it through a pack recipe. Scan for a
              source-file PAYLOAD, template body, filename or extension
              literal. A test asserting "init writes no source file" would
              re-delete the scaffold step and pass while doing it.
            TestInit_SourceSetHoldsNoPackNameLiteralOrDefaultRoster CLM-051
              — no pack-name literal and no default pack roster. Sharp Edge 7:
              "omakase base bundle" is the seven-capability STEP set, NOT a
              baked pack roster; a roster in core is the same defect REQ-016
              v1.2.0 was corrected to remove, one layer up.
            TestInit_SourceSetConstructsNoPartOfTheCIRef CLM-073
              — no pack name, no recipe id, no version literal, no CI-platform
              name.
            TestInit_SourceSetConstructsNoPartOfTheScaffoldRefOrItsPayload CLM-131
              — the same, plus no source-file payload, template body, filename
              or extension.
            TestInit_SuppliesNoRecipeParamToEitherApply CLM-136
              — no param map is constructed and no value is derived from the
              target directory's name or from anything init found on disk
              (Sharp Edge 20).
            TestInit_ImplementsNoBaselineSeedingMachinery CLM-060
              — nothing writes .backstop/baseline.json or computes a
              fingerprint. That machinery is ISSUE-056's.
            TestInit_ChangesNoGatePackageFileAndDoesNotMaskTheRemotelessMessage CLM-063
              — this implementation changes NO file under pkg/gate, and init
              neither rewrites, suppresses nor substitutes for the remoteless
              baseline_comparison message.
            TestInit_ImplementsNoLocalProvenanceCache CLM-089
              — no local-provenance cache, no pack-sources record, no
              lock-schema change. That half is ISSUE-055's.
            TestInit_ImplementsNoCIDetectionOrBespokeGuidance CLM-085
              — init never enumerates installed packs looking for a CI pack,
              never probes for a platform config file, and adds no guidance
              text beyond attributing the surfaced error to the CI step. ★
              SPEC-070 EXPLICITLY DEFERS TO THIS TEST to keep doctor guidance
              off init's CI steps — it must remain a real assertion.
            TestInit_HoldsExactlyOneExecConstructionAndItTakesNoConsumerInput CLM-145
              — ★ THE ONE POSITIVE PIN IN THIS TASK, not a denylist. A
              structural (AST) scan of the whole init source set finds
              EXACTLY ONE exec.Command/exec.CommandContext construction, it
              lives in pkg/initialize/step_git.go (REQ-006's `git init`), and
              every argument to it is a string literal or a `context.*` call,
              never a variable. A second construction anywhere in the set,
              this one moving to another file, or this one interpolating ANY
              consumer- or pack-supplied value all fail the scan. CLM-109
              covers the cmd/backstop half as a flat denylist because no
              sanctioned construction exists there; here the sanctioned one
              must be pinned positively instead of banned.
