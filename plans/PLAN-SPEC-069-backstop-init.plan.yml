phases:
  # ═══════════════════════════════════════════════════════════════════════
  # Phase 1 — Test-fixture pack sources. Four independent trees, no
  # production code, fully parallel.
  # ═══════════════════════════════════════════════════════════════════════
  - id: phase-1
    name: "Phase 1: Fixture pack sources for acceptance, scaffold, and toolchain execution"
    tasks:
      - id: TASK-001
        type: setup
        title: "Author the SEVENTH hermetic-remote fixture pack: one gate_type lint engine with a real allowlisted command"
        description: |
          The acceptance runs (CLM-091/CLM-092) install a REAL pack by git ref
          through newHermeticRemote. NONE of the six existing fixture sources
          under cmd/backstop/testdata/hermetic-remote/ can serve — every one
          declares its engine with `command: ""` on purpose, so nothing can
          dispatch and a PASS over them asserts nothing; `invalid-pack` also
          fails `pack check` and `fixture-fail-pack` fails `pack test`, and
          `pack add` runs both pipelines unconditionally. Hence a seventh.

          THE GATE TYPE IS LOAD-BEARING, NOT METADATA (Sharp Edge 16).
          Declare `gate_type: lint`. gateTypeHasDedicatedStep
          (cmd/backstop/pack_gate.go:107) returns true for substantiveness,
          contracts and coverage ONLY, so a `lint` rule survives
          excludeDedicatedStepRules (:123, called at gate.go:828) and
          dispatches through the generic `pack_engines` path — a dimension
          NEITHER acceptance profile disables (the pack-only profile turns off
          exactly the five SDLC dimensions; pack_engines is not among them).
          That is the whole reason the same engine is live under both
          profiles, which is what makes CLM-112's can-go-red half provable.
          Anyone re-tagging this field must re-derive the routing — both
          acceptance tests keep passing while asserting nothing.

          ENGINE SHAPE — copy packs/contracts' proven grep engine field for
          field and lift it to lint:
            command: grep -rn
            input_mode: pattern-arg
            input_flag: -e
            scope_kind: file-args
            category: opinion
            gate_type: lint
            convert: grep/to-sarif.sh
            provision: {tool: grep, version: "*"}
          Nothing is downloaded and no network is touched. The convert script
          normalizes grep matches to SARIF; base it on
          packs/contracts/grep/to-sarif.sh.

          ONE RULE, carrying a distinctive marker pattern that appears NOWHERE
          in a freshly-initialized project — use a high-entropy literal such
          as BACKSTOP_ACCEPTANCE_MARKER_7F3A. Sharp Edge 17: that literal
          necessarily appears in this pack.yml, which lands under
          .backstop/packs/, so the acceptance PASS depends on the gitignore
          step (step 5) keeping that tree out of the observe step's scope.
          Choose the marker so a scope regression is DETECTABLE rather than
          confusing, and say so in a comment in the manifest.

          `pack add` runs pack check AND pack test unconditionally, so the
          rule must declare claims with positive and negative fixtures that
          genuinely falsify — a fixture CONTAINING the marker and one without.
          Capture the fixture content from a real `grep -rn` run; do not
          fabricate it.
        files:
          - cmd/backstop/testdata/hermetic-remote/acceptance-lint-pack/pack.yml
