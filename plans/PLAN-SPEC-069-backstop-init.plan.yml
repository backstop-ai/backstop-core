      - id: TASK-049
        type: test
        title: "The acceptance runs with REAL packs by git ref, the non-vacuity guard, the discovery tripwire, and DD-7's evidence"
        description: |
          ★ A PACKLESS ACCEPTANCE RUN DOES NOT SATISFY REQ-019. With zero packs
          installed the gate has no pack engines to dispatch and the toolchain
          step reports capability-absent, so a "PASS with zero violations"
          would assert almost nothing. REQ-018 forbids a local-path `--pack`
          value, so these runs PUBLISH TASK-001's fixture pack source as a
          hermetic remote (newHermeticRemote,
          cmd/backstop/hermetic_remote_harness_test.go — the GIT_CONFIG_GLOBAL
          insteadOf redirect SPEC-055 built: a real clone at a real tag, no
          network) and install it BY GENUINE GIT REF.

            TestInit_FullSdlcFreshRepoWithRealPacksThenGateReachesPassWithZeroViolations CLM-091
            TestInit_PackOnlyFreshRepoWithRealPacksThenGateReachesPassWithZeroViolations CLM-092
              — fresh directory, `backstop init` (bare / `--no-sdlc`)
              installing the fixture pack by git ref, then `backstop gate`:
              PASS with ZERO violations, both profiles.

          ★ THE NON-VACUITY GUARD, IN THREE PARTS — dispatch alone is too weak
          a bar, because a fixture engine with no real content satisfies "an
          engine ran" while asserting nothing (CLM-112):
            TestInit_AcceptanceGateRunsDispatchedRealPackEngines
              (1) the gate each acceptance claim asserts PASS over actually
              DISPATCHED the installed pack's engine. A PASS from a gate with
              zero dispatched pack engines cannot satisfy CLM-091 or CLM-092.
            TestInit_AcceptanceDispatchedEngineCanProduceAViolation
              (2) that engine is demonstrably CAPABLE of a violation: the same
              pack, installed the same way, over a fixture project
              deliberately containing the marker its rule flags, produces at
              least one violation attributed to that engine. The acceptance
              PASS is therefore a pack that CAN go red and did not.
            TestInit_AcceptanceEngineCanProduceAViolationUnderBothProfiles
              (3) that demonstration runs under BOTH profiles, because a
              violation that cannot reach the verdict under the pack-only
              profile's enforcement.policy would leave CLM-092 unfalsifiable
              even with (1) and (2) satisfied.

          Sharp Edge 17: the acceptance PASS quietly depends on the gitignore
          step keeping .backstop/packs/ (which contains the pack's own
          manifest, which necessarily contains the marker) out of the observe
          step's scope. If a run subtracts the `gitignore` capability, or a
          scope change stops honoring ignore entries, the pack finds its own
          marker and the claim reds for a reason having nothing to do with
          init. Note that dependency in the test.

          The fixture pack declares no test or build engine, so the acceptance
          runs' toolchain step reports capability-absent — deliberate and
          stated. REQ-011's execution path is proven by phase 14's own claims.

          ★ TestInit_ArtifactsUnderTheScaffoldedRootAreDiscoveredAndGated
          CLM-103 — EXPECTED RED UNTIL SPEC-068 LANDS, and RED FOR A DIFFERENT
          REASON than the config trio: this one fails at DISCOVERY, because
          `.backstop` sits on the unconditional skip list at
          cmd/backstop/artifact_discover.go:47-49. It is the DELIBERATE
          TRIPWIRE that stops this spec being implemented into a vacuous
          green: an artifact placed under the root init created must be
          DISCOVERED and validated (non-zero artifact count), and a
          deliberately INVALID artifact placed there must make validation
          FAIL. Do not "fix" it by moving the layout, by writing a different
          root, or by asserting a count of zero.

          TestInit_ScaffoldedProjectTurnsAnEmptyProjectEntrypointFailureGreen
          CLM-139 — DD-7's motivating evidence, bound to a test rather than to
          a story. Using TASK-003's fixture pack: the declared entrypoint
          exits NON-ZERO over a project with no source file and exits ZERO
          over the same project once the scaffold recipe has run, with the
          scaffolded file as the ONLY difference. This is what regresses
          silently if a later refactor moves the scaffold step after the
          toolchain step.
        files:
          - cmd/backstop/init_acceptance_test.go
        claims:
          - CLM-091
          - CLM-092
          - CLM-112
          - CLM-103
          - CLM-139
        test_names:
          - TestInit_FullSdlcFreshRepoWithRealPacksThenGateReachesPassWithZeroViolations
          - TestInit_PackOnlyFreshRepoWithRealPacksThenGateReachesPassWithZeroViolations
          - TestInit_AcceptanceGateRunsDispatchedRealPackEngines
          - TestInit_AcceptanceDispatchedEngineCanProduceAViolation
          - TestInit_AcceptanceEngineCanProduceAViolationUnderBothProfiles
          - TestInit_ArtifactsUnderTheScaffoldedRootAreDiscoveredAndGated
          - TestInit_ScaffoldedProjectTurnsAnEmptyProjectEntrypointFailureGreen
        depends_on:
          - TASK-046
          - TASK-001
          - TASK-003

