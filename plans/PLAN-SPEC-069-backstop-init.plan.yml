      - id: TASK-042
        type: implementation
        title: "Implement the SHARED packEntrypointProber and init's packToolchainProber adapter over it — allowlist gate, splitter, shared runner, entered through Run not RunStdout"
        description: |
          TWO FILES. The execution core is built ONCE and is package-neutral;
          init's report vocabulary layers on top of it.

          ═══ (A) cmd/backstop/pack_entrypoint_prober.go — THE SHARED CORE ═══

          THIS IS THE ONE EXECUTION ROUTE FOR PACK-DECLARED TEST/BUILD
          ENTRYPOINTS, AND IT HAS TWO CALLERS. PLAN-SPEC-070's
          `checkToolchainRuns` (doctor's toolchain-runs check) CONSUMES this
          type once this phase lands and does NOT build its own copy — both
          files are `package main` in cmd/backstop, so this is a
          package-internal helper, not a cross-package extraction. Keep the
          surface RAW: it reports what ran and what happened, and knows
          nothing about init's steps or doctor's check results.

            // entrypointOutcome is the mechanically honest result of one
            // declared entrypoint execution. It carries NO report vocabulary:
            // "owed setup"/"verbatim" are init's words for these values,
            // warn/fail/skip are doctor's.
            type entrypointOutcome int

            const (
                entrypointRefused       entrypointOutcome = iota // allowlist said no; NEVER split, NEVER run
                entrypointPassed                                 // started, exit 0
                entrypointUnstartable                            // could not be STARTED at all
                entrypointExitedNonZero                          // started, exited non-zero
            )

            // entrypointProbe is one selected binding's execution record.
            type entrypointProbe struct {
                PackName  string             // manifest name of the declaring pack
                EngineKey string             // the engines: map key, for stable attribution
                GateType  engine.GateType    // GateTypeTest or GateTypeBuild
                Command   string             // the pack's declared command string, VERBATIM
                Outcome   entrypointOutcome
                ExitCode  int                // meaningful ONLY for entrypointExitedNonZero
                Output    []byte             // combined stdout+stderr, from CommandRunner.Run
                Err       error              // the refusal error or the start error; nil otherwise
            }

            type packEntrypointProber struct {
                Packs  []*pack.Manifest
                Runner check.CommandRunner
            }

            // Probe executes every declared test/build entrypoint EXACTLY
            // ONCE, in deterministic order, and returns one entrypointProbe
            // per selected binding. Zero selected bindings returns an empty
            // slice: ABSENCE IS THE CALLER'S TO CLASSIFY (init reports
            // capability-absent without failing, CLM-058; doctor warns,
            // its outcome (d)). Probe itself never decides that.
            func (p *packEntrypointProber) Probe(ctx context.Context) []entrypointProbe

          NO ERROR RETURN, BY DESIGN. An allowlist refusal is per-binding
          state (`entrypointRefused` + `Err`), not a whole-probe abort,
          because the two callers must dispose of it differently: init
          surfaces it as a CONFIG ERROR (CLM-107, exit 2) while doctor
          surfaces it as that check's failure. A shared `error` return would
          force one caller's disposition on the other, which is precisely the
          init-flavored interface this extraction exists to avoid.

          DETERMINISTIC ORDER IS PART OF THE SHARED CONTRACT: walk `Packs` in
          SLICE order, and within each manifest walk `Engines` by SORTED KEY —
          `Manifest.Engines` is a MAP (pkg/pack/manifest.go:31), so an
          unsorted walk yields a different report on every run. Init does not
          assert ordering today; SPEC-070's CLM-007 asserts BYTE-IDENTICAL
          report order across repeated runs, and it is satisfiable only if the
          shared prober sorts. Do not "simplify" the sort away.

          NO projectRoot PARAMETER, AND THAT IS NOT AN OMISSION:
          `check.CommandRunner` has no working-directory argument — the
          directory is a CONSTRUCTION-TIME property of
          `check.ExecCommandRunner{Dir: …}` (pkg/check/runner.go:28-30).
          Init constructs its runner rooted at `Options.ProjectRoot` in
          TASK-045; doctor's `ctx.Runner` is rooted at `ctx.ProjectRoot`.
          Introducing a second rooting mechanism here would be a second
          execution path in miniature.

          THE (b)/(c) SPLIT LIVES HERE, ONCE. Both specs demand the same ONE
          mechanically honest signal — the executable could not be STARTED
          versus it started and exited non-zero — so classify it in the shared
          prober: a non-nil error that is an `*exec.ExitError` is
          `entrypointExitedNonZero` (take `ExitCode()` from it); a non-nil
          error that is NOT is `entrypointUnstartable`. Attempt no other
          classification, in either caller. Two copies of this two-line split
          is how the two commands come to disagree about the same failure.

          ═══ (B) cmd/backstop/init_toolchain.go — INIT'S THIN ADAPTER ═══

          The spec contract is PRESERVED EXACTLY; only its body changes:

            type packToolchainProber struct { Packs []*pack.Manifest; Runner check.CommandRunner }
            func (p *packToolchainProber) Probe(projectRoot string) ([]initialize.StepReport, error)

          It builds `&packEntrypointProber{Packs: p.Packs, Runner: p.Runner}`,
          calls `Probe(ctx)`, and does NOTHING ELSE mechanical — no second
          selection, no second allowlist call, no exec of its own. Everything
          it adds is REPORTING, and all of it is init-specific:
            • entrypointRefused    → CONFIG ERROR (the returned `error`;
              CLM-107 asserts non-execution AND that it is neither a toolchain
              pass nor a toolchain fail).
            • entrypointPassed     → a delivered StepReport.
            • entrypointUnstartable→ the OWED-SETUP report (CLM-056): names
              the pack whose entrypoint could not run and points at THAT
              PACK's own documented install steps.
            • entrypointExitedNonZero → the VERBATIM report (CLM-105/CLM-106):
              exit code plus `Output` verbatim, attributed to the pack and the
              command and to NOTHING ELSE.
            • an EMPTY probe slice → capability-absent, not a failure
              (CLM-058).
          `projectRoot` is init's: the reports name where the command ran.
          Doctor's rollup (one result, per-entrypoint lines, worst outcome)
          is the mirror-image layer on its own side and never lands here.

          Selection is by engine.GateTypeTest and engine.GateTypeBuild
          ONLY, in the SHARED prober. Then, per selected engine, EXACTLY
          THREE STEPS:
            checkEngineToolAllowed (cmd/backstop/pack_gate.go:812 — the
            trusted-tool allowlist plus the lock-resolved version pin)
            → splitCommand (pack_gate.go:887 — whitespace argv tokenization)
            → the shared check.CommandRunner.
          That is runFindingsEngine's sequence (pack_gate.go:573-600) minus
          the SARIF parse. Introduce NO second, weaker way to run a
          pack-declared command and NEVER run one through a shell: init
          executes arbitrary pack-supplied command strings, so an unbound
          execution path here is a hole in the trusted-tool invariant, not a
          style preference. The trust gate sits BEFORE the splitter and the
          runner. All three steps live in file (A) and nowhere else — the
          adapter in file (B) must not call any of them.

          ★★ ENTER THE RUNNER THROUGH `check.CommandRunner.Run`
          (pkg/check/runner.go:17, COMBINED stdout+stderr), NOT `RunStdout`
          (:21, stdout only), which is what runFindingsEngine calls at
          pack_gate.go:648. This is the ONE deliberate divergence and the
          shipped comments state both reasons: RunStdout exists so a tool's
          stderr banner cannot corrupt the SARIF bytes on stdout; Run exists
          for "the build/test executors whose violation messages may
          legitimately include stderr" — which is exactly case (c). A failing
          build or test entrypoint routinely writes its whole diagnostic to
          stderr, so binding RunStdout prints an EMPTY "captured output
          VERBATIM" for precisely the failures case (c) exists to surface.
          Init parses nothing and renders to a human, so the contamination
          hazard does not apply here while the lost-diagnostic hazard does.
          The allowlist gate and the splitter are shared UNCHANGED. Put this
          reason in a comment on the call site — CLM-122 is the tripwire, but
          the comment is what stops the next reader "fixing" it.

          ★ CROSS-SPEC, NOW SETTLED BY CONSTRUCTION: SPEC-070's
          checkToolchainRuns binds the same three steps and names NO runner
          method, which under two separate implementations was a live drift
          risk (Sharp Edge 12) — the two reports would disagree on any
          entrypoint that diagnoses only on stderr. Because the sequence AND
          the method now live once, in `packEntrypointProber.Probe`, and
          PLAN-SPEC-070's toolchain-runs task consumes it, there is no second
          site to align. The `Run` call site is therefore the ONE place the
          method is chosen for BOTH commands: comment it accordingly, and if
          a future reader wants doctor to capture differently, that is a
          spec-level conversation to surface, never a private second runner.

          Each engine's outcome is ITS OWN command's exit status and nothing
          adjacent: not a package-manager command (init runs none), not a
          configuration file, not another engine's command in the same pack.
          Outcomes are independent.

          WHAT INIT CANNOT DISTINGUISH, STATED RATHER THAN PROMISED: a pack
          declares ONE command per engine, so if the declared entrypoint is a
          wrapper invocation, the exit status init reads IS the wrapper's.
          Core cannot see past it and must not pretend to. The temptations to
          "fix" this — wrapper-aware parsing of captured output, a second
          probing command, a package-manager-shaped retry — all bake ecosystem
          knowledge into core and would be caught by CLM-044/CLM-109 only if
          the literal happened to be recognizable. The durable guard is the
          POSTURE: case (c) reports and does not diagnose (Sharp Edge 13).
        files:
          - cmd/backstop/pack_entrypoint_prober.go
          - cmd/backstop/init_toolchain.go
        claims:
          - CLM-053
          - CLM-054
          - CLM-055
          - CLM-118
          - CLM-119
          - CLM-120
          - CLM-121
          - CLM-056
          - CLM-105
          - CLM-122
          - CLM-106
          - CLM-057
          - CLM-107
          - CLM-108
          - CLM-058
        depends_on:
          - TASK-041

