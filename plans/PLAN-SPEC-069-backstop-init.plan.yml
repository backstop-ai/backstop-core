      - id: TASK-054
        type: implementation
        title: "Implement the four production seam adapters over the shipped assemblies — one file, no second path anywhere"
        description: |
          cmd/backstop/init_seams.go. FOUR small types, each of which does
          exactly one thing: translate between a pkg/initialize seam and an
          assembly that ALREADY EXISTS in package main. If any of these grows
          logic of its own, it has become a second implementation of something
          and the wrong thing is being built.

          THE FILE IS IN cmd/backstop, AND FOR EVERY ADAPTER THE LOCATION IS
          FORCED — the same forcing the spec states for `packToolchainProber`,
          applied consistently. It is also inside the `cmd/backstop/init*.go`
          glob TASK-048 scans, which is deliberate: these adapters are init
          source and must answer to CLM-109 and CLM-059 like the rest of it.

          ═══ initPackInstaller — PackInstaller ═══
            Install(projectRoot, ref) error →
            `newProductionAddCommand()` (cmd/backstop/pack_wiring.go), then
            `.Run(ref, distribution.AddOptions{ProjectDir: projectRoot})`.
            Construct NOTHING else. pack_wiring.go is THE production assembly
            seam for the pack lifecycle; assembling a second AddCommand here
            (or handing it a nil validator "because init already validated")
            is exactly the partial-wiring defect that file exists to end —
            ISSUE-073 shipped `pack add` with no cloner in it at all. Init
            supplies no `Version`: the whole pinned ref is the consumer's, and
            splitting a version out of it would be core holding half a ref.

          ═══ initRecipeApplier — RecipeApplier ═══
            Apply(projectRoot, ref) (initialize.ApplyOutcome, error) →
            `runRecipeApply(ref, projectRoot, nil)` (TASK-053's widened
            signature), then map: `ApplyResult.Written` → `Written`,
            `ApplyResult.Preserved` → `Preserved` WITH Rule and CoveringWaiver
            INTACT (dropping either is what collapses REQ-035's three classes
            into one), and the returned declared kind → `RecipeKind`.
            THE PARAM ARGUMENT IS NIL AND THAT IS CLM-136, NOT AN OVERSIGHT:
            init supplies no recipe param to either apply, and the most
            tempting derivation — the project basename already computed for
            `project:` — is core constructing recipe INPUT (Sharp Edge 20).
            Do not build a params map here, empty or otherwise, that a later
            reader could fill.
            SURFACE THE ERROR UNCHANGED. Every fail-loud resolve error
            (CLM-079/080/081/082/102) is produced inside this path and must
            reach the step VERBATIM — no wrapping that prepends init's own
            guidance, no re-classification, no ConfigError/plain-error
            re-shuffling. The step attributes it; the adapter does not
            interpret it.

          ═══ initGateRunner — GateRunner ═══
            Run(projectRoot) ([]initialize.DimensionCount, error) →
            `buildGateSteps(projectRoot)` (cmd/backstop/gate.go:647) →
            `gate.New(...)` → `.Run(ctx)`, then reduce the returned
            `GateResult.Steps` to one DimensionCount per gate dimension.
            Use buildGateSteps; do NOT hand-assemble a step list. It is what
            loads the installed packs and derives the SourceClassifier and
            TestNameMatcher, and a second assembly would make init OBSERVE a
            different gate than `backstop gate` RUNS — an observation that
            disagrees with the command it is previewing is worse than no
            observation. Dimension names come from the gate's own step
            vocabulary, so this reduction introduces no tool or language noun
            (CLM-043).
            The gate's VERDICT is not consulted here. Findings are
            OBSERVATION: a non-passing gate is not an error return, it is
            counts. Returning an error on a red gate would make pre-existing
            findings an init failure, which REQ-014 forbids in the one
            sentence the whole exit-code matrix is organized around.

          ═══ unavailableBaselineSeeder — BaselineSeeder ═══
            Seed(projectRoot) (string, error) → returns
            `("", initialize.ErrBaselineSeedingUnavailable)`. That is the
            WHOLE body. This spec builds no seeding machinery: REQ-012 is
            ISSUE-056's, and CLM-060 requires that nothing in the init source
            set writes `.backstop/baseline.json` or computes a fingerprint.
            The type exists because NewRunner is fail-closed and a nil seam is
            unconstructable, so "capability absent" has to be a value. Do not
            grow it into a real seeder here, and do not have it consult
            anything on disk to decide.

          NO SECOND EXECUTION PATH IS INTRODUCED BY ANY OF THE FOUR
          (CLM-109). None of them constructs `exec.Command`, invokes a shell,
          or calls `checkEngineToolAllowed` / `splitCommand` — the only
          command execution on init's path is `packEntrypointProber`'s
          (TASK-042), and the only pack-command execution these four reach is
          whatever `runRecipeApply` and `buildGateSteps` already do inside the
          shipped assemblies.
        files:
          - cmd/backstop/init_seams.go
        claims:
