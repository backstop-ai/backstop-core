  # ═══════════════════════════════════════════════════════════════════════
  # Phase 3 — The capability vocabulary (REQ-002). The spine of the command.
  # ═══════════════════════════════════════════════════════════════════════
  - id: phase-3
    name: "Phase 3: Capability vocabulary and resolution (REQ-002)"
    tasks:
      - id: TASK-008
        type: test
        title: "Test capability resolution: --only narrows to exactly the named set, and there is no eighth name"
        description: |
          Drive ResolveCapabilities directly.

          TestInit_OnlyNarrowsToExactlyTheNamedCapabilities (CLM-011) —
          `--only` is repeatable, narrows to EXACTLY the capabilities named
          and to no others, and can never ADD, because its input is validated
          against the same seven-name vocabulary.

          TestInit_ScaffoldIsNotACapabilityName (CLM-132) — `scaffold` is
          rejected as unrecognized exactly as any other eighth name would be.
          The scaffold step is governed SOLELY by the presence of the
          `--scaffold` flag; there is no `--no-scaffold` (Sharp Edge 8's
          reasoning applied to a second flag).

          The vocabulary is exactly seven: git, sdlc, gitignore, packs,
          toolchain, baseline, observe. `backstop.yml` generation is NOT a
          capability (it is unconditional), and neither CI nor scaffold is.

          Cover both error shapes here too, at the function level:
          `--only` combined with any `--no-<cap>` is an error (two
          contradictory expressions of one set, mirroring the shipped
          --file/--all exclusion in `backstop gate`), and an unrecognized name
          errors listing all seven. Their exit-2 MAPPING is CLM-012/CLM-013,
          whose mandated tests are cmd/backstop's and land in TASK-044.
        files:
          - pkg/initialize/capability_test.go
        claims:
          - CLM-011
          - CLM-132
        test_names:
          - TestInit_OnlyNarrowsToExactlyTheNamedCapabilities
          - TestInit_ScaffoldIsNotACapabilityName
        depends_on: []

      - id: TASK-009
        type: implementation
        title: "Implement Capability, DefaultCapabilities and ResolveCapabilities"
        description: |
          pkg/initialize/capability.go, per the spec's contracts:

            type Capability string
            func DefaultCapabilities() []Capability
            func ResolveCapabilities(only []string, excluded []string) (map[Capability]bool, error)

          ResolveCapabilities is the ONLY entry point that produces a
          capability set. Order:
            1. both `only` and `excluded` non-empty → error;
            2. every supplied name checked against the seven-member
               vocabulary, unrecognized → error listing all seven;
            3. neither flag → all seven; `--only` → exactly the named subset;
               `--no-` → the seven minus the named.

          The seven names are backstop vocabulary, not tool or language nouns.
          No eighth name exists anywhere in this file.
        files:
