        type: test
        title: "Test the FOUR production seam adapters against real machinery: a real lock, a real apply, a real gate run, and the absent seeder"
        description: |
          ONE test file, cmd/backstop/init_seams_test.go, and every test in it
          drives `initialize.NewRunner` / `initialize.Options` with the REAL
          adapters TASK-054 builds — no fake from pkg/initialize/fakes_test.go
          appears anywhere in it. Referencing `initialize` is also what
          satisfies the subject join for the five moved claims, whose declared
          subject stays `pkg/initialize` (plan notes, the subject-join
          decision table).

          ★ WHY THIS TASK EXISTS AT ALL. Phases 8, 10, 11 and 12 prove the
          STEP logic over fakes, which is the right shape for step logic and
          is genuinely not enough: a fake PackInstaller writes no
          `backstop.lock`, a fake RecipeApplier lands no byte, a fake
          GateRunner invents its own dimension counts. Every one of those
          seams reaches real, already-shipped machinery in production, and
          "unit tests nail the package while the cross-package wiring stays
          unproven" is this project's recurring integration-gap failure. These
          tests are the wiring proof.

          ═══ REAL PackInstaller — CLM-086, CLM-088 ═══
            TestInit_GitRefPackInstallLandsAsAPortableLockEntry CLM-086
              Publish TASK-001's acceptance-lint-pack source as a hermetic
              remote (`newHermeticRemote`,
              cmd/backstop/hermetic_remote_harness_test.go — the
              GIT_CONFIG_GLOBAL insteadOf redirect: a real shallow clone at a
              real tag, no network) and run init with that GENUINE GIT REF as
              `--pack`. Then READ `backstop.lock` off disk and assert the
              entry is a git-source entry carrying its `source_coordinate`.
              Assert against the file, not against a returned struct: the
              COMMITTED lock is what REQ-018 is about.
            TestInit_ProducesNoLockEntryCarryingALocalPath CLM-088 (denylist)
              Over the same real run, NO entry in the lock carries a
              `local_path` value. The distribution lock records `local_path`
              only for `source_type: "local"`, so this is the assertion that
              init's refusal (TASK-024) plus the real installer's behavior
              actually compose into a portable lock.

          ═══ REAL RecipeApplier — CLM-046, CLM-047, CLM-130 ═══
            Install TASK-002's scaffold-recipe-pack the same way (hermetic
            remote, real git ref), then run init with `--ci` / `--scaffold`
            naming that pack's recipe at its pinned version.
            TestInit_AppliesRecipesOnlyThroughTheShippedResolveApplyPath CLM-046
              The target files written are EXACTLY the ones the RECIPE
              declared — enumerate what landed and compare to the recipe's own
              declared targets. Init contributes no path.
            TestInit_RecipePayloadLandsByteIdentical CLM-047
              The bytes on disk equal the pack's payload bytes EXACTLY. Read
              both and compare byte slices; no normalization, no trimming, no
              line-ending tolerance — tolerance here would hide precisely the
              rendering/rewriting this claim forbids.
            TestInit_ScaffoldRecipeTargetsLandAtTheRecipeDeclaredPaths CLM-130
              The same two properties through the SCAFFOLD step's ref rather
              than the CI step's, proving ONE seam with TWO callers reaches
              the same shipped path.

          ═══ REAL GateRunner — CLM-064 (real half) ═══
            TestInitSeams_GateRunnerReducesARealGateRunToDimensionCounts
              NOT a mandated name and deliberately so: CLM-064's mandated test
              is TASK-035's, over the reduction logic. This one proves the
              other half — that the production adapter runs the SAME assembled
              kill chain `backstop gate` runs and that its `[]DimensionCount`
              are derived from a real GateResult's steps, with dimension names
              that are backstop's own vocabulary. Run it over the initialized
              project from the PackInstaller case, so at least one dimension
              is genuinely populated; a reduction asserted over an empty gate
              result asserts nothing.

          ═══ REAL BaselineSeeder — CLM-062 (production half) ═══
            TestInitSeams_ProductionBaselineSeederReportsCapabilityAbsent
              Also not a mandated name. The production seeder returns
              `initialize.ErrBaselineSeedingUnavailable` and NOTHING ELSE
              happens: assert with errors.Is, and assert NO
              `.backstop/baseline.json` exists after a full init run and no
              fingerprint file of any kind was written. REQ-012 is ISSUE-056's
