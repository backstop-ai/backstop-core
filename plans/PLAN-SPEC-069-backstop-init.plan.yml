  # ═══════════════════════════════════════════════════════════════════════
  # Phase 4 — Shared types, the five seams, and THE ONE preserve classifier.
  # Everything downstream hangs off this phase.
  # ═══════════════════════════════════════════════════════════════════════
  - id: phase-4
    name: "Phase 4: Seam types and the single preserve classifier (REQ-035 core)"
    tasks:
      - id: TASK-011
        type: test
        title: "Test the ONE preserve classifier over its three observable classes, and the shared test fakes"
        description: |
          Two deliverables in this task, both test-side.

          (A) pkg/initialize/preserve_test.go — the classifier, driven
          directly over recipe.PreservedDivergence values plus a declared
          recipe kind. REQ-035's classes are the classes init can OBSERVE,
          which are deliberately NOT the code's three producers:

            WAIVER-COVERED  Rule and CoveringWaiver POPULATED, at ANY kind.
            USER-OWNED      pair EMPTY, kind `scaffolding` or `implementing`.
            INDETERMINATE   pair EMPTY, kind `templating`.

          THE BRANCH ORDER IS THE TRAP AND AN EARLIER SPEC DRAFT FELL INTO IT:
          preserveOrRegenerate (pkg/recipe/apply.go:348-390) tests
          `!own.adopted` FIRST at :349 and returns immediately, so the kind
          test at :357 is UNREACHABLE for any recipe no prior apply adopted. A
          never-adopted `kind: templating` recipe therefore returns a value
          BYTE-IDENTICAL to an adopted-and-materialized one. The kind does NOT
          separate producer (a) from producer (b); it only settles the
          empty-pair case for the two kinds where (b) is unreachable.

            TestInit_ScaffoldingKindEmptyPairPreserveIsClassifiedUserOwned    CLM-123
            TestInit_ImplementingKindEmptyPairPreserveIsClassifiedUserOwned   CLM-124
            TestInit_HoldsExactlyOnePreserveClassifierSharedByBothRecipeSteps CLM-144

          CLM-144's test is STRUCTURAL: assert the init source set holds
          EXACTLY ONE classification of the Rule/CoveringWaiver pair against
          the declared kind, and that both recipe steps call it. Two
          classifiers drifting would let one step report a class the other
          would not. CLM-125 (a populated pair OUTRANKS the kind at every kind,
          `templating` included) is subject cmd/backstop and lands in TASK-044.

          Do NOT reconstruct the applier's adoption bit. It is recipe-level
          (apply.go:166), keyed by the UNEXPORTED adoptionKey, and
          reconstructing it is a second derivation of a recipe's adoption
          identity — the same hazard REQ-018 refuses for local-path
          classification. Surfacing it would require editing pkg/recipe, which
          REQ-009 forbids. The ambiguity is RECORDED, not engineered around.

          (B) pkg/initialize/fakes_test.go — ONE shared set of fakes for the
          five seams (PackInstaller, RecipeApplier, GateRunner,
          ToolchainProber, BaselineSeeder), used by every step test in phases
          5-12 and by the runner test in phase 13. One set, in one file, so
          the package has no duplicate fake types and no per-file drift.

          ★ WHAT THESE FAKES ARE FOR, AND WHAT THEY CANNOT PROVE. They exist
          so each STEP's own logic — ordering, subtraction, classification,
          report wording, the converge-never-clobber posture — is testable
          without a network, a clone or a real gate run. They prove nothing
          about the machinery behind the seam: a fake installer writes no
          `backstop.lock`, a fake applier lands no byte, a fake gate runner
          invents its own dimension counts. The five claims that assert real
          machinery (CLM-046, CLM-047, CLM-086, CLM-088, CLM-130) are
          therefore written in TASK-052 against the REAL adapters, and the
          production implementations of the other four seams are TASK-054's.
          If a step test here ever seems to prove one of those five, the fake
          has grown behavior it should not have.
        files:
          - pkg/initialize/preserve_test.go
          - pkg/initialize/fakes_test.go
        claims:
          - CLM-123
          - CLM-124
          - CLM-144
        test_names:
          - TestInit_ScaffoldingKindEmptyPairPreserveIsClassifiedUserOwned
          - TestInit_ImplementingKindEmptyPairPreserveIsClassifiedUserOwned
          - TestInit_HoldsExactlyOnePreserveClassifierSharedByBothRecipeSteps
        depends_on:
          - TASK-010

      - id: TASK-012
        type: implementation
        title: "Implement the shared types, the five seam interfaces, and the single preserve classifier"
        description: |
          THREE files, exactly as the spec's contracts declare them.

          pkg/initialize/initialize.go — the types only at this task:
            Options{ProjectRoot, Capabilities, PackRefs, CIRecipeRef, ScaffoldRecipeRef}
            Outcome int
            StepReport{Step, Outcome, Detail}
            Result{Steps, Observations, Preserved, BrokenPromise}
            PreserveClass int
            ClassifiedPreserve{Path, Class, Rule, CoveringWaiver}
            DimensionCount{Dimension, Count}
            Runner struct
            NewRunner(packs, recipes, gates, tools, seeds) (*Runner, error)
          NewRunner is FAIL-CLOSED and POSITIONAL — it errors naming any nil
          dependency, the shape pkg/pack/distribution/command.go uses for
          NewAddCommand. A half-wired runner is unconstructable rather than a
          runtime nil-deref. `Runner.Run` is stubbed here and sequenced in
          TASK-039; this task owns the file's TYPES.

          TWO REF-SHAPED FIELDS AND NO REF-SHAPED CONSTRUCTOR. CIRecipeRef and
          ScaffoldRecipeRef are whole OPAQUE strings, empty when the flag was
          omitted, NEVER decomposed into pack/recipe/version parts anywhere.
          A field holding a pack name or a version separately would be core
          holding half a ref — the DD-13 bake REQ-016 v1.2.0 was corrected to
