      only standard_test.go. Safe to delete file + test.
    - Config.StandardsDirs: ZERO production readers. Safe.
    - Config.SemgrepVersion (Enforcement.SemgrepVersion, config.go:34): read ONLY
      by the two cmd forwarding sites (code_check.go, gate.go). Safe once those go.
    - GolangciLintAvailable (check.go:26): ZERO readers. Safe.
