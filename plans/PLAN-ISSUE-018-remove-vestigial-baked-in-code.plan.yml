  shared with SPEC-035 — pkg/check/check.go (`delete(opts.Executors,
  CheckTypeSemgrep)` inside the degraded-error arm) and pkg/check/registry.go
  (`execs[CheckTypeSemgrep] = &semgrepExecutor{...}`) — are DELETED IN FULL here
  as part of removing the in-process executor body. SPEC-035's CheckTypeSemgrep
  rename then applies only to the references that survive this deletion. Do NOT
  rename CheckTypeSemgrep here; the enum stays (it is the live pack-findings pass
  tag used by parsers.go ParsePackFindings / manifest.go / code_check.go) — only
  the two dead constructions of it are removed.

  DELETION-SAFETY MODEL (the TDD approach for a deletion):
    (a) PROVE no live reference remains — grep + a SPEC-034-style
        deletion-assertion test asserting the deleted symbol names are absent
        from the compiled binary / test binaries, so the dead path cannot be
        silently reintroduced. The deletion-assertion test is the "red" before
        the deletion "green".
    (b) The EXISTING test suite + `backstop gate` stay GREEN after each removal.
        Because the deleted production symbols are referenced by in-package test
        doubles and helpers, the owning test files must be deleted/trimmed in the
        SAME task as the production deletion or `pkg/check` will not compile.
    (c) PRECISE edits where the issue says so: pkg/validate/plan.go removes ONLY
        the ".standard.md" string from the fileCategory artifactExts slice — the
        fileCategory function is preserved.

  VERIFIED CALLER MAP (grep/compile evidence gathered during planning):
