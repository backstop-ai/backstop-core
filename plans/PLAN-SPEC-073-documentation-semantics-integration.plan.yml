---
plan_id: PLAN-SPEC-073
spec_id: SPEC-073
spec_version: "1.1.5"
created: "2026-08-24"
status: ready
target_repo: backstop-core
target_module: github.com/backstop-ai/backstop-core
test_command: ./scripts/verify-documentation-semantics-integration.sh
coverage_threshold: 80
notes: |
  Seed 2 only. The completed, accepted SPEC-072/PLAN-SPEC-072 artifact and its
  published ten-page/four-registry output contract are whole-plan prerequisites;
  no phase starts from partial Seed 1 state or references a predecessor task ID.
  Owner release evidence is also a hard prerequisite. Import it before adding the
  pack, preserve the design-system pin, and prove clean restoration, installed-byte
  identity, actual-corpus semantics, and missing-install refusal. Delivery is
  confined to SPEC-073's exact five-file implementation allowlist. The linked
  SPEC-073/PLAN-SPEC-073 version and state transitions remain separately validated
  artifact-ledger surfaces and do not expand implementation ownership.
  The shell entrypoint is the executable verification subject, but is not declared
  as a function contract because the installed Go-contracts pack compiles function
  signatures as Go; Bash discovery and the verifier's own execution remain authoritative.
  Isolated trusted website-policy consumer gates use Core's supported external
  pack-sandbox mode so the released validator can read the copied fourteen-file
  corpus; Core's ordinary blocking gate retains its native sandbox profile.
  Clean dispatch uses the exact fourteen-file scope. Mutated isolated copies use
  all-scope because Core's file-scope filter intentionally removes corpus-level
  sandbox findings that carry no structured single-file field.

phases:
  - id: phase-1
    name: "Owner release evidence and boundary"
    tasks:
      - id: TASK-001
        type: setup
        title: "Require accepted Seed 1 outputs and the governed owner release"
        description: |
          Before any Seed 2 work, require completed acceptance of SPEC-072 and
          PLAN-SPEC-072 as a whole and the published ten-page/four-registry output
          contract. Run SPEC-072's exact acceptance command against those checked-in
          outputs and stop if it fails. Consume only the accepted artifact contract;
          do not inspect or depend on any PLAN-SPEC-072 phase, task, or partial state.
          Obtain one immutable owner evidence reference binding the documentation
          pack's owner artifact, imported manifest identity, independent source
          coordinate, exact stable version and v-tag, full commit, content hash,
          green pack check/test, and every exported claim's dispatched positive and
          negative production-path fixtures. Stop on missing, mutable, self-asserted,
          or mixed-release evidence; never invent identity or edit the owner repo.
        files: [.backstop/website-pack-releases.yml]
        claims: [CLM-005, CLM-006, CLM-007, CLM-014, CLM-015, CLM-016, CLM-017, CLM-018, CLM-019, CLM-020, CLM-030]
        depends_on: []
      - id: TASK-002
        type: test
        title: "Drive ownership, evidence, and scope checks red"
        description: |
          Add the mandated isolated shell tests for the five-file allowlist;
          forbidden pkg/cmd/packs/docs changes; embedded policy, fixtures, direct
          engine calls, or design-system semantic ownership; complete versus
          incomplete/mixed owner evidence; fixture dispatch/path fidelity; exclusion
          of live tag resolution, owner reruns, and generic filter introspection; and
          generalized prose or unnamed-enabler scope creep.
        files: [scripts/verify-documentation-semantics-integration.sh]
        claims: [CLM-001, CLM-002, CLM-003, CLM-004, CLM-005, CLM-006, CLM-007, CLM-014, CLM-015, CLM-016, CLM-017, CLM-018, CLM-019, CLM-020, CLM-027, CLM-028, CLM-029, CLM-030, CLM-031, CLM-032, CLM-033, CLM-034]
        test_names: [verify_owner_boundary_accepts_bounded_consumer_surfaces, verify_owner_boundary_rejects_forbidden_core_surface, verify_owner_boundary_rejects_embedded_policy_surface, verify_owner_boundary_rejects_design_system_semantic_ownership, verify_release_import_schema_accepts_exact_two_role_document, verify_release_import_schema_rejects_shape_and_cardinality_violation, verify_release_import_schema_rejects_invalid_scalar_or_reference, verify_owner_evidence_accepts_common_checks_for_both_roles, verify_owner_evidence_rejects_self_authored_incomplete_or_mixed_proof, verify_owner_evidence_accepts_documentation_specific_dispatch_proof, verify_owner_evidence_rejects_unproven_documentation_dispatch, verify_owner_evidence_accepts_design_system_common_only_matrix, verify_owner_evidence_rejects_role_specific_matrix_contradiction, verify_owner_evidence_excludes_live_owner_and_generic_fixture_introspection, verify_scope_boundary_excludes_generalized_prose_system, verify_scope_boundary_accepts_separately_governed_enabler, verify_scope_boundary_rejects_absorbed_or_prose_prerequisite, verify_seed2_baseline_accepts_unique_seed1_terminal_transition, verify_seed2_baseline_rejects_ambiguous_or_selected_base, verify_seed2_change_set_accounts_for_predecessor_and_all_worktree_states, verify_seed2_change_set_rejects_nonexact_delivery_surface, verify_seed2_dependency_direction_excludes_plan073_from_seed1]
        depends_on: [TASK-001]
      - id: TASK-003
        type: implementation
        title: "Import the two website owner releases"
        description: |
          Create exactly one documentation-semantics and one design-system record.
          Copy each immutable owner/evidence reference, identity, coordinate, version,
          tag, full commit, hash, and green checks without reinterpretation; include
          exhaustive documentation fixture-dispatch proof. Preserve visual ownership
          and add no policy, prose prerequisite, or unnamed dependency.
        files: [.backstop/website-pack-releases.yml]
        claims: [CLM-004, CLM-005, CLM-006, CLM-007, CLM-014, CLM-015, CLM-016, CLM-017, CLM-018, CLM-019, CLM-020, CLM-030]
        depends_on: [TASK-002]
      - id: TASK-004
        type: verification
        title: "Gate imported evidence"
        description: |
          Run `./bin/backstop gate --file .backstop/website-pack-releases.yml
          --file scripts/verify-documentation-semantics-integration.sh`. Require all
          ownership, immutable-release, dispatch, and scope cases to execute with no
          owner-policy surface or sixth delivery file.
        files: [.backstop/website-pack-releases.yml, scripts/verify-documentation-semantics-integration.sh]
        claims: [CLM-001, CLM-002, CLM-003, CLM-004, CLM-005, CLM-006, CLM-007, CLM-014, CLM-015, CLM-016, CLM-017, CLM-018, CLM-019, CLM-020, CLM-027, CLM-028, CLM-029, CLM-030]
