        files: [scripts/verify-documentation-semantics-integration.sh]
        claims: [CLM-001, CLM-002, CLM-003, CLM-004, CLM-005, CLM-006, CLM-007, CLM-008, CLM-009, CLM-010, CLM-011, CLM-012, CLM-013, CLM-014, CLM-015, CLM-016, CLM-017, CLM-018, CLM-019, CLM-020, CLM-021, CLM-022, CLM-023, CLM-024, CLM-025, CLM-026, CLM-027, CLM-028, CLM-029, CLM-030, CLM-031, CLM-032, CLM-033, CLM-034]
        depends_on: [TASK-002, TASK-005, TASK-008]
      - id: TASK-010
        type: verification
        title: "Gate restoration and semantic attribution"
        description: |
          Run `./bin/backstop gate --file scripts/verify-documentation-semantics-integration.sh
