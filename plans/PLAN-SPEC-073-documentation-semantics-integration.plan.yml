          website declarations and git locks exactly to evidence: keys/names equal
          manifest identity, source_coordinate remains independent, source_type is
          git, and version, v-ref, and nonempty content hash match. Reject local relock.
        files: [backstop.yml, backstop.lock]
        claims: [CLM-008, CLM-009, CLM-010, CLM-011, CLM-012, CLM-013]
        depends_on: [TASK-005]
      - id: TASK-007
        type: verification
        title: "Gate evidence-bound pins"
        description: |
          Run `./bin/backstop gate --file .backstop/website-pack-releases.yml
          --file backstop.yml --file backstop.lock --file
          scripts/verify-documentation-semantics-integration.sh`. Require the full
          equal, divergent, absent, mutable, mismatched, and drifted matrix to pass.
        files: [.backstop/website-pack-releases.yml, backstop.yml, backstop.lock, scripts/verify-documentation-semantics-integration.sh]
        claims: [CLM-008, CLM-009, CLM-010, CLM-011, CLM-012, CLM-013]
        depends_on: [TASK-006]

