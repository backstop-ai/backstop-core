        files: [scripts/verify-documentation-semantics-integration.sh]
        claims: [CLM-008, CLM-009, CLM-010, CLM-011, CLM-012, CLM-013]
        test_names: [verify_pin_matrix_accepts_equal_identity_and_coordinate, verify_pin_matrix_accepts_divergence_with_spec056_warning, verify_pin_matrix_rejects_missing_surface, verify_pin_matrix_rejects_mutable_or_local_source, verify_pin_matrix_rejects_binding_mismatch_or_contract_alias, verify_pin_matrix_rejects_missing_or_drifted_install]
        depends_on: [TASK-004]
      - id: TASK-006
        type: implementation
        title: "Add and pin the released documentation pack"
        description: |
          Use the normal remote add flow with the imported coordinate and exact
