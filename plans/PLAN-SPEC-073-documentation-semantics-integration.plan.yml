          inspect predecessor task state. Gate those real pages and registries cleanly with
          `./bin/backstop gate --file docs/index.md --file docs/evaluate.md --file
          docs/model.md --file docs/adopt.md --file docs/use-cases.md --file
          docs/packs.md --file docs/extend.md --file docs/reference.md --file
          docs/status.md --file docs/contributing.md --file
          docs/_data/content-topology.yml --file docs/_data/product-model.yml --file
          docs/_data/evidence-inventory.yml --file docs/_data/content-inventory.yml`;
          inject a duplicate substantive definition using an existing anchor in the same real page and
          run an all-scope gate on that isolated exact-corpus copy, requiring the installed rule plus production-relative
          path; then delete the pack while retaining evidence/config/lock and require
          missing dependency before local output counts. Reject fixture-only attribution.
        files: [scripts/verify-documentation-semantics-integration.sh]
        claims: [CLM-013, CLM-021, CLM-022, CLM-023, CLM-024, CLM-025, CLM-026]
        test_names: [verify_owner_evidence_installed_pack_checks_pass, verify_installed_semantics_gate_accepts_exact_clean_seed1_corpus, verify_installed_semantics_gate_dispatches_every_seed1_path, verify_installed_semantics_gate_rejects_vacuous_or_inexact_corpus_scope, verify_installed_semantics_gate_blocks_duplicate_substantive_owner, verify_installed_semantics_gate_rejects_deleted_pack, verify_installed_semantics_gate_rejects_unattributed_or_fixture_only_proof]
        depends_on: [TASK-007]
      - id: TASK-009
        type: implementation
        title: "Complete the bounded integration verifier"
        description: |
          Implement one entrypoint dispatching all 34 mandated claim tests plus the
