      cells — the only fixtures that can prove the non-vacuousness matrix
      CLM-007..CLM-010 + CLM-025..CLM-027 against the canonical SPEC-042 record),
      the exempt-matrix bindings (go-build exempt=true; golangci/go-test/findings
      exempt=false, with a DIVERGENT pair carrying differing values for the
      per-violation/true-conflict tiebreak), and the catalog-guard fixtures (an
      injected unlisted gate-semantic keying site + a stale catalog entry). No
      production code changes here.
    tasks:
      - id: TASK-001
        type: setup
        title: "Scaffold canonical per-FILE check.CoverageRecord fixtures"
        description: |
          Create gate-side fixtures of the CANONICAL per-FILE coverage record — the
          SINGLE shared type DEFINED by SPEC-042: check.CoverageRecord{Path, Covered,
          Total, Measured, Excluded, Metric} with RAW COUNTS and FILE granularity, NO
          "package" noun — under pkg/gate/testdata. (This plan does NOT define the
          type; it is SPEC-042's. These fixtures encode records the SPEC-042 producer
          will emit.) Cells:
            - an over-floor changed FILE alongside a BELOW-floor sibling FILE in the
              same directory (proves per-file, not directory/package aggregate —
              CLM-009).
            - an under-floor (e.g. 2%-covered) new FILE in an otherwise-95% directory
              (proves it is NOT rescued by a roll-up — CLM-010).
            - a real per-FILE shortfall record (a changed/new file with Covered/Total
              below its declared threshold — CLM-007).
            - an in-scope changed PATH with NO record AND NOT Excluded — the loud-error
              fixture (CLM-008); plus an Excluded:true changed path with no record —
              the skip-not-error fixture (CLM-008).
            - an Excluded:true IN-SCOPE CHANGED file carrying a declared exclusion
              reason — the loud-surfacing fixture (CLM-025); plus an Excluded:true
              UNCHANGED file — the may-stay-quiet fixture (CLM-025).
            - raw-count records including a Total==0 file (no executable lines) — the
              ratio-from-raw-counts + Total==0⇒N/A fixture (CLM-026).
            - a polyglot record set with DIFFERING Metric labels (statement vs branch)
              — the metric-surfaced-never-interpreted fixture (CLM-027).
          Fixtures only; the verdict assertions live in the Phase-3 test tasks.
        files:
          - pkg/gate/testdata/coverage-record-perfile-floor.json
          - pkg/gate/testdata/coverage-record-unmeasured-and-excluded.json
          - pkg/gate/testdata/coverage-record-rawcounts-metric.json
        claims:
          - CLM-007
          - CLM-008
          - CLM-009
          - CLM-010
          - CLM-025
          - CLM-026
          - CLM-027
        depends_on: []

      - id: TASK-002
        type: setup
        title: "Scaffold exempt-matrix binding + per-violation/true-conflict fixtures"
        description: |
          Create engine-binding + violation fixtures driving the exempt matrix and
          the per-violation resolution (REQ-004/REQ-007), under cmd/backstop/testdata
          and a shared test helper:
            - declared bindings: go-build (exempt_from_scope_filter true),
              golangci/go-test/findings (false/unset) — the four engine classes for
              CLM-013..CLM-016.
            - two build bindings across packages with DIFFERING exempt values (the
              per-violation, no-aggregation fixture — CLM-018).
            - a same-file+line+rule collision from two sources with differing exempt
              values (the true-conflict tiebreak fixture — CLM-019).
            - changed vs UNCHANGED file paths so filterViolations can be driven
              end-to-end (CLM-013..CLM-016).
          Helpers/fixtures only; production wiring is Phase 4.
        files:
          - cmd/backstop/testdata/exempt-matrix-bindings.yml
          - cmd/backstop/exempt_test_helpers_test.go
        claims:
          - CLM-013
          - CLM-014
          - CLM-015
          - CLM-016
          - CLM-018
          - CLM-019
        depends_on: []

      - id: TASK-003
        type: setup
        title: "Scaffold catalog-guard fixtures (unlisted site + stale entry)"
        description: |
          Create the fixtures the REQ-006 completeness guard needs to prove it is
          neither a tautology nor red-on-arrival:
            - an injected/fixture gate-semantic CheckType-keying site that is ABSENT
              from the catalog (the dropped-gate-step fixture — CLM-023), placed in a
              testdata Go source the guard's discovery scope scans.
            - a catalog snapshot carrying a STALE entry whose keying site does not
              exist in code (the stale-entry fixture — CLM-024).
            - a cosmetic .Pass.String() display-site fixture that MUST be excluded
