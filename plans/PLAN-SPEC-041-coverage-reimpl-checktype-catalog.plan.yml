  # ═══════════════════════════════════════════════════════════════════════
  # Phase 3: Re-implement coverage per-FILE over SPEC-042's canonical record.
  # CONSUMER ONLY — the record type + producer are SPEC-042's (PLAN-042).
  # NON-VACUOUSNESS is the load-bearing deliverable (Sharp Edge 1) — every
  # verdict test runs against the canonical declared record, not a stub.
  # ═══════════════════════════════════════════════════════════════════════
  - id: phase-3
    name: "Phase 3: Per-FILE Coverage Re-implementation (Consumer, Non-Vacuous)"
    description: |
      Re-implement the coverage step to CONSUME the canonical per-FILE
      []check.CoverageRecord (the SINGLE shared type from SPEC-042 — Path/Covered/Total/
      Measured/Excluded/Metric, RAW COUNTS, file granularity, NO "package" noun) and
      compute the verdict itself as Covered/Total >= threshold PER CHANGED/NEW FILE,
      metric-blind, Total==0 ⇒ N/A. This plan builds ONLY the consumer side; the record
      type, the dispatchPackCoverage channel, and the go-toolchain coverage engine that
      PRODUCES the records are SPEC-042's (PLAN-042) — not authored here. The
      non-vacuousness invariant is load-bearing and test-led: a real per-FILE shortfall
      still REDs (CLM-007); an in-scope changed PATH with no record that is NOT
      pack-declared-excluded is a LOUD blocking error, never a silent pass — while a
      declared-excluded path is SKIPPED, not errored (CLM-008); per-changed-FILE, never
      rescued by aggregation (CLM-009/CLM-010); a declared exclusion of an in-scope
      CHANGED file is LOUDLY SURFACED with its reason (CLM-025); the gate computes the
      ratio from raw counts, metric-blind, Total==0 ⇒ N/A (CLM-026); and the Metric label
      is surfaced never interpreted (CLM-027). All verdict tests run against the canonical
      record fixtures (Phase 1), not a stub that can't go vacuous.
      (REQ-001 re-impl half, REQ-003.)
    tasks:
      - id: TASK-008
        type: test
        title: "Write per-FILE coverage consumer + non-vacuousness verdict tests"
        description: |
          Drive the re-implemented coverage step off the canonical per-FILE
          []check.CoverageRecord fixtures (Phase 1), RED before the re-impl lands. Use
          the spec's MANDATED test names:
            - TestCoverage_ConsumesDeclaredPerFileCoverageRecord: the step consumes the
              canonical []check.CoverageRecord (Path/Covered/Total/Measured/Excluded/
              Metric, raw counts, file granularity, no "package" noun — the single
              shared type from SPEC-042) and applies the threshold per FILE — verdict
              asserted by feeding declared per-file records, with NO in-binary `go test`
              executed and no package-level modeling (CLM-003).
            - TestCoverage_RealPerFileShortfallStillReds: a changed/new file with
              Covered/Total below its declared threshold produces a blocking
              coverage_threshold violation with status fail (CLM-007).
            - TestCoverage_UnmeasuredNonExcludedPathIsLoudError: an in-scope changed PATH
              with NO record that is NOT Excluded produces a LOUD blocking error (severity
              error, status fail), never a silent pass (CLM-008).
            - TestCoverage_DeclaredExcludedPathIsSkippedNotErrored: a pack-DECLARED-
              excluded path with no record is SKIPPED from the threshold check, not
              errored (CLM-008).
            - TestCoverage_PerChangedFile_OverFloorPassesRegardlessOfSiblings: an
