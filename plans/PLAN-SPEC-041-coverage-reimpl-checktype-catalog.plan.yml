  # ═══════════════════════════════════════════════════════════════════════
  - id: phase-2
    name: "Phase 2: Eradicate Baked Coverage Analyzer + Shared Runner"
    description: |
      Delete the baked Go-toolchain coverage machinery from pkg/gate/step_coverage.go
      (go test command constructors, the `coverage: N% of statements` regex parser,
      the whole-module dedup read, the go.mod reader) and eradicate the baked shared
      runner cmd/backstop/shared_testrun.go + its wiring in cmd/backstop/gate.go. The
      eradication is test-led: absence guards assert no `go test` constructor /
      coverage parser / go.mod reader / renamed whole-module runner survives. ALSO
      DELETE the now-orphaned SPEC-010 coverage tests (option B — retired, not
      re-pointed): they are coupled to the deleted machinery and CANNOT compile once it
      is gone. After this phase NO baked shared runner and NO baked Go coverage analyzer
      remain, and no orphaned SPEC-010 coverage test references the deleted machinery.
      (REQ-001 deletion half, REQ-002; SPEC-010 coverage-claim retirement.)
    tasks:
      - id: TASK-004
        type: test
        title: "Write baked-analyzer + shared-runner eradication absence guards"
