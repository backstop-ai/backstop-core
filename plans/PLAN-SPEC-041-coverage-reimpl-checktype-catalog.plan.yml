              buildCoverageStep is no longer passed a shared `go test` runner (CLM-005).
            - TestSharedRunner_NoRenamedWholeModuleGoTestRunner: a guard asserts no
              cmd/backstop or pkg/gate source constructs a whole-module `go test`
              runner under ANY name — a renamed shared runner FAILS (CLM-006).
          These are RED while the baked machinery still exists.
        files:
          - pkg/gate/step_coverage_eradication_test.go
          - cmd/backstop/shared_testrun_eradication_test.go
        claims:
          - CLM-001
          - CLM-002
          - CLM-004
          - CLM-005
          - CLM-006
        depends_on:
          - TASK-001

      - id: TASK-005
        type: refactor
        title: "Delete baked Go coverage machinery from step_coverage.go"
