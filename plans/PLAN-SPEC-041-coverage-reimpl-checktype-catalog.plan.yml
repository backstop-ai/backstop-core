          goCoverageTarget/goCoveragePackagesTarget/repoSweepCoverageTarget/
          goCoverageTargetsForScope/changedGoCoverageTargets (the `go test ...
          -coverprofile` command constructors), coverageRe/parseCoverageLine (the
