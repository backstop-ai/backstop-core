plan_id: PLAN-SPEC-041
spec_id: SPEC-041
spec_version: 1.0.0
created: "2026-06-24"
status: draft
target_module: pkg/gate
test_command: "go test ./pkg/gate/ ./cmd/backstop/ -race -coverprofile=cover.out"
coverage_threshold: 80

notes: |
  Implements SPEC-041 (BUNDLE-011 Spec Seed 3, RDQ-6 / REQ-011/012/013): migrate the
  test+coverage stack as a UNIT so no baked shared `go test` runner and no baked Go
  coverage analyzer survive the legacy-`pkg/check` cutover, re-express the build-pass
  scope exemption as a DECLARED engine-binding property bridged onto the engine path,
  and produce a machine-checkable CheckType-consumer catalog ("don't drop a gate step
  on the floor" guard).

  ════════════════════════════════════════════════════════════════════════════
  HARD PREREQUISITES — SPEC-040 (Seed 2) AND SPEC-042 (Seed 4) MUST LAND FIRST.
  (Sharp Edge 3, REQ-001) — THIS PLAN BUILDS ONLY THE COVERAGE CONSUMER.
  ════════════════════════════════════════════════════════════════════════════
  Coverage is DYNAMIC-TOOLCHAIN: it needs the PER-FILE coverage signal that ONLY the
  toolchain test pass produces, and that signal is now PRODUCED by SPEC-042, not by this
  plan. Two hard, ordered prerequisites:

    1. SPEC-040 (Seed 2) — the `go-toolchain` test-pass substrate. SPEC-040 also DELETES
       `realCodeChecker`, which orphans the legacy `checkViolationsToGate`/gate.go:1173
       `cv.Pass == check.CheckTypeBuild` ProjectWide setter this spec REPLACES.

    2. SPEC-042 (Seed 4) — the PRODUCER. SPEC-042 (PLAN-SPEC-042) owns the
       `dispatchPackCoverage` channel, the go-toolchain coverage ENGINE that emits the
       records, AND the canonical SHARED type `check.CoverageRecord{Path, Covered, Total,
       Measured, Excluded, Metric}` (raw counts, FILE granularity). This plan (Seed 3) is
       the CONSUMER: the gate computes `Covered/Total >= threshold` per file (metric-blind,
       Total==0 ⇒ N/A) over records SPEC-042 produces. There is NO second CoverageRecord
       shape — both specs share the ONE type SPEC-042 defines. The coverage step has
       NOTHING TO READ until SPEC-042's producer + record type exist.

  IMPL ORDER: Seed 4 (SPEC-042 producer) BEFORE Seed 3's coverage step. This plan does NOT
  author the channel, the record type, or the go-toolchain coverage engine — that is
  PLAN-SPEC-042's job (referenced, not re-authored). This plan builds ONLY the
  consumer/threshold side (the per-file verdict over the canonical record). Re-baking a
  `go test -coverprofile` reader (or any in-binary coverage producer) to unblock the
  consumer would re-violate REQ-002 (no baked shared runner) — it is NOT a workaround, it
  is the failure mode. The implementer MUST confirm BOTH have landed before starting the
  coverage re-impl (Phase 3): `realCodeChecker`/`newSharedTestRunner` removed by SPEC-040,
  AND `check.CoverageRecord` + the SPEC-042 coverage producer channel exist. If either is
  missing, this plan's coverage tasks are BLOCKED, not workable-around. (The eradication
  in Phase 2 — deleting the baked analyzer + shared runner + the retired SPEC-010 tests —
  depends only on SPEC-040 having removed `realCodeChecker`; the CONSUME side, Phase 3,
  additionally requires SPEC-042's producer.)

  CROSS-SPEC FENCES (referenced, NOT re-authored here):
    - The Step-2 cutover itself, the `go-toolchain` test pass, the golden-equivalence
      harness, and the no-pack loud-warn report state → SPEC-040 (Seed 2 prerequisite).
    - The `dispatchPackCoverage` channel, the go-toolchain coverage ENGINE, and the
      canonical `check.CoverageRecord` type → SPEC-042 (Seed 4 producer / PLAN-SPEC-042).
    - The dead-code deletions (standards-manifest reader, non-Go semgrep catch-all)
      → SPEC-039 (sibling).
  This plan touches ONLY: pkg/gate (the coverage CONSUMER step + the retired SPEC-010
  tests it deletes), pkg/pack/engine/binding.go (the new declared exempt property), and
  cmd/backstop (shared-runner eradication wiring, the engine-path exemption bridge, the
  catalog + guard).

  ════════════════════════════════════════════════════════════════════════════
  TRANSITIONAL → PERMANENT BUILD-EXEMPTION HANDOFF (Sharp Edge 5, REQ-004)
  ════════════════════════════════════════════════════════════════════════════
  SPEC-040 carries a TRANSITIONAL seam (`dispatchBuildViolationProjectWide` — a stopgap
  that keeps engine-path build violations project-wide-exempt during the cutover, since
  the legacy gate.go:1173 setter dies with `realCodeChecker`). THIS spec lands the
  PERMANENT mechanism: a DECLARED `exempt_from_scope_filter` property on EngineBinding,
  bridged to `gate.Violation.ProjectWide` in pack_gate.go's dispatch, resolved
  PER-VIOLATION. The handoff is encoded as: Phase 4 ADDS the declared property + permanent
  bridge (test-first), then REMOVES SPEC-040's transitional `dispatchBuildViolationProjectWide`
  seam in the same phase (a refactor that deletes the stopgap once the permanent path is
  green) — so there is never a window where engine-path build breaks are silently
  scope-filtered (the under-broad failure mode). The locus is the ENGINE PATH
  (pack_gate.go), NEVER the orphaned gate.go:1173 — asserting against gate.go:1173 passes
  trivially against dead code and ships ZERO behavior (Sharp Edge 5). CLM-013 guards the
  bridge END-TO-END through the REAL `filterViolations` (an unchanged-file build break
  still REDs a diff-scoped gate via the engine path), not at the stamp site.

  ════════════════════════════════════════════════════════════════════════════
  COVERAGE NON-VACUOUSNESS IS THE LOAD-BEARING INVARIANT (Sharp Edge 1, REQ-003)
  ════════════════════════════════════════════════════════════════════════════
  The eradicated baked analyzer used to PRODUCE the very signal it then checked. A
  language-agnostic coverage that silently reads an empty/absent record (or silently
  honors an exclusion) and reports `pass` is exactly the vacuous green the project forbids
  — and it is the MOST LIKELY way this migration goes wrong. Enforcement is PER-CHANGED-
  FILE (NOT per-package — "package" is a Go-native concept that would re-bake language
  knowledge, and a package aggregate would hide a low-coverage file). The plan SEQUENCES
  non-vacuousness as a FIRST-CLASS, test-led deliverable: the re-implementation (Phase 3)
  is driven by tests that assert, all over the canonical `[]check.CoverageRecord` (raw
  counts, file granularity, from SPEC-042):
    (a) a real per-FILE shortfall still REDs (CLM-007);
    (b) an in-scope changed PATH with NO record that is NOT pack-declared-excluded is a
        LOUD blocking error, never a silent pass — while a declared-excluded path is
        SKIPPED, not errored (CLM-008);
    (c) per-changed-FILE, never rescued by aggregation — an over-floor file passes
        regardless of siblings, and a 2%-covered file hidden in a 95% directory still REDs
        (CLM-009/CLM-010);
    (d) a pack-declared exclusion of an IN-SCOPE CHANGED file is LOUDLY SURFACED on the
        report (path + reason), never silently dropped (CLM-025) — closing the
        "declare Excluded:true to suppress a changed file invisibly" vector;
    (e) the gate computes the verdict from RAW COUNTS as Covered/Total >= threshold,
        metric-blind, Total==0 ⇒ N/A (not a 0%-fail) (CLM-026), and SURFACES the
        pack-declared Metric label without interpreting it (CLM-027).
  These run against the canonical declared record — not a stub/mock that can't go vacuous.
  The eradication (Phase 2) lands BEFORE the re-impl-verdict tests so "no baked signal
  source" is the reality the non-vacuousness tests are written against. The model carries
  NO "package" noun.

  ════════════════════════════════════════════════════════════════════════════
  SPEC-010 COVERAGE-CLAIM RETIREMENT — ORPHAN RECONCILIATION (option B: DELETE)
  ════════════════════════════════════════════════════════════════════════════
  SPEC-010's six detailed coverage claims (CLM-048/049/057/058/059 + the
  IgnoresSpecTestCommandForScheduling claim) are being RETIRED — coverage is now
  single-owner (SPEC-041 consumer + SPEC-042 producer). The spec-author retires the
  SPEC-010 claims separately; the DECISION is option B (DELETE the orphaned tests, NOT
  re-point them). Verified on `main` 2026-06-24: the six named tests in
  pkg/gate/step_coverage_test.go — TestGate_CoverageThreshold_MeetsThreshold, _BelowThreshold,
  _IgnoresSpecTestCommandForScheduling, _TestCommandNotFound, _NoCoverageSummaryLine,
  _ParsesCoverageSummaryLine — are SPEC-010-mandated (named in PLAN-SPEC-010 with their
  CLM ids) AND tightly coupled to the DELETED machinery (mockCommandRunner/
  recordingCommandRunner feeding `coverage: N% of statements` text, the
  `go test ... -coverprofile=/dev/null` exec, and parseCoverageLine directly). They CANNOT
  survive the baked-machinery deletion. Phase 2 DELETES them IN-PHASE with the
  baked-coverage-machinery deletion (same orphan-reconciliation discipline as the rest of
  the plan — they are retired, not re-pointed).

phases:
