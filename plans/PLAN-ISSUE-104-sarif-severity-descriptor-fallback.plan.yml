  ── THE DEFECT IN ONE PARAGRAPH ────────────────────────────────────────────
  `parseSarif` resolves severity from exactly one place — `results[].level`
  (`sarifSeverity(r.Level)`) — and the `sarifLog` struct never models
  `runs[].tool.driver.rules` at all. Real semgrep does not put `level` on the
  result; it states the rule's severity on the RULE DESCRIPTOR,
  `tool.driver.rules[].defaultConfiguration.level`, joined to the result by
  `ruleId`. So `r.Level` is always `""` for real semgrep output, and
  `sarifSeverity("")` returns `"error"` by its (correct) fail-closed rule. Every
  semgrep-based pack finding therefore blocks, whatever the pack author declared.
  The fail-closed default is NOT the bug and does NOT change here — only the set
  of places a level is looked for changes.

  ── EMISSION SHAPE, RE-MEASURED WHILE PLANNING (2026-07-28) ────────────────
  Independently reproduced against the semgrep on PATH (1.156.0), BOTH ways, so
  the struct extension below is written against observed JSON and not memory:

    rule `severity: WARNING`
      result keys : [fingerprints, locations, message, properties, ruleId]
      descriptor  : {"level": "warning"}
    rule `severity: ERROR`
      result keys : [fingerprints, locations, message, properties, ruleId]
      descriptor  : {"level": "error"}

  `level` is ABSENT from the result object in both directions — this is not a
  value difference, it is a missing key. The descriptor lives at
  `runs[0].tool.driver.rules[0]`, whose `id` equals the result's `ruleId`, and
  the driver `name` is "Semgrep OSS" (NOT "semgrep") — do not key anything on
  the driver name.

  ── THE FIX SHAPE (3 lines of behavior, one new struct branch) ─────────────
    1. Extend `sarifLog`'s run element with:
         Tool struct { Driver struct { Rules []struct {
             ID string `json:"id"`
             DefaultConfiguration struct { Level string `json:"level"` }
                 `json:"defaultConfiguration"`
         } `json:"rules"` } `json:"driver"` } `json:"tool"`
       Additive: every existing field keeps its shape, and a log with no driver
       rules unmarshals to an empty slice, never an error.
    2. Build a `ruleID -> defaultConfiguration.level` map ONCE PER RUN, inside
       the `for _, run := range log.Runs` loop and before the results loop. Per
       RUN, not per log: two runs may legitimately carry different rule sets, and
       a log-wide map would let run A's severity leak onto run B's finding.
    3. Resolve: `r.Level` if non-empty, ELSE the map lookup for `r.RuleID`, ELSE
       `""`; hand the resolved string to `sarifSeverity` UNCHANGED. Do not touch
       `sarifSeverity` itself.

  ── FIXTURE HONESTY: TWO TIERS, LABELLED, NEITHER PRETENDING TO BE THE OTHER ─
  The existing contract test builds its SARIF by hand with `"level":"warning"` on
  the RESULT — a shape real semgrep never emits — which is why a test that locks
  the contract end to end could not see this defect. That is the second violation
  of the fixtures-from-real-output law in this neighbourhood, and re-fixing it is
  half this lane, not a nicety.

  But "capture everything" is not achievable honestly, and pretending otherwise
  would be the same sin wearing better clothes: real semgrep ALWAYS emits a
  descriptor level, so the both-absent case CANNOT be captured from it. Hence two
  explicitly labelled tiers:

    TIER A — CAPTURED TOOL OUTPUT (the pack-author contract).
      Real `semgrep --sarif` bytes, unmodified, one NEW capture per direction
      (descriptor warning, descriptor error). These drive
      cmd/backstop/pack_severity_contract_test.go's warning and error cases, so
      the ratified contract is locked on the wire shape a pack author actually
      produces. THE BYTES ARE NEVER EDITED — not to tidy them, not to add a
      provenance key, not to shorten a fingerprint. A fixture a human touched is
      a fabrication with a good story.

      THE RESULT-LEVEL DIRECTION NEEDS NO NEW CAPTURE — IT IS ALREADY COMMITTED.
      `cmd/backstop/testdata/go-toolchain/fixtures/golangci-v2.sarif` is a real
      golangci-lint capture (SPEC-034; the helper doc comment says so) carrying
      TWO results with result-level `level` — errcheck at "error", ineffassign at
      "warning" — and a driver with ONLY `name`, no `rules` array. That is exactly
      the non-regression shape CLM-001 needs: a producer that states severity on
      the result and has no descriptor to fall back to. pkg/check ALREADY reads
      that directory via `readGoToolchainFixture`
      (pkg/check/parse_pack_findings_test.go:15-19) — the very helper TASK-002
      imitates — so this costs one function call and zero new fixtures. Use it.
      Do not capture a second golangci-lint SARIF to prove what a committed one
      already proves.

    TIER B — ONE SPEC-DERIVED SHAPE FIXTURE, AND ONLY ONE.
      The single shape no producer can emit is the CONFLICT: a result carrying
      its own `level` WHILE its rule descriptor declares a DIFFERENT one. Real
      output never contradicts itself — semgrep omits the result level entirely,
      golangci emits no descriptor — so precedence can only be pinned on a
      constructed input. That fixture stays hand-built and its doc comment MUST
      say so, naming SARIF §3.27.10 as the construct it stands in for and stating
      why no capture exists. Honest labelling is the whole difference between a
      shape test and a fabricated capture.

      The both-absent floor needs NOTHING NEW either: `sarifSampleJSON`
      (pkg/check/fixtures_toolchain_test.go) already carries EXAMPLE003 — no
      `level`, in a log with no driver rules — and the existing format test
