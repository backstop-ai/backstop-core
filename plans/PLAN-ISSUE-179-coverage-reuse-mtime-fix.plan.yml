  CLM-004b — SHELL PRECISION IS A PROPERTY OF THE SHELL BUILD ON THAT PLATFORM,
    NOT OF THE SHELL'S NAME. MEASURED ON DARWIN 23.6.0, 2026-08-19, production
    chronology (`: > cover.out; : > stamp`), both candidate conditions:

      /bin/sh    CURRENT=REUSE      FLIPPED=REUSE
      /bin/dash  CURRENT=REUSE      FLIPPED=REUSE      ★ macOS dash TIES
      /bin/bash  CURRENT=REUSE      FLIPPED=REUSE
      /bin/zsh   CURRENT=NO-REUSE   FLIPPED=REUSE      ★ real local falsifier
      /bin/ksh   CURRENT=NO-REUSE   FLIPPED=REUSE      ★ real local falsifier

    ★ THE OBVIOUS INFERENCE IS WRONG AND WAS CORRECTED BY MEASUREMENT. "dash is
    the precise one" is FALSE as a general statement: macOS's own `/bin/dash`
    truncates to whole seconds exactly like `/bin/sh` and `/bin/bash`. What
    varies is whether a given shell's `test` builtin reads the seconds field or
    the nanoseconds field of `stat` AS BUILT FOR THAT PLATFORM. Ubuntu's dash
    reads nanoseconds (that is why CI fails); macOS's dash does not. On darwin
    it is `zsh` and `ksh` that read nanoseconds.
    CONSEQUENCE, AND IT IS THE WHOLE REASON THIS CLAIM EXISTS: a shell matrix of
    {sh, dash, bash} is GREEN ON DARWIN TODAY WITH THE DEFECT FULLY LIVE — it
    proves nothing locally. Adding `zsh` and `ksh` is what turns the matrix into
    an actual local falsifier on the authoring machine, which was the stated
    design goal all along. Do not "simplify" the matrix back to POSIX shells.

