  WHAT THIS PLAN FIXES, IN ONE PARAGRAPH
  ══════════════════════════════════════════════════════════════════════════════
  `backstop-ai/go-toolchain` v1.7.0's `scripts/coverage-produce.sh` asks
  `[ ! cover.out -ot "$stamp" ]` — "reuse only if cover.out is NOT OLDER than the
  stamp." `scripts/test-produce.sh` writes `cover.out` first and touches the stamp
  after, in that order, in the same script. So `cover.out` is ALWAYS strictly
  older, and the condition is directionally backwards: it can essentially never be
  true at real timestamp precision. On Ubuntu (`/bin/sh` = dash, nanosecond
  `-ot`) reuse never fires and PLAN-ISSUE-172's whole mechanism is a no-op on the
  one platform it was built for. On darwin (`/bin/sh`, whole-second `-ot`) the
  few-hundred-microsecond gap ties and the backwards check passes by coincidence,
  which is exactly why it shipped green.

  THIS PLAN SHIPS OPTION (b) — FLIP THE COMPARISON — NOT OPTION (a). The issue
  offered both. (b) is the correct choice and the reasoning is CLM-006/CLM-007/
  CLM-008 below; it is not a coin flip and the justification is load-bearing,
  because (a) is the one the issue's own prose leans toward.

  IT ALSO FIXES THE TEST THAT LET THIS SHIP. `cmd/backstop/gotoolchain_single_run
  _test.go`'s `TestGoToolchainSingleRun_CoverageProducerReusesAFreshProfile`
  FABRICATES the inverse of the production chronology — it ages the stamp back one
  second with `os.Chtimes` so `cover.out` ends up NEWER — and therefore satisfies
  the backwards check on every platform including Linux. That is why CI is green
  today with a dead mechanism underneath. Fixing the script without fixing that
  test would leave the defect's ACCOMPLICE in place (CLM-005).

