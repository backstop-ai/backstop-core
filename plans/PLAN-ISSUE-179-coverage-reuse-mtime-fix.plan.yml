    ★ THE BOUND IS WIDER THAN "BUILD-BROKEN", AND THE HONEST STATEMENT INCLUDES A
    GREEN-VERDICT CASE. The general shape is: A's stamp survives, and invocation
    B does not OVERWRITE `cover.out`. A compile failure is one way to get there.
