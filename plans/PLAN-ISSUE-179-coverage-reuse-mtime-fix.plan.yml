  CLM-008 — OPTION (b) IS CORRECT IN EVERY STATE, TIES INCLUDED. The new check is

      [ -f "$stamp" ] && [ -f cover.out ] && [ ! "$stamp" -ot cover.out ]

    Let C = mtime(cover.out), S = mtime(stamp). `-ot` is STRICTLY older.

      STATE 1 — same-run success, fine clock: C < S (CLM-002).
                `S -ot C` false -> `!` -> TRUE -> REUSE.   ✓ correct
      STATE 2 — same-run success, coarse clock: C == S (CLM-003, darwin).
                `S -ot C` false -> `!` -> TRUE -> REUSE.   ✓ correct, and
                identical to today's accidental darwin behaviour, so nothing
                that currently works regresses.
      STATE 3 — CLM-006's stale stamp + freshly-written PARTIAL profile: S < C.
                `S -ot C` TRUE -> `!` -> FALSE -> NO REUSE. ✓ correct, and this
                is the state option (a) CANNOT refuse and today's backwards check
                ALSO cannot refuse (today: `!(C -ot S)` = `!false` = reuse).
                Option (b) is strictly safer than BOTH the status quo and (a).
      STATE 4 — no stamp at all: short-circuited by `[ -f "$stamp" ]`.
                NO REUSE -> slow-but-correct.               ✓ correct

    The flip is one comparison, no new branches, no new files, and it moves the
    behaviour from "never reuses on Linux" to "reuses exactly when a whole-module
    profile was produced in this invocation."

