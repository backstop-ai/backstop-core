  ══════════════════════════════════════════════════════════════════════════════
  WHAT "RED" MEANS HERE — read before TASK-001 and TASK-002
  ══════════════════════════════════════════════════════════════════════════════
  This is a shell-script behaviour fix, so the REDs do not look like a Go
  feature's. There are THREE kinds and they are not interchangeable.

  KIND (i) — THE SHELL-LEVEL FALSIFICATION (TASK-001). Not a Go test. The real
      `coverage-produce.sh` reuse condition, evaluated under `ubuntu:24.04`'s
      `/bin/sh` (dash) against the REAL production chronology, must print
      NO-REUSE, and the same condition under darwin's `/bin/sh` must print REUSE.
      The RED is the divergence between those two lines plus the nanosecond
      `stat` fields proving the true ordering. A `docker: ... 500 Internal Server
      Error` is NOT this RED — that is a dead Docker daemon; fix it and re-run.

  KIND (ii) — A GENUINELY-FAILING NEW GO ASSERTION (TASK-002 legs 1 and 3, the
      shell-matrix test's `zsh`/`ksh` rows, and TASK-005). Real assertion output,
      printed by a test that compiled and ran.
      ★ A COMPILE ERROR, PANIC, OR SKIP IS NOT THIS RED. If the file does not
      build, or a leg SKIPS because a shell or the pack fleet is absent, that is
      a defect in the test or the environment — fix it and re-observe an actually
      -running failure before proceeding. Record the verbatim failure text.

  KIND (iii) — A SHELL-CONDITIONAL RED THAT CANNOT FAIL ON THE AUTHORING MACHINE
      (TASK-002 leg 2, and the shell-matrix test's `sh`/`dash`/`bash` rows).
      Leg 2 runs under `/bin/sh`; on darwin that ties at whole seconds and PASSES
      today with the defect live (CLM-003). It is RED only where `/bin/sh` reads
      nanoseconds — i.e. on CI's ubuntu-24.04. Likewise the shell-matrix test's
      POSIX rows: CLM-004b MEASURED macOS `/bin/dash` and `/bin/bash` tying just
      like `/bin/sh`, so "install dash locally and it will red" is FALSE and must
      not be attempted as a debugging step.
      ★ DO NOT WAIT FOR A RED THAT CANNOT HAPPEN, AND DO NOT EDIT A TEST UNTIL IT
      REDS. That is the worst available outcome — it manufactures a green over a
      broken mechanism, which is this defect's entire family. What MUST be seen
      red locally is leg 1, leg 3, the matrix's `zsh`/`ksh` rows, and TASK-005 —
      all kind (ii). Report which legs went red WHERE; never report "all legs
      red" from a machine where some of them structurally cannot be.

  ══════════════════════════════════════════════════════════════════════════════
  THE REGRESSION TEST DESIGN — why it is built this way
  ══════════════════════════════════════════════════════════════════════════════
  The issue asks for a test that "exercises FULL sub-second timestamp precision,
  not something that could tie on a coarse clock." Sub-second precision alone is
  necessary but NOT sufficient, and aiming only at it would leave the test unable
  to fail on a darwin workstation — which is how this shipped. The design instead
  makes the primary falsifier precision-INDEPENDENT and adds precision-SENSITIVE
  legs on top:

    LEG 1  production_chronology_coarse_visible — PRIMARY, PLATFORM-INDEPENDENT.
           Sets the mtimes EXPLICITLY with `os.Chtimes`: cover.out at T-2s, stamp
           at T. That is the TRUE production DIRECTION (CLM-002) at a magnitude
           two whole seconds wide, so even a whole-second `-ot` resolves it
           correctly. RED on darwin AND on Linux today; GREEN on both after the
           flip. This is the leg that makes the defect catchable on the machine
           it was written on.
    LEG 2  production_chronology_subsecond — PRECISION-SENSITIVE. Natural
           write-then-touch with NO chtimes, i.e. the real few-hundred-microsecond
           gap CLM-003 measured. Kind (iii) red. Pins the real production
           magnitude, which leg 1 deliberately exaggerates.
    LEG 3  stale_stamp_older_than_profile_is_refused — THE PROPERTY OPTION (b)
           BUYS. Stamp at T-2s, cover.out at T: CLM-006's reachable state. Asserts
           NO reuse and that the suite IS re-run. This leg is the OLD test's
           fabricated scenario with its expectation INVERTED — the same state,
           correctly labelled. RED today (today's check reuses it).

  All three live INSIDE the existing name
  `TestGoToolchainSingleRun_CoverageProducerReusesAFreshProfile` as `t.Run`
  subtests. DO NOT INVENT A NEW TOP-LEVEL NAME FOR THEM — but understand WHY, and
  do not repeat the wrong reason. The name is kept for CONTINUITY: it is the
  identifier every commit message, prior plan and reader uses for this guard.
  It is NOT currently gate-enforced — PLAN-ISSUE-172 declares no `test_names:`
  and ISSUE-172 no `claims:`, so 172's mandated set is empty and renaming this
  test would red nothing today (CLM-005). THIS PLAN CHANGES THAT: TASK-002
  declares both names in `test_names:`, so from this plan's `completed` onward
  the promise is real and machine-checked (CLM-017). Its BODY is rewritten; its
  NAME survives.

  ONE new top-level test is added, for the dimension the old file had none of:
  `TestGoToolchainSingleRun_CoverageProducerReuseIsShellPrecisionIndependent` —
  it runs the reuse CONDITION (not the whole producer script) under every shell
  it can resolve, at the real sub-second magnitude, and asserts every resolved
  shell agrees on REUSE.

  ★ THE CONDITION IS READ OUT OF THE FIXTURE SCRIPT AT RUN TIME, NEVER HARDCODED
  IN GO. A hardcoded flipped condition is permanently green and cannot tell a
  fixed producer from a broken one; a hardcoded backwards condition is
  permanently red, because no task in this plan edits a Go literal. Extraction is
  the only shape that goes red at TASK-002 and green at TASK-003. TASK-002 names
  the anchors (`stamp=` through the first `fi`) and requires a HARD FAIL if the
  extraction matches nothing — a silent fallback would let a future reshaping of
  the producer vacuum this test with no signal. See CLM-010.

  ★ THE SHELL LIST IS `sh`, `dash`, `bash`, `zsh`, `ksh`, `busybox sh` — AND
  `zsh`/`ksh` ARE THE POINT. An earlier draft listed only the POSIX shells on a
  false premise ("dash is the precise one"). CLM-004b measured it: macOS's
  `/bin/dash` ties at whole seconds exactly like `/bin/sh` and `/bin/bash`, so
  that matrix is GREEN ON DARWIN TODAY WITH THE DEFECT LIVE — it could not fail
  where it was being written. On darwin, `zsh` and `ksh` are the shells that read
  nanoseconds, and both report NO-REUSE under the buggy check and REUSE after the
  flip. With them in, the matrix is a genuine local falsifier; without them it is
  decoration. On CI's ubuntu-24.04, `/bin/sh` IS dash and reads nanoseconds, so
  the same test also runs for real on the platform that matters, forever.

  It must FAIL — not skip — if it resolves fewer than one shell, and it must LOG
  the resolved shell list with each shell's verdict, so a green can never be
  vacuous and so a future reader can see immediately which shells were probed.

  ══════════════════════════════════════════════════════════════════════════════
  SHARP EDGES
  ══════════════════════════════════════════════════════════════════════════════
   1. `go test -run <name>` EXITS 0 WHEN THE PATTERN MATCHES NOTHING. A typo in a
      test name is a silent pass. Every task that runs a named test runs it with
      `-v` and CONFIRMS the `--- PASS:`/`--- FAIL:` line for each expected name
      (subtests included) appears in the output. "The command exited 0" is not
      evidence a test ran.
   2. THREE COPIES, THREE INDEPENDENT EDITS (CLM-012). Never `cp`/`rsync` between
      the source pack, the installed tree, and the fixture. The installed tree is
      NEVER hand-edited at all — it is refreshed only by `pack update` (TASK-010).
      Hand-editing `.backstop/packs/**` produces a content-hash mismatch that
      looks exactly like tampering.
   3. THE STAMP IS GITIGNORED. `.backstop/go-coverage-fresh` is in `.gitignore`,
      so a leftover from an aborted run is invisible to `git status`. When
      hand-testing, `rm -f .backstop/go-coverage-fresh` between runs or the second
      run reads the first run's stamp and the observation is meaningless.
   4. DO NOT TOUCH `test-produce.sh`. Its exit-status propagation is the single
      most dangerous line in this mechanism (PLAN-ISSUE-172 CLM-012: get it wrong
      and every failing suite reads GREEN) and it is guarded by
      `TestGoToolchainSingleRun_TestProducerPropagatesFailureExit`. Nothing in
      this plan requires editing it. If a task's diff shows it modified, STOP.
   5. THE `-ot` OPERANDS ARE ASYMMETRICALLY QUOTED IN THE REAL SCRIPT — `cover.out`
      is bare, `"$stamp"` is quoted. The flipped line keeps that exact spelling
      (`[ ! "$stamp" -ot cover.out ]`) because CLM-010's forbid-assertion matches
      on the literal operand shape. A cosmetic re-quote breaks the guard.
   6. TAG MUST EQUAL `pack.yml` VERSION EXACTLY, and `git fetch --tags origin`
      runs BEFORE any ahead/behind judgement — a stale view can strand a tag
      unreachable from `main`.
   7. DOCKER MOUNTS INTO A THROWAWAY DIRECTORY, NEVER THE REPO OR THE PACK REPO.
      The falsification writes `cover.out` and a stamp; mounting a real tree
      would dirty it and could collide with a concurrent agent. Use the
      scratchpad, and keep `git status --porcelain` clean in both repos.
   8. FOREGROUND ONLY. See the banner. No `run_in_background`, for any command,
      at any point in this plan.
   9. ★ THE CORRECTED COMMENT MUST NOT QUOTE THE OLD EXPRESSION VERBATIM. Both
      TASK-003 and TASK-006 rewrite the block comment to explain that the
      previous comparison was backwards, and the natural way to write that
      sentence is to quote the old expression. DESCRIBE IT IN PROSE INSTEAD
      ("the previous check asked whether the profile was no older than the stamp,
      which inverts the real write-then-touch order").
      ★ THE REASON DIFFERS BY FILE, AND ONLY ONE OF THEM IS MECHANICAL — DO NOT
      STATE THE MECHANICAL ONE WHERE IT IS FALSE:
        · SOURCE PACK / INSTALLED TREE (TASK-006) — MECHANICAL AND REAL.
          TASK-005's guard forbids the literal `cover.out -ot "$stamp"` and reads
          the WHOLE FILE, comments included. After TASK-010's `pack update` that
          file IS the installed producer, so a quoted old expression would RED a
          completely correct fix, with the failure pointing at the line just
          fixed.
        · CORE FIXTURE (TASK-003) — HYGIENE, NOT ENFORCEMENT. TASK-005 reads only
          `.backstop/packs/backstop-ai/go-toolchain/...`, never the fixture, and
          nothing in the repo byte-matches the fixture producer's text. The rule
          holds anyway — semantic parallelism between the two trees, and
          pre-empting a future fixture-side pin — but do not dress it up as a
          check that will fire, because it will not.
      For the flipped form: the file should contain `"$stamp" -ot cover.out`
      exactly once, in the live condition. Restating it in a comment is harmless
      for the require-assertion but makes the file's intent ambiguous, so don't.
  10. `zsh` AND `ksh` ARE DELIBERATE MEMBERS OF THE SHELL MATRIX (CLM-004b). They
      are not POSIX-shell probes and they are not there by accident: on darwin
      they are the ONLY shells that resolve the comparison at nanosecond
      precision, and removing them makes the matrix vacuously green on the
      authoring machine. The test runs the CONDITION, not the whole producer
      script, so a non-POSIX shell is a legitimate probe — and that condition is
      EXTRACTED FROM THE FIXTURE SCRIPT at run time, never hardcoded in Go
      (CLM-010, TASK-002 step 2). If you find yourself editing a Go string
      literal to change what the matrix evaluates, the test is built wrong.

