  # ═══════════════════════════════════════════════════════════════════════
  # Phase 3: TDD green — two SEQUENTIAL implementations (substitute.go declares
  # the marker constant manifest.go consumes) + package verification
  # ═══════════════════════════════════════════════════════════════════════
  - id: phase-3
    name: "Phase 3: TDD Green — The Escape in Substitute, the Reserved Prefix in the Manifest"
    tasks:
      - id: TASK-009
        type: implementation
        title: "Implement the `{{!` escape and the remedy diagnostic in pkg/recipe/substitute.go"
        description: |
          Make Phases 2's grammar, captured-payload, Apply and CLI tests green by
          changing ONE file. Everything else inherits it.

          THE CHANGE, concretely:
            1. Add an unexported marker constant beside the two delimiters —
               `placeholderEscape = "!"` — so the grammar is stated once as data
               and not as a magic byte inside the loop.
            2. In the scan loop, AFTER locating `open` and the matching `end` (so
               an unterminated span keeps its existing copy-through behavior),
               test whether the body BEGINS with the marker. If it does:
                 * write everything before the open delimiter, as today;
                 * write `{{` + body[len(marker):end] + `}}` — the inner bytes
                   VERBATIM, no TrimSpace anywhere on this path;
                 * advance `rest` past the close and CONTINUE. No lookup, no
                   error branch, no rescan of what was just written.
               Exactly one marker byte is consumed by construction, which is what
               makes `{{!!` self-escaping — do not write a loop that strips
               leading bangs.
            3. Leave the unescaped path EXACTLY as it is: TrimSpace, lookup,
               fail-loud on undeclared. Do not refactor it while you are in here.
            4. Extend the unresolvable-placeholder error with a remedy sentence
               naming the escape — e.g. "…; if this is a foreign template that
               should be emitted verbatim, escape it as {{! <text> }}". KEEP the
               existing message shape ahead of it: the param name must still
               appear, and the function must still return "" alongside the error.
               TestSubstitute_UndeclaredParamFailsLoud (shipped, untouched) and
               the CLI's ISSUE-081 assertion both read this message.
            5. REWRITE THE DOC COMMENT, which is currently a precise description
               of a grammar that is about to gain a rule. It must state: the
               escape and its exact meaning; that exactly one `!` is consumed and
               why (self-escaping); that the marker is POSITIONAL (immediately
               after `{{`, so `{{ ! x }}` is not an escape); that an escaped span
               is emitted and NEVER evaluated, which strengthens rather than
               weakens the not-Turing-complete property; and that there is
               deliberately NO comment-awareness, naming the zero-baked-language
               reason so the next reader does not "fix" it.
               IT MUST ALSO NAME THE HANDLEBARS INTERACTION IN ONE SENTENCE:
               `{{!` is Handlebars/Mustache's own comment marker, so escaping a
               Handlebars comment with a single bang emits a live interpolation
               in that language (`{{!-- x --}}` → `{{-- x --}}`) — a payload that
               must carry a real Handlebars comment through writes `{{!!--`,
               which is the self-escaping rule doing its job. Say it here, in the
               doc comment, because this is where a surprised reader looks first.

          A stale doc comment here is not cosmetic — it is the artifact the next
          author reads instead of the code, and it is what this repo means by a
          broken promise.

          Then run, and read the output:
            go test ./pkg/recipe/... ./cmd/backstop/... -race -count=1
        files:
          - pkg/recipe/substitute.go
        claims:
          - CLM-001
          - CLM-002
          - CLM-003
          - CLM-004
          - CLM-005
          - CLM-006
          - CLM-007
          - CLM-008
          - CLM-010
          - CLM-011
          - CLM-012
        depends_on:
          - TASK-004
          - TASK-005
          - TASK-007
          - TASK-008

      - id: TASK-010
        type: implementation
        title: "Refuse an escape-reserved param name at manifest parse in pkg/recipe/manifest.go"
        description: |
          Make TASK-006 green. Add `validateRecipeParams(m *RecipeManifest) error`
          and call it from ParseRecipeManifest alongside the two validators that
          already run there (validateRecipeHeader :130, validateRecipeOps :133),
          BEFORE the ops validation — a malformed param schema should be reported
          before op-level cross-checks that assume it.

          THE ONE RULE, and only this one: a param whose TRIMMED name begins with
          the escape marker is refused, fail-loud, naming the recipe label, the
          param INDEX and the name, and explaining that `{{! … }}` is the escape
          so such a param could never be referenced by any spelling. Use the same
          marker constant TASK-009 introduces — the reservation and the grammar
          must not be able to drift apart. THAT SHARED CONSTANT IS WHY THIS TASK
          DEPENDS ON TASK-009 AND MUST NOT RUN BESIDE IT: `placeholderEscape` is
          declared in substitute.go, so a manifest.go that references it before
          TASK-009 lands does not fail its own test — it fails to COMPILE, and an
          uncompilable package reddens every other test in pkg/recipe, hiding
          whatever those tests were actually saying.

          DO NOT ADD ANY OTHER PARAM-NAME RULE. No charset pattern, no length
          bound, no kebab-case requirement. The in-production go-distribution pack
          declares params named `.Version`, `github.ref_name` and
          `secrets.GITHUB_TOKEN`; a tidier-looking validator would break a real
          consumer, and TASK-006's negative controls exist to catch exactly that.
          If you find yourself wanting one, that is a separate issue, not this
          task.

          Update the ParseRecipeManifest doc comment to name the third validator,
          and the ParamSpec doc comment (manifest.go:84-90) to state the
          reservation.
        files:
