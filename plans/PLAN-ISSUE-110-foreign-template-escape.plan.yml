plan_id: PLAN-ISSUE-110
spec_id: ISSUE-110
created: "2026-08-11"
status: draft
target_repo: backstop-core
target_module: github.com/backstop-ai/backstop-core
test_command: "go test ./pkg/recipe/... ./cmd/backstop/... -race -count=1"
coverage_threshold: 90

notes: |
  Implements ISSUE-110 — the recipe substitution grammar has no escape, so a
  payload that must emit a FOREIGN `{{ }}`-delimited template verbatim has no
  first-class way to say "leave this alone."

  SMALL, SURGICAL LANE. TWO production files change: pkg/recipe/substitute.go
  (the escape + the diagnostic) and pkg/recipe/manifest.go (one parse-time
  rejection that closes the reserved prefix). apply.go is NOT touched — the
  escape lives inside `Substitute`, the single door every consumer-facing field
  already goes through (substituteField / renderPayload / relayedManual /
  the fragment read, apply.go:592/614/829/910), so every call site inherits it
  with no routing change. No CLI surface changes.

  ── THE GAP IN ONE PARAGRAPH ───────────────────────────────────────────────
  `Substitute` (substitute.go:31-62) reads EVERY `{{ ... }}` span as a param
  NAME and hard-errors on an undeclared one, returning NO output. That is the
  right policy for a typo and the wrong policy for a payload written in someone
  else's template language. The shipped workaround, live in
  `backstop-ai/go-distribution`, declares EIGHT self-emitting pass-through
  params — a param whose NAME is the foreign template's inner text and whose
  DEFAULT is that same text wrapped back in delimiters. It works only because
  substituted values are NEVER RESCANNED (substitute.go:22-23). It is honest,
  it is in production, and it is a workaround: one declaration per foreign span,
  a hazard if a caller ever supplies `--param .Version=…`, and a param list in
  which real consumer-edit points and machinery sit in one undifferentiated
  block.

  ── THE SECOND HALF OF THE ISSUE: PROSE IN A COMMENT ───────────────────────
  The substituter is not comment-aware, so a payload COMMENT that merely
  MENTIONS a template in prose fails the apply with the same error as a real
  unresolved substitution. This cost a real debugging cycle and is visible in
  production today: `recipes/go-release/payload/release.yml:15-25` in the pack
  writes `.Env.<NAME>` DELIMITER-LESS with a note explaining that the delimiters
  were dropped on purpose. A comment explaining a footgun cannot be written
  without triggering the exact footgun it documents.

  ═══════════════════════════════════════════════════════════════════════════
  THE DESIGN DECISION — `{{! ... }}`, THE BANG-ESCAPE (plan-level, for review)
  ═══════════════════════════════════════════════════════════════════════════
  THE GRAMMAR, in full, and it is four sentences:

    1. When the byte IMMEDIATELY following `{{` is `!`, the span is ESCAPED.
    2. Exactly ONE `!` is consumed; everything from there to the first `}}` is
       emitted VERBATIM, wrapped back in `{{` and `}}`.
    3. No param lookup happens in an escaped span — no declaration is needed,
       and no unresolvable-placeholder error can fire from one.
    4. Everything else is unchanged: an unescaped span is still a param name,
       an undeclared name still fails loud, a `{{` with no matching `}}` is
       still copied through as literal text, and substituted values are still
       never rescanned.

  So `${{! github.ref_name }}` emits `${{ github.ref_name }}`, `{{! .Version }}`
  emits `{{ .Version }}`, and a prose comment writes `{{! .Env.<NAME> }}` and
  gets its delimiters back. ONE mechanism, BOTH halves of the issue.

  ── WHY THE ESCAPE AND NOT COMMENT-AWARENESS (the issue's option 2) ────────
  Rejected on this repo's FIRST PRINCIPLE: zero baked language/tool knowledge.
  A comment-aware substituter must know `#` for YAML and shell, `//` and `/* */`
  for Go/TS, `<!-- -->` for HTML/XML, `;` for ini, `%` for TeX — and must know
  which one applies to the payload it is rendering, which means inferring a
  language from a file extension inside core. That is precisely the baked
  language branch CLAUDE.md calls a defect to eradicate, never to extend.

  AND IT WOULD NOT EVEN SOLVE THE PROBLEM. Measured against the real production
  payload: `recipes/go-release/payload/.goreleaser.yml` carries goreleaser's own
  `{{ .Version }}` / `{{ .ProjectName }}` / `{{ .Os }}` / `{{ .Arch }}` at lines
  81, 85, 88 and `{{ .Env.HOMEBREW_TAP_TOKEN }}` at 103 — every one of them in
  LIVE CONFIG, not in a comment — INTERLEAVED with real backstop params
  (`{{ binary_name }}`, `{{ tap_owner }}`, `{{ module_url }}`) that must still
  resolve. Comment-awareness leaves that file exactly as broken as it is today.
  The comment case is the NARROWER of the two, and the escape covers it as a
  side effect of covering the wider one: prose is just text, and text gets an
  escape like any other text.

  ── WHY `{{!` AND NOT `\{{` ────────────────────────────────────────────────
  `\{{` is the more conventional idiom (Handlebars/Mustache), and it was rejected
  on backward compatibility. It RETROACTIVELY REASSIGNS TEXT THAT IS VALID AND
  MEANINGFUL TODAY: a backslash immediately preceding a template currently
  renders through as the literal backslash it is, and under `\{{` that same byte
  becomes a marker the substituter eats — the payload silently loses a character
  and the span stops resolving.

  MEASURED, so the risk is stated at its true size (2026-08-11, against
  `recipes/go-release/payload/release.yml` in the production pack): the file has
  FIVE backslash-bearing lines (shell line continuations at :86/:87, a regex at
  :55, `\n` escapes at :98/:99) and ZERO instances of a backslash IMMEDIATELY
  PRECEDING `{{` — `grep -n '\{{'` returns nothing. So no shipped payload would
  lose a character today. The hazard is PROSPECTIVE, not already-happening: the
  two constructs are individually common in exactly this file's idiom, and `\{{`
  would make their adjacency silently lossy forever after. That is a sound reason
  to decline it and NOT a claim that something is broken right now.

  It also needs escape-the-escape doubling rules (`\\{{`), which is a second
  grammar — where `{{!`'s escape-of-the-escape falls out of the one rule it
  already has.

  `{{!` cannot change the meaning of anything that works today. A `{{!x}}` span
  currently resolves ONLY IF a param is literally named `!x`, and:
    * NO SUBSTITUTER INPUT contains the byte sequence `{{!` — no payload, no
      fixture, no recipe manifest anywhere in this repo — verified 2026-08-11
      with a FIXED-STRING grep (`grep -rnF '{{!'` over `recipes/`, `packs/`,
      `pkg/recipe/` and `cmd/backstop/testdata/`), zero hits. Two precisions,
      both deliberate. FIXED-STRING because `grep -rn '{{!'` is a BASIC-regex
      search in which `{` is interval syntax — most implementations treat a lone
      `{` literally, but `-F` is what was actually run and `-F` is what should be
      re-run. SCOPED TO INPUTS because THIS PLAN DOCUMENT now contains `{{!`
      dozens of times: it is prose ABOUT the escape and is never fed to
      `Substitute`, so a bare full-tree grep is self-falsifying today while the
      load-bearing claim — nothing the substituter will ever READ contains the
      sequence — is untouched;
    * NO SUBSTITUTER INPUT in the production `backstop-ai/go-distribution` pack
      contains it either — the same fixed-string grep over that pack's
      `recipes/` and `fixtures/`, zero hits;
    * and TASK-010 makes it structurally impossible going forward by refusing an
      `!`-leading param name at parse.
  So the reinterpretation is not "unlikely to break someone" — it is closed.

  ── WHY NOT `{{{ ... }}}` ──────────────────────────────────────────────────
  Ambiguous against the grammar that already exists: `{{{ x }}}` parses TODAY as
  a param named `{ x` — verified 2026-08-11 by running the shipped `Substitute`,
  which errors `no declared param named "{ x"`. THE MECHANISM, stated correctly:
  the open delimiter is the FIRST TWO braces only, so the THIRD OPENING BRACE IS
  NOT CONSUMED — it is RETAINED as the first byte of the parsed span, which is
  exactly why the name comes out as `{ x` with a literal leading `{`. The close
  matches at the FIRST `}}`, so the only byte TrimSpace removes is the trailing
  SPACE, and the THIRD CLOSING BRACE is consumed by NOTHING: it survives as
  literal text after the span ends. So a triple-
  brace form reinterprets a currently-parseable span rather than a currently-
  impossible one. It also collides with brace-dense payloads (JSON, Jinja, Helm)
  and offers no natural escape-of-the-escape.

  ── THE ESCAPE IS SELF-ESCAPING, SO NOTHING IS UNWRITABLE ──────────────────
  Because exactly one `!` is consumed per pass, `{{!! x }}` emits `{{! x }}` and
  `{{!!! x }}` emits `{{!! x }}`. A payload that must emit the escape syntax
  itself — a doc page ABOUT this feature, say — can. This falls out of the rule
  rather than being bolted on, and it is why the rule is stated as "consume one
  `!`" and not "strip leading `!`s".

  ── THE ONE COLLISION, NAMED HONESTLY: HANDLEBARS/MUSTACHE COMMENTS ───────
  `{{!` is NOT an unclaimed byte sequence in the wider world. It is literally
  Handlebars/Mustache's COMMENT marker: `{{! comment }}` and `{{!-- comment --}}`.
  The greps above prove only that no payload in this repo or in the production
  pack contains it TODAY — they do not make it unowned syntax, and this plan
  should not be read as claiming they do.

  THE CONSEQUENCE, measured 2026-08-11 by running the exact algorithm TASK-009
  mandates:
    `{{!-- a mustache comment --}}`  →  `{{-- a mustache comment --}}`
  A foreign COMMENT is silently converted into a live variable interpolation of
  a variable named `-- a mustache comment --` in that same foreign language.
  That is a semantic corruption of exactly the class of content this feature
  exists to protect, and it is the sharpest edge in the design.

  IT IS ALREADY REMEDIED BY THE MECHANISM ITSELF, verified in the same run:
    `{{!!-- x --}}`  →  `{{!-- x --}}`
  The escape-of-the-escape emits the Handlebars comment intact. So a payload
  that must carry a real Mustache/Handlebars comment through writes `{{!!`, the
  same way a payload that must carry a `{{ }}` span through writes `{{!`. This
  is a COVERAGE AND DOCUMENTATION obligation, not a redesign: the grammar is
  correct, the surprise is what needs closing. TASK-004 pins both bytes with a
  test, TASK-009's doc comment names the interaction and the remedy, and
  TASK-012 carries it into SPEC-054 so the permanent record states it.

  This does NOT reopen the choice of marker. Every candidate collides with
  SOMETHING (`\{{` is Handlebars' own escape, `{{{` is its triple-stash), and
  `{{!` remains the only one that cannot change the meaning of any input this
  substituter accepts today — the criterion the rejections below are decided on.

  ── VERBATIM, NOT TRIMMED (a strict improvement over the workaround) ───────
  The escaped span's inner bytes are emitted UNTRIMMED. `{{!.Version}}` emits
  `{{.Version}}` and `{{! .Version }}` emits `{{ .Version }}` — byte-exact
  either way. The pass-through workaround cannot do this: `{{.Version}}` and
  `{{ .Version }}` trim to the SAME param name, so both spellings collapse onto
  whichever one the `default:` happens to spell, and the produced file is
  semantically-identical-but-not-byte-identical to the source. The pack's own
  recipe.yml comment says exactly that (lines 55-61). The escape removes that
  compromise.

  ── THE MARKER IS POSITIONAL, DELIBERATELY ─────────────────────────────────
  `!` is recognized ONLY as the byte immediately after `{{`. `{{ ! name }}` (a
  space before the bang) is NOT an escape — it is a param named `! name`, which
  TASK-010 refuses at parse, so it can only ever fail loud, and TASK-009's
  upgraded diagnostic names `{{! … }}` in that failure. Lexical position beats
  trimming here because the alternative is a grammar whose meaning depends on
  whitespace, and this substituter's whole value is that it has no ambiguity to
  litigate.

  ── THE ONE HONEST COST ────────────────────────────────────────────────────
  A payload carrying escapes is no longer a semantically-valid file of its own
  foreign language: a `.goreleaser.yml` payload with `{{! .Version }}` is not a
  runnable goreleaser config, whereas the pass-through workaround keeps the
  payload byte-identical to its output. That property is real but already
  partial — the same payload carries `{{ binary_name }}` in `project_name:`
  today, so it is not a runnable config either way. THIS IS WHY THE WORKAROUND
  STAYS FULLY SUPPORTED (REQ-003) AND THIS CHANGE IS PURELY ADDITIVE. Authors
  choose per payload: keep the payload maximally lint-able (pass-through
  params), or keep the recipe's param list honest (escapes). Nobody is migrated.

  ── THE SPEC-067 RELATIONSHIP, STATED ACCURATELY ───────────────────────────
  SPEC-067 (the CI recipe pack, from BUNDLE-015 REQ-018) was authored in parallel
  and is the obvious candidate beneficiary — four CI platforms' worth of YAML,
  and GitHub Actions is the language whose `${{ … }}` expressions are the exact
  case this escape exists for. IT DOES NOT NEED THIS ESCAPE, AND THAT IS BY
  DESIGN ON ITS SIDE. Read fresh 2026-08-11, SPEC-067 as it now stands:
    * REQ-006 PROHIBITS the construct outright — "No payload may contain a
      GitHub Actions `${{ ... }}` expression" — and routes around it: "The GitHub
      template therefore reads `GITHUB_BASE_REF` / `GITHUB_EVENT_NAME` /
      `GITHUB_SHA` as ordinary environment variables instead."
    * Its design notes say so in as many words: "The GitHub template contains no
      `${{ ... }}` expression at all, and that is a design decision, not an
      accident of drafting… GitHub Actions exposes everything this template needs
      as ordinary environment variables… so the template reads those instead and
      the trap simply does not apply." GitLab (`$CI_*`), Bitbucket
      (`$BITBUCKET_*`) and Jenkins (`${env.…}`, single-brace) never had it.
    * It ENFORCES that choice with five mandated tests: CLM-044
      (`TestCIRecipes_PayloadsCarryNoActionsExpressionAndOnlyDeclaredParams`)
      plus CLM-040..043, one per platform
      (`TestCIRecipes_{GitHubActions,GitLabCI,BitbucketPipelines,Jenkins}_`
      `RenderedCarriesNoResidualPlaceholder`), each asserting NO literal `{{` or
      `}}` survives in the rendered file.
  So the two lanes are INDEPENDENT, in both directions. SPEC-067 is not blocked
  on this plan and never was; and this plan must not be read as licensing
  SPEC-067 to sprinkle escapes into its payloads — an escaped `{{! … }}` span
  renders to `{{ … }}`, which is a literal `{{` in the output and would REDDEN
  all five of those tests while violating REQ-006 head-on. The two designs solve
  the same hazard by different legitimate routes: SPEC-067 avoids the construct,
  this lane makes the construct expressible for authors who genuinely cannot.
  The justification for doing this now therefore rests where it always actually
  did — on the SHIPPED consumer, `backstop-ai/go-distribution`, which carries
  eight pass-through params and a delimiter-less comment in production today —
  not on a dependency SPEC-067 does not have.

  ── SCOPE BOUNDARIES ───────────────────────────────────────────────────────
    * NO apply.go change. The escape lives in the one function every field is
      already routed through; adding per-field escape knowledge would rebuild
      the routing bug ISSUE-079 just fixed.
    * NO CLI change. `--param` semantics, `checkUndeclaredParams`, and every
      exit-code path are untouched.
    * NO migration of `backstop-ai/go-distribution` off its eight pass-through
      params. That is a DIFFERENT repo, needs its own pack version bump, relock
      and re-verification, and its correctness is proven here rather than
      changed here. TASK-013 files it as a follow-on issue through `/issue`.
    * NO comment awareness, no language inference, no file-extension routing —
      see the rejection above. `Substitute` must remain able to render a payload
      in a language nobody has thought of.
    * NO expression grammar. An escaped span is emitted, never evaluated; the
      not-Turing-complete property (REQ-002 of SPEC-054) is strengthened by this
      change, not weakened, because "emit verbatim" is the maximally inert
      treatment of a construct.

  ── BLAST RADIUS (verified against the tree while planning, 2026-08-11) ────
    pkg/recipe/substitute.go   — the whole scan loop, ~30 lines. The only file
                                 whose BEHAVIOR changes for existing inputs is
                                 this one, and only for inputs containing `{{!`
                                 (zero such inputs exist) plus the appended
                                 remedy sentence on the existing error.
    pkg/recipe/manifest.go     — ONE new validator, `validateRecipeParams`,
                                 called from ParseRecipeManifest alongside the
                                 two that already run there (validateRecipeHeader
                                 :130, validateRecipeOps :133). There is no
                                 param validation today at all.
  CALL SITES INHERITING THE ESCAPE, unchanged: apply.go:592 (substituteField —
  target/anchor/snippet), :614 (renderPayload — create payload CONTENT), :829
  (relayedManual — fail-SOFT, so an escape there cannot make a diagnostic
  disappear), :910 (merge fragment CONTENT).
  EXISTING TESTS THAT MUST STAY GREEN UNTOUCHED: substitute_test.go's three
  Substitute-direct tests (TestSubstitute_ResolvesDeclaredParam,
  TestSubstitute_NotTuringComplete_NoLogicEvaluated,
  TestSubstitute_UndeclaredParamFailsLoud). The third asserts the error names
  the undeclared param and returns "" — appending a remedy sentence keeps both
  assertions true. No task may edit that file.

  ── FIXTURE STRATEGY (feedback_fixtures_from_real_output) ──────────────────
  The equivalence proof uses CAPTURED PRODUCTION BYTES, not a fabricated
  example: verbatim copies of `recipes/go-release/payload/release.yml` and
  `recipes/go-release/payload/.goreleaser.yml` from
  `~/src/projects/backstop-go-distribution-pack`, plus MECHANICALLY DERIVED
  escaped twins (every foreign span `{{ X }}` → `{{! X }}`; every REAL backstop
  param left exactly as it is). The assertion is byte-equality of the two
  renderings, which is only satisfiable if the escape is a true drop-in for the
  workaround. A hand-written "example workflow" would have proven nothing about
  the consumer that actually exists.
  The Apply-level and CLI-level claims use SMALL COMMITTED RECIPES instead
  (TASK-002/TASK-003), because SPEC-054's own recorded lesson is that a
  `Substitute`-direct test can never prove what the APPLIER routes through it.
  Both altitudes are needed and neither substitutes for the other.

  ── VERIFICATION COMMANDS (`backstop code check` does NOT exist) ───────────
    middle: go test ./pkg/recipe/... ./cmd/backstop/... -race -count=1
    final:  go build -o bin/backstop ./cmd/backstop/   (REBUILD FIRST — a stale
            binary gates the old code and the gate is then vacuous)
            ./bin/backstop gate
            ./bin/backstop artifact validate --plan PLAN-ISSUE-110
            ./bin/backstop artifact validate --spec SPEC-054

  ── REQUIREMENTS / CLAIMS (plan-local, derived from the issue) ─────────────
    REQ-001: The grammar gains a first-class escape that emits a delimited span
             verbatim, with no declaration and no lookup.
      CLM-001  `{{! X }}` emits `{{ X }}` — inner bytes VERBATIM, no trim, no
               normalization, exactly one `!` consumed — and the marker is
               recognized ONLY at the byte immediately after `{{`.
      CLM-002  An escaped span performs NO param lookup and is NEVER rescanned:
               `{{! name }}` emits `{{ name }}` even when `name` IS declared,
               and even when the param map is empty or nil.
      CLM-003  The escape is self-escaping: `{{!! x }}` emits `{{! x }}`, so no
               byte sequence is unwritable.
      CLM-004  An escaped span with no closing `}}` is copied through literally,
               bang included — the existing unterminated-span rule is unchanged.
    REQ-002: The escape is language-agnostic and covers prose-in-a-comment
             without any comment awareness anywhere in core.
      CLM-005  The SAME span behaves IDENTICALLY inside and outside a comment in
               every payload language: escaped renders verbatim everywhere,
               unescaped-and-undeclared fails loud everywhere — proving no
               positional exemption and no comment syntax was introduced.
    REQ-003: The production pass-through-param workaround keeps working, byte
             for byte.
      CLM-006  The VERBATIM captured go-distribution payloads, rendered with
               their eight declared pass-through params, still render exactly as
               they do today.
      CLM-007  The same payloads with every foreign span mechanically escaped,
               rendered with the project params ONLY and NONE of the eight
               pass-through params, produce BYTE-IDENTICAL output to CLM-006's.
      CLM-008  Every pre-existing behavior is unchanged for input containing no
               `{{!`: declared resolution, not-Turing-completeness, and fail-loud
               on an undeclared name.
    REQ-004: The reserved prefix is closed at parse time and the failure teaches
             the escape.
      CLM-009  A recipe declaring a param whose TRIMMED name begins with `!` is
               refused at manifest parse, fail-loud, naming the recipe, the param
               index and the name — because the escape makes such a param
               unreachable by any spelling.
      CLM-010  The unresolvable-placeholder error names `{{! … }}` as the remedy
               for a foreign template, while still naming the undeclared param
               and still returning NO output.
    REQ-005: Proven through the shipped applier and the shipped CLI, not only
             through Substitute-direct tests.
      CLM-011  A committed recipe whose payload carries BOTH a real backstop
               param and escaped foreign spans (in config AND in a comment)
               applies end-to-end through the real `Apply`: the param resolves,
               the foreign delimiters reach disk intact.
      CLM-012  The shipped `backstop recipe apply` reproduces CLM-011 on disk at
               exit 0.
    REQ-006: The spec of record reflects the new grammar.
      CLM-013  SPEC-054 gains the escaped-span row in its Substitution SEMANTICS
               table, its `Substitute` contract note names the escape, and the
               param-name reservation is recorded — authored through `/spec`,
               never hand-edited.

  Structure:
    Phase 1: Fixture preconditions — captured production payloads + their
             mechanically-escaped twins; one committed pkg recipe; one committed
             CLI fixture recipe. Three parallel, file-disjoint setup tasks.
    Phase 2: TDD red — five parallel, file-disjoint failing test tasks (grammar,
             captured-payload equivalence, param-name parse, Apply e2e, CLI e2e).
    Phase 3: TDD green — two SEQUENTIAL implementation tasks + package
             verification. substitute.go (TASK-009) FIRST, because it declares
             the `placeholderEscape` marker constant that manifest.go (TASK-010)
             consumes; these two cannot run in parallel without a compile break
             in pkg/recipe.
    Phase 4: Spec reconciliation via /spec + comprehensive verification
             (rebuilt binary, gate, artifact validate) + the two handoffs
             (SPEC-067, the go-distribution migration follow-on).

phases:
  # ═══════════════════════════════════════════════════════════════════════
  # Phase 1: Fixture preconditions — real captured bytes, committed recipes
  # ═══════════════════════════════════════════════════════════════════════
  - id: phase-1
    name: "Phase 1: Fixture Preconditions — Captured Production Payloads and Two Committed Recipes"
    tasks:
      - id: TASK-001
        type: setup
        title: "Capture the two production go-distribution payloads verbatim, plus their mechanically-escaped twins and a provenance record"
        description: |
          Create pkg/recipe/testdata/foreign-template/ — the CAPTURED corpus the
          equivalence proof runs on. These bytes come from a REAL, IN-PRODUCTION
          consumer; nothing here is written by hand as an "example".

          SOURCE OF RECORD (read it, do not retype it):
            ~/src/projects/backstop-go-distribution-pack/recipes/go-release/
              payload/release.yml       — the GitHub Actions workflow
              payload/.goreleaser.yml   — the goreleaser config
            ~/src/projects/backstop-go-distribution-pack/recipes/go-release/
              recipe.yml                — where the eight pass-through params and
                                          the nine project params are declared

          1. release-passthrough.yml   — `cp` of payload/release.yml. VERBATIM.
             Do not re-indent, re-wrap, fix a typo, or normalize a line ending.
             It carries: `${{ github.ref_name }}` (x2), `${{ secrets.GITHUB_TOKEN }}`
             (x2), `${{ secrets.HOMEBREW_TAP_TOKEN }}`, `{{ .Env.HOMEBREW_TAP_TOKEN }}`
             INSIDE A COMMENT, and the REAL param `{{ ci_workflow_file }}` (x4).
             The delimiter-less prose at lines 15-25 is the comment workaround —
             LEAVE IT AS IT IS in this file; it is the "before" state.

          2. goreleaser-passthrough.yml — `cp` of payload/.goreleaser.yml, renamed
             only to drop the leading dot (a dotfile in testdata/ is easy to lose).
             VERBATIM otherwise. This is the load-bearing capture: it interleaves
             goreleaser's `{{ .Version }}` / `{{ .ProjectName }}` / `{{ .Os }}` /
             `{{ .Arch }}` / `{{ .Env.HOMEBREW_TAP_TOKEN }}` with REAL backstop
             params (`{{ binary_name }}`, `{{ main_package }}`, `{{ tap_owner }}`,
             `{{ tap_repository }}`, `{{ module_url }}`, `{{ app_description }}`,
             `{{ app_license }}`) in the SAME FILE, mostly in live config rather
             than comments — which is why comment-awareness was rejected.

          3. release-escaped.yml / goreleaser-escaped.yml — the MECHANICAL twins.
             Derive each from its capture by ONE transformation and no other:
             every FOREIGN span `{{ X }}` becomes `{{! X }}` (bang inserted
             immediately after the opening braces, nothing else moved). Every
             REAL backstop param span is left byte-identical. Foreign spans are
             exactly the eight names the recipe declares as pass-throughs:
             `.Version`, `.ProjectName`, `.Os`, `.Arch`, `.Env.HOMEBREW_TAP_TOKEN`,
             `github.ref_name`, `secrets.GITHUB_TOKEN`, `secrets.HOMEBREW_TAP_TOKEN`.
             DO NOT restore the delimiter-less prose in release-escaped.yml and
             DO NOT touch anything else: TASK-005's assertion is BYTE-EQUALITY of
             the two renderings, and any other edit makes that assertion
             unfalsifiable. (The prose-comment case is CLM-005's, proven
             separately in TASK-004 across several comment syntaxes.)

          4. PROVENANCE.md — where each file came from (repo, path, and the pack
             version/commit as of capture), what the escaped twins' single
             transformation is, and the standing instruction: if the upstream
             payload changes, RE-CAPTURE it and RE-DERIVE the twin, never edit
             these by hand. Follow the convention in
             cmd/backstop/testdata/semgrep/fixtures/PROVENANCE.md.

          ACCEPTANCE BEFORE MOVING ON — ONE RULE, RUN IT ON BOTH PAIRS: undoing
          the single transformation must reproduce the capture EXACTLY, so both
          diffs must be EMPTY.
            diff <(sed 's/{{!/{{/g' release-escaped.yml)    release-passthrough.yml
            diff <(sed 's/{{!/{{/g' goreleaser-escaped.yml) goreleaser-passthrough.yml
          Empty output from BOTH, or the twin was not derived mechanically —
          re-derive it, do not reconcile it by hand. (The delimiter-less prose
