  # ═══════════════════════════════════════════════════════════════════════
  # Phase 2: TDD red — five parallel, file-disjoint failing test tasks
  # ═══════════════════════════════════════════════════════════════════════
  - id: phase-2
    name: "Phase 2: TDD Red — The Grammar, the Captured Corpus, the Parse Rejection, Apply and the CLI"
    tasks:
      - id: TASK-004
        type: test
        title: "Failing pkg/recipe grammar tests: escaped spans, self-escaping, unterminated, comment-position independence, the remedy diagnostic, and the unchanged baseline (RED)"
        description: |
          Add pkg/recipe/substitute_escape_test.go. RUN IT AND RECORD THE ACTUAL
          FAILURE OUTPUT before any production code is touched. Expected red:
          every escaped case fails with "unresolvable placeholder … no declared
          param named …" because the bang is currently just part of a name.

          DO NOT EDIT pkg/recipe/substitute_test.go. Its three shipped tests are
          the backward-compatibility baseline and must stay green untouched — a
          test file edited in the same change that makes it pass proves nothing.

          Mandated test names (exact):

            - TestSubstitute_EscapedSpanEmitsForeignTemplateVerbatim
              (CLM-001, CLM-002) — table-driven over the real foreign shapes:
                * `${{! github.ref_name }}`            → `${{ github.ref_name }}`
                * `{{! .Version }}`                    → `{{ .Version }}`
                * `{{!.Version}}`                      → `{{.Version}}`   (UNTRIMMED
                  — this case is what forbids a TrimSpace-then-rewrap
                  implementation, which would emit `{{ .Version }}` and pass a
                  weaker assertion)
                * `{{!  spaced  }}`                    → `{{  spaced  }}`
                * `{{!}}`                              → `{{}}`
                * THE HANDLEBARS-COMMENT CASE, and it must be in the table
                  precisely because the result is SURPRISING rather than wrong:
                  `{{!-- a mustache comment --}}` → `{{-- a mustache comment --}}`,
                  and `{{! comment }}` → `{{ comment }}`. `{{!` is Handlebars/
                  Mustache's own comment marker, so escaping a Handlebars comment
                  with ONE bang hands back a live interpolation in that language.
                  Pin the exact bytes, and say in the case's comment that the
                  remedy is the double bang, asserted in the self-escaping test —
                  a reader who hits this in the wild must find it already known
                  and already answered, not discover it.
                * a template mixing an escaped span and a DECLARED param in one
                  string → the param resolves AND the escape survives.
              THE NO-LOOKUP FALSIFIERS, both required:
                * `{{! name }}` with `name` DECLARED as "adopter" emits
                  `{{ name }}`, NOT `adopter` — an implementation that resolves
                  first and escapes second cannot pass;
                * the same escaped inputs render identically with a nil param map
                  and with an empty one — an escaped span cannot depend on the
                  scope at all.
              POSITIVE CONTROL in the same test: a declared unescaped param still
              resolves, so an implementation that passes by refusing everything
              fails here.
              NEGATIVE CONTROL: `{{ ! name }}` — a SPACE before the bang — is NOT
              an escape; it fails loud, because the marker is positional.

            - TestSubstitute_EscapeIsSelfEscaping_OneBangConsumedPerPass
              (CLM-003) — `{{!! x }}` → `{{! x }}`, `{{!!! x }}` → `{{!! x }}`,
              and `{{!!}}` → `{{!}}`. Assert the count relationship, not just one
              case: an implementation that strips ALL leading bangs passes the
              single case and fails here, which is the point.
              PLUS THE REAL-WORLD CASE THIS PROPERTY EXISTS TO SERVE:
              `{{!!-- x --}}` → `{{!-- x --}}`, i.e. a payload that must emit a
              genuine Handlebars/Mustache COMMENT verbatim writes the double
              bang. Verified against the mandated algorithm 2026-08-11. Name it
              in the test doc comment as the answer to the single-bang surprise
              pinned in TestSubstitute_EscapedSpanEmitsForeignTemplateVerbatim,
              so the two tests read as one story.

            - TestSubstitute_UnterminatedEscapedSpanIsCopiedThrough
              (CLM-004) — `prefix {{! never closed` is returned UNCHANGED, bang
              included, with no error. The existing unterminated rule is not
              special-cased by the escape.

            - TestSubstitute_NoCommentAwareness_EscapeIsThePositionIndependentRemedy
              (CLM-005) — THE COMMENT CLAIM, proven by symmetry rather than by
              comment parsing. Table over four comment syntaxes in one test —
              YAML/shell `#`, Go `//`, block `/* */`, HTML `<!-- -->` — and for
              each, TWO assertions:
                (a) the ESCAPED span renders verbatim inside the comment exactly
                    as it does outside one;
                (b) the UNESCAPED, UNDECLARED span STILL FAILS LOUD inside the
                    comment — identically to outside.
              (b) is the load-bearing half: it asserts that NO comment-awareness
              was introduced. If someone later "helpfully" adds a `#`-skip, this
              test goes red and the zero-baked-language violation is caught.
              Say that in the test's doc comment, naming CLAUDE.md's first
              principle, so the assertion is not mistaken for an oversight.

            - TestSubstitute_UndeclaredPlaceholderErrorNamesTheEscape
              (CLM-010) — an undeclared `{{ github.ref_name }}` still errors,
              still returns "", still names `github.ref_name`, AND the message
              now contains the literal escape form `{{!` so the author is told
              the remedy in the failure itself. Assert all four properties; the
              first three are the regression guard on the diagnostic upgrade.

            - TestSubstitute_UnescapedGrammarIsUnchanged
              (CLM-008) — the explicit backward-compatibility lock, at the
              grammar level: the SELF-EMITTING PASS-THROUGH IDIOM still works.
              Declare a param named `.Version` whose default is `{{ .Version }}`,
              render `ldflags: -X main.version={{ .Version }}`, and assert the
              output is `ldflags: -X main.version={{ .Version }}` — i.e. the
              emitted value is NOT rescanned and NOT re-substituted, exactly as
              substitute.go:22-23 promises. This is the one-line version of what
              TASK-005 proves over the real payloads.
        files:
          - pkg/recipe/substitute_escape_test.go
        claims:
          - CLM-001
          - CLM-002
          - CLM-003
          - CLM-004
          - CLM-005
          - CLM-008
          - CLM-010
        test_names:
          - TestSubstitute_EscapedSpanEmitsForeignTemplateVerbatim
          - TestSubstitute_EscapeIsSelfEscaping_OneBangConsumedPerPass
          - TestSubstitute_UnterminatedEscapedSpanIsCopiedThrough
          - TestSubstitute_NoCommentAwareness_EscapeIsThePositionIndependentRemedy
          - TestSubstitute_UndeclaredPlaceholderErrorNamesTheEscape
          - TestSubstitute_UnescapedGrammarIsUnchanged
        depends_on:
          - TASK-001

