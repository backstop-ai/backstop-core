               explicitly in the report rather than passing silently. Any hunk
               that weakens or adjusts a substitution assertion is a STOP, from
               whichever lane it came. substitute_test.go and manifest_test.go
               have no such sibling claim and must be clean.
            2. THE PRODUCTION WORKAROUND STILL RENDERS. Run the captured-payload
               test alone and confirm both cases pass:
                 go test ./pkg/recipe/ -race -count=1 \
                   -run TestSubstitute_CapturedGoDistributionPayloads
            3. COVERAGE. Confirm pkg/recipe still meets its floor:
                 go test ./pkg/recipe/... -coverprofile=/tmp/recipe.cover && \
                 go tool cover -func=/tmp/recipe.cover | tail -1
               The new escape branch is exercised by TASK-004 and the new
