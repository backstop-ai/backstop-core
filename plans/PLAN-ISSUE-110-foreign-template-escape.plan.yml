      - id: TASK-011
        type: verification
        title: "Package verification: both suites green, the shipped baseline untouched, coverage held"
        description: |
          Run, and report TRUE exit codes:
            go test ./pkg/recipe/... ./cmd/backstop/... -race -count=1

          Then verify the three properties this lane can silently violate:

            1. THE SHIPPED BASELINE CARRIES NO CHANGE ATTRIBUTABLE TO THIS LANE.
               `git diff --stat` on pkg/recipe/substitute_test.go,
               manifest_test.go and apply_substitution_test.go. The rule is NOT
               "no change at all" — it is that NO TASK IN THIS PLAN may edit
               them, and none declares them in its `files`. If any shipped test
               needed editing to go green, the escape changed behavior it
               promised not to change — STOP and report rather than editing the
