               ONE EXPECTED EXCEPTION, so a legitimate diff is not misread as a
               failure: plans/PLAN-ISSUE-081-insert-placement-semantics.plan.yml
               is in flight in this same tree and its own tasks DO edit
               pkg/recipe/apply_substitution_test.go (it is in that plan's
