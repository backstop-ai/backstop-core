  - id: phase-4
    name: "Phase 4: SPEC-054 Reconciliation and Comprehensive Verification"
    tasks:
      - id: TASK-012
        type: documentation
        title: "Reconcile SPEC-054 with the new substitution grammar, through /spec"
        description: |
          SPEC-054 is `implemented` and is the spec of record for this machinery,
          so the grammar change lands there or the code and the spec disagree.
          DISPATCH `/spec` — never hand-edit the spec file (CLAUDE.md: all
          artifact authoring routes through the purpose-built agents).

          ⚠ SPEC-054 IS A SHARED ARTIFACT RIGHT NOW — READ IT, DO NOT TRUST THE
          LINE NUMBERS BELOW. plans/PLAN-ISSUE-081-insert-placement-semantics.plan.yml
          (also `draft`, also authored 2026-08-11, running in the same tree) ALSO
          amends specs/SPEC-054-recipe-apply-and-manifest.spec.md — its TASK
          pins `insert`'s PLACEMENT SEMANTICS and the direct-mode-only CLI scope,
          a DIFFERENT section from this plan's SUBSTITUTION SEMANTICS. The two
          amendments are genuinely ADDITIVE, not conflicting, and neither blocks
          the other. But whichever lands second sees a spec whose line numbers,
          spec_version and CLM allocation have MOVED. So: reconcile against
          WHAT IS ON DISK at execution time, re-locate each section by its
          HEADING rather than by the `~line` hints below, and let `/spec` allocate
          CLM ids against the ids actually present — never against the ids this
          plan or its sibling assumed. If the sibling's amendment is already in,
          build on it; if it is not, do not pre-empt it.

          Carry this brief across verbatim enough to act on:

            1. SUBSTITUTION SEMANTICS TABLE (spec line ~1240) — add a row:
               | escaped `{{! text }}` | emitted VERBATIM as `{{ text }}`, one
               `!` consumed, no lookup | <new CLM> |
               and a short paragraph under the table stating the positional
               marker rule, the self-escaping property, and that the escape is
               the ONLY mechanism — there is deliberately no comment-awareness,
               for the zero-baked-language reason.
            2. REQ-002's non-Turing framing — state that an escaped span is
               EMITTED, never evaluated, so the escape strengthens the property
               rather than opening an expression grammar.
            3. THE `Substitute` CONTRACT ENTRY (spec line ~1087) — the signature
               is UNCHANGED (`func Substitute(template string, params
               map[string]string) (string, error)`); only its `notes` gains the
               escape. Say so explicitly so the contract-signature dimension is
               not asked to absorb a change that did not happen.
            4. A NEW CLAIM for the escape, whose mandated tests are the exact
               names delivered by TASK-004 and TASK-005, and A NEW CLAIM for the
               param-name reservation naming TASK-006's test. The /spec agent
               allocates the CLM ids — this plan does not, and must not, guess
               them.
            5. THE SUBSTITUTION SCOPE TABLE IS UNCHANGED. No `Op` field changed
               its substituted/not-substituted status; the escape is a property
               of the GRAMMAR, applying uniformly at every site that already goes
               through Substitute. State this in the reconciliation so a reader
               does not go looking for a scope change that is not there.
            6. RECORD THE HANDLEBARS INTERACTION IN THE SPEC, not only in the code.
             `{{!` is Handlebars/Mustache's own comment marker, so a single-bang
             escape of a Handlebars comment emits a live interpolation in that
             language (`{{!-- x --}}` → `{{-- x --}}`); the remedy is the double
             bang (`{{!!-- x --}}` → `{{!-- x --}}`), which is the self-escaping
             rule, not a special case. State it as a NAMED SHARP EDGE next to the
             escaped-span row. This is the one surprising consequence of the
             grammar and the spec is where a reader is entitled to find it.
          7. Record the backward-compatibility guarantee: the self-emitting
               pass-through-param idiom remains supported and is proven against
               CAPTURED PRODUCTION BYTES, and no consumer is being migrated.

          A version bump on SPEC-054 is expected; the /spec agent owns its shape.
          Validate before handing on:
            ./bin/backstop artifact validate --spec SPEC-054
        files:
          - specs/SPEC-054-recipe-apply-and-manifest.spec.md
        claims:
          - CLM-013
        depends_on:
          - TASK-011

      - id: TASK-013
        type: verification
        title: "Rebuild, full gate, artifact validate, and the two handoffs (SPEC-067, the go-distribution migration)"
        description: |
          THE BINARY FIRST, or the gate is vacuous:
            go build -o bin/backstop ./cmd/backstop/
          then, reporting TRUE exit codes for each:
            ./bin/backstop gate
            ./bin/backstop artifact validate --plan PLAN-ISSUE-110
            ./bin/backstop artifact validate --spec SPEC-054

          `gate` covers the code categories (both production files are in diff
          scope, and the new test and fixture files with them); `artifact
          validate` covers the artifact category, since this plan file and
          SPEC-054 both changed. Do NOT narrow either run with repeated `--file`
          (ISSUE-093: extras are silently dropped, and a silently narrowed gate is
          the vacuous green this project exists to prevent).

          HANDOFF 1 — NOTIFY SPEC-067, AS AN AVAILABILITY NOTICE AND NOTHING
          MORE. This is a FYI to an adjacent lane, NOT an instruction to change
          anything. SPEC-067 has independently avoided ever needing the escape:
          its REQ-006 forbids a `${{ ... }}` expression in any payload and reads
          `GITHUB_BASE_REF` / `GITHUB_EVENT_NAME` / `GITHUB_SHA` as ordinary env
          vars instead, as a stated design decision, and it pins that with five
          tests (CLM-044 plus the four per-platform
          `…_RenderedCarriesNoResidualPlaceholder` claims) that assert NO literal
          `{{` or `}}` survives in rendered output. DO NOT tell it to adopt
          escapes: a rendered `{{ … }}` is a literal `{{`, so an escape in a
          SPEC-067 payload would violate REQ-006 and redden all five. Report:

            ISSUE-110 has landed: recipe payloads now have a first-class escape.
            Write `{{! <foreign text> }}` and the span is emitted as
            `{{ <foreign text> }}` verbatim — no param declaration, no lookup, no
            unresolvable-placeholder error. Prose in a comment works the same way.
            SPEC-067 as scoped does NOT need this and should not adopt it: it has
            already avoided pass-through params by using plain env vars instead of
            `${{ }}` expressions in its GitHub template, and its own REQ-006 plus
            five mandated tests require that no literal `{{`/`}}` reach a rendered
            file — which an escaped span would produce by design. The mechanism
            remains AVAILABLE to SPEC-067 or to any future CI-recipe author who
            does need to emit real `${{ }}` or other foreign-template content
            verbatim; it is simply not required by SPEC-067 as it stands. The
            older pass-through-param idiom also still works unchanged.

          HANDOFF 2 — FILE THE PACK MIGRATION, DO NOT DO IT. Report for a
          follow-on issue authored through `/issue` (never hand-written), with
          the evidence carried across so the author does not re-derive it:

            `backstop-ai/go-distribution` can drop the eight self-emitting
            pass-through params from recipes/go-release/recipe.yml:68-91 and
