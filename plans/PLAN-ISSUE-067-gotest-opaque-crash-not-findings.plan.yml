  ── WHAT IS ACTUALLY BROKEN (measured, same session, same tree) ─────────────

  The opaque crash is real. Its mechanism is ONE LEVEL BELOW the converter, and
  no amount of converter work can reach it: THE BYTES CARRYING THE DIAGNOSTIC
  NEVER ARRIVE. `go test` splits its output across two streams, and core reads
  only one of them.

    STREAM SPLIT, MEASURED (go 1.25.3):

      compile error in a _test.go file
        stdout : "FAIL\tgotest-repro/sub/pkg [build failed]\nFAIL"
        stderr : "# gotest-repro/sub/pkg [gotest-repro/sub/pkg.test]"
                 "sub/pkg/b_test.go:6:2: undefined: undefinedSymbol"

      `go vet` failure during `go test`   → same split (diagnostic on stderr)
      compile error via `go build ./...`  → stdout EMPTY; ALL of it on stderr
      assertion failure                   → all on stdout, stderr empty

  `ExecCommandRunner.RunStdout` (`pkg/check/runner.go:52`) captures stdout ONLY,
  by deliberate design — SPEC-031 REQ-009/CLM-028 made it an explicit buffer so
  "stderr cannot interleave into the bytes" of a SARIF-on-stdout engine. So for
  every build/vet-shaped failure the located diagnostic is DISCARDED BEFORE THE
  CONVERT RUNS. The converter is handed only `FAIL <pkg> [build failed]`, which
  it ignores, so it emits `{"results":[]}` — and then, at
  `cmd/backstop/pack_gate.go:792`:

      if binding.CrashGuard && runErr != nil && len(checkViolations) == 0 {
          return nil, fmt.Errorf("pack %s engine %q crashed: non-zero exit with
              no parseable findings: %w", ...)

  …produces EXACTLY the string the issue quotes. The guard is behaving correctly
  on the evidence it was given; it was given the wrong evidence.

  ── THE PART THE ISSUE DID NOT KNOW: go-build HAS NEVER WORKED AT ALL ───────

  `go build ./...` writes NOTHING to stdout — every compiler diagnostic goes to
  stderr (measured above). So the go-build findings engine's convert script,
  `scripts/build-to-sarif.sh`, receives an EMPTY payload on every real run. It
  has never once emitted a finding in production. Every compile error in
  production Go code has been reported as `engine "go build" crashed`, not as a
  located finding, for the entire life of the packs-only toolchain.

  This is invisible in the test corpus because the corpus injects as STDOUT the
  bytes production only ever produces on STDERR:
  `cmd/backstop/testdata/go-toolchain/fixtures/go-build-errors.txt` is fed
  through `fixtureRunner.RunStdout` (`pack_gate_gotoolchain_test.go:53`). The
  unit tests pass; the wiring is broken. This is the standing
  integration-gap class, and it is why component-level green never surfaced it.

