          - /Users/bmanson/src/projects/backstop-go-toolchain-pack/scripts/test-produce.sh
          - /Users/bmanson/src/projects/backstop-go-toolchain-pack/scripts/build-produce.sh
          - /Users/bmanson/src/projects/backstop-go-toolchain-pack/scripts/test-to-sarif.sh
        claims:
