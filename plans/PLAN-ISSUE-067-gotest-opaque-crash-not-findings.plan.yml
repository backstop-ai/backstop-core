  5. TWO DECLARATIONS IN LOCKSTEP. The released pack (external repo) and the
     in-repo fixture at
     `cmd/backstop/testdata/go-toolchain/.backstop/packs/backstop/go-toolchain/`
     must both carry the producers AND both carry the new scripts. The tests
     read the FIXTURE; the gate runs the INSTALLED pack. Flipping only one
     ships nothing or tests nothing. Nothing automated enforces this
     (ISSUE-137).
  6. THE PRODUCER SCRIPTS NEED SHEBANG + EXEC BIT. They are invoked directly by
     path via the runner, exactly as `coverage-produce.sh` is (`-rwxr-xr-x`,
     `#!/bin/sh`). A non-executable script fails as a never-started process —
     which CLM-003 will correctly refuse, but the intent is that it not happen.
     `git update-index` preserves the mode; verify the committed mode.
  7. THE PRODUCER MUST PRESERVE THE TOOL'S EXIT STATUS. `crash_guard` and the
     non-zero-exit contract both read `runErr`. A script that swallows the exit
     code turns a failing suite into a clean-looking run — the exact vacuous
     green this plan exists to close. Do NOT copy `coverage-produce.sh`'s
     `|| true` / `exit 0` tail: that is correct for a coverage PROFILE producer
     and catastrophic for a findings producer.
  8. MERGING STDERR WIDENS THE CONVERTER'S INPUT. Anything a test writes to
     stderr now reaches `test-to-sarif.sh`. CLM-008's `# <import-path>` header
     requirement is the discriminator; it must be tested with a hostile fixture
     (a test that prints a diagnostic-shaped line), not assumed.
  8a. THE HEADER DISCRIMINATOR MUST BE STICKY, OR IT SILENTLY UNDER-REPORTS.
     Go puts MULTIPLE diagnostics under ONE `#` header. Measured 2026-08-16,
     go 1.25.3, a test file with three undefined symbols:

       # b1probe/sub/pkg [b1probe/sub/pkg.test]
       sub/pkg/b_test.go:6:2: undefined: undefinedOne
       sub/pkg/b_test.go:7:2: undefined: undefinedTwo
       sub/pkg/b_test.go:8:2: undefined: undefinedThree
       FAIL	b1probe/sub/pkg [build failed]
       FAIL

     Three diagnostics, ONE header. A discriminator that checks only whether the
     IMMEDIATELY-PRECEDING line was a header converts the FIRST diagnostic and
     silently drops the other two — an under-report, which is the same failure
     class this plan exists to close, just quieter. The header must therefore be
     MODE STATE, not a one-line lookback: set it on a `#` line, keep it in
     effect across every consecutive diagnostic line, and clear it on a
     `--- FAIL:` line or on any line that matches neither shape. TASK-005's
     `TestIssue067_MultipleDiagnosticsUnderOneHeaderAllBecomeFindings` is the
     falsifier and asserts a COUNT, because a non-sticky implementation passes
     every single-diagnostic test in this plan.
  9. GO-BUILD'S CONVERTER IS NOT TO BE EDITED. `build-to-sarif.sh` already
     parses the shape correctly — it has simply never received bytes. Editing it
     would mean the fix was misdiagnosed. If a task finds itself changing it,
     STOP and report.
  10. THE GATE GETS STRICTLY LOUDER THE MOMENT THE LOCK UPDATES. Compile errors
     that previously surfaced as one opaque crash will surface as N located
     findings. Both are RED, so no new red class appears — but a tree with a
     pre-existing compile break will now report differently. Run an unfiltered
     suite before TASK-010's relock and resolve anything already red honestly,
     never by waiver.
  11. SHARED WORKING TREE. Other agents are active in this repo. Do not run a
     full `go test ./...` or `backstop gate --all` while an implementer is
     mid-flight in the same tree; prefer scoped runs and say plainly what was
     and was not re-run.

  Structure:
    Phase 1: Setup — capture the real stream evidence as fixtures.
    Phase 2: Core — `runFindingsEngine` honors a declared producer (TDD).
    Phase 3: Pack data in the in-repo fixture — producer scripts + converter
             widening (TDD), then re-ground the harness.
    Phase 4: Release the pack externally and adopt it in the lock.
    Phase 5: Comprehensive verification + codebase map.

phases:
  # ═══════════════════════════════════════════════════════════════════════
  # Phase 1: Capture the real evidence
  # ═══════════════════════════════════════════════════════════════════════
  - id: phase-1
    name: "Phase 1: Capture the Real go test / go build Stream Split as Fixtures"
    tasks:
      - id: TASK-001
        type: setup
        title: "Capture real merged and stdout-only go test / go build failure output"
        description: |
          Every later task's honesty rests on these bytes. They must be CAPTURED
          from real tool runs, never hand-written — a fabricated approximation of
          compiler output encodes the assumption instead of falsifying it.

          Build a throwaway Go module OUTSIDE the repo (use the session scratchpad,
          not `/tmp`, and not anywhere under backstop-core). Give it a package
          BELOW the module root — `sub/pkg` — so the captures carry realistic
          nested paths. Then capture each of the following, recording BOTH the
          merged stream and the stdout-only stream of the SAME run:

            a) COMPILE ERROR IN A TEST FILE. A `_test.go` calling THREE distinct
               undefined symbols on three consecutive lines — three, not one,
               because sharp edge 8a's sticky-header requirement can only be
               falsified by a capture carrying MULTIPLE diagnostics under a
               SINGLE `#` header, and a one-diagnostic capture would let a
               non-sticky converter pass. Capture `go test ./... 2>&1` into
               `go-test-build-failure.txt` and `go test ./... 2>/dev/null` into
               `go-test-build-failure-stdout-only.txt`.
               Reference shape MEASURED 2026-08-16 with go 1.25.3 — your capture
               should match in structure:
                 merged : "# b1probe/sub/pkg [b1probe/sub/pkg.test]"
                          "sub/pkg/b_test.go:6:2: undefined: undefinedOne"
                          "sub/pkg/b_test.go:7:2: undefined: undefinedTwo"
                          "sub/pkg/b_test.go:8:2: undefined: undefinedThree"
                          "FAIL\tb1probe/sub/pkg [build failed]"
                          "FAIL"
                 stdout : "FAIL\tb1probe/sub/pkg [build failed]"
                          "FAIL"
               Note the ONE header covering THREE diagnostics — that is the
               shape TASK-005's multi-diagnostic test asserts a count against.
               The stdout-only file is the FALSIFICATION ANCHOR: it is exactly
               what core sees today. Pre-fix it yields zero findings and the
               opaque crash; post-fix TASK-005 asserts it yields a finding
               naming the package instead. It is also the source TASK-005's
               CLM-009 floor test derives its payload from, so capture it
               byte-faithfully — do not normalize whitespace.
            b) VET FAILURE UNDER `go test`. A `t.Logf("%d", "string")`. Capture the
               merged stream into `go-test-vet-failure.txt`. Its diagnostic also
               sits under a `#`-prefixed header, which is what CLM-008 keys on.
            c) BUILD ERROR VIA `go build`. A type error in a non-test file.
               Capture `go build ./... 2>&1` into `go-build-stderr-capture.txt`
               and confirm — recording the confirmation — that
               `go build ./... 2>/dev/null` is EMPTY. That emptiness is the whole
               of CLM-007's motivation and is worth stating in the file header.
            d) HOSTILE STDERR. A PASSING test that writes a diagnostic-shaped line
               to `os.Stderr`, e.g. `fmt.Fprintln(os.Stderr, "notes.go:12: check
               this")`, alongside one genuinely failing test. Capture merged into
               `go-test-hostile-stderr.txt`. CLM-008 is proved against this and
               nothing else.

          Write each capture verbatim into
          `cmd/backstop/testdata/go-toolchain/fixtures/`. Prepend NOTHING to the
          captured bytes — if provenance needs recording, put it in the task's
          implementation record, not in the fixture (the converter reads these
          byte-for-byte).

          Do NOT modify the two fixtures that already exist
          (`go-test-failures.txt`, `go-build-errors.txt`). They are the CLM-010
          no-regression baseline and their violation counts must not move.
        files:
          - cmd/backstop/testdata/go-toolchain/fixtures/go-test-build-failure.txt
          - cmd/backstop/testdata/go-toolchain/fixtures/go-test-build-failure-stdout-only.txt
          - cmd/backstop/testdata/go-toolchain/fixtures/go-test-vet-failure.txt
          - cmd/backstop/testdata/go-toolchain/fixtures/go-build-stderr-capture.txt
          - cmd/backstop/testdata/go-toolchain/fixtures/go-test-hostile-stderr.txt
        claims:
          - CLM-006
          - CLM-007
          - CLM-008
          - CLM-009
        depends_on: []

  # ═══════════════════════════════════════════════════════════════════════
  # Phase 2: Core — honor a declared producer on the findings path
  # ═══════════════════════════════════════════════════════════════════════
  - id: phase-2
    name: "Phase 2: runFindingsEngine Honors a Pack-Declared Producer"
    tasks:
      - id: TASK-002
        type: test
        title: "TDD red: the findings dispatch must run a declared producer with the shaped args"
        description: |
          Add `cmd/backstop/pack_gate_producer_findings_test.go`. Drive the REAL
          `dispatchPackEngines` / `runFindingsEngine` — no seam injection at the
          dispatch level. Model the tests on `coverage_producer_dispatch_test.go`,
          which already proves the same properties for the coverage path; that
          file is the template for how a producer is asserted here, and reading it
          first will save re-deriving the harness.

          Use SYNTHETIC pack manifests (an `acme/*` pack in `t.TempDir()`), NOT
          the go-toolchain fixture. This phase is about the general seam and must
          contain no Go/tool literal in its subject — a `go test` command in these
          tests would make the core change read as go-specific, which it is not.

          Assert:
            * `TestFindingsEngine_RunsDeclaredProducerInPlaceOfCommand` — the
              runner is invoked with the packRoot-resolved producer PATH, and the
              binding's own command tool is never invoked (CLM-001).
            * `TestFindingsEngine_ProducerReceivesTheSameShapedArgsAsTheCommand` —
              THE LOAD-BEARING ONE, and the point of departure from the coverage
              producer (which is invoked bare). Assert across all four shapes:
              a project-wide binding with a `project_target` gets that target; a
              diff-scoped binding gets the explicit in-scope file list; a
              testdata-only diff yields an EMPTY arg list and NOT the project root
              (the ISSUE-010 CLM-003 anti-fallback); and a `package_scoped`
              binding under a `GateScopeModeFile` scope gets the changed file's
              package selector from `fileModeTestTarget` (CLM-001).
            * `TestFindingsEngine_MissingDeclaredProducerFailsLoud` — a declared
              path that does not exist (and a path that is a DIRECTORY) errors,
              naming pack + path, and THE RUNNER IS NEVER REACHED (CLM-002).
            * `TestFindingsEngine_ProducerNeverStartedIsRefused` — a producer whose
              exec fails with the never-started shape is refused via the ISSUE-112
              path, distinctly from the crash-guard message (CLM-003).
            * `TestFindingsEngine_ProducerCrashGuardStillFiresOnZeroFindings` — a
              `crash_guard` binding whose producer exits non-zero and converts to
              zero findings still returns the crash error (CLM-003, CLM-012).
            * `TestFindingsEngine_NoProducerDeclaredPathUnchanged` — a binding with
              no producer invokes `splitCommand(binding.Command)`'s tool with
              identical args, and its payload/convert/parse tail is untouched
              (CLM-004).

          FALSIFY FIRST. Before TASK-003 these must fail because
          `runFindingsEngine` ignores `binding.Producer` entirely — the producer
          test will observe the plain COMMAND being invoked. Record that observed
          output. A test that passes now is not driving the real path.
        files:
          - cmd/backstop/pack_gate_producer_findings_test.go
        claims:
          - CLM-001
          - CLM-002
          - CLM-003
          - CLM-004
          - CLM-012
        test_names:
          - TestFindingsEngine_RunsDeclaredProducerInPlaceOfCommand
          - TestFindingsEngine_ProducerReceivesTheSameShapedArgsAsTheCommand
          - TestFindingsEngine_MissingDeclaredProducerFailsLoud
          - TestFindingsEngine_ProducerNeverStartedIsRefused
          - TestFindingsEngine_ProducerCrashGuardStillFiresOnZeroFindings
          - TestFindingsEngine_NoProducerDeclaredPathUnchanged
        depends_on: []

      - id: TASK-003
        type: implementation
        title: "Honor binding.Producer in runFindingsEngine, symmetrically with the coverage path"
        description: |
          Edit `cmd/backstop/pack_gate.go`, in `runFindingsEngine` ONLY. Locate the
          site BY NAME — the `runner.RunStdout(context.Background(), cmdName,
          cmdArgs...)` call that sits immediately before the never-started refusal
          and the `payload := stdout` selection. Line numbers in this plan are
          stale by construction; this file has been edited repeatedly.

          THE CHANGE IS A SWAP OF THE INVOKED NAME, NOTHING ELSE. Leave every line
          that computes `cmdArgs` exactly as it is — the trust gate,
          `gatherEngineInputs`, the ScopeKind branch, `fileModeTestTarget`,
          `excludeTestdataPaths`, the anti-fallback empty-list behavior. Then:

            1. When `binding.Producer != ""`, resolve
               `filepath.Join(packRoot, filepath.FromSlash(binding.Producer))` and
               `os.Stat` it, erroring `broken pack %s: missing findings producer
               script %s` when it is absent or a directory — mirroring the
               convert-missing error's shape and the coverage producer's guard.
               Return BEFORE the runner is reached (CLM-002).
            2. Invoke `runner.RunStdout(ctx, producerPath, cmdArgs...)` instead of
               `runner.RunStdout(ctx, cmdName, cmdArgs...)`. THE ARGS ARE THE SAME
               ARGS (CLM-001). Write the comment explaining why this diverges from
               `runCoverageEngine`'s bare invocation — the four scope contracts
               named in this plan's notes — because the asymmetry will otherwise
               read as an inconsistency to the next reader.
            3. Everything downstream is UNCHANGED and must stay so: the
               `runNeverStarted` refusal, the `stdout_artifact` selection, the
               strict-SARIF shape guard, the convert, `ParsePackFindings`, the
               crash-guard, and the ProjectWide/GateType stamping loop. The
               producer branch produces `stdout` and `runErr` of the same kinds
               the command branch does, so no downstream logic changes (CLM-003).

          Do NOT refactor the shared run/convert tail into a helper, do NOT touch
          `runCoverageEngine`, and do NOT touch `cmd/backstop/gate.go`. The gate
          wiring file is under heavy concurrent edit and this fix has no business
          in it.

          Also correct the doc comment on `runFindingsEngine` — it currently says
          "run the command via the clean-stdout runner" and must now name the
          producer alternative, or it becomes a lie the moment this lands.
        files:
          - cmd/backstop/pack_gate.go
        claims:
          - CLM-001
          - CLM-002
          - CLM-003
          - CLM-004
          - CLM-012
        depends_on:
          - TASK-002

      - id: TASK-004
        type: verification
        title: "Gate the core producer change"
        description: |
          Run `backstop gate` (diff-scoped) and read the result. Then run the
          phase's tests explicitly and read them:
          `go test ./cmd/backstop/ -run "TestFindingsEngine_" -count=1 -v`,
          confirming all six mandated names pass with zero skipped subtests.

          Also confirm the coverage path did not move: `go test ./cmd/backstop/
          -run "TestCoverageProducer|TestPackDispatch" -count=1`.

          Do not run `backstop gate --all` here — that is Phase 5's job, and the
          tree is shared.
        files:
          - cmd/backstop/pack_gate.go
          - cmd/backstop/pack_gate_producer_findings_test.go
        claims:
          - CLM-001
          - CLM-002
          - CLM-003
          - CLM-004
        depends_on:
          - TASK-003

  # ═══════════════════════════════════════════════════════════════════════
  # Phase 3: Pack data — producers + converter widening (in-repo fixture)
  # ═══════════════════════════════════════════════════════════════════════
  - id: phase-3
    name: "Phase 3: go-toolchain Producers and the Widened Test Converter"
    tasks:
      - id: TASK-005
        type: test
        title: "TDD red: a test-file compile break must yield located findings, not an opaque crash"
        description: |
          Add `cmd/backstop/pack_gate_issue067_regression_test.go`. This is the
          acceptance surface of the whole plan and it must drive REAL artifacts:
          the real fixture manifest via `goToolchainManifest` + `onlyRules`, the
          real converter via `stubSandboxedRunStdout` (which shells the actual
          script), the real captured fixtures via `readFixture`, and the real
          `dispatchPackEngines`.

          Tests:
            * `TestIssue067_StdoutOnlyCaptureYieldsAFindingNotTheOpaqueCrash` —
              feed `go-test-build-failure-stdout-only.txt` (what core sees TODAY)
              and assert the dispatch returns NO error and at least one finding
              naming the `[build failed]` package. Give the runner a non-nil
              error so the crash guard's `runErr != nil` precondition is met —
              the point is that the guard is no longer REACHED, not that it is
              disabled.

              THIS IS THE PLAN'S CENTRAL FALSIFIER, AND IT IS RED FIRST LIKE
              EVERY OTHER TEST HERE. Pre-fix it fails, and the failure output IS
              the evidence sharp edge 3 requires you to record verbatim: the
              literal `crashed: non-zero exit with no parseable findings` error,
              observed against the UNMODIFIED converter. That capture is exactly
              ISSUE-067 reproduced. Once TASK-006 lands it is unrecoverable, so
              record it before touching the pack.

              DO NOT ASSERT THIS PAYLOAD STILL CRASHES AFTER THE FIX. The
              stdout-only capture is `FAIL\t<pkg> [build failed]` plus a bare
              `FAIL` — output that NAMES A FAILED PACKAGE. CLM-009 says such a
              run always yields at least one finding, so demanding a crash here
              would directly contradict CLM-009's floor on the very same bytes,
              and the two assertions could not both hold. CLM-012 is narrower by
              its own wording — "no diagnostic output AT ALL" — and this capture
              is not that. CLM-012's permanent pin is already held, on a
              genuinely empty payload, by TASK-002's
              `TestFindingsEngine_ProducerCrashGuardStillFiresOnZeroFindings`;
              it does not need and must not get a second, conflicting pin here.
            * `TestIssue067_TestFileCompileFailureYieldsLocatedFindingsNotCrash` —
              feed the MERGED `go-test-build-failure.txt` and assert: no dispatch
              error; at least one violation; and one violation whose File is the
              nested path the compiler printed (`sub/pkg/b_test.go`-shaped, as
              captured), whose Line is the compiler's line, and whose Message
              carries the compiler text. Assert the rule is namespaced to the pack
              (CLM-006).
            * `TestIssue067_VetFailureYieldsLocatedFinding` — same against
              `go-test-vet-failure.txt` (CLM-006).
            * `TestIssue067_BuildFailureReachesTheBuildConverter` — drive the
              `go-build` engine with `go-build-stderr-capture.txt` and assert
              located violations come out. This is the claim that the converter
              which has never fired in production now fires (CLM-007).
            * `TestIssue067_DiagnosticShapedTestOutputManufacturesNoFinding` —
              feed `go-test-hostile-stderr.txt` and assert the genuinely failing
              test produces a finding while the passing test's
              diagnostic-shaped stderr line produces NONE. Assert on the exact
              violation set, not merely on a count (CLM-008).
            * `TestIssue067_BuildFailedSummaryAlwaysYieldsAtLeastOneFinding` —
              assert that a payload carrying ONLY the `[build failed]` summary,
              with no `#` header and no positional line, yields at least one
              finding naming the package. This is the floor that keeps a
              partially-captured failure off the crash path (CLM-009).

              DERIVE THE PAYLOAD FROM TASK-001's REAL CAPTURE — DO NOT HAND-SPELL
              IT. Read `go-test-build-failure-stdout-only.txt` via `readFixture`
              and select from it the line(s) containing `[build failed]`; feed
              those bytes. That file IS this shape and nothing else (it is the
              stdout half of the same real run), so it is the honest source. A
              separately hand-typed `FAIL\t<pkg>\t[build failed]` literal is
              exactly how the wrong byte shape gets reintroduced in the fixture
              even after TASK-006 is corrected: the test would then agree with a
              broken converter and pass vacuously. Derive the expected package
              name from the same captured bytes too, rather than restating it.
            * `TestIssue067_ExistingCapturedShapesUnchanged` — re-assert the
              existing baselines: `go-test-failures.txt` still yields exactly its
              current violations (including `TestNoPos`'s unlocated one) and
              `go-build-errors.txt` still yields exactly 3. Read the current
              counts from the existing tests rather than guessing (CLM-010).
            * `TestIssue067_MultipleDiagnosticsUnderOneHeaderAllBecomeFindings` —
              sharp edge 8a's falsifier, and THE ONLY TEST HERE THAT CATCHES A
              NON-STICKY HEADER. Feed the merged `go-test-build-failure.txt`,
              which carries three diagnostics under one `#` header, and assert
              the violation COUNT is three and that all three lines are
              represented — not merely that "a" finding came out. A converter
              that resets header state after the first diagnostic passes every
              other test in this plan and fails only this one (CLM-008).
            * `TestIssue067_MultiEngineDispatchSurvivesOneEnginesCompileBreak` —
              CLM-011's real assertion, which no test in this plan previously
              made. Drive `dispatchPackEngines` with TWO engines in ONE dispatch:
              the `go-test` engine fed the merged compile-failure capture, plus a
              second, genuinely-working engine in the same manifest fed output
              that yields findings. Assert BOTH: the dispatch returns NO error,
              and the working engine's findings are present in the returned set.
              This is the blast-radius claim — `dispatchPackEngines` returns
              `nil, err` on the FIRST engine error, so before the fix the working
              engine's findings are discarded entirely (CLM-011).
            * `TestIssue067_VerdictCollectorIsPopulatedNotStarved` — the second
              half of CLM-011, asserted DIRECTLY rather than narrated. Take the
              violations from the multi-engine dispatch above, pass them through
              `gate.RouteTestVerdictFindings`, and assert the returned slice is
              NON-EMPTY — i.e. ISSUE-118's `collectedVerdicts` has something to
              join. Before the fix the dispatch errors, `violations` is nil, and
              the collector is starved; assert on the populated set, never on a
              log line (CLM-011).
            * `TestIssue067_ProducerScriptsExitZeroOnAGreenTree` — THE B1 CLASS
              FALSIFIER, and the only test in this plan that executes the real
              producer scripts. Every other test here routes through
              `fixtureRunner`, which returns canned bytes and IGNORES the real
              args, so all of them stay green even if the producer scripts are
              catastrophically wrong. Write a minimal PASSING Go module into
              `t.TempDir()`, then execute each committed producer script directly
              with THE REAL ARG VECTOR core would hand it — `test`, `./...` for
              the test producer and `build`, `./...` for the build producer,
              subcommand included, exactly as `splitCommand` yields it — with the
              temp module as the working directory. REQUIRE EXIT 0 FROM BOTH.
              A producer whose body doubles the subcommand exits non-zero here
              even though the tree is green, which is precisely the permanent,
              opaque, clean-tree RED this test exists to prevent from ever being
              tagged and pushed. Skipping this test for want of a Go toolchain is
              not acceptable — the suite already requires one to run at all.
            * `TestIssue067_FixturePackDeclaresExecutableProducersOnBothEngines` —
              CLM-013's in-repo half, asserted rather than assumed. Parse the
              fixture pack manifest and assert the `go-test` and `go-build`
              bindings each declare a `producer:`, that each declared path
              resolves under the pack root to a file that EXISTS, and that each
              is executable (sharp edge 6 — a non-executable script fails as a
              never-started process). Assert also that `golangci` and any other
              findings binding declare NO producer, so the declaration cannot
              spread by copy-paste into the engine that emits native SARIF
              (CLM-013).

          FALSIFICATION IS ORDER-DEPENDENT (sharp edge 3). ALL of these — with no
          exceptions — MUST be observed RED against the UNMODIFIED fixture pack
          and UNMODIFIED converter. Record the exact failing output. If any
          passes now, the fixture was already changed or the test is not on the
          real path — STOP and report.

          NOTE ON THE RUNNER KEY: until TASK-006 declares producers, the fixture
          harness resolves canned output by command name and these tests key on
          `"go test"` / `"go build"` as the existing corpus does. TASK-007 moves
          that resolution into the harness; do not pre-empt it here.
        files:
          - cmd/backstop/pack_gate_issue067_regression_test.go
        claims:
