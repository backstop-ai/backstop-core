    name: "Phase 4: Release go-toolchain 1.6.0 and Adopt It in the Lock"
    tasks:
      - id: TASK-009
        type: setup
        title: "Port the producers and converter widening to the released go-toolchain pack"
        description: |
          THIS TASK RUNS IN AN EXTERNAL REPOSITORY. Packs live outside core by
          design and this half of the fix is pack content, so the file scope names
          that repo's path literally.

          Working directory: /Users/bmanson/src/projects/backstop-go-toolchain-pack
          (verified 2026-08-16: pack name `backstop-ai/go-toolchain`, version
          1.5.0, HEAD 8f117a8, remote https://github.com/backstop-ai/go-toolchain.git).
          Confirm all of it before editing. If the worktree is dirty or the
          name/remote differs, STOP and report rather than improvising.

          1. Copy TASK-006's content VERBATIM: the two new producer scripts, the
             two `producer:` declarations in `pack.yml`, and the widened
             `scripts/test-to-sarif.sh`. This must be a copy, not a
             re-derivation — the fixture and the release are asserted to agree
             (CLM-005/CLM-013) and two independent authorings will drift.
             Preserve the executable bit on both new scripts.
          2. Bump `version:` 1.5.0 -> 1.6.0. New declared behavior on two
             bindings; minor, not patch.
          3. Verify IN THAT REPO with `backstop pack check` and `backstop pack
             test`. READ the output — do not assume. If the pack's own fixtures
             encode the old converter behavior, update them there in the same
             commit.
          3a. MANDATORY PRE-PUSH GREEN-TREE PROOF. Before step 4, execute BOTH
             released producer scripts directly, with the real arg vector core
             hands them (`test ./...` and `build ./...`, subcommand included),
             against a GENUINELY PASSING throwaway Go module, and REQUIRE EXIT 0
             FROM BOTH. Paste the two commands and their exit codes into the
             implementation record.

             This duplicates TASK-005's
             `TestIssue067_ProducerScriptsExitZeroOnAGreenTree` ON PURPOSE, and
             the duplication is not ceremony: TASK-005 proves the IN-REPO FIXTURE
             copy, this proves the COPY ABOUT TO BE PUBLICLY TAGGED. A producer
             body that doubles the subcommand exits non-zero on a clean tree and,
             once `crash_guard` sees it, makes every gate run in every consumer
             permanently and opaquely RED — with a pushed tag behind it. This is
             the last point at which that is cheap to catch. If either script
             exits non-zero here, STOP; do not commit, do not tag, do not push.
          4. Commit and tag following that repo's convention (see its git log:
             subject `backstop-ai/go-toolchain 1.6.0: <summary>`, then tag
             `v1.6.0`). Its CI asserts tag/version agreement on tag push, so a
             mismatch fails loudly.
          5. Push the commit AND the tag. This publishes to a public repo — an
             action with reach beyond this working tree. Confirm with the founder
             or team-lead before pushing unless that authorization has already
             been given for this issue; do not treat this plan as the
             authorization. Nothing downstream resolves without the tag: version
             resolution is git-tag-based, so a bump with no matching `v1.6.0` tag
             will not resolve via `pack update` in TASK-010.
        files:
