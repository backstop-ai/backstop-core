        type: verification
        title: "Full unscoped verification: backstop gate --all plus artifact validation"
        description: |
          The comprehensive pass. Both commands, both read:

            backstop gate --all
            backstop artifact validate --plan PLAN-ISSUE-067
            backstop artifact validate --issue ISSUE-067

          `--all` is required because this plan changed the dispatch path every
          findings engine flows through; a diff-scoped read cannot speak for it.
          Artifact validation is required because this plan modifies artifact
          files (this plan, and the issue if its status moves).

          Also run the full suite with the race detector once the tree is quiet:
          `go test ./... -race -count=1`, and report the package count.

          This task also GATES TASK-013's documentation change, which is why it
          depends on it: confirm `docs/CODEBASE-MAP.md` is included in the
          `backstop gate --all` artifact/lint sweep and that the map's new
          producer sentences match what actually landed in `runFindingsEngine`,
          not what this plan proposed.

          THE ACCEPTANCE STATEMENT, in the issue's own terms: a genuine test
          regression must be distinguishable from an environmental tool crash on
          the gate surface. State plainly which of these you observed and which
          you are carrying from an earlier task rather than re-running. If other
          agents are active in this shared tree, prefer honest partial evidence
          over a raced full sweep and say which is which.

          Any surprising finding — a dormant test that woke up, a pre-existing red
          this made legible — gets filed as its own issue, not absorbed here and
          not waived.
        files:
