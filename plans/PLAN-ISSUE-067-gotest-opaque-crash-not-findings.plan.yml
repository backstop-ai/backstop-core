  ── THE FIX: HONOR THE `producer` SEAM THAT ALREADY EXISTS ─────────────────

  Core must NOT learn that "Go writes diagnostics to stderr" — that is baked
  language knowledge and CLAUDE.md's first principle forbids it. Core must also
  not start merging stderr into every engine's payload, which would re-open
  CLM-028 and corrupt golangci's native SARIF stdout.

  The seam already exists and is already pack DATA. `EngineBinding.Producer`
  (`pkg/pack/engine/binding.go:197`) is an OPTIONAL pack-relative script that
  runs UN-SANDBOXED via the runner IN PLACE of the plain engine command. The
  coverage path honors it (`pack_gate.go:471`, `runCoverageEngine`). THE
  FINDINGS PATH SILENTLY IGNORES IT: `runFindingsEngine` never reads
  `binding.Producer` at all, so a pack that declares one gets the plain command
  with no error and no warning — a declared-capability-silently-dropped defect
  in its own right, and the enabling half of this one.

  So:
    CORE  — `runFindingsEngine` honors `binding.Producer`, symmetrically with
            `runCoverageEngine`. One function, one file.
    PACK  — go-toolchain declares `producer:` scripts on `go-test` and
            `go-build` that run the tool with ITS OWN stderr folded into ITS OWN
            stdout, and `test-to-sarif.sh` learns to normalize the compiler /
            vet diagnostics that now arrive.

  Core still reads clean stdout from the process it spawns; CLM-028 is intact.
  The PACK owns the merge, because the PACK is what knows this tool splits its
  output. All the Go knowledge stays in Go's pack.

  ── ONE DELIBERATE ASYMMETRY WITH THE COVERAGE PRODUCER, AND WHY ────────────

  The coverage producer is invoked with NO arguments (`pack_gate.go:482`) — it
  shapes its own whole invocation. THE FINDINGS PRODUCER MUST NOT WORK THAT WAY.
  The findings path owns scope contracts the coverage path has never had:

    * the diff-scoped explicit file list, and ISSUE-010 CLM-003's ANTI-FALLBACK
      rule (an empty target list means scan NOTHING, never the whole repo);
    * `excludeTestdataPaths` (ISSUE-040);
    * `fileModeTestTarget` — `gate --file` narrows a `package_scoped` test engine
      to the changed file's package (SPEC-034 REQ-010/CLM-035);
    * `ProjectTarget` vs self-targeting (SPEC-048 CLM-001).

  If a producer were invoked bare, every one of those would silently evaporate
  the moment a pack declared one. So on the findings path the producer REPLACES
  THE TOOL, NOT THE ARG SHAPING: core computes `cmdArgs` exactly as it does
  today and passes them to the producer script instead of to `cmdName`. The pack
  script forwards `"$@"` to the tool. Every scope contract above survives
  untouched, and the design is auditable as a one-line swap of the invoked name.

  ══ THE EXACT ARG SHAPE THE PRODUCER RECEIVES — MEASURED, AND LOAD-BEARING ═══

  READ THIS BEFORE WRITING EITHER PRODUCER SCRIPT. Getting it wrong makes the
  gate PERMANENTLY AND OPAQUELY RED ON A CLEAN TREE, and the plan's own fixture
  tests CANNOT catch it (`fixtureRunner.RunStdout` returns canned bytes keyed on
  the command name and ignores the real args entirely, so every TASK-005 and
  TASK-008 assertion stays green while production is broken).

  `runFindingsEngine` builds its invocation as:

      cmdName, cmdArgs := splitCommand(binding.Command)   // pack_gate.go
      cmdArgs = append(cmdArgs, inputs...)
      ... then the ScopeKind arg-shaping appends targets ...

  `splitCommand` is a plain `strings.Fields` tokenizer: ONLY argv[0] becomes
  `cmdName`. So for the `go-test` binding, whose `command:` is `go test`:

      cmdName = "go"
      cmdArgs = ["test", "./..."]          <- THE SUBCOMMAND IS IN THE ARGS

  The swap replaces `cmdName` — "go" — with the producer path. The producer
  therefore receives `["test", "./..."]`, NOT `["./..."]`. Its body must be:

      go "$@" 2>&1                          # CORRECT

  and must NOT be:

      go test "$@" 2>&1                     # WRONG — DOUBLES THE SUBCOMMAND

  MEASURED 2026-08-16 against go 1.25.3 on a genuinely GREEN throwaway module,
  running each form with the real arg vector `test ./...`:

      go test test ./... 2>&1
        # test
        package test is not in std (/usr/local/Cellar/go/1.25.3/libexec/src/test)
        FAIL	test [setup failed]
        ok  	b1probe/sub/pkg	0.384s
        FAIL
        exit=1                              <- NON-ZERO ON A GREEN TREE

      go test ./... 2>&1                    (via `go "$@" 2>&1`)
        ok  	b1probe/sub/pkg
        exit=0                              <- CORRECT

  With `crash_guard: true` on both bindings, the WRONG form makes every gate run
  on a clean tree emit exactly the `engine "go test" crashed: non-zero exit with
  no parseable findings` error this plan exists to eliminate — now unconditional
  and undiagnosable, and discovered only AFTER TASK-009 pushes a public tag.

  BECAUSE THE SUBCOMMAND ARRIVES IN `"$@"`, THE TWO PRODUCER SCRIPT BODIES ARE
  BYTE-IDENTICAL. That is correct, not a smell: they are two files so the pack
  can declare a distinct `producer:` per binding and so TASK-007's harness alias
  can key canned output back to the right command. Their header comments differ;
  their bodies do not.

  THE FALSIFIER FOR THIS ENTIRE CLASS is TASK-005's
  `TestIssue067_ProducerScriptsExitZeroOnAGreenTree`, which executes the real
  scripts with the real arg vector against a real passing module and requires
  exit 0. It is mandatory. No fixture-runner test can substitute for it.

