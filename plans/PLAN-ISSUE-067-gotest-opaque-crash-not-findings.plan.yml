      - id: TASK-006
        type: implementation
        title: "Declare go-test/go-build producers and widen the test converter, in the fixture pack"
        description: |
          All edits land in the IN-REPO FIXTURE pack under
          `cmd/backstop/testdata/go-toolchain/.backstop/packs/backstop/go-toolchain/`.
          TASK-009 ports the identical content to the external repo; write the
          content here as the authoritative version so the port is a copy, not a
          re-derivation.

          READ THE "EXACT ARG SHAPE THE PRODUCER RECEIVES" SECTION OF THIS PLAN'S
          NOTES BEFORE WRITING EITHER SCRIPT. The subcommand arrives INSIDE
          `"$@"` (core swaps only `cmdName`, which is `go`; `cmdArgs` is
          `["test", "./..."]`). Writing `go test "$@"` doubles the subcommand and
          makes the gate permanently, opaquely RED on a clean tree — measured,
          and invisible to every fixture-runner test in this plan.

          1. NEW `scripts/test-produce.sh` — POSIX sh, `#!/bin/sh`, executable.
             Its whole job is to run the tool with ITS OWN stderr folded into ITS
             OWN stdout, forwarding VERBATIM the full arg vector core shaped —
             subcommand included. The body is exactly:

               go "$@" 2>&1

             NOT `go test "$@" 2>&1`. Verified 2026-08-16 against go 1.25.3 with
             the real arg vector `test ./...`: the correct form exits 0 on a
             green tree; the `go test "$@"` form exits 1 with `package test is
             not in std` on that same green tree.

             The exit status of that command is the script's exit status — the
             tool's verdict must survive verbatim (sharp edge 7). Do NOT add
             `|| true`, do NOT add `exit 0`, do NOT copy `coverage-produce.sh`'s
             tolerant tail: that is right for a profile producer and catastrophic
             here. Write a header comment stating WHY this producer exists — that
             `go test` splits located diagnostics onto stderr while core captures
             only stdout by design (SPEC-031 CLM-028), so the merge is the PACK's
             job because the pack is what knows this tool's stream behavior — and
             a second line stating that the subcommand is supplied by the caller
             in `"$@"`, so the script must not repeat it.
          2. NEW `scripts/build-produce.sh` — body BYTE-IDENTICAL to the above
             (`go "$@" 2>&1`), because the `build` subcommand likewise arrives in
             `"$@"` from `splitCommand("go build")`. That the two bodies are
             identical is CORRECT and expected: they are separate files so the
             pack can declare a distinct `producer:` per binding and so TASK-007's
             harness alias can map each back to its command key. Only the header
             comment differs — note there that `go build` writes NOTHING to
             stdout, so without this producer `build-to-sarif.sh` receives an
             empty payload on every run.

             Do NOT "simplify" these into one shared script. The per-binding
             declaration is what TASK-007's alias and its drift pin key on.
          3. `pack.yml` — add `producer: scripts/test-produce.sh` to the `go-test`
             binding and `producer: scripts/build-produce.sh` to `go-build`. Place
             the key where the coverage engine places its own `producer:`, and
             extend each binding's comment block to cite ISSUE-067. Change NOTHING
             else on either binding: `command`, `input_mode`, `scope_kind`,
             `project_target`, `convert`, `crash_guard`, `gate_type`,
             `package_scoped` and `exempt_from_scope_filter` all stay exactly as
             declared. Do NOT add a producer to `golangci` (it emits native SARIF
             on stdout and merging stderr into it would corrupt the document) or
             to `go-coverage` (it already has one).
          4. `scripts/test-to-sarif.sh` — widen it, preserving the existing
             `--- FAIL:` machinery UNTOUCHED:
               (a) Maintain a STICKY `#`-header MODE FLAG — not a one-line
                   lookback. OUTSIDE a `--- FAIL:` block, a line matching the
                   compiler-diagnostic shape emits a finding ONLY while that flag
                   is IN EFFECT. This is CLM-008's discriminator and it is what
                   keeps a test's own stderr from manufacturing findings.

                   THE FLAG'S LIFECYCLE IS LOAD-BEARING (sharp edge 8a). Go emits
                   MANY diagnostics under ONE header — measured: three
                   `sub/pkg/b_test.go:N:2: undefined: ...` lines under a single
                   `# b1probe/sub/pkg [b1probe/sub/pkg.test]`. So:
                     - SET the flag on a `#`-prefixed line.
                     - KEEP it set across every CONSECUTIVE diagnostic line, so
                       ALL N diagnostics under one header become N findings.
                       Clearing after the first would convert only the first and
                       silently drop the rest — an under-report, which is the
                       same defect class this plan exists to close.
                     - CLEAR it on a `--- FAIL:` line, and on any line matching
                       neither the header shape nor the diagnostic shape (the
                       `FAIL\t<pkg> [build failed]` summary, a blank line, `ok`
                       lines, the trailing bare `FAIL`).
                   Strip the optional column exactly as `build-to-sarif.sh` does;
                   the two scripts should read as siblings on this shape.
               (b) Track `FAIL\t<import-path> [build failed]` lines. NOTE THE
                   EXACT BYTES, measured with `od -c` against real `go test`
                   output: ONE TAB after `FAIL`, then the import path, then a
                   SPACE — not a tab — before `[build failed]`. An awk pattern
                   written with a tab there matches nothing, CLM-009's floor
                   never fires, and a partially-captured failure falls straight
                   back onto the opaque crash this plan exists to close. This is
                   the same shape spelled in sharp edge 8a and in TASK-001's
                   measured captures; do not re-derive it from memory.
                   If the whole
                   run produced NO results at all but at least one such line was
                   seen, emit one finding per named package with the package in
                   the message and no location, so a non-zero run whose output
                   still names a failure can never reach the crash path (CLM-009).
               (c) Leave the `--- FAIL:` path's file/line extraction ALONE. The
                   bare-basename behavior there belongs to ISSUE-135; changing it
                   here would collide with that lane and would break CLM-010.
             Keep it POSIX awk (no gawk-only constructs) — it must run under the
             macOS system awk inside the sandbox, as the header already warns.
          5. Do NOT edit `scripts/build-to-sarif.sh` (sharp edge 9).

          Verify the committed file modes are executable for both new scripts.
        files:
          - cmd/backstop/testdata/go-toolchain/.backstop/packs/backstop/go-toolchain/pack.yml
          - cmd/backstop/testdata/go-toolchain/.backstop/packs/backstop/go-toolchain/scripts/test-produce.sh
          - cmd/backstop/testdata/go-toolchain/.backstop/packs/backstop/go-toolchain/scripts/build-produce.sh
          - cmd/backstop/testdata/go-toolchain/.backstop/packs/backstop/go-toolchain/scripts/test-to-sarif.sh
        claims:
          - CLM-005
          - CLM-006
          - CLM-007
          - CLM-008
          - CLM-009
          - CLM-010
          - CLM-011
          - CLM-013
        depends_on:
          - TASK-005
          - TASK-003

      - id: TASK-007
        type: refactor
        title: "Re-ground the fixture harness for the producer indirection, and pin it against drift"
        description: |
          Declaring producers changes the NAME the dispatch invokes, and a large
          existing corpus keys its canned output on the command name (sharp edge
          1). Left alone, roughly eight test files silently observe zero
          violations — assertions that pass by going quiet, which is the vacuous
          green this whole plan is about.

          FIX IT IN THE HARNESS, IN ONE PLACE. In
          `cmd/backstop/pack_gate_gotoolchain_test.go`, extend
          `fixtureRunner.RunStdout`'s key resolution: when the invoked name is a
          path whose basename is a known producer script, resolve the canned
          output under the command key that producer stands for. Keep the existing
          `name + " " + args[0]` and bare-`name` lookups intact so every current
          registration keeps working unchanged.

          Then PIN THE ALIAS (sharp edge 2). Add
          `TestFixtureRunner_ProducerAliasCoversEveryDeclaredProducer`: parse the
          fixture manifest, collect the basename of every declared `producer:`
          across its FINDINGS-typed engine bindings, and assert that set is
          exactly the alias map's key set. Adding a findings producer to the pack
          without teaching the double must then fail loudly instead of going
          quiet.

          SCOPE THE ENUMERATION TO FINDINGS BINDINGS — this is decided, not left
          to the implementer. The fixture pack already declares a THIRD producer
          today: `go-coverage` carries `producer: scripts/coverage-produce.sh`.
          After this task's two additions there are three declared producers, and
          an unscoped enumeration would demand `coverage-produce.sh` appear in the
          FINDINGS alias map, where it is meaningless. The coverage producer is a
          structurally different dispatch: `runCoverageEngine` (pack_gate.go)
          invokes it BARE — `runner.RunStdout(ctx, producerPath)` with no args —
          and its output goes to the coverage-RECORDS channel, never through the
          `name + " " + args[0]` command-key resolution this alias exists to
          double. Requiring it in the findings map would pin a relationship that
          does not exist.

          EXCLUDE IT WITH THE PRODUCTION PREDICATE, NOT A NAME. `dispatchPackCoverage`
          routes solely on `binding.GateType != engine.GateTypeCoverage` — that
          exact condition is what makes a binding "findings-typed." Filter the
          enumeration on the same condition so the pin tracks the real routing
          rule rather than a second, drifting definition of it.

          THE ENUMERATION STAYS DERIVED FROM THE REAL MANIFEST. Read the
          producers out of the parsed fixture `pack.yml`; never hardcode a list
          of expected basenames. A newly-added FINDINGS producer must still break
          this test — that is the whole point of the pin, and hardcoding would
          make it inert exactly when it is needed.

          Also re-ground `cmd/backstop/filemode_scoping_test.go`: its helper
          selects the test invocation with `c.name == "go" && c.args[0] == "test"`,
          which the swap breaks. Re-ground it on the PRODUCER path while keeping
          what it proves — that file-mode scoping yields the changed file's
          package selector — asserting on `c.args`, which this design deliberately
          leaves unchanged. Do not weaken or delete the arg assertions; they are
          the direct evidence for CLM-001's arg-preservation half.

          THE ALIAS MUST COVER `cmd/backstop/pack_gate_scope_test.go` WITHOUT
          EDITING IT. That file keys `byCmd["go build"]` against
          `go-build-errors.txt` and is inside PLAN-ISSUE-091's declared file
          scope; editing it here would collide with that lane. It is the specific
          case to check first once the alias is in — confirm it still observes
          its original non-zero violation count.

          Then run the full `cmd/backstop` package. If a file OUTSIDE this task's
          declared scope still asserts on the invoked command name, STOP and
          report it rather than silently widening scope — it means the harness
          alias did not cover a case this plan predicted it would. Sharp edge 1
          enumerates the ten files this was verified against; walk that list.
        files:
          - cmd/backstop/pack_gate_gotoolchain_test.go
          - cmd/backstop/filemode_scoping_test.go
        claims:
          - CLM-004
          - CLM-010
        test_names:
          - TestFixtureRunner_ProducerAliasCoversEveryDeclaredProducer
        depends_on:
          - TASK-006

      - id: TASK-008
        type: verification
        title: "Gate the pack-data change and prove the corpus did not go quiet"
        description: |
          Run `backstop gate` (diff-scoped) and read the result.

          Then read the evidence that matters most for this phase:
            * `go test ./cmd/backstop/ -run "TestIssue067" -count=1 -v` — all
              TWELVE mandated names green, zero skipped subtests. Confirm by
              NAME that `TestIssue067_ProducerScriptsExitZeroOnAGreenTree` RAN
              and PASSED rather than being skipped: it is the only test in this
              plan that executes the real producer scripts, and a skip there
              re-opens the entire clean-tree-permanently-red failure class.
              Likewise confirm
              `TestIssue067_MultipleDiagnosticsUnderOneHeaderAllBecomeFindings`
              ran, and state the violation count it observed.
            * `go test ./cmd/backstop/ -run "TestFixtureRunner_Producer" -count=1`
              — the alias drift pin from TASK-007.
            * `go test ./cmd/backstop/ -count=1` — the whole package, because
              sharp edge 1's failure mode is OTHER tests going quiet, and only a
              full-package run surfaces it. Name explicitly which of sharp edge
              1's ten enumerated files you confirmed still assert non-zero
              violations, including `pack_gate_scope_test.go`, which the harness
              alias must cover WITHOUT being edited.
            * Confirm explicitly that the two pre-existing fixtures still yield
              their original violation counts (CLM-010) — state the counts.

          If any previously-passing test now passes for a DIFFERENT reason (zero
          violations instead of the violations it asserted), that is a regression
          even though it is green. Say so.
        files:
          - cmd/backstop/testdata/go-toolchain/.backstop/packs/backstop/go-toolchain/pack.yml
          - cmd/backstop/testdata/go-toolchain/.backstop/packs/backstop/go-toolchain/scripts/test-to-sarif.sh
          - cmd/backstop/pack_gate_issue067_regression_test.go
        claims:
          - CLM-006
          - CLM-007
          - CLM-008
          - CLM-009
          - CLM-010
        depends_on:
          - TASK-006
          - TASK-007

