      - id: TASK-006
        type: implementation
        title: "Implement RouteTestVerdictFindings and MandatedTestFailures"
        description: |
          Create `pkg/gate/test_verdict_join.go` — pure functions, no I/O, no
          dispatch, no step. Follow the shape of `RouteSubstantivenessFindings` /
          `HollowFindingsToViolations` (`pkg/gate/substantiveness_join.go`), which is
          the established precedent for "route a flat pack stream, then join it to a
          spec promise."

          `RouteTestVerdictFindings(violations []Violation) []Violation` — returns
          the members whose `GateType` equals `engine.GateTypeTest.String()`,
          preserving input order. Import `pkg/pack/engine` for the spelling; do not
          write a `"test"` literal (sharp edge 8). Docstring must say routing is by
          DECLARATION alone, per ISSUE-064.

          `MandatedTestFailures(mandated []MandatedTest, verdicts []Violation, scope
          *GateScope) []Violation` — for each mandated test, if any routed verdict
          finding NAMES it, emit one `mandated_test_failed` Violation:
            • Severity `error` (a broken promise blocks — sharp edge 4);
            • File = `NormalizePath(scope root, mt.FilePath)`, falling back to
              `mt.SpecFile` when FilePath is empty — NEVER the finding's File;
            • Message names the mandated test, its spec id, its claim id, and carries
              the finding's own message so the failure detail survives;
            • at most ONE violation per mandated test even if several findings name
              it (a subtest and its parent both fail) — dedupe on the mandated test,
              and fold the additional detail into the one message rather than
              emitting duplicates.
          Apply the SAME scope guard the surrounding step already applies (keep when
          `scope.Contains(mt.FilePath)` OR `scope.Contains(mt.SpecFile)`; all-mode
          and nil scope keep everything) so behavior is consistent with name-presence
          verification — and comment WHY (sharp edge 5: out-of-diff failures are
          ISSUE-129's surface, deliberately not absorbed here).

          Name matching is a helper — `verdictNamesTest(message, funcName string)
          bool` — implementing BOUNDARY-ANCHORED containment: the name must not be
          immediately preceded or followed by an identifier character
          (letter/digit/underscore). Pure string work; no regex compilation per call,
          no language noun. Docstring must record why the join is by NAME and not by
          path, citing the captured bare-basename evidence.

          Do not import or reference anything from `cmd/backstop`. Do not touch any
          existing file in this task.
        files:
          - pkg/gate/test_verdict_join.go
        claims:
