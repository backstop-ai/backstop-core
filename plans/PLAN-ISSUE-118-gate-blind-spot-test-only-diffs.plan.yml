    CLM-002  the test-verdict subset is routed out of a flat violation stream by
             the DECLARED gate type ALONE — never a pack name, rule name, message
             shape, or command sniff.
    CLM-003  a due mandated test NAMED by a test-verdict finding produces a
             BLOCKING `mandated_test_failed` violation attributed to that mandated
