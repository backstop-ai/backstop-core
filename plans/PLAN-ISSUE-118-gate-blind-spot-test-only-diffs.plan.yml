      - id: TASK-009
        type: test
        title: "RED: THE MANDATED REGRESSION FIXTURE — an all-test-file diff with a failing mandated test REDs the gate"
        description: |
          Create `cmd/backstop/gate_test_only_diff_verdict_e2e_test.go`. THIS IS THE
          ISSUE'S ACCEPTANCE SURFACE (its Direction item 3) and the one test that
          MUST be seen green-before / red-after, in that order, with both runs
          recorded verbatim in the hand-off. Runs in parallel with TASK-008.

          FALSIFY FIRST. Before TASK-010 exists, this test must demonstrate the
          CURRENT silent pass: the assembled gate reports PASS with a genuinely
          failing mandated test in the tree and an entirely-test-file diff. Write the
          test asserting the FIXED behavior (non-zero verdict), run it, and record
