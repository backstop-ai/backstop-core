          preserving input order. Import `pkg/pack/engine` for the spelling; do not
          write a `"test"` literal (sharp edge 8). Docstring must say routing is by
          DECLARATION alone, per ISSUE-064.

          `MandatedTestFailures(mandated []MandatedTest, verdicts []Violation, scope
          *GateScope) []Violation` — for each mandated test, if any routed verdict
          finding NAMES it, emit one `mandated_test_failed` Violation:
            • Severity `critical` — NOT `error`. Read sharp edge 3 in full before
              writing this line. `critical` blocks identically (`blocksVerdict` is
              `!EqualFold(Severity,"warning")`) AND is the ONLY route by which a
              core-emitted rule can reach the production waiver policy's
              non-waivable set, which is severity-keyed to `{"critical"}` and
              otherwise harvested exclusively from pack manifests. Docstring must
              state that reason, so a future "normalize to error" cleanup can see
              what it would be turning off;
            • File = `NormalizePath(scope root, mt.FilePath)`, falling back to
              `mt.SpecFile` when FilePath is empty — NEVER the finding's File;
            • Message names the mandated test, its spec id, its claim id, and carries
              the finding's own message so the failure detail survives;
            • at most ONE violation per mandated test even if several findings name
              it (a subtest and its parent both fail) — dedupe on the mandated test,
              and fold the additional detail into the one message rather than
              emitting duplicates.
          Apply the SAME scope guard the surrounding step already applies (keep when
          `scope.Contains(mt.FilePath)` OR `scope.Contains(mt.SpecFile)`; all-mode
          keeps everything) so behavior is consistent with name-presence
          verification — and comment WHY (sharp edge 5: out-of-diff failures are
          ISSUE-129's surface, deliberately not absorbed here).

          A NIL `scope` MEANS "DO NOT SCOPE-FILTER AT ALL" AND IS A LOAD-BEARING
          PART OF THE CONTRACT, NOT A DEFENSIVE NIL CHECK. Document it in the
          function's docstring in exactly those terms: `MandatedTestFailures(mandated,
