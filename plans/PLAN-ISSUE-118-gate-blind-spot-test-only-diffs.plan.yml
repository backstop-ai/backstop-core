          Name matching is a helper — `verdictNamesTest(message, funcName string)
          bool` — implementing BOUNDARY-ANCHORED containment: the name must not be
          immediately preceded or followed by an identifier character
          (letter/digit/underscore). Pure string work; no regex compilation per call,
