  ── CLAIM LEDGER (ISSUE-118 carries no CLM ids; this lane defines them) ────
    CLM-001  every bridged pack finding carries its producing binding's DECLARED
             gate type on gate.Violation.GateType, stamped at the same bridge that
             stamps ProjectWide — presentation/routing only, json:"-", and absent
