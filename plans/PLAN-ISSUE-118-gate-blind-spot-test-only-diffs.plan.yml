          for "it does not compile yet"; get to a run where the gate really returns
          PASS and say so.

          TestE2E_GateRedsOnFailingMandatedTestInTestOnlyDiff (CLM-005, CLM-004,
          CLM-003). Build it from the pieces that already exist in this package —
          do NOT stand up a parallel harness:
            • a temp workspace with a `specs/` dir holding ONE `implemented` spec
              that mandates `TestFixtureMandatedFailure`, and a test file under a
              SUBDIRECTORY declaring that function, so the mandated test both exists
              and is name-verifiable;
            • a `GateScope` in diff mode whose Files are ENTIRELY test files — the
              mandated test's own file and nothing else. Assert this property
              explicitly in the test body (every scope file is classified as a test
              file), so a future edit cannot quietly turn it into a mixed diff and
              void the whole fixture;
            • the dispatch seam `dispatchPackEnginesFn` overridden to return the
              violations parsed from the TASK-001 captured SARIF, stamped
              `GateType: "test"` — i.e. REAL converter output with its REAL
              bare-basename path, arriving exactly as production would deliver it.
              Restore the seam with `t.Cleanup`.
          Then run the ASSEMBLED steps (`buildGateSteps` → `gate.New(...).Run(ctx)`),
          not the individual step function — the point is that the collector is
          populated by pack_engines and read by test_verification in the shipped
          order. Assert:
            1. the overall result does NOT pass, and the process-level verdict maps
               to a non-zero exit;
            2. the `test_verification` step carries a `mandated_test_failed`
               violation naming `TestFixtureMandatedFailure`;
            3. that violation's File is the mandated test's own path, NOT
               `a_test.go`;
            4. the `pack_engines` step's OWN violations are unchanged by this lane —
               the captured finding is still filtered out of pack_engines' reported
               set exactly as it is today. This is the ISSUE-129 fence, asserted:
               if a later change to the scope filter makes pack_engines red too,
               this assertion tells the next reader which lane did it.

          Header-comment the file with WHY the acceptance test lives in cmd/backstop
          (the collector wiring, the step ordering, and `buildGateSteps` are all
          cmd/backstop's; pkg/gate cannot reach them) and WHY the dispatch is seamed
          rather than real (`.backstop/packs/` is gitignored, a stub engine command
          would not pass the trust allowlist, and TASK-002 already exercises the real
          bridge on the same captured bytes). Name that split explicitly — a reader
          must be able to see that between TASK-002 and this test every hop from
          converter output to gate verdict is covered by something real.
        files:
