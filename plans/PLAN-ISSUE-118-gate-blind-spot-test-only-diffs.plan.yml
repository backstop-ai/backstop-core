      - id: TASK-010
        type: implementation
        title: "Collect the unfiltered verdict stream and consume it in test_verification"
        description: |
          Two files.

          `pkg/gate/step_testverify.go` — give the scoped step constructor a way to
          receive the routed verdict stream and the capability state. Prefer a NEW
          constructor (`StepTestVerificationVerdictFunc` or a variadic option on the
          existing scoped one) that takes a `func() ([]Violation, bool)` supplier
          returning the routed test-verdict violations and whether any test-verdict
          engine was DECLARED — a supplier, not a slice, because the collector is
          populated by an earlier step at RUN time, not at build time. Keep the
          existing constructors working unchanged (sharp edge: `baseline.go` and
          `waiver.go` also build gate steps).
          Inside the step, AFTER the existing name-presence loop:
            • if there are due mandated tests and no test-verdict engine was
              declared, return the `test_verification_verdict_capability_absent`
              advisory (warning, ConfigErr false) — modeled on
              `testDiscoveryCapabilityAbsent`, distinct rule id and message;
            • otherwise append `MandatedTestFailures(mandated, verdicts, scope)` to
              the violations and recompute status. Order the violations so
              name-presence findings come first, then verdict findings.
          Do not change the existing capability guard, the due-filter, or the
          scoping. Update the step's doc comment to say the dimension now answers
          BOTH "does the mandated test exist" and "did it pass" — the old comment
          claims only the former and is exactly the false assurance ISSUE-118
          reported.

          `cmd/backstop/gate.go` — declare the collector in `buildGateSteps` BEFORE
          the test_verification step is built (~:773): a small struct (or a pointer
          to a slice plus a bool) captured by both closures. In `packValidatorStep`
          (~:914) capture the dispatch output into the collector BEFORE
          `activeScope.FilterViolations` at :928 — routed via
          `gate.RouteTestVerdictFindings` — and record whether any dispatched
          binding declared `gate_type: test`. Leave the pack_engines step's own
          reported violations EXACTLY as they are (still filtered): that half is
          ISSUE-129's. Wire the supplier into the test_verification step.
          Comment the ordering guarantee at the collector's declaration: `packed`
          (~:939-943) puts pack_engines before steps[1:], which begins at
          test_verification, so the collector is always populated before it is read
          — and if that assembly order is ever changed, THIS is what breaks.
          Handle the `len(packs) == 0` early return (~:859): no packs means no
          verdict engine declared, which must reach the advisory rather than an
          unqualified pass.

          DO NOT add a second `resolveDispatchPackEngines()` call. DO NOT change
          `filterViolations`, `excludeDedicatedStepRules`, or any pack manifest.
        files:
