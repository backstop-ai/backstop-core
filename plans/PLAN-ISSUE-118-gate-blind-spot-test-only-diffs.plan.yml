  ── THE FIX, IN ONE PARAGRAPH ──────────────────────────────────────────────
  Every bridged pack finding gains its producing binding's DECLARED gate type
  (`gate.Violation.GateType`, stamped at `pack_gate.go:730` beside the existing
  `ProjectWide` stamp). `packValidatorStep` hands the UNFILTERED dispatch stream to
  a collector shared with the `test_verification` step, which runs later in the same
  assembled order (`gate.go:939-943`). `test_verification` routes that stream to the
  test-verdict subset BY DECLARED GATE TYPE, and joins it against the due mandated
  tests BY NAME — boundary-anchored containment of the mandated test's own function
  name in the finding's message. A hit is a BLOCKING, NON-WAIVABLE violation
  (severity `critical`; see sharp edge 3 for why that exact word and not `error`)
  attributed to the MANDATED TEST'S resolved file, never to the finding's
  unresolvable path. The join also runs ABOVE the test-discovery capability guard —
  and UNSCOPED there, deliberately — so a project missing test globs cannot swallow
  it (CLM-010, sharp edge 15). No
  test-verdict engine declared anywhere + due mandated tests present ⇒ a distinct
  NON-blocking capability-absent advisory instead of a silent pass.

  Why the name join and not a path join: the name is the only identifier that
  survives the bare-basename problem, it is the identifier the spec actually
  mandated, and it is what the shipped converter already puts in the message
  ("TestAddIsWrong: got 3 want 4"). Boundary-anchoring is what stops `TestFooBar`
  from satisfying a mandate for `TestFoo`.

  Why NO second dispatch: `go test ./...` is expensive and `pack_engines` already
  ran it. The collector is populated by the step that already paid for it, and the
  assembled order (`packed`: lock, artifact, pack_engines, then steps[1:] beginning
  at test_verification) guarantees pack_engines runs first. Do NOT add a second
  `resolveDispatchPackEngines()` call for the test dimension.

  Why the UNFILTERED stream: the whole defect is that the filter drops these. The
  collector must capture `violations` BEFORE `activeScope.FilterViolations` at
  `gate.go:928`, and the pack_engines step's own reported violations must stay
  exactly as they are today (filtered) — that half is ISSUE-129's to change.

