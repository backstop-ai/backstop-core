  - id: phase-4
    name: "Phase 4: Wire the verdict into test_verification, and refuse the silent pass"
    tasks:
      - id: TASK-008
        type: test
        title: "RED: the step blocks on a failed mandate and warns when no verdict engine exists"
        description: |
          Create `pkg/gate/step_testverify_verdict_test.go`. It must FAIL before
          TASK-010. Runs in parallel with TASK-009 (disjoint files, no dependency
          between them).

          TestTestVerification_BlocksWhenMandatedTestFailedVerdict (CLM-003, CLM-005):
            a due mandated test that EXISTS in the code (so today's name-presence
            check passes cleanly) plus a routed verdict finding naming it ⇒ the step
            is `fail` with a `mandated_test_failed` violation. Assert BOTH: that the
            name-presence side still reports nothing (the two checks are independent)
            and that the step's Status is `fail`. This is the "exists, is
            substantive, and is RED" case that today reads as a pass.

          TestTestVerification_VerdictCapabilityAbsentWhenNoTestEngineDeclared
            (CLM-006): due mandated tests present, all found in code, and the verdict
            stream reports that NO test-verdict engine was declared ⇒ Status
            `warning`, `ConfigErr` false, ONE violation with Rule
            `test_verification_verdict_capability_absent` and Severity `warning`
            whose message NAMES what is missing (no installed pack declares a
            `gate_type: test` engine) and states that the advisory is non-blocking.
            Follow `testDiscoveryCapabilityAbsent` (`step_testverify.go:429`) as the
            shape to copy — same convention, distinct rule id and distinct message.
            ASSERT IT IS NON-BLOCKING: a warning-only result must not make the gate
