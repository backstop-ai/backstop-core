notes: |
  Implements ISSUE-118. Sixteen tasks, six phases, FIVE production files. The
  deliverable is that a mandated test which genuinely FAILS turns `backstop gate`
  RED — including for the diff shape the issue names (changed files entirely test
  files) and including when the failing test's reported path cannot be resolved.

  ── THE ISSUE'S ROOT-CAUSE ANALYSIS IS STALE. READ THIS BEFORE ANYTHING ELSE ─
  ISSUE-118 (and DIR-032 item 12, which restates it) says the defect is STARVATION:
  "no gate dimension actually executes the Go test suite" for an all-`_test.go`
  diff, because `coverage_threshold` early-skips at `step_coverage.go:98`. That
  description predates SPEC-042 and is wrong in its mechanism, though right in its
  conclusion. Measured against HEAD on 2026-08-15 while planning:

  1. `pkg/gate/step_coverage.go` HOLDS NO `go test` INVOCATION AT ALL. Its own
     docstring says so in as many words ("It holds NO `go test` invocation, NO
     Go-coverage output parsing, and NO go.mod / Go-package knowledge — the baked
     Go coverage analyzer is eradicated"). It CONSUMES `[]check.CoverageRecord`
     produced by a pack coverage engine. Its early return skips SCORING, not a test
     run — there is no test run there to skip.
  2. THE SUITE IS EXECUTED ON EVERY DIFF SHAPE. `dispatchPackEngines`
     (`cmd/backstop/pack_gate.go:267`) and `dispatchPackCoverage` (`:339`) loop over
     every installed pack and every declared engine with NO diff-shape predicate
     anywhere. The go-toolchain pack's `go-test` engine is `scope_kind:
     project-wide`, `project_target: "./..."`, so `runFindingsEngine` appends its
     OWN target and never the scope's files (`pack_gate.go:600-621`). An
     all-test-file diff runs `go test ./...` exactly like any other diff.
  3. SO THE FAILURE IS COMPUTED, CORRECTLY, AND THEN THROWN AWAY. The go-test
     engine's SARIF becomes a real `gate.Violation` — and is then dropped by
     `filterViolations` (`pkg/gate/scope.go:302-326`), which keeps a violation only
     when `ProjectWide` is true OR `scope.Contains(violation.File)` is true.

  ── THE PART NOBODY HAD MEASURED: THE PATH NEVER MATCHES ───────────────────
  `scope.Contains` is EXACT set membership over `NormalizePath`-canonicalized
  repo-relative paths (`pkg/gate/scope.go:171-177`). And `go test` reports failure
  positions as a BARE BASENAME. Captured hermetically 2026-08-15 in a throwaway
  module (package at `sub/pkg`, deliberately-wrong assertion), real `go test ./...`
  stdout, verbatim:

      --- FAIL: TestAddIsWrong (0.00s)
          a_test.go:7: got 3 want 4
      FAIL
      FAIL	example.com/tv/sub/pkg	0.360s

  piped through the SHIPPED converter (`.backstop/packs/backstop-ai/go-toolchain/
  scripts/test-to-sarif.sh`, v1.3.0), real output, verbatim:

      {"version":"2.1.0","runs":[{"results":[{"ruleId":"go-test","level":"error",
       "message":{"text":"TestAddIsWrong: got 3 want 4"},"locations":[{"physical
       Location":{"artifactLocation":{"uri":"a_test.go"},"region":{"startLine":7}}}]}]}]}

  The uri is `a_test.go`. The scope's fileSet holds `sub/pkg/a_test.go`. They never
  match. THIS is why ISSUE-118's own reproduction was green even though the failing
  mandated test's file WAS in the diff: not starvation, not out-of-scope — an
  unresolvable reported path, silently filtered.

  ── RELATIONSHIP TO ISSUE-129 (asked for explicitly; here is the reasoning) ─
  ISSUE-129's fix — declaring `exempt_from_scope_filter: true` on the go-test
  binding — sets `ProjectWide: true` at `pack_gate.go:730`, which makes
  `filterViolations` short-circuit BEFORE the File comparison. That WOULD keep the
  finding above, so it WOULD turn ISSUE-118's own reproduction red. The team lead's
  lean was correct on that point, and DIR-032's "item 12 is starvation, item 13 is
  suppression" framing is NOT correct: both are suppression, of the same finding, at
  the same filter. Do not plan this lane as if the suite never runs.

  They are nonetheless NOT duplicates, and this lane is NOT redundant, for four
  reasons that survive ISSUE-129 landing first:
    (a) ISSUE-129's fix is PACK DATA in an external repo (`backstop-ai/go-toolchain`,
        versioned, gitignored install). It buys core NOTHING — not for a project
        pinned to an older go-toolchain, not for any other language's pack, and not
        as a property core can assert about itself. ISSUE-118 is filed against
        `backstop gate`, the core kill chain.
    (b) It does not connect a verdict to a PROMISE. After it, a failing test is one
        more scope-exempt finding among many; the gate still cannot say "the tests
        this spec MANDATED passed," which is the exact claim ISSUE-118 says is
        false. Mandated-ness is core's vocabulary, not a pack's.
    (c) It leaves the general defect standing: ANY test-verdict engine whose
        reported path is unresolvable is still silently dropped unless its pack
        happens to declare the exemption. The fix here is path-INDEPENDENT.
    (d) There is no signal at all when NO pack declares a test-verdict engine —
        core reports an unqualified `test_verification` pass having verified
        nothing but spelling.
  ISSUE-129 remains the right owner of the DECLARATION and of out-of-scope
  NON-mandated test failures. THIS LANE MUST NOT TOUCH `exempt_from_scope_filter`,
  the go-toolchain pack, or `filterViolations`. See the SCOPE FENCE.

  ── THE THREE OPTIONS THE ISSUE ASKED A PLAN TO WEIGH, DECIDED ─────────────
  Option 1 — "make coverage_threshold run the affected package's suite to a verdict
    when the diff is all test files": REJECTED, and it must not be revisited. It is
    unimplementable without putting a `go test` invocation back inside core, which
    is the exact baked-language-knowledge eradication SPEC-042 completed and which
    CLAUDE.md's first principle forbids ("a baked language/tool branch is a defect
    to eradicate, never to extend"). The premise that coverage_threshold runs the
    suite is false at HEAD. What survives of option 1 is honesty about the skip:
    Phase 5 makes the "no in-scope files to measure" pass NAME what it did not do.
  Option 2 — "a NEW gate dimension that runs every mandated test and reads its exit
    code, or a widened test_verification": WIDEN, do not add. A new dimension needs
    a new step, ordering, policy, baseline dimension key, and CI surface — a large
    change to run overnight for a defect an existing dimension is already named
    after. `test_verification` already extracts mandated tests, already resolves
    their paths, already scopes them, and already owns a capability-absent advisory.
    It gains one join. And core still runs NOTHING itself: the verdict is produced
    by a pack engine, exactly as the thin-executor principle requires.
  Option 3 — "a regression fixture is mandatory": YES, and it is TASK-009, the
    lane's acceptance surface. It is the one task that must be shown RED first.

  ── THE FIX, IN ONE PARAGRAPH ──────────────────────────────────────────────
  Every bridged pack finding gains its producing binding's DECLARED gate type
  (`gate.Violation.GateType`, stamped at `pack_gate.go:730` beside the existing
  `ProjectWide` stamp). `packValidatorStep` hands the UNFILTERED dispatch stream to
  a collector shared with the `test_verification` step, which runs later in the same
  assembled order (`gate.go:939-943`). `test_verification` routes that stream to the
  test-verdict subset BY DECLARED GATE TYPE, and joins it against the due mandated
  tests BY NAME — boundary-anchored containment of the mandated test's own function
  name in the finding's message. A hit is a BLOCKING violation attributed to the
  MANDATED TEST'S resolved file, never to the finding's unresolvable path. No
  test-verdict engine declared anywhere + due mandated tests present ⇒ a distinct
  NON-blocking capability-absent advisory instead of a silent pass.

  Why the name join and not a path join: the name is the only identifier that
  survives the bare-basename problem, it is the identifier the spec actually
  mandated, and it is what the shipped converter already puts in the message
  ("TestAddIsWrong: got 3 want 4"). Boundary-anchoring is what stops `TestFooBar`
  from satisfying a mandate for `TestFoo`.

  Why NO second dispatch: `go test ./...` is expensive and `pack_engines` already
  ran it. The collector is populated by the step that already paid for it, and the
  assembled order (`packed`: lock, artifact, pack_engines, then steps[1:] beginning
  at test_verification) guarantees pack_engines runs first. Do NOT add a second
  `resolveDispatchPackEngines()` call for the test dimension.

  Why the UNFILTERED stream: the whole defect is that the filter drops these. The
  collector must capture `violations` BEFORE `activeScope.FilterViolations` at
  `gate.go:928`, and the pack_engines step's own reported violations must stay
  exactly as they are today (filtered) — that half is ISSUE-129's to change.

  ── SHARP EDGES ────────────────────────────────────────────────────────────
  1. THE FINAL `gate --all` MAY LEGITIMATELY GO RED, and that is the fix working,
     not a defect in your implementation. If a mandated test in this repo is
     genuinely failing, this dimension will now say so. Do NOT waive it, do NOT
     baseline it, do NOT weaken the join. Surface it, file it, and report it in the
     hand-off. (`feedback_waivers_are_last_resort`, `feedback_no_check_filtering`.)
  2. DO NOT GRANDFATHER. The new blocking violation uses a NEW rule id
     (`mandated_test_failed`), so no existing baseline entry suppresses it. That is
     deliberate: a failing mandated test is the one thing a ratchet must never
     inherit. Do not add it to any baseline in this lane.
  3. Waivability is DECLARED, not baked (`pkg/waiver/policy.go` reads
     `non_waivable` from backstop.yml) — so this lane does NOT make the new rule
     non-waivable in code. Note it in the hand-off as a config recommendation for
     the founder; do not edit backstop.yml here.
  4. The advisory and the block are DIFFERENT SEVERITIES on purpose. A missing
     test-verdict engine is UN-ADOPTED CAPABILITY ⇒ warning, exit 0. A mandated
     test that ran and failed is a BROKEN PROMISE ⇒ error, blocking. That is the
     `feedback_loud_not_blocking` line; do not collapse them.
  5. Mandated-test scoping is UNCHANGED. The existing guard keeps a mandated test
     when `scope.Contains(mt.FilePath)` OR `scope.Contains(mt.SpecFile)`
     (`step_testverify.go:376-384`). For an all-test-file diff the mandated test's
     own file IS in the diff, so it is kept — which is precisely why this closes
     ISSUE-118's shape WITHOUT touching the scope filter. A failing mandated test
     whose file is NOT in the diff stays out of scope here BY DESIGN; that is
     ISSUE-129's surface and it must not be quietly absorbed into this lane.
  6. Only `implemented`-spec mandated tests are due (`filterDueMandatedTests`,
     ISSUE-054). A draft spec's not-yet-written test must not produce a verdict
     violation. Reuse the existing filter; do not re-implement it.
  7. The new `GateType` field must be `json:"-"` and stay OUT of baseline identity,
     exactly like `ProjectWide`, `Line`, `WaiverHint`, `Trace` and `Properties`
     before it (`EnrichViolationIdentity` folds only
     `Rule|File|RegionHash(Message|Severity|SourcePack)`). Adding it to identity
     would invalidate every existing baseline entry.
  8. Spell the gate type ONCE. Stamp `binding.GateType.String()` and compare against
     `engine.GateTypeTest.String()` — never a `"test"` literal in a second place.
     `pkg/gate` may import `pkg/pack/engine`; there is no cycle (`pkg/pack` does not
     import `pkg/gate`, and `pkg/gate` already imports `pkg/pack`).
  9. `.backstop/packs/` IS GITIGNORED. No test may depend on the go-toolchain pack
     being installed. That is why TASK-001 captures the converter's REAL output into
     committed testdata and every later test reads THAT.
  10. `backstop code check` DOES NOT EXIST (removed by PLAN-ISSUE-018 and pinned
     absent by a shipped test). The verification tasks below use `./bin/backstop
     gate` / `gate --all` and `go test`, because those are the commands that exist.
  11. REBUILD `bin/backstop` BEFORE ANY `./bin/backstop gate`. A stale binary gates
     the old code and its green proves nothing.
  12. Other agents are working in this tree concurrently. Do not `git stash`, do not
     revert files you did not write, and report TRUE exit codes (`echo $?`).

  ── SCOPE FENCE ────────────────────────────────────────────────────────────
  IN : pkg/gate/result.go (one field + docstring), cmd/backstop/pack_gate.go (one
       stamp), pkg/gate/test_verdict_join.go (new), pkg/gate/step_testverify.go
       (the join + one advisory), cmd/backstop/gate.go (collector wiring),
       pkg/gate/step_coverage.go (one attributed skip reason), five test files, one
       testdata fixture pair, docs/CODEBASE-MAP.md.
  OUT: ISSUE-129 in its entirety — `exempt_from_scope_filter`, the go-toolchain
       pack manifest, `filterViolations`, and the pack_engines step's own filtered
       output. A cross-file (out-of-diff) failing test is NOT this lane's
