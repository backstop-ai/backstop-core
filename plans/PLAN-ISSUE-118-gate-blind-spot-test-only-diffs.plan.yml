    CLM-004  the join is PATH-INDEPENDENT: a real go-test finding whose SARIF uri
             is a bare basename — the captured shape that made ISSUE-118's own
             reproduction green — still blocks.
    CLM-005  the join fires for a diff whose changed files are ENTIRELY test files,
             end to end through the assembled gate, and the run's exit is non-zero.
    CLM-006  when due mandated tests exist but NO installed pack declares a
             test-verdict engine, test_verification surfaces a DISTINCT
             non-blocking capability-absent advisory naming what is missing,
             instead of an unqualified pass.
    CLM-007  coverage_threshold's "no in-scope files to measure" early return stays
             a non-blocking pass but NAMES what it did not do — it is a
             measurement skip and never a test verdict.
    CLM-008  non-regression: name-presence verification, the existing capability
             guard, mandated-test scoping and baseline identity are unchanged, and
             a test-verdict stream carrying no failure for any mandated test yields
             ZERO new violations (the check cannot be satisfied by a constant).
    CLM-009  name matching is boundary-anchored: a finding naming TestFooBar
             neither satisfies nor implicates a mandate for TestFoo.

