          DISCOVERY-CAPABILITY-ABSENT PATH. At HEAD, `step_testverify.go:366-368`
          returns `testDiscoveryCapabilityAbsent(...)` BEFORE anything else, so a
          project with a working verdict engine but no declared test globs would
          still swallow a failing mandated test. Compute the join ABOVE that guard
          (it takes neither the classifier nor the matcher, so it is callable
          there), and when the guard fires, return the advisory result with those
          verdict violations APPENDED and the status recomputed — the advisory stays
          `warning` severity and still says what it says, but a blocking verdict
          alongside it makes the step `fail`. `ConfigErr` stays false.

          CALL IT AS `MandatedTestFailures(mandated, verdicts, nil)` ON THIS PATH —
          NIL SCOPE, NO SCOPE FILTERING AT ALL. Do NOT pass the step's `scope`
          here, and do NOT hand-roll a FilePath/SpecFile check as a "consistency"
          gesture. Above the guard `ResolveMandatedTestPaths` has not run, so
          `mt.FilePath` is structurally `""`, and `GateScope.Contains("")` is false
          in diff mode — a scoped call would keep a mandated test only when its SPEC
          FILE happened to land in the diff, which in an all-test-file diff (the
          canonical ISSUE-118 shape) it does not. The guard would silently drop the
          exact verdict this lane exists to surface, and CLM-010 would not hold.
          Comment this at the call site in those terms — that the unscoped call is
          deliberate, that path resolution IS the absent capability here so there is
          nothing honest to scope against, that the accepted cost is NOISE (a
          possibly out-of-diff verdict) chosen over SILENCE, and that attribution
          falls back to the mandated test's SPEC FILE for the same reason: a degraded
          location on a verdict that is still reported and still blocks.
