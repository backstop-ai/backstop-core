  Design decisions (the issue's open points):
    - Key name: `enforcement.coverage_floor`, an integer 0-100. It follows the
      Enforcement struct style (snake_case yaml/json tag, omitempty).
    - Presence-aware: the field is `CoverageFloor *int`. nil (unset) means the
      default 90. An explicit 0 is kept and means "no floor": the collapsed
      code-scope threshold stays 0, so the step's existing `threshold <= 0`
      skip applies.
    - Default 90 lives in pkg/config as an exported DefaultCoverageFloor plus
      an accessor (for example `func (e Enforcement) EffectiveCoverageFloor()
      int`). pkg/gate keeps its own 90 for callers that pass no floor; a test
      pins the two values equal.
    - Threading without call-site churn: StepCoverageThresholdScopedFunc gets
      a variadic option (for example `WithCoverageFloor(n int)`), and
      coverageThresholdsForScope takes the resolved floor. The ~25 existing
      test call sites are unchanged.
    - Validation at config load: values below 0 or above 100, floats (85.5),
      strings ("90"), booleans and an explicit `coverage_floor: null` are
      rejected, and the error names `enforcement.coverage_floor`. null is
      rejected (not read as unset) because a key that is present but empty
      is almost always a mistake, and silently applying 90 would hide it;
      omit the key to get the default. The Go check in the loader is the
      real enforcement. A yaml type error from the typed decode does not name
      the key, so the check runs on the raw node (or wraps the decode error
      for this key). The schema is not what rejects unknown keys here: the
      KnownFields(true) strict decode does that before the schema pass.
      The schema (artifacts/backstop-yml/v1/schema.json) still gains the
      property (integer, minimum 0, maximum 100) so it stays an accurate
      description and its additionalProperties: false does not reject the
      key.
    - Wiring: buildGateStepsWithSandbox loads the floor itself from
      projectRoot/backstop.yml through config.LoadConfigFromPath, the same
      way gateConfig (gate.go:559) loads it, so every caller (gate, baseline,
      waiver, init seams) gets the same floor with no signature change at
      those callers. Load-error behaviour: if backstop.yml does not exist,
      the floor is the default 90 (nothing to configure). If it exists but
      fails to load (including an invalid coverage_floor), the coverage step
      returns a fail result with ConfigErr set and a violation whose message
      names the load error. It never falls back silently to 90. Do not
      reuse gateConfig for this, because it swallows load errors; leave
      gateConfig itself unchanged.
    - Spec thresholds win as today: a qualifying spec-declared
      coverage_threshold (file-in-diff, or the code-scope max when it is
      above 0) is used even when it is below the floor. The floor is only the
      fallback when that max is 0.
    - `gate --all` unchanged (deferred, note only): with scope nil or
      GateScopeModeAll the function returns specs as-is and never reaches the
      floor, so a repo with no qualifying spec is checked at 90 on a diff
      gate and not at all on --all. Making --all use the floor would start
      failing files it skips today, so it should be its own issue. The docs
      task records this asymmetry as known.

  Acceptance claims (from ISSUE-217 REQ-001..004, plus the deferral):
    CLM-001 (REQ-001): enforcement.coverage_floor is optional. When unset
      the effective floor is 90 and the gate behaves exactly as today.
    CLM-002 (REQ-002): when set, the configured value (including an explicit
      0, meaning no floor) replaces the fallback for changed files with no
      qualifying spec threshold, and the real gate step assembly
      (buildGateStepsWithSandbox, shared by gate, baseline and waiver) reads
      it from the project's backstop.yml.
    CLM-003 (REQ-003): a qualifying spec-declared coverage_threshold still
      takes precedence over the configured floor, including a spec value
      below the floor.
    CLM-004 (REQ-004): values outside 0-100, non-integers and an explicit
      null are rejected at config load with an error naming
      enforcement.coverage_floor. In the gate, a backstop.yml that fails to
      load makes the coverage step a ConfigErr naming the error, never a
      silent default.
    CLM-005: `gate --all` behaviour is unchanged, and the key and the known
      diff/--all asymmetry are documented.

