          ── cmd/backstop/doctor_checks.go ───────────────────────────────────
          Add `checkEngineToolsPresent(ctx doctorContext) doctorResult`, placed
          immediately after `checkToolchainRuns`/`describeEntrypointProbe` and
          before `checkArtifactLayout`, mirroring the registry order.

          Structure, in order — each step's reasoning is in the Q4 table:

            1. SKIP FIRST, before anything is constructed, on
               `ctx.ConfigPathErr != nil || ctx.ConfigErr != nil ||
