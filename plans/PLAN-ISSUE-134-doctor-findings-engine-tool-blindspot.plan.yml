          `doctorCheckToolchainRuns` and BEFORE `doctorCheckArtifactLayout`:

              {ID: doctorCheckEngineTools, Title: "pack-declared findings-engine tools resolve on PATH", Run: checkEngineToolsPresent},

          Position is a decision, not a coin flip: the two tool-presence checks
          sit together so a reader comparing them sees them adjacent, and the
          setup checks stay first so a reader sees why a later check skipped
