  ── THE DEFECT, FALSIFIED LIVE IN THIS REPO ON 2026-08-16 ──────────────────
  Not reasoned about — RUN. A binary was built from HEAD and both commands were
  invoked with a PATH from which `semgrep` was removed and nothing else was
  (semgrep lives at /Library/Frameworks/Python.framework/Versions/3.12/bin;
  ast-grep, go, golangci-lint and git all stayed reachable):

      env PATH=/usr/local/bin:/usr/bin:/bin:/usr/sbin:/sbin:/Users/bmanson/go/bin <bin> doctor
      env PATH=/usr/local/bin:/usr/bin:/bin:/usr/sbin:/sbin:/Users/bmanson/go/bin <bin> gate --file cmd/backstop/doctor.go

  DOCTOR: exit 0. Seven checks; six `pass`, one `warn` (build-identity, about
  the dev stamp — unrelated). `toolchain-runs` reported PASS, enumerating both
  go-toolchain entrypoints as passing. Nothing anywhere named semgrep.

  GATE, same PATH, same second: exit 2 at `pack_engines`, with

      required tool "semgrep" not found on PATH: it is argv[0] of the command
      engine "semgrep" of pack backstop-ai/backstop-self declares, pinned in the
      trusted-tool allowlist as tool "semgrep" version "1.96.0" — backstop does
      not install pack-declared tools (the pin is a trust entry, not an
      installer); add "semgrep" to PATH and retry

  THAT PAIR IS THE WHOLE ISSUE. The two commands, run back to back against the
  same tree and the same PATH, disagree completely about whether this project's
  setup is healthy — and the DIAGNOSTIC is the one that says yes. The
  implementer must reproduce this pair before writing code (see FALSIFICATION
  BAR) and must be able to show doctor's answer flipped afterwards.

  ── WHY THE TWO COMMANDS DISAGREE: TWO DIFFERENT WALKS ────────────────────
  Doctor's `checkToolchainRuns` (cmd/backstop/doctor_checks.go) consumes
  `packEntrypointProber` (cmd/backstop/pack_entrypoint_prober.go), whose `Probe`
  walks `manifest.Engines` and keeps ONLY `binding.GateType == GateTypeTest ||
  GateTypeBuild`. Its own doc comment states the rule: "SELECTION IS BY STAGE,
  NEVER BY TOOL." A findings engine has neither gate type, so it is never
  selected, never probed, never mentioned.

  The gate reaches findings-engine tools through an entirely different route.
  `provisionEngines` (cmd/backstop/pack_gate_provision.go), called from
  gate.go's pack_engines step, walks each manifest's RULES, resolves each rule's
  engine through `resolveEngineRegistry(manifest).Lookup(rule.Engine)`, runs the
  trust gate, extracts argv[0] via `engineToolName`, dedupes, sorts, and
  presence-probes each name through `resolveBinaryResolver()`. That function is
  where the exit-2 above came from.

  So the gap is not a missing feature in the prober. It is that doctor has no
  consumer of the OTHER walk at all.

  ── THE FIX SHAPE, AND THE FOUR OPEN QUESTIONS THE ISSUE ASKED ────────────
  ISSUE-134 deliberately declined to prescribe a mechanism and posed four
  questions. This plan answers all four, and the answers are what the tasks
  below implement. A reviewer should hold the tasks against these answers.

  Q1 — new dedicated check, or widen `checkToolchainRuns`?
  A NEW, DEDICATED CHECK: `engine-tools-present`. Widening the existing check
  would put two structurally different selections (a stage walk over
  manifest.Engines, a rule walk through the engine registry) behind one result
  and one status, so a consumer could never tell which half failed, and the
  check's own title — "pack-declared test/build entrypoints execute" — would
  become a lie about half of what it does. Doctor's one-condition-one-owner
  posture (the reason `skipped` exists at all) says these are two conditions.

  Q2 — does the underlying walk change, or is a new path added so `init` is
  provably unaffected?
  NEITHER, STRICTLY: NO NEW WALK IS WRITTEN. The walk doctor needs ALREADY
  EXISTS inside `provisionEngines`. This plan EXTRACTS its collection half into
  `collectRequiredEngineTools` and gives it two consumers — provisionEngines
  (fail-fast, exit 2) and doctor (enumerate all, report each). That is the same
  move `packEntrypointProber` itself is: one execution/selection authority, two
  callers with different dispositions. `pack_entrypoint_prober.go` IS NOT EDITED
  BY THIS PLAN AT ALL, which is what makes "init is unaffected" a structural
  fact rather than a claim, and TASK-006 asserts it as a source-level absence
  rather than trusting the diff.

  Q3 — execute the tool, or check presence?
  PRESENCE ONLY, via the same `resolveBinaryResolver()` seam the gate uses.
  Three reasons, in order of weight. (1) PARITY IS THE POINT: doctor's whole
  value here is answering "will the gate refuse?", and the gate refuses on
  exactly this predicate — resolvability — so any richer probe would answer a
  question the gate does not ask. (2) The issue's own observation holds: a
  findings tool run against nothing has no success signal distinguishable from
  a tool that scanned and found nothing. (3) Executing pack-declared scanners
  over the project at doctor time would make a diagnostic as slow as a gate run
  and would duplicate the gate's dispatch. Doctor NEVER invokes a findings-
  engine command; TASK-006 pins that with a recording runner.

  Q4 — fail/warn/skip, and does it depend on assume-present vs provision-pinned?
  FAIL, AND NO — THE SPLIT IS GONE. This is the single most important thing a
  reader coming from the issue text must update. ISSUE-134 was written while
  ISSUE-112 was still `status: open` with a `draft` plan, and it reasoned from
  the pre-112 world in which pinned tools (semgrep, ast-grep) were EXEMPT from
  presence probing. ISSUE-112 SHIPPED (PLAN-ISSUE-112 is `status: completed`,
  fix in 4dbf64b) and collapsed that split: pack_gate_provision.go's own file
  header now records it, and BOTH kinds fail loud with a `*check.ConfigError`
  (exit 2). ONLY THE MESSAGE DIFFERS, because the two have different remedies —
  `absentToolMessage` has one branch for a nil Provision (assume-present
  Layer-0) and one for a pinned Provision. Doctor mirrors this exactly: a
  missing engine tool is `fail`, whichever kind it is, and the message doctor
  reports is the message `absentToolMessage` already renders. Any plan or
  implementation that reintroduces a warn-for-pinned tier is re-opening
  ISSUE-112 from a new surface.

  Doctor's full disposition table for the new check:
    - ungathered pack set (ConfigPathErr / ConfigErr / PacksErr) → `skipped`,
      naming `packs-installed` as the condition's owner. THREE conditions, not
      just PacksErr — `gatherDoctorContext` only calls `loadInstalledPacks` when
      the config both discovered AND loaded, so a broken backstop.yml leaves
      Packs nil with PacksErr ALSO nil. checkToolchainRuns has the identical
      three-condition predicate and a shipped comment explaining exactly this;
      copy the predicate, not a narrower one.
    - the trust gate refuses a tool → `fail` (doctor's own disposition, the same
      one it takes on `entrypointRefused`; the gate turns the same value into a
      config error, and that asymmetry is deliberate and shipped).
    - a gathered pack set binding NO engine tool → `warn`, never a silent pass.
      Mirrors checkToolchainRuns' outcome (d).
    - one or more required tools absent → `fail`, message enumerating every
      probed tool with its own line, remediation carrying `absentToolMessage`.
    - all required tools resolve → `pass`.

  ── THE WALK IS RULE-DRIVEN, AND THAT IS A CORRECTNESS PROPERTY ───────────
  Do not "improve" the extraction into a walk over `manifest.Engines`. It looks
  more thorough and it is wrong. `provisionEngines`' own doc comment states the
  reason: an engine no rule binds is NEVER DISPATCHED, so its tool's absence
  cannot produce a vacuous green, and probing it would refuse a run that was
  never going to happen — and a live fixture depends on that. A doctor check
  that walked manifest.Engines would fail on a project the gate passes, which is
  a worse defect than the one being fixed: a diagnostic that cries wolf gets
  ignored, and then it is worth nothing on the day it is right.

  The parity claim (CLM-002) is the load-bearing one in this plan. State it
  precisely: over any pack set, doctor's new check reports `fail` if and only if
  `provisionEngines` returns an error. TASK-006 asserts it as a real table, not
  as prose.

