phases:
  - id: phase-1
    name: "Phase 1: One collection authority for required engine tools"
    tasks:
      - id: TASK-001
        type: test
        title: "Red: pin collectRequiredEngineTools' walk, and pin that provisionEngines' behavior is unchanged by the extraction"
        description: |
          NEW FILE cmd/backstop/pack_gate_provision_collect_test.go, package
          `main` (cmd/backstop tests are all in-package; several already drive
          the `binaryResolver` seam — see pack_gate_provision_test.go,
          dispatch_provision_test.go, gate_provision_dedicated_step_test.go).

          It will not compile until TASK-002 adds the function. That is the
          expected first red and NOT the red that counts.

          Build manifests in-test with `pack.Manifest` literals (engines map
          plus `Content.Ruleset.Rules`), or by parsing a small YAML fixture —
          the implementer's call, but whichever is chosen, the rules must be
          REAL `Content.Ruleset.Rules` entries whose `Engine` field names an
          `engines:` key, because the walk's whole point is that it goes through
          rules.

          TestGate_CollectRequiredEngineToolsWalksRulesNotEngines (CLM-003) —
          the guard against the tempting wrong implementation. One manifest
          declaring TWO engine bindings:
            - `bound-engine`, command `backstop-absent-engine-134-bound scan`,
              WITH a rule in Content.Ruleset.Rules naming it.
            - `unbound-engine`, command `backstop-absent-engine-134-unbound
              scan`, with NO rule naming it.
          Assert the returned set contains the bound tool and DOES NOT contain
          the unbound one. A walk over manifest.Engines returns both and reds
          here — which is exactly what this test exists for. Give both bindings
          a NIL Provision so the trust gate returns early (the Layer-0
          exemption) and the walk's selection is the only thing under test; the
          doctor fixture packs use the same shape for the same reason, following
          the shipped `gate-type-matrix` fixture's precedent.

          TestGate_CollectRequiredEngineToolsDedupesAndSorts (CLM-003) — two
          rules in one pack binding two different engines whose commands share
          argv[0] (the real `go build` / `go test` shape) collapse to ONE entry;
          and across a multi-pack set the returned order is sorted by probed
          name. Sorted order is not cosmetic — it is what makes a fail-loud
          deterministic across runs, and doctor's report line order depends on
          it too.

          TestGate_CollectRequiredEngineToolsSkipsCommandlessEngine (CLM-003) —
          a binding with an EMPTY command (the sandbox engine ships its own
          executable) contributes NO required tool. `engineToolName("")` returns
          "" and the walk must skip rather than probe an empty name.

          TestGate_CollectRequiredEngineToolsSurfacesTrustRefusal (CLM-003,
          CLM-006's refusal branch) — a rule bound to an engine whose
          `provision:` names a tool the allowlist does not admit (or admits at a
          different version) makes collection return an ERROR, and it does so
          BEFORE any presence probe. Assert the error, and assert via an
          injected `binaryResolver` that recorded ZERO resolution attempts. The
          shipped ordering comment on provisionEngines is explicit that a tool
          backstop refuses to trust must be reported as untrusted, not as
          missing; the extraction must not reorder that.

          TestGate_ProvisionEnginesBehaviorSurvivesExtraction (CLM-003) — the
          non-regression half, and the one a reviewer will look for. Over a pack
          set with one absent tool, `provisionEngines` still returns a
          `*check.ConfigError` whose message is EXACTLY what `absentToolMessage`
          renders for that tool (assert the full string, not a substring), and
          still returns on the FIRST absent name in sorted order rather than
          collecting them all. Drive it through an injected `binaryResolver`
          reporting a fixed set present/absent, so the assertion does not depend
          on the host PATH.
        files:
          - cmd/backstop/pack_gate_provision_collect_test.go
        claims:
          - CLM-003
          - CLM-006
        depends_on: []
        test_names:
          - TestGate_CollectRequiredEngineToolsWalksRulesNotEngines
          - TestGate_CollectRequiredEngineToolsDedupesAndSorts
          - TestGate_CollectRequiredEngineToolsSkipsCommandlessEngine
          - TestGate_CollectRequiredEngineToolsSurfacesTrustRefusal
          - TestGate_ProvisionEnginesBehaviorSurvivesExtraction

      - id: TASK-002
        type: implementation
        title: "Extract collectRequiredEngineTools from provisionEngines, leaving provisionEngines' observable behavior byte-identical"
        description: |
          EDIT cmd/backstop/pack_gate_provision.go ONLY. No other production
          file changes in this phase.

          Add:

              func collectRequiredEngineTools(packs []*pack.Manifest) ([]requiredTool, error)

          Its body is the EXISTING collection half of `provisionEngines`, moved
          verbatim: the per-manifest `seenEngine` rule walk, the
          `resolveEngineRegistry(manifest).Lookup(rule.Engine)` resolution and
          its wrapped error, the `checkEngineToolAllowed` trust gate (which
          returns its error to the caller, unchanged, and still fires AHEAD of
          any presence probe), the `engineToolName` argv[0] extraction, the
          empty-command skip, the `required` dedupe map, and the sort. It
          returns the tools in sorted probed-name order.

          Then reduce `provisionEngines` to its remaining half:

              tools, err := collectRequiredEngineTools(packs)
              if err != nil { return err }
              resolve := resolveBinaryResolver()
              for _, tool := range tools {
                  if _, err := resolve(tool.name); err != nil {
                      return &check.ConfigError{Message: absentToolMessage(tool)}
                  }
              }
              return nil

          ★ THIS IS A PURE RESTRUCTURE. `provisionEngines`' observable behavior
          must not move a millimetre: same trust-gate-before-probe ordering,
          same first-absent-in-sorted-order fail, same `*check.ConfigError`,
          same message from the same unchanged `absentToolMessage`. TASK-001's
          TestGate_ProvisionEnginesBehaviorSurvivesExtraction is the assertion.
          Do not take the opportunity to collect all absences, to change the
          error type, or to reword a message — every one of those is someone
          else's decision and at least one of them is ISSUE-112's.

          DOC COMMENTS: the file header and `provisionEngines`' comment carry a
          lot of hard-won reasoning (the ISSUE-112 split collapse, the argv[0]-
          versus-Provision.Tool distinction, the rule-driven-not-engine-driven
          rationale, the trust-gate ordering). MOVE each paragraph to whichever
          function now owns the behavior it explains rather than duplicating or
          dropping it. In particular the rule-driven paragraph — "an engine no
          rule binds is never dispatched… a live fixture depends on that" —
          belongs on `collectRequiredEngineTools`, because that is now the
          function a reader would be tempted to widen. Add one sentence naming
          the second consumer (doctor's engine-tools check) and the reason the
          split exists: the gate fails fast on the first absence while doctor
          must enumerate every one, so the COLLECTION is shared and the
          DISPOSITION is each caller's — the same shape, and the same reasoning,
