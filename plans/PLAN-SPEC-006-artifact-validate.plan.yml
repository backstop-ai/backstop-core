    name: "Phase 6: Edge Cases — Zero Artifacts, Parse Failures, and Warning Messages"
    tasks:
      - id: TASK-015
        type: test
        title: "Write tests for zero-artifact scenario and discovery parse failures"
        description: |
          Write failing tests in cmd/backstop/artifact_validate_edge_test.go
          for REQ-012 (zero artifacts) and REQ-007 parse failure edge case.

          Zero artifact tests (REQ-012):
            - TestArtifactValidate_ZeroArtifacts_Exit0_EmptyViolations (CLM-049):
              zero discovered artifacts returns exit 0 with empty violations
            - TestArtifactValidate_ZeroArtifacts_WarningMessage (CLM-050):
              zero discovered artifacts emits warning to stderr

          Parse failure edge case (already covered in CLM-039 test name):
            - TestArtifactValidate_Discover_ParseFailure_ConfigError (CLM-039):
              verify that a file matching an artifact pattern but failing to
              parse produces a config error (exit 2), not a validation error

          These tests use temp directories: the zero-artifact tests create a
          project dir with backstop.yml but no artifact files. The parse failure
          test creates a *.spec.md file with invalid content.
        files:
          - cmd/backstop/artifact_validate_edge_test.go
        claims:
          - CLM-039
          - CLM-049
          - CLM-050
        depends_on:
          - TASK-014

      - id: TASK-016
        type: implementation
        title: "Implement zero-artifact handling and discovery parse failure detection"
        description: |
          Update cmd/backstop/artifact_validate.go to handle edge cases:

          Zero-artifact handling in RunE:
            - After ValidateArtifacts returns: if result has zero violations
              and zero artifacts were discovered, emit warning to stderr:
              "warning: no artifacts found to validate"
            - Return exit 0 with empty violations list
            - In JSON mode, output valid JSON with pass: true, violations: []

          Discovery parse failure in ValidateArtifacts:
            - When artifact.ParseFile fails for a discovered file, return
              an error (config error) rather than adding it to violations
            - Error message: "failed to parse artifact <path>: <parse error>"
            - This triggers exit code 2 in the caller

          Also handle the case where type filter by ID finds zero matches:
            - After filtering by ID, if no artifact matches, return error
              "no <type> artifact found with ID <id>"
            - This is a config error (exit 2), not a validation pass
        files:
          - cmd/backstop/artifact_validate.go
        claims:
          - CLM-039
          - CLM-049
          - CLM-050
        depends_on:
          - TASK-015

      - id: TASK-017
        type: verification
        title: "Verify edge case tests pass"
        description: |
          Run edge case tests and lint:
            - go test ./cmd/backstop/ -run "TestArtifactValidate_ZeroArtifacts|TestArtifactValidate_Discover_ParseFailure" -race -v
            - go tool golangci-lint run ./cmd/backstop/
        files:
          - cmd/backstop/artifact_validate_edge_test.go
          - cmd/backstop/artifact_validate.go
        claims:
          - CLM-039
          - CLM-049
          - CLM-050
        depends_on:
          - TASK-016

