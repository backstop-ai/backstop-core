          Create cmd/backstop/artifact_route.go with the routing function.

          Type alias for validator function signature:
            type ValidatorFunc func(*artifact.ParsedArtifact, *schema.Schema) validate.ValidationResult

          Package-level routing table:
            var validatorRouter = map[string]ValidatorFunc{
              "spec":     validate.Spec,
              "plan":     validate.Plan,
              "adr":      validate.ADR,
              "bundle":   validate.Bundle,
              "issue":    validate.Issue,
              "standard": validate.Standard,
            }

          Function RouteValidator(art *artifact.ParsedArtifact) (ValidatorFunc, error):
            - Extract schema_version from art.Metadata
            - If missing: return error "missing schema_version field"
            - Split on "/" to get prefix
            - Look up prefix in validatorRouter
            - If not found: return error "unrecognized schema_version prefix: <prefix>"
            - Return the validator function

          This is a pure routing function — no validation logic.
