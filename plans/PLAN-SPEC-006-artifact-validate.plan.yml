        title: "Implement validation pipeline with scoping, routing, and Cobra command"
        description: |
          Create cmd/backstop/artifact_validate.go with the full validation
          pipeline and Cobra command registration.

          Type ValidateConfig struct:
            - ProjectRoot string — from backstop.yml
            - TypeFilters map[string]string — type name → optional artifact ID
            - All bool — --all flag
            - JSONOutput bool — --json flag
            - SchemaFS fs.FS — embedded schema filesystem

          Type ValidateResult struct:
            - Pass bool
            - ViolationsCount int
            - Violations []validate.Violation

          Function NewArtifactValidateCommand() *cobra.Command:
            - Six type-scoping flags: --spec, --plan, --adr, --bundle, --issue,
              --standard (each string, optional ID argument)
            - --all boolean flag
            - Short: "Validate artifacts against schemas"
            - Long: detailed description
            - RunE: orchestrate the validation pipeline

          Function ValidateArtifacts(cfg ValidateConfig) (ValidateResult, error):
            1. Determine type filters from cfg (--all or specific types or default all)
            2. Call DiscoverArtifacts(cfg.ProjectRoot, typeFilters)
            3. If zero discovered: return empty result (caller handles warning)
            4. For each discovered artifact:
               a. Parse via artifact.ParseFile
               b. If ID filter set for this type: match by per-type field
                  (plan_id for plans, number for all others); skip non-matches
               c. Route via RouteValidator to get the validator function
               d. Resolve schema path via schema.ResolveSchemaPath
               e. Load schema from cfg.SchemaFS via schema.LoadArtifactSchema
               f. Call validator function
               g. Collect violations
            5. If any step fails (parse, route, schema load): return config error
            6. Aggregate all violations into ValidateResult
            7. Return result

          Register under the artifact namespace command from SPEC-005.

          ID matching per type (REQ-008 sharp edge):
            - Plans: match art.Metadata["plan_id"]
            - All others: match art.Metadata["number"]
