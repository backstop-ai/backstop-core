          Type DiscoveredArtifact struct:
            - Path string — file path
            - Type string — artifact type name (spec, plan, adr, bundle, issue, standard)

          Function DiscoverArtifacts(root string, typeFilters []string) ([]DiscoveredArtifact, error):
            - Walk the directory tree rooted at root
            - For each file, check against the six filename patterns:
              - *.spec.md → "spec"
              - *.plan.yml → "plan"
              - ADR-*.adr.md → "adr"
              - *.bundle.md → "bundle"
              - *.issue.md → "issue"
              - *.standard.md → "standard"
            - If typeFilters is non-empty, only include matching types
            - Files not matching any pattern are silently ignored
            - Return list of DiscoveredArtifact, or error on walk failure

          The discovery function does NOT parse artifacts — it only matches
          filenames. Parsing happens in the validation pipeline (Phase 4).
