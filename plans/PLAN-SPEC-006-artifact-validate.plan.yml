---
plan_id: PLAN-SPEC-006
spec_id: SPEC-006
spec_version: 1.1.0
created: "2026-04-04"
status: draft
target_repo: backstop-core
target_module: github.com/bmanson/backstop-core
test_command: "go test ./cmd/backstop/... -run TestArtifactValidate -race -coverprofile=cover.out"
coverage_threshold: 80

notes: |
  Implements the backstop artifact validate command as a thin CLI adapter over
  pkg/validate. The command handles artifact discovery, type routing via
  schema_version prefix, result aggregation, and JSON/human output formatting.
  All validation logic stays in pkg/validate — cmd/ only orchestrates.

  Depends on SPEC-005 (CLI foundation) for Cobra skeleton, go:embed SchemaFS,
  config loader, output formatter, and exit code infrastructure.

  The implementation lives in a single primary file (cmd/backstop/artifact_validate.go)
  with tests in cmd/backstop/artifact_validate_test.go. Test fixtures provide
  minimal valid/invalid artifacts for each of the six types.

  Feature areas map to the spec's implementation passes:
    1. Test fixtures (setup)
    2. Artifact discovery (test → impl → verify)
    3. Type routing (test → impl → verify)
    4. Validation pipeline + scoping flags (test → impl → verify)
    5. Output formatting + exit codes + aggregation (test → impl → verify)
    6. Comprehensive verification

  Areas 2 and 3 are parallel-eligible (disjoint files: discovery logic in
  artifact_discover.go vs routing logic in artifact_validate.go). Areas 4 and 5
  are sequential (pipeline depends on both discovery and routing).

  Structure:
    Phase 1: Setup — test fixtures for all six artifact types
    Phase 2: Artifact discovery (test → impl → verify) — parallel track A
    Phase 3: Type routing (test → impl → verify) — parallel track B
    Phase 4: Validation pipeline + scoping flags + backstop.yml prereq (test → impl → verify)
    Phase 5: Output formatting + exit codes + aggregation (test → impl → verify)
    Phase 6: Edge cases — zero artifacts, ID scoping, precedence (test → impl → verify)
    Phase 7: Comprehensive verification

