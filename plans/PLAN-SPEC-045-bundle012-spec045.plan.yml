notes: |
  Implements SPEC-045 (BUNDLE-012 Spec Seed 2): de-Go's the gate CONSUMER's
  test-verification discovery + the Go-package / `./...` relevance matchers. FOUR
  coupled de-Go's: (1) test-FILE discovery via SPEC-043's pack-declared TEST globs
  (new SourceClassifier.IsTestFile/HasTestGlobs); (2) test-NAME extraction from a NEW
  pack-declared DATA field Manifest.TestNamePatterns compiled into a TestNameMatcher
  (the baked funcPattern DELETED); (3) the substantiveness same-unit matcher
  goFilePackageMatchesTarget (Go `package`-clause reader) -> language-neutral
  testFileColocatedWithTarget (directory-leaf comparison); (4) the coverage
  spec-relevance matchers coverageSpecRelevantToFile (drop `.go`/`_testdata.go`/`./...`
  literals; directory matching only). Plus the EITHER-absent capability guard
  (warning, not silent-pass nor mass false-fail) and the live-gate wiring proven
  end-to-end ([[feedback_integration_gap]]).

  ════════════════════════════════════════════════════════════════════════════
  CROSS-PLAN PREREQUISITE — SPEC-043 (Seed 1) must land FIRST
  ════════════════════════════════════════════════════════════════════════════
  This plan CONSUMES SPEC-043's foundation contracts, which do NOT yet exist in
  code: the `pkg/gate` `SourceClassifier` type (constructed via
  NewSourceClassifier(source, test []string) with its test-glob set populated), the
  `cmd/backstop` `mergeSourceClassifier` helper, and `pack.Manifest.Classification`.
  TASK-006 ADDS IsTestFile/HasTestGlobs as same-package methods reading SPEC-043's
  stored test-glob set; TASK-012 REUSES mergeSourceClassifier (does not fork it).
  If SPEC-043 has not landed (the SourceClassifier / test-glob set absent or
  renamed), Phase 2 and Phase 4 are BLOCKED, not workable-around — re-baking a
  `_test.go` walk to unblock would re-violate the thin-executor principle. Sharp Edge:
  the classifier must expose a PURE test-glob match (IsTestFile), NOT IsMeasurableSource
  (source ∧ ¬test) — a test file is by definition not measurable source.

  ════════════════════════════════════════════════════════════════════════════
  DOGFOOD LOCKSTEP — funcPattern deletion + go-toolchain test_name_patterns
  ════════════════════════════════════════════════════════════════════════════
  Deleting funcPattern (TASK-006) means backstop-core stops discovering its OWN Go
  tests UNLESS the installed `backstop/go-toolchain` pack.yml declares
  `test_name_patterns` in the SAME change set. TASK-003 adds that DATA to the dogfood
  copy AND the e2e testdata copies; TASK-006 depends_on TASK-003 to enforce the
  lockstep ordering so `backstop gate` over backstop-core stays GREEN throughout. The
  pack DATA also lands durably in the go-toolchain pack's OWN repo
  ([[packs_always_external]]) — that external-repo edit is outside this tracked tree
  and is carried alongside, not represented as a task file here.

  ════════════════════════════════════════════════════════════════════════════
  CROSS-PLAN FILE OVERLAP — serialize the implement phase with siblings
  ════════════════════════════════════════════════════════════════════════════
  Three files are co-edited by parallel BUNDLE-012 siblings; this plan's edits are
  DISJOINT functions/fields but the implement phase must be serialized so concurrent
  edits don't clobber:
    - pkg/gate/step_coverage.go: SPEC-043 (measurable-path) + SPEC-044 ((path,metric)
      loop) co-edit; THIS plan edits coverageSpecRelevantToFile/packagePathMatches only.
    - cmd/backstop/gate.go: SPEC-046 (language-bridge deletion) co-edits; THIS plan
      edits goFilePackageMatchesTarget/buildTestSubstantivenessStep + adds
      mergeTestNameMatcher/testFileColocatedWithTarget only.
    - pkg/pack/manifest.go: SPEC-043 adds Classification; THIS plan adds
      TestNamePatterns (disjoint field).
    - pkg/gate/step_testverify.go: the extractor is co-edited by SPEC-044.
  Flagged for the cross-consistency pass.

  Dependency order: manifest DATA field + dogfood lockstep (P1) -> de-Go'd discovery +
  matcher + capability guard (P2, parallel with P3) / coverage relevance (P3) ->
  co-location matcher + live-gate wiring (P4) -> full gate (P5). Every code-changing
  phase writes tests FIRST (TDD) and runs `backstop code check`; the final phase runs
  the full `backstop gate` + `backstop artifact validate`.

