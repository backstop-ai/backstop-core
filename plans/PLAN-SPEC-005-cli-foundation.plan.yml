      - id: TASK-010
        type: implementation
        title: "Implement JSON and human output formatters"
        description: |
          Create cmd/backstop/output.go with:

          Interface Formatter:
            - FormatResult(result interface{}) (string, error)

          Type JSONFormatter struct:
            - Implements Formatter
            - Serializes result to indented JSON
            - Injects schema_version field (e.g. "cli/v1") in every response
            - Never includes ANSI codes

          Type HumanFormatter struct:
            - Implements Formatter
            - Formats result as human-readable text
            - Checks NO_COLOR env var: if set (any value), no ANSI codes
            - If NO_COLOR unset, uses ANSI for status/severity coloring

          Both formatters operate on the same underlying data structure — the
          formatter is presentation only with zero enforcement logic.

          Sharp edge: first schema_version value sets the baseline contract.
          Choose "cli/v1" as initial value.
