            - testdata/full-backstop.yml — config with all optional fields
            - testdata/invalid-backstop.yml — config with invalid enforcement tier
            - testdata/unknown-keys-backstop.yml — config with unknown top-level key

          These fixtures support config loader and integration tests.
        files:
