---
plan_id: PLAN-SPEC-005
spec_id: SPEC-005
spec_version: 1.0.0
created: "2026-04-04"
status: draft
target_repo: backstop-core
target_module: github.com/bmanson/backstop-core
test_command: "go test ./cmd/backstop/... ./pkg/config/... -run \"TestCLI|TestIntegration|TestConfig\" -race -coverprofile=cover.out"
coverage_threshold: 80

notes: |
  Builds the foundational CLI infrastructure: Cobra command skeleton with three
  namespaces (artifact, code, pack) plus gate, go:embed schema cohort, backstop.yml
  loader with walk-up discovery, JSON/human output formatting, exit code handling,
  version command, commands --json discovery, and help generation.

  The plan has six feature areas that map to distinct file scopes:
    1. Embed cohort (cmd/backstop/embed.go)
    2. Config loader (pkg/config/config.go) + backstop.yml schema
    3. Output formatter (cmd/backstop/output.go)
    4. Exit code handler (cmd/backstop/exitcode.go)
    5. Command skeleton (cmd/backstop/root.go, main.go) — version, commands, help
    6. Integration tests (cmd/backstop/integration_test.go)

  Feature areas 1-4 are independent and can be developed in parallel (disjoint
  file sets). Area 5 (command skeleton) depends on all four because root.go wires
  them together. Area 6 (integration tests) depends on the assembled binary.

  Structure:
    Phase 1: Setup — Cobra dependency, directory scaffolding, test fixtures
    Phase 2: Embed cohort (test → impl → verify) — parallel track A
    Phase 3: Config loader + backstop.yml schema (test → impl → verify) — parallel track B
    Phase 4: Output formatter (test → impl → verify) — parallel track C
    Phase 5: Exit code handler (test → impl → verify) — parallel track D
    Phase 6: Command skeleton — root, version, commands, help (test → impl → verify)
    Phase 7: Integration tests (test → impl → verify)
    Phase 8: Comprehensive verification

  Phases 2-5 are parallel-eligible (disjoint file sets, no dependency chains).
  Phases 6-7 are sequential (depend on prior phases).

phases:
