      - id: TASK-016
        type: implementation
        title: "Implement command skeleton, version, commands, and main"
        description: |
          Create cmd/backstop/root.go with:

          Function NewRootCommand() *cobra.Command:
            - Root command "backstop" with Short/Long descriptions
