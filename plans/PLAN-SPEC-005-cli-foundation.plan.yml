            - TestCLI_EmbedCohort_BaseSchemaPresent (CLM-008): verify
              artifacts/base/schema.json is present in embedded FS
            - TestCLI_Embed_UsesEmbedFS (CLM-041): verify SchemaFS is of
              type embed.FS (compile-time check via type assertion)
            - TestCLI_Embed_ListSchemaPaths (CLM-042): verify ListSchemas()
