      - id: TASK-003
        type: implementation
        title: "Implement go:embed schema cohort filesystem"
        description: |
          Create cmd/backstop/embed.go with:

          Package-level embed directive:
            //go:embed all:../../artifacts
            var SchemaFS embed.FS

          Note on embed path: cmd/backstop/ is two levels below the module root,
          so ../../artifacts resolves to the artifacts/ directory. The embed
          directive must include all: prefix to capture nested directories.

          Function ListSchemas() ([]string, error):
            - Walk SchemaFS using fs.WalkDir
            - Collect paths matching */v*/schema.json and base/schema.json
            - Return sorted list of schema file paths

          Sharp edge: the go:embed path must be correct relative to cmd/backstop/.
          If the path is wrong, compilation fails — verify with go build.
        files:
