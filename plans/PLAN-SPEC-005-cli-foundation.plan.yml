      - id: TASK-006
        type: implementation
        title: "Implement backstop.yml JSON schema"
        description: |
          Create artifacts/backstop-yml/v1/schema.json defining the backstop.yml
          format as a JSON Schema (draft-07).

          Required properties:
            - project (string): project name
            - language (string): primary language

          Optional properties:
            - runtimes (array of strings): supported runtimes
            - enforcement (object):
              - security (object):
                - tier (enum: baseline, standard, compliance)
              - waiver_warning_days (integer, default: 30)
            - packs (object):
              - rules (object): pack name → version string mapping
              - code (object): pack name → version string mapping
            - registries (object): scope string → URL string mapping

          additionalProperties: false (rejects unknown top-level keys)

          This schema is used by the config loader for validation and will be
          embedded in the binary via the embed cohort.
        files:
          - artifacts/backstop-yml/v1/schema.json
        claims:
          - CLM-035
          - CLM-036
          - CLM-037
          - CLM-038
          - CLM-039
          - CLM-040
        depends_on:
          - TASK-005

      - id: TASK-007
        type: implementation
        title: "Implement config types and loader with walk-up discovery"
        description: |
          Create pkg/config/config.go with:

          Type Config struct:
            - Project string
            - Language string
            - Runtimes []string
            - Enforcement struct:
              - Security struct:
                - Tier string (baseline/standard/compliance)
              - WaiverWarningDays int (default 30)
            - Packs struct:
              - Rules map[string]string
              - Code map[string]string
            - Registries map[string]string

          Function DiscoverConfigPath() (string, error):
            - Check BACKSTOP_CONFIG env var first
            - If set and non-empty, validate path exists and is a file (not dir)
            - If empty or unset, walk up from cwd checking each directory
            - Return path or error if not found

          Function LoadConfig() (*Config, error):
            - Call DiscoverConfigPath()
            - Read and parse YAML
            - Validate against embedded backstop.yml JSON schema
            - Use strict YAML decoding to reject unknown keys
            - Apply defaults (waiver_warning_days = 30)
            - Return typed Config struct

          Sharp edges handled:
            - BACKSTOP_CONFIG pointing to directory → error
            - BACKSTOP_CONFIG relative paths resolved from cwd
            - Empty BACKSTOP_CONFIG treated as unset
            - Walk-up stops at filesystem root with actionable error
        files:
