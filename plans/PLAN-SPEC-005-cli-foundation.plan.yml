      - id: TASK-013
        type: implementation
        title: "Implement exit code constants and ExitWithResult"
        description: |
          Create cmd/backstop/exitcode.go with:

          Constants:
            - ExitPass = 0
            - ExitViolations = 1
            - ExitConfigError = 2

          Function ExitWithResult(result ValidationResult, configErr error) int:
            - If configErr != nil: return ExitConfigError (2 takes precedence)
            - If result has violations: return ExitViolations
            - Otherwise: return ExitPass

          Sharp edge: Cobra's default os.Exit(1) behavior must be overridden.
          The root command will use SilenceErrors and SilenceUsage with manual
          exit code handling via ExitWithResult.
        files:
          - cmd/backstop/exitcode.go
        claims:
