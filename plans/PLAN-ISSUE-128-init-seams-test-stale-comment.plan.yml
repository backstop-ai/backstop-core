  ── THE DEFECT, VERBATIM AND VERIFIED AT HEAD ─────────────────────────────────
  `cmd/backstop/init_seams_test.go` lines 24-27, unchanged since the SPEC-069 /
  SPEC-070 commits (`48e6b85`, `fd93cdc`), read EXACTLY:

      24: //
      25: // Referencing `initialize` here is also what satisfies the substantiveness subject join
      26: // for the five claims whose declared subject stays pkg/initialize while their mandated
      27: // tests live in cmd/backstop, where the production adapters are forced to live.

  Both halves of that sentence are false at HEAD:

    1. THE MECHANISM DOES NOT EXIST. The substantiveness subject join evaluates
       colocation/symbol-reference PER TEST FUNCTION — `NoTargetViolation`
       (`pkg/gate/substantiveness_join.go`) and `testFileColocatedWithTarget`
       (`cmd/backstop/gate.go`). There is no code path by which one import, or one
       reference to `initialize` anywhere in a file, extends subject coverage to
       the other test functions in that file. The comment describes a check the
       join implementation does not implement.

    2. THE PREMISE IS ALSO DEAD. The five claims it names — CLM-046, CLM-047,
       CLM-086, CLM-088, CLM-130 — no longer have a "declared subject [that]
       stays pkg/initialize". SPEC-069 v1.3.3 gave each of them an explicit
       `subject: cmd/backstop` (verified at HEAD: `specs/SPEC-069-backstop-init.spec.md`
       lines 953 and 1015 among them, against the spec-level default
       `subject: pkg/initialize` at line 51). So even the situation the sentence
       claims to resolve is gone.

  WHY IT IS WORTH A PLAN AT ALL. This is the load-bearing false belief behind a
  real gate defect, sitting in a comment inside the very file whose claims it
  mis-describes. The next author who adds a claim + test here reads it and
  reasonably concludes an explicit `subject:` is optional — reproducing the
  defect SPEC-069's close-out already paid to find and fix.

  ── WHAT SURVIVES ─────────────────────────────────────────────────────────────
  Lines 14-23 are TRUE and USEFUL and are NOT in scope. They document why the
  file exists (real production adapters, no fakes, the wiring proof against this
  project's recurring integration-gap failure). Only the 24-27 block is wrong.

  ── LOCAL CLAIMS (this plan's own; ISSUE-128 carries none) ────────────────────
  CLM-001  THE FALSE ASSERTION IS GONE. No comment anywhere in
           `cmd/backstop/init_seams_test.go` asserts that referencing
           `initialize` in the file satisfies the substantiveness subject join
           for any claim, nor that a file-level reference propagates subject
           coverage across test functions. Falsifier: the string
           "satisfies the substantiveness subject join" — the only occurrence of
           which in the entire non-`plans/` tree is this line — no longer appears
           in the file, and no reworded equivalent replaces it.

  CLM-002  THE TRUE HALF SURVIVES. The header still carries the "★ WHY THIS FILE
           EXISTS AT ALL" rationale (lines 14-23 at HEAD): real production
           adapters, no fake from `pkg/initialize`, THESE TESTS ARE THE WIRING
           PROOF. The fix does not amputate the useful documentation along with
           the false sentence.

  CLM-003  IF ANYTHING REPLACES IT, IT STATES THE OPPOSITE. Should a replacement
           sentence be written rather than a plain deletion, it says that each
           claim whose mandated tests live in this file must declare an explicit
           `subject: cmd/backstop` ITSELF, because file-level references do not
           propagate to other test functions in the join. A silent deletion also
           satisfies this claim vacuously; a reworded restatement of the old
           belief does not.

  CLM-004  ZERO BEHAVIOR CHANGE. The diff touches comment lines ONLY. The
           `initialize` import and every use of it stay exactly as they are — the
           reference was never load-bearing FOR THE JOIN, but it is entirely
           load-bearing for the tests, which drive `initialize.NewRunner` /
           `initialize.Options` directly. The package still compiles and all nine
           test functions in the file still pass.

  ── SHARP EDGES ───────────────────────────────────────────────────────────────
  SE-1  DO NOT EDIT `plans/PLAN-SPEC-069-backstop-init.plan.yml`. Its TASK-052
