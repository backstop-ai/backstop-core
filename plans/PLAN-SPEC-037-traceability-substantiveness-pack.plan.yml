plan_id: PLAN-SPEC-037
spec_id: SPEC-037
spec_version: 1.2.7
created: "2026-06-22"
status: draft
target_module: pkg/gate
test_command: "go test ./pkg/gate/ ./cmd/backstop/ -race -coverprofile=cover.out"
coverage_threshold: 80

notes: |
  Implements SPEC-037 (BUNDLE-009 Seed 3 — substantiveness as a PACK). Eradicates the
  baked-in Go substantiveness analyzer in pkg/gate/step_testverify.go and re-implements
  its two questions across the PACK / GATE / BINARY split: Q1 hollow-test becomes an
  ast-grep FINDINGS rule (per-language assertion vocabulary in YAML → SARIF); Q2 noTarget
  becomes a pack EXTRACTION query (referenced symbols) PLUS a thin, language-agnostic GATE
  SET-JOIN. The gate keeps only the noTarget set-membership test + SARIF consumption; the
  binary learns zero language/tool specifics.

  ===================================================================
  STRANGLER ORDERING IS A HARD FENCE (Sharp Edge 3 / REQ-006 GATES REQ-001)
  ===================================================================
  The strangler-equivalence pass (REQ-006, Phase 4) MUST run and PASS over REAL Go
  fixtures with REAL ast-grep — proving the pack path reproduces the still-present
  analyzer's verdict on each verdict-matrix cell (hollow / substantive / no-target /
  calls-target / same-package) — BEFORE the analyzer deletion (REQ-001, Phase 6). The
  equivalence pass COMPARES the pack verdict against the LIVE pre-deletion analyzer, so
  the analyzer symbols (checkSubstantiveness / hasAssertions / callsTargetPackage /
  samePackage / StepTestSubstantiveness*) MUST still exist when Phase 4 runs. Phase 6's
  deletion task depends on the Phase 4 equivalence IMPLEMENTATION (the harness that calls
  the live analyzer). Deleting before parity is proven makes the equivalence claims vacuous
  (nothing to compare against). Order: prove parity (Phase 4), THEN delete (Phase 6). The
  deletion + the existing-test cleanup (REQ-008) happen in the SAME change so pkg/gate
  keeps compiling.

  ===================================================================
  THE DISPATCH RETURNS A FLAT, gate_type-LESS, IDENTITY-LESS STREAM (Sharp Edge 5 / REQ-007)
  ===================================================================
  GROUND TRUTH: the flat-violation conversion (cmd/backstop/pack_gate.go:460-466) keeps
  ONLY {Rule, File, Message, Severity, SourcePack} — Line/region is DROPPED, there is NO
  FuncName field, and there is NO GateType field on gate.Violation / check.Violation.
  Two consequences the implementer MUST honor exactly:
    (1) ROUTING is by NAMESPACED RULE ID (pack.NamespacedRuleID, pkg/pack/coordinate.go:42),
        NOT by a gate_type discriminator (none exists). RouteSubstantivenessFindings
        partitions the flat []gate.Violation by matching the substantiveness pack's stable
        hollow-rule-ID and extraction-rule-ID on each violation's Rule.
    (2) PER-TEST KEYING comes from the extraction rule's EMBEDDED SARIF MESSAGE TEXT.
        Because Line/region is dropped and there is no FuncName field, the Q2 extraction
        rule MUST embed the enclosing test function name (and referenced symbol) INTO the
        SARIF `message`, in a PINNED, parseable format; ReferencedSetForTest parses the
        FuncName out of Message and joins by (FilePath, FuncName) — it MUST NOT rely on
        Line/region and MUST NOT re-walk the test AST gate-side (Sharp Edge 2 forbids a
        re-baked spec-aware gate-side analyzer).

  ===================================================================
  THE PINNED EXTRACTION MESSAGE FORMAT (REQ-007 / CLM-025)
  ===================================================================
  The Q2 extraction rule emits one SARIF result per (test, referenced-symbol). Its message
  MUST carry, in a stable machine-parseable shape, BOTH the enclosing test function name and
  the referenced symbol/package — e.g. "referenced-symbol func=<TestFuncName> symbol=<pkg>".
  TASK-100 PINS the exact format string; ReferencedSetForTest parses func= and symbol= out
  of Message. File comes from the violation's File field; FuncName comes ONLY from the
  message (NOT from Line/region, which is dropped). This is a string/set operation over pack
  SARIF — no go/parser, no go/ast, no per-(test,target) parameterized pack query.

  ===================================================================
  THE SET-JOIN STAYS GATE-SIDE + LANGUAGE-AGNOSTIC (Sharp Edge 1/2 / REQ-003)
  ===================================================================
  NoTargetViolation is the ONLY remaining noTarget logic and it is a set/string membership
  test over pack-extracted data. The decision table (exhaustive, no fourth disposition):
    targetPkg=="" (cmd/ or non-pkg/)         → SKIP (no violation)
    targetPkg!="" && samePackage             → satisfied (no violation)
    targetPkg!="" && !samePackage && in set  → satisfied (no violation)
    targetPkg!="" && !samePackage && not set → noTarget violation
  TargetPackageName is relocated behavior-preserving (pkg/... → last component; cmd/ and
  non-pkg/ → ""). A subtle change (returning non-empty for cmd/) flips the empty-target SKIP
  into a spurious noTarget — CLM-009/CLM-028 pin the empty-target skip and the relocation.
  The pack stays spec-UNAWARE: the join knowledge (target package) lives ONLY in the gate.

  ===================================================================
  WIRING IS SPY-VERIFIED ON THE REAL SEAM (Sharp Edge 4 / REQ-005)
  ===================================================================
  buildTestSubstantivenessStep MUST NOT re-implement dispatch. It reaches the
  substantiveness pack's findings + extraction through the EXISTING
  resolveDispatchPackEngines() / dispatchPackEnginesFn seam (cmd/backstop/code_check.go:45-49,
  the same dispatcher code check and the pack_engines step at gate.go:424 use), then routes
  (RouteSubstantivenessFindings), keys (ReferencedSetForTest), and set-joins
  (NoTargetViolation). A SPY installed on the REAL dispatchPackEnginesFn seam mechanically
  proves the step reached the dispatcher with the substantiveness pack set (CLM-015); an
  UNWIRED step (never reaches dispatchPackEnginesFn) records zero invocations and the test
  asserts non-zero (CLM-016); no baked analyzer delegate is invoked — it no longer exists
  (CLM-017). The wiring locus is in cmd/backstop/gate.go (OUTSIDE pkg/gate) — which is why
  the test_command adds ./cmd/backstop/.

  ===================================================================
  THE TS PROOF PACK IS SHARED WITH SPEC-038 — ADDITIVE, NOT A FORK (Sharp Edge 6)
  ===================================================================
  This spec ADDS substantiveness rules + .test.ts fixtures to the SINGLE shared TypeScript
  proof pack; SPEC-038 (Seed 4) adds the contract rules to the SAME pack. This plan creates
  the TS pack under pkg/gate/testdata/ as a self-contained fixture pack for this spec's
  integration tests; it MUST be authored as additive (a substantiveness rule + its fixtures)
  so SPEC-038 can extend the same manifest, NOT a separate forked pack. The TS proof is
  REAL: real ast-grep over real .test.ts fixtures riding the SAME dispatch path as the Go
  rule — unsatisfiable by a stub (CLM-014).

  ===================================================================
  PROVISIONING — INSTALLED LOCAL PACK, NOT EMBEDDED, NOT TESTDATA-AS-PRODUCTION (REQ-009)
  ===================================================================
  The substantiveness pack is an ORDINARY INSTALLED pack — the binary ships ONLY a way to
  install + execute packs. Two DISTINCT pack locations exist and must not be conflated:
    (A) The pkg/gate/testdata/substantiveness-pack/ pack (Phase 1) is a TEST-ONLY fixture
        the pkg/gate integration tests (Q1 / set-join / strangler) dispatch over directly.
        testdata is a test convenience, NEVER the path a real gate run resolves the pack from.
    (B) The pack SOURCE shipped in-repo at packs/substantiveness/ (REQ-009) is the REAL,
        dogfood-installable pack. backstop-core installs it INTO ITSELF as a LOCAL pack via
        the shipped distribution path: distribution.Add("packs/substantiveness", ...) records
        it in backstop.yml as `backstop/substantiveness: local` and writes a `local`
        SourceType lockfile entry (precedent: backstop/go-standards already declared `local`).
        VerifyLock SKIPS `local` packs (verify.go:46-47), so no remote artifact is needed.
  REQ-010's END-TO-END proof (CLM-032..034) resolves the pack from the INSTALLED (local)
  declaration — location (B) — NOT from testdata. There MUST be NO //go:embed, no compiled-in
  rule YAML, and no production code path that resolves the substantiveness pack from a
  testdata directory (CLM-030 pins no-embed / no-testdata-in-production).

  ===================================================================
  REAL OVER-INSTALLED-PACK E2E — UNSTUBBABLE BY CONSTRUCTION (REQ-010 / CLM-032..034)
  ===================================================================
  REQ-005's spy proves the STEP calls the dispatch seam; it does NOT prove the whole pipeline
  runs over a real INSTALLED pack. REQ-010 adds the over-installed-pack proof. The E2E test
  (TestE2E_SubstantivenessInstalledLocalPack_RealGate_HollowRed) is structured to be
  UNSTUBBABLE:
    1. It first INSTALLS the pack as a local pack via the REAL distribution.Add path (pack
       declared `backstop/substantiveness: local` in a temp backstop.yml + `local` lockfile
       entry); the install is a PRECONDITION of the assertion, not mocked.
    2. It runs the WHOLE production gate substantiveness path over a genuinely HOLLOW backstop
       *_test.go source: real pack RESOLUTION from the installed declaration → real
       dispatchPackEngines (NOT the test seam stub) → real ast-grep over the real source →
       real convert (ast-grep→SARIF via the convert script under the REAL macOS sandbox) →
       SARIF → RouteSubstantivenessFindings + NoTargetViolation set-join, and asserts a REAL
       test_substantiveness violation is produced by the whole chain.
    3. The NEGATIVE twin (TestE2E_SubstantivenessUninstalled_NoVacuousGreen) runs the SAME
       hollow fixture through the SAME production path with the local pack declaration/lock
       ABSENT and asserts NO substantiveness violation — so the test cannot pass vacuously: the
       violation can ONLY come from the real installed pack actually running, not from a stub,
       not from testdata-pointed-at-by-production, and not from the REQ-005 seam spy.
    4. CLM-034 asserts the proof exercises BOTH multi-rule ast-grep dispatch (the pack carries
       2 ast-grep rules, Q1 hollow + Q2 extraction; ISSUE-028 makes multi-rule dispatch real)
       AND the convert script under the real macOS sandbox (ISSUE-029).
  Substrate is FIXED: ISSUE-028 (multi-rule ast-grep dispatch via sgconfig) + ISSUE-029
  (sandboxed convert) are SHIPPED, so the real ast-grep + real convert path genuinely runs.
  Like all real-ast-grep tasks here, the E2E + Q1 + strangler MUST t.Fatal (NOT t.Skip) if
  ast-grep is absent — a skipped real-engine test is a silent gap.

  ===================================================================
  CAPABILITY RE-KEY IS SUBSTANTIVENESS-DIMENSION-ONLY (REQ-009 / CLM-035 / CLM-036)
  ===================================================================
  SPEC-036 shipped deriveCapabilityState at cmd/backstop/gate.go:272, which keys EVERY
  traceability dimension's CapabilityState on cfg.Language + baked-Go-analyzer presence. This
  spec DELETES the baked substantiveness analyzer, so the SUBSTANTIVENESS arm of that function
  MUST re-key onto the INSTALLED substantiveness pack (Present/Working iff the pack is
  installed/resolvable; undeclared+absent → class-2, declared+absent → class-3 per SPEC-036).
  The re-key is DIMENSION-ASYMMETRIC and this is a HARD FENCE: the COVERAGE and CONTRACTS arms
  MUST stay on their existing keying UNCHANGED — coverage was descoped (analyzer deleted, no
  in-bundle replacement) and contracts keeps its baked analyzer until SPEC-038/Seed 4 ships
  its pack; re-keying contracts now would mark it capability-absent before its pack exists and
  break the gate. CLM-036 pins the asymmetry. The shipped SPEC-036 test
  TestCapabilityState_NonGoProject_DerivesAbsentClass2 (cmd/backstop/gate_capability_test.go:17)
  currently LOOPS uniformly over all 3 dimensions asserting the OLD baked-analyzer keying — it
  goes RED on ./cmd/backstop/ the moment substantiveness re-keys. It MUST be MIGRATED in the
  SAME change (REQ-008 extended / CLM-037): split the substantiveness dimension out to assert
  the INSTALLED-pack keying, keep the coverage/contracts arms on the baked-Go assertion. This
  is an OPEN alignment of SPEC-036's derivation via implementation (align-predating-artifacts);
  SPEC-036 itself is NOT revised.

  ===================================================================
  WIP REUSE — READ, DON'T CHERRY-PICK (commit 816fc64)
  ===================================================================
  A preserved wip branch wip/seed-3-substantiveness-eradication (commit 816fc64) carries
  prior, impl-reviewed-sound implementations of the SOUND CORE: pkg/gate/substantiveness_join.go
  (set-join + routing + keying), the strangler harness (substantiveness_strangler.go), the Q1
  ast-grep dispatch glue (substantiveness_q1_dispatch.go), the analyzer deletion in
  step_testverify.go, the spy wiring in cmd/backstop/gate.go, and the pack rules + Go/TS
  fixtures. The implementer SHOULD READ those via `git show wip/seed-3-substantiveness-eradication:<path>`
  to avoid re-deriving the sound core. DO NOT git cherry-pick — the wip predates ISSUE-028/029
  and would conflict; reference-and-reapply only. The wip was BLOCKED on the now-fixed substrate
  (multi-rule dispatch, sandboxed convert), and PREDATES the REQ-009/REQ-010 provisioning +
  capability-re-key + E2E delta, so those tasks are NEW work with no wip to reuse.

  ===================================================================
  CLM-031 AMENDMENT RECONCILIATION — THE SPEC EDIT AND THE TEST RENAME MOVE TOGETHER
  (SPEC-037 v1.2.4 + v1.2.5 + v1.2.6; Phase 6a)
  ===================================================================
  THE SPEC HALF HAS ALREADY LANDED (v1.2.7, commit f9569df) AND THE TREE IS RIGHT NOW IN THE
  HALF-LANDED STATE THIS PHASE EXISTS TO CLOSE: SPEC-037's CLM-031 already names the NEW mandated
  test, and no Go function by that name exists yet. Phase 6a is the outstanding half. Until it
  lands, SPEC-037 mandates a function that is not there — invisible today only because
  ContractsAreDue filters a `draft` spec's tests out of test_verification and test_substantiveness
  entirely (see TASK-552, which asserts the pairing by hand for exactly that reason).
  Phases 1-6 above describe the ORIGINAL build, in which CLM-031 hard-required a LOCAL install
  and TASK-460 therefore mandated the test name
  TestProvisioning_SubstantivenessInstalledAsLocalPack_DeclaredAndLocked. Two later spec
  revisions invalidated that name and that test body, and Phase 6a is where they are reconciled:

    - v1.2.4 AMENDED CLM-031 (and REQ-009) to accept EITHER source type — a `local` install OR a
      REMOTE (`git`) install carrying the source coordinate and tag. What is pinned is that the
      pack is INSTALLED AND RESOLVABLE through the standard `pack add` distribution path, NOT
      that its source is local. The mandated test's NAME ("AsLocalPack") and its BODY (a
      t.TempDir() local add asserting SourceType == "local" and nothing else) now CONTRADICT the
      claim they are supposed to falsify. v1.2.4 recorded the rename as owed follow-on work.
    - v1.2.5 added `subject: cmd/backstop` to nine claims whose mandated tests live in
      cmd/backstop rather than the spec-level `implementation.subject: pkg/gate`, and
      DELIBERATELY LEFT CLM-031 OUT because it is coupled to this rename. CLM-031's mandated
      test extracts the symbol set {add, distribution, filepath, os, strings, t} — no `gate`
      reference — so the substantiveness subject join (gate.NoTargetViolationForTest over
      testFileColocatedWithTarget) fails for it on BOTH available bases. The rename ALONE does
      not clear that noTarget violation, and the `subject:` line alone does not make the name
      honest. SPEC-037 cannot promote to `implemented` until BOTH land.
    - v1.2.6 then gave CLM-035 the same `subject: cmd/backstop` as a PREVENTIVE hardening (its
      join was passing only incidentally, on a `gate.`-qualified call inside the test body that a
      refactor could remove), and restated that CLM-031 is now the SOLE remaining claim carrying
      no `subject:`. Phase 6a is what closes that residue — there is nothing else left behind it.

  WHY THE PAIRING MATTERS. A mandated test name lives in two places — the spec's claims[].tests
  entry and the Go function itself — and the gate's test_verification resolves one against the
  other the moment SPEC-037 flips to `implemented`. Either half alone leaves the spec naming a
  function that does not exist (or a function no claim mandates), which is precisely the drift
  class this repo blocks on. The precedent followed here is SPEC-038 v1.2.2 / PLAN-ISSUE-082
  TASK-002: the spec-author amended the mandated name (TestAllowlist_GrepAndRgPresentPinned →
  TestAllowlist_GrepPresentPinned) in a spec commit, and the plan's task carried the code-side
  rename verbatim. This plan is the code side of that pair — the spec side is already committed,
  so Phase 6a is not optional cleanup, it is the half that closes an open gap.

  WHAT ALREADY LANDED IN SPEC-037 v1.2.7 (commit f9569df) — the delta Phase 6a is the counterpart
  to, recorded here so the plan explains itself without requiring the reader to diff the spec
  (three edits, no more):
    (1) CLM-031 gained `subject: cmd/backstop`, for the same reason the other nine did: the units
        it pins (the distribution path driven through cmd/backstop's own production add seam)
        live in cmd/backstop, so colocation is the honest join basis.
    (2) CLM-031's claims[].tests entry changed from
        TestProvisioning_SubstantivenessInstalledAsLocalPack_DeclaredAndLocked to
        TestProvisioning_SubstantivenessInstalledViaDistributionPath_LocalOrGit_DeclaredAndLocked.
        The new name is derived from the amended claim text, not invented: "via distribution
        path" is what v1.2.4 says is pinned, "LocalOrGit" is the claim's own EITHER/OR, and
        "DeclaredAndLocked" is carried over unchanged because that half of the claim did not
        move.
    (3) A v1.2.7 Version History entry recording both, and closing out the v1.2.4/v1.2.5/v1.2.6
        OPEN FOLLOW-ON and "residue unchanged" prose so the spec no longer describes the rename
        as owed.
  NOTHING ELSE IN SPEC-037 CHANGED. No requirement was reworded, no claim added or removed, no
  other mandated name moved, and `status` stayed as it was — promotion is a separate decision,
  and it stays blocked until Phase 6a supplies the function CLM-031 now names.

phases:
  # ═══════════════════════════════════════════════════════════════════════
  # Phase 1: Setup — substantiveness pack rules + Go/TS fixtures
  # ═══════════════════════════════════════════════════════════════════════
  - id: phase-1
    name: "Phase 1: Substantiveness Pack Rules and Fixtures (Go + shared TS proof pack)"
    description: |
      Author the substantiveness pack in TWO locations (see notes PROVISIONING): (A) the
      pkg/gate/testdata/substantiveness-pack/ TEST-ONLY fixture pack the pkg/gate integration
      tests dispatch over directly, and (B) the REAL in-repo pack SOURCE at packs/substantiveness/
      that backstop-core dogfood-installs into itself as a LOCAL pack (REQ-009). Both carry the
      Q1 hollow-test ast-grep FINDINGS rule (assertion vocabulary in YAML), the Q2 referenced-
      symbol EXTRACTION ast-grep query (embedding the enclosing test func name + referenced
      symbol into the SARIF message per the PINNED format), and the convert script. Also add the
      real Go fixtures (hollow / substantive / no-target / calls-target / same-package) the Q1,
      set-join, and strangler phases consume, and the REAL hollow-test substantiveness rule +
      .test.ts fixtures (hollow / substantive) to the SHARED TypeScript proof pack (additive —
      SPEC-038 extends the same manifest). Inert pack YAML + fixture source only; no production
      Go here. REUSE: the wip branch (816fc64) carries prior pack rules + fixtures — READ via
      `git show wip/seed-3-substantiveness-eradication:<path>`; do NOT cherry-pick (notes).
    tasks:
      - id: TASK-001
        type: setup
        title: "Author Go substantiveness pack (Q1 hollow rule + Q2 extraction rule + manifest)"
        description: |
          Create the Go substantiveness pack under pkg/gate/testdata/substantiveness-pack/
          declaring ast-grep as its engine (per SPEC-035 pack-declared-engines):
            - A Q1 hollow-test FINDINGS rule with a stable rule ID: a test-declaration node
              that does NOT `has` a descendant assertion-shaped call, the assertion vocabulary
              (require|assert|check|verify|expect|must …) expressed ENTIRELY in the rule YAML
              (no hardcoded selector list in the binary — CLM-006). Hollow → finding (RED),
              substantive → no finding (GREEN).
            - A Q2 referenced-symbol EXTRACTION rule with a stable rule ID: a positive query
              emitting one SARIF result per (test, referenced-symbol), its SARIF message
              embedding the enclosing test function name AND referenced symbol in the PINNED
              format pinned by TASK-100 (func=<TestFuncName> symbol=<pkg>). The pack is
              spec-UNAWARE — it only reports what the test references.
          The two rule IDs are the routing keys (pack.NamespacedRuleID form) consumed by
          RouteSubstantivenessFindings (REQ-007). Pack/rules/manifest are inert YAML.
          CONVERT SCRIPT IS MANDATORY: this fixture pack is dispatched through REAL ast-grep by the
          Q1 (TASK-200/201) and strangler (TASK-300/301) phases, and a findings pack with a
          `convert:` binding HARD-ERRORS "broken pack: missing convert script" at
          cmd/backstop/pack_gate.go:414-416 if the script is absent. So this pack MUST ship its own
          in-pack ast-grep→SARIF convert script (ast-grep/to-sarif.sh), and pack.yml's convert
          binding MUST point at that in-pack path (resolved relative to THIS pack root — the
          existing convention, e.g. cmd/backstop/testdata/astgrep-multirule/.../ast-grep/to-sarif.sh).
        files:
          - pkg/gate/testdata/substantiveness-pack/pack.yml
          - pkg/gate/testdata/substantiveness-pack/ast-grep/hollow-test-go.yml
          - pkg/gate/testdata/substantiveness-pack/ast-grep/referenced-symbol-go.yml
          - pkg/gate/testdata/substantiveness-pack/ast-grep/to-sarif.sh
        claims:
          - CLM-006
        depends_on: []
      - id: TASK-002
        type: setup
        title: "Author real Go verdict-matrix fixtures (hollow/substantive/no-target/calls-target/same-package)"
        description: |
          Create the REAL Go test-file fixtures the Q1 pack rule, the gate set-join, and the
          strangler-equivalence pass run real ast-grep over — one per verdict-matrix cell:
            - hollow_test.go: a test that calls the subject but asserts nothing (Q1 RED).
            - substantive_test.go: a test with at least one assertion-shaped call (Q1 GREEN).
            - notarget_test.go: a substantive test that does NOT reference the target package
              (Q2 noTarget RED).
            - callstarget_test.go: a substantive test that references the target package via a
              package-qualified call (Q2 GREEN).
            - samepackage_test.go: a substantive test residing in the target package itself
              (Q2 GREEN via same-package short-circuit).
          Real .go fixtures (not stubs), backing CLM-003/004 (Q1), CLM-007..010 (set-join), and
          CLM-018..023 (strangler). No production code.
        files:
          - pkg/gate/testdata/substantiveness-pack/fixtures/go/hollow_test.go
          - pkg/gate/testdata/substantiveness-pack/fixtures/go/substantive_test.go
          - pkg/gate/testdata/substantiveness-pack/fixtures/go/notarget_test.go
          - pkg/gate/testdata/substantiveness-pack/fixtures/go/callstarget_test.go
          - pkg/gate/testdata/substantiveness-pack/fixtures/go/samepackage_test.go
        claims:
          - CLM-003
          - CLM-004
        depends_on: []
      - id: TASK-003
        type: setup
        title: "Add real hollow-test substantiveness rule + .test.ts fixtures to the SHARED TS proof pack"
        description: |
          Add a REAL ast-grep hollow-test substantiveness rule (per-language TS assertion
          vocabulary in YAML; node = a TS test declaration that does NOT `has` an assertion-
          shaped call such as expect/assert/verify) to the SHARED TypeScript proof pack under
          pkg/gate/testdata/ts-proof-pack/, plus two REAL .test.ts fixtures — one hollow (calls
