          pack is authored ADDITIVELY (a substantiveness rule with its own stable rule ID) so
          SPEC-038 can add its contract rules to the SAME manifest without a fork (Sharp Edge 6).
          Real rule + real fixtures (no stub): CLM-012/013/014 assert concrete findings through the
          shared dispatch path.
          CONVERT SCRIPT IS MANDATORY: this TS proof pack is dispatched through REAL ast-grep
          (CLM-012/013/014), and a findings pack with a `convert:` binding HARD-ERRORS "broken pack:
          missing convert script" at cmd/backstop/pack_gate.go:414-416 if the script is absent. So
          this pack MUST ship its own in-pack ast-grep→SARIF convert script (ast-grep/to-sarif.sh),
          and pack.yml's convert binding MUST point at that in-pack path (resolved relative to THIS
          pack root — the existing convention). Authored additively so SPEC-038 reuses the same
          convert script + manifest.
        files:
          - pkg/gate/testdata/ts-proof-pack/pack.yml
          - pkg/gate/testdata/ts-proof-pack/ast-grep/hollow-test-ts.yml
          - pkg/gate/testdata/ts-proof-pack/ast-grep/to-sarif.sh
          - pkg/gate/testdata/ts-proof-pack/fixtures/ts/hollow.test.ts
          - pkg/gate/testdata/ts-proof-pack/fixtures/ts/substantive.test.ts
        claims:
          - CLM-012
          - CLM-013
        depends_on: []
      - id: TASK-004
        type: setup
        title: "Author the REAL installable pack SOURCE at packs/substantiveness/ (location B, not testdata, not embedded)"
        description: |
          Create the REAL, dogfood-installable substantiveness pack SOURCE in-repo at
          packs/substantiveness/ — the pack a real gate run resolves from the INSTALLED (local)
          declaration, NOT from testdata and NOT //go:embed-bundled (REQ-009 / CLM-030). This is
          location (B) in the notes PROVISIONING section, distinct from the pkg/gate/testdata
          fixture pack (location A, TASK-001). It declares ast-grep as its engine and carries the
          SAME two stable-rule-ID ast-grep rules (Q1 hollow-test FINDINGS + Q2 referenced-symbol
          EXTRACTION) plus the ast-grep→SARIF convert script, so installing it gives backstop-core
          a real, multi-rule (ISSUE-028), sandbox-convert (ISSUE-029) substantiveness pack. The
          rule IDs match the routing keys (pack.NamespacedRuleID) the gate consumes. The pack is
          an ORDINARY pack — its rule YAML lives ONLY in this source dir, never compiled into the
          binary. This is the pack REQ-010's E2E (Phase 6b) installs as a local pack and the
          capability re-key (Phase 6a) keys on. Inert pack YAML + convert script only; no
          production Go. REUSE: the wip rules (816fc64 substantiveness-pack/) are the template —
          READ, do not cherry-pick (notes).
        files:
          - packs/substantiveness/pack.yml
          - packs/substantiveness/ast-grep/hollow-test-go.yml
          - packs/substantiveness/ast-grep/referenced-symbol-go.yml
          - packs/substantiveness/ast-grep/to-sarif.sh
        claims:
          - CLM-030
        depends_on: []

  # ═══════════════════════════════════════════════════════════════════════
  # Phase 2: Gate set-join + consumption seam + Q1/hollow conversion
