      enclosing test func name + referenced symbol into the SARIF message per the PINNED
      format), and the real Go fixtures (hollow / substantive / no-target / calls-target /
      same-package) the Q1, set-join, and strangler phases consume. Also add the REAL
      hollow-test substantiveness rule + .test.ts fixtures (hollow / substantive) to the
      SHARED TypeScript proof pack (additive — SPEC-038 extends the same manifest). Inert
      pack YAML + fixture source only; no production Go here.
    tasks:
      - id: TASK-001
        type: setup
        title: "Author Go substantiveness pack (Q1 hollow rule + Q2 extraction rule + manifest)"
        description: |
          Create the Go substantiveness pack under pkg/gate/testdata/substantiveness-pack/
          declaring ast-grep as its engine (per SPEC-035 pack-declared-engines):
            - A Q1 hollow-test FINDINGS rule with a stable rule ID: a test-declaration node
              that does NOT `has` a descendant assertion-shaped call, the assertion vocabulary
              (require|assert|check|verify|expect|must …) expressed ENTIRELY in the rule YAML
              (no hardcoded selector list in the binary — CLM-006). Hollow → finding (RED),
              substantive → no finding (GREEN).
            - A Q2 referenced-symbol EXTRACTION rule with a stable rule ID: a positive query
              emitting one SARIF result per (test, referenced-symbol), its SARIF message
              embedding the enclosing test function name AND referenced symbol in the PINNED
              format pinned by TASK-100 (func=<TestFuncName> symbol=<pkg>). The pack is
              spec-UNAWARE — it only reports what the test references.
          The two rule IDs are the routing keys (pack.NamespacedRuleID form) consumed by
          RouteSubstantivenessFindings (REQ-007). Pack/rules/manifest are inert YAML.
        files:
          - pkg/gate/testdata/substantiveness-pack/pack.yml
          - pkg/gate/testdata/substantiveness-pack/ast-grep/hollow-test-go.yml
          - pkg/gate/testdata/substantiveness-pack/ast-grep/referenced-symbol-go.yml
        claims:
          - CLM-006
        depends_on: []
      - id: TASK-002
        type: setup
        title: "Author real Go verdict-matrix fixtures (hollow/substantive/no-target/calls-target/same-package)"
        description: |
          Create the REAL Go test-file fixtures the Q1 pack rule, the gate set-join, and the
          strangler-equivalence pass run real ast-grep over — one per verdict-matrix cell:
            - hollow_test.go: a test that calls the subject but asserts nothing (Q1 RED).
            - substantive_test.go: a test with at least one assertion-shaped call (Q1 GREEN).
            - notarget_test.go: a substantive test that does NOT reference the target package
              (Q2 noTarget RED).
            - callstarget_test.go: a substantive test that references the target package via a
              package-qualified call (Q2 GREEN).
            - samepackage_test.go: a substantive test residing in the target package itself
              (Q2 GREEN via same-package short-circuit).
          Real .go fixtures (not stubs), backing CLM-003/004 (Q1), CLM-007..010 (set-join), and
          CLM-018..023 (strangler). No production code.
        files:
          - pkg/gate/testdata/substantiveness-pack/fixtures/go/hollow_test.go
          - pkg/gate/testdata/substantiveness-pack/fixtures/go/substantive_test.go
          - pkg/gate/testdata/substantiveness-pack/fixtures/go/notarget_test.go
          - pkg/gate/testdata/substantiveness-pack/fixtures/go/callstarget_test.go
          - pkg/gate/testdata/substantiveness-pack/fixtures/go/samepackage_test.go
        claims:
          - CLM-003
          - CLM-004
        depends_on: []
      - id: TASK-003
        type: setup
        title: "Add real hollow-test substantiveness rule + .test.ts fixtures to the SHARED TS proof pack"
        description: |
          Add a REAL ast-grep hollow-test substantiveness rule (per-language TS assertion
          vocabulary in YAML; node = a TS test declaration that does NOT `has` an assertion-
          shaped call such as expect/assert/verify) to the SHARED TypeScript proof pack under
          pkg/gate/testdata/ts-proof-pack/, plus two REAL .test.ts fixtures — one hollow (calls
          the subject, asserts nothing) and one substantive (uses expect/an assertion verb). The
          pack is authored ADDITIVELY (a substantiveness rule with its own stable rule ID) so
          SPEC-038 can add its contract rules to the SAME manifest without a fork (Sharp Edge 6).
          Real rule + real fixtures (no stub): CLM-012/013/014 assert concrete findings through the
          shared dispatch path.
        files:
          - pkg/gate/testdata/ts-proof-pack/pack.yml
          - pkg/gate/testdata/ts-proof-pack/ast-grep/hollow-test-ts.yml
          - pkg/gate/testdata/ts-proof-pack/fixtures/ts/hollow.test.ts
          - pkg/gate/testdata/ts-proof-pack/fixtures/ts/substantive.test.ts
        claims:
          - CLM-012
          - CLM-013
        depends_on: []

