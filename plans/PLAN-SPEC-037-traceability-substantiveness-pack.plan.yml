      ReferencedSymbolSet type, the NoTargetViolation set-join decision table, the REQ-007
      consumption-seam helpers (RouteSubstantivenessFindings by NAMESPACED rule ID — NOT
      gate_type; ReferencedSetForTest keyed by (FilePath, FuncName) parsed from the SARIF
      Message), the Q1 routed-hollow → per-test verdict helper, and the hollow-finding →
      test_substantiveness violation conversion preserving the "test X has no assertions
      (hollow)" message. Pure language-agnostic logic over flat pack SARIF — no go/parser, no
      ast-grep invocation in this file.
    tasks:
