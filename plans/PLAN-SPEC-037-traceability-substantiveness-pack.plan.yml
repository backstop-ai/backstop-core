  # ═══════════════════════════════════════════════════════════════════════
  # Phase 6a: Reconcile CLM-031's mandated test to the v1.2.4 amendment (rename + both source types)
  # ═══════════════════════════════════════════════════════════════════════
  - id: phase-6a
    name: "Phase 6a: CLM-031 Amendment Reconciliation — Both Source Types, Then Rename (SPEC-037 v1.2.4/v1.2.5)"
    description: |
      Bring CLM-031's mandated test back into agreement with the claim it is supposed to falsify.
      See notes CLM-031 AMENDMENT RECONCILIATION for the full why; the short version is that
      v1.2.4 loosened CLM-031 from "installed as a LOCAL pack" to "installed and resolvable via
      the standard distribution path, EITHER source type", and the test kept the old name and a
      local-only body. The artifact half is ALREADY DONE — SPEC-037 v1.2.7 (commit f9569df) gave
      CLM-031 `subject: cmd/backstop` and repointed its mandated test name — so this phase is the
      outstanding code half, and until it lands the spec names a function that does not exist.

      ORDERING MIRRORS THIS PLAN'S OWN STRANGLER SHAPE (Phase 4 proves, Phase 6 deletes): TASK-550
      ADDS the missing git-source arm and proves it, TASK-551 then folds both arms into the single
      renamed mandated function and deletes the superseded one. Adding-then-consolidating is what
      keeps the new remote coverage observable on its own merits instead of arriving fused to a
      rename, where a silently-broken git arm would be indistinguishable from a naming change.

      SCOPE FENCE: this phase touches ONE file,
      cmd/backstop/gate_substantiveness_provisioning_test.go, and changes NO production code. The
      distribution path already supports both source types — backstop-core's own substantiveness
      pack has installed remotely since commit 905120f — so there is nothing to implement, only
      coverage to add and a name to correct. Phase 6a runs after Phase 5b's verification (TASK-463)
      because it edits the file that phase produced.
    tasks:
      - id: TASK-550
        type: test
        title: "Add CLM-031's missing GIT-SOURCE arm under the amended mandated name (both source types)"
        description: |
          Write the amended CLM-031 test in cmd/backstop/gate_substantiveness_provisioning_test.go
          under the END-STATE mandated name (SPEC-037 v1.2.7, prescribed in the notes):

            TestProvisioning_SubstantivenessInstalledViaDistributionPath_LocalOrGit_DeclaredAndLocked

          It carries TWO subtests, one per source type, because the amended claim is a DISJUNCTION
          ("EITHER source type satisfies this") and a test that exercises only the local half
          leaves the half the amendment was written for completely unfalsified. Both arms assert
          the SAME three properties the claim names — backstop.yml DECLARES the pack, backstop.lock
          carries a RESOLVABLE entry, VerifyLock PASSES — and then the source-type specifics:

            t.Run("local-source", …) — the existing arm, PRESERVED IN SUBSTANCE. distribution.Add
            over the packs/substantiveness/ source in a t.TempDir() project; lock entry SourceType
            == "local"; VerifyLock passes WITHOUT a remote artifact (local packs are skipped).
            TIGHTEN ONE ASSERTION WHILE MOVING IT: the current check is
            `strings.Contains(yml, "local")` over the WHOLE backstop.yml, which passes on the word
            "local" appearing anywhere in the file. Assert the declaration LINE for
            backstop/substantiveness carries the local value instead — read updateBackstopYml
            (pkg/pack/distribution/add.go) for the exact shape it writes rather than guessing at it.

            t.Run("git-source", …) — NEW, and the whole point of this task. Publish
            packs/substantiveness/ as a hermetic remote and install it BY GIT REF through the same
            production seam. The harness already exists and MUST be reused rather than rebuilt:
              - FIRST, FAIL LOUD IF GIT IS ABSENT — do NOT let the arm skip. The harness's own
                requireGit (hermetic_remote_harness_test.go) calls t.Skip, and a SKIPPED t.Run
                subtest leaves the PARENT test PASSING: the suite would report this mandated test
                green with the git arm never having executed, which is the vacuous green this
                whole spec exists to prevent. Guard with an explicit
                `if _, err := exec.LookPath("git"); err != nil { t.Fatalf(…) }` BEFORE calling
                newHermeticRemote, so the harness's t.Skip is unreachable. This is the same
                posture TASK-461 takes on ast-grep (t.Fatal, NOT t.Skip) and for the same reason:
                CLM-031 is a claim about the distribution path, and the distribution path IS git —
                an environment without it cannot make a statement about this claim either way.
              - Create the consumer project with newConsumerProject(t) (the harness helper), NOT a
                bare t.TempDir(). updateBackstopYml (pkg/pack/distribution/add.go) READS
                backstop.yml and returns the read error when it is missing, so an add into an
                empty directory fails before it declares anything; the local arm gets past this
                only because it writes a minimal backstop.yml itself. newConsumerProject writes
                exactly that minimal file and is the harness's own answer to this.
              - newHermeticRemote(t, <abs path to packs/substantiveness>, "v1.1.0") — the fixture
                source is a plain tree (no .git), which is what the harness requires. v1.1.0 is the
                manifest's own declared version; the harness rewrites pack.yml's version to the tag
                anyway, so the two cannot drift.
              - redirectPackURL(t, remoteE2EOrg, "substantiveness", remote.Path), then
                assertPackURLRedirected(t, remoteE2EOrg, "substantiveness", remote) BEFORE any
                other assertion. The redirect is keyed on the exact URL productionPackURL builds; a
                mismatched pair does not fail, it MISSES, and the arm quietly reaches the network
                and passes for the wrong reason. Proving the redirect landed is not optional
                ceremony — it is what makes this arm hermetic.
              - add.Run(remoteE2EOrg+"/substantiveness@1.1.0",
                distribution.AddOptions{ProjectDir: <the newConsumerProject dir>}) over the SAME
                newProductionAddCommand() the local arm uses. The in-process add path
                inherits the test process env, so GIT_CONFIG_GLOBAL reaches the git child;
                cmd/backstop/init_seams_test.go's TestInit_GitRefPackInstallLandsAsAPortableLockEntry
                is the working precedent for exactly this combination.
            Assert on the arm's lock entry: SourceType == "git", a NON-EMPTY SourceCoordinate, GitRef
            == "v1.1.0", a NON-EMPTY ContentHash, and VerifyLock PASSING over the materialized
            .backstop/packs tree. Read the lock OFF DISK (distribution.ReadLockfile) rather than
            trusting the value Add returns — the committed lock is what REQ-009 is about.

          SHARP EDGE — THE LOCK KEY IS THE MANIFEST NAME, NOT THE COORDINATE (SPEC-056). The
          hermetic remote is served at <org>/substantiveness while packs/substantiveness/pack.yml
          declares `name: backstop/substantiveness`. That divergence is DIAGNOSTIC, NOT A REFUSAL:
          the add succeeds, reports the divergence loudly, and installs under the MANIFEST name —
          so both arms look up the same lock key, "backstop/substantiveness". Do not "fix" the
          divergence by renaming the fixture or the manifest, and do not expect the add to fail.
          This mirrors production, where the real coordinate (backstop-ai/go-substantiveness)
          already differs from the manifest name.

          DO NOT TOUCH (verified in scope, flag if tempted): CLM-030's
          TestProvisioning_SubstantivenessPackNotEmbeddedNorTestdata in this same file is
          unaffected — v1.2.5 already gave CLM-030 its `subject: cmd/backstop` and its name and
          body are honest. The E2E harness (cmd/backstop/gate_substantiveness_e2e.go) and the
          CLM-032/033/034 tests stay LOCAL-sourced: v1.2.4 explicitly restated that a local source
          remains the right choice for a hermetic E2E workspace, and broadening them is scope creep
          against claims that were not amended.

          RED-PROOF BEFORE MOVING ON: run this plan's test_command and observe the git-source arm
          actually exercising a clone (the redirect assertion is the receipt). A remote arm that
          was never observed doing real work is the same vacuous green this spec exists to prevent.
        files:
          - cmd/backstop/gate_substantiveness_provisioning_test.go
        claims:
          - CLM-031
        depends_on:
          - TASK-463
        test_names:
          - TestProvisioning_SubstantivenessInstalledViaDistributionPath_LocalOrGit_DeclaredAndLocked
      - id: TASK-551
        type: refactor
        title: "Delete the superseded local-only test and reconcile the file's local-only framing"
        description: |
          With both arms proven under the new name, remove what they supersede.

            (1) DELETE TestProvisioning_SubstantivenessInstalledAsLocalPack_DeclaredAndLocked and
                its doc comment. Its local-source substance now lives in the "local-source" subtest;
                leaving it would mean two functions asserting the same thing, one of them under a
                name SPEC-037 v1.2.7 no longer mandates.
            (2) CORRECT THE FILE-HEADER DOC COMMENT (top of
                gate_substantiveness_provisioning_test.go), which currently reads that backstop-core
                "dogfood-installs it into itself as a LOCAL pack … (declared `local` + locked,
                VerifyLock passes without a remote artifact)". That is the pre-amendment claim
                restated as fact; rewrite it to the amended one — installed and resolvable through
                the standard distribution path, either source type. Leaving it makes the file
                contradict the test directly beneath it, which is the same defect this phase exists
                to close, one comment lower.
            (3) PROVE THE OLD NAME SURVIVES NOWHERE IN CODE: grep the tree for
                SubstantivenessInstalledAsLocalPack. The only surviving hits permitted after this
                phase are HISTORICAL PROSE that is SUPPOSED to name it, and the enumeration is
                exhaustive on purpose — anything outside it is a half-landed rename:
                  - SPEC-037's Version History residue prose: the v1.2.4 OPEN FOLLOW-ON paragraph,
                    the v1.2.5 "Known residue, deliberately NOT fixed here" paragraph, the v1.2.6
                    "Residue unchanged" paragraph, and the new v1.2.7 entry recording the rename
                    (which necessarily names both the old and the new function).
                  - This plan's own prose: the notes section CLM-031 AMENDMENT RECONCILIATION, and
                    TASK-460's historical record plus its [SUPERSEDED IN PART BY PHASE 6a] pointer.
                  - Agent memory under .claude/agent-memory/ (spec-reviewer's SPEC-037 notes).
