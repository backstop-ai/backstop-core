  # ═══════════════════════════════════════════════════════════════════════
  # Phase 4: SPEC-054 amendment + comprehensive gate verification
  # ═══════════════════════════════════════════════════════════════════════
  - id: phase-4
    name: "Phase 4: SPEC-054 Amendment via /spec and Comprehensive Gate Verification"
    tasks:
      - id: TASK-008
        type: documentation
        title: "SPEC-054 — pin insert's placement semantics and state the direct-mode-only CLI scope"
        description: |
          SPEC-054 is `implemented` at spec_version 1.5.0 and currently describes
          WHAT an insert splices while saying nothing about WHERE relative to line
          boundaries (spec:275, :383-385, :1208, and the `Op` contract note at
          :996). It is equally silent on whether `backstop recipe apply` is
          direct-mode-only. Both positions ship in this change, so the spec moves
          in the SAME commit — a documentation-only amendment, spec_version
          bumped, status stays `implemented` (the convention the sibling plan
          used at v1.5.0).

          ROUTE THIS THROUGH THE SPEC AGENT — do NOT hand-edit the spec file
          (CLAUDE.md: never hand-edit artifacts). Dispatch /spec (spec-author)
          with these instructions:

            * REQ TEXT for insert (spec:275 and the REQ-002 op description at
              :67). "An insert op inserts the declared snippet at the declared
              anchor" is the sentence that left Gap 3 open. Extend it to state
              the placement: the snippet is spliced at the START OF THE LINE
              FOLLOWING the line containing the anchor match's last byte; it is
              spliced VERBATIM (leading indentation preserved) and newline-
              terminated (exactly one '\n' appended iff it lacks one); when the
              anchor's line is the file's last and is unterminated, that line is
              terminated first. Name ISSUE-081 Gap 3 and the decision date
              (2026-08-11) as the source.

            * `Op` CONTRACT NOTE (spec:996). Snippet currently rides along
              unqualified. Add the placement contract to it in the same voice the
              Fragment clause now uses, including the four consequences a pack
              author must be able to predict: a leading newline in Snippet is a
              deliberate blank line (never stripped), an empty snippet is a blank
              line, a multi-line anchor is governed by its LAST line, and N
              inserts at one anchor stack at the same point so the LAST to run
              lands nearest the anchor.

            * OP-FAMILY TABLE (spec:1208). "snippet at declared anchor" becomes
              "snippet on its OWN LINE following the anchor's line", with the
              claim ids the new tests carry.

            * CLM-011 (spec:381-385) — the mandated test stays
              TestApply_InsertOp_AtAnchor, but its text must stop being
              satisfiable by a presence check: restate it as the snippet landing
              at the anchor with the EXACT resulting bytes asserted. Keep the id.

            * NEW CLAIMS, mandating the delivered test names so the traceability
              dimensions bind spec to tests:
                - mid-line anchor lands on the following line, captured-fixture
                  driven —
                  TestApply_InsertOp_MidLineAnchorLandsOnTheFollowingLine;
                - verbatim snippet + exactly-one-newline termination —
                  TestApply_InsertOp_SnippetNewlineTerminationIsExactlyOne;
                - a leading-newline snippet keeps its blank line, an empty
