          1. THE TARGET CAPTURE — `insert/target.json`.
             Copy, BYTE-FOR-BYTE, a REAL file out of a REAL project that carries
             a list/array opened on its own line (the anchor shape ISSUE-081's
             sweep used).

             TWO CONSTRAINTS ON WHICH REAL FILE YOU PICK — both are correctness
             preconditions, not preferences, so check them BEFORE you capture:
               (a) the array must be OPENED on its own line, so that line can
                   serve as the anchor line;
               (b) that array must carry AT LEAST ONE ENTRY on a line AFTER the
                   anchor line, surviving the splice.
             (b) is what makes the fixture work at all. The snippet these
             fixtures use is the comma-carrying entry form (`    "live-entry",`),
             and a trailing comma is only VALID JSON when something follows it —
             an array captured as `[]`, or one opened and closed with nothing
             between, yields an invalid document the moment the snippet is
             spliced, and the expected file could not be valid JSON as step 3
             requires. It is also what makes placement FALSIFIABLE in this
             corpus: the spliced entry must land BEFORE the surviving entry, so
             an applier that appended at EOF or spliced inline is caught by
             position and not merely by well-formedness. This is the same
             reasoning TASK-002 and TASK-004 apply to the committed fixtures —
             it holds identically here.
             If the file you would otherwise capture has an empty array, capture
             a DIFFERENT real file that satisfies both constraints. Do NOT edit a
             captured file to add an entry: a hand-edited capture is not a
             capture, and the whole point of the corpus is that the bytes came
             from somewhere real.

             Prefer the standing capture-origin project already
             named in CAPTURE-SOURCE-create.md; if it is unavailable to you,
             capture from a real committed file in THIS repository instead and
             say which, in the capture source doc. Do NOT hand-author it and do
             NOT derive it from the applier's output. Record repo, real path,
             commit sha and the sha256 of the captured bytes.
