  DESIGN DECISION 2 (made at planning time — SDLC-MEDIATED CLI REACHABILITY)
  ═══════════════════════════════════════════════════════════════════════════
    CHOSEN: **`backstop recipe apply` is DIRECT-MODE-ONLY BY DESIGN.**
    SDLC-mediated mode is a LIBRARY-ONLY entry point for plan-driven callers.

  Rationale: REQ-003 already says injection sites come from a plan/agent driving
  the apply, not from an operator at a terminal — a site override supplied by
  hand at the CLI has no artifact behind it and no traceability to a plan, which
  is the whole point of the mediated mode. The position requires NO code change:
  `cmd/backstop/recipe_apply.go:246` already hardcodes `Mode: recipe.ModeDirect`
  and never sets `InjectionSites`. What was missing was the STATEMENT, so the
  gap keeps being rediscovered as a possible bug.

  BUT A STATED POSITION IN PROSE IS NOT FALSIFIABLE, so this plan does one thing
  beyond documentation: a CLI-surface guard test that goes RED if anyone wires a
  mode selector or an injection-site input onto the shipped command without
  revisiting the position. That converts a paragraph into a tripwire, at the cost
  of one small test file. No production code changes for this decision.

