  - id: phase-3
    name: "Phase 3: TDD Green — applyInsert Splices After the Anchor's Line"
    tasks:
      - id: TASK-006
        type: implementation
        title: "pkg/recipe/apply.go — applyInsert splices at the start of the line following the anchor's line, snippet verbatim and newline-terminated"
        description: |
          Make TASK-003's and TASK-004's tests pass. The change is confined to
          the splice computation in `applyInsert` (apply.go:639-683; today's
          splice is the two lines at :674-675).

          Implement EXACTLY the pinned semantics from the plan notes — re-read
          them before writing; every clause exists because a plausible
          alternative is silently wrong:

              anchorEnd := anchorAt + len(site.anchor)
              // the anchor's line ends at the first newline at or after the
              // anchor's LAST matched byte; a multi-line anchor is therefore
              // governed by its final line
              lineBreak := strings.IndexByte(content[anchorEnd:], '\n')
              spliceAt  := anchorEnd + lineBreak + 1
              // when the anchor's line is the file's last and is unterminated,
              // terminate it first, then splice at the new end of file
              // snippet: verbatim, plus exactly one '\n' iff it lacks one

          Constraints:
            * The anchor MATCH is unchanged — `strings.Index`, first occurrence.
              Do not switch to a line-wise scan, and do not "improve" matching.
            * NO trimming, NO de-indenting, NO stripping of a leading newline
              from the snippet. TASK-003 pins all three; a normalization that
              looks helpful fails them.
            * Do NOT add a special case for an empty snippet. The pinned behavior
              (a single blank line) is the consistent consequence of the general
              rule and is asserted; a branch here would be an unstated policy.
            * The injection-limit path (absent anchor → fail loud with the
              declared `manual:` VERBATIM) is untouched, as is every substitution
              step above the splice.
            * Do NOT touch applyMerge, renderPayload, applyTransform, siteFor, or
              pkg/recipe/substitute.go (the last is PLAN-ISSUE-110's surface).

          DOCUMENT THE CONTRACT AT THE CALL SITE. `applyInsert`'s doc comment must
          state the pinned semantics in full — the splice point, verbatim snippet
          bytes, the newline-termination rule, the unterminated-last-line case,
          the multi-line-anchor rule, the same-point stacking of repeated inserts
          — and name ISSUE-081 Gap 3 as where the decision was made. The whole
          reason this shipped ambiguous is that the code described WHAT it
          spliced and never WHERE; a reader must not have to re-derive it from
          the arithmetic.

          After the change, run `go test ./pkg/recipe/... -race -count=1` and
          report the actual output. Fix real failures in THIS task's file; if a
          test's expectation is genuinely wrong, say so rather than reaching into
          a file TASK-003 or TASK-004 owns.
