  ═══════════════════════════════════════════════════════════════════════════
  DESIGN DECISION 1 (made at planning time — INSERT PLACEMENT SEMANTICS)
  ═══════════════════════════════════════════════════════════════════════════
  ISSUE-081 Gap 3 left two readings equally consistent with SPEC-054's wording
  and took no position. THIS PLAN TAKES ONE.

    CHOSEN: **new-line-after-anchor-line** (the issue's second option).

  PINNED SEMANTICS — the whole of it, so nothing is left to a reader's intuition
  a second time:

    1. The anchor match is unchanged: the FIRST occurrence of the substituted
       anchor in the target (`strings.Index`). An absent anchor still hits the
       injection limit and fails loud with the op's declared `manual:` VERBATIM
       (REQ-011 / CLM-053) — untouched.
    2. The SPLICE POINT is the START OF THE LINE FOLLOWING the line that contains
       the anchor match's LAST byte. Formally:
           anchorEnd := anchorAt + len(anchor)
           nl        := index of the first '\n' at or after anchorEnd
           spliceAt  := nl + 1                       (when nl exists)
       If NO newline follows (the anchor's line is the file's last line and is
       unterminated), the applier TERMINATES that line first ('\n' appended) and
       splices at the new end of file, so the snippet still lands on its own line
       and the file ends newline-terminated.
    3. The snippet is spliced VERBATIM — every byte the author declared, leading
       indentation included. There is NO trimming, NO de-indenting, and NO
       stripping of a leading newline.
    4. The snippet is NEWLINE-TERMINATED: exactly one '\n' is appended IF AND
       ONLY IF the snippet does not already end with one. A snippet that already
       ends in '\n' never gains a second.
    5. Consequences that follow from 3+4 and are pinned as behavior, not
       accidents:
         * a snippet carrying its OWN leading '\n' yields a deliberate BLANK LINE
           between the anchor's line and the snippet (the author asked for it);
         * a snippet that is EMPTY after substitution yields a single blank line
           following the anchor's line;
         * a MULTI-LINE snippet lands as a block, its interior bytes untouched;
         * an anchor whose matched text SPANS lines is governed by the line
           containing its LAST matched byte;
         * N inserts sharing one anchor each compute the SAME splice point (a
           splice below the anchor's line never moves the anchor's line), so the
           LAST op to run ends up NEAREST the anchor — the same declared-order
           observability the current suite already relies on, preserved in kind.

  WHY (b) AND NOT (a) — the reasoning, stated for review rather than buried:

    * The issue's own live evidence. The 2026-07-26 sweep author wrote the
      natural thing (anchor `"registrations": [`, snippet `    "live-entry",`)
      and got `"registrations": [    "live-entry",` on one line. A default that
      surprises the first person to use it, in the first realistic recipe, is the
      wrong default — and "document it and let authors compensate with a leading
      newline in Snippet" leaves every future author to rediscover the same trap
      through trial, which is the exact complaint ISSUE-081 was filed about.
    * The insert family is the LINE/TEXT tool; `transform` is the STRUCTURE tool.
      A recipe that needs a structure-aware, mid-line edit has an op family for
      it — `transform`, which dispatches an AST rewrite to an allowlisted engine.
      Pinning insert to line granularity is a division of labor between families,
      not a lost capability with nowhere to go.
    * It is not a baked-language/tool assumption. A newline is universal text
      structure, not language or toolchain knowledge — no format is parsed, no
      tool is consulted, no language branch is introduced. The thin-executor
      first principle is not in tension with this.

  WHAT (b) COSTS — stated plainly, because it IS a cost and the reviewer should
  weigh it, not discover it:

    * MID-LINE SPLICING BECOMES UNREACHABLE THROUGH `insert`. Under (a) an author
      could express both placements (inline by default, next-line by writing a
      leading '\n'); under (b) only the next-line placement is expressible. This
      is a deliberate narrowing.
    * It has a concrete cost IN THIS REPO, swept against the tree 2026-08-11
      (re-check it rather than taking it on trust): the committed `starter` and
      `templated-sites` recipes splice
      `'"{{ app_name }}"'` at anchor `'"registrations": ['` into a JSON document
      whose array is `[]` ON ONE LINE. Under (b) that produces INVALID JSON, and
      `TestApply_CommittedFixtureRecipe_SubstitutesEveryTemplatedSite` (ISSUE-079's
      crux regression) json-decodes that output. The fixtures therefore MIGRATE —
      the seeded document's array becomes multi-line with an existing entry, and
      the declared snippet becomes the indented, comma-carrying form
      `'    "{{ app_name }}",'`. That migration is not incidental churn: it turns
      the committed corpus into the EXACT shape ISSUE-081's sweep used, and the
      surviving seeded entry makes placement falsifiable (the spliced entry must
      precede it).
    * If mid-line splicing is later shown to be needed, the answer is a DECLARED
      placement on the op (an authoring-surface addition, e.g. `placement:
      inline|after-line`), filed as its own issue with its own evidence. It is
      deliberately NOT smuggled in here: ISSUE-081 poses a binary choice, and
      inventing a third option at plan time would decide an authoring-surface
      question the issue never raised.

  NOT A JUSTIFICATION, recorded to prevent a false one being inherited: SPEC-067
  (the CI recipe pack, in flight, uncommitted) declares NO insert op — checked
  2026-08-11. This decision has no in-flight downstream dependency; it rests on
  the issue's evidence alone.

