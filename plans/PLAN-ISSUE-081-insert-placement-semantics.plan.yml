  THREE artifacts, and the distinction between them is load-bearing:
    * the TARGET capture — a REAL anchor-bearing file copied byte-for-byte out of
      a real project, never hand-authored;
    * the OBSERVED capture — the bytes the CURRENT (pre-fix) applier really
      produces over that target, captured by RUNNING it in the red phase. This
      reproduces ISSUE-081's sweep result as evidence, and the post-fix test
      asserts those bytes are NO LONGER produced. It is the falsifier: an
      implementation that changed nothing fails against it.
    * the EXPECTED file — the intended post-fix bytes, authored in the RED task
      as the SPECIFICATION of the pinned semantics (it is what the test demands
      before any code exists). It is NEVER regenerated from the fixed applier's
      output; TASK-006 must make the applier match the file, not the file match
      the applier. If they disagree, the disagreement is the finding.

