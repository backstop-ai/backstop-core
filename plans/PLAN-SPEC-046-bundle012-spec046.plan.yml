notes: |
  Implements SPEC-046 (BUNDLE-012 Spec Seed 3, Pillar B): finish the thin-executor
  mission on the gate's TOOLCHAIN-SELECTION spine by deleting the last place backstop
  bakes "a project has ONE language." Three coupled moves: (1) DELETE the
  `language:`-derived toolchain BRIDGE (REQ-001/002); (2) FULLY RETIRE the `Config.Language`
  field (REQ-003); (3) REHOME the cosmetic stack label off `cfg.Language` onto the
  declared toolchain-pack-NAME set, resolving the bundle's SQ-1 (REQ-004).

  ════════════════════════════════════════════════════════════════════════════
  PHASE ORDER IS DICTATED BY THE COMPILE FENCE — DELETE THE FIELD LAST.
  ════════════════════════════════════════════════════════════════════════════
  `cfg.Language` has FIVE non-test readers (verified on this branch): `gateLanguage`
  (cmd/backstop/gate.go:268/271), the `gateConfig` fallback seed (gate.go:294
  `&config.Config{Language:"go"}`), the `deriveCapabilityState` coverage-arm message
  (gate.go:387-388), the `code_check.go` assignment (code_check.go:134), and `stackLabel`
  (pkg/gate/traceability_polarity.go:188-192) — plus the e2e yml literal and test
  fixtures. Deleting `Config.Language` (REQ-003) is a COMPILE FENCE: every reader must be
  de-language'd FIRST, or `cmd/backstop`/`pkg/gate` fail to build. So the field deletion
  is the LAST code move, after the bridge deletion removes `gateLanguage` (Phase 2) AND
  the stack-label rehome removes `stackLabel`'s read + threads the label (Phase 3). The
  Phase order is therefore: bridge (P2) → rehome (P3) → field deletion (P4), NOT the
  spec's REQ numeric order. The remaining cmd/backstop readers (gateConfig fallback,
  deriveCapabilityState message, code_check assignment, e2e literal) are de-language'd in
  P4 immediately before the field is removed.

  ════════════════════════════════════════════════════════════════════════════
  `cmd/backstop/gate.go` IS THE SERIALIZED SPINE — D-081 CHAIN ACROSS PHASES.
  ════════════════════════════════════════════════════════════════════════════
  Three of the four impl moves edit gate.go (bridge deletion P2; stack threading P3;
  reader de-language P4). They are file-exclusive (D-081) so they are CHAINED via
  depends_on across phases: TASK-004 (P2 gate.go) → TASK-010 (P3 gate.go) → TASK-014
  (P4 gate.go). No two gate.go tasks are ever parallel-eligible.

  ════════════════════════════════════════════════════════════════════════════
  CROSS-PLAN DEPENDENCIES ON cmd/backstop/gate.go — NOT ALL SEAMS ARE SYMMETRIC.
  ════════════════════════════════════════════════════════════════════════════
  gate.go is co-edited by FOUR BUNDLE-012 seeds, but the relationships are NOT
  symmetric. One is a HARD BUILD-ORDER PREREQUISITE; the other two are genuinely
  disjoint co-edits that merely share the file. Do NOT lump them as a single
  "serialize at implement time" seam.

  ─── HARD PREREQUISITE (must LAND FIRST, not just serialize) ───
    - SPEC-043 (PLAN-SPEC-043) introduces `mergeSourceClassifier`, the `SourceClassifier`
      type, and `SourceClassifier.HasSourceGlobs()`. THESE SYMBOLS DO NOT EXIST ON THIS
      BRANCH (verified: absent from cmd/backstop + pkg/gate). THIS PLAN HARD-DEPENDS on
      them: TASK-002 (CLM-022 classifier-survival guard), TASK-004 (CLM-022 fence the
      declared-set call site), and TASK-007 (CLM-018/CLM-019 corroborating-only /
      no-fork) all REFERENCE them. Therefore PLAN-SPEC-043 MUST be MERGED before this
      plan's Phase 2 and Phase 3 execute — a co-edit serialization is INSUFFICIENT; the
      classifier must already be present in the tree or Phase 2/3 cannot compile or
      assert. IMPLEMENT-PHASE SEQUENCING: gate PLAN-SPEC-043 → main BEFORE dispatching
      TASK-002/004/007. (Phase 1 fixtures and the pkg/gate/pkg/config moves that do not
      touch the classifier are not 043-blocked, but the gate.go classifier-fence tasks
      are.)

  ─── DISJOINT CO-EDITS (share the file, serialize at implement time, no land-order) ───
    - SPEC-045 edits `goFilePackageMatchesTarget` (disjoint region, no symbol this plan
      reads — pure merge-time serialization on the shared file).
    - SPEC-044 changes the coverage `(path, metric)` record model (disjoint axis on the
      coverage call chain — composes, see B2 below; no land-order dependency).
    - THIS seed removes `bridged` from `coverageRecordsProducer` / `toolchainEnforcementStatus`
      / `countToolchainPacks` / the dispatch set / the early return; adds
      `declaredToolchainStackLabel`; threads `stack` through `wrapTraceabilityStep` →
      `deriveCapabilityState`.
  B2 RECONCILIATION (load-bearing): the bridge deletion is SCOPED to the bridge auto-load
  + the `bridged` threading ONLY. SPEC-043's `mergeSourceClassifier`/`SourceClassifier`
  SURVIVE and MUST NOT be orphaned — SPEC-043 itself repoints them onto the DECLARED
  toolchain-pack set; this seed does NOT edit SPEC-043's classifier call site, it only
  FENCES the `bridged` removal so the declared-pack manifest set (`loadInstalledPacks`)
  stays in scope at that call site. CLM-022 guards both symbols surviving + the call site
  fed the declared set. The `coverageRecordsProducer` signature change (dropping `bridged`)
  COMPOSES with SPEC-043's classifier-param add and SPEC-044's record-model change on the
  coverage call chain (three orthogonal axes); reconcile in the final cross-consistency pass.

  ════════════════════════════════════════════════════════════════════════════
  DOGFOOD MUST STAY GREEN THROUGHOUT (Sharp Edge: load-bearing risk).
  ════════════════════════════════════════════════════════════════════════════
  backstop-core already declares `backstop/go-toolchain` in `backstop.yml packs:`, so
  deleting the bridge keeps go-toolchain in its own gate via the DECLARED-pack path with
  NO `language:` field. CLM-007 pins this no-regression as a LIVE-gate wiring fact
  ([[feedback_integration_gap]] — proven over the live gate, not only a unit). Stripping
  `language: go` from the dogfood backstop.yml (P4) must NOT drop go-toolchain. Every
  phase's verification + the final `backstop gate` confirm the dogfood stays GREEN.

  SQ-1 RESOLUTION (REQ-004, owned here): the polyglot stack label is the joined SET of
  DECLARED toolchain-pack NAMES — NO single-pack precedence, NO overlap winner. The
  "unspecified" empty fallback is driven by ONE authoritative signal: the empty DECLARED
  toolchain-pack-NAME set (the label is name-derived). SPEC-043's
  `SourceClassifier.HasSourceGlobs()` is CORROBORATING ONLY and can diverge from the
  pack-name set; it MUST NOT be the authoritative driver. The polyglot glob UNION is read
  ONLY through SPEC-043's single `SourceClassifier` (reused, never forked) — the only NEW
  symbol is `declaredToolchainStackLabel` (a name-set helper, not a glob matcher).

