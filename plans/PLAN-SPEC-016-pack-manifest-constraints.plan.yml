      - id: TASK-005
        type: test
        title: "Write tests for layer 3 input_scope and validator (REQ-004)"
        description: |
          Add tests to pkg/pack/validate_layer3_fields_test.go with package pack_test:
            - TestValidateLayer3_SingleFileWithValidator: input_scope single-file
              with validator accepted (CLM-019)
            - TestValidateLayer3_MultiFileWithValidator: input_scope multi-file
              with validator accepted (CLM-020)
            - TestValidateLayer3_MissingInputScope: missing input_scope rejected (CLM-021)
            - TestValidateLayer3_MissingValidator: missing validator rejected (CLM-022)
            - TestValidateLayer3_InvalidInputScope: invalid input_scope rejected (CLM-023)
            - TestValidateLayer1_WithInputScope: layer 1 with input_scope rejected (CLM-024)
            - TestValidateLayer2_WithInputScope: layer 2 with input_scope rejected (CLM-025)
            - TestValidateLayer1_WithValidator: layer 1 with validator rejected (CLM-026)
            - TestValidateLayer2_WithValidator: layer 2 with validator rejected (CLM-027)
        files:
          - pkg/pack/validate_layer3_fields_test.go
        claims:
          - CLM-019
          - CLM-020
          - CLM-021
          - CLM-022
          - CLM-023
          - CLM-024
          - CLM-025
          - CLM-026
          - CLM-027
        depends_on:
          - TASK-001

      - id: TASK-006
        type: implementation
        title: "Implement content type and layer field validation passes"
        description: |
          Implement in pkg/pack/validate_manifest.go:

          Pass 1 — validateContentTypes(m *Manifest) []ValidationError:
            - Allowlist: ruleset, scaffolds, sdk, contracts, test_patterns,
              ast_checks, rubrics
            - Reject unknown keys
            - Enforcement packs: reject scaffolds, sdk

          Pass 2 — validateLayerFields(m *Manifest) []ValidationError:
            - Layer 2: require rule + standard; reject on layer 1, 3
            - Layer 3: require category, input_scope, validator; reject on layer 1, 2
            - Category validation: presence/structural accepted without justification;
              other requires non-empty justification; missing/invalid category rejected
            - Prohibit rule field on layer 1 and 3
            - Prohibit category, input_scope, validator on layer 1 and 2

          Both pass functions are called from ValidateManifest, which accumulates
          all errors (does not stop at first error).
        files:
          - pkg/pack/validate_manifest.go
        claims:
          - CLM-001
          - CLM-002
          - CLM-003
          - CLM-004
          - CLM-005
          - CLM-006
          - CLM-007
          - CLM-008
          - CLM-009
          - CLM-010
          - CLM-011
          - CLM-012
          - CLM-013
          - CLM-014
          - CLM-015
          - CLM-016
