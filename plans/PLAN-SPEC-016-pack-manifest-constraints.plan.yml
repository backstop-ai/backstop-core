---
plan_id: PLAN-SPEC-016
spec_id: SPEC-016
spec_version: 1.0.0
created: "2026-04-14"
status: draft
target_repo: backstop-core
target_module: github.com/bmanson/backstop-core
test_command: "go test ./pkg/pack/ -race -coverprofile=cover.out"
coverage_threshold: 90

notes: |
  Implements constraint validation and layout rules for pack manifests.
  This spec consumes SPEC-013 types (Manifest, Rule, Scaffold, ToolConfigEntry)
  from pkg/pack/manifest.go and adds ValidateManifest + ExpectedLayout in
  pkg/pack/validate_manifest.go.

  All implementation touches a single file (validate_manifest.go), so phases
  must be strictly sequential. Each phase follows the TDD cycle:
  test -> implementation -> verification.

  Phase 1: Setup (ValidationError type, test helpers)
  Phase 2: Content types + layer field constraints (27 claims)
  Phase 3: Security + tool_config + co-occurrence + fixture proof (16 claims)
  Phase 4: Directory layout + fixture naming (8 claims)
  Phase 5: Final comprehensive verification

  Assumes SPEC-013 types exist in pkg/pack/manifest.go.

phases:
  # ═══════════════════════════════════════════════════════════════════════
  # Phase 1: Setup — ValidationError type and test helpers
  # ═══════════════════════════════════════════════════════════════════════
  - id: phase-1
    name: "Phase 1: Setup — Foundation Types"
    description: |
      Establish the ValidationError type and test helper functions that all
      subsequent test and implementation tasks depend on.
    tasks:
      - id: TASK-001
        type: setup
        title: "Scaffold ValidationError type and test helpers"
        description: |
          Create pkg/pack/validate_manifest.go with the ValidationError struct
          (Field, Message, Rule string) and the ValidateManifest function
          signature returning []ValidationError. The function body should be
          a stub returning nil. Also create ExpectedLayout stub returning nil.

          Create pkg/pack/validate_manifest_test.go with package pack_test and
          common test helper functions:
            - makeMinimalManifest() *Manifest — returns a valid enforcement
              manifest with one layer 1 rule that has risk_class, claims, and
              fixtures. Used as a baseline across all tests.
            - hasError(errs []ValidationError, rule string) bool — checks if
              any error matches the given Rule string.
            - requireError/requireNoError helpers for cleaner assertions.

          These helpers avoid duplication across the 50+ test functions.
        files:
          - pkg/pack/validate_manifest.go
          - pkg/pack/validate_manifest_test.go
        claims:
          - CLM-001
        depends_on: []

  # ═══════════════════════════════════════════════════════════════════════
  # Phase 2: Content Types and Layer Field Constraints (REQ-001 to REQ-004)
  # ═══════════════════════════════════════════════════════════════════════
  - id: phase-2
    name: "Phase 2: Content Types and Layer Field Constraints"
    description: |
      TDD cycle for Pass 1 (content type allowlist) and Pass 2 (layer-specific
      field enforcement) covering REQ-001 through REQ-004. This is the largest
      group of claims (27 claims) covering the Layer Field Requirements Matrix.
    tasks:
      - id: TASK-002
        type: test
        title: "Write tests for content type validation (REQ-001)"
        description: |
          Add tests to pkg/pack/validate_content_test.go with package pack_test:
            - TestValidateContent_EnforcementRulesetOnly: enforcement pack with
              only ruleset in content block is accepted (CLM-001)
            - TestValidateContent_EnforcementWithScaffolds: enforcement pack
              declaring scaffolds is rejected (CLM-002)
            - TestValidateContent_EnforcementWithSDK: enforcement pack declaring
              sdk is rejected (CLM-003)
            - TestValidateContent_CodeWithRulesetAndScaffolds: code pack with
              ruleset and scaffolds is valid (CLM-004)
            - TestValidateContent_UnknownContentType: content block with unknown
              key is rejected (CLM-005)

          Use makeMinimalManifest from TASK-001 as baseline, modifying archetype
          and content fields per test case. All tests should fail (red phase).
        files:
          - pkg/pack/validate_content_test.go
        claims:
          - CLM-001
          - CLM-002
          - CLM-003
          - CLM-004
          - CLM-005
        depends_on:
          - TASK-001

      - id: TASK-003
        type: test
        title: "Write tests for layer 2 field constraints (REQ-002)"
        description: |
          Add tests to pkg/pack/validate_layer2_test.go with package pack_test:
            - TestValidateLayer2_BothFields: layer 2 rule with both rule and
              standard fields is accepted (CLM-006)
            - TestValidateLayer2_MissingRuleField: layer 2 rule missing rule
              field is rejected (CLM-007)
            - TestValidateLayer2_MissingStandard: layer 2 rule missing standard
              field is rejected (CLM-008)
            - TestValidateLayer1_WithRuleField: layer 1 rule declaring rule
              field is rejected (CLM-009)
            - TestValidateLayer3_WithRuleField: layer 3 rule declaring rule
              field is rejected (CLM-010)

          Each test constructs a manifest with rules at specific layers and
          verifies field presence/absence enforcement.
        files:
          - pkg/pack/validate_layer2_test.go
        claims:
          - CLM-006
          - CLM-007
          - CLM-008
          - CLM-009
          - CLM-010
        depends_on:
          - TASK-001

      - id: TASK-004
        type: test
        title: "Write tests for layer 3 category validation (REQ-003)"
        description: |
          Add tests to pkg/pack/validate_layer3_cat_test.go with package pack_test:
            - TestValidateLayer3Category_Presence: category presence accepted
              without justification (CLM-011)
            - TestValidateLayer3Category_Structural: category structural accepted
              without justification (CLM-012)
            - TestValidateLayer3Category_OtherWithJustification: category other
              with justification accepted (CLM-013)
            - TestValidateLayer3Category_OtherMissingJustification: category other
              missing justification rejected (CLM-014)
            - TestValidateLayer3Category_Missing: missing category rejected (CLM-015)
            - TestValidateLayer3Category_Invalid: invalid category rejected (CLM-016)
            - TestValidateLayer1_WithCategory: layer 1 with category rejected (CLM-017)
            - TestValidateLayer2_WithCategory: layer 2 with category rejected (CLM-018)

          Sharp edge: verify that empty string justification ("") is rejected,
          not just absent justification.
        files:
          - pkg/pack/validate_layer3_cat_test.go
        claims:
          - CLM-011
          - CLM-012
          - CLM-013
          - CLM-014
          - CLM-015
          - CLM-016
          - CLM-017
          - CLM-018
        depends_on:
