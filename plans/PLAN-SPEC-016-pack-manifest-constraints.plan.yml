  # ═══════════════════════════════════════════════════════════════════════
  # Phase 3: Security, ToolConfig, Co-occurrence, Fixture Proof
  # ═══════════════════════════════════════════════════════════════════════
  - id: phase-3
    name: "Phase 3: Security, ToolConfig, Co-occurrence, Fixture Proof"
    description: |
      TDD cycle for Pass 4 (security bypass_attempt), Pass 5 (tool_config
      traceability), Pass 6 (bidirectional co-occurrence), and Pass 7
      (fixture proof). Depends on phase 2 completion since implementation
      touches the same validate_manifest.go file.
    tasks:
      - id: TASK-008
        type: test
        title: "Write tests for security bypass_attempt (REQ-005)"
        description: |
          Add tests to pkg/pack/validate_security_test.go with package pack_test:
            - TestValidateSecurityFixtures_WithBypass: security-class rule with
              at least one bypass_attempt fixture accepted (CLM-028)
            - TestValidateSecurityFixtures_NoBypass: security-class rule with no
              bypass_attempt fixture rejected (CLM-029)
            - TestValidateSecurityFixtures_NonSecurityNoBypass: non-security rule
              without bypass_attempt accepted (CLM-030)

          Construct manifests with rules at various risk_class values and
          fixture configurations.
        files:
          - pkg/pack/validate_security_test.go
        claims:
          - CLM-028
          - CLM-029
          - CLM-030
        depends_on:
          - TASK-007

      - id: TASK-009
        type: test
        title: "Write tests for tool_config traceability (REQ-006)"
        description: |
          Add tests to pkg/pack/validate_toolconfig_test.go with package pack_test:
            - TestValidateToolConfigTrace_Standalone: tool_config with id field
              is traceable (CLM-031)
            - TestValidateToolConfigTrace_Supporting: tool_config with required_by
              is traceable (CLM-032)
            - TestValidateToolConfigTrace_NeitherIdNorRequiredBy: tool_config
              with neither id nor required_by is rejected (CLM-033)

          Sharp edge: standalone tool_config is simultaneously a tool config and
          a layer 1 rule — test that both validation paths apply.
        files:
          - pkg/pack/validate_toolconfig_test.go
        claims:
          - CLM-031
          - CLM-032
          - CLM-033
        depends_on:
          - TASK-007

      - id: TASK-010
        type: test
        title: "Write tests for bidirectional co-occurrence (REQ-013)"
        description: |
          Add tests to pkg/pack/validate_cooccurrence_test.go with package pack_test:
            - TestValidateCoOccurrence_CodePackValid: code pack with scaffolds
              and rules properly paired is accepted (CLM-044)
            - TestValidateCoOccurrence_ScaffoldNoPairedRule: code pack scaffold
              without any paired rule is rejected (CLM-045)
            - TestValidateCoOccurrence_RuleNoPairedContent: code pack rule
              without pairs_with scaffold or SDK is rejected (CLM-046)
            - TestValidateCoOccurrence_EnforcementWithScaffolds: enforcement pack
              with scaffolds rejected by co-occurrence pass independently (CLM-047)
            - TestValidateCoOccurrence_EnforcementWithSDK: enforcement pack with
              sdk rejected by co-occurrence pass independently (CLM-048)

          Sharp edge: both directions of co-occurrence must be tested independently.
          Sharp edge: enforcement pack prohibition must be enforced in co-occurrence
          pass independently from content type pass.
        files:
          - pkg/pack/validate_cooccurrence_test.go
        claims:
          - CLM-044
          - CLM-045
          - CLM-046
          - CLM-047
          - CLM-048
        depends_on:
          - TASK-007

      - id: TASK-011
        type: test
        title: "Write tests for fixture proof (REQ-014) and layer 3 isolation (REQ-010)"
        description: |
          Add tests to pkg/pack/validate_proof_test.go with package pack_test:
            - TestValidateFixtureProof_EnforcementWithFixtures: enforcement pack
              rule with claims and fixtures accepted (CLM-049)
            - TestValidateFixtureProof_CodeWithFixtures: code pack rule with
              claims and fixtures accepted (CLM-050)
            - TestValidateFixtureProof_RuleNoClaims: rule without any claims
              is rejected (CLM-051)
            - TestValidateConstraint_Layer3MissingIsolationFields: ValidateManifest
              rejects layer 3 rule missing input_scope or validator (CLM-040)

          CLM-040 tests the constraint check path through ValidateManifest
          specifically (distinct from the direct field validation in REQ-004).
        files:
          - pkg/pack/validate_proof_test.go
        claims:
          - CLM-049
          - CLM-050
          - CLM-051
          - CLM-040
        depends_on:
          - TASK-007

      - id: TASK-012
        type: implementation
        title: "Implement security, tool_config, co-occurrence, and fixture proof passes"
        description: |
          Implement in pkg/pack/validate_manifest.go:

          Pass 4 — validateSecurityFixtures(m *Manifest) []ValidationError:
            - For each rule with risk_class "security", check that at least one
              negative fixture has bypass_attempt: true
            - Non-security rules are skipped

          Pass 5 — validateToolConfigTrace(m *Manifest) []ValidationError:
            - Each tool_config entry must have id (standalone) or required_by
              (supporting). Reject entries with neither.

          Pass 6 — validateCoOccurrence(m *Manifest) []ValidationError:
            - Enforcement packs: reject if scaffolds or sdk declared
            - Code packs: every scaffold must have pairs_with.rules referencing
              at least one rule; every rule must have pairs_with referencing at
              least one scaffold or SDK

          Pass 7 — validateFixtureProof(m *Manifest) []ValidationError:
            - Every rule must have at least one claim
            - Every claim must have fixtures

          Wire all four pass functions into ValidateManifest, accumulating errors.
        files:
          - pkg/pack/validate_manifest.go
        claims:
          - CLM-028
          - CLM-029
          - CLM-030
          - CLM-031
          - CLM-032
          - CLM-033
          - CLM-040
          - CLM-044
          - CLM-045
          - CLM-046
          - CLM-047
          - CLM-048
          - CLM-049
          - CLM-050
          - CLM-051
        depends_on:
          - TASK-008
          - TASK-009
          - TASK-010
          - TASK-011

      - id: TASK-013
        type: verification
        title: "Verify security, tool_config, co-occurrence, and fixture proof tests pass"
        description: |
          Run go test ./pkg/pack/ -run "TestValidateSecurity|TestValidateToolConfig|TestValidateCoOccurrence|TestValidateFixtureProof|TestValidateConstraint" -race -v
          to verify all 16 tests from this phase pass.
        files:
          - pkg/pack/validate_security_test.go
          - pkg/pack/validate_toolconfig_test.go
          - pkg/pack/validate_cooccurrence_test.go
          - pkg/pack/validate_proof_test.go
        claims:
          - CLM-030
          - CLM-033
          - CLM-048
          - CLM-051
        depends_on:
          - TASK-012

  # ═══════════════════════════════════════════════════════════════════════
  # Phase 4: Directory Layout and Fixture Naming
  # ═══════════════════════════════════════════════════════════════════════
  - id: phase-4
    name: "Phase 4: Directory Layout and Fixture Naming"
    description: |
      TDD cycle for ExpectedLayout (REQ-009) and fixture directory naming
      (REQ-008). Depends on phase 3 completion since implementation touches
      validate_manifest.go.
    tasks:
      - id: TASK-014
        type: test
        title: "Write tests for ExpectedLayout and fixture directory naming"
        description: |
          Add tests to pkg/pack/validate_layout_test.go with package pack_test:

          ExpectedLayout tests (REQ-009):
            - TestExpectedLayout_PackYmlAlways: layout always includes pack.yml (CLM-052)
            - TestExpectedLayout_GoModAlways: layout always includes go.mod (CLM-053)
            - TestExpectedLayout_EnforcementWithLayer2: enforcement pack with
              layer 2 rules expects rules/ directory (CLM-036)
            - TestExpectedLayout_WithLayer3: pack with layer 3 rules expects
              validators/ directory (CLM-037)
            - TestExpectedLayout_CodePack: code pack expects scaffolds/ directory (CLM-038)
            - TestExpectedLayout_FixturesAlways: pack always expects
              fixtures/rules/ directory (CLM-039)

          Fixture directory naming tests (REQ-008):
            - TestValidateFixtureDir_MatchesRuleID: fixture directory matching
              rule ID in lowercase is accepted (CLM-034)
            - TestValidateFixtureDir_Mismatch: fixture directory not matching
              rule ID is flagged (CLM-035)

          Sharp edge: ExpectedLayout must use forward slashes consistently
          for portability, not OS path separators.
        files:
          - pkg/pack/validate_layout_test.go
        claims:
          - CLM-034
          - CLM-035
          - CLM-036
          - CLM-037
          - CLM-038
          - CLM-039
          - CLM-052
          - CLM-053
        depends_on:
          - TASK-013

      - id: TASK-015
        type: implementation
        title: "Implement ExpectedLayout and fixture directory naming validation"
        description: |
          Implement in pkg/pack/validate_manifest.go:

          ExpectedLayout(m *Manifest) []string:
            - Always include "pack.yml" and "go.mod"
            - Always include "fixtures/rules/"
            - If any layer 2 rules exist: include "rules/"
            - If any layer 3 rules exist: include "validators/"
            - If archetype is "code": include "scaffolds/"
            - Use forward slashes for all paths

          Pass 8 — validateFixtureDirNaming(m *Manifest) []ValidationError:
            - For each rule, verify the expected fixture directory path
              (fixtures/rules/<lowercase-rule-id>/) matches the rule ID
            - Flag mismatches between rule ID and directory naming

          Wire validateFixtureDirNaming into ValidateManifest.
        files:
          - pkg/pack/validate_manifest.go
        claims:
          - CLM-034
          - CLM-035
          - CLM-036
          - CLM-037
          - CLM-038
          - CLM-039
          - CLM-052
          - CLM-053
        depends_on:
          - TASK-014

      - id: TASK-016
        type: verification
        title: "Verify layout and fixture naming tests pass"
        description: |
          Run go test ./pkg/pack/ -run "TestExpectedLayout|TestValidateFixtureDir" -race -v
          to verify all 8 layout and fixture naming tests pass.
        files:
          - pkg/pack/validate_layout_test.go
        claims:
          - CLM-035
          - CLM-039
          - CLM-053
        depends_on:
          - TASK-015

  # ═══════════════════════════════════════════════════════════════════════
  # Phase 5: Comprehensive Verification
  # ═══════════════════════════════════════════════════════════════════════
  - id: phase-5
    name: "Phase 5: Comprehensive Verification"
    description: |
      Final verification phase. Run the full test suite with race detection
      and coverage measurement. Verify coverage meets the 90% threshold.
    tasks:
      - id: TASK-017
        type: verification
        title: "Full test suite with coverage verification"
        description: |
          Run the complete test suite:
            go test ./pkg/pack/ -race -coverprofile=cover.out -v

          Verify:
            1. All 50 claim tests pass (no failures, no panics)
            2. Coverage meets the 90% threshold for validate_manifest.go
            3. Race detector reports no data races
            4. ValidateManifest accumulates all errors across all passes
               (does not stop at first error)

          Check coverage specifically for validate_manifest.go:
            go tool cover -func=cover.out | grep validate_manifest

          If coverage is below 90%, identify uncovered lines and report
          which claims or passes need additional test coverage.
        files:
          - pkg/pack/validate_manifest.go
          - pkg/pack/validate_manifest_test.go
          - pkg/pack/validate_content_test.go
          - pkg/pack/validate_layer2_test.go
          - pkg/pack/validate_layer3_cat_test.go
          - pkg/pack/validate_layer3_fields_test.go
          - pkg/pack/validate_security_test.go
          - pkg/pack/validate_toolconfig_test.go
          - pkg/pack/validate_cooccurrence_test.go
          - pkg/pack/validate_proof_test.go
          - pkg/pack/validate_layout_test.go
        claims:
          - CLM-001
          - CLM-014
          - CLM-029
          - CLM-040
          - CLM-045
          - CLM-052
        depends_on:
          - TASK-015
          - TASK-016
