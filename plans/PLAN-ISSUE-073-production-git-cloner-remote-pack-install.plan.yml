      - id: TASK-012
        type: implementation
        title: "Green: wire the production cloner, validator and resolver into every pack subcommand"
        description: |
          Close the defect at its source — the CLI entry points.

          NEW cmd/backstop/pack_deps.go:
            - newProductionGitCloner() distribution.GitCloner →
              distribution.NewRealGitCloner().
            - packvalValidator implementing distribution.Validator:
                RunPackCheck(dir) → packval.NewPipeline(dir,
                  packval.PipelineOptions{Mode: "check", Format: "json"}).Run(),
                  returning a *distribution.ValidationError naming the failures
                  when result.Status == "fail".
                RunPackTest(dir) → the same with Mode: "test".
              (Match the mode/format strings the existing pack_check.go /
              pack_test_cmd.go commands use — read them, do not guess.)
            - newProductionVersionResolver() returning a
              distribution.RealVersionResolver fed by the same cloner.
            Expose these as small constructors so
            TestPackCommands_WireProductionGitClonerAndValidator can assert on
            the built options without performing a clone.

          WIRE:
            - cmd/backstop/pack_add.go — AddOptions gains GitCloner + Validator.
              Also map the failure to the right exit code: a git/tooling
              failure (errors.As → *distribution.GitError, or the missing-cloner
              / git-not-installed error) returns &ExitCodeError{Code:
              ExitConfigError} instead of ExitViolations, per the issue's
              "clean exit-2 config/tool error" (CLM-006). A pack VALIDATION
              failure (*distribution.ValidationError) stays ExitViolations —
              that is a real finding, not a config error. CHECK the existing
              cmd/backstop/pack_add_test.go exit-code expectations
              (TestPackAddCommand_ExitCode and friends) and reconcile any that
              assumed exit 1 for a git failure.
            - cmd/backstop/pack_install.go — InstallOptions gains GitCloner
              ONLY. No Validator field exists there and none is added here
              (Design Decision 3). Its nil guard then never fires in production.
            - cmd/backstop/pack_update.go — UpdateOptions gains GitCloner,
              Validator and VersionResolver.
            - cmd/backstop/pack_upgrade.go — UpgradeOptions gains GitCloner and
              Validator.
          Apply the same GitError→exit-2 mapping to install/update/upgrade so
          the four commands behave consistently. Do NOT change resolveGitURL,
          the lockfile schema, local-pack behavior, or any file on the
          do-not-touch list.
        files:
          - cmd/backstop/pack_deps.go
          - cmd/backstop/pack_add.go
          - cmd/backstop/pack_install.go
          - cmd/backstop/pack_update.go
          - cmd/backstop/pack_upgrade.go
        claims:
          - CLM-001
          - CLM-004
          - CLM-006
          - CLM-008
        depends_on:
          - TASK-011

      - id: TASK-013
        type: verification
        title: "Verify the launch bar: remote add, install, update and upgrade really work, offline"
        description: |
          Evidence required — this is the task that decides whether the launch
          blocker is actually lifted:
            1. `go test ./cmd/backstop/... -race` GREEN with all eight TASK-011
