  # ═══════════════════════════════════════════════════════════════════════
  # Phase 3: Nil-dependency guards (parallel with Phase 2 — disjoint files)
  # ═══════════════════════════════════════════════════════════════════════
  - id: phase-3
    name: "Phase 3: Nil-Dependency Guards in add/update/upgrade (no panic, ever)"
    tasks:
      - id: TASK-005
        type: test
        title: "Red: a nil GitCloner/Validator must be a clean error, never a panic"
        description: |
          New test file pkg/pack/distribution/nil_dependency_guard_test.go
          (package distribution_test, reusing the existing add_test.go fixture
          helpers/testdata rather than inventing new ones). Each test calls the
          real exported entry point with a deliberately nil dependency and
          asserts a returned error — the test binary must NOT panic (a panic
          fails the test outright, which IS the red signal today):
            - TestAdd_NilGitCloner_ReturnsCleanErrorNotPanic — Add("acme/x@1.0.0",
              AddOptions{ProjectDir: tmp}) returns a non-nil error whose message
