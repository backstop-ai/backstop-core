          Use table-free explicit tests so each failure names its own command.
        files:
          - pkg/pack/distribution/nil_dependency_guard_test.go
        claims:
          - CLM-004
          - CLM-005
        test_names:
          - TestAdd_NilGitCloner_ReturnsCleanErrorNotPanic
          - TestAdd_GitPackWithNilValidator_ReturnsCleanError
          - TestAdd_LocalPackWithNilValidator_StillSkipsValidation
          - TestUpdate_NilGitCloner_ReturnsCleanErrorNotPanic
          - TestUpgrade_NilGitCloner_ReturnsCleanErrorNotPanic
        depends_on:
          - TASK-001

      - id: TASK-006
        type: implementation
        title: "Green: guard the nil cloner in add/update/upgrade; require a Validator for git packs"
        description: |
          Close the panic surface in the library, mirroring install.go's
          existing good-citizen pattern.
            pkg/pack/distribution/add.go — in the `if !isLocal` branch, BEFORE
              the temp dir is created: if opts.GitCloner == nil return an error
