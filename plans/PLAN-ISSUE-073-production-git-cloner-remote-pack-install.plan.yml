  STRUCTURE:
    Phase 1: Setup — re-verify the defect surface against the live tree.
    Phase 2: RealGitCloner, proven against a real local git repo.
    Phase 3: Nil-dependency guards in add/update/upgrade. Independent of
             Phase 2 (disjoint files) — parallel-eligible.
    Phase 4: Production VersionResolver so `pack update` actually works.
    Phase 5: CLI wiring + the REAL hermetic end-to-end proof for add, install,
