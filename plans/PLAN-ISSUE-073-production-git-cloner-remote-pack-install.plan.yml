    • Real check: `./bin/backstop gate` — note the RELATIVE ./bin/ path. A bare
      `backstop` resolves to a stale /usr/local/bin copy that raises phantom
      violations (ISSUE-077).
    • Final phase: full `./bin/backstop gate` kill chain, unfiltered and
      unscoped, plus `./bin/backstop artifact validate`.

  ─────────────────────────────────────────────────────────────────────────
  PLANNER FLAGS (user action — NOT tasks in this plan)
  ─────────────────────────────────────────────────────────────────────────
  1. LOCAL packs also copy/hash their .git: `pack add ../some-pack` where the
     source dir is a git repo root copies .git into .backstop/packs and hashes
     it. Surfaced by this work, deliberately NOT fixed here (fixing it means
     touching ComputeContentHash/copyDirRecursive, which rehashes every
     already-installed local pack and churns every lock). File separately.
  2. ISSUE-074 (`pack relock` silent exit-1) is a DIFFERENT defect in the same
