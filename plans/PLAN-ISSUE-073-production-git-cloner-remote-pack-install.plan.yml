        files:
          - pkg/pack/distribution/add.go
          - pkg/pack/distribution/update.go
          - pkg/pack/distribution/upgrade.go
        claims:
          - CLM-004
          - CLM-005
        depends_on:
          - TASK-005

      - id: TASK-007
        type: verification
        title: "Verify no code path can nil-deref a missing cloner or skip git-pack validation"
        description: |
          Evidence required:
            1. `go test ./pkg/pack/distribution/... -race` GREEN, including the
