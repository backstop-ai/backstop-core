  # ═══════════════════════════════════════════════════════════════════════
  # Phase 4: Production VersionResolver so `pack update` is fixed, not
  #          merely "cleanly broken"
  # ═══════════════════════════════════════════════════════════════════════
  - id: phase-4
    name: "Phase 4: Production VersionResolver over Remote Tags"
    tasks:
      - id: TASK-008
        type: test
        title: "Red: resolver picks the latest compatible remote tag; rejects junk"
        description: |
          `pack update` needs BOTH a cloner and a VersionResolver; wiring only
          the cloner would leave update dead behind a clean error, which is the
          repo's recurring "wired but still unproven" failure mode. Tests
          first, in pkg/pack/distribution/versionresolver_test.go
          (distribution_test), driving RealVersionResolver over a tag lister
          seeded from the REAL local-repo fixture where practical (reuse
          TASK-002's newLocalPackRepo shape via RealGitCloner.ListTags so at
          least one test reads genuine `git ls-remote` output rather than a
          hand-written list):
            - TestRealVersionResolver_ResolvesLatestCompatibleFromRemoteTags —
              tags v1.0.0, v1.1.0, v1.2.3, v2.0.0 with current 1.0.0 resolve to
              1.2.3 (highest same-major), never 2.0.0.
            - TestRealVersionResolver_IgnoresNonSemverAndPrereleaseTags —
              tags like "latest", "v1.3.0-rc.1", "release-1" are skipped, not
              errors; a repo whose only extra tag is a prerelease resolves to
              the current version (no-op) rather than to the prerelease.
            - TestRealVersionResolver_IsMajorBumpDetectsMajorChange —
              IsMajorBump("1.4.0","2.0.0") is true; ("1.4.0","1.9.9") false.
            - TestRealVersionResolver_NoMatchingTagReturnsError — a remote with
              no semver tags returns a clean, named error (never a panic and
              never a silent "already at latest").
          Return the resolved version WITHOUT the leading "v" — update.go
          re-adds it (`"v"+resolved`) at the Clone call; a resolver returning
          "v1.2.3" would produce "vv1.2.3". Pin that in the first test. The
          composition itself is proven end to end by
          TestPackUpdateRemote_UpdatesToLatestCompatibleTag in TASK-011, which
          a unit test on the return value alone cannot do.
        files:
          - pkg/pack/distribution/versionresolver_test.go
        claims:
          - CLM-008
        test_names:
          - TestRealVersionResolver_ResolvesLatestCompatibleFromRemoteTags
          - TestRealVersionResolver_IgnoresNonSemverAndPrereleaseTags
          - TestRealVersionResolver_IsMajorBumpDetectsMajorChange
          - TestRealVersionResolver_NoMatchingTagReturnsError
        depends_on:
          - TASK-004

      - id: TASK-009
        type: implementation
        title: "Green: RealVersionResolver over ListTags + semver"
        description: |
          Add pkg/pack/distribution/versionresolver.go:
            a small unexported tagLister interface { ListTags(url string)
              ([]string, error) } so the resolver takes the LISTER, not a
              concrete cloner (unit-testable, and update.go can hand it the
              same RealGitCloner it clones with)
            type RealVersionResolver struct{ Tags tagLister }
            var _ VersionResolver = (*RealVersionResolver)(nil)
            ResolveLatestCompatible(packName, currentVersion): resolve the pack
              URL exactly as the rest of the package does (resolveGitURL —
              unchanged, Design Decision 1), list remote tags, parse them with
              github.com/Masterminds/semver/v3 (already in go.mod as an
              indirect dep — promote it to a direct require; do not add a new
              module), discard non-semver and prerelease tags, keep the highest
              with the SAME major as currentVersion, and return it WITHOUT the
              "v" prefix. Return a named error when nothing parses.
            IsMajorBump(current, resolved): true when the majors differ.
          Do NOT change update.go's control flow here — TASK-012 supplies the
          resolver from the CLI. Run `go mod tidy` after promoting the semver
          require so the module files stay honest.
        files:
          - pkg/pack/distribution/versionresolver.go
          - go.mod
        claims:
          - CLM-008
        depends_on:
          - TASK-008

      - id: TASK-010
        type: verification
        title: "Verify the resolver against real ls-remote output and a tidy module graph"
        description: |
          Evidence required:
            1. `go test ./pkg/pack/distribution/... -race` GREEN including the
               four TASK-008 resolver tests, with at least one of them proven
               to have read tags from a REAL git repo (not a literal slice).
            2. `go build ./...` clean and `go mod tidy` produces no diff —
               semver is a direct require, no stray modules added.
            3. `./bin/backstop gate` green over the diff (relative path).
        files:
          - pkg/pack/distribution/versionresolver.go
          - go.mod
        claims:
          - CLM-008
        depends_on:
          - TASK-009

  # ═══════════════════════════════════════════════════════════════════════
  # Phase 5: CLI wiring + the REAL end-to-end proof (the launch bar)
  # ═══════════════════════════════════════════════════════════════════════
  - id: phase-5
    name: "Phase 5: CLI Wiring + Hermetic Remote-Pack End-to-End (add/install/update/upgrade)"
    tasks:
      - id: TASK-011
        type: test
        title: "Red: hermetic remote pack add/install/update/upgrade through the real cloner"
        description: |
          THE launch-bar tests. They drive the REAL CLI (NewRootCommand +
          executeCommand, chdirForTest — the existing cmd/backstop helpers used
          by pack_add_declared_e2e_test.go) through the REAL production cloner
          against a REAL git repository in a temp dir. No mock, no network.

          HERMETIC REDIRECT (Design Decision 1 — resolveGitURL is NOT changed):
            ORDER MATTERS.
            1) Build the fixture repos FIRST, while HOME is still the real one,
               giving each repo its identity LOCALLY (`git -C <dir> config
               user.email` / `user.name`) so commits never depend on a global
               identity.
            2) THEN write <tmpHome>/.gitconfig:
                   [user]
                       name = backstop test
                       email = test@example.invalid
                   [url "file://<fixtureRoot>/"]
                       insteadOf = https://github.com/
               (the [user] block is belt-and-braces for any later git op that
               wants an identity once HOME is redirected).
            3) THEN t.Setenv("HOME", tmpHome) and t.Setenv("GIT_CONFIG_GLOBAL",
               <tmpHome>/.gitconfig).
            4) THEN run the CLI.
            Fixture path: <fixtureRoot>/acme/demo-pack.git, so resolveGitURL's
            https://github.com/acme/demo-pack.git rewrites onto it. t.Setenv
            forbids t.Parallel — do not add it. Skip the file only if git is
            unavailable.
          FIXTURE PACKS: use the verified SUCCESS shape and the verified
          FAILURE shape from the FIXTURE PACK SHAPE note — do NOT use
          testdata/valid-pack as a success fixture (real `pack check` gives it
          three structural errors, and TASK-012 wires the REAL validator).
          Tag the success repo v1.0.0 → v1.1.0 → v2.0.0, additively only
          (DetectTamper).

          cmd/backstop/pack_remote_e2e_test.go:
            - TestPackAddRemote_ClonesTaggedPackEndToEnd — `pack add
              acme/demo-pack@1.0.0` exits 0, prints an "Added
              acme/demo-pack@1.0.0 (hash: …)" line, materializes
              .backstop/packs/acme/demo-pack/pack.yml with the v1.0.0 content,
              writes backstop.yml `acme/demo-pack: 1.0.0`, and writes a
              backstop.lock entry with source_type "git", git_ref "v1.0.0",
              and a non-empty content_hash.
            - TestPackAddRemote_InstalledTreeHasNoGitMetadata — no .git under
              the installed pack (Sharp Edge A).
            - TestPackAddRemote_ThenInstallRoundTripsHashVerified — delete
              .backstop/packs/ and run `pack install`; it re-clones through the
              same wired cloner and the hash CHECK PASSES (this is the
              assertion that would fail if .git were still in the tree).
            - TestPackAddRemote_MissingTagExitsConfigError — `pack add
              acme/demo-pack@9.9.9` does not panic, exits with the CONFIG error
              code (2, ExitConfigError), and leaves backstop.yml, backstop.lock
              and .backstop/packs untouched. ANTI-VACUITY (required): assert the
              error text NAMES the ref (v9.9.9) AND that it refers to the
              FIXTURE — the file:// fixture root appears, or at minimum
              "github.com" does NOT. Without that, the test passes identically
              when the redirect silently fails and git errors merely because the
              real github.com/acme/demo-pack does not exist.
            - TestPackAddRemote_FailsClosedWhenPackCheckFails — point the
              fixture at the FAILURE pack shape; `pack add` FAILS, installs
              nothing, and the message carries the real pack-check errors,
              proving validation is no longer silently skipped (CLM-004).
            - TestPackUpdateRemote_UpdatesToLatestCompatibleTag — after adding
              @1.0.0, run `pack update acme/demo-pack`; assert exit 0, that
              backstop.yml moves to 1.1.0, that the lock entry moves to version
              1.1.0 / git_ref "v1.1.0" with a CHANGED content_hash, and that
              the installed pack.yml is v1.1.0's content. This drives the real
              resolver → real ls-remote → real clone chain and is the only
              thing that proves update.go's `"v"+resolved` composition does not
              produce "vv1.1.0".
            - TestPackUpgradeRemote_UpgradesToTargetMajorTag — from the 1.1.0
              state run `pack upgrade acme/demo-pack@2.0.0`; assert exit 0,
              backstop.yml and the lock move to 2.0.0 / "v2.0.0" with a fresh
              hash, and the installed tree is v2.0.0's content. upgrade.go's
              Scanner and RemediationGenerator are nil-guarded, so no extra
              machinery is needed. If any part of upgrade's tail turns out to
              need more than the fixture provides, SURFACE it — do not
              downgrade this to a structural assertion.
          cmd/backstop/pack_dependency_wiring_test.go:
            - TestPackCommands_WireProductionGitClonerAndValidator — construct
              the options each pack subcommand builds (extract the shared
              constructors from TASK-012 so this is assertable without running
              a clone) and assert: GitCloner non-nil for add, install, update
              AND upgrade; Validator non-nil for add, update and upgrade ONLY
              (InstallOptions has no Validator field — Design Decision 3);
              VersionResolver non-nil for update. This is the regression guard
              against the exact defect ISSUE-073 reports; the behavioral proof
              lives in the e2e tests above, not here.
          Before writing implementation, RUN these and confirm the panic /
          failures are real — that is the red evidence.
        files:
          - cmd/backstop/pack_remote_e2e_test.go
          - cmd/backstop/pack_dependency_wiring_test.go
        claims:
