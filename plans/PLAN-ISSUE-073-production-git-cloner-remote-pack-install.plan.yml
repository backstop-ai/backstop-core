  WHAT THIS PLAN FIXES (reactive track: ISSUE-073 → plan; there is NO spec)
  ─────────────────────────────────────────────────────────────────────────
  `backstop pack add org/pack@version` PANICS today. Packs are external by
  design and install from git repos, so the remote path IS the product for a
  consumer; two launching projects depend on it. Verified against the tree at
  planning time (2026-07-25):
    • cmd/backstop/pack_add.go:31-34 builds distribution.AddOptions with
      ProjectDir + Version only — GitCloner and Validator stay nil.
    • pkg/pack/distribution/add.go:153 calls opts.GitCloner.Clone(...) with no
      nil guard → nil-interface method call → panic for ANY git pack ref.
    • add.go:160 runs the validator only `if opts.Validator != nil`, so a git
      pack that DID clone would install unvalidated (a silent-green hole).
    • pkg/pack/distribution/install.go:165 DOES nil-guard ("no git cloner
      provided for pack %s") and returns cleanly — the good-citizen pattern
      add/update/upgrade are missing.
    • update.go:87 and upgrade.go:59 call Clone with the same exposure. Note
      update.go:55 already errors cleanly on a nil VersionResolver, so today
      `pack update` fails BEFORE the panic site — see CLM-008.
    • distribution.GitCloner (add.go:13-17, Clone + ListTags) has NO production
      implementation. pkg/scaffold/git_executor_real.go RealGitExecutor
      implements ListTags(pattern) (LOCAL repo tags) but not Clone, and is
      never wired as a distribution.GitCloner.
    • Every GitCloner in the tree outside the interface/options definitions is
      a *_test.go mockGitCloner. The remote path has never executed for real —
      which is exactly how it shipped broken.

