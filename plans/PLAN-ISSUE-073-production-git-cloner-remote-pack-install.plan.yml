      put a network-dependent step inside the load-bearing hermetic e2e.
    • packs/contracts → pass. • packs/substantiveness → pass. Both declare
      `provision:` blocks (grep, ast-grep 0.43.0) but address rules via
      `rule_path:`, leaving rule.File == "", so phase3 never invokes an engine —
      they are hermetic DESPITE the provisions.
  Prefer the minimal shape above; if you deviate, RE-VERIFY with
  `./bin/backstop pack check <dir>` and `./bin/backstop pack test <dir>` under a
  stripped environment, and report whether phase3 executes an engine.

  MULTI-TAG FIXTURE (needed by the update/upgrade e2e): tag the same repo
  v1.0.0, then v1.1.0, then v2.0.0. Later tags must only ADD — never remove a
  rule or a fixture file and never downgrade a severity — because update.go
  runs DetectTamper(installed, new) whose four categories are fixture_removal /
  severity_downgrade / risk_class_change / rule_removal; a subtractive v1.1.0
  would demand --acknowledge and derail the test.

  ─────────────────────────────────────────────────────────────────────────
  VERIFICATION COMMANDS — read this before copying any other plan
  ─────────────────────────────────────────────────────────────────────────
    • `backstop code check` DOES NOT EXIST. It was deleted by ISSUE-018 and
