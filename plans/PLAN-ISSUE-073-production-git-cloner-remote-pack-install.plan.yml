  # ═══════════════════════════════════════════════════════════════════════
  # Phase 2: The production cloner, proven against a real git repository
  # ═══════════════════════════════════════════════════════════════════════
  - id: phase-2
    name: "Phase 2: Production RealGitCloner (real-git proof, no mocks)"
    tasks:
      - id: TASK-002
        type: test
        title: "Red: RealGitCloner tests against a REAL local git repository fixture"
        description: |
          Write the failing tests FIRST. These are the plan's core anti-mock
          guarantee (CLM-003): the cloner is exercised against a genuine git
          repository created in a temp dir, over a file:// URL — real git
          binary, no network, no flake.

          FIXTURE HELPER (in gitcloner_test.go; mirror the existing precedent
          pkg/scaffold/git_executor_real_test.go:initTempGitRepo):
            newLocalPackRepo(t) → t.TempDir() + `git init`, then PER-REPO
            `git -C <dir> config user.email` / `user.name` (identity must be
            LOCAL to the fixture repo — the CLI e2e in TASK-011 redirects HOME,
            and a repo with no identity fails commit with "Please tell me who
            you are"). Write the SUCCESS fixture pack (see the FIXTURE PACK
            SHAPE note — pack.yml + rules/rule.yml, no engines block), then
            `git add -A`, `git commit -m initial`, `git tag v1.0.0`; then an
            ADDITIVE second commit + `git tag v1.1.0`; then an additive third
            commit + `git tag v2.0.0`. Never remove a rule/fixture or downgrade
            a severity between tags (DetectTamper). Return the dir; callers
            build "file://" + dir. Skip the file with t.Skip if git is not on
            PATH. `git` as a literal here is self-pack legal (Sharp Edge C).

          pkg/pack/distribution/gitcloner_test.go (external test package
          distribution_test, matching add_test.go):
            - TestRealGitCloner_ClonesTaggedRefFromLocalRepo — Clone(fileURL,
              "v1.0.0", dest) succeeds and dest holds the pack.yml content
              committed AT THAT TAG (not v1.1.0's) — proves the ref is honored,
              not just that a clone happened.
            - TestRealGitCloner_MissingTagReturnsGitError — Clone with
              "v9.9.9" returns a non-nil error that errors.As-matches
              *distribution.GitError and whose message names the ref; NO panic,
              and dest is left with no partial pack.
            - TestRealGitCloner_UnreachableURLReturnsGitError — Clone from a
              file:// URL that does not exist returns *GitError, not a panic.
            - TestRealGitCloner_MissingGitBinaryReturnsGitError — t.Setenv(
              "PATH", "") then Clone; assert a *GitError whose message names
              the missing git binary (never a panic, never a bare "exec: not
              found"). Covers the CLM-006 branch that would otherwise be an
              uncovered error path; assert the same for ListTags if the guard
              is shared.
            - TestRealGitCloner_CloneOmitsGitMetadata — no ".git" entry exists
              anywhere under dest after a successful clone (Sharp Edge A).
            - TestRealGitCloner_ContentHashStableAcrossClones — clone the same
              tag twice into two dirs; distribution.ComputeContentHash returns
              the IDENTICAL hash for both. This is the assertion that makes the
              add→install round trip (CLM-007) possible.
            - TestRealGitCloner_ListTagsReadsRemoteTags — ListTags(fileURL)
              returns v1.0.0, v1.1.0 and v2.0.0 read from the REMOTE, and does
              NOT return tags of the repo the test process happens to run in.
            - TestScaffoldGitExecutorIsNotAPackCloner — runtime interface
              assertion that scaffold.RealGitExecutor does NOT satisfy
              distribution.GitCloner (expect ok == false). This is the ONLY
              guard for Sharp Edge B; the compile-time `var _` line in
              gitcloner.go does not cover it. Read-only use of pkg/scaffold —
              do not edit that package.
          Tests that call t.Setenv must not call t.Parallel.
          All of these fail (or fail to compile) until TASK-003.
        files:
          - pkg/pack/distribution/gitcloner_test.go
        claims:
          - CLM-002
          - CLM-003
          - CLM-006
          - CLM-007
        test_names:
          - TestRealGitCloner_ClonesTaggedRefFromLocalRepo
          - TestRealGitCloner_MissingTagReturnsGitError
          - TestRealGitCloner_UnreachableURLReturnsGitError
          - TestRealGitCloner_MissingGitBinaryReturnsGitError
          - TestRealGitCloner_CloneOmitsGitMetadata
          - TestRealGitCloner_ContentHashStableAcrossClones
          - TestRealGitCloner_ListTagsReadsRemoteTags
          - TestScaffoldGitExecutorIsNotAPackCloner
        depends_on:
          - TASK-001

      - id: TASK-003
        type: implementation
        title: "Green: implement distribution.RealGitCloner over exec.CommandContext"
        description: |
          Make TASK-002's tests pass. ONE new file, inside the package that
          owns the interface. No new package, no consolidation refactor, and no
          edits outside this file (see the NON-GOAL note).

          pkg/pack/distribution/gitcloner.go:
            type RealGitCloner struct{}                  // + NewRealGitCloner()
            var _ GitCloner = (*RealGitCloner)(nil)      // conformance hygiene
                                                         // ONLY — this is NOT
                                                         // the Sharp Edge B
                                                         // guard
            unexported helpers in this file:
              gitAvailable() bool         → exec.LookPath("git")
              runGit(ctx, dir, args...)   → exec.CommandContext(ctx, "git",
                args...) with cmd.Dir set when dir != "", stdout and stderr
                captured separately, returning stdout plus an error that
                INCLUDES the combined output so callers never see a bare
                "exit status 1". Apply a bounded default timeout (suggest 5m as
                a named constant) so a hung network clone cannot wedge the CLI.
              The literal "git" here is Family-A allowlisted (Sharp Edge C).
            Clone(url, version, destDir): if !gitAvailable() return a *GitError
              naming the missing git binary; run `clone --depth 1 --branch
              <version> <url> <destDir>`; on failure return *GitError wrapping
              the combined output (so add.go's fmt.Errorf("cloning pack %s: %w")
              keeps errors.As working, which TASK-012's exit-2 mapping relies
              on) and leave no partial tree in destDir; on success REMOVE the
              .git directory from destDir (Sharp Edge A) and return nil.
            ListTags(url): `ls-remote --tags --refs <url>`, parse the ref names
              off the stdout lines, return them; *GitError on failure.
          Do NOT touch ComputeContentHash, copyDirRecursive, resolveGitURL,
          pkg/scaffold, or any gate/scope file.
        files:
          - pkg/pack/distribution/gitcloner.go
        claims:
          - CLM-002
          - CLM-003
          - CLM-006
          - CLM-007
        depends_on:
          - TASK-002

      - id: TASK-004
        type: verification
        title: "Verify the real-git cloner (red→green evidence, then gate)"
        description: |
          Confirm Phase 2 with real evidence, not assertion:
            1. `go test ./pkg/pack/distribution/... -race` is GREEN, and the
               TASK-002 cloner tests actually EXERCISED a real clone — they must
               not have t.Skip'd. Read the -v output and say so; a skipped
