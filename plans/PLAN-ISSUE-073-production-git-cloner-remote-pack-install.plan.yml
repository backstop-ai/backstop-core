  DESIGN DECISION 1 — resolveGitURL stays exactly as it is (SETTLED)
  ─────────────────────────────────────────────────────────────────────────
  add.go:315 `resolveGitURL` maps org/pack → https://github.com/org/pack.git
  and STAYS that way. The org is `backstop-ai`, so `pack add
  backstop-ai/<pack>@<version>` resolves correctly through it. That is correct
  behavior, not a gap, and there is no caveat, deferral, or follow-up attached
  to it. Do NOT add a host-override option, a registry setting, or a URL seam.
  Consequence for the CLI-level e2e: because the resolver is untouched, the
  hermetic test redirects git ITSELF rather than the code — a temp global git
  config with
      [url "file://<fixture-root>/"]
          insteadOf = https://github.com/
  activated via t.Setenv("GIT_CONFIG_GLOBAL", <path>) AND t.Setenv("HOME",
  <tmp>) (set both: GIT_CONFIG_GLOBAL needs git ≥ 2.32 — local git is 2.39.5,
  verified at planning time — while HOME/.gitconfig works on older git). This
  exercises the REAL resolveGitURL, the REAL cloner, and the REAL git binary
  with zero network. A test that reaches github.com is NOT acceptable.

