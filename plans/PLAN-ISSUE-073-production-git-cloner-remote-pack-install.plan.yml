  DESIGN DECISION 2 — nil Validator: ERROR for git packs, still allowed local
  ─────────────────────────────────────────────────────────────────────────
  Making a nil Validator a hard error everywhere would break real in-repo
  callers that add LOCAL packs with no validator on purpose
  (cmd/backstop/gate_substantiveness_e2e.go:107 and
  gate_substantiveness_provisioning_test.go:111 — verified). Rule adopted:
    • git-source pack + nil Validator ⇒ clean error (you did not author it; it
      must be validated).
    • local-path pack + nil Validator ⇒ current skip behavior preserved.
  The CLI never passes nil either way after TASK-012.

  ─────────────────────────────────────────────────────────────────────────
  DESIGN DECISION 3 — `install` gets a GitCloner but NOT a Validator
  ─────────────────────────────────────────────────────────────────────────
  Verified: InstallOptions (install.go:13-18) has fields ProjectDir, CachePath,
  GitCloner, LocalPackDir — there is NO Validator field, and this plan does not
  scope the file that would add one. That is deliberate, not an oversight:
  `install` re-materializes packs that `add` ALREADY validated at add time, and
  it re-verifies the locked content hash on the way in, so a Validator there
  would widen scope past the defect without closing a hole. Therefore
  TestPackCommands_WireProductionGitClonerAndValidator asserts:
    • GitCloner non-nil for all FOUR of add / install / update / upgrade;
    • Validator non-nil for add / update / upgrade ONLY;
    • VersionResolver non-nil for update.

  ─────────────────────────────────────────────────────────────────────────
  SHARP EDGE A — `.git` in the cloned tree poisons the content hash
  ─────────────────────────────────────────────────────────────────────────
  ComputeContentHash (hash.go:17) walks EVERY file under the pack dir with no
  exclusions, and copyDirRecursive (add.go:429) copies everything. A raw
  `git clone` leaves a .git directory, so without a strip the installed pack
  would carry the whole repo AND hash over reflogs/refs/pack files that differ
  between clones — meaning `pack install`'s hash comparison (install.go, fresh
  clone vs locked hash) would MISMATCH on a pack that was never tampered with.
  Fix, deliberately narrow: RealGitCloner.Clone removes .git from destDir
  after the checkout (shallow `--depth 1 --branch <ref>` clone). Do NOT change
  ComputeContentHash or copyDirRecursive — that would change hashes for
  already-installed LOCAL packs and churn every lock. Proven by
  TestRealGitCloner_CloneOmitsGitMetadata +
  TestRealGitCloner_ContentHashStableAcrossClones +
  TestPackAddRemote_ThenInstallRoundTripsHashVerified.

  ─────────────────────────────────────────────────────────────────────────
  SHARP EDGE B — RealGitExecutor ACCIDENTALLY matches GitCloner's ListTags
  ─────────────────────────────────────────────────────────────────────────
  scaffold.RealGitExecutor.ListTags(pattern string) ([]string, error) has the
  IDENTICAL Go signature to distribution.GitCloner.ListTags(url string), but
  opposite semantics (local tag glob vs remote tag list). If anyone ever adds
  a Clone method to RealGitExecutor it would silently satisfy GitCloner and
  list the WRONG tags with no compile error.
  THE GUARD IS THE RUNTIME TEST, TestScaffoldGitExecutorIsNotAPackCloner, and
  only that test. `var _ GitCloner = (*RealGitCloner)(nil)` in gitcloner.go is
  ordinary conformance HYGIENE for the new type — it asserts nothing whatsoever
  about scaffold.RealGitExecutor and must not be credited as this guard.
  KEEP DECISION: this plan no longer touches pkg/scaffold, so the collision can
  only be introduced by FUTURE work — which is exactly the case a cheap
  standing assertion is for. The test is three lines, imports a package the
  test file can already reach, and fails loudly the day someone adds Clone to
  RealGitExecutor. Keeping it.

  ─────────────────────────────────────────────────────────────────────────
  SHARP EDGE C — backstop/self rules that bite THIS code (verified, do not
  overstate)
