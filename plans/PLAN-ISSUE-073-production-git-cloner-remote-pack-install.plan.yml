  CARRIED FORWARD — two things explicitly adopted (verified in SPEC-055)
  ─────────────────────────────────────────────────────────────────────────
  1. THE `.git` STRIP INSIDE `Clone` (this plan's SHARP EDGE A) was ADOPTED into
     SPEC-055 REQ-001, delivered in PLAN-SPEC-055 Phase 4 (ExecGitCloner). The
     reasoning that made it the correct site is preserved here because it is the
     non-obvious part and a future contributor who removes the strip will
     silently reintroduce a non-reproducible hash:
       • ComputeContentHash (hash.go:17) walks EVERY file under the pack dir
         with NO exclusions, and copyDirRecursive copies everything. A raw
         `git clone` leaves a .git directory whose reflogs/refs/object layout
         differ between two clones of the SAME tag.
       • `Add` hashes the INSTALLED COPY. `Install` hashes the RAW CLONE.
         `Update`'s DetectTamper compares INSTALLED against a RAW CLONE.
       • Those three read the tree at different points, so a strip applied at
         any ONE of them leaves the others disagreeing. Only stripping inside
         `Clone` — before the tree is ever handed to distribution — makes all
         three agree by construction.
       • The narrowness is deliberate: changing ComputeContentHash or
         copyDirRecursive instead would rehash every already-installed LOCAL
         pack and churn every lock.
     SPEC-055 adopted this reasoning verbatim in substance (REQ-001: Clone
     "must ... STRIP the root `.git` directory before returning, so the tree it
     hands distribution is AUTHORED CONTENT ONLY"), added claims CLM-101
     (strip) and CLM-102 (two clones hash identically), and — because the strip
     lands — upgraded its CLM-065 from "assert a loud hash MISMATCH" to
     asserting round-trip hash EQUALITY, with CLM-103 retained so the equality
     claim cannot pass by hash verification having been deleted. That CLM-065
     inversion is this plan's CLM-007 arriving in the successor.

  2. THE LOCAL-PACK `.git` RESIDUAL (this plan's PLANNER FLAG 1 — `pack add
     ../some-pack` where the source dir is itself a git repo root copies .git
     into .backstop/packs and hashes it) is ASSIGNED, not unaddressed. It is
     owned by BUNDLE-006 REQ-021@1.1.0 ("Repository-control metadata at the pack
     root ... must not be copied into an installed pack or contribute to its
     content hash") together with REQ-041 / OQ-6's legacy-lock migration policy —
     i.e. the authored-content-identity and migration seed, a LATER BUNDLE-006
     seed. SPEC-055 explicitly declines to deliver it and wills it forward in its
     Sharp Edges, naming both residuals: local-path packs are never cloned so
     nothing strips them, and any lock entry written before the strip still
     carries a contaminated hash. The Clone strip fixes only the one source the
     cloner itself creates.

