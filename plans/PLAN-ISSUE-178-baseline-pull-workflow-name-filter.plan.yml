  So today the pull selects a Pages run, `resolveBaselineArtifactID` reports
  `missing artifact: "backstop-baseline-v1" not found in selected run`, and the
  error names an artifact rather than the workflow-selection bug that caused it.
  This is self-perpetuating: no `baseline.json` → the ratchet-dependent gate
  steps go red → CI never produces a NEW successful run of its own to recover
  with, while Pages keeps succeeding on every push and keeps winning the race.

  ── DESIGN DECISION: LITERAL NAME MATCH (option a), PINNED TO ci.yml ─────────
  ISSUE-178 names a trade-off and declines to prescribe. This lane resolves it.

  REJECTED — option (b), "scan candidate runs' artifacts in ID order until one
  carries `backstop-baseline-v1`". It has no workflow-name coupling, which is
  its whole appeal, but:
    * It puts up to 100 sequential `gh api` SUBPROCESS round-trips on the gate
      HOT PATH. `resolveBaselineCache` (`cmd/backstop/gate.go:419`) runs the
      pull on every `backstop gate` invocation whose cache is missing, stale or
      unreadable. The measurement above shows the rejected runs are real and
      accumulating, so this is a per-gate latency tax, not a theoretical one.
    * It dissolves the seam between `resolveLatestSuccessfulMainRun` and
      `resolveBaselineArtifactID`, which is a larger diff across more existing
      tests, under live production pressure.
    * It buys nothing the constant does not: the discriminator is measured and
      unambiguous — `pages build and deployment` vs `CI`.

  DEFERRED, NOT REJECTED — option (c), surfaced by plan review and recorded so
  it is not rediscovered later as a surprise. This repository ALREADY solves
  the same problem a third way, at `.github/workflows/release.yml:77`:

      gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/ci.yml/runs?head_sha=${GITHUB_SHA}&status=completed&per_page=100"

  That is the workflow-FILE-scoped endpoint. GitHub filters server-side, so it
  is ONE call that cannot return a foreign workflow at all — the bug becomes
  unrepresentable rather than filtered out. It couples to the FILENAME
  (`ci.yml`) instead of the DISPLAY NAME (`CI`), which is arguably the more
  stable of the two, since editing a workflow's `name:` is far more common than
  renaming its file. Note also that this existing call already uses
  `per_page=100` — independent in-repo corroboration of CLM-004.

  Being straight about it: option (c) is plausibly the better long-term shape,
  and this plan is not claiming otherwise. It is deferred for scheduling
  reasons only — it changes the ENDPOINT rather than the loop, so all four
  fixture case arms would need re-derivation against a differently-shaped URL,
  and the CLM-002 pin would have to become "the file exists" instead of the
  stronger "the selector accepts exactly what the file declares". Review's
  explicit guidance was not to delay tonight's live fix for it. If someone
  later wants the endpoint shape, this note is the starting point and a
  follow-on issue is the route — not an in-flight rescope of this lane.

  CHOSEN — option (a): a named constant `ciWorkflowName = "CI"` and an exact
  `run.Name == ciWorkflowName` comparison.

  ON THE ZERO-BAKED-KNOWLEDGE RULE: it does not bite here, and saying why
  matters so this is not re-litigated. CLAUDE.md's law targets baked LANGUAGE
  and TOOL knowledge in the CHECK path — everything a pack is supposed to own.
  `resolveLatestSuccessfulMainRun` is backstop-core's own CI wiring reading its
  OWN repository's own workflow list. There is no pack seam to defer to and no
  other project's answer being presumed. This is self-reference, not a baked
  assumption about somebody else's toolchain.

  WHAT MAKES THE COUPLING SAFE — and this is the part that upgrades option (a)
  past what the issue sketched: the constant does not float free. CLM-002
  mandates a test that READS `.github/workflows/ci.yml`'s own declared `name:`
  and proves the production selector accepts exactly that value. Rename the
  workflow and a test goes red immediately, instead of `baseline pull` breaking
  silently weeks later. Option (b) has no coupling but also no such feedback;
  option (a)-plus-the-pin has a coupling that CANNOT drift unnoticed. That is
  strictly the better property.

