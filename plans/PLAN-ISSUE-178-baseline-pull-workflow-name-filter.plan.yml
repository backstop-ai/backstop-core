      FOREIGN run FIRST (newest) and the ci.yml-named run SECOND. Same trap
      applies to CLM-001's fixture. Run both before TASK-002 and RECORD THE
      ACTUAL FAILURE OUTPUT; a test that was never observed red is not
      evidence.

   6. REUSE THE EXISTING REPO-ROOT HELPER. `repoRoot(t)` already exists at
      `cmd/backstop/pack_gate_test.go:572` in this same package. Do not declare
      another one (compile collision) and do not hand-roll a `../..` walk.
      Parse the workflow with `gopkg.in/yaml.v3` — a DIRECT dependency already
      (`go.mod:11`) — into a struct with a `Name` string field carrying the
      struct tag yaml:"name". Do not regex line 1: a `name:` that moves or acquires quotes would then
      silently stop being checked, which is exactly the drift CLM-002 exists to
      prevent. Precedent for a test reading this file lives at
      `cmd/backstop/ci_recipes_pack_identity_test.go:224`.

   7. THE WINDOW ASSERTION NEEDS ITS OWN CHANNEL. Existing fixtures assert the
      endpoint only INCIDENTALLY, through the case pattern — a test that merely
      still passes proves nothing about `per_page`. CLM-004's test must have
      its fake `gh` RECORD the endpoint it was handed (append `$2` to a file in
      a `t.TempDir()`), then read that file and assert it contains
      `per_page=100`. Asserting the happy path alone would stay green at 20.

   8. `resolveBaselineCache` DEGRADES; IT DOES NOT HARD-FAIL. Read
      `cmd/backstop/gate.go:419-444` before writing any gate-level assertion: a
      failed pull returns a nil baseline plus a warning STRING (`"baseline
      unavailable: ... remote baseline fetch failed"`), and the gate proceeds
      without a baseline. Do NOT write a test asserting `backstop gate` exits
      non-zero on a selection miss — that is not the shipped contract, and such
      a test would be asserting a behavior this lane is not delivering.

   9. DO NOT TOUCH `.github/workflows/ci.yml`.
      `TestCIRecipes_CoreAdoptsThePackWithoutApplyingAnyRecipe`
      (`cmd/backstop/ci_recipes_pack_identity_test.go:222`) asserts via
      `ciGitDiffIsDirty` that the file is BYTE-UNCHANGED from HEAD. This lane
      READS that file from a test and writes it never. Any edit reddens an
      unrelated test.

  10. `per_page=100` IS GITHUB'S MAXIMUM. Do not set 200 expecting more — the
      API caps silently and the number would become a lie. If the window still
      misses, the honest reading is that CI genuinely has no recent successful
      run on `main`, which is precisely what CLM-003's message now says out
      loud instead of mispresenting as a missing artifact.

  11. `PLAN-ISSUE-176`'s WORKFLOW COUNT IS STALE, AND IT IS NOT OURS TO FIX.
      That plan records (line 145) "three workflows, not one — `release` and
      `tag-integrity` are tag-triggered", which was true when written and is
      why the defect looked dormant. There are still exactly THREE workflow
      FILES (`ci.yml`, `release.yml`, `tag-integrity.yml` — measured). The
      Pages workflow has NO file; GitHub generates it. Do not hunt for a fourth
      file, and do not edit `PLAN-ISSUE-176` — it is `completed` and terminal.

  12. `PLAN-SPEC-019` LISTS THESE FILES BUT DOES NOT OWN THIS FIX. That plan
      (`status: draft`, created 2026-05-25) scopes `cmd/backstop/baseline.go`
      in task-010 and both files in task-007. It is a stale draft whose
      substance ALREADY SHIPPED — the pull command its task-010 describes is
      the code in the tree today — and its only adjacent language is a generic
      "actionable errors for ... workflow/run selection failures", which owns
      no filter. Recorded here so the overlap is not rediscovered mid-
      implementation and mistaken for a live collision. Do not edit it.

phases:
  # ═══════════════════════════════════════════════════════════════════════════
  # Phase 1: RED — pin the selection contract, and correct the fabricated
  #                fixtures that currently model the wrong workflow name
  # ═══════════════════════════════════════════════════════════════════════════
  - id: phase-1
    name: "Phase 1: RED — executable pins on workflow-name selection"
    tasks:
      - id: TASK-001
        type: test
        title: "Pin workflow-name selection, the ci.yml-derived accepted name, the miss message, and the window width (RED)"
        description: |
          Create `cmd/backstop/baseline_workflow_selection_test.go` (package
          main) carrying the four mandated tests below, and CORRECT the four
          pre-existing fixture sites enumerated in sharp edge 1.

          ALL FOUR NEW TESTS MUST FAIL BEFORE TASK-002. Run them first and
          RECORD THE ACTUAL FAILURE OUTPUT — sharp edge 5.

          THESE TESTS INTRODUCE AND REFERENCE NO NEW PRODUCTION SYMBOL. They
          drive the EXISTING `resolveLatestSuccessfulMainRun` and assert on its
          two return values. Naming `ciWorkflowName` here would fail the
          COMPILE and take the whole `cmd/backstop` package — and every other
          lane in this shared tree — down with it (sharp edge 4).

          Build the fake `gh` with the package's existing `writeFakeGh` helper
          and the `t.Setenv("PATH", binDir+...)` pattern the neighbouring tests
          already use; do not invent a second harness.

          TestResolveLatestSuccessfulMainRun_RejectsNewerForeignWorkflowRun (CLM-001).
            Fake `gh` answers the runs endpoint with a MULTI-WORKFLOW payload
            modelled on the real measurement in this plan's header — a foreign
            run FIRST (newest), a `CI` run SECOND:
              {"workflow_runs":[
                {"id":7,"name":"pages build and deployment","conclusion":"success","head_branch":"main"},
                {"id":42,"name":"CI","conclusion":"success","head_branch":"main"}]}
            Assert the returned id is 42 and the error is nil. TODAY THIS
            RETURNS 7 — that is the RED, and it is the defect itself. On failure
            print the returned id so the red state is legible in one run.

          TestResolveLatestSuccessfulMainRun_AcceptsExactlyTheNameCIWorkflowDeclares (CLM-002).
            Resolve the repository root with the EXISTING `repoRoot(t)`
            (`cmd/backstop/pack_gate_test.go:572` — do not declare another),
            read `.github/workflows/ci.yml`, and unmarshal it with
            `gopkg.in/yaml.v3` into a struct exposing `Name string`
            (sharp edge 6). Fail loudly if that name is empty — an unparseable
            workflow must not silently make this test vacuous.

            Build the fixture payload with that FILE-DERIVED name, and put a
            foreign run ahead of it so the test is red before TASK-002
            (sharp edge 5):
              id 7  name "pages build and deployment"  (first/newest)
              id 42 name <the name read from ci.yml>   (second)
            Assert 42 is selected. This is the whole anti-coupling mechanism:
            it proves the production selector accepts EXACTLY what the workflow
            file declares, so a rename reddens here instead of silently
            breaking `baseline pull`.

          TestResolveLatestSuccessfulMainRun_SelectionMissNamesWorkflowAndRejectedCandidates (CLM-003).
            Fake `gh` answers with successful main runs from FOREIGN workflows
            ONLY (no `CI` row at all) — e.g. two `pages build and deployment`
            rows. Assert the call returns a non-nil error, and that the message
            carries BOTH distinguishing substrings: the workflow it was looking
            for (`"CI"`) AND the foreign name it rejected (`pages build and
            deployment`). Assert on those substrings, not on the full sentence —
            over-specifying the wording makes this test a rewording tax.
            TODAY THIS RETURNS AN ID AND A NIL ERROR — that is the RED.

          TestResolveLatestSuccessfulMainRun_QueriesAHundredRunWindow (CLM-004).
            Give the fake `gh` a recording line that appends its `$2` argument
            to a file inside a `t.TempDir()` (path interpolated into the script
            the way the existing fixtures interpolate `zipPath`), then answer
            the request. After calling `resolveLatestSuccessfulMainRun`, READ
            that file and assert it contains `per_page=100`. Asserting only
            that the happy path still works would stay green at `per_page=20` —
            sharp edge 7 is the whole reason this test needs its own channel.

          FIXTURE CORRECTION (CLM-005) — the four sites in sharp edge 1, each
          needing BOTH edits, `"name":"ci"` → `"name":"CI"` and `per_page=20` →
          `per_page=100` (preserving the `\?` / `\&` escaping in the case arms):
            · cmd/backstop/baseline_test.go:247-248
            · cmd/backstop/baseline_test.go:402-403
            · cmd/backstop/baseline_test.go:478-479
            · cmd/backstop/gate_test.go:620-621
          LEAVE `cmd/backstop/baseline_test.go:303` ALONE — it is reached by the
          `*runs-empty*` glob and carries no `name` field.

          These four corrections put those tests RED TOO until TASK-002 lands
          (the production endpoint still says 20, so the corrected exact-match
          arms miss and the `*)` branch fires). That is expected and correct:
          the fixture correction IS part of this lane's red. Do not soften it by
          leaving the endpoint at 20 in the fixtures.
        files:
          - cmd/backstop/baseline_workflow_selection_test.go
          - cmd/backstop/baseline_test.go
          - cmd/backstop/gate_test.go
        claims:
          - CLM-001
          - CLM-002
          - CLM-003
          - CLM-004
          - CLM-005
        depends_on: []
        test_names:
          - TestResolveLatestSuccessfulMainRun_RejectsNewerForeignWorkflowRun
          - TestResolveLatestSuccessfulMainRun_AcceptsExactlyTheNameCIWorkflowDeclares
          - TestResolveLatestSuccessfulMainRun_SelectionMissNamesWorkflowAndRejectedCandidates
          - TestResolveLatestSuccessfulMainRun_QueriesAHundredRunWindow

  # ═══════════════════════════════════════════════════════════════════════════
  # Phase 2: GREEN — read the field that was already being decoded, then verify
  # ═══════════════════════════════════════════════════════════════════════════
  - id: phase-2
    name: "Phase 2: GREEN — filter the selection loop on the workflow name, and verify"
    tasks:
      - id: TASK-002
        type: implementation
        title: "Filter resolveLatestSuccessfulMainRun on the CI workflow name, widen the window, and name the miss"
        description: |
          Edit `cmd/backstop/baseline.go` ONLY. Four changes, all inside or
          immediately around `resolveLatestSuccessfulMainRun` (:202-224).

          (a) CLM-002 — declare the constant at package scope, beside the
              existing `const baselineArtifactName = "backstop-baseline-v1"`
              (:23), so the two identity constants this function pair depends on
              sit together:
                const ciWorkflowName = "CI"
              ONE literal, used by the comparison and nowhere else. Give it a
              one-line comment stating the non-obvious WHY — that it is pinned
              to `.github/workflows/ci.yml`'s declared `name:` and that
              TestResolveLatestSuccessfulMainRun_AcceptsExactlyTheNameCIWorkflowDeclares
              is what holds the two in sync. A future reader who does not know
              that will "simplify" it back into a free-floating literal.

          (b) CLM-001 — read the `Name` field the struct has been decoding and
              discarding since it was written (:210). Exact match, never
              case-insensitive (sharp edge 2):
                if run.HeadBranch == "main" && run.Conclusion == "success" && run.Name == ciWorkflowName {
              The two pre-existing conditions are redundant against the query's
              own `branch=main&status=success` parameters; LEAVE THEM. They cost
              nothing, they are defence against a server-side contract change,
              and removing them is a second unrelated change in a live fix.

          (c) CLM-004 — widen the candidate window in the endpoint at :203,
              `per_page=20` → `per_page=100` (GitHub's maximum, sharp edge 10).
              Foreign successful runs now consume slots that CI runs used to
              hold, so the window has to be deeper than it was when every row
              was a CI row.

          (d) CLM-003 — make the miss self-diagnosing, WITHOUT breaking the
              pre-existing assertion on this message. THE SUBSTRING `no latest
              successful main run` IS LOAD-BEARING AND MUST SURVIVE VERBATIM:
              `cmd/backstop/baseline_test.go:331` asserts on it, and the
              `runs-empty` fixture (`{"workflow_runs":[]}`) reaches this exact
              return. TASK-002's file scope is `baseline.go` ALONE and does not
              authorize editing that test, so a message that drops the
              substring would surface as an unowned break at TASK-003. This is
              not a judgment call and there is nothing to improvise — build the
              message around the existing substring:

                workflow/run selection miss: no latest successful main run
                found for workflow %q among %d successful runs
                (rejected workflows: %s)

              filled as: the wanted name (`ciWorkflowName`), the number of
              candidate runs the payload carried, and the DISTINCT workflow
              names seen and rejected while scanning. That satisfies CLM-003's
              two required tokens (the wanted workflow name and the rejected
              list) while keeping :331 green.

              OMIT THE PARENTHETICAL ENTIRELY when nothing was rejected. The
              `runs-empty` payload has zero candidates, and `(rejected
              workflows: )` is a worse message than no clause at all. CLM-003's
              own test feeds foreign-only runs, so the clause is present and
              asserted there.

              Bound the list: de-duplicate the names and cap it (a handful is
              plenty) so a 100-run window cannot produce an unreadable error.

              Keep the `workflow/run selection miss:` prefix — the three sibling
              returns in this function (:205, :216, :223) share it as a family.
              Exactly ONE test assertion depends on the `no latest successful
              main run` substring; that is :331, and (d) preserves it.

          DO NOT touch `resolveBaselineArtifactID`, `runBaselinePull`,
          `resolveBaselineCache`, or `.github/workflows/ci.yml` (sharp edges 8
          and 9). The four TASK-001 tests plus every pre-existing test named in
          this plan's `test_command` must be green when this task ends.
        files:
          - cmd/backstop/baseline.go
        claims:
          - CLM-001
          - CLM-002
          - CLM-003
          - CLM-004
        depends_on:
          - TASK-001

      - id: TASK-003
        type: verification
        title: "Gate the touched files and confirm the pre-existing baseline tests survived"
        description: |
          Scoped inner-loop verification.

            backstop gate --file cmd/backstop/baseline.go
            backstop gate --file cmd/backstop/baseline_test.go
            backstop gate --file cmd/backstop/gate_test.go
            backstop gate --file cmd/backstop/baseline_workflow_selection_test.go

          Then run this plan's `test_command` and read it TEST BY TEST, not off
          the package-level `ok` line:

            go test ./cmd/backstop/ -run "TestResolveLatestSuccessfulMainRun|TestBaselineGitHubHelpers|TestRunBaselinePull|TestResolveBaselineCache" -race -count=1

          The four mandated tests must PASS, and so must the pre-existing set
          they share fixtures with — `TestBaselineGitHubHelpersUseGhCLI`,
          `TestBaselineGitHubHelpersReportPayloadMisses`,
          `TestRunBaselinePull_UpdatesCacheFromArtifact`,
          `TestRunBaselinePull_InvalidBaselinePayloadPreservesExistingCache`,
          and all three `TestResolveBaselineCache_*` tests.

          THE SHARP-EDGE-1 CANARY IS SPECIFICALLY the two that consume the
          `gate_test.go` fixture — `TestResolveBaselineCache_MissingCacheRefreshesFromRemote`
          and `TestResolveBaselineCache_UnreadableCacheRefreshesFromRemote`. If
          the fourth fixture site was missed, that is where it shows, and it
          shows as `unexpected endpoint: ...`.
          `TestResolveBaselineCache_StaleCacheFallsBackToLocalOnRefreshFailure`
          must also pass, but it installs no fake `gh` and so proves nothing
          about the fixture edits either way — do not read its green as
          evidence that the `gate_test.go` site was handled.

          `TestBaselineGitHubHelpersReportPayloadMisses` is the CLM-003 canary:
          its `runs-empty` leg asserts the `no latest successful main run`
          substring that TASK-002(d) is required to preserve. If it fails, the
          new miss message dropped the substring — fix the MESSAGE in
          `baseline.go`, never the assertion.

          CLM-005 evidence: assert ZERO `t.Skip` calls in the touched test
          files, and confirm the `baseline_test.go` / `gate_test.go` diff is
          fixture-value churn only — no assertion removed, no test deleted.
        files:
          - cmd/backstop/baseline.go
          - cmd/backstop/baseline_test.go
          - cmd/backstop/gate_test.go
          - cmd/backstop/baseline_workflow_selection_test.go
        claims:
          - CLM-001
          - CLM-002
          - CLM-003
          - CLM-004
          - CLM-005
        depends_on:
          - TASK-002

      - id: TASK-004
        type: verification
        title: "Full gate sweep and artifact validation"
        description: |
          Comprehensive, unscoped verification of everything this lane touched —
          both code and artifacts.

            backstop gate --all
            backstop artifact validate --plan PLAN-ISSUE-178
            backstop artifact validate --issue ISSUE-178

          Read the `--all` result against this lane's own scope. This tree
          carries KNOWN INHERITED REDS that predate this plan — `PLAN-ISSUE-172`
          enumerates them (ISSUE-176 residual / ISSUE-178, ISSUE-162, and the
          baseline absence itself). Attribute every violation before reporting:
          a red that reproduces at clean HEAD is inherited, not caused here.
          Do NOT waive anything and do NOT weaken a check to clear an inherited
          red — record it, name its owning issue, and move on.

          ONE EXPECTED IMPROVEMENT WORTH MEASURING, because it is the point of
          the whole lane: with the fix in place, `backstop baseline pull` should
          now select CI run 32320833720 (or a newer `CI` run) and land a real
          `.backstop/baseline.json` instead of failing with `missing artifact`.
          Run it against the real repository and report which run id it
          selected. That is the end-to-end confirmation that the unit tests
          cannot give — and if it still fails, the message now says why
          (CLM-003), which is itself the fix working.
        files:
          - cmd/backstop/baseline.go
          - cmd/backstop/baseline_test.go
          - cmd/backstop/gate_test.go
          - cmd/backstop/baseline_workflow_selection_test.go
          - plans/PLAN-ISSUE-178-baseline-pull-workflow-name-filter.plan.yml
          - issues/ISSUE-178-baseline-pull-workflow-name-unfiltered.issue.md
        claims:
          - CLM-001
          - CLM-002
          - CLM-003
          - CLM-004
          - CLM-005
        depends_on:
