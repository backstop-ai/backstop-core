        title: "Run full backstop gate + artifact validate over the complete SPEC-038 change"
        description: |
          Run `backstop gate` (full kill chain: artifact validation + code check +
          test verification + substantiveness + coverage + contracts) across pkg/gate,
          cmd/backstop, pkg/pack, and pkg/pack/engine at >=80% coverage. Confirm every
          claim's tests are green and the end state holds: NO baked Go contract analyzer
          (no go/parser/go/ast/go/printer for contracts), only the gate-side polarity +
          match-verdict + file-scanned guard remain; the grep engine is pack-declared
          (no DefaultRegistry entry) and cannot run un-allowlisted; signature presence is
          a pack-compiled ast-grep query (binary never compiles a signature); absence is
          a pack-declared grep probe with file|path scope; the TS contract rules ride
          structural engines in the shared TS pack; equivalence preceded deletion; the
          5 analyzer-coupled test files are cleaned up; the gate is wired to the pack
          path (spy-verified); no vacuous green; and backstop's own contracts turn green.
          ALSO confirms the REQ-013/014/015 delta: the Go contracts pack
          (packs/contracts/) is an ORDINARY INSTALLED local pack (no //go:embed, no
          testdata-as-production, declared+locked, VerifyLock passes); the REAL
          over-installed-pack E2E drives the whole production pipeline (real ast-grep +
          real grep + real sandboxed convert) to a missing-signature contract violation
          AND a present-forbidden-symbol absence violation, with the uninstalled negative
          twin proving no vacuous green; the CONTRACTS arm of deriveCapabilityState
          re-keyed onto the installed contracts pack (substantiveness left as-is from
          Seed 3, coverage stays baked-Go) and the shipped capability test migrated.
          Also runs `backstop artifact validate` to confirm this plan + the spec validate.
