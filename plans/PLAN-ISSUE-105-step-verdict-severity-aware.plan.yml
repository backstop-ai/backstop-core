    ISSUE-105's — loud becoming silent rather than non-blocking becoming
    blocking — and it is live in a class-2 site today. Filed by TASK-006, NOT
    fixed here: changing it means introducing a "warning" status where a consumer
    currently sees "pass", which is a reporting change and belongs with
    ISSUE-100's renderer half, not inside a verdict fix.

  CLASS 3 — RAW COUNT THAT IS PROVABLY EQUIVALENT (STRUCTURALLY WARNING-FREE).
  UNTOUCHED, BUT LOCKED BY A REGRESSION TEST (TASK-002).
    pkg/gate/step_waiver.go:150-153 — every entry is built by
      `waiverDiagToViolation` (step_waiver.go:169-177), which HARDCODES
      `Severity: "error"`.
    pkg/gate/step_testverify.go:407-409 — the only violation constructed at that
