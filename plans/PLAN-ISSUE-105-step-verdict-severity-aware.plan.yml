  ── OUT OF SCOPE, FOUND WHILE MEASURING, FILE THEM DON'T FIX THEM ─────────
  TWO sibling defects surfaced while auditing the inventory. Both are in the
  severity-contract neighbourhood, NEITHER is ISSUE-105, and TASK-006 files them.

  SIBLING 1 — THE SUBSTANTIVENESS JOIN DROPS A PACK-DECLARED SEVERITY. The value
  survives Q1 dispatch and is then overwritten with a hardcoded "error" at
  substantiveness_join.go:68/184. That is the SAME contract being broken on a
  DIFFERENT axis — severity lost BEFORE the verdict, not ignored BY it — so a
  pack that declares a `warning` substantiveness rule still blocks after this
  lane lands. It is a sibling defect, not a side effect: fixing it means deciding
  what severity a JOINED violation inherits when several findings feed one
  violation, which is a modelling question this lane has no business answering
  inside a verdict fix. Do NOT widen scope to catch it.

  SIBLING 2 — A WARNING-ONLY COVERAGE STEP REPORTS "pass", SO THE FINDING GOES
  SILENT. pkg/gate/step_coverage.go:214-219 sets "fail" when a violation is
  error-severity and does nothing otherwise, so a coverage step carrying only
  `warning` findings never reaches the "warning" status: it is not counted in
  GateResult.StepsWarned, does not appear in the summary line, and reads as a
  clean run. This is the INVERSE of ISSUE-105 (loud becoming silent, rather than
  non-blocking becoming blocking) and it is live today in a site this lane
  correctly classifies as already-severity-aware. Not fixed here for the same
  reason ISSUE-100's renderer half is out of scope: it changes what a consumer
  SEES on a currently-passing step, which is a reporting decision, not a verdict
  one.

  ── DESIGN DECISION 1: ONE SHARED EXPORTED HELPER, IN pkg/gate/policy.go ───
  Inline `len(blockingViolations(v)) > 0` at four sites was rejected: it is not
  reachable from cmd/backstop (unexported) and it re-states the tri-state status
  mapping four times. The helper is:

    // StepVerdict returns the status a step reports for the findings it produced.
    func StepVerdict(violations []Violation) string
      "fail"    — at least one entry BLOCKS (blocksVerdict: severity != warning)
      "warning" — entries exist, none of them block (loud, non-blocking)
      "pass"    — no entries

  WHERE IT LIVES AND WHY: pkg/gate/policy.go, immediately beside `blocksVerdict`
  and `blockingViolations`, which it is a thin wrapper over. That file already
  holds the ratified severity-contract doc block, so the semantic and its single
  authority stay in one place instead of the semantic living in policy.go and its
  step-level twin living somewhere else. It is EXPORTED because cmd/backstop must
  call it; cmd/backstop already imports pkg/gate and pkg/gate imports no
  cmd/backstop, so the dependency is one-way and no cycle is possible. No new
  file, no new package, no `internal/severity` shim.

  THE TRI-STATE IS NOT A LIBERTY. Returning "pass" for a warning-only step would
  make a surfaced non-blocking finding indistinguishable from a clean run: it
  would stop incrementing GateResult.StepsWarned (pkg/gate/result.go), vanish
  from the human summary line, and turn "loud, non-blocking" into "silent." The
  measured RUN B produced status `warning`, and "warning" is already a
  first-class non-failing status in NewGateResult — it is counted, it renders,
  and it does NOT flip Pass. So "warning" is both the measured target and the
  existing vocabulary; the helper mirrors ApplyPolicy's block path EXACTLY
  (policy.go:180-189: `warning` when counted findings exist, `fail` when blocking
  ones do), which is what makes DECISION 2 hold.

  ── DESIGN DECISION 2: ApplyPolicy IS UNCHANGED, AND THE PASSTHROUGH IS NOW
     CORRECT RATHER THAN MERELY HARMLESS ─────────────────────────────────────
  The question ISSUE-105 leaves open is whether the no-entry passthrough
  (policy.go:132-136) also needs routing, or whether the unscoped block path
  (policy.go:171-190) needs changing. Answer: NEITHER. The layering, stated
  explicitly so the reviewer can check the argument and not just the diff:

    THE STEP is the FIRST and DEFAULT authority on its own verdict. After this
    lane it decides severity-aware, so a step with NO policy entry is already
    right and the passthrough is CORRECT — it preserves a severity-aware verdict
    instead of preserving a severity-blind one. That is the whole fix: the
    default stops being wrong, so the "leave it alone" branch stops being a hole.

    THE POLICY LAYER is an OVERRIDE that re-scopes (baseline grandfathering,
    per-source overrides) and RELAXES (warn/off) a verdict the step already
    reached. It recomputes from `s.Violations` — the FULL, severity-blind
    REPORTED set, which this lane does not touch — so it never double-filters:
    there is no pre-filtered slice for it to filter again. `StepVerdict` and
    ApplyPolicy's block path call the SAME `blocksVerdict` predicate and apply
    the SAME tri-state mapping, so for level:block + applies-to:all-code the two
    agree by construction and re-derivation is IDEMPOTENT. That property is the
    unit-level twin of the A/B probe and TASK-002 locks it.

  A route-everything-through-ApplyPolicy alternative was rejected: it would make
  every step's verdict depend on a layer whose job is consumer configuration,
  and a consumer with no config at all would still be relying on that layer to
  supply a default it does not own. The severity contract belongs to the FINDING,
  not to adopter configuration — which is the whole thesis of ISSUE-105.

  WHAT THE HELPER MUST NOT SWALLOW. The ConfigErr branches at every converted
  site construct their StepResult DIRECTLY with `Status: "fail"` and an
  error-severity violation. They are NOT findings-count sites and they do NOT
  route through StepVerdict. A config error is a broken execution, not a severity
  question, and `ApplyPolicy` already refuses to relax it (policy.go:133 keeps
  `s.ConfigErr` steps untouched). Leave those lines exactly as they are.

  ── RED-FIRST ACCEPTANCE: THE A/B PROBE, AS A FIXTURE ─────────────────────
  The existing end-to-end contract test (cmd/backstop/pack_severity_contract_test
  .go) drives `verdictFor`, which hands ApplyPolicy a policy map that ALWAYS
  contains a pack_engines entry — which is precisely why both ISSUE-104 and
  ISSUE-105 shipped past it green. This lane adds the missing half: a fixture
  CONSUMER with NO `enforcement.policy` table at all, driven through the REAL
  shipped `runGate`, in three runs over ONE tree:

    RUN A  no policy entry + declared-WARNING finding
           -> exit 0, pack_engines status "warning", finding STILL REPORTED
           -> RED TODAY (exit 1, status "fail"). This is the falsifier.
    RUN B  policy entry present + the SAME warning finding
           -> exit 0 (green today; non-regression, proves the fix did not move
              the behavior consumers already have)
    RUN C  no policy entry + declared-ERROR finding
           -> exit 1 BOTH ways (proves the fix did not simply stop blocking)

  ONLY THE POLICY LINE DIFFERS BETWEEN A AND B. Same fixture, same pack, same
  bytes — the test writes the entry into backstop.yml for RUN B and that is the
  entire delta, exactly as the ISSUE-105 probe measured it.

  ── FIXTURE HONESTY ───────────────────────────────────────────────────────
  The fake engine emits REAL CAPTURED SEMGREP BYTES, not hand-written SARIF.
