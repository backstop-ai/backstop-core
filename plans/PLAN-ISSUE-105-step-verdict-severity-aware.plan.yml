  ── THE DEFECT IN ONE PARAGRAPH ────────────────────────────────────────────
  Step builders decide PASS/FAIL by RAW COUNT — `if len(violations) > 0 { status
  = "fail" }` — and never read `Violation.Severity`. The severity-aware predicate
  (`blocksVerdict` / `blockingViolations`, pkg/gate/policy.go) has exactly ONE
  production caller: inside `ApplyPolicy`, which only rewrites steps the consumer
  has DECLARED a policy entry for (`p, ok := policy[s.StepName]; if !ok { out =
  append(out, s); continue }`). So the ratified pack severity contract — a SARIF
  `level: warning` is NON-BLOCKING BY CONTRACT — holds only for consumers who
  happen to have written an `enforcement.policy` entry for that dimension.
  backstop-core's own backstop.yml declares one for every policied dimension,
  which is exactly why this never surfaced in dogfooding. ISSUE-105 measured it:
  same tree, one config line, step `fail`/exit 1 without the entry versus
  `warning`/exit 0 with it.

  ── SITE INVENTORY, RE-MEASURED WHILE PLANNING (2026-07-29) ────────────────
  `grep -n 'status = "fail"' --include=*.go pkg/ cmd/ | grep -v '_test\.go'`
  returns TEN sites (all ten hand-verified). ANCHOR THE FILTER ON THE `.go`
  SUFFIX: a bare `grep -v _test` matches the FILENAME `step_testverify.go` and
  silently drops it from the inventory — and that file is a CLASS-3 site TASK-002
  is chartered to lock, so the sloppy filter hides exactly the kind of site this
  lane is auditing. They fall into three classes, and the class decides the
  treatment:

  CLASS 1 — RAW COUNT OVER SEVERITY-CARRYING VIOLATIONS. THE DEFECT. CONVERTED.
    cmd/backstop/gate.go:862-865   pack_engines (the measured instance)
    pkg/gate/step_delegate.go:57-60   artifact_validation
    pkg/gate/step_delegate.go:105-107 code_check
    pkg/gate/step_contract.go:62-65   contract_signature
  Each counts a slice whose entries carry a severity resolved upstream from a
  pack or a delegate, so a raw count is DISCARDING a declared value. These four
  are ISSUE-105's inventory and this lane converts exactly these four.

  CLASS 2 — ALREADY SEVERITY-AWARE. UNTOUCHED, NOT EVEN READ FOR EDIT.
    pkg/gate/step_coverage.go:214-219, pkg/gate/status_drift.go:96-104,
    pkg/gate/requirement_traceability.go:303-311 — each iterates and tests
    `v.Severity` itself, so none of them can block on a declared warning. This
    lane must not "unify" them into the helper: doing so would be a refactor
    riding inside a defect fix, and the blast-radius diff below could no longer
    be read.
    NOT ALL THREE ARE COMPLETE, THOUGH — step_coverage.go's loop sets "fail" on
    an error and NOTHING otherwise, so a coverage step whose findings are all
    `warning` reports "pass" and the findings go silent (no "warning" status, no
