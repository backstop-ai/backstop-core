  ─────────────────────────────────────────────────────────────────────────
  SCOPE — purely additive instrumentation on the SHIPPED SPEC-052 surface
  ─────────────────────────────────────────────────────────────────────────
  ISSUE-059 adds (a) a per-violation `trace` object to every violation the
  requirement_traceability classifier emits and (b) top-level git_sha /
  generated_at provenance to the gate JSON. No enforcement behavior, severity,
  gating, or identity changes. Lands standalone; no dependency on other
  in-flight work. The design is consumer-reviewed and settled — implement it,
  do not redesign.

  ─────────────────────────────────────────────────────────────────────────
  GROUNDING — the five real violation-emission sites in
  pkg/gate/requirement_traceability.go ClassifyRequirementTraceability
  ─────────────────────────────────────────────────────────────────────────
  1. citing_spec_not_implemented — the delivered-bundle/non-implemented-spec
     block at lines 87-94. remedy=implement_spec; carries citing_artifact
     (citer.ID).
  2. stale_pin — the stale-ref block at lines 108-114 (driven by staleRefs /
     StalePinVerdict). Carries pinned_version (ref.PinVersion) + bump
     (StalePinVerdict's bump). remedy is LIFECYCLE-KEYED: re_pin when the
     bundle is NOT delivered (bundle.Class != ClassSuccessTerminal), new_spec
     when delivered (bundle.Class == ClassSuccessTerminal). Carries
     citing_artifact (the citing spec/issue ID).
  3. chain_outrun — the plan-targets-stale-spec block at lines 122-128.
     remedy=resolve_upstream; carries `via` = the targeted spec ID (spec.ID),
     the non-verifying upstream link the operator must fix FIRST — distinct
     from the violating plan's own ID (rec.ID).
  4/5. uncovered vs coverage_lapsed — the bundle-REQ-no-coverage block/advisory
     at lines 145-150. Today BOTH the never-cited case and the
     retired-terminal-citer case fall through to this identical generic
     message (the ref loop at lines 77-79 SKIPS retired-terminal citers, so a
     REQ whose only citer was a `replaced` spec is indistinguishable from one
     never cited). This issue requires NEW detection: remember that a
     retired-terminal SPEC citer existed for a bundle+REQ, so the emission loop
     can split coverage_lapsed (retired SPEC citer existed → remedy
     restate_supports) from uncovered (never any spec citer → remedy
     author_spec). DD-3 defines lapsed as only-citer-is-a-retired-SPEC: the
     citers map ALSO holds issues (requirement_traceability.go:69-71), and a
     REQ whose only retired-terminal citer is an ISSUE must classify
     uncovered/author_spec, NOT lapsed — so the retired-citer detection is
     constrained to `citer.Kind == KindSpec`. The block still fires either way;
     only the trace gap_kind/remedy differ.

  ─────────────────────────────────────────────────────────────────────────
  UNCONDITIONAL trace fields on EVERY violation (both steps): bundle,
  bundle_maturity (= the bundle record's ArtifactStatusRecord.Status field —
  populated from fm.Status.Maturity at artifact_status.go:197; the field is
  named .Status, NOT .Maturity — denormalized deliberately, safe because of the
  top-level provenance in Phase 2), req_id, req_version
  (= bundleReqVersion(bundle, reqID)), gap_kind, remedy. For chain_outrun the
  bundle/req/version come from the originating staleRef, so the stale-spec
  bookkeeping (today a bool set `staleSpecs`) must carry the originating
  bundle/req/current-version through to the chain_outrun site; bundle_maturity
  there needs a bundles[bundleName].Status re-lookup (the bundles map is in
  scope at the emission site) so it is not left empty.
  ─────────────────────────────────────────────────────────────────────────

  IDENTITY IS UNTOUCHED (REQ-009). EnrichViolationIdentity
  (pkg/gate/baseline.go:203) folds only Rule|File|RegionHash where RegionHash
  hashes Message|Severity|SourcePack. `trace` must be `json:"trace,omitempty"`
  and — like Line, ProjectWide, WaiverHint — MUST NOT enter identity. Do NOT
  add Trace to any identity/RegionHash computation. A claim-mapped test proves
  identity/identity_hash/region_hash are byte-identical before/after.

  GATE-JSON PROVENANCE (Phase 2): GateResult gains git_sha + generated_at.
  Population lives in the CLI runGate path (cmd/backstop/gate.go), on `result`
  BEFORE FormatJSON/FormatHuman, mirroring the baseline artifact: git_sha via
  the EXISTING `gitSHA(projectRoot)` helper (cmd/backstop/baseline.go:74 —
  `git rev-parse HEAD`, empty string on error/non-repo). DIRTY-TREE BEHAVIOR
  matches the baseline exactly: rev-parse HEAD returns the HEAD commit SHA
  regardless of a dirty working tree (no `-dirty` suffix, no clean check);
  generated_at = time.Now().UTC().Format(time.RFC3339). SchemaVersion stays
  "gate/v1" (additive change, no bump).

  VOCABULARY (REQ-010): every NEW message, gap_kind/remedy value, and trace
  doc comment says "covered"/"coverage" for REQ-level state, never "delivered"
  (which names bundle maturity only). The pre-existing "delivered bundle …"
  message at line 91 legitimately describes bundle maturity and is out of
  scope for the vocabulary check.

