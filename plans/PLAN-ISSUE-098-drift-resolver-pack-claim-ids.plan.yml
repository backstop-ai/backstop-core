    CLM-001  pkg/gate exposes PackClaimIndex — a claim-id → evidence-label map with a
             presence lookup — built by a structural walk carrying NO pack-name
             literal, NO id-shape regex and NO language branch.
    CLM-002  pkg/gate exposes a presence resolver that returns the present-name set
