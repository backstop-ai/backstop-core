             tests (FilePath != "") and PackClaimIndex hits. A name in NEITHER index
             stays absent.
    CLM-003  The index is derived from the already-loaded installed pack manifests and
             indexes exactly Rules[].Claims[].ID and ToolConfig[].Claims[].ID — the two
             surfaces ParseManifestFile enforces one claim-id namespace over. Rule ids,
