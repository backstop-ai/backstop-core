    packs/contracts/pack.yml      name: backstop/contracts     version: 1.1.0
                                  IN NO backstop.lock ENTRY
    .backstop/packs/backstop-ai/go-contracts/pack.yml
                                  name: backstop-ai/go-contracts  version: "1.2.0"
