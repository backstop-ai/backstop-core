                                  declared in backstop.yml, and THE pack the gate
                                  indexes (loadInstalledPacks resolves the
                                  backstop.yml key under .backstop/packs/)

  The two copies ALREADY diverge on name and version. pack_fleet_test.go (repo ROOT,
  not cmd/backstop) records packs/contracts in syntheticCarrierExemptions as "not a
  fleet member and a documented non-goal of the migration" — it is a fixture the
