  ── THE DEFECT, RE-VERIFIED ON THE TREE 2026-07-28 ───────────────────────────
  cmd/backstop/gate.go:937 computeDriftSurfaces builds its `present` set from ONE
  signal: `mt.FilePath != ""` after gate.ResolveMandatedTestPaths
  (pkg/gate/step_testverify.go:609), which fills FilePath only from
  collectTestFuncNames (:453) — a walk of pack-declared TEST-FILE globs applying the
  pack-declared TestNameMatcher per line. A pack.yml is never a "test file" to the
  classifier, and `- id: type-signature-go` is not a line shape any test-name regex
  matches. Pack claim ids are therefore categorically outside the vocabulary, not
  merely unmatched by it. ISSUE-036's CLM-008 mandates five of them — live and passing
  in the INSTALLED, LOCKED backstop-ai/go-contracts v1.2.0 at
  .backstop/packs/backstop-ai/go-contracts/pack.yml:75-123, which is the pack the gate
  actually indexes (ISSUE-098 cites packs/contracts/pack.yml:70-129 instead; that is the
  divergent repo-root fixture — see the "DO NOT PROVE THIS AGAINST packs/contracts" note
  below, and do not repeat the conflation) — and gets five false broken-promise BLOCK
  violations, grandfathered by the local baseline, RED in CI (run 30384984403).

  ── PRESENCE SEMANTICS: THE DECISION AND ITS ARGUMENT (CLM-005) ──────────────
  DECIDED: a mandated name resolves PRESENT when an INSTALLED pack manifest declares
  a claims[].id equal to it. The drift step does NOT re-run `backstop pack test`, does
  not re-execute fixtures, and does not consult a pack-test result cache.

  The integrity chain, stated honestly and end to end:

    1. pack_lock_verification runs FIRST in the kill chain and is ConfigErr on failure
       (cmd/backstop/gate.go:805-813); pkg/gate/gate.go:162-164 HALTS the gate on
       ConfigErr. So by the time the drift step runs, every declared pack's installed
       tree content-hashes equal to backstop.lock, or the gate already exited 2.
       (Honest caveat, recorded because a later reader will look for it: VerifyLock
       skips `source_type: local` entries — verify.go:47-49 — so for a locally-sourced
       pack the chain is "declared, present and parseable", not "hash-verified".
       That is a PRE-EXISTING property of every pack-fed dimension, not something this
       plan introduces, and it is the same trust the classifier/matcher already ride.)
    2. The installed tree only got there through `pack add`/`pack install`, which run
       the FULL pkg/packval pipeline — including phase 3, RunFixtures
       (pkg/packval/phase3.go:13), which EXECUTES each claim's positive and negative
       fixtures through the resolved engine binding.
    3. pack.ParseManifestFile REQUIRES every claim to declare at least one positive
       AND one negative fixture (manifest.go:655-662). A claim id cannot exist in a
       parseable manifest without a falsifying fixture pair behind it.

    So "the id is present in an installed manifest" transitively means: a claim by
    that name exists, carries positive+negative fixtures, and passed them when the
    pack was installed at the content now on disk.

    WHAT IT DOES NOT PROVE: that those fixtures pass RIGHT NOW, against the engine
    binary and rule files as they currently resolve. It is a proof of DECLARED,
    INSTALL-VERIFIED EXISTENCE, not of a live green run.

    WHY THAT GAP NEEDS NO WARNING SURFACE — the symmetry argument, which is the
    load-bearing half of this decision: the Go side of this very resolver proves
    exactly as little. collectTestFuncNames proves a test FUNCTION EXISTS in a file;
    it never runs it, and ClassifyStatusDrift deliberately takes NO pass/fail
    parameter (pkg/gate/status_drift.go:20-30, CLM-005/008 of ISSUE-042: "EXISTENCE is
    the sole lever"; a present-but-failing test is pack_engines' job). Requiring a live
    fixture run for the pack side would hold packs-only evidence to a STRICTLY HIGHER
    bar than source evidence inside a dimension whose whole design is existence-only —
    penalizing exactly the evidence form CLAUDE.md's first principle says is native.
    Execution proof lives where it already lives: the pack_engines dimension and
    `backstop pack test`. Adding a fixture re-run here would also drag engine
    provisioning and subprocess execution into a step that is currently a pure
    filesystem sweep.

    AND IT IS FALSIFIABLE, NOT MERELY ARGUED: TASK-007's
    TestDriftGate_PresenceIsDeclarationNotFixtureExecution resolves a claim whose
    fixture files do not exist and whose engine binds to a non-binary. A pass there is
    only possible if presence is declaration presence and no subprocess is spawned; any
    future "hardening" that quietly adds a fixture run turns that test red, which is
    exactly the alarm this decision deserves.

  ── WHICH MANIFEST SURFACES COUNT (CLM-003) ──────────────────────────────────
  IN: Content.Ruleset.Rules[].Claims[].ID and ToolConfig[].Claims[].ID.
  OUT: rule ids, scaffold ids, recipe ids, engine names, pack names.

  This is not a taste call — the manifest itself draws exactly this line. ParseManifestFile
  enforces ONE claim-id namespace spanning precisely those two surfaces and no others
  (manifest.go:382-398: `seenClaimIDs` is populated from rule claims then tool_config
  claims, and a collision across them is a parse error). Both surfaces are the same
  `Claim` type, and both are fixture-bearing by the rule above. A rule id, by contrast,
  is a rule — it carries no fixtures of its own, so admitting rule ids would let a
  mandated name resolve against something with no falsifier behind it. That is the
  vacuous-presence failure mode this plan's own falsifier exists to prevent.

  ── ZERO-BAKED-CHECKS (CLM-001) ──────────────────────────────────────────────
  The index is a structural walk of parsed Manifest values. NO pack-name literal
  ("contracts", "backstop/self", …), NO id-shape regex, NO `-go` suffix knowledge, no
  language branch. A TypeScript pack's claim ids index identically. TASK-004 carries a
  test that asserts this by using a pack whose name and ids share nothing with the
  contracts pack.

  ── THE SHARP EDGE THAT DICTATES THE DESIGN ──────────────────────────────────
  DO NOT make a pack-claim hit fill MandatedTest.FilePath, and do not extend
  ResolveMandatedTestPaths to do it. FilePath is a SHARED signal with two other
  consumers, and one of them would corrupt:

    - cmd/backstop/gate.go:1166-1181 (substantiveness Q2 noTarget join) skips a
      mandated test only when `mt.FilePath == ""`. Give a pack-claim-resolved test a
      FilePath of `.backstop/packs/<name>/pack.yml` and the join would ask whether
      pack.yml references the target package, emit a false "does not call package X"
      violation, and attribute it to a pack manifest.
    - pkg/gate/step_testverify.go:370-385 (test_verification) keys presence on the
      `found` map, NOT on FilePath, so it would be untouched either way.

  Therefore the union lives at the DRIFT CONSUMER, over a SEPARATE index. Every other
  ResolveMandatedTestPaths caller keeps byte-identical behavior (CLM-004).

  ── DELIBERATE NON-SCOPE, NAMED SO IT IS NOT MISTAKEN FOR AN OVERSIGHT ───────
  test_verification is NOT extended. Verified 2026-07-28: no spec under specs/ mandates
  a pack claim id (every `tests:` entry is Test-function-shaped), so that dimension has
  no live false positive today, and threading the index through
  StepTestVerificationScopedFunc would change a signature with a large call-site fan-out
  for zero present-day evidence. The index and union are exported from pkg/gate
  precisely so that extension is a two-line change the day an implemented spec mandates
  pack-side evidence. If this plan's implementer finds such a spec, STOP and escalate
  rather than silently widening scope.

  ── FAILURE MODES THE STEP MUST HANDLE (CLM-006) ─────────────────────────────
    - Declared pack missing / manifest unparseable: loadInstalledPacks already errors
      and buildGateSteps returns a single `pack_loading` ConfigErr step
      (cmd/backstop/gate.go:653-665) — the gate exits 2 BEFORE the drift step is ever
      constructed. This plan adds no second-guessing of that; it derives the index from
      the SAME already-loaded `packs` slice, so an index can never be built from packs
      the gate has not vouched for.
    - Zero packs declared (a legitimate packless project, and the ISSUE-086 CI shape):
      empty index, presence union degenerates to today's source-only behavior. No new
      false positive is introduced relative to the status quo; the false positive that
      already exists there is ISSUE-086's to close, not this plan's.
    - Cross-pack claim-id collision: ids are unique WITHIN a pack but not across packs.
      Presence is unaffected (a hit is a hit); the label records the first pack in the
      deterministic declared-pack order. Never an error.

  ── VERIFICATION COMMANDS (`backstop code check` DOES NOT EXIST) ─────────────
  Re-confirmed 2026-07-28: `./bin/backstop code check` → `unknown command "code" for
  "backstop"`. The shipped top-level commands are artifact, baseline, commands,
  completion, gate, help, pack, recipe, version, waiver. Any task prescribing
  `backstop code check` prescribes a command that does not exist.

    middle: go build ./... && go test ./pkg/gate/... ./cmd/backstop/... -race -count=1
    final:  go build -o bin/backstop ./cmd/backstop/   (REBUILD — a stale binary gates
            the OLD code and reports a vacuous green)
            ./bin/backstop gate --json
            ./bin/backstop artifact validate --plan PLAN-ISSUE-098

  Report TRUE exit codes (`echo $?`). Never mask a non-zero exit behind a pipe.

  ── THE LOCAL BASELINE MAKES A GREEN GATE UNTRUSTWORTHY AS PROOF ─────────────
  The five ISSUE-036 findings are currently GRANDFATHERED locally (ISSUE-086
  divergence), so "the gate is green" would have been true BEFORE this fix too. The
  restoration proof must be baseline-independent, which is why TASK-007 mandates a
  test that drives the resolution directly and asserts on the RAW drift violations —
  and why TASK-010 reads `gate --json` violation contents rather than trusting the
  verdict.

  ── WHOLE-FILE FINDING ACTIVATION ───────────────────────────────────────────
  cmd/backstop/gate.go is a large, long-lived file. Touching it activates ALL of its
  findings, not just the edited lines (no-grandfather-on-changed-files). The
  implementer MUST clear every finding the gate raises on it — fixing them, not
  waiving them — and must report what was cleared. Keep the edit to gate.go MINIMAL
  (two functions: buildStatusDriftSteps and computeDriftSurfaces) precisely to keep
  that blast radius small; the new index-building code lives in its OWN new file.

  ── DO NOT PROVE THIS AGAINST packs/contracts — IT IS NOT THE INDEXED PACK ───
  An earlier draft of this plan mandated the restoration proof against the TRACKED
  <repoRoot>/packs/contracts/pack.yml. That was WRONG and is corrected here, because
