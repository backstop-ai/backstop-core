notes: |
  Closes the BUNDLE-010 mandated-test debt (ISSUE-012). SPEC-017 (pack-gate-
  integration) and SPEC-031 (pluggable-engine-dispatch) declare mandated test
  functions in their claims' `tests:` arrays. The gate's test_verification step
  fails whenever either spec is in diff scope because some of those named
  functions DO NOT EXIST in code. The end state: every SPEC-017/031 claim maps
  to an existing, passing test — achieved by BOTH the WRITE tasks in this plan
  AND the spec-author reconciliation prerequisite below (RETIRE/REPOINT items).

  ── METHOD ─────────────────────────────────────────────────────────────────
  Existence was checked per mandated `tests:` entry with
  `grep -rl "func <name>" cmd pkg` (NOT prose). 27 of the two specs' mandated
  functions are absent. Each absent function was classified WRITE / RETIRE /
  REPOINT against the CURRENT post-cutover substrate (engine model; the layer
  model is GONE), confirming the substrate each WRITE test would assert against
  actually exists before mandating it.

  ── SUBSTRATE THE WRITE TASKS ASSERT AGAINST (verified present) ─────────────
  - dispatchPackEngines / runFindingsEngine / runSandboxEngine
    (cmd/backstop/pack_gate.go) — group-by-engine dispatch, convert pipe,
    sandbox exit-code terminal branch.
  - convert pipe seam: resolveSandboxedRunStdout() →
    packval.SandboxedRunStdout (clean-stdout); resolveSandboxedRun() →
    packval.SandboxedRun (CombinedOutput) for the sandbox/none branch.
  - engine.Registry / DefaultRegistry (pkg/pack/engine/binding.go): semgrep,
    ast-grep (Convert: ast-grep/to-sarif.sh), sandbox (InputModeNone),
    golangci/go-build/go-test bindings.
  - check.ParsePackFindings → lookupParser("sarif") (pkg/check/parsers.go);
    dispatch resolves ONLY the SARIF parser.
  - layer-only rejection: validateEngine in pkg/pack/manifest.go (empty engine
    => blocking ConfigError; no layer:2→engine:semgrep alias).
  - existing fixture pack cmd/backstop/testdata/engine-dispatch/...engine-pack
    (semgrep + ast-grep + sandbox rules, stub + real converters, real-scan.json)
    and legacy-pack (layer-only, no-grandfather) and the go-toolchain pack
    (golangci config-file + go-build/go-test).
  - fake runners: emptySarifRunner, capturingRunner (dispatch_engines_test.go);
    convert helpers in gotoolchain_testhelpers_test.go.

  ── CATEGORIZED MISSING-TEST INVENTORY (27 total) ──────────────────────────
  WRITE (20) — surviving engine-substrate behavior lacking a test:
    SPEC-031:
      CLM-022 TestGateDispatch_SarifNativeNoConvert
      CLM-023 TestGateDispatch_NonSarifWithoutConvertFails
      CLM-024 TestGateDispatch_ConvertPipeProducesSarif
      CLM-025 TestGateDispatch_ConvertRunsSandboxed
      CLM-026 TestGateDispatch_EmptyConvertNoPipe
      CLM-029 TestGateDispatch_StderrBannerDoesNotCorruptSarif
      CLM-064 TestGateDispatch_ConvertStderrBannerDoesNotCorruptSarif
      CLM-065 TestGateDispatch_ConvertUsesCleanStdoutSandbox
      CLM-030 TestGateDispatch_AstGrepProofRuleEndToEnd
      CLM-031 TestGateDispatch_ReplacesSemgrepOnlyFeeder
      CLM-032 TestGateDispatch_MixedEnginesNotCrossFed
      CLM-033 TestEngineBinding_NoImportCycle
      CLM-066 TestEngineDispatch_SandboxNoneExitCodeViolationSkipsSarif
      CLM-037 TestMigration_GoPackEngineSemgrep + TestMigration_GoPackRulesRetainStandard
      CLM-038 TestMigration_NoSilentGrandfather
      CLM-039 TestGateDispatch_ConfigFileEngineRunsOwnRules
      CLM-040 TestGateDispatch_ConfigFileEngineNeedsNoGo
      CLM-041 TestProvision_NativeAssumedPresentFailsLoud
      CLM-042 TestProvision_IntroducedEngineAutoProvisioned
      CLM-043 TestProvision_EnsureSemgrepRetired
      CLM-049 TestPackLayout_EngineDirResolvesInputs
      CLM-050 TestPackLayout_MissingInputPathFailsLoud
    (CLM-037 carries two mandated names; counted once as a claim, both written.)

  RETIRE (5) — mandate a concept the cutover/engine model REMOVED; do NOT write:
    SPEC-017:
      CLM-010 TestGateIntegration_Layer3ValidatorExecuted  (layer model gone)
      CLM-011 TestGateIntegration_Layer3NamespacedIDs      (layer model gone)
      CLM-021 TestGateIntegration_CodeCheckLayer3FullProject (layer model gone)
    SPEC-031:
      CLM-035 TestEngineDispatch_BuildTestKeepFormatParsers (SPEC-034 reversed
              this: go-build/go-test now CONVERT to SARIF; the go-build/go-test/
              golangci-json formatParsers were REMOVED — the mandate asserts the
              pre-cutover behavior)
      CLM-067 TestEngineDispatch_SandboxBranchReKeyedFromLayer3 ("ReKeyedFrom
              Layer3" is a one-time migration-history assertion; rule.Layer is
              already fully gone from dispatch/validation)

  REPOINT targets for the RETIRE items (engine-model successors that ALREADY
  EXIST and pass — the spec-author repoints each claim's mandate to these
  rather than retiring the claim outright where a true successor exists):
    CLM-010 -> TestGateIntegration_SandboxValidatorExecuted (cmd/backstop/pack_gate_test.go)
    CLM-011 -> TestGateIntegration_SandboxNamespacedIDs    (cmd/backstop/pack_gate_test.go)
    CLM-021 -> TestGateIntegration_SandboxSingleFileScope  (cmd/backstop/pack_gate_test.go)
              (full-project sandbox visibility under code check; the engine-model
              successor to "layer-3 full project"; spec-author confirms scope)
    CLM-067 -> TestGateIntegration_SandboxValidatorExecuted (the relocated
              engine==sandbox exit-code branch; rule.Layer reference is gone)
    CLM-035 -> RETIRE outright (no successor): the asserted behavior was
              deliberately reversed by SPEC-034; build/test now ride
              convert→parseSarif. The claim's mandate must be removed, and its
              text reconciled to the post-cutover SARIF-convert behavior already
              covered by TestGoToolchainConvert_BuildToSarif_DirectFindings /
              TestGoToolchainConvert_TestToSarif_DirectFindings
              (cmd/backstop/gotoolchain_convert_test.go).

  ── REQUIRED PREREQUISITE / COORDINATED RECONCILIATION (NOT in this plan) ───
  The 5 RETIRE/REPOINT items above are SPEC-AUTHOR reconciliation, not test
  writing. The orchestrator MUST dispatch a spec-author to evolve SPEC-017 and
  SPEC-031 (via /spec, never hand-edit) so each listed claim's `tests:` mandate
  is either retired (CLM-035) or repointed to the named existing successor test
  (CLM-010/011/021/067). This plan's WRITE tasks close the other 20 claims; the
  end-state (SPEC-017/031 test_verification green when in diff scope) requires
  BOTH halves. The WRITE tasks have no code dependency on the reconciliation and
  may run in parallel with it, but the gate will not go green on the two specs
  until the reconciliation lands.

  ── TDD-INVERTED FRAMING (why some tasks are typed implementation) ──────────
  The production substrate already shipped (untested — that is the debt), so
  there is no green-phase code to write. Each cluster's mandated tests are
  authored first as `test` tasks; the new TEST-SUPPORT artifacts they require
  (new testdata fixture packs, stub scripts emitting stderr banners, the
  migration fixture pack, the import-cycle guard helper) are real new files
  created in a following `implementation` task that depends on the test task,
  satisfying gate cadence. Tests must be SUBSTANTIVE — assert real violations /
  errors against real fixtures and the real dispatch functions; this debt exists
  precisely because the substrate shipped untested, so NO stubbed/vacuous green.

phases:
  - id: phase-1
    name: "Phase 1: Convert pipe & SARIF-contract dispatch tests (SPEC-031 REQ-006/REQ-007/REQ-009)"
    tasks:
      - id: TASK-001
        type: test
        title: "Write SARIF-contract dispatch tests: native-no-convert, non-SARIF-fails, empty-convert-no-pipe"
        description: |
          Write the mandated tests asserting the findings-engine SARIF contract
          against the real dispatchPackEngines / runFindingsEngine
          (cmd/backstop/pack_gate.go) using a fake check.CommandRunner and the
          existing engine-dispatch fixture pack:
            - TestGateDispatch_SarifNativeNoConvert (CLM-022): a binding with an
              empty Convert sends engine stdout straight to ParsePackFindings;
              assert a real namespaced violation is produced from native SARIF.
            - TestGateDispatch_NonSarifWithoutConvertFails (CLM-023): non-SARIF
              engine stdout with empty Convert reaches parseSarif and FAILS LOUD
              (error attributed to the pack/engine), not a silent zero-finding
              green.
            - TestGateDispatch_EmptyConvertNoPipe (CLM-026): assert no convert
              executable is invoked when Convert == "" (e.g. a sandboxedRunStdout
              seam that records calls observes zero convert invocations).
          Substantive: real fixture pack, real dispatch entrypoint, asserts on
          violation content / error provenance — not on canned plumbing.
        files:
          - cmd/backstop/dispatch_sarif_contract_test.go
        claims:
          - CLM-022
          - CLM-023
          - CLM-026
        depends_on: []

      - id: TASK-002
        type: test
        title: "Write convert-pipe tests: pipe-produces-sarif, runs-sandboxed, stderr-banner-clean (engine + convert)"
        description: |
          Write the mandated tests for the two-process convert pipe and clean-
          stdout capture against runFindingsEngine and the resolveSandboxedRunStdout
          seam (cmd/backstop/pack_gate.go):
            - TestGateDispatch_ConvertPipeProducesSarif (CLM-024): a non-empty
              Convert binding pipes engine stdout → convert stdin → convert stdout
              (SARIF) → ParsePackFindings; assert the resulting namespaced
              violation carries the converted finding.
            - TestGateDispatch_ConvertRunsSandboxed (CLM-025): assert the convert
              executable is resolved relative to the pack dir and run via the
              SandboxedRunStdout seam (inject the seam; assert it received the
              pack-relative convert path).
            - TestGateDispatch_StderrBannerDoesNotCorruptSarif (CLM-029): an
              ENGINE writing a banner to stderr still yields parseable SARIF on
              stdout (RunStdout separation).
            - TestGateDispatch_ConvertStderrBannerDoesNotCorruptSarif (CLM-064): a
              CONVERT script writing a banner to stderr still yields parseable
              SARIF on its stdout via the clean-stdout sandbox capture.
            - TestGateDispatch_ConvertUsesCleanStdoutSandbox (CLM-065): assert the
              convert step uses the SandboxedRunStdout seam, never the
              CombinedOutput SandboxedRun (seam interception proves which path).
          Drives stub convert scripts that emit a stderr banner (created in
          TASK-003).
        files:
          - cmd/backstop/dispatch_convert_pipe_test.go
        claims:
          - CLM-024
          - CLM-025
          - CLM-029
          - CLM-064
          - CLM-065
        depends_on:
          - TASK-001

      - id: TASK-003
        type: implementation
        title: "Add convert-pipe test fixtures: SARIF-native pack + stderr-banner convert/engine stub scripts"
        description: |
          Create the new test-support fixtures the Phase-1 tests drive (real new
          files; the dispatch substrate itself is unchanged):
            - a SARIF-native fixture pack directory under
              cmd/backstop/testdata/engine-dispatch/sarif-native/ whose engine
              binding has an empty Convert and whose fake-runner stdout is native
              SARIF (for CLM-022/CLM-026);
            - a non-SARIF fixture (engine stdout that is NOT SARIF) for CLM-023;
            - a convert stub script that writes a banner to STDERR and SARIF to
              STDOUT (to-sarif-stderr-banner.sh) for CLM-064/CLM-065;
            - the corresponding backstop.yml / pack.yml / lockfile entries so the
              packs load through loadInstalledPacks.
          Make TASK-001 and TASK-002 pass against the real dispatch path.
        files:
          - cmd/backstop/testdata/engine-dispatch/sarif-native/backstop.yml
          - cmd/backstop/testdata/engine-dispatch/sarif-native/.backstop/packs/test-org/sarif-native-pack/pack.yml
          - cmd/backstop/testdata/engine-dispatch/.backstop/packs/test-org/engine-pack/ast-grep/to-sarif-stderr-banner.sh
        claims:
          - CLM-022
          - CLM-023
          - CLM-024
          - CLM-026
          - CLM-064
          - CLM-065
        depends_on:
          - TASK-001
          - TASK-002

      - id: TASK-004
        type: verification
        title: "Run code check over the convert-pipe / SARIF-contract test additions"
        description: |
          Run `backstop code check` (diff-scoped) to confirm the Phase-1 test
