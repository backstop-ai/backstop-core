            - TestPlan_Refactor_DependsOnVerificationFails: refactor depending
              on verification fails

          Verification dependency tests (REQ-006):
            - TestPlan_Verification_DependsOnImpl: verification depending on
              impl passes
            - TestPlan_Verification_DependsOnRefactor: verification depending
              on refactor passes
            - TestPlan_Verification_NoDependency: verification with no impl or
              refactor dependency fails
        files:
          - pkg/validate/plan_gate_test.go
        claims:
          - CLM-008
          - CLM-009
          - CLM-030
          - CLM-012
          - CLM-013
          - CLM-031
          - CLM-025
          - CLM-028
          - CLM-029
          - CLM-014
          - CLM-032
          - CLM-015
        depends_on:
          - TASK-004

      - id: TASK-006
        type: implementation
        title: "Implement gate cadence, verification deps, and refactor deps"
        description: |
          Add three new validation passes to pkg/validate/plan.go.

          New function validateGateCadence(filename string, phases []interface{}, typeMap map[string]string):
            - For each phase, collect task types present via phaseID lookup
            - If phase contains "implementation" or "refactor" tasks but no
              "verification" task: emit plan/gate-cadence-missing violation

          New function validateVerificationDeps(filename string, tasks []planTask, typeMap map[string]string):
            - For each task with taskType "verification":
              - Check that at least one entry in dependsOn references a task
                whose type is "implementation" or "refactor"
              - If none: emit plan/verification-requires-impl violation

          New function validateRefactorDeps(filename string, tasks []planTask, typeMap map[string]string):
            - For each task with taskType "refactor":
              - Check every entry in dependsOn
              - If any dependency has type "setup", "documentation", or
                "verification": emit plan/refactor-invalid-dependency violation
              - Valid dependency types for refactor: implementation, refactor, test

          Wire all three into validatePhases after the task type and TDD checks.
        files:
          - pkg/validate/plan.go
        claims:
          - CLM-008
          - CLM-009
          - CLM-030
          - CLM-012
          - CLM-013
          - CLM-031
          - CLM-025
          - CLM-028
          - CLM-029
          - CLM-014
          - CLM-032
          - CLM-015
        depends_on:
          - TASK-005

      - id: TASK-007
        type: verification
        title: "Verify gate cadence and dependency validation passes"
        description: |
          Run tests and lint for Phase 3 implementation.

          Commands:
            - go test ./pkg/validate/ -run "TestPlan_GateCadence|TestPlan_Refactor|TestPlan_Verification" -race -v
            - go tool golangci-lint run ./pkg/validate/
        files:
          - pkg/validate/plan_gate_test.go
        claims:
          - CLM-008
          - CLM-014
        depends_on:
          - TASK-006

