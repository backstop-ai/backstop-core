        type: test
        title: "Write tests for final phase verification and phase-level parallelism"
        description: |
          Write failing tests in pkg/validate/plan_final_test.go for REQ-004
          (final phase verification) and REQ-011 (phase-level parallelism).

          Final phase verification tests (REQ-004):
            - TestPlan_FinalPhase_HasVerification: plan with verification in
              final phase passes
            - TestPlan_FinalPhase_NoVerification: plan with no verification in
              final phase fails
            - TestPlan_FinalPhase_ComprehensiveVerification: plan with .go files
              and .plan.yml files — final phase has verification tasks covering
              both code and artifact categories — passes
            - TestPlan_FinalPhase_IncompleteVerification: plan with .go files
              and .plan.yml files — final phase only covers code category —
              fails with plan/final-phase-missing-category

          Phase-level parallelism tests (REQ-011):
            - TestPlan_PhaseParallel_DisjointFiles: two phases with no dependency
              chain and disjoint file sets pass
            - TestPlan_PhaseParallel_OverlappingFiles: two phases with no
              dependency chain and overlapping file sets fail with
              plan/phase-file-exclusivity
        files:
          - pkg/validate/plan_final_test.go
        claims:
          - CLM-010
          - CLM-011
          - CLM-026
          - CLM-027
          - CLM-023
          - CLM-024
        depends_on:
          - TASK-010

      - id: TASK-012
        type: implementation
        title: "Implement final phase verification and phase-level file exclusivity"
        description: |
          Add final phase verification and phase-level file exclusivity to
          pkg/validate/plan.go.

          New function validateFinalPhase(filename string, phases []interface{}, allTasks []planTask, typeMap map[string]string):
            - Identify final phase (last entry in phases array)
            - Verify final phase contains at least one verification task;
              if not: emit plan/final-phase-no-verification
            - Collect all file extensions across all tasks in the entire plan
            - Map extensions to categories:
              - Code: .go
              - Artifact: .spec.md, .plan.yml, .adr.md, .bundle.md, .issue.md,
                .standard.md
            - For each required category, check that the final phase has at
              least one verification task whose files include a file in that
              category
            - If a category is missing: emit plan/final-phase-missing-category

          New function checkPhaseFileExclusivity(filename string, phases []interface{}, allTasks []planTask):
            - Build phase dependency graph: phase A depends on phase B if any
              task in A depends (directly) on any task in B
            - Compute transitive closure of phase dependencies
            - For each pair of parallel-eligible phases (no transitive dep):
              - Compute union of all file sets per phase
              - Check disjointness
              - If overlap: emit plan/phase-file-exclusivity violation

          Wire both into validatePhases.
        files:
          - pkg/validate/plan.go
        claims:
          - CLM-010
          - CLM-011
          - CLM-026
          - CLM-027
          - CLM-023
          - CLM-024
        depends_on:
          - TASK-011

      - id: TASK-013
        type: verification
        title: "Verify final phase and phase-level parallelism passes"
        description: |
          Run tests and lint for Phase 5 implementation.

          Commands:
            - go test ./pkg/validate/ -run "TestPlan_FinalPhase|TestPlan_PhaseParallel" -race -v
