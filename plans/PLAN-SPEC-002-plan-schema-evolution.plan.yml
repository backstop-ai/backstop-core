---
plan_id: PLAN-SPEC-002
spec_id: SPEC-002
spec_version: 1.0.0
created: "2026-03-31"
status: draft
target_repo: backstop-core
target_module: github.com/bmanson/backstop-core
test_command: "go test ./pkg/validate/ -run TestPlan -race -coverprofile=cover.out"
coverage_threshold: 90

notes: |
  Extends the plan validator with task type classification, TDD ordering enforcement,
  gate cadence verification, and phase-level file exclusivity. Six new validation
  passes are added to the existing Plan() function in pkg/validate/plan.go.

  The planTask struct gains a taskType field. A taskTypeMap lookup is built once per
  plan and shared across all new validation passes. All existing validation rules
  (D-080, D-081, plan_id pattern, cycle detection, etc.) are preserved.

  The plan schema (artifacts/plan/v1/schema.json) is updated to document the task
  type field, its enum values, and enforcement rules.

  Existing PLAN-SPEC-001 must be updated with task types to pass the new validator.

  Dependency chain: all phases are strictly sequential (each phase's test task
  depends on the prior phase's verification task) because every implementation and
  test task touches pkg/validate/plan.go or its test files. Parallelism within
  this plan is limited — the work is inherently sequential modifications to a
  single validator file.

  Structure:
    Phase 1: Setup — test helpers
    Phase 2: Task type validation + TDD enforcement (tests, impl, verification)
    Phase 3: Gate cadence + verification deps + refactor deps (tests, impl, verification)
    Phase 4: Test task deps + setup/docs constraints (tests, impl, verification)
    Phase 5: Final phase verification + phase-level parallelism (tests, impl, verification)
    Phase 6: Schema update + existing plan migration (tests, impl, verification)
    Phase 7: Comprehensive verification

phases:
  # ═══════════════════════════════════════════════════════════════════════
  # Phase 1: Setup — Test Fixtures
  # ═══════════════════════════════════════════════════════════════════════
  - id: phase-1
    name: "Phase 1: Setup — Test Helpers"
    tasks:
      - id: TASK-001
        type: setup
        title: "Create test helpers for typed plan artifacts"
        description: |
          Create pkg/validate/plan_type_helpers_test.go with helper functions
          shared across all new test files.

          Helper functions:
            - makeTask(id, taskType string, files, claims, deps []string) —
              builds a task map[string]interface{} with all required D-080 fields
              plus the new type field. Uses sensible defaults for title and
              description.
            - makePhase(id, name string, tasks ...map[string]interface{}) —
              wraps tasks in a phase map with id and name.
            - validTypedPlanArtifact() — returns a ParsedArtifact with properly
              typed tasks following the full TDD cycle:
              Phase 1: setup task -> test task -> implementation task ->
              verification task. This becomes the baseline valid artifact for
              all new tests.

          These helpers reduce boilerplate across 35+ new test functions.
        files:
          - pkg/validate/plan_type_helpers_test.go
        claims:
          - CLM-001
        depends_on: []

  # ═══════════════════════════════════════════════════════════════════════
  # Phase 2: Task Type Validation + TDD Enforcement
  # ═══════════════════════════════════════════════════════════════════════
  - id: phase-2
    name: "Phase 2: Task Type Validation and TDD Enforcement"
    tasks:
      - id: TASK-002
        type: test
        title: "Write tests for task type validation and TDD enforcement"
        description: |
          Write failing tests in pkg/validate/plan_type_test.go for REQ-001
          (task type classification) and REQ-002 (TDD ordering).

          Task type tests (REQ-001):
            - TestPlan_TaskTypeValid: plan with all six valid types passes
            - TestPlan_TaskTypeMissing: task without type field fails with
              plan/task-type-required error
            - TestPlan_TaskTypeInvalid: task with type "unknown" fails with
              plan/task-type-invalid error

          TDD enforcement tests (REQ-002):
            - TestPlan_TDD_ImplDependsOnTest: implementation task with test
              dependency passes
            - TestPlan_TDD_ImplWithoutTestDependency: implementation depending
              only on another implementation fails
            - TestPlan_TDD_TwoImplInRow: implementation depending on impl
              (which depends on impl) fails — two impl in a row
            - TestPlan_TDD_ImplDependsOnSetupOnly: implementation depending
              only on setup fails

          All tests should fail initially (red phase) since the validation
          logic does not yet exist.
        files:
          - pkg/validate/plan_type_test.go
        claims:
          - CLM-001
          - CLM-002
          - CLM-003
          - CLM-004
          - CLM-005
          - CLM-006
          - CLM-007
        depends_on:
          - TASK-001

      - id: TASK-003
        type: implementation
        title: "Implement task type validation and TDD enforcement"
        description: |
          Add task type validation and TDD enforcement to pkg/validate/plan.go.

          Changes to planTask struct:
            - Add taskType string field

          New package-level var:
            - validTaskTypes map[string]bool with six valid values

          New validation in validatePhases():
            - Extract "type" field from each task map, store in planTask.taskType
            - If type is missing: emit plan/task-type-required violation
            - If type is not in validTaskTypes: emit plan/task-type-invalid violation
            - Build taskTypeMap (map[string]string) from task ID to task type

          New function validateTDD(filename string, tasks []planTask, typeMap map[string]string):
            - For each task with taskType "implementation":
              - Check that at least one entry in dependsOn references a task
                whose type in typeMap is "test"
              - If none: emit plan/tdd-impl-requires-test violation

          Wire both checks into validatePhases after existing D-080/D-081 checks.
        files:
          - pkg/validate/plan.go
        claims:
          - CLM-001
          - CLM-002
          - CLM-003
          - CLM-004
          - CLM-005
          - CLM-006
          - CLM-007
        depends_on:
          - TASK-002

      - id: TASK-004
        type: verification
        title: "Verify task type and TDD enforcement passes"
        description: |
          Run the test suite and lint checks to verify Phase 2 implementation.

          Commands:
            - go test ./pkg/validate/ -run "TestPlan_TaskType|TestPlan_TDD" -race -v
            - go tool golangci-lint run ./pkg/validate/
        files:
          - pkg/validate/plan_type_test.go
        claims:
          - CLM-001
          - CLM-004
        depends_on:
          - TASK-003

  # ═══════════════════════════════════════════════════════════════════════
  # Phase 3: Gate Cadence + Verification Deps + Refactor Deps
  # ═══════════════════════════════════════════════════════════════════════
  - id: phase-3
    name: "Phase 3: Gate Cadence, Verification Dependencies, and Refactor Dependencies"
    tasks:
