      - id: TASK-010
        type: verification
        title: "Verify test task dependency and setup/docs constraint passes"
        description: |
          Run tests and lint for Phase 4 implementation.

          Commands:
            - go test ./pkg/validate/ -run "TestPlan_TestTask|TestPlan_Setup|TestPlan_Documentation" -race -v
