      - id: TASK-009
        type: implementation
        title: "Implement test task dependency validation"
        description: |
          Add test task dependency validation to pkg/validate/plan.go.

          New function validateTestTaskDeps(filename string, tasks []planTask, typeMap map[string]string):
            - For each task with taskType "test":
              - Check every entry in dependsOn
              - If any dependency has type other than "setup", "test", or "verification":
                emit plan/test-invalid-dependency violation
              - Valid dependency types for test: setup, test, verification

          Setup and documentation tasks have no type-based dependency constraints
          (REQ-007), so no validation is needed for them — they pass by default.

          Wire into validatePhases after existing type-constraint checks.
        files:
          - pkg/validate/plan.go
        claims:
          - CLM-020
          - CLM-021
          - CLM-022
          - CLM-033
          - CLM-034
          - CLM-035
          - CLM-016
          - CLM-017
        depends_on:
