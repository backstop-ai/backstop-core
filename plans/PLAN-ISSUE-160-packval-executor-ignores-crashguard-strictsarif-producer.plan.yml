    * CRASHGUARD: `CrashGuard: true`, engine exits 2 and prints nothing.
    * STRICTSARIF: `StrictSarif: true`, engine prints golangci-v1-shaped JSON
      (`{"Issues":[{"Text":"boom"}]}` — a valid JSON OBJECT with no `runs` key).
    * PRODUCER: `Producer: "produce.sh"` (which emits SARIF carrying ONE result) while
      `Command` is a plain script that emits nothing. The producer is never invoked.
    * PRODUCER-MISSING: `Producer: "nope.sh"`, no such file. Silently ignored.

  `Passed: false` WITH A NIL ERROR IS A **POSITIVE** PHASE-3 FIXTURE'S SILENT SUCCESS.
  DIR-032's item 21 warns in as many words against stating this backwards, so it is
  stated here from a direct read of the two fixture loops in `pkg/packval/phase3.go`
  (locate by `func RunFixtures(`, never by line number), which are DELIBERATELY OPPOSITE
  SHAPES:

    * the POSITIVE loop appends an error only on `case r.Passed:` — a finding on the
      CLEAN example is a false positive — so a not-fired, error-free verdict passes it
      SILENTLY, with nothing reported at all;
    * the NEGATIVE loop appends its error on `else if !r.Passed` ("negative fixture not
      triggered"), so the SAME verdict REDS a negative fixture — loudly, but blaming the
      fixture for a run that crashed, invoked the wrong command, or emitted a shape the
      parser could not read.

  The silent half is the dangerous one. That is why all three belong to DIR-032 and not
  to DIR-024, and it is the
  homing argument the directive's item 21 already made: every one of these failure
  modes converges on `parseSarif` (`pkg/check/parsers.go` — locate by `func parseSarif(`,
  never by line number) returning `(nil, nil)`. It short-circuits
  `len(bytes.TrimSpace(out)) == 0` to a nil slice and a nil error, and it
  `json.Unmarshal`s into the `sarifLog` STRUCT, so any valid JSON OBJECT lacking `runs`
  also yields zero findings and no error. Verified by reading that function directly,
  not assumed.

  So a pack author validating a `Producer`/`CrashGuard`/`StrictSarif`-declaring binding
  sees a clean local pass over a run that invoked the wrong command, crashed, or emitted
  the wrong shape entirely.

