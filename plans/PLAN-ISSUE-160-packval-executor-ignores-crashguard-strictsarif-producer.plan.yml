phases:
  - id: phase-1
    name: "Phase 1: Producer substitution — invoke the declared producer in place of the plain command"
    tasks:
      - id: TASK-001
        type: test
        title: "Write the failing Producer-substitution tests for DefaultExecutor.RunEngine"
        description: |
          Create `pkg/packval/executor_producer_test.go` (NEW FILE). Do NOT extend
          `executor_convert_test.go`, `executor_stdout_artifact_test.go` or
          `executor_never_started_test.go` — those are other (completed) lanes' files, and
          keeping each of this plan's three cycles in its own file is what makes the diff
          legible.

          READ `pkg/packval/executor_stdout_artifact_test.go` AND
          `pkg/packval/executor_convert_test.go` FIRST. Together they are the direct
          precedent for every mechanic here and they already own the shared helpers (SE2):
          `convertFixturePackDir(t)` for a symlink-resolved temp packDir,
          `writeConvertFixtureScript(t, dir, name, body)` for an executable fixture script
          (it returns the ABSOLUTE path — use it, SE4). REDECLARING ANY HELPER IS A COMPILE
          ERROR.

          Every test builds its fixture pack at runtime in a temp dir, constructs an
          `engine.EngineBinding` by hand with NO `Provision` block (SE3), and calls
          `(&DefaultExecutor{}).RunEngine(packDir, binding, targets)` directly. No test in
          this file needs `requireSandboxPlatform` (SE13) — nothing here runs a convert.

          THE RED WINDOW IS EXPECTED AND MUST BE CLOSED IN THE SAME SITTING. This task
          deliberately leaves `go test ./pkg/packval/... -race -count=1` RED — that is the
          falsification bar. Proceed directly to TASK-002; do not hand off or
          context-switch with the package suite red.

          MANDATED TESTS:

          TestPackVal_EngineProducer_ProducerInvokedInPlaceOfCommand (CLM-001) —
            THE FALSIFICATION. Write TWO scripts into packDir: a producer that emits a
            valid SARIF document containing exactly ONE result, and a plain command that
            emits NOTHING and exits 0. Binding: `Command` = the ABSOLUTE path to the plain
            script (SE4), `Producer` = the PACK-RELATIVE name of the producer script (SE5).
            Assert err is nil AND `Passed` is true.
            RECORD THE PRE-FIX FAILURE VERBATIM — it is the lying verdict this cycle exists
            for. Measured 2026-08-17 against HEAD: this returns `Passed=false`,
            `ExitCode=0` and a NIL error, because the plain command ran and `parseSarif`
            reads empty stdout as zero findings with no error. The test must fail on the
            `Passed` assertion, NOT on an error assertion. If it fails with a non-nil
            error instead, something else is wrong (most likely SE3 or SE4) — investigate
            before writing the fix.

          TestPackVal_EngineProducer_AbsentDeclarationRunsPlainCommand (CLM-002) —
            the non-regression leg. The plain command emits valid SARIF with one result;
            `Producer` is EMPTY. Assert err is nil, `Passed` is true, and `Output` still
            carries the command's own stdout. The pack dir deliberately contains NO
            producer script at all, so an implementation that stats or runs a producer
            unconditionally surfaces as a refusal rather than passing silently.
            This test MUST be green both before and after TASK-002.

          TestPackVal_EngineProducer_ArgvPreservedIncludingCommandTail (CLM-003) —
            substitution replaces the NAME, not the arg shaping (D1). This is the leg that
            distinguishes the findings-path semantics from the coverage-path (bare-call)
            semantics, and it is the one an implementer is most likely to get wrong (SE6).
            Binding: `Command: "<abs-path-to-plain.sh> build"` (a command WITH a tail),
            `InputFlag: "--config"`, `Producer: "produce.sh"`, targets
            `[]string{"rules/sample.yml", "fixtures/case.txt"}`.
            The producer script ECHOES ITS OWN ARGV to a file in its cwd (packDir), one
            argument per line, and separately emits a valid one-result SARIF document to
            stdout. After the run, read that file and assert the recorded argv is EXACTLY,
            in order: `build`, `--config`, `rules/sample.yml`, `fixtures/case.txt`.
            Assert the FULL ORDERED SEQUENCE, not just membership — a bare invocation
            records an EMPTY argv and an implementation that drops the command tail
            records three entries instead of four. Both must fail here.

          TestPackVal_EngineProducer_MissingProducerFailsLoud (CLM-004) — binding declares
            `Producer: "scripts/absent-producer.sh"` with no such file; the plain command
            is present and would succeed. Assert a NON-NIL error; assert `Passed` is false;
            assert the message contains BOTH the declared value
            (`scripts/absent-producer.sh`) and the RESOLVED path
            (`filepath.Join(packDir, filepath.FromSlash("scripts/absent-producer.sh"))`).
            Assert additionally that the run did NOT silently succeed off the plain command
            — a nil error here is the exact soft-failure regression CLM-004 forbids, and it
            is what happens TODAY (measured: `Passed=false ExitCode=0 err=<nil>`).
            NOTE THE PRE-FIX SHAPE SO IT IS NOT MISREAD: unlike CLM-001, this test's
            `Passed` is false assertion ALREADY PASSES pre-fix while the non-nil-error and
            both substring assertions are RED. That partial pre-fix greenness is correct
            and expected.

          TestPackVal_EngineProducer_ResolvedAgainstPackDirAndNamedOnNeverStarted
            (CLM-005) — pins the base directory and the never-started subject. TWO legs:
              (a) NESTED PACK-RELATIVE PRODUCER: write the producer to
                  `scripts/produce.sh` under packDir (`mkdir -p` its parent) and declare
                  `Producer: "scripts/produce.sh"`. It emits a valid one-result SARIF.
                  Assert err is nil and `Passed` is true. Because the resolution is joined
                  against packDir, a read relative to the TEST PROCESS's cwd
                  (`pkg/packval` during `go test`) finds nothing.
              (b) UNSTARTABLE PRODUCER: write a producer file that EXISTS but is NOT
                  executable (mode 0o644), so it passes the `os.Stat` existence check and
                  then fails to exec. Assert the error names the NEVER-STARTED condition
                  (match on the substring `never started`) AND names the RESOLVED PRODUCER
                  PATH, and assert it does NOT name `binding.Command` — blaming the tool
                  for a producer that never ran is a misattribution (D4). Assert `Passed`
                  is false.
            Do NOT use an absolute producer path anywhere in this test (SE5) — that would
            resolve identically under any base and destroy leg (a)'s discrimination. Do NOT
            create a decoy file outside packDir; nothing in this lane writes outside its
