             verdict a POSITIVE phase-3 fixture accepts as a silent clean pass (and that a
             NEGATIVE fixture reds on as "not triggered", blaming the fixture).
             → TestPackVal_EngineProducer_ProducerInvokedInPlaceOfCommand

    CLM-002  THE ASSERTION THAT KEEPS CLM-001 HONEST — non-regression on the
             no-declaration path. A binding with `Producer == ""` runs `binding.Command`
             exactly as before and stats no file. Without this, CLM-001 could be
             satisfied by a change that breaks every ordinary engine.
             → TestPackVal_EngineProducer_AbsentDeclarationRunsPlainCommand

    CLM-003  SUBSTITUTION REPLACES THE INVOKED NAME ONLY — THE ARGV IS PRESERVED. The
             producer receives exactly the args `buildEngineArgv` shaped for the plain
             command: the `Command`'s own tail, the `InputFlag` when set, and the fixture
             targets, in that order. D1, made mechanical. An implementation that invokes
             the producer BARE (the coverage-path semantics) fails here.
             → TestPackVal_EngineProducer_ArgvPreservedIncludingCommandTail

    CLM-004  A DECLARED-BUT-MISSING producer is a fail-loud broken run naming BOTH the
             declared value and the resolved path — NEVER a silent fall-back to the
             plain command. Measured today: silently ignored, `err=<nil>`. A fall-back
             would make a mis-typed declaration look like it worked, which is strictly
             worse than today because it would look fixed.
             → TestPackVal_EngineProducer_MissingProducerFailsLoud

    CLM-005  THE BASE IS `packDir` (D2), AND THE NEVER-STARTED REFUSAL FOLLOWS THE
             PRODUCER (D4). A nested pack-relative producer (`scripts/produce.sh`)
             resolves under packDir; an unstartable producer is reported as NEVER STARTED
             naming the PRODUCER PATH, not `binding.Command` — naming the command would
             misdirect the reader to a tool that was never reached.
             → TestPackVal_EngineProducer_ResolvedAgainstPackDirAndNamedOnNeverStarted

    ── CRASHGUARD (phase 2) ──

    CLM-006  THE DEFECT / THE LYING VERDICT, CRASHGUARD EDITION. For a binding declaring
             `CrashGuard: true`, a run that exits NON-ZERO and yields ZERO parseable
             findings is a tool/infra crash and fails loud, naming the engine. Measured
             today: `Passed=false ExitCode=0 err=<nil>` — the verdict a POSITIVE fixture
             accepts as a silent clean pass, so a crashed engine validates the pack over a
             run that produced nothing at all. (Against a NEGATIVE fixture the same verdict
             reds, but as "negative fixture not triggered" — loud and misattributed to the
             fixture rather than to the crash.)
             → TestPackVal_EngineCrashGuard_NonZeroExitWithNoFindingsFailsLoud

    CLM-007  NON-REGRESSION — THE GUARD IS OPT-IN. With `CrashGuard` false (every
             rule-fed findings engine), a non-zero exit with zero findings still returns
             `Passed: false` with a NIL error, unchanged. The exit code is not the
             contract for an ordinary findings engine; only a CrashGuard engine's is.
             → TestPackVal_EngineCrashGuard_UnsetLeavesNonZeroExitUnchanged

    CLM-008  THE GUARD DOES NOT FIRE WHEN THE ENGINE ACTUALLY REPORTED. A CrashGuard
             engine that exits non-zero WITH parseable findings is the normal
             findings-engine case and must return `Passed: true` with a nil error. This
             is the leg that stops the fix from being "CrashGuard means non-zero exit is
             fatal", which would red every real build/test engine that finds something.
             Anchored by the package's existing
             `TestExecutor_RunEngineStartedNonZeroExitStillReportsFindings`, which
             declares no CrashGuard and must stay green.
             → TestPackVal_EngineCrashGuard_NonZeroExitWithFindingsStillReports

    CLM-009  ORDER — THE NEVER-STARTED REFUSAL STILL COMES FIRST. A CrashGuard-declaring
             engine whose process never started reports NEVER STARTED, not "crashed":
             "crashed: non-zero exit with no parseable findings" mis-describes a binary
             that never ran at all. Same misattribution class ISSUE-112 and ISSUE-140
             both exist to kill.
             → TestPackVal_EngineCrashGuard_NeverStartedPrecedesCrashGuard

    ── STRICTSARIF (phase 3) ──

    CLM-010  THE DEFECT / THE LYING VERDICT, STRICTSARIF EDITION. For a binding declaring
             `StrictSarif: true`, a payload that is valid JSON but not a SARIF log (no
             `runs` array) fails loud instead of parsing to zero findings. Measured
             today with a golangci-v1-shaped `{"Issues":[...]}`:
             `Passed=false ExitCode=0 err=<nil>`.
             → TestPackVal_EngineStrictSarif_NonSarifJsonFailsLoud

    CLM-011  NON-REGRESSION — THE GUARD IS OPT-IN. With `StrictSarif` false, the same
             non-SARIF JSON still parses leniently to zero findings with a nil error.
             The lenient parse is deliberate for engines that do not promise SARIF; only
             a declaring binding gets the strict reading.
             → TestPackVal_EngineStrictSarif_UnsetLeavesLenientParseUnchanged

    CLM-012  WELL-FORMED SARIF PASSES, AND AN EMPTY PAYLOAD IS NOT MALFORMED. Two legs:
             a real SARIF log with one result under `StrictSarif: true` reports fired;
             an EMPTY payload under `StrictSarif: true` returns `Passed: false` with a
             NIL error. The empty case mirrors the gate's own early return — a genuinely
             clean run may emit nothing, and the emptiness-is-suspicious discipline
             belongs to CrashGuard and the never-started refusal, not to a shape check.
             → TestPackVal_EngineStrictSarif_ValidSarifAndEmptyPayloadPass

    CLM-013  THE GUARD IS GATED ON `binding.Convert == ""` (D5). A binding declaring BOTH
             `StrictSarif` AND `Convert` does NOT get the shape guard applied to its
             pre-convert payload: non-SARIF input is precisely what a convert exists to
             reshape, so guarding there would fail-loud on a correctly-authored pack.
             → TestPackVal_EngineStrictSarif_ConvertDeclaringBindingExempt

    CLM-014  ORDER — THE GUARD READS THE **SELECTED** PAYLOAD, NOT RAW STDOUT. A binding
             declaring `StrictSarif` alongside a `StdoutArtifact` is judged on the
             ARTIFACT's bytes. Proven in BOTH directions, so a guard wired ahead of
             ISSUE-144's selection stage gives the wrong answer rather than the right one
             by accident.
             → TestPackVal_EngineStrictSarif_GuardReadsSelectedPayload

    ── CROSS-CUTTING (phase 4) ──

    CLM-015  TOOL-BLINDNESS (D6). `pkg/packval/executor.go` contains no tool or language
             literal — the strict-SARIF refusal in particular must not carry the gate's
             `golangci-lint` wording. A mechanical source scan, because the gate's
             message is the exact text an implementer will be reading while writing this
             stage, and copying it would bake a tool name into the generic
             pack-validation dispatch (CLAUDE.md first principle).
             → TestPackVal_EngineGateParity_ExecutorCarriesNoToolLiteral

    CLM-016  NO-DRIFT GUARD, ALL THREE FIELDS, BOTH SIDES. `RunEngine` and the gate's
             honoring sites each reference all three fields. Extends the guard discipline
             PLAN-ISSUE-141 (CLM-006) and PLAN-ISSUE-144 (CLM-008) established, and holds
             the line until ISSUE-143's consolidation is planned.

             WINDOW BY FUNCTION NAME — THIS IS NOT OPTIONAL, IT IS WHAT MAKES THE GUARD
             NON-VACUOUS. `cmd/backstop/pack_gate.go` contains TWO independent producer
             blocks (one in `runCoverageEngine`, one in `runFindingsEngine`), so a
             whole-file scan for `binding.Producer` CANNOT FAIL even if
             `runFindingsEngine`'s block were deleted outright. The StrictSarif half needs
             a THIRD window in a SECOND file: `runFindingsEngine` holds only the CALL to
             `requireLintSarifShape`, while the `binding.StrictSarif` flag check lives in
             `func requireLintSarifShape(` in `cmd/backstop/pack_gate_golint.go`.

             CONTENT SCAN, NOT TREE STATE: no `git status`, no `git diff`, no
             working-tree-cleanliness assertion, no line numbers. This is a shared tree
             with concurrent lanes and a tree-state assertion blames whoever runs it.
             → TestPackVal_EngineGateParity_NoDriftFromGateDispatch

  ── SHARP EDGES ───────────────────────────────────────────────────────────

    SE1  ORDER IS LOAD-BEARING AND EVERY INSERTION HAS TWO NAMED NEIGHBOURS (D7). All
         three edits are INSERTIONS. Do NOT modify, reword, reorder or "tidy" the trust
         gate, `buildEngineArgv`, the never-started refusal, the stdout_artifact
         selection, the convert block or the parse call — every one of them is another
         (completed) lane's delivered work, and `pkg/packval/executor.go` is where
         PLAN-ISSUE-140 and PLAN-ISSUE-141 already had to sequence around each other.

    SE2  THE TEST HELPERS ALREADY EXIST IN THIS PACKAGE — REUSE THEM, DO NOT REDECLARE.
         `pkg/packval/executor_convert_test.go` owns `writeConvertFixtureScript` (returns
         the ABSOLUTE path), `convertFixturePackDir`, `requireSandboxPlatform`,
         `readGuardSource`, `windowFunc`, `nonSarifEngineScript` and
         `toSarifConvertScript`. `pkg/packval/executor_stdout_artifact_test.go` owns
         `stdoutArtifactSarif`, `stdoutArtifactEngineScript` and
         `runStdoutArtifactFixture`. `pkg/packval/executor_never_started_test.go` owns
         `writeUnstartableEngineScript`. `pkg/packval/engine_dispatch_test.go` owns
         `readSource` (its own source reader, distinct from `readGuardSource`) and the
         pre-existing tool-literal guard CLM-015 strengthens — see TASK-010. Redeclaring
         ANY of them is a duplicate
         declaration in package `packval` — a compile error that presents as an unrelated
         build failure across the whole package and costs an investigation. Call them. New
         helpers must be prefixed so they cannot collide (`producer...`, `crashGuard...`,
         `strictSarif...`, `gateParity...`).

    SE3  NO `Provision` BLOCK ON ANY FIXTURE BINDING. `RunEngine` runs
         `engine.CheckToolAllowed` FIRST when `Provision` is non-nil, and a fixture script
         is not on the trusted-tool allowlist — every test would die at the allowlist gate
         before reaching the code under test, and the failure would look like a
         dispatch bug.

    SE4  `binding.Command` MUST BE AN ABSOLUTE PATH to the temp-dir script.
         `buildEngineArgv` hands the name to `exec.Command`, which resolves a
         separator-less name through PATH and a relative one against the PROCESS cwd —
         NOT against `cmd.Dir`. A bare basename trips `check.NeverStarted` and stays red
         after the fix lands, indistinguishable from the defect.
         `writeConvertFixtureScript` already returns the absolute path; use its return
         value.

    SE5  `binding.Producer`, IN CONTRAST, MUST BE DECLARED **PACK-RELATIVE** — and the
         fixture must NOT use an absolute producer path. An absolute path would resolve
         identically under any base and destroy CLM-005's discrimination. This is the
         mirror of SE4, not a contradiction of it: `Command` is handed to `exec.Command`
         raw, while `Producer` is joined against `packDir` first.

    SE6  THE PRODUCER RECEIVES THE COMMAND'S OWN TAIL AS ARGV — INCLUDING ANY SUBCOMMAND.
         `buildEngineArgv` consumes only `fields[0]` as the name, so a binding with
         `Command: "mytool build"` hands the producer `build` as `$1`, then the
         `InputFlag`, then the targets. A fixture producer script written as
         `mytool build "$@"` would therefore run `mytool build build ...`. This exact
         class cost a full gate outage on PLAN-ISSUE-067 (`go test test ./...` exits 1 on
         a fully green tree). Write fixture producers to forward `"$@"` verbatim, and
         make CLM-003 assert on the observed argv rather than trusting the shape.

    SE7  ERROR WORDING FOLLOWS `RunEngine`'s OWN SUBJECT. Its existing refusals read
         `engine %q ...`; the gate's read `pack %s ...` because a manifest name is in
         scope there and is not here. Mirror the gate's SHAPE (name the declared value
         and the resolved path, wrap an underlying error with `%w`), never its subject.

    SE8  TOOL-BLIND WORDING (D6, CLM-015). Do not copy the gate's golangci-naming
         message into `pkg/packval`. The refusal must describe the SHAPE (`no "runs"
         array`) and the CONSEQUENCE (a lenient parse would read zero findings), naming
         the engine via `binding.Command` and no tool or language.

    SE9  `cmd/backstop/pack_gate.go` AND `cmd/backstop/pack_gate_golint.go` ARE READ-ONLY
         IN THIS LANE and are deliberately ABSENT from every task's `files` list.
         CLM-016's guard READS them from disk; no task edits them. Consolidating the sites
         is ISSUE-143's work.

    SE10 DO NOT PLUMB A NEW PARAMETER INTO `RunEngine`. Its existing signature
         (`packDir`, `binding`, `targets`) already carries everything all three stages
         need. Changing it would touch `FixtureExecutor`, `MockExecutor` and all four
         `phase3.go` call sites — PLAN-ISSUE-092's scope — for no gain.

    SE11 KEEP ALL THREE STAGES INLINE IN `RunEngine`. Do not factor the shape probe (or
         anything else) into a package-level helper: CLM-016's guard windows
         `func (d *DefaultExecutor) RunEngine(` by name, and a helper call would move the
         field reference OUT of that window and turn the guard vacuous. Four stages
         already live inline there; these three join them. Extraction is ISSUE-143's.

    SE12 `runErr` MUST STAY IN SCOPE ALL THE WAY TO THE CRASH GUARD. Today it is consumed
         only by `check.NeverStarted` immediately after `cmd.Run()`. Do not narrow it to a
         bool, do not shadow it, and do not reuse the identifier for the convert's or the
         artifact read's error.

    SE13 NONE OF THESE TESTS NEEDS THE SANDBOX EXCEPT THE ONE THAT RUNS A CONVERT. Only
         the Convert step is sandboxed. `requireSandboxPlatform(t)` may appear ONLY in
         CLM-013's test (the one binding that declares a `Convert`). Guarding the others
         would skip real coverage on Linux — the only platform that gates merges — and
         turn this lane's central falsifications into vacuous greens in CI.

    SE14 `ExecutionResult` EXPOSES ONLY `Passed`, `Output` AND `ExitCode`. There is no
         findings slice to assert on, so every behavioural assertion is built around the
         Passed/not-Passed discriminator plus the error. Where one direction alone could
         pass by accident, a SECOND LEG in the opposite direction is mandated below. Do
         not weaken a second leg away.

  ── WHAT IS DELIBERATELY NOT FIXED HERE (RESIDUALS) ────────────────────────
  Recorded so a reviewer does not read these as oversights:

    (R1) SINGLE-AUTHORITY CONSOLIDATION IS STILL NOT DONE. After this lane, TWO dispatch
         paths independently honor Producer, CrashGuard, StrictSarif, StdoutArtifact and
         Convert. That is ISSUE-143's subject; it is open and unplanned (verified above).
         CLM-016 here, plus PLAN-ISSUE-144's CLM-008 and PLAN-ISSUE-141's CLM-006, install
         mechanical guards over all of them until it is picked up.
         → Already filed as ISSUE-143. Nothing to file here.

    (R2) THE COVERAGE-ENGINE HALF OF packval IS UNTOUCHED. `RunEngine` is the findings
         dispatch; packval has no coverage dispatch to fix, so there is no symmetric edit
         to make. Noted only so a reader does not look for one. This is why D1 chooses the
         findings-path producer semantics without needing to reconcile the coverage-path
         ones.

    (R3) `pkg/packval/phase3.go` IS NOT TOUCHED and does not need to be — `RunEngine`
         already receives `packDir` and `binding`, the complete input all three stages
