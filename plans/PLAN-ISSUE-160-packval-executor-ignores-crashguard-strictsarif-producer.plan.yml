  ── DESIGN DECISIONS THIS PLAN MAKES SO THE IMPLEMENTER DOES NOT ───────────

  D1. PRODUCER USES THE **FINDINGS-PATH** SEMANTICS (swap the invoked NAME, preserve the
      args), NOT the coverage-path semantics (invoke the producer BARE).
      `cmd/backstop/pack_gate.go` deliberately does BOTH: `runCoverageEngine` invokes
      the producer bare (it shapes its own whole invocation), while `runFindingsEngine`
      swaps only the name because it owns scope contracts that a bare call would
      evaporate. That comment is worth reading in full at
      `func runFindingsEngine(` before writing the fix.
      `RunEngine` takes the findings semantics for two reasons: it terminates in
      `check.ParsePackFindings`, so it IS the findings dispatch; and the fixture
      TARGETS are the entire point of a phase-3 run — a bare invocation would drop the
      rule/config file and the fixture path, so EVERY fixture would come back not-fired.
      Per the loop polarity established above: every POSITIVE fixture would then validate
      as a SILENT CLEAN PASS even though nothing was ever checked, and every NEGATIVE
      fixture would red as `negative fixture not triggered` — blaming the fixture for the
      dropped argv. The swap is auditable as a one-line change of the invoked NAME.

  D2. THE PRODUCER PATH RESOLVES AGAINST `packDir`. That is the same base `RunEngine`
      already uses for `binding.Convert` and (since ISSUE-144) `binding.StdoutArtifact`,
      and `packDir` IS packval's pack root. The gate joins against `packRoot` for the
      identical reason. Same rule, same value, different variable name. Use the SAME
      `filepath.Join(packDir, filepath.FromSlash(...))` + `os.Stat` shape the Convert
      block already uses.

  D3. THE PRODUCER RUNS UN-SANDBOXED — BY CONSTRUCTION, WITH NO NEW MECHANISM.
      `RunEngine`'s `exec.Command` is already un-sandboxed; only the Convert step goes
      through `SandboxedRunStdout`. Swapping the invoked name therefore inherits the
      un-sandboxed property the gate gets from calling `runner.RunStdout` directly.
      Do NOT route the producer through `SandboxedRunStdout` — that would be a
      DIVERGENCE from the gate dressed up as caution.

  D4. THE NEVER-STARTED REFUSAL NAMES THE PRODUCER WHEN A PRODUCER IS DECLARED.
      Mirrors the gate's `neverStartedSubject` variable. On the plain branch the subject
      stays `binding.Command`, so ISSUE-140's existing tests
      (`TestExecutor_RunEngineRefusesPathfulUnstartableEngine`,
      `TestExecutor_RunEngineRefusesBareAbsentEngine`) see byte-identical wording.

  D5. THE STRICT-SARIF GUARD IS GATED ON `binding.Convert == ""`, EXACTLY AS THE GATE
      GATES IT. Read `func runFindingsEngine(` : the call to `requireLintSarifShape` sits
      inside `if binding.Convert == "" { ... }`. A binding that declares a convert is not
      expected to emit SARIF before the convert runs, so applying the shape guard to its
      pre-convert payload would fail-loud on a correctly-authored pack. Mirror the
      gating; do not "improve" on it.

  D6. THE STRICT-SARIF GUARD IS IMPLEMENTED LOCALLY IN packval AND ITS MESSAGE IS
      TOOL-BLIND. `requireLintSarifShape` lives in `cmd/backstop/pack_gate_golint.go`,
      package `main` — `pkg/packval` cannot import it, and extracting it to a shared
      authority is ISSUE-143's work (D1 of that issue's family), not this lane's.
      packval gets its own inline probe with the SAME MECHANISM (trim; empty is not
      malformed; `json.Unmarshal` into a struct with a `Runs *json.RawMessage` field;
      refuse when unmarshal fails or `Runs` is nil).
      ITS WORDING MUST NAME NO TOOL AND NO LANGUAGE. The gate's message names
      golangci-lint because it lives in a lint-specific file; copying that literal into
      `pkg/packval` would bake a tool name into the generic pack-validation dispatch,
      which CLAUDE.md's first principle forbids outright. CLM-015 makes that mechanical.

  D7. THE FINAL SHAPE OF `RunEngine`, STAGE BY STAGE. Four stages exist today; this lane
      adds three. Insertion points are stated against their NEIGHBOURS, never line
      numbers:

        trust gate (`binding.Provision` → `engine.CheckToolAllowed`)      [exists]
        `buildEngineArgv`                                                 [exists]
        ► PRODUCER SUBSTITUTION                                           [TASK-002]
        `exec.Command(...)`, `cmd.Dir = packDir`, `cmd.Run()`             [exists]
        never-started refusal (`check.NeverStarted(runErr)`)              [exists, ISSUE-140]
        stdout_artifact payload selection                                 [exists, ISSUE-144]
        ► STRICT-SARIF SHAPE GUARD (gated on `binding.Convert == ""`)     [TASK-008]
        convert application                                               [exists, ISSUE-141]
        `check.ParsePackFindings`                                         [exists]
        ► CRASH GUARD                                                     [TASK-005]
        return

      This is the gate's order, stage for stage. Getting it wrong is not cosmetic: the
      crash guard needs the finding COUNT (so it must follow the parse) and needs to sit
      AFTER the never-started refusal (so `runErr` at that point is a started process's
      exit status, which is what makes the word "crashed" accurate rather than
      misleading); the shape guard must see the SELECTED payload (post-artifact) and the
      PRE-convert bytes.

