         This lane makes the validator TRUTHFUL when such a fixture appears; it does not
         manufacture one. Filing pack-side fixture work is out of scope and explicitly
         not requested.

    (R5) `binding.ExemptFromScopeFilter` AND `binding.GateType` ARE ALSO UNREAD BY
         `RunEngine`, and are NOT fixed here. Verified 2026-08-17 — but unlike this lane's
