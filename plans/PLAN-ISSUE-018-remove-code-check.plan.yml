  ─────────────────────────────────────────────────────────────────────────
  The "test-first" artifact for a deletion is a SOURCE-SCAN deletion-assertion
  test (reads the package's non-test .go sources as text, asserts the deleted
  symbol/command names are ABSENT) plus a SURVIVAL assertion pinning the live
  SARIF surface. These compile fine and fail at runtime while the symbols still
  exist (the "red"), and go green only after the deletion (the "green"). Because
  the deleted production symbols are referenced by in-package test doubles and
  by entangled cmd/backstop tests, each deletion task removes BOTH the
  production symbols AND the entangled test coupling in the SAME task, or the
  package will not compile.

