  SHARP EDGE 3 — fileCategory() `.go` de-baking: RESOLVED to Option B
  ─────────────────────────────────────────────────────────────────────────
  RESOLUTION (planner decision, grounded in code — surfaced to the user for
  ratification): use OPTION B (narrow neutral-spine exemption), NOT Option A
  (SPEC-043 pack-declared classification globs).
  WHY: pkg/validate/plan.go's entry point is `func Plan(art *artifact.Parsed
  Artifact, _ *schema.Schema)` — it receives ONLY the parsed artifact and a
  schema; the schema arg is discarded (`_`). There is NO pack/project context
  in scope at the point fileCategory runs. Option A (glob-sourced classification)
  would require threading pack config through validate.Plan's signature and
  EVERY caller — a cross-cutting change well beyond this deletion issue's blast
  radius, and a behavior CHANGE (non-Go impl files would newly be classified
  "code" and subjected to final-phase-coverage). Option B preserves current
  validation behavior EXACTLY (non-Go files still fall through to "" as today),
  clearing only the self-pack `no-language-literal-on-neutral-spine` finding by
  moving the `.go` literal off the strict spine zone via the existing
  exemption/allowlist mechanism (the same `// nosemgrep: ...` spine-exemption
  convention already used across the codebase, e.g. pkg/check/parsers.go:22 and
  pkg/pack/engine/binding.go). The language-neutral glob-sourcing (Option A) is
  DEFERRED to a follow-on — the issue itself sanctions this deferral.
  TASK-008 confirms the no-pack-context finding at implementation time (line
  numbers shift) and ratifies Option B before TASK-010 applies it. If the user
  prefers Option A, it must be re-scoped as its own item (signature change +
  caller sweep) — do NOT silently adopt it here.

