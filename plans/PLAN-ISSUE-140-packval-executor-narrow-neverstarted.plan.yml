              1. DECLARE A PACK-LEVEL `engines:` OVERRIDE. This is the requirement that
                 makes the test possible at all. `resolveEngine` (pkg/packval/manifest.go)
                 merges `pack.Engines` OVER `baseengines.Registry()`, so a bare
                 `Engine: "semgrep"` with NO pack-level override resolves to the REAL base
                 binding — a bare `semgrep …` command with a pinned Provision. That
                 command STARTS fine on this host, the never-started predicate never fires,
                 and the test would stay red FOREVER, misattributed as a bug in the fix
                 rather than a broken fixture. Populate
                 `PackManifest.Engines` (`map[string]engine.EngineBinding`, yaml key
                 `engines:`) with an entry under the rule's declared engine name whose
                 Command is the path-ful, genuinely-unstartable script path — the same
