  - id: phase-3
    name: "Phase 3: One authority — the gate path's local copy is deleted, drift is made detectable"
    tasks:
      - id: TASK-007
        type: test
        title: "Red: tripwire asserting no package keeps a private never-started predicate"
        description: |
          NEW FILE pkg/check/never_started_single_authority_test.go, package `check`. It
          lives beside the authority because the authority is what it protects. Source-
          reading tests across package boundaries are established practice in this repo —
          see pkg/config/config_language_removal_test.go and
          pkg/validate/deletion_assertion_test.go, both of which read sibling packages via
