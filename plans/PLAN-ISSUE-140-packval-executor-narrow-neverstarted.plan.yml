    CLM-004  THE REFUSAL NAMES THE COMMAND — EXECUTOR-LOCAL. `RunEngine`'s returned
             error NAMES `binding.Command`, states that the process never started (a
             broken run, not a finding-free pass), and wraps `runErr` with %w so the
             underlying errno text survives. Scoped to pkg/packval/executor.go and
             nothing else. Rendering that error into phase-3's operator-visible
             ValidationError message is PLAN-ISSUE-092's CLM-005 and is deliberately NOT
             claimed here — see CROSS-PLAN BOUNDARY. ISSUE-140's stated acceptance
             ("fails loud, NAMING the broken command") is closed JOINTLY by the two
