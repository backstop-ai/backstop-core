          vacuously passing on empty content. That read guard is the whole difference
          between a tripwire and a decoration.

          TestCheck_NeverStartedIsTheSingleAuthority (CLM-006) — over EXACTLY TWO consumer
          sources, `../../cmd/backstop/pack_gate.go` and `../packval/executor.go`. Those
          two files are precisely what CLM-006 claims, no more: the claim names FILES, not
          packages, because a package-wide sweep would false-positive on the legitimate
          `*exec.ExitError` handling scattered through both packages and would decay into
          an exclusion list. Two files genuinely read beats a sweep talked out of its hits.
          Assert over them:
            - assert NEITHER declares a private predicate: no `func runNeverStarted`, and
              more generally no `func`-level never-started helper in either file;
            - assert NEITHER contains a bare `errors.As(` paired with an `*exec.Error`
              target as its run-error classification — the exact narrow shape ISSUE-140
              reports. Scope the assertion so it cannot false-positive on `*exec.ExitError`
              handling in `resultFromCmd`, which is legitimate and must survive: that is
              a DIFFERENT type and a different question (did it exit non-zero), and killing
              it would be a real regression;
            - assert BOTH files reference `check.NeverStarted` (executor.go) or
              `NeverStarted` (pack_gate.go, whichever form the call takes), so the tripwire
              proves DELEGATION and not merely absence. Absence alone would pass if a
              future edit deleted the call entirely — which is the vacuous version of this
              test.
          At HEAD this fails naming cmd/backstop/pack_gate.go's local `runNeverStarted`.
          It should already pass for executor.go after TASK-005; if it does not, TASK-005
          is incomplete and that is the correct thing for this test to say.
        files:
          - pkg/check/never_started_single_authority_test.go
        claims:
          - CLM-006
        depends_on:
          - TASK-006

      - id: TASK-008
        type: refactor
        title: "Delete runNeverStarted; route the gate's three call sites through check.NeverStarted"
        description: |
          ONE production file: cmd/backstop/pack_gate.go. Behavior must not change at all —
          this is the deduplication, and CLM-006 is satisfied only if ISSUE-112's shipped
          tests pass with their bodies UNMODIFIED.

          1. DELETE `func runNeverStarted(runErr error) bool` entirely. Do not leave a
             wrapper: a wrapper is a place a future edit can diverge, and this plan exists
             because a second place diverged.
          2. Swap all THREE call sites to `check.NeverStarted(runErr)` — LOCATE THEM BY
             FUNCTION NAME, not by line: one in `runFindingsEngine`, and TWO in
             `runCoverageEngine` (the declared-producer branch and the plain-command
             branch). Verify the count after editing: a repo grep for the old name must
             return zero hits outside artifacts and this plan.
          3. RELOCATION, NOT DELETION, OF THE REASONING. TASK-002 moved the doc comment's
             substance to pkg/check. Confirm it actually landed there — reread the shipped
             pkg/check/never_started.go — before removing the original. If TASK-002's
             version is thinner, ENRICH pkg/check rather than keeping a second copy here.
             Losing that reasoning is the one way this refactor makes the tree worse.
          4. KEEP the call-site-local inline comment in `runCoverageEngine` recording why
             the fork/exec shape is the only reachable one on the os.Stat-guarded producer
             branch. It is about THAT branch, not about the predicate, and it does not
             belong in the shared doc.
          5. `neverStartedError` (the *check.ConfigError refusal renderer) is UNCHANGED and
             stays in cmd/backstop — it is gate-specific: it names the pack manifest and
             carries the gate's exit-2 error class. Only the PREDICATE is shared.
          6. pkg/check is already imported in this file (`check.ConfigError`); remove the
             now-unused `os/exec` / `io/fs` imports ONLY if nothing else in the file uses
             them. Let the compiler decide, do not guess.

          DO NOT touch cmd/backstop/dispatch_unstartable_engine_test.go or any other
          ISSUE-112 test. Their passing UNMODIFIED is the evidence this refactor was
          behavior-preserving; editing them destroys that evidence.
        files:
          - cmd/backstop/pack_gate.go
        claims:
          - CLM-006
        depends_on:
          - TASK-002
          - TASK-007

      - id: TASK-009
        type: verification
        title: "Gate the gate-path refactor and prove ISSUE-112's tests pass unmodified"
        description: |
          Rebuild `./bin/backstop`, then `./bin/backstop gate --file cmd/backstop/pack_gate.go`
          and bare `./bin/backstop gate`. Report TRUE exit codes.

          Run `go test ./cmd/backstop/... -race -count=1` UNFILTERED.

          Then report the CLM-006 evidence explicitly, because a green suite alone does not
