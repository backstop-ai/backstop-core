          TestExecutor_RunEngineRefusesPathfulUnstartableEngine (CLM-003, CLM-004) — THE
            DEFECT. Write a real 0o644 file in t.TempDir(), guard its non-executability by
            re-stat'ing (`Perm()&0o111 != 0` → t.Fatal). Build a binding whose Command is
