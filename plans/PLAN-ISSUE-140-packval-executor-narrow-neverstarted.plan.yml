       not that the defect is bigger — the bare shape is already covered today.
    4. TASK-007's single-authority tripwire must fail at HEAD naming
       cmd/backstop/pack_gate.go's local copy.

  All fixtures drive a REAL `exec.Command` against a REAL failed exec. NO stub runner
  returning a synthetic error: a synthetic `*fs.PathError` would make the test greenable
  without the production classification ever facing a real one, which is the vacuous
  shape this whole lane exists to eliminate. Use the shipped precedent —
  `writeNonExecutableScript` in cmd/backstop/dispatch_unstartable_engine_test.go writes a
  real 0o644 file AND guards its own premise by re-stat'ing that the exec bit is absent.
  Copy that premise guard; without it the fixture can silently stop testing the fork/exec
  shape.

  If a sibling worktree holds live uncommitted work, do the red-proof in a DETACHED
  WORKTREE at HEAD rather than stashing the shared tree. Several implementer lanes have
  been live in this tree this cycle (MEMORY: no-verify-race-with-active-implementer,
  git-stash-shared-tree-hazard).

  ── CLAIM LEDGER (ISSUE-140 carries no CLM ids; this lane defines them) ────
    CLM-001  `check.NeverStarted(runErr error) bool` exists in pkg/check as the SINGLE
             authority for "the process never started". It returns true for BOTH real
             shapes — an `*exec.Error`, and an `*fs.PathError` whose `Op` is
             "fork/exec" — matched via `errors.As` so a wrapped error still classifies.
             It keys on `Op`, never on the errno.
    CLM-002  NON-REGRESSION on the predicate itself, and the assertion that keeps
             CLM-001 honest: it returns FALSE for nil, and FALSE for a process that
             STARTED and exited non-zero (`*exec.ExitError`). The predicate is a CLASS
             test, never `runErr != nil`.
    CLM-003  THE DEFECT: `DefaultExecutor.RunEngine` refuses a PATH-FUL engine command
             that never started — absent, non-executable, or bad interpreter line —
             returning a non-nil error instead of `ExecutionResult{Passed:false}, nil`.
             The pre-existing bare-name refusal is preserved unchanged. End to end,
