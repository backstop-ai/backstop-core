phases:
  - id: phase-1
    name: "Phase 1: The shared never-started predicate lands in pkg/check"
    tasks:
      - id: TASK-001
        type: test
        title: "Red: pin check.NeverStarted against BOTH real never-started shapes and against a started process"
        description: |
          NEW FILE pkg/check/never_started_test.go, in package `check` (the predicate is
          exported, so `check_test` would also compile — stay in-package for consistency
          with pkg/check's existing colocated tests). It will not compile until TASK-002
          adds the function; that is the expected first red, and it is NOT the red that
          counts. The red that counts is behavioral: write the assertions so that a
          `*exec.Error`-only implementation FAILS the fork/exec case.

          Every fixture drives a REAL `exec.Command(...).Run()` against a REAL failed exec.
          Do NOT hand-construct an `&fs.PathError{Op: "fork/exec"}` and pass it in — a
          synthetic error makes the test greenable without the classification ever facing
          a real one, which is the vacuous shape this lane exists to remove.

          TestCheck_NeverStartedMatchesBothRealShapes — table of two real runs:
            - BARE ABSENT NAME: a fixed nonsense name with NO path separator, e.g.
              "backstop-absent-engine-140". exec.Command routes it through LookPath, which
              misses, producing *exec.Error. Never mutate PATH; never assume a real tool
              is absent from the host.
            - PATH-FUL NON-EXECUTABLE FILE: write a real file with mode 0o644 into
              t.TempDir(), then re-stat it and t.Fatal if `info.Mode().Perm()&0o111 != 0`.
              That premise guard is copied from `writeNonExecutableScript` in
              cmd/backstop/dispatch_unstartable_engine_test.go and is load-bearing — an
              unguarded fixture that became executable would silently stop testing the
              fork/exec shape while still passing.
            Assert `NeverStarted(runErr)` is true for both. Assert the SHAPES too, so a
            future Go change that alters the error type is caught at the right place
            rather than as a confusing behavioral failure: errors.As the first to
            *exec.Error, the second to *fs.PathError with Op == "fork/exec".

          TestCheck_NeverStartedRejectsStartedProcess (CLM-002) — the assertion that keeps
          CLM-001 honest:
            - nil → false.
            - a process that STARTED and exited non-zero → false. Use a real run: `sh -c
              "exit 3"` (or the equivalent that exists on this host — resolve it, do not
              skip). Assert errors.As to *exec.ExitError first, so the fixture's own
              premise is pinned, THEN assert NeverStarted is false.
            An implementation keyed on `runErr != nil` passes the first test and fails this
            one. That is exactly what this test is for.
        files:
          - pkg/check/never_started_test.go
        claims:
          - CLM-001
          - CLM-002
        depends_on: []
        test_names:
          - TestCheck_NeverStartedMatchesBothRealShapes
          - TestCheck_NeverStartedRejectsStartedProcess

      - id: TASK-002
        type: implementation
        title: "Add check.NeverStarted — one authority for whether a process started"
        description: |
          NEW FILE pkg/check/never_started.go, package `check`:

              func NeverStarted(runErr error) bool {
                  var execErr *exec.Error
                  if errors.As(runErr, &execErr) { return true }
                  var pathErr *fs.PathError
                  if errors.As(runErr, &pathErr) && pathErr.Op == "fork/exec" { return true }
                  return false
              }

          Use `errors.As`, not a type switch, so a wrapped error still classifies. Key on
          `Op == "fork/exec"` — NOT on the errno (ENOENT / EACCES / ENOEXEC), which bakes
          OS knowledge into a thin executor. Do NOT reduce it to `runErr != nil`; an
          *exec.ExitError means the process DID start (CLM-002).

          Imports are `errors`, `io/fs`, `os/exec` — all stdlib. pkg/check declares
          `anyVendorDeps: true` and NO project deps, so this adds no project import edge
          and cannot create a cycle. DO NOT EDIT the architecture policy file; if that
          seems necessary, the home is wrong.

          THE DOC COMMENT IS PART OF THE DELIVERABLE, not decoration. Carry ISSUE-112's
          reasoning forward from `runNeverStarted` in cmd/backstop/pack_gate.go — copy it,
          do not paraphrase from memory:
            - why "never started" is TWO Go types (exec.Command reaches LookPath only for
              a bare name, so a path-ful command can never produce an *exec.Error);
            - why it must NOT become `runErr != nil` (a rule-fed findings engine exits
              non-zero precisely WHEN it reports findings; a started process reports an
              *exec.ExitError, which is neither shape);
            - why it keys on Op and never on the errno.
          Amend it in exactly two places, per the notes: DELETE the sentence calling this
          shape "deliberately WIDER" than pkg/packval's *exec.Error-only check — after
          this lane there is one check and no width difference, and leaving it would
          document a gap the tree no longer has. In its place, state that BOTH consumers
          call this — cmd/backstop's gate dispatch and pkg/packval's fixture executor —
          and why the path-ful shape is reachable on each: the gate's coverage producer
          command is always `filepath.Join(packRoot, …)` and already os.Stat-guarded, so
          *exec.Error is UNREACHABLE there; packval's command comes from `binding.Command`,
          pack-declared DATA that may carry a path separator.

          Write ONLY the predicate here. The call-site swaps are TASK-005 and TASK-008.
        files:
          - pkg/check/never_started.go
        claims:
          - CLM-001
          - CLM-002
        depends_on:
          - TASK-001

      - id: TASK-003
        type: verification
        title: "Gate the shared predicate"
        description: |
          Rebuild `./bin/backstop`, then run `./bin/backstop gate --file pkg/check/never_started.go`
          and bare `./bin/backstop gate`. Report TRUE exit codes — do not summarize a
          non-zero exit as "just warnings".

          Run `go test ./pkg/check/... -race -count=1` UNFILTERED. pkg/check is a
          heavily-depended-on package; a scoped `-run` here would hide a collateral break
          in parsers/runner/coverage.

          Confirm explicitly that the architecture dimension is GREEN and that
          `.backstop/packs/backstop-ai/backstop-core-architecture/architecture/backstop-core.yml`
          has ZERO diff. A required edit there means the predicate was homed wrong.
        files:
          - pkg/check/never_started.go
          - pkg/check/never_started_test.go
        claims:
          - CLM-001
          - CLM-002
        depends_on:
          - TASK-002

  - id: phase-2
    name: "Phase 2: The packval executor refuses a path-ful engine that never started, and names it"
    tasks:
