        type: test
        title: "Red: prove the silent pass in RunEngine and in RunFixtures, and pin the non-regressions"
        description: |
          TWO NEW FILES. This task is parallel-eligible with all of phase 1 — disjoint
          files, and none of these tests reference check.NeverStarted (they assert
          packval's OBSERVABLE behavior, not its internals, which is what keeps them true
          after the predicate is shared).

          ── pkg/packval/executor_never_started_test.go (package packval) ──
