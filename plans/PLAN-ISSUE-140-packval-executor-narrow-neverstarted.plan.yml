  ── THE DEFECT, MEASURED BY READING THE CURRENT TREE (2026-08-16) ──────────
  `DefaultExecutor.RunEngine` (pkg/packval/executor.go, the command dispatch behind
  phase3 fixtures) classifies a broken run with ONE Go type:

      runErr := cmd.Run()
      var execErr *exec.Error
      if errors.As(runErr, &execErr) { ...fail loud... }

  `*exec.Error` is produced ONLY when `exec.Command` routes a BARE command name
  (`filepath.Base(name) == name`) through LookPath and the lookup misses. A PATH-FUL
  command never consults LookPath at all; when its exec fails it produces an
  `*fs.PathError` with `Op == "fork/exec"` wrapping the syscall errno (ENOENT for
  absent, EACCES for a file with no exec bit, ENOEXEC for a bad interpreter line).

  `buildEngineArgv` takes `name` straight from `binding.Command`, which is pack-declared
  DATA. Nothing prevents or excludes a path-ful command there — `./scripts/checker.sh`,
  `packs/foo/bin/checker` are ordinary pack declarations, and the gate side already has
  a shipped fixture doing exactly this (cmd/backstop/bun_dispatch_e2e_test.go rewrites
  its binding Command to an ABSOLUTE script path).

  So for a path-ful engine that cannot start, `errors.As` is FALSE, and the run falls
  through to:

      findings, parseErr := check.ParsePackFindings(stdout.Bytes())   // stdout is EMPTY
      return ExecutionResult{Passed: len(findings) > 0, ...}, nil     // Passed:false, nil err

  `check.ParsePackFindings` → `parseSarif` (pkg/check/parsers.go) has a DELIBERATE
  lenient case: `bytes.TrimSpace(out)` empty returns `(nil, nil)` — not an error. That
  leniency is why this is a SILENT pass rather than a mislabeled failure.

  Now read the consumer. In `RunFixtures` (pkg/packval/phase3.go), the NEGATIVE-fixture
  branch is:

      r, err := executor.RunEngine(...)
      if err != nil { ...ValidationError "negative fixture run failed"... }
      else if r.Passed { ...ValidationError "negative fixture not triggered"... }

  With err nil and Passed false, NEITHER arm fires. `Passed:false` on a negative fixture
  is exactly the SUCCESS condition. The fixture, the rule, and the whole phase3 step
  report clean while the pack's declared engine binary never executed. That is a genuine
  vacuous green on the tool a pack author is supposed to trust BEFORE the pack ever
  reaches `backstop gate`.

