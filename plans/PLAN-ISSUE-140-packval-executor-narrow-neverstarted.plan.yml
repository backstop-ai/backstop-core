    CLM-005  NON-REGRESSION on the packval path: an engine that STARTS and exits
             non-zero while emitting SARIF still reports its findings (`Passed:true`,
             nil error). Non-zero exit remains a legitimate findings signal on this path
             exactly as it is on the gate path.
    CLM-006  ONE AUTHORITY: the local `runNeverStarted` in cmd/backstop/pack_gate.go is
             DELETED and its three call sites — one in `runFindingsEngine`, two in
             `runCoverageEngine` — call `check.NeverStarted` instead. Afterwards NEITHER
             cmd/backstop/pack_gate.go NOR pkg/packval/executor.go — the two files that
             carried a never-started check, named individually because those two files
             are exactly what the tripwire reads — declares a private never-started
             predicate or a bare `*exec.Error`-only run-error check; both instead
             DELEGATE to `check.NeverStarted`. Asserted by a source tripwire so a future
             re-introduction in either file is caught.
             (Claim text deliberately names the two FILES rather than the two PACKAGES.
             The earlier package-scoped wording promised more than the tripwire delivers,
             and widening the tripwire to sweep whole packages is both more expensive and
             LESS honest: legitimate `*exec.ExitError` handling — a different type
