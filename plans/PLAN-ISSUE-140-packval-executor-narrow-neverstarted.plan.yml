  ── THE ERROR SHAPE: "NEVER STARTED" IS TWO GO TYPES, NOT ONE ──────────────
  Read before writing either test or check. The predicate returns true for EITHER:

    - `*exec.Error` — a BARE command name LookPath could not resolve.
    - `*fs.PathError` with `Op == "fork/exec"` — a PATH-FUL command that could not be
      exec'd: absent, not executable, or a bad interpreter line. This shape can NEVER
      be an `*exec.Error`, because it never reaches LookPath.

  It keys on `Op`, NEVER on the errno (ENOENT / EACCES / ENOEXEC) — an errno switch
  bakes OS knowledge into a thin executor.

  And it is NOT `runErr != nil`. A rule-fed findings engine exits non-zero precisely
  WHEN it reports findings; treating every run error as never-started would fail every
  real finding. A started process reports an `*exec.ExitError`, which is neither shape.
  CLM-005 is the test that catches keying this wrong.

