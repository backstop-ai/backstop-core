            `runErr != nil` mistake.

          ── pkg/packval/phase3_never_started_test.go (package packval) ──
          THIS IS A TEST-ONLY FILE. It exercises `RunFixtures` but does NOT edit
          pkg/packval/phase3.go, which is PLAN-ISSUE-092's file (see CROSS-PLAN BOUNDARY).
          PLAN-092 does not touch this new test file, so the two are file-disjoint.

          TestRunFixtures_NegativeFixtureUnstartableEngineFailsLoud (CLM-003) — the
            end-to-end falsification, driving the REAL production path: build a
            `*PackManifest` on disk in t.TempDir() with one rule, one claim, and ONE
