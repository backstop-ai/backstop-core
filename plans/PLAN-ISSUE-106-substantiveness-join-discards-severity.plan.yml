        type: test
        title: "Unit pin: the join forwards pack severity, and the synthesized noTarget severity is fixed by design (RED)"
        description: |
          Create pkg/gate/substantiveness_severity_test.go. It must FAIL before
          TASK-003 — run it and RECORD THE ACTUAL FAILURE OUTPUT before touching
          substantiveness_join.go. Runs in parallel with TASK-002 (disjoint
          files, no dependency between them).

          Header-comment the file with what it is FOR: hop 3 of the pack-severity
          chain (ISSUE-104 -> ISSUE-105 -> ISSUE-106), and the fact that the two
          functions it covers are deliberately asymmetric — one FORWARDS a value
          it was handed, the other SYNTHESIZES one it was never handed.

          TestQ1_HollowFindingsToViolations_ForwardsPackDeclaredSeverity
            (CLM-001, CLM-006). Feed HollowFindingsToViolations a hollow partition
            in ONE call carrying DISTINCT severities so the assertion cannot be
            satisfied by any constant:
              * a finding with Severity "warning"  -> expect "warning"
              * a finding with Severity "error"    -> expect "error"
              * a finding with Severity ""         -> expect "" forwarded VERBATIM
            Assert each output violation's Severity equals ITS OWN source
            finding's Severity, by index. The mixed batch is the point: a
            hardcoded literal fails the first case, and a blanket "always
            warning" would fail the second.

            THE EMPTY CASE NEEDS ITS OWN ASSERTION, not just the pass-through.
            Also assert `StepVerdict([]Violation{out[emptyIdx]}) == "fail"`, and
            say WHY in a comment: forwarding an empty value is safe precisely
            because blocksVerdict treats anything that is not "warning" as
            blocking, so the join fails CLOSED without needing to re-default. The
            issue's own analysis (nonEmptySeverity already ran at dispatch) is why
            no defaulting is added; this assertion is why that is not a risk.

            In the SAME test, assert the non-regression surface explicitly
            (CLM-006): for the warning finding, Rule == StepTestSubstantiveness,
            File is the canonicalized repo-relative path, Line is forwarded
            non-zero, and Message has the ` func=` routing token stripped. A
            severity fix that quietly disturbs the ISSUE-116 Line carry or the
            ISSUE-046 File canonicalization must fail HERE, locally, not three
            packages away.

          TestNoTarget_SynthesizedSeverityIsFixedByDesign (CLM-003).
            This is NOT a copy of the one-shot assertion already in
            substantiveness_join_nonregression_test.go. It exists because THIS
            LANE creates the risk it guards: once the sibling half starts
            forwarding severity, a future reader will "finish the job" by symmetry
            and invent a severity channel for the noTarget violation. This test is
            the note that says the asymmetry is deliberate.

            Sweep every RAISING input of the decision table — populated set with
            the target absent, and empty set with the target absent, each with
            samePackage false — and assert the returned violation's Severity is
            "error" in all of them. Then assert the same for
