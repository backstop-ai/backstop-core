      findings that populate it carry no severity into the set at all.
    * Giving packs a knob here means inventing a NEW declaration channel (a
      severity carried alongside presence, or a noTarget-specific rule property).
      That is a capability expansion, not a bug fix, and it does not belong in a
      lane whose acceptance bar is "stop discarding a value you were handed."
