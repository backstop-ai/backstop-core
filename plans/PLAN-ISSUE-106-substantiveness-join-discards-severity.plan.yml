             SEVERITY *IS* PART OF THE IDENTITY HASH ON THIS PATH. An earlier draft
             of this plan claimed it is not; that was false, and the correction is
             recorded here rather than silently swapped, because a claim that
             outlived its truth is this lane's entire subject. The real mechanism:
             EnrichViolationIdentity (pkg/gate/baseline.go) folds
             Rule|File|RegionHash, and when RegionHash is empty it FALLS BACK to
             hash(Message|Severity|SourcePack). HollowFindingsToViolations builds a
             FRESH Violation and does not carry RegionHash forward — the pack bridge
             that sets it (cmd/backstop/pack_gate.go, `RegionHash: v.Fingerprint`) is
             dropped by this conversion — so the fallback ALWAYS fires for a
             substantiveness violation and Severity ALWAYS feeds its identity.
             gate.Violation's own documentation (pkg/gate/result.go) states the same
             fold; read it there, do not re-derive it.

             CONSEQUENCE, stated plainly: for a pack that declares a `warning`
             substantiveness rule, a finding's IdentityHash CHANGES when this lane
             lands, so a previously baselined finding resurfaces as NEW. That is a
             real downstream effect of the fix, not a defect in it — the pre-fix
             identity was computed over an overwritten severity.

             On backstop-core the radius is measured ZERO, and it is zero by
             CONTINGENCY, not by structure: the shipped hollow rule declares no
             `severity:` key, so the bridge's nonEmpty(...,"error") makes the
             forwarded value "error" both before and after, and the hashed tuple is
             byte-identical. TASK-008 CONFIRMS that equality on the real corpus
             rather than assuming it.

