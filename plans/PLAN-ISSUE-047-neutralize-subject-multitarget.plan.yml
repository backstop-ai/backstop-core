notes: |
  ─────────────────────────────────────────────────────────────────────────
  WHAT THIS PLAN DOES (ISSUE-047 pinned scope — decided, not open)
  ─────────────────────────────────────────────────────────────────────────
  The substantiveness "noTarget" guard derives its per-test target from the
  spec-level `implementation.package` and stamps that ONE target onto every
  claim. Two compounding thin-executor defects:
    (1) pkg/gate/substantiveness_join.go TargetPackageName bakes the this-repo
        LAYOUT into core via the string literals "cmd/" and "pkg/" (return "" for
        cmd/, require pkg/) — a baked-language/layout defect (DIR-015 /
        [[feedback_zero_baked_checks]]).
    (2) `package` is a language-ish noun and a spec can declare only ONE target
        for ALL its claims, so a spec whose claims legitimately exercise different
        units cannot be expressed.

  ─────────────────────────────────────────────────────────────────────────
  VERIFIED MECHANICS (read from the tree 2026-07-07 — the fix hinges on these)
  ─────────────────────────────────────────────────────────────────────────
  • The substantiveness pack's Q2 rule
    (packs/substantiveness/ast-grep/rules/referenced-symbol-go.yml) emits BARE
    package identifiers: `referenced-symbol func=<FN> symbol=<pkg>` where <pkg> is
    the selector operand (e.g. `gate.New(...)` → `symbol=gate`). So the token core
    joins against is the BARE unit identifier, never a path.
  • cmd/backstop/gate.go testFileColocatedWithTarget(filePath, targetPkg) computes
    samePackage as `filepath.Base(filepath.Dir(filePath)) == targetPkg` — it too
    compares the BARE directory-LEAF against TargetPkg. SPEC-045 already declares
    this leaf comparison LANGUAGE-NEUTRAL and it STAYS. Both live consumers of
    TargetPkg require the bare leaf token.
  • Therefore TargetPackageName's ONLY defensible job is reducing a declared
    subject to its trailing segment (`pkg/gate` → `gate`). The BAKED part is the
    `"cmd/"`/`"pkg/"` PREFIX literals + the cmd/→"" layout special-case, NOT the
    neutral last-segment normalization (which is symmetric with the already-blessed
    testFileColocatedWithTarget leaf op). This plan REMOVES the prefix literals and
    the cmd/ special-case; core then holds/compares OPAQUE tokens, reducing a
    subject to its last `/`-segment via the SAME neutral op used on the test-file
    side — no "cmd/"/"pkg/" literal survives anywhere on the gate spine.

  • CLM-015's test `TestGate_SucceedsWithoutStandards` lives in cmd/backstop/
    (standards_removal_test.go) — NOT pkg/gate — and CALLS gate.ComputeGateScope /
    gate.New / gate.WithSteps / gate.GateScopeModeAll, so the Q2 extraction emits
    `symbol=gate` for it. Its current baselined finding "does not call package
    check" (identity bd6936ade…) arises because the spec-level target is `check`
    (from `pkg/check`) and the test is cross-package (leaf `backstop` ≠ `check`)
    AND does not reference `check`. THE FIX: give CLM-015 a per-claim
    `subject: pkg/gate` (→ leaf `gate`); the set-join then finds `gate` in the
    referenced set → SATISFIED. It clears LEGITIMATELY via referenced-set
    membership — NOT by kind:absence, NOT by a blind spec-level retarget. The 3
    TestPkgCheck_* tests (CLM-002/003/023) live in pkg/check (leaf `check`), keep
    inheriting the spec default `pkg/check` → `check`, are colocated (samePackage)
    → stay satisfied, introducing ZERO new violations. Both wrong fixes named in
    the issue are ruled out.

  ─────────────────────────────────────────────────────────────────────────
  NON-BREAKING SCHEMA MIGRATION (issue Solution item 1 — alias path chosen)
  ─────────────────────────────────────────────────────────────────────────
  Rename `implementation.package` → language-neutral `subject`, and add an
  OPTIONAL per-claim `subject`. To stay NON-BREAKING for the ~40 existing specs
  (26 declare `package: cmd/backstop`, plus pkg/gate ×7, etc.) WITHOUT migrating
  all of them, the legacy `package` key is accepted as a DEPRECATED ALIAS for
  `subject` in BOTH the schema and every hand-rolled reader:
    - artifacts/spec/v1/schema.json — implementation.required_keys becomes
      ["summary","subject"]; `subject` added to claims.item_optional_keys; the
      description notes `package` is a deprecated alias still accepted.
    - pkg/validate/spec.go validateImplementation — accept `subject` OR `package`
      (at least one non-empty). This function is SHARED by the issue validator
      (pkg/validate/issue.go), so the alias covers issues too.
    - pkg/gate/step_testverify.go specFrontmatter — read spec-level `subject`
      (yaml alias `package`) into the existing Implementation field, AND read a
      NEW per-claim `subject`. The FULL declared value is retained (coverage's
      packagePathMatches in step_coverage.go legitimately needs the path form
      `pkg/gate` to match directories — only the noTarget join reduces to a leaf).
  Only SPEC-030 is migrated to the NEW `subject` key in this change (item 4);
  every other spec keeps validating via the `package` alias.

  ─────────────────────────────────────────────────────────────────────────
  SPEC-037 LINEAGE — preserve the mandated test name (do NOT strand)
  ─────────────────────────────────────────────────────────────────────────
  TestTargetPackageName_MigratedBehaviorPreserved (pkg/gate/
  substantiveness_join_test.go) is SPEC-037 CLM-028's mandated test. Changing
  TargetPackageName MUST NOT delete that test function by name, or the gate's
  mandated-test step goes red ("mandated test … not found") and SPEC-037's claim
  is stranded ([[project_deletion_strands_spec_lineage]]). The test is REPURPOSED
  in place (same name) to assert the NEW opaque/neutral behavior — bare tokens
  pass through, path tokens reduce to the last segment, and NO "cmd/"/"pkg/"
  special-case remains.

  BUT the name-only gate check does NOT see that CLM-028's PROSE ("pkg/... yields
  the last path component; cmd/... and non-pkg/ paths yield '' (empty-target)") and
  REQ-008/REQ-003's "behavior is preserved" phrasing become FALSE after the de-bake
  — a live claim (SPEC-037 is status: draft, spec_version 1.2.2) whose text
  contradicts its own repurposed test, invisible to the gate. That violates the
  standing [[feedback_align_predating_artifacts]] rule SPEC-037's own REQ-008 cites.
  So SPEC-037 IS edited — via the spec-author agent (TASK-013), NOT a hand-edit —
  to reword CLM-028 + the REQ-008/REQ-003 "behavior preserved" language to the
  opaque-token last-segment reduction (no cmd//pkg/ layout knowledge), bump
  spec_version, and add a Version History entry. Sequenced in Phase 3 alongside the
  SPEC-030 migration (both are spec-author artifact edits).

  ─────────────────────────────────────────────────────────────────────────
  SELF-PACK COVERAGE GAP (issue item 4 — external repo, per packs-always-external)
  ─────────────────────────────────────────────────────────────────────────
  The backstop/self dogfood pack lives in its OWN repo
  (/Users/bmanson/src/projects/backstop-self-pack — installed, gitignored, NOT
  vendored into core per [[feedback_packs_always_external]]). Today it hunts
  tool/extension literals but has NO rule for the baked subject-noun / layout-prefix
  pattern — a genuine COVERAGE GAP. This plan adds a rule (Family C) catching baked
  subject-derivation literals ("cmd/"/"pkg/" path-prefix conventions used to derive
  a target/import unit) with positive+negative fixtures, so this exact defect class
  cannot regress. It is authored and installed in the external pack repo; core is
  not vendored.

  ─────────────────────────────────────────────────────────────────────────
  GATE STAYS GREEN — baseline reconciliation for newly-surfaced pre-existing drift
  ─────────────────────────────────────────────────────────────────────────
  Removing the cmd/→"" skip means cmd/-declared specs stop being universally
  exempt from noTarget: a cmd/backstop spec whose test is colocated (leaf
  `backstop`) still samePackage-skips, but a genuinely cross-package cmd/ test may
  now surface a noTarget finding it was silently exempt from before. Per the
  blessed un-vacuum → baseline+ratchet pattern
  ([[project_unvacuum_baseline_ratchet]]), any such PRE-EXISTING drift newly made
  visible is GRANDFATHERED once via `backstop baseline generate` — it is honest
  historical debt, not caused by this change. The CLM-015 fix is verified to clear
  via the per-claim override (the substantive change), NOT via the baseline; the
  final task asserts CLM-015 is satisfied on its own merits and the 3 TestPkgCheck_*
  introduce zero new violations.

  ─────────────────────────────────────────────────────────────────────────
  VERIFICATION COMMANDS — real tooling only
  ─────────────────────────────────────────────────────────────────────────
  Inner-loop verification tasks run `go test` scoped to the touched packages (the
  removed `backstop code check` command is NOT referenced). The final phase runs
  the full `backstop gate` kill chain PLUS `backstop artifact validate` (this
  change touches BOTH .go files AND artifact files: schema.json + SPEC-030), plus a
  `backstop baseline generate` reconciliation.

  ─────────────────────────────────────────────────────────────────────────
  SYNTHESIZED CLAIMS (issue has no CLM-NNN; enumerated from Solution + Acceptance;
  every task maps ≥1; every claim mapped by ≥1 task)
  ─────────────────────────────────────────────────────────────────────────
  CLM-001 — Schema neutralized non-breaking: artifacts/spec/v1/schema.json renames
            implementation.package → subject (required_keys ["summary","subject"]),
            adds OPTIONAL per-claim `subject` to claims.item_optional_keys, and
