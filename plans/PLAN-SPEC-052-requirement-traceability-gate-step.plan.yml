        type: setup
        title: "Build the fixture corpus: a delivered bundle with an uncovered REQ + a path-mismatched implemented citer"
        description: |
          Create a REAL, self-contained fixture corpus under
          cmd/backstop/testdata/trace-corpus/ that the integration test points
          gate.ResolveArtifactStatus + validate.CollectSupportRefs at (an
          isolated projectRoot, so it does not collide with the repo's own
          artifacts). It must exercise BOTH silent-drop hazards and the block
          verdict end-to-end:

            - bundles/BUNDLE-914-fixture.bundle.md — a DELIVERED bundle
              (status.maturity: delivered) with a bundle.name and TWO REQs at
              `1.0.0`: REQ-001 (will be covered) and REQ-002 (will be UNcovered).
              Include a variant shape note so CLM-048 (name-without-number) is
              exercisable — the join key is bundle.name, not a number.
            - specs/SPEC-914-fixture.spec.md — an IMPLEMENTED spec whose
              requirement `supports` ref cites BUNDLE-914 REQ-001 pinned @1.0.0
              (covers REQ-001; REQ-002 left with no implemented supporter →
              delivered coverage BLOCK).
            - Author the citing ref / spec path so the SupportRef.File (validate-
              relative) and the ResolveArtifactStatus record Path (gate-side
              filepath.Join) differ by absolute/relative form — the raw-material
              for the CLM-050 normalization-join test (the same fixture, asserted
              two ways in TASK-018).

          These are TEST FIXTURES (inputs), not live repo artifacts — placing
          them under testdata/ keeps them out of the repo's own gate/validate
          corpus. Fill them with the minimum valid frontmatter the walkers +
          CollectSupportRefs require.
