      - id: TASK-005
        type: implementation
        title: "Extend ResolveArtifactStatus with a KindBundle case via a DEDICATED bundle frontmatter walk"
        description: |
          Extend pkg/gate/artifact_status.go to also resolve bundles/ — as a
          KindBundle case inside the existing ResolveArtifactStatus (ONE canonical
          resolution, not a parallel repo walk), but with a DEDICATED reader, NOT
          a reuse of the string-`Status` artifactFrontmatter.

          WHY DEDICATED (SPEC Sharp Edge): a bundle's `status:` is a YAML map
          (status.maturity) and `bundle:` is a map (bundle.name), whereas
          artifactFrontmatter.Status is a `string`. Unmarshalling a .bundle.md
          through artifactFrontmatter is a yaml.TypeError, and walkArtifactDir
          SILENTLY SKIPS a file whose unmarshal errors — every .bundle.md would
          vanish, yielding zero bundle records and a vacuously-GREEN coverage
          step. So:
            - Add a dedicated bundle frontmatter struct + walk mirroring
              walkPlanDir/planFrontmatter (bundles carry fenced frontmatter;
              read it with the same fenced-frontmatter mechanism the spec/issue
              walk uses, but into the dedicated struct). Read bundle.name,
              nested status.maturity (reuse the extractMaturity-style nested
              read — NOT the string Status field), and requirements[] (id +
              top-level version).
            - Add the additive fields to ArtifactStatusRecord: BundleName string
              (bundle.name; empty for non-bundle kinds) and BundleReqs
              []BundleReqVersion (nil for non-bundle kinds). Existing fields
              untouched.
            - Add type BundleReqVersion struct { ReqID string; CurrentVersion
              string } — one declared REQ + its current (top-level) version. The
              stale-pin model needs only the current version, never the full
              log (log membership is SPEC-050/validate's concern).
            - Populate the KindBundle record: Kind = KindBundle, BundleName =
              bundle.name, Status = extracted maturity string, BundleReqs = the
              declared REQs, Class = ClassifyArtifactStatus(KindBundle, maturity).
            - Add a KindBundle case to ClassifyArtifactStatus: `delivered` →
              ClassSuccessTerminal. The existing retired switch already maps
              replaced/canceled/deprecated → ClassRetiredTerminal (terminal-
              bundle exclusion for free); do not duplicate it.

