notes: |
  ─────────────────────────────────────────────────────────────────────────
  HARD DEPENDENCY — SEQUENCE FIRST (SPEC Sharp Edge #1, non-negotiable)
  ─────────────────────────────────────────────────────────────────────────
  Execution of THIS plan starts ONLY after SPEC-050 AND SPEC-051 have landed:
    • SPEC-050 (Seed 1, now v1.2.0) supplies the versioning schema, the
      resolution surfaces this step consumes — validate.SupportRef,
      validate.CollectSupportRefs (whose v1.2.0 terminal-citer exemption skips
      replaced/canceled/deprecated/obsoleted citers) — and the bundle-REQ
      top-level `version:` (newest log entry) the stale-pin model reads.
    • SPEC-051 (Seed 2) reconciled + `1.0.0`-backfilled the corpus so every
      supports ref is pinned and green BEFORE this step turns on.
  SPEC-053 is already landed. Because the corpus is uniformly versioned and
  green by the time this runs, the step NEVER reasons about an unbackfilled /
  unpinned corpus — there is NO "if unpinned" tolerance branch to build.
  Sequencing is the guard; do not build a tolerance mode.

  ─────────────────────────────────────────────────────────────────────────
  WHAT THIS PLAN BUILDS (five mechanically-separable pieces, all pure
  artifact-domain logic — ZERO language/tool knowledge enters pkg/gate)
  ─────────────────────────────────────────────────────────────────────────
  1. Two NEW gate step-name constants in pkg/gate/result.go —
     StepRequirementTraceability ("requirement_traceability", policied block
     surface) and StepRequirementTraceabilityAdvisory
     ("requirement_traceability_advisory", NON-policied twin). The reserved
     StepLedgerIntegrity name is NOT claimed/renamed/reused. These are
     dynamically-wired step names (like the drift steps), NOT added to the
     fixed AllStepNames array.
  2. A bundle-aware extension of ResolveArtifactStatus in
     pkg/gate/artifact_status.go: a KindBundle case fed by a DEDICATED bundle
     frontmatter struct + walk (mirroring walkPlanDir/planFrontmatter), NOT a
     reuse of the string-`Status` artifactFrontmatter. A bundle's `status:` is
     a YAML MAP (status.maturity) and `bundle:` is a map (bundle.name); routing
     a .bundle.md through the string-Status artifactFrontmatter yaml.TypeErrors
     and walkArtifactDir SILENTLY SKIPS it — zero bundle records, vacuously
     GREEN coverage. The dedicated reader captures bundle.name (the JOIN KEY),
     nested status.maturity (extractMaturity-style read → the record Status),
     and requirements[] (id + current version → BundleReqs). ClassifyArtifact
     Status gains a KindBundle case: `delivered` → ClassSuccessTerminal; the
     existing retired switch already maps replaced/canceled/deprecated →
     ClassRetiredTerminal, giving terminal-bundle exclusion for free.
  3. A pure classifier pkg/gate/requirement_traceability.go (NEW), modeled
     EXACTLY on status_drift's ClassifyStatusDrift/SplitDriftResult: one
     combined StepResult carrying error-severity BLOCK + warning-severity
     ADVISORY violations, partitioned by SplitTraceabilityResult into the
     policied block surface and the non-policied advisory surface. Plus the
     coverage-source predicate SupportsCoverage and the semver stale-pin gate
     StalePinVerdict.
  4. The cmd/backstop/gate.go wiring buildRequirementTraceabilitySteps,
     MIRRORING buildStatusDriftSteps: one lazy (sync.Once) resolve reusing the
     now-bundle-aware gate.ResolveArtifactStatus + validate.CollectSupportRefs,
     converting []validate.SupportRef → []gate.TraceRef, NORMALIZING both the
     TraceRef.CitingPath and each record.Path via gate.NormalizePath so the
     join keys agree, then ClassifyRequirementTraceability +
     SplitTraceabilityResult, returning the block + advisory StepFuncs inserted
     next to the drift steps.
  5. The stance guarantees: the advisory carries NO enforcement.policy entry
     (structurally non-upgradable); the block surface is left OUT of the gate's
     code-located waivable dimension set and carries NO `applies-to: new-code`
     policy entry (non-waivable, non-baseline-grandfathered).

  ─────────────────────────────────────────────────────────────────────────
  TWO SILENT-DROP HAZARDS — GUARDED BY THE MANDATORY FIXTURE INTEGRATION TEST
  ─────────────────────────────────────────────────────────────────────────
  Both fail GREEN (the worst mode), so a classifier unit test over hand-built
  records is NOT sufficient — CLM-049 mandates a REAL fixture-corpus test
  through the shipped buildRequirementTraceabilitySteps path:
    • BUNDLE-NAME JOIN: supports refs cite a bundle by NAME (bundle.name, e.g.
      `requirement-traceability`), and a delivered bundle may carry NO
      `number:` at all (agent-definitions.bundle.md). ID = fm.Number is
      unusable — join TraceRef.BundleName ↔ record.BundleName (CLM-048).
    • PATH NORMALIZATION: TraceRef.CitingPath (validate-relative SupportRef.File)
      vs record.Path (gate-side filepath.Join) can differ absolute/relative;
      both MUST be gate.NormalizePath'd before joining or every join silently
      drops and all coverage vanishes (CLM-050).

  ─────────────────────────────────────────────────────────────────────────
  POSTURE / SEAM INVARIANTS THREADED THROUGH THE CLASSIFIER TASKS
  ─────────────────────────────────────────────────────────────────────────
    • Three tiers (REQ-007): (a) resolution DEFECTS stay validate's — this step
      emits NO ref-resolution/dangling findings; (b) BROKEN PROMISES (delivered
      coverage failure, downstream-outruns-chain, stale-pin) BLOCK; (c) IN-
      FLIGHT gaps (uncovered REQ on a non-delivered bundle) are advisory WARN.
    • The advisory is a SEPARATE step name so no policy can upgrade its WARN.
    • DISPATCH REFUSAL IS A SEAM: pkg/gate supplies ONLY the block StepResult;
      it subscribes to / intercepts / refuses NO promotion or dispatch event
      (the gate-on-implement hook / opencode runtime consume the verdict).
    • ALL gate dimensions run at EVERY verification step (no-check-filtering
      razor) — verification tasks never scope or categorize what was touched.

  ─────────────────────────────────────────────────────────────────────────
  COMPILE-CLOSURE (why the phase ordering is what it is)
  ─────────────────────────────────────────────────────────────────────────
  A Go package's _test.go files compile as a unit. Each phase introduces only
  test files whose referenced symbols are built by that phase's (or an earlier
  phase's) impl, so every phase's verification finds a compiling, green
  package: P1 = constants; P2 = bundle walker + pure predicates (SupportsCover
  age, StalePinVerdict) — no classifier symbols referenced; P3 = the classifier
  + split + TraceRef; P4 = cmd/backstop wiring + the mandatory fixture-corpus
  integration test.

