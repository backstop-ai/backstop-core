      - id: TASK-015
        type: implementation
        title: "Implement TraceRef + ClassifyRequirementTraceability + SplitTraceabilityResult (modeled on ClassifyStatusDrift)"
        description: |
          Extend pkg/gate/requirement_traceability.go with the classifier input
          type, the pure full-corpus classifier, and the severity split — modeled
          EXACTLY on status_drift's ClassifyStatusDrift / SplitDriftResult /
          driftStepResult block/advisory pattern.

            - type TraceRef struct { BundleName string; ReqID string;
              PinVersion string; Pinned bool; CitingPath string } — a gate-local
              citing supports ref (the cmd/backstop wiring converts each
              validate.SupportRef into one; pkg/gate does not import pkg/validate).
              BundleName joins to a KindBundle record's BundleName; CitingPath
              joins to an ArtifactStatusRecord.Path. Both CitingPath and record
              Path are pre-normalized (gate.NormalizePath) by the wiring BEFORE
              joining.

            - func ClassifyRequirementTraceability(records []ArtifactStatusRecord,
              refs []TraceRef) StepResult — the pure classifier. Passes over the
              resolved corpus (each independently exercised by the Phase 3 tests):
              (1) CORPUS JOIN — index KindBundle records by BundleName (NOT
              number), citing records by Path; build per-bundle declared REQs +
              current versions. (2) COVERAGE RESOLUTION — for each delivered
              bundle REQ, COVERED iff some citing ref's artifact satisfies
              SupportsCoverage; per-REQ, not aggregate; issue + non-implemented/
              retired spec refs never cover; retain issue refs as queryable
              lineage. (3) LIVE-CITING — for each delivered bundle, every LIVE
              citing spec must be implemented; a live non-implemented citing spec
              is a broken-promise BLOCK; terminal-retired citers skipped. (4)
              STALE-PIN — StalePinVerdict(ref.PinVersion, cited REQ current
              version); stale on non-delivered → downstream stale-pin BLOCK; on
              delivered → bundle not-delivered until a spec pinned to current is
              implemented; PATCH/equal free. (5) STATE INVARIANT — downstream-
              outruns-chain BLOCK, including the plan.SpecID → spec → spec
              TraceRefs two-hop. (6) POSTURE — broken-promise findings Severity
              "error"; in-flight gaps (uncovered REQ on a non-delivered bundle)
              Severity "warning"; emit NO ref-resolution finding (validate's tier
              a). Returns ONE combined StepResult carrying both severities.
              pkg/gate subscribes to / intercepts / refuses NO event — verdict is
              STATE only (CLM-030).

            - func SplitTraceabilityResult(combined StepResult) (block StepResult,
              advisory StepResult) — partitions by severity: error-severity onto
              StepRequirementTraceability (policied block surface), warning-
              severity onto StepRequirementTraceabilityAdvisory (non-policied
              advisory surface), exactly as SplitDriftResult does — a single
              classification, two derived surfaces.

          STANCE (must hold structurally, verified by TASK-013): the advisory
          surface is a SEPARATE step name carrying no policy entry (non-
          upgradable); the block surface is NOT added to the waivable dimension
          set and carries no `applies-to: new-code` policy entry. No language
          noun / tool knowledge enters requirement_traceability.go; no filesystem
          access (operates on already-resolved records + refs).
