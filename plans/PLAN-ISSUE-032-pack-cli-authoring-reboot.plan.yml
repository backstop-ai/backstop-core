          .backstop/packs/backstop/go-toolchain (proves the engines-block parse fix — this
          is the case the prior review missed) must ALL pass. Also confirm the bad-engine
          fixture FAILS both check and test (guard holds). Confirms CLM-006/012/013.
        files:
          - pkg/packval/phase5.go
          - pkg/packval/phase2.go
          - pkg/packval/manifest.go
        claims:
          - CLM-004
          - CLM-005
          - CLM-006
          - CLM-012
          - CLM-013
        depends_on:
          - TASK-005

