notes: |
  Implements ISSUE-032 — the pack-CLI authoring-loop reboot. Packs are the framework's
  substrate; the CONSUMPTION/INSTALL path was modernized by BUNDLE-011's engine-dispatch
  cutover, but the AUTHORING/VALIDATION/SCAFFOLD tooling was not. Six concrete defects
  (A–F) leave the loop broken at scaffold, broken at validate, and broken at re-lock.
  This plan fixes all six and FOLDS ISSUE-030 (vestigial native-standards scaffolder
  eradication) into Defect A — the two share the same surface (pkg/pack/scaffold.go +
  number.go). ISSUE-030 closes delivered-by this work.

  ─────────────────────────────────────────────────────────────────────────────
  TREE VERIFICATION (read 2026-07-08 — issue line numbers confirmed / corrected)
  ─────────────────────────────────────────────────────────────────────────────
  Defect A — pkg/pack/scaffold.go: ScaffoldPack routes "rule"→scaffoldRulePack
    (writes STD-<LANG>-NNN-<slug>.standard.md, schema_version standard/v1, into
    standards/<language>/, scaffold.go:78-140) and "code"→scaffoldCodePack (writes
    <slug>.recipe.md, schema_version recipe/v1, scaffold.go:142-190). ValidPackTypes
    = {rule, code} (scaffold.go:13-15). NO branch emits a pack.yml. pkg/pack/number.go
    ResolvePackNumber scans standards/<language>/ for STD-<LANG>-NNN files. cmd/backstop/
    pack_new.go resolves the number for "rule" packs and its error text says
    "(must be rule or code)". ISSUE-030 targets: delete scaffoldRulePack +
    ResolvePackNumber + the standards/ dir writer; remove artifacts/standard/v1/
    schema.json + the sole fixture cmd/backstop/testdata/artifacts/standards/
    SEC-001-valid.standard.md; add a deletion assertion.

  Defect B — RE-SCOPED after plan-review RAN the CLI (prior "Defect B VERIFIED" note was
    wrong: it only pushed go-STANDARDS through pack check, never go-TOOLCHAIN). Three
    coupled problems, all in pkg/packval, none of which the phase5/phase2 exemptions
    alone fix. The archetype enum in code is {code, enforcement} ONLY (phase1.go:42) —
    there is NO "toolchain"/"mechanism" archetype; BOTH production packs are
    `archetype: enforcement`. The engine-model discriminator is the rule-level `engine:`
    field. The three problems:

    (B0) ENGINES-BLOCK PARSE FAILS AT PHASE1 (go-toolchain dies before phase2/5).
      pkg/packval/manifest.go:23 declares `Engines map[string]engine.EngineBinding` and
      unmarshals it with plain yaml.Unmarshal. But engine.EngineBinding's ScopeKind
      (binding.go:50), EngineCategory (binding.go:70) and GateType (gatetype.go:13) are
      INT enum types with NO UnmarshalYAML. go-toolchain's engines: block carries STRING
      values (scope_kind: project-wide, category: mechanism, gate_type: coverage/build/
      test/lint) → ~12 unmarshal errors at phase1, so go-toolchain never reaches phase2.
      (input_mode parses only because InputMode is `type InputMode string`, binding.go:15
      — the red herring that masked this.) The REAL consumer avoids this: pkg/pack/
      manifest.go:29 uses a string-tagged `EngineSpec` (manifest.go:74) converted by
      parseEngineSpec (manifest.go:503) via ParseGateType/ParseInputMode/ParseScopeKind/
      ParseEngineCategory. packval was never brought in line. FIX: parse the engines:
      block in packval the SAME way the consumer does — reuse pkg/pack's EngineSpec/
      parseEngineSpec, OR add UnmarshalYAML to the enum types. Fixtures use go-toolchain's
      REAL string values; verification RUNS go-toolchain through the real `pack check`.

    (B1) phase5.go:22 errors "invalid layer" when rule.Layer < 1. go-standards rules
      carry `engine: semgrep` + claims + fixtures but NO `layer:` (Layer==0) → fail.
      FIX: exempt a rule from the layer 1..3 requirement when its `engine:` is non-empty.
    (B2) phase2.go:30 errors "rule has no claims" for any claimless rule. go-toolchain's
      build/vet/test/coverage rules carry `engine:` and NO `claims:` → fail.
      FIX: exempt a claimless rule from "rule has no claims" when its `engine:` is
      non-empty. Do NOT weaken the claimed-rule fixture checks.

    (B-GUARD) VACUOUS-GREEN HOLE — the exemption must not be a free escape hatch.
      Discriminating on `rule.Engine != ""` alone lets `engine: totally-bogus` (no file,
      no claims) pass BOTH `pack check` and `pack test` green — check mode never runs
      phase3 (pipeline.go appends phase3 only when Mode=="test"); test mode resolves the
      engine only inside `if rule.File != ""` (phase3.go). So an unknown engine escapes
      layer+claims and only fails later at gate-consume — a vacuous green, and the
      discriminator is trivially dodgeable. FIX: the exemption path must require
      resolveEngine(pack, rule.Engine) to SUCCEED (manifest.go:31 already fails loud via
      Registry.Lookup); an unknown OR empty engine must FAIL LOUD naming the engine, and
      this validation must run in CHECK mode (not just test). Only a rule whose engine
      resolves to a real binding is exempted from layer/claims.

  Defect C — cmd/backstop/pack_check.go:17-21 AND cmd/backstop/pack_test_cmd.go:17-21:
    both if/else arms assign format="json" (dead branch). FIX: the else arm must assign
    "text" so `--format text` takes effect.

  Defect D — pkg/pack/distribution/list.go:36-39: listManifest decodes top-level
    `rules:` / `scaffolds:`; modern packs nest rules under content.ruleset.rules → count
    is always 0. FIX: decode content.ruleset.rules (fall back to top-level for legacy).
    Also computeLockStatus (list.go) returns "stale" for a local pack whose path is
    unchanged; a pack whose LockEntry.SourceType=="local" (lockfile.go:22) with a
    matching content hash must read "current".

  Defect E — pkg/scaffold/scaffold.go (bundle case, ~line 204): emits schema_version
    bundle/v1, but the scaffolder builds a BUNDLE-NNN-<slug>.bundle.md filename that only
    bundle/v2's filename_pattern accepts (v1 rejects the numbered prefix). FIX: stamp
    bundle/v2. Same file ISSUE-009 just touched.

  Defect F — no clean local-pack relock. pack add refuses an already-installed pack
    (add.go:116 "use pack update or pack upgrade"); pack update (pack_update.go →
    distribution.Update) is a no-op for local source. The only path to refresh a stale
    lock entry for a locally-edited pack is remove+add. FIX: add a `pack relock <path>`
    subcommand backed by pkg/pack/distribution that re-reads the local pack dir,
    recomputes content_hash (ComputeContentHash), and overwrites the lock entry.

  ─────────────────────────────────────────────────────────────────────────────
  ACCEPTANCE (load-bearing end-to-end) — the loop must actually work, not just units:
    `backstop pack new` a fresh engine pack → `backstop pack check` passes →
    `backstop pack test` passes → `backstop pack add` installs it INTO A TEMP PROJECT →
    `backstop gate` RUN FROM INSIDE THAT TEMP PROJECT consumes it GREEN. Running the gate
    from inside the temp project (NOT backstop-core's own root) is what genuinely proves
    the scaffolded pack is consumed — backstop-core's own manifest does not list the
    throwaway pack. Proven in Phase 6 against the REAL CLI (Defect A's scaffolder output
    validated by Defect B's parse+exemptions). Plus per-defect unit tests. `backstop gate`
    + `backstop artifact validate` on backstop-core stay green throughout.

  ─────────────────────────────────────────────────────────────────────────────
  TOOLING NOTE: `backstop code check` was REMOVED from this repo (ISSUE-018). Middle-
    phase verification uses `go test` (package-scoped) + the REAL pack CLI (`backstop
    pack check/test/new/add/relock`). The FINAL phase runs `backstop gate` (full kill
    chain, covers .go) + `backstop artifact validate` (covers the deleted standard/v1
    schema + the bundle scaffold change). New package-level regex/map vars must carry
    the `// nosemgrep: go.core.no-global-mutable-state` suppression the codebase uses
    (see pkg/packval/phase1.go:9). All new code covered to 90%; errors handled
    explicitly (go-standards).

  ─────────────────────────────────────────────────────────────────────────────
  CLAIMS (this plan's own; issues carry no formal CLM-NNN):
    CLM-001 — `pack new` emits a VALID engine pack.yml (name/version/language/archetype
              + content.ruleset with a sample engine rule carrying risk_class + claims +
              fixtures, + an engines: block with STRING enum values, + the referenced
              sample rule file) that parses at phase1 and passes phases 1,2,4,5. No more
              .standard.md / .recipe.md.
    CLM-002 — ValidPackTypes reflects the live pack shapes (engine/toolchain/mechanism);
              "rule"/"code" removed; pack_new.go dispatch + error text updated; the
              number-resolution step for "rule" removed.
    CLM-003 — scaffoldRulePack, scaffoldCodePack, and ResolvePackNumber are DELETED; the
              standards/<language>/ writer is gone; artifacts/standard/v1/schema.json +
              cmd/backstop/testdata/artifacts/standards/SEC-001-valid.standard.md removed;
              a deletion assertion proves no standards/ writer / no standard/v1 emitter
              remains. (ISSUE-030 fold — the standards-compiler lineage tombstone is
              recorded in-code.)
    CLM-004 — phase5-layer exempts a rule with a non-empty, RESOLVABLE `engine:` from the
              layer 1..3 requirement, so engine-model rules (go-standards) no longer fail
              "invalid layer".
    CLM-005 — phase2-coherence exempts a claimless rule with a non-empty, RESOLVABLE
              `engine:` from the "rule has no claims" error, so mechanism engine rules
              (go-toolchain) validate.
    CLM-006 — BOTH installed production packs — backstop/go-standards AND backstop/
              go-toolchain — pass BOTH `backstop pack check` and `backstop pack test`
              (go-toolchain proves the engines-block parse fix; go-standards proves the
              layer/claims exemptions).
    CLM-007 — `pack check --format text` and `pack test --format text` emit TEXT (the
              dead-branch bug in both commands is fixed).
    CLM-008 — `pack list` reports a real rule count from content.ruleset.rules (falling
              back to top-level `rules:` for legacy) and shows lock status "current"
              (not "stale") for an unchanged local pack.
    CLM-009 — `artifact new bundle` stamps schema_version bundle/v2, so a freshly
              scaffolded numbered bundle is valid against the schema its filename requires.
    CLM-010 — `pack relock <path>` re-reads a local pack dir, recomputes content_hash,
              and overwrites its backstop.lock entry (no remove+add workaround).
    CLM-011 — the full authoring loop works end-to-end: pack new → check → test → add →
              gate (run from inside the temp project) green.
    CLM-012 — packval parses the pack `engines:` block with STRING enum values the same
              way the consumer does (EngineSpec/parseEngineSpec, or enum UnmarshalYAML),
              so go-toolchain parses at phase1 instead of failing with ~12 int-enum
              unmarshal errors.
    CLM-013 — the layer/claims exemption applies ONLY to a rule whose `engine:` RESOLVES
              to a known binding (resolveEngine succeeds); an unknown OR empty engine
              fails LOUD naming the engine in BOTH check AND test mode — no vacuous green,
              the discriminator is not dodgeable.

phases:
  - id: phase-1
    name: "Phase 1: Setup — engine-pack validation fixtures"
    tasks:
      - id: TASK-001
        type: setup
        title: "Add engine-model pack fixtures (real engines block) for packval tests"
        description: |
          Create testdata fixtures for the Defect B parse + exemption + guard tests.
          (1) A VALID engine pack dir whose top-level engines: block uses go-toolchain's
          REAL string enum values (scope_kind: project-wide, category: mechanism, gate_type
          across coverage/build/test/lint, input_mode: none) so it exercises the phase1
          engines-block parse (B0); its ruleset holds (a) an engine rule with `engine:` +
          claims + positive/negative fixtures but NO `layer:` (phase5 exemption, B1) and
          (b) a claimless engine rule with `engine:` and NO `claims:` (phase2 exemption,
          B2). Include the referenced rule file + fixture files so phase1 file-existence
          passes. (2) A NEGATIVE bad-engine pack dir whose rule declares `engine:
          totally-bogus` with no file and no claims — the vacuous-green guard fixture
          (B-GUARD) that must FAIL check+test. These fixtures let the packval tests run
          without depending on the globally-installed production packs.
        files:
          - pkg/packval/testdata/engine-pack/pack.yml
          - pkg/packval/testdata/engine-pack/rules/sample.yml
          - pkg/packval/testdata/engine-pack/fixtures/valid/sample-ok.go
          - pkg/packval/testdata/engine-pack/fixtures/invalid/sample-bad.go
          - pkg/packval/testdata/bad-engine-pack/pack.yml
        claims:
          - CLM-004
          - CLM-005
          - CLM-012
          - CLM-013
        depends_on: []

  - id: phase-2
    name: "Phase 2: Defect B — packval parses + validates engine-model packs"
    tasks:
      - id: TASK-002
        type: test
        title: "RED: packval parses the engines: block with string enum values (B0)"
        description: |
          Write a failing test in pkg/packval asserting that a pack manifest whose
          engines: block carries STRING enum values (scope_kind: project-wide, category:
          mechanism, gate_type: coverage/build/test/lint, input_mode: none — go-toolchain's
          real shape, from the TASK-001 fixture) parses at phase1 WITHOUT error. Against
