          EngineCategory/GateType have no UnmarshalYAML). Assert the parsed binding round-
          trips to the same resolved values the consumer's parseEngineSpec produces.
        files:
          - pkg/packval/manifest_engines_test.go
        claims:
          - CLM-012
          - CLM-006
        depends_on:
          - TASK-001
      - id: TASK-003
        type: implementation
        title: "Bring packval engines-block parsing in line with the consumer (B0)"
        description: |
          In pkg/packval/manifest.go, parse the top-level engines: block the SAME way the
          real consumer does (pkg/pack/manifest.go EngineSpec + parseEngineSpec via
          ParseGateType/ParseInputMode/ParseScopeKind/ParseEngineCategory) — either reuse
          pkg/pack's EngineSpec/parseEngineSpec, or add UnmarshalYAML to the engine enum
          types (engine.ScopeKind/EngineCategory/GateType). A pack engines: block with
          string enum values must parse to the same resolved bindings the consumer yields.
          Fail loud on an invalid enum string (do not silently zero-value it). Handle
          errors explicitly. Make TASK-002 pass.
        files:
          - pkg/packval/manifest.go
        claims:
          - CLM-012
        depends_on:
          - TASK-002
      - id: TASK-004
        type: test
        title: "RED: engine-rule layer/claims exemptions + vacuous-green guard (B1/B2/B-GUARD)"
        description: |
          Write failing tests in pkg/packval. EXEMPTIONS: for phase5.go (RunLayer) a rule
          with a non-empty resolvable `engine:` and Layer==0 must NOT produce "invalid
          layer", while a NON-engine rule with Layer==0 STILL errors; for phase2.go
          (RunCoherence) a claimless rule with a non-empty resolvable `engine:` must NOT
          produce "rule has no claims", while a claimless rule with NO engine STILL errors.
          GUARD (B-GUARD): using the bad-engine fixture, a rule with `engine: totally-bogus`
          (unknown) and a rule with an EMPTY engine must FAIL — in BOTH check mode AND test
          mode — with a loud error naming the engine; they must NOT be silently exempted.
          Assert resolution is enforced in CHECK mode (which never runs phase3). Tests fail
          against current code.
        files:
          - pkg/packval/phase5_test.go
          - pkg/packval/phase2_test.go
        claims:
          - CLM-004
          - CLM-005
          - CLM-013
          - CLM-006
        depends_on:
          - TASK-001
          - TASK-002
      - id: TASK-005
        type: implementation
        title: "Resolve-gated layer/claims exemptions in phase5/phase2 (B1/B2/B-GUARD)"
        description: |
          In pkg/packval/phase5.go RunLayer and pkg/packval/phase2.go RunCoherence, exempt
          a rule from the layer 1..3 requirement (phase5) and the "rule has no claims"
          requirement (phase2) ONLY when resolveEngine(pack, rule.Engine) SUCCEEDS. On a
          non-empty engine that does NOT resolve, emit a loud error naming the engine
          (fail; do not exempt). An EMPTY engine is never exempted. This resolution check
          must execute in CHECK mode — add it to the phase logic that check mode runs, not
          phase3 (which check mode skips). Do NOT weaken the claimed-rule fixture checks (a
          claimed engine rule still needs positive+negative fixtures). Depends on TASK-003
          so the engines: block resolves. Handle errors explicitly. Make TASK-004 pass.
        files:
          - pkg/packval/phase5.go
          - pkg/packval/phase2.go
        claims:
          - CLM-004
          - CLM-005
          - CLM-013
        depends_on:
          - TASK-004
          - TASK-003
