---
plan_id: PLAN-SPEC-013
spec_id: SPEC-013
spec_version: 1.0.0
created: "2026-04-14"
status: ready
target_repo: backstop-core
target_module: github.com/bmanson/backstop-core
test_command: "go test ./pkg/pack/ -race -coverprofile=cover.out"
coverage_threshold: 90

notes: |
  Implements pack.yml manifest types and parsing for pkg/pack/.
  This adds manifest.go (types + parsing) and manifest_test.go alongside
  the existing scaffold.go and number.go in pkg/pack/.

  The spec defines 81 claims (CLM-001 through CLM-083, gap at 068/069)
  covering: Go struct definitions, YAML parsing, required field validation,
  enum validation, fixture entry polymorphism, coordinate parsing,
  namespaced rule IDs, naming normalization, versioning, scaffold/SDK/tool_config
  structures.

  Out of scope: layer-specific field requirements, archetype content
  restrictions, co-occurrence rules (those belong to SPEC-019).

  Structure: manifest.go holds all types and parsing functions.
  manifest_test.go holds all tests. A testdata/ directory holds YAML fixtures
  for integration-style parse tests. coordinate.go is split out for
  ParseCoordinate and NamespacedRuleID to enable parallel work.

  Note: the spec contracts declare ParseCoordinate and NamespacedRuleID on
  manifest.go. This plan splits them into coordinate.go for D-081 parallel
  file exclusivity. Both files are in pkg/pack/ (same Go package) so the
  public API is identical. The spec contract is satisfied at the package
  level; the file split is an implementation optimization.

  Parallelism strategy:
    - Phase 2: Two parallel test+impl pairs using disjoint files
      (manifest.go/manifest_test.go vs coordinate.go/coordinate_test.go)
    - Phase 3: Sequential — enum/field validation on manifest.go
    - Phase 4: Sequential — scaffold/pairs_with validation on manifest.go
    - Phase 5: Sequential — SDK/ToolConfig validation on manifest.go
    - Phase 6: Sequential — claim uniqueness + namespacing integration
    - Phase 7: Comprehensive verification

phases:
