          placeholder function signatures that return errors.

          Types to define:
            - Manifest (Name, NormalizedName, Version, Language, Archetype,
              Description, Content, ToolConfig)
            - Content (Ruleset, Scaffolds, SDK)
            - Ruleset (Version, Rules)
            - Rule (ID, NamespacedID, Standard, RulePath, RiskClass, Layer,
              Claims, Category, Justification, Validator, InputScope, PairsWith)
            - Claim (ID, Text, Fixtures)
            - Fixtures (Positive, Negative — both []FixtureEntry)
            - FixtureEntry (Path, BypassAttempt) with custom UnmarshalYAML stub
            - Scaffold (ID, Version, Tier, Path, TestCommand, Description,
              UseWhen, Assumes, PairsWith, SampleConfig)
            - SDK (Module, Version, Provides)
            - ToolConfigEntry (ID, Tool, File, Settings, RiskClass, Claims, RequiredBy)
            - PairsWith (Rules, Scaffolds, SDK)
            - Coordinate (PackName, PackVersion, ItemName, ItemVersion)

