notes: |
  Implements ISSUE-028 — the multi-rule ast-grep dispatch defect (issue→plan
  reactive track). A pack carrying more than one ast-grep rule is unrunnable
  through the production dispatchPackEngines path: the ast-grep EngineBinding
  declares InputMode rule-dir / InputFlag "--rule", and gatherEngineInputs emits
  `--rule <DIR>`. ast-grep 0.43.0's `scan --rule` takes ONE rule FILE, not a
  directory, so it errors ("Is a directory (os error 21)") and produces zero
  findings on stdout — a vacuous green that silently drops every finding from
  every ast-grep rule.

  THE FIX (zero-baked, reuse the existing config-file mode — NO new mode):
    ast-grep's verified multi-rule mechanism is `ast-grep scan --config
    sgconfig.yml --json`, where sgconfig.yml carries `ruleDirs: [<pack ast-grep
    dir>]` and runs ALL rules in one invocation. Backstop must stay
    TOOL-AGNOSTIC: it must NOT generate or parse sgconfig.yml — doing so would
    BAKE ast-grep's config format into the binary (a zero-baked violation). So:

      - sgconfig.yml is PACK-SHIPPED DATA. The pack author (the same author who
        writes the ast-grep rules and already knows ast-grep's sgconfig format)
        writes ast-grep/sgconfig.yml alongside the rules. The ast-grep rule's
        rule_path points at that pack-shipped sgconfig.yml.
      - The dispatch REUSES the EXISTING InputModeConfigFile (`config-file`,
        InputFlag "--config"), which already "passes a single pack-supplied
        config file" (binding.go:18) and resolves exactly one rule_path. No new
        InputMode constant, no per-engine generation code, no sgconfig knowledge
        in the binary.
      - The engine NAME stays "ast-grep" (it keeps its own Command, Convert,
        Provision, Category). ONLY its InputMode flips rule-dir→config-file and
        InputFlag "--rule"→"--config" in DefaultRegistry. The field-contract
        `ast-grep|rule_path|requires` (validate_manifest.go) stays satisfied
        because the rule still declares rule_path (now the sgconfig.yml path).
        We are NOT renaming the rule's engine to "config-file" (that engine
        FORBIDS rule_path, CLM-009).

  RETIRE InputModeRuleDir (no dead code / zero-baked): ast-grep is the SOLE user
    of InputModeRuleDir (grep evidence: const def + ParseInputMode +
    validate_manifest layout switch + binding.go ast-grep + binding_test.go +
    pack_gate_scope_test.go — no other engine, no pack). After the ast-grep flip
    the mode has zero remaining users, so it is DELETED: the const, the
    ParseInputMode case, the gatherEngineInputs `case InputModeRuleDir`, the
    validate_manifest.go layout switch arm, and the two test references. The
    CONFIRM-then-delete order is enforced by TASK-010 (a grep-evidence
    deletion-assertion test) running BEFORE the deletion; if any non-ast-grep
    user is found the mode is left in place and only ast-grep flips.

  THE RECURRING GAP (the reason this issue exists — honored by TASK-005/006):
    every existing ast-grep dispatch test uses a stubbed fixtureRunner that
    intercepts "ast-grep scan" and returns canned JSON, so `--rule <DIR>` never
    reached real ast-grep and the proof pack had only ONE rule. A stub is what
    hid the bug. This plan's load-bearing acceptance test is REAL and UN-STUBBED:
    it dispatches a brand-new TWO-rule ast-grep pack through the production
    dispatchPackEngines with the REAL ast-grep binary (real convert, real SARIF
    parse) and asserts findings from BOTH rules. If the ast-grep binary is
    absent it FAILS LOUD via t.Fatal naming ast-grep + the install command —
    NEVER t.Skip (a skip is silent vacuous green and would re-hide the bug).

  SCOPE FENCE (issue-mandated, do NOT fold in): ISSUE-020 (convert SIGABRT under
    sandbox / jq) and ISSUE-027 (backstop-owned pack under .backstop/packs
    extra_unlocked) are sibling blockers tracked separately. This plan covers
    ONLY the dispatch fix.

  CLAIM LEGEND (issue has no CLM array; these encode its acceptance + invariants):
    CLM-001 ast-grep binding flips rule-dir/"--rule" → config-file/"--config" in
            DefaultRegistry; engine name stays "ast-grep".
    CLM-002 dispatch emits exactly one `--config <pack sgconfig.yml>` for a
            multi-rule ast-grep pack (no per-dir `--rule`, no duplicate flag).
    CLM-003 sgconfig.yml is PACK-SHIPPED data with `ruleDirs`; backstop never
            generates or parses it (zero-baked / tool-agnostic).
    CLM-004 a multi-rule ast-grep pack runs ALL its rules in one invocation and
            reports findings from every rule — no vacuous green.
    CLM-005 a REAL, un-stubbed end-to-end test dispatches a TWO-rule ast-grep
            pack through production dispatchPackEngines with the real ast-grep
            binary and asserts findings from BOTH rules.
    CLM-006 that E2E test FAILS LOUD (t.Fatal naming ast-grep + install) when the
            ast-grep binary is absent — never t.Skip.
    CLM-007 the existing engine-dispatch ast-grep testdata pack + fixtures are
            aligned to ship sgconfig.yml and use config-file mode.
    CLM-008 InputModeRuleDir is retired (deleted) after confirming ast-grep was
            its only user; all references removed, no dead mode left.
    CLM-009 the existing fast unit dispatch tests stay valid against the new
            config-file shape (single-rule proof path still proven).

