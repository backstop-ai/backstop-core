            - TestPackUpdate_TamperDetectsRiskClassChange: verify DetectTamper
              identifies when risk_class changes
            - TestPackUpdate_TamperDetectsRuleRemoval: verify DetectTamper
              identifies when a rule is removed
            - TestDetectTamper_NoTamper: verify clean comparison returns no tamper
            - TestDetectTamper_NonTamperChangesAccepted: verify content changes
              that do not match tamper categories return HasTamper=false
        files:
          - pkg/pack/distribution/tamper_test.go
        claims:
          - CLM-022
          - CLM-023
          - CLM-024
          - CLM-025
          - CLM-027
        depends_on:
          - TASK-001

      # --- Tamper Detection: implementation ---
      - id: TASK-013
        type: implementation
        title: "Implement tamper detection"
        description: |
          Create pkg/pack/distribution/tamper.go implementing:
            - DetectTamper(oldPackDir string, newPackDir string) (*TamperResult, error):
              compares old and new pack directories for the four tamper categories
            - TamperResult struct: Changes []TamperChange, HasTamper bool
            - TamperChange struct: Kind string (fixture_removal, severity_downgrade,
              risk_class_change, rule_removal), Description string

          Tamper categories:
            1. fixture_removal: test fixture file present in old but absent in new
            2. severity_downgrade: rule severity lowered (error->warning, warning->info)
            3. risk_class_change: rule risk_class field differs
            4. rule_removal: rule present in old manifest but absent in new

          Non-tamper changes (new rules, new fixtures, description edits) are accepted.

          Run backstop code check to verify tests compile and code standards pass.
        files:
          - pkg/pack/distribution/tamper.go
        claims:
          - CLM-022
          - CLM-023
          - CLM-024
          - CLM-025
          - CLM-027
        depends_on:
          - TASK-012

      # --- Lock Verification: test ---
      - id: TASK-014
        type: test
        title: "Write lock verification tests"
        description: |
          Create pkg/pack/distribution/verify_test.go with tests for gate-time
          lock verification (REQ-022, REQ-023).

          Test functions (from spec claims):
            - TestGate_HashMismatchFails: verify VerifyLock fails when installed
              pack hash does not match lockfile hash
            - TestGate_MissingPackFails: verify VerifyLock fails when locked pack
              is not present in .backstop/packs/
            - TestGate_ExtraUnlockedPackFails: verify VerifyLock fails when pack
              exists in .backstop/packs/ but not in backstop.lock
            - TestGate_AllPacksMatchPasses: verify VerifyLock passes when all
              packs match hashes with no extras
            - TestGate_MissingLockfileWithPacksFails: verify failure when
              backstop.lock absent but packs declared in backstop.yml
            - TestGate_NoPacksNoLockfilePasses: verify pass when no packs
              declared and no lockfile
            - TestGate_LocalPackVerifiedByHash: verify local path packs are
              verified by content hash at gate time
        files:
          - pkg/pack/distribution/verify_test.go
        claims:
          - CLM-042
          - CLM-043
          - CLM-044
          - CLM-045
          - CLM-046
          - CLM-047
          - CLM-053
        depends_on:
          - TASK-006

      # --- Lock Verification: implementation ---
      - id: TASK-015
        type: implementation
        title: "Implement lock verification"
        description: |
          Create pkg/pack/distribution/verify.go implementing:
            - VerifyLock(lockfile *Lockfile, packsDir string, ymlPacks []string)
              (*VerifyResult, error): verifies all locked packs are present with
              matching hashes, detects extra unlocked packs, handles missing lockfile
            - VerifyResult struct: Pass bool, Failures []LockFailure
            - LockFailure struct: Pack, Kind (hash_mismatch, missing_pack,
              extra_unlocked, missing_lockfile), Message string

          Verification logic:
            1. If lockfile is nil but ymlPacks is non-empty: missing_lockfile failure
            2. For each locked pack: check present in packsDir, compute hash, compare
            3. For each pack in packsDir: check present in lockfile
            4. Local packs verified by hash at their source path

          Run backstop code check to verify tests compile and code standards pass.
        files:
