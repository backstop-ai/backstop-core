      # --- pack add: implementation ---
      - id: TASK-018
        type: implementation
        title: "Implement pack add command"
        description: |
          Create pkg/pack/distribution/add.go implementing:
            - Add(packRef string, opts AddOptions) (*AddResult, error): the full
