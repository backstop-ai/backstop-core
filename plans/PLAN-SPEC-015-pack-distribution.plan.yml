        type: setup
        title: "Scaffold pkg/pack/distribution package and test fixtures"
        description: |
          Create the pkg/pack/distribution/ package directory with a doc.go file
          establishing the package declaration. Create testdata/ directory with
          fixture pack directories for testing:
          - testdata/valid-pack/ with a minimal pack.yml and one rule file
          - testdata/valid-pack-v2/ with a second version for update/upgrade tests
          - testdata/invalid-pack/ with a pack that fails validation
          - testdata/local-pack/ for local path pack tests
          - testdata/tamper-pack-fixture-removed/ for tamper detection tests
          - testdata/tamper-pack-severity-downgrade/ for severity downgrade tests
          - testdata/tamper-pack-risk-class-change/ for risk_class change tests
          - testdata/tamper-pack-rule-removed/ for rule removal tests

          These fixtures support all downstream test tasks.
        files:
          - pkg/pack/distribution/doc.go
          - pkg/pack/distribution/testdata/valid-pack/pack.yml
          - pkg/pack/distribution/testdata/valid-pack-v2/pack.yml
          - pkg/pack/distribution/testdata/invalid-pack/pack.yml
          - pkg/pack/distribution/testdata/local-pack/pack.yml
        claims:
          - CLM-001
          - CLM-041
        depends_on: []

  # ═══════════════════════════════════════════════════════════════════════
  # Phase 2: Content Hash and Lockfile (parallel)
  # ═══════════════════════════════════════════════════════════════════════
  - id: phase-2
    name: "Phase 2: Content Hash and Lockfile Infrastructure"
    tasks:
      # --- Content Hash: test ---
      - id: TASK-002
        type: test
        title: "Write content hash tests"
        description: |
          Create pkg/pack/distribution/hash_test.go with tests for the SHA-256
          content hashing algorithm (REQ-021).

          Test functions (from spec claims):
            - TestContentHash_SortedManifest: verify hash is computed from sorted
              manifest of relative-path:SHA-256-file-hash pairs
            - TestContentHash_CoversAllFiles: verify every file in the pack
              directory is included in the hash computation
            - TestContentHash_DeterministicOutput: verify same directory produces
              identical hash on repeated calls
            - TestComputeFileHash: verify individual file hashing returns correct
              SHA-256 hex digest
            - TestContentHash_EmptyDir: verify behavior on empty directory
            - TestContentHash_NestedDirs: verify nested directory files are included
              with correct relative paths
            - TestContentHash_MixedLineEndings: verify content with CRLF and LF
              produces consistent hash (cross-platform stability)
        files:
          - pkg/pack/distribution/hash_test.go
        claims:
          - CLM-041
        depends_on:
          - TASK-001

      # --- Content Hash: implementation ---
      - id: TASK-003
        type: implementation
        title: "Implement content hash functions"
        description: |
          Create pkg/pack/distribution/hash.go implementing:
            - ComputeContentHash(dir string) (string, error): walks all files in
              dir, computes SHA-256 of each, builds sorted manifest of
              relative-path:SHA-256 pairs, hashes the manifest to produce final hash
            - ComputeFileHash(path string) (string, error): computes SHA-256 of a
              single file's content

          The content hash is the SHA-256 of a newline-joined, lexicographically
          sorted manifest of "relative/path:hexdigest" entries. Paths use forward
          slashes regardless of OS.

          Run backstop code check to verify tests compile and code standards pass.
        files:
          - pkg/pack/distribution/hash.go
        claims:
          - CLM-041
        depends_on:
          - TASK-002

      # --- Lockfile: test ---
      - id: TASK-004
        type: test
        title: "Write lockfile tests"
        description: |
          Create pkg/pack/distribution/lockfile_test.go with tests for the
          backstop.lock format (REQ-020).

          Test functions (from spec claims):
            - TestLockfile_YamlSortedKeys: verify lockfile output has sorted keys
            - TestLockfile_ContainsAllRequiredFields: verify each entry has name,
              version, git_ref, content_hash, source_type, install_date
            - TestLockfile_NullGitRefForLocalPack: verify local packs have null
              git_ref in YAML output
            - TestLockfile_ValidGitRefForGitPack: verify git packs have valid
              git_ref string
            - TestReadLockfile_RoundTrip: write then read, verify identical data
            - TestReadLockfile_MissingFile: verify appropriate error
            - TestWriteLockfile_SortedOutput: verify YAML output is key-sorted
            - TestLocalPack_LockEntryHasHashNoGitRef (CLM-052): verify local
              pack lockfile entry has content hash but null git ref
        files:
          - pkg/pack/distribution/lockfile_test.go
        claims:
          - CLM-039
          - CLM-040
          - CLM-052
        depends_on:
          - TASK-001

      # --- Lockfile: implementation ---
      - id: TASK-005
        type: implementation
        title: "Implement lockfile read/write"
        description: |
          Create pkg/pack/distribution/lockfile.go implementing:
            - Lockfile struct: Packs map[string]LockEntry
            - LockEntry struct: Name, Version, GitRef *string, ContentHash,
              SourceType, InstallDate (RFC 3339) fields
            - ReadLockfile(path string) (*Lockfile, error): reads and parses YAML
            - WriteLockfile(path string, lockfile *Lockfile) error: writes YAML
              with sorted keys

          YAML output must have sorted keys at all levels. LockEntry.GitRef is
          a pointer to allow null representation for local packs.

          Run backstop code check to verify tests compile and code standards pass.
        files:
          - pkg/pack/distribution/lockfile.go
        claims:
          - CLM-039
          - CLM-040
        depends_on:
          - TASK-004

      # --- Phase 2 verification ---
      - id: TASK-006
        type: verification
        title: "Verify hash and lockfile infrastructure"
        description: |
          Run all tests for hash and lockfile:
        files:
          - pkg/pack/distribution/hash_test.go
          - pkg/pack/distribution/lockfile_test.go
        claims:
