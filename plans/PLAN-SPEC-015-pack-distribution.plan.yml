---
plan_id: PLAN-SPEC-015
spec_id: SPEC-015
spec_version: 1.0.0
created: "2026-04-14"
status: draft
target_repo: backstop-core
target_module: github.com/bmanson/backstop-core
test_command: "go test ./pkg/pack/distribution/... -race -coverprofile=cover.out"
coverage_threshold: 80

notes: |
  Implements the pack distribution lifecycle: six commands (pack add, pack remove,
  pack install, pack update, pack upgrade, pack list) plus the backstop.lock format,
  SHA-256 content hashing, gate-time lock verification, tool_config provenance
  tracking, and .backstop/packs/ lifecycle management.

  Build order: shared infrastructure first (hash, lockfile, provenance, config_merge,
  tamper, verify), then commands (add, remove, install, update, upgrade, list), then
  CLI adapters. Each layer follows TDD: test -> implementation -> verification.

  Parallel execution: hash and lockfile are independent (Phase 2). Provenance and
  config_merge are independent (Phase 3). Tamper and verify are independent (Phase 4).
  pack remove and pack install are independent (Phase 7). pack list and CLI adapters
  for earlier commands are independent where file sets are disjoint.

  The package target is pkg/pack/distribution/ (not pkg/distribution/).
  CLI adapters live at cmd/backstop/pack_*.go.

phases:
  # ═══════════════════════════════════════════════════════════════════════
  # Phase 1: Setup and Scaffolding
  # ═══════════════════════════════════════════════════════════════════════
  - id: phase-1
    name: "Phase 1: Setup and Scaffolding"
    tasks:
