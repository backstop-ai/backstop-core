          - CLM-010
          - CLM-011
        depends_on:
          - TASK-001

      # --- Config Merge: implementation ---
      - id: TASK-010
        type: implementation
        title: "Implement config merge with conflict detection"
        description: |
          Create pkg/pack/distribution/config_merge.go implementing:
            - MergeToolConfig(packDir string, projectDir string, prov *Provenance)
              (*MergeResult, error): reads tool_config from pack, compares to
              consumer's current config, detects conflicts, merges additively
            - MergeResult struct: Merged []ProvenanceEntry, Conflicts []ConfigConflict
            - ConfigConflict struct: ConfigFile, SettingKey, PackValue, CurrentValue

          On conflict (same setting, different value): returns MergeResult with
          Conflicts populated. Caller decides to abort. No interactive prompts.
          On success: merges settings, returns Merged entries for provenance recording.

