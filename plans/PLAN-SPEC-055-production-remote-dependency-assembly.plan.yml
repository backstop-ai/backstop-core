              install_reconcile_test.go) for `func Test…` identifiers, and
              assert every SPEC-015 name that lives in those files is still
              present VERBATIM.

          READ FROM THE SPEC, NOT FROM A HARDCODED LIST (spec Review Question
          12). A hardcoded list drifts silently and turns the guard into
          decoration. Locate the spec by walking up from the test file to the
          repo root rather than baking an absolute path, and FAIL LOUDLY if
          the spec cannot be found — a test that silently passes when it
          cannot read its own input is worse than no test.

          Current corpus measurement, for your sanity check: SPEC-015
          mandates 100 test names; the six suites declare 139 test funcs; the
          intersection is 62. If your test finds materially fewer than 62,
          your name extraction is wrong, not the corpus.

          WHY THIS MATTERS: BUNDLE-006's revision-impact section forbids
          rewriting SPEC-015's historical `REQ-021@1.0.0` pin, and renaming a
