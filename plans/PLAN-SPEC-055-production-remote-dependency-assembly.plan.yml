notes: |
  ─────────────────────────────────────────────────────────────────────────
  WHAT THIS PLAN BUILDS (BUNDLE-006 foundation reliability seed)
  ─────────────────────────────────────────────────────────────────────────
  Three concrete production implementations that do not exist anywhere in
  the tree (ExecGitCloner, PackvalValidator, TagVersionResolver), four
  constructor-assembled lifecycle command TYPES replacing four package-level
  free functions, ONE production assembly file in cmd/backstop, the
  cross-cutting error-surfacing repair (default-loud + an `Explained`
  opt-out), a structured `--json` error envelope, and the two test MECHANISMS
  (reportError seam + stream-separated CLI runner) without which the
  error-surfacing claims cannot be asserted at all.

  ─────────────────────────────────────────────────────────────────────────
  VERIFICATION COMMAND REALITY — READ THIS BEFORE EVERY VERIFICATION TASK
  ─────────────────────────────────────────────────────────────────────────
  `backstop code check` DOES NOT EXIST (ISSUE-076). Any instruction, agent
  definition, or precedent plan telling you to run it is stale. The real
  inner-loop verification in this corpus is:

      go build -o bin/backstop ./cmd/backstop     # ALWAYS — see below
      go test <the packages this phase touched> -race -count=1
      ./bin/backstop gate                          # the full kill chain

  THE REBUILD IS UNCONDITIONAL. Not "when cmd/ changed" — ALWAYS, in every
  one of this plan's eleven verification tasks. bin/backstop is a BUILT
  ARTIFACT that statically links everything under pkg/ as well as
  cmd/backstop, so a phase that adds ONLY pkg/ code (gitcloner.go,
  validator.go, versionresolver.go, command.go) still changes what the gate
  binary would contain. Running the gate without rebuilding reports a verdict
  about code that is not in the binary — ISSUE-077 is exactly this staleness
  class. A stale-binary green is the most expensive kind of vacuous green in
  this repo because it is indistinguishable from a real one.

  ALL gate dimensions run at EVERY verification step (the no-check-filtering
  razor). Verification tasks never scope or categorize what was touched.

  ─────────────────────────────────────────────────────────────────────────
  COMPILE-CLOSURE — WHY THE PHASE ORDER IS WHAT IT IS (non-negotiable)
  ─────────────────────────────────────────────────────────────────────────
  SPEC-055 pass 4 deletes `distribution.Add/Install/Update/Upgrade`. Those
  four free functions are the ONLY way the external package
  `distribution_test` reaches the pipelines: 139 tests across six files
  (add_test.go 58, update_test.go 25, upgrade_test.go 24, install_test.go
  20, install_materialize_test.go 7, install_reconcile_test.go 5) make 138
  free-function calls and set 190 dependency fields on options literals
  (add 28, update 61, upgrade 88, install 11, materialize 2, reconcile 0).
  Delete the functions and the whole test package stops compiling — so the
  deletion and the migration cannot be two independent steps in the naive
  order.

  THIS PLAN SOLVES IT WITH A STRANGLER ORDER, so the tree compiles and the
  suite is green at EVERY task boundary:

    Phase 7  ADD the command types + constructors. Their Run methods
             DELEGATE to the still-present free functions, copying the
             receiver's dependencies onto the options value before the call.
             Both APIs coexist. Nothing breaks.
    Phase 8  Wire production (cmd/backstop) onto the NEW constructors.
    Phase 10 MIGRATE all six suites + the helper call sites onto the new
             constructors. Both APIs still coexist. Nothing breaks.
    Phase 11 NOW delete the free functions, strip the dependency fields off
             the four options structs, move the pipeline bodies into the
             methods, and remove every nil guard. By this point NOTHING
             calls the deleted API, so the deletion compiles clean.

  DO NOT "optimize" this by deleting earlier. The delegation shim in Phase 7
  is transitional by design and Phase 11 removes it; the end state is
  identical to the spec's pass-4 description. What the ordering buys is that
  no task ever hands off a red tree, which is what the spec means when it
  says passes 4/5/8 cannot be split across separate MERGES — this is all one
  merge, just ordered so each step is individually verifiable.

  ─────────────────────────────────────────────────────────────────────────
  THE 139-TEST MIGRATION IS PHASE 10, AND IT HAS A TRAP
  ─────────────────────────────────────────────────────────────────────────
  The migration is MECHANICAL — the mocks (mockGitCloner, mockValidator,
  mockVersionResolver, mockScanner, mockRemediationGenerator,
  mockScannerWithError, mockVersionResolverWithError) are UNCHANGED; only
  their delivery moves from an options literal to a constructor call. One
  shared command-building helper per command type collapses the work.

  THE TRAP: the constructors FAIL CLOSED on nil, so every test that today
  omits a dependency and rides the corresponding `!= nil` skip must be handed
  a PASSING mock during migration. Measured against the current corpus,
  helper-aware (a test counts as supplying a dependency if it sets the field
  itself OR builds its options through a helper that does):

    add_test.go        0 gaps. All 56 tests that call distribution.Add get a
                       validator, because newTestAddOptions (add_test.go:78)
                       sets `Validator: &mockValidator{}` for every caller
                       that does not set one inline. add_test needs NO
                       dependency-supplying edits — only call-site edits.
    update_test.go     6 tests omit Validator, 2 omit VersionResolver.
    upgrade_test.go    0 omit Validator; 4 omit Scanner and the same 4 omit
                       RemediationGenerator.
    install_test.go    9 omit GitCloner (the --cache and local-pack paths
                       that never clone, plus the retirement below).

  That is 25 call sites needing a mock supplied, not a whole-suite sweep.
  DO NOT take these counts on faith — re-derive them before editing, because
  the corpus moves and a helper added since would change them.

  A test that silently starts running validation it never ran before will
  fail for a reason that has nothing to do with what it asserts. Supply the
  permissive mock; never weaken a constructor, and never edit an assertion to
  accommodate newly-running validation — if a test genuinely breaks because
  validation now runs, that is a finding to surface.

  EVERY SPEC-015-MANDATED TEST NAME MUST SURVIVE VERBATIM. 62 of SPEC-015's
  100 mandated names live in these six files (verified against the current
  corpus: 100 names in SPEC-015, 139 test funcs across the six suites, 62 in
  the intersection). BUNDLE-006 forbids rewriting SPEC-015's historical
  `REQ-021@1.0.0` pin, and renaming a mandated test severs the same
  claim-to-test lineage just as effectively. Change call sites and assembly
  ONLY — never a `func TestX` identifier, never a merge of two tests, never
  a "tidy". CLM-100 asserts this mechanically and its test MUST read the
  names FROM specs/SPEC-015-pack-distribution.spec.md, not from a hardcoded
  list that would drift (spec Review Question 12).

  EXACTLY THREE TESTS ARE RETIRED, NOT MIGRATED — and they are all the same
  failure class, so recognize the shape rather than memorizing the list:
  A TEST WHOSE PREMISE IS AN ABSENT DEPENDENCY HAS NO MIGRATED FORM ONCE THE
  CONSTRUCTOR MAKES THAT ABSENCE UNREPRESENTABLE. Each asserts a runtime
  guard TASK-050 deletes; each is verified NOT among SPEC-015's 100 mandated
  names, so no claim lineage is stranded; and each has its property fully
  subsumed by a constructor claim this plan adds.

    1. TestInstallContractsLocalPackWithValidator_RunsCheckPhases
       (contracts_provisioning_test.go:224) — asserts that SUPPLYING a
       validator makes the check/test phases run, a distinction that exists
       only because a nil validator skipped them. REQ-008 removes the skip,
       so the subject evaporates. Its `stubValidator`
       (contracts_provisioning_test.go:215-219) goes with it, verified used
       by no other test. Retired in TASK-045.
    2. TestPackInstall_NoGitClonerForGitPack (install_test.go:483-513) —
       builds an InstallOptions with "No GitCloner provided" and asserts the
       install.go:165 nil-cloner guard errors. Subsumed by CLM-037 /
       TestNewInstallCommand_NilGitClonerNamesDependency, which asserts the
       same property EARLIER and with a NAMED dependency. Retired in
       TASK-043.
    3. TestPackUpdate_NoVersionResolver (update_test.go) — builds an
       UpdateOptions with "No VersionResolver provided" and asserts the
       update.go:55 "version resolver required for update" guard. Subsumed
       by CLM-041 / TestNewUpdateCommand_NilVersionResolverNamesDependency.
       Retired in TASK-042.

  CONSEQUENCE FOR THE LINEAGE RATCHET: the before/after `func Test…`
  identifier sets in the SIX SUITES differ by exactly TWO names (#2 in
  install_test.go and #3 in update_test.go); #1 lives in
  contracts_provisioning_test.go, which is not one of the six. CLM-100's
  guard (TASK-041) checks SPEC-015-MANDATED names only, and none of the three
  is mandated, so the ratchet stays green through all three retirements
  without a carve-out in the test itself. The carve-outs are in the TASK-042
  and TASK-043 instructions, so an implementer does not read
  "identical identifier sets" and conclude the retirement is forbidden.

  IF YOU FIND A FOURTH, STOP AND REPORT IT. The edit set is supposed to be
  closed (spec Review Question 11); a fourth means the enumeration missed a
  class, which is worth knowing before it is absorbed silently.

  ─────────────────────────────────────────────────────────────────────────
  HERMETICITY IS A STATED PROPERTY OF THIS SEED — DO NOT LEAK TO THE NETWORK
  ─────────────────────────────────────────────────────────────────────────
  The whole hermetic mechanism is that ExecGitCloner INHERITS the ambient
  git configuration environment rather than clearing it. A test writes a
  temporary gitconfig containing

      [url "<file:///tmp/…/pack-repo.git>"]
          insteadOf = https://github.com/<org>/<pack>.git

  points GIT_CONFIG_GLOBAL at it, and the UNCHANGED production path —
  including add.go:315's hardcoded `https://github.com/<name>.git`
  construction — runs against a local repository, network-free. This is
  load-bearing BEHAVIOR, not an oversight (Sharp Edge). Do not add an
  env-sanitizing "hygiene" step to the cloner; it would silently turn every
  hermetic test into a network call or a failure without any test going red
  for the right reason.

  `cmd/backstop/coverage_cli_test.go:97-108` TestCLI_PackAdd_NonexistentPack
  is the one existing test that BECOMES a live network call the moment the
  real cloner is wired (today it survives on `defer func(){ recover() }()`
  catching the nil-cloner panic). It MUST be retargeted through the
  insteadOf redirect in the same task that wires production, with the
  `recover` dropped — there is no longer a panic to catch. If retargeting
  would merely duplicate CLM-063, DELETE it. Leaving it as-is is a silent
  regression from "hermetic" to "depends on GitHub being reachable and that
  repository staying absent."

  `pack add` is the ONLY one of the four commands so exposed:
  TestCLI_PackUpdate_NonexistentPack and TestCLI_PackUpgrade_NonexistentPack
  hit readPackVersion against a pack-less backstop.yml and error before any
  clone; TestCLI_PackInstall_NoLockfile errors on the absent lock.
  AddCommand.Run has no such precheck.

  ─────────────────────────────────────────────────────────────────────────
  STREAM SEPARATION IS NOT OPTIONAL (REQ-014 / spec Review Question 7)
  ─────────────────────────────────────────────────────────────────────────
  The existing helper `runBackstop` (pack_authoring_loop_test.go:27) returns
  `CombinedOutput` — a MERGED stream. Against it, "prints its diagnostic to
  stderr" passes for a command that printed to stdout, and "stdout holds
  exactly one JSON document" passes for a run that also wrote a human line
  to stderr. EVERY REQ-011 and REQ-012 claim would pass vacuously. This is
  the exact blind spot that let the silent-exit-1 defect survive several
  specs' worth of CLI tests.

  NO claim under REQ-011 or REQ-012 may be driven by runBackstop. Each such
  claim names its driving mechanism in its own text:
    • reportError seam        — the per-site disposition claims (what prints,
                                with which exit code, on a supplied writer)
    • stream-separated runner — every claim asserting on a SPECIFIC stream of
                                a real process
    • direct unit tests       — writeJSONError's kind classification
  runBackstop STAYS in the tree for its existing merged-output callers, which
  legitimately do not care about streams.

  ─────────────────────────────────────────────────────────────────────────
  ANTI-VACUOUS-GREEN GUARDS (the ways this ships dark)
  ─────────────────────────────────────────────────────────────────────────
  1. A MOCK-ONLY green. If every clone in the suite is a mock, this spec
     delivered nothing it exists to deliver (Review Question 3). CLM-001/
     CLM-029/CLM-062 each drive the REAL git binary; CLM-062 drives it
     through the BUILT BINARY.
  2. A HAND-WRITTEN fixture pack that happens to satisfy whatever the
     validator accepts is a mirror, not a fixture. The hermetic pack must be
     PROVEN to pass `pack check` + `pack test` by driving those commands
     against it in the same test (Review Question 5). The INVALID fixture
     must fail for the reason the test claims, not for an unrelated
     structural reason (Review Question 6).
  3. An EXIT-CODE-ONLY assertion. An exit-1-with-no-output failure passes
     `if exitCode != 1`. Every error-surfacing claim asserts on the
     DIAGNOSTIC TEXT, on the correct stream.
  4. A constructor nil test that only asserts "an error occurred" passes
     even when the constructor names the WRONG dependency. Every nil test
     asserts the NAMED dependency appears in the message (Review Question 10).
  5. CLM-030 is LOAD-BEARING and must not be dropped as redundant with the
     AddOptions contract entry. The contracts pack's signature compiler
     reduces any struct to `type AddOptions $$$` (compile-signature.sh's
     leading-token `type ` branch) and NEVER compares field lists — a
     reintroduced GitCloner field would still satisfy the contract. CLM-030's
     source scan is the only thing that actually catches it.

  ─────────────────────────────────────────────────────────────────────────
  ZERO BAKED LANGUAGE/TOOL KNOWLEDGE (the standing invariant)
  ─────────────────────────────────────────────────────────────────────────
  `git` is distribution's TRANSPORT, declared by BUNDLE-006 DD-1 as the
  distribution channel, and is on backstop/self Family A's allowed literal
  list — so `exec.CommandContext(ctx, "git", …)` in gitcloner.go is
  sanctioned. NOTHING ELSE is. No linter name, no rule name, no file
  extension branch, no language token may appear in any file this plan
  touches. Family B2 (no-baked-language-token) is GLOBAL and applies to
  _test.go and testdata/*.go too, so a fixture pack must not carry a
  ".ts"/"package.json"/"tsconfig.json"-class token in any Go source that
  names it. Every fixture's tool/rule/target is DECLARED DATA read from the
  pack manifest.

  ─────────────────────────────────────────────────────────────────────────
  WHAT THIS PLAN DOES *NOT* DELIVER (do not widen scope to "make it work")
  ─────────────────────────────────────────────────────────────────────────
  • A GREEN remote add → install round trip. `pack add` copies the clone
    INCLUDING its root `.git` and ComputeContentHash hashes it, so two
    clones of the same tag produce different hashes (reflog timestamps
    alone). CLM-065 claims a LOUD, READABLE hash mismatch naming both
    hashes — that is the correct outcome here. Fixing the hash is bundle
    REQ-021@1.1.0, a later seed. Do not "fix" it by excluding .git.
  • The violation scanner or the remediation bundle generator. Those are
    bundle REQ-014/REQ-018 and this spec deliberately does not pin them.
    Production wires explicit implementations that RETURN
    *CapabilityUnavailableError. `pack upgrade` therefore gets LOUDER, not
    better: it fails where it used to report a successful major upgrade with
    zero baselined violations. Any existing test asserting `pack upgrade`
    succeeds must be RE-EXAMINED, not patched to expect success.
  • `pack relock`'s argument shape (ISSUE-074's underlying defect). Phase 3
    makes relock PRINT its real error instead of nothing; relock still takes
    a filesystem PATH while every sibling takes a NAME. That is the
    content-identity seed's work.
  • RealGitExecutor in pkg/scaffold. It is NOT reusable (ListTags(pattern)
    runs `git tag -l` against the LOCAL repo, a different operation; no
    Clone at all) and this plan does not modify it.

phases:
  # ═══════════════════════════════════════════════════════════════════════
  # Phase 1: Hermetic substrate — fixture pack sources + real-git harnesses
  # ═══════════════════════════════════════════════════════════════════════
  - id: phase-1
    name: "Phase 1: Hermetic substrate — the fixture pack sources and the real-git test harnesses (setup only)"
    tasks:
      - id: TASK-001
        type: setup
        title: "Author the hermetic VALID pack fixture source that genuinely passes pack check and pack test"
        description: |
          Create cmd/backstop/testdata/hermetic-remote/valid-pack/ — an
          ordinary, complete enforcement pack SOURCE. Later phases turn this
          directory into a real tagged git repository at test time; it is not
          itself a repository and carries no .git.

            - pack.yml — name, version 1.0.0, and a `content:` and/or
              `engines:` block sufficient for pack check phase 1's
              "content is required" assertion (pkg/packval/phase1.go:45).
            - whatever rule + paired fixture files the pack's declared
              content requires so `pack test`'s fixture phase passes.

          THIS FIXTURE IS PROVEN, NOT ASSERTED. The spec's Review Question 5
          is explicit: a pack hand-written to satisfy whatever the validator
          happened to accept cannot falsify anything. TASK-018/TASK-030
          therefore drive `pack check` + `pack test` against THIS directory
          inside the same test that uses it. Author it, then RUN
          `./bin/backstop pack check cmd/backstop/testdata/hermetic-remote/valid-pack`
          and `./bin/backstop pack test …` yourself and iterate until both
          exit 0. Record nothing; the proof is the passing command, and the
          test re-proves it on every run.

          NEUTRAL CONTENT REQUIRED: backstop/self Family B2
          (no-baked-language-token) is GLOBAL and blocking, and it matches
          whole tokens in ANY .go file including testdata. The Go sources
          that name these paths must therefore not carry a foreign-language
          token, so keep the pack's declared globs/extensions off the B2
          list. The pack's tool and rule names are DECLARED DATA in pack.yml,
          never literals in core source.

          These are DATA. No Go source is added by this task.
        files:
          - cmd/backstop/testdata/hermetic-remote/valid-pack/pack.yml
          - cmd/backstop/testdata/hermetic-remote/valid-pack/README.md
        claims:
          - CLM-062
          - CLM-064
          - CLM-066
        depends_on: []

      - id: TASK-002
        type: setup
        title: "Author the hermetic INVALID pack fixture source that fails validation for a NAMED, asserted reason"
        description: |
          Create cmd/backstop/testdata/hermetic-remote/invalid-pack/ — a pack
          SOURCE that genuinely FAILS `pack check` (and, in a second
          sub-fixture, genuinely fails `pack test`'s fixture phase).

          THE FAILURE REASON IS PART OF THE FIXTURE. Review Question 6: a
          pack that fails for an UNRELATED structural reason would pass the
          assertion while proving nothing about whether the validator is
          wired. So:
            - invalid-pack/pack.yml must parse far enough to REACH the
              validation phase under test and fail THERE, with a diagnostic
              whose text the consuming tests (CLM-016, CLM-055) assert on.
            - fixture-fail-pack/ is the second source: it passes `pack check`
              but FAILS `pack test`'s fixture phase, so CLM-018 can
              distinguish the two modes. If a pack that passes check but
              fails fixtures cannot be constructed, say so in the task
              handoff rather than reusing invalid-pack — a fixture that
              fails both makes CLM-018 indistinguishable from CLM-016.

          Verify by running `./bin/backstop pack check` and
          `./bin/backstop pack test` against each directory and reading the
          actual message; the consuming tests assert against THAT text.

          These are DATA. No Go source is added by this task.
        files:
          - cmd/backstop/testdata/hermetic-remote/invalid-pack/pack.yml
          - cmd/backstop/testdata/hermetic-remote/fixture-fail-pack/pack.yml
        claims:
          - CLM-016
          - CLM-018
          - CLM-055
        depends_on: []

      - id: TASK-003
        type: setup
        title: "Build the pkg/pack/distribution real-git test harness: tagged repos, peeled refs, and a fake git binary"
        description: |
          Create pkg/pack/distribution/hermetic_git_test.go — package
          distribution_test helper source with NO `func Test…` in it. It is
          the substrate the ExecGitCloner and TagVersionResolver suites drive.

          Provide (names are the plan's, adjust only for collisions):
            - newTaggedRepo(t, spec) — creates a real git repository in
              t.TempDir() by invoking the real git binary: init, commit a
              small pack tree, tag it, optionally add LATER commits past the
              tag (CLM-002 needs a tag that is not HEAD), optionally create
              ANNOTATED tags so `ls-remote` emits peeled `^{}` entries
              (CLM-003 needs them to actually appear — a lightweight-tags-only
              repo makes the peeled-ref filter untestable and CLM-003 passes
              vacuously). Returns the repo path and a file:// URL.
            - withGitConfigRedirect(t, from, to) — writes a temporary
              gitconfig containing a `url.<to>.insteadOf = <from>` rewrite
              and points GIT_CONFIG_GLOBAL at it for the test's lifetime via
              t.Setenv. This is how the production URL is redirected WITHOUT
              a rewriting seam in production code.
            - newFakeGitBinary(t, behavior) — writes a tiny executable script
              into a temp dir for the diagnostics that need a git that HANGS
              (CLM-013's timeout) or that is ABSENT (CLM-012 points
              ExecGitCloner.GitBinary at a nonexistent path — do NOT mutate
              the test process's PATH; the GitBinary field exists precisely
              so that is unnecessary).
            - t.Skip with a clear message if the git binary is unavailable,
              so the suite degrades honestly rather than failing opaquely.

          BAKED-LITERAL NOTE: `git` and `sh`//bin/sh are on backstop/self
          Family A's allowed exec literal list, so invoking them here is
          sanctioned. Nothing else may be a literal tool name.

          NETWORK: every repository this helper creates is local. No helper
          in this file may reach a remote host.
        files:
          - pkg/pack/distribution/hermetic_git_test.go
        claims:
          - CLM-002
          - CLM-003
          - CLM-012
          - CLM-013
        depends_on: []

      - id: TASK-004
        type: setup
        title: "Build the cmd/backstop hermetic remote harness: fixture-pack repo, insteadOf redirect, built binary"
        description: |
          Create cmd/backstop/hermetic_remote_harness_test.go — package main
          helper source with NO `func Test…` in it. It is the substrate every
          end-to-end remote claim drives (CLM-055, CLM-060, CLM-062..066),
          and per SPEC-055 it is also the substrate BUNDLE-006 REQ-042's
          parity suite EXTENDS rather than rebuilds. Design it for that
          reuse: one entry point, options-shaped, no per-claim special cases.

          Provide:
            - newHermeticRemote(t, packSourceDir, tags...) — copies the given
              fixture pack SOURCE (TASK-001 / TASK-002) into a fresh
              t.TempDir(), git-inits it, commits, and creates the requested
              tags. For the multi-tag case (CLM-066's newer compatible
              version) it commits a version bump between tags so the two tags
              differ in content.
            - redirectPackURL(t, org, name, repoPath) — writes the temporary
              gitconfig with
              `url.<file://repoPath>.insteadOf = https://github.com/<org>/<name>.git`
              and t.Setenv's GIT_CONFIG_GLOBAL. The org/name pair must match
              what distribution's resolveGitURL (add.go:315) constructs for
              the pack ref the test passes, or the redirect silently misses
              and the test reaches the network.
            - newConsumerProject(t) — a temp project root with a backstop.yml
              the lifecycle commands can read/write.
            - The harness must PROPAGATE GIT_CONFIG_GLOBAL into the child
              process it runs the built binary with. This is the single
              easiest thing to get wrong: t.Setenv only affects the TEST
              process, and if the runner builds a scrubbed env the child git
              ignores the redirect and clones from GitHub. Assert the
              redirect took effect (e.g. the clone succeeded against a repo
              that cannot exist upstream) rather than trusting it.

          Reuse the existing buildBackstopBinary helper
          (pack_authoring_loop_test.go:15) so the tests drive the EXACT
          command wiring shipped to consumers. Do NOT add a second binary
          builder.

          t.Skip with a clear message when git is unavailable.
        files:
          - cmd/backstop/hermetic_remote_harness_test.go
        claims:
          - CLM-062
          - CLM-063
          - CLM-065
        depends_on: []

