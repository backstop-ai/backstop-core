      - id: TASK-050
        type: refactor
        title: "Move the pipelines into the methods, delete the free functions, strip the options, remove every nil guard"
        description: |
          THE CLOSING MOVE. By now NOTHING calls the free functions —
          cmd/backstop went through the constructors in Phase 8, the six
          suites in Phase 10, and the two helpers in Phases 8 and 10. So this
          deletion compiles clean. If it does not, a call site was missed:
          find it, do not reinstate the function.

          1. MOVE the four pipeline bodies out of the package-level Add /
             Install / Update / Upgrade functions and INTO the corresponding
             Run methods on command.go, reading dependencies from the
             RECEIVER instead of from the options value. DELETE the free
             functions and the transitional delegation shims TASK-027 added.

          2. STRIP every dependency-typed field from the four options
             structs, leaving only the non-dependency knobs:
                 AddOptions     { ProjectDir; Version }
                 InstallOptions { ProjectDir; CachePath; LocalPackDir }
                 UpdateOptions  { ProjectDir; Acknowledge }
                 UpgradeOptions { ProjectDir }
             LocalPackDir stays (a source override for local packs, not a
             dependency) and Acknowledge stays (the consumer's
             tamper-acknowledgment flag, bundle REQ-013).

          3. REMOVE EVERY NIL GUARD the constructors made unreachable:
             • add.go:160 `if opts.Validator != nil` — validation becomes
               UNCONDITIONAL and runs BEFORE any copy into the consumer
               project. This single change delivers validate-before-install
               for BOTH add and upgrade (REQ-008 pins bundle REQ-002 and
               REQ-015 together).
             • upgrade.go:64 — the same guard, same removal.
             • install.go:165 — the nil-cloner guard and its DIAGNOSTIC-FREE
               error. This is the silent-exit-1 that is harder to act on than
               a panic because there is nothing to read. The cloner is
               present by construction now.
             • update.go:55 — the runtime "version resolver required for
               update" check, a fail-closed guard on an optional field the
               constructor now enforces structurally.
             • upgrade.go — `if opts.Scanner != nil` and
               `if len(violations) > 0 && opts.RemediationGenerator != nil`.
               Their current effect is a VACUOUS SUCCESS: with both nil,
               pack upgrade skips the scan, generates no remediation bundle,
               installs the new major version, and reports success with zero
               baselined violations.

          4. MOVE THE VIOLATION SCAN AHEAD OF THE TOOL-CONFIG MERGE in
             UpgradeCommand.Run, so an unavailable capability fails BEFORE
             any consumer state is mutated (tool config, provenance,
             installed content, backstop.yml, backstop.lock). CLM-059 is the
             assertion that would fail if the two were swapped back.
             Propagate *CapabilityUnavailableError UNCHANGED — do not wrap it
             into opaque text.

          NO INTERNAL DEFAULTS. Nothing in this package may call
          NewExecGitCloner, NewPackvalValidator, or NewTagVersionResolver to
          fill a dependency a caller failed to supply (CLM-031). If a code
          path seems to need one, the caller is wrong, not the rule.

          EXPECT `pack upgrade` TO GET LOUDER. It now fails where it used to
          report a successful major upgrade with zero baselined violations.
          That is correct. Any existing test asserting `pack upgrade`
          succeeds must be RE-EXAMINED, not patched to expect success.
