      - id: TASK-016
        type: implementation
        title: "Implement pkg/pack/distribution/gitcloner.go — the production GitCloner"
        description: |
          Create pkg/pack/distribution/gitcloner.go with exactly the declared
          contract surface:

            - type ExecGitCloner struct { GitBinary string; Timeout time.Duration }
              GitBinary empty means "git" resolved from PATH; it exists so
              CLM-012 is testable without mutating the test process's PATH.
              Timeout bounds ONE invocation so a hung remote cannot wedge CI.
              Neither field is a "dependency" in the DD-30 sense — this type
              IS the concrete production implementation, and REQ-005 forbids
              distribution SYNTHESIZING a GitCloner where none was supplied,
              not a concrete implementation carrying its own tunables.
            - func NewExecGitCloner() *ExecGitCloner — package default
              timeout, and DELIBERATELY NO PATH PROBE (CLM-009).
            - func (c *ExecGitCloner) Clone(url, version, destDir string) error
            - func (c *ExecGitCloner) ListTags(url string) ([]string, error)

          Clone: shallow, single-ref clone of the EXACT requested tag into
          destDir. The Add/Install/Update/Upgrade pipelines already create
          destDir via os.MkdirTemp, so it is empty and git accepts it.

          ListTags: lists the REMOTE repository's tags and returns BARE names
          with peeled `^{}` entries EXCLUDED. The exclusion belongs HERE,
          where the ref shape is known, not in the resolver — the resolver's
          strict-semver filter would hide the bug today and a future
          relaxation of the version pattern would let duplicates through
          (Sharp Edge). This is also why pkg/scaffold's
          RealGitExecutor.ListTags(pattern) is NOT reusable: it runs
          `git tag -l` against the LOCAL repo, a different operation with a
          different argument meaning, and has no Clone at all. Do not modify
          pkg/scaffold.

          BOTH methods must:
            • Reject a url or ref beginning with `-` BEFORE invoking git, and
              pass url and ref after a `--` separator so neither can be read
              as a git option.
            • Force git NON-INTERACTIVE so a credential or host-key prompt
              can never block the process.
            • INHERIT the ambient environment (append to os.Environ(); never
              replace it). This is what makes GIT_CONFIG_GLOBAL insteadOf
              redirection work and what keeps a consumer's already-configured
              credential helper working. A future "hygiene" change that
              clears the environment silently converts every hermetic test
              into a network call — the inheritance is LOAD-BEARING
              BEHAVIOR, so say so in the doc comment.
            • Bound the invocation with context.WithTimeout +
              exec.CommandContext.
            • Wrap EVERY failure in *GitError naming the operation, the URL,
              the ref where one applies, and the captured stderr. No path may
              panic, return a bare exit status, or report an empty tag list
              where the git command failed.

          `git` is on backstop/self Family A's allowed exec-literal list
          (BUNDLE-006 DD-1 declares git the distribution channel). NOTHING
          ELSE in this file may be a tool, language, or platform literal.
        files:
          - pkg/pack/distribution/gitcloner.go
        claims:
