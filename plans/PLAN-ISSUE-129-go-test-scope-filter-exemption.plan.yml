  ── ROOT CAUSE (already pinned by the issue; do NOT re-diagnose) ────────────
  The `go-toolchain` pack's `go-test` findings engine DOES run `go test ./...`
  project-wide and DOES convert real failures to SARIF via `scripts/test-to-sarif.sh`.
  The finding is computed correctly, then DISCARDED. `cmd/backstop/pack_gate.go`
  stamps every bridged violation's `ProjectWide` field from
  `binding.ExemptFromScopeFilter` (SPEC-041's declared exemption mechanism).
  `go-build` declares `exempt_from_scope_filter: true` (pack.yml:73), so an
  out-of-scope build break still REDs a diff-scoped gate. `go-test` declares no such
  flag and so defaults false — `pkg/gate/scope.go` `filterViolations` keeps a
  violation only when `ProjectWide` is true OR `scope.Contains(violation.File)`, and
  for an out-of-diff test failure neither holds.

  `backstop gate --all` is NOT affected (filterViolations short-circuits for
  GateScopeModeAll) and MUST NOT change behavior.

  ── THE RULING (team-lead, founder-equivalent, made 2026-08-15) ─────────────
  Declare `go-test` `exempt_from_scope_filter: true`, matching `go-build`'s existing
  precedent EXACTLY. Basis: the issue's own Direction §1 tradeoff, concluding that
  "Go compilation-level whole-module reasoning (why `go-build` is exempt) applies
  just as much to a whole-module test suite where cross-package references are
  common," and that a failing test is a binary "the code is broken" signal with no
  soft failure mode (unlike a lint severity gradient).

  The narrower alternative in Direction §1 — a baseline-compare mechanism
  distinguishing "already red before the diff" from "this diff caused it" — is
  EXPLICITLY NOT the path being taken. Do not design it, do not partially build it.

  Direction §2 (audit every OTHER findings engine lacking the flag, so no future
  pack engine reintroduces the gap silently) is DEFERRED — file it as a follow-on
  issue rather than absorbing it here. The existing engine-by-engine intent matrix
  (`cmd/backstop/testdata/exempt-matrix-bindings.yml` + the SPEC-041 CLM-011..019
  exemption tests) already asserts intent for the go-toolchain engines; generalizing
  that to "every declared engine of every installed pack must carry an explicit
  intent record" is a real design question with real maintenance cost, not a
  free rider on this fix.

