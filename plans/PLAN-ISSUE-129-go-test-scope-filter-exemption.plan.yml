        type: implementation
        title: "Flip the in-repo fixture pack's go-test binding and correct the exempt-matrix documentation"
        description: |
          This is the edit that turns Phase 2 green. It is a DATA edit: no `.go`
          production file may be touched by this task.

          1. In
             `cmd/backstop/testdata/go-toolchain/.backstop/packs/backstop/go-toolchain/pack.yml`
             — the fixture copy that `goToolchainPackRoot`/`goToolchainManifest`
             actually parse, and therefore the file every SPEC-041 exemption test
             reads — add `exempt_from_scope_filter: true` to the `go-test:` binding
             (currently at line 77), byte-for-byte consistent with what TASK-001
             released. Carry the same rationale comment. Nothing else changes; in
             particular `golangci` stays non-exempt.
          2. In `cmd/backstop/testdata/exempt-matrix-bindings.yml`, update the
             `go-test:` entry to `exempt_from_scope_filter: true` AND update the
