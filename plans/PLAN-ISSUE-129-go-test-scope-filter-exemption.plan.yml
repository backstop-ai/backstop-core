          repo; the explicit `artifact validate` calls confirm the artifact side of
          this change (the amended SPEC-041 and this plan) independently. Coordinate
          before running if other agents are mid-flight in the worktree.

          Read every result. Then confirm the END STATE the issue actually asked for,
          rather than asserting it:
