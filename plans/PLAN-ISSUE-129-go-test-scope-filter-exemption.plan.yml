          and record the exact failing output in the implementation record. If it
          passes on first run, the fixture declaration was already flipped or the
          test is not driving the real path — STOP and investigate; do not proceed.
        files:
          - cmd/backstop/pack_gate_issue129_regression_test.go
        claims:
          - CLM-002
          - CLM-003
          - CLM-005
        test_names:
