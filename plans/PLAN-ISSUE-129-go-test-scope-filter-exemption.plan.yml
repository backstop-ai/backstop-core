      - id: TASK-003
        type: test
        title: "Carry SPEC-041's amended CLM-015 rename and re-ground the CLM-011/CLM-017 decoupling proof"
        description: |
          PRECONDITION — CONFIRM, DO NOT AUTHOR. SPEC-041 must ALREADY carry the
