      - id: TASK-007
        type: implementation
        title: "GREEN: doctor.go (types, id constants, registry, gathering, renderers, exit), the four setup checks, and the root wiring"
        description: |
          Three files, one coherent unit — they are written together because
          the types live in doctor.go and the checks that return them live in
          doctor_checks.go, so neither compiles alone.

          cmd/backstop/doctor.go
            • const block — the ONE id source (doctorCheckConfigPresent,
              doctorCheckConfigLoads, doctorCheckGitRepository,
              doctorCheckPacksInstalled, doctorCheckBuildIdentity,
              doctorCheckToolchainRuns, doctorCheckArtifactLayout). Declare
              ALL SEVEN NOW even though three have no entry yet: the
              constants are the id source REQ-004 and CLM-059 key on, and
              declaring them late would invite a literal in the meantime.
            • type doctorCheck struct { ID, Title string; Run func(ctx
              doctorContext) doctorResult }
            • type doctorResult struct with the json tags EXACTLY as the
              contract states — id/title/status/message/remediation, and
              remediation carries NO omitempty (Review Question 12).
            • func doctorRegistry() []doctorCheck — a SLICE literal, in
              report order, holding the FOUR setup checks in this phase:
              config-present, config-loads, git-repository, packs-installed.
              Setup checks come first permanently, so a reader sees why a
              later check skipped before reading the skip.
            • func doctorGuidance(checkID string) (string, bool) — a keyed
              single-id lookup returning the printable
              `backstop doctor --check <id>` text, or ("", false). It must
              NOT range over the registry (CLM-058: exactly one enumeration,
              and it is runDoctor's).
            • func runDoctor(cmd *cobra.Command, jsonFlag *bool, args
              []string) error — gathers ONE doctorContext, enumerates the
              registry ONCE, renders, and returns
              *ExitCodeError{Code: ExitViolations} iff any status is fail.
              NO branch returns ExitConfigError. The gathering mirrors
              runGate's project-root fallback (gate.go:75-80) and INVERTS
              its config handling (gate.go:67-73): errors are carried on the
              context, never raised (constant L).
            • func newDoctorCommand(jsonFlag *bool) *cobra.Command — takes
              the ROOT persistent flag by pointer (constant M) and declares
              exactly one flag of its own, `--check`. Selection FILTERS the
              registry by id before running; an unknown id is an error
              listing the registered ids, never an empty successful run.
            • both renderers, consuming the same []doctorResult.

          cmd/backstop/doctor_checks.go
            • type doctorContext struct { ProjectRoot, SearchDir,
              ConfigPath string; ConfigPathErr error; Config *config.Config;
              ConfigErr error; Packs []*pack.Manifest; PacksErr error;
              Runner check.CommandRunner }
            • checkConfigPresent / checkConfigLoads / checkGitRepository /
              checkPacksInstalled. NONE of them calls a loader (constant L).
              git detection goes through
              `(&check.DefaultGitExecutor{Dir: ctx.ProjectRoot}).IsGitRepo()`
              — the existing exported detector, not a fourth `git rev-parse`
              shell-out. packs-installed reads the empty-slice-vs-error
              split documented in constant H.
            • the SKIP rule: a check whose input could not be gathered is
              SKIPPED with the OWNING check named in its message. One
              condition, one owner.

          cmd/backstop/root.go
