            the BRIEF for that agent, not text to paste into the file.

          WHY THIS TASK EXISTS. TASK-012 was rewritten under a founder
          ruling: `checkToolchainRuns` CONSUMES the shared
          `packEntrypointProber` instead of reimplementing
          `checkEngineToolAllowed → splitCommand → CommandRunner` inline.
          SPEC-070's own text was never updated to match, so the spec now
          describes an implementation this plan forbids — and the gate will
          not catch the divergence:

            • VERIFIED 2026-08-14 — `pkg/validate/contracts.go`'s
              `validateConsumesItem` validates only that a consumes entry
              has source/name/kind. It never checks whether the named symbol
              is actually called by the declaring file. A `consumes:` entry
              naming a function the file no longer calls is structurally
              valid and passes the contracts dimension.
            • So this drift ships SILENTLY unless a task removes it. That is
              the "align predating artifacts — update via agents, openly"
              convention: a stale spec that survives the work it described is
              a defect, not a cosmetic mismatch.

          THE FIVE PROSE OCCURRENCES, located in SPEC-070 v1.1.1 (line
          numbers are a 2026-08-14 reading and will move — locate by TEXT):

            ~650  the `checkToolchainRuns` contract `notes:` — "then runs
                  each through checkEngineToolAllowed + splitCommand + the
                  shared CommandRunner — the same three steps
                  runFindingsEngine takes (pack_gate.go:573) minus the SARIF
                  parse, so there is no second execution path to audit"
            ~824  Implementation preamble — "the package that already holds
                  loadInstalledPacks, checkEngineToolAllowed, splitCommand,
                  and the command wiring"
            ~883  Implementation §, checkToolchainRuns — "walks the gathered
                  manifests, selects every engine binding whose GateType is
                  … and for each: applies checkEngineToolAllowed, splits the
                  declared command with splitCommand, and executes it once
                  from the project root through the shared runner"
            ~997  Sharp Edges — "It is bounded to the gate's own path —
                  checkEngineToolAllowed, splitCommand, the shared runner,
                  no shell"
            ~1262 References — "runFindingsEngine (the three execution steps
                  toolchain-runs reuses without the SARIF parse),
                  checkEngineToolAllowed, and splitCommand"

          WHAT THE AMENDMENT MUST DO:

            (1) In `doctor_checks.go`'s `contracts.consumes:` block, DROP
