          The expected surface is recorded in this plan's constant N,
          re-read from PLAN-SPEC-069's revised TASK-042 on 2026-08-14 — a
          citation of a sibling PLAN, not a fact. If the file is absent, or
          if `Probe` no longer returns `[]entrypointProbe`, or if the
          outcome constants have moved, STOP and report the block. Do NOT
          write a local copy of the three execution steps "temporarily":
          that duplicate is the defect this rewrite exists to remove.

          WHY THIS IS A CROSS-PLAN DEPENDENCY AT ALL (the founder ruling):
          an earlier revision of this task reimplemented
          `checkEngineToolAllowed → splitCommand → shared CommandRunner`
          inline — the exact three steps PLAN-SPEC-069's phase 14 already
          builds for init's toolchain step. Two implementations of one
          execution route drift; the runner-method question below is proof
          they had already started to. Doctor CALLS the shared helper.

          SPEC CONGRUENCE, stated because the wording differs. SPEC-070's
          contract note for `checkToolchainRuns` reads "runs each through
          checkEngineToolAllowed + splitCommand + the shared CommandRunner —
          the same three steps runFindingsEngine takes ... so there is no
          second execution path to audit", and REQ-006 requires execution to
          go "through the SAME trusted-tool allowlist check and
          command-splitting path the gate's engine dispatch uses ... doctor
          must not introduce a second, weaker way to run pack-declared
          commands". Calling those three steps THROUGH the shared prober
          satisfies both more strictly than inlining them would: the three
          steps still happen, in that order, and the count of execution
          paths to audit goes from two to ONE rather than staying at two.
          The contract's `checkToolchainRuns` SIGNATURE is unchanged; only
          its body is a call instead of a loop.

          ★ BUT SPEC-070's TEXT IS NOW STALE, AND TASK-028 FIXES IT — DO NOT
            RE-INLINE THE STEPS TO MATCH THE SPEC. An earlier revision of
            this task hedged that "nothing in SPEC-070's frontmatter needs
            an edit" and that the contracts gate might read the
            `checkEngineToolAllowed` / `splitCommand` `consumes:` entries as
            direct call-site obligations. Both halves were checked
            empirically on 2026-08-14 and both are now settled:

              • The spec IS stale. SPEC-070 v1.1.1 still describes those two
                symbols as things `checkToolchainRuns` calls directly, in
                five prose places and in `doctor_checks.go`'s `consumes:`
                block. This task FORBIDS both symbols from that file.
              • The gate will NOT catch it. `pkg/validate/contracts.go`'s
                `validateConsumesItem` checks only the structural SHAPE of a
                consumes entry (source/name/kind present) — it never
                verifies the named function is actually called. So the drift
                ships silently and becomes exactly the stale predating
                artifact this repo's own convention exists to prevent.

            TASK-028 in this phase dispatches that spec amendment. When you
