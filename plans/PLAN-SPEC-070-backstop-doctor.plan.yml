        description: |
          ★ PRECONDITION — VERIFY BEFORE WRITING A LINE ★
          This task CONSUMES the shared toolchain execution helper
          PLAN-SPEC-069 phase 14 builds (its TASK-042, verified by its
          TASK-043). Confirm in COMPILED CODE, not in the sibling plan's
