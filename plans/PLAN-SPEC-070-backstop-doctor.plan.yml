            and has no notion that `.backstop/` is canonical.
          TestDoctorLayout_ConfiguredRootMissingFromDiskFails (CLM-049) —
            FAIL naming the declared value.
          TestDoctorLayout_InvalidRootDeclarationFailsNamingTheReason
            (CLM-050) — FAIL naming the reason, DISTINCTLY from the missing
            case. Distinguish by TYPE (*artifact.RootMissingError vs
            *artifact.RootInvalidError), never by string match — assert the
            two produce different messages so a single collapsed branch
