            (2) CONSTRUCT AND CALL, ONCE:

                  probes := (&packEntrypointProber{
                      Packs:  ctx.Packs,
                      Runner: ctx.Runner,
                  }).Probe(cmd context)

                `Probe` takes a `context.Context` and NO projectRoot — the
                working directory is a construction-time property of
                `check.ExecCommandRunner{Dir: …}` (pkg/check/runner.go:28-30),
                so `ctx.Runner` must already be rooted at ctx.ProjectRoot.
                TASK-007 gathers it that way; confirm it rather than adding
                a second rooting mechanism here.

            (3) ROLL UP to ONE doctorResult (constant B): one line per
                `entrypointProbe` inside the single message, Status = the
                WORST outcome among them (fail > warn > pass). It returns
                ONE result, not one per entrypoint, and registers ONE check
                — CLM-009 is the guard.

                Per-entrypoint line content, from the probe's own fields:
                  entrypointPassed        → outcome (a): PASS, naming
                    `PackName` and `Command` (CLM-031).
                  entrypointUnstartable   → outcome (b): FAIL, classified as
                    SETUP THE CONSUMER STILL OWES, naming the pack and
                    pointing at THAT PACK's own documented install steps.
                    Install nothing, invent no install command (CLM-032).
                  entrypointExitedNonZero → outcome (c): FAIL, reporting
                    `ExitCode` and `Output` VERBATIM, attributed to
                    `PackName` and `Command` and to NOTHING ELSE. Infer no
                    cause — the pnpm ERR_PNPM_IGNORED_BUILDS evidence is a
                    nonzero exit whose obvious reading was wrong, so a
                    nonzero exit is NEVER reclassified as owed setup even
                    when it looks like a missing dependency (CLM-033).
                  entrypointRefused       → FAIL for this check, carrying
                    `Err`. Note the deliberate asymmetry: init surfaces this
                    SAME value as a CONFIG ERROR. That divergence is why
                    `Probe` returns no `error` and leaves disposition to the
                    caller — do not "fix" it in either direction (CLM-037).

            (4) An EMPTY probe slice with a successfully gathered pack set
                is outcome (d) — WARN, stating that no installed pack
                declares a toolchain entrypoint, never a silent pass
                (CLM-034). The prober deliberately does not decide absence;
                this is the caller's call and doctor's answer is WARN.

