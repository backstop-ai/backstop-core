        description: |
          ★ ID NOTE: numbered TASK-027 because it was ADDED to phase 5 after
            the plan was numbered. It runs in phase 5, parallel-eligible
            with TASK-017 (disjoint files, no dependency between them).

          ★ PRECONDITION: the same one TASK-017 states. Do not author until
