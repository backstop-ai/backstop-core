        title: "AMEND SPEC-070: retire the inline-execution language the prober rewrite obsoleted, via the spec-author track"
        description: |
          ★ ID NOTE: numbered TASK-028 because it was ADDED to phase 3 after
            the plan was numbered. Ids are unique labels, not positions.

          ★ THIS IS AN ARTIFACT-TRACK TASK, NOT A CODE TASK. It edits no
            `.go` file. Per this repository's standing rule, artifacts are
            NEVER hand-edited — route the change through the spec-author
            agent (`/spec`, targeting SPEC-070), the same way every other
