        description: |
          cmd/backstop/doctor_checks.go — add checkArtifactLayout(ctx
          doctorContext) doctorResult:

            • `declared` comes from ctx.Config's ArtifactRoot field. A nil
              or failed config yields the EMPTY declaration, which resolves
