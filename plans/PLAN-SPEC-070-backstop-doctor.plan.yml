      - id: TASK-018
        type: test
        title: "RED: layout deviations decided PER KIND against the resolved root, with both remedies offered"
        description: |
          Create cmd/backstop/doctor_layout_test.go. Thirteen mandated
          tests. Every one runs against a staged fixture corpus — neither
          this spec nor SPEC-068 can prove this by dogfood, because
          backstop-core is clean under BOTH the correct per-kind reading and
          the wrong containment reading (measured: 116 issues, 102 plans, 51
          specs, 27 directives, 26 bundles, 18 adrs, zero strays).

          ★ STAGED MEANS `stageDoctorProject(t, "layout-<case>")`, WITH NO
            NEW HELPER. TASK-017 and TASK-027 author every corpus below as a
            `projects/layout-<case>/` template precisely so the harness's
            ONE stager (TASK-002) reaches it. Do not add a second copy
            helper, do not point a test at a path under
            `cmd/backstop/testdata/`, and do not chdir into the template
            tree. If a corpus you need appears to have no staging route,
            that is a TASK-017/TASK-027 defect — STOP and surface it rather
            than reading the corpus in place.

          ★★ THE ZERO-DEVIATION TRIPWIRE, and it is invisible in a diff
             review exactly as TASK-013(c)'s marker-file tripwire is.
             SPEC-068's `FindUngatedArtifacts` SKIPS `testdata` among its
             non-corpus exclusion trees — that exclusion is load-bearing for
             this repository and is not going away. So if a layout corpus is
             read IN PLACE instead of staged into t.TempDir, EVERY case
             returns ZERO deviations, and the SIX absence-asserting tests go
             green — the four asserting an EMPTY deviation set (CLM-043,
             CLM-044, CLM-045, CLM-047) and the two asserting the absence of
             a particular file WITHIN the set (CLM-042, CLM-062) — while the
             deviation-REPORTING tests are the only ones that red. It looks
             like a partially-working implementation, not like a staging bug.

             So: whenever a deviation-expecting case reports ZERO
             deviations, suspect IN-PLACE STAGING FIRST — before suspecting
             the check, the resolver, or the fixture's contents. Confirm the
             corpus path the test actually read is under t.TempDir() and NOT
             under `cmd/backstop/testdata/`. CLM-046's test is where this
             bites hardest: it is the claim this file calls "the one that
             matters most", and an unstaged corpus makes it pass against
             nothing at all.

          TestDoctorLayout_ReportsAgainstResolvedArtifactRoot (CLM-039) —
            declaring a DIFFERENT root changes which files are deviations.
            That change is the proof the check consumes the shared
            resolution.
          TestDoctorLayout_DeviationReportsActualAndExpectedPath (CLM-040) —
            BOTH paths; the expected one IS the UngatedArtifact.ExpectedDir.
          TestDoctorLayout_ClassifiesEveryArtifactSuffix (CLM-041) — all
            seven suffixes, none silently unrecognized. Against
            layout-all-suffixes, where all seven artifacts sit MISPLACED in
            a shared `misc/` directory (TASK-027), assert the deviation set
            holds EXACTLY SEVEN entries whose `Kind` values are the seven
            DISTINCT kinds — a set equality on kinds, not a count alone. A
            classifier that misses one suffix reports six and reds, and it
            reds NAMING the suffix it dropped. This is the assertion that
            makes the claim falsifiable per-suffix: with the seven placed
            CORRECTLY, a perfect classifier and one recognizing nothing both
            report zero and the test proves nothing.
          TestDoctorLayout_BareCapabilityYmlIsNotReportedAndDoctorAddsNoPattern
            (CLM-062) — the near-miss pinned, plus the structural half: no
            filename pattern of doctor's own. Same corpus, same shape as
            CLM-042: assert the bare `capability.yml` is ABSENT FROM a
            deviation set that is non-empty, never that the set is empty.
          TestDoctorLayout_NonArtifactFilesAreNotReported (CLM-042) — reads
            the SAME layout-all-suffixes corpus, whose deviation set is
            non-empty by construction, so assert `README.md` and `notes.txt`
            are ABSENT FROM the set, never that the set is empty.
          TestDoctorLayout_ArtifactsInTheirExpectedDirectoryAreNotDeviations
            (CLM-043) — reads layout-configured-root-clean (TASK-017 item
            3), where the spec sits at `.backstop/specs/` under a declared
            `artifact_root: .backstop` and the set IS empty. This corpus,
            not layout-all-suffixes, is where the in-their-expected-
            directory control lives.
          TestDoctorLayout_AbsentTypeDirectoryIsNotADeviation (CLM-044)
          TestDoctorLayout_EmptyArtifactRootPasses (CLM-045)
          TestDoctorLayout_UnconfiguredRootReportsDotBackstopArtifactsAsDeviations
            (CLM-046) — THE ONE THAT MATTERS MOST. A containment
            implementation passes every other test in this file and reds
            only this one. If an implementer "simplifies" to "outside the
            resolved root", this is the test that catches it (Review
            Question 3). Assert the deviation set is NON-EMPTY and names all
            THREE staged artifacts (the spec, the bundle and the plan under
            `.backstop/`) by path — not merely that the check did not pass.
            A count assertion is what turns the in-place-staging tripwire
            above from advice into a failing test.
          TestDoctorLayout_UnconfiguredRootWithExpectedLayoutPassesWithoutWarning
            (CLM-047) — no warning, because a warn-when-unconfigured rule
            would fire forever in backstop-core and the fix for that must
            never be a special case naming this repository inside core.
          TestDoctorLayout_RemediationOffersBothMoveAndDeclareRoot (CLM-048)
            — BOTH remedies, asserting NEITHER as correct. The choice is the
