        title: "Full gate --all, artifact validate, coverage floor, and the 64-claim sweep"
        description: |
          1. `go build -o bin/backstop ./cmd/backstop`.
          2. `PATH="/Users/bmanson/go/bin:$PATH" ./bin/backstop gate --all`
             — the FULL sweep, not diff-scoped. Read the true exit code.
          3. `PATH="/Users/bmanson/go/bin:$PATH" ./bin/backstop artifact validate`
             — this plan and its spec are artifacts and both were written by
             this work, and TASK-028 AMENDED the spec, so it must validate in
             its amended form.
          4. `go test ./cmd/backstop/... -race -coverprofile=cover.out` and
             confirm cmd/backstop clears the 80% floor this spec declares.
             80 is cmd/backstop's spec-derived floor, not a discount; the
             90 constant is a fallback only.
          5. Enumerate all 64 mandated test names from SPEC-070's claims and
             confirm each EXISTS and PASSES. A name that does not exist is a
             broken promise the status-drift dimension will find later; find
             it here instead.

          FINAL HONESTY CHECKS, none of which any single test covers:
          (a) `./bin/backstop doctor` on backstop-core itself: seven checks
              reported, in declared order, exit code consistent with the
              statuses.
          (b) `./bin/backstop --json doctor` — the ROOT flag position —
              renders JSON (CLM-061's real-world form).
          (c) `git status --short` shows no stray marker files, no staged
              fixture output, no `.backstop/packs` churn.
          (d) Nothing outside cmd/backstop was modified by this plan, and
              INSIDE cmd/backstop nothing owned by a sibling plan was
              modified either: `pack_entrypoint_prober.go` and
              `init_toolchain.go` belong to PLAN-SPEC-069, `version.go` to
              PLAN-SPEC-068. This plan's only sibling-shared edits are the
              one AddCommand line in root.go and the one added function in
              init.go.
          (e) The registry holds exactly seven checks and no stack-policy
              surface was added (bundle REQ-024 stays carved out, ISSUE-121
              still owns the gap).
          (f) ONE EXECUTION ROUTE, repo-wide. `checkEngineToolAllowed`,
              `splitCommand` and any direct runner invocation appear in
              `pack_entrypoint_prober.go` and NOT in `doctor_checks.go`
              (constant N). Confirm too that `backstop doctor` and
              `backstop init` report the SAME captured output for a
              stderr-only entrypoint failure — a divergence there means one
              of them acquired its own runner method, which is exactly the
              drift the shared prober exists to make impossible.
          (g) THE SPEC AGREES WITH THE CODE. TASK-028's amendment is in
              SPEC-070: `doctor_checks.go`'s `consumes:` block names
              `packEntrypointProber` and no longer names
              `checkEngineToolAllowed` or `splitCommand`, the five prose
              occurrences describe consuming the shared prober, and a
              Version History entry records the change. The contracts gate
              cannot assert this — `validateConsumesItem` checks a consumes
              entry's shape only, never whether the symbol is called — so a
              stale spec would sail through every automated dimension above.
              Read it, do not infer it.
          (h) EVERY FIXTURE CORPUS IS STAGED, NONE IS READ IN PLACE. All
              corpora live under `cmd/backstop/testdata/doctor/projects/`
              and reach tests only through `stageDoctorProject` (constant
              G). Grep the doctor test files for any path literal containing
              `testdata/doctor` outside that helper: a hit means some test
              reads a corpus in place, which for the `layout-*` cases yields
              zero deviations and a vacuous green on CLM-046.

          THE BAR: `gate --all` PASS and `artifact validate` PASS, with no
          new blocking violation. Do not waive, do not skip, do not narrow.
