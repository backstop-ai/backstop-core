          cmd/backstop/doctor_checks.go — add checkToolchainRuns(ctx
          doctorContext) doctorResult. It does FOUR things and nothing else:

            (1) SKIP FIRST. If ctx.PacksErr != nil, return SKIPPED naming
                `packs-installed`, BEFORE the prober is even constructed.
                An ungathered pack set must never reach the prober and must
