            every type-directory name off `artifact.LayoutFor(kind)` rather
            than typing it from memory.

          ★ SAME TEMPLATE-ROOT RULE AS TASK-017, and the same reason: both
            corpora below are `projects/layout-<case>/` templates so
            `stageDoctorProject` reaches them. A corpus parked in a
            `testdata/doctor/layout/` sibling is unstageable, would be read
            IN PLACE under `testdata/` — which `FindUngatedArtifacts`
            excludes — and would report zero deviations while looking green
            (constant G).

          (1) layout-all-suffixes/ — one file per kind in the SEVEN-kind
              vocabulary: `.spec.md`, `.plan.yml`, `.adr.md`, `.bundle.md`,
              `.issue.md`, `.directive.md`, `.capability.yml`. All seven are
              enumerated in `files:` below, because CLM-041's "none silently
              unrecognized" is only assertable against a corpus that
              actually contains all seven — a corpus holding a backstop.yml
              and nothing else proves nothing about classification.

              ★ ALL SEVEN SIT MISPLACED, TOGETHER, IN A SHARED `misc/`
                DIRECTORY — NOT in their expected directories. This is the
                whole point of the corpus and it must not be "corrected"
                into a tidy layout. Placed correctly, all seven produce ZERO
                deviations, and doctor's only observable output here IS the
                deviation set — so a classifier that recognizes all seven
                suffixes and one that recognizes NONE of them are
                indistinguishable, and CLM-041's test cannot red on a broken
                classifier. Misplaced, each file yields exactly one
                deviation carrying its `UngatedArtifact.Kind`, so the
                deviation set is SEVEN entries spanning seven distinct
                kinds, and a classifier missing even one suffix (say
                `.directive.md`) yields six and reds. `misc/` is chosen
                because it is not a type directory under any reading of
                `artifact.LayoutFor(kind)`; if the shipped table should ever
                claim that name, pick another non-type directory rather than
                scattering the files.

              It ALSO carries a BARE `capability.yml`, nested one directory
              deeper than the layout expects, which must NOT be reported
              (CLM-062): this repository's own
              capabilities/CAP-001-pack-gate-enforcement/capability.yml has
              exactly that shape and escapes classification only because a
              `.capability.yml` suffix test does not match a bare
              `capability.yml`. Widening the pattern would red this
              repository's own gate on a file neither spec was asked to
              touch. Doctor adds no pattern of its own.

              And it carries NON-artifact files — a `README.md` (markdown,
              but no artifact suffix) and a `notes.txt` — for CLM-042. The
              README is the load-bearing one: a classifier that keyed on
              `.md` rather than on `.spec.md`/`.adr.md`/`.bundle.md`/
              `.issue.md`/`.directive.md` would report it.

              The near-miss and the non-artifact files DO NOT MOVE — only
              the seven correctly-suffixed artifacts are misplaced. So the
              deviation set for this corpus is exactly the seven, and
              CLM-042's and CLM-062's tests read as absences WITHIN a
              non-empty set rather than as an empty set, which is strictly
              stronger: a classifier that reported the README or the bare
              `capability.yml` would push the count past seven.

          (2) layout-nested-artifact/ — an artifact ONE LEVEL BELOW its expected
              directory (`specs/archive/SPEC-001-sample.spec.md`). It IS a
              deviation: the status walk reads type directories with
              os.ReadDir and SKIPS subdirectories
              (pkg/gate/artifact_status.go:379-404), so a nested artifact is
              exactly as ungated as one in the wrong tree. This corpus is
              also where CLM-040's actual-path/expected-path pair and
              CLM-048's both-remedies remediation are read, because it
