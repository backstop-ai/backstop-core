                spec_version accordingly.

          ★ WHAT THIS AMENDMENT MUST NOT DO. It changes NO requirement, NO
            claim, and NO mandated test name. All 64 claims and their test
            names stand exactly as this plan maps them — the behaviour
            SPEC-070 promises is unchanged; only its account of HOW the
