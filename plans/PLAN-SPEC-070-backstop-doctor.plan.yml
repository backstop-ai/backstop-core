          TestDoctor_ExitOneWhenAnyCheckFails (CLM-014) — the missing-pack
            project.
          TestDoctor_UnparseableConfigExitsOneWhereGateExitsTwo (CLM-016) —
            ONE test that runs the SAME staged config-malformed project
            through BOTH commands: assert `gate` exits 2 AND `doctor` exits
            1 with `config-loads` failing and carrying the loader's own
            error text. The claim is about the DIFFERENCE; two separate
            tests would let the gate half rot silently.
          TestDoctor_NoExitConfigErrorPathAndFullRegistryRunsOnAnEmptyDirectory
          (CLM-057) — THREE halves, one per conjunct of the claim, and the
            third is the one a reviewer found missing on the first pass.
            (a) a SOURCE SCAN of the doctor non-test files asserting no
                `ExitConfigError` appears on any doctor path;
            (b) a real run on the no-config/no-packs/no-git project
                asserting EVERY registered check produced a result;
            (c) a SOURCE SCAN of `cmd/backstop/doctor_checks.go` asserting it
                contains NO loader call — no `config.LoadConfig`, no
                `config.LoadConfigFromPath`, no `config.DiscoverConfigPath`,
                no `loadInstalledPacks`. Same shape as the CLM-058/CLM-059
                scans in TASK-004: go/parser over the file, resolve each
                call's callee name, fail on any member of that set.

            WHY (c) EXISTS AND WHY IT IS NOT REDUNDANT. CLM-057 has TWO
            conjuncts: "no doctor code path returns ExitConfigError" AND "no
            check gathers its own input by a route that can abort before the
            registry runs". Halves (a) and (b) only cover the first. A check
            that calls `config.LoadConfig` itself and converts the error into
            its own `fail` result returns no ExitConfigError (so (a) stays
            green) and still produces a result for every check (so (b) stays
            green) — both existing halves pass while the second conjunct is
            violated outright. That is constant L's `consumes:` split and
            Review Question 4's second abort path, and it will read as
            ordinary defensive error handling in review. Only a source scan
            catches it. Half (b) alone would also pass over a command that
            aborted after printing; half (a) alone would pass over a check
            that panicked.

