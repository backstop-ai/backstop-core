          inventing a second style.

          Helpers to provide, and why each is shaped this way:

          (1) stageDoctorProject(t, templateName) string — copy
              cmd/backstop/testdata/doctor/projects/<templateName> into
              t.TempDir(), delete every `.gitkeep` RECURSIVELY, and return
              the temp path. t.Fatalf (NEVER t.Skip) when the template is
              missing: a skip recreates exactly the vacuous green doctor
              exists to prevent.

              ★ RECURSIVELY, not just at the template root. Phase 1's
                `no-config` carries `.gitkeep` at its top level, but phase
                5's `layout-empty-root` carries it at
                `.backstop/.gitkeep` — a resolved artifact root that must
                EXIST and be EMPTY (CLM-045). A top-level-only deletion
                leaves that file in place, the root is no longer empty, and
                CLM-045 asserts against the wrong condition. Walk the staged
                tree and remove every `.gitkeep` you find.

              ★ THIS IS THE ONLY STAGING ROUTE IN THE PLAN, AND
                `testdata/doctor/projects/` IS THE ONLY TEMPLATE ROOT
                (constant G). Every corpus in every phase — the four
                config-shaped projects here, phase 3's toolchain matrix and
                outcome fixtures, phase 5's `layout-*` corpora — is a
                subdirectory of it and is staged through THIS helper. Do not
                add a second copy helper, a second root, or a
                corpus-directory parameter: one stager is what guarantees
                every corpus is read from a temp dir rather than from inside
                `testdata`, which for phase 5 is the difference between
                CLM-046 being falsifiable and passing vacuously.

          (2) gitInitProject(t, dir) — `git init` plus the minimum config
              needed for `IsGitRepo()` to report true. Called explicitly by
              the tests that want a work tree, so a test asserting the
              NON-repo warn (CLM-018) cannot accidentally inherit one.
              Note the trap: the temp dir must not be nested inside this
              repository's own work tree, or `git rev-parse` walks UP and
              reports true. t.TempDir() is /var/folders/... on darwin, which
              is outside — assert that rather than assume it, by having the
              helper verify `IsGitRepo()` is false before any test relies on
              the non-repo case.

          (3) runDoctorInProject(t, dir, args...) (stdout string, exitCode
              int) — chdir into dir, build NewRootCommand(), execute with
              the given args, and translate the returned error through
              *ExitCodeError into a real integer exit code (0 when nil).
              Every exit-matrix claim reads this integer; nothing may infer
              an exit code from printed text.

