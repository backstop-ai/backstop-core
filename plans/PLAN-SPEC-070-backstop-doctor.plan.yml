  N. ★ THE TOOLCHAIN EXECUTION PATH IS SHARED, NOT REBUILT. ★
     `checkToolchainRuns` does NOT reimplement `checkEngineToolAllowed →
     splitCommand → check.CommandRunner`. It CALLS the shared
     `packEntrypointProber` that PLAN-SPEC-069 phase 14 (TASK-042, verified
     by its TASK-043) lands in `cmd/backstop/pack_entrypoint_prober.go`.
     Both files are `package main` in cmd/backstop, so this is a
