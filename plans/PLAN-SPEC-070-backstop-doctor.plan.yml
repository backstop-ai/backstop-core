                depends on now. Cite its file,
                `cmd/backstop/pack_entrypoint_prober.go`, and its owner
                (SPEC-069 / PLAN-SPEC-069 phase 14).

            (4) REWORD all five prose occurrences and the
                `checkToolchainRuns` contract note to describe CONSUMING the
                shared `packEntrypointProber` — naming it explicitly rather
                than saying "a shared helper". The substantive point to
                preserve, because it is REQ-006's actual requirement and it
                is satisfied MORE strictly now, not less: the three steps
                still happen, in that order, one layer down, and the number
                of execution routes to audit drops from two to ONE. The
                Sharp Edges occurrence keeps its security claim verbatim in
