     THE SURFACE, READ FROM PLAN-SPEC-069's REVISED TASK-042 ON 2026-08-14
     (a citation of a sibling PLAN, so the phase-3 precondition still
     verifies it in COMPILED CODE before consuming it):

       type entrypointOutcome int
       const (
         entrypointRefused       entrypointOutcome = iota // allowlist said no
         entrypointPassed                                 // started, exit 0
         entrypointUnstartable                            // could not START
         entrypointExitedNonZero                          // started, exit != 0
       )
       type entrypointProbe struct {
         PackName  string           // declaring pack's manifest name
         EngineKey string           // the engines: map key
         GateType  engine.GateType  // GateTypeTest or GateTypeBuild
         Command   string           // the declared command string, VERBATIM
         Outcome   entrypointOutcome
         ExitCode  int              // meaningful only for ExitedNonZero
         Output    []byte           // COMBINED stdout+stderr
         Err       error            // refusal or start error; else nil
       }
       type packEntrypointProber struct {
         Packs  []*pack.Manifest
         Runner check.CommandRunner
       }
       func (p *packEntrypointProber) Probe(ctx context.Context) []entrypointProbe

     WHAT THE SHARED PROBER OWNS, so doctor does not re-own any of it:
       • selection by `engine.GateTypeTest` / `engine.GateTypeBuild` on the
         DECLARED type, never the command string;
       • the trust gate (`checkEngineToolAllowed`) BEFORE the splitter and
         the runner, surfaced per-binding as `entrypointRefused`;
       • `splitCommand` (strings.Fields — constant E still describes the
         behaviour, it is simply invoked one layer down);
       • DETERMINISTIC ORDER — Packs in slice order, `Engines` by SORTED
         key. Constant C's requirement is therefore SATISFIED BY THE SHARED
         PROBER. PLAN-SPEC-069's TASK-042 states that CLM-007 here is the
         reason it sorts at all, so do not add a second sort in doctor and
         do not assume the sort is optional;
       • the (b)/(c) split, from the ONE mechanically honest signal — an
         `*exec.ExitError` is `entrypointExitedNonZero` (its `ExitCode()`),
         any other non-nil error is `entrypointUnstartable`. Doctor
         attempts NO other classification. Two copies of that two-line
         split is exactly how `init` and `doctor` come to disagree about
         the same failure;
       • ★ THE RUNNER METHOD. The prober enters `check.CommandRunner.Run`
         (pkg/check/runner.go:17 — COMBINED stdout+stderr), NOT `RunStdout`
         (:21 — stdout only), which is what `runFindingsEngine` calls at
         pack_gate.go:648. THIS IS WHY THE SHARING MATTERS TO THIS PLAN
         SPECIFICALLY: an earlier revision pointed `checkToolchainRuns` at
         runFindingsEngine's pattern, which would have bound `RunStdout` —
         and CLM-033 requires a nonzero exit's output captured VERBATIM
         while TASK-026's own fixture is a `go build` failure whose
         diagnostics are 100% on STDERR. Under `RunStdout` that capture is
         EMPTY and CLM-033 passes only if its assertion is weak. Doctor
         inherits `Run` by consuming the prober; it does not choose a method
         and MUST NOT introduce one.

     WHAT DOCTOR OWNS ON TOP, and it is all report vocabulary:
       • the SKIP-FIRST branch on `ctx.PacksErr` (CLM-063) — the prober
         never sees an ungathered pack set;
       • constructing the prober from `ctx.Packs` / `ctx.Runner` and calling
         `Probe` exactly once;
       • the ROLLUP to ONE `doctorResult` (constant B): per-entrypoint lines
         inside one message, Status = the WORST outcome;
       • the outcome → `pass|warn|fail` mapping, including doctor's own
         disposition of `entrypointRefused` (a check FAILURE here, whereas
         init surfaces the same value as a CONFIG ERROR — this is precisely
         why `Probe` returns no `error` and leaves disposition to the
         caller);
       • the EMPTY-slice case → outcome (d), WARN (CLM-034). The prober
         deliberately does not decide absence;
       • the remediation text, and pointing outcome (b) at THAT PACK's own
         documented install steps while installing nothing;
       • the registry entry.

     A `checkEngineToolAllowed`, `splitCommand`, `exec.Command` or
     `CommandRunner` call appearing in `doctor_checks.go` means the prober
     was reimplemented rather than consumed. That is the founder-ruled
     defect this constant exists to prevent, and it will look like ordinary
     code in review.

