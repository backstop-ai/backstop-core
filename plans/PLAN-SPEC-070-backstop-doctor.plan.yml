  A. THE REGISTRY GROWS ACROSS PHASES, AND THAT IS DELIBERATE.
     Phase 2 registers four checks, phase 3 a fifth, phase 4 a sixth, phase
     5 the seventh. Every REQ-002 claim except CLM-051 is REGISTRY-RELATIVE
     ("every registered check", "the same registry", "unique and kebab") and
     therefore passes at four and at seven. CLM-051 is the ONLY absolute
     assertion ("exactly the declared set") and it is mandated in PHASE 5,
     the phase that completes the set. Do not write CLM-051's test early: it
     would be red for three phases and the phase gates would be dishonest.

  B. ONE RESULT PER CHECK, ALWAYS (CLM-009). `toolchain-runs` executing four
     entrypoints returns ONE `doctorResult` whose Message enumerates each
     entrypoint separately (CLM-035) and whose Status is the WORST outcome
     among them (fail > warn > pass). It does not return four results, and
     it does not register four checks.

  C. REPORT ORDER IS DETERMINISTIC AT TWO LEVELS. The registry is a SLICE
     (CLM-007). But `Manifest.Engines` is a `map[string]EngineSpec`
     (pkg/pack/manifest.go:31), so `toolchain-runs` MUST sort the engine
     keys (and iterate packs in the gathered slice order) before executing —
     otherwise the per-entrypoint lines inside its one message ride Go map
     iteration and CLM-007's byte-identical-across-runs assertion fails
     intermittently. Sort by (pack name, engine key).

  D. THE TRUST GATE HAS A SHAPE THAT DECIDES THE FIXTURES.
     `checkEngineToolAllowed` (cmd/backstop/pack_gate.go:812) returns nil
     IMMEDIATELY when `binding.Provision == nil` — the Layer-0 exemption.
     So:
       • a fixture binding with NO `provision:` block runs whatever it
         declares (this is how the real go-toolchain pack declares
         `go build` / `go test`), and
       • CLM-037's "not on the trusted-tool allowlist" case is ONLY
         reachable with a binding that DOES carry `provision:` naming a tool
         absent from `engine.TrustedToolAllowlist()` (semgrep, ast-grep,
         grep, rg, oxlint, bun, tsc, prettier). A fixture declaring
         `command: curl ...` with no provision block would be ALLOWED and
         the claim would prove nothing.

  E. `splitCommand` IS `strings.Fields` (pack_gate.go:887). No quote
     handling, no escaping, no shell. That is exactly what makes CLM-038
     assertable: a declared command carrying `;` or `$(...)` tokenizes into
     LITERAL argv entries. Assert BOTH directions — the literal-named side
     effect exists, and the injected side effect does NOT.

  F. THE SIDE-EFFECT CONVENTION FOR THE gate_type MATRIX (CLM-024..030).
     The spec's Verification section and Review Question 2 forbid asserting
     the selection LIST; "not executed" must be the ABSENCE of a real side
     effect. Fixture packs therefore declare, one binding per gate_type,
     a command that WRITES A DISTINCT FILE when it runs:

       gate_type: test            command: go build -o test.marker ./...
       gate_type: build           command: go build -o build.marker ./...
       gate_type: lint            command: go build -o lint.marker ./...
       gate_type: findings        command: go build -o findings.marker ./...
       gate_type: coverage        command: go build -o coverage.marker ./...
       gate_type: substantiveness command: go build -o subst.marker ./...
       gate_type: contracts       command: go build -o contracts.marker ./...

     `go` is present on PATH by definition in this repo and needs no
     `provision:` block (constant D). The fixture project carries a
     one-file Go module for `./...` to build. After the check runs, exactly
     `test.marker` and `build.marker` exist on disk; the other five must
     NOT. That is a real execution through the real dispatch path, and the
     absence is a filesystem fact rather than a reading of the code.

     NOTE the coverage row specifically: the real typescript-toolchain pack
     declares near-identical vitest commands under `test` AND `coverage`
     (Review Question 5). The fixture reproduces that trap — coverage's
     command differs from test's only in the `-o` name — so a selection
     keyed on the command STRING rather than the declared `gate_type` is
     caught.

  G. FIXTURE PROJECTS ARE MATERIALIZED INTO `t.TempDir()`, NOT GATED IN
     PLACE. testdata holds TEMPLATES; the harness copies a template tree
     into a fresh temp dir per test. Three reasons this is not optional:
     git cannot track an empty directory (the no-config/no-git fixture),
     a `.git` directory cannot be committed inside this repo, and the
     toolchain fixtures WRITE marker files — an in-place fixture would
     accumulate build output in the repo and make reruns non-hermetic.
     `git init` is run by the harness for the cases that need a work tree.

