      - id: TASK-013
        type: implementation
        title: "Implement Phase 2 coherence validation"
        description: |
          Create pkg/packval/phase2.go with package packval.

          Function:
            - RunCoherence(pack *PackManifest, packDir string) *PhaseResult:
              1. Verify every rule has at least one claim
              2. Verify every claim has both positive and negative fixtures
                 (at least one each)
              3. Verify every fixture file exists and is non-empty (relative
                 to packDir)
              4. Verify claim ID uniqueness within the pack
              5. Verify rule ID uniqueness spanning ruleset and tool_config
