      - id: TASK-010
        type: implementation
        title: "Implement Phase 1 structural validation"
        description: |
          Create pkg/packval/phase1.go with package packval.

          Function:
            - RunStructural(pack *PackManifest, packDir string) *PhaseResult:
              1. If pack is nil (YAML parse failed), return fail with error
              2. Check required fields: name, version, language, archetype,
                 content — each missing field is a separate error
              3. Validate archetype in {enforcement, code}
              4. Validate version matches semver regex
              5. Validate language in supported set {go}
              6. Check risk_class on every rule (AllRules): must be in
                 {security, correctness, style, perf}
              7. For layer 2 rules: verify rule field file exists relative
                 to packDir
              8. For all referenced file paths: verify existence, EXCEPT
                 tool_config.file (consumer-side path per REQ-004)
              9. Return PhaseResult with status, checks count, errors

          Helper functions:
            - isValidSemver(v string) bool
            - isValidArchetype(a string) bool
            - isValidLanguage(l string) bool
            - isValidRiskClass(rc string) bool
        files:
