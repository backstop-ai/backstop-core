          - CLM-045
          - CLM-051
          - CLM-057
        depends_on: [TASK-008]

      - id: TASK-016
        type: implementation
        title: "Implement executor interface and default executor"
        description: |
          Create pkg/packval/executor.go with package packval.

          Types:
            - FixtureExecutor interface:
              - RunSemgrep(ruleFile string, fixtureFile string, packDir string)
                (*ExecutionResult, error)
              - RunToolConfig(tool string, fixtureFile string, packDir string,
                goMod string) (*ExecutionResult, error)
              - RunValidator(validatorPath string, fixturePath string,
                packDir string) (*ExecutionResult, error)
              - RunScaffoldTest(scaffoldDir string, testCommand string)
                (*ExecutionResult, error)
            - ExecutionResult struct: Passed bool, Output string, ExitCode int,
              Diagnostics []string.
            - DefaultExecutor struct: implements FixtureExecutor using real
              OS commands (os/exec).
            - MockExecutor struct: implements FixtureExecutor for testing,
              allows configuring per-call return values.

          DefaultExecutor methods:
            - RunSemgrep: executes semgrep --test, parses output
            - RunToolConfig: creates temp module, copies go.mod and fixture,
              runs tool, checks results
            - RunValidator: delegates to SandboxedRun
            - RunScaffoldTest: runs test_command in scaffold dir
        files:
          - pkg/packval/executor.go
        claims:
          - CLM-039
          - CLM-045
          - CLM-051
          - CLM-057
        depends_on: [TASK-015]

      - id: TASK-017
        type: test
        title: "Write sandbox tests"
        description: |
          Create pkg/packval/sandbox_test.go with package packval_test.

          Test functions (mandated test names):
            - TestPackVal_P3_SandboxBlocksFilesystemWrite (CLM-111): invoke
              SandboxedRun with a command that tries to write outside pack dir,
              verify error returned
            - TestPackVal_P3_SandboxBlocksNetwork (CLM-112): invoke SandboxedRun
              with a command that tries network access, verify error returned
            - TestPackVal_P3_SandboxBlocksEnvVars (CLM-113): invoke SandboxedRun
              with a command that reads env vars, verify no env vars accessible
            - TestPackVal_P3_SandboxViolationIsHardError (CLM-114): verify
              sandbox violation returns error that maps to a hard validation
              error
            - TestPackVal_P3_SandboxAllowsReadInPackDir: verify command can
              read files within pack dir
            - TestPackVal_P3_SandboxAllowsExecution: verify command can
              execute normally within constraints
        files:
          - pkg/packval/sandbox_test.go
        claims:
          - CLM-111
          - CLM-112
          - CLM-113
          - CLM-114
        depends_on: [TASK-008]

      - id: TASK-018
        type: implementation
        title: "Implement sandbox"
        description: |
          Create pkg/packval/sandbox.go with package packval.

          Function:
            - SandboxedRun(cmd string, args []string, packDir string)
              ([]byte, error):
              Executes the given command in a restricted process environment.
              On macOS: uses sandbox-exec with a profile that allows read
              access to packDir, denies filesystem writes outside packDir,
              denies network access, clears environment variables.
              On Linux: uses seccomp/namespaces for equivalent restrictions.
              On unsupported platforms: returns error (fail closed per sharp
              edge 3).

              The sandbox profile:
                - Allow: read packDir/*, execute the command binary
                - Deny: write outside packDir, all network syscalls
                - Clear: all environment variables before exec

              Returns command stdout on success, error on sandbox violation
              or command failure.
        files:
          - pkg/packval/sandbox.go
        claims:
          - CLM-111
          - CLM-112
          - CLM-113
          - CLM-114
        depends_on: [TASK-017]

      - id: TASK-019
        type: verification
        title: "Verify executor and sandbox"
        description: |
          Run executor and sandbox tests.
        files:
          - pkg/packval/executor_test.go
          - pkg/packval/sandbox_test.go
        claims:
          - CLM-114
        depends_on: [TASK-016, TASK-018]

