            - RunFixtures(pack *PackManifest, packDir string,
              executor FixtureExecutor) *PhaseResult:
              1. Pre-check: if language is "go", run go mod tidy in a temp
                 copy of packDir (per REQ-014). Failure is a pre-check error.
              2. For each rule in the pack:
                 a. Semgrep rules (layer 1-2 with rule file):
                    - Read semgrep rule file, verify rule ID matches pack
                      rule ID (CLM-043/044)
                    - For each claim's fixtures: call executor.RunSemgrep
                    - Positive must not trigger; negative must trigger
                    - On negative failure: include engine-limitation fix hint
                      (CLM-109)
                 b. Tool_config rules:
                    - Call executor.RunToolConfig with pack go.mod
                    - Positive must pass clean; negative must trigger
                 c. Layer 3 rules:
                    - Determine fixture path (file for single-file, dir for
                      multi-file input_scope)
                    - Call executor.RunValidator (uses SandboxedRun)
                    - Exit 0 = pass, non-zero = fail
              3. Scaffold validation:
                 a. Complete scaffolds: render with sample_config, call
                    executor.RunScaffoldTest
                 b. Skeleton scaffolds: check directory exists, expected
                    files present, test function names present. Do NOT run
                    test_command.
              4. SDK validation: verify provides surface is declared in
                 manifest
              5. Return PhaseResult

          Helper functions:
            - verifySemgrepRuleID(ruleFile string, expectedID string) error
            - prepTempPackDir(packDir string) (string, func(), error)
