---
plan_id: PLAN-SPEC-014
spec_id: SPEC-014
spec_version: 1.0.0
created: "2026-04-08"
status: draft
target_repo: backstop-core
target_module: github.com/bmanson/backstop-core
test_command: "go test ./pkg/packval/... ./cmd/backstop/... -run TestPackVal -race -coverprofile=cover.out"
coverage_threshold: 80

notes: |
  Implements the pack validation pipeline as two CLI commands (pack check and
  pack test) backed by a pkg/packval library. The pipeline runs six phases in
  strict dependency order with early termination. pack check runs phases
  1/2/4/5/6 (manifest-only). pack test runs all six phases including phase 3
  (fixture execution with semgrep, tool_config temp modules, layer 3 sandbox).

  Package structure:
    pkg/packval/ — pipeline orchestrator, 6 phase functions, executor interface,
                   sandbox, result types, manifest parser, output formatters
    cmd/backstop/ — thin CLI adapters for pack check and pack test

  Dependency order:
    result types + manifest parser → phase functions (parallel where possible)
    → pipeline orchestrator → CLI adapters → integration verification

  Ambiguities resolved during planning:
    - go mod tidy runs in a temp copy per REQ-014 to preserve REQ-029 idempotency
    - Sandbox uses OS-level isolation (sandbox-exec on macOS, seccomp on Linux)
    - pack_test_cmd.go avoids Go test file naming collision per sharp edge 7
    - FixtureExecutor interface enables mock-based testing of phase 3 dispatch

phases:
  # ═══════════════════════════════════════════════════════════════════════
  # Phase 1: Foundation Types — Result, Manifest, Format
  # ═══════════════════════════════════════════════════════════════════════
  - id: phase-1
    name: "Phase 1: Foundation Types"
    description: |
      Establish the core types that all subsequent phases depend on: Result
      and error types, PackManifest parser, and output formatters. These must
      exist before any phase function or pipeline orchestrator.
    tasks:
      - id: TASK-001
        type: setup
        title: "Scaffold pkg/packval directory and testdata"
        description: |
          Create the pkg/packval/ package directory. Create a minimal testdata/
          directory with a valid pack manifest fixture (pack.yml) that has all
          required fields (name, version, language, archetype, content with at
          least one rule having risk_class, claims with positive/negative
          fixtures). This fixture will be reused across phase tests.

          Also create testdata/fixtures/ with minimal positive and negative
          fixture files for coherence and fixture execution tests.
        files:
          - pkg/packval/testdata/valid-pack/pack.yml
          - pkg/packval/testdata/valid-pack/fixtures/positive.go
          - pkg/packval/testdata/valid-pack/fixtures/negative.go
        claims:
          - CLM-004
          - CLM-016
        depends_on: []

      - id: TASK-002
        type: test
        title: "Write result type tests"
        description: |
          Create pkg/packval/result_test.go with package packval_test.

          Test functions:
            - TestPackVal_ResultPassWhenNoErrors: construct Result with empty
              Errors, verify Status is "pass"
            - TestPackVal_ResultFailWhenErrors: construct Result with errors,
              verify Status is "fail"
            - TestPackVal_ValidationErrorFields: construct ValidationError with
              all fields (Phase, Check, Rule, Claim, Message, FixHint,
              ManifestPath), verify each accessor
            - TestPackVal_PhaseResultSkippedReason: construct PhaseResult with
              Status "skipped" and Reason, verify reason is populated
            - TestPackVal_ValidationWarningFields: construct ValidationWarning
              with Phase, Check, Message, Files, FixHint, verify fields
        files:
          - pkg/packval/result_test.go
        claims:
          - CLM-103
          - CLM-104
          - CLM-105
          - CLM-106
        depends_on: []

      - id: TASK-003
        type: implementation
        title: "Implement result types"
        description: |
          Create pkg/packval/result.go with package packval.

          Types:
            - Result struct: Status string, Pack string, Version string,
              Phases []PhaseResult, Errors []ValidationError,
              Warnings []ValidationWarning. Status is computed: "pass" when
              Errors is empty, "fail" otherwise.
            - PhaseResult struct: Phase string, Status string, Checks int,
              DurationMs int64, Reason string (for skipped phases)
            - ValidationError struct: Phase string, Check string, Rule string,
              Claim string, Message string, FixHint string, ManifestPath string.
              JSON tags on all fields for ADR-0001 output.
            - ValidationWarning struct: Phase string, Check string,
              Message string, Files []string, FixHint string.

          All types must have json struct tags matching the output format spec.
        files:
          - pkg/packval/result.go
        claims:
          - CLM-103
          - CLM-104
          - CLM-105
          - CLM-106
        depends_on: [TASK-002]

      - id: TASK-004
        type: test
        title: "Write manifest parser tests"
        description: |
          Create pkg/packval/manifest_test.go with package packval_test.

          Test functions:
            - TestPackVal_ParseManifestValid: parse testdata/valid-pack/pack.yml,
              verify Name, Version, Language, Archetype, Content fields populated
            - TestPackVal_ParseManifestInvalidYAML: parse a string that is not
              valid YAML, verify error returned
            - TestPackVal_ParseManifestMissingFile: parse a path that does not
              exist, verify error returned
            - TestPackVal_ParseManifestRulesExtracted: parse a manifest with
              rules in content.ruleset.rules, verify rules slice populated with
              correct IDs
            - TestPackVal_ParseManifestToolConfigExtracted: parse a manifest
              with tool_config entries, verify they are extracted
        files:
          - pkg/packval/manifest_test.go
        claims:
          - CLM-004
          - CLM-016
        depends_on: [TASK-001]

      - id: TASK-005
        type: implementation
        title: "Implement manifest parser"
        description: |
          Create pkg/packval/manifest.go with package packval.

          Types:
            - PackManifest struct: Name, Version, Language, Archetype string;
              Content ContentBlock; ToolConfig []ToolConfigEntry.
              Includes nested types for rules, claims, fixtures, scaffolds, SDK.
            - ContentBlock struct: Ruleset *Ruleset; Scaffolds []Scaffold;
              SDK *SDKBlock.
            - Ruleset struct: Rules []Rule.
            - Rule struct: ID, RiskClass, Layer string; RuleFile string;
              Claims []Claim; Category, Justification, InputScope, Validator
              string; PairsWith *PairsWith.
            - Claim struct: ID string; PositiveFixtures, NegativeFixtures
              []Fixture.
            - Fixture struct: Path string; BypassAttempt bool. Supports both
              plain string and object fixture formats.
            - ToolConfigEntry struct: Tool, File string; ID, RiskClass string;
              Claims []Claim.
            - Scaffold struct: Type, Dir, TestCommand string; PairsWith
              *PairsWith; SampleConfig map[string]interface{}.
            - SDKBlock struct: Provides []string.
            - PairsWith struct: Rules []string.

          Functions:
            - ParseManifest(path string) (*PackManifest, error): reads YAML
              file, unmarshals into PackManifest. Returns error on YAML parse
              failure or file not found.
            - AllRules(m *PackManifest) []Rule: returns combined rules from
              ruleset and tool_config entries that have their own ID.
            - AllRuleIDs(m *PackManifest) []string: returns all rule IDs from
              both sources.

          Use gopkg.in/yaml.v3 for YAML parsing with custom UnmarshalYAML
          on Fixture to handle both string and object formats.
        files:
          - pkg/packval/manifest.go
        claims:
          - CLM-004
          - CLM-016
        depends_on: [TASK-004]

      - id: TASK-006
        type: test
        title: "Write format output tests"
        description: |
          Create pkg/packval/format_test.go with package packval_test.

          Test functions:
            - TestPackVal_JSONOutputStructure: format a Result with phases,
              errors, warnings as JSON, verify top-level keys: status, pack,
              version, phases, errors, warnings
            - TestPackVal_ErrorFieldsComplete: format a Result with one error,
              verify JSON includes phase, check, rule, claim, message,
              fix_hint, manifest_path
            - TestPackVal_PhaseStatusFields: format a Result with phase results,
              verify each phase has phase, status, checks, duration_ms
            - TestPackVal_SkippedPhaseReason: format a Result with skipped
              phase, verify reason field present
            - TestPackVal_TextFormat: format a Result as text, verify
              human-readable output
            - TestPackVal_DefaultFormatJSON: verify FormatResult with empty
              format string defaults to JSON
        files:
          - pkg/packval/format_test.go
        claims:
          - CLM-103
          - CLM-104
          - CLM-105
          - CLM-106
          - CLM-107
          - CLM-108
        depends_on: [TASK-002]

      - id: TASK-007
        type: implementation
        title: "Implement output formatters"
        description: |
          Create pkg/packval/format.go with package packval.

          Functions:
            - FormatResult(result *Result, format string) (string, error):
              dispatches to JSON or text formatter based on format string.
              Empty string or "json" → JSON. "text" → text.
            - formatJSON(result *Result) (string, error): marshals Result
              to indented JSON. Ensures all fields present per CLM-103/104/105.
            - formatText(result *Result) (string, error): produces
              human-readable output with phase summaries, error details,
              and warning details.

          JSON output must match the structure defined in the spec:
          status, pack, version, phases array, errors array, warnings array.
        files:
          - pkg/packval/format.go
        claims:
          - CLM-103
          - CLM-104
          - CLM-105
          - CLM-106
          - CLM-107
          - CLM-108
        depends_on: [TASK-006, TASK-003]

      - id: TASK-008
        type: verification
        title: "Verify foundation types"
        description: |
          Run tests and lint for all foundation types.
        files:
          - pkg/packval/result_test.go
          - pkg/packval/manifest_test.go
          - pkg/packval/format_test.go
        claims:
          - CLM-103
          - CLM-104
        depends_on: [TASK-003, TASK-005, TASK-007]

