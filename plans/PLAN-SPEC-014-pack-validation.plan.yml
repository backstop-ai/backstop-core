            - TestPackVal_ErrorOrdering (CLM-110): create pack with errors
              in multiple phases, verify errors ordered by phase then
              manifest order
            - TestPackVal_ErrorFieldsComplete (CLM-104): verify every error
              in result has all required fields

          Tests use MockExecutor for phase 3 tests. Tests construct temporary
          pack directories with valid/invalid manifests.
        files:
