          - CLM-096
          - CLM-097
          - CLM-098
          - CLM-099
          - CLM-100
          - CLM-101
          - CLM-102
          - CLM-110
        depends_on: [TASK-023, TASK-028, TASK-031]

      - id: TASK-033
        type: implementation
        title: "Implement pipeline orchestrator"
        description: |
          Create pkg/packval/pipeline.go with package packval.

          Types:
            - Pipeline struct: packDir string, opts PipelineOptions,
              executor FixtureExecutor.
            - PipelineOptions struct: Mode string (check/test),
              Format string (json/text), Executor FixtureExecutor.

          Functions:
            - NewPipeline(packDir string, opts PipelineOptions) *Pipeline:
              creates pipeline with mode, format, and executor. If executor
              is nil, uses DefaultExecutor.
            - (p *Pipeline) Run() *Result:
              1. Parse manifest via ParseManifest
              2. Determine phase list based on mode:
                 - check: [1, 2, 4, 5, 6]
                 - test: [1, 2, 3, 4, 5, 6]
              3. Execute phases in order:
                 - Phase 1: RunStructural(pack, packDir)
                 - Phase 2: RunCoherence(pack, packDir)
                 - Phase 3: RunFixtures(pack, packDir, executor) [test only]
                 - Phase 4: RunArchetype(pack)
                 - Phase 5: RunLayer(pack, packDir)
                 - Phase 6: RunRiskClass(pack)
              4. After each phase: if status is "fail", mark remaining
                 phases as "skipped" with reason field, break
              5. Collect all errors from all phases in phase order, then
                 manifest order within phase (CLM-110)
              6. Collect all warnings
              7. Build Result with status, pack name, version, phases,
                 errors, warnings
              8. Return Result

          The pipeline must be idempotent (CLM-101) and side-effect-free
          (CLM-102). No files modified, no state persisted, no network calls.
        files:
          - pkg/packval/pipeline.go
        claims:
          - CLM-001
          - CLM-002
          - CLM-003
          - CLM-095
          - CLM-096
          - CLM-097
          - CLM-098
