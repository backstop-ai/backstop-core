              6. Verify tool_config entries with own rule ID have claims
                 and fixtures
              7. Check pairs_with.rules resolve to existing rule IDs;
                 dangling = warning not error
              8. Scan fixture directory for orphan files not referenced by
                 any claim; orphans = warning not error
              9. Return PhaseResult with status, checks, errors, warnings

          Helper functions:
            - collectAllClaimIDs(pack *PackManifest) []string
            - collectReferencedFixturePaths(pack *PackManifest) map[string]bool
            - scanFixtureDirectory(packDir string) ([]string, error)
