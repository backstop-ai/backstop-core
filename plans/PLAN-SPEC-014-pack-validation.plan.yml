  # ═══════════════════════════════════════════════════════════════════════
  - id: phase-4
    name: "Phase 4: Executor Interface and Sandbox"
    description: |
      Define the FixtureExecutor interface and implement the sandbox for
      layer 3 validators. These are prerequisites for Phase 3 fixture
      execution. Executor and sandbox can be built in parallel.
    tasks:
