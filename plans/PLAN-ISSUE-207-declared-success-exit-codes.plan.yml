  Complexity (honest): the issue rates this cross-cutting, known, moderate
  risk, and this plan agrees. The default changes behaviour for every
  non-CrashGuard findings engine on BOTH dispatch paths (gate
  runFindingsEngine and packval DefaultExecutor.RunEngine). It adds manifest
  surface on two decode paths: pkg/pack EngineSpec -> parseEngineSpec
  (non-strict YAML, so an unwired key is silently dropped), and pkg/packval,
  which decodes straight into engine.EngineBinding. Each change is small. The
  risk is in (a) third-party packs, which are unknown, hence the
  self-explaining error, (b) the D-1 ruling, which makes every grep-style
  engine (in-repo, this repo's installed go-contracts, and consumers'
  packs) declare [0, 1], and (c) existing tests whose stub runners return a
  non-nil error with an empty payload for a non-CrashGuard engine (audited
  under CLM-013).

  Design decisions taken by this plan (the reviewer rules on each):
    D-1 FOUNDER RULING (2026-10-12): "empty" means
        len(bytes.TrimSpace(raw)) == 0, where raw is the tool's own output
        BEFORE any convert. That is the stdout_artifact file's bytes when the
        binding declares stdout_artifact, otherwise stdout. The check sits
        after the never-started refusal and the stdout_artifact read, and
        BEFORE the strict-SARIF shape guard and the convert. On failure the
        convert is never run. Consequence: a convert engine whose tool
        crashes with empty output and an unlisted exit status now fails, even
        though its convert would have wrapped the empty input in an empty
        SARIF envelope. This closes the convert-family gap the first draft
        surfaced. The cost: every engine whose tool legitimately exits
        non-zero with empty raw output on a clean run (grep: exit 1 on no
        match) must declare that status. Those engines are enumerated and
        declared under CLM-013 / CLM-016.
    D-2 Failure shape: a *check.ConfigError (exit 2), the same class as
        neverStartedError. Text:
        "pack <pack> engine <command>: exit status <N> with an empty findings
        payload is an engine failure, not a clean pass; if exit status <N> is
        a legitimate no-findings result for this tool, declare it:
        success_exit_codes: [0, <N>]". The dispatcher's existing wrap
        ("dispatching findings engine <key> for pack <pack>: ...") adds the
        engine's map key, so pack, engine key, command and status all appear.
        When the run error carries no exit status (a stub or I/O error), <N>
        is replaced by "a failed run with no exit status (<err>)" and the
        hint is omitted. That case is never accepted (fail-safe).
    D-3 CrashGuard relationship. One predicate, exitAccepted(runErr, set), is
        used by both checks. It is true iff runErr == nil and 0 is in the
        set, or runErr carries an exit status (errors.As to
        interface{ ExitCode() int }, satisfied by *exec.ExitError) that is in
        the set. (a) The new raw-empty check (pre-convert, D-1) applies to
        engines with crash_guard false. A CrashGuard engine is already at least as
        strict: an empty payload parses to zero findings, which its guard
        already treats as a crash. Its existing "crashed: non-zero exit with
        no parseable findings" wording therefore stays authoritative and
        unchanged. (b) The CrashGuard condition changes from
        `runErr != nil && zero findings` to `!exitAccepted && zero findings`.
        With the set undeclared ({0}) this is identical to today for every
        input, including a status-less error. With a set declared, a
        CrashGuard engine may treat a listed status as clean. Both
        declarations may coexist. No conflict rule is needed.
    D-4 Validation (both decode paths, one authority:
        engine.ValidateSuccessExitCodes). The value must be a YAML sequence of
        integers. A scalar or a non-integer element is a decode error on both
        paths once the field exists. The sequence must be non-empty, each
        element in 0..255, with no duplicates, and it MUST contain 0
        (omitting 0 would make a clean exit a failure; no known use case).
        Absent or explicit null = undeclared = {0}. The field is accepted on
        any engine but is inert outside the findings path (coverage engines
        and the sandbox exit-code branch are out of scope).
    D-5 Exit-status extraction lives in a new pkg/check/exit_status.go,
        ExitStatus(err) (int, bool), alongside NeverStarted, as the single
        authority for both dispatch paths. pkg/pack/engine (a leaf, no
        pkg/check import) owns the field,
        EngineBinding.EffectiveSuccessExitCodes() ([]int: the declared set,
        or [0]) and ValidateSuccessExitCodes.
    D-6 Direction #2 is a BLOCKING phase-2 error (check name
        "command-pack-relative-file"), not a warning, for engines that do NOT
        declare producer:. For those engines, a command: argv token that
        resolves to a regular file under the pack dir is broken at gate time
        by construction, because the gate cwd is projectRoot.
        PRODUCER EXEMPTION (review finding, 2026-10-12): an engine that
        declares producer: is skipped entirely. Core never invokes its
        command: tool. The producer replaces the invoked name and receives
        the command tokens as arguments it interprets. A token may
        legitimately resolve in both places: the pack ships a stub for pack
        test (cwd = packDir) and the consumer has the real script at gate
        time (cwd = projectRoot). The motivating shipped case is
        backstop-ai/bash-toolchain engine bash-test:
        `command: bash scripts/verify-public-product-model.sh` with
        `producer: scripts/test-produce.sh`.
        Zero-hit audit of the revised rule (2026-10-12): 379 engine-bearing
        manifests were scanned (every pack.yml in the repo excluding
        node_modules, every pack.yml under .backstop/packs, and
        pkg/pack/engine/testdata/contracts-grep-engine.yml). There were
        ZERO hits. Exactly one token was producer-exempted: bash-toolchain
        bash-test, scripts/verify-public-product-model.sh. Without the
        exemption that would have been a false-positive block. Phase 2
        runs in both check and test modes. Tokens considered: every
        whitespace-split token of binding.Command (splitCommand semantics) of
        a producer-less engine,
        including argv[0]. Skipped: tokens starting with "-", absolute
        paths, tokens that escape packDir after Clean, and anything that is
        not a regular file (directories such as "src" and globs such as
        "./..." never match). The FixHint steers to `producer: <token>` and
        says core never resolves command: against the pack dir. "Does not
        resolve from the project root" is NOT checked: no project exists at
        authoring time, so that half is covered at runtime by CLM-001.
        The gate's pack loader gets no new check.
    D-7 The gate runner's Dir stays projectRoot (Direction #3). No cwd, Env
        or runner construction change anywhere.

  Acceptance claims defined here because ISSUE-207 has no formal CLM array:
    CLM-001: the reproduced trigger fails loud. A pack whose command: is
      "sh tool.sh" with tool.sh only in the pack root, dispatched with the
      gate's runner shape (check.ExecCommandRunner{Dir: projectRoot}), returns
      a *check.ConfigError (via errors.As) whose text names the pack, the
      command, the observed exit status and success_exit_codes. It never
      returns a nil error with zero violations.
    CLM-002: for a crash_guard-false engine, an empty raw output (D-1: the
      stdout_artifact file, else stdout, before convert) with an exit status
      outside the effective set is an engine failure with the D-2 shape, and
      the convert is not run.
    CLM-003: a declared set is honoured. A listed status with an empty
      payload is a clean result (nil error, zero violations). An unlisted
      non-zero status still fails.
    CLM-004: a non-empty raw output is converted (if declared) and parsed as
      findings whatever the exit status. A tool exiting non-zero with a SARIF finding still reports it.
      There is no regression for rule-fed engines.
    CLM-005: undeclared = {0}. A run error with no extractable exit status is
      never accepted (D-2/D-3).
    CLM-006: emptiness is judged on the RAW pre-convert output (D-1). With
      stdout_artifact it is the artifact, not noisy stdout. With convert it
      is the tool's output before the convert. A tool that crashes with empty
      output fails even though its convert would emit an empty SARIF
      envelope, and the convert does not run. A convert engine whose tool
      exits with a DECLARED status and empty output is clean (the convert
      runs and its envelope parses to zero findings).
    CLM-007: CrashGuard per D-3. The wording and outcome are unchanged when
      the set is undeclared. A declared set lets a CrashGuard engine accept a
      listed status.
    CLM-008: the pack_engines step never reports pass for such an engine. It
      is Status fail and ConfigErr true (exit 2), with the D-2 text in its
      violations (Direction #4).
    CLM-009: success_exit_codes is validated per D-4 on both decode paths
      (pkg/pack ParseManifest/parseEngineSpec and pkg/packval
      ParseManifest + phase1-structural). A declared value reaches the
      resolved binding on both paths and is not silently dropped.
    CLM-010: the gate runner's working directory stays projectRoot (D-7).
    CLM-011: pack test parity. DefaultExecutor.RunEngine applies the same
      D-1/D-2/D-3 rules after its convert (its own cwd stays packDir), so a
      phase-3 negative fixture can no longer pass over a crashed run.
    CLM-012: authoring-time detection per D-6. pack check and pack test both
      fail phase2-coherence on a producer-less engine's command: token
      naming a pack file and steer the author to producer:. Benign commands
      are not flagged. Engines declaring producer: are never flagged,
      including when the token exists in both the pack and the project (the
      bash-toolchain shape). The revised rule has zero hits over every
      manifest in the repo and in .backstop/packs.
    CLM-013: existing packs and tests are handled honestly (re-audited
      2026-10-12 under the D-1 ruling, i.e. on RAW pre-convert output).
      Dispatch routes (gate.go line numbers at HEAD b8be04a; they shift once
      PLAN-ISSUE-209 lands, so re-pin after the rebase): contract engines
      run through runFindingsEngine via dispatchContractEntryWithSandbox ->
      dispatchPackEnginesWithEvidence (gate.go:1944). Substantiveness
      engines run through dispatchPackEnginesWithEvidence too
      (gate.go:1513). pack_engines uses the same dispatcher
      (gate.go:~1177). So the dedicated contracts and
      substantiveness steps do NOT bypass this rule: every findings-path
      engine is affected.
      Tool behaviour checked locally on a clean (no-match) run:
        grep -rn -H -I ...        -> empty stdout, exit 1   => TRIPS
        ast-grep run --json ...   -> "[]" on stdout, exit 1 => raw non-empty, safe
        ast-grep scan --json ...  -> "[]" on stdout, exit 0 => safe
        semgrep --sarif           -> SARIF on stdout, exit 0 => safe
        golangci-lint (sarif to stdout) -> SARIF, exit 0 => safe
      crash_guard engines (go-build, go-test, go-arch-lint, bash-test,
      fixture-test, mybuild) are outside the raw-empty check (D-3).
      Engines that must declare `success_exit_codes: [0, 1]` (grep's
