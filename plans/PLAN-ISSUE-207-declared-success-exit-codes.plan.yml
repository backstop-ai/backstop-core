notes: |
  ISSUE-207: a non-CrashGuard findings engine that STARTS, exits non-zero and
  yields an empty payload reads as a clean pack_engines pass. The never-started
  refusal (check.NeverStarted, cmd/backstop/pack_gate.go:876) only covers a
  process that never launched; the CrashGuard check (:940) is opt-in; and
  parseSarif turns empty input into (nil, nil) (pkg/check/parsers.go:131-134).
  The reproduced trigger is a pack-relative script named in command:
  ("sh tool.sh" / "python3 tool.py") run with cwd = projectRoot
  (cmd/backstop/gate.go:1131). This plan follows the issue's Direction #1-#5.
  Direction #1 is a founder decision (2026-10-12) and is not reopened here:
  each engine has a declared success-exit-code set, {0} when undeclared. An
  EMPTY raw tool output (see the D-1 ruling below) with an exit status
  outside the set is a loud engine failure. A non-empty payload is parsed as
  findings whatever the exit status. Founder ruling on D-1 (2026-10-12):
  emptiness is judged on the tool's RAW output BEFORE convert, which is the
  stdout_artifact file when declared, otherwise stdout. ISSUE-207's Direction
  now says this.
  Authoring base: branch fix/engine-evidence-integrity at b8be04a.

