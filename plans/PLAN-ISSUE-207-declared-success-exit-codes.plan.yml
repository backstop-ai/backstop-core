          stating D-1/D-3/D-4. New pkg/pack/engine/success_exit_codes.go:
          (b EngineBinding) EffectiveSuccessExitCodes() []int (the declared
          set, or [0]) and ValidateSuccessExitCodes(codes []int) error per D-4
          (nil is valid). pkg/pack/manifest.go: EngineSpec gains the same
          field and tag. parseEngineSpec copies it and calls
          engine.ValidateSuccessExitCodes, wrapping the error as
          "parse success_exit_codes: ..." so ParseManifest names the engine
          as it does for gate_type. New pkg/check/exit_status.go:
          ExitStatus(err error) (int, bool) via
          errors.As(err, &interface{ ExitCode() int }), returning false for
          nil or for anything without a status (and for a negative code). Doc
