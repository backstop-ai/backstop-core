  # ═══════════════════════════════════════════════════════════════════════
  # Phase 6: TDD — per-pass scope semantics + CheckScoped/filterViolations
  #          reconciliation (the integration trap)
  # ═══════════════════════════════════════════════════════════════════════
  - id: phase-6
    name: "Phase 6: TDD — Per-Pass Scope Semantics and CheckScoped/filterViolations Reconciliation"
    tasks:
      - id: TASK-015
        type: test
        title: "Write failing tests for per-pass scope: lint file-args vs build project-wide, build violations never scope-filtered"
        description: |
          Add failing tests pinning the per-pass scope semantics and the gate-
          layer exemption for build/typecheck violations. They fail until
          TASK-016.

          Mandated test name (exact, character-for-character from CLM-008),
          placed in cmd/backstop (it must drive the GATE CheckScoped path so it
          catches the per-file loop, which an in-process check.Run cannot):
            - TestCodeCheck_ScopeSemantics_LintFileArgsBuildProjectWide: drive
              realCodeChecker.CheckScoped (cmd/backstop/gate.go) with a
              MULTI-FILE diff scope (>=2 scoped files) through an injected
              fakeRunner / call log, and assert: (a) the LINT command was
              invoked EXACTLY ONCE with ALL scoped files as arguments — NOT once
              per file; (b) the BUILD command was invoked EXACTLY ONCE
              PROJECT-WIDE (e.g. `go build ./...` / `tsc --noEmit`) with the
              scoped files NOT appended; (c) neither pass was re-invoked per
              file. Asserting against the GATE path (not a single in-process
              Run) is load-bearing: it is what fails against the current
              per-file loop and passes only after the loop is removed (TASK-016
              step 3). Record runner calls per command to assert invocation
              count and argument shape.

          Add a gate-layer test (in pkg/gate, the filterViolations owner) — name
          it descriptively, e.g.
          TestGate_FilterViolations_BuildPassExemptFromScopeFilter — asserting
          that a build-pass violation with a NON-EMPTY parser-populated Rule
          (e.g. Rule=="TS2304", File an OUT-OF-scope path) and ProjectWide==true
          is NOT filtered out by filterViolations under a diff scope, while a
          lint/semgrep violation on an out-of-scope file (ProjectWide==false) IS
          filtered. Using a NON-EMPTY Rule is load-bearing: a Rule=="build"
          string-match exemption would PASS against the broken impl, so the test
          must pin the structural ProjectWide field, not the Rule string. This
          encodes constraint 3 (a change to a.ts breaking b.ts must fail a
          diff-scoped gate even though the violation references out-of-scope
          b.ts). Reference CLM-008.

          Tests only; no production edits.
        files:
          - cmd/backstop/gate_scope_test.go
          - pkg/gate/scope_test.go
        claims:
          - CLM-008
        depends_on:
          - TASK-001
          - TASK-014

      - id: TASK-016
        type: implementation
        title: "Implement per-pass scope semantics and exempt build/typecheck violations from gate scope-filtering"
        description: |
          Make the TASK-015 tests pass.

          1. pkg/check/registry.go (commandExecutor + the go testExecutor
             wiring): ScopeKind drives argument assembly — lint passes append
             the scoped file list as tool args; build/typecheck passes run
             project-wide and IGNORE the scoped list (invoked once); test passes
             use the dependency-mapping knob with full-suite fallback (Go: the
             existing fileMode goPackageSelector behavior; TS: the declared
             test_dependency_command with `command` fallback). The four Go
             executors already embody this (lint scoped via ResolveScope, build
             `go build ./...`, test fileMode package) — confirm the generic
             executor matches it for declared/TS stacks.
          2. STRUCTURAL scope-filter exemption (NOT string matching):
             - pkg/gate/result.go: add a field to gate.Violation — ProjectWide
               bool — marking a violation as originating from a project-wide
               pass (build/typecheck), independent of its Rule string.
             - cmd/backstop/gate.go checkViolationsToGate (gate.go:519): set
               ProjectWide=true when cv.Pass==check.CheckTypeBuild (the build
               CheckType also carries TS tsc/typecheck), populated from cv.Pass
               so it is correct even when the parser populated Rule (e.g.
               "TS2304", a SARIF ruleId). Do NOT key off the Rule string.
             - pkg/gate/scope.go filterViolations (scope.go:182): exempt
               violations whose ProjectWide==true from the file-scope filter —
               always retained; lint/test/semgrep (ProjectWide==false) keep
               filtering on scope.Contains. Keep the GateScopeModeAll and
               nil-scope short-circuits intact. This is the constraint-3 fix:
               a build/typecheck violation referencing an out-of-scope file
               (Rule populated) must still fail a diff-scoped gate, so it cannot
               be matched by a Rule=="build" string and MUST be matched by the
               structural ProjectWide field.
          3. cmd/backstop/gate.go realCodeChecker.CheckScoped (gate.go:449-465):
             UNCONDITIONALLY remove the per-file loop. Replace it with a SINGLE
             runCheck carrying the ENTIRE scope file list via a NEW
             check.Options.Files []string field with its own resolution branch
             in pkg/check/scope.go — do NOT overload ScopeModeFile, whose
             single-file semantics drive the standalone --file path and its 2s
             timeout (code_check.go:117); those must be provably untouched.
             Per-pass ScopeKind (step 1) then
             produces the right arg shape from that one invocation: lint gets
             all scoped files as args ONCE; build/typecheck runs project-wide
             ONCE ignoring the list; test is dependency-mapped ONCE with
             full-suite fallback. This is required, not optional — the existing
             loop runs lint N×(1 file) and build N× project-wide, which
             TestCodeCheck_ScopeSemantics_LintFileArgsBuildProjectWide
             (driving CheckScoped with multiple files) asserts against. Do NOT
             change CheckScoped's return type contract ([]gate.Violation, error).

          The implementer runs `backstop code check` after this task per the
          implementer contract; this plan does not duplicate that per-task
          check.
        files:
          - pkg/check/registry.go
          - pkg/check/check.go
          - pkg/check/scope.go
          - pkg/gate/result.go
          - pkg/gate/scope.go
          - cmd/backstop/gate.go
        claims:
          - CLM-008
        depends_on:
          - TASK-015

      - id: TASK-017
        type: verification
        title: "Run backstop code check on per-pass scope semantics and the build-violation exemption"
        description: |
          Fast inner-loop verification of the scope-semantics work. Run:

              backstop code check

          Confirm the mandated
          TestCodeCheck_ScopeSemantics_LintFileArgsBuildProjectWide passes
          (driving CheckScoped with multiple files: lint invoked ONCE with all
          scoped file args; build invoked ONCE project-wide; no per-file loop),
          the gate-layer build-exemption test passes (a build violation with a
          NON-EMPTY parser Rule and ProjectWide==true survives diff-scope
          filtering while lint/semgrep do not), and that the existing gate scope
          tests (step_delegate, scope) and the earlier pkg/check suites remain
          green. No new violations.
        files:
          - pkg/check/registry.go
          - pkg/check/check.go
          - pkg/gate/result.go
          - pkg/gate/scope.go
          - cmd/backstop/gate.go
          - cmd/backstop/gate_scope_test.go
          - pkg/gate/scope_test.go
        claims:
          - CLM-008
        depends_on:
          - TASK-016

