---
plan_id: PLAN-ISSUE-003
spec_id: ISSUE-003
created: "2026-06-11"
status: draft
target_repo: backstop-core
target_module: github.com/bmanson/backstop-core
test_command: "go test ./pkg/check/... ./pkg/config/... ./pkg/gate/... ./cmd/backstop/... -run \"TestCodeCheck|TestConfig\" -race -coverprofile=cover.out"
coverage_threshold: 90

notes: |
  Implements ISSUE-003 — replace the hardwired pass→tool bindings (the flat
  map[CheckType]PassExecutor returned by buildDefaultExecutorsWithRunner at
  pkg/check/check.go:334-351) with a stack-keyed registry where a stack is
  DATA: per pass a {command, format} plus routing extensions and a test
  dependency-mapping knob. Go and TypeScript ship as built-in entries; any
  other stack is declarable in backstop.yml. Selected by Config.Language,
  Go-default when language absent. Builds on ISSUE-002 (real Go executors)
  and ISSUE-005 (compiled-manifest routing + languageExtensions table +
  zero-routable ConfigError exit-2 boundary) — both landed on main.

  The six Ratified Design Constraints in the issue body are SETTLED. Do not
  re-open: (1) TS test command is explicitly declared, no package.json
  detection; (2) scope semantics are per-pass invocation concern; (3)
  build/typecheck violations are NEVER scope-filtered; (4) missing toolchain
  for declared language is exit-2 config error; (5) pack ToolConfig execution
  out of scope; (6) traceability steps stay Go-only.

  ─────────────────────────────────────────────────────────────────────────
  DESIGN DECISIONS made while planning (called out per the prompt):

  1. EXECUTOR GENERALIZATION — preserve-the-four, add-a-generic (hybrid).
     The four existing Go executors (lintExecutor, buildExecutor,
     testExecutor, semgrepExecutor in check.go) carry bespoke behaviors worth
     preserving verbatim: golangci JSON parsing + IsAvailable PATH probe,
     go-build crash-vs-findings guard, testExecutor fileMode package mapping
     (goPackageSelector), semgrep ensurer/config assembly. They REMAIN as the
     `go` stack's registry implementation — zero behavioral change, they just
     move from hardwired defaults to named registry slots. A NEW generic
     commandExecutor (parameterized by command string, parser/format, and a
     per-pass ScopeKind: lint=file-args, build=project-wide, test=dependency-
     mapped-with-fallback) backs the typescript built-in AND every declared
     stack. This is the minimal-churn reading of the issue's "planner picks"
     latitude: bespoke Go behavior is not re-derived through a generic path
     (no regression risk on the landed ISSUE-002 work), while the abstraction
     is still REAL because TS + declared stacks exercise it end-to-end.

  2. CONFIG SCHEMA SHAPE — two new keys under enforcement.
     enforcement.toolchain: map keyed by pass name (lint|build|test) → object
       {command: string (required), format: string (required, one of the
       named parser formats), extensions: []string (optional; declares the
       stack's routable extensions), test_dependency_command: string
       (optional; the per-toolchain dependency-mapping knob for the test
       pass — e.g. "vitest --related", full-suite `command` is the fallback)}.
     enforcement.test_command: string — the explicitly-declared TS/declared-
       stack test command (constraint 1; no package.json detection). Both
       added to artifacts/backstop-yml/v1/schema.json (additionalProperties
       stays false; the strict YAML decode in config.go KnownFields(true) also
       enforced) and to the Enforcement struct in pkg/config/config.go.
     A declared toolchain whose `format` is not a known parser format, or a TS
     stack with no test_command, is a config error (exit 2) — fail-loud, never
     silent skip.

  3. CheckScoped RECONCILIATION — per-pass scope is an invocation concern,
     build/typecheck run project-wide exactly ONCE, and build/typecheck
     violations are exempted from gate scope-filtering via a STRUCTURAL field
     (not string matching).
     TRAP (the integration trap for this plan, traced):
       - cmd/backstop/gate.go realCodeChecker.CheckScoped (gate.go:449-465)
         LOOPS over scope.Files calling runCheck(ScopeModeFile, file) ONCE PER
         FILE. This is wrong under per-pass semantics on BOTH axes: lint runs N
         invocations of 1 file (constraint says ONE invocation with N file
         args) and build/tsc runs project-wide N times. ScopeKind alone cannot
         fix this from INSIDE a single Run — the OUTER per-file loop must go.
         RESOLUTION (UNCONDITIONAL, TASK-016 step 3): replace the per-file loop
         with a SINGLE runCheck carrying the whole scope file list; per-pass
         ScopeKind then decides arg shape — lint: all scoped files as args in
         ONE invocation; build/typecheck: ONE project-wide invocation ignoring
         the list; test: dependency-mapped once with full-suite fallback (Go:
         existing fileMode package mapping; TS: declared test_dependency_command
         with `command` fallback). check.Run/ScopeMode must accept a multi-file
         scope list for this path (carry the explicit file set through Options),
         so a single Run covers all scoped files rather than the gate looping.
       - pkg/gate/step_delegate.go:104 filterViolations(scope, violations)
         filters EVERY code-check violation to in-scope files
         (scope.Contains(violation.File)). Constraint 3 says build/typecheck
         violations must NEVER be scope-filtered: a change to a.ts that breaks
         a type in unchanged b.ts must fail a diff-scoped gate, and that
         violation references out-of-scope b.ts.
         WHY STRING MATCHING ON Rule IS WRONG: the bridge fallback
         (checkViolationsToGate, gate.go:524) only yields Rule=="build" when
         cv.Rule is EMPTY. But the tsc parser (TASK-003) and sarif parser
         POPULATE Rule (e.g. "TS2304", a SARIF ruleId), so a TS typecheck
         violation on an out-of-scope file carries Rule=="TS2304"; a Rule=="build"
         exemption would NOT match it, filterViolations would drop it, and the
         gate would go GREEN on a broken typecheck — the exact silent
         non-enforcement constraint 3 forbids.
         RESOLUTION (STRUCTURAL): add a field to gate.Violation
         (pkg/gate/result.go) — ProjectWide bool, set from the originating
         CheckType (cv.Pass==CheckTypeBuild → ProjectWide=true) — populated in
         checkViolationsToGate (gate.go:519) from cv.Pass, INDEPENDENT of the
         parser-populated Rule. filterViolations (pkg/gate/scope.go:182) exempts
         violations whose ProjectWide is true; lint/test/semgrep keep filtering.
         Build-pass violations are likewise exempt from any scoped-files
         assertion logic in tests (they may legitimately reference out-of-scope
         files). The baseline-comparison step (gate step 7) remains the
         suppression mechanism for pre-existing project-wide violations.

  ─────────────────────────────────────────────────────────────────────────
  HERMETICITY (this repo learned via a literal fork bomb — NO live tool
  invocation in unit tests): all registry/parser/executor unit tests inject
  the CommandRunner seam (RunOptions.Runner / fakeRunner from
  check_test.go:815) and feed fixture tool output; semgrep uses stubEnsurer.
  parseSemgrep/golangci/build/test reuse existing fixtures. New parser tests
  (sarif/regex-lines/eslint-json/tsc) feed static byte fixtures. The TS smoke
  task constructs a temp TS project whose declared toolchain points at a fake
  shell script echoing fixture eslint JSON — proving the declared-stack path
  end-to-end WITHOUT requiring node/eslint/tsc installed, still bounded.

  ─────────────────────────────────────────────────────────────────────────
  ADJACENT ISSUES — design compatibly, do NOT fix:
    - ISSUE-006 (semgrep preamble parsing, golangci exit-3 diagnostics): the
      existing crash-vs-findings guards stay as-is; the known baseline of
      violations the dogfood task expects stems partly from here.
    - ISSUE-007 (exclusion config): the ToolchainEntry / enforcement.toolchain
      object shape leaves room for a future stack-generic `exclude_paths` knob
      to slot in without reshaping the registry — keep the entry an extensible
      object, not a positional tuple.

  ─────────────────────────────────────────────────────────────────────────
  FILE CONTENTION (D-081): pkg/check/check.go is the contention point — the
  registry, generic executor, and parser library all land there (or in
  sibling files in pkg/check). Tasks touching check.go / the registry file are
  SERIALIZED through dependency chains; parser-library and config-schema work
  live in disjoint files and run in parallel phases.

  STRUCTURE:
    Phase 1: Setup — parser/registry/TS/declared/eslint fixtures (disjoint).
    Phase 2: TDD — parser library: sarif + regex-lines generic formats and
             the named-format registry (CLM-005). Disjoint file (parsers.go).
    Phase 3: TDD — registry + go entries + language selection (CLM-001),
             declared-stack-from-config (CLM-002). Serialized on check.go.
    Phase 4: TDD — config schema: enforcement.toolchain + test_command +
             TS test-command-required config error (CLM-004). Parallel to
             Phase 2 file-wise (config + schema), but TS test pass needs the
             registry so it chains after Phase 3.
    Phase 5: TDD — TS executors (eslint-json + tsc parse) (CLM-003) and
             routing (.ts/.tsx + declared extensions) (CLM-006), missing-
             toolchain config error exit-2 across BOTH CLI paths (CLM-007).
    Phase 6: TDD — per-pass scope semantics: lint file-args / build project-
             wide-unfiltered, CheckScoped + filterViolations reconciliation
             (CLM-008).
    Phase 7: Comprehensive verification (full gate, coverage >=90 on
             pkg/check) + dogfood (code check --all, report-only, expect the
             known ~7-violation baseline, flag NEW) + TS-fixture smoke.

phases:
  # ═══════════════════════════════════════════════════════════════════════
  # Phase 1: Setup — fixtures for parsers, registry, TS, declared stacks
  # ═══════════════════════════════════════════════════════════════════════
  - id: phase-1
    name: "Phase 1: Setup — Parser, Registry, TS, and Declared-Stack Fixtures"
    tasks:
      - id: TASK-001
        type: setup
        title: "Create parser-format and toolchain test fixtures (sarif, regex-lines, eslint-json, tsc, TS config)"
        description: |
          Create the static test fixtures every parser/registry/TS test in this
          plan consumes. No production code changes here — fixtures only.

          Under pkg/check/testdata/ (or as fixture literals in a new
          pkg/check/fixtures_toolchain_test.go helper — prefer testdata files
          for the JSON blobs, helpers for tiny strings):
            - sarif-sample.json: a SARIF log with runs[].results[] carrying
              ruleId, level (error AND warning to cover both), message.text,
              and locations[0].physicalLocation.artifactLocation.uri +
              region.startLine — exercising the sarif format parser (CLM-005).
            - eslint-sample.json: an eslint JSON array of
              {filePath, messages:[{ruleId, severity (1 AND 2), message, line}]}
              — for the eslint-json format / TS lint parse (CLM-003, CLM-005).
            - tsc-sample.txt: tsc --noEmit stderr lines of the shape
              `file(line,col): error TSxxxx: message` (and at least one
              multi-line / non-matching line to prove robustness) — for the
              tsc format parse (CLM-003).
            - regex-lines-sample.txt: generic `file:line:col message` lines for
              the regex-lines configurable parser, including a line the default
              pattern should and should not match (CLM-005).
          And TS/declared-stack backstop.yml fixtures under
          pkg/check/testdata/ (or pkg/config/testdata/ for the schema tests —
          keep config-schema fixtures in pkg/config/testdata):
            - declared-stack-backstop.yml: language: rust with
              enforcement.toolchain.{lint,build,test} {command, format:
              regex-lines, extensions} — the declared-stack-as-data shape.
            - ts-backstop.yml: language: typescript with
              enforcement.test_command declared (the explicit TS test command).
            - ts-no-test-command-backstop.yml: language: typescript WITHOUT
              enforcement.test_command — the config-error fixture (CLM-004).

          These fixtures back CLM-002 through CLM-006. Disjoint from every
          other file scope in this plan.
        files:
          - pkg/check/testdata/sarif-sample.json
          - pkg/check/testdata/eslint-sample.json
          - pkg/check/testdata/tsc-sample.txt
          - pkg/check/testdata/regex-lines-sample.txt
          - pkg/check/testdata/declared-stack-backstop.yml
          - pkg/config/testdata/ts-backstop.yml
          - pkg/config/testdata/ts-no-test-command-backstop.yml
        claims:
          - CLM-002
          - CLM-003
          - CLM-004
          - CLM-005
          - CLM-006
        depends_on: []

  # ═══════════════════════════════════════════════════════════════════════
  # Phase 2: TDD — parser library (named formats + generic sarif/regex-lines)
  # ═══════════════════════════════════════════════════════════════════════
  - id: phase-2
    name: "Phase 2: TDD — Output Parser Library (Named Formats + Generic Sarif/Regex-Lines)"
    tasks:
      - id: TASK-002
        type: test
        title: "Write failing tests for the sarif and regex-lines generic parser formats"
        description: |
          Add failing tests to a new pkg/check/parsers_test.go pinning the
          named-format parser library and the two generic formats. They fail
          until TASK-003 (the parsers and the format registry do not yet exist).

          Mandated test names (exact, character-for-character from CLM-005):

            - TestCodeCheck_Parsers_SarifFormat: load sarif-sample.json and
              assert the sarif parser returns violations whose File comes from
              locations[0].physicalLocation.artifactLocation.uri, Line from
              region.startLine, Message from message.text, Rule from ruleId,
              and Severity mapped error/warning from the SARIF `level`
              (default error when level absent). Assert both the error and
              warning fixture rows map correctly.

            - TestCodeCheck_Parsers_RegexLinesFormat: drive the regex-lines
              parser with a configurable named-group pattern (groups
              file/line/col/message) against regex-lines-sample.txt; assert the
              matching line yields a violation with the captured file/line/
              message and severity defaulting to "error", and the non-matching
              line yields nothing.

          Also add a table assertion that the format REGISTRY resolves each
          named format string (golangci-json, go-build, go-test, eslint-json,
          tsc, sarif, regex-lines) to a parser, and an unknown format name
          resolves to an error (fail-loud — feeds the config-error path in
          Phase 4). Tests only; no production edits.
        files:
          - pkg/check/parsers_test.go
        claims:
          - CLM-005
        depends_on:
          - TASK-001

      - id: TASK-003
        type: implementation
        title: "Implement the named-format parser library with sarif and regex-lines"
        description: |
          Make the TASK-002 tests pass in a new pkg/check/parsers.go.

          1. Define a Parser function type that takes raw tool output ([]byte)
             plus a target CheckType and returns ([]Violation, error), matching
             the existing parse* signatures.
          2. Provide a format registry mapping each named format to a Parser:
               - golangci-json → wraps the existing parseGolangciJSON
               - go-build      → wraps the existing parseGoBuildErrors
               - go-test       → wraps the existing parseGoTestFailures
               - eslint-json   → NEW: array of {filePath, messages:[{ruleId,
                 severity 1|2, message, line}]}; map severity 2→error, 1→
                 warning; File=filePath, Rule=ruleId.
               - tsc           → NEW: `file(line,col): error TSxxxx: message`
                 line parse; Rule=TSxxxx, Severity from error/warning keyword.
               - sarif         → NEW: runs[].results[] (ruleId, locations[0].
                 physicalLocation.artifactLocation.uri + region.startLine,
                 message.text, level error/warning, default error).
               - regex-lines   → NEW: configurable pattern with named groups
                 file/line/col/message, severity default error.
          3. Provide a lookup func that resolves a format-name string to a
             Parser or returns an error for an unknown name (fail-loud).

          Keep the existing parse* funcs in check.go UNCHANGED — the registry
          wraps them so there is no behavioral drift on the landed Go parsers.
          The eslint-json/tsc/sarif/regex-lines parsers are new pure functions
          with no tool invocation.

          The implementer runs `backstop code check` after this task per the
          implementer contract; this plan does not duplicate that per-task
          check.
        files:
          - pkg/check/parsers.go
        claims:
          - CLM-005
        depends_on:
          - TASK-002

      - id: TASK-004
        type: verification
        title: "Run backstop code check on the parser library"
        description: |
          Fast inner-loop verification of the parser work. Run:

              backstop code check

          Confirm pkg/check compiles and the mandated parser tests pass
          (TestCodeCheck_Parsers_SarifFormat,
          TestCodeCheck_Parsers_RegexLinesFormat), the format-registry table
          assertions hold (all seven named formats resolve; unknown name
          errors), and the existing Go parser tests remain green (no behavioral
          drift from wrapping parseGolangciJSON/parseGoBuildErrors/
          parseGoTestFailures). No new violations introduced.
        files:
          - pkg/check/parsers.go
          - pkg/check/parsers_test.go
        claims:
          - CLM-005
        depends_on:
          - TASK-003

  # ═══════════════════════════════════════════════════════════════════════
  # Phase 3: TDD — stack-keyed registry, go entries, language selection,
  #          declared-stack-from-config
  # ═══════════════════════════════════════════════════════════════════════
  - id: phase-3
    name: "Phase 3: TDD — Toolchain Registry, Go Built-in Entries, Language Selection, Declared Stacks"
    tasks:
      - id: TASK-005
        type: test
        title: "Write failing tests for registry language selection and declared-stack-from-config executors"
        description: |
          Add failing tests to pkg/check/registry_test.go pinning the stack-
          keyed registry. They fail until TASK-006 (the registry and the
          language-selected executor construction do not yet exist).

          Mandated test names (exact, character-for-character):

            - TestCodeCheck_Registry_SelectsToolchainByLanguage (CLM-001):
              construct executors for Config.Language=="go" and assert the
              resulting map[CheckType]PassExecutor binds the GO built-in entries
              (lint=golangci, build=go build, test=go test, semgrep), and that
              an ABSENT language defaults to the Go stack (preserving current
              behavior). Assert language=="typescript" selects the TS built-in
              entries (eslint/tsc/declared-test/semgrep) — distinct commands
              from the Go stack. Use the CommandRunner seam; assert on the
              constructed executors' identity/binding, NOT on live execution.

            - TestCodeCheck_Registry_CustomToolchainFromConfig (CLM-002): load
              declared-stack-backstop.yml (language: rust, enforcement.toolchain
              per pass with command+format) and assert the registry produces
              working executors for lint/build/test with NO code changes —
              drive each through a fakeRunner returning fixture output and
              confirm the declared format parses it into violations. Assert the
              declared command string is the one passed to the runner.

          Tests only; no production edits.
        files:
          - pkg/check/registry_test.go
        claims:
          - CLM-001
          - CLM-002
        depends_on:
          - TASK-001
          - TASK-004

      - id: TASK-006
        type: implementation
        title: "Implement the stack-keyed toolchain registry with Go built-in entries and a generic command executor"
        description: |
          Make the TASK-005 tests pass. Land the registry in a new
          pkg/check/registry.go and rewire construction in pkg/check/check.go.

          1. Define ToolchainEntry: per pass a {Command string, Format string,
             Extensions []string, TestDependencyCommand string}, an EXTENSIBLE
             object (leave room for ISSUE-007's future exclude_paths — do not
             make it a positional tuple). A Toolchain is a map CheckType →
             ToolchainEntry plus the stack's routable extensions and an
             explicit test command (for TS/declared stacks).
          2. Built-in registry: predefined `go` and `typescript` Toolchains of
             exactly the declared shape. The GO entries' executors REMAIN the
             existing bespoke lintExecutor/buildExecutor/testExecutor/
             semgrepExecutor (DESIGN DECISION 1 — preserve fileMode mapping,
             crash guards, IsAvailable PATH probe verbatim; no behavioral
             change). The TS entries use the NEW generic commandExecutor
             (TASK-006 also introduces it): eslint (eslint-json format, lint
             ScopeKind=file-args), tsc --noEmit (tsc format, build ScopeKind=
             project-wide), and the declared test_command (test ScopeKind=
             dependency-mapped-with-fallback). Semgrep stays the shared
             semgrepExecutor for all stacks.
          3. Generic commandExecutor: parameterized by (command, parser-from-
             format, ScopeKind, runner). Execute splits the command, applies
             ScopeKind (file-args appends scoped files; project-wide ignores
             the scoped list; dependency-mapped uses TestDependencyCommand with
             full-suite `command` fallback), runs via the CommandRunner seam,
             and parses output via the named format. Reuse the existing crash-
             vs-findings guard pattern for project-wide passes.
          4. Replace buildDefaultExecutorsWithRunner's flat map with a
             language-selecting constructor: select the Toolchain by
             Config.Language (Go-default when empty), merge any
             enforcement.toolchain overrides/declarations from config, and build
             the executor map. Plumb Config.Language + enforcement toolchain
             into Options/RunOptions (a Language field and the toolchain config)
             so Run/RunWith can select the stack at invocation time. Keep the
             contracted consumption of pkg/config.Config (the issue's contract:
             pkg/check consumes config.Config) — pass the relevant fields in via
             Options to avoid a hard import cycle if one exists; mirror how
             PinnedSemgrepVersion is already threaded.

          Do NOT change the four Go executors' bodies, the manifest routing
          from ISSUE-005, or the parser funcs. Missing-toolchain config error
          and TS-test-command-required error are added in later phases; this
          task keeps the happy paths green.

          The implementer runs `backstop code check` after this task per the
          implementer contract; this plan does not duplicate that per-task
          check.
        files:
          - pkg/check/registry.go
          - pkg/check/check.go
        claims:
          - CLM-001
          - CLM-002
        depends_on:
          - TASK-005

      - id: TASK-007
        type: verification
        title: "Run backstop code check on the registry and language selection"
        description: |
          Fast inner-loop verification of the registry work. Run:

              backstop code check

          Confirm the two mandated registry tests pass
          (TestCodeCheck_Registry_SelectsToolchainByLanguage,
          TestCodeCheck_Registry_CustomToolchainFromConfig), the Go-default and
          typescript selection branches hold, the declared-stack path produces
          working executors with no code changes, and ALL pre-existing pkg/check
          tests (engine semantics, executor, semgrep, manifest from ISSUE-005)
          remain green — the four Go executors are unchanged in behavior. No new
          violations.
        files:
          - pkg/check/registry.go
          - pkg/check/check.go
          - pkg/check/registry_test.go
        claims:
          - CLM-001
          - CLM-002
        depends_on:
          - TASK-006

  # ═══════════════════════════════════════════════════════════════════════
  # Phase 4: TDD — config schema: enforcement.toolchain + test_command,
  #          TS test-command-required config error
  # ═══════════════════════════════════════════════════════════════════════
  - id: phase-4
    name: "Phase 4: TDD — Config Schema (enforcement.toolchain + test_command) and TS Test-Command Requirement"
    tasks:
      - id: TASK-008
        type: test
        title: "Write failing tests for enforcement.toolchain / test_command schema and the TS test-command config error"
        description: |
          Add failing tests pinning the backstop.yml schema extension and the
          TS test-command requirement. They fail until TASK-009/TASK-010.

          In pkg/config/config_test.go (schema + struct decode):
            - Extend a config-struct test to load a backstop.yml carrying
              enforcement.toolchain (per-pass {command, format, extensions,
              test_dependency_command}) and enforcement.test_command, asserting
              both decode into the Enforcement struct (the strict KnownFields
              decoder must ACCEPT the new keys, and the JSON schema must allow
              them under additionalProperties:false). Assert an UNKNOWN key
              under enforcement.toolchain entry is still rejected (schema
              additionalProperties stays false) — guarding TestConfig_Struct_
              RejectsUnknownKeys's invariant for the new objects.

          Mandated test name (exact, character-for-character from CLM-004),
          placed in pkg/check (the registry/executor layer enforces it):
            - TestCodeCheck_TSTestCommand_ExplicitDeclarationRequired: load
              ts-no-test-command-backstop.yml (language: typescript, NO
              enforcement.test_command) and assert constructing the TS toolchain
              / running the test pass yields a *check.ConfigError (errors.As),
              NOT a silent skip — the TS test pass REQUIRES an explicitly
              declared command (constraint 1, no package.json detection). Add a
              positive case: ts-backstop.yml WITH test_command constructs the
              test executor successfully.

          Tests only; no production edits.
        files:
          - pkg/config/config_test.go
          - pkg/check/ts_executor_test.go
        claims:
          - CLM-004
        depends_on:
          - TASK-001
          - TASK-007

      - id: TASK-009
        type: implementation
        title: "Extend backstop.yml schema and Enforcement struct for toolchain + test_command"
        description: |
          Make the schema/struct half of TASK-008 pass.

          1. artifacts/backstop-yml/v1/schema.json: add under
             enforcement.properties:
               - test_command: {type: string}
               - toolchain: {type: object, additionalProperties: an object with
                 properties command(string,required), format(string,required),
                 extensions(array of string), test_dependency_command(string),
                 additionalProperties:false}.
             Keep enforcement.additionalProperties:false and the existing keys
             intact. (Note: config.go validateAgainstSchema only enforces top-
             level required + additionalProperties + the tier enum; the nested
             toolchain object shape is primarily enforced by the strict YAML
             KnownFields decode against the struct — so the struct fields below
             are the load-bearing validation. Add the schema entries anyway for
             documentation/artifact-validate parity.)
          2. pkg/config/config.go Enforcement struct: add
               TestCommand string `yaml:"test_command,omitempty" json:"test_command,omitempty"`
               Toolchain map[string]ToolchainPass `yaml:"toolchain,omitempty" json:"toolchain,omitempty"`
             and a ToolchainPass struct {Command, Format string; Extensions
             []string; TestDependencyCommand string} with yaml/json tags. The
             KnownFields(true) decoder then accepts the new keys and rejects
             unknown ones inside them.

          The implementer runs `backstop code check` after this task per the
          implementer contract; this plan does not duplicate that per-task
          check.
        files:
          - artifacts/backstop-yml/v1/schema.json
          - pkg/config/config.go
        claims:
          - CLM-004
        depends_on:
          - TASK-008

      - id: TASK-010
        type: implementation
        title: "Enforce TS test-command requirement as an exit-2 config error in the registry"
        description: |
          Make the mandated TestCodeCheck_TSTestCommand_ExplicitDeclarationRequired
