          Delete or rewrite TestCodeCheck_SemgrepExecutor_RunsProjectAndPackConfigs
          to packs-only behavior, and drop the manifestDir: field and the
          standards-dir --config assertions from the other existing cases
          (ToleratesNonJSONPreamble, QuietFlagPassed, PreservesPackNamespacedRuleIDs).
