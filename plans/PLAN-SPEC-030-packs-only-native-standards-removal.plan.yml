target_repo: backstop-core
target_module: pkg/check
test_command: "go test ./pkg/check/ ./cmd/backstop/ -race -coverprofile=cover.out"
coverage_threshold: 80

notes: |
  Implements SPEC-030: collapse locus A (gate-time semgrep rule config) to a
  single source — installed packs. Four coordinated edits:
    1. Delete the manifestDir --config arm from semgrepExecutor (pkg/check).
    2. Remove Options.ManifestDir and every caller that wired the compiled
       standards directory into the semgrep pass (pkg/check + cmd/backstop).
    3. Retire pkg/compile and delete the STD-GO-001 source standard and its
       compiled .backstop/rules/ artifacts in the SAME change (its tests read
       the deleted source standard, so the package must be deleted too).
    4. Dogfood-consume the published backstop/go-standards pack: declare it in
       backstop.yml, install under .backstop/packs/backstop/go-standards/, and
       reconcile backstop.lock (remove stale slotly/go-standards, add the
       matching entry so VerifyLock passes).

  Sharp edges addressed by the task ordering:
    - .backstop/rules/ serves two purposes (routing + rule-config); only the
      rule-config read is removed. Routing must keep reading the BackstopDir
      directory and fall back to defaultManifest() — CLM-008/009/020/022 pin
      both halves so routing is not vacuously emptied.
    - The in-package pkg/check tests that construct semgrepExecutor.manifestDir
      and assert a standards-dir --config must be deleted/rewritten in the same
      change as the field removal (CLM-023), or the build goes red.
    - pkg/compile cannot be left as dead code: its tests open the deleted
      STD-GO-001 source standard, so the whole package is deleted (CLM-021).
    - Lock reconciliation is replace-not-append: remove stale
      slotly/go-standards, add backstop/go-standards so VerifyLock passes.
    - Flag-day removal with no alias: a leftover STD-*.semgrep.yml in
      .backstop/rules/ is never a semgrep --config source (CLM-018/019).

