      - id: TASK-012
        type: implementation
        title: "Declare, install, and lock backstop/go-standards; remove stale slotly entry"
        description: |
          Reconcile the repository to a consistent dogfood state via the
          existing pack-add / lock machinery (SPEC-015/SPEC-017), no new loading
          code:
            - Add backstop/go-standards to backstop.yml's packs: map keyed by
              the manifest name backstop/go-standards.
            - Install the pack under .backstop/packs/backstop/go-standards/
              (its pack.yml and rule tree) in its current layer: 2 form.
            - Reconcile backstop.lock: remove the stale slotly/go-standards
              entry and record the backstop/go-standards content hash so the
              declared/installed/locked sets agree exactly and VerifyLock
              passes.
          Installing the pack and its rule tree is what makes both the
          pack-present tests (TASK-011) and the positive enforcement-transfer
          test (TASK-015 / CLM-025) green: the GO-003 / GO-060 rule files now
          reach the semgrep --config set so the known-bad fixture is flagged.
          Do NOT churn the synthetic slotly/go-standards string literals in
          pkg/check test fixtures — those are self-contained check_id formatting
