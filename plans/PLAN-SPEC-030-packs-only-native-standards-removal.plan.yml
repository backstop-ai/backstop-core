          - CLM-017
        depends_on: []

      - id: TASK-015
        type: test
        title: "Write positive enforcement-transfer test with known-bad Go fixture"
        description: |
          Add the load-bearing enforcement-transfer test that proves the deleted
          native-standards enforcement actually TRANSFERRED to the consumed
          backstop/go-standards pack — closing the vacuous-green gap that the
          pack-present (CLM-016/017) and gate-green-on-clean-code (CLM-015,
          TASK-014) checks leave open. A green gate over clean code cannot
          distinguish "rules enforced, code clean" from "rules silently
          dropped"; this test forces a known-bad Go file to still be CAUGHT.

          In cmd/backstop/dogfood_enforcement_test.go:
            - TestDogfoodPack_FlagsKnownGoViolation: with backstop/go-standards
              consumed as a pack (declared, installed, locked), run a code-check
              / gate semgrep pass over a self-contained known-bad Go fixture that
              violates a pack rule (a package-level global-mutable
              `var $X = ...` for GO-003, or a hardcoded credential such as
              `password := "hunter2"` for GO-060) and assert the run produces at
              least one semgrep Violation whose rule maps to the offending pack
              rule. Pair it with a NEGATIVE CONTROL: the same run over a clean Go
              fixture (e.g. the GO-003 dependency-injection valid form) must
              produce no Violation for that rule, so the test fails if semgrep
              flags everything (mis-wired config) as surely as if it flags
              nothing (dropped rules).

          The known-bad and clean fixtures are self-contained .go files authored
          for this test under cmd/backstop/testdata/dogfood_enforcement/ — NOT
          obtained by deleting the pack's own invalid fixtures (absence of a
          fixture proves nothing about the rule engine). They live under
          testdata/ so the Go toolchain ignores them and they are not part of the
          module's own compile/lint surface. This test depends only on the
          dogfood-pack test task for ordering; the pack-install implementation
          (TASK-012) is what turns it green.
        files:
          - cmd/backstop/dogfood_enforcement_test.go
          - cmd/backstop/testdata/dogfood_enforcement/known_bad.go
          - cmd/backstop/testdata/dogfood_enforcement/clean.go
