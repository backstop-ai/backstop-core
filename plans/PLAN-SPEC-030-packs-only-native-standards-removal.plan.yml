          pin the packs-only --config behavior and remove every dependency on
          the manifestDir field. Add:
            - TestSemgrepExecutor_ConfigArgsFromPacksOnly: construct
              semgrepExecutor with pack-supplied extraSemgrepConfigs and assert
              the recorded runner argv contains exactly one --config per pack
              path and no standards-dir (.backstop/rules) --config.
            - TestSemgrepExecutor_NoConfigWhenNoPacks: with zero
              extraSemgrepConfigs, assert the argv carries no --config flag at
              all.
            - TestSemgrepExecutor_StructHasNoManifestDir: construct the struct
              with an UNKEYED (positional) composite literal of exactly five
              field values (runner, ensurer, backstopDir, pinnedVersion,
              extraSemgrepConfigs) so the test fails to compile if manifestDir
