          Then rebuild and gate the two touched files:
            go build -o bin/backstop ./cmd/backstop
            PATH=/Users/bmanson/go/bin:$PATH ./bin/backstop gate --file pkg/gate/classification.go
            PATH=/Users/bmanson/go/bin:$PATH ./bin/backstop gate --file pkg/gate/classification_test.go

          ONE PATH PER INVOCATION — `--file` is not yet repeatable at this point in
