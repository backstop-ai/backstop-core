  ── CLAIMS ────────────────────────────────────────────────────────────────
  This plan is issue-sourced, so it defines its own claims. Every one is mapped to
  at least one task below.

    CLM-001  THE PRIMARY DEFECT. Under a file-mode scope, a `package_scoped`
             engine is NOT DISPATCHED when the dispatching pack's declared
             `classification:` globs claim none of the scoped files. `gate --file
             .github/workflows/ci.yml` therefore produces no go-test crash.
             Test: TestFileMode_UnclaimedFileSkipsPackageScopedEngine

    CLM-002  THE SKIP IS REPORTED, NEVER SILENT — AND IT SURVIVES THE SCOPE
             FILTER. The non-dispatch emits exactly one violation with
             `Severity: "warning"`, `File: ""` and `ProjectWide: true`, naming the
             pack, the engine and the reason. `ProjectWide` is what carries it
             past `packValidatorStep`'s `FilterViolations` call; without it the
             notice is dropped BEFORE the StepResult exists and the skip is silent
             in production even while the dispatch-layer test passes. Warning
             severity is non-blocking by contract (`blocksVerdict`), so the run's
             exit code is unchanged, but the step reports status "warning" and
             increments StepsWarned — a skipped engine can never be mistaken for
             one that ran clean.
             Tests: TestFileMode_UnclaimedSkipIsReportedNotSilent (dispatch layer),
                    TestPackEngines_UnclaimedSkipSurvivesScopeFilter (STEP layer,
                    POST-FilterViolations)

    CLM-003  ANTI-FALLBACK. The skip NEVER falls through to `binding.ProjectTarget`
             — `gate --file README.md` must not run `go test ./...`. This extends
             the ratified ISSUE-010 CLM-003 rule from the rule-fed branch to the
             project-wide package-scoped branch.
             Test: TestFileMode_UnclaimedSkipNeverFallsBackToProjectTarget

    CLM-004  TESTDATA PATHS ARE NOT PACKAGE TARGETS. Package-target derivation
             drops `testdata` path segments FIRST, through the SAME
             `excludeTestdataPaths` the rule-fed branch uses — not a second copy.
             `--file pkg/gate/testdata/x.go` does not derive `./pkg/gate/testdata`
             (which fails `[setup failed]`), and an all-testdata scope lands in
             the CLM-001 skip.
             Test: TestFileMode_TestdataPathsAreNotPackageTargets

    CLM-005  THE CLAIM IS PER-PACK, NOT THE MERGED UNION. A pack that claims none
             of the scoped files skips even when a DIFFERENT installed pack claims
             them. Read `manifest.Classification` off the dispatching manifest,
             never the cross-pack merged classifier `buildGateSteps` assembles.
             Test: TestFileMode_ClaimIsPerPackNotMergedUnion

    CLM-006  CAPABILITY-ABSENT ≠ CLAIMS-NOTHING. A pack declaring
             `package_scoped: true` with NO classification globs PRESERVES today's
             derivation SHAPE — no claim check, no testdata drop — and emits a
             DISTINCT capability-absent advisory carrying the SAME
             `Severity: "warning"` / `File: ""` / `ProjectWide: true` shape as
             CLM-002's notice, distinguishable from it only in Rule and wording. A
             missing declaration must never become a silent skip (the ISSUE-112
             shape). The (C') derivation is ALSO all-files-deduped (CLM-007's
             rule, applied through the carve-out) so a MULTI-file (C') scope
             cannot re-manufacture DEFECT-4 by testing only `Files[0]` while
             reading as thorough.
             Tests: TestFileMode_UndeclaredClassificationPreservesDerivationAndWarns,
                    TestFileMode_UndeclaredClassificationDerivesEveryScopedFile

    CLM-007  EVERY CLAIMED FILE BECOMES A TARGET, NOT JUST `Files[0]`. The
             derivation yields one deduped package selector per claimed file in
             stable input order. Without this, CLM-009 would manufacture a false
             green: a multi-file invocation that tests exactly one package while
             reading as thorough.
             Test: TestFileMode_AllScopedFilesBecomePackageTargets

    CLM-008  THE PREDICATE IS A NAMED, TESTED SEAM ON SourceClassifier, NOT AN
             AD-HOC GLOB LOOP IN cmd/. `ClaimsPath` answers source OR test (the
             UNION), which is deliberately DIFFERENT from `IsMeasurableSource`
             (source AND NOT test) — a `_test.go` file IS claimed. A companion
             predicate distinguishes "declared nothing" from "declared, no match"
