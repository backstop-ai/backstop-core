  DEFECT-4 — ALSO FOUND DURING FALSIFICATION, AND IT IS COUPLED TO DEFECT-2.
  `fileModeTestTarget` derives its package target from `scope.Files[0]` ONLY
  (`pack_gate_filemode.go`, the single `goTestPackageSelector(scope.Files[0])`
  call). Today `--file a.go b.go` already accumulates via positional args, so
  files 2..n are ALREADY never tested. Fixing DEFECT-2 without fixing this would
  make a multi-`--file` run look thorough while testing exactly one package — a
  FALSE GREEN manufactured by this very plan. CLM-007 closes it.

  ── THE ROOT CAUSE, STATED PRECISELY ──────────────────────────────────────
  `fileModeTestTarget` (`cmd/backstop/pack_gate_filemode.go`) fires whenever the
  scope is `GateScopeModeFile` and the binding declares `PackageScoped: true`. It
  then calls `goTestPackageSelector(scope.Files[0])`, which returns `"./" + dir`
  with NO check that the pack dispatching the engine has any interest in that file
  at all. `./.github/workflows` is handed to `go test`; there is no Go package
  there; `go test` exits non-zero with no test output; the binding declares
  `crash_guard: true`, so `runFindingsEngine`'s CrashGuard branch
  (`pack_gate.go`, the `binding.CrashGuard && runErr != nil &&
  len(checkViolations) == 0` guard) reports a legitimate no-op as an engine crash.

  The missing question is NOT "does this directory contain Go code" — asking that
  in core would BAKE A LANGUAGE, which CLAUDE.md's first principle forbids
  outright. The missing question is:

      DOES THE PACK DISPATCHING THIS ENGINE CLAIM ANY FILE IN THIS SCOPE?

  That question is answerable from PACK DATA that already exists and is already
  parsed: the top-level `classification:` block (`pack.Classification`,
  `pkg/pack/manifest.go`), which the installed go-toolchain pack declares as
  source `**/*.go`, test `**/*_test.go` + `**/testdata/**`. Core carries no `.go`
  literal; the pack says what it owns. This is the SPEC-043 seam, reused.

  ── DESIGN: THREE STATES, NOT TWO ─────────────────────────────────────────
  The current signature `fileModeTestTarget(binding, scope) (string, bool)` has
  only two states and that is why the defect exists. The fix needs three, and the
  implementer must make the three-ness STRUCTURAL (a small result type or a named
  enum), not two bools a future reader can collapse:

    (A) NOT APPLICABLE — not file-mode, or the binding is not PackageScoped.
        Behavior: unchanged. Caller appends `binding.ProjectTarget`. Diff scope
        and `--all` land here and MUST keep running `./...` (CLM-013).

    (B) TARGETS DERIVED — the pack claims one or more scoped files. Behavior:
        append ONE deduped package selector PER CLAIMED FILE, in stable input
        order (CLM-007). Not `Files[0]`.

    (C) PACK CLAIMS NOTHING IN SCOPE — the pack declares classification globs and
        none of the scoped files match. Behavior: DO NOT DISPATCH THE ENGINE AT
        ALL, and SAY SO (CLM-001, CLM-002).

  And one carve-out that is NOT a fourth state but a guard on (C):

    (C') PACK DECLARES `package_scoped: true` BUT NO CLASSIFICATION GLOBS. The
        pack has not told us what it owns, so "claims nothing" is UNKNOWABLE, not
        FALSE. Collapsing (C') into (C) would turn a missing declaration into a
        silent skip — the exact vacuous-green shape ISSUE-112 filed. Behavior:
        PRESERVE today's derivation and emit a DISTINCT capability-absent
        advisory (CLM-006).

        (C') DERIVES FROM EVERY SCOPED FILE, NOT `Files[0]` — CLM-007'S RULE
        APPLIES HERE TOO, AND THIS IS A STATED DECISION. "Preserve today's
        derivation" means preserve its SHAPE (no claim check, no testdata drop),
        NOT preserve its arity. Once TASK-008 makes `--file` repeatable, a
        `Files[0]`-only (C') would test exactly ONE package while reading as
        thorough for a multi-file scope — DEFECT-4 re-manufactured through the
        carve-out door instead of the main one. So (C') emits one deduped
        `goTestPackageSelector` result per scoped file, in stable input order,
        exactly as (B) does. Every single-file scope is unaffected, which is why
        the shipped (C') tests stay green.

        (C') DELIBERATELY DOES **NOT** DROP TESTDATA, AND THAT RESIDUAL IS NAMED
        RATHER THAN HIDDEN. SE1's testdata drop is sequenced with the claim check
        and belongs to it; applying it in (C') would create a state with an EMPTY
        target list and no honest answer (skipping would be the silent-skip
        ISSUE-112 shape (C') exists to prevent; `ProjectTarget` would be the
        `./...` fallback CLM-003 forbids). So `--file pkg/x/testdata/y.go` against
        a pack that declares NO classification still derives `./pkg/x/testdata`
        and still fails `[setup failed]` — EXACTLY as it does at HEAD today. That
        is PRE-EXISTING behavior this plan neither fixes nor deepens; CLM-004
        closes the door only for packs that declare what they own. Do not "tidy"
        this by adding the drop.

        THIS IS ALSO WHAT KEEPS FOUR SHIPPED TESTS GREEN. `selfTargetManifest()`
        and `producerFindingsPack()` build manifests with no `classification:`
        block; their tests assert `./pkg/foo` / `./pkg/widget` derivation. (C')
        is why they keep passing. Verify this rather than assuming it — if either
        fixture DOES declare classification, say so in the report instead of
        weakening the test.

  ── WHY (C) IS A SKIP AND NOT A `./...` FALLBACK ──────────────────────────
  Falling back to `ProjectTarget` would run the entire Go test suite because
  someone ran `gate --file README.md`. That is both a scope lie and a ~50s
  regression on the fast per-file loop. It is also precisely the ANTI-FALLBACK
  contract the rule-fed branch already carries (ISSUE-010 CLM-003, spelled out in
  `pack_gate.go`: "when the resulting list is EMPTY, NOTHING is appended … It must
  NEVER fall through to the directory branch above"). This plan extends that same
  ratified rule to the project-wide package-scoped branch. CLM-003 pins it so a
  future reader cannot "helpfully" restore a fallback.

  ── WHY (C) IS LOUD AND NOT SILENT ────────────────────────────────────────
  A silent skip is a smaller lie than a crash but it is still a lie: the operator
  reads PASS and cannot tell whether the test engine ran. DIR-032's whole subject
  is verdicts that read authoritative and are not. So the skip emits a
  `severity: "warning"` violation naming the pack, the engine, and the reason.
  Warning severity is NON-BLOCKING BY CONTRACT — `blocksVerdict`
  (`pkg/gate/policy.go`) returns false for exactly `"warning"`, and `StepVerdict`
  maps warning-only findings to status "warning", counted in
  `GateResult.StepsWarned` and rendered in the human summary. Exit code stays 0.
  This is "loud ≠ blocking" applied literally.

  ── THE ADVISORY'S SCOPE FIELDS ARE MANDATED, NOT THE IMPLEMENTER'S CHOICE ─
  BOTH new advisories — the (C) skip notice and the (C') capability-absent notice
  — MUST be constructed with these three fields exactly:

      Severity:    "warning"
      File:        ""            ← MANDATED EMPTY
      ProjectWide: true          ← MANDATED TRUE

  (plus a DISTINCT `Rule` per state, and `SourcePack: manifest.NormalizedName`).
  Leaving this unspecified is not a detail — it makes CLM-002 unsatisfiable, and
  both halves below were measured against the real code, not reasoned about.

  (i) WITHOUT `ProjectWide: true` THE ADVISORY IS SILENTLY DROPPED IN PRODUCTION.
      Everything `runFindingsEngine` returns flows up through
      `dispatchPackEngines` into `packValidatorStep`, which runs
      `violations = activeScope.FilterViolations(violations)` (`cmd/backstop/
      gate.go`, the ISSUE-070 filter) BEFORE the StepResult is built.
      `filterViolations` (`pkg/gate/scope.go`) keeps a violation ONLY when
      `ProjectWide == true`, OR when `File != ""` AND `scope.Contains(File)`. A
      `File: ""` / `ProjectWide: false` advisory therefore never reaches the
      StepResult at all: `pack_engines` reports `pass` with zero violations,
      `StepsWarned` never increments, and the skip is SILENT — CLM-002 FALSE end
      to end. Worse, it would be INVISIBLY false: CLM-002's dispatch-layer test
      drives `dispatchPackEngines` directly, which sits PRE-filter, so it stays
      green while the real gate is vacuous. That is exactly why CLM-002 ALSO
      mandates a POST-filter, STEP-layer assertion
      (TestPackEngines_UnclaimedSkipSurvivesScopeFilter, TASK-004).

      `File: ""` is the honest value, not a workaround. State (C) exists PRECISELY
      because no scoped file is attributable to this pack, and (C')'s notice is
      about a missing DECLARATION rather than a file. Naming an arbitrary
      `scope.Files[0]` to sneak past the filter would attach a dispatch-level
      notice to a file that has nothing to do with it and would make its baseline
      identity depend on argument order.

      THE `ProjectWide` STAMPING BLOCK DOES NOT FORBID THIS, AND THE IMPLEMENTER
      MUST SAY SO IN A COMMENT AT THE CONSTRUCTION SITE. That block in
      `pack_gate.go` (the SPEC-041 REQ-004/CLM-012 bridge, `exempt :=
      binding.ExemptFromScopeFilter`) governs violations PRODUCED BY THE TOOL:
      each carries ITS binding's DECLARED exemption and no sniff may override it.
      These two advisories are CORE-EMITTED dispatch DECISIONS — no tool produced
      them, and no binding declaration describes them. Here `ProjectWide` carries
      its operational meaning, which is filterViolations' own stated contract:
      "not attributable to one scoped file, do not scope-drop it." Note also that
      `ProjectWide` is `json:"-"` and EXCLUDED from `EnrichViolationIdentity`
      (which folds only Rule|File|RegionHash(Message|Severity|SourcePack)), so
      setting it cannot destabilize baseline identity for anything.

  (ii) THE BASELINE RATCHET DOES NOT RED THIS RUN — AND THE REASON IS CONFIGURED,
      NOT ACCIDENTAL. The question is real, not theoretical: `.backstop/
      baseline.json` holds 174 warning-severity entries out of 308, so warnings
      genuinely ride the baseline in this repo. And `computeBaselineResult`
      (`pkg/gate/gate.go`) hardcodes `Status: "fail"` whenever
      `comparison.NewViolations` is non-empty, with NO severity filter ANYWHERE on
      that path — not in `accumulatedViolations`, not in `CompareBaseline`. A
      brand-new project-wide warning WOULD red an unpoliced consumer.

      IT DOES NOT RED backstop-core. `backstop.yml` declares a NON-EMPTY
      `enforcement.policy` table (7 dimensions: artifact_status_drift,
      artifact_validation, contract_signature, coverage_threshold, pack_engines,
      test_substantiveness, test_verification), and `ApplyPolicy`
      (`pkg/gate/policy.go`) NEUTRALIZES the aggregate `baseline_comparison` step
      to `skipped` whenever ANY policy is configured — "per-dimension applies-to
      supersedes it". `pack_engines` then reaches its verdict through
      `applyScopedPolicy` (it declares a `sources:` override for
      backstop-ai/backstop-self), where a violation failing `blocksVerdict`
      increments `warned` and is NEVER appended to `blocking`. Result: status
      "warning", `Pass` untouched, exit 0.

      SO CLM-002 ("status warning, StepsWarned incremented") AND TASK-006 ("both
      must exit 0") ARE BOTH SATISFIABLE AND DO NOT CONTRADICT EACH OTHER.

      THIS PLAN ADDS NOTHING TO `.backstop/baseline.json` AND REQUIRES NO BASELINE
      REFRESH. A baseline entry would be inert anyway: a file-mode scope REVOKES
      grandfathering for touched files (`scopeTouches`, `pkg/gate/baseline.go`),
      and an entry with `File: ""` can never be scope-matched in the first place.

      THE RESIDUAL IS REAL AND IS A REPORT, NOT A FIX. The aggregate baseline
      step's severity-blindness — a warning-only `NewViolations` set hardcoding
      "fail" — is PRE-EXISTING, already applies to those 174 entries, and bites
      only a consumer that has declared NO `enforcement.policy`. Fixing it would
      change verdict semantics for every backstop consumer and is emphatically not
      this plan's to decide. If TASK-006 or TASK-012 OBSERVES the advisory
      blocking a run, the position above is falsified: REPORT it as a required
      successor issue, never resolve it by downgrading the advisory to silence.

  ── SHARP EDGES ───────────────────────────────────────────────────────────
  SE1. TESTDATA IS A REAL RESIDUAL, AND CLASSIFICATION ALONE DOES NOT COVER IT.
       The go-toolchain pack folds `**/testdata/**` into its TEST globs, so a
       `.go` file under `testdata/` IS claimed by the pack — state (B) — and the
       naive derivation would emit `./pkg/gate/testdata`. Probed for real at HEAD:

           $ go test ./pkg/gate/testdata
           found packages contractfix (...) and testdata (...) in .../pkg/gate/testdata
           FAIL  github.com/.../pkg/gate/testdata [setup failed]

       Same false RED, different door. The derivation MUST drop testdata paths
       first. Reuse `excludeTestdataPaths` (`cmd/backstop/pack_gate.go`) — do NOT
       write a second one. It is already the shipped, precedented, deliberately
       language-neutral policy (ISSUE-040; its own comment: "no Go, tool, or
       extension nouns", exact segment match, so `testdata_util.go` and
       `mytestdata/` are NOT dropped). Order matters: drop testdata, THEN ask the
       pack what it claims. A scope of only-testdata files therefore lands in
       state (C), which is correct — testdata is inert data.

  SE2. THE CLAIM CHECK IS PER-PACK, NEVER THE MERGED UNION. `buildGateSteps`
       (`cmd/backstop/gate.go`, the loop appending
       `manifest.Classification.Source/Test`) builds a MERGED classifier across
       all installed packs, for coverage. Using that here would be a defect in a
       multi-language repo: a `.ts` file claimed by a TypeScript pack would make
       the GO pack's test engine fire and crash exactly as today. `runFindingsEngine`
       already receives the dispatching `manifest` — read
       `manifest.Classification` off THAT. CLM-005 falsifies the merged-union
       mistake directly.

  SE3. `ClaimsPath` IS NOT `IsMeasurableSource`. `IsMeasurableSource` is
       `source AND NOT test` — it deliberately EXCLUDES `_test.go` files. Reusing
       it here would mean `gate --file pkg/foo/foo_test.go` claims nothing and
       skips the test engine, which is absurd. The predicate needed is the UNION:
       `source OR test`. Add a new method; do not repurpose the existing one.

  SE4. THE BASELINE QUESTION IS ALREADY SETTLED ABOVE — VERIFY THE POSITION, DO
       NOT RE-DECIDE IT. The scope-fields section states it: `ProjectWide: true` /
       `File: ""`, NO baseline entry, NO baseline refresh, and the aggregate
       ratchet neutralized by the configured `enforcement.policy`. What remains is
       CONFIRMATION, because a stated position verified by reading is still only
       a reading: run a real
       `./bin/backstop gate --file .github/workflows/ci.yml` and confirm the
       END-TO-END verdict is PASS with exit 0 — not merely that pack_engines
       stopped failing — and that `pack_engines` reports status "warning" with
       StepsWarned incremented. If the advisory DOES surface as a blocking NEW
       violation, the stated position is FALSIFIED: report it as a required
       successor issue against the baseline step's severity-blindness. Never
       resolve it by downgrading the advisory to silence.

  SE5. `--file` MUST USE `StringArrayVar`, NOT `StringSliceVar`. `StringSliceVar`
       splits on commas, so a path containing a comma would be silently split into
       two nonexistent paths — a new silent-corruption bug replacing the old one.
       `StringArrayVar` / `GetStringArray` do not split. The read site changes from
       `cmd.Flags().GetString("file")` to `GetStringArray`, and every remaining
       `fileValue != ""` test becomes `len(fileValues) > 0`. Be precise about
       WHICH tests those are: of the three mutual-exclusion guards
       (`cmd/backstop/gate.go:128-136`), only TWO reference `fileValue` —
       `allFlag && fileValue != ""` and `baseValue != "" && fileValue != ""`.
       The middle guard, `baseValue != "" && allFlag`, does NOT mention
       `fileValue` at all and needs NO change. The scope-mode branch's
       `fileValue != ""` test also becomes `len(fileValues) > 0`. All three
       guard MESSAGES stay verbatim regardless.

  SE6. THE `Use:` STRING ALREADY LIED AND MUST STOP. `Use: "gate [--all | --file
       FILE [FILE...] | --base REV]"` (`cmd/backstop/gate.go`) advertises exactly
       the repeatable shape that does not work — the issue names this as what
       invites the mistake. Update it to spell the repeat form, and update the
       flag's help text ("scope gate to one or more explicit files") to say that
       `--file` may be repeated AND that trailing positional paths accumulate.
       No test pins the current `Use:` string (verified by grep), so this is a
       free correction — but the cobra-cli-standards pack is installed, so run the
       gate after touching the command surface rather than assuming.

  SE7. TWO SHIPPED TESTS BREAK ON THE SIGNATURE/FLAG-TYPE CHANGE AND MUST BE
       REWRITTEN IN PLACE, KEEPING THEIR NAMES:
         * `TestPackageScoped_KeyedOnDeclaredFlagNotName`
           (`cmd/backstop/pack_gate_filemode_test.go`) calls
           `fileModeTestTarget(binding, scope)` directly and asserts the 2-value
           return. It is the CLM-024 declared-flag-vs-name-sniff guard — that
           property is UNCHANGED by this plan and the test must keep proving it.
           Adapt the call to the new shape; do not delete the assertions.

           THE MANIFEST IS `divergentFlagsManifest(t)` AND IT PUTS THIS TEST IN
           STATE (C') — A STATED DECISION, NOT AN OVERSIGHT. That helper
           (`cmd/backstop/pack_gate_golint_test.go`) parses
           `pkg/pack/testdata/pack-divergent-flags.yml`, which declares NO
           top-level `classification:` block (verified by reading the fixture).
           So post-fix, BOTH halves of this test — the `package-scoped-divergent`
           and `go-test-named-no-pkgscope` bindings — resolve through the (C')
