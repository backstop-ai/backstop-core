               the (C') block in DESIGN: preserving arity would re-manufacture
               DEFECT-4 through the carve-out once `--file` repeats). Signal
               capability-absent. The testdata non-drop here is DELIBERATE and
               already stated; do not "tidy" it into a drop.
            3. Drop testdata paths via the EXISTING `excludeTestdataPaths` in
               pack_gate.go. Do not write a second implementation (SE1).
            4. Retain the files the classifier CLAIMS.
            5. Empty after 3+4 → state (C). Non-empty → state (B): one
