             Tests: TestSourceClassifier_ClaimsPathUnionsSourceAndTestGlobs,
                    TestSourceClassifier_ClaimsPathIsNotMeasurableSource,
                    TestSourceClassifier_ClaimsPathFalseWithNoDeclaredGlobs

    CLM-009  THE SECONDARY DEFECT. `--file` is REPEATABLE and ACCUMULATES.
             `--file a --file b` scopes BOTH; no occurrence is silently dropped.
             Test: TestGate_FileFlagIsRepeatableAndAccumulates

    CLM-010  NON-REGRESSION ON THE SHAPE THAT ALREADY WORKED. `--file a b` (one
