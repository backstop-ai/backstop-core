phases:
  - id: phase-1
    name: "Phase 1: The pack-claim predicate (pkg/gate seam)"
    tasks:
      - id: TASK-001
        type: test
        title: "Red tests for SourceClassifier.ClaimsPath and the declared-vs-unmatched distinction"
        description: |
          Write the failing tests for the new classification predicates in
          pkg/gate/classification_test.go. These are pure data+match tests — no
          gate run, no pack install, no fixtures on disk.

          THREE PROPERTIES, EACH ITS OWN TEST:

          1. TestSourceClassifier_ClaimsPathUnionsSourceAndTestGlobs
             Construct `NewSourceClassifier([]string{"**/*.go"},
             []string{"**/*_test.go", "**/testdata/**"})` — the installed
             go-toolchain pack's real declaration, not an invented one. Assert
             ClaimsPath is TRUE for `pkg/foo/bar.go`, `pkg/foo/bar_test.go`,
             `main.go` (root-level: the doublestar zero-leading-segment property
             matters here, and gobwas-style globbing would wrongly miss it) and
             `pkg/gate/testdata/x.go`. Assert FALSE for
             `.github/workflows/ci.yml`, `README.md`,
             `specs/SPEC-018-gate-diff-scope.spec.md`. Those three false cases are
             the issue's reproductions expressed at the predicate level.

          2. TestSourceClassifier_ClaimsPathIsNotMeasurableSource
             THE ANTI-SHORTCUT GUARD (SE3). With the same classifier, assert that
             for `pkg/foo/bar_test.go` ClaimsPath is TRUE while
             IsMeasurableSource is FALSE. Without this, a future reader "simplifies"
             ClaimsPath into IsMeasurableSource and `gate --file
             pkg/foo/foo_test.go` silently stops running that package's tests —
             a vacuous green strictly worse than the crash this plan removes.

          3. TestSourceClassifier_ClaimsPathFalseWithNoDeclaredGlobs
             Construct `NewSourceClassifier(nil, nil)`. Assert ClaimsPath is FALSE
             for every path — AND assert the companion predicate that reports
             "this classifier declares nothing" is FALSE, so a caller can tell
             UNKNOWABLE apart from CLAIMS-NOTHING. CLM-006 is unanswerable without
             that distinction. `HasSourceGlobs`/`HasTestGlobs` already exist; the
             companion may compose them rather than store new state — decide in
             TASK-002, but the test must pin the OBSERVABLE distinction either way.

          PREDICTED RED: compile failure — `ClaimsPath` undefined. Record the
          actual compiler text.
        files:
          - pkg/gate/classification_test.go
        claims:
          - CLM-008
        depends_on: []
        test_names:
          - TestSourceClassifier_ClaimsPathUnionsSourceAndTestGlobs
          - TestSourceClassifier_ClaimsPathIsNotMeasurableSource
          - TestSourceClassifier_ClaimsPathFalseWithNoDeclaredGlobs

      - id: TASK-002
        type: implementation
        title: "Add ClaimsPath and the declares-anything predicate to SourceClassifier"
        description: |
          Add the predicates to pkg/gate/classification.go. This file is the
          SPEC-043 language-neutral seam: it holds declared globs plus match logic
          and ZERO language knowledge. Keep it that way — no extension literal, no
          ecosystem noun enters this file.

          ClaimsPath(path string) bool — TRUE when the path matches at least one
          declared SOURCE glob OR at least one declared TEST glob. Normalize the
          path through the same `NormalizePath("", path)` the existing predicates
          use, and match through the same `matchesAnyGlob` helper, so all three
          predicates agree on path form and on malformed-glob handling (a bad glob
          is a non-match, never a match-everything).

          THE UNION IS THE POINT AND THE DOC COMMENT MUST SAY WHY. Spell out that
          this deliberately DIFFERS from IsMeasurableSource's `source AND NOT test`:
          the question here is "does this pack own this file at all", and a test
          file is owned. State the consequence of getting it wrong (a `_test.go`
          file would stop running its own package's tests).

          Add the companion predicate that reports whether the classifier declares
          ANY globs at all — the UNKNOWABLE-vs-CLAIMS-NOTHING distinction TASK-001
          pinned. Composing the existing HasSourceGlobs/HasTestGlobs is fine and
          preferred over new state.

          Nothing else in this file changes. Do not touch IsMeasurableSource,
          IsTestFile, or the constructor.
        files:
          - pkg/gate/classification.go
        claims:
          - CLM-008
        depends_on:
          - TASK-001

      - id: TASK-003
        type: verification
        title: "Gate the pkg/gate classification seam"
        description: |
          Run `go test ./pkg/gate/... -race -count=1` UNFILTERED — not `-run`
