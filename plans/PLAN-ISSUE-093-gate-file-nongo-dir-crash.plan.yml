  - id: phase-2
    name: "Phase 2: File-mode package-target derivation (the primary defect)"
    tasks:
      - id: TASK-004
        type: test
        title: "Red tests for the three-state file-mode derivation, plus the two shipped-test rewrites"
        description: |
          All work in cmd/backstop/pack_gate_filemode_test.go. Drive the decision
          function DIRECTLY where the property is about derivation, and drive
          `dispatchPackEngines` / `runFindingsEngine` where the property is about
          whether a process actually ran — the second kind cannot be proven by
          inspecting a returned string.

          Build fixture manifests IN-PACKAGE. `divergentFlagsManifest(t)`,
          `selfTargetManifest()`, `producerFindingsPack(t, ...)` and
          `goToolchainManifest(t)` already exist in this package; extend or mirror
          them rather than inventing a parallel fixture vocabulary. You will need
          at least one manifest that DECLARES classification globs and one that
          declares NONE — verify which of the existing helpers is which by reading
          them, and say so in the report (SE7 depends on this fact).

          MANDATED TESTS:

          TestFileMode_UnclaimedFileSkipsPackageScopedEngine (CLM-001) — THE
          DEFECT. A pack declaring source `**/*.go` / test `**/*_test.go`, an
          engine with `PackageScoped: true`, `ScopeKind: ProjectWide`,
          `ProjectTarget: "./..."`, `CrashGuard: true`, and a file-mode scope of
          `[".github/workflows/ci.yml"]`. Assert through a recording runner that
          the engine's command was NEVER INVOKED. Asserting only "no crash error
          returned" is too weak — it would pass if the engine ran and happened to
          exit zero.

          TestFileMode_UnclaimedSkipIsReportedNotSilent (CLM-002) — same setup;
          assert EXACTLY ONE violation is returned, that its Severity is
          `"warning"`, that its Message names the pack and the engine, and that
          `ProjectWide` is TRUE while `File` is EMPTY. Assert the severity string
          literally: `blocksVerdict` matches `"warning"` and nothing else, so
          `"warn"` or `"info"` would silently become BLOCKING and turn this fix
          into a new false RED. Assert the two scope fields literally too — they
          are the fields the NEXT test proves are load-bearing.

          TestPackEngines_UnclaimedSkipSurvivesScopeFilter (CLM-002) — THE
          POST-FILTER PROOF, AND IT IS NOT REDUNDANT WITH THE TEST ABOVE. Every
          other test in this file drives `dispatchPackEngines` /
          `runFindingsEngine`, which sit BEFORE `packValidatorStep`'s
          `activeScope.FilterViolations(violations)` call. A `File: ""` /
          `ProjectWide: false` advisory passes every one of them and is still
          DROPPED in production, leaving `pack_engines` reporting `pass` with zero
          violations — CLM-002 false end to end with a green test suite. So this
          test asserts at the STEP layer, AFTER the filter. Two acceptable shapes,
          implementer's choice — say which was used and why:
            (a) take the violations returned by a REAL `dispatchPackEngines` /
                `runFindingsEngine` call driven with the unclaimed-file scope, and
                feed THAT slice through `(*gate.GateScope).FilterViolations` with a
                GateScopeModeFile scope whose Files do NOT include the advisory's
                file; assert the advisory SURVIVES and that `gate.StepVerdict` over
                the surviving set returns `"warning"` (not `"pass"`, not `"fail"`).
