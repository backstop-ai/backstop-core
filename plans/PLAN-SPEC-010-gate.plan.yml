      - id: TASK-018
        type: implementation
        title: "Implement contract signature verification step function"
        description: |
          Create pkg/gate/step_contract.go with:

          Type ContractEntry struct:
            - File string
            - Name string
            - Kind string // "function", "type", "variable", "interface"
            - Signature string

          Function StepContractSignature(contracts []ContractEntry) StepFunc:
            - For each contract entry:
              - Parse the declared file using go/ast
              - Search for the declared symbol by name and kind
              - If not found → violation "symbol not found"
              - If found, compare signature against declared signature
              - If signature differs → violation with expected vs actual
            - Returns StepResult with step_name "contract_signature"

          Helper functions:
            - findFunction(file *ast.File, name string) (string, bool) —
              find function declaration and extract signature
            - findType(file *ast.File, name string) (string, bool) —
              find type declaration
            - findInterface(file *ast.File, name string) (string, bool) —
              find interface declaration
            - normalizeSignature(sig string) string — normalize whitespace
              for comparison

          Uses go/ast parsing for reliable signature extraction rather than
          regex/grep which would be fragile for multi-line signatures.
        files:
          - pkg/gate/step_contract.go
        claims:
          - CLM-051
          - CLM-052
          - CLM-053
          - CLM-054
        depends_on:
