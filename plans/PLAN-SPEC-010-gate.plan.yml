      - id: TASK-021
        type: implementation
        title: "Implement gate orchestrator"
        description: |
          Create pkg/gate/gate.go with:

          Type Gate struct:
            - Steps []StepFunc — ordered list of nine step functions
            - ConfigError error — set when config loading fails

          Function New(opts ...Option) *Gate:
            - Functional options pattern for injecting step implementations
            - Default steps use the concrete implementations from prior phases
            - Options allow test overrides (mock validators, mock checkers)

          Method (g *Gate) Run(ctx context.Context) (GateResult, int):
            - If ConfigError is set → return empty GateResult and exit code 2
            - Execute each step in order
            - After each step, check for config error flag on StepResult
              (from delegated steps)
            - If config error detected → halt remaining steps, return exit 2
            - After all steps execute, aggregate into GateResult via
              NewGateResult()
            - Return exit code: 2 if config error, 1 if any fail, 0 otherwise

          Function ExitCode(result GateResult, configErr error) int:
            - 2 if configErr != nil
            - 1 if any step has status "fail"
            - 0 otherwise (pass + skipped = 0)

          The orchestrator is the central coordination point — it owns the
          step ordering (REQ-001), continue-after-failure (REQ-001),
          halt-on-config-error (REQ-009), and exit code semantics (REQ-009).
