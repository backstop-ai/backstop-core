      - id: TASK-012
        type: implementation
        title: "Implement test verification and substantiveness step functions"
        description: |
          Create pkg/gate/step_testverify.go with:

          Function StepTestVerification(specDir string) StepFunc:
            - Parse all specs in specDir to extract claims with mandated test names
            - For each mandated test name, grep test files (*_test.go) for
              "func TestName(t *testing.T)" pattern
            - Missing function → add violation
            - Returns StepResult with step_name "test_verification"

          Function StepTestSubstantiveness(specDir string) StepFunc:
            - For each mandated test function found (from step 3 results or
              independently), parse the Go test file using go/ast
            - Check (a): function body contains at least one call to a function
              from the package under test (derived from spec's implementation.package)
            - Check (b): function body contains at least one assertion
              (t.Fatal, t.Error, t.Errorf, t.Fatalf, or comparison patterns)
            - Hollow (no assertions) → violation
            - No target package call → violation
            - Returns StepResult with step_name "test_substantiveness"

          Helper functions:
            - extractMandatedTests(specDir string) []MandatedTest — parses specs,
              extracts claims and test names
            - hasAssertions(funcBody *ast.BlockStmt) bool — AST check for
              assertion calls
            - callsTargetPackage(funcBody *ast.BlockStmt, pkg string) bool —
              AST check for target package calls

          Sharp edge: uses go/ast parsing for substantiveness but grep-level
          matching for test name existence (REQ-004 says mechanical check).
        files:
