        title: "Implement coverage threshold step function"
        description: |
          Create pkg/gate/step_coverage.go with:

          Interface CommandRunner:
            - Run(ctx context.Context, name string, args ...string) ([]byte, error)
            - Abstraction for executing external commands (testable)

          Function StepCoverageThreshold(runner CommandRunner, specs []SpecVerification) StepFunc:
            - For each spec with a coverage_threshold:
              - Get test_command from spec verification block
              - Append -coverprofile if not already present
              - Execute via CommandRunner
              - If command fails to execute → violation with error details
              - Parse stdout for "coverage: NN.N% of statements" line
              - If summary line not found → violation "coverage summary line
                not found in test output"
              - If coverage < threshold → violation with actual vs expected
            - Returns StepResult with step_name "coverage_threshold"

          Function parseCoverageLine(output string) (float64, bool):
            - Regex match on "coverage: (\\d+\\.\\d+)% of statements"
            - Returns percentage and whether the line was found

          Type SpecVerification struct:
            - SpecID string
            - TestCommand string
            - CoverageThreshold int

          Sharp edge: test command failure is a step failure (exit 1), NOT a
          config error (exit 2). The step reports the error in violations.
