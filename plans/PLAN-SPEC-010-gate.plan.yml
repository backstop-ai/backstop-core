---
plan_id: PLAN-SPEC-010
spec_id: SPEC-010
spec_version: 1.0.0
created: "2026-04-04"
status: draft
target_repo: backstop-core
target_module: github.com/bmanson/backstop-core
test_command: "go test ./cmd/backstop/... ./pkg/gate/... -run \"TestGate\" -race -coverprofile=cover.out"
coverage_threshold: 80

notes: |
  Implements the backstop gate command — the full reconciliation kill chain
  (ADR-0010). Gate orchestrates nine verification steps: artifact validation,
  code check, test verification, test substantiveness, coverage threshold,
  contract signature verification, baseline comparison, waiver resolution,
  and ledger integrity.

  Logic lives in pkg/gate/ (orchestrator, step implementations, result types).
  cmd/backstop/gate.go is a thin Cobra adapter that wires the CLI.

  Steps 1-2 delegate to existing artifact validate and code check logic.
  Steps 3-6 are mechanical verifiers (grep/AST for test names, substantiveness,
  coverage, and contract signatures). Steps 7-9 are deferred (report "skipped").

  Feature areas with disjoint file scopes:
    1. Result types and step interface (pkg/gate/result.go)
    2. Delegated steps — artifact validation + code check (pkg/gate/step_delegate.go)
    3. Test verification + substantiveness (pkg/gate/step_testverify.go)
    4. Coverage threshold (pkg/gate/step_coverage.go)
    5. Contract signature verification (pkg/gate/step_contract.go)
    6. Deferred steps — baseline, waiver, ledger (pkg/gate/step_deferred.go)
    7. Orchestrator — step ordering, halt-on-config-error, result aggregation (pkg/gate/gate.go)
    8. Output formatting — JSON and human modes (pkg/gate/output.go)
    9. Cobra adapter (cmd/backstop/gate.go)

  Structure:
    Phase 1: Setup — scaffold pkg/gate/, test fixtures
    Phase 2: Result types + step interface (test → impl → verify)
    Phase 3: Deferred steps — baseline, waiver, ledger (test → impl → verify)
    Phase 4: Delegated steps — artifact validate, code check (test → impl → verify)
    Phase 5: Test verification + substantiveness (test → impl → verify)
    Phase 6: Coverage threshold (test → impl → verify)
    Phase 7: Contract signature verification (test → impl → verify)
    Phase 8: Orchestrator — kill chain ordering, halt-on-config-error (test → impl → verify)
    Phase 9: Output formatting + exit codes (test → impl → verify)
    Phase 10: Cobra adapter + no-scope-flags + config loading (test → impl → verify)
    Phase 11: Comprehensive verification

  Phases 3-7 are parallel-eligible (disjoint file sets, no dependency chains
  between them — all depend only on phase 2 result types).

