      - id: TASK-010
        type: implementation
        title: "Update agent definitions with standards-binding and review-question instructions"
        description: |
          Update .claude/agents/spec-author.md to add a new section instructing
          the spec author to:
            - Check available standards (injected by SessionStart hook context)
            - Bind applicable standard rules to requirements using the follows
              field with the format STD-LANG-NNN:RULE-ID
            - Use recipe names (lowercase-kebab) for non-standard references
            - Generate a Review Questions section with adversarial questions
              targeting risks the claims alone do not cover
            - Escalate to the human when standards do not cover the exact case
              rather than guessing (DD-13 escalation-over-guessing pattern)

          Update .claude/agents/impl-reviewer.md to add a new review step
          instructing the impl-reviewer to:
            - Check the spec's Review Questions section during code review
            - Evaluate each question against the implementation
            - Report which review questions are satisfied and which are not
            - Check that implementations follow the specific standard rules
              referenced in requirement follows fields
        files:
          - .claude/agents/spec-author.md
          - .claude/agents/impl-reviewer.md
        claims:
          - CLM-011
          - CLM-012
        depends_on:
