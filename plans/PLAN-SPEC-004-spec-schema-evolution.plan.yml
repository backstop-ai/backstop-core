            - Extracts standard ID, language, and rule count from each manifest
            - Outputs a formatted summary (e.g., "Available standards:
              STD-GO-001 (go, 14 rules)")
            - Exits 0 with no output if the directory does not exist or is empty
            - Is executable (chmod +x)

          Update .claude/settings.json to register the hook under both:
            - hooks.SessionStart — fires for main sessions
            - hooks.SubagentStart — fires for subagent sessions (reviewer, author)

          The hook command should reference the script path relative to the
          project root: .claude/hooks/backstop-standards-context.sh
        files:
