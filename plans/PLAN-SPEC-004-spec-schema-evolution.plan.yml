      - id: TASK-005
        type: implementation
        title: "Implement follows field and Review Questions validation in spec.go"
        description: |
          Add follows field validation and Review Questions section validation
          to pkg/validate/spec.go.

          New package-level regex vars:
            - followsStdRuleRe = regexp.MustCompile(`^STD-[A-Z]+-[0-9]{3}:[A-Z]+-[0-9]+$`)
            - followsRecipeRe  = regexp.MustCompile(`^[a-z][a-z0-9]*(-[a-z0-9]+)*$`)

          Changes to validateRequirements():
            - After the existing supports validation block (line ~455), add a
              follows field validation block that:
              - Accepts a single string or array of strings (same pattern as supports)
              - Rejects empty string or empty array
              - Validates each value against followsStdRuleRe or followsRecipeRe
              - Values matching neither are rejected with spec/requirement-follows-format

          New function validateReviewQuestions(art *artifact.ParsedArtifact) []Violation:
            - Check if "Review Questions" appears in art.Sections
            - If present, check that the section has non-empty content. This requires
              reading the raw body or using a section content mechanism. Since the
              current parser only stores section headings, this validation checks
              for presence in Sections and uses a content-presence heuristic (e.g.,
              checking if any content exists between the Review Questions heading
              and the next heading or end of body).
            - If the section is present but empty: emit spec/review-questions-empty

          Wire into Spec() function after capabilities validation (step 13):
            // 14. Review Questions — optional section content validation
            specViolations = append(specViolations, validateReviewQuestions(art)...)
        files:
          - pkg/validate/spec.go
        claims:
