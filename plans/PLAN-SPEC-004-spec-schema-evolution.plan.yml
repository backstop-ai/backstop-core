---
plan_id: PLAN-SPEC-004
spec_id: SPEC-004
spec_version: 1.0.0
created: "2026-04-03"
status: draft
target_repo: backstop-core
target_module: github.com/bmanson/backstop-core
test_command: "go test ./... -run \"TestSpec_|TestSpecAuthorAgent_|TestImplReviewerAgent_|TestStandardsHook_|TestSettingsJson_\" -race -coverprofile=cover.out"
coverage_threshold: 80

notes: |
  Extends the spec artifact schema and validator with two new features: an optional
  follows field on requirements for standards binding, and an optional Review Questions
  section. Also updates agent definitions (spec-author, impl-reviewer) with
  standards-binding and review-question instructions, adds a SessionStart hook for
  standards context injection, and registers the hook in settings.json.

  The work touches four disjoint file groups:
    A. Go validator: pkg/validate/spec.go, pkg/validate/spec_test.go
    B. Schema JSON: artifacts/spec/v1/schema.json
    C. Agent definitions: .claude/agents/spec-author.md, .claude/agents/impl-reviewer.md
    D. Hook + settings: .claude/hooks/backstop-standards-context.sh, .claude/settings.json

  Groups B, C, and D have no Go code — their tests are file-content verification
  tests that read the files and assert expected content. These tests live in a
  separate test file (pkg/validate/spec_integration_test.go) to avoid conflicting
  with the validator test file.

  Phases 2 and 3 are parallel: Phase 2 handles Go validator changes (follows +
  review questions), Phase 3 handles non-Go artifacts (schema, agents, hook,
  settings). They touch completely disjoint file sets.

  Phase 4 is the final comprehensive verification phase.

  Structure:
    Phase 1: Setup — test helpers
    Phase 2: Follows field + Review Questions validation (TDD on spec.go)
    Phase 3: Schema + agents + hook + settings (TDD on file-content tests)  [parallel with Phase 2]
    Phase 4: Comprehensive verification

phases:
  # ═══════════════════════════════════════════════════════════════════════
  # Phase 1: Setup — Test Helpers
  # ═══════════════════════════════════════════════════════════════════════
  - id: phase-1
    name: "Phase 1: Setup — Test Helpers"
    tasks:
      - id: TASK-001
        type: setup
        title: "Create test helper for spec artifacts with follows and review questions"
        description: |
          Create pkg/validate/spec_follows_helpers_test.go with helper functions
          shared across the new follows and review questions tests.

          Helper functions:
            - validSpecWithFollows(follows interface{}) — returns a valid
              ParsedArtifact with a requirement that has the given follows value.
              Uses the existing validSpecArtifact() pattern from spec_test.go as
              the baseline but adds the follows field to requirements[0].
            - validSpecWithReviewQuestions(present bool, empty bool) — returns a
              valid ParsedArtifact. When present=true, adds "Review Questions" to
              Sections. When empty=true, the section name is present but simulates
              empty content (for the content check).

          These helpers reduce boilerplate across the 20+ new test functions.
        files:
          - pkg/validate/spec_follows_helpers_test.go
        claims:
          - CLM-020
        depends_on: []

