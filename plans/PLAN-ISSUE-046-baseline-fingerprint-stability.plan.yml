notes: |
  ROOT CAUSE (verified in tree 2026-07-06):
  EnrichViolationIdentity (pkg/gate/baseline.go:174-183) builds the baseline key
  as `Rule | File | RegionHash` and folds `File` in RAW. `File` originates from
  the SARIF `artifactLocation.uri` (pkg/check/parsers.go:112-116, parseSarif) and
  reaches the identity through the findings bridge gate.Violation{File: v.File,…}
  (cmd/backstop/pack_gate.go:722-733) with NO normalization anywhere on the path.
  runFindingsEngine (pack_gate.go:573-637) legitimately hands the engine two
  structurally different targets by scope — full scope appends the project-root
  DIRECTORY arg (`projectRoot`, :632-634), diff scope appends the explicit
  repo-relative changed-file LIST (`scope.Files`, :634-636) — so semgrep echoes
  the SAME file's path in a different textual form (e.g. `./pkg/x.go` from the
  directory walk vs `pkg/x.go` from an explicit arg). That textual difference
  flows unnormalized into Identity, so IdentityHash differs purely by invocation
  shape. RegionHash (the content half, pkg/check/parsers.go:133-152) cannot
  rescue the match because File participates in Identity independently.

  ─────────────────────────────────────────────────────────────────────────
  THE FIX — ONE canonical repo-relative path form for every violation identity
  ─────────────────────────────────────────────────────────────────────────
  normalizeScopePath (pkg/gate/scope.go:91-102: filepath.Clean + filepath.ToSlash
  + abs→rel-against-projectRoot) ALREADY exists and ALREADY no-ops the abs→rel
  step when projectRoot=="" (scope.go:96). It is wired ONLY into the scope FILTER
  (GateScope.Contains, scope.go:64-70), never into identity. Promote it to a
  single EXPORTED helper (`gate.NormalizePath(projectRoot, file)`) — the SAME one
  implementation, not two that can drift — and apply it at BOTH:
    (a) the point File is SET (the findings bridge, pack_gate.go:722-733, which
        has projectRoot in scope) so every gate.Violation carries a canonical
        repo-relative File everywhere it is consumed — identity AND the raw-path
        consumers isExistingCodeViolation (baseline.go:170, keys v.File against
        changedFiles) and CompareBaseline's scope.Contains(old.File);
    (b) the identity chokepoint EnrichViolationIdentity itself — call
        NormalizePath("", v.File) (projectRoot empty → the idempotent
        Clean+ToSlash+strip-`./` subset, NOT a second implementation) before
        folding File into Identity, so a canonical identity is guaranteed even for
        a producer that skips (a). Every identity flows through this one function
        (baseline write baseline.go:99-101, baseline load :79-81, current-run
        compare :122/:129), so canonicalizing here fixes ALL dimensions at once.
  DO NOT change runFindingsEngine's scope-branch invocation shape (:632-636) — the
  directory-vs-explicit-file difference is legitimate and load-bearing (ISSUE-010
  diff-scoping keeps rule-fed engines off the whole repo). Normalize the OUTPUT
  path, never force identical engine INPUTS.

  ─────────────────────────────────────────────────────────────────────────
  OTHER-DIMENSIONS AUDIT (planned in Phase 2 — CLM-008)
  ─────────────────────────────────────────────────────────────────────────
  The three non-pack_engines traceability dimensions build Violation.File through
  their OWN paths, not runFindingsEngine's scope-branch, so they are lower risk
  but not verified clean:
    - coverage (pkg/gate/step_coverage.go:117/136/156/179/207) — File = a coverage
      record `path`. Records were made repo-relative in ISSUE-045; the FILTER
      already calls normalizeScopePath(scope.ProjectRoot,…) (:387) but the
      VIOLATION construction does not.
    - contract (pkg/gate/contract_verdict.go:65/73/89) — File = r.Entry.File (a
      spec-declared contract path).
    - test_verification (pkg/gate/step_testverify.go:449/497) — File = a
      spec-declared test/spec path.
    - substantiveness (pkg/gate/substantiveness_join.go:158,
      substantiveness_q1_dispatch.go:64) — File = v.File carried from an engine
      finding.
  Because EnrichViolationIdentity's chokepoint canonicalization (fix (b)) applies
  to EVERY violation, the identity-STABILITY property is covered for these
  dimensions by Phase 1 alone. Phase 2 additionally routes each dimension's
  Violation.File through NormalizePath(scope.ProjectRoot,…) at construction so a
  dimension that ever emits an absolute path (which the projectRoot-free chokepoint
  cannot rel-ify) also carries a canonical repo-relative File — one path form
  across the whole gate. The audit confirms which dimensions actually need it and
  normalizes defensively; it must not weaken any dimension's existing behavior.

  ─────────────────────────────────────────────────────────────────────────
  RegionHash — VERIFY, DO NOT REWRITE (issue constraint)
  ─────────────────────────────────────────────────────────────────────────
  The issue flags RegionHash/sarifFingerprint stability as an ASSUMPTION to
  check empirically, and constrains the fix to the File component "unless
  investigation shows sarifFingerprint itself is also unstable in practice."
  Phase 3's real-dispatch e2e (CLM-007) asserts semgrep's partialFingerprints (or
  the snippet fallback) are BYTE-IDENTICAL across a full-scope and a diff-scope
  invocation of the same rule against the same file. sarifFingerprint is by design
  content-based/position-independent (parsers.go:133-152), so the default plan
  VERIFIES it stable and does not touch it. If — and only if — the empirical
  assertion FAILS, that is a distinct RegionHash-instability defect beyond this
  plan's File-normalization scope: STOP and report it for a follow-up issue rather
  than silently expanding scope into a fingerprint-scheme rewrite here.

  ─────────────────────────────────────────────────────────────────────────
  INTEGRATION-GAP CLOSER (Phase 3 — ISSUE-045 lesson)
  ─────────────────────────────────────────────────────────────────────────
  A pure unit test that feeds pre-shaped gate.Violation records straight into
  EnrichViolationIdentity can pass while the REAL SARIF dispatch path stays broken
  (the ISSUE-045 lesson: unit tests fed records directly hid a dispatch-shaped
  bug). Phase 3 adds a REAL-dispatch e2e that runs the actual findings dispatch
  under BOTH scope shapes (full-scope directory arg vs diff-scope explicit-file
  list) against the same fixture and asserts the resulting IdentityHash is
  byte-identical — proving the fix holds through the real semgrep path, not just
  the identity math.

  ─────────────────────────────────────────────────────────────────────────
  VERIFICATION COMMANDS — deliberate deviation
  ─────────────────────────────────────────────────────────────────────────
  Inner-loop verification tasks run `go test` (scoped to the touched packages),
  NOT `backstop code check`, because `code check` is itself DIFF-SCOPED — the very
  invocation-shape confound this bug is about — and running the fix's regression
  suite under a diff-scoped harness could mask or perturb exactly what we are
  pinning. The final phase runs the full `backstop gate` kill chain plus a real
  `backstop baseline generate` → `backstop gate` cycle. The change touches only
  .go files (pkg/gate, pkg/check, cmd/backstop) and NO backstop artifact files
  (.spec.md / .plan.yml / .issue.md), so `backstop gate` subsumes final
  verification and no separate `backstop artifact validate` is required.

  ─────────────────────────────────────────────────────────────────────────
  CLAIMS (enumerated from the issue's Solution steps + Tests-to-add; every task
  maps ≥1; every claim mapped by ≥1 task)
  ─────────────────────────────────────────────────────────────────────────
  CLM-001 — ONE exported path-normalization helper (promoted normalizeScopePath →
            gate.NormalizePath, single implementation) is applied so every
            violation's File is a canonical repo-relative form before it enters
            identity: at the findings-bridge construction site (with projectRoot)
            AND at the EnrichViolationIdentity chokepoint (projectRoot-free
            idempotent subset). No second normalization implementation.
  CLM-002 — A finding's Identity/IdentityHash computed via the full-scope path
            form and via the diff-scope path form for the IDENTICAL violation
            (same rule, same file, same content) is BYTE-IDENTICAL — the crux.
  CLM-003 — A `baseline generate` (full scope) immediately followed by a `gate`
            (diff scope) against the SAME tree produces ZERO new_violations for
            content present in the just-generated baseline (direct regression
            guard for the ISSUE-045 16-finding repro).
  CLM-004 — A finding whose surrounding file shifts (unrelated edit changes line
            numbers / file-list ordering) but whose own rule+file+content is
            unchanged KEEPS its identity (grandfathers) — the fix must not
            over-block on incidental position change.
  CLM-005 — A finding whose rule+file+content genuinely changed gets a NEW,
            distinct identity (still blocks) — the anti-false-grandfather /
            silent-green guard; normalization must NOT collapse distinct findings
            into one stale baseline entry.
  CLM-006 — runFindingsEngine's scope-dependent invocation shape (directory arg
            vs explicit-file list) is UNCHANGED; the fix normalizes the OUTPUT
            path only, never forces identical engine inputs (ISSUE-010 preserved).
  CLM-007 — RegionHash/sarifFingerprint is EMPIRICALLY verified byte-identical
            across a full-scope and a diff-scope invocation of the same rule
            against the same file — verified, not rewritten (issue constraint).
  CLM-008 — Every non-pack_engines dimension's Violation.File construction
            (coverage / contract / test_verification / substantiveness) is audited
            and routed through the same NormalizePath at construction, so ALL
            violation identities use one canonical repo-relative path form; no
            dimension's existing behavior is weakened.
  CLM-009 — A REAL findings-dispatch e2e runs the actual SARIF path under BOTH
            scope shapes (full-scope directory walk vs diff-scope explicit files)
            against the same fixture and asserts byte-identical IdentityHash —
            proving the fix through the real path, not just the identity math.
  CLM-010 — Language-neutral / thin-executor: normalization is path-string-only
            (no baked language noun, no extension literal, no toolchain), AND the
            full `backstop gate` + `baseline generate`→`gate` cycle passes with
            pre-existing findings grandfathering cleanly and no dimension
            regressing.

