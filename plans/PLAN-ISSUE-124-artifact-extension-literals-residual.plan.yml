  ── SHARP EDGES ────────────────────────────────────────────────────────────

  1. ★ `strings.HasSuffix(x, "")` IS ALWAYS TRUE. THIS IS THE DANGEROUS ONE.
     `LayoutFor` returns `(KindLayout{}, false)` for an unrecognized kind — a
     ZERO VALUE whose `Extension` is the EMPTY STRING. Its own doc comment says
     this is why it returns ok at all. An implementer who writes

         layout, _ := artifact.LayoutFor(artifact.KindSpec)
         if entry.IsDir() || !strings.HasSuffix(entry.Name(), layout.Extension) {

     and gets `ok=false` for any reason has just inverted a "specs only" filter
     into "accept every file in the directory" — silently, with no error, and
     with `ExtractMandatedTests` then trying to parse `README.md` as spec
     frontmatter. Every scoped call site MUST handle `ok=false` explicitly. Do
     not discard it with `_`. What "handle" means per site:

       - pkg/gate/step_testverify.go — the four functions already return
         `(T, error)`. A `false` is an impossible-state bug, so return an error
         naming the kind; do NOT skip silently and do NOT panic.
       - pkg/validate/spec.go, adr.go — `extractSpecSlug`/`extractSlug` return a
         plain string and already return `""` on a non-matching filename. Return
         `""`. That is the existing failure mode, unchanged.
       - pkg/validate/bundle.go — the stem strip is inside a violation collector.
         On `false`, leave `stem` untouched and let the existing mismatch
         violation fire; do not invent a new violation rule.
       - cmd/backstop/gate_substantiveness_e2e.go — both builders return
         `(*e2eWorkspace, error)`. Return an error.

     Where the question is "is this file kind X" rather than "what is the
     extension string", prefer `artifact.ClassifyFilename` — it has no zero-value
     hazard at all, because its bool IS the answer. That applies to the four
     step_testverify guards and to `citingStatus`. Reserve `LayoutFor(...).
     Extension` for the three sites that need the STRING in order to trim it.

  2. ★ THE `.epic` MODIFIER IS NOT A KIND, AND THE IF/ELSE SHORT-CIRCUIT IS
     LOAD-BEARING — BUT NOT FOR THE REASON THE OBVIOUS READING SUGGESTS. Do not
     add an eighth row to `kindTable`. Per `artifacts/bundle/v1/schema.json:9`
     the filename pattern is `^[a-z0-9-]+(\.epic)?\.bundle\.md$` — `.epic` is a
     bundle-SCHEMA category modifier that sits INSIDE the stem, before the kind
     extension.

     DO NOT COLLAPSE THE TWO BRANCHES INTO AN UNCONDITIONAL PAIR OF TRIMS. The
     obvious-looking rewrite

         stem = strings.TrimSuffix(art.Filename, bundleLayout.Extension)   ← WRONG
         stem = strings.TrimSuffix(stem, ".epic")

     is NOT behavior-preserving at the FUNCTION level, and CLM-004's
     byte-identical promise does not hold for it. Current code is an if/ELSE
     chain, so a filename matching NEITHER suffix falls through completely
     untouched. Feed `validateNameFilenameConsistency` a `ParsedArtifact` whose
     `Filename` is `"foo.epic"`:

         HEAD          neither branch matches      → stem stays "foo.epic"
         unconditional first trim is a no-op,
                       second trim STRIPS ".epic"  → stem becomes "foo"

     ★ STATE THE REACHABILITY HONESTLY — measured against the working tree
     2026-08-16. That divergence does NOT currently surface as a verdict change
     through the exported `Bundle()` validator, and any prose claiming it does is
     wrong. `validateNameFilenameConsistency` has EXACTLY ONE caller
     (`bundle.go:83-85`) and it is gated on `filenameOK`, so the filename must
     ALREADY match the schema pattern before the stem code runs at all.
     `"foo.epic"` fails that pattern (no `.bundle.md`), sets `filenameOK=false`,
     and never reaches the fall-through branch. The if/else's NEITHER-branch path
     is therefore DEAD in production today.

     That is a reason to pin it MORE tightly, not less. The collapsed form is
     harmless ONLY because an upstream schema pattern happens to filter out every
     input that would distinguish it — a real, load-bearing coupling between
     `artifacts/bundle/v1/schema.json`'s `filename_pattern` and this function's
     fall-through. Nothing in the code states that dependency, nothing enforces
     it, and it silently becomes a live defect the moment the pattern loosens or
     a second, ungated caller appears. So: preserve the short-circuit, and pin it
     at the FUNCTION level (TASK-002 calls the unexported helper directly for
     exactly this reason) rather than pretending the exported path can see it.

     PRESERVE THE SHORT-CIRCUIT:

         epicSuffix := ".epic" + bundleLayout.Extension
         stem := art.Filename
         if strings.HasSuffix(stem, epicSuffix) {
             stem = strings.TrimSuffix(stem, epicSuffix)
         } else if strings.HasSuffix(stem, bundleLayout.Extension) {
             stem = strings.TrimSuffix(stem, bundleLayout.Extension)
         }

     Same two branches, same order, same fall-through — only the extension string
     now comes from the table. `"x.epic.bundle.md"` → `"x"`; `"x.bundle.md"` →
     `"x"`; `"foo.epic"` → `"foo.epic"`, UNCHANGED. The surviving `".epic"`
     literal is CORRECT — it is schema vocabulary, not layout — and the TASK-001
     scan must not forbid it (the denylist derived from `Kinds()` cannot contain
     it, which is the point of deriving it).

     Note `epicSuffix` still CONTAINS the bundle extension, so the TASK-001 scan
     sees a table-derived composition rather than a literal, and stays green.
     `"foo.epic"` is a pinned row in TASK-002's table for exactly this reason —
     and per the reachability note above, that row is asserted against
     `validateNameFilenameConsistency` DIRECTLY, because the exported `Bundle()`
     path cannot deliver the input to it.

