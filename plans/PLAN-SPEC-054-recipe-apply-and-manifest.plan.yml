  # Phase 8: The ownership model — regenerate/waiver, templating one-shot,
  #          and the THIN adoption record
  # ═══════════════════════════════════════════════════════════════════════
  - id: phase-8
    name: "Phase 8: kind-gated regenerate-vs-preserve through the REAL waiver read path + one-shot templating + thin adoption record"
    tasks:
      - id: TASK-031
        type: test
        title: "Failing regenerate/waiver tests: scaffolding+implementing regenerate; covered diverges preserve via waiver.Adjudicate; never authors a token"
        description: |
          Add pkg/recipe/apply_regenerate_test.go (REQ-004). These drive the
          REAL pkg/waiver read path by leaving opts.ReadWaivers NIL — a stubbed
          reader would bypass exactly the mechanism under test.

          THE LINE CONTRACT (identical wording in TASK-034 — test and impl must
          NOT co-invent one). waiver.Adjudicate associates a token with a
          finding through a {Line, Line-1} window only
          (pkg/waiver/adjudicate.go:220-230 windowLines), so the synthesized
          divergence finding's Line decides where a covering token may live.
          Recipe-owned output includes formats with no comment slot at a fixed
          position (JSON), so the contract is: ONE finding PER LINE of the
          diverged file (Line = 1..N), all adjudicated in ONE waiver.Adjudicate
          call, and the divergence is COVERED iff at least one lands in
          Result.Suppressed. TESTS MUST PLACE THE TOKEN ON A NON-FIRST LINE
          (and on a line that is not line 2 either, so neither a line-1-only
          nor a first-window-only implementation passes).

          Mandated test names (exact):
            - TestApply_Scaffolding_RegeneratesRecipeOwnedOutput (CLM-019): a
              SCAFFOLDING recipe applied twice — with the recipe-owned output
              edited between runs and NO waiver present — regenerates the file
              back to the would-be output on re-apply.
            - TestApply_Implementing_RegeneratesRecipeOwnedOutput (CLM-020): the
              same for kind IMPLEMENTING.
            - TestApply_DivergedWithActiveWaiver_PreservedViaRealWaiverReadPath
              (CLM-021): the consumer edits recipe-owned output AND adds a real,
              ACTIVE `@waiver:<rule>:<reason>:<expiry>` token (rule = the
              recipe's declared enforcement rule for that path) into the file
              FIRST, on a line well below the top per the line contract above.
              Re-apply PRESERVES the on-disk bytes and records the covering
              waiver in ApplyResult.Preserved (Path/Rule/CoveringWaiver
              populated). Leave opts.ReadWaivers nil so the divergence findings
              are adjudicated by waiver.Adjudicate over a waiver.LineReader on
              the real file. Two falsifying twins: (a) the SAME edit with an
              EXPIRED token is NOT preserved (proving adjudication, not a
              substring match); (b) a token whose RULE is a different rule id
              than the recipe's declared enforcement rule is NOT preserved
              (proving the rule key is real).
            - TestApply_DivergedNoWaiver_Regenerates (CLM-061): diverged with no
              covering waiver → the file is OVERWRITTEN with the regenerated
              bytes and is NOT listed in Preserved.
            - TestApply_NeverAuthorsWaiverToken (CLM-062): after a divergence
              with no pre-existing waiver, NO `@waiver` token exists anywhere
              under the project root — walk the tree and assert the token count
              is zero (and unchanged where one already existed). The applier
              calls no waiver-authoring API; `<reason>`/`<expiry>` are human
              judgments.

          All FAIL until TASK-034.
        files:
          - pkg/recipe/apply_regenerate_test.go
        claims:
