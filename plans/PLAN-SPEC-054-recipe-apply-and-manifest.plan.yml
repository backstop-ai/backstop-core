              direct validateRecipesIndex call means the check is unreachable
              in production).
            - The existing pkg/pack manifest / validate suites show NO
              regression from the additive field (especially the
              empty-manifest and content-validation paths, which this task
              deliberately did not touch).
            - `go build ./...` succeeds — i.e. pkg/pack did NOT acquire an
              import of pkg/recipe (the cycle would surface here).
        files:
          - pkg/pack/manifest.go
          - pkg/pack/manifest_recipes_test.go
        claims:
          - CLM-032
          - CLM-033
          - CLM-034
          - CLM-035
        depends_on:
