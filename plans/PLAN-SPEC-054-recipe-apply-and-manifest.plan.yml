  # ═══════════════════════════════════════════════════════════════════════
  # Phase 3: The pack.yml `recipes:` index (REQ-008)
  # ═══════════════════════════════════════════════════════════════════════
  - id: phase-3
    name: "Phase 3: Manifest.Recipes index + validateRecipesIndex on pkg/pack (no import cycle)"
    tasks:
      - id: TASK-014
        type: test
        title: "Failing pack-manifest tests: recipes index maps id→dir, coexists with content.scaffolds, missing dir errors"
        description: |
          Add pkg/pack/manifest_recipes_test.go driving pack.ParseManifestFile
          over the TASK-006 fixtures.

          DRIVE THE PRODUCTION ENTRY POINT, NOT THE HELPER. ParseManifest takes
          []byte and has no filesystem root, so it cannot validate that an
          indexed directory exists; ParseManifestFile has the path and is where
          the root is derived (filepath.Dir(path)). CLM-035's test MUST go
          through ParseManifestFile — calling the unexported validateRecipesIndex
          directly would prove the helper works while leaving it unreachable in
          production (the exact dark-ship this project has paid for). Note
          pkg/pack/validate_manifest.go's ValidateManifest is NOT the call site:
          it has no production callers.

          Mandated test names (exact):
            - TestPackManifest_RecipesIndexMapsIdToDir (CLM-032):
              ParseManifestFile on the valid fixture yields Manifest.Recipes
              with the stable recipe-id keys mapped to their declared
              directories (assert both the key set and the values, so a
              nil/empty map cannot pass).
            - TestPackManifest_RecipesIndexDistinctFromScaffolds (CLM-033): the
              same manifest declares BOTH `recipes:` and `content.scaffolds`;
              both survive parsing independently and neither is populated from
              the other. Also assert a manifest declaring ONLY
              content.scaffolds leaves Recipes nil (zero-value when absent) —
              the index is optional.
            - TestPackManifest_MultipleRecipesMultipleDirs (CLM-034): two ids
              map to two DIFFERENT directories in the pack namespace.
            - TestPackManifest_RecipesIndexMissingDirErrors (CLM-035):
              ParseManifestFile on the missing-dir fixture returns an error
              naming the recipe id and the missing directory — covering BOTH
              the directory-absent and the directory-present-without-recipe.yml
              cases. Add the falsifying twin: ParseManifestFile on the VALID
              fixture returns no error, so a validator that rejects every
              recipes: index cannot pass.

          All FAIL until TASK-015.

          PARALLEL WITH PHASE 2: this task shares no compile unit with
          pkg/recipe and deliberately does NOT depend on Phase 2 — pkg/pack
          must not import pkg/recipe (see the import-cycle note), so there is
          nothing to wait for.
        files:
          - pkg/pack/manifest_recipes_test.go
        claims:
          - CLM-032
          - CLM-033
          - CLM-034
          - CLM-035
        depends_on:
          - TASK-006
        test_names:
          - TestPackManifest_RecipesIndexMapsIdToDir
          - TestPackManifest_RecipesIndexDistinctFromScaffolds
          - TestPackManifest_MultipleRecipesMultipleDirs
          - TestPackManifest_RecipesIndexMissingDirErrors

      - id: TASK-015
        type: implementation
        title: "Add Manifest.Recipes + validateRecipesIndex to pkg/pack/manifest.go"
        description: |
          Extend the EXISTING pkg/pack/manifest.go:

            - Add a `Recipes map[string]string` field with the yaml tag
              `recipes` to the Manifest struct — a DISTINCT top-level key,
              deliberately NOT nested under
              `content:` and NOT related to Content.Scaffolds (which is a
              rule's paired TEST scaffold) or to `pack scaffold` / `artifact new`
              (pack authoring). Optional: nil when absent.
            - Add `func validateRecipesIndex(m *Manifest, packRoot string) error`.
              For each entry: the directory must exist under packRoot and must
              contain a `recipe.yml`. Errors name the recipe id and the
              offending path.
            - PIN THE CALL SITE: invoke it from `ParseManifestFile`, deriving
              `packRoot := filepath.Dir(path)`. That is the only production
              entry point that knows where the pack lives. ParseManifest([]byte)
              cannot validate the index (no root) and must keep parsing the map
              without checking it — an unrooted parse is not a defect, it is the
              honest limit of a byte-slice API. Do NOT put the call in
              pkg/pack/validate_manifest.go's ValidateManifest: that function
              has no production callers, so the check would never run.
            - SCOPE GUARD — do NOT widen the emptiness checks. A recipes-only
              pack (no content:, no engines:) is OUT OF SCOPE: "content is
              required" is asserted independently at pkg/pack/manifest.go:271-276,
              pkg/pack/validate_manifest.go:122 and pkg/packval/phase1.go:45,
              and changing one without the others creates a pack that parses in
              one path and fails in another. No SPEC-054 claim asks for it, and
              every fixture in this plan declares content:/engines: alongside
              recipes:. Leave all three sites alone; TASK-043 names the
              follow-up.

          IMPORT-CYCLE RULE (non-negotiable): validateRecipesIndex performs the
          STRUCTURAL existence check ONLY and MUST NOT import pkg/recipe.
          pkg/recipe imports pkg/pack (ResolveRecipe's declared signature takes
          map[string]*pack.Manifest); importing back would not compile. Deep
          recipe.yml parsing happens in pkg/recipe at resolve time. The spec's
          `consumes: pkg/recipe ParseRecipeManifest` edge on this file is
          therefore not implementable as written — implement the existence check
          (all CLM-035 asks for) and flag the stale consumes edge for a spec
          touch-up; do NOT create the cycle and do NOT weaken ResolveRecipe's
          declared signature to dodge it.

          No language/tool noun enters pkg/pack.
        files:
          - pkg/pack/manifest.go
        claims:
          - CLM-032
          - CLM-033
          - CLM-034
          - CLM-035
        depends_on:
          - TASK-014

      - id: TASK-016
