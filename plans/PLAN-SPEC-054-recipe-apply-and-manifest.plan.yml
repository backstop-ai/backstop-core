      - id: TASK-018
        type: implementation
        title: "Implement pkg/recipe/resolve.go — RecipeRef, ParseRecipeRef, ResolvedRecipe, ResolveRecipe"
        description: |
          Create pkg/recipe/resolve.go with exactly the declared contract
          surface:

            - type RecipeRef struct { Pack string; Recipe string; Version string }
            - func ParseRecipeRef(raw string) (RecipeRef, error) — parses
              `<pack>:<recipe>@<recipe_version>`. The version must be
              well-formed semver; an unpinned or malformed ref is an error
              (there is no "latest", no default, no tolerance branch).
            - type ResolvedRecipe struct { Ref RecipeRef; Dir string;
              Manifest *RecipeManifest }
            - func ResolveRecipe(ref RecipeRef, packs map[string]*pack.Manifest,
              packDir string) (*ResolvedRecipe, error) — looks the pack up in
              the supplied corpus, reads its Recipes index for the recipe id,
              joins packDir + the indexed directory, parses the colocated
              recipe.yml via ParseRecipeManifest, and requires
              manifest.Version == ref.Version. Each failure is a distinct
