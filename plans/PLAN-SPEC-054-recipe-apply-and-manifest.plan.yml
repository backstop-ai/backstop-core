              wrong reason). So: declare `content:` with SCAFFOLDS ONLY, or a
              rule citing a DIFFERENT (allowlisted or nil-Provision) engine, or
              omit `content:` entirely — the `engines:` block alone already
              satisfies the emptiness check (manifest.go:272-277 ORs in
