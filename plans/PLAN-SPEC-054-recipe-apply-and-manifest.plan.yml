              fixture for CLM-025: an `engines:` block whose single provisioned
              binding names a tool that is NOT on
              engine.TrustedToolAllowlist(), plus a `recipes:` index mapping
              `reject -> recipes/reject`.
              PIN THE content: SHAPE — NO RULE MAY CITE THAT ENGINE. Parse-time
              validateEngine runs CheckToolAllowed for every engine a RULE
              references (manifest.go:324 → 481-503), so a rule citing the
