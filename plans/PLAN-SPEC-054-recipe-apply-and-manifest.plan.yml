notes: |
  ─────────────────────────────────────────────────────────────────────────
  WHAT THIS PLAN BUILDS (BUNDLE-015 spec one — the coupled apply+manifest
  surface `backstop init` is blocked on)
  ─────────────────────────────────────────────────────────────────────────
  A NEW `pkg/recipe` package (manifest.go, substitute.go, resolve.go,
  apply.go, adoption.go), a `recipes:` index field + validator on the
  EXISTING pkg/pack manifest, and a thin `backstop recipe apply` CLI in
  cmd/backstop that wires the production transform dispatch and waiver
  reader. Exactly the five NEW pkg/recipe files the spec's Package Layout
  declares — no extra helper files, so the declared contracts and the
  shipped file set agree.

  ─────────────────────────────────────────────────────────────────────────
  ZERO BAKED LANGUAGE/TOOL KNOWLEDGE (the standing invariant, REQ-006)
  ─────────────────────────────────────────────────────────────────────────
  Nothing in pkg/recipe or cmd/backstop may name a language, framework, CI
  platform, or tool. Every WHERE and WHAT is read from declared data:
    • The injection-limit failure text is the op's declared `manual:` string
      emitted VERBATIM. Core NEVER synthesizes an instruction.
    • The engine tool, its command, its rule file, and its target are all
      DECLARED DATA (pack `engines:` block + recipe manifest). Nothing in
      pkg/recipe or cmd/backstop names a tool.

  WHAT backstop/self ACTUALLY ENFORCES OVER THIS CODE (verified against
  .backstop/packs/backstop/self/rules/no-baked.yml — do not overstate it):
    • GLOBAL, apply to every .go file INCLUDING _test.go and testdata/*.go:
      Family A no-baked-tool-exec (a string-literal tool name passed to
      exec.Command / exec.CommandContext; only git/gh/sh//bin/sh/sandbox-exec
      are allowed literals), Family B1 no-baked-tool-command (a baked
      `Command: "..."` engine command string), Family B2
      no-baked-language-token (a whole-token literal such as ".ts", ".py",
      "tsc", "eslint", "go.mod", "package.json", "tsconfig.json",
      "Cargo.toml", "requirements.txt", "pom.xml", "build.gradle").
    • `.go` / `_test.go` / `./...` are DELIBERATELY OMITTED from B2 and are
      caught only by Family B3, which is PATH-SCOPED to the neutral spine
      (pkg/gate/*.go, pkg/check/manifest.go, pkg/check/parsers.go,
      pkg/validate/plan.go, cmd/backstop/gate.go, cmd/backstop/pack_gate*.go,
      pkg/pack/engine/binding.go) and EXCLUDES *_test.go. Families B4/B5/B6
      are scoped to the same spine. NONE of them cover pkg/recipe/*.go or
      cmd/backstop/recipe_apply.go.
    ⇒ CONSEQUENCES for this plan: (1) a Go fixture or a ".go" path literal in
      a recipe test is NOT a self-pack violation; (2) a ".ts"/"package.json"
      literal anywhere in a .go file (test source included) IS one — hence the
      neutral fixture names in Phase 1; (3) any test that runs an engine must
      read the tool name from fixture DATA into a variable and call
      exec.CommandContext(ctx, name, args...) — a literal tool name trips
      Family A even in a _test.go.
    ⇒ NOT COVERED, stated honestly: pkg/recipe and recipe_apply.go get
      A/B1/B2 coverage only, not spine-grade B3. Extending B3's include list
      to the recipe applier is a PACK change in the backstop/self repo (packs
      are external by design) and is out of scope here — name it as a
      follow-up, do not claim coverage this plan does not have.

  ─────────────────────────────────────────────────────────────────────────
  IMPORT-CYCLE HAZARD — RESOLVE IT IN THE pkg/pack DIRECTION (Phase 3)
  ─────────────────────────────────────────────────────────────────────────
  The spec's contracts declare BOTH edges: pkg/recipe/resolve.go consumes
  pack.Manifest (ResolveRecipe's signature takes map[string]*pack.Manifest),
  AND pkg/pack/manifest.go's validateRecipesIndex consumes
  recipe.ParseRecipeManifest. Those two together are an import CYCLE — Go
  will not compile it. Break it on the pack side: `validateRecipesIndex`
  performs the STRUCTURAL existence check ONLY (the indexed directory exists
  and contains a `recipe.yml`), which is exactly and entirely what CLM-035
  requires, and it MUST NOT import pkg/recipe. pkg/recipe keeps its import of
  pkg/pack (the declared ResolveRecipe signature). Deep recipe.yml parsing
  stays where it belongs — in pkg/recipe at resolve/apply time. The gate's
  contracts dimension verifies declared PROVIDES signatures, not consumes
  edges, so this does not break contract verification; flag the stale
  `consumes: pkg/recipe ParseRecipeManifest` edge for a spec touch-up rather
  than creating the cycle.

  ─────────────────────────────────────────────────────────────────────────
  WHERE THE TRUST GATE LIVES: cmd/backstop, NOT pkg/recipe
  ─────────────────────────────────────────────────────────────────────────
  engine.CheckToolAllowed(allowlist, tool, lockedVersion) needs a TOOL and a
  LOCKED VERSION. Neither `ResolvedRecipe`, `ApplyOptions`, nor `Op` carries
  either — and inventing fields on them would contradict the spec's declared
  contracts. Those two values live where the pack manifests' `engines:` block
  (Manifest.Engines[name].Provision.Tool / .Version) and backstop.lock are
  reachable: the CLI layer. So:
    • pkg/recipe keeps `opts.Dispatch TransformDispatch` as the ONLY seam and
      calls it with (rule, target) read from the recipe manifest. pkg/recipe
      does NOT import pkg/pack/engine and runs NO trust check — it cannot, and
      pretending otherwise is how a gate ships dark. A transform op with a NIL
      Dispatch is a FAIL-LOUD configuration error, never a silent no-op.
    • cmd/backstop/recipe_apply.go BUILDS the dispatch: it resolves the pack's
      declared engine binding, runs
      engine.CheckToolAllowed(resolveTrustedToolAllowlist(),
      binding.Provision.Tool, binding.Provision.Version) — the identical
      resolver + gate checkEngineToolAllowed (cmd/backstop/pack_gate.go:812-826)
      runs before an enforcement engine — wraps a rejection in
      *check.ConfigError (exit 2), and only then returns a closure that runs
      the declared command. This is exactly where spec:925-928 puts it.
    • ENGINE SELECTION, pinned so it is not co-invented: the `Op` contract has
      no engine field, so the CLI uses the pack's declared provisioned engine
      binding. The pack MUST declare EXACTLY ONE binding with a non-nil
      Provision for recipe transform dispatch; zero or more than one is a
      fail-loud ConfigError naming the pack and the count (Manifest.Engines is
      a map — picking one of several would be nondeterministic). A per-op
      engine selector is a SPEC follow-up (TASK-043), not an invented field.
    ⇒ CLM-025 (un-allowlisted engine rejected) is therefore a cmd/backstop
      test (TASK-040), not a pkg/recipe one. Its fixture pack declares BOTH an
      allowlisted binding (ast-grep, Provision version 0.43.0, matching
      engine.TrustedToolAllowlist) and an un-allowlisted one. Note
      pkg/pack's parse-time validateEngine only runs CheckToolAllowed for
      engines a RULE references (manifest.go:324), so a pack can legitimately
      declare an un-allowlisted binding no rule cites — which is precisely the
      hole the dispatch-time gate closes, and why the fixture parses.

  ─────────────────────────────────────────────────────────────────────────
  THE WAIVER SEAM AND ITS LINE CONTRACT (REQ-004)
  ─────────────────────────────────────────────────────────────────────────
  opts.ReadWaivers == nil → apply.go's own reader, which builds
  waiver.Finding values for the divergence (RuleID = the recipe's declared
  enforcement rule for that path, File = the diverged path) and runs
  waiver.Adjudicate over a waiver.LineReader on the consumer's on-disk file.
  This satisfies apply.go's declared `consumes` edges on pkg/waiver and makes
  CLM-021/061 real-path tests.

  LINE CONTRACT — pin it, do not let test and impl co-invent one.
  waiver.Adjudicate's association window is exactly {Line, Line-1}
  (pkg/waiver/adjudicate.go:220-230 windowLines), so a synthesized finding at
  a single fixed line would only ever see a token on that line or the one
  above. Recipe-owned output includes formats with NO comment syntax at a
  fixed position (JSON), so a line-1-only convention is unworkable. THE
  CONTRACT: on divergence the applier synthesizes ONE finding PER LINE of the
  diverged file (Line = 1..N) and adjudicates the whole set in ONE
  waiver.Adjudicate call; the divergence is COVERED iff at least one finding
  lands in Result.Suppressed. A covering token may therefore appear on ANY
  line the consumer's file format permits. Tests MUST place the token on a
  NON-FIRST line so a line-1-only implementation fails.

  The seams exist for INJECTION SITES the unit tests need (a recorded
  dispatch, a fake runner), never to stub the allowlist or the waiver read
  open.

  ─────────────────────────────────────────────────────────────────────────
  RECIPES-ONLY PACKS ARE OUT OF SCOPE (do not widen the emptiness checks)
  ─────────────────────────────────────────────────────────────────────────
  "content is required" is asserted in THREE independent places —
  pkg/pack/manifest.go:271-276 (which already ORs in `len(manifest.Engines)`),
  pkg/pack/validate_manifest.go:122 (ValidateManifest, which has no production
  callers), and pkg/packval/phase1.go:45 (the `pack check`/`pack test`
  pipeline). Making `recipes:` alone sufficient means changing all three
  consistently, which is a separate behavior change no claim in SPEC-054 asks
  for. THIS PLAN DOES NOT TOUCH THEM: every recipe-bearing fixture pack also
  declares a `content:` and/or `engines:` block (the trust-gate fixture needs
  `engines:` anyway), so `recipes:` rides alongside existing content exactly
  as CLM-033 describes. A recipes-only pack is named as a follow-up in
  TASK-043, not smuggled in here.

  ─────────────────────────────────────────────────────────────────────────
  ANTI-VACUOUS-GREEN GUARDS (the three ways this ships dark)
  ─────────────────────────────────────────────────────────────────────────
  1. A wired-but-NO-OP TransformDispatch passes every op-level test while
     doing nothing. CLM-063's E2E — real ast-grep, captured before/after,
     through the actual `backstop recipe apply` CLI, asserting transformed
     file BYTES — is the only test that can falsify it. Phase 10 is not
     optional polish.
  2. A FABRICATED fixture that happens to match the applier's own output is a
     mirror, not a test. Every create payload, merge target/fragment, and
     transform before/after in Phase 1 MUST be CAPTURED from real output
     (cite the capture source in that task's own CAPTURE-SOURCE-<area>.md
     fragment — one per capture task, never a shared appended file) — the
     transform AFTER-state specifically is captured by RUNNING ast-grep, not
     typed by hand.
  3. Silently skipping an unrecognized op kind, or EXECUTING a reserved
     `step`, both look green. CLM-028/029/030 pin all three behaviors.

  ─────────────────────────────────────────────────────────────────────────
  COMPILE-CLOSURE (why the phase ordering is what it is)
  ─────────────────────────────────────────────────────────────────────────
  A Go package's _test.go files compile as a unit, so each phase introduces
  only tests whose referenced symbols exist by the end of that phase:
  P2 = ParseRecipeManifest + Substitute (leaves, no Apply symbol referenced);
  P3 = pack.Manifest.Recipes; P4 = ParseRecipeRef/ResolveRecipe; P5 = the
  FULL Apply type surface (ApplyOptions/ApplyResult/PreservedDivergence/
  TransformDispatch/WaiverReader/ApplyMode) lands in ONE task so every later
  phase's tests compile against a stable signature while the BEHAVIOR is
  filled in phase by phase; P6 merge; P7 transform+injection limit; P8
  ownership model + adoption; P9 modes + multi; P10 CLI + E2E + final gate.

  ALL gate dimensions run at EVERY verification step (the no-check-filtering
  razor) — verification tasks never scope or categorize what was touched.

phases:
  # ═══════════════════════════════════════════════════════════════════════
  # Phase 1: The CAPTURED fixture corpus (setup only — no impl, no gate)
  # ═══════════════════════════════════════════════════════════════════════
  - id: phase-1
    name: "Phase 1: Capture the fixture corpus (create payload, merge matrix, transform before/after, recipe dirs, E2E project)"
    tasks:
      - id: TASK-001
        type: setup
        title: "Capture the create-op payload fixture + the unsupported-merge-format target"
        description: |
          Create pkg/recipe/testdata/captured/create/ holding a REAL captured
          templated payload and its expected materialization, plus the
          unstructured target the merge-format matrix rejects.

            - payload.json.tmpl — the captured payload, taken from the
              bclabs-portal go-live capture (SPEC References / BUNDLE-015
              standing recipe fixture) with one or two real values replaced by
              `{{ param }}` placeholders. Do NOT hand-author a synthetic file.
            - payload.expected.json — the expected materialized output for the
              params the test supplies. It is the captured file with the
              placeholders resolved, NOT a re-derivation of the applier's
              output.
            - unsupported-target.md — an unstructured (non json/yaml/toml/.env)
              file used as a `merge` target so CLM-009's fail-loud is driven
              against a real unstructured file.
            - CAPTURE-SOURCE-create.md — one line per fixture THIS task owns,
              naming WHERE it was captured from (the real filename it was
              captured AS, plus the project/commit). A fixture without a cited
              source is a fabricated fixture (Sharp Edge: "Fixtures must be
              CAPTURED").

          ONE CAPTURE-SOURCE FRAGMENT PER TASK, NEVER A SHARED FILE. TASK-001
          through TASK-004 have no dependencies on each other and are meant to
          run in parallel; a single appended CAPTURE-SOURCE.md would be a
          concurrent-write race AND a file two tasks touch without declaring it
          (a D-081 violation). Each capture task writes its OWN
          CAPTURE-SOURCE-<area>.md, declared in its own file scope. A reader
          globs the fragments.

          FIXTURE NAMING IS NEUTRAL ON PURPOSE: the fixture keeps the captured
          CONTENT but not the platform-specific FILENAME, because the test that
          consumes it must name the path in Go source and backstop/self's
          Family B2 (no-baked-language-token — global, blocking, matches whole
          tokens like "package.json"/"tsconfig.json") would flag that literal.
          Capture fidelity lives in the bytes + the capture-source fragment,
          not the name.

          These are DATA. No Go source is added here.
        files:
          - pkg/recipe/testdata/captured/create/payload.json.tmpl
          - pkg/recipe/testdata/captured/create/payload.expected.json
          - pkg/recipe/testdata/captured/merge/unsupported-target.md
          - pkg/recipe/testdata/captured/CAPTURE-SOURCE-create.md
        claims:
          - CLM-004
          - CLM-009
        depends_on: []

      - id: TASK-002
        type: setup
        title: "Capture the JSON + YAML merge fixtures (target + fragment pairs)"
        description: |
          Create the json and yaml halves of the merge-format matrix under
          pkg/recipe/testdata/captured/merge/. Each pair is a CAPTURED real
          target file plus the fragment a real recipe would deep-merge into it:

            - target.json — captured from the bclabs-portal go-live capture (a
              real project manifest, not a minimal synthetic stub: it must
              contain nested maps and arrays so "deep" merge is actually
              exercised). NEUTRAL FILENAME REQUIRED: the real captured file is
              a `package.json`, but that exact token is matched by
              backstop/self Family B2 (no-baked-language-token — global and
              blocking) the moment a Go test names the path, so the fixture is
              stored as target.json with the true origin recorded in this
              task's CAPTURE-SOURCE-merge-structured.md. The BYTES are the
              capture; the name is not.
            - fragment.json — the fragment to merge (adds a nested key inside
              an existing object AND a new top-level key, so a shallow
              overwrite is falsifiable).
            - target.yml — a captured real structured YAML file with nested
              maps (same neutral-name rule).
            - fragment.yml — the YAML fragment, same deep/shallow
              falsifiability property.
            - CAPTURE-SOURCE-merge-structured.md — this task's OWN capture-source
              fragment (see TASK-001: one fragment per task, never a shared
              appended file — TASK-001..004 run in parallel).

          Do NOT write the expected merged result by copying what the merger
          produces — derive it from the two captured inputs.
        files:
          - pkg/recipe/testdata/captured/merge/target.json
          - pkg/recipe/testdata/captured/merge/fragment.json
          - pkg/recipe/testdata/captured/merge/target.yml
          - pkg/recipe/testdata/captured/merge/fragment.yml
          - pkg/recipe/testdata/captured/CAPTURE-SOURCE-merge-structured.md
        claims:
          - CLM-005
          - CLM-006
        depends_on: []

      - id: TASK-003
        type: setup
        title: "Capture the TOML + .env merge fixtures (target + fragment pairs)"
        description: |
          Create the toml and .env halves of the merge-format matrix under
          pkg/recipe/testdata/captured/merge/, captured from real project files.
          Cite each source in this task's OWN CAPTURE-SOURCE-merge-keyvalue.md —
          do NOT append to another task's fragment (TASK-001..004 run in
          parallel; a shared appended file is a write race and an undeclared
          cross-task file):

            - config.toml — a captured real TOML file carrying at least one
              nested table so deep-merge is exercised.
            - config.fragment.toml — the fragment (nested-table addition + new
              top-level key).
            - dotenv.env — a captured real .env file (KEY=VALUE lines,
              including one commented line so comment handling is pinned).
            - dotenv.fragment.env — the fragment (one overriding KEY, one new
              KEY).
        files:
          - pkg/recipe/testdata/captured/merge/config.toml
          - pkg/recipe/testdata/captured/merge/config.fragment.toml
          - pkg/recipe/testdata/captured/merge/dotenv.env
          - pkg/recipe/testdata/captured/merge/dotenv.fragment.env
          - pkg/recipe/testdata/captured/CAPTURE-SOURCE-merge-keyvalue.md
        claims:
          - CLM-007
          - CLM-008
        depends_on: []

      - id: TASK-004
        type: setup
        title: "Capture the transform before/after fixture by RUNNING a real ast-grep rewrite rule"
        description: |
          Create pkg/recipe/testdata/captured/transform/ for the unit-level
          transform dispatch (CLM-010). The AFTER state must be CAPTURED from
          the real tool, never typed:

            - rewrite-rule.yml — an ast-grep rule declaring `language: go`, a
              `rule.pattern`, and a `fix:` (match -> fix), modeled on the
              existing cmd/backstop/testdata/astgrep-multirule/.backstop/packs/
              test-org/multirule-pack/ast-grep/rules/rule-one.yml. The rule is
              pack DATA; core never names its language.
            - before.go — a captured real source snippet the rule's pattern
              matches.
            - after.go — produced by ACTUALLY RUNNING the allowlisted ast-grep
              (0.43.0 per engine.TrustedToolAllowlist) with the rule and
              --update-all over a copy of before.go, then committing the tool's
              output verbatim.
            - CAPTURE-SOURCE-transform.md — this task's OWN capture-source
              fragment (one per task, never a shared appended file — see
              TASK-001), recording the exact ast-grep command and version used.

          EXTENSION MUST BE REAL AND MUST MATCH THE RULE'S DECLARED LANGUAGE.
          ast-grep selects its parser from the file extension — a neutral
          extension like `.src` parses as nothing, the rewrite silently
          no-ops, and before==after makes the whole transform suite vacuous.
          `.go` is chosen because (a) it matches the existing astgrep-multirule
          precedent, and (b) backstop/self's Family B2 token rule DELIBERATELY
          omits ".go", so naming this path in Go test source is not a
          baked-token violation (B3, which does cover ".go", is path-scoped to
          the neutral spine and excludes _test.go — it does not reach
          pkg/recipe). Any other language would need either a real matching
          extension or an sgconfig.yml declaring languageGlobs; `.go` needs
          neither.

          The fixture content itself is scanned by the GLOBAL self-pack
          families (testdata/*.go is not excluded from A/B1/B2), so pick a
          snippet that contains no exec.Command literal and no foreign-language
          token — otherwise the fixture trips the very rules CLM-027 asserts.

          before.go and after.go MUST differ.
        files:
          - pkg/recipe/testdata/captured/transform/rewrite-rule.yml
          - pkg/recipe/testdata/captured/transform/before.go
          - pkg/recipe/testdata/captured/transform/after.go
          - pkg/recipe/testdata/captured/CAPTURE-SOURCE-transform.md
        claims:
          - CLM-010
          - CLM-026
        depends_on: []

      - id: TASK-005
        type: setup
        title: "Build the pkg/recipe pack+recipe-directory corpus for reference resolution"
        description: |
          Create pkg/recipe/testdata/packs/ — a small pack whose pack.yml
          carries a `recipes:` index pointing at TWO per-recipe directories,
          each colocating recipe.yml + payload + transform rules. This is the
          corpus ParseRecipeRef/ResolveRecipe and the recipe-directory parse
          test drive.

            - demo-org/demo-pack/pack.yml — name, version, and a top-level
              `recipes:` block mapping `starter -> recipes/starter` and
              `second -> recipes/second`. It ALSO declares a
              `content.scaffolds` entry so the non-collision property has real
              material (the pkg/pack half of that assertion is TASK-006's).
            - recipes/starter/recipe.yml — kind scaffolding, version 1.2.0
              (the pinned version the resolution tests match and mismatch
              against), ordered ops, declared params, declared transform rules,
              per-op manual text on transform/insert.
            - recipes/starter/payload/app.config.json — the colocated template
              payload proving directory colocation (CLM-031).
            - recipes/second/recipe.yml — a DIFFERENT recipe at a different
              version, so "multiple distinct recipes are multiple directories"
              is falsifiable.
        files:
          - pkg/recipe/testdata/packs/demo-org/demo-pack/pack.yml
          - pkg/recipe/testdata/packs/demo-org/demo-pack/recipes/starter/recipe.yml
          - pkg/recipe/testdata/packs/demo-org/demo-pack/recipes/starter/payload/app.config.json
          - pkg/recipe/testdata/packs/demo-org/demo-pack/recipes/second/recipe.yml
        claims:
          - CLM-031
          - CLM-045
          - CLM-046
          - CLM-047
          - CLM-048
          - CLM-049
        depends_on: []

      - id: TASK-006
        type: setup
        title: "Build the pkg/pack recipes-index fixtures (valid, both-declared, missing-dir)"
        description: |
          Create pkg/pack/testdata/recipes/ — the manifest-validation corpus
          for the `recipes:` index, alongside the existing pkg/pack/testdata
          fixtures:

            - valid/pack.yml — a `recipes:` index mapping two ids to two
              directories, AND a `content.scaffolds` block declared
              independently (the non-collision fixture, CLM-033/CLM-034).
            - valid/recipes/alpha/recipe.yml, valid/recipes/beta/recipe.yml —
              the two indexed directories, each containing a recipe.yml so the
              structural existence check passes.
            - missing-dir/pack.yml — a `recipes:` index whose entry points at a
              directory that does not exist (or exists without a recipe.yml),
              the fail-loud fixture for CLM-035.

          BOTH pack.yml files MUST also declare a `content:` block (the
          scaffolds entry above suffices for valid/; give missing-dir/ one
          too). Recipes-only packs are OUT OF SCOPE — "content is required" is
          asserted in three independent places this plan does not touch (see
          notes), so a recipes-only fixture would fail parse for an unrelated
          reason and mask the assertion under test.

          These fixtures are consumed through pack.ParseManifestFile (the
          production entry point that knows the pack root), so they must live
          at a real on-disk path — an in-memory []byte cannot exercise the
          directory-existence check.
        files:
          - pkg/pack/testdata/recipes/valid/pack.yml
          - pkg/pack/testdata/recipes/valid/recipes/alpha/recipe.yml
          - pkg/pack/testdata/recipes/valid/recipes/beta/recipe.yml
          - pkg/pack/testdata/recipes/missing-dir/pack.yml
        claims:
          - CLM-032
          - CLM-033
          - CLM-034
          - CLM-035
        depends_on: []

      - id: TASK-007
        type: setup
        title: "Build the E2E fixture project: installed packs with an ALLOWLISTED and an UN-allowlisted engines: binding"
        description: |
          Create cmd/backstop/testdata/recipe-apply-e2e/ — a self-contained
          consumer project the CLI tests drive, modeled on the existing
          cmd/backstop/testdata/astgrep-multirule fixture project layout
          (installed pack under .backstop/packs/<org>/<pack>/ + tracked
          backstop.lock). It must supply BOTH the trust-gate PASS and the
          trust-gate REJECT material, because the gate lives at this layer.

            - backstop.yml / backstop.lock — declare/record the installed packs
              (name, version, content_hash, source_type: local) so pack loading
              and lock verification succeed. NOTE WHAT THE LOCK DOES *NOT*
              CARRY: `LockEntry` (pkg/pack/distribution/lockfile.go:17-29) has
              NO tool-version field — its `Version` is the PACK's version. The
              value `checkEngineToolAllowed` feeds to CheckToolAllowed as
              `lockedVersion` is `binding.Provision.Version`, read from the
              PACK.YML `engines.<name>.provision.version` (pack_gate.go:817-820).
              Do not author a lock entry pretending to pin a tool version; it
              would be inert.
            - .backstop/packs/demo-org/recipe-pack/pack.yml — declares:
                • an `engines:` block with EXACTLY ONE provisioned binding —
                  engine name `ast-grep`, `provision.tool: ast-grep`,
                  `provision.version: 0.43.0` (matching
                  engine.TrustedToolAllowlist()) — plus the `command` and
                  `input_flag`/input_mode fields that shape a rule-applying
                  invocation. This block is the ONLY source of the tool name and
                  the compared version; without it the gate has nothing to check.
                • a `recipes:` index mapping `rewrite -> recipes/rewrite`.
                • a `content:` block (recipes-only packs are out of scope —
                  see notes; the engines: block alone also satisfies
                  manifest.go:271-276, but declare content: so the fixture does
                  not depend on that one site's OR-arm).
            - .../recipes/rewrite/recipe.yml — version-pinned, kind
              scaffolding, ONE `transform` op declaring its rule file
              (pack-relative, listed in the recipe's declared transform rules),
              its target, and its `manual:` text.
            - .../recipes/rewrite/rules/rewrite-rule.yml — the real ast-grep
              rewrite rule (`language: go`, pattern + fix).
            - .../recipes/rewrite/fixtures/before.go and after.go — the
              CAPTURED before-state the test copies into a temp project root
