      - id: TASK-011
        type: implementation
        title: "Implement pkg/recipe/manifest.go — types, kind/op-kind constants, ParseRecipeManifest + structural validation"
        description: |
          Create pkg/recipe/manifest.go with exactly the declared contract
          surface:

            - type RecipeManifest struct { Kind string; Version string;
              Params []ParamSpec; Ops []Op; TransformRules []string;
              Enforcement *EnforcementDecl; Compat []CompatSelector;
              Variants []Variant }
            - type Op struct { ID, Kind, Target, Payload, Fragment, Format,
              Rule, Anchor, Snippet, Manual string }
            - type ParamSpec struct { Name string; Required bool; Default string }
            - const ( KindScaffolding = "scaffolding"; KindImplementing =
              "implementing"; KindTemplating = "templating" )
            - const ( OpCreate = "create"; OpMerge = "merge"; OpTransform =
              "transform"; OpInsert = "insert"; OpStep = "step" )
            - func ParseRecipeManifest(data []byte) (*RecipeManifest, error)

          ParseRecipeManifest decodes via gopkg.in/yaml.v3 (non-strict — see
          the reserved-step-payload Sharp Edge: unknown keys are DROPPED, which
          is the deliberate choice, and BUNDLE-019 will extend Op with the step
          payload) and then fail-louds on: missing/empty ops; missing version;
          non-semver version (MAJOR.MINOR.PATCH numeric components); a kind
          outside the three constants; a transform/insert op with an empty
          Manual; a transform op whose Rule is not present in TransformRules; a
          duplicate op ID anywhere; an empty ID on a transform/insert op.
          Duplicate/empty-id errors NAME the recipe and the offending id.
          Compat/Variants decode and validate STRUCTURALLY only — no selection,
          no resolution.

          Ops keep their DECLARED ORDER — never sort, dedupe-by-reorder, or
          map-ify the slice; determinism downstream depends on it.

