      - id: TASK-034
        type: implementation
        title: "Implement adoption.go + the kind-gated ownership model in apply.go (compute → diff → adjudicate → preserve/regenerate)"
        description: |
          TWO files, one coherent unit — the adoption record is written by the
          same Apply pass the ownership model runs in.

          pkg/recipe/adoption.go (NEW), exactly the declared contract:
            - type AdoptionEntry struct { Recipe string; Version string;
              Adopted string }
            - type AdoptionRecord struct { Recipes map[string]AdoptionEntry }
            - func ReadAdoptions(path string) (*AdoptionRecord, error) — a
              missing file yields an EMPTY record, not an error (ReadLockfile
              shape).
            - func WriteAdoptions(path string, rec *AdoptionRecord) error —
              deterministic, sorted keys (WriteLockfile shape).
          THIN ONLY: no per-op, per-region, hash, or provenance fields. Do not
          add "just one more" field for a downstream consumer.

          pkg/recipe/apply.go — the ownership hinge, gated on
          resolved.Manifest.Kind:
            - templating → ONE-SHOT. If the output already exists, it is
              consumer-owned: do not regenerate, do not diff, do not waiver.
            - scaffolding / implementing → regenerate-by-default with the
              accountable-divergence hinge, computed MECHANICALLY:
                1. compute the would-be-regenerated bytes for the recipe-owned
                   target;
                2. diff against on-disk. Not diverged → nothing to do.
                3. Diverged → ask opts.ReadWaivers. When it is nil, use
                   apply.go's own reader, which implements THE LINE CONTRACT
                   (stated identically in TASK-031, because
                   waiver.Adjudicate's association window is only {Line,
                   Line-1} — pkg/waiver/adjudicate.go:220-230): build ONE
                   waiver.Finding PER LINE of the diverged file (RuleID = the
                   recipe's declared enforcement rule for that path, File = the
                   diverged path, Line = 1..N), pass the whole slice to
                   waiver.Adjudicate(findings, lineReader, policy, now) with a
                   waiver.LineReader over the consumer file's raw lines, and
                   treat the divergence as COVERED iff at least one finding
                   lands in Result.Suppressed. A single fixed-line finding is
                   WRONG: it would only ever see a token on that line or the
                   one above, and formats like JSON have no comment slot there.
                4. Covered → PRESERVE the on-disk file and append a
                   PreservedDivergence{Path, Rule, CoveringWaiver} — the token
                   that was READ.
                5. Uncovered → REGENERATE (overwrite).
            - USER-OWNED files (targets the recipe does not own) are never
              clobbered by any kind — that check from TASK-022 stands, and is
              DISTINCT from recipe-owned regeneration.
            - NEVER author a waiver token. Call no waiver-writing API; there is
              no bespoke merge/upgrade path.
            - At the end of a successful apply, upsert the AdoptionEntry
              {recipe ref, applied @version, adopted} into the tracked
              project-root record and return it in ApplyResult.Adoption.
