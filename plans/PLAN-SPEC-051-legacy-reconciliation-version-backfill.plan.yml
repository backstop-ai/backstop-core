notes: |
  Implements SPEC-051 (BUNDLE-014 Seed 2, covers requirement-traceability:REQ-015):
  the ONE-TIME legacy corpus reconciliation + `1.0.0` version-backfill sweep that
  makes the artifact corpus uniformly explicit and GREEN at the exact moment
  SPEC-050 (Seed 1) flips mandatory-pin + both-direction resolution ON.

  SHAPE — this plan adds ZERO production code. SPEC-051 explicitly owns no
  pkg/validate code path (SPEC-050 owns `supportsRe`, BuildBundleReqCatalog,
  CollectSupportRefs, ResolveSupports, validateBundleRequirements). The two
  deliverables are (a) a reconciled corpus — a set of artifact edits routed through
  the artifact agents — and (b) a single corpus-assertion test file that CONSUMES
  SPEC-050's public functions over the REAL project artifacts to prove the end
  state. Because the work modifies existing artifacts rather than writing new
  production code, the corpus edits are typed `refactor` (not `implementation`);
  the assertion harness is typed `test`; there are no `implementation` tasks. The
  contracts[] block is `consumes`-only, so no `provides` symbol is created here.

  ARTIFACT-ROUTING (CLAUDE.md law — never hand-edit artifacts): every corpus edit
  MUST be made through the purpose-built artifact agents at implementation time —
  bundle-author for the bundle edits (deprecate agent-definitions; version-stamp
  the ten bundles), spec-author for the spec edits (retire SPEC-002/003/004;
  append the re-home ref to SPEC-040; pin-stamp every live spec). The plan tasks
  describe the TARGET STATE + the validate proof; they do NOT authorize
  hand-editing frontmatter. [agent-guard + validate-artifact]

  ATOMIC CO-LAND (REQ-006, non-negotiable): the current `supportsRe`
  (`^[a-z0-9-]+:REQ-\d{3}$`) REJECTS a pinned `@1.0.0` ref, and SPEC-050's
  tightened `supportsRe` REJECTS an unpinned ref. So the pin-stamp (REQ-005),
  the version stamp (REQ-004), the re-home (REQ-002), and SPEC-050's
  regex/resolution change are a SINGLE merge-sequencing change-train — no
  intermediate committed state may have the old regex facing pinned refs or the
  new regex facing unpinned refs. The only phase whose `artifact validate` is
  green STANDALONE under today's rules is the retirement phase (Phase 2 —
  deprecating specs/bundle is valid now). The version/pin phases assemble into
  the change-train and are proven green only by the FINAL comprehensive
  verification (Phase 4) run with SPEC-050's enforcement UNCONDITIONALLY ON —
  no runtime toggle, no grandfather path.

  EXTERNAL CO-LAND DEPENDENCIES (outside this plan's file scope, both authored in
  parallel):
    - SPEC-050: the assertion test file will not COMPILE until SPEC-050's
      BuildBundleReqCatalog / CollectSupportRefs / ResolveSupports land, and the
      corpus goes green only once its regex tightens. SPEC-050's resolution pass
      MUST also EXCLUDE terminal-status citing specs (mirror of the per-artifact
      supports-format exemption) or the retired SPEC-002/003/004 dangling refs
      still red — flagged to Seed 1; REQ-003 depends on it.
    - SPEC-053 (retroactive-codecheck-deadcode-deletions): the ONLY live coverage
      of BUNDLE-011 REQ-007/REQ-010 is SPEC-053 REQ-007/REQ-010. SPEC-053 must be
      `implemented` and land in the same change-train, or BUNDLE-011 blocks the
      Seed-3 coverage gate. This plan does NOT author SPEC-053 (parallel work); it
      only pin-stamps SPEC-053's own supports refs as part of the REQ-005 sweep and
      asserts BUNDLE-011's coverage flows through it.

  SET RE-MEASUREMENT: the file lists below (ten version-stamp bundles; ~31 live
  pin-stamp specs) reflect the corpus at planning time (2026-07-14, all Seed specs
  authored). The executor MUST RE-MEASURE the exact sets at implementation time by
  the RULE (REQ-004: every REQ of every non-terminal bundle declaring
  requirements[]; REQ-005: every supports ref on every live/non-terminal spec/issue
  requirement, minus the retiring SPEC-002/003/004 and ALL terminal specs
  SPEC-008/011/034/039), not by trusting these frozen lists.

  COVERAGE VACUITY IS EXPECTED (not a defect): SPEC-051 adds only corpus-assertion
  tests, no new production lines, so there is no meaningful coverage delta. The
  anti-vacuous-green concern is answered by the assertion tests proving a genuinely
  green corpus, not by a coverage percentage (Sharp Edges).

