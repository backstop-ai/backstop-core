  ══════════════════════════════════════════════════════════════════════════════
  THE MECHANISM, RESTATED IN ONE PARAGRAPH
  ══════════════════════════════════════════════════════════════════════════════
  A pack-declared grep engine runs `grep -rn -e <pattern> <target>` and pipes stdout
  into a pack-shipped `grep/to-sarif.sh`. That script's awk guard is `NF >= 3` over
  `-F:` — it assumes `file:line:text`. GNU grep (Linux CI) OMITS the filename when the
  target is exactly ONE explicit file, emitting 2-field `line:text`. The guard drops
  every such line SILENTLY. The absence probe therefore reports zero matches for any
  single-file scope on Linux, whatever the file actually contains.

  ══════════════════════════════════════════════════════════════════════════════
  EVIDENCE MEASURED FOR THIS PLAN (2026-08-18, darwin, this repo at HEAD 722d5f1)
  ══════════════════════════════════════════════════════════════════════════════
  Every number below was produced by running the command, not inferred.

  ── (1) THE DEFECT, REPRODUCED WITHOUT LINUX ─────────────────────────────────
  The CI-captured 2-field bytes were fed straight into the shipped script:

      printf '6:// "legacyProbeSymbol" appears here (even in a comment-adjacent identifier), the\n8:func legacyProbeSymbol() string { return "should have been deleted" }\n' \
        | /bin/sh packs/contracts/grep/to-sarif.sh

  → exit 0, `"results": []`. TWO real matches, ZERO SARIF results, no diagnostic.
  THE DEFECT IS FULLY REPRODUCIBLE ON DARWIN because it lives in the CONSUMING side,
  not in grep. No Linux runner is needed to drive it RED.

  ── (2) WHY A HEURISTIC 2-FIELD PARSE IS THE WRONG FIX ───────────────────────
  The issue offers "make the awk robust to both shapes" as a candidate. It was
  MEASURED and it is unsound — the two shapes are not distinguishable:

      printf '6:42: legacyProbeSymbol\n' | /bin/sh packs/contracts/grep/to-sarif.sh
      → exit 0, ONE result, uri "6", startLine 42

  That is line 6 of some file, whose matched text happens to begin `42:`. A parser
  that "handles both shapes" must guess, and here it FABRICATES a finding at a file
  named `6` that does not exist. A silent false negative would be traded for a silent
  false positive in the same security-relevant probe. Related, also measured:

      printf '6:note: legacyProbeSymbol here\n' | /bin/sh packs/contracts/grep/to-sarif.sh
      → exit 5, `jq: parse error: Invalid numeric literal` (loud, but illegible)
      printf '' | /bin/sh packs/contracts/grep/to-sarif.sh
      → exit 0, well-formed SARIF with an EMPTY results array (correct; must survive)

  ── (3) `-H` IS SAFE, IDEMPOTENT, AND SUPPORTED ON BOTH PLATFORMS ────────────
  Measured against the real BSD grep at `/usr/bin/grep`
  (`grep (BSD grep, GNU compatible) 2.6.0-FreeBSD`) over a two-file fixture tree.
  ★ USE THE ABSOLUTE PATH `/usr/bin/grep` WHEN RE-MEASURING BY HAND: an interactive
  shell in this environment may define a `grep` FUNCTION wrapping `ugrep`, which is
  NOT what Go's `exec.Command("grep", ...)` resolves. `command -v -p grep` →
  `/usr/bin/grep`, and that is the only `grep` binary on PATH.

      target                     without -H                  with -H
      one explicit file, -rn     one.go:2:…                  one.go:2:…   (identical)
      one explicit file, no -r   2:…                         one.go:2:…   (DIFFERS)
      two explicit files         one.go:2:… sub/three.go:2:… identical
      a directory                ./one.go:2:… ./sub/…        identical

  Two conclusions, both load-bearing:
    * `-H` is IDEMPOTENT for every case that works correctly today (multi-file and
      directory targets are byte-identical with and without it), so adding it is not
      a behavior change for the working paths — it only pins the one that diverges.
    * BSD grep 2.6.0 supports `-H` and documents it ("-H  Always print filename
      headers with output lines."); GNU grep documents the same flag with the same
      meaning. This is genuine darwin/Linux parity, not a Linux-only patch.

  ── (3b) grep EMITS NON-MATCH LINES ON STDOUT, AND HALF B WOULD REFUSE THEM ──
  ★ THE TRAP THAT ALMOST SHIPPED. `-H` is not the only thing that shapes stdout.
  Measured on real BSD grep over a tree containing a binary file:

      /usr/bin/grep -rn -H -e legacyProbeSymbol .        # 2>/dev/null
      → ./one.go:1:legacyProbeSymbol here
        ./sub/two.go:1:legacyProbeSymbol two
        Binary file ./blob.bin matches        ← STDOUT. stderr was EMPTY.

  That last line is not a match and has no `file:line:` shape. TODAY the `NF >= 3`
  guard drops it, which is CORRECT — it is not a finding. Under a naive Half B it
  becomes a HARD REFUSAL: a false gate failure, on darwin as well as Linux, and worst
  of all in the RELEASED pack, where any consumer's directory-scoped absence contract
  over a tree containing a single binary file would hard-fail their gate.
  Repo-wide `grep -rn -H` over backstop-core already produces 9 such lines. It does
  not fire in-repo today only because core's own contract scopes are `.go` files and
  `pkg/gate` — an accident of scope, not a property of the design.

  THE DECISION: option (a) — pass `-I` alongside `-H` at every declaration and helper.
  It is chosen over a wording-based carve-out in the refusal predicate for three
  measured reasons:
    * `-I` IS SARIF-OUTPUT-NEUTRAL. Through the CURRENT (unfixed) script, the same
      corpus yields 2 results WITH `-I` and 2 results WITHOUT it — the binary line
      never became a finding either way. So `-I` changes ZERO output today; it removes
      only the line Half B would otherwise refuse. Same idempotence argument as `-H`,
      same method.
    * `-I` IS CROSS-PLATFORM BY ITS OWN DOCUMENTATION. BSD grep 2.6.0: "-I  Ignore
      binary files. This option is equivalent to the `--binary-files=without-match`
      option." GNU grep documents `-I` as that exact equivalence. One flag, one
      meaning, both greps.
    * IT MAKES THE UNVERIFIABLE QUESTION MOOT. GNU grep ≥3.5 reportedly routes this
      notice to STDERR with different wording. ★ THAT WAS NOT VERIFIED HERE — there is
      no GNU grep on this darwin machine (`ggrep` absent from both homebrew prefixes,
      checked). A carve-out predicate would have to match wording and stream that this
      session cannot measure, which is precisely the guessing Half A exists to avoid.
      With `-I` the line is never emitted on EITHER platform, so the difference stops
      mattering. TASK-012 still reports the GNU-side behavior from the real Linux run,
      as a recorded observation rather than a load-bearing assumption.
  A pack that declares grep WITHOUT `-I` now gets a LOUD refusal instead of a silent
  drop. That is the intended trade — it is actionable, and TASK-003 requires the
  refusal diagnostic to name `-I`/`-H` as the remedy so an operator is not left
  guessing (sharp edge 15).

