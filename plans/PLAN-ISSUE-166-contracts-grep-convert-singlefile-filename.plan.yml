             shape. Pinned by a source sweep over `*_test.go`, so a fifth helper
             cannot be added without the flag.
    CLM-005  BOTH flags are proven platform-safe and idempotent by a real-grep
             characterization test: with `-H` the filename prefix is ALWAYS present
             (asserted — invariant on both greps); for the multi-file and directory
             targets that already worked, `-H` and non-`-H` output are byte-identical
             (asserted); and `-I` changes the SARIF result set not at all, while
             removing grep's non-match `Binary file … matches` stdout line that a
             loud-refusal convert would otherwise reject (asserted, both legs). The
             single-file non-`-H` shape is RECORDED, never asserted.
    CLM-006  The released `backstop-ai/go-contracts` pack carries the same fix and
             core consumes it: source repo edited, version bumped, tagged and pushed;
             `backstop.yml` + `backstop.lock` updated via the real `pack update`; and
             the installed tree's declaration and convert both verified in-repo,
             following the established `installedContractsPackName` guard convention.
    CLM-007  Non-regression AND thin-executor purity: the contracts test family
             ISSUE-166 names passes locally, with no fixture weakened, no assertion
             softened, no `t.Skip` added and no `requireAstGrepE2E` guard changed; and
             non-test code under `pkg/` and `cmd/` declares NO grep invocation — the
             tool name reaches the runner only from pack DATA. ★ THIS IS PINNED BY AN
             EXECUTABLE SWEEP, not by a reviewer's manual grep. A fence carried only by
             prose in a verification report is the same "kept aligned by hope" failure
             this lane exists to remove, and it would be the one claim in this plan with
             nothing checking it.
    CLM-008  SPEC-069 (`status: implemented`) no longer pins the stale literal
             `command: grep -rn` in the prose describing the hermetic-remote acceptance
             fixture packs this lane edits. Corrected via a ROUTED `/spec` dispatch, in
             the open, per this repo's align-predating-artifacts convention — not left
             to drift silently because it happens not to red the gate.

  ══════════════════════════════════════════════════════════════════════════════
  SHARP EDGES
  ══════════════════════════════════════════════════════════════════════════════
   1. NEVER ADD A 2-FIELD PARSE. Section 2 measured it: `6:42: text` is genuinely
      ambiguous, and a "robust" parser emits a finding at a file named `6`. Trading a
      silent false negative for a silent false positive in an absence probe is worse
      than the bug. The convert REFUSES what it cannot parse; it never guesses.
   2. THE LOUD REFUSAL MUST NOT FIRE ON EMPTY INPUT. Zero matches is the ORDINARY
      case for an absence probe and must stay exit 0 with an empty `results` array
      (measured in section 2). The refusal is per-LINE, for lines that exist and do
      not parse. Getting this backwards turns every clean run into a red.
   3. STRENGTHEN THE PREDICATE, DO NOT JUST COUNT FIELDS. `NF >= 3` also admits
      `6:note: text` (which currently dies in `jq` with an illegible numeric-literal
      error) and `a:b.go:8:text`. The parse condition is `<something>:<digits>:` —
      field 2 must be all digits. Anything else refuses with the legible diagnostic.
      Filenames containing colons remain unsupported; that is already true today, and
      after this change it is LOUD instead of a `jq` stack trace.
   4. DO NOT OPEN `/dev/stderr` FROM awk. ISSUE-168 is an open, separately-filed
      defect about `/dev/null` WRITES being denied under the convert sandbox; treat
      `/dev/stderr` as equally suspect. The proven-safe mechanisms in this script are
      the shell's own `>&2` (already used at line 11 of the contracts convert) and
      awk's EXIT STATUS. The default shape is therefore: capture awk's stdout in a
      command substitution, and on a nonzero awk status have the SHELL echo the
      captured diagnostic to `>&2` and exit nonzero — no new file opens, no new
      spawned process. If a different mechanism is chosen, it must be MEASURED under
      `TestE2E_ContractsRealAstGrepAndGrep_AndSandboxedConvert`, not assumed.
   5. FIVE CONVERTS, NOT TWO, AND TWO OF THEM ARE A DIFFERENT SCRIPT. The issue names
      two files. Section 6 enumerates five repo-owned ones; the two hermetic-remote
      converts use `/^[^:]*:[0-9]+:/` and pure-awk JSON with no `jq`. Their fix is the
      same PROPERTY, not the same PATCH — do not paste the `jq` version over them, and
      do not "harmonize" their `ruleId` or drop their awk-only assembly. That
      independence is deliberate (their header comments say so).
   6. DO NOT REDECLARE EXISTING PACKAGE CONSTS OR HELPERS. `pkg/pack/engine` is ONE
      package and already defines `repoRoot(t)`
      (`contracts_grep_engine_test.go:24`), `tracePackRel`, `tsPackRel` and
      `durablePackRel`. A colliding declaration in a new test file fails the compile
      and blocks every other lane in this shared tree; a differently-named duplicate
      is silent drift. Reuse them.
   7. `-H` GOES BEFORE `-e`, IN THE `command:` STRING. Dispatch shapes argv as
      [command tokens…] [input_flag] [pattern] [targets…], so the manifest becomes
      `command: grep -rn -H`, yielding `grep -rn -H -e PAT target`. Verified to work.
      Do NOT try to append it after the pattern and do NOT reach into core to inject
      it (fence: core gains no grep knowledge).
   8. THE INTERACTIVE SHELL'S `grep` MAY NOT BE THE DISPATCHED ONE. In this
      environment an interactive shell defines a `grep` FUNCTION wrapping `ugrep`;
      `exec.Command("grep", …)` resolves `/usr/bin/grep`. When hand-measuring grep
      behavior, use the absolute path, or a "confirmed" reading will describe a tool
      the gate never runs.
   9. `.backstop/packs/` IS NEVER EDITED. It is gitignored install output. The
      installed `go-contracts` copy is fixed at
      `/Users/bmanson/src/projects/backstop-go-contracts-pack`, bumped, TAGGED and
      pushed, then pulled in with `pack update`. Version resolution is git-TAG-based:
      a `pack.yml` version bump with no matching `v<version>` tag pushed to
      `backstop-ai/go-contracts` will not resolve, and the failure looks like a
      network problem rather than a missing tag.
  10. A TEST THAT READS AN INSTALLED PACK NEEDS THE ESTABLISHED GUARD. Follow
      `cmd/backstop/pack_claim_index_test.go` (see `installedContractsPackName`,
      ~line 333): load through the production path, and `t.Skipf` with a
      `./bin/backstop pack install` directive when the fleet is absent — a LOAD ERROR
      still fails. Do not invent a new guard shape, and do not `t.Skip` anything else
      in this lane (sharp edge 12).
  11. THE FALSIFICATION WINDOW IS ORDER-DEPENDENT AND UNRECOVERABLE. Each RED must be
      OBSERVED and its output RECORDED before the corresponding fix lands. "It would
      have failed" is not evidence. In particular, run
      `TestGrepConvert_RefusesUnparseableGrepLineLoudly` against the UNFIXED scripts
      and capture the exit-0/empty-results state — after TASK-003 that state cannot be
      reproduced without a revert.
  12. NO `t.Skip` IN THIS LANE'S NEW TESTS, AND NONE ADDED TO EXISTING ONES. The one
      sanctioned exception is the installed-fleet guard in sharp edge 10. A skipped
      test in a defect whose whole nature is a SILENT pass is the same failure wearing
      a different hat.
  13. CHECK WHETHER THE `Scanned` GUARD WAS ALSO LYING. `pkg/gate/contract_verdict.go`
      carries a "declared scope was not scanned — refusing to pass silently" branch. If
      `Scanned` is derived from the convert's SARIF output, then the silent drop
      disarmed that guard too, and Half B restores it. MEASURE which it is and say so
      in TASK-006's report; do not assume either way. If the guard turns out to be
      independent of the SARIF, that is worth recording as the reason the failure
      surfaced as "got 0" rather than as a refusal.
  14. LOCATE EVERY EDIT SITE BY NAME, NOT BY LINE NUMBER. The line numbers in sections
      4, 5 and 6 were true at HEAD `722d5f1` and are navigational aids only. Find
      `command: grep` in each manifest and the `"grep", "-rn"` argv in each helper by
      searching for the text.
  15. NOT EVERY LINE ON grep's STDOUT IS A MATCH, AND HALF B MUST NOT PRETEND OTHERWISE.
      BSD grep writes `Binary file ./blob.bin matches` to STDOUT, interleaved with real
      matches (measured, notes section 3b; stderr was empty). Today it is harmlessly
      dropped; a naive loud refusal turns it into a FALSE gate failure — most damagingly
      in the released pack, where a consumer's directory-scoped absence contract over a
      tree holding any binary would hard-fail. The chosen answer is `-I` at the source
      (output-neutral, cross-platform by its own man page), NOT a wording-based
      carve-out in the refusal predicate — GNU's wording and stream for this notice
      could not be measured from darwin, and matching text this session cannot observe
      is the guessing Half A exists to avoid. TASK-001 carries a fixture for it.
      Consequently the refusal DIAGNOSTIC must name `-H`/`-I` as the remedy: whoever
      trips this is a pack author who omitted a flag, and the message is their only clue.
  16. A PACK MANIFEST IS IDENTIFIED BY SHAPE, NOT BY FILENAME. `pkg/pack/engine/testdata/
      contracts-grep-engine.yml` is a real convert-bearing grep declaration that is not
      called `pack.yml`. Any sweep, predicate or edit list keyed on the literal filename
      is already known to be incomplete. Parse candidates with the real manifest reader
      and let the parse decide — that also excludes plan/spec prose for free. If a
      widened walk ever finds a SEVENTH declaration, that is a genuine finding: fix it
      and say so, do not narrow the predicate until the count matches the plan.

phases:
  # ═══════════════════════════════════════════════════════════════════════════
  # Phase 1: RED — pin the output-shape contract with executable tests
