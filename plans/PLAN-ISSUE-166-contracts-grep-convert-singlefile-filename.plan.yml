  - id: phase-1
    name: "Phase 1: RED — executable pins on grep's output shape and its conversion"
    tasks:
      - id: TASK-001
        type: test
        title: "Pin convert-script robustness against the real GNU 2-field shape, and characterize -H (RED)"
        description: |
          Create `pkg/pack/engine/grep_convert_shape_test.go` (package `engine`, the
          same package as `contracts_grep_engine_test.go`). Run these BEFORE TASK-003
