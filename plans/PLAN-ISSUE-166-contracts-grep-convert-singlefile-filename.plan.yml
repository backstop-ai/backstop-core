  ── (7) WHY THIS IS A LIVE PRODUCTION FALSE NEGATIVE, NOT ONLY A TEST FAILURE ─
  `pkg/gate/step_contract.go` documents the absence probe's scope as "file-OR-path"
  (REQ-012/CLM-010) and `pkg/gate/contract_verdict.go:105` falls the absence scope
  back to `File` when `Scope` is empty. A SINGLE-FILE absence scope is a first-class,
  documented input — and it is precisely the shape GNU grep breaks. backstop-core's
  own spec corpus declares real absence contracts: the marker is the `absent: true`
  field on a `contracts.provides` entry (39 occurrences across `specs/`, mapping to
  `ContractEntry.Absent`). ★ IT IS NOT `kind: absence` — an earlier draft of this plan
  said that, and it is wrong: inside a `provides` entry `kind:` names the declared
  TYPE (function/method/type), and grepping the literal `kind: absence` returns 112
  CLAIM-level hits that have nothing to do with contracts. The substance is unchanged;
  the field name was. So on Linux CI, core's own
  contracts gate silently confirms absence for every file-scoped absence contract
  regardless of what the file contains. That is the vacuous green this repo exists to
  prevent, and it is why Phase 3 (the released pack) is not optional polish.

  ══════════════════════════════════════════════════════════════════════════════
  THE CHOSEN FIX — BOTH HALVES, AND WHY NEITHER ALONE IS ENOUGH
  ══════════════════════════════════════════════════════════════════════════════
  The issue asked the plan to choose between fixing the INPUT shape and fixing the
  CONSUMING side. The measured answer is that they are not alternatives: one is the
  correctness fix and the other is what stops the same class recurring silently.

  HALF A — FORCE THE INPUT SHAPE (`-H -I`). This is THE fix. It removes the ambiguity
  rather than guessing at it, both flags are idempotent for every path that works today
  (measured, sections 3 and 3b), and both behave identically on GNU and BSD grep.
  `-H` guarantees the filename is present; `-I` guarantees grep emits no non-match
  informational line on stdout for Half B to trip over. Applied at all SIX
  convert-bearing declarations AND all four test helpers.

  HALF B — MAKE THE SILENT DROP LOUD. The `NF >= 3` guard is not merely wrong about
  the shape; it is wrong about what to DO with input it cannot parse. Dropping a line
  from a security-relevant absence probe with exit 0 and no diagnostic is the exact
  silent-vacuous-green shape this repo forbids. Half B replaces the drop with a
  REFUSAL: nonzero exit plus a stderr diagnostic naming the offending line. It does
  NOT add a 2-field parse (section 2 shows why that fabricates findings).

  Why both: Half A alone leaves the trap armed. Any future pack author declaring
  `command: grep -rn` without `-H` — the obvious spelling, and the one four packs in
  this repo already used — re-arms an identical silent false negative that nothing
  catches until a real Linux run. With Half B, that same mistake goes RED loudly on
  the first dispatch. Half B is what makes the convention operable rather than a
  comment nobody reads.

  ── WHAT CORE DOES NOT DO, DELIBERATELY ──────────────────────────────────────
  ★ CORE GAINS NO grep KNOWLEDGE. Not a `-H` injection, not a filename-shape
  normalizer, not a grep-aware SARIF fallback. `grep -rn` is a PACK-DECLARED
  `command:` string; backstop is a thin executor with zero baked tool knowledge
  (CLAUDE.md, first principle). The fix is pack DATA and test-helper argv, in every
  case. Any diff that adds a grep literal to non-test code under `pkg/` or `cmd/` has
  taken the forbidden fix. CLM-007 pins this by measurement.

  ── THE ISSUE'S OPEN "KEEP THEM BYTE-IDENTICAL?" QUESTION, ANSWERED ──────────
  DECISION: do NOT make byte-identity the enforced convention. Make the BEHAVIOR
  structural instead.
    * Byte-identity cannot cover the family. Two of the six grep converts in this repo
      are deliberately divergent (section 6) — they carry their own `ruleId` and avoid
      `jq` on purpose. A byte-identity rule would have to exempt them, producing a
      two-tier convention that drifts exactly the way the current "hope" already did.
    * Byte-identity cannot cross the repo boundary. The fourth copy lives in
      `backstop-ai/go-contracts`, a separate repo on its own release cycle. No test in
      core can assert equality against it.
    * The property that actually FAILED is behavioral, not textual: a grep→SARIF
      convert silently dropped a line. `TestGrepConvert_RefusesUnparseableGrepLineLoudly`
      asserts that property over EVERY grep convert the repo owns, divergent ones
      included, by DISCOVERING them rather than listing them. A new copy — the failure
      mode that hid `ts-proof-pack` — is covered the moment it exists.
  RESIDUAL, EXPLICITLY DEFERRED, NOT ABSORBED: nothing proves the in-repo pack sources
  and their released external mirrors stay in sync. That is a general problem across
  `go-contracts`, `go-substantiveness` and the traceability packs — not specific to
  this defect, and not something a contained bug fix should invent a mechanism for.
  TASK-011 files it as its own issue via a routed `/issue` dispatch.

  ══════════════════════════════════════════════════════════════════════════════
  HOW THIS IS TESTED HONESTLY ON DARWIN
  ══════════════════════════════════════════════════════════════════════════════
  The defect is a GNU-vs-BSD divergence and this session's platform is darwin. The
  split that keeps the tests meaningful:

    * CONVERSION LOGIC — tested with SYNTHETIC stdin, grep never invoked. The exact
      bytes GNU grep emitted on the real Linux run (quoted verbatim in the issue) are
      piped into each convert script. This is platform-independent, reproduces the
      defect exactly, and is a genuine correctness assertion. It is the RED.
    * REAL GREP — a CHARACTERIZATION test, and only its platform-INVARIANT half is
      asserted: with `-H`, output always carries the filename prefix; and for
      multi-file and directory targets, `-H` and non-`-H` output are byte-identical.
      Both hold on GNU and BSD. The single-file WITHOUT-`-H` shape is RECORDED with
      `t.Log`, never asserted — darwin's grep is DIFFERENT, not WRONG, and an
      assertion there would be a platform lock-in masquerading as a correctness check.
    * WHAT DARWIN CANNOT PROVE: that the ~30 named CI tests go green on Linux. Only a
      real Linux run confirms that. TASK-012 owns the CI confirmation and it is
      recorded as a CI-only obligation, not claimed from a local reading
      ([[project_platform_gated_defect_verification_ceiling]]).

