          or any of `tracePackRel` / `tsPackRel` / `durablePackRel` (sharp edge 6).

          ★ THESE TESTS INVOKE NO NEW GO SYMBOL. They shell existing scripts and real
          grep, so the RED is a RUNTIME failure, never a compile failure — a
          non-compiling `pkg/pack/engine` would block every other lane in this shared
          tree.

          TestGrepConvert_RefusesUnparseableGrepLineLoudly (CLM-001).
            DISCOVER the convert scripts rather than listing them: walk from
            `repoRoot(t)` for files matching `*/grep/to-sarif.sh`, EXCLUDING any path
            under `.backstop/` (installed output, not repo-owned) and under `.git/`.
            Assert the discovered set is NON-EMPTY and log the paths — a discovery bug
            that finds nothing would otherwise pass vacuously. At HEAD the set is the
            five in section 6 of the notes; assert the COUNT is at least five and log
            any extras rather than hardcoding the list, so a new copy is covered on
            creation (this is the byte-identity decision made operable).
            For EACH discovered script, run it under `/bin/sh` with the VERBATIM bytes
            GNU grep emitted on the real Linux run, quoted from ISSUE-166:

                6:// "legacyProbeSymbol" appears here (even in a comment-adjacent identifier), the
                8:func legacyProbeSymbol() string { return "should have been deleted" }

            State those two lines ONCE as a single test-file constant and feed every
            script from it. Assert, per script:
              * the exit status is NON-ZERO;
              * stderr NAMES the offending line (contains a distinctive substring of
                it) AND states the expected `<file>:<line>:<text>` shape, so an
                operator can tell WHICH line and WHY without re-running;
              * stdout carries NO SARIF result — an empty document or nothing at all,
                but never a fabricated finding.
            PRE-FIX STATE, measured 2026-08-18: exit 0, stderr only the existing
            "grep to-sarif: transforming matches" banner, stdout a well-formed SARIF
            with `"results": []`. That is the silent false negative, verbatim.

            ★ THIRD FIXTURE — grep's OWN NON-MATCH LINE (sharp edge 15). This case is
            the one the first draft of this test set would have missed entirely, and
            missing it is what would have shipped a false gate failure. Feed each
            script a realistic INTERLEAVED stream, exactly as BSD grep emits it:

                ./one.go:1:legacyProbeSymbol here
                Binary file ./blob.bin matches
                ./sub/two.go:1:legacyProbeSymbol two

            Assert the script REFUSES (nonzero exit) and that its stderr names the
            `Binary file …` line specifically AND names `-I` as the remedy — an
            operator who trips this is a pack author who omitted a flag, and the
            message is their only clue. Comment in the test body that this refusal is
            DELIBERATE and is why every declaration passes `-I`: the correct fix is to
            stop the line being emitted, not to teach the convert grep's notice
            wording, which differs between BSD and GNU and could not be measured for
            GNU from darwin (notes section 3b).
            ★ DO NOT assert that the two real matches still convert here. Refusal means
            refusal; a test expecting partial output would license a "skip the weird
            line and keep going" implementation, which is the silent drop returning
            under a new name.

          TestGrepConvert_ThreeFieldMatchesAndEmptyInputUnchanged (CLM-002).
            The preservation leg — it must be GREEN before AND after, and it is what
            stops TASK-003 from "fixing" the drop by refusing everything. Over the
            same discovered set, three subtests:
              * HAPPY PATH — `a.go:8:func legacyProbeSymbol() string { return "x" }`
                yields exit 0 and exactly ONE result with uri `a.go`, startLine 8, and
                the matched text intact.
              * COLON IN MATCH TEXT — `a.go:8:const x = "http://y"` still yields ONE
                result whose text retains everything after the SECOND colon. Only the
                first two colons are structural; a naive field re-join truncates here.
              * EMPTY STDIN — exit 0 and a well-formed SARIF document with an EMPTY
                results array (sharp edge 2). Assert the document PARSES; empty stdout
                is a failure, not a pass.
            The two hermetic-remote converts emit their own `ruleId`s, so assert on
            result COUNT and location, never on a `ruleId` literal (sharp edge 5).

          TestRealGrep_FilenameHeaderWithDashHIsPlatformInvariant (CLM-005).
            THE CHARACTERIZATION TEST. Build a `t.TempDir()` fixture: two TEXT files
            containing the probe token, one of them in a subdirectory, PLUS a BINARY
            file that also contains it (write bytes including a NUL and a high byte —
            that is what makes grep classify it binary). The binary file is required,
            not decoration: it is what lets the `-I` legs below be able to fail.
            Resolve grep with `exec.LookPath("grep")` and `t.Fatalf` if absent (no skip,
            sharp edge 12); LOG the resolved absolute path, because the shell's `grep`
            may be a different tool entirely (sharp edge 8).
            ASSERT ONLY WHAT IS TRUE ON BOTH GREPS:
              * WITH `-H`, EVERY output line carries a filename prefix — for a single
                explicit file, for two explicit files, and for a directory target.
                Apply this only to MATCH lines; see the `-I` leg for why there are no
                others once the flags are right.
                This is the invariant the whole fix rests on.
              * `-H` IS IDEMPOTENT where it already worked: for the two-file target and
                for the directory target, output WITH `-H` is byte-identical to output
                WITHOUT it (after sorting lines, since directory walk order is not
                specified). This is what proves TASK-004/TASK-005 are not a behavior
                change for the paths that work.
              * WITH `-I`, EVERY stdout line of a directory scan parses as
                `<file>:<digits>:<text>` — i.e. grep emits no informational line at all.
                This is the assertion that keeps sharp edge 15 closed, and it is
                platform-neutral: it asserts the ABSENCE of a notice rather than its
                wording, so it holds whether the host grep would have written that
                notice to stdout (BSD, measured) or to stderr (GNU, reported but NOT
                measurable from darwin).
              * `-I` IS RESULT-NEUTRAL: pipe the directory scan through the pack convert
                both WITH and WITHOUT `-I` and assert the SARIF result COUNT is the
                same. Measured 2026-08-18 against the unfixed script: 2 results either
                way. The binary file's content never became a finding, so suppressing it
                removes no evidence — it removes only the line Half B must not choke on.
                ★ This leg must pass BOTH before and after TASK-003; if it ever fails
                after, the refusal was implemented too broadly.
            RECORD, NEVER ASSERT: run the single-explicit-file target WITHOUT `-H` and
            `t.Log` the raw stdout with a comment explaining that GNU omits the
            filename here and BSD does not, that both are correct, and that asserting
            either would be a platform lock-in. Measured on darwin 2026-08-18: BSD grep
            2.6.0-FreeBSD PRINTS the filename for `-rn` over a single file, so this leg
            logs the 3-field shape locally and the 2-field shape on Linux. Say so in
            the test body so a future reader does not "fix" the log into an assertion.
        files:
          - pkg/pack/engine/grep_convert_shape_test.go
        claims:
          - CLM-001
          - CLM-002
          - CLM-005
        test_names:
          - TestGrepConvert_RefusesUnparseableGrepLineLoudly
          - TestGrepConvert_ThreeFieldMatchesAndEmptyInputUnchanged
          - TestRealGrep_FilenameHeaderWithDashHIsPlatformInvariant
        depends_on: []

      - id: TASK-002
        type: test
        title: "Pin the -H/-I convention over every declaration and helper, and the thin-executor fence (RED)"
        description: |
          Create `pkg/pack/engine/grep_dispatch_convention_test.go` (package `engine`).
          All three tests are SOURCE SWEEPS — they read repo files, invoke nothing, and
          are what make these conventions operable instead of comments. Run them BEFORE
          TASK-004/TASK-005 and record the RED (sharp edge 11).

          Reuse `repoRoot(t)`; declare no colliding helper (sharp edge 6).

          TestGrepEngineDeclarations_ForceFilenameHeader (CLM-003).
            ★ WALK FOR MANIFESTS BY SHAPE, NOT BY FILENAME (sharp edge 16). Walk from
