  # ═══════════════════════════════════════════════════════════════════════════
  # Phase 2: GREEN — both halves of the fix, in-repo
  # ═══════════════════════════════════════════════════════════════════════════
  - id: phase-2
    name: "Phase 2: GREEN — loud refusal in the converts, -H at every declaration and helper"
    tasks:
      - id: TASK-003
        type: implementation
        title: "Replace the silent NF>=3 drop with a loud, legible refusal in all five repo-owned grep converts"
        description: |
          HALF B. Make every repo-owned grep→SARIF convert REFUSE input it cannot parse
          instead of dropping it. Do NOT add a 2-field parse (sharp edge 1).

          THE PARSE PREDICATE, stated once and applied in both script families: a line
          is parseable iff it matches `<anything>:<one-or-more-digits>:` — i.e. field 2
          under `-F:` is entirely digits (sharp edge 3). Everything before the first
          colon is the file; everything after the second is the text, recovered by
          stripping the prefix, never by re-joining fields (a match may contain colons).

          ON AN UNPARSEABLE LINE: emit a diagnostic to STDERR naming the offending line
          and the expected `<file>:<line>:<text>` shape, and exit NON-ZERO. Emit no
          SARIF result for it. ON EMPTY INPUT: unchanged — exit 0 with a well-formed
          SARIF document carrying an EMPTY results array (sharp edge 2). The refusal is
          per-LINE and only for lines that exist.

          ★ THE DIAGNOSTIC MUST NAME THE REMEDY, NOT ONLY THE SYMPTOM (sharp edge 15).
          Whoever trips this is almost always a pack author whose grep declaration is
          missing a flag — most commonly `-I`, because grep writes
          `Binary file <path> matches` to STDOUT as a NON-match line and this predicate
          correctly refuses it. State in the message that the command must pass `-H -I`.
          Without that sentence the refusal is a mystery exit code in someone else's
          repo. NOTE WHAT THIS DELIBERATELY DOES NOT DO: it does not special-case grep's
          notice wording. That wording and its stream differ between BSD and GNU and
          could not be measured for GNU from this machine; matching unmeasurable text is
          the guessing Half A exists to avoid. `-I` stops the line being produced at all.

          ★ THE STDERR MECHANISM IS CONSTRAINED BY THE SANDBOX (sharp edge 4). Do not
          open `/dev/stderr` or `/dev/null` from awk — ISSUE-168 is an open defect about
          exactly that class of denial. The DEFAULT SHAPE, which uses only mechanisms
          this script already proves work (the shell's `>&2`, and awk's exit status):

              out=$(awk '…')            # awk prints the diagnostic text to STDOUT and
              st=$?                     # exits 1 on the first unparseable line
              if [ "$st" -ne 0 ]; then
                echo "grep to-sarif: $out" >&2
                exit 1
              fi
              printf '%s\n' "$out" | jq -s '…'

          If a different mechanism is chosen it must be MEASURED under
          `TestE2E_ContractsRealAstGrepAndGrep_AndSandboxedConvert`, not assumed.

          TWO SCRIPT FAMILIES, ONE PROPERTY, TWO PATCHES (sharp edge 5):
            * The `jq`-based family — `packs/contracts/grep/to-sarif.sh`,
              `pkg/gate/testdata/traceability-pack/grep/to-sarif.sh`,
              `pkg/gate/testdata/ts-proof-pack/grep/to-sarif.sh` — currently byte-
              identical. Keep them byte-identical to each other after this change; that
              is a convenience, not the enforced contract (the notes explain why the
              contract is behavioral).
            * The pure-awk family —
