      - id: TASK-002
        type: implementation
        title: "Add the Pattern field, the single dispatch-input authority, and pattern-arg eligibility"
        description: |
          Two files, both edits additive.

          pkg/packval/manifest.go — add to `Rule`, beside the RulePath/File pair:

              // Pattern is the INLINE rule expression a pattern-arg engine passes as a
              // command argument instead of resolving a rule file on disk. It mirrors the
              // gate-runtime model's own field (pkg/pack.Rule, SPEC-035 REQ-004); packval's
              // model never carried it, so the key was silently dropped at unmarshal and
              // every pattern-arg rule's fixtures went undispatched (ISSUE-142).
              Pattern string `json:"pattern,omitempty" yaml:"pattern,omitempty"`

          and, immediately after `RuleSourceManifestKey`, the single authority:

              // RuleDispatchInput resolves the FIRST engine argument for this rule's fixture
              // dispatch, and is the ONLY place that choice is made — the same
              // single-authority shape RuleSourcePath established for the rule-file keys
              // (ISSUE-092). A pattern-arg engine consumes the inline pattern STRING as a
              // command argument; every other input mode consumes the declared rule SOURCE
              // PATH. An empty return means the rule declares nothing this engine can
              // consume, and the caller must fail loud rather than skip.
              func (r Rule) RuleDispatchInput(mode engine.InputMode) string {
                  if mode == engine.InputModePatternArg {
                      return r.Pattern
                  }
                  return r.RuleSourcePath()
              }

          `pkg/pack/engine` is already imported by this file (resolveEngine), so no
          new import is needed.

          pkg/packval/phase3.go — restructure the TOP of `RunFixtures`' ruleset loop
          only. Locate the loop by name; the issue's line numbers are stale.

            1. Keep `ruleSource := rule.RuleSourcePath()` as it is.
            2. Widen the eligibility condition from `if ruleSource != ""` to
               `if ruleSource != "" || rule.Pattern != ""`, with a comment stating
               that a rule is dispatch-eligible when it declares ANY engine input
               and that gating on the path alone left every pattern-arg rule
               permanently undispatched (ISSUE-142).
            3. Inside, after the binding resolves, compute
               `dispatchInput := rule.RuleDispatchInput(binding.InputMode)` (declared
               `dispatchInput := ""` above the block so it is in scope for the
               fixture loops).
            4. When `haveBinding && dispatchInput == ""`, append a ValidationError
               with Check "pattern-arg-input", Rule set to rule.ID, a Message naming
               the engine and its declared input_mode and saying the rule declares no
               inline pattern, and a FixHint pointing the pack author at the
               `pattern:` key. This is CLM-006 and it mirrors the gate's own
               `broken pack %s: pattern-arg rule %s declares no pattern` refusal in
               `gatherEngineInputs`.
            5. SE2 — the `semgrep-rule-id` cross-check must now carry
               `ruleSource != ""` as its own condition in addition to the existing
               `haveBinding && binding.InputMode == engine.InputModeRuleFlags`.
               Do not touch its comment block (SE3).
            6. Change the two fixture-loop guards from
               `if ruleSource != "" && haveBinding` to
               `if dispatchInput != "" && haveBinding`, and both
               `executor.RunEngine(packDir, binding, []string{ruleSource, f.Path})`
               calls to pass `dispatchInput` as the first target.

          DO NOT touch: the validator branches (their inverted polarity is
          deliberate and pinned by TestPackVal_P3_ValidatorPolarityUnchangedByFindingsFix),
          the tool_config loop, the scaffold loop, `buildEngineArgv` (SE1), or
          pkg/packval/phase1.go.

          Run `go test ./pkg/packval/... -race -count=1` and land all seven
          TASK-001 tests green before moving on.
