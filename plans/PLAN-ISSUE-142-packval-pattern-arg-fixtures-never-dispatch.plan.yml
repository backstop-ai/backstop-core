          go-contracts-mirror-inverted-fixture-polarity` to reserve the ID, then
          hand the content to the issue-author agent. Do NOT hand-write the issue
          file.

          THE ISSUE MUST CARRY ALL FOUR OF THESE, stated as measured, with the
          measurement date (2026-08-17) and the reading method:

            1. THE DEFECT. `.backstop/packs/backstop-ai/go-contracts` (declared
               `backstop-ai/go-contracts: 1.2.0` in backstop.yml, present in
               backstop.lock) carries the same 7 pattern-arg rules as the in-repo
               `packs/contracts` source with the SAME inverted fixture slots —
               `contract-signature` positive -> sig-mismatch.go, the five kind
               rules positive -> sig-kinds-present.go — and the same stale
               comment "positive fixtures DECLARE the kind, negatives OMIT the
               declared names." Read out of the installed manifest.

            2. THE NEWLY-CREATED CONSEQUENCE. Once this plan's phase 1 lands, the
               mirror becomes UNINSTALLABLE via `pack add`, `pack update` and
               `pack upgrade`: all three route through
               `RunValidationOnScratchCopy` (pkg/pack/distribution/command.go —
               AddCommand.Run, UpdateCommand.Run, UpgradeCommand.Run), which runs
               the `pkg/packval` pipeline this lane makes dispatch-live. Six of
               the seven rules will fail `semgrep-positive` there, exactly as the
               in-repo source does today.

            3. WHY IT IS NOT URGENT, AND WHAT WOULD MAKE IT URGENT. `pack install`
               does NOT validate — `NewInstallCommand(git GitCloner)` takes no
               `Validator` and `InstallCommand.Run` never calls
               `RunValidationOnScratchCopy` — and CI's fleet step is exactly
               `./bin/backstop pack install` (.github/workflows/ci.yml, both
               jobs). So the gate and CI are unaffected. It becomes blocking the
               first time anyone runs `pack update backstop-ai/go-contracts` or
               adds the pack to a new consumer repo.

            4. THE FIX SHAPE. Same correction as this plan's TASK-005 applied in
               the `backstop-ai/go-contracts` repo (two new clean fixtures,
               re-pointed positive slots, corrected comment), a version bump with
