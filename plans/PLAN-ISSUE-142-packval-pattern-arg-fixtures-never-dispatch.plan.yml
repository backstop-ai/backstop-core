         cross-check needs `ruleSource != ""` restored as its OWN condition,
         alongside the existing `binding.InputMode == engine.InputModeRuleFlags`
         guard. Forgetting this makes packval try to read a PATTERN STRING as a
         file path. `pkg/packval/phase3_ruleid_inputmode_test.go` pins the
         input-mode half and must stay green.

    SE3  DO NOT REWRITE THE RULE-ID BLOCK'S COMMENT, and do not spell any tool
         name into `pkg/packval/phase3.go`.
         `TestExecutor_ToolConfigResolvesViaBindingNotSwitch` greps that file for
         baked tool names and does not distinguish prose from code. The existing
         comment says so explicitly; leave it intact.

    SE4  THE TESTDATA FALSIFICATION PACK MUST NOT DECLARE A `provision:` BLOCK —
         AND HERE IS THE REAL REASON, BECAUSE AN EARLIER DRAFT GOT IT WRONG.
         `CheckToolAllowed` (pkg/pack/engine/allowlist.go) compares the DECLARED
         version against the allowlist pin. It NEVER inspects the installed
         binary. So `provision: {tool: semgrep, version: 1.96.0}` would PASS the
         trust gate no matter what version is actually on PATH — the earlier
         claim that a 1.156.0 dev binary would cause a refusal is FALSE. Proof
         in-tree: `pkg/packval/testdata/rulepath-pack` declares no `engines:`
         block, so `engine: semgrep` resolves to the BASE binding, which DOES
         carry `provision: {semgrep, 1.96.0}` (pkg/baseengines), and its dispatch
         test passes today with semgrep 1.156.0 installed.

         THE PRESCRIPTION IS UNCHANGED, for two different reasons:
           · The only genuinely refusable declaration is the TRUE installed
             version — `provision: {semgrep, 1.156.0}` IS rejected, because
             1.156.0 != the 1.96.0 pin. So the block can only ever carry a
             version the test does not actually run. A declaration that cannot
             be falsified by the test that reads it earns nothing.
           · These two packs exist to exercise DISPATCH ELIGIBILITY. The trust
             floor is owned and pinned by `pkg/pack/engine`'s own allowlist
             tests; re-declaring it here would put a second, weaker assertion of
             it in a fixture.
         Omit the block. Note the contrast, and do NOT "normalize" it away:
         `packs/contracts` DOES declare `provision:` on both its engines
         (ast-grep 0.43.0, grep "*"), both matching the allowlist exactly — which
         is why TASK-004's real-engine sub-test clears the trust gate and then
