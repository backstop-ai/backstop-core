    type-signature        sig-kinds-present.go   = 3  ✗       sig-kinds-mismatch.go = 2  ✓
    const-signature       sig-kinds-present.go   = 1  ✗       sig-kinds-mismatch.go = 0  ✗
    var-signature         sig-kinds-present.go   = 1  ✗       sig-kinds-mismatch.go = 0  ✗
    method-signature      sig-kinds-present.go   = 1  ✗       sig-kinds-mismatch.go = 1  ✓
    interface-signature   sig-kinds-present.go   = 1  ✗       sig-kinds-mismatch.go = 0  ✗
