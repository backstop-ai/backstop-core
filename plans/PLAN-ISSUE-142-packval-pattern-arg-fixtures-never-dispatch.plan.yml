  ── WHAT THIS LANE IS ─────────────────────────────────────────────────────
  ISSUE-142, DIR-032 (Gate Verdict Honesty) item 16. `pkg/packval`'s
  authoring-time `Rule` model has no field for the YAML `pattern:` key, so for a
  `pattern-arg` rule the key is silently discarded at unmarshal and phase 3's
  dispatch guard — which asks only for a rule SOURCE PATH — is permanently false.
  `executor.RunEngine` is never invoked for either fixture polarity, `res.Errors`
  stays empty, and `phase3-fixtures` prints `pass` for a pack whose fixtures have
  never been executed. This lane makes the pattern-arg declaration style dispatch
  for real, and then makes the one in-repo pack that uses it tell the truth.

