  ── WHY buildEngineArgv NEEDS NO CHANGE (the argv shape, traced) ──────────
  ISSUE-142 Direction item 3 asks whoever plans this to trace how a pattern-arg
  engine actually wants its arguments shaped rather than assume. Traced, both
  sides, and MEASURED:

    GATE SIDE — `gatherEngineInputs` (cmd/backstop/pack_gate.go), case
    `engine.InputModePatternArg`: emits `binding.InputFlag, rule.Pattern` per
    rule; `runFindingsEngine` then appends the scan targets. Net argv:
        <command words...> <input_flag> <pattern> <target...>

    PACKVAL SIDE — `buildEngineArgv` (pkg/packval/executor.go): takes the command
    words, appends `binding.InputFlag` ONCE when set, then appends every target.
    Net argv:
        <command words...> <input_flag> <target[0]> <target[1]...>

  THE TWO SHAPES ALREADY AGREE when `target[0]` is the pattern string. So the
  fix is entirely in WHAT phase 3 passes as the first target, not in how the argv
  is built. `buildEngineArgv` is READ ONLY in this lane and is absent from every
  task's `files` list. This is the single most important scoping fact in the plan:
  the obvious-looking "add a pattern-arg branch to buildEngineArgv" is WRONG and
  would fork a second argv authority for no gain.

