  WHY THE ROOT CAUSE IS NOT A SIMPLE SLOT SWAP. `packs/contracts`' self-test
  patterns are deliberately NAME-AGNOSTIC (`type $NAME $$$`, `func
  $NAME($$$PARAMS)`), while its fixtures were built for the NAME-SPECIFIC
  compiled patterns that `pkg/pack/engine/contracts_kind_signature_test.go`
  drives. A name-agnostic `type $NAME $$$` matches `type Other struct{}` in the
  "mismatch" file too, so swapping the two files' slots still leaves
  type-signature and method-signature non-discriminating (measured above: 2 and
  1 matches on the mismatch file). The correct fix is to add genuinely CLEAN
  fixtures for the positive slots and keep the present-file as the negative.

  THE FIX, VERIFIED AGAINST ast-grep BEFORE BEING PRESCRIBED. Two new fixtures:

    sig-absent.go       — a Go file with NO function declaration at all
    sig-kinds-absent.go — a Go file with NO type, no `const NAME =`, no
                          `var NAME =`, no method, no interface; one plain func

  Measured with real ast-grep 0.43.0 (every reading below is an actual run):

    sig-absent.go       vs `func $NAME($$$PARAMS)`              = 0  ✓
    sig-kinds-absent.go vs `type $NAME $$$`                     = 0  ✓
    sig-kinds-absent.go vs `const $NAME = $$$`                  = 0  ✓
    sig-kinds-absent.go vs `var $NAME = $$$`                    = 0  ✓
    sig-kinds-absent.go vs `func ($R $T) $NAME($$$PARAMS) $$$`  = 0  ✓
    sig-kinds-absent.go vs `type $NAME interface { $$$ }`       = 0  ✓
    sig-present.go      vs `func $NAME($$$PARAMS)`              = 1  ✓ (negative fires)
    sig-kinds-present.go fires >=1 for all five kind patterns   ✓ (negatives fire)

  So the full 7-rule pack discriminates correctly with the positive slots
  re-pointed at the two new clean files and every negative slot re-pointed at
  the PRESENT file.

