  protection in force today — do not write them up as one.

  THE THREE PARAMS — same NAMES in all four recipes (that sameness is
  itself evidence the platform differences are data):
    backstop_version   required: true, NO DEFAULT. A default silently pins
                       whatever release was current when the recipe was
                       authored. Its omission must fail EXIT 1 (CLM-049).
    default_branch     required: false, default "main"
    runner             required: false, per-platform default:
                         github-actions-gate      ubuntu-latest
                         gitlab-ci-gate           a SLASHLESS official image
                                                  tag (e.g. debian:stable-slim)
                         bitbucket-pipelines-gate the same slashless form
                         jenkins-gate             an agent label; the empty
                                                  label means "any agent"
  THE SLASHLESS RULE IS LOAD-BEARING, not aesthetic: CLM-059..062 forbid any
  organization-or-repository literal in the rendered file other than the
  release coordinate and `actions/checkout`. An `org/image:tag` default
  would BE such a literal and would red its own claim. Keep every runner
  default free of `/`, and say why in a comment in each recipe.yml.

  THE RELEASE COORDINATE — the one permitted download literal, matching what
  .goreleaser.yml actually publishes (archives
  `{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}`, i.e.
  `backstop_<version>_<os>_<arch>.tar.gz`, and note goreleaser's `.Version`
  carries NO leading v while the TAG does):
    https://github.com/backstop-ai/backstop-core/releases/download/v<ver>/backstop_<ver>_linux_amd64.tar.gz
  with `<ver>` supplied by `{{ backstop_version }}`. Verify the exact
  filename against a real published release before shipping; a 404 in a
  consumer's first CI run is the worst possible first impression.

  NO `${{ ... }}` IN ANY PAYLOAD, ANYWHERE (REQ-006). The substituter reads
  every `{{ ... }}` span as a param NAME and hard-errors on an undeclared
  one, with no escape syntax. go-distribution works around that with
  self-emitting pass-through params and records the workaround AS a
  workaround — do not imitate it. GitHub Actions exposes everything these
  templates need as ordinary environment variables: GITHUB_BASE_REF,
  GITHUB_EVENT_NAME, GITHUB_SHA. GitLab ($CI_*), Bitbucket ($BITBUCKET_*)
  and Jenkins (${env.…}, single brace) never had the problem.

  THE FOUR ORDERED ACTIONS EVERY RENDERED FILE PERFORMS, in this order,
  because CLM-024..027 compare BYTE OFFSETS and Review Question 9 asks
  whether byte order and EXECUTION order agree (they must, per platform —
  check Bitbucket's script list and Jenkins' stage order explicitly):
    1. check out with the platform's full-history directive
       (fetch-depth: 0 / GIT_DEPTH: "0" / clone.depth: full /
        CloneOption shallow: false)
    2. install the pinned backstop CLI from the release archive
    3. `backstop pack install`   ← MUST precede the gate (ISSUE-020: a gate
       over an empty pack directory reports capability_absent on every
       dimension and passes having checked NOTHING)
    4. resolve a base from the platform's own environment variables plus
       `{{ default_branch }}`, exit non-zero when it does not resolve, then
       `backstop gate --base "$BASE"` as the step whose exit code IS the
       verdict — carrying no form from THE SWALLOW-FORM SET below, which is
       stated once, there, and nowhere else.
  Each of `backstop pack install` and `backstop gate` appears EXACTLY ONCE
  in the rendered bytes (CLM-024..027 assert the count as well as the
  order). On Bitbucket, a YAML anchor/alias reused across the pull-request
  and branch pipelines keeps the literal text single-occurrence — use it.
  Each payload also carries a COMMENTED ANCHOR marking where a consumer adds
  its own Layer-0 toolchain setup, and — in the file itself, not only in the
  README — the warning that `kind: scaffolding` REGENERATES the file on the
  next apply and will eat edits made there unless a `@waiver` covers them
  (Sharp Edge 3).

