  - id: phase-1
    name: "Phase 1: Pack repo skeleton and the shared test harness (REQ-001)"
    tasks:
      - id: TASK-001
        type: setup
        title: "Create the ci-workflows pack repo with its single provisioned engine binding"
        description: |
          Create the repo at /Users/bmanson/src/projects/backstop-ci-workflows-pack
          (`git init`, default branch `main`). It DOES NOT EXIST — verified
          2026-08-11. No remote, no push, no tag: those are TASK-028/029.

          pack.yml — identity and engine block ONLY. The `recipes:` index
          lands in TASK-014 and `content.ruleset` in TASK-024, so this
          manifest is DELIBERATELY INCOMPLETE and `pack check` will fail
          until then (phase 1 demands a non-empty `content`; phase 4 errors
          on an empty `recipes:` index under `archetype: recipes`). Do not
          "fix" that by running pack check early or by padding the manifest.

            name: backstop-ai/ci-workflows      ← THE INSTALL IDENTITY
            version: "0.1.0"
            language: any                        ← required documentation-only
                                                   field; a gate workflow
                                                   belongs to no language,
                                                   which is the whole point
            archetype: recipes
            description: <one sentence: four per-platform gate-workflow
                          recipes plus the rules that guard them>

          THE ENGINE BINDING IS LOAD-BEARING TWICE (CLM-004):
            (1) `recipe apply` calls provisionedEngineBinding
                UNCONDITIONALLY before a recipe runs and requires the pack to
                declare EXACTLY ONE binding carrying `provision:` — a
                create-only recipes pack declaring none fails with a config
                error before its first op executes;
            (2) the twelve rules need semgrep anyway.
          Declare exactly one, keyed `semgrep-ci` — NEVER the bare `semgrep`.
          Pack bindings OVERRIDE the embedded base-engines defaults, so a
          pack redefining `semgrep` silently changes engine resolution for
          every OTHER pack installed in the same consumer project. That
          coupling defect shows up in someone else's repository, not here.
          Mirror the base-engines semgrep binding field-for-field:
            command: semgrep --sarif --quiet
            input_mode: rule-flags
            input_flag: "--config"
            scope_kind: file-args
            gate_type: lint
            category: opinion
            provision: {tool: semgrep, version: 1.96.0}
            field_contract: requires [rule_path, standard],
                            forbids [category, input_scope, validator]
          1.96.0 is not a preference: it is what
          engine.TrustedToolAllowlist() pins (allowlist.go:22) and the trust
          gate runs at BOTH parse and dispatch, so any other pin is an
          exit-2 config error. Comment both facts in the file.

          .github/workflows/tag-integrity.yml — copy VERBATIM from
          /Users/bmanson/src/projects/backstop-go-distribution-pack/.github/workflows/tag-integrity.yml
          (byte-identical across the sibling pack repos; it asserts pack.yml
          parses, its version is strict semver, and on a tag push that the
          tag equals that version). This is the PACK REPO's own CI and is a
          DIFFERENT thing from the workflows this pack's recipes ship — do
          not conflate them, and do not let it become a fifth payload.

          .gitignore — editor/OS noise only. NO go.mod, deliberately.

          README.md — what the pack is, the four recipe ids and targets, the
          three params, and the two warnings a consumer needs BEFORE they
          apply: brownfield never-clobber (Sharp Edge 2) and
          regenerate-by-default at the toolchain anchor (Sharp Edge 3).

          Author nothing else here. Recipes, payloads, rules and fixtures
          belong to later tasks and will extend pack.yml.
        files:
