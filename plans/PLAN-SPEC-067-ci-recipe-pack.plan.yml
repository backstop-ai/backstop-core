          pack): ONE whole-file anchor regex that ALSO carries the trigger
          condition, paired with a whole-file `pattern-not-regex` at the
          same span. Composing several narrow regexes under `patterns:`
          INTERSECTS their ranges and collapses the match, so the negation
          never sees the file.
