      - id: TASK-031
        type: documentation
        title: "File the residuals this plan deliberately does not fix"
        description: |
          All real, all with named causes. File each in backstop-core via
          `./bin/backstop artifact new issue --slug <slug>` — the IDs are
          assigned by the scaffold command, which is why no issue filename
          appears in this task's file scope. Route the authoring through the
          issue agent; never hand-edit an artifact.

          (1) slug `ci-recipe-brownfield-merge-variant`. Sharp Edge 2: on a
              repo that already owns `.gitlab-ci.yml`,
              `bitbucket-pipelines.yml` or `Jenkinsfile`, `create`'s
              never-clobber rule preserves the consumer's file and the apply
              writes nothing — the consumer ends up with an adoption record
              and NO gate in CI. Correct non-destructive behaviour, genuinely
              bad outcome. Propose an `insert`/`merge` variant for brownfield
              adoption. Cite SPEC-067 Sharp Edge 2 and BUNDLE-015.

          (2) slug `core-baseline-bakes-github-actions-knowledge`. The
              measured finding from this plan's notes: cmd/backstop/
              baseline.go carries GitHub-Actions artifact-API knowledge (the
              "GitHub Actions runs and artifact naming semantics" comment at
              :34, ensureGitHubAuth at :111/:179, the GitHub-authentication
              error strings at :168/:183, and the `github\.com[:/]` remote
              regex at :171). Under the thin-executor law a baked
              tool/platform branch is a defect to eradicate, not to extend.
              ★ SCOPE THIS ISSUE CORRECTLY: it is NOT a CLM-050 problem.
              CLM-050 was amended by founder ruling on 2026-08-11 (spec
              1.0.3 — the module-path exemption now covers both the plain
              `github.com/` and the regex-escaped `github\.com` spelling,
              and the token stays case-sensitive), and the claim measures
              GREEN on this tree. Say so in the issue, so nobody reopens a
              settled question. What remains open is the separate,
              architectural one the ruling deliberately did not answer:
              whether core should carry GitHub-Actions knowledge at all.
              The case-sensitive scope is exactly what leaves those
              capitalized mentions unjudged by the claim — which is why the
              question needs an issue of its own rather than a stricter
              regex. Cite SPEC-067 REQ-008/CLM-050 at 1.0.3, its Sharp
              Edge 5, and the 1.0.3 Version History entry recording the
              ruling.

          (3) slug `ci-workflows-pack-rules-unproven-under-pack-test`. The
              twelve rules are proven well-formed and, by scripts/falsify.sh,
              proven to fire — but `backstop pack test` proves NEITHER, and
              will not until ISSUE-092 is fixed. Record that this pack's
              fixtures are named under their include globs specifically so
              they become correct the day phase 3 executes, and that the
              fixture-POLARITY disagreement between packval's phase-3
              semantics and packs/contracts/pack.yml remains unresolved and
              must be settled before these fixtures are trusted. Cite
              ISSUE-092 and SPEC-067 CLM-058.

          Also record for the founder, as a note rather than an issue: the
          spec's `follows:` gap — no CI-configuration or shell standard
          exists in the in-repo `standards/` tree to bind these requirements
          to, so none was invented. If a standards pack covering CI
          configuration is adopted later, these requirements should be
          re-bound to it.
