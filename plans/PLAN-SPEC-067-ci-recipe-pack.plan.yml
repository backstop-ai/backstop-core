  `filepath.Match` does NOT model semgrep's slashless-pattern semantics:
  semgrep matches a slashless include against the file's BASENAME anywhere
  in the tree, while filepath.Match requires the WHOLE path to match.
  Measured: filepath.Match("backstop-gate*.yml",
  ".github/workflows/backstop-gate.yml") = false; against
  filepath.Base(path) = true. CLM-053..056's Go assertions MUST compare
  against filepath.Base(path). Written the naive way the test fails against
  a CORRECT pack, and the likely "repair" — widening the mandated pattern
  until filepath.Match accepts a full path — replaces a working include with
  one semgrep matches nothing against. The Go helper is a MODEL of semgrep's
  behaviour; the only authority is semgrep, which is what scripts/falsify.sh
  is for.
