          - /Users/bmanson/src/projects/backstop-ci-workflows-pack/.gitignore
          - /Users/bmanson/src/projects/backstop-ci-workflows-pack/README.md
          - /Users/bmanson/src/projects/backstop-ci-workflows-pack/.github/workflows/tag-integrity.yml
        claims:
          - CLM-001
          - CLM-004
        depends_on: []

      - id: TASK-002
        type: setup
        title: "Author the shared Go harness: resolve the REAL installed pack, stage a scratch consumer, drive the shipped command"
        description: |
          Create cmd/backstop/ci_recipes_harness_test.go, `package main`. It
          carries NO mandated test name — it is the shared machinery the six
          test files in Phase 2 use, and it is written FIRST so those files
          compile. Follow the shape cmd/backstop/recipe_apply_e2e_test.go
          already uses (stagedRecipe / executeCommand / copyTree), with ONE
          substitution: the pack comes from the REAL install, not a fixture.

          Helpers to provide, and the reasons they are shaped this way:

          (1) ciPackRoot(t) — walk UP from the test's working directory
              (cmd/backstop) to the repository root by finding backstop.yml,
              then return <root>/.backstop/packs/backstop-ai/ci-workflows.
              t.Fatalf when the directory or its pack.yml is missing, with a
              message naming the resolved path AND the fix (`backstop pack
              install`). NEVER t.Skip — a skip recreates exactly the vacuous
              green this pack exists to prevent, and it is the single most
              likely way this whole suite silently stops testing anything.

          (2) ciParsedPack(t) — pack.ParseManifestFile over that pack.yml,
              returning the manifest so every id, version, directory and
              target is read from DATA rather than retyped as a test literal.
              Any test that hardcodes a recipe version has broken the
              property that the pack can be revved without editing core.

          (3) ciStageConsumer(t) — copy the INSTALLED pack into a fresh
              t.TempDir() at .backstop/packs/backstop-ai/ci-workflows, write
              a minimal backstop.yml declaring it, and t.Chdir into that
              root. recipeProjectRoot() resolves the project from the
              discovered backstop.yml, so the apply writes into the scratch
              tree and never into the working repository. t.Chdir makes the
              test non-parallel — do NOT call t.Parallel anywhere in this
              suite.

          (4) ciApply(t, root, recipeID, version, params...) — build the ref
              as `backstop-ai/ci-workflows:<id>@<version>` and drive
              NewRootCommand() with `recipe apply <ref> --param k=v`
              (repeatable StringArray). ONE invocation shape for all four
              platforms; the reference argument is the ONLY thing that
              differs. Return stdout AND the error so CLM-049 can inspect
              both. Classify exit codes through *ExitCodeError — CLM-049
              needs EXIT 1 (an op failure through the normal apply path),
              explicitly NOT the exit-2 *check.ConfigError shape reserved
              for malformed/duplicate/undeclared --param input.

          (5) ciBasenameMatch(pattern, path) — filepath.Match(pattern,
              filepath.Base(path)). SHARP EDGE 10: filepath.Match does NOT
              model semgrep's slashless-pattern semantics, and a full-path
              comparison asserts something semgrep never does. Document that
              in the helper's doc comment, including the measured example
              (".github/workflows/backstop-gate.yml" vs
              "backstop-gate*.yml": false on the full path, true on the
              basename), and state plainly that this helper is a MODEL of
              semgrep's behaviour, not the behaviour itself.

          (6) ciByteOffset(t, content, needle) — index of the single
              occurrence, failing when the count is not exactly 1, so the
              ordering claims assert count AND order in one place.

          (7) ciTrackedFiles(t) — `git ls-files` from the repo root, for
              CLM-006's union check.

          Nothing platform-shaped is typed in this file beyond what the
          parsed manifests supply. No stubs, no fake dispatch, no interface
          seam standing in for the filesystem: a stub would pass whether or
          not the pack exists, which is the exact failure mode this spec is
          the acceptance test against.
        files:
          - /Users/bmanson/src/projects/backstop-core/cmd/backstop/ci_recipes_harness_test.go
        claims:
