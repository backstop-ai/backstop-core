          recipe.yml:
            kind: scaffolding          # packval phase 4 REQUIRES
                                       # enforcement.rules for this kind, and
                                       # that pairing IS the design: the
                                       # recipe writes the invariant, the
                                       # rule guards it. It also selects
                                       # regenerate-by-default, which is what
                                       # CLM-045's byte-identical property
                                       # rests on.
            version: "1.0.0"           # the RECIPE's own semver, distinct
                                       # from the pack's 0.1.0
            params: backstop_version (required, NO default),
                    default_branch (default "main"),
                    runner (default "ubuntu-latest")
            ops: exactly ONE, kind create,
                 target .github/workflows/backstop-gate.yml,
                 payload payload/backstop-gate.yml
            enforcement.rules:
              - github-actions-gate-workflow-missing-pack-install
              - github-actions-gate-workflow-verdict-swallowed
              - github-actions-gate-workflow-shallow-clone

          payload/backstop-gate.yml — the four ordered actions in ONE job:
            1. actions/checkout@vN with `fetch-depth: 0`. This is the ONLY
               third-party-looking literal permitted, and only because
               `fetch-depth: 0` has no other expression. NO second action.
            2. install backstop from the release archive at
               `{{ backstop_version }}` — curl the tar.gz, verify it
               downloaded, unpack, put it on PATH. `set -euo pipefail` in
               every run block.
            3. `backstop pack install`
            4. resolve BASE from GITHUB_EVENT_NAME / GITHUB_BASE_REF plus
               `{{ default_branch }}`, `git rev-parse --verify` it, exit
               non-zero with a diagnostic when it does not resolve, then
               `backstop gate --base "$BASE"` as the LAST step, unguarded.
          NO `${{ ... }}` ANYWHERE — the substituter would read it as a param
          name and hard-error. Use the plain environment variables; that is
          why REQ-006 exists and why the go-distribution pass-through-param
          workaround is not imitated here.
