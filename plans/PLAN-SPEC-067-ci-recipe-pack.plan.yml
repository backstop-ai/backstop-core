  omitted severity is silently indistinguishable from a deliberate ERROR
  when reading the manifest alone (Sharp Edge 9). Write it explicitly.

  THE FOUR `paths: include:` SETS — EXACT, NOT ILLUSTRATIVE:
    github-actions-gate        backstop-gate*.yml
    gitlab-ci-gate             .gitlab-ci*.yml  AND  gitlab-ci*.yml
    bitbucket-pipelines-gate   bitbucket-pipelines*.yml
    jenkins-gate               Jenkinsfile*
  A MULTI-SEGMENT include (`.github/workflows/backstop-gate.yml`) is
  PROHIBITED: measured against real semgrep in the gate's own DEFAULT
  diff-scoped dispatch, which hands semgrep EXPLICIT FILE targets
  (runFindingsEngine, cmd/backstop/pack_gate.go:573), it matches ZERO files
  — not even the file it names — while matching under `--all`'s directory
  dispatch. A "tightened" rule therefore looks alive under a full sweep and
  is DEAD under the everyday bare `backstop gate`. Basename globs are the
  only form that works under both. The trailing `*` and the fixture NAMING
