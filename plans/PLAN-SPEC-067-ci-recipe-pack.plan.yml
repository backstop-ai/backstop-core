  ─────────────────────────────────────────────────────────────────────────
  THE DEV LOOP — HOW TO RENDER AND ITERATE WITHOUT AN INSTALLED PACK
  ─────────────────────────────────────────────────────────────────────────
  `recipe apply` resolves the recipe out of an installed pack directory in a
  consumer project; it does NOT require `pack add`, a lock entry, or a
  validating pack. So phases 3 and 4 stage a scratch consumer by hand:

    ROOT=$(mktemp -d)
    mkdir -p "$ROOT/.backstop/packs/backstop-ai/ci-workflows"
    cp -R /Users/bmanson/src/projects/backstop-ci-workflows-pack/. \
          "$ROOT/.backstop/packs/backstop-ai/ci-workflows/"
    printf 'project: scratch\npacks:\n  backstop-ai/ci-workflows: 0.1.0\n' \
          > "$ROOT/backstop.yml"
    cd "$ROOT" && /Users/bmanson/src/projects/backstop-core/bin/backstop \
      recipe apply backstop-ai/ci-workflows:<id>@1.0.0 \
      --param backstop_version=0.1.1

  That is the same shape the mandated test harness uses (it copies the
  INSTALLED pack instead of the source repo). `recipeProjectRoot()` resolves
  the project from the discovered backstop.yml, so the apply writes into the
  scratch tree and never into a working repository. Re-copy the pack after
  every pack-side edit; a stale copy is the pack-side twin of a stale binary.

  ─────────────────────────────────────────────────────────────────────────
  FLEET ADOPTION: LOCAL FIRST, THEN THE PUBLISHED REMOTE
  ─────────────────────────────────────────────────────────────────────────
  REQ-002 wants backstop.yml and backstop.lock declaring the pack at the
  same version so `backstop pack install` materializes it. The COMMITTED end
  state must be a GIT source at v0.1.0, like every other entry in the lock —
  a `source_type: local` entry pointing at `../backstop-ci-workflows-pack`
  would be unresolvable on any CI runner that clones only backstop-core.

  But the 62 tests need an installed pack BEFORE the pack is publishable
  (publishing an unproven pack is the thing this repo does not do). So:
    TASK-026  installs LOCALLY (`pack add <absolute path>`) — an INTERIM
              working-tree state. `pack add` accepts an absolute path
              (isLocalPath, add.go:96-105) and installs under the MANIFEST
              NAME, i.e. exactly `.backstop/packs/backstop-ai/ci-workflows/`.
    TASK-030  after publication, converts the entry to the git source at
              v0.1.0 and asserts hash equality with the local install.
  ⚠ NEVER COMMIT THE LOCAL-SOURCE ENTRY. If the plan stalls at the founder
  gate (TASK-029), the honest state to leave behind is a working tree whose
  backstop.yml/backstop.lock changes are UNCOMMITTED, and a report saying so.

  ⚠ ISSUE-095 — `pack add <org>/<pack>@<version>` SILENTLY NO-OPS when a
  pack of that name is already installed: `isPackInstalledAndCurrent` checks
  only that a non-empty directory and a lock entry exist under that name and
  never compares against the source just resolved. TASK-030 must therefore
  `pack remove backstop-ai/ci-workflows` FIRST. Skipping the remove leaves
  the LOCAL install in place while reporting success, and the entire remote
  proof becomes vacuous.

  ⚠ SHARP EDGE 6 — SPEC-066 edits the SAME two files. The edits are
  independent map entries and compose, but whichever lands second must
  RE-READ both files rather than write from a remembered baseline. Add ONE
  entry; never regenerate either file wholesale. As of 2026-08-11 backstop.yml
  declares seven packs and backstop.lock seven matching entries, all
  `source_type: git`; SPEC-066 has no plan in flight in plans/.

  ⚠ WHOLE-FILE ACTIVATION — touching backstop.yml or backstop.lock pulls
  ALL of that file's findings into gate scope, not just the added lines. If
  `PATH=... ./bin/backstop gate --file backstop.yml` reports anything, it is
  fixed here, not waived. One `--file` per invocation (ISSUE-093).

