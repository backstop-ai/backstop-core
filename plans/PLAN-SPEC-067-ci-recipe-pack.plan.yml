      - id: TASK-029
        type: setup
        title: "Founder gate: create and publish backstop-ai/ci-workflows at v0.1.0"
        description: |
          THE HUMAN/ORCHESTRATOR GATE, made explicit rather than assumed.
          TASK-028 deliberately refuses to push, so without this node
          TASK-030 would depend on a remote that no task brings into
          existence — and an implementer reading the DAG would either stall
          or push on its own authority.

          Nothing here is the implementer's to do. The founder/orchestrator:
            • decides that `backstop-ai/ci-workflows` should exist and at
              what visibility — a new public-facing repo under the org is a
              founder call, not a mechanical one;
            • notes that this pack INTRODUCES the cross-cutting naming
              category for the published fleet (every other published
              `backstop-ai/*` pack is language-prefixed or project-named),
              which is a naming decision worth making deliberately once;
            • creates the repo, pushes `main` and the `v0.1.0` tag;
            • confirms the repo's own tag-integrity workflow ran GREEN on
              the tag — it asserts the pushed tag equals pack.yml's version,
              and a red run there means the tag is deleted and recut, never
              worked around.

          The implementer's move on reaching this node is to STOP and report
          that the pack is committed, tagged and awaiting publication. Do
          not push. Do not create the remote. Do not proceed to TASK-030 on
          the assumption the push happened — TASK-030's first act reaches
          the remote, and a clone failure is a wasted cycle, not a signal.
        files:
          - /Users/bmanson/src/projects/backstop-ci-workflows-pack/pack.yml
        claims:
          - CLM-001
        depends_on:
          - TASK-028

      - id: TASK-030
        type: implementation
        title: "Convert core's fleet entry from the local path to the published git source at v0.1.0"
        description: |
          RUNS ONLY AFTER TASK-029's push has actually happened. From
          /Users/bmanson/src/projects/backstop-core:

            ./bin/backstop pack remove backstop-ai/ci-workflows
            ./bin/backstop pack add backstop-ai/ci-workflows@0.1.0

          ⚠ THE REMOVE IS NOT HYGIENE. Per ISSUE-095, `pack add
          <org>/<pack>@<version>` silently NO-OPS when a pack of that name
          is already installed: isPackInstalledAndCurrent checks only that a
          non-empty directory and a lock entry exist under that name, and
          never compares against the source just resolved. Skipping the
          remove leaves the LOCAL install in place while reporting success,
          and the entire remote proof is vacuous.

          Then assert, by reading backstop.lock:
            • source_type: git
            • git_ref: v0.1.0
            • version: 0.1.0, matching backstop.yml's entry exactly (CLM-005)
            • content_hash EQUAL to the hash the local install recorded —
              hash equality across install paths is what proves the
              PUBLISHED tree is the tree that was proven. Capture the local
              hash BEFORE the remove so the comparison is possible.
            • the other seven entries untouched, byte-for-byte, and
              SPEC-066's entry preserved if it landed meanwhile (re-read;
              never write from a remembered baseline).

          If the identity gate refuses the add — manifest version not equal
          to the tag, manifest absent/unparseable, or an unusable name — the
          fix is in the PACK (recut the tag), never a flag on the add.
        files:
          - /Users/bmanson/src/projects/backstop-core/backstop.yml
          - /Users/bmanson/src/projects/backstop-core/backstop.lock
        claims:
