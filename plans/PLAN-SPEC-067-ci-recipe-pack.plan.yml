  # ═══════════════════════════════════════════════════════════════════════
  # Phase 6: Publication, remote conversion, residuals, final verification
  # ═══════════════════════════════════════════════════════════════════════
  - id: phase-6
    name: "Phase 6: Publish v0.1.0, convert the fleet entry to the remote, and verify everything"
    tasks:
      - id: TASK-028
        type: setup
        title: "Commit the pack repo and tag it v0.1.0, locally"
        description: |
          The pack is proven: recipes render, rules falsify, `pack check`
          and `pack test` pass structurally, and the 62 mandated tests are
          green against the installed copy. Now make it releasable.

          pack.yml already declares `version: "0.1.0"` from TASK-001, so no
          bump is needed — and the tag MUST equal it, which is exactly what
          the repo's own .github/workflows/tag-integrity.yml asserts on a
          tag push.

          Steps, all LOCAL, in the pack repo:
            • `git add -A` and commit in full — one commit, message naming
              the pack, the version and what it ships;
            • confirm NOTHING is left untracked (a fixture, a script or a
              payload missed here becomes a pack that behaves differently
              once cloned);
            • re-run, from a CLEAN checkout of what was just committed, with
              the same GOPATH/bin prefix and core's absolute binary every
              other invocation in this plan uses:
                PATH="/Users/bmanson/go/bin:$PATH" \
                  /Users/bmanson/src/projects/backstop-core/bin/backstop pack check .
                PATH="/Users/bmanson/go/bin:$PATH" \
                  /Users/bmanson/src/projects/backstop-core/bin/backstop pack test .
            • `git tag v0.1.0`.

          DO NOT PUSH and DO NOT create the remote repository. Both belong
          to TASK-029, which exists so that gate is a visible node in the
          DAG rather than an assumption.
        files:
          - /Users/bmanson/src/projects/backstop-ci-workflows-pack/pack.yml
          - /Users/bmanson/src/projects/backstop-ci-workflows-pack/.github/workflows/tag-integrity.yml
        claims:
          - CLM-001
        depends_on:
