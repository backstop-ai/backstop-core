notes: |
  RE-AUTHORED 2026-07-06 against the reframed ISSUE-045. The prior draft was
  built around a convert-side `go list`/`go.mod` approach that was DISPROVEN
  during implementation: the coverage convert runs under
  packval.SandboxedRunStdout (a macOS sandbox-exec deny-all profile) and cannot
  run `go list -m` or read go.mod — so neither the module-prefix strip (case 2)
  nor the zero-statement N/A emission (case 1) can live in the convert. This
  plan implements the correct architecture: language-specific coverage
  enrichment is produced by the UN-SANDBOXED engine/producer command (full
  toolchain + project access) as PLAIN TEXT that the SANDBOXED convert then
  PARSES (no toolchain in the convert). It is the DIR-015 prerequisite: it also
  closes the sandboxed-dispatch integration gap that let a unit-green run hide a
  broken real path.

  ─────────────────────────────────────────────────────────────────────────
  THE FOUR MOVING PARTS
  ─────────────────────────────────────────────────────────────────────────
  1. ENGINE/PRODUCER ENRICHMENT (external go-toolchain pack, un-sandboxed):
     the coverage producer additionally captures `go list -m` (module path) and
     the packages' `.go` files (`go list -f '{{.GoFiles}}'`) and folds them into
     the artifact the convert reads — appended `#backstop-module <M>` and
     `#backstop-gofile <import-path>` comment lines on cover.out. This runs with
     full toolchain/project access (it is NOT sandboxed), so `go list` works.
  2. CONVERT PARSES, DOES NOT EXECUTE (external pack coverage-to-records.sh,
     sandboxed, TEXT ONLY, NO `go`): (a) parse `#backstop-module` → strip the
     `<M>/` module prefix → repo-relative record paths [case 2]; (b) parse
     `#backstop-gofile` → for a package file ABSENT from the profile whose
     package HAS >=1 profile entry (measured), emit a `total:0` N/A record
     [case 1] — CRITICALLY distinguishing zero-statement (→ N/A) from
     untested-with-statements (Go's profile already emits total>0/covered=0 for
     the latter, so it stays flagged). The gate's EXISTING `Total==0 ⇒ N/A`
     guard (step_coverage.go:188) then clears case 1 with NO gate change.
  3. ★ THE THIN-EXECUTOR DISPATCH CHANGE (Phase 2 — the CENTRAL RATIFICATION
     ITEM; see DISPATCH DECISION below). The current dispatch cannot run such an
     enriched command: splitCommand (cmd/backstop/pack_gate.go:805) is a naive
     strings.Fields split with no quote handling and the first token is exec'd
     as-is with NO packRoot resolution, so a compound `sh -c '…'` or a
     pack-provided producer script is not runnable. This plan encodes the
     RECOMMENDED option; it must be ratified before Phase 2 implementation
     because it touches the thin executor.
  4. ★ INTEGRATION-GAP CLOSER (Phase 4 — acceptance-critical). A REAL
     sandboxed-dispatch e2e that runs the coverage path through the actual
     installed pack + real sandbox + real `go test`/`go list` (NOT direct
     []check.CoverageRecord injection), asserting both false positives clear AND
     an untested-with-statements file still fires.

  ─────────────────────────────────────────────────────────────────────────
  DISPATCH DECISION — options for part 3 (RATIFY BEFORE PHASE 2)
  ─────────────────────────────────────────────────────────────────────────
  Constraint: a pack must be able to declare an ENRICHED / PRODUCER coverage
  command that runs UN-SANDBOXED (needs `go test` + `go list`) and whose output
  the sandboxed convert then parses — WITHOUT baking any language/tool knowledge
  into cmd/backstop/pack_gate.go, and keeping the trusted-tool allowlist gate
  (checkEngineToolAllowed) intact.

  (i) QUOTE-AWARE COMMAND SPLITTING — teach splitCommand to honor shell quoting
      so a pack can declare `command: sh -c '<inline producer script>'`.
      + Smallest binding-surface change (no new field).
      - Introduces a shell-word parsing heuristic in the executor (quotes,
        escapes, nesting) that is easy to get subtly wrong; encourages an
        arbitrary multi-line `sh -c` BLOB inside pack.yml that is hard to review
        and versionless; does NOT give packRoot resolution for a pack-shipped
        script (the producer logic can't live in a reviewable pack file).

  (ii) ★ RECOMMENDED — PACK-DECLARED, packRoot-RESOLVED PRODUCER SCRIPT. Add a
       `producer:` field to the coverage EngineBinding (a pack-relative script,
       exactly like the existing `convert:` field). When set, runCoverageEngine
       resolves it under packRoot (filepath.Join(packRoot, producer) + os.Stat,
       the SAME pattern `convert` already uses), runs it UN-SANDBOXED via
       runner.RunStdout (cwd = projectRoot, so `go test`/`go list` see the
       project) IN PLACE of splitCommand(binding.Command), then reads the
       existing declared stdout_artifact (cover.out) and feeds it to the
       sandboxed convert unchanged.
       + Cleanest producer(un-sandboxed) / convert(sandboxed) separation; the
         producer is a first-class, reviewable, version-controlled pack FILE,
         symmetric with `convert`; reuses the existing packRoot-resolve+stat+run
         substrate (near-zero new dispatch concept); NO shell-parsing heuristic;
         NO inline blob. The dispatch gains only a language-BLIND capability
         ("resolve this engine's producer relative to packRoot and run it"); all
         Go/toolchain knowledge stays in the pack's producer script.
         checkEngineToolAllowed stays exactly where it is — the producer's tool
         (`sh`/`go`, nil-Provision assume-present Layer-0) passes the gate as a
         no-op, and any provisioned tool still trips it.
       - One new binding field + one dispatch branch in runCoverageEngine.
       This is what the issue's Solution step 3 already leans toward
       ("packRoot-resolved pack-provided producer/command").

  (iii) ARGV-LIST COMMAND — allow `command:` to be a YAML list
        (`["sh","-c","…"]`) so the dispatch uses element[0] as the exe and the
        rest verbatim, no quote parsing.
        + No shell-word heuristic; trivially unambiguous.
        - Still forces the producer to be an inline `sh -c` blob in pack.yml
          (same reviewability/versioning problem as (i)); a two-form `command`
          (string OR list) adds parse branching everywhere command is read.

  RECOMMENDATION: (ii). It is the most reviewable and least-magic, keeps the
  executor language-blind, and reuses the existing convert-resolution pattern.
  The task descriptions below encode option (ii); if a different option is
  ratified, Phase 2/4 pack + binding tasks adjust accordingly (the surrounding
  phases are option-independent).

