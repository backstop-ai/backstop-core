notes: |
  ─────────────────────────────────────────────────────────────────────────
  DESIGN PRINCIPLE (founder decision, 2026-07-10 — supersedes the issue's
  original two-policy-site scope; do NOT re-open)
  ─────────────────────────────────────────────────────────────────────────
  The baseline ratchet is WELDED to grandfathering at ONE chokepoint —
  CompareBaseline (pkg/gate/baseline.go) — so it is ON BY DEFAULT for every
  baseline consumer. enforcement.policy TUNES the ratchet (warn / off /
  all-code) — it does NOT opt into it. Waivers and warn-level are the relief
  valves. The single hatch this change CLOSES is "grandfather a finding but
  never pay it down": once you touch a file, its pre-existing findings must be
  resolved (fixed OR waived) — not just kept net-new-clean.

  WHY CONSOLIDATE INTO CompareBaseline (not the two policy.go sites the issue
  originally named): all THREE grandfathering callers funnel through
  CompareBaseline, each passing Scope: g.scope —
    (1) policy.go:113  — ApplyPolicy unscoped net-new path
    (2) policy.go:158  — applyScopedPolicy (per-PACK Sources overrides)
    (3) gate.go:194    — computeBaselineResult, the AGGREGATE
                         baseline_comparison step
  Patching only (1)+(2) leaves (3) DEAD: a project with a baseline but NO
  `enforcement.policy` grandfathers SOLELY via computeBaselineResult, because
  ApplyPolicy early-returns on empty policy (policy.go:68). The ratchet would
  be silently dead for exactly that common case. Putting the revocation inside
  CompareBaseline covers all three at one site and makes the design principle
  literally true. (There is a dedicated test for the no-policy aggregate path,
  CLM-007 — without it the gap silently reopens.)

  ─────────────────────────────────────────────────────────────────────────
  THE CONSOLIDATED CHANGE — CompareBaseline (baseline.go:112-160)
  ─────────────────────────────────────────────────────────────────────────
  In the new-vs-grandfathered classification loop (:128-139), a current finding
  whose IdentityHash is present in baselineSet is today `continue`d as
  grandfathered (:131-133). Reclassify it as NEW when its file was explicitly
  touched:

      touched := scope != nil &&
          (scope.Mode == GateScopeModeDiff || scope.Mode == GateScopeModeFile) &&
          scope.Contains(v.File)
      // baseline-present AND touched  → grandfather REVOKED → count as NEW
      // baseline-present AND !touched → grandfathered (unchanged)

  Extract this predicate as one small unexported helper (e.g. `scopeTouches`)
  in baseline.go and use it at the single classification site — one definition
  of "touched". A touched baseline-present finding falls through to the
  newViolations append (the All-mode rule-set-change seeding branch at :134 is
  Mode==All-only, so a Diff/File-touched finding never lands there). Use
  `v.File` — gate.Violation has NO `Path` field (result.go:58). scope.Contains
  self-normalizes BOTH sides (scope.go:68 → NormalizePath), so pass the raw
  finding File; do NOT pre-normalize at the call site.

  ─────────────────────────────────────────────────────────────────────────
  GUARDS THAT RIDE INSIDE THE CONSOLIDATED LOGIC (correctness invariants)
  ─────────────────────────────────────────────────────────────────────────
  G1. --all / GateScopeModeAll → NO revocation. The Mode ∈ {Diff,File} guard
      excludes All, where scope.Contains returns true for EVERY path
      (scope.go:65). Without the guard, --all would revoke the whole repo and a
      full sweep / baseline generate would stop grandfathering gradually.
  G2. PROJECT-WIDE UNTOUCHED findings stay grandfathered. A whole-repo-scanning
      dimension (go-toolchain lint) reports findings on unchanged files; those
      pass filterViolations via the ProjectWide exemption (scope.go:202) but
      scope.Contains(v.File) is FALSE for their file → per-finding, they stay
      grandfathered. Revocation is keyed strictly on the touched file — never a
      blanket revoke of all in-scope findings, never the whole repo's debt in
      one commit.
  G3. NIL-SAFE + generation-safe. nil baseline → CompareBaseline early-returns
      (:113). nil scope → scopeTouches returns false → no revocation, stays
      grandfathered (positive test, S2). CompareBaseline is COMPARISON-only
      (all 3 callers compare; none GENERATE), so baseline generation
      (NewBaselineArtifactFromSteps) is untouched.

  ─────────────────────────────────────────────────────────────────────────
  RESOLUTION = FIX or WAIVE (interaction with SPEC-049, delivered)
  ─────────────────────────────────────────────────────────────────────────
  computeWaiverResult (gate.go:153) subtracts waived findings from the
  accumulated step Violations IN PLACE (step_waiver.go:132) BEFORE both the
  baseline comparison and ApplyPolicy. So a @waiver'd finding is ALREADY absent
  from `current` when CompareBaseline classifies — it is never a candidate for
  reclassification, with no extra logic here. A revoked (touched-file) finding
  therefore clears either by being FIXED (absent from current on the next run)
  or WAIVED/engine-suppressed (also absent). Same mechanism: absent from
  current ⇒ not NEW.

  ─────────────────────────────────────────────────────────────────────────
  BLAST-RADIUS RECONCILIATION (expected, not a defect)
  ─────────────────────────────────────────────────────────────────────────
  This changes the semantics of the central, most-tested grandfathering
  function. Existing CompareBaseline/baseline tests that assert "baseline-
  present in Diff mode on a TOUCHED file → grandfathered" will CORRECTLY flip
  to "revoked". Confirmed target: TestBaselineCompareIgnoresExistingAndOutOf
  ScopeFixedViolations (baseline_test.go:234-248) — its `existing` finding is on
  "changed.ts", which is the scope's touched file, so it must now report 1 NEW,
  not 0. A dedicated reconciliation task audits baseline_test.go and
  baseline_identity_test.go and updates every such assertion to the new
  behavior — while PRESERVING out-of-scope/untouched grandfathering and
  All-mode seeding assertions (those must NOT change). Reconciliation is a
  refactor DEPENDENT on the implementation (the tests document the new truth),
  not new red tests.

  ─────────────────────────────────────────────────────────────────────────
  VERIFICATION
  ─────────────────────────────────────────────────────────────────────────
  Unit-level in pkg/gate — exercise CompareBaseline directly (new-vs-
  grandfathered classification) plus the aggregate computeBaselineResult path,
  against constructed Violation / BaselineArtifact / GateScope fixtures; no
  engine run. Middle verification runs `backstop code check` + `go test
  ./pkg/gate/...`. The final phase runs the full `backstop gate` kill chain
  plus `backstop artifact validate --plan PLAN-ISSUE-050`. The code change
  touches only .go files (no .spec.md/.issue.md edits), so `backstop gate`
  subsumes code verification.

  ─────────────────────────────────────────────────────────────────────────
  CLAIMS (every task maps ≥1; every claim mapped by ≥1 task)
  ─────────────────────────────────────────────────────────────────────────
  CLM-001 — Touched-file revocation is CONSOLIDATED into CompareBaseline
            (baseline.go, new-vs-grandfathered classification), so all THREE
            callers (policy.go:113 unscoped, policy.go:158 scoped, gate.go:194
            aggregate) inherit it from one chokepoint. A baseline-present
            finding whose file is touched (scope!=nil && Mode∈{Diff,File} &&
            scope.Contains(v.File), using v.File) reclassifies as NEW instead
            of grandfathered, via one `scopeTouches` helper.
  CLM-002 — REVOCATION FIRES: a baseline-present finding on a file in
            scope.Files under GateScopeModeDiff is reclassified NEW (revoked)
            where the old half-ratchet grandfathered it.
            (TestPolicy_TouchedFileRevokesGrandfathering)
  CLM-003 — ONLY TOUCHED FILES: a baseline-present finding on a file NOT in
            scope.Files (project-wide dimension reporting outside the diff via
            the ProjectWide exemption) STAYS grandfathered (0 new) — revocation
            is per-finding, never a blanket in-scope revoke. (TestPolicy_
            UntouchedFileUnderProjectWideDimensionStaysGrandfathered)
  CLM-004 — --all UNCHANGED: the identical baseline-present finding under
            GateScopeModeAll stays grandfathered (Mode guard excludes All), so
            gate --all / baseline generate / seeding behavior is unaffected.
            (TestPolicy_AllModeUnaffectedByStrictRevocation)
  CLM-005 — FIX or WAIVE clears: a revoked (touched-file, baseline-present)
            finding that is absent from `current` — because it was fixed, or
            waived/engine-suppressed (subtracted upstream by computeWaiverResult
            before comparison) — is no longer NEW; the step returns to pass.
            (TestPolicy_RevokedFindingClearsWhenFixedOrSuppressed)
  CLM-006 — PATH-NORMALIZATION MATCH IS REAL (anti-vacuous-green), and the
            test is itself non-vacuous (S1): with the GateScope built via the
            real newGateScope path (normalized fileSet, ProjectRoot set) and a
            BASELINE-PRESENT Violation whose File is a NON-canonical form of the
            touched file, the test first asserts the finding is NOT independently
            net-new (so the "already new" short-circuit is false and the
            scope-touch path is genuinely exercised), then asserts
            scope.Contains(v.File) is true and the finding is reclassified NEW.
            Guards against a silent no-op on a v.File↔scope.Files path-format
            mismatch. (TestPolicy_TouchedRevocation_MatchesNormalizedPath)
  CLM-007 — NO-POLICY AGGREGATE PATH FIRES (the whole reason to consolidate),
            + nil-scope safety (S2): with a baseline present but EMPTY
            enforcement.policy, the aggregate baseline_comparison step
            (computeBaselineResult, gate.go:194) reclassifies a touched-file
            baselined finding as NEW and FAILS — proving the ratchet is not
            left dead by ApplyPolicy's empty-policy early-return (policy.go:68).
            A nil scope keeps the finding grandfathered with no panic.
            (TestPolicy_NoPolicyBaselineComparisonStepFiresRatchet,
            TestPolicy_NilScopeKeepsGrandfathering)
  CLM-008 — BLAST-RADIUS RECONCILED: existing baseline tests asserting
            "baseline-present in Diff mode on a TOUCHED file → grandfathered"
            (confirmed: TestBaselineCompareIgnoresExistingAndOutOfScope
            FixedViolations, baseline_test.go:234) are updated to the new
            revoked behavior, while out-of-scope/untouched grandfathering and
            All-mode seeding assertions are preserved; go test ./pkg/gate/...
            and backstop gate stay green.

phases:
  # ═══════════════════════════════════════════════════════════════════════
  # Phase 1: TDD — consolidated touched-file revocation in CompareBaseline
  # ═══════════════════════════════════════════════════════════════════════
  - id: phase-1
    name: "Phase 1: TDD — Weld the Ratchet to Grandfathering at the CompareBaseline Chokepoint"
    tasks:
      - id: TASK-001
        type: test
        title: "Failing ratchet tests at CompareBaseline: touched revokes; untouched/project-wide stays; --all unchanged; fix-or-waive clears; normalized-path pin (non-vacuous); no-policy aggregate path fires; nil-scope safe"
        description: |
          Add pkg/gate/baseline_ratchet_test.go exercising the CONSOLIDATED
          revocation in CompareBaseline (the new-vs-grandfathered classification)
          plus the aggregate computeBaselineResult path. NO engine run. Construct
          fixtures with hand-built Violation / BaselineArtifact / GateScope
          values; build every GateScope via the real `newGateScope(projectRoot,
          mode, files, nil)` so its normalized fileSet is populated — do NOT
          hand-build the unexported fileSet (that would defeat the CLM-006 pin).
          Reuse existing package helpers (`vioSrc` in policy_perpack_test.go, the
          Gate construction helpers in gate_test.go for the aggregate path); do
          NOT re-declare them. Do NOT touch baseline.go in this task.

          A grandfathered finding = present in the BaselineArtifact.Violations
          (so its IdentityHash is in baselineSet). Assert on
          comparison.NewViolations (and, for the aggregate test, the
          baseline_comparison StepResult verdict).

          Mandated test names (exact — retargeted at CompareBaseline behavior):
            - TestPolicy_TouchedFileRevokesGrandfathering (CLM-001, CLM-002): a
              baseline-present finding on "pkg/x/x.go", current run carries it,
              scope = newGateScope with Files ["pkg/x/x.go"] under
              GateScopeModeDiff. Assert CompareBaseline reports it in
              NewViolations (revoked). (Sanity companion: the SAME finding with
              scope Files that do NOT include it → 0 new, grandfathered — pins
              that touch is the cause.)
            - TestPolicy_UntouchedFileUnderProjectWideDimensionStaysGrandfathered
              (CLM-003): a baseline-present finding on "pkg/other/other.go" with
              ProjectWide=true (so filterViolations keeps it in scope) while the
              scope touches a DIFFERENT file under Diff mode. Assert 0 new
              (stays grandfathered) — revocation is keyed on the touched file,
              not the dimension.
            - TestPolicy_AllModeUnaffectedByStrictRevocation (CLM-004): the
              identical baseline-present finding under a GateScopeModeAll scope.
              Assert 0 new (grandfathered) — the Mode∈{Diff,File} guard excludes
              All, so gate --all / seeding is unchanged.
            - TestPolicy_RevokedFindingClearsWhenFixedOrSuppressed (CLM-005): a
              touched-file baseline-present finding that is ABSENT from the
              current slice (modeling both fix and the upstream waiver/suppress
              subtraction) → 0 new. Proves a revoked finding clears by fix OR
              waive (absent-from-current is the shared mechanism).
            - TestPolicy_TouchedRevocation_MatchesNormalizedPath (CLM-006, S1):
              scope built via newGateScope with a real projectRoot and touched
              file "pkg/x/x.go"; a BASELINE-PRESENT Violation whose File is a
              NON-canonical form of that file (e.g. "./pkg/x/x.go" or the
              projectRoot-joined absolute path). FIRST assert the finding is NOT
              independently net-new — i.e. its identity IS in the baseline set
              (compute EnrichViolationIdentity and confirm baseline contains the
              same hash), so the "already new" path is NOT what makes it count.
              THEN assert scope.Contains(v.File) is true AND CompareBaseline
              reports it NEW (revoked via the scope-touch path). This keeps the
              marquee anti-vacuous-green test from being itself vacuous.
            - TestPolicy_NoPolicyBaselineComparisonStepFiresRatchet (CLM-007):
              the consolidation payoff. Build a Gate with a baseline containing a
              finding on a touched file, a Diff scope touching that file, and NO
              enforcement.policy (empty policy map). Drive the aggregate
              baseline_comparison step (computeBaselineResult / the Run path) and
              assert that step FAILS (NewViolations includes the revoked finding)
              — proving the ratchet fires through the third caller that
              ApplyPolicy's empty-policy early-return (policy.go:68) would leave
              dead.
            - TestPolicy_NilScopeKeepsGrandfathering (CLM-007, S2): a baseline-
              present finding with options.Scope == nil → CompareBaseline reports
              0 new (grandfathered) and does not panic. Positive nil-scope guard.

          All FAIL against today's CompareBaseline (no touched-file revocation);
          pass after TASK-002.
        files:
          - pkg/gate/baseline_ratchet_test.go
        claims:
          - CLM-001
          - CLM-002
          - CLM-003
          - CLM-004
          - CLM-005
          - CLM-006
          - CLM-007
