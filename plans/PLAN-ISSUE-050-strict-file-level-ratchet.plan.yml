notes: |
  ─────────────────────────────────────────────────────────────────────────
  THE DECIDED CHANGE (ISSUE-050 Solution — do NOT re-open)
  ─────────────────────────────────────────────────────────────────────────
  The gate's baseline ratchet today only blocks NET-NEW findings on touched
  files. A pre-existing baseline-grandfathered finding on a file the author
  edits does NOT block — you can rewrite a debt-heavy file, add zero new debt,
  and stay green. This closes that gap: the moment a file enters the diff (or
  --file target list), its grandfather is REVOKED and every finding in it must
  be resolved (fixed OR waived) before the gate passes.

  Per-violation grandfathering becomes: a finding counts (blocks) when it is
  net-new OR its file was explicitly touched:

      touched := scope != nil &&
          (scope.Mode == GateScopeModeDiff || scope.Mode == GateScopeModeFile) &&
          scope.Contains(v.File)
      counts = <net-new?> || touched

  ─────────────────────────────────────────────────────────────────────────
  TWO SITES — BOTH MUST CHANGE (the vacuous-green hole)
  ─────────────────────────────────────────────────────────────────────────
  The issue Solution names BOTH grandfathering decision sites in
  pkg/gate/policy.go, and this is load-bearing:
    (1) applyScopedPolicy (:180-187) — the PER-VIOLATION resolver, used only
        when a dimension carries per-PACK `Sources` overrides.
    (2) ApplyPolicy's unscoped net-new path (:110-117) — used by every
        dimension WITHOUT a `Sources` override (the common case:
        go-toolchain, go-standards). This path subtracts the whole-step
        `cmp.NewViolations` SET at once; it has no per-file granularity today.
  MOST dimensions flow through (2). Patching only (1) would mean the ratchet
  NEVER FIRES for un-scoped dimensions — a silent, vacuous half-fix. So (2)
  must also become per-file-aware: keep a finding when it is net-new OR its
  file is touched. Concretely, (2) can no longer just take `cmp.NewViolations`
  wholesale — it must UNION the net-new set with the touched-file findings
  from `s.Violations` (deduped), so touching one file revokes only THAT file's
  grandfathering, never the whole dimension.

  ─────────────────────────────────────────────────────────────────────────
  CORRECTNESS TRAPS (where this silently goes vacuous — each has a test)
  ─────────────────────────────────────────────────────────────────────────
  A. WRONG FIELD NAME. The issue pseudocode says `scope.Contains(v.Path)`.
     The real field on gate.Violation is `v.File` (pkg/gate/result.go:58) —
     there is NO `Path` field. Use `v.File`. A test PINS that the touched-file
     match actually fires (not a compile-only assumption).
  B. PATH-NORMALIZATION MATCH (the primary vacuous-green trap). `scope.Files`
     are NORMALIZED (ISSUE-046 NormalizePath, scope.go:76-89) and
     GateScope.Contains normalizes its argument too (scope.go:68:
     `s.fileSet[NormalizePath(s.ProjectRoot, path)]`). So passing raw `v.File`
     to `scope.Contains` is CORRECT — both sides canonicalize. But if a
     violation's File is in a form that normalizes differently than the scope
     entry (e.g. absolute vs repo-relative, `./`-prefixed), the lookup
     silently returns false and the ratchet NEVER FIRES. A test constructs the
     scope via the real `newGateScope`/`ComputeGateScope` path (NOT a
     hand-aligned fileSet) with a ProjectRoot set, and a Violation whose File
     is a non-canonical form of a touched file, and asserts revocation
     genuinely fires end-to-end — so a future path-format drift can't no-op the
     ratchet.
  C. ONLY TOUCHED FILES, NEVER THE WHOLE DIMENSION. Project-wide-scope
     dimensions (a go-toolchain lint scans the whole repo even in diff mode)
     report findings on files OUTSIDE the diff. Those UNtouched-file findings
     MUST stay grandfathered. Revocation is keyed strictly on
     scope.Contains(v.File), so touching one file obligates only that file's
     findings — never the repo's whole pre-existing debt in one commit.
  D. --all / GateScopeModeAll UNCHANGED. scope.Contains returns true for EVERY
     path in `all` mode (scope.go:65), which would revoke grandfathering
     repo-wide if applied naively. The touched-check is therefore gated on
     Mode == Diff || Mode == File EXPLICITLY, excluding All. A full sweep
     (`gate --all`, `baseline generate`) keeps grandfathering gradual.
  E. NIL SCOPE. Guard `scope != nil` before reading scope.Mode; a nil scope
     (some call paths) must not panic and must not revoke.

  ─────────────────────────────────────────────────────────────────────────
  RESOLUTION = FIX or WAIVE (interaction with SPEC-049, delivered)
  ─────────────────────────────────────────────────────────────────────────
  Waiver reconciliation (computeWaiverResult, gate.go:153) runs in the Run
  loop and mutates the accumulated step Violations IN PLACE (step_waiver.go:132
  `s.Violations = kept`) BEFORE ApplyPolicy (gate.go:168). So a @waiver'd
  finding is ALREADY subtracted from s.Violations by the time applyScopedPolicy
  / the unscoped path evaluates — an active waiver satisfies the ratchet on a
  touched file with NO extra logic in this change. A revoked (touched-file)
  finding therefore clears either by being FIXED (absent from s.Violations on
  the next run) or by being WAIVED/engine-suppressed (also absent). The test
  proves both paths clear the step.

  ─────────────────────────────────────────────────────────────────────────
  SCOPE / VERIFICATION
  ─────────────────────────────────────────────────────────────────────────
  Surgical, unit-testable change confined to pkg/gate/policy.go plus one new
  test file. No engine invocation needed — exercise applyScopedPolicy AND the
  unscoped ApplyPolicy path directly against constructed StepResult /
  Violation / BaselineArtifact / GateScope fixtures. Middle verification runs
  `backstop code check`; the final phase runs the full `backstop gate` kill
  chain, plus `backstop artifact validate` to confirm this plan artifact
  itself validates. The change touches only .go files (no .spec.md/.issue.md
  edits), so `backstop gate` subsumes code verification.

  ─────────────────────────────────────────────────────────────────────────
  CLAIMS (enumerated from the issue's Solution + acceptance nuances + mandated
  tests; every task maps ≥1, every claim mapped by ≥1 task)
  ─────────────────────────────────────────────────────────────────────────
  CLM-001 — The per-violation grandfathering decision in BOTH policy.go sites
            (applyScopedPolicy AND the unscoped ApplyPolicy net-new path) is
            extended so a finding counts when it is net-new OR its file was
            explicitly touched — `touched = scope != nil && (Mode==Diff ||
            Mode==File) && scope.Contains(v.File)` (using v.File, NOT v.Path),
            with the unscoped path unioning net-new with touched-file findings
            so it gains the per-file granularity it lacked.
  CLM-002 — TOUCHED-FILE REVOCATION FIRES: a baseline-present (pre-existing,
            non-net-new) finding on a file listed in scope.Files under
            GateScopeModeDiff now BLOCKS (counts==true) where before it was
            silently grandfathered. (TestPolicy_TouchedFileRevokesGrandfathering)
  CLM-003 — ONLY TOUCHED FILES lose grandfathering: a baseline-present finding
            on a file NOT in scope.Files (a project-wide-scanning dimension
            reporting outside the diff) STAYS grandfathered (counts==false) —
            revocation is scoped to the touched file, not the dimension/repo.
            (TestPolicy_UntouchedFileUnderProjectWideDimensionStaysGrandfathered)
  CLM-004 — --all UNCHANGED: the identical baseline-present finding under
            GateScopeModeAll stays grandfathered (counts==false) — the
            touched-check excludes GateScopeModeAll explicitly, so
            gate --all / baseline generate behavior is untouched.
            (TestPolicy_AllModeUnaffectedByStrictRevocation)
  CLM-005 — RESOLUTION = FIX or WAIVE: a revoked (touched-file, baseline-
            present) finding that is fixed (absent from s.Violations) OR waived/
            engine-suppressed (also absent, subtracted upstream by
            computeWaiverResult before ApplyPolicy) no longer counts and the
            step returns to pass.
            (TestPolicy_RevokedFindingClearsWhenFixedOrSuppressed)
  CLM-006 — PATH-NORMALIZATION MATCH IS REAL (anti-vacuous-green): with the
            GateScope built via the real newGateScope/ComputeGateScope path
            (normalized fileSet, ProjectRoot set) and a Violation whose File is
            a non-canonical form of a touched file, scope.Contains(v.File)
            genuinely matches and the ratchet fires end-to-end — the revocation
            cannot silently no-op on a path-format mismatch between v.File and
            scope.Files. (TestPolicy_TouchedRevocation_MatchesNormalizedPath)

phases:
  # ═══════════════════════════════════════════════════════════════════════
  # Phase 1: TDD — strict file-level ratchet (touched-file revocation)
  # ═══════════════════════════════════════════════════════════════════════
  - id: phase-1
    name: "Phase 1: TDD — Touched-File Grandfathering Revocation in Both Policy Sites"
    tasks:
      - id: TASK-001
        type: test
        title: "Failing ratchet tests: touched file revokes grandfathering; untouched stays; --all unchanged; fix-or-waive clears; normalized-path match fires"
        description: |
          Add pkg/gate/policy_ratchet_test.go exercising BOTH grandfathering
          decision paths in policy.go — the unscoped ApplyPolicy net-new path
          (a dimension policy with NO Sources override) AND applyScopedPolicy
          (a dimension policy WITH a Sources override) — against constructed
          StepResult / Violation / BaselineArtifact / GateScope fixtures. NO
          engine run. Reuse the existing package test helpers (`vioSrc` in
          policy_perpack_test.go, and construct GateScope via the real
          `newGateScope` so its normalized fileSet is populated — do NOT
          hand-build the unexported fileSet, that would defeat CLM-006). Do NOT
          touch policy.go in this task.

          A grandfathered finding = present in the BaselineArtifact (so it is
          NOT in the net-new set). Assert the STEP verdict (pass vs fail) and/or
          the counted NewViolations, matching the style of policy_perpack_test.go.

          Mandated test names (exact):
            - TestPolicy_TouchedFileRevokesGrandfathering (CLM-001, CLM-002):
              a baseline-present finding on file "pkg/x/x.go" that IS in
              scope.Files under GateScopeModeDiff. Before this change it
              grandfathers (step pass); assert it now BLOCKS (step fail /
              counted). Cover BOTH the unscoped-dimension policy and a
              Sources-scoped dimension policy so both code sites are pinned.
            - TestPolicy_UntouchedFileUnderProjectWideDimensionStaysGrandfathered
              (CLM-003): the same baseline-present finding on file
              "pkg/other/other.go" that is NOT in scope.Files (scope touches a
              different file), under GateScopeModeDiff — simulating a project-
              wide-scanning dimension reporting outside the diff. Assert it
              STAYS grandfathered (step pass / not counted). Proves revocation
              is keyed strictly on the touched file, not the whole dimension.
            - TestPolicy_AllModeUnaffectedByStrictRevocation (CLM-004): the
              identical baseline-present finding under a GateScopeModeAll scope
              (where scope.Contains returns true for every path). Assert it
              STAYS grandfathered (step pass / not counted) — proves the
              touched-check excludes GateScopeModeAll and gate --all /
              baseline generate is unchanged.
            - TestPolicy_RevokedFindingClearsWhenFixedOrSuppressed (CLM-005):
              (a) FIXED — a touched-file, baseline-present finding that is
              ABSENT from s.Violations on the next run yields step pass (nothing
              to count). (b) WAIVED/SUPPRESSED — model the upstream subtraction
              (computeWaiverResult removes waived findings from s.Violations
              BEFORE ApplyPolicy) by likewise omitting it from s.Violations;
              assert the step passes. Proves a revoked finding clears by fix OR
              by waiver, not only by fix.
            - TestPolicy_TouchedRevocation_MatchesNormalizedPath (CLM-006): the
              anti-vacuous-green pin. Build the GateScope via `newGateScope`
              with a real ProjectRoot and a touched file in one textual form
              (e.g. repo-relative "pkg/x/x.go"), and a baseline-present
              Violation whose File is a NON-canonical form of the SAME file
              (e.g. "./pkg/x/x.go", or the ProjectRoot-joined absolute path).
              First assert scope.Contains(v.File) is TRUE (the match is real),
              then assert the ratchet BLOCKS the step. This FAILS if v.File and
              scope.Files ever normalize differently — guaranteeing the
              revocation cannot silently no-op on a path-format mismatch.

          All five FAIL against today's policy.go (no touched-file revocation)
          and pass after TASK-002.
        files:
          - pkg/gate/policy_ratchet_test.go
        claims:
          - CLM-001
          - CLM-002
          - CLM-003
          - CLM-004
          - CLM-005
          - CLM-006
        depends_on: []
        test_names:
          - TestPolicy_TouchedFileRevokesGrandfathering
          - TestPolicy_UntouchedFileUnderProjectWideDimensionStaysGrandfathered
          - TestPolicy_AllModeUnaffectedByStrictRevocation
          - TestPolicy_RevokedFindingClearsWhenFixedOrSuppressed
          - TestPolicy_TouchedRevocation_MatchesNormalizedPath

      - id: TASK-002
        type: implementation
        title: "Extend grandfathering in both policy.go sites: a finding counts when net-new OR its file is touched (diff/file mode)"
        description: |
          Implement the strict file-level ratchet in pkg/gate/policy.go at BOTH
          grandfathering decision sites (the issue Solution names both). Add one
          small unexported helper capturing the touched-file predicate and reuse
          it in both, so there is exactly ONE definition of "touched":

              func scopeTouches(scope *GateScope, file string) bool {
                  return scope != nil &&
                      (scope.Mode == GateScopeModeDiff || scope.Mode == GateScopeModeFile) &&
                      scope.Contains(file)
              }

          CRITICAL: use `v.File` (gate.Violation.File, result.go:58) — the
          issue pseudocode's `v.Path` does NOT exist. `scope.Contains`
          normalizes its argument internally (scope.go:68), so pass the raw
          v.File; do not pre-normalize at the call site. Guard scope != nil
          (helper does this) and EXCLUDE GateScopeModeAll (helper does this).

          (1) applyScopedPolicy (:180-187) — the per-violation resolver. Change:
                  counts := true
                  if eff.AppliesTo == AppliesToNewCode && baseline != nil {
                      counts = newSet[EnrichViolationIdentity(v).IdentityHash] ||
                          scopeTouches(scope, v.File)
                  }
              Net-new grandfathering is preserved; a touched-file finding now
              additionally counts. The nil-baseline fail-loud branch is
              untouched (counts stays true when baseline == nil).

          (2) ApplyPolicy unscoped net-new path (:110-117) — this path today
              takes the whole-step `cmp.NewViolations` SET wholesale, so it has
              NO per-file granularity and would never revoke. Rework it to
              per-file awareness: keep a finding from s.Violations when it is
              net-new (in the net-new identity set) OR scopeTouches(scope,
              v.File). Concretely, build the net-new identity set from
              cmp.NewViolations, then compute `counted` by iterating s.Violations
              and keeping each v where `newIdentitySet[EnrichViolationIdentity(v)
              .IdentityHash] || scopeTouches(scope, v.File)`. This UNIONs net-new
              with touched-file findings (deduped by iterating the source
              Violations once) so touching one file revokes only THAT file's
              grandfathering — never the whole dimension. Keep s.NewViolations /
              s.FixedViolations assignments consistent (s.NewViolations = the
              counted blocking set, as today). The `baseline == nil` case and
              the AppliesTo != new-code (all-code) case are unchanged — every
              finding still counts there.

          Both sites: revocation fires ONLY under GateScopeModeDiff /
          GateScopeModeFile (CLM-004: All is excluded), keyed strictly on the
          per-finding v.File (CLM-003: only touched files). No language noun, no
          tool knowledge enters policy.go — this is pure scope/identity logic.
        files:
          - pkg/gate/policy.go
        claims:
