          - TestPolicy_UntouchedFileUnderProjectWideDimensionStaysGrandfathered
          - TestPolicy_AllModeUnaffectedByStrictRevocation
          - TestPolicy_RevokedFindingClearsWhenFixedOrSuppressed
          - TestPolicy_TouchedRevocation_MatchesNormalizedPath
          - TestPolicy_NoPolicyBaselineComparisonStepFiresRatchet
          - TestPolicy_NilScopeKeepsGrandfathering

      - id: TASK-002
        type: implementation
        title: "Consolidate touched-file revocation into CompareBaseline: baseline-present + touched → NEW, with the mode/scope/nil guards"
        description: |
          Implement the strict file-level ratchet at the ONE chokepoint —
          CompareBaseline in pkg/gate/baseline.go — so all three callers inherit
          it (issue Solution as revised by the founder decision; see notes).

          Add one small unexported helper in baseline.go capturing the
          touched-file predicate (single definition of "touched"):

              func scopeTouches(scope *GateScope, file string) bool {
                  return scope != nil &&
                      (scope.Mode == GateScopeModeDiff || scope.Mode == GateScopeModeFile) &&
                      scope.Contains(file)
              }

          In the new-vs-grandfathered classification loop (:128-139), where a
          baseline-present current finding is currently `continue`d as
          grandfathered (:131-133), reclassify it as NEW when its file is
          touched:

              if _, ok := baselineSet[enriched.IdentityHash]; ok {
                  if !scopeTouches(options.Scope, enriched.File) {
                      continue // grandfathered (unchanged)
                  }
                  // touched: grandfather revoked → fall through to newViolations
              }

          Use enriched.File / v.File (gate.Violation has NO Path — result.go:58).
          scope.Contains self-normalizes both sides (scope.go:68), so pass the
          finding File raw; do NOT pre-normalize. A Diff/File-touched finding
          then reaches the newViolations append — it never hits the All-mode-only
          seeding branch (:134). GUARDS (see notes G1–G3): the Mode∈{Diff,File}
          check excludes GateScopeModeAll (no repo-wide revoke); the per-finding
          scope.Contains keeps project-wide UNtouched findings grandfathered; nil
          scope and nil baseline stay safe (nil scope → scopeTouches false; nil
          baseline → existing early-return at :113). Do NOT alter the
          FixedViolations loop (:141-149), the seeding branch, or baseline
          generation — this is comparison-only. No language noun / tool knowledge
          enters baseline.go.
        files:
          - pkg/gate/baseline.go
        claims:
          - CLM-001
          - CLM-002
          - CLM-003
          - CLM-004
          - CLM-005
          - CLM-006
          - CLM-007
        depends_on:
          - TASK-001

      - id: TASK-003
        type: refactor
        title: "Reconcile existing baseline tests to the new revoked-on-touch semantics (blast radius of consolidating the central function)"
        description: |
          Audit and update the existing CompareBaseline/baseline tests that
          assumed the OLD half-ratchet ("baseline-present in Diff mode on a
          touched file → grandfathered"). These tests document the old behavior;
          the founder decision intentionally changes it, so their assertions must
          flip to the new truth. This is a refactor DEPENDENT on the
          implementation (the new behavior must exist first).

          Confirmed target:
            - pkg/gate/baseline_test.go —
              TestBaselineCompareIgnoresExistingAndOutOfScopeFixedViolations
              (:234-248): its `existing` finding is on "changed.ts", the scope's
              touched file, so it must now report 1 NEW (revoked), not 0. Update
              the assertion and, if the test's INTENT (out-of-scope FIXED
              handling) still needs an untouched-grandfather case, add/retain a
              companion using an UNtouched file so both truths are covered.
          Sweep both pkg/gate/baseline_test.go and
          pkg/gate/baseline_identity_test.go for any other assertion of the same
          shape and flip only those. PRESERVE — do not weaken — assertions about:
          out-of-scope / untouched findings staying grandfathered, All-mode
          rule-set-change seeding (TestBaseline_CompareBaseline_AllScope...),
          nil-baseline behavior, and identity STABILITY (ISSUE-046). If a test's
          scope does NOT touch the finding's file, its verdict must be UNCHANGED
          — a changed verdict there is a bug, not reconciliation. Do NOT modify
          baseline.go or baseline_ratchet_test.go here.
        files:
          - pkg/gate/baseline_test.go
          - pkg/gate/baseline_identity_test.go
        claims:
          - CLM-008
        depends_on:
          - TASK-002

      - id: TASK-004
        type: verification
        title: "backstop code check + go test ./pkg/gate/... — new ratchet tests green, reconciled tests green, no other grandfathering regression"
        description: |
          Inner-loop verification. Run `backstop code check` (diff-scoped: lint,
          build, test, semgrep) AND `go test ./pkg/gate/...` (the full package
          suite, to catch every inherited-caller and reconciliation effect).
          Confirm:
            - The seven TASK-001 mandated tests pass
              (TestPolicy_TouchedFileRevokesGrandfathering,
              _UntouchedFileUnderProjectWideDimensionStaysGrandfathered,
              _AllModeUnaffectedByStrictRevocation,
              _RevokedFindingClearsWhenFixedOrSuppressed,
              _TouchedRevocation_MatchesNormalizedPath,
              _NoPolicyBaselineComparisonStepFiresRatchet,
              _NilScopeKeepsGrandfathering).
            - The reconciled tests (TASK-003) pass under the new semantics.
            - The rest of pkg/gate stays green with the ONLY behavior change
              being the intended touched-file revocation — inspect the three
              inheriting callers' suites (policy_test.go / policy_appliesto_test.go
              / policy_perpack_test.go including the nil-baseline fail-loud
              invariant TestPolicy_ScopedNilBaselineBlocksFailLoudNotSilentGreen;
              the waiver ratchet suite step_waiver_ratchet_test.go /
              step_waiver_e2e_test.go; and the gate aggregate tests). Any verdict
              change on a scope that does NOT touch the finding's file is a
              regression to investigate.
          Report pass/fail per mandated test, the reconciled-test results, and
          any unexpected verdict delta.
        files:
          - pkg/gate/baseline.go
          - pkg/gate/baseline_ratchet_test.go
          - pkg/gate/baseline_test.go
          - pkg/gate/baseline_identity_test.go
        claims:
