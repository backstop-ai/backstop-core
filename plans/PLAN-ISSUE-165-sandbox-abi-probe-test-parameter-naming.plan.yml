          - pkg/packval/sandbox_linux_errors_test.go
          - plans/PLAN-ISSUE-165-sandbox-abi-probe-test-parameter-naming.plan.yml
          - issues/ISSUE-165-sandbox-abi-probe-wiring-test-naming-mismatch.issue.md
        claims:
