          - TASK-003

      - id: TASK-005
        type: documentation
        title: "Hand the real verification to CI: name what to read, record the ceiling, close nothing early"
        description: |
          Everything before this proves the edit is sound; only this proves the CI red is
          gone — and it cannot be discharged from this machine.

          EVERY ARTIFACT TOUCH HERE IS ROUTED THROUGH `/issue` (the issue-author agent).
          This lane never hand-edits an artifact file — which is why
          `issues/ISSUE-165-...` appears in this task's `files:`: it is the file a ROUTED
          author writes, not a file this task opens in an editor.

          (1) RECORD THE CEILING IN THE ARTIFACT, NOT IN A CHAT MESSAGE (CLM-007). Hand the
          routed author the measured statement: `sandbox_linux_errors_test.go` is
          `//go:build linux` and is invisible to every native darwin command (proved at
          authoring — a deliberate type error in it left `go build ./...`, `go vet` and
          `go test` on darwin all clean, while `GOOS=linux GOARCH=amd64 go test -c` caught
          it). Local evidence establishes "the guard now runs, and passes, on this
          platform, and the linux half still compiles" — never "the Linux CI failure is
          resolved."

          (2) NAME THE CI RUN TO WATCH AND WHAT COUNTS AS CONFIRMATION. Workflow
          `.github/workflows/ci.yml`, job `gate` (display name "Backstop Gate"),
          `runs-on: ubuntu-latest`, blocking step `Run the gate`
          (`./bin/backstop gate --base "$BASE"`). The step before it writes
          `gate-report.json`, uploaded as the `gate-report` artifact with `if: always()`.
          Download it. THE CONFIRMATION IS ONE CRITERION, AND IT MUST BE READ, NOT INFERRED:

            THE SIGNATURE IS GONE. Search the `go-test`-channel violations (rule
            `backstop-ai/go-toolchain/go-test`) for a violation on
            `sandbox_linux_errors_test.go` — or, after this lane, on
            `sandbox_wiring_guard_test.go` — whose message contains the literal text
            `does not pass probeLandlockABI`. It must be ABSENT.
            ★ SINGULAR, NOT "both occurrences". The guard emits two `t.Errorf` calls today
            (`:221` and `:246`, sharp edge 3), but the go-toolchain producer's SARIF
            converter captures only the FIRST failing position per test and emits EXACTLY
            ONE result per failing test, however many `t.Errorf`s fired inside it. Verified
            by the plan reviewer against the producer script and against the local
            `.backstop/baseline.json`. Expecting two rows and finding one would look like a
            half-fix; there is only ever one row.
            ★ DO NOT look for a PASS. The converter emits FAILURES ONLY, and CI runs
            `go test` without `-v`, so `gate-report.json` contains no positive signal for
            this or any test. "The test now passes" is not obtainable from this artifact —
            TASK-003's darwin execution already establishes that the guard runs and passes
            against the same `sandbox_linux.go` CI reads, and that is where that half of the
            evidence lives.

            ★ DO NOT REQUIRE `pkg/packval` IN `.scope.files`, AND DO NOT DISCARD AN
            OTHERWISE-CONFIRMING RUN FOR ITS ABSENCE. The go-toolchain `go-test` binding
            declares `project_target: "./..."` AND `exempt_from_scope_filter: true`
            (verified at authoring in the pack's own `pack.yml`), so this channel runs
            PROJECT-WIDE and its findings bypass diff-scope filtering entirely — which is in
            fact WHY ISSUE-165 was discoverable at all from a run whose diff lived in
            `cmd/backstop`. `.scope.files` governs the diff-scoped dimensions, not this one.
            Read it for context if useful; never treat it as a gate on this criterion.

            ★ THE TOTAL VIOLATION COUNT IS NOT A CONFIRMATION CRITERION EITHER. Report the
            remaining blocking set as CONTEXT, clearly labelled as context and not as proof
            — this lane owns exactly one of those violations and claims nothing about the
            rest.
          The change has to reach a branch CI runs on before any of this exists. WHETHER AND
          WHEN TO PUSH IS THE FOUNDER'S CALL — deliver the watch instruction and the
          criteria, and if no CI run has happened yet, say exactly that rather than implying
          one did.

          (3) DO NOT CLOSE ISSUE-165 ON LOCAL EVIDENCE (CLM-007). Request closure through
          `/issue` ONLY once (2)(a) and (2)(b) have both been read from a real run, handing
          the routed author that reading as the evidence. Until then the honest status is
          "fix landed, awaiting CI confirmation."

          (4) RECORD THE SCOPE DECISIONS THE NEXT READER WOULD OTHERWISE RE-LITIGATE
          (CLM-005, CLM-006): option (a) was refused and why; the guard was made
          platform-neutral and why that is the durable half of the fix. If the founder
          would rather the guard had stayed linux-gated, that is a one-file revert and the
          issue should say so.

          (5) FILE THE STALE DOC COMMENT AS A FOLLOW-ON (sharp edge 16, CLM-006). Route a
          NEW issue through `/issue`: `pkg/packval/sandbox_linux.go:163-175`
          (`newSandboxHelperCommand`'s doc comment) still says
          "TestSandboxLinux_ProductionPathUsesTheRealABIProbe asserts both production call
          sites hand it the real probeLandlockABI" — which this lane INVERTS: at those two
          sites the literal is now a violation and the injected parameter is the
          requirement. State plainly that this lane left the file byte-unchanged on purpose
          (CLM-006 is asserted mechanically by TASK-003 step 3), and that the sentence is
          the one a future reader would cite to justify the rejected option (a), so it
          should be corrected in a lane that legitimately edits production code. One
          sentence of prose, no behaviour change — but it does not ride in this diff.

          (6) FILE ANYTHING ELSE SURFACED, and if nothing needed filing, SAY SO EXPLICITLY —
          silence is not a discharge. In particular, if the CI reading shows OTHER
          `pkg/packval` reds that are not this lane's, file or attribute them by name rather
          than absorbing them. Then report the terminal state plainly: what landed, what was
          measured, what was not measurable and why, what was filed, and what is still owed.
        files:
          - issues/ISSUE-165-sandbox-abi-probe-wiring-test-naming-mismatch.issue.md
        claims:
          - CLM-005
          - CLM-006
          - CLM-007
        depends_on:
          - TASK-004
