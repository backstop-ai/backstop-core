  - id: phase-2
    name: "Phase 2: full kill chain, then the CI-confirmation handoff"
    tasks:
      - id: TASK-004
        type: verification
        title: "Full kill chain: backstop gate --all plus artifact validation"
        description: |
          THE FINAL, UNSCOPED SWEEP. Run all three and read the results:

              backstop gate --all
              backstop artifact validate --plan PLAN-ISSUE-165
              backstop artifact validate --issue ISSUE-165

          `gate --all` covers the code half (pack lock verification, artifact validation,
          pack engines, test verification, substantiveness, coverage, contracts, status
          drift, requirement traceability, waivers, baseline, ledger integrity);
          `artifact validate` covers the artifact half, since this lane's plan artifact is
          new and its source issue is in flight.

          ATTRIBUTION IS THE DELIVERABLE, NOT THE RAW COUNT. This repo carries inherited
          reds from other lanes and two sibling lanes are live (sharp edge 11). For every
          violation, decide and STATE whether it is this lane's:
            * grep the full violation set explicitly for each path this lane touched
              (`pkg/packval/sandbox_wiring_guard_test.go`,
              `pkg/packval/sandbox_linux_errors_test.go`) and report the hit count, zero or
              otherwise;
            * anything attributable to this lane is FIXED AT SOURCE, never waived and never
              made green by weakening a test.

          ENVIRONMENT CAVEATS GET RECORDED, NOT SMOOTHED. A `pack_engines` step exiting 2
          with `required tool "..." not found on PATH` is an environment artifact, NOT a
          clean run — `go-arch-lint` and `golangci-lint` v2 must be on PATH or the dimension
          silently contributes nothing; and a reading taken in a worktree lacking
          `.backstop/baseline.json` is STRICTER, not more permissive. If either applies, say
          so and do not report the run as authoritative.

          ★ AND STATE THE CEILING AGAIN (CLM-007): a green `gate --all` on darwin does not
          confirm ISSUE-165's fix. This machine never compiles the linux-tagged tests and
          never runs the Linux job. It confirms this lane broke nothing; TASK-005 owns the
          confirmation that it fixed something.
        files:
