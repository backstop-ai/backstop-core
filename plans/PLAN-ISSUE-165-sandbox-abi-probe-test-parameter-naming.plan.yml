notes: |
  ISSUE-165 — `TestSandboxLinux_ProductionPathUsesTheRealABIProbe`
  (`pkg/packval/sandbox_linux_errors_test.go`) is an AST wiring guard that walks
  `sandbox_linux.go` for every call to `linuxSandboxedRunWith`,
  `linuxSandboxedRunStdoutWith` or `newSandboxHelperCommand` and asserts the LAST
  ARGUMENT at each is literally the bare identifier `probeLandlockABI`. The two OUTER
  hops satisfy that. The two INNER hops cannot: `linuxSandboxedRunWith` (`:220-221`) and
  `linuxSandboxedRunStdoutWith` (`:245-246`) forward their OWN parameter, `probeABI
  LandlockABIProbe`, to `newSandboxHelperCommand` — a deliberate, load-bearing injection
  seam that `TestLinuxSandboxedRunWith_WrapsThePrepareFailure` drives with a fake prober.
  A flat identifier-name match cannot tell a correctly-forwarded parameter from a
  hardcoded wrong prober, so the assertion is UNSATISFIABLE BY CONSTRUCTION at those two
  sites. The production wiring is correct; the assertion mechanism is the defect.

  ══════════════════════════════════════════════════════════════════════════════
  ★ THE CHOSEN FIX SHAPE: OPTION (b). OPTION (a) IS REJECTED ON THE RECORD.
  ══════════════════════════════════════════════════════════════════════════════
  ISSUE-165 offers two shapes and declines to pick. This plan picks (b) — make the guard
  SEAM-AWARE, checking each hop against what correctness actually requires THERE, with the
  inner hop resolved against the enclosing function's own typed prober parameter — and
  REFUSES (a) (rename `probeABI` to `probeLandlockABI` so the naive check happens to match).
  (ISSUE-165 calls option (b) "trace parameter provenance". This plan deliberately does NOT
  claim dataflow provenance: see "WHAT THIS IS AND IS NOT" below. It delivers option (b)'s
  intent by binding, and says where that stops.) DIR-024 item 21 states the reason and this plan adopts it: a
  parameter spelled `probeLandlockABI` SHADOWS the package-level function inside both
  bodies, so the inner-hop assertion would then pass for ANY caller-supplied prober,
  including the fake one the tests inject. That is green-without-being-true — it retires
  the exact test/production divergence the guard's own header says it exists to catch, and
  it is the founder's standing never-hack-the-gate-green law in its purest form. Option (a)
  must not be taken without an explicit founder ruling; nothing in this lane takes it.

  A CONSEQUENCE WORTH STATING: `pkg/packval/sandbox_linux.go` IS NOT EDITED BY THIS LANE
  AT ALL. Every changed line lives in a `_test.go` file. Read `sandbox_linux.go`; do not
  touch it, and do not rename `probeABI`.

  ── WHAT THE REWRITTEN GUARD ASSERTS, HOP BY HOP ────────────────────────────────
  The guard stops treating four call sites as one undifferentiated set. It classifies each
  tracked call by its ENCLOSING FUNCTION and applies the assertion that is actually
  correct there:

    BUCKET A — THE PRODUCTION DISPATCH SEAMS (2 sites). Enclosing `platformSandboxedRun`
    calling `linuxSandboxedRunWith`; enclosing `platformSandboxedRunStdout` calling
    `linuxSandboxedRunStdoutWith`. These functions take NO prober parameter — they are the
    platform-neutral seam shared with `sandbox_nonlinux.go` — so this is the ONE place the
    real prober enters the chain, and the last argument MUST be the package-level
    identifier `probeLandlockABI`. Unchanged in spirit from today's check.

    BUCKET B — THE INJECTABLE SEAMS (2 sites). Enclosing `linuxSandboxedRunWith` and
    `linuxSandboxedRunStdoutWith`, each calling `newSandboxHelperCommand`. The last
    argument MUST be the identifier that names THAT function's PROBER PARAMETER — and the
    prober parameter is resolved BY TYPE, as "the enclosing decl's EXACTLY ONE parameter
    whose declared type is `LandlockABIProbe`", NEVER as "the last parameter". Positional
    resolution is a measured hole, not a hypothetical: a trailing decoy
    (`..., probeABI LandlockABIProbe, decoy LandlockABIProbe`) forwarding `decoy` produces
    ZERO violations under a positionally-last rule, in both the separate-field and
    grouped-field spellings. By-type resolution closes it and, as a bonus, makes a
    two-prober signature itself a loud violation rather than a silent pass.
    Two rules apply at each of these sites and BOTH are evaluated UNCONDITIONALLY (see
    sharp edge 14 — the natural if/else ordering silently reinstates option (a)):
      B1 the forwarded identifier equals the resolved prober parameter's name;
      B2 the prober parameter is NOT ITSELF NAMED `probeLandlockABI`, and the forwarded
         identifier is not the literal `probeLandlockABI`. B2 is option (a)'s refusal made
         ENFORCEABLE rather than merely documented: under option (a) B1 passes trivially
         (the name matches itself) while the seam has become vacuous.

    ANY OTHER SITE. A tracked call in any other enclosing function, or at file scope, is a
    LOUD failure ("unclassified prober-carrying call site"), never a silent skip. A third
    delegation added later cannot slip past unchecked.

    WHAT THIS IS AND IS NOT — SAID PLAINLY SO THE GUARD IS NOT OVERSOLD. This is
    IDENTIFIER BINDING, not dataflow provenance. It resolves the forwarded name against the
    ENCLOSING DECL's own typed parameter instead of against nothing, which is strictly
    stronger than today's flat package-scope spelling match — but a body that RE-BINDS that
    identifier (`probeABI = someFake` before the call) still passes the name check. Real
    provenance needs `go/types`, which this guard deliberately does not use: it must stay a
    text-and-AST check over a file that may not even build for the host platform. The
    mitigation is cheap and mandated (B3): flag any `*ast.AssignStmt` in the enclosing body
    that assigns to the prober parameter's identifier. This limitation is inherited from the
    original guard, not introduced here — but it gets stated rather than papered over.

  WHAT THE GUARD STILL FALSIFIES AFTERWARD (DIR-024 item 21 asks the plan to say):
  a dispatch seam handed anything but the real `probeLandlockABI`; an inner seam handed
  anything but its own typed prober parameter (including the real prober, which would be
  vacuity); an inner seam whose prober parameter has been RENAMED to `probeLandlockABI`,
  i.e. option (a) itself; a decoy second `LandlockABIProbe` parameter; a re-bind of the
  prober identifier inside the body; a seam or a hop DELETED (the counts); a new
  prober-carrying call site nobody classified.
  What it deliberately does NOT falsify: whether `probeLandlockABI` itself is correct (that
  is `sandbox_linux_exec_test.go`'s job on a real host); anything about callers outside
  `sandbox_linux.go`; and any value-level substitution that does not go through an
  identifier the guard can see — a text-and-AST guard cannot reach that, and this plan does
  not pretend otherwise.

  ── AND THE GUARD STOPS BEING DARK ON THE AUTHORING MACHINE ─────────────────────
  ISSUE-165's "Why this was never caught before tonight" is the durable half of this
  defect: the guard lives in a `//go:build linux` file, so it has NEVER compiled — let
  alone run — on the darwin machine this suite is authored on. A rewrite that leaves it
  linux-gated leaves the NEXT mechanism bug equally undiscoverable until CI finds it.
  The guard executes no Linux syscall and touches no linux-only symbol: it parses
  `sandbox_linux.go` as TEXT, and that file is on disk on every platform. So it MOVES,
  keeping its name, into a new UNTAGGED test file in the same package, where it runs
  everywhere. This is a deliberate, stated scope decision — reject it cleanly in review if
  it is unwanted; it is one file move within one package and nothing else depends on it.

