               `probeABI = someFake` before forwarding `probeABI`. MUST be a violation.
               Comment the honest limit here: the forward itself still looks correct to a
               name check, this is why the guard flags the ASSIGNMENT rather than claiming
               dataflow provenance, and a value substitution that never touches this
               identifier remains out of reach of any AST-only guard.
            8. UNCLASSIFIED SITE: a tracked call (say `newSandboxHelperCommand`) inside some
               other function entirely. Violation naming it as unclassified — a silently
               skipped site is the failure mode this arm exists to prevent (CLM-003).
            9. A DELETED SEAM: one dispatch delegation removed. The returned counts must
               show it (`dispatch == 1`), which is what the count assertion in the guard
               proper then converts into a failure (CLM-003).
           10. ZERO-ARG TRACKED CALL: `newSandboxHelperCommand()` with no arguments. Must
               produce a VIOLATION and must NOT panic (sharp edge 15).

          For every negative case assert the violation set is NON-EMPTY and that at least
          one message names the expected function or position — not merely that the count
          is nonzero, so a checker returning generic strings cannot satisfy it. Give each
          subtest a legible failure message; these functions are not exempt from the
          hollow-test rule.

          DO NOT touch `sandbox_linux_errors_test.go` in this task, and DO NOT touch
          `sandbox_linux.go` in any task of this plan.
        files:
          - pkg/packval/sandbox_wiring_guard_test.go
        claims:
          - CLM-001
          - CLM-002
          - CLM-003
          - CLM-004
          - CLM-005
        depends_on: []
        test_names:
          - TestSandboxLinux_ABIProbeWiringGuardFalsifiesEachDefectShape

      - id: TASK-002
        type: implementation
        title: "Write the seam-aware checker and move the guard onto it, keeping its name"
        description: |
          Two files, one commit with TASK-001 (sharp edge 12).

          (1) IN `pkg/packval/sandbox_wiring_guard_test.go` (the untagged file TASK-001
          created), implement `proberWiringViolations` exactly as TASK-001's seam declares,
          and MOVE `TestSandboxLinux_ProductionPathUsesTheRealABIProbe` into this file —
          SAME NAME, new body (sharp edge 5). The moved guard parses `sandbox_linux.go` by
          bare relative name as today (sharp edge 13), hands the AST to the checker, and
          turns each returned violation into a `t.Errorf`, then asserts the counts.

          THE CHECKER'S RULES, keyed on the ENCLOSING `*ast.FuncDecl` rather than on a flat
          identifier set. Walk `file.Decls`, and for each `*ast.FuncDecl` inspect its body
          for `*ast.CallExpr` whose `Fun` is an `*ast.Ident` in the tracked set
          {`linuxSandboxedRunWith`, `linuxSandboxedRunStdoutWith`,
          `newSandboxHelperCommand`}. Inspecting per-FuncDecl is what makes the enclosing
          function known without a parent map.

            BUCKET A — DISPATCH (CLM-001). Enclosing `platformSandboxedRun` calling
            `linuxSandboxedRunWith`, or enclosing `platformSandboxedRunStdout` calling
            `linuxSandboxedRunStdoutWith`. REQUIRE the last argument to be an `*ast.Ident`
            named `probeLandlockABI`. These seams take no prober parameter — they are the
            platform-neutral contract shared with `sandbox_nonlinux.go` — so this is the
            single point where the real prober enters the chain. Increment `dispatch`.

            BUCKET B — FORWARD (CLM-002). Enclosing `linuxSandboxedRunWith` or
            `linuxSandboxedRunStdoutWith` calling `newSandboxHelperCommand`. Increment
            `forward`.
            RESOLVE THE PROBER PARAMETER BY TYPE, NEVER POSITIONALLY. Walk every
            `*ast.Field` of `decl.Type.Params` whose type is the identifier
            `LandlockABIProbe` — compared as a STRING, never referenced as a type (sharp
            edge 7) — and collect every `Name` in those fields (a field may declare several
            names, so the grouped form `probeABI, decoy LandlockABIProbe` yields two).
            Require EXACTLY ONE such name and violate otherwise: zero means the injectable
            seam this guard describes no longer exists; two or more means a decoy prober is
            in scope, which is a defect in its own right and is precisely what defeats a
            positionally-last rule (measured — see sharp edge 14's sibling case in
            TASK-001's table, case 5).
            THEN APPLY BOTH RULES, UNCONDITIONALLY AND WITH B2 FIRST (sharp edge 14 — an
            `else` here silently reinstates option (a) and the lane ships the thing it
            refused):
              B2 (checked first, always): the resolved parameter's NAME must not be
                 `probeLandlockABI`, and the call's last argument must not be the literal
                 identifier `probeLandlockABI`. Two distinct, self-explaining messages: a
                 parameter so named SHADOWS the package-level prober and makes this whole
                 assertion satisfiable by any caller-supplied fake (that is option (a),
                 refused by this plan and by DIR-024 item 21); an argument so spelled
                 BYPASSES the injected parameter and makes every fake-prober test in this
                 package exercise the real kernel probe.
              B1 (also always evaluated): the call's last argument is an `*ast.Ident` whose
                 name equals the resolved parameter's name.
              B3: scan the enclosing body for an `*ast.AssignStmt` whose LHS is that
                 identifier — a re-bind makes B1 pass while the forwarded value is
                 something else entirely. Violate, and say in the message that this guard
                 checks IDENTIFIER BINDING, not dataflow; real provenance would need
                 `go/types`, which this guard deliberately does not use.
            GUARD `len(call.Args) == 0` BEFORE INDEXING (sharp edge 15) — in both buckets.
            A zero-arg tracked call is a violation, not a panic.

            ANY OTHER ENCLOSING FUNCTION (CLM-003): violation, "unclassified
            prober-carrying call site at <pos>", stating that a new delegation must be
            classified into one of the two buckets rather than silently trusted.

          The failure messages replace today's text, which is misleading in two ways worth
          fixing while here: it names `newSandboxHelperCommand` even for calls to the other
          two functions, and it tells the reader the sandbox "would negotiate its ABI
          through something other than the kernel" at sites where nothing of the sort is
          true. Each new message names the actual enclosing function, the actual callee, the
          actual last argument and what was required instead.

          COUNTS (CLM-003, sharp edge 4). The guard asserts `dispatch == 2` AND
          `forward == 2` AND their total `== 4`, with a `t.Fatalf` carrying today's stated
          reasoning — the guard asserts a property OF those sites and is meaningless if they
          moved — plus the per-bucket numbers in the message. Today's bare `callSites != 4`
          is REPLACED here deliberately; do not leave it behind anywhere.

          Give the moved guard a header comment that keeps the original's point (a seam a
          test can fill is a seam production can be left holding the wrong thing in) and
          adds the facts this lane established: (i) why the inner hop is asserted against
          the enclosing decl's own TYPED parameter rather than against a package-level
          spelling, naming option (a) as the vacuous green it would be; (ii) why the file is
          untagged — the guard parses source text, executes no Linux syscall, and being
          `//go:build linux` is exactly why its own defect survived undetected until Linux
          CI reached it.
          And give the CHECKER a header comment stating its reach honestly, so the next
          reader neither oversells nor "fixes" it: it is an identifier-binding check, not
          dataflow provenance (B3 is a mitigation, not a proof); and calls it cannot see as
          tracked identifiers at all — a selector-form `x.newSandboxHelperCommand(...)`, or
          a tracked call nested inside a `FuncLit` — are caught by the COUNT assertion
          rather than by the per-site rules, because they stop being counted. That is a real
          strength of pairing the two, and it is worth naming so nobody removes the counts
          as redundant.

          (2) IN `pkg/packval/sandbox_linux_errors_test.go`, DELETE the old
          `TestSandboxLinux_ProductionPathUsesTheRealABIProbe` and its header comment, and
          drop any import (`go/ast`, `go/parser`, `go/token`) that becomes unused — the
          remaining tests in that file must still compile for linux, which TASK-003 checks
          by cross-compilation. Change NOTHING else in that file: the other tests there are
          correct, are the injectable seam's real coverage, and belong to other lanes'
          surface. Where the deleted guard is referenced in a neighbouring comment (e.g.
          `TestLinuxSandboxedRunWith_WrapsThePrepareFailure`'s "as the wiring guard above
          enforces"), adjust the wording to point at the new file rather than leaving a
          dangling "above".

          `pkg/packval/sandbox_linux.go` IS NOT EDITED (CLM-006). Do not rename `probeABI`.

          Run `backstop gate` after this task, as the implementer contract requires.
        files:
          - pkg/packval/sandbox_wiring_guard_test.go
          - pkg/packval/sandbox_linux_errors_test.go
        claims:
          - CLM-001
          - CLM-002
          - CLM-003
          - CLM-004
          - CLM-005
          - CLM-006
        depends_on:
          - TASK-001
        test_names:
          - TestSandboxLinux_ProductionPathUsesTheRealABIProbe
          - TestSandboxLinux_ABIProbeWiringGuardFalsifiesEachDefectShape

      - id: TASK-003
        type: verification
        title: "Measure what darwin can measure: the guard running for real, and the linux-tagged half cross-compiled"
        description: |
          ★ READ THE VERIFICATION CEILING SECTION FIRST. Do not attempt to reproduce the CI
          failure or to confirm it is gone; neither is possible here (sharp edge 1).

          (1) THE FIX'S OWN MECHANISM, EXECUTED (CLM-001..CLM-005) — this is a real run, not
              a proxy, because the guard now runs on this platform and reads the same
              `sandbox_linux.go` CI reads:
                go test ./pkg/packval/ -run "TestSandboxLinux_ProductionPathUsesTheRealABIProbe|TestSandboxLinux_ABIProbeWiringGuardFalsifiesEachDefectShape" -v -count=1
              `-v` IS MANDATORY. Confirm a `--- PASS:` line for BOTH names and for every
              subtest of the falsification table, and report them. A bare `ok` with no
              per-test lines means nothing matched (sharp edge 2) and is NOT a pass.

          (2) THE LINUX-TAGGED HALF STILL COMPILES FOR ITS REAL PLATFORM (CLM-006) — the
              only instrument that sees the file TASK-002 cut from:
                GOOS=linux GOARCH=amd64 go test -c -o /dev/null ./pkg/packval/
                GOOS=linux GOARCH=amd64 go vet ./pkg/packval/
              Both were measured working and clean at authoring; a leftover unused import
              in `sandbox_linux_errors_test.go` is the likeliest way this goes red and is
              invisible to every native darwin command.

          (3) PRODUCTION CODE UNTOUCHED, MECHANICALLY (CLM-006) — the one claim in this
              plan that prose cannot carry, since "we didn't edit it" is exactly what an
              accidental edit also says:
                git status --porcelain pkg/packval/sandbox_linux.go
              MUST print NOTHING. Report the command and its empty output verbatim. If it
              prints anything at all — including a whitespace-only or comment-only change —
              this lane took option (a) or drifted into it; revert that file and say so.
              (Sharp edge 16: the stale doc comment at `sandbox_linux.go:163-175` is a known
              casualty of this fix and is deliberately NOT repaired here; TASK-005 files it.)

          (4) NATIVE BUILD AND VET:
                go build ./...
                go vet ./pkg/packval/

          (5) DARWIN NON-REGRESSION for the package:
                go test ./pkg/packval/ -count=1
              Report honestly INCLUDING pre-existing reds — this package carries inherited
              failures from other lanes. For any red, establish whether it predates this
              lane by measuring a control at clean HEAD in a detached worktree (a carried
              reading is not evidence) and ATTRIBUTE it by name to its owning lane. Never
              absorb another lane's red and never waive one. If sibling lane ISSUE-168 is
              mid-flight in this package (sharp edge 11), say so plainly and run this when
              the tree is quiet rather than substituting a narrower run and calling it the
              suite.

          (6) DIFF-SCOPED GATE over both touched files:
                backstop gate --file pkg/packval/sandbox_wiring_guard_test.go
                backstop gate --file pkg/packval/sandbox_linux_errors_test.go
              Fix anything attributable to this lane AT SOURCE. Do not waive; do not weaken
              a test to clear a finding.

          (7) STATE THE CEILING EXPLICITLY IN THE REPORT (CLM-007): none of the above
              exercises the remaining `//go:build linux` tests in
              `sandbox_linux_errors_test.go`, and none of it confirms the CI red is gone —
              that is TASK-005's reading. A report listing green checks without that
              sentence is incomplete.
        files:
          - pkg/packval/sandbox_wiring_guard_test.go
          - pkg/packval/sandbox_linux_errors_test.go
        claims:
          - CLM-001
          - CLM-002
          - CLM-003
          - CLM-004
          - CLM-005
          - CLM-006
          - CLM-007
        depends_on:
