notes: |
  Implements ISSUE-070 — in default diff mode (`backstop gate`, no `--all`) the
  `golangci` lint engine's violations are reported on files NOT in the change
  unit, redding the gate on pre-existing debt in untouched files. Measured on
  ISSUE-068's 19-file change: 113 pack_engines violations across 30 files, of
  which 28 are entirely outside the diff. This makes diff-scope untrustworthy —
  the whole gate-hardening / ratchet story depends on it.

  ── DIAGNOSTIC-FIRST (founder mandate: pin, do not assume) ──────────────────
  Phase 1 is a DIAGNOSTIC that pins the exact root cause with EVIDENCE before any
  fix. Two hypotheses are on the table (issue §"Leading hypothesis"): (a) a path
  normalization mismatch defeating scope.Contains, or (b) the violations wrongly
  stamped ProjectWide=true. The diagnostic must LOG the actual stamped violation
  File paths vs the scope's Files list and confirm which mechanism is responsible.

  ── ROOT CAUSE (authored hypothesis — Phase 1 CONFIRMS this with evidence) ───
  Neither (a) nor (b). The `pack_engines` gate step NEVER APPLIES THE DIFF-SCOPE
  FILTER to its dispatched violations. Read the code:

    * pkg/gate/scope.go `filterViolations(scope, violations)` is CORRECT and
      already unit-proven (TestGate_FilterViolations_BuildPassExemptFromScopeFilter):
      a ProjectWide==true violation is exempt (build break anywhere still reds); a
      ProjectWide==false violation on an out-of-scope file IS filtered.
    * pkg/gate/step_delegate.go (code_check, artifact) and pkg/gate/baseline.go
      (CompareBaseline) BOTH call filterViolations on their violation streams.
    * cmd/backstop/gate.go `packValidatorStep` (~801-853) does NOT. It takes the
      raw `dispatchPackEnginesWithCache(...)` output and sets `status = "fail"`
      directly on `len(violations) > 0` — no filterViolations, no scope.Contains.

  golangci is `scope_kind: project-wide` with `ProjectTarget: ./...` (Go
  whole-package analysis cannot be file-scoped at the tool level — ISSUE-010
  intentionally left the project-wide `if` branch pointing at `./...`), so it
  legitimately PRODUCES findings across the whole repo. It is NOT
  `exempt_from_scope_filter`, so its bridged violations carry ProjectWide==false
  (pack_gate.go:830 stamps ProjectWide from binding.ExemptFromScopeFilter). Those
  out-of-scope, non-exempt findings are SUPPOSED to be filtered down to the
  change unit after the project-wide run — but because packValidatorStep skips
  filterViolations entirely, they pass straight through and red the gate.

  Contrast that localizes it (issue §"Contrast"): artifact_status_drift and
  code_check DO scope correctly — because they route through
  StepArtifactValidationScopedFunc / StepCodeCheckScopedFunc, which call
  filterViolations. The pack_engines step is the ONE dimension that forgot to.

  Why the normalization hypothesis is (almost certainly) a red herring at this
  layer, to be CONFIRMED not assumed: pack_gate.go:821 already stamps each
  bridged violation File via `gate.NormalizePath(projectRoot, v.File)` (rel-ifies
  an absolute golangci path against projectRoot), and scope.Contains
  (scope.go:64-70) tests `s.fileSet[NormalizePath(s.ProjectRoot, path)]` — both
  sides run through the SINGLE NormalizePath with the SAME projectRoot. So once
  the filter is actually CALLED, membership matches. The diagnostic logs both
  forms to prove this rather than trust it.

  ── THE FIX (general, thin-executor-clean — NO golangci-by-name) ────────────
  Apply the scope filter at the pack_engines step, keyed on the STRUCTURAL
  ProjectWide + scope.Contains properties the filter already uses — so ANY
  project-wide non-exempt engine is filtered, never golangci specifically.

    1. pkg/gate/scope.go — EXPORT a ProjectWide-aware scope filter so the
       cmd/backstop step (package main) can reuse the exact same logic
       step_delegate/baseline use. Add a thin method:

           func (s *GateScope) FilterViolations(violations []Violation) []Violation {
               return filterViolations(s, violations)
           }

       filterViolations stays unexported and UNCHANGED (its other callers are
       untouched). The method is nil-safe and returns all violations for
       GateScopeModeAll / nil scope (so `gate --all` and code_check's full-scope
       reporting are preserved).

    2. cmd/backstop/gate.go — in packValidatorStep, filter BEFORE computing
       status:

           violations = activeScope.FilterViolations(violations)

       inserted immediately after the successful
       `dispatchPackEnginesWithCache(...)` return (~844), before the
       `len(violations) > 0` status check. Everything else in the step is
       unchanged.

  This is the SYMMETRIC fix to ISSUE-010: ISSUE-010 scoped the rule-fed FILE-ARGS
  engines (semgrep/ast-grep) by pointing them at changed files so they never
  PRODUCE out-of-scope findings; project-wide engines (golangci/go-build) MUST
  keep scanning `./...`, so their out-of-scope findings must be FILTERED after the
  fact — the half ISSUE-010 left undone for the project-wide path.

  ── WHAT MUST NOT REGRESS ──────────────────────────────────────────────────
    * go-build is exempt_from_scope_filter → ProjectWide==true → filterViolations
      keeps its out-of-scope violations. An unchanged-file BUILD BREAK still reds
      (CLM-005). This is the whole reason the filter keys on the structural
      ProjectWide field and not on a rule/tool name.
    * A CHANGED (in-scope) file's golangci violation still reds — you-touch-it-
      you-fix-it (CLM-004). scope.Contains(changed_file) == true keeps it.
    * `gate --all` (GateScopeModeAll) and `backstop code check` keep FULL-scope
      reporting — filterViolations returns everything for All/nil scope (CLM-006).
    * filterViolations, step_delegate, baseline, and every other dimension are
      untouched — only the pack_engines step gains the (already-existing) filter
      call (CLM-006).

  ── DISPATCH OUTPUT STAYS UNFILTERED (why the diagnostic assertion is durable) ─
  The fix filters in the STEP, AFTER dispatch. dispatchPackEnginesWithCache keeps
  returning the raw project-wide violation set (unchanged). So the diagnostic's
  assertion — "dispatch output still contains the out-of-scope non-exempt
  violation, proving the leak is the absent step-level filter, not dispatch" —
  remains TRUE after the fix. That is deliberate: it lets Phase 1's diagnostic
  file stay green forever while Phase 2's regression tests guard the STEP.

  ── FILE SCOPE (tight) ──────────────────────────────────────────────────────
    Production (2 files):
      • pkg/gate/scope.go        — exported FilterViolations method (wrapper only)
      • cmd/backstop/gate.go     — packValidatorStep applies the filter
    Tests:
      • cmd/backstop/pack_gate_diffscope_diagnostic_test.go — diagnostic evidence
      • cmd/backstop/gate_scope_test.go — step-level regression tests
      • pkg/gate/scope_test.go          — exported-method + normalization tests

  ── REQUIREMENTS / CLAIMS (plan-local, derived from the issue's Acceptance) ──
    REQ-001: Under default diff, the pack_engines step filters project-wide
             NON-EXEMPT engine violations on files NOT in the change unit.
      CLM-001  an out-of-scope non-exempt (project-wide, e.g. golangci) violation
               is filtered from the pack_engines StepResult and does NOT red.
      CLM-002  scope membership matches because violation.File and scope.Files are
               compared in the SAME repo-relative form (scope.Contains via the
               single NormalizePath on both sides) — the normalization hypothesis
               is confirmed a red herring at this layer, with evidence.
      CLM-003  the fix is general/structural — keyed on the ProjectWide field +
               scope.Contains, NOT a golangci-by-name special case (thin-executor).
    REQ-002: Changed-file violations still red (you-touch-it-you-fix-it).
      CLM-004  a non-exempt violation on a CHANGED (in-scope) file survives the
               filter and reds the gate.
    REQ-003: The exempt path is not regressed.
      CLM-005  a ProjectWide==true (go-build/exempt) violation on an UNCHANGED
               file survives the filter and still reds project-wide.
    REQ-004: Other dimensions unaffected; root cause pinned.
      CLM-006  only the pack_engines step gains the filter call; filterViolations,
               step_delegate, baseline, and every other dimension are unchanged;
               `gate --all` / code_check keep full-scope reporting.
      CLM-007  the exact root cause is empirically pinned with logged evidence
               (dispatch output retains the out-of-scope non-exempt violation → the
               leak is the absent STEP-LEVEL filter; stamped File paths are already
               repo-relative → normalization ruled out) BEFORE the fix.

  Structure:
    Phase 1: Diagnostic — reproduce the leak, log stamped-File vs scope.Files,
             pin the root cause (missing step filter) with evidence.
    Phase 2: TDD red — failing regression tests at the step layer (filter
             applied) and the pkg/gate layer (exported method + normalization).
    Phase 3: TDD green — export FilterViolations; packValidatorStep applies it;
             backstop code check.
    Phase 4: Comprehensive verification — full backstop gate kill chain.

