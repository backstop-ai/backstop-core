          The seam returns FOUR violations:
            * IN-scope changed file, ProjectWide==false (golangci-shaped)  → kept
            * OUT-of-scope file,     ProjectWide==false (golangci-shaped)  → filtered
            * OUT-of-scope file,     ProjectWide==false, DIFFERENT SourcePack /
              rule id (a non-golangci-named engine)                        → filtered
            * OUT-of-scope file,     ProjectWide==true  (go-build/exempt)  → kept

          These tests fail today because packValidatorStep sets status="fail" on
          the raw dispatch output (~844-853) with no filterViolations call, so the
          out-of-scope non-exempt violations survive.

          Mandated test names (exact):

            - TestGate_PackEngines_DiffScope_FiltersOutOfScopeNonExemptViolation
