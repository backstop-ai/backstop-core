        type: test
        title: "Write failing step-level tests that the pack_engines step diff-scope-filters its violations"
        description: |
          Add failing regression tests to cmd/backstop/gate_scope_test.go pinning
          that the packValidatorStep closure built by buildGateSteps FILTERS its
          dispatched violations against the gate's activeScope before deciding
          pass/fail. Drive the pack_engines step through the dispatchPackEnginesFn
