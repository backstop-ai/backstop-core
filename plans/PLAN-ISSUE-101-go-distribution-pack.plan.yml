          (1) slug `goreleaser-derived-env-cross-file-falsifier`. The general
          derived-env invariant — every `{{ .Env.X }}` referenced in
          `.goreleaser.yml` has a matching env export in `release.yml` — is a
          CROSS-FILE correlation that semgrep cannot express, being
          single-file. The escalation ladder's next rung is a custom script
          engine, which was judged out of proportion for one rule in a pack
          this size. What SHIPPED instead: the single-file
          `release-workflow-tap-token-not-exported` WARNING covering the one
          instance that actually burned ISSUE-087, plus a manual-verification
          note in the recipe's release.yml payload. Cite ISSUE-101
          requirement 5, ISSUE-087's half-published-release failure mode, and
          this plan.

          (2) slug `recipe-payload-foreign-template-escape`. The recipe
          substituter (pkg/recipe/substitute.go:31-62) reads EVERY `{{ ... }}`
          span as a param name and hard-errors on an undeclared one, with no
          escape syntax. Any recipe whose payload legitimately emits foreign
          templates — GitHub Actions `${{ ... }}`, goreleaser `{{ .X }}`, Helm,
          Jinja — must declare a self-emitting pass-through param per template,
          exploiting the fact that substituted values are never rescanned.
          go-distribution needs eight of them. It works and it is honest, but
          it is a workaround: propose a first-class escape and note the hazard
          that `--param .Version=...` can rewrite an emitted template. Cite
          SPEC-054 and this plan.

