          Verification section names backstop-core ADOPTING the pack, but this
          plan proves the rules in a DISCARDED WORKTREE and never installs the
          pack durably — a deliberate omission, taken because mutating the live
          repo was out of scope and because adding a pack to core's committed
          backstop.yml / backstop.lock can move core's gate verdict for reasons
          that have nothing to do with the trinity. That residual has to be
          owned by an artifact rather than by this plan's prose. The issue
          should carry what TASK-010 measured — rules green on the shipped
          trinity, existing packs still dispatching — so the adoption starts
