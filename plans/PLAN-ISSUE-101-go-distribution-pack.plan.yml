      - id: TASK-005
        type: implementation
        title: "Author the nine semgrep rules and wire them into pack.yml"
        description: |
          GREEN PHASE. Author three semgrep rule files and the pack.yml
          ruleset that binds them to claims and fixtures.

          THE RULE IDIOM IS FIXED BY MEASUREMENT (see notes finding 5). Do NOT
          attempt structural YAML patterns for the workflow-shape invariants:
          semgrep's `...` does not traverse from a mapping into sequence items,
          so a job block cannot be correlated with a step nested inside it, and
          composing multiple `pattern-regex` entries INTERSECTS their ranges so
          a whole-file `pattern-not-regex` never sees the file. Use ONE
          whole-file anchor regex that also carries the trigger condition, plus
          a whole-file `pattern-not-regex`. The proven shape:

            patterns:
              - pattern-regex: "(?s)^name:.*goreleaser/goreleaser-action.*$"
              - pattern-not-regex: "(?s)^name:.*<required construct>.*$"

          The anchor doubling as the trigger is what makes these SELF-SCOPING:
          no `paths:` filter, and silent on YAML that is not a release
          workflow. The goreleaser-config rules anchor on a goreleaser-specific
          structural signature (e.g. `builds:` together with `goos:`), NOT on
          `version: 2` alone, which is too weak to distinguish arbitrary YAML —
          the silence fixture from TASK-003 is what proves the anchor is tight
          enough.

          rules/workflow/release-workflow.yml — five rules:
            go-distribution.workflow.goreleaser-action-unpinned    ERROR
              fires unless the goreleaser-action step declares a `version:`
              input on the `~> v2` line. `@latest`, an omitted input, or a v3+
              pin all fire. Do NOT match on the action's `@vN` ref: the pin
              that matters is the `version:` input.                  (CLM-008)
            go-distribution.workflow.non-tag-trigger                ERROR
              fires when a release workflow's `on:` carries anything but a
              `v*` tag push — a `branches:` or `pull_request:` trigger. (CLM-009)
            go-distribution.workflow.goreleaser-job-ungated         ERROR
              fires unless the file declares a `needs:` listing AT LEAST TWO
              jobs. This is the pack's central blocker. Assert the SHAPE (two
              or more dependencies), never the job NAMES — `tag-integrity` and
              `require-green-ci` are core's names, and a rule keyed on them
              would fail CLM-007.                                    (CLM-010)
            go-distribution.workflow.permissions-too-broad          ERROR
              fires when a release workflow grants any permission beyond
              `contents: write` and `actions: read`.                 (CLM-011)
            go-distribution.workflow.tap-token-not-exported         WARNING
              fires when a workflow running goreleaser-action does not export
              HOMEBREW_TAP_TOKEN in that step's `env:`. Match the EXPORT FORM
              (`HOMEBREW_TAP_TOKEN:` plus a value), not the bare identifier —
              a comment naming it must not satisfy the rule. This is the
              enforceable single-file slice of the derived-env class; the
              cross-file general form is deliberately not built. (CLM-015)

          rules/goreleaser/goreleaser-config.yml — three rules:
            go-distribution.goreleaser.platform-matrix-incomplete   ERROR
              fires unless goos covers darwin AND linux and goarch covers
              amd64 AND arm64.                                       (CLM-012)
            go-distribution.goreleaser.version-ldflags-absent       ERROR
              fires unless an ldflags entry injects a version symbol via
              `-X <something>.version=`. Match the SHAPE — `main.version` is
              core's symbol and a consumer's main package may differ. (CLM-014)
            go-distribution.goreleaser.brews-token-absent           WARNING
              fires when a `brews:` block is present without an explicit
              `token:`. Non-blocking: a consumer who has not wired Homebrew
              yet is un-adopted capability, not a broken promise.    (CLM-013)

          rules/workspace/gitignore.yml — one rule:
            go-distribution.workspace.gitignore-missing-dist        WARNING
              `languages: [generic]`, `paths.include: [".gitignore",
              "*.gitignore"]`, fires when no `dist/` entry is present. This is
              ISSUE-101 requirement 6: goreleaser writes `dist/` into the
              workspace and a diff-scoped gate then gates it as if it were a
              source change — the exact false positive ISSUE-087's CI hit with
              ast-grep.zip and gate-report.json.                     (CLM-019)

          SEVERITY IS DECLARED IN THE RULE FILE, not pack.yml: semgrep's
          per-rule `severity:` becomes the SARIF `level`, and `warning` is
          non-blocking by contract while `error`/absent BLOCKS
          (cmd/backstop/pack_severity_contract_test.go). Follow go-standards'
          convention for the rest of the rule file: a `metadata.backstop`
          sub-block with category, rationale, and references.

          pack.yml — add `content.ruleset` with nine entries, each carrying
          `id`, `standard` (the prose invariant), `rule_path`, `risk_class`,
          `engine: semgrep-godist`, and one claim (clm-001..clm-009, in the
          order listed in the notes' mandated-names section) with its captured
