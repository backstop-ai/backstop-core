      - id: TASK-008
        type: implementation
        title: "Author recipe.yml and the four payload files derived from core's shipped trinity"
        description: |
          GREEN PHASE. recipes/go-release/recipe.yml plus the payload, plus the
          `recipes:` index entry in pack.yml.

          recipe.yml:
            kind: scaffolding
            version: "1.0.0"
            enforcement:
              rules: [all nine rule ids from TASK-005]
          `kind: scaffolding` is deliberate on two counts. It triggers packval
          phase 4's recipes-archetype teeth, which REQUIRE the
          `enforcement.rules` block naming the rules that re-check what this
          recipe establishes — precisely this pack's design (CLM-022). And it
          means REGENERATE-BY-DEFAULT on re-apply: a consumer's later
          divergence is overwritten unless it carries an active `@waiver`
          (pkg/recipe/apply.go:348-402). That ratchet is what stops starters
          from silently rotting, and the payload comments must say so, along
          with the fact that a file the consumer already owns is NEVER
          clobbered on first apply.

          PARAMS — two families.

          PROJECT PARAMS (required, no default; these are the consumer-edit
          points ISSUE-101 asks to mark clearly):
            binary_name        the binary/archive name and goreleaser
                               project_name
            main_package       e.g. ./cmd/<binary_name>
            main_package_dir   e.g. cmd/<binary_name> — the version.go target
            module_url         the canonical https://github.com/<org>/<repo>
            tap_owner          the Homebrew tap's owner
            tap_repository     default `homebrew-tap`. Homebrew strips the
                               `homebrew-` prefix at resolution, so consumers
                               type `<owner>/tap/<binary>` — say that in a
                               payload comment.
            app_description    the formula description
            app_license        default `MIT`
            ci_workflow_file   default `ci.yml` — the workflow the
                               require-green-ci job queries by name
          Defaults cannot reference other params (there is no expression
          grammar), so anything derived is its own required param.

          PASS-THROUGH TEMPLATE PARAMS — the mechanism this pack needs and the
          machinery's sharpest edge. Substitute (pkg/recipe/substitute.go:31-62)
          reads EVERY `{{ ... }}` span as a param name and hard-errors on an
          undeclared one; our payloads legitimately carry GitHub Actions and
          goreleaser templates that must reach disk verbatim. Because
          substituted values are NEVER RESCANNED, declare each foreign template
          as a param whose NAME is its inner text and whose DEFAULT is the same
          text wrapped, e.g.

            - name: ".Version"
              required: false
              default: "{{ .Version }}"

          Declare all eight: `.Version`, `.ProjectName`, `.Os`, `.Arch`,
          `.Env.HOMEBREW_TAP_TOKEN`, `github.ref_name`, `secrets.GITHUB_TOKEN`,
          `secrets.HOMEBREW_TAP_TOKEN`. Note `{{.Version}}` and `{{ .Version }}`
          trim to the same name, so one param covers both spellings; the
          emitted form is whatever the default says. Comment this block
          loudly — it is not self-evident, and a consumer who passes
          `--param .Version=...` would rewrite an emitted template.

          OPS — five `create` ops, in this order:
            .goreleaser.yml
            .github/workflows/release.yml
            .github/workflows/tag-integrity.yml
            {{ main_package_dir }}/version.go
            {{ main_package_dir }}/version_test.go   (the TASK-007 payload)

          PAYLOAD — derive each file from its core counterpart, replacing ONLY
          the project-identity strings with params (CLM-016). Sources:
            /Users/bmanson/src/projects/backstop-core/.goreleaser.yml
            /Users/bmanson/src/projects/backstop-core/.github/workflows/release.yml
            /Users/bmanson/src/projects/backstop-core/.github/workflows/tag-integrity.yml
            /Users/bmanson/src/projects/backstop-core/cmd/backstop/version.go
              PLUS cmd/backstop/root.go:15-20 — see the next paragraph.

          THE VERSION STARTER IS SELF-CONTAINED, AND version.go ALONE IS NOT
          ENOUGH (CLM-018). Core splits the pieces: `resolveVersion`,
          `isReleasedModuleVersion`, and `effectiveVersion` live in version.go,
          but the SYMBOL `-X` writes to — `var version = "dev"` — is declared
          in cmd/backstop/root.go:20. A payload copied from version.go alone
          does not compile in a consumer (`undefined: version`) and, worse, if
          the consumer patched around that by declaring the var elsewhere with
          a different name, `-X main.version=` would write nothing and every
          release binary would silently report "dev". The starter therefore
          declares BOTH in one file. Carry over root.go's comment explaining
          that the raw stamp is not what callers read, and carry over its
          `// nosemgrep: go.core.no-global-mutable-state` waiver with its
          justification — a package-level var is the ONLY thing `-ldflags -X`
          can write to, and consumers running go-standards (stash does, at
          1.2.0) would otherwise take a global-mutable-state finding on a
          construct the toolchain forces.

          Preserve the load-bearing comments — `fetch-depth: 0` is required for
          the ancestry query; the default GITHUB_TOKEN cannot push to another
          repository; absence of a CI run must fail closed; the `-X` symbol
