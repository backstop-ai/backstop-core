        type: test
        title: "Capture the release-workflow fixture set from core's shipped trinity"
        description: |
          RED PHASE for the five workflow rules. Every fixture is CAPTURED,
          never authored from imagination (ISSUE-101 requirement 9).

          POSITIVES — byte copies of files proven in production on 2026-07-27/28:
            fixtures/rules/valid/release-workflow.yml
              <- /Users/bmanson/src/projects/backstop-core/.github/workflows/release.yml
            fixtures/rules/valid/tag-integrity-workflow.yml
              <- /Users/bmanson/src/projects/backstop-core/.github/workflows/tag-integrity.yml

