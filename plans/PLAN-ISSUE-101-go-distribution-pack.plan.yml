  ─────────────────────────────────────────────────────────────────────────
  REQUIREMENTS / CLAIMS (plan-local, derived from ISSUE-101's nine hard-won
  requirements and its Verification section — the issue is at `open` status
  and records no claims, which is schema-gated)
  ─────────────────────────────────────────────────────────────────────────

    REQ-001: The pack exists and satisfies pack-craft law.
      CLM-001  pack.yml declares name `backstop-ai/go-distribution`, version
               0.1.0, language `go`, `archetype: recipes`, and a description;
               `backstop pack check` and `backstop pack test` both report
               status `pass` with ZERO errors.
      CLM-002  the pack declares EXACTLY ONE engine binding carrying
               `provision:` — the precondition `recipe apply` enforces
               unconditionally — under a DISTINCT name, never redefining
               base-engines' `semgrep` for other installed packs.
      CLM-003  every claim carries at least one positive AND one negative
               fixture (ParseManifestFile, pkg/pack/manifest.go:655-663), and
               every fixture file is CAPTURED — a byte copy of core's shipped
               trinity, or a deliberate single-defect mutation of one. No
               fixture is fabricated. (ISSUE-101 requirement 9)
      CLM-004  every rule declares `engine` and `risk_class`; `pack check`
               reports no orphan-fixture warning.

    REQ-002: Rules are actually falsified, and are generic.
      CLM-005  ISSUE-092 is re-verified at implementation time; because
               phase-3 fixture execution is dead for `rule_path:` packs,
               falsification runs semgrep DIRECTLY with EXPLICIT file targets
               (never a directory scan) and separately proves each rule file
               free of schema error, so "zero findings" can never be
               indistinguishable from "rule did not load".
      CLM-006  for every rule: its negative fixture yields >= 1 finding, its
               positive fixture yields EXACTLY ZERO, and an unrelated-YAML
               silence fixture yields EXACTLY ZERO.
      CLM-007  no rule pattern contains a consumer-specific literal — not the
               binary name `backstop`, the org `backstop-ai`, the module path,
               the tap name, or a workflow job name. (ISSUE-101 requirement 9)

    REQ-003: The release-workflow invariants survive adaptation.
      CLM-008  the goreleaser-action is pinned to the `~> v2` line; `@latest`
               or an omitted version input goes RED. (requirement 1)
      CLM-009  the release workflow triggers ONLY on `v*` tag push; a
               `branches:` trigger goes RED. (requirement 2)
      CLM-010  the release workflow declares a `needs:` naming AT LEAST TWO
               jobs; deleting it, or reducing it to one, goes RED. This is the
               pack's central broken-promise blocker. (requirement 2)
               HONEST LIMIT, stated so nobody reads more into it later: this
               is a FILE-LEVEL shape check, not a job-level one. Semgrep
               cannot correlate a `needs:` with the job that runs
               goreleaser (notes finding 5), so a workflow that gated some
               OTHER job on two dependencies would pass this rule. What the
               rule actually guards is the REMOVAL of the gate the recipe
               payload establishes — which is the observed failure mode
               (a maintainer deleting `needs:` to "unblock" a release) — not
               a deliberate mis-wiring. Closing that residual needs the same
               cross-file capability CLM-015 defers.
      CLM-011  workflow `permissions:` are `contents: write` + `actions: read`
               and nothing broader; a broader grant goes RED. (requirement 2)

    REQ-004: The goreleaser-config invariants survive adaptation.
      CLM-012  all four platforms are declared — darwin/amd64, darwin/arm64,
               linux/amd64, linux/arm64; dropping one goes RED. linux/arm64 is
               founder-ratified first-class, not optional. (requirement 4)
      CLM-013  a `brews:` block is present and supplies an explicit `token:`;
               its absence WARNS rather than blocks. (requirements 1, 5)
      CLM-014  version stamping is declared via `-X <main-pkg>.version=` in
               ldflags; its absence goes RED. (requirement 3)

    REQ-005: The derived-env class is scoped honestly, not faked.
      CLM-015  the general cross-file falsifier is NOT built; the pack ships
               instead the single-file HOMEBREW_TAP_TOKEN-export WARNING rule,
               a verbatim manual-verification note in the release.yml payload,
               and a filed follow-on issue naming the script-engine
               escalation. (requirement 5)

    REQ-006: The recipe payload is a faithful, parameterized derivation.
      CLM-016  every payload file derives from core's shipped counterpart, and
               every project-specific string (binary name, main package,
               module URL, org/repo, tap owner and repository, homepage,
               description, license, CI workflow filename) is a DECLARED
               PARAM, not a literal.
      CLM-017  every foreign `{{ }}` template — GitHub Actions' `${{ ... }}`
               and goreleaser's `{{ .X }}` — reaches the consumer's disk
               SEMANTICALLY INTACT via self-emitting pass-through params, and
               after a successful apply no UNINTENDED placeholder remains.
               NOT byte-identical, by construction: the substituter emits the
               param's DEFAULT, so delimiter spacing is normalized to one
               canonical form (`{{.Version}}` in the source emits as
               `{{ .Version }}`). Both goreleaser and GitHub Actions treat the
               two spellings identically, so this is normalization rather than
               loss — but an assertion written as byte equality against the
               source would be unsatisfiable, and must not be.
      CLM-018  the version starter is SELF-CONTAINED: one file declaring BOTH
               the `var version = "dev"` link-time stamp symbol AND the
               resolution logic. It reproduces resolveVersion's precedence
               (ldflags wins outright -> released module version from
               ReadBuildInfo -> "dev") and REJECTS `(devel)`, `+dirty`, and
               pseudo-versions; its shipped table test covers every branch and
               passes in the consumer. (requirement 3)
               THE SYMBOL IS THE HALF THAT IS EASY TO LOSE: backstop-core
               declares `var version = "dev"` in cmd/backstop/root.go:20, NOT
               in version.go, so a payload derived from version.go ALONE does
               not compile (`undefined: version`) and `-X main.version=` has
               no symbol to write — every release binary would silently report
               "dev", which is exactly the failure the ldflags comment in
               core's .goreleaser.yml warns about.
      CLM-019  the CI-droppings lesson ships as payload: `dist/` guidance for
               `.gitignore`, plus the WARNING rule that fires when it is
               absent. (requirement 6)
      CLM-020  consumer verification guidance points at
               `goreleaser release --snapshot --clean`, and documents that
               `goreleaser check` exits 2 on EXACTLY the `brews:` deprecation
               — that one deprecation is tolerated and NOTHING else is.
               (requirement 7, PLAN-ISSUE-087 CLM-012 carve-out)
      CLM-021  every workflow the recipes ship passes `actionlint` with ZERO
               findings, in the pack repo and in every consumer.
               (requirement 8)
      CLM-022  the recipe is `kind: scaffolding` and declares
               `enforcement.rules` naming the rules that re-check what it
               establishes, satisfying packval phase 4's recipes-archetype
               teeth.

    REQ-007: The pack is proven by consumption, in two independent legs.
      CLM-023  in a DETACHED WORKTREE of backstop-core, the pack's rules
               report ZERO findings against the shipped `.goreleaser.yml`,
               `release.yml`, and `tag-integrity.yml` — the generic-not-
