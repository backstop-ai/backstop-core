  # ═══════════════════════════════════════════════════════════════════════
  - id: phase-3
    name: "Phase 3: Recipe — the parameterized release-trinity payload"
    tasks:
      - id: TASK-007
        type: test
        title: "Author the version-starter table test payload and the recipe-apply verification harness"
        description: |
          RED PHASE for the recipe. Two artifacts, both written before the
          payload they check.

          (a) recipes/go-release/payload/version_test.go — the table test that
          ships to consumers alongside the version.go starter. Mirror core's
          cmd/backstop/version_test.go, generalized. MANDATED TEST FUNCTION
          NAMES (they ship to every consumer, so they are part of the pack's
          contract):
            TestResolveVersion_LdflagsInjectionWins
            TestResolveVersion_ModuleVersionFallbackForGoInstall
            TestResolveVersion_PseudoVersionFallsBackToDev
            TestResolveVersion_DirtyBuildFallsBackToDev
            TestResolveVersion_DevelAndAbsentBuildInfoFallBackToDev
          Between them they must cover: an injected ldflags value winning
          outright; a released module version from ReadBuildInfo being
          reported (the `go install ...@vX.Y.Z` path); and "dev" for each
          rejected shape — a pseudo-version (the 14-digit-timestamp +
          12-hex-char suffix a plain `go build` stamps since Go 1.24), a
          `+dirty` build-metadata version, `(devel)`, an empty version, and
          absent build info. The pseudo-version case is the one that was only
          discovered by capturing real output during ISSUE-087; it is not
          optional. `package main` — this file is data in the pack repo (which
          carries no go.mod, so it is inert there) and becomes real Go only
          after apply.

          The test must exercise `resolveVersion(injected, info, ok)` as a
          PURE FUNCTION of its arguments — that is what makes the whole matrix
          testable without building a binary per case — and must also assert
          that the package-level `version` symbol the starter declares exists
          and defaults to "dev", since that symbol is what `-X` writes to.

          (b) scripts/verify-recipe-apply.sh — the harness TASK-009 runs.
          Against a throwaway scratch Go CLI project it must:
            • create a minimal consumer (go.mod, cmd/<binary>/main.go,
              backstop.yml, an existing .gitignore) in a temp dir;
            • install the pack from the local path and run
              `backstop recipe apply backstop-ai/go-distribution:go-release@1.0.0`
              with the full `--param` set;
            • assert all five payload files landed at their declared targets;
            • assert TEMPLATE FIDELITY (CLM-017): the produced files contain
              `${{ github.ref_name }}`, `${{ secrets.GITHUB_TOKEN }}`,
              `${{ secrets.HOMEBREW_TAP_TOKEN }}`, `{{ .Version }}`,
              `{{ .ProjectName }}`, `{{ .Os }}`, `{{ .Arch }}` and
              `{{ .Env.HOMEBREW_TAP_TOKEN }}`, and contain no OTHER
              `{{`-delimited span — i.e. every remaining placeholder is an
              intended foreign template, never an unresolved param.
              ASSERT THE NORMALIZED FORM, NOT BYTE EQUALITY WITH THE SOURCE:
              the substituter emits the param's default, so a source
              `{{.Version}}` arrives as `{{ .Version }}`. Both spellings mean
              the same thing to goreleaser, but a byte-equality assertion
              against core's file would be unsatisfiable by construction;
            • run `actionlint` over both produced workflows and require ZERO
              findings (CLM-021);
            • run `goreleaser release --snapshot --clean` in the scratch
              project and assert FOUR platform binaries were produced (CLM-020);
            • run `goreleaser check` and tolerate EXACTLY ONE deprecation,
              `brews`, on a config goreleaser itself calls valid (measured
              exit 2 on v2.17.1 per PLAN-ISSUE-087's CLM-012 carve-out) — a
              SECOND deprecation, or any "configuration is invalid" result,
              FAILS the harness;
            • run `go test ./...` in the scratch project so the applied
              version starter and its table test actually pass (CLM-018);
            • run scripts/falsify.sh's rule set against the PRODUCED files and
              require zero errors — the recipe must emit a payload its own
              rules accept.
