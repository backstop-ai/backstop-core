notes: |
  ─────────────────────────────────────────────────────────────────────────
  WHAT THIS PLAN DOES
  ─────────────────────────────────────────────────────────────────────────
  Productizes the release trinity ISSUE-087 hand-wrote for backstop-core into
  `backstop-ai/go-distribution`, a PACK living in its own repo at
  ~/src/projects/backstop-go-distribution-pack and published at v0.1.0.

  Two capabilities, per ISSUE-101's Scope:
    A. RECIPES — starter payloads (.goreleaser.yml, release.yml,
       tag-integrity.yml, a version-resolution Go starter + its table test)
       derived VERBATIM from core's shipped, battle-tested files, with every
       project-specific string expressed as a declared recipe param.
    B. RULES — nine semgrep rules asserting the invariants that must survive
       consumer adaptation, so drift cannot silently reintroduce a known
       failure mode.

  THREE REPOS ARE TOUCHED. Every `files:` entry is an ABSOLUTE path so the
  repo is never ambiguous:
    • /Users/bmanson/src/projects/backstop-go-distribution-pack — the pack
      (new repo; the deliverable)
    • /Users/bmanson/src/projects/backstop-core — READ-ONLY except for the
      plan file itself and two follow-on issues. The core consumption proof
      runs in a DETACHED GIT WORKTREE that is discarded; the live checkout is
      never mutated, never gets the pack durably installed by this plan.
    • /Users/bmanson/src/projects/stash — a real consumer that receives the
      applied recipe. Its publication coordinates are an OPEN founder
      question; this plan stops at "pipeline files in place, rules green".
      NO stash release, tag, or tap is in scope.

  ─────────────────────────────────────────────────────────────────────────
  VERIFIED MECHANICS (read from the tree + spiked with real semgrep
  1.156.0 on 2026-07-28 — the plan's shape hinges on these five findings)
  ─────────────────────────────────────────────────────────────────────────

  (1) RECIPES ARE FULLY PARAMETERIZED, and the substituter has NO ESCAPE.
      pkg/recipe/substitute.go:31-62 resolves `{{ name }}` by exact lookup in
      the declared param map; an undeclared name is a hard error returning NO
      string. Substituted VALUES ARE NEVER RESCANNED (substitute.go:22-23).

      This is the sharpest edge in the whole plan. Our payloads are GitHub
      Actions workflows and a goreleaser config — both SATURATED with foreign
      `{{ }}` templates that MUST reach the consumer's disk verbatim:
        release.yml       ${{ github.ref_name }}, ${{ secrets.GITHUB_TOKEN }},
                          ${{ secrets.HOMEBREW_TAP_TOKEN }}
        tag-integrity.yml ${{ github.ref_name }}
        .goreleaser.yml   {{.Version}}, {{ .ProjectName }}, {{ .Os }},
                          {{ .Arch }}, {{ .Env.HOMEBREW_TAP_TOKEN }}
      Every one of those would be read as a param name and fail the apply.

      THE MECHANISM THE MACHINERY ACTUALLY SUPPORTS — a SELF-EMITTING
      PASS-THROUGH PARAM. Because values are never rescanned, a param whose
      NAME is the template's inner text and whose DEFAULT is that same text
      wrapped in delimiters emits the template verbatim:

        params:
          - name: ".Version"
            required: false
            default: "{{ .Version }}"

      The payload writes `-X main.version={{ .Version }}`; Substitute looks up
      `.Version`, emits `{{ .Version }}`, and does not rescan. Confirmed
      viable: no runtime guard rejects `{{` in emitted content (only `Op.Rule`
      and `Op.Fragment` refuse placeholders, manifest.go:220,272), and
      effectiveParams (apply.go:1175-1188) includes any param with
      `required: false` + a default. `{{.Version}}` and `{{ .Version }}` both
      trim to the same name, so one param covers both spellings.

      This is a WORKAROUND for a missing first-class escape, not a feature.
      TASK-016 files it as a follow-on against the recipe machinery. It is
      also a mild hazard: `--param .Version=anything` would rewrite the
      emitted template, which the payload comments must warn about.

  (2) `recipe apply` DEMANDS EXACTLY ONE PROVISIONED ENGINE BINDING —
      unconditionally, before Apply runs, regardless of op family
      (cmd/backstop/recipe_apply.go:231-243, :338-367). A create-only recipe
      in a pack declaring zero (or two+) provisioned bindings fails with a
      config error before the recipe ever executes.
      Consequence: the pack MUST declare an `engines:` block with exactly one
      binding carrying `provision:`. Our rules need semgrep anyway, so that
      binding is the semgrep one — but it is declared under a DISTINCT NAME
      (`semgrep-godist`), NOT `semgrep`. Pack bindings override the embedded
      base-engines defaults (packs/base-engines/pack.yml:22-40), and a pack
      that silently redefines the base `semgrep` binding for every OTHER
      installed pack in the project is a coupling defect waiting to happen.
      TASK-010 proves go-standards/go-toolchain still dispatch alongside it.

  (3) ARCHETYPE IS `recipes`, and that choice has TEETH.
      packval phase 4 (pkg/packval/phase4.go:101-154) requires every
      `scaffolding`- or `implementing`-kind recipe to declare
      `enforcement.rules`, naming the rules that re-check what the recipe
      establishes. That IS this pack's design — recipe writes the invariant,
      rule guards it — so `recipes` is the honest archetype and `scaffolding`
      the honest kind. phase 1's `content` check still demands a non-empty
      ruleset (packval/phase1.go:45), which our nine rules satisfy.
      `kind: scaffolding` also means REGENERATE-BY-DEFAULT on re-apply unless
      the consumer's divergence carries an active `@waiver` — the ratchet that
      stops starters from silently rotting. That is intended; the payload
      comments must say so.

  (4) ISSUE-092 IS STILL TRUE — `pack test` phase 3 CANNOT FALSIFY OUR RULES.
      packval reads a rule's source file from the `file:` key
      (pkg/packval/manifest.go:78); every real pack, and this one, declares
      `rule_path:` (pkg/pack/manifest.go:144). packval has zero `rule_path`
      support, so `rule.File == ""`, so both guards at phase3.go:62 and :76
      are false and RunEngine is NEVER CALLED — phase 3 reports `pass` having
      executed nothing. Re-verify at implementation time; if still true (it
      is as of 2026-07-28), `pack test` green is NOT evidence.

      THE FALSIFICATION PATH IS THEREFORE DIRECT SEMGREP, and it must dodge
      the two measurement traps ISSUE-092 records: a DIRECTORY scan skips
      files semgrep's targeting excludes, and an InvalidRuleSchemaError
      currently reads as ZERO FINDINGS (indistinguishable from "clean"). So
      scripts/falsify.sh runs semgrep with EXPLICIT FILE TARGETS, one
      (rule, fixture) pair at a time, and separately asserts the rule file
      parses without schema error.

  (5) SEMGREP'S STRUCTURAL YAML PATTERNS CANNOT EXPRESS THESE INVARIANTS;
      WHOLE-FILE REGEX CAN. Spiked against the real release.yml:
        • `$JOB: ... uses: goreleaser/goreleaser-action@$REF` — NO MATCH.
          `...` does not traverse from a mapping down into sequence items, so
          a job block cannot be correlated with a step nested inside it.
        • Composing several `pattern-regex` entries under `patterns:`
          INTERSECTS their ranges, collapsing the match to the narrowest one —
          so a `pattern-not-regex` written against the file never sees it.
        • THE IDIOM THAT WORKS: one whole-file anchor regex that ALSO carries
          the trigger condition, plus a whole-file `pattern-not-regex`:

            patterns:
              - pattern-regex: "(?s)^name:.*goreleaser/goreleaser-action.*$"
              - pattern-not-regex: "(?s)^name:.*needs:[^\\n]*\\[[^\\]\\n]+,[^\\]\\n]+\\].*$"

          Measured: 0 findings on core's shipped release.yml; 1 finding with
          `needs:` removed; 1 finding with `needs:` reduced to one job; 0
          findings on tag-integrity.yml (no goreleaser action → silent).
      The anchor doubling as the trigger is what makes these rules
      SELF-SCOPING — they need no `paths:` restriction and stay silent on
      unrelated YAML, which is why every claim carries a third "silence"
      fixture beyond the required positive/negative pair.
      `.gitignore` is reachable via `languages: [generic]` +
      `paths.include: [".gitignore", "*.gitignore"]` — spiked, fires
      correctly on both an explicit target and a directory scan.

  (6) SEMGREP VERSION SKEW — NAMED, NOT HIDDEN. The pack pins
      `provision: {tool: semgrep, version: 1.96.0}`, matching the trusted-tool
      allowlist (pkg/pack/engine/allowlist.go). The rules in this plan were
      falsified against semgrep 1.156.0, the binary on PATH. That is tolerable
      because provisionEngines resolves semgrep from PATH when one is present,
      so the falsification harness and the gate share a binary in practice.
      The residual is real and worth stating: a runner that genuinely holds
      1.96.0 would execute rules nobody falsified against 1.96.0. The regex
      idiom these rules use is stable surface, so the risk is low — but if a
      rule ever behaves differently under the gate than under
      scripts/falsify.sh, version skew is the first suspect, not the last.

  (7) SEQUENCING CONSTRAINT — `pack check` CANNOT RUN BEFORE THE RECIPE EXISTS.
      `archetype: recipes` makes packval phase 4 emit a `recipes-required`
      ERROR when the `recipes:` index is empty (pkg/packval/phase4.go:101-154),
      and the index cannot be populated before the recipe directory holds a
      real recipe.yml (pack.ParseManifestFile validates the index against the
      pack root, manifest.go:432-457). So the rules phase (2) CANNOT gate on
      `pack check` / `pack test`; those first become runnable in TASK-009,
      after the recipe lands. TASK-006 therefore gates on falsification alone
      and says so explicitly. This is a property of the archetype, not an
      oversight — do not "fix" it by weakening the archetype.

  ─────────────────────────────────────────────────────────────────────────
  THE DERIVED-ENV DECISION (ISSUE-101 requirement 5) — SCOPED DOWN, HONESTLY
  ─────────────────────────────────────────────────────────────────────────
  The general class — "every `{{ .Env.X }}` referenced in .goreleaser.yml has
  a matching env export in release.yml" — is a CROSS-FILE correlation.
  Semgrep is single-file; there is no join available at the pinned version,
  and the escalation ladder's next rung (a custom script engine) would mean
  building engine machinery for one rule. Per ISSUE-101's own instruction to
  keep this a pack and not a platform, it is NOT built here.

  What ships instead, all three parts required:
    (a) the enforceable single-file slice — a WARNING rule that a workflow
        running goreleaser-action exports HOMEBREW_TAP_TOKEN in that step's
        env. This is the specific instance that actually burned ISSUE-087
        (half-published release: binaries and the GitHub Release go out, the
        formula-publish step silently dies). WARNING not ERROR because a
        consumer who has not adopted Homebrew publication is un-adopted
        capability, not a broken promise — loud ≠ blocking.
    (b) a verbatim manual-verification note in the release.yml payload:
        before the first real tag, cross-read .goreleaser.yml's `{{ .Env.X }}`
        references against release.yml's exports by hand.
    (c) a filed follow-on issue (TASK-016) naming the script-engine
        escalation, so the residual is tracked rather than forgotten.

  ─────────────────────────────────────────────────────────────────────────
  SEVERITY LEDGER (SARIF `level`, declared per-rule in the semgrep rule file;
