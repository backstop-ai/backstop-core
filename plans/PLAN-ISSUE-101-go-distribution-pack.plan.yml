phases:
  # ═══════════════════════════════════════════════════════════════════════
  - id: phase-1
    name: "Phase 1: Pack repo scaffold and engine binding"
    tasks:
      - id: TASK-001
        type: setup
        title: "Create the go-distribution pack repo skeleton with its single provisioned engine binding"
        description: |
          Create the new repo at
          /Users/bmanson/src/projects/backstop-go-distribution-pack
          (`git init`, default branch `main`) and lay down the skeleton.

          pack.yml header — exactly these identity fields:
            name: backstop-ai/go-distribution
            version: "0.1.0"
            language: go
            archetype: recipes
            description: <one sentence naming the release trinity it ships>

          THE ENGINE BLOCK IS LOAD-BEARING AND NON-OBVIOUS (CLM-002).
          `recipe apply` calls provisionedEngineBinding UNCONDITIONALLY before
          Apply and requires the pack to declare EXACTLY ONE engine binding
          with a non-nil `provision:` (cmd/backstop/recipe_apply.go:231-243,
          :338-367) — a create-only recipe in a pack with zero such bindings
          fails with a config error before the recipe ever runs. Declare ONE,
          named `semgrep-godist` (NOT `semgrep`), mirroring the base-engines
          semgrep binding field-for-field (packs/base-engines/pack.yml:22-40):
            command: semgrep --sarif --quiet
            input_mode: rule-flags
            input_flag: "--config"
            scope_kind: file-args
            gate_type: lint
            category: opinion
            provision: {tool: semgrep, version: 1.96.0}
            field_contract: requires [rule_path, standard],
                            forbids [category, input_scope, validator]
          The distinct name is deliberate: pack bindings OVERRIDE the embedded
          base-engines defaults, and redefining `semgrep` would silently
          change engine resolution for every OTHER pack installed in a
          consumer project. Do not pin a version other than 1.96.0 without
          checking engine.TrustedToolAllowlist() — the trust gate runs at both
          parse and dispatch.

          .github/workflows/tag-integrity.yml — copy VERBATIM from
          /Users/bmanson/src/projects/backstop-go-pack/.github/workflows/tag-integrity.yml
          (byte-identical across the existing pack repos; asserts pack.yml
          parses, its version is strict semver, and on a tag push that the tag
          equals that version). This is the pack-repo convention, and it is a
          DIFFERENT workflow from the tag-integrity.yml the recipe ships to
          consumers — do not conflate them. (CLM-026)

          .gitignore — the pack repo carries NO go.mod, deliberately: payload
          .go files must stay inert data rather than being compiled as part of
          the pack module. Ignore only editor/OS noise.

          Do NOT author rules, fixtures, or recipes here; later tasks own
          those and will extend pack.yml.
        files:
          - /Users/bmanson/src/projects/backstop-go-distribution-pack/pack.yml
          - /Users/bmanson/src/projects/backstop-go-distribution-pack/.github/workflows/tag-integrity.yml
          - /Users/bmanson/src/projects/backstop-go-distribution-pack/.gitignore
        claims:
          - CLM-001
          - CLM-002
          - CLM-026
        depends_on: []

