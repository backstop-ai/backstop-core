  - id: phase-5
    name: "Phase 5: Consumption proof leg (b) — stash adopts the recipe"
    tasks:
      - id: TASK-011
        type: test
        title: "Extend verify-recipe-apply.sh to accept an already-applied consumer project, with an expected-warning allowlist"
        description: |
          RED PHASE for the stash leg: the assertions exist and fail before
          anything is applied into stash.

          Do NOT write a stash-specific proof script. A committed script
          hardcoding /Users/bmanson/src/projects/stash would put a
          machine-specific path and a reference to a private repo into an OSS
          pack. Instead, GENERALIZE the harness TASK-007 already built:

            scripts/verify-recipe-apply.sh --project <path>
                                           [--expect-warning <rule-id>]...

          With `--project`, the harness skips the scratch-project creation and
          the apply, and runs its acceptance set against an ALREADY-APPLIED
          consumer at that path: the five files exist; `go test ./...` passes;
          `actionlint` over both workflows reports ZERO findings;
          `goreleaser release --snapshot --clean` produces four platform
          binaries; `.gitignore` contains `dist/`; and the pack's rules report
          ZERO ERRORS.

          `--expect-warning` is the part that matters and it must be exact-set,
          not a floor. The harness fails if a warning fires that was not
          declared, AND if a declared warning does not fire. Counting zero
          errors is not enough: an unexpected warning is drift, and a
          disappearing expected warning means a rule stopped firing — which
          would otherwise read as "things got better".

          Every path the harness touches comes from `--project`; no consumer
          name, org, or absolute path may be baked into the script. That keeps
          it publishable and makes it reusable by any consumer adopting the
          pack, which is the point.

          NO stash release, tag, or tap is asserted or attempted: stash's
          publication coordinates are an open founder question.
