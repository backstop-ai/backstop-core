          CLM-007 IS A REVIEW GATE ON THIS TASK: grep the finished rule files
          for `backstop`, `backstop-ai`, `homebrew-tap`, `tag-integrity`,
          `require-green-ci`, and `main.version`. Any hit that is not inside a
          comment is a consumer literal and must be generalized.
