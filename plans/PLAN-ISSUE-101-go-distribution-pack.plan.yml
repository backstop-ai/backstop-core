  # ═══════════════════════════════════════════════════════════════════════
  - id: phase-4
    name: "Phase 4: Consumption proof leg (a) — backstop-core in a detached worktree"
    tasks:
      - id: TASK-010
        type: verification
        title: "Prove the rules go GREEN on core's shipped trinity and RED on a mutation, in a discarded worktree"
        description: |
          THE PACK'S CENTRAL PROOF. backstop-core IS the reference
          implementation, so the rules must accept its hand-written trinity
          without a single finding — that is what demonstrates they assert
          invariants rather than backstop-core's literals (CLM-007, CLM-023).

          THE LIVE CHECKOUT IS NEVER MUTATED. This is a PROCEDURE, not a
          committed script: it hardcodes a machine-specific path into a repo
          that is about to be published, so it stays in the operator's hands.
          Steps:
            1. `git -C /Users/bmanson/src/projects/backstop-core worktree add`
               a detached worktree at a temp path off the current HEAD;
            2. in the worktree, `backstop pack add <local pack path>` and
               confirm the lock records source_type `local`;
            3. GREEN HALF — run semgrep DIRECTLY, exactly as
               scripts/falsify.sh does, with the three shipped files as
               EXPLICIT targets:
                 semgrep --metrics=off --quiet --json \
                   --config <pack>/rules/workflow/release-workflow.yml \
                   <worktree>/.github/workflows/release.yml
               and likewise for tag-integrity.yml, and for
               rules/goreleaser/goreleaser-config.yml against
               <worktree>/.goreleaser.yml, and rules/workspace/gitignore.yml
               against <worktree>/.gitignore. Require ZERO findings of any
               severity across all nine rules (CLM-023).
               DO NOT USE THE GATE FOR THIS HALF, and the reason is specific,
               not stylistic. A diff-scoped `backstop gate` on an UNMUTATED
               worktree has an empty scope and would report green having
               examined nothing — a vacuous pass, which is the exact failure
               class this repo exists to prevent. And `backstop gate --file`
               over the workflow files hits ISSUE-093, which is OPEN: `--file`
               falsely REDs non-Go files whose directory holds no Go package,
               and a repeated `--file` is silently dropped. Direct semgrep
               sidesteps both and carries TASK-006's rigor.
            4. confirm the already-installed go-standards and go-toolchain
               packs STILL DISPATCH in that worktree — run `backstop gate
               --all` and check their rules appear in the report. This step is
               about ENGINE RESOLUTION, not about the go-distribution verdict
               (step 3 owns that): the pack's binding is named `semgrep-godist`
               rather than `semgrep` precisely so it does not override the
               base-engines binding those packs resolve, and if their rules
               stop running, that binding name is the first suspect (CLM-023);
            5. MUTATION A — delete the goreleaser job's
               `needs: [tag-integrity, require-green-ci]` line from the
               worktree's release.yml and re-run the step-3 semgrep invocation
               for that file; require >= 1 finding of
               `release-workflow-goreleaser-job-ungated` at error severity
               (CLM-024);
            6. MUTATION B — drop `arm64` from the worktree's .goreleaser.yml
               goarch list and re-run the step-3 invocation for that file;
               require >= 1 finding of
               `goreleaser-config-platform-matrix-incomplete` (CLM-024);
            7. `git worktree remove --force` and confirm the live checkout's
               `git status` is unchanged from before the run.
          Step 7 is not optional cleanup — a leftover worktree with a mutated
          release.yml is a live-repo hazard.

          Runs in PARALLEL with phase 5; file sets are disjoint. The files
          listed below are READ-ONLY proof targets in backstop-core: this task
          writes nothing, in either repo.
        files:
          - /Users/bmanson/src/projects/backstop-core/.goreleaser.yml
          - /Users/bmanson/src/projects/backstop-core/.github/workflows/release.yml
          - /Users/bmanson/src/projects/backstop-core/.github/workflows/tag-integrity.yml
        claims:
