      JSON schema change together in ONE task (strict KnownFields(true) decode + schema
      additionalProperties:false). Tests prove existing configs still decode/validate and
      that a config setting the new fields round-trips through the strict decode.
    tasks:
      - id: TASK-100
        type: test
        title: "Test additive gate_type/waived decode + schema validation"
        description: |
          Table-driven tests in pkg/config that a backstop.yml setting enforcement.toolchain
          gate_type and waived decodes under KnownFields(true) AND passes embedded-schema
          validation, AND that a config OMITTING both still decodes and validates (zero-value
          backward compatibility). These tests exercise the DECLARED join inputs consumed by
          the classifier (CLM-001 substantiveness-declared, CLM-002 coverage-undeclared).
        files:
          - pkg/config/toolchain_pass_test.go
        claims:
          - CLM-001
          - CLM-002
        depends_on:
          - TASK-001
      - id: TASK-101
        type: implementation
        title: "Add gate_type + waived to ToolchainPass struct AND embedded schema"
        description: |
          Add `GateType string yaml:"gate_type,omitempty"` and `Waived bool
          yaml:"waived,omitempty"` to the ToolchainPass struct (pkg/config/config.go:44)
          AND the matching optional properties to the toolchain object in the embedded
          schema (artifacts/backstop-yml/v1/schema.json) — in this single task, because the
          strict decode + additionalProperties:false require struct and schema to change in
          lockstep (Sharp Edge 4). Both fields optional, default zero value. Makes the
          tests in TASK-100 pass.
        files:
          - pkg/config/config.go
          - artifacts/backstop-yml/v1/schema.json
        claims:
          - CLM-001
          - CLM-002
        depends_on:
          - TASK-100
      - id: TASK-102
        type: verification
        title: "Verify declaration-surface change (code check)"
        description: |
          Run `backstop code check` over the diff scope to confirm the additive config
          fields and schema change build, lint clean, and the pkg/config decode/validation
          tests pass. Confirms the strict-decode lockstep holds before the classifier builds
          on these fields.
        files:
          - pkg/config/config.go
          - artifacts/backstop-yml/v1/schema.json
          - pkg/config/toolchain_pass_test.go
        claims:
          - CLM-001
          - CLM-002
        depends_on:
