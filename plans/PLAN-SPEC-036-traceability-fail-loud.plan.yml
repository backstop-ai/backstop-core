notes: |
  Implements SPEC-036 (BUNDLE-009 Seed 1 — fail-loud polarity for the three
  traceability dimensions: substantiveness / coverage / contracts). Ships ENTIRELY
  on the existing binary: NO analyzer touched, NO engine, NO pack. The work is a
  language-agnostic classification + report-surface layer that sits IN FRONT OF the
  three existing traceability step builders and assigns each dimension to exactly one
  of three classes (1 BROKEN-DECLARED → block exit 2; 2 CAPABILITY-ABSENT → warn-pass
  exit 0; 3 DECLARED-INTENT-UNMET → block exit 2), with a waive that silences ONLY
  class 2.

  ===================================================================
  REQ-008 IS A HARD FENCE (Sharp Edge 6) — DO NOT CROSS
  ===================================================================
  The traceability ANALYZERS — pkg/gate/step_testverify.go, pkg/gate/step_contract.go,
  pkg/gate/step_coverage.go — MUST remain BYTE-FOR-BYTE unchanged by this plan. NO task
  in this plan lists any of those three files in its `files` scope. The classification
  layer WRAPS them at the cmd/backstop/gate.go wiring boundary; it never edits their
  go/parser / go/ast verdict logic. Their existing passing tests are PRESERVED as the
  REQ-008 evidence (CLM-025/026/027). Any temptation to "improve" the Go analyzer while
  wiring the wrapper is out of scope and conflicts with the Seed 3/4 eradication.

  ===================================================================
  LOCKSTEP CONFIG CHANGE (Sharp Edge 4) — ONE ATOMIC TASK
  ===================================================================
  pkg/config/config.go decodes backstop.yml with KnownFields(true) (config.go:145) AND
  validates against the EMBEDDED backstop-yml JSON schema (artifacts/backstop-yml/v1/
  schema.json, additionalProperties:false on the toolchain object). The two NEW additive
  fields `gate_type` and `waived` MUST be added to the ToolchainPass struct AND the
  embedded schema's toolchain property block in the SAME task (TASK-101) — if they
  diverge, either a backstop.yml that omits them stays valid while one that sets them
  fails schema validation, or the strict-unknown-fields decode breaks. Both are optional,
  default to zero value, so existing configs remain valid.

  ===================================================================
  THE "declared?" BOOLEAN IS THE WHOLE DISCRIMINATOR (Sharp Edge 2)
  ===================================================================
  Classes 1, 2, 3 all involve a missing/broken capability; the ONLY thing that flips
  class 2 (warn-pass) into class 3 (block) is whether the project DECLARED the dimension
  via an enforcement.toolchain entry whose gate_type EXACTLY equals the dimension name.
  The join MUST be exact: a typo'd / unknown toolchain key on a declared entry is class 1
  (BROKEN-DECLARED, blocks), NOT a silent fall-through to class 2 (CLM-008). A loose join
  that reads a malformed key as "undeclared" silently degrades a broken promise into a
  vacuous green. The waive suppression keys off the SAME exact join (CLM-022), so a waive
  can only ever target a real declared dimension and can never reach a class-1/class-3
  result (CLM-023/024).

  ===================================================================
  WIRING IS VERIFIED, NOT ASSUMED (Sharp Edge — v1.1.0 corrective; CLM-028)
  ===================================================================
  The classifier-in-front-of-the-analyzer wiring lives in cmd/backstop/gate.go
  (buildGateSteps wrapping buildTestSubstantivenessStep:453 / buildCoverageStep:475 /
  buildContractStep:496), OUTSIDE the pkg/gate unit scope — which is exactly why the
  test_command adds ./cmd/backstop/. CLM-025/026/027 only assert the analyzer VERDICT is
  preserved — an UNWIRED classifier satisfies those too. TASK-602's test (CLM-028) MUST
  put a SENTINEL/SPY on the analyzer delegate and mechanically prove: for class 1/2/3 the
  wrapper returns PolarityStepResult and the analyzer is NOT reached (spy not invoked);
  for declared-and-working the wrapper falls through unchanged and the analyzer IS reached
  (spy invoked). An unwired classifier (analyzer always reached) MUST fail that test.

  ===================================================================
  CapabilityState DERIVATION IS CONCRETE, NOT STUBBED (CLM-029)
  ===================================================================
  TASK-501 derives CapabilityState from cfg.Language (config.go:22) + baked-Go-analyzer
  presence ONLY — no pack, no engine. The only traceability capability on the existing
  binary is the baked Go analyzers (Go-specific), so a dimension is Present/Working only
  when cfg.Language == "go" AND its baked analyzer exists (and isn't broken); it is Absent
  when cfg.Language != "go". An UNDECLARED dimension on a non-Go project (language:
  typescript, the runtime-unblock case) therefore lands in class 2 (warn, exit 0), NOT a
  silent pass and NOT a mis-applied Go analyzer. CLM-029's test asserts the typescript
  derivation directly so it cannot be stubbed.

  ===================================================================
  warning IS A NEW NON-FAILING STEP STATUS (Sharp Edge 3)
  ===================================================================
  NewGateResultWithScope (result.go:93) currently sets Pass=false only on "fail". The new
  "warning" status MUST be counted into a NEW GateResult.StepsWarned counter (TASK-401)
  but MUST NOT flip Pass. If "warning" were treated like "fail", class 2 would block — the
  exact outcome the bundle prohibits. If it were silently dropped (no StepsWarned
  increment), the advisory would vanish from the summary counts a reviewer reads on a green
  run. FormatHuman's summary line (output.go:102) MUST render the warned count alongside
  passed/failed/skipped (CLM-030) AND formatStatus (output.go:126) MUST render a distinct
  warning marker per step (CLM-015); FormatJSON serializes Status + Violations[].Severity
  already, so the warning-tagged entry is machine-readable via the new status string +
  StepsWarned counter (CLM-016).

phases:
