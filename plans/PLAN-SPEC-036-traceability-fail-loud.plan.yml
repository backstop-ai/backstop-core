          contract verdict preserved (CLM-026), coverage verdict preserved (CLM-027) — the
          analyzer files themselves are NOT edited.
        files:
          - cmd/backstop/gate_wiring_test.go
        claims:
          - CLM-025
          - CLM-026
          - CLM-027
          - CLM-028
        depends_on:
