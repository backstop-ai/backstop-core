      UNCHANGED analyzer only when declared-and-working. The analyzer files are NOT in scope
      (REQ-008). CLM-028 spies the analyzer delegate so an unwired classifier fails. CLM-025/
      026/027 preserve the analyzers' existing verdicts.
    tasks:
      - id: TASK-500
        type: test
        title: "Test CapabilityState derivation (go present / typescript absent → class 2)"
        description: |
