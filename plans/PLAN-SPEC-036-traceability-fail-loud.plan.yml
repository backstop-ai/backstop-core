          - TASK-102
      - id: TASK-201
        type: implementation
        title: "Implement dimension constants, PolarityClass, CapabilityState, ClassifyDimension"
        description: |
          New file pkg/gate/traceability_polarity.go: TraceabilityDimension type +
          DimensionSubstantiveness/Coverage/Contracts constants; PolarityClass int enum;
          CapabilityState{Present,Working,PackOrCommand,Detail} type; an exact declaredDimension
          helper joining cfg.Enforcement.Toolchain entries' gate_type against a dimension; and
          ClassifyDimension(cfg, dim, cap) implementing the decision table. No language- or
          tool-specific branch — joins declaration surface against the supplied CapabilityState.
          Makes TASK-200 pass.
        files:
          - pkg/gate/traceability_polarity.go
        claims:
          - CLM-003
          - CLM-004
          - CLM-005
          - CLM-006
          - CLM-007
          - CLM-008
          - CLM-010
          - CLM-013
        depends_on:
