        description: |
          Table-driven tests for ClassifyDimension covering the full allowlist:
          declared+present+clean → none/proceed (CLM-003); declared+present+broken-cmd,
          unparseable-output, unknown-key → class 1 (CLM-006/007/008); declared+missing →
          class 3 (CLM-013); undeclared+absent → class 2 (CLM-010 verdict input); undeclared+
          present → none/proceed. Plus: exactly one class per dimension, never two (CLM-004);
          language-agnostic — same undeclared input yields class 2 for go and typescript
          alike (CLM-005); and the EXACT join — a typo'd/unknown declared key is class 1, not
          a silent class-2 fall-through (CLM-008, Sharp Edge 2).
        files:
          - pkg/gate/traceability_polarity_classify_test.go
        claims:
