  # ═══════════════════════════════════════════════════════════════════════
  # Phase 6: Wiring — capability derivation + intercept-vs-fall-through
  # ═══════════════════════════════════════════════════════════════════════
  - id: phase-6
    name: "Phase 6: Gate Wiring (CapabilityState derivation + classifier in front of analyzers)"
    description: |
      Wire the classifier into cmd/backstop/gate.go's buildGateSteps so it runs IN FRONT OF
      the three traceability analyzers: derive CapabilityState from cfg.Language +
      baked-analyzer presence (no pack/engine), call ClassifyDimension, and for class 1/2/3
