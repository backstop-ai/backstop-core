  # ═══════════════════════════════════════════════════════════════════════
  # Phase 3: Classifier — ClassifyDimension over the three-class decision table
  # ═══════════════════════════════════════════════════════════════════════
  - id: phase-3
    name: "Phase 3: Language-Agnostic Classifier (ClassifyDimension)"
    description: |
      Implement the dimension/constants/PolarityClass enum, the CapabilityState type, the
      exact declaredDimension join, and ClassifyDimension over the complete three-class
