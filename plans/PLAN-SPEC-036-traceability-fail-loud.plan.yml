          buildGateSteps wraps the three traceability builders correctly: for class 1/2/3 the
          wrapper returns PolarityStepResult and the analyzer is NOT reached (spy not
          invoked); for declared-and-working the wrapper falls through unchanged and the
          analyzer IS reached (spy invoked) (CLM-028). An UNWIRED classifier (analyzer always
