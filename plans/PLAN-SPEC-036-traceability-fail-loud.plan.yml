    name: "Phase 1: Test Fixtures and Scaffolding"
    description: |
      Create the shared backstop.yml fixtures the TDD phases consume: declared /
      undeclared / waived toolchain entries, a typo'd (unknown) toolchain key, and
      Go vs TypeScript language fixtures so the classifier and the CapabilityState
      derivation can be table-driven without live tools. No production code here.
    tasks:
      - id: TASK-001
        type: setup
        title: "Scaffold polarity test fixtures (per-class, per-stack backstop.yml)"
        description: |
          Create backstop.yml fixtures under pkg/gate/testdata/polarity/ covering every
          classification input combination the TDD phases assert against:
            - substantiveness DECLARED via enforcement.toolchain gate_type (CLM-001)
            - no toolchain entry for coverage → coverage UNDECLARED (CLM-002)
            - declared-and-working (CLM-003), declared with unknown toolchain key (CLM-008)
            - waived dimension (CLM-022), language:go and language:typescript variants
              for the CapabilityState derivation (CLM-005, CLM-029).
          These fixtures are inert YAML/data only; they back the classifier, message,
          waive, and capability-derivation tests in Phases 2-6.
        files:
          - pkg/gate/testdata/polarity/declared-substantiveness.yml
          - pkg/gate/testdata/polarity/undeclared-coverage.yml
          - pkg/gate/testdata/polarity/declared-working.yml
          - pkg/gate/testdata/polarity/declared-unknown-key.yml
          - pkg/gate/testdata/polarity/waived-dimension.yml
          - pkg/gate/testdata/polarity/typescript-project.yml
        claims:
          - CLM-001
          - CLM-002
          - CLM-003
          - CLM-005
          - CLM-008
          - CLM-022
          - CLM-029
        depends_on: []

  # ═══════════════════════════════════════════════════════════════════════
