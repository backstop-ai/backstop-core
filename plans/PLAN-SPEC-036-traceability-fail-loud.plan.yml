      in formatStatus (FormatJSON carries it via Status/Severity automatically). This is the
      pure result/output surface; it is independent of the classifier file (disjoint files
      → parallel-eligible with Phase 3).
    tasks:
      - id: TASK-300
        type: test
        title: "Test warning is non-failing, counted, and rendered conspicuously"
