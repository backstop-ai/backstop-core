          contribution); that FormatHuman renders a distinct warning marker per step
          (CLM-015) AND the warned count in the summary line alongside passed/failed/skipped
          (CLM-030); that FormatJSON emits the warning-tagged entry (status + severity) and
          StepsWarned, distinguishable from a plain pass (CLM-016); and that a passing gate
          carrying warnings still surfaces them in both human and JSON output (CLM-017).
        files:
