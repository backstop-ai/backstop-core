      carries expected-vs-got). Builds on the classifier (Phase 3) and the warning result
      surface (Phase 4).
    tasks:
      - id: TASK-400
        type: test
        title: "Test class→StepResult exits, fail-loud messages, and waive scoping"
        description: |
