  THE DECISION, AND IT IS RECORDED RATHER THAN ASSUMED: the advisory SHIPS
  NON-BLOCKING (a `ValidationWarning`, never a `ValidationError`). Rationale,
  stated so a future reader can overturn it on evidence rather than taste:
    1. As an ERROR it would immediately fail `pack check` / `pack test` — and
       therefore `pack add` and `pack install`, which run the same pipeline —
       for two packs THIS REPO CURRENTLY HAS INSTALLED. That is a corpus-wide
       new rule redding everything at once, with no `applies-to: new-code`
       baseline relief available in packval.
    2. For several of the 40 there is NO lossless rewrite. `pkg/gate/*.go` has
       no slash-free equivalent that preserves directory scoping — the only
       slash-free spelling is `*.go`, which is the whole repo. So an ERROR
       would demand a fix that does not exist, and the pack author's real
       choice is between a WIDER blast radius and losing the scope. That is a
       pack-authoring judgment call, not something a validator gets to force.
    3. It matches the `exempt-scope-decision` precedent already in phase 2:
       warn-with-guidance, name the exact remedy, let the author decide.
  This follows "Loud ≠ blocking". Escalating to ERROR once the ecosystem is
  remediated is a FOUNDER call and is explicitly NOT taken here.

