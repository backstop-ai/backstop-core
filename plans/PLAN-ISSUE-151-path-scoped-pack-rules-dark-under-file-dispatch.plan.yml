    exclude: "cmd/backstop/pack_gate_provision.go"  dir target -> 1 (excluded)
                                                    file target -> 2 (NOT excluded)
    exclude: "pack_gate_provision.go"               dir target -> 1
                                                    file target -> 1  (honored)

  So an inert `include` is a SILENT NO-OP (vacuous green, the class ISSUE-151
  names) and an inert `exclude` FAILS OPEN — the rule fires on files the pack
  explicitly meant to exempt, i.e. a false RED the pack author believes they
  already suppressed. Both directions are the same root defect and both must be
  reported, with the DIRECTION named, or half the harm stays invisible.

  ── CORRECTION 3 (DECIDES THE PHASE): PHASE 3 CANNOT CATCH THIS ────────────
  The obvious cheaper fix — "let packval phase 3 catch it by executing
  fixtures" — was tested and REFUTED. Phase 3 already dispatches fixtures the
  gate's way: `executor.RunEngine(packDir, binding, []string{ruleSource, f.Path})`
  hands an EXPLICIT FILE path (`pkg/packval/phase3.go`). So a rule with only
  slash-bearing includes would indeed fail its own negative fixture. But the
  real pack does not have only slash-bearing includes. Its include list is
  BIFURCATED, and the pack's own comment calls the extra entries "the fixture
  hooks":

    7 slash-bearing patterns  — the INTENDED live scope (all inert)
    2 slash-free patterns     — `*structural-name-split*.go`,
                                `*structured-property-read*.go`, which match
                                ONLY the rule's own fixture basenames

  Measured, and this is the load-bearing receipt for choosing phase 2:

    real rule file vs its negative fixture, explicit file        -> 2 findings
    SAME rule with the 2 slash-free fixture hooks REMOVED        -> 0 findings

  The fixture hooks are load-bearing. They keep phase 3 GREEN while all seven
  live-scope patterns are dark. Execution-based validation therefore CANNOT see
  this defect — the fixture is the one file the rule can still match. It needs a
  DECLARATION-SHAPE check, and that check must run in `pack check` mode too
  (which skips phase 3 entirely, `pkg/packval/pipeline.go`). PHASE 2 IS THE
  ONLY CORRECT HOME. This is the same argument phase 2's existing
  `exempt-scope-decision` comment already makes for itself.

