             LEAVE `ciOrgRepoLiterals` ALONE. It contains its own
             `strings.Contains(token, "/")`, and it is NOT a second statement
             of this contract: it parses an `org/repo` release coordinate, and
             a slash there means "this token has two segments", not "this path
             pattern is inert under file dispatch". Routing it through
             `PathPatternInertUnderFileDispatch` would be a semantic error that
             happens to compile. It stays exactly as it is.

          Locate the call site BY FUNCTION NAME, never by line number — this
