  CLM-001  `pkg/packval` exports ONE predicate,
           `packval.PathPatternInertUnderFileDispatch(pattern string) bool`,
           answering "is this path pattern inert under the gate's explicit-file
           dispatch", deciding on the presence of a `/` in the pattern and on
