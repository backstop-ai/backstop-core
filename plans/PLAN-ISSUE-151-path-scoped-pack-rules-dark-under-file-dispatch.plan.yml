phases:
  # ═══════════════════════════════════════════════════════════════════════
  - id: phase-1
    name: "Phase 1: Falsification corpus"
    tasks:
      - id: TASK-001
        type: setup
        title: "Dispatch-advisory corpus: every path-scope state except the mask"
        description: |
          Create MINIMAL fixture packs under `pkg/packval/testdata/path-scope/`.
          They exist to drive `RunCoherence` directly in unit tests, so they need
          only the fields the checks read.

          READ THIS BEFORE COPYING A PRECEDENT. The nearest-looking precedent,
          `pkg/packval/testdata/exempt-decision/`, is MANIFEST-ONLY — and that
          is correct for IT, because `ExemptDecisionPending` reads `pack.yml`
          and nothing else. It is the WRONG model here. This check resolves each
          rule's source through `RuleSourcePath()` and READS THAT FILE OFF DISK
          for its `paths:` block. A manifest-only corpus would yield zero
          patterns, and every phase-2 test in this plan would go VACUOUSLY
          GREEN. Every pack below therefore ships its rule file too, and every
          such file is enumerated in `files:`.

          SHAPE COMMON TO ALL FIVE PACKS IN THIS TASK. Each declares one engine
          in `engines:` with `input_mode: rule-flags` (except `non-ruleflags/`),
          and one rule that names that engine via `engine:` and its rule file
          via `rule_path:`. Every rule here carries a RESOLVING engine and NO
          `claims:` — which is a deliberate use of phase 2's own claimless-with-
          resolving-engine exemption (`phase2.go`, the `engine-resolve` branch),
          and is what lets these five packs ship no fixture files at all without
          tripping `fixtures-positive`/`fixtures-negative` (SE-12). Do not add a
          `fixtures/` directory to any of them.

          SE-4 IS TESTABLE ONLY IF THE IDS DIFFER. Give every pack a manifest
          rule id and a DIFFERENT semgrep rule id inside the rule file (e.g.
          manifest `inert-include-rule`, semgrep `sg-inert-include`). An
          implementation that reports the manifest id must fail.

            inert-include/
              rule file declares `paths: {include: ["cmd/app/handler*.go"]}`.
              The CLM-002 positive.

            inert-exclude/
              same shape but `paths: {exclude: ["cmd/app/handler.go"]}`. Drives
              CLM-003's direction wording. Its rule carries NO include at all,
              so a check that only ever looks at `include` fails here.

            slash-free-only/
              `paths: {include: ["handler*.go"], exclude: ["*_test.go"]}`. The
              CLM-004 SILENT case. This is the fixture that makes the check
              falsifiable: an implementation that reports every pattern passes
              every other test and fails only this one.

            semgrep-suggested-spellings/
              THREE patterns in one include list — `**/cmd/app/handler*.go`,
              `/cmd/app/handler*.go`, and `*/*/handler*.go`. All THREE must be
              reported. This is SE-1's guard: it is the fixture that stops an
              implementer from "fixing" the predicate to bless semgrep's own
              recommended spellings, which were measured dark.

            non-ruleflags/
              a pack whose engine declares an InputMode OTHER than rule-flags
              (`config-file`), whose rule points `rule_path` at
              `config/tool-config.yml`, and where THAT FILE carries an
              inert-looking `paths.include`. CLM-007's falsifier: an
              implementation that reads the source file unconditionally reports
              it and fails; a correctly InputMode-gated one is silent.

          Do not modify any existing fixture pack, and do not build the other
          three tasks' packs here — the CLM-006 mask corpus is TASK-012's,
          CLM-009's shared-rule-file pack is TASK-013's, and CLM-010's
          attribution/quantifier packs are TASK-014's. All four setup tasks
          write disjoint directories under `testdata/path-scope/` and run in
          parallel (D-081).
        files:
          - pkg/packval/testdata/path-scope/inert-include/pack.yml
          - pkg/packval/testdata/path-scope/inert-include/rules/inert-include.yml
          - pkg/packval/testdata/path-scope/inert-exclude/pack.yml
          - pkg/packval/testdata/path-scope/inert-exclude/rules/inert-exclude.yml
          - pkg/packval/testdata/path-scope/slash-free-only/pack.yml
          - pkg/packval/testdata/path-scope/slash-free-only/rules/slash-free-only.yml
          - pkg/packval/testdata/path-scope/semgrep-suggested-spellings/pack.yml
          - pkg/packval/testdata/path-scope/semgrep-suggested-spellings/rules/suggested-spellings.yml
          - pkg/packval/testdata/path-scope/non-ruleflags/pack.yml
          - pkg/packval/testdata/path-scope/non-ruleflags/config/tool-config.yml
        claims:
          - CLM-002
          - CLM-003
          - CLM-004
          - CLM-007
        depends_on: []

      - id: TASK-012
        type: setup
        title: "Fixture-mask corpus, including the cross-contamination pack"
        description: |
          The CLM-006 half of the corpus, carved out of TASK-001 so neither
          setup task carries an unreviewable file scope. Disjoint directories
          from TASK-001, so the two run in parallel (D-081).

          SAME ENGINE REQUIREMENT AS TASK-001, AND IT IS NOT OPTIONAL. Each
          pack here declares one engine in `engines:` with
          `input_mode: rule-flags`, and each rule names it via `engine:`.
          CLM-007 gates the whole scan on the RESOLVED binding's InputMode, so
          a pack without a resolving rule-flags engine is skipped silently —
          every TASK-005 test would stay permanently red, and the implementer
          could not fix it because these files are outside TASK-006's declared
          scope.

          UNLIKE TASK-001'S PACKS, THESE DECLARE CLAIMS — the mask check is
          about declared fixtures, so it cannot use the claimless exemption.
          That makes SE-12 binding: every claim needs BOTH a positive and a
          negative fixture, and every one of those files must EXIST and be
          NON-EMPTY on disk, or phase 2 raises `fixtures-positive` /
          `fixtures-negative` / `fixture-exists` / `fixture-empty`
          `ValidationError`s and CLM-005's "Errors is empty" assertion fails on
          this plan's own corpus. Two-line Go stubs are enough content; what
          matters is that they are non-empty and that every file under
          `fixtures/` is referenced by some claim (an unreferenced one draws an
          `orphan-fixture` warning). Same SE-4 discipline as TASK-001: manifest
          rule ids and semgrep rule ids must DIFFER.

            fixture-masked/
              the CLM-006 positive, built to mirror the real backstop-self rule
              `no-structural-name-split-on-spine` IN ITS ACTUAL SHAPE — which
              means TWO DISJOINTLY-MATCHING slash-free hooks, not one shared
              one. Re-read on disk 2026-08-17 at
              `.backstop/packs/backstop-ai/backstop-self/rules/no-baked.yml`:
              that rule's include list ends with `*structural-name-split*.go`
              and `*structured-property-read*.go`, and each of its two fixtures
              is matched by EXACTLY ONE of them — neither hook matches both.

              Reproduce that here. One semgrep rule whose include list is
                `["pkg/svc/*.go", "*masked-alpha*.go", "*masked-beta*.go"]`
              where `pkg/svc/*.go` is the inert intended live scope, and one
              claim declaring
                positive: `fixtures/masked-alpha-positive.go` — matched by
                  `*masked-alpha*.go` and by NOTHING else
                negative: `fixtures/masked-beta-negative.go`  — matched by
                  `*masked-beta*.go` and by NOTHING else
              Every declared fixture is matched by some hook, so the mask FIRES.

              THE TWO DISJOINT HOOKS ARE LOAD-BEARING, NOT DECORATION. THEY ARE
              THE ONLY THING IN THE WHOLE CORPUS THAT MAKES CLM-010'S
              PER-FIXTURE QUANTIFIER OBSERVABLE — DO NOT "SIMPLIFY" THEM BACK TO
              A SINGLE SHARED `*masked-probe*.go`. Round 3 specified exactly
              that single-hook shape and it was a defect: with at most one
              slash-free pattern per semgrep rule anywhere in the corpus, the
              per-fixture ANY reading and the per-fixture ALL reading return
              IDENTICAL results on every pack, so an ALL-patterns implementation
              would pass the entire mask suite and then silently fail to flag
              the real flagship rule — the exact case ISSUE-151 exists to catch.
              With two disjoint hooks, an ALL-patterns implementation sees
              `masked-alpha-positive.go` as unmatched by `*masked-beta*.go`,
              declines to raise the mask, and fails
              `TestPathScope_FixtureMaskAdvisoryFires`.

              Put that reasoning in a comment at the top of
              `rules/masked.yml` naming the real rule it mirrors, so the next
              reader who reaches for the shorter spelling sees why it is wrong.
              TASK-005 additionally pins the shape with a structural assertion,
              so a silent collapse fails a test rather than only losing power.

            multiseg-no-mask/
              SE-7's counterfactual, and the reason CLM-006 is not vacuous: the
              SAME shape with the slash-free hook REMOVED. Include list is
              `["pkg/svc/*.go"]` alone; the claim's fixtures
              (`fixtures/unmatched-positive.go`,
              `fixtures/unmatched-negative.go`) are matched by NOTHING in it.
              `path-scope-dispatch` fires here; `path-scope-fixture-mask` must
              NOT. An implementation that raises the mask whenever an inert
              pattern exists passes `fixture-masked` and fails here.

            two-rule-cross-contamination/
              SE-11's falsifier. TWO manifest rules, each with its own rule file
              and its own claim, modelling the real copy-pasted-fixture-hook
              shape:
                probe-a — rule file include `["pkg/svc/*.go", "*a-probe*.go"]`;
                  claim fixtures `fixtures/a-probe-positive.go` and
                  `fixtures/a-probe-negative.go`. Mask FIRES for probe-a: its
                  own fixtures are covered only by its own slash-free pattern.
                probe-b — rule file include `["pkg/other/*.go", "*a-probe*.go"]`
                  (the hook copy-pasted from a, which is exactly what a
                  multi-rule pack author does); claim fixtures
                  `fixtures/b-other-positive.go` and
                  `fixtures/b-other-negative.go`, matched by NEITHER of b's
                  patterns. Mask must NOT fire for probe-b.
              An implementation reading `phase2.go`'s PACK-WIDE
              `referencedFixtures` map instead of each rule's own
              `claims[].fixtures` sees probe-b's `*a-probe*.go` match probe-a's
              fixture and raises a FALSE mask on probe-b. This pack is the only
              thing in the corpus that catches that — every other pack declares
              exactly one rule.
        files:
          - pkg/packval/testdata/path-scope/fixture-masked/pack.yml
          - pkg/packval/testdata/path-scope/fixture-masked/rules/masked.yml
          - pkg/packval/testdata/path-scope/fixture-masked/fixtures/masked-alpha-positive.go
          - pkg/packval/testdata/path-scope/fixture-masked/fixtures/masked-beta-negative.go
          - pkg/packval/testdata/path-scope/multiseg-no-mask/pack.yml
          - pkg/packval/testdata/path-scope/multiseg-no-mask/rules/unmasked.yml
          - pkg/packval/testdata/path-scope/multiseg-no-mask/fixtures/unmatched-positive.go
          - pkg/packval/testdata/path-scope/multiseg-no-mask/fixtures/unmatched-negative.go
          - pkg/packval/testdata/path-scope/two-rule-cross-contamination/pack.yml
          - pkg/packval/testdata/path-scope/two-rule-cross-contamination/rules/probe-a.yml
          - pkg/packval/testdata/path-scope/two-rule-cross-contamination/rules/probe-b.yml
          - pkg/packval/testdata/path-scope/two-rule-cross-contamination/fixtures/a-probe-positive.go
          - pkg/packval/testdata/path-scope/two-rule-cross-contamination/fixtures/a-probe-negative.go
          - pkg/packval/testdata/path-scope/two-rule-cross-contamination/fixtures/b-other-positive.go
          - pkg/packval/testdata/path-scope/two-rule-cross-contamination/fixtures/b-other-negative.go
        claims:
          - CLM-005
          - CLM-006
        depends_on: []

      - id: TASK-013
        type: setup
        title: "Shared-rule-file corpus: the N manifest rules to 1 file fan-out"
        description: |
          CLM-009's only falsifier, and the shape the REAL packs actually have
          (SE-14). Disjoint directory from every other setup task, so it runs
          in parallel with them (D-081).

            shared-rule-file/
              THREE manifest rules — `alpha-rule`, `beta-rule`, `gamma-rule` —
              ALL declaring `rule_path: rules/shared.yml`, all naming the same
              `input_mode: rule-flags` engine, none carrying `claims:` (the
              claimless-with-resolving-engine exemption, SE-12, so this pack
              ships no fixtures).

              `rules/shared.yml` holds TWO semgrep rules with ids that differ
              from all three manifest ids (SE-4): `sg-shared-one` with
              `paths: {include: ["cmd/app/one*.go"]}` and `sg-shared-two` with
              `paths: {exclude: ["pkg/svc/two.go"]}`.

          THE ARITHMETIC IS THE POINT. Two distinct inert patterns, referenced
          by three manifest rules. The correct output is TWO
          `path-scope-dispatch` warnings. A per-manifest-rule walk emits SIX.
          Pick 3 rules and 2 patterns deliberately: with 2x2 a transposed
          implementation could still land on the right count by accident, and
          6 != 2 is unambiguous. Mixing one include and one exclude also stops
          a key-blind dedup from collapsing the two into one.

          Do not add a `fixtures/` directory — a rule with no claims owes no
          fixtures, and any unreferenced file under `fixtures/` draws an
          `orphan-fixture` warning that would pollute CLM-005's assertions.
        files:
          - pkg/packval/testdata/path-scope/shared-rule-file/pack.yml
          - pkg/packval/testdata/path-scope/shared-rule-file/rules/shared.yml
        claims:
          - CLM-009
        depends_on: []

      - id: TASK-014
        type: setup
        title: "Mask-attribution corpus: per-semgrep-rule scoping and the quantifier"
        description: |
          The two packs that make CLM-010 falsifiable. Neither shape exists in
          TASK-012's corpus, and without them a wrong implementation is
          UNDETECTABLE (SE-15, SE-16). Disjoint directories from TASK-001,
          TASK-012 and TASK-013, so all four setup tasks run in parallel.

          Both packs declare one engine with `input_mode: rule-flags` (CLM-007,
          same reason as TASK-012) and DO declare claims, so SE-12 binds: every
          fixture file listed below must exist on disk and be NON-EMPTY. Two
          lines of Go is enough. Manifest rule ids and semgrep rule ids must
          DIFFER (SE-4).

            multi-semgrep-rule-file/
              SE-15's falsifier: ONE manifest rule (`probe-rule`), ONE rule
              file, TWO semgrep rules inside it —
                `sg-hooked`   include `["pkg/svc/*.go", "*hooked-probe*.go"]`
                `sg-unhooked` include `["pkg/svc/*.go"]` and NOTHING else — no
                  slash-free pattern of its own, mirroring `no-baked-tool-exec`
                  and `no-baked-language-token` in the real file.
              The manifest rule's claim declares
              `fixtures/hooked-probe-positive.go` and
              `fixtures/hooked-probe-negative.go`, whose basenames match
              `*hooked-probe*.go` and nothing else.
              CORRECT: exactly ONE mask, naming `sg-hooked`. An implementation
              that unions the FILE's slash-free patterns raises a second mask
              naming `sg-unhooked`, because the hook belongs to its sibling.

            partial-fixture-coverage/
              SE-16's falsifier, and the ONLY thing that separates ANY-fixture
              from EVERY-fixture. ONE manifest rule, ONE rule file, ONE semgrep
              rule with include `["pkg/svc/*.go", "*covered-probe*.go"]`. Its
              claim declares TWO fixtures of which exactly ONE is matched:
                `fixtures/covered-probe-positive.go` — matched by
                  `*covered-probe*.go`
                `fixtures/uncovered-negative.go`     — matched by NEITHER
                  pattern (`pkg/svc/*.go` is inert; the slash-free hook does
                  not match this basename)
              CORRECT: `path-scope-dispatch` fires (the inert pattern is real)
              and the mask does NOT — coverage is partial, so the pack does not
              look healthy and the mask's premise is absent. An implementation
              using "ANY fixture matched" raises a false mask here and passes
              every other test in the corpus.

          The per-fixture ANY half of CLM-010 is pinned elsewhere, by TASK-012's
          `fixture-masked` — whose ONE semgrep rule carries TWO disjointly-
          matching slash-free hooks (`*masked-alpha*.go` matching only
          `masked-alpha-positive.go`, `*masked-beta*.go` matching only
          `masked-beta-negative.go`), so an ALL-patterns-per-fixture reading
          fails there. This task pins the per-fixture-SET half. The two halves
          are independent and neither pack can substitute for the other: both
          packs here declare a single slash-free hook, so neither can distinguish
          ANY from ALL at the per-fixture level.
        files:
          - pkg/packval/testdata/path-scope/multi-semgrep-rule-file/pack.yml
          - pkg/packval/testdata/path-scope/multi-semgrep-rule-file/rules/two-sg-rules.yml
          - pkg/packval/testdata/path-scope/multi-semgrep-rule-file/fixtures/hooked-probe-positive.go
          - pkg/packval/testdata/path-scope/multi-semgrep-rule-file/fixtures/hooked-probe-negative.go
          - pkg/packval/testdata/path-scope/partial-fixture-coverage/pack.yml
          - pkg/packval/testdata/path-scope/partial-fixture-coverage/rules/partial.yml
          - pkg/packval/testdata/path-scope/partial-fixture-coverage/fixtures/covered-probe-positive.go
          - pkg/packval/testdata/path-scope/partial-fixture-coverage/fixtures/uncovered-negative.go
        claims:
          - CLM-010
        depends_on: []

  # ═══════════════════════════════════════════════════════════════════════
  - id: phase-2
    name: "Phase 2: The predicate and the path-scope-dispatch advisory"
    tasks:
      - id: TASK-002
        type: test
        title: "Red tests for the inertness predicate and the phase-2 advisory"
        description: |
          Write the failing tests for CLM-001..005 and CLM-007. Mandated names:

            TestPathScope_PredicateDecidesOnSeparatorAlone
              Table over the SPELLINGS MEASURED IN THIS PLAN'S NOTES. Inert:
              `cmd/backstop/pack_gate*.go`, `**/cmd/backstop/pack_gate*.go`,
              `/cmd/backstop/pack_gate*.go`, `backstop/pack_gate*.go`,
              `*/*/pack_gate*.go`. Honored: `pack_gate*.go`, `*_test.go`,
              `*testdata*`, `*.go`. The `**/` and `/`-anchored rows are SE-1 in
              test form — assert they are INERT, because semgrep recommends
              them and they do not work.

            TestPathScope_AdvisoryNamesEveryInertPattern
              Run `RunCoherence` over `inert-include`, `inert-exclude` and
              `semgrep-suggested-spellings`. Assert one `path-scope-dispatch`
              warning per inert pattern, each carrying the SEMGREP rule id (SE-4),
              the key it came from, and the pattern text. `ValidationWarning`
              has NO `Rule` field (SE-13), so assert those three on `Message`
              and `Files`: the semgrep rule id and the `include`/`exclude` key
              in `Message`, the rule-source path in `Files`, and the pattern
              text in `Message`. Assert the semgrep id and NOT the manifest
              rule id — TASK-001 made them differ precisely so this can fail.

            TestPathScope_AdvisoryNamesFailureDirection
              CLM-003. Assert the include-side message says the rule scans
              nothing, and the exclude-side message says it fires on files the
              pack meant to exempt. Assert the two messages DIFFER — an
              implementation emitting one generic string for both must fail.

            TestPathScope_SlashFreePatternsSilent
              CLM-004. `slash-free-only` produces ZERO `path-scope-dispatch`
              warnings, on both keys.

            TestPathScope_SharedRuleFileFindingsDeduplicated
              CLM-009, and the check that keeps this advisory usable on real
              packs (SE-14). Run `RunCoherence` over `shared-rule-file`, whose
              THREE manifest rules all resolve to one two-semgrep-rule file
              carrying two distinct inert patterns. Assert EXACTLY TWO
              `path-scope-dispatch` warnings — one naming `sg-shared-one` and
              its include pattern, one naming `sg-shared-two` and its exclude
              pattern. Assert the exact count, not "at least two": a
              per-manifest-rule walk emits SIX and would pass a floor
              assertion. Assert the two warnings differ in `Message`, so a
              dedup that collapsed both patterns into one entry also fails.

            TestPathScope_AdvisoryNeverBlocks
              CLM-005. For EVERY pack in the corpus — TASK-001's five,
              TASK-012's three, TASK-013's one and TASK-014's two:
              `PhaseResult.Status` stays `pass`,
              `PhaseResult.Errors` is empty, and after `FinalizeStatus` the
              `Result.Status` is `pass`. Assert against the WARNING channel
              only.

              This test is also the corpus's own guard: TASK-012's and
              TASK-014's packs
              declare claims, so a missing or empty fixture file there surfaces
              here as a `fixtures-*` / `fixture-exists` / `fixture-empty`
              `ValidationError` (SE-12). If this test fails on a
              `Check` other than `path-scope-*`, the corpus is malformed — fix
              the fixture pack, never the assertion.

            TestPathScope_NonRuleFlagsEngineNotScanned
              CLM-007. `non-ruleflags` produces zero warnings. Do not assert
              this by grepping for a tool name; assert on the InputMode-gated
              behaviour.

          These are RED against current source: no predicate exists and phase 2
          emits no such check.
        files:
          - pkg/packval/pathscope_test.go
        claims:
          - CLM-001
          - CLM-002
          - CLM-003
          - CLM-004
          - CLM-005
          - CLM-007
          - CLM-009
        depends_on:
          - TASK-001
          - TASK-012
          - TASK-013
          - TASK-014

      - id: TASK-003
        type: implementation
        title: "Ship the predicate and wire the advisory into phase 2"
        description: |
          New file `pkg/packval/pathscope.go`:

            * The CLM-001 exported predicate, named EXACTLY
              `PathPatternInertUnderFileDispatch(pattern string) bool` —
              TASK-008's source guard scans for that literal, so a different
              name breaks it. Decide on the presence of a `/`
              in the pattern and nothing else — no directory-prefix heuristic,
              no anchor handling, no tool literal. Its doc comment must record
              WHY the `**/`-prefixed and `/`-anchored spellings are inert
              despite semgrep recommending them, citing the measurement, so the
              next reader does not "fix" it back (SE-1).
            * A scanner that, for one pack, walks its rules, resolves each
              rule's source through `RuleSourcePath()` (SE-5), reads it once per
              distinct source path, and yields one finding per inert pattern —
              carrying the semgrep rule id from the rule file itself (SE-4), the
              key, and the pattern.

              DEDUP KEY, MANDATED (CLM-009): emit at most ONE finding per
              distinct `(rule-source path, semgrep rule id, key, pattern)`
              tuple. N manifest rules resolving to the same file must yield the
              same finding set as one would. Note the manifest rule id is
              DELIBERATELY ABSENT from the key — including it would restore the
              N-copy duplication under a different spelling.

              CACHING THE PARSE IS NOT ENOUGH, and this is where a plausible
              implementation goes wrong (SE-14): a cached parse that is still
              walked once per referencing manifest rule emits N copies of every
              finding. On the real backstop-self pack that is 7x26=182 warnings
              instead of 26. The clean shape is to collapse the pack's rules to
              their DISTINCT source paths FIRST, scan each path once, and never
              iterate patterns inside the manifest-rule loop at all. The
              InputMode gate (below) still has to be satisfied per manifest
              rule — a source path is in scope if ANY manifest rule naming it
              resolves to a rule-flags binding.
            * Parse the rule file with the same loose-struct approach
              `semgrepFileContainsRuleID` already uses in `phase3.go`: a
              narrow anonymous struct over `rules[].id` plus
              `rules[].paths.{include,exclude}`. An unparseable file or an
              absent `paths:` block is SILENT (SE-6).

          In `pkg/packval/phase2.go`, inside the existing rule loop: resolve the
          binding via `resolveEngine` and gate the scan on
          `binding.InputMode == engine.InputModeRuleFlags` (CLM-007) — the same
          gate `phase3.go` uses, and for the same reason its comment gives.
          Never compare against an engine-name literal. Append one
          `ValidationWarning{Check: "path-scope-dispatch"}` per finding, with a
          `FixHint` naming the only remedy that works: a slash-free pattern.
          Say plainly in the hint that `**/`-prefixing and `/`-anchoring do NOT
          work, since that is what the author's tool is telling them to do.

          Bump phase 2's `Checks` count (SE-8). Warnings only — no
          `ValidationError` on this path, ever (CLM-005).
        files:
          - pkg/packval/pathscope.go
          - pkg/packval/phase2.go
        claims:
          - CLM-001
          - CLM-002
          - CLM-003
          - CLM-004
          - CLM-005
          - CLM-007
          - CLM-009
        depends_on:
          - TASK-002

      - id: TASK-004
        type: verification
        title: "Gate the predicate and advisory"
        description: |
          Run `./bin/backstop gate` (diff-scoped — the fast inner loop) and
          resolve everything it reports. Then run the plan's `test_command` and
          confirm the TASK-002 tests are GREEN where they were red.

          One extra receipt, because this plan's whole subject is a check that
          can go vacuous: run `./bin/backstop pack check` against an installed
          pack that the notes measured as carrying inert patterns and confirm
          the advisory actually appears in real output — not only in unit tests.
          Confirm the exit code is UNCHANGED (CLM-005).
        files:
          - pkg/packval/pathscope.go
          - pkg/packval/phase2.go
        claims:
          - CLM-002
          - CLM-005
        depends_on:
          - TASK-003

  # ═══════════════════════════════════════════════════════════════════════
  - id: phase-3
    name: "Phase 3: The fixture-mask advisory"
    tasks:
      - id: TASK-005
        type: test
        title: "Red tests for path-scope-fixture-mask"
        description: |
          CLM-006. Mandated names:

            TestPathScope_FixtureMaskAdvisoryFires
              `fixture-masked` yields a `path-scope-fixture-mask` warning,
              distinct in `Check` from `path-scope-dispatch`, naming the rule
              and stating that its declared fixtures are matched only by
              slash-free patterns while its live scope is inert — so phase 3
              green does not mean the rule runs.

              PIN THE CORPUS SHAPE IN THIS SAME TEST, before asserting on the
              warning. Read `fixture-masked`'s rule file and assert that its
              semgrep rule declares at least TWO slash-free include patterns and
              that NO single one of them matches BOTH declared fixture
              basenames. That is a structural guard on the testdata, not on the
              implementation: without it, someone collapsing the two hooks back
              to one shared `*masked-probe*.go` would leave every assertion in
              this file still green while silently destroying the only signal
              that separates the per-fixture ANY reading from the ALL reading
              (see the pairing note under
              `TestPathScope_FixtureMaskRequiresEveryFixtureCovered`). Fail with
              a message that says so explicitly.

            TestPathScope_FixtureMaskSilentWithoutTheHook
              SE-7's falsifier, and the one that makes CLM-006 non-vacuous.
              `multiseg-no-mask` carries an inert pattern and a fixture matched
              by nothing, and must produce a `path-scope-dispatch` warning but
              NO `path-scope-fixture-mask` warning. An implementation that
              raises the mask whenever an inert pattern exists passes the test
              above and fails this one.

            TestPathScope_FixtureMaskScopedPerRule
              SE-11's falsifier. `two-rule-cross-contamination` must yield a
              `path-scope-fixture-mask` warning naming probe-a's semgrep rule
              id and NO mask warning naming probe-b's. Assert BOTH directions —
              the presence for a and the ABSENCE for b — because an
              implementation that reads `phase2.go`'s pack-wide
              `referencedFixtures` map passes the presence half and fails the
              absence half. Assert on the semgrep rule id in `Message` (SE-13);
              a bare count of mask warnings is not enough, since the correct
              count (1) and the contaminated count (2) differ but a future
              third rule would make counting fragile.

            TestPathScope_FixtureMaskAttributedPerSemgrepRule
              CLM-010's per-rule half, SE-15's falsifier.
              `multi-semgrep-rule-file` must yield EXACTLY ONE
              `path-scope-fixture-mask` warning, naming `sg-hooked`, and NO
              mask naming `sg-unhooked`. Assert both directions and assert on
              the semgrep rule id in `Message` (SE-13). `sg-unhooked` carries
              an inert pattern and NO slash-free pattern of its own, so the
              only way it can be masked is by borrowing its sibling's hook —
              which is precisely the union bug, and precisely the shape 2 of
              the 7 real `no-baked.yml` rules have.

            TestPathScope_FixtureMaskRequiresEveryFixtureCovered
              CLM-010's quantifier half, SE-16's falsifier.
              `partial-fixture-coverage` declares two fixtures of which exactly
              one is matched by the rule's slash-free pattern. Assert a
              `path-scope-dispatch` warning DOES fire (the inert pattern is
              real) and that NO `path-scope-fixture-mask` warning fires.
              An implementation using "ANY declared fixture matched" passes
              every other test in this file and fails only here.

              The complementary ANY-per-fixture direction is covered by
              `fixture-masked`, whose single semgrep rule carries TWO
              disjointly-matching slash-free hooks: `*masked-alpha*.go` matches
              only `masked-alpha-positive.go` and `*masked-beta*.go` matches
              only `masked-beta-negative.go`, so neither hook matches both
              fixtures. An implementation requiring ALL of a rule's patterns to
              match each fixture therefore declines the mask there and fails
              `TestPathScope_FixtureMaskAdvisoryFires`. State that pairing in a
              comment so a later reader does not "simplify" either pack away.

            TestPathScope_FixtureMaskNeverBlocks
              Same non-blocking assertions as CLM-005, applied to the second
              check, over TASK-012's three packs and TASK-014's two.

          Also assert the two checks are independently attributable: a pack can
          produce `path-scope-dispatch` alone, and the mask warning is always
          accompanied by at least one dispatch warning.
        files:
          - pkg/packval/pathscope_mask_test.go
        claims:
          - CLM-005
          - CLM-006
          - CLM-010
        depends_on:
          - TASK-004
          - TASK-012
          - TASK-014

      - id: TASK-006
        type: implementation
        title: "Detect the fixture-hook masking shape"
        description: |
          UNIT OF ATTRIBUTION, MANDATED — "rule" IS AMBIGUOUS HERE AND THE TWO
          READINGS GIVE DIFFERENT ANSWERS. The mask is evaluated per
          `(MANIFEST rule x SEMGREP rule)` pair (CLM-010):

            * the FIXTURE side comes from the MANIFEST rule —
              `rule.Claims[].Fixtures.{Positive,Negative}` for the rule under
              consideration (SE-11);
            * the PATTERN side comes from the SEMGREP rule — for each semgrep
              rule inside that manifest rule's source file that carries at
              least one inert pattern, use THAT SEMGREP RULE'S OWN slash-free
              include patterns, never the file's union across siblings (SE-15).

          The union reading is not a hypothetical error. `no-baked.yml` holds 7
          semgrep rules; 4 own a slash-free hook and 2 (`no-baked-tool-exec`,
          `no-baked-language-token`) declare no include at all while still
          carrying an inert exclude. Unioning masks those 2 off a sibling's
          hook. `multi-semgrep-rule-file` reproduces exactly that pair.

          The mask names the SEMGREP rule id in `Message` (SE-4, SE-13), so a
          multi-rule file points the author at the rule that is actually dark.

          QUANTIFIER, MANDATED (CLM-010, SE-16) — do not leave this to
          judgement, and do not infer it from the four round-2 corpus packs,
          where ANY and EVERY happen to agree:

            per FIXTURE   ANY — a fixture is matched when ANY ONE of that
                          semgrep rule's slash-free patterns matches it.
                          The real `no-structural-name-split-on-spine` has two
                          hooks and two fixtures, each hook matching exactly
                          one fixture; an ALL-patterns reading would see the
                          primary real-world case as unmasked.
            per FIXTURE   EVERY — the mask fires only when ALL of the manifest
            SET           rule's declared fixtures are matched. Partial
                          coverage means phase 3 is already failing on the
                          uncovered fixture, so the pack does NOT look healthy
                          and the mask's premise is absent. CLM-002 still fires
                          there, so nothing goes unreported — this is
                          under-reporting a diagnostic, not hiding a defect.

          Match the fixture against the slash-free pattern the way the measured
          contract behaves: the pattern is matched against the fixture's
          BASENAME, since a slash-free pattern is exactly the single-segment
          case.

          READ EACH RULE'S OWN FIXTURES — `rule.Claims[].Fixtures.Positive` and
          `.Negative` for the rule under consideration. DO NOT reuse
          `phase2.go`'s `referencedFixtures` map (SE-11): it is PACK-WIDE,
          accumulated across every rule AND every `tool_config` entry, so
          feeding it to a per-rule mask test lets one rule's fixtures satisfy
          another rule's slash-free patterns. That is not hypothetical — the
          real `no-baked.yml` shape is many rules sharing copy-pasted fixture
          hooks, and `two-rule-cross-contamination` reproduces it. A rule with
          no claims (and therefore no declared fixtures) can never raise the
          mask; it has nothing to be masked by.

          The message must explain the CONSEQUENCE, not just the shape: phase 3
          passes because the fixture is the one file the rule can still match,
          so a green `pack test` is not evidence the rule scans anything in a
          consuming repo. That sentence is the whole diagnostic value of this
          check — the notes' counterfactual measurement is where it comes from.

          Warnings only; no error path (CLM-005). Update phase 2's `Checks`
          count again if TASK-003 accounted for only one new check (SE-8).
        files:
          - pkg/packval/pathscope.go
          - pkg/packval/phase2.go
        claims:
          - CLM-005
          - CLM-006
          - CLM-010
        depends_on:
          - TASK-005

      - id: TASK-007
        type: verification
        title: "Gate the mask advisory"
        description: |
          Run `./bin/backstop gate` and resolve everything it reports. Re-run
          the plan's `test_command` and confirm phase-2 and phase-3 tests are
          all green together — in particular that TASK-002's
          `TestPathScope_SlashFreePatternsSilent` did not regress when the
          second check landed in the same file.
        files:
          - pkg/packval/pathscope.go
          - pkg/packval/phase2.go
        claims:
          - CLM-006
        depends_on:
          - TASK-006

  # ═══════════════════════════════════════════════════════════════════════
  - id: phase-4
    name: "Phase 4: Single authority for the contract"
    tasks:
      - id: TASK-008
        type: test
        title: "Pin that the contract is stated exactly once"
        description: |
          CLM-008. TWO mandated names, because ONE of them cannot work alone —
          see SE-9 and SE-10, which correct this task's first-round design.

            TestCIGlobScoping_UsesSharedInertnessPredicate
              The SOURCE guard, and the ONLY mechanism that can catch a skipped
              refactor. Read `cmd/backstop/ci_recipes_harness_test.go` and
              assert (a) it contains the literal
              `packval.PathPatternInertUnderFileDispatch`, and (b) the regexp
              `strings\.Contains\([^,]+,\s*"/"\)` matches ZERO times WITHIN THE
              `ciGlobScopingProblems` / `ciMultiSegmentIncludeProblems` REGION.
              The regexp form is deliberate: it survives a rename of the loop
              variable and a gofmt pass, so it guards the CONTRACT rather than
              one line's spelling.

              SCOPE THE ASSERTION TO THAT REGION — A WHOLE-FILE ZERO-MATCH IS
              UNSATISFIABLE, AND ROUND 1 GOT THIS WRONG (SE-9). Re-measured
              2026-08-17: that regexp matches TWICE in the file today. The
              second hit is `strings.Contains(token, "/")` inside
              `ciOrgRepoLiterals`, an org/repo COORDINATE parser with no
              relationship to path scoping. TASK-009 forbids touching it, and
              routing an `org/repo` shape test through a path-scope-inertness
              predicate would be semantically wrong even if it were permitted.
              A whole-file assertion could therefore never go green and would
              drive the implementer into a wrong refactor.

              Extract the region first, then scan it: locate the source text
              from the `func ciGlobScopingProblems(` declaration through the
              end of its body and likewise for `func
              ciMultiSegmentIncludeProblems(`, and run the regexp over just
              that text. (Locating both by their `func ` declaration line and
              reading to the next top-level `\nfunc ` is sufficient and does
              not need a Go parser.) Equivalently, assert the surviving
              whole-file match count is exactly 1 AND that its byte offset
              falls OUTSIDE both regions — same guarantee, and it additionally
              fails loudly if someone adds a third occurrence. Either form is
              acceptable; do not weaken it to "at most one match anywhere",
              which would pass with the refactor skipped and `ciOrgRepoLiterals`
              deleted.

              A behavioural agreement test cannot substitute for this.
              `strings.Contains(p, "/")` and the shared predicate are identical
              BY CONSTRUCTION, so an agreement assertion passes whether or not
              TASK-009 ever ran. That is exactly the failure mode this task
              exists to close, and it is why the first-round instinct against
              source-text guards is wrong HERE specifically.

            TestCIGlobScoping_MultiSegmentProblemsAgreeWithPredicate
              The BEHAVIOURAL half, driving the slash-detection branch that no
              production caller reaches (SE-10). It runs against the seam
              TASK-009 extracts: `ciMultiSegmentIncludeProblems(patterns
              []string) []string`, a pure function over a pattern slice with NO
              `*testing.T` and NO on-disk pack read.

              Table over the SAME spellings TASK-002's predicate table uses —
              `cmd/backstop/pack_gate*.go`, `**/cmd/backstop/pack_gate*.go`,
              `/cmd/backstop/pack_gate*.go`, `backstop/pack_gate*.go`,
              `*/*/pack_gate*.go` as inert; `pack_gate*.go`, `*_test.go`,
              `*testdata*`, `*.go` as honored. Assert one problem string per
              inert pattern (naming that pattern), none for the honored ones,
              and that the verdict matches
              `packval.PathPatternInertUnderFileDispatch` entry for entry.

          WHY A SEAM IS NEEDED AT ALL, since the first round assumed there was
          none. `ciGlobScopingProblems` cannot be driven over synthetic
          patterns: it derives its actual set from `ciIncludeSetFor`, which
          parses the REAL installed ci-workflows pack rule files off disk, and
          it SHORT-CIRCUITS — when the parsed set does not equal the caller's
          `want` list it returns immediately, BEFORE the slash-check loop. So a
          test handing it a synthetic pattern set never reaches the branch under
          test. Extracting the loop is the smaller, more surgical change than
          injecting a fake pack, and it is explicitly in TASK-009's scope.

          This test file is RED before TASK-009: the seam does not exist, so the
          package does not compile. That is the intended TDD red.
        files:
          - cmd/backstop/ci_glob_scoping_authority_test.go
        claims:
          - CLM-008
        depends_on:
          - TASK-002
          - TASK-004

      - id: TASK-009
        type: refactor
        title: "Extract the slash-detection seam and route it through the shared predicate"
        description: |
          TWO changes in one file, both required by TASK-008:

          1. EXTRACT THE SEAM. Lift the slash-detection loop out of
             `ciGlobScopingProblems` into a new package-level helper

               func ciMultiSegmentIncludeProblems(patterns []string) []string

             taking a pattern slice and returning the same problem strings the
             loop builds today. It takes NO `*testing.T` and reads NOTHING off
             disk, so TASK-008 can drive it over synthetic patterns.
             `ciGlobScopingProblems` then calls it and appends its result,
             keeping its own behaviour byte-identical.

             This extraction is EXPLICITLY IN SCOPE. The first round's "change
             nothing else in the file" caveat forbade exactly the seam the test
             needs; it is superseded by this task. The caveat that remains: make
             no OTHER change — do not touch `ciIncludeSetFor`, the include-set
             comparison, the target/fixture/other-platform checks, or any
             surrounding helper.

          2. ROUTE IT. Inside the extracted helper, replace the inline
             `strings.Contains(pattern, "/")` with
             `packval.PathPatternInertUnderFileDispatch(pattern)`.
             `cmd/backstop` already imports `pkg/packval`
             (`pack_recipes_archetype_e2e_test.go`, and the pack commands), so
