           `strings.Contains(x, "/")` call, AND a behavioural test driving the
           EXTRACTED slash-detection helper over the measured spellings — the
           branch none of the four real callers reaches (SE-10).
  CLM-009  Dispatch findings are DEDUPLICATED per
           `(rule-source path, semgrep rule id, key, pattern)`. N manifest
           rules resolving to the SAME rule file yield exactly the same warning
           set as one manifest rule would — never N copies. This is the
           real-world primary shape (backstop-self: 7 manifest rules -> 1 file;
           correct answer 26 warnings, naive answer 182). The rule file is also
           READ AND PARSED once per distinct source path, but caching alone
           does not satisfy this claim — the dedup is over EMITTED findings.
  CLM-010  Mask attribution is per `(manifest rule x semgrep rule)`. For each
           semgrep rule in the manifest rule's source file that carries at
           least one inert pattern, the manifest rule's declared fixtures are
           tested against THAT SEMGREP RULE'S OWN slash-free include patterns —
           never the file's union across sibling semgrep rules. QUANTIFIER,
           pinned rather than left open: a fixture counts as matched if ANY of
           those patterns matches its basename, and the mask fires only when
           EVERY declared fixture of the manifest rule is so matched.

  ── SHARP EDGES ───────────────────────────────────────────────────────────
  SE-1  DO NOT TRUST SEMGREP'S DEPRECATION WARNING. It recommends `**/`-
        prefixing or `/`-anchoring. Both were measured and both stay dark. If a
        test fixture is written using either spelling as the "fixed" case, the
        test asserts a falsehood.
  SE-2  ZSH DOES NOT WORD-SPLIT unquoted parameter expansions. Every manual
        re-measurement must build semgrep targets and `--config` flags as shell
        ARRAYS expanded `"${ARR[@]}"`. Passing a space-joined string yields a
        nonexistent-file target and a silent 0-finding run that looks exactly
        like the defect. This cost THIS plan's author a cycle and cost
        PLAN-ISSUE-091's implementer one before that.
  SE-3  `--quiet` + `--sarif` did not surface results in the re-measurement
        here; the readings above were taken WITHOUT `--quiet`. If a probe
        returns 0 everywhere including for a rule with NO `paths:` block at
        all, the probe is broken, not the tree — a no-`paths` rule always
        fires.
  SE-4  A rule file may contain MANY semgrep rules while the pack manifest
        entry names ONE. Attribute every reported pattern to the semgrep rule
        `id` it was declared under, not to the pack manifest rule id, or the
        advisory points at the wrong rule in a multi-rule file like
        `no-baked.yml` (7 rules).
  SE-5  `Rule.RulePath` has a back-compat alias `Rule.File`. Resolve the source
        through `RuleSourcePath()`, never by reading either field directly, or
        older testdata packs are silently skipped and the check goes vacuous.
  SE-6  A pack may declare a rule source that does not parse, or that has no
        `paths:` block anywhere. Both are SILENT for this check — absence of
        path scoping is not a defect, and file existence is phase 1's job.
        Do not add a new error class for either.
  SE-7  CLM-006's fixture-mask test must FALSIFY. Build the masked fixture so
        that removing its slash-free pattern flips the outcome, mirroring the
        counterfactual measured above. A fixture whose mask advisory fires
        purely because a slash-bearing pattern exists does not distinguish
        CLM-006 from CLM-002 and is vacuous.
  SE-8  Phase 2 currently declares `Checks: 7` in its `PhaseResult`. Two new
        checks land here; update that count or the phase under-reports what it
        ran.
  SE-9  CLM-008 IS NOT FALSIFIABLE BY BEHAVIOUR ALONE. `strings.Contains(p,
        "/")` and `PathPatternInertUnderFileDispatch` are identical by
        construction, so an agreement test passes whether or not the refactor
        happened. The source scan is therefore load-bearing, not belt-and-
        braces. Write it whitespace- and identifier-tolerant — regexp
        `strings\.Contains\([^,]+,\s*"/"\)` over the harness file, asserting
        ZERO matches — so a rename or a gofmt pass does not evade it, and
        assert the file contains the literal
        `packval.PathPatternInertUnderFileDispatch`. (This is the narrow case
        the "prefer behaviour over source-text" instinct gets wrong: there is
        no behavioural difference to observe.)
        SCOPE THE ZERO-MATCH ASSERTION — THE WHOLE-FILE FORM IS UNSATISFIABLE.
        Re-measured 2026-08-17: that regexp matches TWICE in the harness file
        today, and only ONE of them is this plan's business.
          * `ciGlobScopingProblems` — `strings.Contains(pattern, "/")`, the
            pattern-slash check TASK-009 routes through the predicate. This is
            the target.
          * `ciOrgRepoLiterals` — `strings.Contains(token, "/")`, inside an
            org/repo COORDINATE parser that has nothing to do with path
            scoping. TASK-009 forbids touching it, and routing an `org/repo`
            shape test through a path-scope-inertness predicate would be
            semantically wrong even if it were allowed.
        So a whole-file "zero matches" assertion can never go green and would
        push the implementer into a wrong refactor. Assert zero matches over
        the `ciGlobScopingProblems` / `ciMultiSegmentIncludeProblems` REGION
        only — see TASK-008 for the mechanism.
  SE-10 THE FOUR REAL `ciGlobScopingProblems` CALLERS CANNOT VERIFY THIS
        REFACTOR. Verified in-tree: `ci_recipes_{github_actions,gitlab_ci,
        bitbucket_pipelines,jenkins}_test.go` all assert only `len(problems)
        != 0`, never the message text, and all four pass slash-FREE include
        sets — so the slash-detection branch is never executed by their data.
        "Those tests still pass" is therefore VACUOUS evidence. Correspondingly
        the message wording is NOT load-bearing: the exact problem string
        appears once tree-wide, in the harness itself. Preserve it out of
        tidiness if convenient, but do not contort the refactor to protect it,
        and do not claim SPEC-067's tests verify it.
  SE-11 `referencedFixtures` IN `phase2.go` IS PACK-WIDE. It accumulates every
        fixture path across every rule AND every `tool_config` entry, so
        reusing it for CLM-006 cross-contaminates rules: rule B's slash-free
        pattern matching rule A's fixture would raise a mask on B. Read each
        manifest rule's OWN `rule.Claims[].Fixtures.{Positive,Negative}`
        instead. The corpus carries a fixture that catches exactly this.
  SE-12 PHASE 2 ERRORS ON MISSING/EMPTY FIXTURES. `fixtures-positive`,
        `fixtures-negative`, `fixture-exists` and `fixture-empty` are
        `ValidationError`s, so any fixture pack whose rule declares CLAIMS must
        ship real, NON-EMPTY positive AND negative fixture files on disk or
        CLM-005's "Errors is empty" assertion fails on this plan's own corpus.
        Two escape hatches, both used deliberately below: a rule with a
        RESOLVING `engine:` and NO claims owes no fixtures at all (that is the
        shape for every pack that is not testing CLM-006), and every file
        placed under `fixtures/` must be referenced by some claim or phase 2
        raises an `orphan-fixture` warning.
  SE-13 `ValidationWarning` HAS NO `Rule` OR `Claim` FIELD — unlike
        `ValidationError`, its fields are `{Phase, Check, Message, Files,
        FixHint}` (`pkg/packval/result.go`). SE-4's "attribute to the semgrep
        rule id" therefore lands in `Message` and `Files`, and the tests must
        assert there. Do NOT widen the struct to carry it; the existing
        `exempt-scope-decision` and `orphan-fixture` warnings already name
        their subject in `Message`/`Files`.
  SE-14 N MANIFEST RULES SHARE ONE RULE FILE — THAT IS THE COMMON CASE, AND
        THE CORPUS DID NOT MODEL IT UNTIL TASK-013. Measured 2026-08-17:
        backstop-self declares 7 manifest rules ALL naming
        `rules/no-baked.yml`; cobra-cli-standards has 3 -> `cli-security.yml`
        and 2 -> `cli-core.yml`. A per-manifest-rule walk that emits as it goes
        produces 7x26=182 warnings for one file. Every other pack in this
        plan's corpus declares one manifest rule per file, so NOTHING but
        `shared-rule-file/` can distinguish a correct implementation from a
        duplicating one. Read-once caching is NOT sufficient: a cached parse
        that is then walked once per referencing manifest rule still emits N
        copies. Dedup the EMITTED findings (CLM-009).
  SE-15 MASK PATTERNS ARE PER SEMGREP RULE, NOT PER FILE. `no-baked.yml`
        carries 7 semgrep rules, each with its OWN `paths` block and its OWN
        slash-free fixture hooks. Measured: 4 of them own a hook
        (`*neutral_spine_*.go`, `*repo_layout_*.go`,
        `*structural-name-split*.go` + `*structured-property-read*.go`,
        `*pack-name-keyed-capability*.go` + `*gate-type-declaration-scan*.go`)
        and 2 (`no-baked-tool-exec`, `no-baked-language-token`) declare NO
        include at all while still carrying an inert exclude. Test a fixture
        against the FILE's union and those 2 get falsely masked by a sibling's
        hook. `multi-semgrep-rule-file/` (TASK-014) is the falsifier.
  SE-16 THE QUANTIFIER IS DECIDED BY MEASUREMENT, NOT TASTE — and the real
        rule settles it. `no-structural-name-split-on-spine` declares TWO
        fixtures (`fixtures/rules/valid/structured-property-read.go`,
        `fixtures/rules/invalid/structural-name-split.go`) and TWO slash-free
        hooks, and EACH HOOK MATCHES EXACTLY ONE FIXTURE. So:
          * per FIXTURE the quantifier is ANY — a fixture is matched if any
            one slash-free pattern matches its basename. An ALL-patterns rule
            would see the real shape as unmasked and miss the primary case.
          * per FIXTURE SET the quantifier is EVERY — the mask fires only when
            all declared fixtures are covered. Partial coverage means phase 3
            would already be failing on the uncovered fixture, so the pack does
            NOT look healthy and the mask's whole premise is absent; CLM-002
            still fires there, so nothing goes unreported.
        THE TWO QUANTIFIERS NEED TWO SEPARATE FALSIFIERS, AND ROUND 3 SHIPPED
        ONLY ONE. In all four ROUND-2 corpus packs both fixtures were matched
        by every pattern or by none, making both quantifiers indistinguishable.
        Round 3 added `partial-fixture-coverage/` (TASK-014), which settles the
        per-FIXTURE-SET choice — but it left every pack in the corpus, including
        `fixture-masked/`, with AT MOST ONE slash-free pattern per semgrep rule.
        Over a one-element pattern set ANY and ALL are the same predicate, so
        the per-FIXTURE choice was still unfalsifiable corpus-wide and a wrong
        ALL-patterns implementation would have passed the whole suite while
        going blind on the real flagship rule. Round 4 closes that by rebuilding
        `fixture-masked/` (TASK-012) with TWO disjointly-matching hooks
        mirroring the real rule above. Both packs are load-bearing and neither
        substitutes for the other: `fixture-masked/` pins per-FIXTURE ANY,
        `partial-fixture-coverage/` pins per-FIXTURE-SET EVERY.

  ── CROSS-LANE COLLISION CHECK (2026-08-17) ───────────────────────────────
  EXISTENCE-IN-WORLD: no artifact owns this surface. `grep -l` over `plans/`
  and `specs/` for `paths.include` / `multi-segment` / `ISSUE-151` returns five
  files, every one a CITATION rather than ownership:
    * PLAN-ISSUE-091 — files this issue (TASK-006 item 3); explicitly REFUSES
      to fix it in core dispatch.
    * PLAN-ISSUE-097 — owns the two stale `@waiver:` tokens whose visibility
      this defect currently provides. Adjacent, not overlapping: it touches
      waiver adjudication, not packval.
    * PLAN-ISSUE-101 / PLAN-SPEC-067 / SPEC-067 — the CI-recipe pack's OWN
      include sets. SPEC-067's CLM-053..056 fix those specific sets by hand;
      neither generalizes the contract nor validates any other pack.
  DIR-032 item 4 (ISSUE-092) trap (a) names the same MECHANISM on a different
  surface (packval's fixture dispatch not inheriting item 3's undercount) and
  does not close this.

  TWO MORE THE FIRST TWO SWEEPS MISSED, both non-owning, recorded so a third
  sweep does not re-derive them:
    * PLAN-ISSUE-146 — draft, disjoint file scope, and it already names THIS
      plan as disjoint in its own text. Mutual, not overlapping.
    * PLAN-SPEC-014 — reads `status: ready` but its code shipped months ago.
      Stale status, not a live lane; it owns nothing here.

  FILE CONTENTION (re-measured 2026-08-17 at round-4 fix time, and it has
  MOVED since round 3 — the earlier claim that `git status --porcelain` over
  all of `pkg/packval` and `pkg/pack` returns empty is NO LONGER TRUE, because
  the sibling lanes named below went from draft to actively writing). The
  measurement that matters is the narrow one, over THIS PLAN'S OWN write set:

    git status --porcelain pkg/packval/phase2.go pkg/packval/pathscope.go \
      pkg/packval/testdata/path-scope \
      cmd/backstop/ci_recipes_harness_test.go \
      cmd/backstop/ci_glob_scoping_authority_test.go

  That returns EMPTY. Every file this plan creates or modifies is clean and
  unclaimed on disk.

  What IS dirty inside `pkg/packval` and `pkg/pack` right now, all of it owned
  by other lanes and all of it disjoint from the list above: modified
  `pkg/packval/manifest.go`, `pkg/packval/phase3.go`,
  `pkg/packval/executor.go`, `pkg/pack/scaffold.go`,
  `pkg/pack/scaffold_test.go`, plus untracked
  `pkg/packval/phase3_patternarg_dispatch_test.go`,
  `pkg/packval/executor_stdout_artifact_test.go`,
  `pkg/packval/contracts_pack_dispatch_test.go` and
  `pkg/packval/testdata/patternarg-pack*/`. The wider tree is shared too (many
  `.claude/agent-memory/` files plus in-flight work in `pkg/scaffold`,
  `pkg/config`, `pkg/artifact`, `pkg/schema`, `cmd/backstop/artifact_new.go`
  and several untracked layout test files). None of it intersects this plan's
  declared scope.

  The one live edge is `manifest.go`, which SE-5 depends on for
  `RuleSourcePath()`. Verified 2026-08-17 that PLAN-ISSUE-142's in-flight
  `manifest.go` diff leaves `RuleSourcePath()` BYTE-IDENTICAL, so SE-5 holds
  as written — but that is a measurement of a moving file, so re-read the
  function before calling it rather than trusting this line.

  TWO UNTRACKED PEER PLANS DO DECLARE `pkg/packval` SCOPE, and the first-round
  sweep missed both. Named here so the implementer can re-check them rather
  than rediscover them:
    * PLAN-ISSUE-142 (pattern-arg fixtures never dispatch) — declares
      `pkg/packval/phase3.go` AND `pkg/packval/manifest.go`. DISJOINT from this
      plan's write set (`pathscope.go`, `phase2.go`), but the `manifest.go`
      touch matters: that file is home to `RuleSourcePath()`, which SE-5 makes
      this plan depend on. If 142 lands first, RE-READ `RuleSourcePath` before
      calling it rather than assuming its 2026-08-17 shape. It also creates
      `pkg/packval/testdata/patternarg-pack*/` — a different testdata subtree
      than this plan's `testdata/path-scope/`, so no fixture collision.
    * PLAN-ISSUE-144 (executor ignores stdout artifact) — declares
      `pkg/packval/executor.go` only. Fully disjoint; noted for completeness.
    * PLAN-ISSUE-148 (substantiveness fixture polarity) targets
      `packs/substantiveness/` pack DATA, not `pkg/packval` source. Still
      disjoint — confirm it has not since moved.
  All three are unmerged, but 142 and 144 are no longer merely drafts — as of
  2026-08-17 both are ACTIVELY IMPLEMENTING, which is where the dirty
  `manifest.go` / `phase3.go` / `executor.go` and the untracked
  `patternarg-pack*/` fixtures above come from. That changes nothing about
  disjointness: neither 142 nor 144 touches `phase2.go`, `pathscope.go`,
  `testdata/path-scope/` or the CI harness, so this plan may still proceed
