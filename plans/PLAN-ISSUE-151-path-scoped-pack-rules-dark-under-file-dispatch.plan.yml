  CLM-002  `backstop pack check` and `backstop pack test` emit a non-blocking
           `path-scope-dispatch` advisory naming every inert pattern in a
           pack's declared rule-source files: the semgrep rule id, the key it
           came from, and the pattern text.
  CLM-003  The advisory names the FAILURE DIRECTION: an inert `include` is
           reported as a silent no-op (the rule scans nothing); an inert
           `exclude` is reported as failing OPEN (the rule fires on files the
           pack meant to exempt).
  CLM-004  A slash-free pattern is NEVER reported, under either key. The one
           spelling that survives both dispatch shapes is not flagged, or the
           advisory would have no actionable remedy.
  CLM-005  The advisory is NON-BLOCKING: it never populates `Result.Errors`,
           never moves `PhaseResult.Status` off `pass`, and never changes the
           `pack check` / `pack test` exit code.
  CLM-006  A second, distinct `path-scope-fixture-mask` advisory fires for a
           rule that carries at least one inert pattern AND whose declared
           fixtures are matched only by its slash-free patterns — the shape
           that keeps phase 3 green while the live scope is dark. It is
           reported separately from CLM-002 because it is the reason the pack
           LOOKS healthy. The FIXTURE SIDE is scoped per MANIFEST rule — that
           rule's OWN `claims[].fixtures`, never a pack-wide fixture
           accumulation (SE-11); the PATTERN side is scoped per SEMGREP rule
           (CLM-010, SE-15).
  CLM-007  The rule-file read is gated on the resolved binding's declared
           `InputMode == engine.InputModeRuleFlags`, never on a tool-name or
           engine-name equality test — the same gate `phase3.go`'s
           `semgrep-rule-id` check already uses.
  CLM-008  `ciGlobScopingProblems` (`cmd/backstop/ci_recipes_harness_test.go`)
           consumes the CLM-001 predicate instead of its own inline
           `strings.Contains(pattern, "/")`, so the contract is stated once and
           the two cannot drift. Falsified TWO ways, because behaviour alone
           cannot falsify it (SE-9): a SOURCE SCAN proving the harness file
