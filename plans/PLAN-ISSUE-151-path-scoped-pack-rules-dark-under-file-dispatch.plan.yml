  ── CORRECTION 1 (CHANGES THE FIX): IT IS NOT "DIRECTORY-PREFIXED" ─────────
  ISSUE-151 and DIR-032 item 20 both state the contract as a `paths.include`
  glob "naming a directory prefix". THAT IS TOO NARROW. Measured across four
  spellings of the same intent, against the same two explicit file targets:

    include: "cmd/backstop/pack_gate*.go"    (bare, dir-prefixed)   -> 0
    include: "**/cmd/backstop/pack_gate*.go" (semgrep's OWN
                                              suggested "unanchored" fix) -> 0
    include: "/cmd/backstop/pack_gate*.go"   (semgrep's OWN
                                              suggested "anchored" fix)   -> 0
    include: "pack_gate*.go"                 (slash-FREE basename)  -> 2

  All four fire under the directory target. Extended to `backstop/pack_gate*.go`
  (tail-only, 2 segments), `**/backstop/pack_gate*.go` and `*/*/pack_gate*.go` —
  all 0 under explicit-file dispatch. The real, measured contract is:

    A `paths.include`/`paths.exclude` pattern CONTAINING A `/` is unsatisfied
    under explicit-file dispatch, IN EVERY SPELLING. Only a slash-free
    (single-segment) pattern is honored under BOTH dispatch shapes.

  Two consequences the narrower framing would have caused this plan to miss:
    * SEMGREP'S OWN REMEDY DOES NOT WORK. semgrep 1.156.0 prints a deprecation
      warning on every one of these patterns recommending `**/`-prefixing or
      `/`-anchoring. BOTH remain dark. An implementer who trusts that warning
      will ship a fix that changes nothing. Do not.
    * The check cannot key on "looks like a directory prefix". It keys on the
      presence of a `/`, which is exactly what the already-shipped
      `ciGlobScopingProblems` (`cmd/backstop/ci_recipes_harness_test.go`)
      independently arrived at — see the single-authority task.

  ── CORRECTION 2 (ADDS A CLAIM): THE `exclude` SIDE FAILS **OPEN** ─────────
  ISSUE-151 discusses only `include`. `exclude` has the same inertness and the
  OPPOSITE, more dangerous polarity. Measured with `pattern: strings.Fields($X)`
