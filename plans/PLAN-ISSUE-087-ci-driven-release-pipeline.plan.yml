            General rule for every absence assertion in this file: pair it with an
            existence assertion on the thing being searched, or it degrades into a
            tautology the moment the target is missing.

          FINDINGS-CLEAN: this file is NEW and therefore unconditionally in gate
          diff scope. It must carry zero pack_engines findings of its own. The
