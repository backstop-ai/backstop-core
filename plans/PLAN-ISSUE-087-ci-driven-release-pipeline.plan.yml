  ── TAP COORDINATES — RATIFIED 2026-07-27 ─────────────────────────────────
  SETTLED. Founder ratification, verbatim rationale: "I'd lean hard into
  convention over configuration."

      TAP REPO         backstop-ai/homebrew-tap
      TAP SHORTHAND    backstop-ai/tap
      INSTALL COMMAND  brew install backstop-ai/tap/backstop

  The three parts are one fact, not three: Homebrew strips the `homebrew-`
  prefix when resolving a tap, so the repo `backstop-ai/homebrew-tap` IS the tap
  `backstop-ai/tap`, and a formula in it installs as
  `backstop-ai/tap/backstop`. Write the REPO name in the config and the
  SHORTHAND in any user-facing instruction; they are not interchangeable and
  mixing them up produces a tap that resolves to nothing.

  Candidates considered, recorded so the decision is not re-litigated:
      backstop-ai/homebrew-tap        ✅ RATIFIED — the convention form
      backstop-core/homebrew-backstop ❌ rejected — names the pre-rename org,
                                         and encodes the project name where the
                                         convention expects the generic `tap`

