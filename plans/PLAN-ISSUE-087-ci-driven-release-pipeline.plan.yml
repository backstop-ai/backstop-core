            Assert on the symbol path `main.version` specifically, not merely that
            some `-X` flag is present.

          TestGoreleaserConfig_ProducesArchivesChecksumsAndRelease
            An `archives:` section exists; a `checksum:` section exists with a
            declared name template; a `release:` section exists and is not
            disabled. Also assert the top-level `version: 2` key, which goreleaser
            v2 requires and whose absence is a confusing runtime error rather than
