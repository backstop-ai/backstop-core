  is precisely the shape of a PACK. The future `go-distribution` pack would
  carry scaffolding-kind recipes that lay down the goreleaser config, the
  release and tag-integrity workflows, and the tap wiring — with enforcement
  rules attached, per the recipes archetype.

  For THIS plan the artifacts stay HAND-WRITTEN. The launch slice does not wait
  on a pack. But author them AS FUTURE PACK PAYLOADS:
    - minimize backstop-core-specific hardcoding. Prefer `go-version-file:
      go.mod` over a pinned version, `./cmd/backstop` derived from the repo
      layout over paths that only make sense here, and template-friendly names.
    - where something MUST be core-specific (the tap repo name, the module
      path), keep it in one obvious place rather than scattered, so extraction
      is a substitution rather than an archaeology exercise.
    - the placeholder headers WIDEN: they already point at BUNDLE-015 REQ-018
      (the CI recipe pack); they should now also name this `go-distribution`
