      - id: TASK-006
        type: implementation
        title: "Add resolveVersion with the pseudo-version-rejecting fallback and wire the version command to it"
        description: |
          Add `cmd/backstop/version.go` (new file, package main) containing
          `resolveVersion(injected string, info *debug.BuildInfo, ok bool) string`
          and a thin `effectiveVersion()` that calls it with the package `version`
          var and `debug.ReadBuildInfo()`.

          Precedence, in order:
            1. `injected` is non-empty and not "dev" -> return it. The goreleaser
               ldflags path wins outright.
            2. build info absent (ok==false or info==nil) -> "dev".
            3. `info.Main.Version` is a RELEASED module version -> return it.
            4. otherwise -> "dev".

          "Released module version" rejects, with the reason in a comment because
          the next reader will not have this plan open:
            - "" and "(devel)"
            - anything containing "+" (build metadata / dirty; `+dirty` is what a
              local build of a modified tree produces)
            - anything whose pre-release segment matches the pseudo-version shape
              `-<14 digits>-<12 hex chars>` — Go 1.24+ stamps this from VCS on a
              plain `go build`, so accepting it would make every dev build report a
              version that looks real and is not
          and accepts a leading `v` followed by a well-formed `X.Y.Z` with an
          optional pre-release. Implement the shape check directly; do not add a
          semver dependency for this.

          Then edit `cmd/backstop/root.go`:
            - LEAVE `var version = "dev"` where it is (root.go:16) and LEAVE its
              `// nosemgrep: go.core.no-global-mutable-state` comment intact —
              `-ldflags -X` can only write a package-level var, and that comment is
              the standing justification. Moving or reformatting the line risks
              detaching the waiver from the finding.
            - Update the comment above it: the value is the ldflags-injected build
              stamp, and `effectiveVersion()` is what callers read.
            - In versionCmd's RunE, replace BOTH uses of `version` — the `"version"`
              key in the JSON map (root.go:106) and the `cmd.Printf("backstop
              version %s\n", version)` line (root.go:117) — with a single
              `effectiveVersion()` result computed once at the top of RunE, so the
              two branches cannot drift.

          Every test named in TASK-005 must pass. Run
          `go test ./cmd/backstop/... -race -count=1` and report the true exit code.
        files:
          - cmd/backstop/version.go
          - cmd/backstop/root.go
        claims:
          - CLM-005
          - CLM-006
          - CLM-007
          - CLM-008
        depends_on:
          - TASK-005

