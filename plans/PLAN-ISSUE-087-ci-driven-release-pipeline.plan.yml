          AMENDED 2026-07-28 from execution: "must be 0" was UNSATISFIABLE BY
          CONSTRUCTION. The guard test has to NAME the string it forbids, so it
          defines `legacyModulePath = "github.com/bmanson/backstop-core"`
          (module_path_test.go:25) and skips its own definition site with an
          anchored self-skip. A repo-wide grep cannot distinguish the guard's
          declaration from a real stale reference; only the guard can.

          So the criterion is: ZERO legacy references OUTSIDE the guard's own
          definition site. If the grep returns anything other than exactly
          `module_path_test.go`, the extra files are real misses. If it returns
          0, the guard's constant has gone missing and the guard is now vacuous —
