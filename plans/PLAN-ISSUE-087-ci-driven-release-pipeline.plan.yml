          THE GUARD TEST IS THE STRONGER CHECK, and this grep is a coarse
          cross-check of it. `TestModulePath_NoLegacyReferencesInLiveTree` walks
          the WHOLE tree — `.go`, `.go.txt`, `.sh`, `go.mod` — not just `.go`,
