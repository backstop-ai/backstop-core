  - id: phase-4
    name: "Phase 4: Release and Tag-Integrity Workflows"
    tasks:
      - id: TASK-011
        type: test
        title: "RED: workflow shape — semver-tag-only trigger, integrity and green-CI gating, no self-gating"
        description: |
          Add `workflows_test.go` at the repo ROOT in `package backstopcore_test`.
          RED today: neither workflow file exists.

          Parse both workflow YAMLs and assert on parsed structure. Note the YAML
          `on:` trap — `on` can decode as the BOOLEAN true rather than the string
          key, so read the trigger key defensively (check both the `"on"` string
          key and a `true` key) and fail with a clear message if neither is present
          rather than silently asserting nothing.

          TestReleaseWorkflow_TriggersOnlyOnSemverTagPush
            .github/workflows/release.yml triggers on `push` with `tags: ['v*']`
            and declares NO `branches:` trigger and no `pull_request:` trigger — a
            release workflow that also fires on every main push will publish
            garbage. Assert its `permissions` include `contents: write` (needed to
            create the Release) and `actions: read` (needed to query CI status).

          TestReleaseWorkflow_RequiresTagIntegrityAndGreenCI
            The job that runs goreleaser `needs:` BOTH the tag-integrity job and
            the green-CI job. Assert on the `needs` set, which is the actual
            enforcement mechanism — a green-CI job that exists but is not in
            `needs` gates nothing. Assert the green-CI job has a step whose `run`
            queries CI conclusion for the tagged SHA (`gh run list` / `gh api` with
            the commit SHA) — the exact query is the implementer's choice; what the
            test pins is that a step consults CI status for THIS commit rather than
            assuming it.

          TestTagIntegrityWorkflow_ChecksSemverAndAncestryOfMain
            .github/workflows/tag-integrity.yml has a step asserting the tag name
            matches a semver pattern, and a step running
            `git merge-base --is-ancestor` against origin/main. Assert its checkout
            step sets `fetch-depth: 0` — without full history the ancestry query
            cannot answer, and a shallow checkout would make the check pass
            vacuously or error confusingly.

          TestTagIntegrityWorkflow_CarriesTemporarySuccessorHeader
            Read the file as TEXT (this one assertion is legitimately textual — the
            header's wording is the deliverable) and assert the leading comment
            block names it as temporary and names its successor. The successor
            framing WIDENED on 2026-07-27: it is not only BUNDLE-015 REQ-018's CI
            recipe pack but the future `go-distribution` pack, of which the
            release trinity (GitHub releases + Homebrew + `go install`) is the
            seed. Assert on the identifying tokens — "temporary", "REQ-018", and
            "go-distribution" — rather than on the full sentence.

            Add one NEGATIVE token assertion: the header must NOT contain
            "ISSUE-086". That issue was narrowed on 2026-07-27 to the
            packless-baseline defect and no longer owns the hand-baked-CI concern
            (ISSUE-020 does), so citing it here would ship a wrong reference in
            source that outlives this plan. Positive-token assertions cannot catch
            a wrong citation — they only check that expected tokens are PRESENT —
            which is exactly why this one negative assertion earns its place.

          TestReleaseWorkflows_DoNotSelfGate
            FIRST, assert BOTH workflow files EXIST and are non-empty. Then assert
            neither contains a `backstop gate` invocation.

            The existence assertions are not decoration — without them this test
            is VACUOUS at RED time. An absence-only assertion over files that do
            not exist yet passes trivially: before TASK-012 there is no
            release.yml and no tag-integrity.yml, so "neither contains `backstop
            gate`" is true of nothing. It would be the one test in this plan that
            starts GREEN, and a test that never fails proves nothing about the
            code that later makes it pass. Reading the file must ERROR the test if
            the file is missing, not be skipped or swallowed.

            This pins a deliberate founder-approved cut (macOS runner +
            ISSUE-020's Linux sandbox) so that adding self-gating later is a
            conscious act that trips a test and forces the author to read
            release.yml's header. It is now the ONLY remaining scope cut pinned by
            a test — the Homebrew cut was reversed on 2026-07-27 and TASK-008's
