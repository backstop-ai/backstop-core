  - id: phase-2
    name: "Phase 2: Version Resolution — ldflags precedence plus a ReadBuildInfo fallback"
    tasks:
      - id: TASK-005
        type: test
        title: "RED: version resolution table plus a real ldflags round-trip through the built CLI"
        description: |
          Add `cmd/backstop/version_test.go` (package main, matching the existing
          cmd/backstop test convention). RED today: `resolveVersion` does not exist.

          Target signature — a PURE function, so the whole matrix is testable
          without building a binary per case:

            func resolveVersion(injected string, info *debug.BuildInfo, ok bool) string

          Table cases. The `+dirty` string below is REAL CAPTURED OUTPUT from
          `go version -m ./bin/backstop` on 2026-07-27 against a `make build`
          binary — do not "clean it up", it is the exact shape the toolchain emits
          and it is the case the naive implementation gets wrong:

            TestResolveVersion_LdflagsInjectionWins
              injected "v0.11.0", info.Main.Version "v0.9.0"  -> "v0.11.0"
              injected "v0.11.0", ok=false                    -> "v0.11.0"
              The goreleaser path is authoritative and is never second-guessed by
              build info.

            TestResolveVersion_ModuleVersionFallbackForGoInstall
              injected "dev", info.Main.Version "v0.11.0"     -> "v0.11.0"
              injected "dev", info.Main.Version "v1.0.0-rc.1" -> "v1.0.0-rc.1"
              injected "",    info.Main.Version "v0.11.0"     -> "v0.11.0"

            TestResolveVersion_PseudoVersionFallsBackToDev
              "v0.0.0-20260727014125-1ccb2a60b2f7"            -> "dev"

            TestResolveVersion_DirtyBuildFallsBackToDev
              "v0.0.0-20260727014125-1ccb2a60b2f7+dirty"      -> "dev"
              "v0.11.0+dirty"                                 -> "dev"

            TestResolveVersion_DevelAndAbsentBuildInfoFallBackToDev
              "(devel)"  -> "dev"
              ""         -> "dev"
              nil info   -> "dev"
              ok=false   -> "dev"

          TestVersionCommand_TextAndJSONAgree
            Execute the real cobra command both ways (the repo's existing
            cmd/backstop tests already drive commands with captured output — follow
            that pattern) and assert the version string in the `--json` payload's
            `version` field equals the one in the text output's
            `backstop version <x>` line. This is what stops the two branches in
            root.go's versionCmd from drifting apart.

          TestVersion_LdflagsInjectionReachesBuiltCLI
            The only test that proves the SYMBOL PATH is right — that
            `-X main.version` actually writes the var the CLI reads. A table test
            cannot prove this; a typo in the symbol name would pass every case
            above and ship a binary reporting "dev".

            Build into t.TempDir() twice from the repo root and run each binary's
            `version` subcommand:
              a) `go build -ldflags "-X main.version=v9.9.9" -o <tmp>/backstop
                  ./cmd/backstop` -> output contains "v9.9.9"
              b) `go build -o <tmp>/backstop-plain ./cmd/backstop` -> output is
                  "dev", NOT a pseudo-version. This half is the regression guard
                  for the captured `+dirty` trap.

            Locate the repo root from the test's working directory rather than
            hardcoding a path. This test is slow by nature (two builds); that is
            acceptable and it must not be skipped or short-circuited.
        files:
          - cmd/backstop/version_test.go
        claims:
          - CLM-005
          - CLM-006
          - CLM-007
          - CLM-008
          - CLM-009
        test_names:
          - TestResolveVersion_LdflagsInjectionWins
          - TestResolveVersion_ModuleVersionFallbackForGoInstall
          - TestResolveVersion_PseudoVersionFallsBackToDev
          - TestResolveVersion_DirtyBuildFallsBackToDev
          - TestResolveVersion_DevelAndAbsentBuildInfoFallBackToDev
          - TestVersionCommand_TextAndJSONAgree
          - TestVersion_LdflagsInjectionReachesBuiltCLI
        depends_on:
