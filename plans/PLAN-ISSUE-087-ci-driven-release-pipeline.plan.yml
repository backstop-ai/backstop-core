      - id: TASK-012
        type: implementation
        title: "Write the tag-integrity and release workflows"
        description: |
          Create both workflows, turning TASK-011 green.

          .github/workflows/tag-integrity.yml
            Follow the pattern already shipped in the pack repos —
            backstop-self-pack/.github/workflows/tag-integrity.yml is the
            reference; READ IT before writing this. Core's checks differ from the
            packs': the packs assert tag-vs-`pack.yml` version agreement, which
            core has no analogue for. Core asserts instead:
              - the pushed tag matches
                `^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$`, failing with a
                `::error::` annotation naming the malformed tag
              - the tagged commit is an ancestor of `main`:
                checkout with `fetch-depth: 0`, `git fetch origin main`, then
                `git merge-base --is-ancestor "$GITHUB_SHA" origin/main`, failing
                with an annotation explaining that a tag off a side branch will not
                be released
            Trigger on `push` tags `v*`. Lead with the TEMPORARY HEADER comment
            block, matching the pack repos' convention: state that this is a
            hand-written placeholder, and that it is not meant to become a second
            permanent hand-baked pipeline. Name BOTH successors — the BUNDLE-015
            REQ-018 CI recipe pack (DIR-019), and the future `go-distribution`
            pack that the release trinity seeds (see the framing note). Extraction
            is post-launch; the header exists so the next reader knows this file
            is destined to become pack payload rather than to accrete.

            DO NOT cite ISSUE-086 in this header. An earlier draft attributed the
            hand-baked-pipeline concern to it; ISSUE-086 was narrowed on
            2026-07-27 to the packless-baseline defect ONLY, and the hand-baked-Go
            fact belongs to ISSUE-020's acceptance criterion. This header is
            SHIPPED SOURCE — it outlives this plan and gets read by people who
            will chase whatever issue number it names, so a wrong citation here is
            more expensive than the same wrong citation in a task description.
            If you want a tracking reference in the header, cite ISSUE-020 for the
            hand-baked-CI concern, or cite nothing and let the successors carry it.

            CLM-016's token test (TASK-011) asserts "temporary", "REQ-018" and
            "go-distribution". Those are presence-only checks and would NOT have
            caught the bad ISSUE-086 citation. TASK-011 therefore MANDATES a
            negative assertion that the header does NOT contain "ISSUE-086" —
            this header must satisfy it. That assertion is what converts this from
            a review catch into a mechanical one.

          .github/workflows/release.yml
            Trigger: `push` with `tags: ['v*']` only.
            Permissions: `contents: write`, `actions: read`.
            Jobs:
              - `tag-integrity`: reuse the same semver + ancestry assertions (call
                the reusable workflow, or repeat the two steps — either is fine;
                what matters is that the release job cannot run without them).
              - `require-green-ci`: assert `ci.yml` already concluded success on
                `$GITHUB_SHA`, using `gh` (preinstalled on GitHub runners) with
                `GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}`. Fail with an explicit
                annotation when no successful CI run exists for that exact SHA —
                including the case of NO run at all, which must fail, not pass by
                absence. That vacuous-pass case is the one worth writing carefully:
                "no runs found" and "runs found, all red" must both be red.
              - `goreleaser`: `needs: [tag-integrity, require-green-ci]`. Checkout
                with `fetch-depth: 0` (goreleaser needs history for changelog),
                `actions/setup-go@v5` with `go-version-file: go.mod`, then
                `goreleaser/goreleaser-action@v6` with `version: "~> v2"` and
