  ── SHARP EDGE: A LOCAL `go build` ALREADY STAMPS A PSEUDO-VERSION ──────────
  This is the trap in the ReadBuildInfo fallback, and it was found by CAPTURING
  real output rather than reasoning about it. On 2026-07-27, against the
  binary built by `make build` (Go 1.25.3):

      $ go version -m ./bin/backstop
      ./bin/backstop: go1.25.3
        path  github.com/bmanson/backstop-core/cmd/backstop
        mod   github.com/bmanson/backstop-core  v0.0.0-20260727014125-1ccb2a60b2f7+dirty

  Since Go 1.24, `go build` derives `Main.Version` from VCS state. It is NOT
  `(devel)` here — it is a PSEUDO-VERSION, and on a dirty tree it carries a
  `+dirty` suffix. A naive `if injected == "dev" { use info.Main.Version }`
  therefore makes every local dev build report
  `v0.0.0-20260727014125-1ccb2a60b2f7+dirty` at `backstop version`. That is worse
  than `"dev"`: it looks like a real version and is not one.

  The fallback must accept ONLY a released module version and reject everything
  else. Captured/derived fixture strings for the table test — the first is REAL
  captured output, the rest are the shapes the Go toolchain actually emits:

      "v0.11.0"                                     ACCEPT (go install @v0.11.0)
      "v1.0.0-rc.1"                                 ACCEPT (pre-release tag)
      "v0.0.0-20260727014125-1ccb2a60b2f7+dirty"    REJECT (captured local build)
      "v0.0.0-20260727014125-1ccb2a60b2f7"          REJECT (clean pseudo-version)
      "(devel)"                                     REJECT (no VCS info)
      ""                                            REJECT (empty)
      nil BuildInfo / ReadBuildInfo ok==false       REJECT

  REJECT means the result is `"dev"`. The rejection predicate is behavioral, not
  cosmetic: reject `(devel)`, empty, anything containing `+` (build metadata /
  dirty), and anything whose pre-release segment is the pseudo-version shape
  `-<14 digits>-<12 hex>`. Accept otherwise, provided it starts with `v` and the
  remainder is a well-formed `X.Y.Z[-prerelease]`.

