notes: |
  Implements ISSUE-031 (issue→plan reactive track) — adds terminal / end-of-life
  status vocabulary to the four SDLC artifact types that lack it (spec, bundle,
  plan, directive) plus issue, teaches the validators to accept + constrain the
  new states, makes `backstop gate` EXCLUDE terminal-state artifacts from
  enforcement, and reconciles the two confirmed victims (SPEC-001, SPEC-034).

  The issue's Solution section is implementation-ready and authoritative; its
  Resolved Design Decisions (DQ-1..DQ-4) are ratified. ISSUE-031 carries no
  formal CLM array (it is at status `open`), so this plan defines plan-local
  claims (CLM-001..CLM-020) that enumerate every schema-change row, validation
  rule, gate-exclusion behavior, and reconciliation in the Solution. Mapping:

    CLM-001  spec/v1 schema status enum += replaced, canceled, deprecated
    CLM-002  bundle/v1 + bundle/v2 maturity enum += delivered, replaced,
             canceled, deprecated
    CLM-003  plan/v1 schema status enum += replaced, canceled
    CLM-004  directive/v1 directive.status enum += replaced, canceled
    CLM-005  issue/v1 issue.status enum += replaced, canceled (keep closed)
    CLM-006  adr/v2, standard/v1, capability/v1 UNCHANGED (negative pin)
    CLM-007  spec.go accepts the new spec terminal states (schema-driven enum)
    CLM-008  plan.go planStatuses map accepts replaced, canceled
    CLM-009  bundle.go maturityLevels map accepts delivered + retirement states
    CLM-010  directive.go validStatuses map accepts replaced, canceled
    CLM-011  issue.go issueStatuses map accepts replaced, canceled
    CLM-012  status==replaced REQUIRES a well-formed typed replaced-by ref
             (BUNDLE/SPEC/ISSUE/PLAN/DIR-NNN; array allowed); fail-loud when
             missing/malformed (DQ-2)
    CLM-013  status==canceled|deprecated accept an OPTIONAL free-text reason;
             validation never requires it (DQ-2)
    CLM-014  terminal-state artifacts are EXEMPT from the maturity / required-
             section / claim-completeness rules that only apply to live work
             (a replaced spec needs no complete claims; a terminal bundle is
             not held to defined-maturity section requirements)
    CLM-015  gate mandated-test extraction EXCLUDES terminal-status specs
             (DQ-1, the ~622-red fix)
    CLM-016  gate contract_signature enforcement EXCLUDES terminal-status specs
             (DQ-1)
    CLM-017  gate reports an INFORMATIONAL count of excluded terminal artifacts
             (not a warning) (DQ-1)
    CLM-018  reconcile SPEC-001 status: active -> deprecated; validates clean +
             is gate-excluded
    CLM-019  reconcile SPEC-034 status: draft -> replaced, replaced-by:
             BUNDLE-011; validates clean + is gate-excluded
    CLM-020  deprecated is limited to spec + bundle; NOT added to plan,
             directive, or issue (DQ-4 negative pin)

  TESTING CONSTRAINT (sandbox): `go vet` is blocked in the sandbox; tests run via
  `go test` directly. Middle-phase verification tasks therefore use
  `backstop code check` (which the sandbox supports) and the implementer runs
  `go test` for the inner loop. The FINAL phase runs the full `backstop gate`
  over the REAL tree (not the sandbox) plus `backstop artifact validate`.

  TERMINAL-STATE SET (the shared predicate the gate exclusion keys on):
  replaced, canceled, deprecated. For specs this reads from the spec frontmatter
  `status`. The single chokepoint is pkg/gate/step_testverify.go's
  parseSpecFrontmatter / specFrontmatter (consumed by ExtractMandatedTests,
  ExtractSpecVerifications, ExtractContractEntries) — add a Status field there and
  filter at each Extract* site so BOTH the mandated-test step and the contract
  step are gated by one source of truth, with the excluded count returned for the
  informational gate line.

  RECONCILIATION ROUTING: the SPEC-001 / SPEC-034 status edits in Phase 5 are
  artifact edits that route through the spec-author agent at implementation time
  (per the artifact-workflow rule: never hand-edit artifacts). The plan tasks
  describe the target state + the validate/gate-exclusion proof; they do NOT
  authorize hand-editing the .spec.md frontmatter.

  STRUCTURE:
    Phase 1: Schema enum additions (all artifacts/*/schema.json) — pure data,
             with a schema-loading test, then verify.
    Phase 2: Validator acceptance of the new states (spec/plan/bundle/directive/
             issue) — TDD, runs in parallel-disjoint validator files.
    Phase 3: replaced-by enforcement, reason-optional, and terminal-state
             exemption from live-work requirements — TDD.
    Phase 4: Gate exclusion of terminal-state artifacts + informational count
             (the load-bearing ~622-red fix) — TDD.
    Phase 5: Reconcile SPEC-001 + SPEC-034 (via spec-author) and verify the gate
             now excludes them.
    Phase 6: Comprehensive final verification — backstop gate + artifact validate.

phases:
