  # ═══════════════════════════════════════════════════════════════════════
  # Phase 3: replaced-by enforcement, optional reason, terminal exemption
  # ═══════════════════════════════════════════════════════════════════════
  - id: phase-3
    name: "Phase 3: replaced-by Enforcement, Optional reason, Terminal Exemption"
    tasks:
      - id: TASK-009
        type: test
        title: "Tests for replaced-by enforcement, optional reason, and terminal-state exemption from live-work rules"
        description: |
          RED phase covering the three validation rules from DQ-2 + the Solution
          terminal-exemption requirement.

          replaced-by enforcement (CLM-012):
            - A spec/plan/bundle/directive/issue with status (or maturity)
              "replaced" and NO replaced-by field raises a fail-loud violation
              (rule e.g. <type>/replaced-by-required).
            - A "replaced" artifact whose replaced-by is malformed (not matching
              ^(BUNDLE|SPEC|ISSUE|PLAN|DIR)-[0-9]{3}$) raises a
              <type>/replaced-by-malformed violation.
            - A well-formed single ref (e.g. "BUNDLE-011") validates clean.
            - An ARRAY of well-formed refs (multi-absorber) validates clean; an
              array containing one malformed entry raises the malformed
              violation.

          optional reason (CLM-013):
            - A "canceled" artifact WITH a free-text reason validates clean; one
              WITHOUT reason ALSO validates clean (reason is never required).
            - Same for "deprecated" on spec + bundle.

          terminal exemption (CLM-014):
            - A spec with status "replaced" (+ replaced-by) and NO claims / NO
              complete Verification block does NOT raise the live-work
              completeness violations (claim-completeness, claim-tests-empty,
              etc.) that a draft/ready spec would.
            - A bundle with maturity "deprecated" is NOT held to the
              defined/ready required-section + requirements[] gates.
            - An issue with status "replaced" is NOT held to the
              closed/ready traceability requirement (REQ→CLM→tests).

          Mandated test names: TestValidate_ReplacedRequiresReplacedBy,
          TestValidate_ReplacedByMustBeTypedRef,
          TestValidate_ReplacedByAcceptsArray,
          TestValidate_CanceledDeprecatedReasonOptional,
          TestValidateSpec_TerminalExemptFromClaimCompleteness,
          TestValidateBundle_TerminalExemptFromMaturityGates,
          TestValidateIssue_TerminalExemptFromTraceability.
          Add fixtures under pkg/validate/testdata/terminal/. These fail until
          TASK-010..TASK-011 land. Depends on the Phase-2 acceptance tests +
          impls (the statuses must already be legal before enforcing the
          conditional rules).
        files:
          - pkg/validate/terminal_rules_test.go
          - pkg/validate/testdata/terminal/spec-replaced-no-replacedby.spec.md
          - pkg/validate/testdata/terminal/spec-replaced-malformed.spec.md
          - pkg/validate/testdata/terminal/bundle-deprecated-mingate.bundle.md
          - pkg/validate/testdata/terminal/issue-replaced-no-traceability.issue.md
        claims:
          - CLM-012
          - CLM-013
          - CLM-014
        depends_on:
          - TASK-008

      - id: TASK-010
        type: implementation
        title: "Implement shared replaced-by enforcement + optional-reason helper and wire into all five validators"
        description: |
          GREEN phase for the conditional status rules. Add a shared helper (e.g.
          validateRetirementFields in a new pkg/validate/terminal.go) that, given
          an artifact's status/maturity and frontmatter:
            - when status == "replaced": require a replaced-by field; accept a
              single string OR a []string; each value MUST match
              ^(BUNDLE|SPEC|ISSUE|PLAN|DIR)-[0-9]{3}$. Emit
              <type>/replaced-by-required (absent) or <type>/replaced-by-malformed
              (bad ref) — fail-loud, error severity (CLM-012).
            - when status == "canceled" or "deprecated": a "reason" field MAY be
              present (any string) but is NEVER required — emit nothing for its
              absence (CLM-013).
          Wire this helper into Spec, Plan, Bundle, Directive, Issue validators,
          passing each the type-specific rule prefix and the terminal-state set
          appropriate to that type (deprecated only meaningful for spec/bundle).
          This task edits the five validator files; it depends on TASK-009 (TDD)
          AND on the Phase-2 impl tasks (TASK-005/006/007) because it edits the
          SAME validator files (serializes the shared-file edit per D-081).
        files:
          - pkg/validate/terminal.go
          - pkg/validate/spec.go
          - pkg/validate/plan.go
          - pkg/validate/bundle.go
          - pkg/validate/directive.go
          - pkg/validate/issue.go
        claims:
          - CLM-012
          - CLM-013
        depends_on:
          - TASK-009
          - TASK-005
          - TASK-006
          - TASK-007

      - id: TASK-011
        type: implementation
        title: "Exempt terminal-state artifacts from live-work completeness/maturity/traceability rules"
        description: |
          GREEN phase for the terminal exemption (CLM-014). Add a single
          isTerminalStatus predicate (in pkg/validate/terminal.go) over
          {replaced, canceled, deprecated} and guard the live-work-only
          requirement checks so a terminal artifact is not held to them:
            - spec.go: when status is terminal, SKIP the claim-completeness /
              claim-tests-empty / claim→requirement live-work checks (a replaced
              spec must validate with no/partial claims). Keep structural checks
              (filename, status enum, replaced-by) active.
            - bundle.go: when maturity is terminal, SKIP validateMaturityGates +
              validateBundleRequirements (the defined/ready required-section and
              requirements[] gates). Keep core bundle-block + replaced-by checks.
            - issue.go: when status is terminal (replaced/canceled), exclude it
              from the traceabilityRequired set so REQ→CLM→tests is not enforced.
          This is a precise relaxation: a retired artifact validates cleanly
          while live artifacts keep full rigor. Edits spec.go, bundle.go,
          issue.go (subset of TASK-010's files) — depends on TASK-010 to
          serialize the shared-file edits, and on TASK-009 (TDD).
        files:
          - pkg/validate/spec.go
          - pkg/validate/bundle.go
          - pkg/validate/issue.go
        claims:
          - CLM-014
        depends_on:
          - TASK-009
          - TASK-010

      - id: TASK-012
        type: verification
        title: "Verify replaced-by enforcement + exemption via backstop code check"
        description: |
          Fast inner-loop verification. Run `backstop code check` to confirm the
          shared terminal helper + the five validator wirings + the exemption
          guards build and that all Phase-3 tests (TASK-009) pass. Use the
          backstop CLI surface only. Covers CLM-012, CLM-013, CLM-014.
        files:
          - pkg/validate/terminal.go
          - pkg/validate/spec.go
          - pkg/validate/issue.go
        claims:
          - CLM-012
          - CLM-013
          - CLM-014
        depends_on:
          - TASK-010
          - TASK-011

  # ═══════════════════════════════════════════════════════════════════════
  # Phase 4: Gate excludes terminal-state artifacts (the ~622-red fix)
  # ═══════════════════════════════════════════════════════════════════════
  - id: phase-4
    name: "Phase 4: Gate Excludes Terminal-State Artifacts From Enforcement"
    tasks:
      - id: TASK-013
        type: test
        title: "Tests proving terminal-status specs are excluded from mandated-test + contract enforcement, with an informational excluded count"
        description: |
          RED phase for the load-bearing gate-exclusion behavior (DQ-1). Use
          testdata spec fixtures: one ACTIVE spec mandating a test name that does
          NOT exist (would normally fail test_verification) and declaring a
          contract for a deleted symbol (would normally fail contract_signature),
          plus a copy of the SAME spec marked status "replaced" (with valid
          replaced-by) and another marked "deprecated".

          Assert:
            - ExtractMandatedTests over the fixture spec dir SKIPS specs whose
              status is terminal (replaced/canceled/deprecated): a deprecated
              spec's mandated tests are NOT returned, so its missing test does
              NOT produce a test_verification failure (CLM-015).
            - ExtractContractEntries (and ExtractSpecVerifications) likewise SKIP
              terminal-status specs, so a replaced spec's dead contract is NOT
              enforced (CLM-016).
            - The active control spec is STILL extracted/enforced (proves the
              filter is status-scoped, not a blanket skip).
            - The extraction surfaces a COUNT of excluded terminal specs that the
              gate can report (CLM-017) — assert the count equals the number of
              terminal fixtures.

          Mandated test names:
          TestExtractMandatedTests_SkipsTerminalSpecs,
          TestExtractContractEntries_SkipsTerminalSpecs,
          TestExtractSpecVerifications_SkipsTerminalSpecs,
          TestGateExclusion_DeprecatedSpecMandatedTestsNotEnforced,
          TestGateExclusion_ReplacedSpecContractsNotEnforced,
          TestGateExclusion_ReportsExcludedCount.
          Place in pkg/gate/terminal_exclusion_test.go with fixtures under
          pkg/gate/testdata/terminal/. Fails until TASK-014. Depends on Phase-3
          (terminal vocabulary + validation must exist first).
        files:
          - pkg/gate/terminal_exclusion_test.go
          - pkg/gate/testdata/terminal/spec-active-broken.spec.md
          - pkg/gate/testdata/terminal/spec-deprecated-broken.spec.md
          - pkg/gate/testdata/terminal/spec-replaced-broken.spec.md
        claims:
          - CLM-015
          - CLM-016
          - CLM-017
        depends_on:
          - TASK-012

      - id: TASK-014
        type: implementation
        title: "Add a Status field + terminal filter to the spec-frontmatter extraction chokepoint"
        description: |
          GREEN phase. pkg/gate/step_testverify.go is the single chokepoint:
          specFrontmatter is parsed by parseSpecFrontmatter and consumed by
