          - pkg/validate/testdata/terminal/spec-deprecated.spec.md
          - pkg/validate/testdata/terminal/plan-replaced.plan.yml
          - pkg/validate/testdata/terminal/bundle-delivered.bundle.md
          - pkg/validate/testdata/terminal/directive-canceled.directive.md
          - pkg/validate/testdata/terminal/issue-replaced.issue.md
        claims:
