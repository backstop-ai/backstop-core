  # ═══════════════════════════════════════════════════════════════════════
  # Phase 2: Validators accept the new terminal states
  # ═══════════════════════════════════════════════════════════════════════
  - id: phase-2
    name: "Phase 2: Validators Accept Terminal States"
    tasks:
      - id: TASK-004
        type: test
        title: "Validator-acceptance tests: each new terminal state validates as a legal status"
        description: |
          RED phase. Add fixture-driven tests asserting each validator now
          ACCEPTS the new terminal status values (no spec/invalid-status,
          plan/invalid-status, bundle/maturity, directive/invalid-status,
          issue/invalid-status violation is raised). For replaced-status
          fixtures, include a well-formed replaced-by so this acceptance test is
          not entangled with the Phase-3 replaced-by enforcement.

            - spec.go: a spec with status "deprecated" and one with "canceled"
              validate without a spec/invalid-status violation; a "replaced"
              spec WITH a valid replaced-by validates clean (CLM-007).
            - plan.go: a plan with status "replaced" (valid replaced-by) and one
              with "canceled" validate without plan/invalid-status (CLM-008).
            - bundle.go: a bundle with maturity "delivered", "canceled",
              "deprecated", and "replaced" (valid replaced-by) validate without a
              maturity violation (CLM-009).
            - directive.go: a directive with status "replaced" (valid
              replaced-by) and one with "canceled" validate without
              directive/invalid-status (CLM-010).
            - issue.go: an issue with status "replaced" (valid replaced-by) and
              one with "canceled" validate without issue/invalid-status, and
              "closed" still validates (CLM-011).

          Mandated test names: TestValidateSpec_AcceptsTerminalStates,
          TestValidatePlan_AcceptsRetirementStates,
          TestValidateBundle_AcceptsDeliveredAndRetirementMaturity,
          TestValidateDirective_AcceptsRetirementStates,
          TestValidateIssue_AcceptsRetirementStatesKeepsClosed.
          Add fixtures under pkg/validate/testdata/terminal/. These tests fail
          until TASK-005..TASK-007 land. Depends only on the schema phase
          (TASK-003) so the loaded schema enums back the spec validator.
        files:
