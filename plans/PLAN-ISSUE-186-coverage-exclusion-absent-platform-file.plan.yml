plan_id: PLAN-ISSUE-186
spec_id: ISSUE-186
created: "2026-08-24"
status: draft
target_repo: backstop-core
target_module: github.com/backstop-ai/backstop-core
test_command: "go test ./cmd/backstop/... -run 'TestGoToolchainCoverageExclusions' -count=1"
coverage_threshold: 80

notes: |
  This is one cross-repository delivery unit. The durable behavior change lives in
  /Users/bmanson/src/projects/backstop-go-toolchain-pack; backstop-core supplies the
  executable regression/adoption guard and adopts only the published release through
  backstop.yml and backstop.lock. Nothing under .backstop/packs is hand-edited.

  Existence-in-world was checked against plans/, specs/, ISSUE-186, PLAN-ISSUE-045,
  PLAN-ISSUE-179, and PLAN-ISSUE-185. PLAN-ISSUE-185 owns the sandbox implementation
  and creates the failing pkg/packval/sandbox_nonlinux.go diff, but does not repair the
  external pack's exclusion producer/converter. No other artifact owns this residual.

  Version 1.9.0 is the planned release: 1.8.0 is current and the new synthetic record
  behavior is additive pack behavior, matching the prior minor-bump precedent. Stop
  rather than substituting a patch version if release review rejects that classification.

  Execution is prohibited until this plan passes the real artifact validator and an
  independent plan-review pass is CLEAN. Publishing the public pack tag and pushing the
  core PR branch each require explicit authorization at their named tasks. All long
  commands run in the foreground. Invalid UTF-8, NUL, and unterminated EOF input remain
  explicitly outside the promised portable sh/awk fixture domain from ISSUE-186.

phases:
  - id: phase-1
    name: "Phase 1: RED/GREEN Portable Producer and Converter Protocol"
    tasks:
      - id: TASK-001
        type: test
        title: "RED: add the portable real-script fixture harness for all exclusion behavior"
        description: |
          Add one focused cmd/backstop test file containing the seven exact behavioral
          tests below. A shared harness must execute the real producer and converter via
          /bin/sh in temporary project directories, not reimplement either script in Go.
          It resolves the pack root from BACKSTOP_GO_TOOLCHAIN_PACK_ROOT when explicitly
          set; local RED/GREEN runs set it to
          /Users/bmanson/src/projects/backstop-go-toolchain-pack, while ordinary core CI
          resolves the installed locked pack. Missing or malformed scripts fail, never
          silently skip. Use only POSIX fixtures and valid UTF-8, NUL-free, LF-terminated
          declaration files within ISSUE-186's supported domain.

          The producer fixture must provide a deterministic go shim/profile/stamp so it
          exercises declaration parsing without a real suite run, then feed the produced
          enriched profile to the real converter. Assert literal TAB framing, exactly one
          directive per accepted declaration, and no echo/default-field reconstruction.
          The converter corpus covers: an exclusion-only sandbox_nonlinux.go; collisions
          with profile and GoFiles records; duplicate last-justification-wins with first
          representation position; profile then GoFiles-only then exclusion-only order;
          repeated byte-identical output; decoded UTF-8/path/justification equality;
          quotes, backslashes, SP/HT/CR/FF/VT escaping; CR-before-LF preservation; all
          enumerated canonical-path, comment, empty/whitespace-only, and forbidden-C0
          rejections; malformed injected directives dropped defensively; and no generic
          synthesis without an accepted declaration. Assert exclusion-only records are
          exactly path, 0/0, measured:false, excluded:true, metric:statement, and exact
          justification, while existing records retain every other field and position.

          Run the seven named tests with the source override and record the current RED:
          the shipped space-framed producer loses raw values and the converter emits no
          record for an exclusion absent from profile and GoFiles order. Do not edit the
          external scripts in this task.
        files:
          - cmd/backstop/go_toolchain_coverage_exclusions_test.go
        test_names:
          - TestGoToolchainCoverageExclusions_AbsentBuildTaggedFileEmitsExcludedRecord
          - TestGoToolchainCoverageExclusions_ExistingRecordsAnnotatedWithoutDuplicates
          - TestGoToolchainCoverageExclusions_DuplicateDeclarationsLastWinsFirstPosition
          - TestGoToolchainCoverageExclusions_DeterministicOrderAndJSONEscaping
          - TestGoToolchainCoverageExclusions_DeclarationGrammarAndPortableWhitespaceCases
          - TestGoToolchainCoverageExclusions_NoDeclarationDoesNotSynthesize
          - TestGoToolchainCoverageExclusions_TabFramedProtocolIsLosslessAndPackOwned
        claims:
          - CLM-001
          - CLM-002
          - CLM-003
          - CLM-004
          - CLM-005
        depends_on: []

      - id: TASK-002
        type: test
        title: "RED: pin installed release identity and tracked core adoption without git or network"
        description: |
          Extend the same focused core test file with the final two exact tests. This task
          depends only on TASK-001, another test task, so both release/adoption guards exist
          before and independently of every implementation task.

          TestGoToolchainCoverageExclusions_ReleasedTagMatchesManifest must use only local,
          reproducible installed-pack identity after a real `./bin/backstop pack install` or
          `pack update`: read backstop.lock's backstop-ai/go-toolchain version, git_ref,
          source_type, and source_coordinate; parse the installed pack.yml version; recompute
          the installed tree content hash with the production distribution hash implementation;
          and require all values agree with version 1.9.0, git_ref v1.9.0, source_type git,
          source_coordinate backstop-ai/go-toolchain, and the tracked content_hash. It must
          not inspect `.git`, a candidate checkout, `git ls-remote`, GitHub, or any network.
          TASK-008 separately supplies remote tag-integrity workflow evidence for CLM-006.

          TestGoToolchainCoverageExclusions_ReleasedPackIsAdopted must read tracked
          backstop.yml and backstop.lock, require the same exact 1.9.0/v1.9.0 declaration,
          and require the installed manifest and scripts to be present and carry the released
          behavior. There are no skip branches: run real `pack install` first, and treat an
          absent, malformed, hash-mismatched, or stale installed fleet as a test failure.

          PRE-RELEASE RED: after real `./bin/backstop pack install`, run only these two exact
          tests and record both failing against the current tracked/installed 1.8.0 identity.
          They remain intentionally red and are not included in pre-release GREEN commands.
          Do not weaken, skip, or add network conditions to permit release work.
        files:
          - cmd/backstop/go_toolchain_coverage_exclusions_test.go
        test_names:
          - TestGoToolchainCoverageExclusions_ReleasedTagMatchesManifest
          - TestGoToolchainCoverageExclusions_ReleasedPackIsAdopted
        claims:
          - CLM-006
          - CLM-007
        depends_on:
          - TASK-001

      - id: TASK-003
        type: implementation
        title: "GREEN: make producer framing and converter exclusion synthesis lossless"
        description: |
          Edit only the two absolute source-pack scripts. In coverage-produce.sh, replace
          cut/echo/whitespace reconstruction with shared explicit validation of the first
          literal TAB split and ISSUE-186's canonical path/control/substantive-justification
          grammar. Preserve the complete remainder and emit accepted declarations only via
          printf '#backstop-coverage-exclude\t%s\t%s\n'. Keep invalid UTF-8, NUL, and an
          unterminated EOF tail outside the claimed detection domain; do not claim they are
          rejected portably.

          In coverage-to-records.sh, recognize only marker-plus-literal-TAB, split the raw
          remainder at its first TAB, defensively apply the same in-domain grammar, retain
          first declaration order and last accepted reason per path, and never use $1/$2,
          NF, default awk splitting, trimming, or rebuilt fields for this protocol. Annotate
          an existing profile or GoFiles-derived record in place. After those passes, append
          one synthetic measured:false 0/0 statement record for each accepted exclusion path
          still unrepresented, in first exclusion order. Deduplicate all representations.
          Expand JSON escaping for quote, backslash, HT, CR, FF, and VT so decoding exactly
          recovers accepted UTF-8 text. Do not add a generic absent-file pass, invoke go from
          the converter, or add any core language/platform branch.

          PRE-RELEASE GREEN: with BACKSTOP_GO_TOOLCHAIN_PACK_ROOT set to the absolute source
          repo, run exactly the seven behavioral tests declared by TASK-001 and require all
          seven to pass by name. Do not run or expect green from TASK-002's two identity tests;
          they correctly remain red until the published release is adopted in TASK-009.
        files:
          - /Users/bmanson/src/projects/backstop-go-toolchain-pack/scripts/coverage-produce.sh
          - /Users/bmanson/src/projects/backstop-go-toolchain-pack/scripts/coverage-to-records.sh
        claims:
          - CLM-001
          - CLM-002
          - CLM-003
          - CLM-004
          - CLM-005
        depends_on:
          - TASK-001
          - TASK-002

      - id: TASK-004
        type: verification
        title: "Validate the source pack through the real core CLI while adoption guards stay red"
        description: |
          Confirm TASK-003's source-override run produced seven named PASS results and did
          not run the two adoption guards. Then run both
          `./bin/backstop pack check /Users/bmanson/src/projects/backstop-go-toolchain-pack`
          and `./bin/backstop pack test /Users/bmanson/src/projects/backstop-go-toolchain-pack`.
          Record status, every warning, and phase-3's honest fixture count; pack test is
          required validation but the seven real-script tests, not an empty pack fixture
          phase, are the behavioral falsifier. Re-run identical converter input twice and
          compare bytes. Any new error, warning, skipped named test, non-determinism, or
          direct edit under core's installed pack blocks release work.
        files:
          - cmd/backstop/go_toolchain_coverage_exclusions_test.go
          - /Users/bmanson/src/projects/backstop-go-toolchain-pack/scripts/coverage-produce.sh
          - /Users/bmanson/src/projects/backstop-go-toolchain-pack/scripts/coverage-to-records.sh
          - /Users/bmanson/src/projects/backstop-go-toolchain-pack/pack.yml
        claims:
