  ── PR #1 RAN (run 30383453888): RED, LEGIBLE, AND TWO CLAIMS CLOSED ───────
  The first pull_request-event run, and the first time a sandbox failure arrived
  carrying its own reason.

  CLOSED BY THIS RUN:
    - CLM-019's PULL_REQUEST half. `base.sha` derived, merge-base exact, 6 files in
      scope — non-empty, through the SAME code path the push event uses. Both
      halves of CLM-019 are now proven on real runs.
    - CLM-038 and CLM-039, IN PRODUCTION rather than in a unit test. The fold
      carried the helper's diagnostic through a real failure, verbatim:
        "install the sandbox restrictions:
         landlock_add_rule(/etc/ld.so.cache, 0xc): invalid argument"
      That string is the entire value of Phase 4b. The previous run failed the same
      way and said nothing.

  THE DEFECT IT EXPOSED — A DIRECTORY-ONLY RIGHT ON A REGULAR FILE:
    `landlockReadRights()` (`sandbox_capability.go:219-221`) returns
    `AccessFSReadFile | AccessFSReadDir` — 0xc — UNIFORMLY for every readable path.
    `sandbox_linux.go:190-212` applies that mask per path. `/etc/ld.so.cache`
    (`sandbox_capability.go:134`) is a REGULAR FILE, and the kernel rejects a
    `path_beneath` rule carrying a DIRECTORY-ONLY right on a non-directory: EINVAL,
    helper refuses, exit 126. Landlock itself is fine — ABI 7, live, working
    exactly as documented.

    SCOPE OF THE NARROWING, answered from source rather than assumed. READ_DIR is
    the only directory-only right that can reach a rule TODAY — and only BY
    ACCIDENT OF DARWIN PARITY, because the writable-path list is empty BY MANDATE
    (an empty writable set is the parity requirement, not a design margin). The
    family has TEN members: READ_DIR plus the nine directory-only bits in
    `landlockWriteRights()` (`sandbox_capability.go:209-214`) — REMOVE_DIR,
    REMOVE_FILE, MAKE_CHAR, MAKE_DIR, MAKE_REG, MAKE_SOCK, MAKE_FIFO, MAKE_BLOCK,
    MAKE_SYM — with only WRITE_FILE applying to a file. Every one would EINVAL
    identically the day anything grants a writable path, and there are two named
    routes to that day: a future capability, and BUNDLE-021 OQ-2's scratch-space
    question. So the fix narrows by the DIRECTORY-ONLY FAMILY, never by
    special-casing READ_DIR. Same code size; one leaves a latent trap armed.

    AND THE FIX DOES NOT BELONG IN THE HANDLED MASK. The kernel's validation is on
    a `path_beneath` rule's `allowed_access` against the INODE TYPE — the
    `handled_access_fs` mask is not subject to that check at all. Narrowing the
    handled mask would therefore fix nothing and would silently un-restrict those
    operations everywhere.

  STATED FACT, SO NOBODY "FIXES" IT: RULE INSTALL IS ALL-OR-NOTHING. One rejected
  `landlock_add_rule` aborts the whole install (`sandbox_linux.go` returns on the
  first non-zero errno), the helper refuses, and nothing runs. It does NOT degrade
  into a partial sandbox. That is FAIL-CLOSED AND CORRECT — a partial install is a
  sandbox with an unannounced hole, which is strictly worse than no sandbox because
  it reports success. One bad path taking the whole install down is the behavior we
  want, and it is recorded here because it reads like a robustness bug to anyone
  meeting it cold. Do not "harden" it into skip-the-bad-rule-and-continue.

