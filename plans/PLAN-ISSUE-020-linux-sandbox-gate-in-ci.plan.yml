    `--file` is silently dropped. The blocking CI job must never use `--file`.
  - A STALE `bin/backstop` gates the OLD code and reports a vacuous green. Rebuild
    before every gate run, in tasks and in CI alike.
  - `base-engines` is embedded in the binary (`embed.go`, `BaseEnginesFS`) and
    ships one ast-grep convert script. So even a bare install with zero user packs
    hits the sandboxed convert path on Linux — this defect is not reachable only
    through exotic third-party packs.

  ── REQUIREMENTS / CLAIMS (plan-local, derived from ISSUE-020) ─────────────
  ISSUE-020 is at `open` status and records no claims. The ledger below is derived
  from its Acceptance criteria (2026-07-26), its Decision packet (2026-07-27), its
  Spike results (2026-07-27), and the founder rulings of 2026-07-28.

    REQ-001: The pack fleet is materializable on a fresh checkout.
      CLM-001  every backstop.lock entry resolves either from a public remote at a
               pinned tag or from a path INSIDE the repository; no entry depends
               on a path outside it.
      CLM-002  the three `backstop/*` packs move to their published `backstop-ai/*`
               v1.2.0 coordinates, whose trees are byte-identical to the installed
               1.1.0 trees except `name:` and `version:` — so the migration changes
               no rule content and introduces no new findings from the rule set.
      CLM-003  no stale artifact of an old coordinate survives where it could
               change behavior: no old backstop.yml key, no old lock entry, no
               `.backstop/packs/backstop/<pack>` directory, and no LIVE KEYING on
               an old coordinate anywhere in real-repo Go — no string literal, map
               key, path join or comparison. Doc-comment MENTIONS of a retired
               coordinate are explicitly permitted and are not a violation; so are
               the four named synthetic carriers. The claim is about what the code
               keys on, not about what the prose says.
      CLM-004  after the migration `go test ./... -race -count=1` is green and a
               REBUILT `./bin/backstop gate` passes — the migration's falsifier.

    REQ-002: The gate accepts an explicit diff base.
      CLM-005  `gate --base <rev>` scopes the run to files changed since
               merge-base(HEAD, rev), plus untracked files — identical to bare diff
               mode in every other respect.
      CLM-006  `--base` produces a NON-empty scope on a pristine, fully-committed
               working tree (the CI condition), where bare diff mode sees nothing.
      CLM-007  BOTH failure modes of base resolution are exit-2 config errors that
               name what failed — a rev that does not resolve at all, AND a rev
               that resolves but shares no merge-base with HEAD (unrelated
               histories, the shape a force-push or a grafted shallow clone
               produces). Neither ever falls back to `--all`, to HEAD, or to an
               empty scope.
      CLM-008  `--base` combined with `--all` or `--file` is an exit-2 config error.
      CLM-009  ONE diff resolver: `ComputeGateScope` keeps its exact signature and
               delegates to the base-aware function with an empty base, so the 40+
               existing call sites are untouched and no second implementation of
               "what changed" exists.
      CLM-010  the run reports scope mode, the requested base, the resolved
               merge-base SHA and the in-scope file count in both human and JSON
               output, so an empty CI scope is VISIBLE rather than silent.

    REQ-003: A Linux sandbox with darwin-parity denials.
      CLM-011  an internal capability struct — readable paths, writable paths,
               network bool — is what the Linux invocation is BUILT from, not a
               second hardcoded profile literal, and it carries a code comment at
               its definition site pointing at BUNDLE-021 OQ-2.
      CLM-012  graduated-profile-capable: changing the capability set changes the
               argv (network allowed drops `--unshare-net`; an added readable path
               adds a `--ro-bind`), proven by a pure-function argv test that runs
               on any platform including darwin.
      CLM-013  on linux both `SandboxedRun` and `SandboxedRunStdout` EXECUTE the
               command under bubblewrap with the spike's corrected invocation plus
               the packDir bind and chdir, with deny-network, no writable paths,
               and no readable project path outside packDir.
      CLM-014  the falsifiable assertion triple holds on a real Linux host: read of
               an unbound path is denied; `getent hosts` under `--unshare-net`
               exits non-zero; the SAME command WITHOUT `--unshare-net` exits zero
               — the control leg that proves the denial is the sandbox and not an
               unrelated failure. These assertions EXECUTE in the CI run: the
               go-toolchain pack's go-test engine runs `go test` project-wide
               (`project_target: "./..."`, package-scoped), so a new
               `//go:build linux` test file is compiled and run by the gate itself
               and lands in diff scope as a new file. This is a determined fact,
               not a hope — no separate CI step is needed to exercise it.
      CLM-015  when the mechanism is unavailable the call returns an explicit error
               naming the mechanism and ISSUE-020 — never a silent pass-through to
               an unsandboxed exec, and the Linux execution tests FAIL rather than
               skip when bwrap is absent.
      CLM-016  darwin is untouched: `darwinSandboxProfile` is unchanged and every
               existing darwin sandbox test passes unmodified.
      CLM-017  the exported interface is unchanged — no caller in
               `pkg/packval/executor.go` or `cmd/backstop/pack_gate.go` changes.

    REQ-004: CI blocks on the real gate, diff-scoped, on push AND pull_request.
      CLM-018  ci.yml's blocking job builds the binary, installs the locked packs,
               and runs `backstop gate --base <derived>`; no raw golangci-lint, raw
               `go test`, or hand-rolled coverage-threshold step survives in it.
      CLM-019  the base is derived PER EVENT — pull_request uses the PR base sha,
               push uses the before sha — and the guard is a RESOLVABILITY check,
               not a zero-SHA string comparison: the derived value is only used
               once `git rev-parse --verify` confirms it exists in the fetched
               history. Empty, all-zeros (branch creation) AND non-zero-but-
               unreachable (the force-push shape) all take the same loud `HEAD^`
               fallback, and the job fails hard when `HEAD^` does not resolve
               either.
      CLM-020  checkout fetches full history (`fetch-depth: 0`) so both refs
               resolve; a shallow checkout is what makes the PR base unresolvable.
      CLM-021  the job puts every declared Layer-0 and pinned tool on PATH, each
               from a NAMED authority: go from setup-go via `go-version-file:
               go.mod`; semgrep 1.96.0 and ast-grep 0.43.0 from the allowlist
               (`pkg/pack/engine/allowlist.go`); golangci-lint from an explicit
               v2.6.0 pin IN ci.yml, because the allowlist has no entry for it and
               go.mod's v1.64.8 tool directive would break the pack's v2-only
               `--output.sarif.path` command; bubblewrap pinned by the runner's
               package install. A missing tool stays a loud exit-2, never a skipped
               dimension.
      CLM-022  a `pack install` failure fails the job BEFORE the gate runs, so the
               gate never executes against a partially materialized fleet.
      CLM-023  the temporary probe workflow is removed by the same change that
               lands the real blocking job.
      CLM-029  the `baseline` job installs the locked packs before generating, so
               converting all six lock entries from local to git does NOT turn one
               `missing_pack` failure into six inside the published baseline
               artifact. This keeps the "do not make ISSUE-086 worse" constraint
               true; it does not claim to close ISSUE-086.

    REQ-005: File-granularity activation — "green if the diff is green", and no
             grandfather on a touched file.
      CLM-024  a run whose diff touches a file carrying a PRE-EXISTING baselined
               finding exits NON-ZERO and names that finding — "it was there
               before, my changes are clean" does not pass.
      CLM-025  a run whose diff touches only clean files exits ZERO even while the
               repository still carries its known whole-repo debt.

    REQ-006: Proven on the real runner, not simulated.
      CLM-026  the ubuntu-latest probe values — apparmor_restrict_unprivileged_
               userns, bwrap presence and version, kernel release, Landlock ABI —
               are CAPTURED from real output, and the mechanism choice is confirmed
               against them or escalated.
      CLM-027  a real `backstop gate` run on ubuntu-latest shows the pack_engines
               and coverage dimensions ACTUALLY EXECUTING — not capability_absent,
               not errored — proven by that run's own JSON.
      CLM-028  the acceptance criterion is closed ONLY by TASK-019's real CI run.
               No local result, and no green unit test over the sandbox, may be
               reported as satisfying it.

phases:
  - id: phase-1
    name: "Phase 1: Make the pack fleet materializable on a fresh checkout"
    tasks:
      - id: TASK-001
        type: setup
        title: "Probe the real ubuntu-latest runner for the sandbox mechanism facts"
        description: |
          Add a TEMPORARY workflow that answers ISSUE-020's re-probe list on a real
          GitHub Actions Linux runner. The spike's Docker test bed could not answer
          these — LinuxKit compiles in neither AppArmor nor Landlock, so any
          container-derived answer would be a false negative.

          Trigger it on `push` to branches matching `probe/**` so it can run from a
          side branch without touching main. Run every item and print raw output;
          do not summarize inside the workflow.

          Ordered by load-bearingness (this order is from the issue):
            1. `cat /proc/sys/kernel/apparmor_restrict_unprivileged_userns`
               — decisive for the bwrap path. READ IT. DO NOT ASSUME THE VALUE.
            2. the corrected bwrap invocation, run as the unprivileged runner user:
                 bwrap --ro-bind /usr /usr --symlink usr/bin /bin \
                   --symlink usr/lib /lib --symlink usr/lib64 /lib64 \
                   --unshare-user --unshare-net --dev /dev --proc /proc /bin/true
            3. the falsifiable assertion triple (unbound-path read denied;
               `getent hosts` under --unshare-net non-zero; the same command
               WITHOUT --unshare-net exit 0).
            4. Landlock ABI probe (expect ABI 5+ on a real GHA kernel; the spike
               has ZERO signal here, so this is new information either way).
            5. `--unshare-pid` with `--proc` (the masked-/proc failure in the
               container was a Docker artifact and may not reproduce).
            6. `unshare -Urn` plus `aa-status`.
            7. `uname -r`, `/sys/kernel/security/lsm`, and whether `bwrap` is
               preinstalled or needs `apt-get install -y bubblewrap` — including
               `bwrap --version`.

          Push the probe branch, let the run finish, and CAPTURE the real output.

          THEN COMMIT IT. Write the captured output VERBATIM to
          `pkg/packval/testdata/ubuntu-runner-probe.txt`, with a header recording
          the runner image label, the date, and the workflow run URL. A task report
          is not a durable landing place: TASK-011 and TASK-012 may be executed by a
          different session with none of this conversation, and the whole point of
          the probe is that the mechanism choice rests on measured values rather
          than on assumptions about Ubuntu. Captured-from-real-output is also the
          repo's standing rule for fixtures — a probe record fabricated or
          paraphrased from memory is worse than none.

          These values are the evidence for CLM-026 and the input TASK-012's
          mechanism commitment is checked against.

          IF item 1 or item 2 falsifies the bubblewrap path, STOP AND ESCALATE with
          the captured output. Do not silently switch to Landlock+seccomp, and do
          not weaken the sandbox to make a job go green — the mechanism contest is
          a founder-level call, not an implementation detail.
        files:
          - .github/workflows/linux-sandbox-probe.yml
          - pkg/packval/testdata/ubuntu-runner-probe.txt
        claims:
          - CLM-026
        depends_on: []

      - id: TASK-002
        type: test
        title: "Falsifier: every locked pack must be materializable from a fresh clone"
        description: |
          Write the test that is RED today and that the migration turns green. Put
          it at the repo ROOT in `package backstopcore_test`, alongside the existing
          `workflows_test.go` and `release_config_test.go` — the root package is
          where this repo's tests about its own configuration already live, and it
          is the only package that can reach `backstop.lock` without `../..` games.

          `TestBackstopLock_EveryEntryIsCIMaterializable` parses the real
          `backstop.lock` and asserts, for EVERY entry:
            - `source_type: git` entries carry a non-empty `version` and a
              `source_coordinate`, OR
            - `source_type: local` entries carry a non-empty `local_path` that
              resolves to a directory INSIDE the repository root.
          An entry with no `local_path`, or whose `local_path` escapes the
          repository root (any resolved path outside it — `../` is the shape that
          matters), FAILS. Name the offending pack in the failure message.

          `TestBackstopYmlAndLock_DeclareTheSameCoordinates` asserts the
          `backstop.yml` `packs:` keys and the `backstop.lock` keys are the same
          set. This is the falsifier for migration step 2 — `pack add` leaves the
          old backstop.yml key behind and nothing else complains.

          `TestNoLiveKeyingOnRetiredPackCoordinates` — the falsifier for CLM-003's
          Go leg, and the reason that claim is worded around KEYING rather than
          around textual absence. Walk `pkg/`, `cmd/` and `tests/` with `go/parser`
          in `ParseComments` mode and inspect only `*ast.BasicLit` string values —
          NOT raw file bytes. A retired coordinate appearing in a doc comment is
          permitted (the reviewer verified the survivors at
          `cmd/backstop/gate.go:442,475,484`, `pack_separation.go:13` and
          `gate_substantiveness_e2e.go:102` are comments with no live keying); a
          retired coordinate appearing in a string literal is a failure, because a
          literal is what a map key, a path join or a comparison is built from.

          Exempt the four named synthetic carriers by path — the two
          `pkg/gate/testdata/self-rule/` fixtures,
          `pkg/pack/distribution/contracts_provisioning_test.go`, and
          `tests/smoke/smoke_test.go` — with the reason for each exemption written
          in the test, not just the path. An unexplained exemption list decays into
          a place to hide failures. The repo already uses go/ast for absence tests;
          follow that precedent rather than grepping.

          These are dogfood tests over the REAL repo state, not synthetic fixtures.
          Assert on parsed YAML and parsed Go, never on golden text.

          Expected state after this task: BOTH RED, naming
          backstop/contracts, backstop/go-toolchain, backstop/substantiveness
          (no local_path) and backstop-ai/backstop-self, backstop-ai/go-standards
          (local_path escapes the repo). Report the red output.
        files:
          - pack_fleet_test.go
        claims:
          - CLM-001
          - CLM-003
        depends_on: []

      - id: TASK-003
        type: implementation
        title: "Migrate the pack fleet to remote coordinates at pinned tags"
        description: |
          Turn TASK-002 green by moving all five non-git lock entries to public
          remote coordinates at pinned tags. Follow the seven-step sequence in the
          plan notes EXACTLY — steps 2 through 7 all fail silently.

          The five `pack add` invocations:
            ./bin/backstop pack add backstop-ai/go-contracts@1.2.0
            ./bin/backstop pack add backstop-ai/go-substantiveness@1.2.0
            ./bin/backstop pack add backstop-ai/go-toolchain@1.2.0
            ./bin/backstop pack add backstop-ai/backstop-self@1.1.2
            ./bin/backstop pack add backstop-ai/go-standards@1.2.1

          The last two are same-version local->git conversions; their names are
          already correct, so they are pure source-type changes with no rename
          fallout. The first three are renames.

          Expect and REPORT the SPEC-056 identity divergence message on the first
          three: the requested coordinate is `backstop-ai/go-contracts` while the
          manifest may declare a different name. THE MANIFEST NAME IS THE INSTALL
          IDENTITY — the install path, the backstop.yml key and the lock key all
          read what the cloned `pack.yml` declares, and a divergence is reported
          loudly but is NOT a refusal. Read what actually landed; do not assume the
          key equals the coordinate you typed.

          Then, per the seven-step sequence: remove the stale backstop.yml keys;
          check `enforcement.policy.*.sources.*` for any key naming an old
          coordinate and re-point it (expected: none, since the only `sources:` key
          today is `pack_engines.sources.backstop-ai/backstop-self` — verify rather
          than assume); `rm -rf .backstop/packs/backstop/{contracts,
          substantiveness,go-toolchain}` so `detectExtraUnlocked` does not fail;
          prune the stale lock entries by editing `backstop.lock` (`pack remove`
          cannot — it reports "pack is not installed").

          Then prove the content claim rather than trusting it: `diff -rq` each
          newly installed tree against the pre-migration installed tree you removed
          (capture copies first) and report the result. The expectation, measured
          2026-07-28, is exactly one differing file — `pack.yml` — differing in
          exactly two lines. If ANY other file differs, the "no new findings" basis
          of CLM-002 is void: STOP and report the delta before continuing.

          Finally re-run `./bin/backstop pack install` from a clean
          `.backstop/packs/` and confirm every pack materializes with a matching
          content hash.
        files:
          - backstop.yml
          - backstop.lock
        claims:
          - CLM-001
          - CLM-002
          - CLM-003
        depends_on:
          - TASK-002

      - id: TASK-004
        type: refactor
        title: "Re-key real-repo pack-coordinate literals to the new names"
        description: |
          Step 7 of the rename sequence, and the one that carries actual judgment.
          A measured 36 Go files under `pkg/` and `cmd/` — 37 tree-wide, see the
          count note below — reference `backstop/contracts`,
          `backstop/substantiveness`, `backstop/go-toolchain`, or the rule-ID forms
          `backstop.packs.backstop.<pack>` (re-derive the list; it drifts).

          THE RULE: change ONLY the files that read the REAL repository — the
          dogfood and ratchet tests that assert against the actual backstop.yml,
          backstop.lock, or `.backstop/packs/` install path. Files that build their
          OWN temp pack of the same name are SYNTHETIC FIXTURES and must NOT be
          touched: their pack name is a local literal that means nothing outside the
          fixture, and renaming it churns the test while proving nothing.

          `pkg/pack/distribution/contracts_local_install.go` and its tests are the
          clearest synthetic case — they install the repo-root `packs/contracts`
          SOURCE into a temp project under its own declared name. That source is a
          fixture, not a fleet member, and it stays at `backstop/contracts`.

          FOUR CARRIERS ARE OUT OF SCOPE BY NAME. They are absent from this task's
          file list on purpose, and "completing the sweep" into any of them is a
          regression, not thoroughness:
            - `pkg/gate/testdata/self-rule/pack-name-keyed-capability.go`
            - `pkg/gate/testdata/self-rule/rule-id-keyed-routing.go`
              Negative-example fixtures for the backstop/self rules. Their
              old-coordinate literals ARE the anti-pattern being demonstrated —
              capability keyed on a pack NAME, routing keyed on a rule ID. Renaming
              them leaves the rule intact and destroys the example.
            - `pkg/pack/distribution/contracts_provisioning_test.go`
            - `tests/smoke/smoke_test.go`
              Both write their own temp pack under the old coordinate
              (`smoke_test.go:265-275` writes a `backstop/go-toolchain` manifest and
              lock into a scratch dir). The literal never leaves the fixture.

          The true carrier count across the tree is 37, not 36 — `tests/smoke/` sits
          outside a `pkg`+`cmd` grep and is missed in both directions.

          Expect the touched set to be well under 37. Report the number you changed
          AND the number you deliberately left, with the reason for the split — a
          reviewer cannot check this judgment without both numbers.

          Then read the sharp edge in the notes: every real Go file you touch enters
          diff scope and activates ALL of its dormant findings. Fix what activates;
          do not waive it, do not refresh the baseline. If the activated set dwarfs
          the rename, STOP and escalate with the measured inventory.
        files:
          - cmd/backstop/gate.go
          - cmd/backstop/pack_separation.go
          - cmd/backstop/gate_substantiveness_e2e.go
          - cmd/backstop/gate_test.go
          - cmd/backstop/gate_wiring_test.go
          - cmd/backstop/gate_scope_test.go
          - cmd/backstop/gate_declared_dispatch_test.go
          - cmd/backstop/gate_capability_rekey_test.go
          - cmd/backstop/gate_capability_contracts_rekey_test.go
          - cmd/backstop/gate_stack_label_test.go
          - cmd/backstop/gate_contract_e2e_harness_test.go
          - cmd/backstop/gate_substantiveness_wiring_test.go
          - cmd/backstop/gate_substantiveness_provisioning_test.go
          - cmd/backstop/pack_gate_golint_test.go
          - cmd/backstop/pack_gate_gotoolchain_test.go
          - cmd/backstop/pack_separation_test.go
          - cmd/backstop/capability_test.go
          - cmd/backstop/capability_regression_test.go
          - cmd/backstop/by_declaration_regression_test.go
          - cmd/backstop/bridge_test.go
          - cmd/backstop/spec046_fixtures_test.go
          - cmd/backstop/toolchain_label_test.go
          - pkg/gate/policy_perpack_test.go
          - pkg/gate/result_test.go
          - pkg/gate/contract_pack_paths_test.go
          - pkg/gate/contract_equivalence_harness_test.go
          - pkg/gate/substantiveness_join_test.go
          - pkg/gate/substantiveness_q1_findings_test.go
          - pkg/gate/substantiveness_roundtrip_test.go
          - pkg/gate/substantiveness_strangler_harness_test.go
          - module_path_test.go
        claims:
          - CLM-003
        depends_on:
          - TASK-003

      - id: TASK-005
        type: verification
        title: "Verify the migrated fleet: full suite, fresh install, real gate"
        description: |
          Prove the migration end to end. Run, and report the TRUE exit code of,
          each of:

            go build ./...
            go test ./... -race -count=1
            go build -o bin/backstop ./cmd/backstop/     (REBUILD — a stale binary
                                                          gates the old code)
            rm -rf .backstop/packs && ./bin/backstop pack install
            ./bin/backstop gate

          The fresh-install leg is the point: it is the closest local analogue of a
          CI runner, and it is what proves CLM-001 with behavior rather than with a
          lock-file assertion. Report the installed set and every content hash
          comparison.

          `pack_fleet_test.go` must now be GREEN. If `backstop gate` reports
          findings activated by TASK-004's touched files, remediate them here per
          the no-grandfather rule, or escalate with the inventory. Do not proceed to
          Phase 2 with a red gate.
        files:
