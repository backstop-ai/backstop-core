          - TASK-004

  - id: phase-2
    name: "Phase 2: Teach the gate an explicit diff base"
    tasks:
      - id: TASK-006
        type: test
        title: "Scope tests for an explicit diff base"
        description: |
          Write the RED tests for base-aware scope resolution. Model the git fixture
          on the existing `TestComputeGateScope_DiffAgainstRemoteBranch`
          (`pkg/gate/scope_test.go:177`), which already builds a real temp git repo
          — do not invent a second harness.

          `TestComputeGateScope_DiffAgainstExplicitBase` — a repo with commits A
          then B; resolving with base=A returns exactly the files B changed.

          `TestComputeGateScope_ExplicitBaseOnCleanTreeIsNonEmpty` — THE CI
          CONDITION, and the reason this flag exists. Same repo, nothing
          uncommitted, no `origin/main` ref at all: bare diff mode returns an EMPTY
          scope, and base mode returns B's files. Assert BOTH halves in the one
          test so the contrast is what fails if someone reintroduces the fallback.

          `TestComputeGateScope_ExplicitBaseUsesMergeBaseNotTwoDot` — a repo where
          HEAD and the base ref have diverged; assert the scope is the files changed
          since their merge-base, NOT the symmetric difference. This is what makes
          one code path correct for both a PR base ref and a push before-sha.

          `TestComputeGateScope_UnresolvableBaseIsHardError` — base is a ref that
          does not exist. Assert an error is returned AND that the returned scope is
          not a silent `--all`, not a HEAD diff, and not an empty file list. This is
          the anti-fallback test; it is the most important one in the file.

          `TestComputeGateScope_BaseWithNoMergeBaseIsHardError` — the OTHER failure
          mode, and the one that is easy to implement and forget to prove. Build two
          UNRELATED histories in one repo (`git checkout --orphan` gives you a root
          commit sharing no ancestry), pass the orphan's sha as the base, and assert
          the same hard error: the rev RESOLVES, so step 1 passes, and it is
          `merge-base` that fails. A force-push or a grafted shallow clone produces
          exactly this shape in CI. Assert the error names both revs, and assert the
          same three non-fallbacks.

          `TestComputeGateScope_ExplicitBaseIncludesUntrackedFiles` — parity with
          bare diff mode (ISSUE-004 established untracked files are in scope).

          `TestComputeGateScope_EmptyBaseKeepsExistingDiffBehavior` — the
          delegation guard for CLM-009: passing an empty base reproduces bare diff
          mode exactly, so there is one resolver and not two.
        files:
          - pkg/gate/scope_base_test.go
        claims:
          - CLM-005
          - CLM-006
          - CLM-007
          - CLM-009
        depends_on:
          - TASK-005

      - id: TASK-007
        type: implementation
        title: "Implement base-aware diff scope resolution"
        description: |
          Turn TASK-006 green in `pkg/gate/scope.go`.

          Add `ComputeGateScopeWithBase(projectRoot string, mode GateScopeMode,
          files []string, base string)` as the full-arity entry point, and reduce
          the existing `ComputeGateScope` to a thin wrapper that calls it with an
          empty base. DO NOT change `ComputeGateScope`'s signature: 43 test call
          sites and four production call sites (`cmd/backstop/gate.go`,
          `cmd/backstop/waiver.go`, `cmd/backstop/baseline.go`) depend on it, and
          the point of the wrapper is that there is exactly ONE implementation of
          "what changed" — CLM-009.

          Base resolution, in order, all failures LOUD:
            1. `git rev-parse --verify <base>^{commit}` — on failure return an error
               naming the ref and what could not resolve. Return NO scope the caller
               could mistake for a valid one.
            2. `git merge-base HEAD <resolved>` — on failure (unrelated histories)
               return an error naming both revs.
            3. `git diff --name-only <merge-base>` plus
               `git ls-files --others --exclude-standard`, exactly as bare diff mode
               does today (`scope.go:121-127`).

          There is no fallback path. Not to `--all`, not to `HEAD`, not to an empty
          list. The existing fallbacks in `resolveGateScopeDiff` are precisely why
          CI is currently silent, and inheriting them would defeat the flag.

          A non-empty base with a mode other than diff is a programming error the
          CLI layer should already have rejected; return an error rather than
          ignoring the base.

          Record the resolved merge-base SHA on the returned scope so TASK-009 can
