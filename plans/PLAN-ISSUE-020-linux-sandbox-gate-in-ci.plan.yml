  ── NETWORK DENIAL IS SECCOMP'S JOB, NOT LANDLOCK'S ────────────────────────
  Landlock gained network rights at ABI 4 and the runner reports ABI 7, so using
  them is available — and it is still the wrong primary mechanism. Two reasons,
  the second decisive:

    1. LANDLOCK NET IS TCP-ONLY. `LANDLOCK_ACCESS_NET_BIND_TCP` and
       `LANDLOCK_ACCESS_NET_CONNECT_TCP` are the entire surface (verified in
       x/sys v0.31.0 `zerrors_linux.go:1810-1811`). UDP, unix, netlink and raw
       sockets are untouched — so DNS, which is UDP, still resolves. A
       "deny-network" claim resting on that would be false in the most obvious
       case anyone tests.
    2. IT DEGRADES EXACTLY WHERE THE FOUNDER RATIONALE BITES. Ubuntu 22.04 ships
       kernel 5.15 = Landlock ABI 1, which has NO network rights at all. Resting
       network denial on Landlock means a consumer on 22.04 gets filesystem
       confinement and SILENTLY NO NETWORK DENIAL. seccomp filters have been
       universally available since ~3.5 and are ABI-independent.

  So: SECCOMP denies the socket family; LANDLOCK confines the filesystem. The
  seccomp program is small and specific — validate the audit arch (KILL on
  mismatch, the standard guard against an i386/x32 bypass), return EPERM for the
  denied set below, and ALLOW everything else. Landlock's TCP rights are layered on
  TOP when ABI >= 4, as defence in depth — never as the claim's basis.

  THE DENIED SET, in two tiers (revised 2026-07-28 — the first list had two holes):

    CREATION — the primary guarantee:
      socket, socketpair
    USE OF AN ALREADY-OPEN SOCKET — defence in depth against an fd that arrives
    despite the parent passing none:
      connect, bind
      sendto, sendmsg, sendmmsg
      recvfrom, recvmsg, recvmmsg
      io_uring_setup, io_uring_enter

  The two additions, and why silence on them was not an option under this plan's
  own "state the surface EXACTLY" rule:

    THE RECEIVE HALF was missing. The original list denied the send calls and left
    `recvfrom`/`recvmsg`/`recvmmsg` open, plus `sendmmsg` on the send side. The
    inherited-fd rationale covers RECEIVING exactly as much as sending — a script
    that can read from a socket it did not create is not network-denied — so the
    asymmetry was an oversight, not a decision.

    IO_URING IS THE STANDARD SECCOMP BYPASS for this class. Network operations can
    be submitted as ring entries, so the filtered syscalls are never invoked and a
    socket-name-based filter sees nothing. macOS `(deny network*)` has no analogous
    hole, so parity argues for closing it. Nothing a convert script legitimately
    does needs io_uring.

  KNOWINGLY OUTSIDE THE SURFACE, stated rather than left silent:

    io_uring_register — a ring cannot be created (`io_uring_setup` denied) and an
      inherited one cannot be submitted to (`io_uring_enter` denied), so
      registering buffers against it achieves nothing. Denying submission is the
      chokepoint; this is deliberate economy, not an omission.
    accept, accept4, listen — reaching them requires a LISTENING socket, which
      requires `socket` + `bind` + `listen`, all denied at creation. The parent
      passes no socket fds: Go's `exec.Cmd` hands the child only stdin, stdout,
      stderr and anything in `ExtraFiles`, and the trampoline puts nothing there.

  State this surface, and these exclusions, in BOTH the claim and the code comment.
  "Denies network" is the kind of sentence that quietly becomes untrue, and the
  exclusions above are exactly the sentences a future reader will otherwise have to
  re-derive under time pressure.

  RISK TO MEASURE, NOT ASSUME: blocking `socket(2)` may break an interpreter that
  opens a socket during startup (glibc NSS/nscd paths, node's platform init). jq
  and python3 are expected to be fine; nobody has measured node. TASK-013 owes the
  linux analogue of darwin's `TestSandboxConvertWithRealInterpreter` — a REAL
  interpreter running a REAL convert script under the filter. If a needed
  interpreter cannot start, that is a capability question for BUNDLE-021 OQ-2,
  not a licence to widen the filter silently.

  ── EXECUTE IS NOT HANDLED, AND THAT IS THE PARITY-CORRECT ANSWER ──────────
  ADDED 2026-07-28. `LANDLOCK_ACCESS_FS_EXECUTE` (0x1) exists from ABI 1, so the
  handled mask has to make a decision about it, and both directions are wrong in
  different ways:

    HANDLE IT AND FORGET TO GRANT IT -> the trampoline's own `execve` of the pack
      script dies, and so does the interpreter's, and EVERY convert fails. This is
      the loud failure, and it is the one that costs a debugging session because
      the error surfaces as a broken convert rather than as a sandbox decision.
    HANDLE IT AND GRANT IT on the interpreter paths -> works, but it is strictly
      more restrictive than macOS with no threat-model justification for the
      divergence.
    DO NOT HANDLE IT -> execution is unrestricted. THIS IS THE DECISION.

  The parity argument is textual, not a judgment call. The darwin profile
  (`pkg/packval/sandbox.go:57`) reads:

    (deny default)(allow process*)(allow file-read* <scoped>)(deny network*)(deny file-write*)

  `(allow process*)` is macOS permitting process execution outright. Landlock's
  equivalent of "do not restrict this class at all" is to leave the right out of
  `handled_access_fs`, because Landlock only restricts what the mask handles. So
  omitting EXECUTE IS the parity-correct translation of `(allow process*)`, not a
  gap in it. The confinement that matters — what the executed process can READ and
  WRITE, and whether it can reach the network — is unaffected.

  THE READ RIGHTS ARE WHERE THE REAL TRAP IS, AND ISSUE-029 IS THE PRECEDENT.
  Leaving EXECUTE unhandled does not make the interpreter work: the dynamic loader
  still opens the interpreter binary and its shared libraries with O_RDONLY, which
  is `LANDLOCK_ACCESS_FS_READ_FILE` (0x4), plus `READ_DIR` (0x8) where a directory
  is traversed. If the readable set does not cover the system library paths, the
  interpreter dies at load time with an error that looks nothing like a permission
  decision.

  That is the SAME defect ISSUE-029 fixed on macOS, where the sandbox profile
  blocked interpreter dyld reads and broke every convert script. Darwin carries
  `TestSandboxProfileAllowsDyldLibraries` as its permanent regression lock —
  TASK-014 lists it among the darwin tests that must pass unmodified. Linux needs
  its own lock, and TASK-011 owes it as a PURE DERIVATION test: it must assert
  which read and execute rights the derived rules grant on the system paths, and it
  must run WITHOUT a Linux host. Deferring that assertion to the Phase 5 runner
  test would mean discovering the ISSUE-029 failure mode in CI, one push at a time,
  which is exactly the loop the darwin lock exists to prevent.

  ── THE ABI FLOOR IS 1, AND BELOW IT THE ANSWER IS "NO" ────────────────────
  Landlock's ABI is queried with
  `landlock_create_ruleset(NULL, 0, LANDLOCK_CREATE_RULESET_VERSION)`. The
  capability struct must carry the ACHIEVED level, not pretend to a fixed one:

    ABI >= 1   filesystem confinement available. Mask the handled-access rights
               DOWN to what the running ABI knows — requesting a right the kernel
               does not recognise returns EINVAL, and each level adds some (2:
               refer, 3: truncate, 5: ioctl_dev). Record the achieved level and
               the exact handled set in the diagnostic so a degraded run is
               LEGIBLE rather than merely permitted.
    ABI 1      is a FULLY FUNCTIONAL configuration for this plan's parity claim,
               because network denial rests on seccomp. This is the payoff of the
               previous block: the only thing that degrades on an older kernel is
               filesystem granularity, never the network guarantee.
    ABI 0 /    Landlock absent, not compiled, or not in the kernel's LSM list —
    ENOSYS     exactly the LinuxKit case the 2026-07-27 spike hit. REFUSE. Return
               the loud error CLM-015 requires, naming Landlock, the kernel
               version and ISSUE-020, and run NOTHING. This is ISSUE-020's own
               acceptance item 4: an unavailable mechanism fails loudly, because a
               silent pass-through IS the defect being fixed.

  DO NOT reach for a "best effort" helper that silently downgrades. Negotiating
  the ABI explicitly is the difference between a recorded degradation and an
  invisible one.

  ── DEPENDENCY DECISION: x/sys DIRECTLY, NO NEW MODULE, NO CGO ─────────────
  Measured 2026-07-28 against this repo, not recalled:

    go.mod declares FIVE direct dependencies, all pure Go (doublestar, go-toml,
      cobra, pflag, yaml.v3).
    `import "C"` appears in ZERO files in the tree.
    `golang.org/x/sys v0.31.0` is ALREADY in the module graph, as indirect.
    Everything Landlock needs is in it: types `LandlockRulesetAttr` and
      `LandlockPathBeneathAttr` (ztypes_linux.go:4400,4406), syscall numbers
      SYS_LANDLOCK_CREATE_RULESET/ADD_RULE/RESTRICT_SELF = 444/445/446 on BOTH
      amd64 and arm64, `LANDLOCK_CREATE_RULESET_VERSION`, and the full
      `LANDLOCK_ACCESS_FS_*` / `LANDLOCK_ACCESS_NET_*` constant sets.
    Everything seccomp needs is in it too: `PR_SET_NO_NEW_PRIVS`,
      `PR_SET_SECCOMP`, `SECCOMP_MODE_FILTER`, `SECCOMP_SET_MODE_FILTER`, and the
      `SockFilter` / `SockFprog` types (ztypes_linux.go:801,808).

  There are NO `func Landlock*` wrappers at v0.31.0, so the three calls go through
  `unix.Syscall(unix.SYS_LANDLOCK_*, ...)` against the typed attrs above. That is
  a handful of raw syscalls, not a project.

  DECISION: promote `golang.org/x/sys` from indirect to DIRECT and use it for both
  halves. No new module.

  `landlock-lsm/go-landlock` was evaluated and rejected on grounds that hold
  without needing to inspect it: it would be this repo's sixth direct dependency;
  it covers only the Landlock half, so seccomp's BPF program is hand-written
  either way (libseccomp-golang is cgo, and this tree has zero cgo — a posture
  worth keeping); and its ergonomic selling point is best-effort ABI negotiation,
  which is precisely the silent downgrade the previous block forbids. Adding a
  module to get a behaviour we must then work around is a bad trade.

  ── DARWIN PARITY IS THE SPEC, AND IT MEANS NO WRITABLE PATHS ──────────────
  The darwin profile is `(deny default) (allow process*) (allow file-read* <scoped
  subpaths>) (deny network*) (deny file-write*)`. Parity therefore means the
  convert/validator capability set has an EMPTY writable-paths list — under
  Landlock, NO path_beneath rule granting any write right, anywhere.

  THE SUBTLETY THAT MAKES THIS EASY TO GET SILENTLY WRONG: Landlock only restricts
  the access types named in the ruleset's `handled_access_fs` mask. Anything not
  handled stays UNRESTRICTED. A ruleset that handles only the read rights leaves
  writes fully permitted while looking like a working sandbox. The handled mask
  must name the WRITE rights (`WRITE_FILE`, `MAKE_REG`, `MAKE_DIR`, `REMOVE_FILE`,
  `REMOVE_DIR`, the `MAKE_*` family, and `TRUNCATE` where the ABI has it) and then
  grant none of them. Handle-everything, grant-only-reads is the shape.

  Do not carve out a writable scratch directory for convenience: it is a real
  divergence from the macOS trust model, and if a convert script turns out to need
  scratch space that is a capability question for BUNDLE-021 OQ-2, not a quiet
  unilateral grant here.

