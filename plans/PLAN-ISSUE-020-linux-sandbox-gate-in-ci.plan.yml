  - id: phase-4
    name: "Phase 4: Flip CI's blocking job to the real gate"
    tasks:
      - id: TASK-015
        type: test
        title: "Workflow shape tests for the blocking gate job"
        description: |
          Extend the existing root-package `workflows_test.go` (from ISSUE-087) with
          RED shape tests over `.github/workflows/ci.yml`. Assert on PARSED YAML
          structure, never on golden text — a test that breaks on reindentation
          teaches the next person to delete it.

          MATCH DECOMMENTED SCRIPTS, NOT RAW STEP TEXT (as built: the `stepScript` /
          `stepMentions` helpers at `workflows_test.go:604,619` strip comments before
          matching). This is not a stylistic choice — it is forced by this plan.
          TASK-016 MANDATES load-bearing comments in ci.yml explaining the base
          derivation, the golangci pin, and the install-nothing-for-sandbox
          decision, and each of those comments NAMES a string another test forbids.
          Raw substring matching would make the plan's own required comments fail
          the plan's own required tests. Assert on what the runner EXECUTES.

          `TestCIWorkflow_BlockingJobRunsBackstopGate` — the blocking job builds the
          binary, runs `pack install`, and invokes `backstop gate` with a `--base`
          argument. Assert the ORDER: install precedes gate.

          `TestCIWorkflow_BlockingJobHasNoRawToolInvocations` — no step in the
          blocking job runs `golangci-lint`, a bare `go test`, or a hand-rolled
          `go tool cover` threshold. This is what makes the flip real rather than
          additive, and it is the test that fails if someone re-adds a "quick lint
          step" later.

          `TestCIWorkflow_BlockingJobNeverUsesAllOrFileScope` — no `--all` and no
          `--file` on the gate invocation. ISSUE-091 (`--all` under-reports vs diff)
          and ISSUE-093 (`--file` crashes on non-Go directories, repeated `--file`
          silently dropped) are the reasons; cite both in the test comment so the
          constraint survives its authors.

          `TestCIWorkflow_DerivesDiffBasePerEvent` — a step derives the base from
          `github.event.pull_request.base.sha` for pull_request and
          `github.event.before` for push, and fails the job when no base resolves.

          `TestCIWorkflow_BaseGuardChecksResolvabilityNotZeroSha` — assert the guard
          runs `git rev-parse --verify` (or equivalent) on the DERIVED value before
          using it, rather than only string-comparing against the all-zeros SHA.
          A force-push leaves `github.event.before` non-zero AND unreachable in the
          fetched history: a zero-SHA-only guard does not fire, the value flows
          through, and the gate exits 2 with no fallback. Write that failure mode
          into the test comment — it is the reason the assertion is shaped around
          resolvability rather than around a magic string.

          `TestCIWorkflow_TriggersOnPushAndPullRequest` — both events, per the
          founder ruling.

          `TestCIWorkflow_CheckoutFetchesFullHistory` — `fetch-depth: 0` on the
          checkout in the blocking job. Without it the PR base sha is not in the
          local history and every run exits 2.

          `TestCIWorkflow_InstallsProvisionedToolsAtAllowlistPins` — semgrep and
          ast-grep are installed at the versions
          `pkg/pack/engine/allowlist.go` pins. READ the pins from that file at test
          time rather than restating 1.96.0 / 0.43.0, so a pin bump cannot leave CI
          silently behind.

          `TestCIWorkflow_PinsGolangciLintToPackCompatibleMajor` — the falsifier the
          allowlist CANNOT provide, because `golangci-lint` is not in it and never
          will be (nil-Provision bindings return early from
          `checkEngineToolAllowed`). Assert three things about ci.yml: a step
          installs a `golangci-lint` BINARY; the version it pins is v2.x (the
          go-toolchain pack's `--output.sarif.path` is v2-only syntax, so a v1 pin
          silently breaks the lint dimension with an unknown-flag error); and the
          install does NOT go through `go tool` / the go.mod tool directive, which
          pins v1.64.8 for unrelated reasons. Derive the required major from the
          pack's declared command if you can reach it; otherwise assert v2.x and
          cite the flag in the comment.

          `TestCIWorkflow_InstallsNoSandboxTooling` — the inverse of the assertion
          this slot held before the 2026-07-28 ruling, and it is a real falsifier
          rather than a formality. Landlock and seccomp are kernel APIs: there is
          nothing to install, so assert that NO step in the workflow installs
          bubblewrap or any other sandbox helper. A reappearing `apt-get install
          bubblewrap` means someone is reviving the ruled-out mechanism, and the
          probe (`pkg/packval/testdata/ubuntu-runner-probe.txt`) shows installing it
          does not even help — it is present-and-broken under
          `apparmor_restrict_unprivileged_userns=1`. Name the ruling and the probe
          file in the test comment so the next person meets the evidence before
          re-adding the step.

          The sandbox's actual runner requirement is a KERNEL property, not a
          package, and it is asserted where it can be: TASK-013's execution tests
          fail loudly on a host without Landlock, and they run inside the gate.
          There is deliberately no workflow-level kernel-probe step — that would be
          a second, weaker copy of an assertion the tests already make.

          `TestCIWorkflow_GoVersionComesFromGoMod` — setup-go uses
          `go-version-file: go.mod`, so the Go toolchain has ONE authority rather
          than a second hardcoded version drifting beside it.

          `TestCIWorkflow_PackInstallFailureFailsTheJob` — no `continue-on-error`,
          no `|| true`, and no conditional that lets the gate run after a failed
          install.

          AS BUILT — THE BASELINE JOB NEEDED THE LAYER-0 TOOLS MIRRORED TOO, and the
          lock for it is `TestCIWorkflow_BaselineJobInstallsTheSameToolsAsGate`,
          written deliberately as a PARITY assertion rather than a checklist of tool
          names. The defect's shape was divergence: the gate job grew its toolchain
          and the baseline job did not, so a job that runs the same gate had a
          different environment. A parity test fails whenever the two drift, which
          is the actual invariant; a name checklist would have to be updated by
          exactly the person who forgot.

          `TestCIWorkflow_BaselineJobInstallsPacksBeforeGenerating` — the baseline
          job runs `pack install` before `baseline generate`. Without it the job
          exits 2 at `pack_loading` and publishes NOTHING: `loadInstalledPacks`
          (`cmd/backstop/pack_gate.go:158-166`) returns on the first declared pack
          missing from an empty `.backstop/packs/`, `buildGateSteps`
          (`cmd/backstop/gate.go:653-662`) collapses the step set to one ConfigErr
          step, and `runBaselineGenerate` (`cmd/backstop/baseline.go:69-72`) refuses
          to write from a gate that produced no steps. Cite those call sites in the
          test comment, and state the consequence accurately: the risk is a baseline
          that silently stops being REFRESHED, not a baseline published with
          inherited failures in it.

          `TestCIWorkflow_NoProbeWorkflowRemains` — the temporary probe workflow
          from TASK-001 is gone.
        files:
          - workflows_test.go
        claims:
          - CLM-018
          - CLM-019
          - CLM-020
          - CLM-021
          - CLM-022
          - CLM-023
          - CLM-029
        depends_on:
          - TASK-014

      - id: TASK-016
        type: implementation
        title: "Rewrite ci.yml's blocking job around backstop gate"
        description: |
          Turn TASK-015 green. Replace the `gate` job's hand-baked steps — Lint,
          Test with coverage, Enforce coverage threshold — with the real thing, and
          delete the probe workflow TASK-001 added.

          Job shape:
            - actions/checkout@v4 with `fetch-depth: 0`
            - actions/setup-go@v5 with `go-version-file: go.mod`
            - install a REAL `golangci-lint` BINARY on PATH at a pinned **v2.6.0**
              (today's `go tool golangci-lint` does NOT satisfy `provisionEngines`,
              which resolves the executable by name). v2 is not a preference: the
              go-toolchain pack declares `golangci-lint run --output.sarif.path
              stdout --show-stats=false`, which is v2-only syntax, and go.mod:197's
              tool directive pins v1.64.8 — installing THAT breaks the lint
              dimension with an unknown-flag error. Write both facts in a comment
              beside the pin, or the two pins get "consolidated" later and the break
              comes back.
            - install semgrep 1.96.0 and ast-grep 0.43.0 — the pins in
              `pkg/pack/engine/allowlist.go`. Nothing here floats.
            - install NOTHING for the sandbox. Amended 2026-07-28: the mechanism is
              Landlock + seccomp, kernel APIs with no package. Do not add
              `apt-get install -y bubblewrap`; the probe measured that bubblewrap
              installs fine on the runner and still fails every invocation under
              `apparmor_restrict_unprivileged_userns=1`, so the step would buy
              nothing and would suggest the ruled-out mechanism is still live.
            - `go build -o ./bin/backstop ./cmd/backstop`
            - `./bin/backstop pack install`
            - derive the base (below)
            - `./bin/backstop gate --base "$BASE"`

          Base derivation, in one explicit, commented step:
            pull_request  -> ${{ github.event.pull_request.base.sha }}
            push          -> ${{ github.event.before }}
          then guard ON RESOLVABILITY, not on a magic string. Run
          `git rev-parse --verify "$BASE^{commit}"` and use the value only if it
          succeeds; otherwise fall back to `HEAD^` and say so loudly in the log. One
          check covers all three ways the derived value goes bad:
            - empty (missing event payload field),
            - the all-zeros SHA (branch creation — which INCLUDES the very first
              push of this history to the new remote),
            - non-zero but UNREACHABLE (the force-push shape: `github.event.before`
              names a commit that no longer exists in the fetched history).
          The third is the one a zero-SHA string comparison misses entirely. It does
          not fire, the dead sha flows through to the gate, and the job exits 2 with
          no fallback — a red build with a confusing cause, on a perfectly ordinary
          force-push.

          If `HEAD^` does not resolve either, FAIL THE JOB with a message naming what
          could not resolve. Never substitute `--all`, and never let the job continue
          with no base — exit 2 from the gate is the correct outcome, not something
          to route around.

          Write a header comment on the job explaining WHY the base is explicit:
          a CI checkout is pristine, so bare diff mode resolves `merge-base HEAD
          origin/main` to HEAD on a push and finds nothing to check. The comment is
          load-bearing — it is what stops the next person from "simplifying" the
          step back into a vacuous green.

          The founder's semantics, stated in the job so they are not folklore:
          the job blocks on gate findings in DIFF-SCOPED files only ("green if the
          diff is green"), and a file that enters the diff carries ALL of its
          findings, including ones that predate the change.

          THE `baseline` JOB NEEDS EXACTLY ONE CHANGE, AND NO MORE. Add a
          `./bin/backstop pack install` step (with the binary build it needs) before
          `baseline generate`. This is not opportunistic improvement: without it the
          job exits 2 at `pack_loading` against an empty `.backstop/packs/` and
          PUBLISHES NOTHING, so main's baseline silently stops being refreshed while
          every run reports the failure — and this plan would be the thing that made
          ISSUE-086 worse. Measured 2026-07-28; note that the artifact is never
          CORRUPTED (`runBaselineGenerate` refuses to write from a gate that produced
          no steps), so what the install step buys is availability, not integrity.

          Do NOT go further. Do not feed the blocking job's output into it, do not
          change its scope or triggers, and do NOT report ISSUE-086 as closed — the
          question of what a pack-ful baseline means, and what to do with the
          already-published packless artifacts, belongs to that issue. Report the
          change to its owner as an input.

          Delete `.github/workflows/linux-sandbox-probe.yml`. The probe's VALUES are
          durable in `pkg/packval/testdata/ubuntu-runner-probe.txt` (TASK-001); the
          workflow that produced them is scaffolding and goes.

          REPOINT THE PRE-EXISTING CONTRACT TEST THIS FLIP BREAKS. `cmd/backstop/
          integration_test.go:251`
          (`TestBaselineCIContract_PullRequestGateKeepsChangedCodeEnforcement`)
          asserts ci.yml literally contains the raw `go test -race -coverprofile...`
          line this task deletes — it goes red the moment the flip lands, and it
          directly contradicts TASK-015's
          `TestCIWorkflow_BlockingJobHasNoRawToolInvocations`. Keep the NAME and the
          CONTRACT; change only the mechanism it checks, to `backstop gate` with
          `--base`. Do not delete it (that drops a contract silently) and do not
          rename it (that breaks the BaselineCIContract set's naming). See the
          Phase 4 as-built notes.
        files:
          - .github/workflows/ci.yml
          - .github/workflows/linux-sandbox-probe.yml
          - cmd/backstop/integration_test.go
        claims:
          - CLM-018
          - CLM-019
          - CLM-020
          - CLM-021
          - CLM-022
          - CLM-023
          - CLM-029
        depends_on:
          - TASK-001
          - TASK-015

      - id: TASK-017
        type: test
        title: "Falsifier: a pre-existing finding in a touched file must red the gate"
        description: |
          The founder's file-granularity ruling, locked at the exit-code level. The
          unit-level ratchet is already covered by
          `pkg/gate/baseline_ratchet_test.go`; what is NOT covered is the whole path
          a CI run actually takes — real base resolution, real scope, real baseline,
          real exit code. Model the harness on
          `TestGate_PackEngines_DiffScope_RedsOnChangedFileViolation`
          (`cmd/backstop/gate_scope_test.go:310`), extended with a real git repo and
          a `--base` resolution.

          `TestGate_ExplicitBase_PreExistingFindingInTouchedFileReds` — a file
          carrying a finding that IS in the baseline; the diff touches that file;
          assert the run exits NON-ZERO and that the reported violation is the
          pre-existing one. This is the exact defense against "that was there
          before, my changes are clean" — the failure mode this ruling exists to
          kill.

          `TestGate_ExplicitBase_UntouchedFileFindingStaysGrandfathered` — the
          mirror. A baselined finding in a file the diff does NOT touch keeps its
          grandfather. Without this, the previous test is satisfied by any gate that
          ignores the baseline entirely.

          CORRECTED 2026-07-28 — THE MIRROR MUST USE A NON-EXEMPT FINDING. A first
          draft of this test asserted that an untouched file's finding is dropped,
          using a finding that happened to be ProjectWide. That asserts against an
          INTENDED GUARANTEE: `filterViolations` (`pkg/gate/scope.go:307-311`) never
          scope-filters a ProjectWide violation — Ratified Design Constraint 3, so
          an unchanged-file build break still reds a diff-scoped gate, which is the
          whole point of the exemption. A passing version of that draft would have
          meant the exemption was broken.

          The pair must therefore differ in EXACTLY ONE variable: which file carries
          the finding. Same finding, same non-exempt rule, same baseline — only the
          diff membership changes. Any second difference makes the pair prove
          something other than the ratchet.

          NOTE ON PROVENANCE: this correction was reported against "CLM-005", which
          is not the right reference — CLM-005 in this plan is about `--base` scope
          resolution. The design fact lives in `pkg/gate/scope.go:307-311` and, for
          the build-violation case specifically, in the go-toolchain pack's
          `exempt_from_scope_filter` declaration. Cite those; there is no claim in
          this plan that owns the ProjectWide exemption.

          `TestGate_ExplicitBase_CleanDiffIsGreenDespiteRepoDebt` — a diff touching
          only clean files exits ZERO while the repo still carries baselined
          findings elsewhere. "Green if the diff is green" (CLM-025).

          TWO FIXTURE FACTS THIS TASK ORIGINALLY OMITTED, both discovered the hard
          way and both cheap once known. A fixture project that DECLARES a pack
          needs a `backstop.lock`: `pack_lock_verification` is the gate's FIRST
          step, and a missing lock is exit 2 before any dimension runs — note that
          `source_type: local` entries are VerifyLock-SKIPPED, so a local lock entry
          satisfies this without the pack having to exist on disk. And
          `test_verification` HARD-ERRORS on an absent `specs/` directory, so the
          fixture needs one even when the test has nothing to do with specs. Build
          both into the fixture rather than discovering them as exit-2 noise.

          Note in the file header that these are REGRESSION LOCKS over behavior the
          strict file-level ratchet (ISSUE-050,
          `pkg/gate/baseline.go:135-148 scopeTouches`) already implements — so they
          are expected to pass on first run. That is the intent: the founder asked
          for a falsifier that would catch the day someone loosens it, and a test
          that is green on arrival is still doing that job. Report honestly that
          they passed immediately rather than manufacturing a red phase.
        files:
          - cmd/backstop/gate_base_ratchet_test.go
        claims:
          - CLM-024
          - CLM-025
        depends_on:
          - TASK-014

      - id: TASK-018
        type: verification
        title: "Verify the workflow locally: actionlint, shape tests, full suite"
        description: |
          Run and report true exit codes for:

            go run github.com/rhysd/actionlint/cmd/actionlint@latest \
              .github/workflows/ci.yml
            go test . -race -count=1 -run 'TestCIWorkflow' -v
            go test ./cmd/backstop/ -race -count=1 -run 'ExplicitBase' -v
            go test ./... -race -count=1
            go build -o bin/backstop ./cmd/backstop/
            ./bin/backstop gate

          actionlint fetches from the network. If the fetch fails, report the failure
          and the skip EXPLICITLY — "actionlint could not run: <error>" — and do NOT
          report the step as passed. The parsed-YAML shape tests are the
          always-available falsifier and are never optional.

          actionlint may also flag the pre-existing `release` and `tag-integrity`
          workflows. Report those separately; do not fix them here.

          Then verify the baseline job locally. Run `./bin/backstop baseline
          generate` with `.backstop/packs/` POPULATED and again with it EMPTY.

          EXPECTATIONS, CORRECTED 2026-07-28 FROM MEASUREMENT (at ba9cc49) — the
          original "empty must show six `missing_pack` failures" was UNSATISFIABLE
          and no implementer should try to reach it:

            EMPTY   exit 2, ONE violation from step `pack_loading`, and NO baseline
                    written ("gate reported a configuration error ... refusing to
                    write a baseline from a gate that produced no steps").
                    `pack_lock_verification` never runs, so there is no
                    `missing_pack` count to report — `loadInstalledPacks` returns on
                    the FIRST missing declared pack and `buildGateSteps` collapses
                    the whole step set to one ConfigErr step.
            POPULATED  zero `missing_pack` findings and a baseline WRITTEN. This leg
                    passed exactly as predicted.

          Report both legs as measured. If the empty leg produces a baseline FILE,
          that is the real regression to escalate — the refuse-to-write guard is
          what makes a poisoned artifact unrepresentable, and it is more important
          than the finding count either leg reports.

          RUN THE EMPTY-PACKS LEG IN A DETACHED WORKTREE, NOT THE SHARED TREE. This
          instruction is retrofitted from execution: `rm -rf .backstop/packs` in a
          tree with live sibling lanes breaks every one of them, and "restore
          afterwards" is not a safe contract when other work is reading the
          directory concurrently. A destructive verification gets its own worktree.
          Splitting this task's two legs across trees is expected and is not a
          deviation to flag.
        files:
          - .github/workflows/ci.yml
          - workflows_test.go
          - cmd/backstop/gate_base_ratchet_test.go
        claims:
          - CLM-018
          - CLM-019
          - CLM-024
          - CLM-025
          - CLM-029
        depends_on:
