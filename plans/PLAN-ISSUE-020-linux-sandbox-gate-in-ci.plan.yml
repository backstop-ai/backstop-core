      - id: TASK-012
        type: implementation
        title: "Implement the capability struct, the Landlock+seccomp trampoline, and its wiring"
        description: |
          Turn TASK-011 green. Read the notes blocks "WHAT LANDLOCK + SECCOMP
          FORCES", "NETWORK DENIAL IS SECCOMP'S JOB", "THE ABI FLOOR IS 1" and
          "DEPENDENCY DECISION" first — this task is where all four land.

          `pkg/packval/sandbox_capability.go` (NO build tag — it must compile and be
          testable everywhere): the capability struct (readable paths, writable
          paths, network bool, achieved Landlock ABI) plus the PURE derivation of
          the restriction spec. Give the struct the doc comment BUNDLE-021 OQ-2
          requires — leg 2 of the issue's triple-tracked hedge — stating plainly
          that this is an INTERNAL representation chosen so a future pack-DECLARED
          capability can slot in without a rewrite, that it does NOT resolve OQ-2,
          and that BUNDLE-021 owns that question.

          The convert/validator capability set is the darwin-parity default:
          readable = {packDir, the system paths an interpreter needs}, writable = {}
          (empty), network = false.

          TWO THINGS THE DERIVATION MUST GET RIGHT, both with their own notes block:
            - `LANDLOCK_ACCESS_FS_EXECUTE` stays OUT of the handled mask (darwin's
              `(allow process*)`), while the readable grants MUST carry `READ_FILE`
              and `READ_DIR` on the system library paths or the dynamic loader dies
              — the Linux face of ISSUE-029.
            - the seccomp denied set is the FULL list in the notes, receive half and
              io_uring pair included.
          Write the denial surface AND the knowing exclusions (`io_uring_register`,
          `accept`/`accept4`/`listen`) into the code comment beside the filter, with
          their reasons. A future reader tightening this filter under time pressure
          should not have to re-derive why three syscalls are absent.

          `pkg/packval/sandbox_linux.go` (`//go:build linux`): the mechanism.
            - ABI probe via
              `landlock_create_ruleset(NULL, 0, LANDLOCK_CREATE_RULESET_VERSION)`.
              ABI 0 / ENOSYS / Landlock absent from the LSM list => return the loud
              CLM-015 error naming Landlock, the kernel version and ISSUE-020, and
              run NOTHING.
            - the helper, reached through an exported `MaybeRunSandboxHelper() error`
              gate
              keyed on an env var (NOT a user-facing Cobra subcommand): lock the OS
              thread, `PR_SET_NO_NEW_PRIVS`, create/add/restrict the Landlock
              ruleset, install the seccomp filter, then `unix.Exec` the real command
              FROM THAT SAME LOCKED THREAD. The lock and the exec are a pair; see
              the notes for why splitting them yields an unconfined child that every
              unit test still passes.
            - use `golang.org/x/sys/unix` for both halves and promote it in go.mod
              from indirect to direct. The Landlock calls go through
              `unix.Syscall(unix.SYS_LANDLOCK_*, ...)` against `LandlockRulesetAttr`
              / `LandlockPathBeneathAttr`; there are no `func Landlock*` wrappers at
              v0.31.0. Add NO other module, and keep the tree free of `import "C"`.

          `pkg/packval/sandbox.go`: replace BOTH `case "linux":` hard errors with a
          spawn of the trampoline, preserving each function's output contract
          EXACTLY — `SandboxedRun` keeps `CombinedOutput`; `SandboxedRunStdout`
          keeps the explicit stdout buffer, the stdin pipe, and the "return stdout
          captured so far alongside the error" behaviour on non-zero exit. Those
          contracts are what keep a converter's stderr banner out of the SARIF the
          gate parses, and the trampoline must be transparent to them.

          `cmd/backstop/main.go`: call `packval.MaybeRunSandboxHelper()` as the
          FIRST statement in `main`, before `NewRootCommand()`. AS BUILT it returns
          an error and `main` owns the exit through a documented
          `const sandboxHelperExitCode = 126` — a library must not call `os.Exit`
          (the `cli.core.exit-code-discipline` rule, honoured rather than waived),
          and a third error case guards the "returned without exec'ing" hole. This
          is the whole difference between a shipped binary that sandboxes and one
          that does not — `/proc/self/exe` is the backstop binary, so the gate has
          to run before Cobra sees argv. This repo has a recorded history of
          implementations that pass their unit tests and miss exactly this kind of
          cross-package wiring; treat it as part of the deliverable, not as glue.

          Do not touch `darwinSandboxProfile`, the darwin branches, or the exported
          sandbox signatures. Callers in `pkg/packval/executor.go:46` and
          `cmd/backstop/pack_gate.go:472,693` must not change — verify by building,
          not by inspection.

          Cite `pkg/packval/testdata/ubuntu-runner-probe.txt` in the
          implementation's doc comment, and record in that comment WHY the mechanism
          is Landlock+seccomp rather than bubblewrap: the probe measured
          `apparmor_restrict_unprivileged_userns=1` on stock ubuntu-24.04 and every
          bwrap invocation failed including both positive controls, so the founder
          ruled on 2026-07-28 that an unprivileged sandbox cannot depend on user
          namespaces. The next reader should not have to reconstruct that.
        files:
