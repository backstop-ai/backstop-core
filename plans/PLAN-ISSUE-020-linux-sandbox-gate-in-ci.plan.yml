          - TASK-017

  - id: phase-4b
    name: "Phase 4b: Recover the sandbox failure diagnostic"
    tasks:
      - id: TASK-025
        type: test
        title: "Portable falsifier for the stderr-into-error fold"
        description: |
          Read the "TASK-019 RAN AND WAS RED" notes block first. This phase exists
          because a correct CLM-015 diagnostic was thrown away by the parent
          process, and the run that found it could not say why.

          THE TEST MUST RUN ON DARWIN. That is a design constraint, not a
          convenience: the defect was invisible to every existing test precisely
          because the only thing exercising this path was a Linux runner. A
          regression lock that also needs a Linux runner would restore the blind
          spot. So the fold is a PURE FUNCTION over (stdout bytes, stderr bytes,
          run error) and the test drives it directly — same discipline as TASK-011's
          derivation tests.

          In a new `pkg/packval/sandbox_diagnostic_test.go` (NO build tag):

          `TestFoldHelperStderrIntoError_CarriesDiagnosticTokens` — given a non-zero
          run error and a stderr buffer holding a realistic helper diagnostic, the
          returned error contains the token contract: "andlock" (substring, so it
          matches Landlock and landlock alike — the same token TASK-011's loud-error
          test uses), the kernel release, and "ISSUE-020". Assert on TOKENS, not on
          the exact sentence, so the message can be reworded without a test edit.

          `TestFoldHelperStderrIntoError_ReturnedStdoutStaysByteClean` — the
          guarantee that makes this safe. Feed stdout that is valid SARIF and stderr
          that is a banner; assert the returned bytes are the SARIF EXACTLY, with no
          stderr bytes appended, prepended, or interleaved. This arm exists to keep
          a converter's stderr out of the parsed bytes; folding stderr into the
          ERROR must not undo it.

          `TestFoldHelperStderrIntoError_SuccessPathIgnoresStderr` — on a nil run
          error the fold returns stdout and NO error, even when stderr is non-empty.
          A converter that writes a harmless banner and exits 0 must not be turned
          into a failure.

          `TestFoldHelperStderrIntoError_EmptyStderrStillErrors` — a non-zero exit
          with silent stderr still returns a non-nil error naming the exit. Absence
          of a diagnostic must not become absence of a failure.

          `TestSandboxedRun_CombinedOutputArmSurfacesDiagnostic` — lock the sibling.
          `platformSandboxedRun` satisfies the token contract BY CONSTRUCTION today
          (`CombinedOutput` merges stderr), and by-construction guarantees are
          exactly the ones that get refactored away. Assert it explicitly so the
          two arms cannot drift apart again — the drift between them is the whole
          defect.
        files:
          - pkg/packval/sandbox_diagnostic_test.go
        claims:
          - CLM-038
          - CLM-039
        depends_on:
          - TASK-024

      - id: TASK-026
        type: implementation
        title: "Capture helper stderr and fold it into the returned error"
        description: |
          Turn TASK-025 green.

          Add `pkg/packval/sandbox_diagnostic.go` (NO build tag) holding the pure
          fold: it takes the captured stdout, the captured stderr and the run error,
          and returns the stdout unchanged plus an error that carries the stderr
          text when the run failed. Untagged because the test must reach it on
          darwin, and because nothing in it is platform-specific.

          Wire it in `platformSandboxedRunStdout`
          (`pkg/packval/sandbox_linux.go:412-425`): set `helper.Stderr` to a
          SEPARATE `bytes.Buffer` — never to the stdout buffer, and never to
          `os.Stderr` — then return through the fold. The existing contract is
          otherwise untouched: stdin still pipes, stdout is still returned
          captured-so-far on a non-zero exit, and the returned bytes still contain
          only what the command wrote to stdout.

          Leave `platformSandboxedRun` alone. Its `CombinedOutput` already surfaces
          the diagnostic; TASK-025 just locks that.

          Bound the folded stderr if you bound anything — a runaway converter should
          not produce an unbounded error string — but do NOT truncate below the
          token contract, and if you truncate, keep the TAIL: the helper writes its
          diagnostic last.
        files:
          - pkg/packval/sandbox_diagnostic.go
          - pkg/packval/sandbox_linux.go
        claims:
          - CLM-038
          - CLM-039
        depends_on:
          - TASK-025

      - id: TASK-027
        type: verification
        title: "Verify the diagnostic survives locally before spending another CI run"
        description: |
          Run and report true exit codes for:

            go build ./...
            GOOS=linux go build ./...
            GOOS=linux go vet ./pkg/packval/
            go test ./... -race -count=1
            go test ./pkg/packval/ -race -count=1 -run 'Diagnostic|Sandbox' -v
            go build -o bin/backstop ./cmd/backstop/
            ./bin/backstop gate

          Then confirm, by reading `platformSandboxedRunStdout`, that `helper.Stderr`
          is a buffer DISTINCT from the stdout buffer. Aliasing them would make every
          test above pass while quietly reintroducing the stderr-in-SARIF bug this
          arm was built to prevent — the failure would surface as unparseable SARIF
          on a converter that writes a banner, far from here.

          All six darwin sandbox tests must still pass unmodified.

          This task exists so the next runner failure — if there is one — arrives
          with its reason attached. A CI run is the most expensive test in this
          plan; do not spend one to discover something a local read would have shown.
        files:
          - pkg/packval/sandbox_diagnostic.go
          - pkg/packval/sandbox_linux.go
          - pkg/packval/sandbox_diagnostic_test.go
        claims:
