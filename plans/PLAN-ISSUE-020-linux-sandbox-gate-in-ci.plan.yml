  ── THE LOAD-BEARING DISCOVERY: CI'S DIFF SCOPE IS EMPTY, NOT WRONG ────────
  Read `pkg/gate/scope.go:112-144` before writing any of Phase 2. Bare diff mode
  resolves its base like this:

    for remote in origin/main, origin/master:
        base = git merge-base HEAD <remote>
        if base resolves: files = git diff --name-only <base> + untracked

  On a GitHub Actions PUSH to main, `origin/main` IS `HEAD`, so the merge-base
  is HEAD and `git diff --name-only HEAD` on a freshly-checked-out tree returns
  NOTHING. There are no untracked files either — the checkout is pristine. The
  result is not a wrong scope; it is an EMPTY scope, and an empty scope passes.
  That is the single most dangerous failure mode in this whole plan: CI would go
  green while checking zero files, which is the vacuous green CLAUDE.md names as
  the enemy. Phase 2 exists entirely to close it.

  On a PULL REQUEST it is worse in a subtler way: actions/checkout at the default
  `fetch-depth: 1` does not create an `origin/main` remote-tracking ref at all,
  so BOTH merge-base attempts fail, the code falls through to
  `git diff --name-only HEAD` — still empty — and attaches the warning "no remote
  branch (origin/main or origin/master) found; using local changes only". A
  warning is not a failure. It would still be green.

  ── WHAT `--base` MUST AND MUST NOT DO ─────────────────────────────────────
  `--base <rev>` resolves the scope as `git diff --name-only $(git merge-base
  HEAD <rev>)` plus untracked files. merge-base (not a raw two-dot diff against
  the ref) is deliberate and is correct for BOTH CI events: for a pull_request
  the base sha is the fork point, and for a push the before-sha is already an
  ancestor of HEAD so the merge-base is the before-sha itself. One code path,
  both events.

  The prohibition is as load-bearing as the behavior: an unresolvable `--base`
  must be an exit-2 config error naming the ref. It must NEVER fall back to
  `--all`, never fall back to bare-diff-against-HEAD, and never yield an empty
  scope. Bare diff mode's existing fallbacks (to `--all` when not a git repo, to
  local changes when no remote exists) are what make an explicit base necessary;
  inheriting them would reintroduce the exact silence this flag is built to
  remove.

