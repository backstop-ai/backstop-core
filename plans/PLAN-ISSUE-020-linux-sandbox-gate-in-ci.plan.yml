  ── WHAT LANDLOCK + SECCOMP FORCES: A RE-EXEC TRAMPOLINE ───────────────────
  This is the load-bearing architectural consequence of the ruling, and it is not
  a detail. Bubblewrap is a WRAPPER BINARY — you build an argv and exec it.
  Landlock and seccomp are neither: they are SELF-APPLIED, PER-THREAD, IRREVOCABLE
  restrictions that a process installs on ITSELF and that are then inherited across
  `fork` and `execve`.

  So `SandboxedRun`/`SandboxedRunStdout` CANNOT apply them in-process. Doing so
  would permanently confine the backstop process itself — no further project
  reads, no report writing, no subsequent gate steps, and no way to undo it. The
  design is a re-exec trampoline:

    parent (unrestricted):  spawn /proc/self/exe in a hidden helper mode, passing
                            the capability set and the real command
    helper (child):         1. runtime.LockOSThread()
                            2. prctl(PR_SET_NO_NEW_PRIVS, 1)
                            3. landlock_create_ruleset / _add_rule / _restrict_self
                            4. install the seccomp filter
                            5. unix.Exec(cmd) FROM THAT SAME LOCKED THREAD

  STEPS 1 AND 5 ARE A PAIR, AND SPLITTING THEM IS A SILENT HOLE. Both restrictions
  attach to the CALLING THREAD. Go's scheduler migrates goroutines across OS
  threads at will, so restricting on one thread and exec'ing from another produces
  an UNCONFINED child while every unit test still passes — the sandbox looks
  installed and confines nothing. `runtime.LockOSThread` pins the goroutine, and
  `execve` from that thread replaces the process image (killing sibling threads),
  so the new image inherits that thread's Landlock domain and seccomp filter.
  TASK-013 must prove the confinement CARRIED INTO THE CHILD, not merely that the
  syscalls returned 0 in the helper.

  Two more hazards, both of which surface as "sandbox unavailable" if missed:
    - `PR_SET_NO_NEW_PRIVS` is REQUIRED before `landlock_restrict_self` and before
      a seccomp filter, absent CAP_SYS_ADMIN. Forget it and both return EPERM.
    - the seccomp filter must be a TARGETED DENY, not a default-deny allowlist.
      Between filter install and `execve` the Go runtime still makes syscalls; a
      default-deny program kills the helper before it can exec. A targeted deny is
      also the correct parity call — darwin denies network, it does not enumerate
      permitted syscalls.

  WIRING, because this is the cross-package seam this repo has been burned on:
  `/proc/self/exe` is the backstop binary, so the helper gate has to run before
  Cobra sees argv. `cmd/backstop/main.go` calls an exported
