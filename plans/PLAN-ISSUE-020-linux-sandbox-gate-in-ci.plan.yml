  - id: phase-3b
    name: "Phase 3b: Make the coverage floor reachable on both platforms"
    tasks:
      - id: TASK-021
        type: test
        title: "Tests for the run() seam and compile-time sandbox dispatch"
        description: |
          Write the RED tests for both refactors before either lands. Read the
          notes block "THE STRUCTURAL COVERAGE PROBLEM" first — it carries the
          evidence for why these are code fixes rather than exclusions.

          FOR THE `run()` SEAM, in a new `cmd/backstop/run_test.go`:

          `TestRun_ReturnsExitCodeFromCommandError` — `run` returns the code
          `reportError` produces for a classified `*ExitCodeError`, and writes its
          diagnostic to the writer it was handed rather than to `os.Stderr`.

          `TestRun_SuccessReturnsZero` — a command that succeeds returns 0 and
          writes no diagnostic.

          `TestRun_SandboxHelperErrorExitsOneTwentySix` — the case Phase 3 could
          not cover at all. When the helper gate returns an error, `run` returns
          `sandboxHelperExitCode` and writes the error. Inject the gate; do not
          depend on the process actually being a helper. This test is the reason
          the seam is worth more than its coverage arithmetic: it is the first time
          the "sandbox could not be installed" path is exercised anywhere.

          `TestRun_RoutesOutputToStdoutAndErrorsToStderr` — the streams the current
          `main` wires via `SetOut`/`SetErr` stay wired the same way through the
          seam.

          `TestRun_SandboxGateRunsBeforeAnyCommandWork` — THE ORDERING LOCK, and
          without it the other four tests are all satisfied by a `run()` that gets
          this exactly wrong. A `run()` that built and executed the Cobra command
          BEFORE calling the gate would return the right codes, write to the right
          streams, and pass every assertion above — while a real helper process
          printed help text to stdout before trampolining. "First statement" is a
          behavioral requirement, not a stylistic one: the helper is invoked with no
          arguments and keys only on an environment variable, so anything that
          parses argv first is already wrong.

          Assert it directly. Inject the gate alongside a command-construction spy
          and assert the gate ran first; or, equivalently, assert that when the gate
          returns an error NOTHING was written to stdout and NO command was
          constructed. Either shape falsifies the reordering; a test that only
          checks the return code does not.

          FOR COMPILE-TIME DISPATCH, in a new
          `pkg/packval/sandbox_dispatch_test.go` (no build tag):

          `TestSandboxDispatch_ExportedSignaturesUnchanged` — `SandboxedRun` and
          `SandboxedRunStdout` keep their exact signatures and output contracts.
          This is the CLM-017 lock, and it is what stops the refactor from becoming
          a behavior change.

          `TestSandboxDispatch_NoRuntimeGOOSSwitchRemains` — assert via `go/ast`
          over `sandbox.go` that no `runtime.GOOS` switch survives. Structural, not
          textual: the whole point is that platform selection moved to build tags,
          and a test asserting the absence of the construct is what keeps someone
          from reintroducing it for "clarity" later.

          Both files are new, and both must be genuinely RED before the refactors:
          `run` does not exist yet and the switch does.

          AS BUILT (3e084e2): all seven mandated names landed and each was proven
          RED before its refactor — reported individually rather than as an
          aggregate, which is what makes "red-first" checkable. The seam tests sit
          in `cmd/backstop/run_test.go` and the two dispatch tests in
          `pkg/packval/sandbox_dispatch_test.go`
          (`TestSandboxDispatch_ExportedSignaturesUnchanged`,
          `TestSandboxDispatch_NoRuntimeGOOSSwitchRemains`).
        files:
          - cmd/backstop/run_test.go
          - pkg/packval/sandbox_dispatch_test.go
        claims:
          - CLM-035
          - CLM-036
          - CLM-037
        depends_on:
          - TASK-014

      - id: TASK-022
        type: refactor
        title: "Extract a testable run() seam from main()"
        description: |
          Turn TASK-021's `run` tests green. Reduce `main()` to exactly one
          statement:

            func main() { os.Exit(run(os.Stdout, os.Stderr)) }

          Everything `main` does today moves into `run(stdout, stderr io.Writer)
          int`: the sandbox helper gate and its 126 exit, `NewRootCommand`, the
          `SetOut`/`SetErr` wiring, `Execute`, and the `reportError` call — all
          returning a code rather than calling `os.Exit`.

          MIND THE RECORDED LANDMINE. Routing `fmt.Fprintln(os.Stderr, ...)` behind
          an `io.Writer` parameter makes errcheck fire where it did not before:
          golangci-lint's `DefaultExcludedSymbols` excludes
          `fmt.Fprintln(os.Stderr)` by the ARGUMENT EXPRESSION, so the identical
          call through a parameter is a NET-NEW finding. `_, _ =` is not an escape
          — go-standards GO-010 matches `_, _ = $FUNC(...)` verbatim. The escape
          that works is already in the file: `writeDiagnostic` assigns the error and
          returns a bool. Keep it, route every write through it, and do not
          reintroduce a bare `Fprintln` on the seam.

          Read the pack's own `.golangci.yml` (inside the installed go-toolchain
          pack) rather than the repo-root one when predicting lint here — the root
          file is a v1 config that golangci-lint v2 cannot load, so it is not the
          config that runs.

          `main.go` should land at 16/17 or better. Report the measured before and
          after, and confirm the three helper-gate statements Phase 3 added are now
          covered rather than merely relocated.

          AS BUILT (3e084e2): 9/17 -> 19/20. The only uncovered statement is
          `main()` itself, which is the irreducible floor — `func main() {
          os.Exit(run(os.Stdout, os.Stderr)) }`. The seam is TWO functions, not
          one: `run(stdout, stderr)` delegates to `runWith(stdout, stderr,
          sandboxGate, newRoot)`, because the gate and the command constructor must
          be INJECTABLE for their branches to be reachable — see CLM-017 for why a
          package-level var was not an option. The helper-gate error path is now
          exercised for the first time ANYWHERE, by
          `TestRun_SandboxHelperErrorExitsOneTwentySix`.

          ONE SURFACED DEVIATION, recorded because it touches a file outside this
          task: `cmd/backstop/status_drift_gate_test.go` had a test helper named
          `run`, colliding with the mandated seam name in the same package. It was
          renamed `runStep` across 10 call sites — a mechanical rename of test-local
          scaffolding, no behavior change. Also fixed at source rather than waived:
          two error-wrapping findings surfaced by the merge.
        files:
          - cmd/backstop/main.go
          - cmd/backstop/status_drift_gate_test.go
        claims:
          - CLM-035
          - CLM-037
        depends_on:
          - TASK-021

      - id: TASK-023
        type: refactor
        title: "Convert sandbox dispatch from runtime GOOS to build tags"
        description: |
          Turn TASK-021's dispatch tests green. `SandboxedRun` and
          `SandboxedRunStdout` keep their signatures and their output contracts
          exactly — `CombinedOutput` for the first, the explicit stdout buffer plus
          stdin pipe and "stdout captured so far alongside the error" for the second
          — and delegate to an unexported platform function.

          ⚠ THE THREE-TAG LAYOUT BELOW WAS SUPERSEDED BEFORE COMMIT. Read the
          "PHASE 3b AS-BUILT — RULING B" notes block first: a `!linux && !darwin`
          file is permanently `coverage_unmeasurable` and would have failed CLM-028
          on exactly the residual this phase removes. AS COMMITTED there is no
          `sandbox_darwin.go` and no unsupported-platform file; everything non-linux
          lives in `sandbox_nonlinux.go` (`//go:build !linux`) behind a
          `sandboxPlatformSupported(runtime.GOOS)` guard. The paragraph below is
          retained as the record of what was mandated and measured, not as
          instruction.

          The implementations move into build-tagged files: the darwin
          `sandbox-exec` path into `sandbox_darwin.go` (`//go:build darwin`), the
          Landlock+seccomp path into the existing `sandbox_linux.go`, and the
          refusal into a file tagged for everything else. `darwinSandboxProfile`
          MOVES UNCHANGED — not one character of the profile string, and no change
          to what it returns for a given packDir. (As built, it moved unchanged
          into `sandbox_nonlinux.go` instead.)

          ⚠ DO NOT NARROW `sandbox_nonlinux.go` TO `!linux && !darwin`. This is the
          trap, and the file's own doc comment names it. That file is
          `//go:build !linux` today and it holds THE ONLY NON-LINUX DEFINITION OF
          `MaybeRunSandboxHelper` (`sandbox_nonlinux.go:24`, a `return nil` stub)
          alongside the `linuxSandboxedRun`/`linuxSandboxedRunStdout` stubs.
          `cmd/backstop/main.go` — and, after TASK-022, `run()` — calls
          `MaybeRunSandboxHelper` UNCONDITIONALLY on every platform. Narrow the tag
          and the darwin build loses the symbol and stops compiling.

          The "obvious fix" at that point is the dangerous one, which is exactly why
          it is written here: dropping the call from main.go makes the build go green
          and SILENTLY DISARMS THE LINUX SANDBOX. Nothing in the darwin test suite
          would notice.

          So the split introduces THREE tag scopes, not two, and one of them is not
          about dispatch at all:
            - the platform dispatch function: defined once per platform, in
              `sandbox_darwin.go` (darwin), `sandbox_linux.go` (linux), and a
              `!linux && !darwin` file for the refusal.
            - `MaybeRunSandboxHelper`'s non-linux stub: STAYS AT `!linux`, because
              its contract is "every platform that is not linux has a no-op helper
              gate", which the dispatch split does not change.
          The helper gate's cross-platform symbol requirement is a REAL CONSTRAINT
          that this refactor does not dissolve. Deleting the `switch runtime.GOOS`
          removes the reason the file carries the `linuxSandboxedRun*` STUBS; it does
          not remove the reason the file exists.

          `sandbox_nonlinux_test.go` is in this task's file scope for that reason: it
          is the wiring lock that catches a mis-tagged split at compile time rather
          than at runtime on a user's Mac.

          AS BUILT (3e084e2), four test-side consequences of the merge:
            - `TestNonLinuxSandboxStubsFailClosed` was REPLACED by
              `TestNonLinuxSandboxHelperTagIsNotNarrowed`. The refactor deleted its
              subject (the `linuxSandboxedRun*` stubs), so the honest move was a new
              test for the constraint that still matters: it PARSES the build
              constraint on `sandbox_nonlinux.go` and asserts it is exactly `!linux`.
              That is a direct lock on the orphaning trap this task warns about —
              stronger than the stub-calling test it replaces, because it fails on
              the mis-tag itself rather than on a downstream symptom.
            - `TestSandboxProfileAllowsDyldLibraries` MOVED VERBATIM into a new
              `sandbox_darwin_test.go`. Forced, not chosen: the profile is now
              behind a build tag, and `sandbox_realconvert_test.go` (where it lived)
              must stay UNTAGGED because the linux exec tests use its helpers. The
              `_darwin_test.go` suffix supplies the implicit constraint. The test
              body is unchanged, so CLM-016 still holds on its original terms.
            - `sandbox_linux.go` is in this task's file list: the seam rename
              `linuxSandboxedRun*` -> `platformSandboxedRun*` is one name across all
              tag scopes, so the linux file changes even though its logic does not.
            - `sandbox_stdout_test.go` gained
              `TestSandboxedRunStdout_NonZeroExitReturnsStdoutSoFar` (scope extension
              authorized). It lifts `sandbox_nonlinux.go` to 93.3% — but its value is
              the CONTRACT it locks, not the margin: stdout-captured-so-far is
              returned on a non-zero exit AND no stderr leaks into it. That is the
              property keeping a converter's banner out of the SARIF the gate parses,
              and until now nothing asserted it on the error path.
            - ONE DOC DEFECT SHIPPED and is corrected separately: comments in
              `sandbox_nonlinux.go:26` and `sandbox_dispatch_test.go:100` still
              describe the three-tag layout by naming `sandbox_darwin.go` and the
              unsupported-platform file, both DELETED by ruling B. Cosmetic, no
              behavior — but worth fixing rather than leaving, because a comment
              naming files that do not exist sends the next reader hunting for a
              layout that was rejected. Recorded so it is not re-derived as a
              finding later.

          THE POINT IS DEAD CODE, NOT PERCENTAGES. Each platform now compiles only
          what it can execute, so nothing unreachable is measured on either. Say so
          in the commit and in the report: this is the same file count and less
          dead code, and the coverage movement is a consequence rather than the
          goal. If the numbers move but `sandbox.go` still contains a platform
          branch, the refactor did not happen.

          CLM-016 IS THE HARD CONSTRAINT. All six darwin sandbox tests —
          `TestSandboxSecurityDenialsHold`, `TestSandboxDeniesProjectFileRead`,
          `TestSandboxDeniesFileWrite`, `TestSandboxDeniesNetwork`,
          `TestSandboxConvertWithRealInterpreter`,
