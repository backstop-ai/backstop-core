               working tree (the CI condition), where bare diff mode sees nothing.
      CLM-007  BOTH failure modes of base resolution are exit-2 config errors that
               name what failed — a rev that does not resolve at all, AND a rev
               that resolves but shares no merge-base with HEAD (unrelated
               histories, the shape a force-push or a grafted shallow clone
               produces). Neither ever falls back to `--all`, to HEAD, or to an
               empty scope.
      CLM-008  `--base` combined with `--all` or `--file` is an exit-2 config error.
      CLM-009  ONE diff resolver: `ComputeGateScope` keeps its exact signature and
               delegates to the base-aware function with an empty base, so the 40+
               existing call sites are untouched and no second implementation of
               "what changed" exists.
      CLM-010  the run reports scope mode, the requested base, the resolved
               merge-base SHA and the in-scope file count in both human and JSON
               output, so an empty CI scope is VISIBLE rather than silent.

    REQ-003: A Linux sandbox with darwin-parity denials.
      CLM-011  an internal capability struct — readable paths, writable paths,
               network bool, plus the ACHIEVED Landlock ABI — is what the Linux
               ruleset and seccomp filter are DERIVED from, not a second hardcoded
               profile literal, and it carries a code comment at its definition
               site pointing at BUNDLE-021 OQ-2.
      CLM-012  graduated-profile-capable: changing the capability set changes the
               DERIVED restriction spec (network allowed drops the socket-denial
               rules; an added readable path adds a `path_beneath` rule; a lower
               ABI narrows the handled-access mask), proven by pure-function tests
               over the derived spec that run on any platform including darwin.
      CLM-013  on linux both `SandboxedRun` and `SandboxedRunStdout` execute the
               command through a re-exec trampoline that, on a LOCKED OS THREAD,
               sets `PR_SET_NO_NEW_PRIVS`, installs a Landlock ruleset and a
               seccomp filter, and then `execve`s the command FROM THAT SAME
               THREAD — with no writable path anywhere, no readable path outside
               the capability's readable set, and no network. The backstop parent
               process is never restricted.
      CLM-014  the falsifiable assertion triple holds on a real Linux host: a read
               outside the readable set is denied; a network attempt is denied; and
               a POSITIVE CONTROL — reading a file inside packDir, plus the same
               network call under a network-allowed capability — SUCCEEDS. The
               control leg is not optional: the 2026-07-28 probe is the recorded
               case where two denials and a failing positive control together meant
               "the mechanism never started", not "denial works". These assertions
               EXECUTE in the CI run: the go-toolchain pack's go-test engine runs
               `go test` project-wide (`project_target: "./..."`, package-scoped),
               so a new `//go:build linux` test file is compiled and run by the gate
               itself and lands in diff scope as a new file. This is a determined
               fact, not a hope — no separate CI step is needed to exercise it.
               FINAL WORDING, and it applies to CLM-013 equally: the assertable
               facts are (i) the suite RAN WITH ZERO FAILURES on linux, and (ii)
               `sandbox_linux.go` BECAME MEASURED — a file that does not compile on
               darwin cannot acquire a coverage number without having been built and
               executed. Those two together prove the linux-tagged tests ran. Do not
               write, or accept, an evidence sentence that requires seeing a test
               NAME.
               EVIDENCE WORDING CORRECTED 2026-07-28 against the mechanism: a
               PASSING test produces NO SARIF finding, so no passing test name can
               EVER appear in gate output — grep of the whole run log shows zero Go
               test names, for every package. Do NOT expect to see
               `TestLinuxSandbox_*` named in a green run; their absence is the
               engine working, not evidence of a skip. What IS provable, and what
               this claim is now written against, is the pair: `pack_engines` PASS
               means zero test failures repo-wide on linux, and a non-zero
               `sandbox_linux.go` coverage measurement means `//go:build linux` code
               compiled AND ran. (The alternative — surfacing the engine's raw
               output on demand so individual test names are visible — is a real
               capability and a bigger change; it is named here as the option not
               taken, not smuggled in.)
      CLM-015  when the mechanism is unavailable — Landlock ABI 0, ENOSYS, or
               Landlock absent from the kernel's LSM list — the call returns an
               explicit error naming Landlock, the kernel version and ISSUE-020,
               and runs NOTHING. Never a silent pass-through to an unsandboxed
               exec, and the Linux execution tests FAIL rather than skip when the
               mechanism is missing. AMENDED 2026-07-28: "returns" means THE
               CALLER RECEIVES IT. Run 30381252600 satisfied this claim INSIDE the
               helper and had it defeated by the parent, which discarded the
               helper's stderr — see CLM-038. A diagnostic nothing captures is a
               silent failure wearing a loud error's clothes, so CLM-015 is not
               end-to-end true until CLM-038 lands.
      CLM-016  darwin is untouched: `darwinSandboxProfile` is unchanged and every
               existing darwin sandbox test passes unmodified.
      CLM-017  the exported sandbox interface is unchanged — no caller in
               `pkg/packval/executor.go` or `cmd/backstop/pack_gate.go` changes.
               The ONE addition is the trampoline gate. POST-PHASE-3b the gate is
               the first statement of the SEAM BODY — `runWith(stdout, stderr,
               sandboxGate, newRoot)` — with `run()` a single statement delegating
               to it and `main()` a single statement delegating to `run()`;
               `cmd/backstop/main.go` owns the 126 exit through those return
               values rather than by calling `os.Exit` itself. Literal
               gate-in-`run()` is UNACHIEVABLE with `run(stdout, stderr)`'s
               signature fixed: the gate would not be injectable, so its error
               branch would be permanently uncovered (main.go red at 17/20), and
               package-level var injection trips
               `go.core.no-global-mutable-state` — the only existing exception,
               `root.go:20`'s `var version`, carries a `nosemgrep` justified by a
               constraint (`-ldflags -X` can only write a package-level var) that
               an injection seam does not have. Ordering is locked behaviorally by
               `TestRun_SandboxGateRunsBeforeAnyCommandWork` (command-construction
               spy plus empty-stdout assertion), not by the word "first".
               (TASK-014's identical wording is deliberately NOT updated: it
               executes BEFORE Phase 3b and describes the tree it verifies.) A
               `TestMain` in `pkg/packval` calls the same gate so the helper is
               reachable under `go test`. Both are required; either one alone
               yields a binary or a suite that sandboxes nothing.
      CLM-030  network denial is SECCOMP's, not Landlock's, and the denial surface
               is stated exactly. The filter validates the audit arch and returns
               EPERM for: `socket` and `socketpair` (creation); `connect` and
               `bind`; `sendto`, `sendmsg` and `sendmmsg`; `recvfrom`, `recvmsg`
               and `recvmmsg`; and `io_uring_setup` and `io_uring_enter` — the
               last pair because network operations submitted as ring entries
               never invoke the filtered syscalls at all, which is the standard
               bypass for a filter of this shape. Everything else is allowed.
               KNOWINGLY OUTSIDE the surface, with reasons recorded in the code
               comment: `io_uring_register` (a ring can neither be created nor
               submitted to, so registration achieves nothing) and
               `accept`/`accept4`/`listen` (they need a listening socket, whose
               every precursor is denied, and the trampoline passes no socket fds).
               Landlock's TCP-only net rights are layered on top when ABI >= 4 as
               defence in depth, never as the basis of the claim — resting it on
               them would leave UDP, and therefore DNS, open, and would vanish
               entirely on a Landlock ABI 1 host.
      CLM-034  `LANDLOCK_ACCESS_FS_EXECUTE` is deliberately NOT in the handled
               mask, which is the parity-correct translation of darwin's
               `(allow process*)` — Landlock restricts only what the mask handles,
               so omitting the right is how "do not restrict this class" is
               expressed. The confinement that matters is unaffected. Separately
               and non-negotiably, the derived read grants MUST cover the system
               library paths with `READ_FILE` and `READ_DIR`, or the dynamic
               loader dies and every convert script fails — the Linux instance of
               the ISSUE-029 dyld defect, proven by a PURE DERIVATION test that
               runs without a Linux host rather than by the Phase 5 runner.
      CLM-031  the Landlock ABI is negotiated EXPLICITLY: the achieved level and
               the exact handled-access mask are recorded in the diagnostic, the
               mask is narrowed to what the running kernel knows, ABI 1 is a fully
               functional configuration for this parity claim, and ABI 0 is a loud
               refusal. No silent best-effort downgrade.
      CLM-032  the restriction and the `execve` happen on the SAME locked OS
               thread, and the proof is that confinement is observed IN THE CHILD
               — a test that only asserts the helper's syscalls returned 0 would
               pass against an unconfined child, which is the exact failure this
               claim exists to catch.
      CLM-033  no new module: `golang.org/x/sys` is promoted from indirect to
               direct and supplies both halves; direct dependencies go from five to
               six, and the tree still contains zero `import "C"`.

    REQ-004: CI blocks on the real gate, diff-scoped, on push AND pull_request.
      CLM-018  ci.yml's blocking job builds the binary, installs the locked packs,
               and runs `backstop gate --base <derived>`; no raw golangci-lint, raw
               `go test`, or hand-rolled coverage-threshold step survives in it.
      CLM-019  the base is derived PER EVENT — pull_request uses the PR base sha,
               push uses the before sha — and the guard is a RESOLVABILITY check,
               not a zero-SHA string comparison: the derived value is only used
               once `git rev-parse --verify` confirms it exists in the fetched
               history. Empty, all-zeros (branch creation) AND non-zero-but-
               unreachable (the force-push shape) all take the same loud `HEAD^`
               fallback, and the job fails hard when `HEAD^` does not resolve
               either. STATUS 2026-07-28: the PUSH half is PROVEN (run
               30381252600 — 35 files in scope on a pristine checkout, fallback
               never fired). The PULL_REQUEST half is UNPROVEN: that run was
               push-only, so no PR-event base derivation has ever executed. Closing
               it is cheap and must not be skipped — open a PR from the next work
               branch and capture the PR-event base and file count. Half a claim
               proven is not the claim.
      CLM-020  checkout fetches full history (`fetch-depth: 0`) so both refs
               resolve; a shallow checkout is what makes the PR base unresolvable.
      CLM-021  the job puts every declared Layer-0 and pinned tool on PATH, each
               from a NAMED authority: go from setup-go via `go-version-file:
               go.mod`; semgrep 1.96.0 and ast-grep 0.43.0 from the allowlist
               (`pkg/pack/engine/allowlist.go`); golangci-lint from an explicit
               v2.6.0 pin IN ci.yml, because the allowlist has no entry for it and
               go.mod's v1.64.8 tool directive would break the pack's v2-only
               `--output.sarif.path` command. The sandbox contributes NO tool: as
               of the 2026-07-28 ruling the mechanism is Landlock + seccomp, which
               are kernel APIs with nothing to install — ci.yml must therefore
               carry no sandbox install step at all. A missing tool stays a loud
               exit-2, never a skipped dimension.
      CLM-022  a `pack install` failure fails the job BEFORE the gate runs, so the
               gate never executes against a partially materialized fleet.
      CLM-023  the temporary probe workflow is removed by the same change that
               lands the real blocking job.
      CLM-029  the `baseline` job installs the locked packs before generating, so
               it PRODUCES A BASELINE instead of exiting 2 at `pack_loading` and
               publishing nothing. REWORDED 2026-07-28 from a measured result: the
               original wording ("does not turn one `missing_pack` failure into
               six inside the published artifact") described a corruption hazard
               that cannot occur — with an empty packs directory the gate never
               reaches `pack_lock_verification`, and `runBaselineGenerate` refuses
               to write a baseline from a gate that produced no steps. The claim is
               therefore about AVAILABILITY, not integrity: without the install
               step the baseline silently stops being refreshed while every run
               reports the failure. This keeps the "do not make ISSUE-086 worse"
               constraint true; it does not claim to close ISSUE-086.
               STATUS 2026-07-28: proven LOCALLY (detached-worktree measurement,
               TASK-018) and UNPROVEN IN CI — the `baseline` job is gated on the
               gate job, which failed in run 30381252600, so the job was SKIPPED and
               the `pack install` step has never executed on a runner. Closing this
               needs no extra work, only a run that gets past the gate job.

    REQ-005: File-granularity activation — "green if the diff is green", and no
             grandfather on a touched file.
      CLM-024  a run whose diff touches a file carrying a PRE-EXISTING baselined
               finding exits NON-ZERO and names that finding — "it was there
               before, my changes are clean" does not pass.
      CLM-025  a run whose diff touches only clean files exits ZERO even while the
               repository still carries its known whole-repo debt.

    REQ-006: Proven on the real runner, not simulated.
      CLM-026  SATISFIED 2026-07-28. The ubuntu-latest probe values —
               apparmor_restrict_unprivileged_userns=1, seven failing bwrap
               invocations including both positive controls, kernel
               6.17.0-1020-azure, Landlock ABI 7 — were CAPTURED from real output
               and committed at `pkg/packval/testdata/ubuntu-runner-probe.txt`. The
               mechanism choice was NOT confirmed against them: they falsified it,
               it was escalated, and the founder ruled for Landlock + seccomp the
               same day. The claim is met by the escalation, which was the branch
               it always named.
      CLM-027  a real `backstop gate` run on ubuntu-latest shows the pack_engines
               and coverage dimensions ACTUALLY EXECUTING — not capability_absent,
               not errored — proven by the run's JSON report, which ci.yml now
               emits alongside the human log.
               WORDING DEFECT, RECORDED RATHER THAN QUIETLY FIXED: as originally
               written this claim cited "that run's own JSON" through THREE RUNS in
               which ci.yml emitted no JSON at all. The claim was unprovable by its
               own stated evidence, and nobody caught it because the human step
               summary happened to show the same facts. A claim naming evidence
               that does not exist is indistinguishable from a satisfied one until
               somebody tries to check it — the argument for citing mechanisms
               rather than intentions, made against this plan's own text.
      CLM-028  the acceptance criterion is closed ONLY by TASK-019's real CI run.
               No local result, and no green unit test over the sandbox, may be
               reported as satisfying it. BLOCKED EXTERNALLY 2026-07-28 by
               `artifact_status_drift`: seven corpus-level broken promises
               (ISSUE-018's two mandated test names, ISSUE-036's five signature
               fixture ids) block ANY CI run of this repo and are NOT this plan's
               to fix. A read-only investigation is their tracker. CLM-028 cannot
               close until that lane resolves, and this plan must not route around
               it by narrowing scope, waiving, or pulling a baseline into CI to
               grandfather them — the local baseline hiding them is precisely why
               they went unseen. STRENGTHENED 2026-07-28: green means
               UNCONDITIONALLY green. No dimension is expected-red, no residual is
               pre-excused, and no finding may be reported as "known" or
               "explained" in satisfaction of this claim. The three structural
               coverage findings that prompted this wording are FIXED by Phase 3b,
               not annotated. If the first run is red, the correct report is a red
               run — widening what green means is the one move this claim exists
               to forbid.

    REQ-007: The coverage floor is reachable on every platform the gate runs on.
      CLM-035  `cmd/backstop/main.go` clears the floor because `main()` is reduced
               to a single `os.Exit(run(...))` statement and everything it did is
               testable inside `run() int` — including the sandbox helper gate's
               error handling, which Phase 3 added as three permanently-dead
               statements. The `writeDiagnostic` assign-and-return-bool helper
               stays: routing `fmt.Fprintln` through an `io.Writer` parameter is
               what makes errcheck fire, and `_, _ =` is not an escape from it.
      CLM-036  `pkg/packval/sandbox.go` contains no platform-dead code: the
               exported functions keep their signatures and delegate to an
               unexported platform function implemented in build-tagged files, so
               each platform compiles and measures only code it can execute. The
               runtime `switch runtime.GOOS` is gone, and with it the reason
               `sandbox_nonlinux.go` existed as a stub-symbol shim.
    REQ-010: The linux sandbox implementation meets the coverage floor on linux.
      CLM-042  `pkg/packval/sandbox_linux.go` clears the per-file floor WHEN
               MEASURED ON LINUX — the only platform where it compiles, and
               therefore the only place the measurement exists. Statements that are
               UNREACHABLE BY CONTRACT (the post-`unix.Exec` line the source already
               documents at :108-112) are COUNTED AND JUSTIFIED individually rather
               than chased: the floor is reached around them, and any code contorted
               to execute them would break the contract the code exists to hold.
               The falsifier is a RUNNER measurement; a green local suite proves
               nothing here, because the file does not compile on darwin at all.

    REQ-011: What the instrument cannot observe is split out and declared, not hidden.
      CLM-043  every exec-erased statement lives in `sandbox_linux_helper.go` and
               nowhere else — the five exec-only functions plus
               `MaybeRunSandboxHelper`'s helper branch — so the declared exclusion
               names exactly the code the coverage instrument cannot observe, and
               every remaining statement in the sandbox implementation is measured
               with no exemption. Structurally locked by AST tests in both
               directions: nothing exec-side left in the measured file, nothing
               measurable hidden in the excluded one.
      CLM-044  the exclusion is DECLARED BY THE PACK and carries a JUSTIFICATION
               STRING that the producer echoes into the coverage record, so an
               exclusion is visible in the gate's own output rather than silent.
               The justification standard is "the instrument cannot observe it,
               here is the profile" — NOT "this is hard to test". The mechanism must
               make a casual exclusion HARDER than fixing the coverage, or it
               becomes the waiver route this plan rejected twice.

    REQ-013: The justification field exists in core; the requirement lives in the pack.
      CLM-046  `check.CoverageRecord` carries an ADDITIVE
               `Justification string json:"justification,omitempty"`, and
               `coverageExclusionReason` PREFERS it when rendering the
               `coverage_exclusion` warning, falling back to the existing bare
               "(pack-declared exclusion)" text when it is empty. `omitempty` keeps
               every existing producer wire-compatible — including packs that still
               hardcode `excluded:false` — so this is purely additive to the
               contract.
               CORE DOES NOT REJECT AN UNJUSTIFIED EXCLUSION. The
               mandatory-justification REQUIREMENT lives in the go-toolchain pack
               and in the dogfood test, never in the binary: policy belongs to
               packs, and a core-side rejection would be exactly the baked opinion
               the thin-executor rule forbids. Core carries the DATA; the pack
               carries the DEMAND.

    REQ-012: CI gates only files an author wrote.
      CLM-045  no workflow step leaves an ungitignored file behind, so the diff
               scope contains only author-written files. The two known droppings —
               `ast-grep.zip` (tool-install leftover, and the original 6-vs-5
               scope-count culprit) and `gate-report.json` (the gate's own `--json`
               output) — are gitignored or relocated, and an explicit allowed-
               leftovers set makes any new dropping a test failure rather than a
               silent addition to someone's diff. This does NOT change the scope
               rule: diff-scope-includes-untracked is founder-ratified by design
               (ISSUE-004), because an author's new file must be gated before it is
               committed. The defect is CI dropping files, not the gate seeing them.

    REQ-009: Landlock rules match the file type of the path they name.
      CLM-040  every `path_beneath` rule carries only rights VALID FOR ITS PATH'S
               TYPE: for a non-directory, the whole DIRECTORY-ONLY class is dropped
               (READ_DIR today; REMOVE_*, MAKE_* and REFER the moment anything
               grants write on a file), leaving the file-applicable rights. The
               kernel rejects a directory-only right on a regular file with EINVAL,
               which is a helper refusal and exit 126 — so this is a
               does-the-sandbox-install-at-all property, not a hardening detail.
               Narrowing the CLASS rather than the observed bit is the claim:
               fixing only READ_DIR re-arms the identical trap for the first
               writable file path.
      CLM-041  the narrowing is proven THREE ways, and none substitutes for
               another: a PORTABLE unit falsifier over the pure
               `narrowRuleToInodeType(mask, isDir)` function, driven across the REAL
               MIXED readable list (which contains both a regular file and a
               directory by design) rather than one path; an AST WIRING GUARD,
               because the apply site is linux-tagged and no darwin test ever
               executes it, so a correct-but-uncalled function would otherwise pass
               everything; AND a runner re-run as the only real evidence the sandbox
               installs. No green derivation suite may be
               reported as evidence that the sandbox works — this plan has been
               fooled by exactly that reading twice (the discarded stderr, and this
               mask-vs-inode defect), both of which were correct in the abstract and
               wrong against a real host.

    REQ-008: A sandbox failure reaches the caller, on every arm.
      CLM-038  `platformSandboxedRunStdout` captures the helper's stderr into a
               SEPARATE buffer and folds it into the RETURNED ERROR on a non-zero
               exit. The returned stdout stays byte-clean — stderr goes into the
               error and never into the parsed bytes — so the clean-SARIF
               guarantee that made this arm stdout-only in the first place is
               untouched.
      CLM-039  the diagnostic token contract holds on BOTH arms: an error surfaced
               from a failed helper carries "andlock", the kernel release, and
               "ISSUE-020". The stdout arm is proven by a PORTABLE test over the
               pure fold function (it must run on darwin — the whole point is that
               no Linux host was needed to catch this, and none should be needed to
               keep it caught); the `CombinedOutput` arm satisfies it by
               construction today and gets an assertion so it stays that way.
      CLM-037  neither change alters behavior: the darwin sandbox tests still pass
               UNMODIFIED, the exported sandbox signatures are untouched, and
               `backstop`'s exit codes for every existing path are unchanged —
               these are refactors that clear a floor, never coverage gaming.

phases:
  - id: phase-1
    name: "Phase 1: Make the pack fleet materializable on a fresh checkout"
    tasks:
      - id: TASK-001
        type: setup
        title: "Probe the real ubuntu-latest runner for the sandbox mechanism facts"
        description: |
          STATUS: DONE, 2026-07-28. Its captured output is committed at
          `pkg/packval/testdata/ubuntu-runner-probe.txt` (run
          https://github.com/backstop-ai/backstop-core/actions/runs/30364880850),
          and it FALSIFIED this plan's original mechanism. The founder ruled the
          same day for Landlock + seccomp; see the AMENDED block in the notes. The
          task description below is kept as written because it is the record of what
          was asked and how, and because the probe file it produced is still
          required reading for TASK-011 and TASK-012 — those edges now point at
          evidence that ruled AGAINST the hypothesis the probe was built to test,
          which is the most useful thing a probe can do.

          Add a TEMPORARY workflow that answers ISSUE-020's re-probe list on a real
          GitHub Actions Linux runner. The spike's Docker test bed could not answer
          these — LinuxKit compiles in neither AppArmor nor Landlock, so any
          container-derived answer would be a false negative.

          Trigger it on `push` to branches matching `probe/**` so it can run from a
          side branch without touching main. Run every item and print raw output;
          do not summarize inside the workflow.

          Ordered by load-bearingness (this order is from the issue):
            1. `cat /proc/sys/kernel/apparmor_restrict_unprivileged_userns`
               — decisive for the bwrap path. READ IT. DO NOT ASSUME THE VALUE.
            2. the corrected bwrap invocation, run as the unprivileged runner user:
                 bwrap --ro-bind /usr /usr --symlink usr/bin /bin \
                   --symlink usr/lib /lib --symlink usr/lib64 /lib64 \
                   --unshare-user --unshare-net --dev /dev --proc /proc /bin/true
            3. the falsifiable assertion triple (unbound-path read denied;
               `getent hosts` under --unshare-net non-zero; the same command
               WITHOUT --unshare-net exit 0).
            4. Landlock ABI probe (expect ABI 5+ on a real GHA kernel; the spike
               has ZERO signal here, so this is new information either way).
            5. `--unshare-pid` with `--proc` (the masked-/proc failure in the
               container was a Docker artifact and may not reproduce).
            6. `unshare -Urn` plus `aa-status`.
            7. `uname -r`, `/sys/kernel/security/lsm`, and whether `bwrap` is
               preinstalled or needs `apt-get install -y bubblewrap` — including
               `bwrap --version`.

          Push the probe branch, let the run finish, and CAPTURE the real output.

          THEN COMMIT IT. Write the captured output VERBATIM to
          `pkg/packval/testdata/ubuntu-runner-probe.txt`, with a header recording
          the runner image label, the date, and the workflow run URL. A task report
          is not a durable landing place: TASK-011 and TASK-012 may be executed by a
          different session with none of this conversation, and the whole point of
          the probe is that the mechanism choice rests on measured values rather
          than on assumptions about Ubuntu. Captured-from-real-output is also the
          repo's standing rule for fixtures — a probe record fabricated or
          paraphrased from memory is worse than none.

          These values are the evidence for CLM-026 and the input TASK-012's
          mechanism commitment is checked against.

          IF item 1 or item 2 falsifies the bubblewrap path, STOP AND ESCALATE with
          the captured output. Do not silently switch to Landlock+seccomp, and do
          not weaken the sandbox to make a job go green — the mechanism contest is
          a founder-level call, not an implementation detail.
        files:
          - .github/workflows/linux-sandbox-probe.yml
          - pkg/packval/testdata/ubuntu-runner-probe.txt
        claims:
          - CLM-026
        depends_on: []

      - id: TASK-002
        type: test
        title: "Falsifier: every locked pack must be materializable from a fresh clone"
        description: |
          Write the test that is RED today and that the migration turns green. Put
          it at the repo ROOT in `package backstopcore_test`, alongside the existing
          `workflows_test.go` and `release_config_test.go` — the root package is
          where this repo's tests about its own configuration already live, and it
          is the only package that can reach `backstop.lock` without `../..` games.

          `TestBackstopLock_EveryEntryIsCIMaterializable` parses the real
          `backstop.lock` and asserts, for EVERY entry:
            - `source_type: git` entries carry a non-empty `version` and a
              `source_coordinate`, OR
            - `source_type: local` entries carry a non-empty `local_path` that
              resolves to a directory INSIDE the repository root.
          An entry with no `local_path`, or whose `local_path` escapes the
          repository root (any resolved path outside it — `../` is the shape that
          matters), FAILS. Name the offending pack in the failure message.

          `TestBackstopYmlAndLock_DeclareTheSameCoordinates` asserts the
          `backstop.yml` `packs:` keys and the `backstop.lock` keys are the same
          set. This is the falsifier for migration step 2 — `pack add` leaves the
          old backstop.yml key behind and nothing else complains.

          `TestNoLiveKeyingOnRetiredPackCoordinates` — the falsifier for CLM-003's
          Go leg, and the reason that claim is worded around KEYING rather than
          around textual absence.

