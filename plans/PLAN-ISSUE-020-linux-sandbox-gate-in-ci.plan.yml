      - id: TASK-013
        type: test
        title: "The falsifiable assertion triple as real Linux execution"
        description: |
          Write the `//go:build linux` execution tests plus the `TestMain` the
          trampoline needs. These do not run on the development machine; they are
          what Phase 5 proves in CI, and they are the difference between "a Linux
          branch exists" and "the Linux branch denies anything".

          FIRST, THE TESTMAIN — without it every test below fails for the wrong
          reason. Under `go test`, `/proc/self/exe` is the TEST binary, so the
          helper gate must run there too. `pkg/packval` has NO `TestMain` today;
          create one whose first statement calls `packval.MaybeRunSandboxHelper()`
          and handles its error, then `os.Exit(m.Run())`. This is the test-side half
          of CLM-017's wiring pair.

          The triple, and it is a triple for a reason — a bare non-zero exit cannot
          distinguish "the sandbox denied correctly" from "the sandbox never
          started". The 2026-07-28 probe is the recorded instance of exactly that
          confusion; read its "READ THIS FIRST" point 3 before writing these.

          `TestLinuxSandbox_DeniesReadOutsideReadableSet` — reading a path outside
          the capability's readable set fails with a denied error.

          `TestLinuxSandbox_DeniesNetwork` — a network attempt under the default
          capability fails. Use a UDP or DNS-shaped attempt as well as a TCP one:
          Landlock's net rights are TCP-only, so a TCP-only assertion would pass
          even if the seccomp filter — which is what CLM-030 actually rests on —
          were missing entirely.

          `TestLinuxSandbox_NetworkAllowedControlLegSucceeds` — the SAME call under
          a network-allowed capability succeeds. THE CONTROL LEG.

          `TestLinuxSandbox_ReadsPackDirContents` — the SECOND positive control. A
          file inside packDir IS readable, so the denials above are not simply
          "nothing works". The probe's ITEM3_0 is why this is mandatory: it is the
          assertion that failed and exposed the vacuous triple.

          `TestLinuxSandbox_WriteInsidePackDirIsDenied` — writes are denied even
          where reads are allowed, which is what proves the handled-access mask
          covers the write family rather than only the read rights.

          `TestLinuxSandbox_ConfinementCarriesIntoTheExecdChild` — CLM-032, and the
          one test that catches the thread-migration hole. Assert the restriction
          from INSIDE the exec'd process (have the child attempt the denied
          operation and report), not by checking the helper's syscall return codes.
          A helper whose syscalls all returned 0 while the goroutine migrated off
          the locked thread produces an unconfined child and a passing test suite.

          `TestLinuxSandbox_ConvertScriptProducesCleanStdout` — a real convert-shaped
          script that writes a banner to stderr and payload to stdout, run through
          `SandboxedRunStdout`, yields payload only. This is the actual gate path.

          `TestLinuxSandbox_RealInterpreterRunsUnderTheFilter` — the linux analogue
          of darwin's `TestSandboxConvertWithRealInterpreter`, and the measurement
          the notes call for rather than assume: a REAL interpreter running a REAL
          convert script under the socket-denying filter. If an interpreter cannot
          start because it opens a socket during init, report that as a finding —
          it is a BUNDLE-021 OQ-2 capability question, not a licence to widen the
          filter.

          When Landlock is unavailable these tests must FAIL, not `t.Skip`. A skip
          is how a Linux sandbox stays unproven for another six months; the
          founder's posture is that failures are loud and attributed. Say so in a
          comment at the top of the file so a future reader does not "helpfully"
          add a skip.
        files:
          - pkg/packval/sandbox_linux_exec_test.go
          - pkg/packval/sandbox_linux_constants_test.go
          - pkg/packval/main_test.go
        claims:
          - CLM-014
          - CLM-032
        depends_on:
          - TASK-011

      - id: TASK-014
        type: verification
        title: "Verify darwin is untouched and the Linux path compiles"
        description: |
          Run and report true exit codes for:

            go build ./...
            GOOS=linux go build ./...          (the linux branch must COMPILE here,
                                                where nobody can run it yet)
            GOOS=linux go vet ./pkg/packval/   (plain `go vet` never sees the
                                                //go:build linux file at all)
            go vet ./pkg/packval/
            go test ./... -race -count=1
            go test ./pkg/packval/ -race -count=1 -run 'Sandbox' -v
            go build -o bin/backstop ./cmd/backstop/
            ./bin/backstop gate

          Then verify the dependency and wiring claims, which a passing test suite
          does not cover:
            - `go mod tidy` leaves `golang.org/x/sys` as a DIRECT requirement and
              adds no other module. Report the direct-dependency count before and
              after: five to six is expected, seven is a finding (CLM-033).
            - `grep -rn 'import "C"'` over the tree still returns nothing.
            - `cmd/backstop/main.go` calls `MaybeRunSandboxHelper()` as its FIRST
              statement AND checks its error, exiting 126; `pkg/packval/main_test.go`
              calls it in `TestMain`. Confirm BOTH by reading the files. Each alone
              is a silent hole: the binary sandboxes nothing, or the suite cannot
              reach the helper. An UNCHECKED call is a third hole — the helper can
              fail to install the sandbox and return, and an unchecked caller then
              runs pack code unsandboxed.

          RECORD THE THREE STRUCTURAL COVERAGE FINDINGS RATHER THAN CLEARING THEM
          HERE. As built, this phase committed red on `cmd/backstop/main.go` (9/17,
          already 9/14 at HEAD), `pkg/packval/sandbox.go` (31/36, identical at HEAD,
          net-new zero) and `pkg/packval/sandbox_linux.go` (unmeasurable on darwin).
          None is clearable inside this phase's file scope: the first needs a
          `run()` seam, the second needs compile-time dispatch, and the third
          resolves only on a Linux host. Phase 3b owns the first two. Report them
          with their HEAD-vs-NOW measurements and do NOT waive, exclude, or
          baseline-refresh any of them.

          The darwin sandbox tests — `TestSandboxSecurityDenialsHold`,
          `TestSandboxDeniesProjectFileRead`, `TestSandboxDeniesFileWrite`,
