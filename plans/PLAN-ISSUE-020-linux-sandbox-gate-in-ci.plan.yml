          each. Empty must show six (the post-migration state the job would have
          been left in) and populated must show zero. If the populated run still
          reports failures, CLM-029 is not satisfied and the `pack install` step is
          not doing what it was added for. Restore the installed packs afterwards.
        files:
          - .github/workflows/ci.yml
          - workflows_test.go
          - cmd/backstop/gate_base_ratchet_test.go
        claims:
          - CLM-018
          - CLM-019
          - CLM-024
          - CLM-025
          - CLM-029
        depends_on:
          - TASK-016
          - TASK-017

  - id: phase-5
    name: "Phase 5: Close the acceptance criterion on a real Linux runner"
    tasks:
      - id: TASK-019
        type: verification
        title: "Prove backstop gate on the real ubuntu-latest runner"
        description: |
          THE ONLY PLACE ISSUE-020's ACCEPTANCE CRITERION IS CLOSED. Everything
          before this is local evidence; the criterion is a real `backstop gate`
          run, against really-installed packs, on a real Linux CI host.

          Push the branch to `origin` (github.com/backstop-ai/backstop-core, the
          private remote) so `ci.yml` executes on `ubuntu-latest`, and open a pull
          request so BOTH triggers are exercised — the push path and the
          pull_request path derive their bases differently, and a plan that proves
          only one has proved half of CLM-019.

          Read the real run and report, from its own output:
            - the resolved base and the in-scope file count for each event. A count
              of zero is a FAILURE of this task, not a pass — it is the vacuous
              green this whole plan exists to prevent.
            - that `pack install` materialized every locked pack on the runner.
            - that `pack_engines` and `coverage` ACTUALLY EXECUTED — not
              `capability_absent`, not errored. Take this from the gate's own JSON,
              not from the job's exit code. A green exit with an absent dimension is
              exactly the failure this issue was filed about.
            - that the Linux sandbox executed convert scripts: the findings the
              engines produced are proof the sandboxed convert path ran, since every
              functional pack (including the embedded `base-engines`) converts
              through it.
            - the results of `sandbox_linux_exec_test.go`. These DO run — assert it,
              do not hedge it. The go-toolchain pack's go-test engine is declared
              with `command: go test`, `scope_kind: project-wide` and
              `project_target: "./..."`, so the gate itself compiles and runs the
              whole suite on the runner; a `//go:build linux` file that is inert on
              darwin is a first-class test there. It is also a NEW file, so it is in
              diff scope. If the triple's assertions do not appear in the run's
              output, something is wrong with the dispatch — investigate that rather
              than reporting the tests as unexercised.

          If the run is RED, report the failure verbatim and attribute it. Per the
          founder's 2026-07-27 posture, a loud attributed failure is an acceptable
          interim state; a silenced, skipped or worked-around one is not. Do NOT
          add `continue-on-error`, do NOT narrow the scope, and do NOT weaken the
          sandbox to produce a green.

          Report TASK-019 as the sole basis for any claim that the issue's
          acceptance criterion is met (CLM-028).
