  - id: phase-3
    name: "Phase 3: Linux sandbox — capability struct plus Landlock and seccomp"
    tasks:
      - id: TASK-011
        type: test
        title: "Capability-to-restriction-spec tests, runnable on any platform"
        description: |
          Write the RED tests for the capability struct and the PURE derivation of
          the restriction spec — the Landlock ruleset description and the seccomp
          filter program the trampoline will install. These must NOT be
          build-constrained to linux. The derivation is a pure function over the
          capability set, and keeping it testable on darwin is what lets the
          mechanism be reviewed and regression-locked on the machine where
          development happens; it is also the only part of the mechanism that CAN
          be proven there.

          `TestSandboxCapability_HandlesWriteRightsAndGrantsNone` — the
          convert/validator capability set produces a ruleset whose
          `handled_access_fs` mask INCLUDES the write family (`WRITE_FILE`,
          `MAKE_REG`, `MAKE_DIR`, `REMOVE_FILE`, `REMOVE_DIR`, the `MAKE_*` set,
          and `TRUNCATE` where the ABI has it) while NO `path_beneath` rule grants
          any of them. This is the single easiest way to ship a sandbox that
          confines nothing: Landlock restricts only what the mask HANDLES, so a
          read-rights-only mask leaves writes fully permitted and everything still
          looks correct.

          `TestSandboxCapability_ReadRulesCoverPackDirOnly` — the derived
          `path_beneath` read rules cover packDir and the declared system paths and
          NOTHING else; assert no rule covers the project root or any parent of
          packDir.

          `TestSandboxCapability_SeccompDeniesSocketFamily` — the derived filter
          validates the audit arch and returns EPERM for the full denied set:
          `socket`, `socketpair`, `connect`, `bind`, `sendto`, `sendmsg`,
          `sendmmsg`, `recvfrom`, `recvmsg`, `recvmmsg`, `io_uring_setup` and
          `io_uring_enter`. Assert the RECEIVE half and the io_uring pair by name —
          they are the two holes the first draft of this surface had, and a test
          that checks only the send calls would have passed over both. Assert the
          default-allow shape explicitly too: a default-deny program would kill the
          helper between filter install and `execve`.

          `TestSandboxCapability_SystemPathsKeepInterpreterReadable` — the Linux
          regression lock for the ISSUE-029 defect class, and the reason it is HERE
          rather than in TASK-013: it must run on the development machine, not wait
          for a Linux runner. Assert two things about the derived rules:
            - the system library paths carry `LANDLOCK_ACCESS_FS_READ_FILE` and
              `LANDLOCK_ACCESS_FS_READ_DIR` grants. Without them the dynamic loader
              cannot open the interpreter's shared libraries and every convert
              script dies at load time, looking like a broken converter rather than
              a sandbox decision — precisely how ISSUE-029 presented on macOS.
            - `LANDLOCK_ACCESS_FS_EXECUTE` appears in NEITHER the handled mask nor
              any grant. Landlock restricts only what the mask handles, so leaving
              EXECUTE out is how darwin's `(allow process*)`
              (`pkg/packval/sandbox.go:57`) translates. Assert its ABSENCE from the
              mask, not merely that execution works — those are different facts, and
              only the first survives someone "tightening" the mask later.
          Darwin's counterpart is `TestSandboxProfileAllowsDyldLibraries`; this test
          is that lock's Linux twin and should say so in a comment.

          `TestSandboxCapability_NetworkAllowedDropsSocketDenial` and
          `TestSandboxCapability_AddedReadablePathAddsPathBeneathRule` — the
          graduated-profile proof (CLM-012). The spec is DERIVED from the capability
          struct, so changing the struct changes the spec. If the other tests pass
          while these two fail, the restrictions are hardcoded and the struct is
          decorative.

          `TestSandboxCapability_AbiMaskNarrowsToRunningKernel` — deriving against a
          declared ABI of 1 produces a handled mask free of the rights ABI 1 does
          not know (no `TRUNCATE`, no net rights), and deriving against ABI 7
          includes them. Requesting an unknown right returns EINVAL from the
          kernel, so this is a correctness requirement, not tidiness — and it is
          how CLM-031's explicit negotiation is proven without a Linux host.

          `TestSandboxUnavailableMechanismIsLoudError` — with an injected ABI probe
          reporting 0 / ENOSYS, the call returns an error naming Landlock, the
          kernel version and ISSUE-020, and executes NOTHING. Inject the probe; do
          not depend on the host's kernel.

          `TestSandboxUnsupportedPlatformStillErrors` — the `default` branch keeps
          refusing, so a third platform does not silently inherit the Linux path.

          READ `pkg/packval/testdata/ubuntu-runner-probe.txt` BEFORE WRITING THESE
          ASSERTIONS. That file is why this task depends on TASK-001, and the
          dependency now means something different from when it was written: the
          probe RULED AGAINST the plan's original hypothesis. It measured
          `apparmor_restrict_unprivileged_userns=1` and seven failing bwrap
          invocations including both positive controls, and it measured Landlock
          live at ABI 7. Read its "READ THIS FIRST" section for the vacuous-triple
          warning before writing any assertion about denial — it is the recorded
          case of denials that meant "the mechanism never started".
        files:
          - pkg/packval/sandbox_capability_test.go
        claims:
