  - id: phase-2
    name: "Phase 2: Teach the gate an explicit diff base"
    tasks:
      - id: TASK-006
        type: test
        title: "Scope tests for an explicit diff base"
        description: |
          Write the RED tests for base-aware scope resolution. Model the git fixture
          on the existing `TestComputeGateScope_DiffAgainstRemoteBranch`
          (`pkg/gate/scope_test.go:177`), which already builds a real temp git repo
          — do not invent a second harness.

          `TestComputeGateScope_DiffAgainstExplicitBase` — a repo with commits A
          then B; resolving with base=A returns exactly the files B changed.

          `TestComputeGateScope_ExplicitBaseOnCleanTreeIsNonEmpty` — THE CI
          CONDITION, and the reason this flag exists. Same repo, nothing
          uncommitted, no `origin/main` ref at all: bare diff mode returns an EMPTY
          scope, and base mode returns B's files. Assert BOTH halves in the one
          test so the contrast is what fails if someone reintroduces the fallback.

          `TestComputeGateScope_ExplicitBaseUsesMergeBaseNotTwoDot` — a repo where
          HEAD and the base ref have diverged; assert the scope is the files changed
          since their merge-base, NOT the symmetric difference. This is what makes
          one code path correct for both a PR base ref and a push before-sha.

          `TestComputeGateScope_UnresolvableBaseIsHardError` — base is a ref that
          does not exist. Assert an error is returned AND that the returned scope is
          not a silent `--all`, not a HEAD diff, and not an empty file list. This is
          the anti-fallback test; it is the most important one in the file.

          `TestComputeGateScope_BaseWithNoMergeBaseIsHardError` — the OTHER failure
          mode, and the one that is easy to implement and forget to prove. Build two
          UNRELATED histories in one repo (`git checkout --orphan` gives you a root
          commit sharing no ancestry), pass the orphan's sha as the base, and assert
          the same hard error: the rev RESOLVES, so step 1 passes, and it is
          `merge-base` that fails. A force-push or a grafted shallow clone produces
          exactly this shape in CI. Assert the error names both revs, and assert the
          same three non-fallbacks.

          `TestComputeGateScope_ExplicitBaseIncludesUntrackedFiles` — parity with
          bare diff mode (ISSUE-004 established untracked files are in scope).

          `TestComputeGateScope_EmptyBaseKeepsExistingDiffBehavior` — the
          delegation guard for CLM-009: passing an empty base reproduces bare diff
          mode exactly, so there is one resolver and not two.
        files:
          - pkg/gate/scope_base_test.go
        claims:
          - CLM-005
          - CLM-006
          - CLM-007
          - CLM-009
        depends_on:
          - TASK-005

      - id: TASK-007
        type: implementation
        title: "Implement base-aware diff scope resolution"
        description: |
          Turn TASK-006 green in `pkg/gate/scope.go`.

          Add `ComputeGateScopeWithBase(projectRoot string, mode GateScopeMode,
          files []string, base string)` as the full-arity entry point, and reduce
          the existing `ComputeGateScope` to a thin wrapper that calls it with an
          empty base. DO NOT change `ComputeGateScope`'s signature: 43 test call
          sites and four production call sites (`cmd/backstop/gate.go`,
          `cmd/backstop/waiver.go`, `cmd/backstop/baseline.go`) depend on it, and
          the point of the wrapper is that there is exactly ONE implementation of
          "what changed" — CLM-009.

          Base resolution, in order, all failures LOUD:
            1. `git rev-parse --verify <base>^{commit}` — on failure return an error
               naming the ref and what could not resolve. Return NO scope the caller
               could mistake for a valid one.
            2. `git merge-base HEAD <resolved>` — on failure (unrelated histories)
               return an error naming both revs.
            3. `git diff --name-only <merge-base>` plus
               `git ls-files --others --exclude-standard`, exactly as bare diff mode
               does today (`scope.go:121-127`).

          There is no fallback path. Not to `--all`, not to `HEAD`, not to an empty
          list. The existing fallbacks in `resolveGateScopeDiff` are precisely why
          CI is currently silent, and inheriting them would defeat the flag.

          A non-empty base with a mode other than diff is a programming error the
          CLI layer should already have rejected; return an error rather than
          ignoring the base.

          Record the resolved merge-base SHA on the returned scope so TASK-009 can
          report it. Reuse `newGateScope` for normalization; do not hand-roll a
          second path normalization (`NormalizePath` is the single authority).
        files:
          - pkg/gate/scope.go
        claims:
          - CLM-005
          - CLM-006
          - CLM-007
          - CLM-009
        depends_on:
          - TASK-006

      - id: TASK-008
        type: test
        title: "CLI tests for --base: flag conflicts, exit codes, scope reporting"
        description: |
          Write the RED CLI-level tests. Follow the existing `cmd/backstop` gate
          test conventions.

          `TestGateCommand_BaseFlagScopesToChangedFiles` — a real temp git repo,
          `--base <sha>`, assert the run's scope contains exactly the changed files.

          `TestGateCommand_BaseWithAllIsConfigError` and
          `TestGateCommand_BaseWithFileIsConfigError` — assert exit code 2 and a
          message naming the conflicting flags. Mirror the existing `--all` /
          `--file` mutual-exclusion check at `cmd/backstop/gate.go:88`.

          `TestGateCommand_UnresolvableBaseExitsTwo` — assert exit code 2 (config
          error, NOT 1) and that the message names the unresolvable ref. Exit 1
          would read as "found violations", which is a lie about what happened.

          `TestGateCommand_ReportsScopeModeBaseAndFileCount` — assert the human
          output names the scope mode, the requested base, the resolved merge-base
          SHA, and the in-scope file count.

          `TestGateCommand_JSONReportsResolvedBaseAndFileCount` — the same four
          facts in `--json` output. This is what CI logs will be read through, and
          it is the difference between "green over 12 files" and an unexplained
          green over zero.
        files:
          - cmd/backstop/gate_base_test.go
        claims:
          - CLM-008
          - CLM-010
        depends_on:
          - TASK-006

      - id: TASK-009
        type: implementation
        title: "Wire --base into the gate command and report the resolved scope"
        description: |
          Turn TASK-008 green in `cmd/backstop/gate.go`.

          Add `--base <rev>` to `newGateCommand`. In `runGate`, read it alongside
          `--all` and `--file`; reject `--base` with either of them as an
          `ExitCodeError{Code: ExitConfigError}`, extending the existing
          mutual-exclusion check rather than adding a parallel one. Route the base
          into `gate.ComputeGateScopeWithBase`, and map a base-resolution error to
          exit 2 with the message the scope layer produced — do not rewrite or
          soften it.

          Then make the scope visible. Report scope mode, requested base, resolved
          merge-base SHA and in-scope file count in the human output, and carry the
          same fields in the JSON output alongside the existing `GateScope` fields
          (`mode`, `files`, `warnings`). An empty scope must be legible as an empty
          scope in both.

          Help text for `--base`: state that it scopes the run to files changed
          since the merge-base with the given revision, and that it is for CI, where
          the working tree is clean and the bare diff scope is empty. Someone
          reading `--help` should understand why the flag exists.

          AS-BUILT, 2026-07-28 (committed a09df4f) — AN ACCEPTED SCOPE DEVIATION.
          This task declared only `cmd/backstop/gate.go`, and that was wrong: half
          of CLM-010 cannot be delivered there. The human-output half lives in
          `gate.FormatHuman` (`pkg/gate/output.go:25`), which is the SINGLE
          AUTHORITY for gate human output — `cmd/` only calls it. The implementer
          made a four-line addition in `output.go` rather than printing a second
          scope line from `cmd/`, flagged the deviation, and the orchestrator
          accepted it.

          That was the right call and the plan was the thing at fault. Printing the
          scope from `cmd/` would have produced TWO scope reports in two places —
          the duplicate-authority anti-pattern the self-pack exists to catch, and a
          guaranteed future divergence between what the human output says and what
          the JSON says. `pkg/gate/output.go` is added to the file list above to
          make the as-built scope true.

          Note also that the accompanying test,
          `TestFormatHuman_ReportsExplicitBaseResolution`, landed in
          `pkg/gate/scope_base_test.go` — TASK-006's file — rather than in a new
          one, so no test-side scope change was needed.

          FIRST GATE RUN WAS RED, WITH TWO SELF-INFLICTED FINDINGS, both cleared
          with HEAD-vs-NOW net-new-0 proof. Recorded because they are the predicted
          consequence of this plan's own no-grandfather rule, arriving on schedule:
            - error-wrapping on the new return path in `scope.go`, from the
              go-standards pack.
            - `output.go` coverage below threshold, lifted 89.7% -> 91.2% by the
              FormatHuman test above.
          Neither was pre-existing debt activated by the diff; both were introduced
          by this task and fixed in it. That is the rule working as designed, not a
          tax on it.
        files:
          - cmd/backstop/gate.go
          - pkg/gate/output.go
        claims:
          - CLM-008
          - CLM-010
        depends_on:
