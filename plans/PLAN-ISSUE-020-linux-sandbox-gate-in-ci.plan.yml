  ── THERE IS NO AUTO-PROVISIONER. THE RUNNER MUST SUPPLY EVERY TOOL ────────
  This is the second premise correction, and getting it wrong produces an exit-2
  CI job that looks like a sandbox bug. Read
  `cmd/backstop/pack_gate_provision.go:46-113`: `provisionEngines` verifies that
  NIL-Provision (Layer-0) tools resolve on PATH and fails loud when they do not —
  and for engines WITH a Provision (semgrep, ast-grep) it `continue`s, i.e. it
  SKIPS them. Nothing anywhere installs anything. Verified 2026-07-28: no pip,
  pipx, uv, npm or brew invocation exists in `pkg/` or `cmd/`. "Auto-provisioned"
  in the comments means "exempt from the on-PATH check", not "installed for you";
  the pinned version is a TRUST FLOOR (`pkg/pack/engine/allowlist.go`), not an
  installer.

  Consequence for ci.yml: the runner must itself provide, on PATH,

    go            (setup-go, from go.mod)
    golangci-lint (a REAL binary on PATH — see the version-authority block below;
                   today's ci.yml uses `go tool golangci-lint`, which does NOT put
                   a `golangci-lint` executable on PATH and therefore does NOT
                   satisfy provisionEngines)
    semgrep       1.96.0   (allowlist pin, pkg/pack/engine/allowlist.go)
    ast-grep      0.43.0   (allowlist pin, pkg/pack/engine/allowlist.go)
    bubblewrap             (the Linux sandbox mechanism)

  A missing tool must remain a loud exit-2. Never add a conditional that skips a
  dimension because its tool is absent.

  ── WHO OWNS THE golangci-lint VERSION, AND THE TRAP IF YOU GUESS ──────────
  There are THREE candidate version sources in this repo and only one of them is
  right. Getting this wrong produces a CI failure that reads like a sandbox bug.

    1. `pkg/pack/engine/allowlist.go` — NOT AN AUTHORITY HERE. It lists semgrep,
       ast-grep, grep, rg, oxlint, bun, tsc, prettier. It contains NEITHER
       `golangci-lint` NOR `go`, and it never will: `checkEngineToolAllowed`
       (`cmd/backstop/pack_gate.go:812-815`) returns nil immediately for a
       nil-Provision binding, so Layer-0 tools bypass the allowlist entirely by
       design. Their trust requirement is on-PATH presence, not a pin.
    2. `go.mod:197`'s tool directive — A TRAP. It pins
       `github.com/golangci/golangci-lint` at v1.64.8 (go.mod:75). Installing that
       version BREAKS the lint dimension: the go-toolchain pack declares
       `golangci-lint run --output.sarif.path stdout --show-stats=false`, which is
       v2-only syntax, and v1.64.8 exits on an unknown flag. The tool directive
       serves `go tool golangci-lint` for other purposes and must NOT be treated as
       the gate's tool source.
    3. **A PINNED INSTALL LINE IN ci.yml — THE AUTHORITY.** The binding constraint
       is the pack's declared command syntax, so the consumer (this repo) pins the
       binary its declared packs can actually run. Pin v2.6.0: it is the version
       measured on the development machine on 2026-07-28, which is the version the
       locally-green gate has actually been proven against.

  Write the reason INTO ci.yml next to the pin — that the pack's `--output.sarif
  .path` flag is v2-only and that go.mod's v1.64.8 tool directive is a different,
  unrelated pin. Without that comment the next person "consolidates" the two and
  reintroduces the break.

  This is not baked language knowledge in backstop: the BINARY still knows nothing
  about Go or golangci-lint. It is a consumer project provisioning the toolchain
  its own declared packs require, which is exactly the Layer-0 contract.

  ── MECHANISM: BUBBLEWRAP, UNLESS THE RUNNER PROBE FALSIFIES IT ────────────
  ISSUE-020's spike (2026-07-27) narrowed OQ-3 to bubblewrap vs Landlock+seccomp
  and left bubblewrap modestly ahead: it is packaged, and its enforcement was
  demonstrably real (the assertion triple passed). Landlock got ZERO signal —
  `ENOSYS` in the Docker test bed is a kernel-compile fact (LinuxKit builds
  neither AppArmor nor Landlock), not ABI evidence. Any ranking of Landlock from
  that probe would be fabricated.

  The one open risk to the bwrap path is AppArmor's
  `apparmor_restrict_unprivileged_userns`, which was UNMEASURABLE in containers
  and could still break unprivileged `--unshare-user` on a real Ubuntu runner.
  TASK-001 reads it on the real runner. READ THE VALUE; DO NOT ASSUME IT. If it
  falsifies bwrap, STOP AND ESCALATE — do not silently switch to Landlock, and do
  not weaken the sandbox to make the job green.

  Two negative results, recorded so they are not re-tried: `apparmor=unconfined`
  changed nothing (there was nothing to unconfine in that kernel), and
  `--cap-add SYS_ADMIN` is the wrong lever (bwrap then skips the user-namespace
  path and lacks CAP_NET_ADMIN).

  Corrected invocation from the spike, proven exit-0 both as root and as uid 1001:

    bwrap --ro-bind /usr /usr --symlink usr/bin /bin --symlink usr/lib /lib \
      --symlink usr/lib64 /lib64 --unshare-user --unshare-net --dev /dev \
      --proc /proc /bin/true

  It is a STARTING POINT, not the finished argv. Two additions are required for
  the real call and are not optional: `--ro-bind <packDir> <packDir>` (bwrap
  builds a fresh root; without this the pack's own convert script does not exist
  inside the sandbox) and `--chdir <packDir>` (the darwin path sets `c.Dir =
  packDir`; parity requires the same working directory).

  ── DARWIN PARITY IS THE SPEC, AND IT MEANS NO WRITABLE PATHS ──────────────
  The darwin profile is `(deny default) (allow process*) (allow file-read* <scoped
  subpaths>) (deny network*) (deny file-write*)`. Parity therefore means the
  convert/validator capability set has an EMPTY writable-paths list. Do not add a
  `--tmpfs /tmp` for convenience: a writable /tmp is a real divergence from the
  macOS trust model, and if a convert script turns out to need scratch space that
  is a capability question for BUNDLE-021 OQ-2, not a quiet unilateral grant here.

  ── OQ-2 IS DEFERRED, AND THE HEDGE IS STRUCTURAL ──────────────────────────
  BUNDLE-021 OQ-2 (should packs DECLARE behavior rather than backstop matching on
  a name or platform?) is NOT resolved by this plan and must not be pre-empted.
  The hedge the issue's 2026-07-27 decision mandates: express the Linux semantics
  against an INTERNAL capability struct — readable paths, writable paths, network
  bool — rather than a second bespoke profile literal sitting alongside
  `darwinSandboxProfile`. That is an internal-representation choice a future OQ-2
  resolution can slot a pack-declared value into, instead of one that has to be
  unwound. The decision is triple-tracked; leg 2 is a code comment AT the
  capability struct's definition site pointing back at BUNDLE-021 OQ-2, and
  TASK-012 owes that comment.

  Corollary, and the reason CLM-012 exists: the mechanism must be
  GRADUATED-PROFILE-CAPABLE. The convert/validator carve-out (below) is a POLICY
  choice about which call sites get sandboxed today — it is not a ceiling on what
  the mechanism can express. Widening the boundary later must be a policy change,
  not a rebuild.

