  - id: phase-5
    name: "Phase 5: Close the acceptance criterion on a real Linux runner"
    tasks:
      - id: TASK-019
        type: verification
        title: "Prove backstop gate on the real ubuntu-latest runner"
        description: |
          THE ONLY PLACE ISSUE-020's ACCEPTANCE CRITERION IS CLOSED. Everything
          before this is local evidence; the criterion is a real `backstop gate`
          run, against really-installed packs, on a real Linux CI host.

          Push the branch to `origin` (github.com/backstop-ai/backstop-core, the
          private remote) so `ci.yml` executes on `ubuntu-latest`, and open a pull
          request so BOTH triggers are exercised — the push path and the
          pull_request path derive their bases differently, and a plan that proves
          only one has proved half of CLM-019.

          Read the real run and report, from its own output:
            - the resolved base and the in-scope file count for each event. A count
              of zero is a FAILURE of this task, not a pass — it is the vacuous
              green this whole plan exists to prevent.
            - that `pack install` materialized every locked pack on the runner.
            - that `pack_engines` and `coverage` ACTUALLY EXECUTED — not
              `capability_absent`, not errored. Take this from the gate's own JSON,
              not from the job's exit code. A green exit with an absent dimension is
              exactly the failure this issue was filed about.
            - that the Linux sandbox executed convert scripts: the findings the
              engines produced are proof the sandboxed convert path ran, since every
              functional pack (including the embedded `base-engines`) converts
              through it.
            - the results of `sandbox_linux_exec_test.go`. These DO run — assert it,
              do not hedge it. The go-toolchain pack's go-test engine is declared
              with `command: go test`, `scope_kind: project-wide` and
              `project_target: "./..."`, so the gate itself compiles and runs the
              whole suite on the runner; a `//go:build linux` file that is inert on
              darwin is a first-class test there. It is also a NEW file, so it is in
              diff scope. If the triple's assertions do not appear in the run's
              output, something is wrong with the dispatch — investigate that rather
              than reporting the tests as unexercised.

          If the run is RED, report the failure verbatim and attribute it. Per the
          founder's 2026-07-27 posture, a loud attributed failure is an acceptable
          interim state; a silenced, skipped or worked-around one is not. Do NOT
          add `continue-on-error`, do NOT narrow the scope, and do NOT weaken the
          sandbox to produce a green.

          Report TASK-019 as the sole basis for any claim that the issue's
          acceptance criterion is met (CLM-028).

          ── EXECUTED 2026-07-28, RED. CLM-028 UNMET. THIS TASK RE-RUNS. ────────
          Run https://github.com/backstop-ai/backstop-core/actions/runs/30381252600
          at commit 3e084e2. Full account in the "TASK-019 RAN AND WAS RED" notes
          block; the short form:

            PROVED   non-empty base-derived scope on a pristine checkout (35 files,
                     fallback never fired — CLM-006, and CLM-019's PUSH half);
                     fleet install from nothing (CLM-001, CLM-029); pack_engines
                     really executing (22.8s); and FAIL-CLOSED HOLDING — the helper
                     refused to run pack code unsandboxed and exited 126.
            DID NOT  reach test_verification at all. `sandbox_linux.go` is still
            REACH    unmeasured, and the `TestLinuxSandbox_*` exec tests have still
                     never executed anywhere. The `baseline` job was SKIPPED (gated
                     on the failed gate job), so TASK-016's `pack install` addition
                     has never run in CI and CLM-029's CI half is unproven — the
                     detached-worktree measurement is its only evidence. Claim none
                     of it.
            CAUSE    the helper's CLM-015 diagnostic was discarded by the parent
                     (stderr never captured). Phase 4b fixes it.

          THE RE-RUN IS PART OF THIS TASK, not a new one. After Phase 4b lands,
          push and read the run again, and report the same inventory. What changes
          on a green re-run is that the kill chain proceeds past `pack_engines`:
          `test_verification` runs, `sandbox_linux.go` gets MEASURED (retiring the
          one transient coverage_unmeasured Phase 3b left), the `TestLinuxSandbox_*`
          triple EXECUTES for the first time — which is where CLM-014 is finally
          earned — and the `baseline` job stops being SKIPPED, which is the only way
          CLM-029's CI half gets proven. Report that job's outcome explicitly rather
          than letting a green gate imply it.

          IF THE RE-RUN IS RED AGAIN, that is an acceptable outcome and a silenced
          one is not. The bar Phase 4b sets is that the failure now ARRIVES WITH ITS
          REASON: an error carrying "andlock", the kernel release and "ISSUE-020".
          A second red run whose cause is legible is progress; a green one bought by
          narrowing scope or weakening the sandbox is not.

          CLM-019's OTHER HALF IS CLOSED — run 30383453888, PR #1: `base.sha`
          derived, merge-base exact, 6 files in scope through the same code path as
          the push event. Both halves proven.

          ── SEQUENCING FROM HERE (ruled 2026-07-28) ───────────────────────────
          The remaining runs are ordered, and each one closes something specific:

            1. Phase 4c's fix lands on the SAME PR BRANCH -> PR RE-RUN.
               Expected: the sandbox INSTALLS. If the chain then reaches
               `test_verification`, the `TestLinuxSandbox_*` triple EXECUTES FOR THE
               FIRST TIME ANYWHERE — and may itself surface new reality. Treat that
               as the likely outcome rather than an upset: those assertions have
