  ── SHARP EDGE: THE RENAME PULLS GO FILES INTO DIFF SCOPE ──────────────────
  The gate scopes findings to CHANGED FILES, and file-level diff scope activates
  ALL of a touched file's dormant findings — not only the lines the diff touched.
  TASK-004 edits real-repo pack-name literals across a measured 36 files under
  `pkg/` and `cmd/` (37 tree-wide — `tests/smoke/smoke_test.go` is the extra, and
  it is a synthetic carrier that stays; see the exclusions above), which
  converts some currently-dormant violations into BLOCKING ones as a side effect
  of a mechanical rename that changes no behavior. This is the same trap
  PLAN-ISSUE-087 hit on its module-path sweep.

  The rule stands as normally written — touch it, fix its violations. Minimize the
  blast radius first: change ONLY files that read the real repo (step 7 above),
  which should be well under either count. If after that minimization the
  activated set is
  large enough that remediation dwarfs the rename, STOP and escalate with the
  measured inventory rather than waiving file-by-file or refreshing the baseline.
  Do NOT "just refresh the baseline" to go green: CI's baseline job generates
  PACKLESS (ISSUE-086), so a refresh today would ratchet the project against a
  vacuum.

