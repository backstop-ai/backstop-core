  SIZE IT HONESTLY: 93 statements of error-path coverage in code that makes raw
  syscalls is REAL WORK, not a margin adjustment. Most of those paths are reachable
  only by making a syscall fail, which needs injection seams that do not exist yet.
  Phase 4d owns it.

  AND DO NOT CHASE 100%. Some statements are UNREACHABLE BY CONTRACT and the source
  already says so — `sandbox_linux.go:108-112` documents that
  `applyRestrictionsAndExec` ends in `unix.Exec`, so the line after it can only run
  if the impossible happened (it returns an error precisely so the impossible case
  is not a silent success). A test cannot reach that line without breaking the
  contract it protects. Phase 4d must NAME the treatment for such statements —
  count them, justify each, and reach the floor around them — rather than
  contorting the code to execute them.

