          - TASK-008

      - id: TASK-010
        type: verification
        title: "Verify the base-scoped gate against this repository"
        description: |
          Run and report true exit codes for:

            go build ./...
            go test ./... -race -count=1
            go build -o bin/backstop ./cmd/backstop/
            ./bin/backstop gate --base $(git rev-parse HEAD~1)
            ./bin/backstop gate --base does-not-exist        (expect exit 2)
