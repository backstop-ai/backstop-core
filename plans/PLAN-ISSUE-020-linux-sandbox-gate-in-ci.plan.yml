  ── RESIDUAL 1: sandbox_linux.go COVERAGE, 41/134 (30.6%) ──────────────────
  The transient `coverage_unmeasured` Phase 3b left behind RESOLVED — the file is
  now measured on linux, exactly as predicted — and it resolved INTO A RED. That is
