  `go tool cover -func` over the whole repo and fails under an AGGREGATE 90%. The
  gate's coverage dimension is not that: it is PER-FILE and DIFF-SCOPED, so after
  the flip CI answers "is each file this PR touched adequately covered?" and stops
  answering "is the repository as a whole at 90%?" entirely. Nothing else in CI
  answers the second question afterwards.

