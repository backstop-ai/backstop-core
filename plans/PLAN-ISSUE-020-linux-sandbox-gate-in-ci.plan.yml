  - id: phase-4c
    name: "Phase 4c: Narrow Landlock rights to each path's file type"
    tasks:
      - id: TASK-028
        type: test
        title: "Portable falsifier for file-type right narrowing"
        description: |
          Read the "PR #1 RAN" and "THE PATTERN BOTH LANE BUGS SHARE" notes blocks
          first. This is the second defect in this lane that was correct as a spec
          and wrong against a real host, and the test design is what stops it being
          the third.

          THE SPLIT THAT MAKES THIS TESTABLE ON DARWIN: the narrowing is a PURE
          FUNCTION of (rights mask, isDir) -> rights mask. The `stat` that supplies
          `isDir` is the part no darwin test can meaningfully drive; the mask
          arithmetic is the part that carries the bug. Separate them and the bug
          becomes portable to test — the same move Phase 4b made with the stderr
          fold, for the same reason.

          THE FUNCTION IS `narrowRuleToInodeType(mask uint64, isDir bool) uint64`,
          and it carries the WHOLE POLICY: a directory keeps the mask intact; a
          regular file loses every directory-only bit and keeps every
          file-applicable one. Because the policy lives in the function rather than
          at the call site, the table below IS the specification.

          In a new `pkg/packval/sandbox_rights_test.go` (NO build tag):

          `TestNarrowRuleToInodeType_DropsDirectoryOnlyRightsOnFile` — the
          regression lock, written against the measured failure. Given the read mask
          `AccessFSReadFile|AccessFSReadDir` (0xc, the exact value in the
          run-30383453888 diagnostic) and `isDir=false`, the result keeps READ_FILE
          and drops READ_DIR. Cite the diagnostic in a comment so the next reader
          meets the evidence, not a rule.

          `TestNarrowRuleToInodeType_KeepsEverythingOnDirectory` — `isDir=true`
          returns the mask UNCHANGED. Without this the function could satisfy the
          previous test by dropping READ_DIR everywhere, which would silently
          un-restrict directory reads.

          `TestNarrowRuleToInodeType_DropsTheWholeDirectoryOnlyClass` — the
          forward-safety assertion, and the reason this task exists rather than a
          one-bit patch. Feed a mask containing the write family — REMOVE_DIR,
          REMOVE_FILE, MAKE_CHAR, MAKE_DIR, MAKE_REG, MAKE_SOCK, MAKE_FIFO,
          MAKE_BLOCK, MAKE_SYM (`sandbox_capability.go:209-214`) — with
          `isDir=false`, and assert every one is dropped while WRITE_FILE survives.
          None of these is granted today (the writable set is empty), which is
          exactly why a test is the only thing that will keep the handling correct
          until the day one is.

          `TestNarrowRuleToInodeType_FileApplicableRightsSurvive` — EXECUTE,
          WRITE_FILE, READ_FILE, TRUNCATE and IOCTL_DEV pass through on a
          non-directory. A narrowing that is too aggressive breaks the interpreter
          just as thoroughly as one that is too lax, and it fails in the same
          confusing place.

          `TestNarrowRuleToInodeType_OverTheRealMixedReadableSet` — run the
          narrowing over THE WHOLE DECLARED READABLE LIST, not one path. The list
          mixes kinds BY DESIGN — `/etc/ld.so.cache` is a regular FILE and
          `/etc/ld.so.conf.d` is a DIRECTORY, adjacent lines at
          `sandbox_capability.go:134-135` — and a single-path test would have
          happily passed against whichever kind its author picked. Drive the real
          `ConvertValidatorCapability` list with a table of per-path `isDir` values
          and assert the resulting mask for EACH. The defect was a mixed-list
          defect; the falsifier has to be a mixed-list falsifier.

          `TestSandboxLinuxApplySite_CallsNarrowRuleToInodeType` — THE WIRING GUARD,
          and it is not optional. The apply site is inside `//go:build linux` code,
          so NO DARWIN TEST EVER EXECUTES THAT LINE: the pure function above could
          be perfectly correct and simply never called, and every test in this file
          would still pass. Use the AST-guard pattern ratified in Phase 4b — parse
          `sandbox_linux.go` and assert the rule-application path calls
          `narrowRuleToInodeType` — and prove it control-vs-treatment in a detached
          worktree the same way, showing it FAILS against a deliberately unwired
          tree. A wiring guard nobody has seen fail is a comment.

          `TestConvertValidatorCapability_ReadableSetContainsRegularFiles` — the
          test that would have PREDICTED this defect. Assert that the declared
          readable set contains at least one path that is a regular file rather than
          a directory (`/etc/ld.so.cache` today), so the mixed-type property is
          pinned as intentional rather than incidental. If someone later removes
          every file path, this test tells them the narrowing is no longer exercised
          by the default capability.

          A GREEN RUN OF THIS FILE IS NOT EVIDENCE THE SANDBOX INSTALLS (CLM-041).
          Say so in the file header.
        files:
          - pkg/packval/sandbox_rights_test.go
        claims:
          - CLM-040
          - CLM-041
        depends_on:
          - TASK-027

      - id: TASK-029
        type: implementation
        title: "Apply file-type narrowing at the rule-application seam"
        description: |
          Turn TASK-028 green.

          Add `narrowRuleToInodeType(mask uint64, isDir bool) uint64` to
          `pkg/packval/sandbox_capability.go` (untagged, beside the rights helpers it
          complements). It carries the WHOLE POLICY: a directory keeps the mask; a
          regular file loses every directory-only bit and keeps every
          file-applicable one. Define the directory-only class as a named constant
          next to `landlockReadRights`/`landlockWriteRights` — READ_DIR, REMOVE_DIR,
          REMOVE_FILE, the MAKE_* family, and REFER where the ABI has it — rather
          than open-coding a bitmask at the call site, so the next person adding a
          right has exactly one place to classify it.

          DERIVATION STAYS PURE. The capability -> restriction-spec derivation
          remains a pure function of the capability struct, with no filesystem
          access anywhere in it. That is CLM-012's testability property, and it is
          the reason the narrowing takes `isDir` as a PARAMETER instead of stat-ing
          internally: a derivation that touches the filesystem stops being testable
          off-Linux, which is the property that made this defect catchable at all.

          WHERE THE STAT LIVES, and why here: `sandbox_linux.go:190-212` already
          opens each path with `unix.Open(rule.Path, unix.O_PATH|unix.O_CLOEXEC)`
          before adding the rule. Use `unix.Fstat` on THAT descriptor and pass the
          result into the narrowing. Two reasons this seam beats stat-ing during
          derivation: derivation must stay portable and pure (it is what TASK-028
          tests on darwin, and a stat there would make the whole capability
          untestable off-Linux), and fstat-ing the descriptor you are about to
          register is race-free — a separate `stat` by path could describe a
          different inode than the one the rule binds.

          Keep the existing behavior around it intact: the `Required` flag still
          governs whether a missing path is fatal, and an optional path that does
          not exist on this distro is still skipped rather than failed. If the
          `Fstat` itself fails on an fd that opened successfully, treat it as fatal
          for a required path — guessing the type would reintroduce the defect.

          Leave the HANDLED mask alone. The kernel's validation is on a
          `path_beneath` rule's `allowed_access` against the inode type; the
          `handled_access_fs` mask is NOT subject to that check at all. So narrowing
          it would fix nothing AND would silently un-restrict those operations
          everywhere — the opposite of the fix, at no benefit.

          THE WIRING IS PART OF THE DELIVERABLE. No darwin test executes the apply
          site, so a correct-but-uncalled narrowing function is a passing test suite
          and a broken sandbox. TASK-028's AST wiring guard is what catches that;
          make sure it is green for the right reason, not because it matched a
          comment.
        files:
          - pkg/packval/sandbox_capability.go
          - pkg/packval/sandbox_linux.go
        claims:
          - CLM-040
        depends_on:
          - TASK-028

      - id: TASK-030
        type: verification
        title: "Verify the narrowing locally, and state what local green does not prove"
        description: |
          Run and report true exit codes for:

            go build ./...
            GOOS=linux go build ./...
            GOOS=linux go vet ./pkg/packval/
            go test ./... -race -count=1
            go test ./pkg/packval/ -race -count=1 -run 'Rights|Sandbox|Diagnostic' -v
            go build -o bin/backstop ./cmd/backstop/
            ./bin/backstop gate

          Then confirm by reading `sandbox_linux.go` that the narrowing is driven by
          an `Fstat` on the SAME descriptor the rule registers — not by a separate
          path-based `stat`, and not by a filename heuristic.

          All six darwin sandbox tests must still pass unmodified.

          THE REPORT MUST STATE, IN THESE TERMS, THAT LOCAL GREEN DOES NOT PROVE THE
          SANDBOX INSTALLS. Everything above runs on darwin, where no Landlock rule
          is ever added. The proof is TASK-019's re-run and nothing else (CLM-041).
          This paragraph exists because the previous two failures in this lane were
          both preceded by a green local suite.
        files:
          - pkg/packval/sandbox_capability.go
          - pkg/packval/sandbox_linux.go
          - pkg/packval/sandbox_rights_test.go
        claims:
          - CLM-040
          - CLM-041
        depends_on:
          - TASK-029

  - id: phase-4d
    name: "Phase 4d: Cover the linux sandbox implementation to the floor"
    tasks:
      - id: TASK-031
        type: setup
        title: "Diagnose the 41/134 before writing a single test, and add --json to CI"
        description: |
          DO NOT START BY WRITING TESTS. There is a labeled hypothesis that, if true,
          means NO conventional test can move this number at all — and writing 93
          statements' worth of tests against a counter that cannot record them is
          the most expensive way to discover it.

          ── EXECUTED. HYPOTHESIS CONFIRMED (run 30386673582). ─────────────────
          Evidence committed at
          `pkg/packval/testdata/sandbox-linux-coverage-profile.txt`.

          FIVE functions measure exactly 0.0% while having PROVABLY EXECUTED — the
          clincher being that `applyLandlock` is where the earlier EINVAL was raised
          FROM, so it demonstrably ran to completion in an earlier run:

            applyRestrictionsAndExec   0/19    seccompSyscallNumbers   0/8
            applyLandlock              0/29    seccompAuditArch        0/4
            applySeccomp               0/19

          19+29+19+8+4 = 79 of 134 statements STRUCTURALLY UNMEASURABLE. The ceiling
          for the file is therefore (134-79)/134 = 41.0% — SUBTRACTION, NOT
          JUDGEMENT. No test can raise it, because the instrument cannot observe the
          code. The measured 41/134 (30.6%) is already near that ceiling.

          THE PLAN'S PREDICTED SPLIT WAS WRONG ABOUT THREE FUNCTIONS, corrected
          here so nobody re-derives the wrong list: `probeLandlockABI` (4/5, 80%),
          `kernelRelease` and `filterHelperEnv` are ALSO CALLED FROM THE PARENT, so
          they carry counters. Only the five above are exec-only. Parent-side and
          counted normally: `platformSandboxedRun`, `platformSandboxedRunStdout`
          (9/10), `newSandboxHelperCommand`.

          STEP 1 — GET THE DATA. Add `--json` to the gate invocation in
          `.github/workflows/ci.yml`, KEEPING the human output (tee both, or run
          both): the workflow log is the human surface and stays. This one line pays
          for itself three times over — it supplies this diagnosis its per-file
          measurement detail, settles the banked 6-vs-5-vs-8 scope-count
          observation by naming the in-scope paths, and fixes CLM-027's evidence
          wording, which currently promises JSON the workflow never produced.

          STEP 2 — CONFIRM WHICH FUNCTIONS CARRY ZERO COUNTERS, from the runner's
          raw profile. Commit the capture to
          `pkg/packval/testdata/sandbox-linux-coverage-profile.txt` with its run URL
          and date, the same way TASK-001's probe was made durable — a diagnosis
          that lives only in a task report cannot be checked by whoever implements
          the fork.

          STEP 3 — CHOOSE THE FORK, ON EVIDENCE:
            (a) EXERCISE THE HELPER LOGIC THROUGH A NON-EXEC'ING SEAM — a test-only
                path that applies the restrictions and RETURNS instead of exec'ing.
                ⚠ HAZARD, and it disqualifies the naive version: Landlock
                `restrict_self` and a seccomp filter are IRREVOCABLE for the life of
                the process. Applying them inside the TEST process would confine the
                test binary permanently and break every test that runs afterwards —
                a self-inflicted version of the very mechanism under test. Any
                viable form of (a) applies the restrictions in a CHILD that then
                EXITS NORMALLY rather than exec'ing (so counters flush), which means
                subprocess coverage plumbing (`GOCOVERDIR`), not a simple seam. And
                it must not weaken the locked-thread-then-exec property CLM-032
                exists to protect: a test path that skips the exec must not become
                the production path.
            (b) A PACK-DECLARED COVERAGE EXCLUSION with a written justification.
                Previously REJECTED for `main.go` as waive-shaped, and that
                rejection stands on its own terms — but a PROCESS-IMAGE-REPLACEMENT
                boundary is a categorically different justification from "hard to
                test": the code provably runs and the measurement instrument
                provably cannot observe it. Note the cost honestly: the mechanism
                exists in core (`CoverageRecord.Excluded`) while the go-toolchain
                pack hardcodes `"excluded":false`, so this is a CROSS-REPO change on
                DIR-027's clock.

          ── RULED 2026-07-28: (b') SPLIT, THEN EXCLUDE THE SPLIT PATH. ────────
          Neither (a) nor (b) as originally posed. The five exec-only functions move
          to their own file, and THAT FILE is what carries the declared exclusion —
          so the exclusion is scoped to precisely the code the instrument cannot
          observe, and the remainder is measured normally with no exemption at all.
          This is what keeps the exclusion from being a blanket over a whole
          subsystem: after the split, a reviewer can see exactly which 79 statements
          are excluded and why, and every other statement in the sandbox
          implementation still has to earn its coverage.

          TASK-033 owns the core split; phase-4e owns the pack-side mechanism the
          exclusion needs to exist at all.

          `pkg/packval/sandbox_linux.go` measured 41/134 (30.6%) on the first runner
          measurement. The exec tests cover the happy trampoline; 93 statements of
          error paths, apply loops and helper branches do not run.

          COUNT AND CLASSIFY AS THE DELIVERABLE. Produce the statement inventory —
          which of the 93 are counted-but-unflushed, which are reachable by
          injection, which need a seam that does not exist yet, and which are
          unreachable by contract. That inventory is what makes the eventual floor
          argument checkable; without it "we got to 90%" is unauditable.
        files:
          - .github/workflows/ci.yml
          - pkg/packval/testdata/sandbox-linux-coverage-profile.txt
        claims:
          - CLM-042
        depends_on:
          - TASK-018
          - TASK-030

      - id: TASK-032
        type: test
        title: "Lock the exec-side split, and test what conventional tests can still reach"
        description: |
          TASK-031 confirmed the hypothesis and ruled (b'). So this task has TWO
          jobs, and the first one is the one that keeps the exclusion honest.

          JOB 1 — LOCK THE SPLIT STRUCTURALLY, in a portable (untagged) test file
          `pkg/packval/sandbox_split_test.go`:

          `TestSandboxLinuxHelperFile_ContainsEveryExecSideStatement` — parse both
          files with `go/ast` and assert the five exec-only functions live in
          `sandbox_linux_helper.go` and NOT in `sandbox_linux.go`. This is the test
          that makes the exclusion auditable: the exclusion covers a FILE, so the
          file's contents are the exclusion's real boundary.

          `TestSandboxLinuxFile_HasNoExecErasedStatements` — the inverse, and the
          one that catches the drift that matters: assert `sandbox_linux.go`
          contains no call to `unix.Exec` and no function that reaches it. A future
          edit that moves exec-side logic back into the measured file would
          otherwise silently re-create an unmeasurable-but-not-excluded region, and
          the number would drop with no explanation.

          Both are AST tests over source, so they run on darwin — deliberately, for
          the same reason as every other structural guard in this plan.

          JOB 2 — the linux-side behavioral tests below, which remain worth writing
          for the paths that DO carry counters. Do NOT write tests whose only
          purpose is a number the instrument cannot record; that was the trap
          TASK-031 existed to find.

          THE CONSTRAINT THAT SHAPES EVERY CHOICE HERE: these tests only EXECUTE ON
          THE RUNNER. The file is `//go:build linux`, so the local suite cannot see
          them run and `go test` on darwin will report success having run none of
          them. Write them knowing the feedback loop is a CI run, and make each one
          earn that round trip — a test needing three runner iterations to get right
          costs more than one reasoned through first.

          Extend `pkg/packval/sandbox_linux_exec_test.go` and add
          `pkg/packval/sandbox_linux_errors_test.go` (both `//go:build linux`).
          Target the paths carrying real behavior:
            - `applyLandlock`: a required path that cannot be opened; a required
              path whose `Fstat` fails; `landlock_add_rule` rejecting a rule;
              `landlock_restrict_self` failing; and the OPTIONAL-path skip, which is
              a behavior (a distro without /usr/lib64 must still sandbox), not an
              error branch.
            - `applySeccomp`: filter installation failing.
            - `probeLandlockABI`: the ABI-0 / ENOSYS refusal — CLM-015's own path,
              and one of the few that is cheap to drive.
            - `newSandboxHelperCommand` / `filterHelperEnv`: request encoding and
              environment filtering. NOTE these two are PARENT-SIDE per TASK-031's
              split, so their counters flush normally — they are the paths where
              conventional tests work regardless of which fork was chosen.
            - the helper-returned-without-exec'ing guard (:108-112), which is
              reachable only by calling the inner function directly — see the
              unreachable-by-contract treatment in TASK-033.
        files:
          - pkg/packval/sandbox_linux_exec_test.go
          - pkg/packval/sandbox_linux_errors_test.go
          - pkg/packval/sandbox_split_test.go
        claims:
          - CLM-042
          - CLM-043
        depends_on:
          - TASK-013
          - TASK-031

      - id: TASK-033
        type: refactor
        title: "Split the exec-only functions into their own file"
        description: |
          Move the FIVE exec-only functions — `applyRestrictionsAndExec`,
          `applyLandlock`, `applySeccomp`, `seccompAuditArch`,
          `seccompSyscallNumbers` — into a new `pkg/packval/sandbox_linux_helper.go`
          carrying the SAME `//go:build linux` tag. That file is what phase-4e's
          declared exclusion will name.

          ⚠ SPLIT `MaybeRunSandboxHelper` TOO — THIS IS A DESIGN REQUIREMENT, NOT A
          FOOTNOTE. That function is partially counted (the parent calls it and it
          returns nil immediately when the process is not a helper), but its HELPER
          BRANCH — roughly six statements — runs on the exec side and is erased just
          like the five. Leaving it whole would strand those statements in the
          MEASURED file, where they can never be covered and are not excluded
          either: the worst of both, and precisely the kind of residue that makes a
          coverage number unexplainable six months later. Split it so the parent-side
          gate check stays in `sandbox_linux.go` and every exec-side statement lands
          in the helper file.

          DO NOT PROMISE 90% FOR THE REMAINDER. The post-split number for
          `sandbox_linux.go` is a RE-MEASUREMENT on the runner, not an arithmetic
          certainty — the profile tells us what is erased today, not what the
          remainder will measure after the boundary moves. Predict it, state the
          prediction, and treat a follow-up move of further statements into the
          helper file as a LOUD, EXPECTED POSSIBILITY rather than a failure. Report
          the predicted and actual side by side.

          The seams-and-unreachable-set work below applies to whatever remains
          measurable after the split. Introduce the
          minimum injection seams the inventory shows are needed — package-
          level function variables are NOT the answer here (`go.core.
          no-global-mutable-state`, and the `root.go:20` exception is
          constraint-based in a way this is not); prefer passing the dependency, or
          a small unexported struct holding the syscall functions, so the seam is
          explicit and testable without mutable global state.

          KEEP THE SEAMS THIN. Every indirection between this code and the kernel is
          a place where the test and the production path can diverge — which is the
          failure mode that produced two of this lane's three runner failures. A
          seam that lets a test simulate `landlock_add_rule` returning EINVAL is
          worth it; a seam that abstracts what a Landlock rule IS is not.

          THEN NAME THE UNREACHABLE SET EXPLICITLY. For every statement that cannot
          be executed by any honest test, add a comment saying WHY and count it in
          the report. The known member is the post-`unix.Exec` guard (:108-112),
          which the source already documents: reaching it requires
          `applyRestrictionsAndExec` to return after a successful exec, which cannot
          happen. Do NOT delete such guards to raise the percentage, and do not
          restructure the code so the impossible case disappears — that guard exists
          because a silent pass-through is the defect this whole mechanism prevents.

          If the floor cannot be reached once the unreachable set is excluded,
          STOP AND REPORT with the inventory rather than inventing a waiver or
          reshaping the code around the number.
        files:
          - pkg/packval/sandbox_linux.go
          - pkg/packval/sandbox_linux_helper.go
        claims:
          - CLM-042
          - CLM-043
        depends_on:
          - TASK-032

      - id: TASK-034
        type: verification
        title: "Verify locally what can be verified, and defer the measurement honestly"
        description: |
          Run and report true exit codes for:

            go build ./...
            GOOS=linux go build ./...
            GOOS=linux go vet ./pkg/packval/
            go test ./... -race -count=1
            go build -o bin/backstop ./cmd/backstop/
            ./bin/backstop gate

          Every darwin sandbox test must still pass unmodified, and the exported
          sandbox surface must be unchanged — the seams are internal.

          THEN STATE THE LIMIT PLAINLY. None of the above measures
          `sandbox_linux.go`: it does not compile on darwin, so the local suite
          cannot execute one line of it and `go test` will report success while
          having run none of TASK-031's tests. The coverage claim is settled by
          TASK-019's next runner measurement and by nothing else (CLM-042).

          Report the statement inventory from TASK-031 and TASK-033 — counted-but-
          unflushed, reachable, seam-required, and unreachable-by-contract with
          justifications — so the next runner number can be checked against a
          PREDICTION rather than merely observed. If TASK-031 chose the exclusion
          fork, state the predicted post-exclusion measurement explicitly; a number
          nobody predicted is a number nobody can be wrong about.
        files:
          - pkg/packval/sandbox_linux.go
          - pkg/packval/sandbox_linux_errors_test.go
        claims:
          - CLM-042
        depends_on:
          - TASK-033

  - id: phase-4e
    name: "Phase 4e: Give the pack a declared-exclusion mechanism"
    tasks:
      - id: TASK-035
        type: test
        title: "Dogfood falsifier: a declared exclusion is honoured and visible"
        description: |
          The core mechanism already exists — `CoverageRecord.Excluded`
          (`pkg/check/coverage.go:38`) and the threshold skip at
          `pkg/gate/step_coverage.go:170`. What does not exist is any way for a
          consumer to DECLARE one: the go-toolchain pack's producer hardcodes
          `"excluded":false` into every record it writes
          (`scripts/coverage-to-records.sh:98`, the only occurrence of the word).

          Write the RED dogfood tests in `pack_fleet_test.go` (the root package that
          already asserts against the real repo's pack state):

          `TestCoverageExclusion_DeclaredPathIsSkippedNotFailed` — with
          `sandbox_linux_helper.go` declared excluded, the coverage dimension SKIPS
          the threshold check for it rather than reporting `coverage_unmeasured` or
          a below-threshold failure. Those three outcomes are easy to confuse and
          only one is correct.

          `TestCoverageExclusion_CarriesAJustification` — the record for an excluded
          path carries a non-empty justification string. An exclusion with no stated
          reason is indistinguishable from a mistake, and it is what makes the next
          one easy.

          ⚠ PLAN GAP, FOUND BY THE IMPLEMENTER BEFORE WRITING THIS TEST, AND A
          CORRECT STOP: the field this test asserts EXISTS NOWHERE.
          `check.CoverageRecord` (`pkg/check/coverage.go:25-45`) has Path, Covered,
          Total, Measured, Excluded and Metric — no justification. And
          `coverageExclusionReason` (`pkg/gate/step_coverage.go:248`), despite the
          name, only reports the METRIC; its own doc comment says outright that "the
          canonical record carries no free-form reason field." So NO PACK CHANGE
          ALONE could satisfy this test — the mandated assertion was unsatisfiable
          as written, and stopping to say so was worth more than an approximation
          that passed.

          The ruling is CLM-046: the field is added to core additively, and the
          REQUIREMENT that it be non-empty stays in the pack and in this test.
          TASK-036 carries the core edits.

          NOTE THE RED-STATE SHAPE: until TASK-036 lands the field, this test does
          not merely fail — it does not COMPILE, which takes the whole root package
          with it. That is a legitimate red, but it is a noisy one, so sequence
          accordingly and do not mistake the package-wide breakage for a second
          defect.

          `TestCoverageExclusion_UndeclaredPathStillFails` — the guard against the
          mechanism becoming a blanket: a path NOT declared excluded still fails
          below threshold. Without this, a broken exclusion matcher that excluded
          everything would look like success.

          THESE CONFUSION-GUARD TESTS ARE WRITABLE AGAINST REAL BEHAVIOR, which is a
          useful negative finding worth recording: skip, unmeasured and
          below-threshold are THREE DISTINCT CODE PATHS in the existing gate, not
          three descriptions of one. `step_coverage.go:170`'s exclusion skip already
          emits a NON-BLOCKING `coverage_exclusion` warning for an in-scope excluded
          file, and `coverage_unmeasured` (:127-138) is a separate blocking rule.
          So the distinction the tests assert is real machinery, and a test that
          confuses them will genuinely fail rather than pass by coincidence.
        files:
          - pack_fleet_test.go
        claims:
          - CLM-044
          - CLM-046
        depends_on:
          - TASK-034

      - id: TASK-036
        type: implementation
        title: "Add the justification field to core, the exclusion mechanism to the pack, then relock"
        description: |
          TWO HALVES, AND THE CORE HALF COMES FIRST because the pack half cannot be
          tested without it.

          ── CORE HALF (CLM-046), strictly additive ────────────────────────────
          `pkg/check/coverage.go`: add
          `Justification string json:"justification,omitempty"` to
          `CoverageRecord`. `omitempty` is load-bearing, not style — it keeps every
          existing producer wire-compatible, including packs that still hardcode
          `excluded:false` and know nothing about this field.

          `pkg/gate/step_coverage.go`: make `coverageExclusionReason` (:248) PREFER
          the justification when non-empty, and keep the existing bare
          "(pack-declared exclusion)" fallback for records without one. Update that
          function's doc comment — it currently states the record carries no
          free-form reason field, which was true when written and is the reason this
          gap went unnoticed.

          DO NOT MAKE CORE REJECT AN UNJUSTIFIED EXCLUSION. Core carries the DATA;
          the pack carries the DEMAND. A binary that refuses an exclusion without a
          justification is a baked policy opinion, and the thin-executor rule puts
          that in packs. The requirement is enforced by the go-toolchain pack and by
          TASK-035's dogfood test — both of which can evolve on their own clock.

          ── PACK HALF ────────────────────────────────────────────────────────
          CROSS-REPO, and sanctioned: the packs-learn-from-scenarios law says a
          scenario the packs cannot express is fixed IN THE PACK, versioned, never
          scarred into consumer code. The same evidence bar applies, and
          `pkg/packval/testdata/sandbox-linux-coverage-profile.txt` IS that evidence
          — a measured profile showing 79 statements the instrument cannot observe.

          In `backstop-ai/go-toolchain`: design how a consumer DECLARES excluded
          paths. Weigh pack config in `backstop.yml` against a file convention, and
          record WHY — this is a pack-design decision that outlives this plan, since
          every language toolchain pack will eventually want it. Then teach
          `scripts/coverage-to-records.sh` to emit `"excluded":true` plus the
          justification for a declared path instead of the hardcoded false.

          ⚠ DESIGN AGAINST CASUAL USE. This mechanism's failure mode is not being
          broken; it is being CONVENIENT. Require a justification string in the
          declaration and echo it into the record (CLM-044) so an exclusion is
          visible in gate output and reviewable in a diff. Prefer a shape where
          excluding a path is more work than covering it. If the design makes
          `# nocover`-style annotation easy, it is the wrong design — this plan
          rejected exclusion twice on waiver-shaped grounds and only accepted it for
          a boundary where the instrument provably cannot see.

          Then: version bump, publish the tag, and `backstop pack relock` in
          backstop-core so the lock records the new version. Declare
          `pkg/packval/sandbox_linux_helper.go` excluded, with the justification
          citing the profile and its run URL.

          Follow the pack-fleet migration recipe's silent steps — a relock that
          leaves the lock and the installed tree disagreeing fails quietly.

          ── AS BUILT: TWO FURTHER SCOPE EXTENSIONS, GRANTED ───────────────────
          `cmd/backstop/baseline.go` — `configErrorDiagnostic` surfacing, with a
          falsifier PAIR. It also CORRECTED A FALSE COMMENT: the code asserted that
          a config-error gate is ALWAYS stepless, which run 30398137055 disproves.
          Worth noting as a class — a confidently-worded comment that is wrong is
          more expensive than no comment, because it stops the next reader from
          checking. Two of this plan's own defects were exactly that shape.

          `pkg/gate/policy.go` — reached by the same surfacing work.

          Both were outside every task's declared file scope, which is how the
          justification-field gap surfaced too: the file list is the plan's model of
          the change, and when the model is missing a file, the gap shows up as a
          task that cannot be completed as written. That is the file scope working,
          not failing.
        files:
          - pkg/check/coverage.go
          - pkg/gate/step_coverage.go
          - pkg/gate/policy.go
          - cmd/backstop/baseline.go
          - backstop.yml
          - backstop.lock
        claims:
          - CLM-044
          - CLM-046
        depends_on:
          - TASK-035

      - id: TASK-037
        type: verification
        title: "Verify the exclusion is scoped, justified, and not a blanket"
        description: |
          Run and report true exit codes for:

            go build ./...
            go test ./... -race -count=1
            go build -o bin/backstop ./cmd/backstop/
            ./bin/backstop pack install
            ./bin/backstop gate

          Then confirm, from the gate's own output:
            - `sandbox_linux_helper.go` is reported as EXCLUDED with its
              justification visible — not silently absent from the report.
            - EVERY OTHER file, including `sandbox_linux.go`, is still measured and
              still subject to the threshold. Name them; an exclusion that
              accidentally matched a prefix would show up here and nowhere else.
            - the lock records the new pack version and the installed tree matches.

          If the exclusion cannot be seen in the output, it fails CLM-044 even if it
          works — the point of the justification is that a reader encounters it.
        files:
          - backstop.lock
          - pack_fleet_test.go
        claims:
          - CLM-044
        depends_on:
          - TASK-036

  - id: phase-4f
    name: "Phase 4f: Stop CI steps leaving ungitignored droppings in the diff scope"
    tasks:
      - id: TASK-038
        type: test
        title: "Shape test: the gate's own steps leave no ungitignored files"
        description: |
          PR #1's scope list contained `ast-grep.zip` (a tool-install leftover — the
          original 6-vs-5 culprit, now identified) and `gate-report.json` (our own
          diagnostic output). Both were UNTRACKED and therefore IN SCOPE, so CI
          gated files no author wrote.

          STATE THE DIAGNOSIS PRECISELY, because the tempting fix is the wrong one:
          diff-scope-includes-untracked is BY DESIGN and founder-ratified
          (ISSUE-004) — an author's new file must be gated before it is committed,
          or the gate misses every new file. The defect is CI STEPS LEAVING
          DROPPINGS, not the scope rule. Do not "fix" this by excluding untracked
          files from scope; that would silently stop gating every newly added file
          in the repo.

          Add to `workflows_test.go`:

          `TestCIWorkflow_LeavesNoUngitignoredArtifacts` — assert that every file a
          workflow step is known to create is either written to a gitignored path or
          listed in an explicit allowed-leftovers set. Enumerating the allowed set
          is the point: it turns "what did CI drop this time" into a reviewable
          list, and a new dropping fails the test rather than quietly entering
          someone's diff scope.
        files:
          - workflows_test.go
        claims:
          - CLM-045
        depends_on:
          - TASK-034

      - id: TASK-039
        type: implementation
        title: "Gitignore the tool leftover and relocate the gate report"
        description: |
          Turn TASK-038 green:
            - `ast-grep.zip` — the installer leftover. Gitignore it, or better,
              delete it in the install step: a downloaded archive has no reason to
              survive its own extraction.
            - `gate-report.json` — our own `--json` output from TASK-031. Write it to
              a gitignored path. It is diagnostic output; it should never have been
              a candidate for the diff scope it is reporting on, which is a small
              ouroboros worth avoiding on principle as well as in practice.

          Keep the JSON itself — TASK-031 added it for good reasons and this only
          changes where it lands.
        files:
          - .github/workflows/ci.yml
          - .gitignore
        claims:
          - CLM-045
        depends_on:
          - TASK-038

