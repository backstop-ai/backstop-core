        type: verification
        title: "Verify the workflow leaves a clean tree"
        description: |
          Run and report true exit codes for:

            go test . -race -count=1 -run 'TestCIWorkflow' -v
            go run github.com/rhysd/actionlint/cmd/actionlint@latest \
              .github/workflows/ci.yml
            go build -o bin/backstop ./cmd/backstop/
            ./bin/backstop gate

          The real proof is on the runner and belongs to TASK-019's re-run: report
