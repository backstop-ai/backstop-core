  - id: phase-3
    name: "Phase 3: Linux sandbox — capability struct plus bubblewrap"
    tasks:
      - id: TASK-011
        type: test
        title: "Capability-to-argv tests, runnable on any platform"
        description: |
          Write the RED tests for the capability struct and the pure argv builder.
          These must NOT be build-constrained to linux: the builder is a pure
          function, and keeping it testable on darwin is what lets the mechanism be
          reviewed and regression-locked on the machine where development happens.

          `TestSandboxCapabilityArgv_DeniesNetworkAndScopesReads` — the
          convert/validator capability set produces an argv carrying
          `--unshare-user`, `--unshare-net`, the `/usr` read-only bind with the
          merged-`/usr` symlinks, `--dev /dev`, `--proc /proc`, a `--ro-bind` of
          packDir onto itself, and `--chdir <packDir>`. Assert the packDir bind and
          the chdir explicitly: the spike's recorded invocation omits both, and
          without them the pack's own convert script does not exist inside the
          sandbox.

          `TestSandboxCapabilityArgv_NoWritablePathsByDefault` — the default
          capability set grants NO writable bind and no tmpfs. Darwin denies
          `file-write*` outright; parity is the spec, and a convenience `/tmp` is a
          real divergence.

          `TestSandboxCapabilityArgv_NoProjectPathReadable` — a readable set of
          exactly {packDir, system paths} produces no bind of the project root or
          any parent of packDir.

          `TestSandboxCapabilityArgv_NetworkAllowedDropsUnshareNet` and
          `TestSandboxCapabilityArgv_AddedReadablePathAddsRoBind` — the
          graduated-profile proof (CLM-012). The argv is DERIVED from the capability
          struct, so changing the struct changes the argv. If these two pass while
          the others do, the flags are hardcoded and the struct is decorative.

          `TestSandboxUnavailableMechanismIsLoudError` — when the mechanism cannot
          be resolved, the returned error names the mechanism and ISSUE-020, and no
          command is executed. Inject the resolver; do not depend on the host
          lacking bwrap.

          `TestSandboxUnsupportedPlatformStillErrors` — the `default` branch keeps
          refusing, so a third platform does not silently inherit the Linux path.

          READ `pkg/packval/testdata/ubuntu-runner-probe.txt` BEFORE WRITING THESE
          ASSERTIONS. Every bwrap-specific expectation above presumes the probe
          confirmed the mechanism on the real runner. That file is the reason this
          task depends on TASK-001 rather than only on TASK-010: if the probe
          recorded a restricted `apparmor_restrict_unprivileged_userns` or a failing
          `--unshare-user`, these tests would be encoding a mechanism that cannot
          run, and the correct move is to STOP AND ESCALATE before writing them.
        files:
          - pkg/packval/sandbox_capability_test.go
        claims:
          - CLM-011
          - CLM-012
          - CLM-015
        depends_on:
          - TASK-001
          - TASK-010

      - id: TASK-012
        type: implementation
        title: "Implement the capability struct and the bubblewrap Linux branch"
        description: |
          Turn TASK-011 green.

          In a new `pkg/packval/sandbox_capability.go` (NO build tag — the builder
          must compile and be testable everywhere), define the capability struct:
          readable paths, writable paths, network bool. Give it the doc comment
          BUNDLE-021 OQ-2 requires — leg 2 of the issue's triple-tracked hedge —
          stating plainly that this is an INTERNAL representation chosen so a future
          pack-DECLARED capability can be slotted in without a rewrite, that it does
          NOT resolve OQ-2, and that BUNDLE-021 owns that question. Then the pure
          argv builder: capability set plus packDir plus command and args in, full
          bwrap argv out.

          Define the convert/validator capability set as the darwin-parity default:
          readable = {packDir, the system paths the merged-`/usr` layout needs},
          writable = {} (empty — see the notes), network = false.

          In `pkg/packval/sandbox.go`, replace BOTH `case "linux":` hard errors with
          the real execution path. Resolve the mechanism binary; on failure return an
          error naming bubblewrap and ISSUE-020 and execute nothing. Otherwise build
          the argv and run it, preserving each function's existing output contract
          exactly: `SandboxedRun` keeps `CombinedOutput`; `SandboxedRunStdout` keeps
          the explicit stdout buffer, the stdin pipe, and the "return stdout captured
          so far alongside the error" behavior on non-zero exit. Those contracts are
          what keep a converter's stderr banner out of the SARIF the gate parses.

          Do not touch `darwinSandboxProfile`, the darwin branches, or the exported
          signatures. Callers in `pkg/packval/executor.go:46` and
          `cmd/backstop/pack_gate.go:472,693` must not change — verify by building,
          not by inspection.

          THE PROBE RECORD IS A PRECONDITION, NOT BACKGROUND READING. Open
          `pkg/packval/testdata/ubuntu-runner-probe.txt` and check the mechanism
          against it before committing to bubblewrap: the
          `apparmor_restrict_unprivileged_userns` value, whether the corrected
          invocation exited 0 as the unprivileged runner user, and whether bwrap was
          preinstalled or needed apt. Cite the probe file in the implementation's
          doc comment so the next reader can see what the choice rests on.

          If the probe falsified the bwrap path, STOP HERE and escalate. Do not
          implement a fallback mechanism on your own authority, and do not proceed
          on the assumption that a real runner behaves like the container test bed —
          the spike established it does not.
        files:
          - pkg/packval/sandbox_capability.go
          - pkg/packval/sandbox.go
        claims:
          - CLM-011
          - CLM-012
          - CLM-013
          - CLM-015
          - CLM-016
          - CLM-017
        depends_on:
          - TASK-001
          - TASK-011

      - id: TASK-013
        type: test
        title: "The falsifiable assertion triple as real Linux execution"
        description: |
          Write the `//go:build linux` execution tests. These do not run on the
          development machine; they are what Phase 5 proves in CI, and they are the
          difference between "a Linux branch exists" and "the Linux branch denies
          anything".

          The triple, from the spike, and it is a triple for a reason — a bare
          "exit 0" cannot distinguish "the sandbox denied correctly" from "the
          sandbox did nothing":

          `TestLinuxSandbox_DeniesReadOfUnboundPath` — reading a path outside the
          capability's readable set fails with a not-found/denied error.

          `TestLinuxSandbox_DeniesNetwork` — `getent hosts` under the default
          capability exits non-zero.

          `TestLinuxSandbox_NetworkAllowedControlLegSucceeds` — the SAME command
          with network allowed exits zero. THE CONTROL LEG. Without it, the previous
          test could be passing because of an unrelated failure.

          `TestLinuxSandbox_ReadsPackDirContents` — a file inside packDir IS
          readable, so the denials above are not simply "nothing works".

          `TestLinuxSandbox_ConvertScriptProducesCleanStdout` — a real convert-shaped
          script that writes a banner to stderr and payload to stdout, run through
          `SandboxedRunStdout`, yields payload only. This is the actual gate path.

          When bwrap is absent these tests must FAIL, not `t.Skip`. A skip is how a
          Linux sandbox stays unproven for another six months; the founder's posture
          is that failures are loud and attributed. Say so in a comment at the top of
          the file so a future reader does not "helpfully" add a skip.
        files:
          - pkg/packval/sandbox_linux_exec_test.go
        claims:
          - CLM-014
        depends_on:
          - TASK-011

      - id: TASK-014
        type: verification
        title: "Verify darwin is untouched and the Linux path compiles"
        description: |
          Run and report true exit codes for:

            go build ./...
            GOOS=linux go build ./...          (the linux branch must COMPILE here,
                                                where nobody can run it yet)
            go vet ./pkg/packval/
            go test ./... -race -count=1
            go test ./pkg/packval/ -race -count=1 -run 'Sandbox' -v
            go build -o bin/backstop ./cmd/backstop/
            ./bin/backstop gate

          The darwin sandbox tests — `TestSandboxSecurityDenialsHold`,
          `TestSandboxDeniesProjectFileRead`, `TestSandboxDeniesFileWrite`,
          `TestSandboxDeniesNetwork`, `TestSandboxConvertWithRealInterpreter`,
          `TestSandboxProfileAllowsDyldLibraries` — must all pass UNMODIFIED. If any
          needed a change, the darwin path was touched and CLM-016 is violated;
          report it rather than adjusting the test.

          State explicitly in the report that `sandbox_linux_exec_test.go` did NOT
          execute here and is unproven until TASK-019. Do not describe Phase 3 as
          "the Linux sandbox works".
        files:
