  ── WHAT `coverage_threshold: 90` MEANS AFTER THIS PLAN, AND WHAT IT DOES NOT ─
  The frontmatter value above stays 90 and is still correct — but it now means
  something narrower than the number it replaces in ci.yml, and saying so is the
  point of this block.

  TASK-016 DELETES the "Enforce coverage threshold" step, which today computes
  `go tool cover -func` over the whole repo and fails under an AGGREGATE 90%. The
  gate's coverage dimension is not that: it is PER-FILE and DIFF-SCOPED, so after
  the flip CI answers "is each file this PR touched adequately covered?" and stops
  answering "is the repository as a whole at 90%?" entirely. Nothing else in CI
  answers the second question afterwards.

  That is a deliberate consequence of "green if the diff is green", not an
  oversight, and it is the SAME trade ISSUE-094 was filed to hold the other half
  of: a diff-scoped gate makes untouched-file debt invisible unless something
  non-blocking keeps surfacing it. Aggregate repo coverage is exactly that class
  of signal. It is therefore ROUTED to ISSUE-094's loud-but-non-blocking repo-wide
  sweep — the issue that already carries the measured seed from the first real CI
  run (23 errcheck + unparam findings in pkg/config and pkg/check). Do not
  re-implement an aggregate coverage gate in ci.yml to "keep parity": a blocking
  whole-repo threshold is precisely what the founder ruled against, and ISSUE-094
  owns the visibility half.

