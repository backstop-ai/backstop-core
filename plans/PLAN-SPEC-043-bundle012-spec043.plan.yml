  Implements SPEC-043 (BUNDLE-012 Spec Seed 1) — the FOUNDATION contract the bundle's
  four sibling consumer specs depend on. Two coupled deliverables:
  (1) the pack-declared file-CLASSIFICATION contract as DATA on pack.Manifest.Classification
  (Source/Test glob lists), and (2) applying it to de-Go pkg/gate/step_coverage.go's
  coverageMeasurablePath so the default-diff-scope vacuous-green hole (a changed .ts file
  silently skipped) is closed with a LOUD blocking no-record guard.

  ════════════════════════════════════════════════════════════════════════════
  CROSS-PLAN COORDINATION — shared files with PLAN-SPEC-044 / PLAN-SPEC-045
  ════════════════════════════════════════════════════════════════════════════
  THIS plan is the FOUNDATION and MUST land first. The implement-phase orchestrator
  MUST serialize the shared-file edits in this order (043 before 044/045):
    - pkg/gate/step_coverage.go — co-edited by PLAN-SPEC-044 (the (path,metric) index +
      per-metric threshold loop) and PLAN-SPEC-045 (coverageSpecRelevantToFile de-Go).
      043 lands the CANONICAL 4-arg StepCoverageThresholdScopedFunc(coverage, specs,
      scope, classifier) signature + dismantles the `if threshold <= 0 { return pass }`
      early return FIRST; 044 ADOPTS that 4-arg signature (does NOT fork the 3-arg form)
      and adds its (path,metric) record model behind it; 045 de-Go's the sibling
      relevance helpers afterward.
    - pkg/pack/manifest.go — co-edited by PLAN-SPEC-045 (TestNamePatterns). 043 adds the
      Classification type/field first.
    - pkg/gate/classification.go — 043 builds SourceClassifier and MUST store BOTH the
      source AND test glob sets; PLAN-SPEC-045 later adds IsTestFile/HasTestGlobs reading
      exactly the stored test set (dropping the test set would orphan SPEC-045).

  ════════════════════════════════════════════════════════════════════════════
  DOGFOOD LOCKSTEP (load-bearing — TASK-014)
  ════════════════════════════════════════════════════════════════════════════
  Deleting the baked `.go` literal from coverageMeasurablePath means backstop-core's OWN
  coverage gate stops classifying `.go` UNLESS the installed backstop/go-toolchain pack.yml
  gains a `classification: {source, test}` block IN THE SAME change set. TASK-014 adds that
  block to the in-repo dogfood copy (.backstop/packs/...) AND the cmd/backstop testdata copy
  so `backstop gate` stays GREEN throughout. DURABILITY: .backstop/packs/ is gitignored, so
  the authoritative edit must ALSO land in the external backstop/go-toolchain pack repo —
  flagged here as a wiring dependency; the in-repo copy keeps the local gate green until the
  pack-repo edit is pulled.

  ════════════════════════════════════════════════════════════════════════════
  INTEGRATION-GAP GUARD (REQ-005 / CLM-020 — TASK-012)
  ════════════════════════════════════════════════════════════════════════════
  The e2e MUST drive the FULL gate assembly (buildGateSteps/runGate) so the live
  mergeSourceClassifier(packs) call site is exercised — NOT a hand-merged classifier
  handed to buildCoverageStep / StepCoverageThresholdScopedFunc directly (the SPEC-035/037
  integration gap). mergeSourceClassifier takes the FULL declared-manifest set (no
  toolchain-only pre-filter) and takes NO `bridged` argument so it survives SPEC-046's
  deletion of the language:-derived bridge (loadBridgedToolchainPacks/toolchainPackName).

  Matcher: github.com/bmatcuk/doublestar (TRUE doublestar, zero-leading-segment: `**/*.go`
  matches the live repo-ROOT embed.go) — NOT github.com/gobwas/glob, which drops root files
  and re-opens the vacuous-green hole.

