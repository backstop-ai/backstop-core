  - id: phase-4
    name: "Phase 4: De-Go'd Coverage Step + Anti-Vacuous-Green Guard"
    description: |
      Re-shape pkg/gate/step_coverage.go to consume the SourceClassifier instead of the baked
      coverageMeasurablePath. The keystone deliverable: DISMANTLE the
      `if threshold <= 0 { return pass }` early return so the measurable-source no-record scan
      runs BEFORE/INDEPENDENT of any numeric threshold resolution, emit a LOUD blocking
      no-record violation under a DISTINCT rule (distinct from below-threshold), and surface a
      DISTINCT non-blocking "classification capability absent" state when no source globs are
      declared. SHARED-FILE NOTE: this lands the CANONICAL 4-arg
      StepCoverageThresholdScopedFunc(coverage, specs, scope, classifier) signature that
      PLAN-SPEC-044 ADOPTS (it must NOT regenerate the 3-arg form); the no-record guard keys on
      "no record for the path at ALL (any metric)" so it composes with 044's (path,metric) index.
    tasks:
      - id: TASK-009
        type: test
        title: "Write de-Go'd coverage-step guard + capability-absent tests"
        description: |
          pkg/gate/step_coverage_classifier_test.go — RED against the new 4-arg signature +
          guard:
            - TestCoverage_ChangedTSSourceFileNoRecordIsLoudBlockingNotVacuousGreen: the
              LOAD-BEARING regression — a changed NON-Go source file (app/foo.ts) matching the
              declared source glob, with NO coverage record and not excluded, yields a LOUD
              blocking violation (severity error, status fail), NOT a silent green (CLM-012).
            - TestCoverage_NoRecordDistinctFromBelowThreshold: a no-record changed file and a
              below-threshold changed file produce DISTINGUISHABLE violations (different
              rule/message) — the report never conflates "nothing measured" with "measured low"
              (CLM-013).
            - TestCoverage_NoRecordGuardFiresWithoutNumericThreshold: a changed measurable-source
              file with no record REDs even when NO numeric threshold is declared in scope — the
              declared source glob is itself the measurement promise (CLM-014).
            - TestCoverage_ChangedSourceWithRecordNotFlaggedByNoRecordGuard: a changed
              measurable-source file WITH a record present is NOT flagged by the no-record guard —
              it is handed to the threshold verdict path (CLM-015).
            - TestCoverage_ChangedTestFileNoRecordNotFlagged: a changed TEST file (app/foo.test.ts
              matching the declared test glob) with no record does NOT trigger the loud guard
              (CLM-016).
            - TestCoverage_NoRecordGuardChecksAnyMetricRecordPresence: the guard keys on "no
              record for the path AT ALL (any metric)" — a path carrying at least one record under
              any metric is NOT a no-record error (the SPEC-044 seam) (CLM-017).
            - TestCoverage_NoDeclaredSourceGlobsIsVisibleCapabilityAbsentNotSilentPass: with NO
              source globs and in-scope changed files, the step returns a DISTINCT, VISIBLE
