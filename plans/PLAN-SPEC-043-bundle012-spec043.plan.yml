        type: implementation
        title: "De-Go step_coverage.go: classifier param, delete measurable-path, guard, capability-absent"
        description: |
          pkg/gate/step_coverage.go:
            - Add the trailing `classifier SourceClassifier` parameter to
              StepCoverageThresholdScopedFunc (the CANONICAL 4-arg form) and thread it into the
              convenience wrapper StepCoverageThresholdFunc.
            - DELETE coverageMeasurablePath (the baked `.go`/`_test.go`/`testdata` literals);
              re-key coveragePathsInScope to filter in-scope changed files via
              classifier.IsMeasurableSource (CLM-009 — no baked literal survives in the consumer).
              Do NOT touch coverageSpecRelevantToFile / packagePathMatches — they legitimately
