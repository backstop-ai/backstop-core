        type: test
        title: "Write end-to-end live-wiring tests (full gate assembly, no hand-merge)"
        description: |
          cmd/backstop/gate_classifier_wiring_test.go — drives the FULL gate assembly
          (buildGateSteps/runGate) over the TASK-002 classifier-e2e testdata project (NOT a
          hand-merged classifier handed to buildCoverageStep/StepCoverageThresholdScopedFunc
