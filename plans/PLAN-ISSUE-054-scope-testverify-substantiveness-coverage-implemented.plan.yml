  ─────────────────────────────────────────────────────────────────────────
  THE CHANGE — sibling of PLAN-ISSUE-051, but TWO mechanisms (verified against
  the source at author time; do NOT re-derive). Reuses the `contractsAreDue`
  predicate ISSUE-051 already landed (pkg/gate/step_testverify.go:183,
  `status == "implemented"`) — do NOT reinvent it, do NOT rename it, do NOT
  touch isTerminalSpecStatus.
  ─────────────────────────────────────────────────────────────────────────
  Three extraction functions in pkg/gate/step_testverify.go feed the three
  sibling dimensions, and they have DIFFERENT status needs:

  1. ExtractSpecVerifications (:477) → coverage_threshold ONLY (not shared).
     DIRECT-scope it exactly like ExtractContractEntries: replace the
     terminal-only skip (:494-496 `if isTerminalSpecStatus(fm.Status)`) with
         if !contractsAreDue(fm.Status) { continue }

  2. ExtractMandatedTests (:106) feeds THREE consumers:
       - StepTestVerificationScopedFunc (:311)            → test_verification
       - buildTestSubstantivenessStep (cmd/backstop/gate.go:974) → test_substantiveness
       - ResolveArtifactStatus (pkg/gate/artifact_status.go:160) → artifact_status_drift
     artifact_status_drift REQUIRES draft-spec visibility (looksDelivered /
     ClassifyStatusDrift in pkg/gate/status_drift.go raise the "draft but looks
     delivered" advisory), so ExtractMandatedTests itself MUST NOT be scoped.
     Instead:
       (a) add a `Status string` field to the MandatedTest struct (:16),
       (b) populate it in ExtractMandatedTests from fm.Status (the extractor
           already reads fm.Status at :123),
       (c) filter at the test_verification + substantiveness CONSUMERS with
           `contractsAreDue(mt.Status)` before acting on a mandated test.
     ResolveArtifactStatus keeps consuming the UNFILTERED list unchanged — this
     is the guard that must be proven with a test (draft-looks-delivered still
     fires).

  ─────────────────────────────────────────────────────────────────────────
  FILTER PLACEMENT (exact)
  ─────────────────────────────────────────────────────────────────────────
  - test_verification: in StepTestVerificationScopedFunc, filter `mandated`
    to keep only contractsAreDue(mt.Status) IMMEDIATELY after ExtractMandatedTests
    and BEFORE the `len(mandated) == 0` early-return + capability guard, so an
    all-draft spec set returns a clean pass (nothing due) rather than a
    capability warning.
  - test_substantiveness: in buildTestSubstantivenessStep, filter `mandated`
    to keep only contractsAreDue(mt.Status) after ExtractMandatedTests and
    BEFORE ResolveMandatedTestPaths / the Q2 noTarget join loop. The Q1 hollow
    findings are pack-produced over test files (not per-mandated-test) — the
    scoping bites the mandated-test-keyed Q2 join; Q1 hollow stays as-is.
  - artifact_status_drift: NO change to ResolveArtifactStatus — it consumes
    the unfiltered list. Adding the Status field is additive and does not
    change its behavior.

  ─────────────────────────────────────────────────────────────────────────
  BLAST RADIUS — TRACED EXHAUSTIVELY (independent grep of every caller of all
  three extractors AND every fixture staging a draft/statusless spec carrying
  a test command / mandated tests / coverage threshold that reaches one of the
  three scoped consumers). 051's plan under-counted and FAILED review — this is
  the #1 risk, so the categories below distinguish FLIPS from VERIFIED-UNCHANGED.
