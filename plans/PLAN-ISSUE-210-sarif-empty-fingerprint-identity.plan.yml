notes: |
  ISSUE-210: sarifFingerprint (pkg/check/parsers.go:227-242 at 269c5e6; the
  issue's :187-202 predates the ISSUE-208 edit) takes the partialFingerprints
  branch whenever the map has any keys (`if len(partial) > 0`) and never looks
  at the values. A producer that emits the keys with empty values (gitleaks in
  dir mode: commitSha, email, author, date, commitMessage, all "") gets the
  constant fingerprint "author=;commitMessage=;commitSha=;date=;email=" for
  every result. That string becomes gate.Violation.RegionHash
  (cmd/backstop/pack_gate.go:1125, `RegionHash: v.Fingerprint`; the issue's
  :994 is stale), and EnrichViolationIdentity (pkg/gate/baseline.go:205-224)
  builds identity as Rule|File|region, so identity degrades to Rule|File.
  A second same-rule secret in an already-baselined file is then grandfathered
  on a nil-scope or --all run (CompareBaseline, pkg/gate/baseline.go:115),
  and fixing one of two baselined secrets never shows in FixedViolations.
  Fail-open in a secrets dimension: blocker.
  Authoring base: branch fix/engine-evidence-integrity at 269c5e6.

  Ordering with ISSUE-208: the ISSUE-208 fix is already committed on this
  branch (24f5dcf) and is not on any release tag or other branch, so the
  collapse is reachable on this branch today but has not shipped. This plan
  must land on the same branch before the branch ships; that satisfies the
  issue's "with or before ISSUE-208" ordering (issue item 6).

  Existence-in-world: grep of plans/, specs/ and issues/ (committed and
  working tree) for ISSUE-210, partialFingerprints and sarifFingerprint found
  no owning artifact. PLAN-ISSUE-046 covers File-path canonicalization and
  scope stability of the fingerprint (and explicitly forbids a
  fingerprint-scheme rewrite inside its own scope); PLAN-ISSUE-104 covers
  severity descriptors; PLAN-ISSUE-208 surfaced this defect and recorded it
  as out of its scope. None delivers the degenerate-case fix, so this plan
  owns it.

  FOUNDER DECISION (decided 2026-10-13), resolving the issue's open item 3:
  FAIL-CLOSED, option (a), scoped narrowly to the degenerate case.
    - Non-degenerate partialFingerprints (at least one value non-empty after
      strings.TrimSpace): the fingerprint stays BYTE-IDENTICAL to today's
      sorted `k=v` joined by ";" form, with untrimmed values and NO per-key
      filtering of empty entries. Existing baselines for any producer that
      emits real or mixed values are not re-keyed.
    - Degenerate partialFingerprints (map has at least one key and every
      trimmed value is empty): the fingerprint is a hash, never raw text.
        * Informative snippet (the already-trimmed region snippet is
          non-empty and not exactly the gitleaks redaction marker
          "REDACTED"): "sha256:" + lowercase hex of
          sha256("snippet:" + snippet). Line-independent, so a moved
          unredacted secret keeps its identity.
        * Empty or redacted snippet: "sha256:" + lowercase hex of
          sha256("position:" + decimal startLine + ":" + decimal startColumn),
          where an absent line or column decodes as 0. The "snippet:" and
          "position:" domain prefixes keep the two inputs from colliding.
      Accepted consequence: a redacted secret that moves to another line or
      column reads as NEW (noisy, never silent). This is the deliberate
      trade against the alternative (b), a documented residual collapse,
      which was rejected.
    - No raw snippet or match text may reach Fingerprint, RegionHash,
      Identity, IdentityHash input, .backstop/baseline.json or the gate JSON
      through this new path.
    - The existing no-partialFingerprints fallback (raw trimmed snippet, else
      "") for other producers is UNCHANGED and out of scope.
    - SARIF region column: the sarifLog region struct (parsers.go:84-89)
      decodes startLine and snippet.text only; it does NOT decode
      startColumn. Adding `StartColumn int json:"startColumn"` to that struct
      is in scope (parsers.go only; check.Violation does not gain a field).

  Acceptance claims defined here because ISSUE-210 has no formal CLM array:
    CLM-001: a result whose partialFingerprints has at least one non-empty
      trimmed value yields a fingerprint byte-identical to today's form:
      keys sorted, "k=v" joined by ";", values verbatim (empty entries
      kept, nothing trimmed or filtered). Pinned by a mixed-value
      gitleaks-shaped fixture with an exact string literal.
    CLM-002: a result whose partialFingerprints is degenerate (one or more
      keys, every value empty after TrimSpace, including whitespace-only
      values) and whose trimmed snippet is informative yields
      "sha256:" + hex(sha256("snippet:" + snippet)). Two such results with
      differing snippets in the same file under the same rule have distinct
      fingerprints and distinct IdentityHash; the same snippet on a
      different line keeps the same fingerprint.
    CLM-003: a degenerate result whose trimmed snippet is empty or exactly
      "REDACTED" yields "sha256:" + hex(sha256("position:<line>:<column>"))
      from region.startLine and region.startColumn (now decoded). Two
      redacted results in the same file under the same rule at different
      positions (different line, or same line and different column) have
      distinct fingerprints and IdentityHash; a redacted result moved to a
      new line gets a new fingerprint (the accepted noisy consequence).
    CLM-004: on the degenerate path no raw snippet text appears in
      Violation.Fingerprint, gate.Violation.RegionHash, Identity, the bytes
      WriteBaseline writes, or the bytes gate.FormatJSON produces.
    CLM-005: through the real findings dispatch, a baseline holding one
      degenerate-fingerprint secret in a file does not grandfather a second
      same-rule secret in that file: CompareBaseline with a nil scope
      reports it in NewViolations, and dropping one of two baselined
      secrets reports it in FixedViolations.
    CLM-006: unchanged contracts: the no-partialFingerprints fallback (raw
      trimmed snippet, else "") is unchanged; check.Violation,
      gate.Violation and EnrichViolationIdentity are unchanged;
      TestParsePackFindings_FingerprintFromSarif and
      TestSarifFingerprint_StableAcrossScopeInvocations stay green
      UNMODIFIED.
    CLM-007: PLAN-ISSUE-208's mandated test
      TestParseSarif_PropertyBagArrayTagsSurfacesViolation is amended so it
      no longer pins the collapsed fingerprint (see "Amendment" below) and
      stays green with every other assertion it makes unchanged.

  Amendment to PLAN-ISSUE-208 (recorded per issue item 5): PLAN-ISSUE-208
  TASK-001 mandated that TestParseSarif_PropertyBagArrayTagsSurfacesViolation
  (pkg/check/parsers_property_bag_test.go, committed in 24f5dcf) assert
  Fingerprint == "author=;commitMessage=;commitSha=;date=;email=" for both
  gitleaks-shaped results (const wantFingerprint, checked in the per-violation
  loop). That value is exactly the collapse this plan removes. This plan
  replaces only that assertion: each of the two results (both snippet
  "REDACTED", positions 3:8 and 12:5) must have a fingerprint equal to the
  CLM-003 position hash of its own start line and column, computed in the
  test with crypto/sha256; the two fingerprints must differ from each other;
  neither may equal the old collapsed string nor contain "REDACTED". The test
  name, both table rows, the fixture builder gitleaksShapedLog, and every
  other assertion (File, Line, Rule, Message, Severity, Pass, nil
  Properties) stay as they are; the file's import block may gain what the
  hash oracle needs. PLAN-ISSUE-208 carries a short back-reference note
  pointing here; this note is the amendment record.

  Consumer impact (verified at 269c5e6):
    - cmd/backstop/pack_gate.go:1125 is the only reader of
      check.Violation.Fingerprint in pkg/ and cmd/ (it copies it into
      RegionHash). No edit.
    - pkg/gate/baseline.go EnrichViolationIdentity/WriteBaseline/
      CompareBaseline consume RegionHash opaquely. No edit.
    - pkg/check/code_check_engine_removal_test.go TestSARIFSurface_Preserved
      greps production source for the substring "sarifFingerprint"; the
      function keeps that name.
    - Baselines: this repo's .backstop/baseline.json holds no collapsed
      "author=;commitMessage=..." region_hash (grep count 0), so no entry is
      re-keyed here. Since ISSUE-208 has not shipped, no released binary
      could have written a collapsed gitleaks entry into a consumer
      baseline. Producers that emit non-empty partialFingerprints (CLM-001)
      and producers that emit none (CLM-006) keep their identities.

  Out of scope, recorded as observations (not fixed here):
    - The no-partialFingerprints fallback writes the RAW trimmed snippet into
      RegionHash and Identity, and from there into baseline.json and gate
      JSON. This repo's own .backstop/baseline.json has 136 region_hash
      values that are raw code snippets (e.g. values beginning
      `cmd := exec.Command(`). For code-pattern producers that is code, but
      a secret-bearing producer that emits snippets without
      partialFingerprints would persist plaintext secrets the same way.
      Candidate separate issue for the founder (the existing
      no-partialFingerprints raw-snippet fallback, not this plan's path).
    - The CLM-002 fingerprint is an UNSALTED sha256 of an unredacted
      secret, and it lands in baseline.json (tracked) and CI gate JSON. A
      low-entropy secret (short password, guessable token) could be
      recovered by dictionary or brute-force hashing. Accepted under the
      2026-10-13 decision (hash, never raw); a keyed or salted scheme would
      need a stable per-repo key and is a candidate follow-up for the
      founder.
    - Identical informative snippets (the same secret value pasted twice in
      one file under one rule) share an identity under CLM-002, so fixing
      one of the two copies does not show as fixed. Accepted under the
      decision (same content); recorded so it is not mistaken for the
      collapse being reintroduced.
    - A degenerate result with no location region (line 0, column 0) and an
      empty snippet hashes a constant "position:0:0" per Rule|File. gitleaks
      always emits a region, so this is a theoretical residual only.
    - gitleaks partial redaction (--redact below 100) emits a non-marker
      snippet that still contains part of the secret; under CLM-002 it is
      hashed, never stored raw.

  Exact implementation edit allowlist:
    pkg/check/parsers.go
    pkg/check/parsers_degenerate_fingerprint_test.go (new)
    pkg/check/parsers_property_bag_test.go (amend only the fingerprint
