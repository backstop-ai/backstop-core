phases:
  - id: phase-1
    name: "Phase 1: Fail-closed degenerate SARIF fingerprint (red, green, scoped and full gate)"
    tasks:
      - id: TASK-001
        type: test
        title: "Pin degenerate-fingerprint hashing at the parser and amend the ISSUE-208 fingerprint assertion"
        description: |
          Create pkg/check/parsers_degenerate_fingerprint_test.go (package
          check). Build inline gitleaks-shaped SARIF literals (same structure
          as gitleaksShapedLog: results with no `level`, ruleId
          "generic-api-key", the five dir-mode partialFingerprints keys) via
          a local builder that takes, per result, uri, startLine,
          startColumn, snippet text and the partialFingerprints object. Call
          parseSarif(..., CheckTypeFindings) or ParsePackFindings only. Any
          expected hash is computed in the test with crypto/sha256 and
          encoding/hex over the exact input documented in notes, as an
          independent oracle of the encoding.

          Import constraint: this file is package check and MUST NOT import
          pkg/gate (pkg/gate imports pkg/check via pkg/gate/scope.go, so the
          import would be a cycle and break setup for the whole package).
          Identity-level assertions (IdentityHash, Identity, RegionHash)
          live only in TASK-002's cmd/backstop tests.

          Helper names must be unique within package check: do not reuse
          gitleaksShapedLog, singleResultLog or any other identifier already
          declared in pkg/check test files; use a distinct prefix such as
          degenerateFP (e.g. degenerateFPLog, degenerateFPResult).

          TestParseSarif_DegenerateFingerprintDistinctSnippetsHashed
          (CLM-002, CLM-004): two results, same file "src/config.go", same
          rule, all-empty partialFingerprints, snippets
          "synthetic-snippet-alpha" (line 3) and "synthetic-snippet-bravo"
          (line 9). Require each Fingerprint == "sha256:" +
          hex(sha256("snippet:" + its snippet)) (hence "sha256:"-prefixed);
          the two differ; neither contains either snippet's text nor equals
          the old collapsed string. A third row reparses
          "synthetic-snippet-alpha" at line 40 and requires the same
          fingerprint as at line 3 (line-independent). Distinct
          IdentityHash for this case is pinned through the real dispatch by
          TestSarifDegenerateIdentity_DistinctIdentityThroughDispatch
          (TASK-002).

          TestParseSarif_DegenerateFingerprintRedactedUsesPosition (CLM-003):
          table of rows, all degenerate, same file and rule:
            redacted, 3:8 vs 9:8 -> distinct;
            redacted, 3:8 vs 3:20 -> distinct (column matters);
            empty snippet "" (and whitespace-only "   "), 3:8 vs 9:8 ->
              distinct, position-hashed;
            redacted 3:8 moved to 4:8 -> different fingerprint (the accepted
              noisy consequence; assert it explicitly, with a comment citing
              the 2026-10-13 decision).
          Each fingerprint must equal "sha256:" +
          hex(sha256("position:<line>:<column>")) and must not contain
          "REDACTED". A row with startColumn absent requires the hash of
          "position:<line>:0".

          TestParseSarif_DegenerateFingerprintWhitespaceOnlyValuesDegenerate
          (CLM-002): partialFingerprints whose values are all whitespace
          (" ", "\t") plus a single-key map {"commitSha": ""}; both take the
          degenerate path (snippet hash), proving the TrimSpace rule and the
          one-key case.

          TestParseSarif_DegenerateFingerprintMixedValuesByteIdentical
          (CLM-001, control): partialFingerprints {"commitSha":"abc123",
          "email":"","author":" spaced ","date":"","commitMessage":""} with
          snippet "synthetic-snippet-alpha". Require Fingerprint ==
          "author= spaced ;commitMessage=;commitSha=abc123;date=;email="
          exactly (untrimmed value, empty entries kept, no hash prefix).

          Amend pkg/check/parsers_property_bag_test.go
          TestParseSarif_PropertyBagArrayTagsSurfacesViolation exactly as
          recorded under "Amendment to PLAN-ISSUE-208" in notes (CLM-007):
          replace the wantFingerprint constant and its per-violation check
          with the per-result position-hash expectation (3:8 and 12:5),
          a distinctness check, and absence of "REDACTED" and of the old
          collapsed string. The only other permitted change in that file is
          its import block (adding what the hash oracle needs, e.g.
          crypto/sha256, encoding/hex, fmt or strconv); touch nothing else.

          Do NOT edit parse_pack_findings_test.go
          (TestParsePackFindings_FingerprintFromSarif is the unmodified
          CLM-006 control). Run the first red command from notes and record
          the named behavioral failures and the green control.
        files:
          - pkg/check/parsers_degenerate_fingerprint_test.go
          - pkg/check/parsers_property_bag_test.go
        claims: [CLM-001, CLM-002, CLM-003, CLM-004, CLM-006, CLM-007]
        depends_on: []
        test_names:
          - TestParseSarif_DegenerateFingerprintDistinctSnippetsHashed
          - TestParseSarif_DegenerateFingerprintRedactedUsesPosition
          - TestParseSarif_DegenerateFingerprintWhitespaceOnlyValuesDegenerate
          - TestParseSarif_DegenerateFingerprintMixedValuesByteIdentical
          - TestParseSarif_PropertyBagArrayTagsSurfacesViolation

      - id: TASK-002
        type: test
        title: "Pin identity, persistence and baseline comparison through the real findings dispatch"
        description: |
          Create cmd/backstop/sarif_degenerate_identity_e2e_test.go (package
          main), following the dispatch-e2e pattern of
          baseline_identity_dispatch_e2e_test.go: a small runner type in this
          new file whose Run/RunStdout return a configurable gitleaks-shaped
          SARIF log (results as in TASK-001: rule "generic-api-key", all-empty
          dir-mode partialFingerprints, synthetic snippets), driven through
          dispatchPackEngines with semgrepDispatchManifest() and
          engineDispatchPacksDir(t) (reused from the existing test files, not
          redefined or edited). This exercises the real parse and the real
          pack_gate.go bridge (RegionHash = Fingerprint). Use t.TempDir() for
          projectRoot and a nil scope. Helper and type names must be unique
          within package main: do not reuse scopePathShapingRunner,
          fixtureRunner, capturingRunner or any other identifier already
          declared in cmd/backstop; use a distinct prefix such as
          degenerateIdentity (e.g. degenerateIdentityRunner).

          TestSarifDegenerateIdentity_DistinctIdentityThroughDispatch
          (CLM-002, CLM-003): two rows, each emitting two same-rule results
          in one file: (a) snippets "synthetic-snippet-alpha" and
          "synthetic-snippet-bravo"; (b) both "REDACTED" at 3:8 and 9:8.
          Require two violations, distinct RegionHash, and distinct
          gate.EnrichViolationIdentity IdentityHash.

          TestSarifDegenerateIdentity_NoRawSnippetPersisted (CLM-004):
          dispatch row (a), WriteBaseline the two violations to a temp path,
          read the bytes back; build a gate.GateResult via
          gate.NewGateResult with one StepResult carrying the enriched
          violations in Violations and NewViolations, and gate.FormatJSON it.
          Require that neither byte stream contains "synthetic-snippet-alpha"
          or "synthetic-snippet-bravo" (control, green before and after), and
          that every region_hash value in the decoded baseline starts with
          "sha256:" (red before the fix).

          TestSarifDegenerateIdentity_SecondSecretReportedOnNilScope
          (CLM-005): dispatch a log holding only secret A
          ("synthetic-snippet-alpha", src/config.go:3) and build a baseline
          artifact from it (EnrichViolationIdentity, as
          TestBaselineCycle_GenerateThenGate_TouchedFileRevoked does). Then
          dispatch a log holding A and a new same-rule secret B
          ("synthetic-snippet-bravo", same file, line 9) and run
          gate.CompareBaseline with BaselineCompareOptions{Scope: nil}.
          Require exactly one NewViolation and that it is B (by RegionHash
          equal to B's snippet hash), and zero FixedViolations. Second row,
          same shape with both snippets "REDACTED" at 3:8 and 9:8: B is new.
          Third row (ratchet visibility): baseline holds A and B, current
          holds only A; require exactly one FixedViolation (B) and zero new.

          Run the second red command from notes; record behavioral failures
          (DistinctIdentityThroughDispatch and SecondSecretReportedOnNilScope
          red on the collapsed fingerprint) and the green control
          assertions. Do not touch production code.
        files:
          - cmd/backstop/sarif_degenerate_identity_e2e_test.go
        claims: [CLM-002, CLM-003, CLM-004, CLM-005]
        depends_on: []
        test_names:
          - TestSarifDegenerateIdentity_DistinctIdentityThroughDispatch
          - TestSarifDegenerateIdentity_NoRawSnippetPersisted
          - TestSarifDegenerateIdentity_SecondSecretReportedOnNilScope

      - id: TASK-003
        type: implementation
        title: "Hash the degenerate partialFingerprints case from snippet or position"
        description: |
          In pkg/check/parsers.go only:
            1. Add `StartColumn int json:"startColumn"` to the sarifLog region
               struct next to StartLine.
            2. In parseSarif, capture the column alongside line and snippet
               from locations[0] and pass line and column to
               sarifFingerprint (signature becomes
               sarifFingerprint(partial map[string]string, snippet string,
               line, column int) string; keep the name).
            3. In sarifFingerprint, when len(partial) > 0, decide degeneracy
               by checking whether every value is empty after
               strings.TrimSpace. Non-degenerate: return today's ordered
               k=v;... string byte-for-byte (do not filter, trim or reorder
               differently). Degenerate: if snippet != "" and snippet !=
               "REDACTED", return "sha256:" + hex(sha256("snippet:" +
               snippet)); otherwise return "sha256:" +
               hex(sha256("position:" + strconv.Itoa(line) + ":" +
               strconv.Itoa(column))). Name the marker and both prefixes as
               unexported constants. One small unexported hash helper is
               fine; add crypto/sha256, encoding/hex and strconv imports.
            4. The len(partial) == 0 branch (raw snippet, else "") is
               unchanged (CLM-006).
          Update the sarifFingerprint doc comment and the PartialFingerprints
          field comment to state the degenerate rule, the hashing, the
          redaction-marker position fallback and its accepted line-drift
          consequence, and that no raw snippet enters the fingerprint on that
          path; reference ISSUE-210 and the 2026-10-13 fail-closed decision.
          Do not touch check.Violation, pkg/gate or pack_gate.go.

          Run the green commands from notes. If any other file needs
          editing, stop and return the scope change for review.
        files:
          - pkg/check/parsers.go
        claims: [CLM-001, CLM-002, CLM-003, CLM-004, CLM-005, CLM-006]
        depends_on: [TASK-001, TASK-002]

      - id: TASK-004
        type: verification
        title: "Verify red-to-green and run the diff-scoped gate"
        description: |
          Confirm recorded behavioral red, then green for every new and
          amended test and the controls, plus the unmodified regressions in
          the third command from notes (TestParsePackFindings_FingerprintFromSarif,
          TestSarifFingerprint_StableAcrossScopeInvocations, the ISSUE-046
          real-dispatch identity tests, TestSARIFSurface_Preserved, all
          TestParseSarif_ tests), and the race run of pkg/check, pkg/gate and
          cmd/backstop. Run backstop gate --file pkg/check/parsers.go and
          then backstop gate, recording true exit codes and findings. Confirm
          the diff touches only the four allowlisted files, that
          parse_pack_findings_test.go and
          baseline_identity_dispatch_e2e_test.go are byte-unchanged, and that
          the parsers_property_bag_test.go diff is confined to the
          fingerprint assertion and its import block. Confirm
          pkg/check/parsers_degenerate_fingerprint_test.go does not import
          pkg/gate and that `go test ./pkg/check` builds (no import cycle).
        files:
          - pkg/check/parsers.go
          - pkg/check/parsers_degenerate_fingerprint_test.go
          - pkg/check/parsers_property_bag_test.go
          - cmd/backstop/sarif_degenerate_identity_e2e_test.go
        claims: [CLM-001, CLM-002, CLM-003, CLM-004, CLM-005, CLM-006, CLM-007]
        depends_on: [TASK-003]

      - id: TASK-005
        type: verification
        title: "Run the full gate and validate the plan artifact"
        description: |
          Final verification, after TASK-004's diff-scoped gate is green: run
          backstop gate --all and backstop artifact validate --plan
          PLAN-ISSUE-210. TASK-004 is the scoped inner loop; this adds the
          unscoped sweep (artifact validation, findings engines, test
          verification, substantiveness, coverage, contracts). Confirm the
          committed .backstop/baseline.json is unchanged and that --all
          reports no new or fixed baseline entries attributable to this
          change. Record exit codes, findings, base SHA and the final
          four-file diff. Confirm every new test body executed (not mere name
          presence). Hand logs and diff to an independent reviewer and repeat
          review until CLEAN. Failures are surfaced as blockers, never
          waived. Leave plan and issue statuses unchanged.
        files:
          - pkg/check/parsers.go
          - pkg/check/parsers_degenerate_fingerprint_test.go
          - pkg/check/parsers_property_bag_test.go
          - cmd/backstop/sarif_degenerate_identity_e2e_test.go
          - plans/PLAN-ISSUE-210-sarif-empty-fingerprint-identity.plan.yml
        claims: [CLM-001, CLM-002, CLM-003, CLM-004, CLM-005, CLM-006, CLM-007]
        depends_on: [TASK-003, TASK-004]
