  Test fixture rules: all snippet strings are synthetic and obviously
  non-secret (e.g. "synthetic-snippet-alpha", "synthetic-snippet-bravo");
  never embed a real or realistic-looking key. Every raw-text absence check
  asserts against these exact synthetic strings.

  Red/green commands (repo root):
    go test ./pkg/check -count=1 -run '^TestParseSarif_DegenerateFingerprint|^TestParseSarif_PropertyBagArrayTagsSurfacesViolation$' -v
    go test ./cmd/backstop -count=1 -run '^TestSarifDegenerateIdentity_' -v
    go test ./pkg/check ./cmd/backstop -count=1 -run 'TestParsePackFindings_FingerprintFromSarif|TestSarifFingerprint_StableAcrossScopeInvocations|TestBaselineIdentity_RealDispatch_|TestBaselineCycle_|TestSARIFSurface_Preserved|TestParseSarif_' -v
    go test ./pkg/check ./pkg/gate ./cmd/backstop -race -count=1
  The first two commands must actually execute every new test (no "no tests
  to run"). Red evidence: before TASK-003 every failure must be behavioral,
  never a compile error; tests reach the fingerprint only through parseSarif,
  ParsePackFindings or the real dispatch, never by calling sarifFingerprint
  directly (its signature changes). Expected red:
    DistinctSnippetsHashed, RedactedUsesPosition,
    WhitespaceOnlyValuesDegenerate, the amended
    PropertyBagArrayTagsSurfacesViolation, and
    TestSarifDegenerateIdentity_SecondSecretReportedOnNilScope and
    TestSarifDegenerateIdentity_DistinctIdentityThroughDispatch all fail on
    the collapsed constant fingerprint (equal fingerprints / equal
    IdentityHash / second secret not in NewViolations / no "sha256:"
    prefix).
  Controls that pass before and after the fix (they guard against a naive
  fix): MixedValuesByteIdentical (CLM-001) and the raw-text absence
  assertions of TestSarifDegenerateIdentity_NoRawSnippetPersisted (CLM-004;
  today's collapsed value contains no snippet, but a plain snippet fallback
  would fail it). That test's "region_hash starts with sha256:" assertion is
  red today. Record both outcomes.

  Runtime verification:
    backstop gate --file pkg/check/parsers.go
    backstop gate
    backstop gate --all
    backstop artifact validate --plan PLAN-ISSUE-210
  Record real exit codes. Gate or environment failures are blockers to
