  ── THE VALIDATOR CONTRACT, STATED ONCE ────────────────────────────────────
  Two callers, two argument shapes, and the script must be correct under both:
    · `pack test` (pkg/packval/phase3.go -> DefaultExecutor.RunValidator ->
      SandboxedRun): argv is ONE FIXTURE FILE path, relative to packDir, with
      cwd=packDir. Non-zero exit == "this fixture violates".
    · `backstop gate` (cmd/backstop/pack_gate.go -> runSandboxEngine): argv is
      ONE PROJECT ROOT DIRECTORY. Non-zero exit == a blocking gate violation.
  Therefore: flag on marker-bearing REGULAR FILES, and exit 0 on everything else.

phases:
  - id: phase-1
    name: "Phase 1: Tests that pin a discriminating validator/fixture pair (red)"
    tasks:
      - id: TASK-001
        type: test
        title: "Unit-pin the scaffolded validator/fixture pair: it fires on the negative, is silent on the positive, ignores directories, and no longer claims it always passes"
        description: |
          Add four tests to `pkg/pack/scaffold_test.go` (package `pack`, existing
          file, currently clean in the working tree). They must be RED before
          TASK-003 and GREEN after it.

          These run the scaffolded validator DIRECTLY (`exec.Command("sh",
          <validatorPath>, <target>)`) rather than through packval. That is
          deliberate and is not a weaker proof — it is a DIFFERENT proof at a
          different altitude, and it is the only one available here: `pkg/packval`
          imports `pkg/pack`, so a test in package `pack` cannot import packval
          without a cycle. The real-pipeline, real-sandbox proof lives in TASK-002
          and in the already-shipped `TestPackNew_ScaffoldPassesCheckAndTest`.

          Drive every test off a real `ScaffoldPack` call into `t.TempDir()` —
          never off a hand-copied literal. A test that restates the expected
          script bytes instead of executing the ones the scaffolder actually
          wrote would pass while the shipped scaffolder was broken.

          `TestScaffoldPack_SampleValidatorFiresOnNegativeFixture` (CLM-001,
            CLM-002) — scaffold, then run the written validator against the
            written NEGATIVE fixture path. Assert a NON-ZERO exit. Assert the
            combined output is non-empty and names the target path — a silent
            non-zero exit gives a pack author nothing to act on, and
            `runSandboxEngine` uses that output verbatim as the violation
            message (falling back to the bare error string when it is empty).

          `TestScaffoldPack_SampleValidatorIsSilentOnPositiveFixture` (CLM-001,
            CLM-002) — same setup, POSITIVE fixture, assert exit ZERO.
            THESE TWO ARE A PAIR AND NEITHER IS SUFFICIENT ALONE. A validator
            that exits non-zero unconditionally passes the first and fails the
            second; the old `exit 0` validator passes the second and fails the
            first. Only both together assert discrimination.

          `TestScaffoldPack_SampleValidatorIgnoresNonFileTargets` (CLM-004) — run
            the validator with the scaffolded PACK DIRECTORY as its single
            argument and assert exit ZERO. This is the gate-time shape: see
            premise 5 in the notes. Say so in the test's comment, and name
            `runSandboxEngine` in it, so a future reader cannot mistake this for
            an incidental edge case and delete it. Assert the same for a path
            that does not exist at all.

            ⚠ THE DIRECTORY ARGUMENT MUST BE THE SCAFFOLDED PACK DIRECTORY, NOT A
            BARE `t.TempDir()`. This is what makes the test a REAL NEGATIVE
            rather than a shape check: after TASK-003 the scaffolded pack dir
            CONTAINS a marker-bearing file (`fixtures/invalid/example.txt`), so
            passing it proves the validator refuses to recurse into a directory
            even when the marker is demonstrably reachable underneath it. Handed
            an empty temp dir instead, the assertion is satisfied trivially by a
            validator with no `[ -f ]` guard at all — it would find nothing
            regardless — and CLM-004 would be pinned by nothing. An implementer
            "simplifying" this to `t.TempDir()` silently guts the test; DO NOT.
            State this in the test's own comment so the next reader knows the
            marker-bearing content is the point.

          `TestScaffoldPack_ScaffoldedBytesDoNotClaimAlwaysPasses` (CLM-005) — a
            DRIFT GUARD over the scaffolder's own prose. Scaffold one pack of each
            of the three types and assert that NEITHER the written
            `validators/<slug>.sh` NOR the written `pack.yml` NOR the value
            returned by `packTypeBlurb` claims the sample always passes.

            ★ NORMALISE THE TEXT BEFORE MATCHING — A RAW SUBSTRING SCAN IS
            VACUOUS ON THE pack.yml ARM. Measured at HEAD c586af3 (notes, premise
            7): the scaffolded pack.yml does NOT literally contain `always pass`,
            because the `manifest` format string wraps the phrase across a line
            break with a `#` comment-continuation prefix — the emitted bytes are
            `...currently always\n      # passes — replace it...`. So a raw
            `strings.Contains(strings.ToLower(b), "always pass")` reports GREEN on
            the one arm an author actually reads. Instead, normalise each
            artefact first: lower-case it, then collapse every run of
            newline + whitespace + optional `#` + whitespace into a SINGLE SPACE
            (a small regexp such as `(?s)\s*\n\s*#?\s*` → `" "`, applied before
            the containment check, is sufficient and is what was measured to
            catch the wrapped phrase). Then assert `always pass` is absent — the
            substring, case-insensitively, so it also catches "always passes",
            "always-pass" and "always passing". Forbid the SUBSTRING, never an
            exact sentence: an exact-sentence assertion is evaded by any rewording
            that keeps the claim.

            ⚠ KNOW WHICH ARMS ARE RED-FIRST AND DO NOT FAKE THE REST. Under the
            NORMALISED scan at HEAD, the validator arm is RED and the pack.yml arm
            is RED — those two are this test's genuine red-first assertions and
            TASK-003 must turn both. The `packTypeBlurb` arm is ALREADY GREEN
            (today's blurbs say "Replace the sample sandbox validator with your
            own", which asserts nothing about always passing). Its assertion is a
            REGRESSION FENCE, and that is a legitimate reason for it to start
            green — do not reword the blurbs merely to manufacture a red, and do
            not delete the arm because it does not fail today.
        files:
          - pkg/pack/scaffold_test.go
        claims:
          - CLM-001
          - CLM-002
          - CLM-004
          - CLM-005
        test_names:
          - TestScaffoldPack_SampleValidatorFiresOnNegativeFixture
          - TestScaffoldPack_SampleValidatorIsSilentOnPositiveFixture
          - TestScaffoldPack_SampleValidatorIgnoresNonFileTargets
          - TestScaffoldPack_ScaffoldedBytesDoNotClaimAlwaysPasses
        depends_on: []

      - id: TASK-002
        type: test
        title: "Falsify the scaffolded pack's pack test green in both directions through the real packval pipeline"
        description: |
          Create `cmd/backstop/pack_new_falsification_test.go` (NEW file — package
          `main`, alongside the existing `pack_new_test.go`, which this lane does
          NOT edit). Two tests, both driving the REAL `packval.NewPipeline(packDir,
          packval.PipelineOptions{Mode: "test"}).Run()` with the real default
          executor and the real sandbox, exactly as `pack_new_test.go` already
          does.

          ★ THESE ARE THE TESTS THAT MAKE THE GREEN MEAN SOMETHING.
          `TestPackNew_ScaffoldPassesCheckAndTest` already asserts the scaffolded
          pack PASSES. On its own that assertion is satisfiable by a pack that
          cannot fail — which is precisely the defect being fixed here. These two
          tests assert the pass is EARNED by mutating each fixture in turn and
          requiring phase 3 to go RED. Both mutations were run against a real
          scaffolded pack on 2026-08-17 and both produced the expected failure;
          the exact observed messages are recorded in premise 3 of the notes.

          `TestPackNew_ScaffoldedPackTestFailsWhenNegativeFixtureLosesTheMarker`
            (CLM-003) — scaffold a pack, confirm `Mode: "test"` is `pass`, then
            REWRITE the negative fixture so it no longer carries the marker, re-run
            the pipeline, and assert the result is `fail` AND that some error
            carries `Check == "validator-negative"`. Asserting only `!= "pass"` is
            not enough: `Pipeline.Run` stops at the first failing phase, so an
            unrelated phase-1/phase-2 defect would also produce a non-pass while
            phase 3 never ran. Pin the CHECK, not just the status.

          `TestPackNew_ScaffoldedPackTestFailsWhenPositiveFixtureGainsTheMarker`
            (CLM-003) — the mirror. Scaffold, confirm pass, then APPEND the marker
            to the positive fixture, re-run, assert `fail` with an error carrying
            `Check == "validator-positive"`. This is the direction that catches a
            validator which fires on everything.

          Do not hardcode the marker literal in these tests. READ it out of the
          scaffolded negative fixture, or export nothing and derive the mutation
          by removing/copying the negative fixture's content. A hardcoded copy is
          a second source of truth that silently rots when the scaffolder changes.

          ⚠ ABSOLUTE PACKDIR, ALWAYS. Build packDir from `t.TempDir()` and pass it
          whole. A relative packDir triggers ISSUE-147 on darwin — sandbox-exec
          refuses the profile, EVERY validator run reports not-passed, and both
          tests would then "pass" for entirely the wrong reason while asserting
          nothing about fixture content. This is not hypothetical: it is exactly
          why `TestPackAuthoringLoop_EndToEnd` is red today (notes, premise 4).

          ⛔ DO NOT ADD A `runtime.GOOS` SKIP GATE TO EITHER OF THESE TESTS.
          Both must run unconditionally on darwin AND on Linux. The nearby
          `TestPackAuthoringLoop_EndToEnd` skips on `runtime.GOOS != "darwin"`
          and it would be the natural thing to copy — copying it here would be a
          defect. BOTH platforms have a real sandbox implementation
          (`pkg/packval/sandbox_linux.go`, Landlock + seccomp, for linux;
          `pkg/packval/sandbox_nonlinux.go`, sandbox-exec, for everything else),
          and the sibling `TestPackNew_ScaffoldPassesCheckAndTest` already runs
          on both with no GOOS guard at all. These two falsification tests are
          this lane's ONLY proof that the green is earned; a GOOS gate would make
          that proof silently dark on Linux CI — exactly the vacuous green
          DIR-032 exists to kill. If the sandbox genuinely cannot run, let the
          real error surface; do not pre-empt it with a platform check, and never
          let a skipped run read as a pass.
        files:
          - cmd/backstop/pack_new_falsification_test.go
        claims:
          - CLM-003
        test_names:
          - TestPackNew_ScaffoldedPackTestFailsWhenNegativeFixtureLosesTheMarker
          - TestPackNew_ScaffoldedPackTestFailsWhenPositiveFixtureGainsTheMarker
        depends_on: []

  - id: phase-2
    name: "Phase 2: A sample validator and fixture pair that genuinely discriminate"
    tasks:
      - id: TASK-003
        type: implementation
        title: "Replace the always-pass validator and its inert fixture pair with a marker-discriminating triple, and correct the prose that advertised the defect"
        description: |
          Edit `pkg/pack/scaffold.go` only. Locate every site BY IDENTIFIER, not by
          the line numbers ISSUE-146 quotes (notes: CITE BY NAME).

          (1) THE `validator` LITERAL inside `scaffoldEnginePack`. Replace the
              `exit 0` script with a marker scanner built from POSIX SHELL
              BUILTINS ONLY — no `grep`, no `sed`, no external process. Shape,
              measured working end-to-end under the real darwin sandbox on
              2026-08-17:

                #!/bin/sh
                # Sample sandbox validator: flags any file containing the marker
                # below. Replace the marker check with your real detection logic —
                # exit non-zero and print a message to flag a violation.
                marker='BACKSTOP-SAMPLE-VIOLATION'
                status=0
                for target in "$@"; do
                  [ -f "$target" ] || continue
                  while IFS= read -r line || [ -n "$line" ]; do
                    case "$line" in
                      *"$marker"*)
                        echo "$target: sample rule fired (found $marker)"
                        status=1
                        break
                        ;;
                    esac
                  done < "$target"
                done
                exit $status

              Three properties are load-bearing and none is stylistic:
                · BUILTINS ONLY. The darwin profile (`darwinSandboxProfile`)
                  grants file-read on packDir plus a short system allowlist that
                  does NOT include `/usr/bin`; the Linux arm is an entirely
                  separate Landlock/seccomp mechanism and was not measured. A
                  script that spawns nothing is correct under both by
                  construction. An external `grep` was also measured passing on
                  darwin — do not take that as license to use it.
                · `[ -f "$target" ] || continue`. At gate time the single argument
                  is the PROJECT ROOT DIRECTORY (notes, premise 5). Without this
                  guard the sample rule reds every consumer's gate immediately.
                · IT PRINTS THE TARGET. `runSandboxEngine` uses the validator's
                  combined output verbatim as the violation message.

              The `|| [ -n "$line" ]` on the `read` is deliberate, not noise: a
              bare `while IFS= read -r line` DROPS a final line with no trailing
              newline, so a marker on an unterminated last line would go
              undetected. Probed directly on 2026-08-17 — without the guard the
              marker is missed, with it the marker is found. No claim in this plan
              depends on it, but this script becomes the example every pack author
              copies, so it ships correct.

              Keep the comment instructive: it should now tell an author what to
              replace, not confess that nothing is enforced.

          (2) THE `negativeFixture` LITERAL — must CARRY the marker. Keep it a
              plausible sample file and make the comment say why it is expected to
              trip the rule, e.g.:
                // Negative fixture: the sample rule SHOULD fire here — this line
                // carries the marker BACKSTOP-SAMPLE-VIOLATION.
                package sample

          (3) THE `positiveFixture` LITERAL — must NOT carry the marker anywhere,
              including in its comment. Word its comment so it cannot drift into
              naming the marker. e.g.:
                // Positive fixture: clean. The sample rule must NOT fire here.
                package sample

          (4) THE PROSE THAT IS NOW FALSE. Three sites, all in this file:
                · the `manifest` format string's inline rule comment, which
                  currently reads "Its validator (validators/%s.sh) currently
                  always passes — replace it...". Rewrite it to describe what the
                  sample actually enforces and how to swap in real logic.
                · `scaffoldEnginePack`'s doc comment, which says the sandbox shape
                  makes the pack gate-green because "runSandboxEngine runs the
                  always-pass validator".
                  ⚠ DO NOT REPLACE THAT WITH "gate-green because the validator
                  finds no marker in a real project" — THAT WOULD ALSO BE FALSE,
                  and it is the more dangerous kind of false because it sounds
                  like enforcement. Measured (notes, R-2): the scaffolded rule
                  declares no `input_scope`, so `runSandboxEngine` passes the
                  validator exactly ONE argument — the project ROOT DIRECTORY —
                  and the `[ -f "$target" ] || continue` guard skips it outright.
                  The validator does not scan a project file at gate time; it
                  scans NOTHING. Write the comment to say that plainly: the pack
                  is gate-green because the sample rule is handed the project
                  directory and the `[ -f ]` guard makes it a no-op there, and an
                  author who wants it to actually scan project files must declare
                  `input_scope`. Naming the guard is required so the next reader
                  knows the no-op is deliberate rather than a bug.
                · `packTypeBlurb`'s three per-type blurbs, only where they assert
                  the sample does nothing. Today's three make no always-pass
                  claim, so this site may legitimately need NO edit (notes,
                  premise 7) — read them, and leave them alone if they are already
                  honest. Do not reword them just to have changed something.
              TASK-001's drift guard forbids the NORMALISED substring `always
              pass` (case-insensitive) in the written validator, the written
              pack.yml, and every blurb. Because it normalises, it catches a
              PARTIAL cleanup: fixing only the `validator:` literal leaves the
              pack.yml comment's line-wrapped "currently always / # passes" in
              place and the guard stays RED. (Under a raw substring scan it would
              NOT — that is precisely the vacuity premise 7 documents and TASK-001
              corrects.) The blurb arm starts green and is a regression fence.

          DO NOT change the rule's declared shape: it keeps `validator:`, no
          `layer:`, no `input_scope:`, `risk_class: correctness`, and its existing
          positive/negative fixture paths. Changing `input_scope` to `single-file`
          would make the gate walk and scan EVERY project file, which is a
          different product decision and not this issue.
          DO NOT touch `pkg/packval`. DO NOT touch `cmd/backstop/pack_new.go`.
          DO NOT touch `cmd/backstop/pack_new_test.go` or
          `cmd/backstop/pack_authoring_loop_test.go`.

          All three pack types share this one code path, so one edit fixes engine,
          mechanism and toolchain together — which is what
          `TestPackNew_ScaffoldPassesCheckAndTest` asserts across all three.
        files:
          - pkg/pack/scaffold.go
        claims:
          - CLM-001
          - CLM-002
          - CLM-003
          - CLM-004
          - CLM-005
        depends_on:
