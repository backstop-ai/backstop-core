    waiver, a suppression, a baseline entry, a skipped test, a loosened assertion, or a
    lowered threshold is not acceptance.

  ══════════════════════════════════════════════════════════════════════════════
  SHARP EDGES
  ══════════════════════════════════════════════════════════════════════════════
  1. `/pack/examples/` may not exist yet (CLM-012). This is the single most likely blocker,
     and the only correct response is to stop and report the ordering, not to improvise a
     destination.
  2. `backstop gate` cardinality is counted over the raw markdown, including hidden HTML
     (CLM-003). Any additional prose mentioning the literal bytes `backstop gate` elsewhere
     on the page silently breaks it.
  3. Markdown inside a raw HTML block is not processed (CLM-004). Moving the JLINK-013
     marker back inside `.canonical-note` produces a rendered page with zero
     `data-journey-link-id="JLINK-013"` anchors and a Seed 4 owner-contract failure.
  4. `<pre><code>backstop baseline</code></pre>` is NOT one of the three adoption
     instructions, so `check_closed_blocks` does not mask it and it needs its own allowance
     key (CLM-006).
  5. The `.canonical-note` div leaves exactly two residual blocks after masking —
     `<div class="canonical-note">` and `</div>` — and both need allowance keys (CLM-006).
  6. JLINK retirement is a two-seed operation (CLM-005). Fixing Seed 1 alone leaves the
     Seed 5 journey map pointing at a link nothing renders; fixing Seed 5 alone leaves the
     Seed 1 closed matrix declaring a link the page does not carry.
  7. `.canonical-note` is visually hidden by clip, not by `display:none`, so the browser
     completeness helper still counts it as a visible block with real text. Do not "fix"
     a completeness failure by hiding it harder.
  8. `TestSiteCheck_NavigationMatrixPasses` also asserts the ordered navigation labels in
     `docs/index.html`. Those labels are IA-owned; leave them exactly as the branch has
     them, and change only the `/adopt/` presentation row.
  9. `scripts/verify-documentation-semantics-integration.sh` runs the released
     documentation-semantics pack over a corpus that includes `docs/adopt.md`. New copy must
     not introduce a duplicate canonical definition anchor; the pack, not this repo, owns
     that rule, and it stays external.
  10. `scripts/tests/public-product-model/verify-structural-verifier.sh` mutates
     `docs/adopt.md` by replacing the exact GOBIN install string. Keeping that command byte-
     identical keeps the shipped mutation fixture meaningful; changing it silently
     neuters a negative test.
  11. Per-file coverage floors apply to `scripts/sitecheck` and `scripts/websitejourney`.
     Matrix rows must be EXERCISED by the suites, not merely edited.
  12. The Seed 4 diff check reads committed history. This plan's own artifacts and the
     ISSUE-196 file are outside the closed matrix, so they need no rows, but the working
     branch must still be committed before `--check-diff` output is authoritative.

phases:
  - id: phase-1
    name: "Phase 1: RED — pin the approved Adopt contract in the executable matrices"
    tasks:
      - id: TASK-001
        type: test
        title: "RED: move the /adopt/ presentation row to the approved hero"
        description: |
          In `scripts/sitecheck/presentation_test.go`, change the `/adopt/` entry of
          `canonicalPresentation()` so `HeroQuestion` is `Try it out.`. Change nothing
          else on that row: `Route` stays `/adopt/`, `PageKind` stays `adoption`,
          `Treatments` stays `[]string{"evidence-cards"}`, and `NextAction` stays
          `/use-cases/` (CLM-011). Do not touch any other row — `/`, `/evaluate/`,
          `/model/`, `/use-cases/`, `/packs/`, `/extend/`, `/reference/`, `/status/`, and
          `/contributing/` belong to their own landings, and if a sibling already changed
          one, leave that change intact.

          Do not touch the `ordered` navigation-label slice inside
          `TestSiteCheck_NavigationMatrixPasses`: those labels assert
          `docs/index.html` and are IA-owned (sharp edge 8). Do not touch
          `TestSiteCheck_NavigationMatrixRejectsInvalidCell`'s mutation list; it must keep
          proving that a changed hero, an added treatment, a changed `next_action`, a
          duplicate row, and a reordered pair are all rejected.

          RED receipt, required before any data or copy edit: run
          `go test ./scripts/sitecheck -run
          '^(TestSiteCheck_NavigationMatrixPasses|TestSiteCheck_NavigationMatrixRejectsInvalidCell)$'
          -count=1 -v`. `TestSiteCheck_NavigationMatrixPasses` must EXECUTE and fail with
          `site presentation does not byte-match the accepted ten-row matrix`, because
          `docs/_data/site-presentation.yml` still carries the Seed 1 hero.
          `TestSiteCheck_NavigationMatrixRejectsInvalidCell` must still pass. A compile
          error is not this task's RED evidence; if the package does not build, fix the
          test file.
        files:
          - scripts/sitecheck/presentation_test.go
        claims:
          - CLM-010
          - CLM-011
        test_names:
          - TestSiteCheck_NavigationMatrixPasses
          - TestSiteCheck_NavigationMatrixRejectsInvalidCell
        depends_on: []

      - id: TASK-002
        type: test
        title: "RED: retire CAP-009/@UJ-001 from the Seed 5 journey expectations"
        description: |
          Specify the post-retirement Seed 5 world (CLM-005) before the map or the copy
          moves.

          In `scripts/websitejourney/traversal_test.go`, change the journey cardinality
          assertion from 22 to 21 and update its failure message to match. In
          `scripts/websitejourney/map_test.go`, update the corresponding 22-element
          capacity hint so the expectation reads consistently; do not change what that
          test asserts beyond the count. In
          `scripts/websitejourney/testdata/built-journey-mutations.yml`, delete the
          `{jlink: JLINK-012, expected_error: CAP-009/@UJ-001}` row and leave every other
