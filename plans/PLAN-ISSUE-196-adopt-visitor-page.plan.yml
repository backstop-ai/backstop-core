    whose fragment is not exactly one ID on the destination page. On `origin/main` the
    catalog is `/packs/` and `docs/pack/examples.md` does not exist; ISSUE-193, ISSUE-195,
    ISSUE-197, ISSUE-198, and ISSUE-199 all leave the catalog route out of scope, so no
    filed issue creates it. If, at implementation time, the working branch has no canonical
    `/pack/examples/` route carrying exactly one `choose-a-pack` heading ID, STOP and report
    the sequencing conflict. Do not restore `/packs/`, do not create the pack catalog here,
