    inside the visually hidden `.canonical-note`. Cardinality 1 must hold WITHOUT restoring
    a visible "Run the gate" smoke test, and no fourth locked command (notably no
    `backstop pack add`) may be invented.

  CLM-004 — JLINK-013 MUST RENDER AS A REAL `<p><a>`, WHICH MEANS ITS MARKER SITS OUTSIDE
    THE RAW-HTML DIV. `scripts/render-public-site-contracts/main.go` rewrites the markdown
    pair `<!-- backstop-journey-link: JLINK-013 -->` + `[label](/route#anchor)` into
