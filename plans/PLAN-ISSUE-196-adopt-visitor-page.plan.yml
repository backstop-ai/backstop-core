    `origin/main` declares five keys, all of them Seed 1 sentences that the approved page
    deletes. `0a6010c` declares fourteen, covering: the `#install` sentence; the two-sentence
    `#configure` paragraph; the locked step-2 pack sentence; `Run:`; the
    `<pre><code>backstop baseline</code></pre>` block (baseline is NOT an adoption
