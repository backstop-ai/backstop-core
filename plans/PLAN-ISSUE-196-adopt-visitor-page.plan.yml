      specs/SPEC-072-public-product-model.spec.md
      specs/SPEC-075-static-public-site-design-system.spec.md
      specs/SPEC-076-end-to-end-website-capabilities.spec.md
    Plus two CONDITIONAL entries, each changeable only under its stated trigger, and each
    reported explicitly when it changes:
      tests/public-site-helpers.ts       — only under CLM-007, only on a measured,
                                           reproduced completeness failure.
      .backstop/seed4-delivery-inventory.yml — only under CLM-014, only to reconcile rows
                                           to the real committed `--check-diff` output,
                                           and never to widen the closed matrix.
    Unchanged: `docs/index.html`, `docs/index.md`, `docs/evaluate.md`, `docs/model.md`,
    `docs/use-cases.md`, `docs/packs.md`, `docs/extend.md`, `docs/reference.md`,
    `docs/status.md`, `docs/contributing.md`, `docs/_includes/site-header.html` navigation,
    `docs/_data/content-inventory.yml`, `docs/_data/evidence-inventory.yml`,
    `docs/assets/css/backstop-tokens.css` (retired-bootstrap, deletion-only),
    `scripts/sitecheck/inventory.go`, `playwright.config.ts` (`testMatch` stays
    `public-site.spec.ts`), `tests/public-site.spec.ts`,
    `scripts/tests/public-product-model/pages/discovery-evaluation-adoption-status.sh`
    (CLAIM-024 already sits in its required list and the approved page keeps it), the other
    capability feature files, the other sitecheck verifiers, the workflows,
    `bundles/BUNDLE-032*`, and the completed PLAN-SPEC-072/075/076. Packs stay external and
    are never vendored. Green obtained by a waiver, a suppression, a baseline entry, a
    skipped test, a loosened assertion, or a lowered threshold is not acceptance.

  ══════════════════════════════════════════════════════════════════════════════
  SHARP EDGES
  ══════════════════════════════════════════════════════════════════════════════
  1. `/pack/examples/` belongs to PLAN-ISSUE-198 (CLM-012). This is the most likely
     blocker, and the only correct response is to stop and report the ordering, not to
     improvise a destination.
  2. `backstop gate` cardinality is counted over the raw markdown, including hidden HTML
     (CLM-003). Any additional prose mentioning the literal bytes `backstop gate` elsewhere
     on the page silently breaks it.
  3. Markdown inside a raw HTML block is not processed (CLM-004). Moving the JLINK-013
     marker back inside `.canonical-note` produces a rendered page with zero
     `data-journey-link-id="JLINK-013"` anchors and a Seed 4 owner-contract failure.
  4. `<pre><code>backstop baseline</code></pre>` is NOT one of the three adoption
     instructions, so `check_closed_blocks` does not mask it and it needs its own allowance
     key (CLM-006).
  5. The `.canonical-note` div leaves exactly two residual blocks after masking —
     `<div class="canonical-note">` and `</div>` — and both need allowance keys (CLM-006).
  6. JLINK retirement is a three-surface operation (CLM-005): Seed 1, Seed 5, and the
     capability feature file. Fixing any one alone leaves the others declaring a link that
     nothing renders, or a scenario nothing expects.
  7. `loadBuiltJourneyMutations` hard-fails unless `JLinkRemovals` has EXACTLY 24 entries.
     Deleting the JLINK-012 removal row without retyping that guard to 23 fails every test
     that loads the fixture with `built-journey-mutations.yml must cover JLINK-001..024`,
     which is a helper fatal, not the cardinality RED this plan wants.
  8. `.canonical-note` is visually hidden by clip, not by `display:none`, so the browser
     completeness helper still counts it as a visible block with real text. Do not "fix"
     a completeness failure by hiding it harder.
  9. `TestSiteCheck_NavigationMatrixPasses` also asserts the ordered navigation labels in
     `docs/index.html`. Those labels are IA-owned; leave them exactly as the branch has
     them, and change only the `/adopt/` presentation row.
  10. `scripts/verify-documentation-semantics-integration.sh` runs the released
     documentation-semantics pack over a corpus that includes `docs/adopt.md`. New copy must
     not introduce a duplicate canonical definition anchor; the pack, not this repo, owns
     that rule, and it stays external.
  11. `scripts/tests/public-product-model/verify-structural-verifier.sh` mutates
     `docs/adopt.md` by replacing the exact GOBIN install string. Keeping that command byte-
     identical keeps the shipped mutation fixture meaningful; changing it silently
     neuters a negative test.
  12. Per-file coverage floors apply to `scripts/sitecheck` and `scripts/websitejourney`.
     Matrix rows must be EXERCISED by the suites, not merely edited.
  13. The Seed 4 diff check reads committed history. This plan's own artifacts and the
     ISSUE-196 file are outside the closed matrix, so they need no rows, but the working
     branch must still be committed before `--check-diff` output is authoritative.

phases:
