  CLM-010 — THE SEED 1 HERO STRING EXISTS IN FIVE PLACES AND ALL FIVE MOVE TOGETHER.
    `Try it out.` must replace `What does a first working adoption require?` in
    `docs/_data/content-topology.yml` (`docs/adopt.md` page record),
    `docs/_data/site-presentation.yml` (`/adopt/` row), the `heroes` list in
