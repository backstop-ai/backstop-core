  CLM-001 — LIVE `/adopt/` IS STILL THE SEED 1 FIELD GUIDE, AND THE APPROVED PAGE IS
    BYTE-KNOWN. `origin/main:docs/adopt.md` carries hero
    `What does a first working adoption require?`, H2s `Adoption paths` / `Install` /
    `Configure` / `Verify enforcement`, disposable-repository framing, an
    `Inspect the created backstop.yml…` sentence, a visible
    `Run the gate from the repository root.` smoke test, and a visible JLINK-012
    `[Configure Backstop](/reference/#configuration)` tease. The approved page at `0a6010c`
    replaces all of it with: front matter `hero_question: "Try it out."` and
    `hero_lede: "Install Backstop and see how the pieces work together."`;
    `## 1. Set up Backstop {#setup}` containing `### Install the binary {#install}` and
    `### Initialize the repository {#configure}`;
    `## 2. Start with your existing code {#adoption-paths}`;
    `## 3. Try it on a bug you know {#known-bug}` with the single `ul.eval-list`;
    `## 4. Let the agent implement it {#verify-enforcement}`; and
    `## You've now used the whole model. {#used-the-model}`. `title`, `layout`, and
    `permalink: /adopt/` are unchanged.

  CLM-002 — TWO ISSUE SENTENCES ARE SUPERSEDED BY LATER-APPROVED COPY, AND THE COMMIT WINS.
    (a) ISSUE-196 locks `[Choose a pack](/packs/#choose-a-pack)`. After filing, Brandon
