  CLM-015 — THE FENCE. Only these files change: `docs/adopt.md`,
    `docs/_includes/page-hero.html`, `docs/_layouts/default.html`,
    `docs/assets/css/site.css`, `docs/_data/content-topology.yml`,
    `docs/_data/site-presentation.yml`, `docs/_data/website-capability-map.yml`,
    `scripts/verify-public-product-model.sh`,
    `scripts/tests/public-product-model/verify-content-topology.sh`,
    `scripts/sitecheck/presentation_test.go`, `scripts/websitejourney/artifacts.go`,
    `scripts/websitejourney/map_test.go`, `scripts/websitejourney/traversal_test.go`,
    `scripts/websitejourney/testdata/built-journey-mutations.yml`,
    `tests/website-capabilities.spec.ts`, the three SPEC files named in CLM-013, and — only
