  CLM-012 — `/pack/examples/#choose-a-pack` IS AN EXTERNAL PREREQUISITE AND THE ONE THING
    THAT CAN LEGITIMATELY BLOCK THIS LANDING. `scripts/sitecheck/site.go` link resolution
