  CLM-009 — THE APPROVED HERO PAIR NEEDS A `hero_lede` SEAM IN THE SHARED INCLUDE.
    `origin/main:docs/_includes/page-hero.html` renders a fixed
    `<p class="page-boundary">Deterministic product truth, presented without changing its
