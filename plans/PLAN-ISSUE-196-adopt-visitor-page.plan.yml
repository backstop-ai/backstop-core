    stops at `## 2.` and collects the 98-character approved paragraph plus the
    13-character `backstop init` block — 112 normalized characters, comfortably over the
    floor. Treat 112 as the prediction, not the proof: measure it in the real browser run.
    Only a measured, reproduced failure may justify touching the check, the change must be
    reported explicitly, and it may never be obtained by padding Brandon's sentence,
    inventing a slogan, or lowering the floor for other routes.

  CLM-008 — PAPER/INK FOR `adoption` IS TWO COORDINATED FILES, AND IT MUST NOT REGRESS ANY
    OTHER PAGE. `origin/main:docs/_layouts/default.html` has no `paper_kinds` mechanism and
