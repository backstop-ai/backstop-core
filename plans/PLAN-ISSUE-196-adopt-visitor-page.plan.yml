  CLM-014 — SEED 4 NEEDS NO NEW INVENTORY ROWS, BUT `--check-diff` IS THE ARBITER.
    Every in-matrix path this landing touches already has a row in
    `origin/main:.backstop/seed4-delivery-inventory.yml`: `docs/adopt.md`,
    `docs/_data/site-presentation.yml`, `docs/_includes/page-hero.html`,
    `docs/_layouts/default.html`, `docs/assets/css/site.css`,
    `scripts/sitecheck/presentation_test.go`, and
    `scripts/verify-public-product-model.sh`. `expectedRole()` in
    `scripts/sitecheck/inventory.go` returns "" for `docs/_data/content-topology.yml`,
    `docs/_data/website-capability-map.yml`, `scripts/websitejourney/**`,
    `scripts/tests/public-product-model/verify-content-topology.sh`,
    `tests/website-capabilities.spec.ts`, `specs/**`, `issues/**`, and `plans/**`, so
    `inventoryDiff` skips them and they need no rows. Run
    `go run ./scripts/sitecheck --root . --check-diff` and reconcile ROWS to the real
