    root-relative `route#anchor` href. `0a6010c` therefore places CLAIM-024 and the
    `backstop gate` block inside `<div class="canonical-note">` but places the JLINK-013
    marker and link AFTER the closing `</div>`, as a top-level markdown block still under
    `{#verify-enforcement}`. Preserve that placement exactly.

  CLM-005 — JLINK-012 CANNOT SURVIVE THE APPROVED COPY, AND ITS RETIREMENT CASCADES INTO
    SEED 5. `scripts/verify-public-product-model.sh` requires every declared journey link's
    marker and its exact `[label](destination_route#destination_anchor)` to appear exactly
    once in its declared source page; the approved Adopt page contains no
    `/reference/#configuration` link, so a declared JLINK-012 is an immediate red. Because
