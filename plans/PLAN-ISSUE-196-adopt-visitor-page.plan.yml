  CLM-007 — `#configure` CLEARS THE 80-CHARACTER COMPLETENESS FLOOR AS WRITTEN; NEITHER
    PADDING NOR A CHECK EDIT IS EXPECTED. `assertContentCompleteness` in
    `tests/public-site-helpers.ts` walks the siblings after each required-block heading
