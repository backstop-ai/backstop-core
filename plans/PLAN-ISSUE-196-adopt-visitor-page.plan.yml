    `docs/_data/content-topology.yml` `journey_links`; the `exact_ids` JLINK list, the
    `edge_specs` tuple list, and the `link_labels` list in BOTH
    `scripts/verify-public-product-model.sh` and
    `scripts/tests/public-product-model/verify-content-topology.sh`;
    `docs/_data/website-capability-map.yml` journey `CAP-009/@UJ-001`;
    `ExpectedWebsiteJourneys()` in `scripts/websitejourney/artifacts.go`; the 22-journey
    cardinality in `scripts/websitejourney/traversal_test.go` and the matching capacity
    hint in `scripts/websitejourney/map_test.go`; the `{jlink: JLINK-012, expected_error:
    CAP-009/@UJ-001}` row in `scripts/websitejourney/testdata/built-journey-mutations.yml`;
    and the `CAP-009/@UJ-001` row in `tests/website-capabilities.spec.ts`.
    `scripts/websitejourney/traversal.go` resolves every mapped JLINK against the built
    documents, so a mapped-but-unrendered JLINK-012 is a hard failure, not a warning.
    CAP-009 keeps `@UJ-002` (JLINK-013), and journey cardinality becomes 21.
    `PLAN-SPEC-076` is completed and must NOT be edited, even though it names 22.

  CLM-006 — THE CLOSED ALLOWANCE DICTIONARY FOR `docs/adopt.md` IS REPLACED WHOLESALE, NOT
    EXTENDED. `check_closed_blocks` in `scripts/verify-public-product-model.sh` masks front
    matter, claim regions, fenced code, generated-region includes, and the three rendered
    adoption commands, then requires every remaining blank-line-delimited, non-heading,
