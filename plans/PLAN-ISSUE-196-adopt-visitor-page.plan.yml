          executable expectation it otherwise lacks. Read
          `docs/_layouts/default.html` and `docs/assets/css/site.css` from the repository
          root, in the same file-reading style as the shipped
          `scripts/sitecheck/pipeline_contract_test.go` assertions. Positively require: a
