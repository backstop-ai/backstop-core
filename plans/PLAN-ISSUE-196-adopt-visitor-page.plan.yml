          `[]string{"evidence-cards"}`, and `NextAction` stays `/use-cases/` (CLM-011). Do
          not touch any other row; if a sibling already changed one, leave that change
          intact. Do not touch the `ordered` navigation-label slice inside
          `TestSiteCheck_NavigationMatrixPasses` — those labels assert `docs/index.html`
          and are IA-owned (sharp edge 9) — and do not weaken
