    expand Adopt into a pack tutorial. Catalog coverage stays a Packs/product gap.

  CLM-013 — THE SEED 1 AND SEED 5 SPEC LITERALS ARE FIVE NAMED LINES, NOT A REWRITE.
    SPEC-072: the `docs/adopt.md | /adopt/` row of the canonical page table (hero cell) and
    the `JLINK-012` row of the journey-link table. SPEC-075: the `/adopt/` row of the exact
