          - CLM-005
          - CLM-007
          - CLM-012
          - CLM-016
        depends_on: []
  - id: phase-2
    name: "Phase 2: Route, navigation, and page-kind contracts"
    tasks:
      - id: TASK-002
        type: test
        title: "RED: assert the pack fleet route catalogs, Pack nav item, and packFleetCurrent"
        description: |
          Drive the sitecheck contract layer red against the delivered route and
          navigation state, before touching any production Go.

          In `scripts/sitecheck/site_contract_test.go`: change
          `TestSiteCheck_RouteCatalogsAreImmutableAndExhaustive` so `wantRoutes` is
          `/`, `/evaluate/`, `/model/`, `/adopt/`, `/use-cases/`,
          `/pack/examples/`, `/pack/guide/`, `/reference/`, `/status/`,
          `/contributing/` — still exactly ten; `wantPrimary` is `/evaluate/`,
          `/model/`, `/adopt/`, `/pack/`; `wantUtility` is `/contributing/`; and
          drop `pack-authoring.html` from `wantRedirects`. The primary and utility
          rosters are the approved ones (CLM-012): do NOT keep `/use-cases/`,
          `/reference/`, or `/status/` in a nav expectation, and do not add them
          back later to repair a red.

          Assert `extraLinkableRoutes()` as a UNION, not as this plan's literal.
          Under the fixed landing order ISSUE-197 has already populated it with
          eight entries, so require: every entity route ISSUE-197 owns still
          present, `/pack/` present exactly once, no duplicates, and cardinality
          unchanged by this plan — plus the caller-mutation loop proving the getter
          returns an independently mutable slice. If the getter is absent because
          the landing order was violated, the expectation is the single entry
          `["/pack/"]` and ISSUE-197 adds its seven later. An ordered-equality
          assertion pinned to `["/pack/"]` against a populated catalog is a defect:
