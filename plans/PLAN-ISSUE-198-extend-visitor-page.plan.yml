          Add a focused test proving the pack-fleet current-state predicate on its
          own: `packFleetCurrent` true for `/pack/`, `/pack/guide/`,
          `/pack/examples/` and false for `/pack/examplesx/`, `/packs/`,
          `/extend/`, `/reference/`, and `/`. The negative half is what
          distinguishes a predicate from a prefix match.

          RED receipt: `go test ./scripts/sitecheck -count=1 -v`. The named tests
          must EXECUTE and fail on their intended assertions (`/packs/` and
          `/extend/` still in the catalogs, `/use-cases/` and `/reference/` still
          in `primaryNavigation()`, `/status/` still in `utilityNavigation()`, the
          retired alias still present, `packFleetCurrent` missing). A package that
          does not compile because `packFleetCurrent` — and, only under a violated
