         product-model verifier scripts) and phase 6 (Seed 4 ledger, deployment
         aliases, semantics corpus, `inventory_test.go`) share no file, so both run
         off phase 4's verification and phase 2's `TASK-004`. Phase 6 needs
         `TASK-004` because `expectedRole()` for the pack fleet paths lands in
         phase 2; phase 5 needs it because `TASK-013` re-runs the sitecheck
         presentation matrix.
       - Phase 7 is the convergence point: `TASK-017` depends on BOTH `TASK-013`
         and `TASK-016`, because `verify-public-site.sh` needs the data layer and
         the delivery rows simultaneously. Because phases 5 and 6 are concurrent,
         phase 6's go-test receipt is SCOPED to the inventory and role tests —
         the sitecheck tests that read the real presentation data are phase 7's.
       - Phase 9's two arms are also disjoint: `TASK-023` (five SPEC files) hangs
         off `TASK-021` and runs alongside `TASK-022` (websitejourney receipts),
         and only `TASK-024` joins them. `TASK-024` therefore carries exactly two
         edges — `TASK-022` and `TASK-023` — and no redundant edge back to
         `TASK-021`, which both of them already imply.
  17. FOUR ROSTER LOCATIONS, ONE COMMIT-SHAPED TRUTH (CLM-012). `verifyRouteDocument`
     emits `navigation … Expected: present` for every `primaryNavigation()`
     destination a rendered route fails to link, and `verify_reference_navigation_
     roster_is_consistent` (PLAN-ISSUE-199) reads `docs/_data/content-topology.yml`
     as the roster and requires the header to match it exactly — one rendered
     anchor per rostered route, no rendered anchor for an off-roster canonical
     route. So the Go catalogs, the topology data, the Liquid header, and the
     Playwright helpers cannot land in different phases with different rosters and
     be green in between. They land across phases 2, 5, and 7, and phase 7's
     `verify-public-site.sh` is the first receipt where all four are true at once.
     Do not "repair" an intermediate red by re-adding a dropped nav route.
  18. RETIRING A JOURNEY IS A SEVEN-SURFACE EDIT (CLM-009), and the same two counts
     are shared with PLAN-ISSUE-196's JLINK-012 retirement. Reduce by exactly what
     this plan retires, reconcile against the landing base, and never renumber a
     surviving ID or scenario to close a gap.

phases:
  - id: phase-1
    name: "Phase 1: Prerequisite and premise receipts"
    tasks:
      - id: TASK-001
        type: setup
        title: "Assert the ISSUE-197 /pack/ prerequisite and record the premise receipts"
        description: |
          Establish the one cross-issue prerequisite and capture the premise
          receipts every later task reads. THIS TASK WRITES NOTHING. It creates no
          file, edits no file, and authors no copy — it is a read-and-record gate,
          and every fact it records is re-proved by a later test or verification
          task rather than trusted on its say-so.

          PREREQUISITE, HARD. Assert that `docs/pack.md` exists with
          `permalink: /pack/` and that the route is reachable through
          `extraLinkableRoutes()`. If it does not exist, STOP and report the
          sequencing conflict: ISSUE-197 lands first (see the ISSUE-197
          PREREQUISITE note). Do NOT create the file, do NOT write a minimum-route
          stub, do NOT add fleet links to it, and do NOT give it a Seed 4 row.
          PLAN-ISSUE-197 owns the noun page including whether it links
          `/pack/guide/` and `/pack/examples/`, and it emits that page from its
          overlay rather than by hand. The fleet links this plan needs run the
          other way and live on its own two pages.

          Also record, without changing anything: whether `extraLinkableRoutes()`
          already exists and what it returns. Under the fixed landing order it
          exists and already contains `/pack/`, in which case TASK-003 adds no
          entry and asserts the union; if the order was violated and the getter is
          absent, TASK-003 introduces it with exactly `["/pack/"]`. Never shrink it.

          PREMISE RECEIPTS, each read out of the tree and recorded for later tasks:
          (a) `go test ./cmd/backstop -run TestPackAuthoringLoop -count=1` (or the
          exact test name in `cmd/backstop/pack_authoring_loop_test.go`) to confirm
          the live loop is `pack new` -> `pack check` -> `pack test` -> `pack add`
          -> consumer `gate`; (b) `./bin/backstop pack --help` plus
          `ls cmd/backstop/pack_*.go` to record the registered verb list and
          confirm NO `publish` verb and no `pack_publish.go` exist — TASK-005 turns
          this into the standing command-surface probe (CLM-004, CLM-005), so this
          receipt is the premise, not the acceptance; (c) the THREE places that
          hold the PACK-004 needle — the `responsibilities` tuple and the
          `production_delete_reject` call in
          `scripts/tests/public-product-model/pages/extend-reference-contributing.sh`,
          and the `'path-filter repair instruction'` allowance entry under
          `'docs/extend.md'` in `scripts/verify-public-product-model.sh` — proving
          the section must MOVE to `docs/reference.md` and that its allowance must
          be re-keyed with it (CLM-007); (d) the `documentation-semantics` pack's
          declared scope, proving `docs/*.md` is the glob and nested
          `docs/pack/*.md` cannot join the corpus, and the four corpus/count sites
          in `scripts/verify-documentation-semantics-integration.sh` that must drop
          from fourteen to twelve (CLM-016); (e)
          `go test ./scripts/websitejourney/... -count=1` to record the CURRENT
          failure set, so this plan's own red (pack-fleet retirements) is
          distinguishable from failures inherited from sibling lanes.

          If receipt (a) or (b) contradicts the approved copy — for example if a
          publish command turns out to exist — STOP and report rather than editing
          the approved page. If receipt (c) shows no test requires the needle,
          record that and drop the `docs/reference.md` move from TASK-006; do not
          restore the Seed 1 stub to keep a needle alive.
        files:
          - docs/pack.md
          - scripts/verify-public-product-model.sh
          - scripts/verify-documentation-semantics-integration.sh
        claims:
