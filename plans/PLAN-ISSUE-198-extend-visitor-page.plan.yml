    it into `.backstop/packs/`, pins it as `local` in `backstop.yml`, and writes
    `backstop.lock`. `pack install` restores from the lock, `pack list` confirms
    the installed set, `pack relock` is local-source only, and git packs move with
    `pack update`. Packs stay EXTERNAL: nothing in this plan vendors a pack into
    core or turns gitignored `.backstop/packs/` content into a durability claim.

