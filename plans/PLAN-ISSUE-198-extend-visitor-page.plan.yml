          In `scripts/sitecheck/owner_contracts_test.go`: rename
          `installed-pack-catalog` to `published-pack-catalog` in the generated-job
          list, and reduce the synthetic journey-link loop to the delivered ID set
          — JLINK-017, 018, 019, and 022 are retired by this plan (CLM-008), and
          whatever IDs sibling lanes have already retired stay retired. Derive the
          loop from the topology's `journey_links` rather than from a hardcoded
