     as the guide's next action is deliberate: rewiring it to `/contributing/` is
     part of hiding Reference, which is ISSUE-199's.
  6. `/pack/` IS LINKABLE BUT NOT CANONICAL. It must stay out of
     `canonicalRoutes()`, out of the topology `pages` inventory, out of
     `verify-pages-deployment.sh`'s canonical route loop, and out of
     `tests/public-site-helpers.ts`'s `canonicalRoutes` — it enters only through
     `extraLinkableRoutes()` and the nav catalogs. Adding it to the canonical set
     breaks the exact-ten page inventory and steals ISSUE-197's page.
  7. `aria-current` CARDINALITY IS ONE. `verifyRouteDocument` counts
     `aria-current="page"` across the whole document and requires exactly one on a
     nav destination. With `packFleetCurrent`, three routes map to one nav item, so
     the Liquid in `site-header.html` and the Go predicate must agree exactly or
     the count goes to 0 or 2.
  8. DELETED PAGES STILL NEED SEED 4 ROLES (CLM-017). Removing `docs/packs.md`,
     `docs/extend.md`, or `docs/pack-authoring.md` from `pageWrappers()` inverts
     the failure from "undeclared path" to "path outside the closed matrix".
  9. THE SEMANTICS CORPUS COUNT IS ASSERTED IN TWO PLACES (CLM-016): the `CORPUS`
     heredoc AND the `expected` list inside
     `verify_installed_semantics_gate_accepts_exact_clean_seed1_corpus`. Both must
     change together, and the count must stay 14.
  10. PACK-004's NEEDLE IS ASSERTED TWICE (CLM-007): in the `responsibilities`
     list and in `production_delete_reject`. Both must name `docs/reference.md`
     after the move, and the needle bytes must be preserved verbatim.
  11. PRODUCT-TRUTH IS A FOUR-JOB CLOSED WORLD AT A FIXED INDEX. `LoadManifest`
     requires exactly four jobs in the exact order `cli-command-catalog`,
     `artifact-schema-catalog`, `published-pack-catalog`, `release-history`, and
     `manifest_test.go` asserts job index 2 by position. Rename in place; do not
     append a fifth job or reorder.
  12. THE GENERATED FRAGMENT IS DIGEST-BOUND. `docs/_data/website-capability-map.yml`
     carries `truth_begin_marker`, `sources_begin_marker`, and `source_digest` for
     the pack catalog in TWO places (CAP-011/@UJ-001 and CAP-013/@UJ-002). Those
     digests are computed from the regenerated fragment; hand-editing a digest to
     make a test pass is falsification. Regenerate, then read the value out.
  13. `hero_lede: false` IS A REAL VALUE, NOT ABSENCE. Liquid treats `false` and
     nil differently only if the template tests them separately; the three-branch
     `if/elsif/else` in `page-hero.html` is required so `/pack/examples/` renders
     no lede while pages without the key keep the default sentence.
  14. PACKS STAY EXTERNAL. `.backstop/packs/` is gitignored by design and its
     absence is not a durability gap. If a pack is missing, install it from
     `backstop.lock`; never vendor pack content into core to make a gate green.
  15. PER-FILE COVERAGE. `scripts/sitecheck/` and `scripts/producttruth/` files
     carry an 80% per-file floor. New branches (`packFleetCurrent`,
     `extraLinkableRoutes`, `loadPublishedPacks`'s validation arms) must be
     EXECUTED by tests, not merely declared. A declared-but-unexecuted branch that
     still measures above the floor is not acceptance.
  16. THE VERIFIER LADDER DICTATES PHASE ORDER, AND IT IS NOT OBVIOUS. The four
     site verifiers nest, so running one too early produces a failure the phase
     does not own:
       - `verify-public-product-model.sh` reads source markdown and
         `docs/_data/*.yml` only. It masks the generated-region include block, so
         it needs NO build and NO fragment. Earliest legal point: phase 5.
       - `verify-product-truth.sh` runs the producttruth tests and
         `generate-product-truth.sh --check`. It needs the owner page to exist but
         not the topology. Earliest legal point: phase 4.
       - `verify-public-site.sh` runs a locked production `jekyll build` AND
         `sitecheck --check-diff --built-root --design-system-matrix`. It therefore
         needs the generated fragment (phase 4), the delivered presentation data
         (phase 5), AND the Seed 4 rows (phase 6). Earliest legal point: phase 7.
       - `verify-website-capabilities.sh` invokes BOTH
         `verify-public-product-model.sh` and `verify-public-site.sh` before its
         own traversal, so it is strictly last. Earliest legal point: phase 8.
     That ladder is why the phases run copy -> product truth -> data -> delivery
     rows -> chrome -> journeys rather than in the order the surfaces were
     described. A `{% include %}` of a nonexistent fragment is a hard Liquid build
     failure, and `--check-diff` reads COMMITTED history, so this plan's own
     artifact rows only converge once the plan file is committed on the branch.

phases:
  - id: phase-1
    name: "Phase 1: Prerequisite and premise receipts"
    tasks:
      - id: TASK-001
        type: setup
        title: "Confirm the /pack/ linkable-route prerequisite and record premise receipts"
        description: |
          Establish the one cross-issue prerequisite and capture the receipts every
          later task depends on. This task writes no page copy and no contract
          logic.

          PREREQUISITE. Check whether `docs/pack.md` exists with
          `permalink: /pack/`. If it does (ISSUE-197 landed first), change nothing
          and record that fact. If it does not, create ONLY the minimum linkable
          route: front matter with `layout: default`, `permalink: /pack/`, a
          `title`, and a `hero_question`, plus the two pack fleet links the
          approved guide already points at (`/pack/guide/` and
          `/pack/examples/#choose-a-pack`). Add a leading comment naming ISSUE-197
          as the owner that will replace the body wholesale. Do NOT author noun
          definitions, entity status tables, generated entity regions, or anything
          from `docs/_data/entity-reference.yml`. `/pack/` must NOT be added to
          `canonicalRoutes()`, to the topology `pages` inventory, or to the
          canonical route loop in `scripts/verify-pages-deployment.sh`.

          PREMISE RECEIPTS, each read out of the tree and recorded for later tasks:
          (a) `go test ./cmd/backstop -run TestPackAuthoringLoop -count=1` (or the
          exact test name in `cmd/backstop/pack_authoring_loop_test.go`) to confirm
          the live loop is `pack new` -> `pack check` -> `pack test` -> `pack add`
          -> consumer `gate`; (b) `ls cmd/backstop/pack_*.go` to confirm
          `pack_install.go`, `pack_list.go`, `pack_relock.go`, `pack_update.go`
          exist and NO `pack_publish.go` exists; (c) the two assertions in
          `scripts/tests/public-product-model/pages/extend-reference-contributing.sh`
          that still require the PACK-004 needle, proving the needle must move to
          `docs/reference.md` rather than be deleted; (d) the
          `documentation-semantics` pack's declared scope, proving `docs/*.md` is
          the glob and nested `docs/pack/*.md` cannot join the 14-path corpus;
          (e) `go test ./scripts/websitejourney/... -count=1` to record that the
          package's current failures are inherited from sibling-issue JLINK pruning
          and stale feature files, so this plan's own red is distinguishable.

          If receipt (a) or (b) contradicts the approved copy — for example if a
          publish command turns out to exist — STOP and report rather than editing
          the approved page. If receipt (c) shows no test requires the needle,
          record that and drop the `docs/reference.md` move from TASK-006; do not
          restore the Seed 1 stub to keep a needle alive.
        files:
          - docs/pack.md
        claims:
          - CLM-001
          - CLM-002
          - CLM-004
          - CLM-005
          - CLM-007
          - CLM-012
          - CLM-016
        depends_on: []
  - id: phase-2
    name: "Phase 2: Route, navigation, and page-kind contracts"
    tasks:
      - id: TASK-002
        type: test
        title: "RED: assert the pack fleet route catalogs, Pack nav item, and packFleetCurrent"
        description: |
          Drive the sitecheck contract layer red against the delivered route and
          navigation state, before touching any production Go.

          In `scripts/sitecheck/site_contract_test.go`: change
          `TestSiteCheck_RouteCatalogsAreImmutableAndExhaustive` so `wantRoutes` is
          `/`, `/evaluate/`, `/model/`, `/adopt/`, `/use-cases/`,
          `/pack/examples/`, `/pack/guide/`, `/reference/`, `/status/`,
          `/contributing/`; `wantPrimary` is `/evaluate/`, `/model/`, `/adopt/`,
          `/use-cases/`, `/pack/`, `/reference/`; `wantUtility` stays
          `/status/`, `/contributing/`; add `wantExtra` = `["/pack/"]` asserted
          through both the equality check and the caller-mutation loop; and drop
          `pack-authoring.html` from `wantRedirects`. Update `syntheticDocument`'s
          label map to carry `"/pack/": "Pack"` in place of the `Packs` and
          `Extend` entries, and set `aria-current="page"` when
          `page.Route == destination || (destination == "/pack/" &&
          packFleetCurrent(page.Route))`. In `makeSyntheticSite`, emit
          `hero_question: %q` rather than `%s` so colon- and period-bearing heroes
          parse, and write a minimal built document for `/pack/` so the extra
          linkable route resolves.

          In `scripts/sitecheck/presentation_test.go`: in `canonicalPresentation()`
          replace the `/packs/` and `/extend/` rows with
          `{Route: "/pack/examples/", PageKind: "ecosystem", HeroQuestion:
          "Published packs.", Treatments: [evidence-cards, generated-regions,
          local-overflow], NextAction: "/pack/guide/"}` and
          `{Route: "/pack/guide/", PageKind: "extension", HeroQuestion: "Packs: a
          guide", Treatments: [evidence-cards, boundary-callouts], NextAction:
          "/reference/"}`, and repoint `/use-cases/`'s NextAction to
          `/pack/examples/`. Leave every other row — including the `/evaluate/`,
          `/model/`, `/adopt/`, `/reference/`, and `/contributing/` heroes — exactly
          as it is on main. In `TestSiteCheck_NavigationMatrixPasses` replace
          `href="/packs/">Packs` and `href="/extend/">Extend` with one
          `href="/pack/">Pack` entry, keeping Use Cases, Reference, Status, and
          Contributing in their existing order.

          In `scripts/sitecheck/owner_contracts_test.go`: rename
          `installed-pack-catalog` to `published-pack-catalog` in the generated-job
          list only. Do NOT introduce a reduced journey-link list — the ID set
          stays JLINK-001..024 (CLM-008), so the existing 1..23 synthetic loop
          stands.

          Add a focused test proving the pack-fleet current-state predicate on its
          own: `packFleetCurrent` true for `/pack/`, `/pack/guide/`,
          `/pack/examples/` and false for `/pack/examplesx/`, `/packs/`,
          `/extend/`, `/reference/`, and `/`. The negative half is what
          distinguishes a predicate from a prefix match.

          RED receipt: `go test ./scripts/sitecheck -count=1 -v`. The named tests
          must EXECUTE and fail on their intended assertions (missing
          `extraLinkableRoutes`, `/packs/` and `/extend/` still in the catalogs,
          the retired alias still present). A package that does not compile because
          `extraLinkableRoutes` and `packFleetCurrent` do not exist yet is expected
          for the new symbols only; introduce them in TASK-003, and do not accept a
          pre-existing build break elsewhere as this task's red.
        files:
          - scripts/sitecheck/site_contract_test.go
          - scripts/sitecheck/presentation_test.go
          - scripts/sitecheck/owner_contracts_test.go
        claims:
          - CLM-001
          - CLM-002
          - CLM-008
          - CLM-010
          - CLM-012
          - CLM-013
        test_names:
          - TestSiteCheck_RouteCatalogsAreImmutableAndExhaustive
          - TestSiteCheck_NavigationMatrixPasses
          - TestSiteCheck_CanonicalRouteMatrixPasses
        depends_on:
          - TASK-001

      - id: TASK-003
        type: implementation
        title: "GREEN: swap the route catalogs, add extraLinkableRoutes and packFleetCurrent"
        description: |
          Make TASK-002 green with the smallest coordinated edit to the sitecheck
          production files.

          In `scripts/sitecheck/site.go`: in `canonicalRoutes()` replace `/packs/`
          and `/extend/` with `/pack/examples/` and `/pack/guide/` in the same
          positions. In `primaryNavigation()` replace the `/packs/` and `/extend/`
          entries with one `/pack/`, keeping `/use-cases/` and `/reference/`.
          Leave `utilityNavigation()` unchanged — hiding `/status/` is ISSUE-199's.
          Add `extraLinkableRoutes()` returning exactly `[]string{"/pack/"}`,
          returning a fresh slice each call so caller mutation cannot leak. Add
          `packFleetCurrent(route string) bool` returning true for `/pack/`,
          `/pack/guide/`, `/pack/examples/`. In `navigationLabel()` replace the
          `/packs/` and `/extend/` cases with a single `case "/pack/": return
          "Pack"`. In `legacyRedirects()` remove the `pack-authoring.html` entry
          and nothing else. In `collectBuiltDocuments`, after the canonical loop,
          load each `extraLinkableRoutes()` document and register its IDs, skipping
          silently when the file is absent so a missing optional route degrades to
          a link finding rather than a crash. In `verifyRouteDocument`, expand the
          current-state condition to
          `route == destination || (destination == "/pack/" && packFleetCurrent(route))`.
          Do NOT add a `journeyLinkIDs()` helper and do NOT narrow
          `VerifyRenderedOwnerContracts`'s JLINK-001..024 loop — no JLINK ID is
          deleted by this plan.

          In `scripts/sitecheck/inventory.go`: ADD `docs/pack/examples.md` and
          `docs/pack/guide.md` to `pageWrappers()`. RETAIN `docs/packs.md`,
          `docs/extend.md`, and `docs/pack-authoring.md` — `expectedRole()` must
          keep resolving `page-wrapper` for them so their Seed 4 `D` rows stay
          inside the closed matrix (CLM-017, sharp edge 8). Change nothing else in
          that file.

          GREEN evidence: rerun `go test ./scripts/sitecheck -count=1` and require
          the TASK-002 tests to pass with no other test in the package regressing.
        files:
          - scripts/sitecheck/site.go
          - scripts/sitecheck/inventory.go
        claims:
          - CLM-001
          - CLM-002
          - CLM-012
          - CLM-013
          - CLM-017
        depends_on:
          - TASK-002

      - id: TASK-004
        type: verification
        title: "Verify the route and navigation contract layer"
        description: |
          Run `backstop gate --file scripts/sitecheck/site.go --file
          scripts/sitecheck/inventory.go --file
          scripts/sitecheck/site_contract_test.go --file
          scripts/sitecheck/presentation_test.go --file
          scripts/sitecheck/owner_contracts_test.go` as the diff-scoped cadence
          gate, then `go test ./scripts/sitecheck/... -count=1`.

          Require: the TASK-002 tests passing; every other sitecheck test still
          passing unmodified; and the per-file coverage floor met with
          `packFleetCurrent` and `extraLinkableRoutes` actually EXECUTED by the new
          assertions rather than merely declared (sharp edge 15). Read the gate
          report for lint, unused-symbol, and coverage findings on the two
          production files. Confirm `utilityNavigation()`, the footer include, and
          `docs/_includes/site-footer.html` are untouched, and that no redirect was
          invented for `/extend/` or `/packs/`. A waiver, a skip, a baseline entry,
          or a loosened assertion is a failure, not a pass.
        files:
          - scripts/sitecheck/site.go
          - scripts/sitecheck/inventory.go
          - scripts/sitecheck/site_contract_test.go
          - scripts/sitecheck/presentation_test.go
        claims:
          - CLM-012
          - CLM-013
          - CLM-017
        depends_on:
          - TASK-003
