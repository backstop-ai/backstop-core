         `verify-public-product-model.sh` and `verify-public-site.sh` before its
         own traversal, so it is strictly last. Earliest legal point: phase 8.
     That ladder is why the phases run copy -> product truth -> data -> delivery
     rows -> chrome -> journeys rather than in the order the surfaces were
     described. A `{% include %}` of a nonexistent fragment is a hard Liquid build
     failure, and `--check-diff` reads COMMITTED history, so this plan's own
     artifact rows only converge once the plan file is committed on the branch.
     The ladder constrains VERIFICATION, not every task, and the DAG is written to
     let file-disjoint work run in parallel rather than in one long serial chain:
       - Phase 2 (synthetic sitecheck contracts, `scripts/sitecheck/*`) and phase 3
         (page copy, `docs/*` plus the two page test scripts) share no file and no
         receipt, so both run straight off phase 1.
