          `./bin/backstop artifact new capability --slug understand-backstop`,
          `./bin/backstop artifact new capability --slug evaluate-fit`,
          `./bin/backstop artifact new capability --slug evaluate-guarantees`, then
          `./bin/backstop artifact new capability --slug evaluate-compatibility`.
          Require CAP-002/CAP-003 tombstones, preserve CAP-001, refuse unexpected
          reservations, and leave draft scaffolds; never hand-create an ID.
        files: [capabilities/CAP-004-understand-backstop/capability.yml, capabilities/CAP-005-evaluate-fit/capability.yml, capabilities/CAP-006-evaluate-guarantees/capability.yml, capabilities/CAP-007-evaluate-compatibility/capability.yml]
