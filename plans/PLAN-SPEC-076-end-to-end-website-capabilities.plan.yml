          and SPEC-075 v1.0.4. Run the four
          public verifiers exactly as `./scripts/verify-public-product-model.sh`,
          `./scripts/verify-documentation-semantics-integration.sh`,
          `./scripts/verify-product-truth.sh`, and `./scripts/verify-public-site.sh`.
          Inspect JLINK-001..024, structured boundaries, adoption instructions, SPEC-074
          source descriptors/URL templates/marker pairs/source-level envelope digests, and
          SPEC-075 site-identity resolution/immutable rendered anchors/reconstruction and
          rendered-digest verdicts, its JLINK-024/BOUNDARY-005 single-anchor dual-identity/
          order/visible-byte verdict, plus deployment proof, read-only. Never call owner engines,
          resolve `<SITE-COMMIT>`, reconstruct an envelope, parse or canonicalize CLAIM-005 or
          boundary/JLINK source metadata, or create a dependency back to Seed 5.
