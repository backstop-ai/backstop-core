notes: |
  Implements ISSUE-116. ONE-LINE PRODUCTION FIX plus its docstring, two tests, two
  verification passes. Five tasks, ONE production file. Nothing else is in scope.

  ── THE DEFECT IN ONE PARAGRAPH ────────────────────────────────────────────
  The shared pack dispatch (cmd/backstop/pack_gate.go:744-748) deliberately carries
  the SARIF-reported start line onto gate.Violation.Line so the SPEC-049 waiver
  reconciliation can byte-scan a finding's own line for a @waiver token.
  `HollowFindingsToViolations` (pkg/gate/substantiveness_join.go:172-188) re-packages
  each routed hollow finding into a `test_substantiveness` Violation and copies File,
  Message and Severity — but NOT Line. Every hollow violation therefore reaches
  `computeWaiverResult` (pkg/gate/step_waiver.go:89) with Line == 0, the adjudicator
  scans line 0, and no token placed anywhere can ever match. `pack_engines` findings
  ride the SAME dispatch and keep their Line, which is why `pack_engines` waivers work
  and this one silently does not. The fix is `Line: v.Line` in the constructed
  Violation.

  ── MEASURED WHILE PLANNING, 2026-08-09 (do not re-derive; DO re-observe the red) ─
  The whole chain was run end-to-end against HEAD through the REAL production path
  (installed local pack -> real dispatchPackEngines -> real ast-grep -> convert ->
  route -> join -> gate.Run with WithWaiver -> waiver.Adjudicate), using the existing
  cmd/backstop e2e harness (gate_substantiveness_e2e.go). Observed, verbatim:

    BEFORE the fix
      violation rule=test_substantiveness file=subject_test.go LINE=0
      STEP test_substantiveness  status=fail  (1 violation)
      STEP waiver_resolution     status=pass  reason="clean — no active waivers"
      ActiveWaivers=0
    AFTER adding `Line: v.Line`
      violation rule=test_substantiveness file=subject_test.go LINE=5
      STEP test_substantiveness  status=pass  (0 violations)
      STEP waiver_resolution     status=pass  reason="PASS · 1 waivers (test_substantiveness)"
      ActiveWaivers=1

  So the RED is real, deterministic, and observable at the exact acceptance surface
  ISSUE-116 demands. The full `go test ./pkg/gate/... ./cmd/backstop/... ./pkg/waiver/...`
  suite was ALSO run with the fix applied and is GREEN — no existing test depends on the
  dropped Line. All probe files were removed and the fix reverted; HEAD is untouched.

  RE-OBSERVE THE RED ANYWAY. Planning's measurement is evidence the tests CAN go red,
  not a substitute for the implementer watching them do it. A test written after the
  fix and never seen failing is worth nothing here.

  ── THE UNUSED/DANGLING SYMPTOM IS THE SAME DEFECT, AND IT IS TESTABLE ─────
  ISSUE-116 flags as "worth checking" that a non-matching `test_substantiveness`
  token does not even surface in the unused/dangling bucket. It does not, and the
  cause is this same line loss — not a second defect. `waiver.harvestWindow`
  (pkg/waiver/adjudicate.go:205-230) builds its window from `windowLines(f)`, which
  for Line == 0 yields exactly `[0]` (the `f.Line > 1` guard blocks the line-above),
  and a LineReader asked for line 0 returns ok=false. NO token is harvested at all,
  so it cannot even be CLASSIFIED as unused. Measured both ways on 2026-08-09 with a
  deliberately mistyped rule-id on the finding's own line:

    BEFORE: reason="clean — no active waivers"
    AFTER : reason="clean — no active waivers; 1 unused/dangling (test_substantivenes)"

  That is a durable, non-vacuous, RED-provable assertion, so this lane PINS it
  (CLM-003) rather than leaving the issue's open question open. It costs one extra
  test case in a file this lane is already creating and closes the "reads as not
  recognized at all" half of the report.

  ── SHARP EDGE: THE noTarget VIOLATION WILL KEEP THE STEP RED IF YOU IGNORE IT ─
  The e2e harness's default workspace (newE2EWorkspace, gate_substantiveness_e2e.go:92-95)
  writes a hollow test whose body calls `doSubject()`, and its spec mandates that test
  against target package `gate`. That yields TWO test_substantiveness violations, not
  one: the hollow finding AND a noTarget finding ("does not call package gate").
  Measured on 2026-08-09. The noTarget finding is ISSUE-117's surface — it has NO line
  at all and is explicitly OUT OF SCOPE here — so it will NOT be suppressed and the step
  will NOT flip to pass while it is present.

  THE FIX IS IN THE FIXTURE, NOT IN THE CODE: give the waiver workspace's hollow test a
  body of `gate.Build()` instead of `doSubject()`. The referenced-symbol rule then
  captures `gate`, the noTarget set-join is SATISFIED, and no noTarget violation is
  raised — while the test stays genuinely hollow, because `Build` matches none of the
  hollow rule's assertion vocabulary (require|assert|check|verify|expect|must|Fatal|
  Error|Fail|Skip). Verified both properties on 2026-08-09: exactly one violation, and
  it is the hollow one. DO NOT reach for `kind: absence`, and DO NOT touch the noTarget
  path to make the step green — either would be silently implementing ISSUE-117.

