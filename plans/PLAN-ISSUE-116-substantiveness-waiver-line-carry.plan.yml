  ── OBSERVED WHILE PLANNING, OUT OF SCOPE, WORTH FILING SEPARATELY ─────────
  `dispatchAstGrepRule` (pkg/gate/substantiveness_q1_dispatch.go:62-76) has the SAME
  omission: it builds its Violation without `Line`, so every finding it produces
  carries Line == 0. Its own doc comment claims it "mirrors the production dispatch
  (cmd/backstop dispatchPackEngines -> runFindingsEngine)" — and in this field it does
  not. It is TEST GLUE ONLY (no production caller; confirmed by grep), so it cannot
  cause the ISSUE-116 defect and fixing it is not required for any task below — which
  is exactly why the acceptance test is sited in cmd/backstop over the real dispatch
  rather than in pkg/gate over this glue. Note it, file it separately if it matters.
  Do not widen this lane to catch it.

  ── WHY THE ACCEPTANCE TEST LIVES IN cmd/backstop ──────────────────────────
  ISSUE-116 requires the real reconciliation path, not `HollowFindingsToViolations`
  called in a vacuum. `computeWaiverResult` is unexported, so the only honest reach is
  `gate.New(WithSteps(...), WithWaiver(...)).Run(ctx)` — the shipped seam. And the
  Line the waiver needs is put there by cmd/backstop's dispatch, which pkg/gate cannot
  import. cmd/backstop already owns a real installed-pack harness that returns the
  production StepResult; the acceptance test feeds that result into a waiver-enabled
  gate Run. Every hop between the pack and the verdict is the real one.

  ── CLAIM LEDGER (ISSUE-116 carries no CLM ids; this lane defines them) ────
    CLM-001  HollowFindingsToViolations forwards each source hollow finding's Line
             onto the test_substantiveness Violation it constructs — a finding
