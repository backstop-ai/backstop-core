          THIS IS THE ISSUE'S MANDATED ACCEPTANCE SHAPE: a real hollow finding with a
          real File+Line, a real inline token on that exact line, run through the REAL
          reconciliation path. Reuse the existing harness in-package — do NOT build a
          parallel one and do NOT hand-construct a waiver.Finding:
            requireAstGrepE2E(t)                    fail-loud engine guard
            newE2EWorkspace(t.TempDir())            temp workspace + backstop.yml + spec
            installSubstantivenessLocalPack(root)   REAL distribution.Add of packs/substantiveness
            runProductionSubstantivenessStep()      REAL dispatch -> ast-grep -> route -> join
          then feed the returned gate.StepResult into a waiver-enabled gate:
            steps := []gate.StepFunc{
              func(context.Context) gate.StepResult { return res },
              gate.StepWaiverResolutionScopedFunc(nil),
            }
            gate.New(gate.WithSteps(steps), gate.WithWaiver(reader, nil, now)).Run(ctx)
          `computeWaiverResult` is unexported; WithWaiver + Run IS the real path to it,
          and the assertions below are about its output, not about the join in isolation.

          THE FIXTURE. Overwrite ws.hollowFile (the harness writes it at
          gate_substantiveness_e2e.go:92-95) with a variant whose test declaration line
          carries the token and whose BODY CALLS `gate.Build()`:

            package sample_test

            import "testing"

            func TestE2EHollowSubject(t *testing.T) { // @waiver:test_substantiveness:false-positive:2999-01-01
              gate.Build()
            }

          Both details are load-bearing and both were measured on 2026-08-09:
            • the finding is reported at the func DECLARATION line (line 5), which is
              where the token must sit — a trailing comment on that line is exactly the
              "exact line SARIF reports the finding at" case the issue describes;
            • `gate.Build()` satisfies the noTarget set-join so the hollow finding is
              the ONLY violation (see the notes' SHARP EDGE). With `doSubject()` there
              are two, and the step cannot flip to pass no matter what the waiver does.
          Say BOTH of these in the fixture's comment. A future reader who "tidies"
          gate.Build() back to doSubject() will otherwise reintroduce a confusing red.

          THE LineReader. A `func(file string, line int) (string, bool)` that opens the
          file and returns the requested 1-indexed line. It MUST handle a
          repo-relative path (the hollow violation's File arrives as `subject_test.go`,
          canonicalized by NormalizePath) by joining it onto ws.root, and pass an
