notes: |
  Implements ISSUE-079 — `recipe apply` runs only two fields through Substitute
  (the create PAYLOAD content, apply.go:410-426/248, and the merge FRAGMENT
  content, apply.go:639). Every field that locates WHERE an op writes —
  Op.Target, Op.Anchor — and the content it SPLICES — Op.Snippet — is used RAW,
  so a recipe that templates one of them writes to / reads from / splices in the
  literal `{{ … }}` text and exits 0. Silent wrong output, verified live
  2026-07-25: `./{{ config_dir }}/service.json` on disk, exit 0, no warning.

  ── LANDING ORDER (ruled by the orchestrator, 2026-07-26) ───────────────────
  PLAN-ISSUE-079 lands FIRST; PLAN-ISSUE-080 rebases onto it afterward. Both
  reactive plans touch the same functions and the same implemented spec
  (SPEC-054), and TASK-008 below dispatches /spec — which ALLOCATES new CLM ids
  and bumps the spec version. 080's spec task must therefore read the POST-079
  spec or the two /spec dispatches collide on claim ids. Nothing in this plan
  changes because of the ruling; it is recorded here so the implementer does not
  re-litigate it, and 080's planner is instructed separately.

  ── BLAST RADIUS (reviewer-verified against the tree, do not re-derive) ──────
  Exactly two Substitute call sites exist in pkg/recipe/apply.go. Raw uses:
    * applyCreate      (apply.go:224, 229, 230, 252, 256, 258) — resolveUnder /
      targetExists / writeRendered / own.writtenNow key / recordWritten, all on
      the raw op.Target.
    * applyMerge       (apply.go:618, 644, 646, 654, 656) — raw op.Target, three
      lines from the correctly-substituted fragment. mergeFormatFor (apply.go:
      666-683) ALSO derives the format fallback from filepath.Ext(op.Target), so
      it must see the substituted target or a templated path yields the wrong
      format verdict.
    * applyInsert      (apply.go:445-478) — raw site.target (454), raw anchor
      match (464-466), and `content[:spliceAt] + op.Snippet + …` (470) splices
      the snippet verbatim.
    * applyTransform   (apply.go:496-526) — raw site.target (510) handed to the
      injected Dispatch.
    * siteFor          (apply.go:551-574) — produces target+anchor for insert AND
      transform in BOTH modes and substitutes neither half, so the sdlc-mediated
      InjectionSites override has the identical gap.
    * missingSite / injectionLimit (apply.go:582-604) relay op.Manual verbatim;
      the committed fixtures TEMPLATE their manual text.

  ── THE FIX ─────────────────────────────────────────────────────────────────
  Route every CONSUMER-FACING site/content field through
  Substitute(field, effectiveParams(...)) BEFORE it is used to resolve a path,
  match an anchor, or splice content. The substitution scope after this plan:

    SUBSTITUTED (consumer-facing — a project path, a match in the consumer's
    file, bytes written into the consumer's tree, or text shown to the operator):
      Op.Target   — every family (create / merge / transform / insert)
      Op.Anchor   — insert, including the sdlc-mediated supplied half
      Op.Snippet  — insert
      Op.Manual   — relayed operator instruction (see the Manual note below)
      payload / fragment CONTENT — already correct, unchanged

    NOT SUBSTITUTED:
      Op.Rule — pack-internal, allowlist-validated, authority-bearing (below).

    LEFT ALONE ENTIRELY BY THIS PLAN:
      Op.Payload / Op.Fragment — see the ISSUE-081 boundary below.

  ── RULE: THE EXPLICIT DECISION (contrary to the issue's "for symmetry") ────
  The issue's Expected section suggests substituting Op.Rule "for symmetry, since
  Rule is also a declared path." This plan DECLINES that and does NOT substitute
  Op.Rule. Two grounds, both from the shipped contract:

    1. Op.Rule is validated at PARSE time by exact string equality against the
       recipe's declared `transform_rules` allowlist (pkg/recipe/manifest.go:
       171-197: `if _, declared := declaredRules[op.Rule]; !declared { … }`).
       Substituting it at apply time would execute a rule path that is NOT the
       one validation approved — the declared-vs-executed correspondence the
       allowlist exists to guarantee would be broken by construction.
    2. Op.Rule selects which rewrite file an allowlisted engine runs IN PLACE
       over the consumer's tree (cmd/backstop/recipe_apply.go transformDispatch,
       `ast-grep scan --update-all …`). Substituting it hands a CONSUMER-supplied
       param authority over which pack asset gets executed. Params are inputs to
       the recipe's output, never a selector for the recipe's own code.

  Because Rule is deliberately excluded from substitution, a templated `rule:`
  could otherwise send a literal `{{` down to the engine. So Rule — and ONLY Rule
  — gains a fail-loud PARSE-TIME rejection of `{{` (TASK-006), naming the op and
  the field. That closes the excluded field's hole at the earliest point without
  giving params authority they should not have.

  ── ISSUE-081 BOUNDARY (ruled: do not pre-empt) ────────────────────────────
  Op.Payload and Op.Fragment are pack-relative source paths of the same class as
  Rule, and an earlier draft of this plan rejected `{{` in all three. That is
  DROPPED. Whether a payload/fragment may be templated — and whether `fragment:`
  may carry inline CONTENT at all rather than a path — is ISSUE-081's open
  question ("Recipe Authoring Surface Underspecified: Merge Fragment Form + No
  CLI Param Input"), and a parse-time rejection here would decide it silently
  and from the wrong plan. Rule is different only because its security case is
  airtight: the exact-match TransformRules cross-check plus the
  authority-escalation ground above.

  Two committed artifacts confirm the narrowing is required, not merely polite —
  both carry a templated INLINE fragment and both go red under the broad check,
  in nobody's file scope:
    * pkg/recipe/testdata/packs/demo-org/demo-pack/recipes/second/recipe.yml:6-9
      (TestResolveRef_ResolvesPinnedRecipe would fail);
    * pkg/recipe/manifest_test.go:37-38, the wellFormedRecipeYAML const
      (TestRecipeManifest_WellFormedValid would fatal).
  Verified under the NARROWED (rule-only) check that both survive untouched:
  `second` declares no transform op and therefore no `rule:` at all, and
  wellFormedRecipeYAML's `rule: rules/rename-key.yml` is literal. No repair task
  is needed, and no task in this plan may touch either file.

  ── MANUAL: the second explicit decision ───────────────────────────────────
  Op.Manual IS substituted, with a FAIL-SOFT fallback. It is operator-facing text
  telling a human what to type into their own file, and the committed fixtures
  template it (`Add "{{ app_name }}" to the "registrations" list…`) — relaying
  literal braces to the operator is the same defect class in the diagnostic
  channel. REQ-011's "verbatim" means the applier never composes, paraphrases or
  re-wraps the instruction; rendering the recipe author's own declared params is
  not composition. BUT: Manual is only ever emitted on an ERROR path, so a
  substitution failure there must NOT replace the operator's instruction with a
  substitution error — if Substitute fails on Manual, relay the RAW manual text.
  This is the one field where fail-loud is the wrong policy, and the reason is
  that the loud failure already happened.

  ── RESULT-PATH SEMANTICS (behavior-visible, decide it deliberately) ────────
  ApplyResult.Written and PreservedDivergence.Path today echo the RAW declared
  target ("so the result echoes the recipe's own paths rather than the applier's
  resolution of them", apply.go:89-98). After this fix they carry the SUBSTITUTED
  project-relative path — still the recipe's path form, never the applier's
  absolute resolution. Reporting `{{ config_dir }}/service.json` to an operator
  whose file landed at `config/service.json` is exactly the confusion the issue
  is about. Same for the `own.writtenNow` ownership key: it MUST key on the
  substituted path, because two ops templating differently can legitimately
  resolve to one file. This is a CONTRACT change, so it lands in three places
  together: the code, the apply.go:89-98 doc comment, and SPEC-054's ApplyResult
  contract entry + CLM-002 wording (TASK-008).

  ── FIXTURE STRATEGY (why Phase 1 adds rather than edits) ──────────────────
  The mandated regression is driving a COMMITTED, resolution-driven recipe
  through Apply end to end — templated `target:` on the create/merge/transform
  ops and a templated `snippet:` on the insert, the exact combination no existing
  test constructs.

  The obvious candidate, the committed `starter` recipe, cannot run all four
  families today: its merge op declares `fragment:` as INLINE JSON content while
  the shipped applier reads Fragment as a recipe-relative PATH
  (apply.go:628-635). That inline block is ISSUE-081's PRIMARY EVIDENCE ARTIFACT
  and is left BYTE-INTACT by this plan — no task may rewrite it, and this plan
  takes no position on whether the inline form should ever be accepted.

  So Phase 1 ADDS a sibling committed recipe (`templated-sites`) carrying the
  same templating shape with a fragment FILE, and TASK-002 drives BOTH:
    * `templated-sites` for the full four-family end-to-end proof;
    * the byte-intact `starter` for a partial proof that is strictly better than
      a comment — its create op runs FIRST, so the test asserts the templated
      create target resolved correctly and then asserts the apply halts at the
      merge op with the fragment-path error. The committed starter recipe finally
      gets driven through Apply (the issue's core complaint), ISSUE-081 gains a
      live falsifiable marker, and the evidence file is never touched.
  Adding to demo-pack's `recipes:` index is safe: no test asserts that index's
  contents (TestResolveRef_UndeclaredRecipeFailsLoud checks only the marker text
  and the requested id), and starter's pinned version 1.2.0 and op-id order are
  untouched.

  ── SCOPE BOUNDARIES ───────────────────────────────────────────────────────
    * No CLI --param flag, no payload/fragment form decision, no inline-fragment
      support (ISSUE-081 owns all three). The CLI e2e reproduces the live repro
      through a DEFAULTED param, exactly as the live repro did.
    * No change to the transform trust gate, engine selection, adoption record,
      merge semantics, or waiver adjudication.
    * No new language/tool knowledge anywhere — every path, anchor, snippet and
      rule still comes from the recipe as DATA.

  ── VERIFICATION COMMANDS (backstop code check does NOT exist) ─────────────
    middle: go test ./pkg/recipe/... ./cmd/backstop/... -race -count=1
    final:  go build -o bin/backstop ./cmd/backstop/   (REBUILD — a stale binary
            gates the old code)
            ./bin/backstop gate
            ./bin/backstop artifact validate --plan PLAN-ISSUE-079
            ./bin/backstop artifact validate --spec SPEC-054

  ── REQUIREMENTS / CLAIMS (plan-local, derived from the issue's Expected) ───
    REQ-001: Every consumer-facing site/content field is substituted BEFORE use.
      CLM-001  applyCreate substitutes Op.Target before resolveUnder /
               targetExists / writeRendered, and keys ownership + result paths on
               the SUBSTITUTED project-relative path.
      CLM-002  applyMerge substitutes Op.Target before resolution, read and
               write, and mergeFormatFor derives its extension fallback from the
               SUBSTITUTED target.
      CLM-003  applyInsert substitutes target, anchor AND snippet before the
               anchor match and the splice.
      CLM-004  applyTransform substitutes its target before resolution, stat and
               Dispatch.
      CLM-005  siteFor substitutes BOTH halves in BOTH modes, including a
               caller-supplied sdlc-mediated InjectionSites override.
      CLM-006  Op.Manual is substituted when relayed, and falls back to the RAW
               declared text if its own substitution fails.
    REQ-002: Fail loud; no literal placeholder ever reaches the filesystem.
      CLM-007  an undeclared placeholder in ANY substituted site/content field
               fails the apply with Substitute's unresolvable-placeholder error,
               wrapped by opFailure so it names the recipe, op index, id and
               kind — and nothing is written.
      CLM-008  INVARIANT: after a successful apply, no path written, read or
               created contains a `{{` segment anywhere beneath the project root.
    REQ-003: Op.Rule stays unsubstituted and untemplatable.
      CLM-009  Op.Rule is NOT substituted — Dispatch receives the declared,
               transform_rules-validated rule path resolved under PackDir.
      CLM-010  a placeholder in op.rule — and ONLY op.rule — is rejected at
               manifest validation, fail-loud, naming the op and the field;
               payload/fragment placeholders are untouched (ISSUE-081's call).
    REQ-004: Proven on the committed corpus AND through the shipped CLI.
      CLM-011  a committed, resolution-driven recipe applies end-to-end — all
               four executed op families, every templated site resolved — and the
               byte-intact `starter` recipe proves its templated create target
               resolves before halting at ISSUE-081's inline fragment.
      CLM-012  the shipped `backstop recipe apply` reproduces the live repro
               correctly: a DEFAULTED param resolves, the file lands at the real
               path, exit 0, and no literal-brace directory exists.
    REQ-005: The spec gap that let this through is closed.
      CLM-013  SPEC-054 gains a substitution-SCOPE table pinning which Op fields
               are substituted and which are not, with the Rule rationale, and
               its ApplyResult contract reflects the substituted result paths.

  Structure:
    Phase 1: Fixture precondition — ADD a runnable committed sibling recipe;
             starter stays byte-intact as ISSUE-081's evidence.
    Phase 2: TDD red — three parallel, file-disjoint failing test tasks
             (pkg apply substitution, rule-placeholder validation, CLI e2e).
    Phase 3: TDD green — two parallel implementation tasks (apply.go, manifest.go)
             + package verification.
    Phase 4: Spec reconciliation (substitution-scope table + result-path contract
             via /spec) + comprehensive verification (rebuilt binary, gate,
             artifact validate).

phases:
