          Mandated test name (exact):
            - TestParseRecipeManifest_TemplatedTransformRuleFailsLoud

          Cases:
            * REJECT: a transform op whose `rule` is "rules/{{ variant }}.yml",
              with transform_rules declaring that SAME literal string — so the
              case fails on the placeholder check and NOT on the pre-existing
              allowlist check. That ordering is the point of the case. Assert the
              error names the op INDEX, the op ID and the FIELD (`rule`) — a
              generic "invalid op" tells a pack author nothing.
            * ACCEPT (the scope guard, and the reason this test is narrow): the
              SAME manifest with a literal `rule:` but a templated `payload:` and
              a templated `fragment:` parses CLEANLY. Payload/fragment templating
              is ISSUE-081's open question and this plan must not decide it. This
              case FAILS if someone widens the check, which is exactly what it is
              for.
            * ACCEPT: a fully literal manifest still parses cleanly, so a check
              that rejected every rule path could not look green.

          Reuse the existing inline-manifest style of manifest_opchecks_test.go.
          Do NOT modify pkg/recipe/manifest.go in this task, and do NOT touch
          pkg/recipe/manifest_test.go or
          testdata/packs/demo-org/demo-pack/recipes/second/recipe.yml — both carry
          templated inline fragments that the narrowed check leaves valid
          (verified: `second` declares no transform op at all, and
          wellFormedRecipeYAML's rule is literal).
        files:
          - pkg/recipe/manifest_ruleplaceholder_test.go
        claims:
          - CLM-010
        test_names:
