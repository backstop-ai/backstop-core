  # ═══════════════════════════════════════════════════════════════════════
  # Phase 3: TDD green — the two production changes (parallel) + verification
  # ═══════════════════════════════════════════════════════════════════════
  - id: phase-3
    name: "Phase 3: TDD Green — Substitute Every Consumer-Facing Site/Content Field; Refuse a Templated Rule"
    tasks:
      - id: TASK-005
        type: implementation
        title: "pkg/recipe/apply.go — route target/anchor/snippet/manual through Substitute before path resolution, anchor match and splice"
        description: |
          Make TASK-002's and TASK-004's tests pass. One narrow, general change —
          no op family gets a special case, and no language/tool noun appears.

          Add ONE helper next to the existing renderPayload, so every field goes
          through the same door and a future field cannot be added without it:

              func substituteField(field string, label string, params map[string]string) (string, error)

          returning a wrapped error naming the FIELD (e.g. `substitute declared
          target %q: %w`) so the diagnostic says which declaration was bad.

          Wire it in:
            * applyCreate (apply.go:223-261) — substitute op.Target ONCE at the
              top; use that value for resolveUnder, targetExists, writeRendered,
              the own.writtenNow key, recordWritten, and the PreservedDivergence
              path. Thread the substituted value into preserveOrRegenerate
              (apply.go:266-302) too — its three PreservedDivergence{Path:
              op.Target} constructions and its error messages must report the
              substituted path.
            * applyMerge (apply.go:617-661) — substitute op.Target at the top and
              use it for resolveUnder, both reads, the write, recordWritten, and
              the error messages. Change mergeFormatFor to take the SUBSTITUTED
              target (apply.go:666-683 currently derives the extension fallback
              from op.Target); keep it checking the format BEFORE the fragment is
              read, exactly as today.
            * siteFor (apply.go:551-574) — substitute BOTH halves and return an
              error: `func siteFor(op Op, opts ApplyOptions, params map[string]string) (injectionSite, error)`.
              Substitute the recipe-declared target/anchor AND the sdlc-mediated
              supplied override (both halves of the "<target>#<anchor>" form),
              so the override closes the same gap. Split on the separator BEFORE
              substituting so a substituted value containing "#" cannot be
              re-split — the grammar is core-owned and applies to the DECLARED
              text, not to param values.
            * applyInsert (apply.go:445-478) — take params, propagate siteFor's
              error, and substitute op.Snippet before the splice. Keep the
              empty-half checks and the anchor-absent injectionLimit exactly as
              they are, reporting the SUBSTITUTED site.
            * applyTransform (apply.go:496-526) — take params, propagate siteFor's
              error, substitute the target before resolveUnder/stat/Dispatch.
              LEAVE op.Rule RAW: `resolveUnder(resolved.PackDir, op.Rule)` is
              unchanged. Add a short comment stating WHY (parse-time
              transform_rules allowlist validated by string equality; a consumer
              param must not select which pack asset an allowlisted engine
              executes) so the asymmetry is not "cleaned up" later.
            * missingSite / injectionLimit (apply.go:582-604) — substitute
              op.Manual before relaying it, and on a substitution FAILURE relay
              the RAW manual text unchanged. The manual is emitted only on an
              error path; losing the operator's instruction to a second error is
              worse than literal braces.
            * Apply (apply.go:134-157) — pass `params` to applyInsert (it takes
              none today) and to applyTransform.

          Update the doc comments that this changes the meaning of: ApplyResult
          (apply.go:89-98) and applyCreate (apply.go:204-222) both currently say
          the result echoes the RAW recipe-declared target; they now carry the
          SUBSTITUTED project-relative path (still the recipe's path form, never
          the applier's absolute resolution). TASK-008 makes the matching change
          in SPEC-054's contract entry — the code comment and the spec must not
          drift apart.

          Do NOT touch pkg/recipe/manifest.go (TASK-006 owns it), Substitute
          itself, the merge/deep-merge semantics, the waiver adjudication, or the
          adoption record.

          Run `go test ./pkg/recipe/... ./cmd/backstop/... -race -count=1` and
          confirm the previously-failing tests are green and nothing regressed.
        files:
          - pkg/recipe/apply.go
        claims:
          - CLM-001
          - CLM-002
          - CLM-003
          - CLM-004
          - CLM-005
          - CLM-006
          - CLM-007
          - CLM-008
          - CLM-009
          - CLM-011
          - CLM-012
        depends_on:
          - TASK-002
          - TASK-004

      - id: TASK-006
        type: implementation
        title: "pkg/recipe/manifest.go — reject a placeholder in `rule:` at parse time (rule ONLY)"
        description: |
          Make TASK-003's test pass. In validateRecipeOps (manifest.go:167-201),
          for a transform op, reject a `{{` appearing in op.Rule with a fail-loud
          error naming the op index, the op id and the FIELD. Check it BEFORE the
          existing transform_rules allowlist check so a templated rule reports the
          real cause rather than "not among the declared transform_rules".

          Key the check on the placeholder OPEN delimiter already declared in
          substitute.go (placeholderOpen) — do not retype "{{" as a second
          literal, so the two files cannot drift.

          SCOPE — `rule:` ONLY. Do NOT extend this to op.Payload or op.Fragment.
          Whether those may be templated (and whether `fragment:` may carry inline
          content at all) is ISSUE-081's open question, and deciding it from this
          plan would both pre-empt that issue and break two committed artifacts
          nobody here owns: recipes/second/recipe.yml:6-9 and
          manifest_test.go:37-38's wellFormedRecipeYAML const both declare a
          templated INLINE fragment. Verified that both remain valid under the
          rule-only check (`second` declares no transform op; wellFormedRecipeYAML's
          rule is literal) — so neither file is touched by this plan, and TASK-003's
          ACCEPT case guards that boundary.

          Why rule and nothing else: op.Rule is validated here by exact string
          equality against the declared transform_rules allowlist, and it selects
          which rewrite file an allowlisted engine executes in place over the
          consumer's tree — a consumer param must not have that authority (see the
          plan notes' "RULE: THE EXPLICIT DECISION"). Refusing a templated rule at
          parse closes the one field substitution deliberately skips.

          Keep the message shaped like the surrounding op-check errors (label,
          ops[i], id, then the specific problem). Do NOT touch pkg/recipe/apply.go
          (TASK-005 owns it) and do NOT relax any existing op check.
        files:
          - pkg/recipe/manifest.go
        claims:
          - CLM-010
        depends_on:
          - TASK-001
          - TASK-003

      - id: TASK-007
        type: verification
        title: "Package verification — the recipe package and the CLI recipe-apply suites green under race"
        description: |
          Run:

            go test ./pkg/recipe/... ./cmd/backstop/... -race -count=1

          Confirm:
            * all seven TASK-002 tests, TASK-003's manifest test and TASK-004's CLI
              e2e now PASS (they failed before TASK-005/TASK-006);
            * every pre-existing pkg/recipe suite still passes — in particular the
              parse/resolve tests over the demo pack TASK-001 extended
              (TestRecipeDir_ParsesColocatedManifestAndPayload,
              TestResolveRef_*), TestRecipeManifest_WellFormedValid and the
              manifest op-check suites (the two templated-inline-fragment
              artifacts the narrowed rule-only check must leave valid), the merge
              suites, the mode suites, and the committed CLI e2e trust-gate tests
              (TestRecipeApply_E2E_RealEngineTransform_CapturedFixture,
              TestRecipeApply_CLI_*);
            * the three mandated SPEC-054 substitution tests
              (TestSubstitute_ResolvesDeclaredParam,
              TestSubstitute_NotTuringComplete_NoLogicEvaluated,
              TestSubstitute_UndeclaredParamFailsLoud) still pass — Substitute
              itself is unchanged.

          If anything fails, fix it in the owning task's files and re-run. Do NOT
          weaken or delete an assertion to get green. `backstop code check` does
          not exist — do not invent it.
        files:
          - pkg/recipe/apply.go
          - pkg/recipe/manifest.go
          - pkg/recipe/apply_substitution_test.go
          - pkg/recipe/manifest_ruleplaceholder_test.go
          - cmd/backstop/recipe_apply_substitution_e2e_test.go
        claims:
          - CLM-007
          - CLM-008
          - CLM-010
          - CLM-011
          - CLM-012
        depends_on:
          - TASK-005
          - TASK-006

  # ═══════════════════════════════════════════════════════════════════════
  # Phase 4: Spec reconciliation + comprehensive verification
  # ═══════════════════════════════════════════════════════════════════════
  - id: phase-4
    name: "Phase 4: SPEC-054 Substitution-Scope Table + Result-Path Contract + Comprehensive Gate Verification"
    tasks:
      - id: TASK-008
        type: documentation
        title: "SPEC-054 — add the substitution-SCOPE table and reconcile the ApplyResult result-path contract"
        description: |
          The issue names a contributing spec gap: SPEC-054's "Substitution
          (REQ-002)" section (specs/SPEC-054-recipe-apply-and-manifest.spec.md
          ~873-881) pins the substitution SEMANTICS (declared params only, not
          Turing-complete, undeclared fails loud) but never pins the SCOPE — which
          Op fields are resolved. The spec's own fixture corpus implied targets and
          snippets were in scope; the implementation disagreed, and nothing caught
          it. SPEC-054 is `implemented`, so this is a reconciliation of a shipped
          spec to shipped behavior, not new scope.

          LANDING ORDER: this /spec dispatch runs BEFORE PLAN-ISSUE-080's, per the
          orchestrator's ruling — it allocates new CLM ids and bumps the spec
          version, and 080 rebases onto the result.

          ROUTE THIS THROUGH THE SPEC AGENT — do NOT hand-edit the spec file
          (CLAUDE.md: never hand-edit artifacts). Dispatch /spec (spec-author)
          with these instructions:

            * Add a substitution-SCOPE table to the "Substitution (REQ-002)"
              section, in the same style as the existing kind /
              reference-resolution / manifest-validation matrices, with one row
              per Op field:
                Op.Target (create/merge/transform/insert) — SUBSTITUTED
                Op.Anchor (insert, incl. the sdlc-mediated supplied half) — SUBSTITUTED
                Op.Snippet (insert) — SUBSTITUTED
                Op.Manual (relayed instruction) — SUBSTITUTED, fail-soft to raw
                payload / fragment CONTENT — SUBSTITUTED (already true)
                Op.Rule — NOT substituted; a placeholder in it is refused at
                  manifest validation.
              Op.Payload and Op.Fragment as PATHS are deliberately OUT OF SCOPE of
              this table — their form and templatability are ISSUE-081's open
              question. Say so explicitly in one line rather than leaving a silent
              gap, so the next reader knows the omission is a decision.
            * State the Rule rationale in prose next to the table: the rule path
              is validated at parse by exact string equality against the declared
              transform_rules allowlist, and it selects which pack asset an
              allowlisted engine executes in place over the consumer's tree — a
              consumer param must not carry that authority.
            * RESULT-PATH CONTRACT (a behavior change shipping in the same
              commit, so the spec must move with it):
                - update the ApplyResult contract entry (~spec:690) so Written and
                  PreservedDivergence.Path are documented as carrying the
                  SUBSTITUTED project-relative target — still the recipe's path
                  form, never the applier's absolute resolution;
                - CLM-002's wording ("writes exactly at the recipe-declared
                  target") needs the substituted-form clarification: the declared
                  target AFTER param substitution is what is written, and that is
                  what the result echoes;
                - note that pkg/recipe/apply.go's ApplyResult doc comment
                  (apply.go:89-98) is updated in the same change by TASK-005, so
                  the two statements of the contract stay aligned.
            * Add claims covering the scope: a site field templated in a recipe
              resolves through Apply (not merely through Substitute); a
              placeholder in `rule:` is refused at parse; and the
              no-literal-placeholder-on-the-filesystem invariant. Mandate the
              test names this plan delivers —
              TestApply_CommittedFixtureRecipe_SubstitutesEveryTemplatedSite,
              TestApply_CommittedStarterRecipe_SubstitutesCreateTargetThenHaltsOnInlineFragment,
              TestApply_NoLiteralPlaceholderReachesTheFilesystem,
              TestApply_UndeclaredPlaceholderInSiteFieldFailsLoud,
              TestApply_SDLCMediatedMode_SuppliedInjectionSiteIsSubstituted,
              TestApply_TransformOp_DeclaredRuleIsNotSubstituted,
              TestApply_InjectionLimit_RelaysSubstitutedManualFailingSoftToRaw,
              TestParseRecipeManifest_TemplatedTransformRuleFailsLoud,
              TestRecipeApply_CLI_TemplatedTargetWritesAtTheSubstitutedPath —
              so the traceability dimensions bind the spec to the delivered tests.
            * Note in the spec's version history that the existing CLM-012/013/014
              tests are Substitute-DIRECT and therefore cannot prove applier
              scope; the new claims are the Apply-level obligation.
            * Bump the spec version per the spec agent's own convention and keep
              status `implemented` (this reconciles the spec to behavior that
              ships in the same change).

          Do not restate the fix in the spec as a plan; the spec declares the
          contract, this plan delivers it.
        files:
          - specs/SPEC-054-recipe-apply-and-manifest.spec.md
        claims:
          - CLM-013
        depends_on:
          - TASK-007

      - id: TASK-009
        type: verification
        title: "Comprehensive verification — rebuilt binary, full gate kill chain, artifact validation"
        description: |
          Final verification over BOTH work categories this plan touched: Go code
          and artifacts.

          1. REBUILD the binary first — a stale ./bin/backstop gates the OLD code
             and would report a vacuous green:

               go build -o bin/backstop ./cmd/backstop/

          2. Full kill chain:

               ./bin/backstop gate

             Every dimension, no filtering, no per-dimension selection. Fix real
             violations in the owning task's files; do not waive, do not
             baseline, and do not scope the run down. Violations in files THIS
             change touched must be fixed outright (you-touch-it-you-fix-it) —
             no grandfathering on changed files.

          3. Artifact validation for the artifacts this plan touched:

               ./bin/backstop artifact validate --plan PLAN-ISSUE-079
               ./bin/backstop artifact validate --spec SPEC-054

             Both must pass. If TASK-008's spec edit broke schema conformance,
             route the correction back through /spec — never hand-edit the spec
             to satisfy the validator.

          4. Confirm the delivered evidence one last time, since this defect was
             silent-wrong-output rather than a crash: re-read the CLI e2e output
             and confirm no `{{`-bearing path exists in the staged project after
             a successful apply. A green suite that never walked the filesystem
             is what shipped this bug.

          5. Confirm the ISSUE-081 boundary artifacts are untouched by the whole
             change: `git diff` must show NO modification to
             pkg/recipe/testdata/packs/demo-org/demo-pack/recipes/starter/recipe.yml,
             recipes/second/recipe.yml, or pkg/recipe/manifest_test.go.

          Report the actual command output. Do not assert a pass you did not run.
        files:
          - pkg/recipe/apply.go
          - pkg/recipe/manifest.go
          - cmd/backstop/recipe_apply_substitution_e2e_test.go
          - specs/SPEC-054-recipe-apply-and-manifest.spec.md
        claims:
          - CLM-008
          - CLM-010
          - CLM-011
          - CLM-012
          - CLM-013
        depends_on:
          - TASK-005
          - TASK-006
          - TASK-008
