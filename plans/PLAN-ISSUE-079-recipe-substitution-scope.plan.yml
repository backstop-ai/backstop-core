      - id: TASK-003
        type: test
        title: "Failing manifest-validation test: a placeholder in `rule:` — and only `rule:` — is rejected at parse"
        description: |
          Add pkg/recipe/manifest_ruleplaceholder_test.go pinning the OTHER half
          of the invariant: Op.Rule is deliberately NOT substituted (see the plan
          notes' Rule decision), so a templated rule must be refused at PARSE time
          rather than silently resolving a brace-bearing path into an engine
