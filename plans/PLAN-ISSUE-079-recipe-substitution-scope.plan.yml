        depends_on: []

  # ═══════════════════════════════════════════════════════════════════════
  # Phase 2: TDD red — three parallel, file-disjoint failing test tasks
  # ═══════════════════════════════════════════════════════════════════════
  - id: phase-2
    name: "Phase 2: TDD Red — Failing Substitution-Scope Tests (package, manifest, CLI)"
    tasks:
      - id: TASK-002
        type: test
        title: "Failing pkg/recipe tests: committed-fixture end-to-end, the no-literal-braces invariant, fail-loud, sdlc-mediated override, Rule-not-substituted, Manual fail-soft"
        description: |
          Add pkg/recipe/apply_substitution_test.go. Every test drives the REAL
          Apply — no test may assert against Substitute() directly, because
          Substitute-direct testing is exactly what let this defect ship (the
          three mandated CLM-012/013/014 tests in substitute_test.go all pass
          today while the applier is broken).

          Reuse the package's existing helpers rather than re-declaring them:
          loadFixtureCorpus (resolve_test.go:22), ResolveRecipe,
          resolvedFromManifest / writeUnder (apply_core_test.go:83, 99).

          Mandated test names (exact):

            - TestApply_CommittedFixtureRecipe_SubstitutesEveryTemplatedSite
              (CLM-001..CLM-004, CLM-009, CLM-011) — THE crux regression.
              Resolve TASK-001's committed recipe via loadFixtureCorpus +
              ParseRecipeRef("<fixture pack>:templated-sites@1.0.0") +
              ResolveRecipe — never re-typed inline, so the test cannot drift from
              the fixture. Stage a temp project root, seed the merge/insert target
              `config/settings.json` with a document containing the declared
              anchor `"registrations": [`. Apply in ModeDirect with
              Params{"app_name": …} (app_name is required with NO default;
              config_dir defaults to "config") and an injected Dispatch that
              RECORDS the (rule, target) pair it was handed.
              Assert, reading the expected values back off the PARSED manifest
              (op.Target rendered through Substitute with the same params) rather
              than hardcoding them:
                * the create op wrote `<root>/config/app.config.json`, and its
                  substituted payload content is intact;
                * the merge op merged into `<root>/config/settings.json` with
                  `adopted_by` = the supplied app_name (fragment-content
                  substitution still works) and the seeded siblings preserved;
                * the insert op spliced the SUBSTITUTED snippet — the literal
                  app_name value, NOT `{{ app_name }}` — immediately after the
                  anchor in that same file;
                * the transform op's Dispatch received target
                  `<root>/config/app.config.json` AND the declared rule path
                  resolved under PackDir UNCHANGED — the Rule-not-substituted
                  assertion (CLM-009);
                * ApplyResult.Written carries the SUBSTITUTED project-relative
                  paths (`config/app.config.json`, `config/settings.json`), never
                  a `{{`-bearing string;
                * the step op executed nothing and did not break the sequence.
              This test FAILS today at the first assertion (the create lands at
              `<root>/{{ config_dir }}/app.config.json`).

            - TestApply_CommittedStarterRecipe_SubstitutesCreateTargetThenHaltsOnInlineFragment
              (CLM-001, CLM-011) — drives the BYTE-INTACT committed `starter`
              recipe (`<fixture pack>:starter@1.2.0`) through Apply. Its create op
              runs FIRST, so assert: `<root>/config/app.config.json` exists (the
              templated create target resolved) and no `{{ config_dir }}`
              directory was created; THEN assert Apply returned an error
              identifying the merge op and its unreadable declared fragment.
              This is the recipe the issue names as never having been driven
              through Apply — now it is — and the halt is ISSUE-081's evidence
              pinned as a live, falsifiable marker instead of a comment. Reference
              ISSUE-081 in the test doc comment so whoever fixes the fragment form
              knows this assertion is theirs to update.

            - TestApply_NoLiteralPlaceholderReachesTheFilesystem (CLM-008) —
              the invariant, and the one that would have caught the live repro
              generically. After a successful apply of TASK-001's fixture,
              filepath.WalkDir the whole project root and FAIL if ANY path
              segment of ANY entry contains "{{" or "}}". Assert on the walk, not
              on a known-good path list, so a future op family that forgets
              substitution is caught without anyone remembering to update a list.

            - TestApply_UndeclaredPlaceholderInSiteFieldFailsLoud (CLM-007) —
              table-driven over the four substituted field positions, each built
              inline via resolvedFromManifest so the failure is isolated:
              a create `target`, a merge `target`, an insert `anchor`, and an
              insert `snippet`, each carrying `{{ nope }}` with no such declared
              param. For every case assert: Apply returns a non-nil error whose
              message contains Substitute's "unresolvable placeholder" text AND
              the offending param name AND — via opFailure — the recipe ref, the
              op index and the op id; AND that the project root is UNCHANGED
              (nothing written, no `{{`-named file created). A partially-applied
              failure is as bad as a silent success.

            - TestApply_SDLCMediatedMode_SuppliedInjectionSiteIsSubstituted
              (CLM-005) — an insert op in ModeSDLCMediated whose
              InjectionSites[op-id] supplies a TEMPLATED value in the
              "<target>#<anchor>" form (both halves templated, using params the
              recipe declares). Assert the write lands at the substituted target
              and splices at the substituted anchor. Falsifier: also assert the
              DECLARED target was not written, so an applier that ignored the
              override cannot pass. This is the gap the issue calls out at
              siteFor — it is reachable only through the override, so it needs
              its own test.

            - TestApply_TransformOp_DeclaredRuleIsNotSubstituted (CLM-009) — an
              inline transform recipe whose `rule` is a plain declared path (also
              listed in transform_rules) and whose `target` IS templated. Assert
              the injected Dispatch received the substituted target and the
              byte-identical declared rule path resolved under PackDir. Guards
              the deliberate asymmetry against a future "fix" that substitutes
              everything uniformly.

            - TestApply_InjectionLimit_RelaysSubstitutedManualFailingSoftToRaw
              (CLM-006) — two cases on the injection-limit error path, where
              op.Manual is relayed:
                (a) an insert whose anchor is ABSENT from the target and whose
                    `manual` templates a DECLARED param (as the committed fixtures
                    do): assert the returned error carries the manual with the
                    param RESOLVED and contains no `{{`;
                (b) the same, but the manual templates an UNDECLARED param:
                    assert the error still carries the RAW manual text verbatim
                    and still identifies the unreachable site — the operator's
                    instruction must never be replaced by a substitution error on
                    a path that is already reporting a failure.
              Case (b) is the falsifier for a naive "substitute everything
              fail-loud" implementation.

          Do NOT modify pkg/recipe/apply.go or manifest.go in this task, and do
          NOT touch recipes/starter/recipe.yml.
        files:
          - pkg/recipe/apply_substitution_test.go
        claims:
