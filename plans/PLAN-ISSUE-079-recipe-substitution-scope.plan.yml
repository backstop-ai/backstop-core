  # Phase 1: Fixture precondition — a runnable committed recipe, added not edited
  # ═══════════════════════════════════════════════════════════════════════
  - id: phase-1
    name: "Phase 1: Fixture Precondition — Add a Runnable Committed Recipe Beside the Untouched starter Evidence"
    tasks:
      - id: TASK-001
        type: setup
        title: "Add the committed `templated-sites` demo recipe: templated targets on three families, templated snippet and manual, fragment as a FILE"
        description: |
          TASK-002's end-to-end regression needs a COMMITTED, resolution-driven
          recipe it can actually run. The existing `starter` recipe cannot run all
          four families: its merge op declares `fragment:` as INLINE content while
          applyMerge (apply.go:628-635) reads Fragment as a recipe-relative PATH.

          DO NOT EDIT recipes/starter/recipe.yml. Its inline fragment block is
          ISSUE-081's primary evidence artifact and must stay byte-intact —
          TASK-002 drives it as-is to pin that evidence as a live regression
          marker. This plan takes no position on the inline form.

          Instead ADD a sibling recipe to the same committed demo pack:

            1. pkg/recipe/testdata/packs/demo-org/demo-pack/pack.yml — add ONE
               index line: `templated-sites: recipes/templated-sites`. Change
               nothing else in that file. (Safe: no test asserts the index's
               contents — TestResolveRef_UndeclaredRecipeFailsLoud checks only the
               marker wording and the requested id.)
            2. recipes/templated-sites/recipe.yml — kind: scaffolding,
               version: 1.0.0, params `app_name` (required, NO default) and
               `config_dir` (required:false, default: config), a transform_rules
               entry, and FIVE ops in declared order mirroring starter's shape:
                 * create  `{{ config_dir }}/app.config.json` from
                   payload/app.config.json
                 * merge   `{{ config_dir }}/settings.json`, format json,
                   fragment payload/settings.fragment.json  ← a FILE, the shipped
                   contract, which is the whole reason this recipe exists
                 * transform `{{ config_dir }}/app.config.json` with a LITERAL
                   (never templated) rule path also listed in transform_rules,
                   and a manual that TEMPLATES `{{ app_name }}`
                 * insert  `{{ config_dir }}/settings.json`, anchor
                   `"registrations": [`, snippet `"{{ app_name }}"`, manual
                   templating `{{ app_name }}`
                 * a step op (reserved, not executed) so the sequence-position
                   behavior is exercised
            3. recipes/templated-sites/payload/app.config.json — the create
               payload; keep starter's markers (`legacy_name`, `{{ app_name }}`,
               `registrations`) so the payload-content substitution path is
               exercised alongside the site fields.
            4. recipes/templated-sites/payload/settings.fragment.json —
               `{"adopted_by": "{{ app_name }}"}`.

          Do NOT create the transform rule FILE. Verified empirically:
          applyTransform resolves the rule path under PackDir but never stats it
          (apply.go:506-521 stats the TARGET only), and the dispatch is injected in
          tests — so an absent rule file is correct here and adding one would be
          dead fixture.

          Confirm the existing parse/resolve suites still pass before handing off:
            go test ./pkg/recipe/... -race -count=1 -run "TestRecipeDir|TestResolveRef|TestRecipeManifest|TestParseRecipeManifest"
        files:
