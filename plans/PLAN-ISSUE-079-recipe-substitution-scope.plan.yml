          - pkg/recipe/testdata/packs/demo-org/demo-pack/recipes/templated-sites/recipe.yml
          - pkg/recipe/testdata/packs/demo-org/demo-pack/recipes/templated-sites/payload/app.config.json
          - pkg/recipe/testdata/packs/demo-org/demo-pack/recipes/templated-sites/payload/settings.fragment.json
        claims:
