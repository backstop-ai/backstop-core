          Then read the delivered diff as a fence check (CLM-007). Require
          modifications confined to scripts/sitecheck/inventory.go,
          scripts/sitecheck/inventory_test.go, and
          .backstop/seed4-delivery-inventory.yml, plus the committed ISSUE-191/
          PLAN-ISSUE-191 artifacts themselves. Confirm `.cursor/Dockerfile`,
          `.cursor/environment.json`, `.cursor/install.sh`, the other sitecheck
          verifiers, `.github/workflows/pages.yml`,
          `.github/workflows/site-verification.yml`, `scripts/verify-public-site.sh`,
          and the public-site content are unchanged; confirm `allowedRoles()` gained
          exactly one key, `expectedRole()` gained exactly one prefix case plus two
          exact paths on the existing governance case, and the inventory gained
          exactly five rows with no existing row altered.

          Report inherited or unrelated failures truthfully rather than absorbing
          them into this lane, and do not obtain green with a waiver, suppression,
          baseline change, skipped test, or any widening of the closed-matrix
          philosophy.
        files:
