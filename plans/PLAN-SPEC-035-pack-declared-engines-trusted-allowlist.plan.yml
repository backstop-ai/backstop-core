        type: implementation
        title: "Implement OQ-1 disposition (default: option i incremental fallback)"
        description: |
          Per the user's OQ-1 selection:
            - OPTION (i) DEFAULT: keep DefaultRegistry() as the fallback the stage-1
              merge overrides/extends; keep DefaultFieldContracts() + engineFieldClaim
              as the baked default a pack-declared field-contract overrides for the
              same engine name. New code: the override/precedence wiring so a pack-
              declared binding/contract wins over the same-named default, while
              built-ins stay available (CLM-027/CLM-037), and the allowlist gates the
              built-in tool the same as any (CLM-028).
            - OPTION (ii): this task instead becomes a refactor/deletion of
              DefaultRegistry()/DefaultFieldContracts() with the built-ins shipped as
              a default pack — same claims, same gate.
          Make TASK-032 green. The merge semantics (Phase 4) and allowlist gate
          (Phase 2/4) are UNCHANGED — this only decides where built-in bindings live.
