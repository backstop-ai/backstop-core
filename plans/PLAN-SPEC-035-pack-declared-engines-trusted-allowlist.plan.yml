  # ═══════════════════════════════════════════════════════════════════════
  - id: phase-6
    name: "Phase 6 (OQ-1 fork): DefaultRegistry + FieldContract Disposition"
    description: |
      Resolve OQ-1: migrate the seven built-in bindings (and the name-keyed
      DefaultFieldContracts/engineFieldClaim) per the user's selected option. The
      INVARIANTS the claims assert (the built-ins remain available to dispatch, and
      the allowlist gates a built-in tool exactly as a pack-declared tool) hold under
      EITHER option — the tests assert the invariant, not the binding source. Option
      (i): keep DefaultRegistry as the incremental fallback the merge overrides, and
      keep DefaultFieldContracts as the default a declared contract overrides. Option
      (ii): delete both and ship a default pack. THIS PHASE IS BLOCKED until the user
      selects an option.
    tasks:
      - id: TASK-032
        type: test
        title: "Write DefaultRegistry-migration invariant tests (option-agnostic)"
        description: |
          pkg/pack/engine/migration_test.go (+ cmd/backstop coverage):
            - TestMigration_BuiltinBindingsRemainAvailable: under the resolved merge
              semantics, the built-in bindings (commands + pinned versions) are
              available to dispatch — whether sourced from DefaultRegistry fallback
              (i) or a default pack (ii) — so go-toolchain/go-standards rules still
              dispatch (CLM-027).
            - TestMigration_AllowlistAppliesToBuiltinBindingsToo: the allowlist trust
              gate applies to a built-in/fallback binding's tool exactly as to a
              pack-declared binding's tool — the allowlist is the trust floor
              regardless of source (CLM-028).
            - TestFieldContract_DefaultsFollowRegistryDisposition:
              DefaultFieldContracts() + the name-keyed engineFieldClaim CLM-id map
              travel under the SAME OQ-1 disposition as DefaultRegistry — a pack-
              declared field-contract overrides the baked default for the same engine
              name (i), or they are eradicated into default-pack data (ii); not an
              independent unscoped baked map (CLM-037).
          These assert INVARIANTS that hold under either option. Red first.
        files:
          - pkg/pack/engine/migration_test.go
          - cmd/backstop/migration_test.go
        claims:
