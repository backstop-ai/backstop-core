  # Phase 6: DefaultRegistry / DefaultFieldContracts migration — OQ-1 FORK
  # *** BLOCKED ON USER OQ-1 SELECTION. Do not start without it. ***
  # Default tasks below describe option (i) incremental fallback. Under option
  # (ii) the impl/refactor tasks swap to DELETING DefaultRegistry()/
