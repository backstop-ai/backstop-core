        type: verification
        title: "Run full gate and validate the plan artifact for the absence-contract capability"
        description: |
          Final comprehensive verification of the whole change set:
            - `backstop gate` — the full kill chain (artifact validation, code
              check, test verification, substantiveness, coverage, contracts) over
              the modified pkg/gate files and tests, confirming the absence branch,
              parser passthrough, and present-path no-regression are all green and
