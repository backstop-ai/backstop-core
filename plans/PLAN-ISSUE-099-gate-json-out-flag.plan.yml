          Route any issue edit through the issue-authoring agent; never hand-edit an
          artifact's frontmatter.

          ── (2) RECONCILE DIR-024 ───────────────────────────────────────────────
          `directives/DIR-024-gate-engine-quality.directive.md` — THE EIGHTH
          SITE, and the one the CLM-008 sweep structurally cannot see because it is not
          a code file. DIR-024 is `status: active` and lists ISSUE-099 in its
