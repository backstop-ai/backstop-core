      - id: TASK-008
        type: verification
        title: "Validate this lane's artifacts and reconcile ISSUE-099 and DIR-024 to what shipped"
        description: |
          ★ ORDER IS PART OF THIS TASK: MUTATE FIRST, VALIDATE LAST. This task both
          CHANGES artifacts and VALIDATES them, and it is the plan's LAST task — nothing
          downstream re-checks it. A validate run before the reconciliation would assert
          the pre-mutation state and say nothing about what this task actually ships,
