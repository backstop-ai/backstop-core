             THE SWEEP, stated ONCE and run verbatim so it cannot drift into variants.
             ★ THE `-i` IS LOAD-BEARING, NOT HYGIENE:
               grep -rni "diagnostic\|invoked TWICE\|three members\|two invocations" \
                 workflows_test.go .gitignore cmd/backstop/ci_recipes_github_actions_test.go
             Without `-i` this returns 8 hits in TWO files and MISSES site (g)
