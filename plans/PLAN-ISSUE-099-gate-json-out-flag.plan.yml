          ── (4) VALIDATE, AFTER THE MUTATIONS ───────────────────────────────────
          Run and read — LAST, against the reconciled state, so the reading describes
          what this task shipped rather than what it inherited:

            backstop artifact validate --plan PLAN-ISSUE-099
            backstop artifact validate --issue ISSUE-099
            backstop artifact validate --directive DIR-024

          All three must pass clean. The `--directive` leg is not optional garnish:
