          Therefore, and this is PLAN-ISSUE-168's own stated rule for this exact file,
          adopted here verbatim rather than reinvented:
            * check `git status directives/` BEFORE routing anything. At THIS plan's
              authoring the file was CLEAN (the backlog-pm edit PLAN-ISSUE-168 recorded
