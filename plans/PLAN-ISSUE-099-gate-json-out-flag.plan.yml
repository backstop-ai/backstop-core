  ── DESIGN DECISIONS THIS LANE MAKES (the issue leaves them open) ────────────
  1. FLAG NAME: `--json-out`, taking a FILE path. NEVER `--json-file`
     (CLM-009 — the substring trap, sharp edge 2).
  2. FLAG INTERACTION: `--json` and `--json-out` are INDEPENDENT and COMBINABLE,
     with no precedence rule and no refusal (CLM-003). `--json` decides WHAT GOES TO
     STDOUT (the JSON document instead of the human table); `--json-out` ADDS a file
     destination and never changes stdout. `--json --json-out F` therefore emits the
     document twice, once to each destination, from ONE `FormatJSON` call — so the
     two are byte-identical by construction, not by coincidence (CLM-002).
     REJECTED: mutual exclusion (it would make the natural "give me both, and put
     the machine copy on disk" spelling an error for no reason) and "one wins"
     (an invisible precedence rule is exactly the undefined behaviour the founder
     asked to avoid).
  3. ERROR CLASS: every bad destination is a CONFIG-CLASS error — `&ExitCodeError{Code:
     ExitConfigError, ...}`, exit 2 — matching the established convention in this same
     function (`--file ""`, the mutual-exclusion refusals, and the unresolvable
     `--base`, all exit 2 with a `config: ` prefix). Exit 1 is reserved for "the gate
     found violations"; a destination the operator got wrong is never that.
     `ExitConfigError` outranking `ExitViolations` also matches `ExitWithResult`
     (`cmd/backstop/exitcode.go`), which is the repo's stated precedence.
  4. WHEN THE DESTINATION IS CHECKED — SPLIT, DELIBERATELY (CLM-006):
       * EMPTY value and MISSING PARENT DIRECTORY are refused EARLY, beside the
         existing `--file ""` refusal, BEFORE `ComputeGateScopeWithBase` and before
         `g.Run`. Rationale is the measured cost in the issue: a typo'd path that is
         only discovered after the kill chain costs ~21 minutes on this repo's CI
         (run 32151610956: pack_engines 629797ms, coverage_threshold 612148ms). A
         two-line preflight turns that into two seconds.
       * ANY OTHER write failure (target path is a directory, permission denied,
         a full disk) surfaces at EMIT time, AFTER the stdout surface has fully
         rendered. The stdout surface is the primary contract and is never suppressed
         by a secondary destination's failure; the run's verdict stays readable and
         the exit-2 diagnostic follows it on stderr.
       * The preflight deliberately checks ONLY that the parent directory exists.
         It does NOT create, truncate or touch the target — a preflight that opened
         the file would leave a zero-byte artifact behind on runs that die three
         steps later, which is a worse failure than the one it prevents. That split
         is what makes the target-is-a-directory case a real, deterministic vehicle
         for the late-failure test (sharp edge 6).
  5. PATH RESOLUTION: the value is resolved by the OS against the PROCESS working
     directory, like any file argument an operator types — NOT against the discovered
     project root. `DiscoverConfigPathFrom` walks UP, so a gate invoked from a
     subdirectory of the project has CWD != projectRoot, and that difference is
     directly testable (CLM-001, subtest (e)).
  6. NON-GOALS, stated so they are not re-litigated: `--json-out -` has no special
     stdout meaning (a file named `-` is a file); `--json-out` does not imply
     `--json`; no directory is ever created for the operator; the human-table bytes
     and the JSON document's CONTENT are unchanged — this lane adds a DESTINATION,
     not a format.

  ── CLAIM LEDGER (ISSUE-099 carries no CLM ids; this lane defines them) ───────
    CLM-001  `--json-out FILE` exists as a gate-LOCAL string flag registered in
             `newGateCommand` beside `--all` / `--file` / `--base`, and ONE invocation
             carrying it renders the HUMAN table to stdout AND writes the gate/v1 JSON
             envelope to FILE. Neither surface replaces the other: stdout carries the
             table and NO JSON document, and FILE parses as gate/v1 JSON. A relative
             value lands relative to the PROCESS working directory.
             Pre-fix: `unknown flag: --json-out`, exit 2 — MEASURED above.
    CLM-002  FILE receives EXACTLY the bytes `--json` writes to stdout —
             `gate.FormatJSON(result)` followed by one trailing newline — and both
             surfaces are renderings of ONE `GateResult` produced by ONE `g.Run`
             call. Falsified two ways: a SINGLE invocation carrying
             `--json --json-out F` in which F's bytes equal stdout's bytes exactly
             (a second kill-chain run could not produce two identical `generated_at`
             stamps and identical per-step `duration_ms` values), and an AST pin over
             `runGate` asserting exactly one `gate.New(` and exactly one `.Run(`.
    CLM-003  Flag interaction is DECIDED, TESTED and DOCUMENTED, never silent:
             `--json` and `--json-out` are independent and combinable; neither refuses
             the other; `--json-out` never alters what stdout receives; `--json` never
             alters what the file receives. Both flag help strings say so.
    CLM-004  THE FILE IS WRITTEN BEFORE THE PROCESS DECIDES ITS EXIT. A run whose
             verdict is `ExitViolations` still leaves a complete, parseable envelope at
             FILE. This is the property CI's `always()` artifact upload depends on and
             the sole reason the two-step split can retire at all.
    CLM-005  The exit code is decided by the gate verdict ALONE. Over one fixture
             project, `gate`, `gate --json`, `gate --json-out F` and
             `gate --json --json-out F2` all exit with the SAME code, and that shared
             code is non-zero (so the equality is not four vacuous passes).
    CLM-006  Bad destinations refuse LOUDLY as config-class errors (exit 2), never
             silently and never as a violation:
               (i)  an EMPTY `--json-out` value is refused BEFORE the kill chain runs,
               (ii) a MISSING PARENT DIRECTORY is refused BEFORE the kill chain runs,
               (iii) a write that fails at emit time (target path is a directory) exits
                     2 AFTER the human table has fully rendered to stdout.
             (i) and (ii) are proven early by the ABSENCE of the gate's own report from
             stdout; (iii) is proven late by its PRESENCE.
