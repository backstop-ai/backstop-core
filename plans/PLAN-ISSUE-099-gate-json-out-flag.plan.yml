  # Phase 3: GREEN — retire CI's duplicate invocation
  # ═══════════════════════════════════════════════════════════════════════════
  - id: phase-3
    name: "Phase 3: GREEN — collapse ci.yml's two gate steps into one"
    tasks:
      - id: TASK-005
        type: implementation
        title: "Merge the diagnostic capture into the blocking gate step via --json-out, and rewrite the rationale it leaves behind"
        description: |
          THIS TASK MUST LAND AFTER THE FLAG IS PROVEN, NOT MERELY WRITTEN.
          `--json-out` has to exist AND work in the binary ci.yml invokes, or the very
          next push to main fails on an unknown flag — with the gate job, which is the
          thing that would have caught it, being the job that breaks. The dependency
          edge on TASK-004 (phase 2's verification) rather than on TASK-003 alone is
          deliberate: it makes "the flag is green" a graph-enforced precondition of
          editing CI, not merely a consequence of phase ordering.

          (1) `.github/workflows/ci.yml`, job `gate` (display name "Backstop Gate").
          DELETE the step named `Capture the gate report as JSON (diagnostic only -
          does not gate)` in its entirety — the step, its `env:` block, its `run:` line
          with the `> gate-report.json || echo ...` redirect, and the comment block
          above it that opens "TWO STEPS, ONE GATE — and the split is structural on
          purpose." That comment exists ONLY to explain a split that no longer exists;
          leaving it would tell the next reader the opposite of the truth.

          EDIT the step named `Run the gate` so its script becomes exactly:
            ./bin/backstop gate --base "$BASE" --json-out gate-report.json
          UNCHANGED on that step: `id: run_gate` (the confirmation step's guard
          resolves `steps.run_gate.conclusion`, and a guard naming an id no step
          declares goes INERT rather than failing safe), the step-level
          `env: GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}`, and the absence of any `if:`
          or `||`.

          ★ RELOCATE THE STEP-LEVEL TOKEN RATIONALE ONTO THE SURVIVING STEP — it lives
          ENTIRELY on the step being deleted, and deleting it silently strips the only
          explanation in the file for a property a test enforces. The paragraph opens
          "THE TOKEN IS BOUND AT THE STEP, NOT AT THE JOB, and the difference is not
          cosmetic" and continues through "including the two remote installers that
          pipe `curl | sh` and run `pipx install` and the one that clones eight pack
          repositories. None of those needs it." MOVE it (substantively verbatim — it
          is correct and hard-won) onto `Run the gate`, adjusting only the sentence
          that says which step needs the token, since there is now one gate invocation
          rather than two.
          AND DELETE THE DANGLING BACK-REFERENCE the surviving step currently carries:
          "Same step-level token binding as the diagnostic capture above, and for the
          same reason: this invocation also runs resolveBaselineCache." After the
          collapse that sentence points at nothing. The relocated paragraph replaces
          it and must keep the actual reason it was pointing at — `backstop gate` runs
          the self-healing baseline pull, whose `ensureGitHubAuth` shells
          `gh auth status` before anything reaches the GitHub API (ISSUE-176).
          WHY THIS MATTERS ENOUGH TO BE ITS OWN INSTRUCTION:
          `TestCIWorkflow_GateJobAuthenticatesTheSelfHealingBaselinePull` stays GREEN
          through this whole edit — its negative legs derive the token-bearing set
          dynamically, so a job that keeps binding correctly passes with no rationale
          in the file at all. Nothing would catch the loss; the next reader would just
          find an unexplained per-step `env:` and "simplify" it to a job-level one,
          handing the token to the `curl | sh` installers and the eight-repo clone.

          REPLACE the deleted rationale with a comment on the surviving step that
          states the NEW shape and why it is sufficient. It must carry, in the author's
          own words:
            * ONE INVOCATION, BOTH SURFACES — `--json-out` writes the gate/v1 envelope
              to a file while the human table still renders to this log (ISSUE-099);
            * both surfaces remain load-bearing: the table is what a person reads here,
              and the JSON carries what no other surface reports — per-file coverage
              detail and the in-scope path LIST behind the "in-scope files: N" count;
            * WHY ONE STEP IS NOW SAFE: the file is written BEFORE the process decides
              its exit, so a FAILING gate still leaves a report for the `always()`
              upload below. This is the property that retired the split, and it is
              asserted by `TestGateJSONOut_WritesTheFileEvenWhenTheGateVerdictFails` —
              cite it, so the claim is checkable rather than asserted;
            * what it COST before: the entire kill chain ran twice per push. On run
              32151610956 that duplicated ~10.5min of `pack_engines` and ~10.2min of
              `coverage_threshold` — roughly 20+ minutes per run;
            * THIS IS THE BLOCKING INVOCATION and its exit is the job's — no `|| echo`,
              no `if:`.
          PRESERVE, DO NOT REWRITE, the diff-scope paragraph already on this step — the
          one opening "Diff-scoped with an explicit base. NEVER the all-scope flag
          (ISSUE-091's under-report is FIXED..." and running through
          "...this flag likewise stays out of the blocking job pending a founder
          decision)." Name it by those words, because it is easy to confuse with the
          DIFFERENT and NEWER account of the same policy in
          `TestCIWorkflow_BlockingJobNeverUsesAllOrFileScope`.
          ⚠ KNOWN STALENESS, SURFACED AND DELIBERATELY NOT FIXED HERE: that ci.yml
          paragraph says the ban is "pending a founder decision", while the test
          records a STANDING FOUNDER RULING of 2026-08-17 (ISSUE-152 / ISSUE-156:
          the ban stays, on the durable basis that CI's blocking job is latency- and
          scope-sensitive, and it is explicitly not open for re-litigation). The two
          disagree TODAY, before this lane touches anything. Reconciling them is a
          real follow-on and belongs to the founder, not to a lane whose subject is
          JSON emission — so keep the paragraph as it stands, resist the urge to
          "while I'm here" it, and report the discrepancy at close-out.
          `stepScript` strips comment lines, so literals in the comment cannot trip a
          test — but the RUN line must not contain the substring `--file`, which is
          precisely why the flag is `--json-out` (sharp edges 2, 3).

          UNCHANGED elsewhere in the job: the checkout, the two tool-install steps,
          the build, `pack install`, `Resolve the diff base`, the
          `Confirm the self-healing baseline pull landed a file` step (its
          `if: always() && steps.run_gate.conclusion != 'skipped'` still resolves,
          because `run_gate` survives), and the `Upload the gate JSON report` step with
          its `if: always()` and its `gate-report.json` + `cover.out` paths. The
          `baseline` job is untouched.

          (2) `.gitignore` — comment only, patterns untouched. The `CI RUN DETRITUS`
          block states that "the diagnostic capture step writes gate-report.json".
          Re-attribute it to the gate's own `--json-out` write. `gate-report.json` and
          `ast-grep.zip` MUST STAY IGNORED: the gate's diff scope includes untracked
          files, so an un-ignored report would put CI's own output into the set the
          next run blocks on. (The report is written after this run's scope is already
          computed, so it cannot contaminate its own run — but it would contaminate the
          next one, and `TestCIWorkflow_LeavesNoUngitignoredDroppings` fails either way.)

          Run `backstop gate` after this task, as the implementer contract requires.
        files:
          - .github/workflows/ci.yml
          - .gitignore
        claims:
          - CLM-007
          - CLM-008
          - CLM-009
        depends_on:
          - TASK-002
          - TASK-003
          - TASK-004

      - id: TASK-006
        type: verification
        title: "Verify the collapsed CI shape: the new pin plus every workflow test that reads the gate job"
        description: |
          Run, and read the output:

            go test . -run "TestCIWorkflow" -count=1
          The WHOLE `TestCIWorkflow` family, not just this lane's new test. Eleven of
          these read the gate job, and four are load-bearing here:
            * `TestCIWorkflow_GateRunsOnceAndEmitsTheJSONReportInTheBlockingStep` (new);
            * `TestCIWorkflow_GateJobProvesTheBaselineLandedAfterTheGate` and
              `TestCIWorkflow_TheOnlyBaselinePullFollowsEveryGateInvocation` — both
              rewritten to expect ONE invocation, both still under their original
              names. Confirm both PASS and that neither name changed (sharp edge 4);
            * `TestCIWorkflow_BlockingJobNeverUsesAllOrFileScope` — the CLM-009 check.
              It must pass WITHOUT modification. If it fails, the flag was named
              `--json-file` and the fix is the flag name, never this test.
          Also confirm green (they must not have moved):
          `TestCIWorkflow_BlockingJobRunsBackstopGate`,
          `TestCIWorkflow_BlockingJobHasNoRawToolInvocations`,
          `TestCIWorkflow_PackInstallFailureFailsTheJob`,
          `TestCIWorkflow_GateJobAuthenticatesTheSelfHealingBaselinePull`,
          `TestCIWorkflow_GateJobGrantsActionsReadWithoutWideningTheWorkflow`,
          `TestCIWorkflow_LeavesNoUngitignoredDroppings`.

            go test ./cmd/backstop/ -run "TestCIRecipes_GitHubActions" -count=1
          The comment-only edit must leave the recipe suite exactly as green as it was;
          a red here means an assertion was touched when only prose was authorized.

            backstop gate --file .github/workflows/ci.yml

          Then confirm BY HAND, because no test can: re-read the edited job top to
          bottom and check that exactly one step invokes `backstop gate`, that its
          `run:` line is the single `--json-out` invocation, that `id: run_gate` and
          the step-level `GH_TOKEN` survived, and that no orphaned fragment of the
          deleted step's comment remains. A stale half-sentence about "the next step"
          is exactly the misleading prose this lane exists to remove.
        files:
          - .github/workflows/ci.yml
          - workflows_test.go
          - cmd/backstop/ci_recipes_github_actions_test.go
        claims:
          - CLM-007
          - CLM-008
          - CLM-009
        depends_on:
          - TASK-005

