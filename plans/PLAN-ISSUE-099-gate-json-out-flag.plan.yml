            * if the correction cannot land in this task's window, report it as OWED,
              by name, rather than as done.
          Both lanes route through the directive-owning agent, so the coordination
          point is that agent, not the file.

          ── (3) REPORT WHAT THIS LANE MAKES STALE ELSEWHERE ─────────────────────
          HEADS-UP FOR THREE IN-FLIGHT SIBLING LANES — REPORT, DO NOT EDIT.
          `PLAN-ISSUE-163`, `PLAN-ISSUE-165` and `PLAN-ISSUE-168` are all `status:
          draft` and all carry post-merge CI-reading instructions phrased as "the step
          BEFORE it writes `gate-report.json`, uploaded as the `gate-report` artifact"
