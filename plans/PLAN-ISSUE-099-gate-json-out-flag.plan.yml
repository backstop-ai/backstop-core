  # ═══════════════════════════════════════════════════════════════════════════
  - id: phase-2
    name: "Phase 2: GREEN — --json-out on the gate command"
    tasks:
      - id: TASK-003
        type: implementation
        title: "Register --json-out, validate its destination early, and emit the envelope beside the stdout render"
        description: |
          Edit `cmd/backstop/gate.go` only. Locate all three sites BY NAME (sharp edge 1).

          (1) REGISTRATION, in `func newGateCommand`, beside the existing
          `cmd.Flags().StringVar(&baseFlag, "base", ...)`:
            var jsonOutFlag string
            cmd.Flags().StringVar(&jsonOutFlag, "json-out", "", "<help>")
          GATE-LOCAL, not persistent (see the notes' pre-fix section: `--json` is a
          ROOT persistent flag in `root.go`, and no other command emits a gate
          envelope). Follow the file's existing shape: the closure variable exists for
          symmetry with `allFlag`/`fileFlags`/`baseFlag`, and `runGate` reads the value
          back through `cmd.Flags().GetString("json-out")`.
          THE HELP STRING CARRIES THE INTERACTION RULE (CLM-003), in the same
          spell-out-the-consequence register the `--base` help already uses: it writes
          the gate/v1 JSON envelope to FILE while stdout keeps whatever `--json` selects
          for it — the human table by default, the same JSON document under `--json`.
          Name the CI use it exists for. Do not name the flag `--json-file`
          (sharp edge 2).

          (2) EARLY VALIDATION, in `runGate`, inside the flag-read block that begins
          `allFlag, allErr := cmd.Flags().GetBool("all")` — read `json-out` alongside
          the other three, fold its read error into the same `firstNonNil` config
          refusal, and place its destination checks AFTER the `--file` empty-value
          refusal and BEFORE `gate.ComputeGateScopeWithBase`. Two refusals, both
          `&ExitCodeError{Code: ExitConfigError, Message: "config: ..."}`:
            a. the flag was PRESENT with an empty or whitespace-only value —
               `cmd.Flags().Changed("json-out")` distinguishes "not passed" (the
               default "", which must remain a silent no-op) from `--json-out ""`.
               Mirror the `--file ""` refusal's register: say what to do, not just
               what is wrong.
            b. the parent directory of the value does not exist, or exists and is not
               a directory — `os.Stat(filepath.Dir(path))`. Name the DIRECTORY in the
               message, not just the file.
          WHY EARLY: an operator's typo must cost seconds, not the ~21 minutes the
          kill chain costs on this repo's CI (issue's measured run 32151610956).
          WHY ONLY THE PARENT: opening or creating the target here would leave a
          zero-byte artifact behind on every run that dies later, and it would remove
          the deterministic late-failure vehicle TASK-001(f) uses. Write both reasons
          into the code comment — the split is deliberate and looks arbitrary without
          them.
          These checks are `--json-out`'s ONLY interaction with the scope selectors:
          it is mutually exclusive with NOTHING (CLM-003). Do not extend the three
          existing mutual-exclusion guards.

          (3) EMISSION, replacing the block that opens `// Format output based on
          --json flag.` and ends just before `if exitCode != 0`:
            * read `jsonFlag` as today, and `jsonOutPath` as validated above;
            * if EITHER destination wants the document, call `gate.FormatJSON(result)`
              EXACTLY ONCE and keep `data` (sharp edge 9). A `FormatJSON` error keeps
              its current wrapped-error behaviour.
            * STDOUT FIRST, byte-for-byte as today: under `--json`,
              `cmd.Println(string(data))`; otherwise `FormatHuman` + the
              `terminalExclusionNotice` line. `terminalExclusionNotice` stays on the
              human arm alone (sharp edge 11) and never reaches the file.
            * THEN, if `jsonOutPath != ""`, write `append(data, '\n')` with
              `os.WriteFile(jsonOutPath, ..., 0o644)`. The trailing newline is what
              makes the file byte-identical to what `cmd.Println` puts on stdout, and
              that identity is CLM-002 — state it in the comment so a later "tidy-up"
              cannot drop the byte.
            * on a write error return `&ExitCodeError{Code: ExitConfigError, Message:
              fmt.Sprintf("config: writing --json-out %s: %v", ...)}` — AFTER the
              stdout surface has rendered, which is the CLM-006(iii) ordering, and
              BEFORE the verdict return, so exit 2 outranks exit 1 the way
              `ExitWithResult` says it should.
            * the `if exitCode != 0 { return &ExitCodeError{... Explained: exitCode ==
              ExitViolations} }` return is UNCHANGED and stays last. Because the write
              sits above it, the file exists on a failing run — CLM-004, and the whole
              reason ci.yml can collapse. Note that in the comment beside the write,
              since the ordering is load-bearing and invisible.

          NOTHING ELSE CHANGES: not `pkg/gate/output.go`, not the JSON schema
          (`gate/v1`), not the human table's bytes, not `runGate`'s signature, not the
          root `--json` flag (sharp edge 10).

          Run `backstop gate` after this task, as the implementer contract requires.
        files:
          - cmd/backstop/gate.go
        claims:
          - CLM-001
          - CLM-002
          - CLM-003
          - CLM-004
          - CLM-005
          - CLM-006
          - CLM-009
        depends_on:
          - TASK-001

      - id: TASK-004
        type: verification
        title: "Verify the flag: all nine TASK-001 tests green, provenance suite unmoved, gate clean over the changed files"
        description: |
          Run, and read the output rather than assuming it:

            go test ./cmd/backstop/ -run "TestGateJSONOut" -race -count=1
          All NINE names must PASS. Any `--- SKIP` is a failure of this task: a skipped
          E2E is silent vacuous green, and the eight behavioural tests here drive the
          real binary.
          NOTE THE ASYMMETRY WITH TASK-001's RED, so this task is not misread as
          proving more than it does: eight of the nine went red→green across TASK-003,
          while `TestGateJSONOut_RunsTheKillChainExactlyOnce` was GREEN BEFORE AND
          AFTER — it is a regression lock, and its value is entirely in having stayed
          green while `gate.go` was edited. If it is now RED, TASK-003 implemented the
          file write by re-running the kill chain; the fix is the implementation, never
          the test.

            go test ./cmd/backstop/ -run "TestGateCLI|TestGate_|TestExitSurfacing_Gate" -race -count=1
          The NON-REGRESSION leg (sharp edges 10, 11). The provenance, identity and
          exit-surfacing suites read the gate's stdout surfaces closely — `gate --json`
          must still print a parseable document with nothing appended, the human table's
          `"  Total violations: "` prefix must be untouched, and the explained-opt-out
          behaviour must be unchanged. If any of these moved, the emission block was
          rewritten further than TASK-003 authorized.

            backstop gate --file cmd/backstop/gate.go
            backstop gate --file cmd/backstop/gate_json_out_test.go
          Diff-scoped gate over the two files this phase touched. Not `--all` — that is
          the final phase's job.

          Also confirm by hand, once, that the shipped help is right:
            ./bin/backstop gate --help
          `--json-out` must appear in `Flags:` (gate-local), NOT in `Global Flags:`
          beside `--json`. A persistent registration would put it in the wrong section
          and hand a dead flag to every other command.
        files:
          - cmd/backstop/gate.go
          - cmd/backstop/gate_json_out_test.go
        claims:
          - CLM-001
          - CLM-002
          - CLM-003
          - CLM-004
          - CLM-005
          - CLM-006
        depends_on:
          - TASK-003

