          REWRITE THE BODIES of the two PLAN-ISSUE-176-mandated tests, KEEPING BOTH
          NAMES EXACTLY (sharp edge 4 — they are a `completed` plan's mandated set):
            * `TestCIWorkflow_GateJobProvesTheBaselineLandedAfterTheGate`: its
