            * it asserts "no `--json-out` / `jsonOut` flag exists anywhere in
              `cmd/backstop/`", verified by grep at the time and false the moment
              TASK-003 lands;
            * ★ most importantly, its "Accuracy correction... a planner must not trip
              on" paragraph describes ci.yml's two separately-named steps and says the
              design reason for the split "should be preserved by whoever closes this".
              THIS LANE IS WHOEVER CLOSES IT, and it does NOT preserve the split —
              because the reason the split existed (getting both surfaces cost two
              invocations) is exactly what `--json-out` removes. Left as written, that
              sentence instructs the next planner to protect a shape this lane
              deliberately retired.
          Route the edit through the DIRECTIVE-authoring agent — a directive is never
          hand-edited, and `directives/` + `BACKLOG.yml` are the founder's priority
          layer, so mark the entry delivered and correct the three statements; do NOT
          reorder, reprioritize, or remove anything. If the authoring agent judges that
          closing the entry is a founder call, report it rather than forcing it.
          (DIR-032 also names ISSUE-099, but only as a title reference in a
          cross-directive line — CHECKED, not a site, no action.)

          ⚠ DIR-024 IS CO-CLAIMED BY A LIVE SIBLING LANE — COORDINATE, DO NOT
          OVERWRITE. `plans/PLAN-ISSUE-168-sandbox-devnull-write-allowance.plan.yml`
