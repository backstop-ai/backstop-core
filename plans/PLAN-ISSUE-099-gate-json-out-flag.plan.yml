          reconciliations, THEN run the validation block, THEN the diff-scoped gate.

          ── (1) RECONCILE THE SOURCE ISSUE ──────────────────────────────────────
          `issues/ISSUE-099-gate-cannot-emit-json-and-human-together.issue.md` is made
          stale by this lane in two places — DO NOT rewrite its history, ADD to it, the
          way its own 2026-08-18 section was added:
            * the `## Desired behavior` section's "Retirement trigger" paragraph
