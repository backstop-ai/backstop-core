  ── SHARP EDGES ──────────────────────────────────────────────────────────────
   1. LOCATE EVERY EDIT SITE BY NAME, NEVER BY A LINE NUMBER. `cmd/backstop/gate.go`
      is ~2060 lines and has moved under three lanes this week; ISSUE-099's own
      citations are already stale. The sites are: `func newGateCommand` (the three
      `cmd.Flags().*Var` calls), the flag-read/refusal block in `runGate` that begins
      `allFlag, allErr := cmd.Flags().GetBool("all")` and ends with the three
      mutual-exclusion refusals, and the comment `// Format output based on --json flag.`
      through the `if exitCode != 0` return.
   2. ★ NEVER NAME THE FLAG `--json-file`. `TestCIWorkflow_BlockingJobNeverUsesAllOrFileScope`
      does `strings.Contains(stepScript(step), "--file")` over the gate step. `--json-file`
      contains `--file` as a substring and would fail a shipped, correct test that this
      lane has no business touching. `--json-out` does not. (CLM-009.)
   3. WORKFLOW COMMENTS ARE INVISIBLE TO THE WORKFLOW TESTS, RUN LINES ARE NOT.
      `stepScript` (workflows_test.go) drops every line whose trimmed prefix is `#`,
      which is why today's comment can safely contain the literal `--file`. The
      constraint in edge 2 applies to the `run:` line only — but write the comment as
      if it did not, so a future inline-ing of the comment cannot flip a test.
   4. THE TWO PLAN-ISSUE-176 TESTS MUST KEEP THEIR NAMES. Both currently `t.Fatalf`
      when the gate-step count is not 2, so BOTH go red the instant ci.yml collapses.
      Rewrite their BODIES (2 → 1) and their explanatory prose; do not rename, do not
      delete, do not soften any other leg. They are a `completed` plan's mandated
      set and the status_drift dimension reads them by name.
   5. THE UNIQUENESS LEG IS THE POINT, NOT THE COUNT. In
      `TestCIWorkflow_TheOnlyBaselinePullFollowsEveryGateInvocation`, the primary fence
      is "exactly ONE `baseline pull` in the job" and it is deliberately index-free.
      Its current prose justifies that choice by "ci.yml invokes the gate twice, so a
      forging pull inserted BETWEEN the two invocations still sits after the first
      anchor". With one invocation that specific escape is gone, but the uniqueness leg
      STAYS PRIMARY — a second pull anywhere still forges the file the confirmation
      step checks for. Rewrite the reason; keep the fence.
   6. ★ THE LATE-WRITE-FAILURE TEST MUST NOT USE `chmod`. A read-only directory does
      not fail for root, and CI containers run as root — the test would pass locally
      and go vacuously green in CI. Use a target path that IS AN EXISTING DIRECTORY:
      `os.MkdirAll(filepath.Join(dir, "report.json"))` then `--json-out report.json`.
      `os.WriteFile` on a directory fails deterministically for every uid, and it
      passes the parent-directory preflight by construction — which is exactly why
      decision 4 keeps the preflight limited to the PARENT.
   7. USE THE SEPARATED-STREAM HARNESS, NOT THE MERGED ONE. `runBinary`
      (`cmd/backstop/integration_test.go`) returns `CombinedOutput`, against which
      "the table is on stdout and the diagnostic on stderr" is unfalsifiable. Use
      `runBackstopStreams(t, bin, dir, args...)`
      (`cmd/backstop/run_backstop_streams_test.go`) with
      `buildBackstopBinary(t)` — the shape `exit_surfacing_streams_test.go` already
      uses, and for the reason recorded in its header comment.
   8. THE FAILING-VERDICT FIXTURE ALREADY EXISTS AND IS RELIABLE.
      `gitInitRepoWithBackstop(t)` (`cmd/backstop/gate_provenance_test.go`) + a bare
      `gate` exits `ExitViolations` today — `TestExitSurfacing_GateViolations_NoDuplicateErrorLine`
      asserts exactly that. Reuse it for CLM-004/005/007 rather than engineering a new
      failing project. Set `NO_COLOR=1` via `t.Setenv` where stdout is matched, as that
      test does, or the table arrives wrapped in ANSI.
   9. FORMAT THE JSON ONCE, NOT PER DESTINATION. `gate.FormatJSON(result)` must be
      called at most once per run and its `data` shared by both destinations. Two calls
      would still agree today, but CLM-002's byte-identity claim would then rest on
      determinism rather than on construction — and the trailing-newline contract
      (`cmd.Println` adds one; the file write must add the same one) is far easier to
      get wrong across two sites.
  10. DO NOT TOUCH THE HUMAN TABLE OR THE JSON SCHEMA. `schema_version` stays
      `gate/v1`; `FormatHuman`/`FormatJSON` in `pkg/gate/output.go` are NOT in scope.
      This lane adds a destination. `TestGateCLI_SchemaVersionUnchangedByTraceFields`
      and the provenance suite must stay green untouched.
  11. `terminalExclusionNotice` STAYS ON THE HUMAN ARM ONLY. It is printed after
      `FormatHuman` and deliberately not under `--json` (it would corrupt the
      document a consumer parses). `--json-out` must not move it, duplicate it, or
      let it leak into the file.
  12. SHARED TREE. Never bare `git stash` — it sweeps another agent's uncommitted
      work. Do not run a full `gate --all` or the whole suite concurrently with a
      mid-flight implementer in this tree.
  13. ISSUE-172 IS OUT OF SCOPE. Making the gate's internal steps run concurrently is
      a different lane. This one removes a DUPLICATE INVOCATION and nothing else.
  14. SPEC-010 IS `status: draft`, so the contracts dimension does not enforce its
      `contracts:` block, and `runGate`'s signature is unchanged regardless. No spec
      amendment is required by this lane.

  ── SURFACED FOR THE FOUNDER, NOT FIXED HERE ─────────────────────────────────
  `cmd/backstop/ci_recipes_github_actions_test.go`'s
  `TestCIRecipes_GitHubActions_GateVerdictNotSwallowed` excludes `|| echo` from its
  swallow denylist, and its stated reason is "backstop-core's own ci.yml ends a
  DIAGNOSTIC `gate --json` capture in `|| echo`". After this lane that SPECIFIC
  example is gone — but `|| echo` itself is NOT gone from ci.yml: the confirmation
  step's failure branch still runs `./bin/backstop baseline pull || echo "bare
  baseline pull exited $?"`, for the same reporting-not-gating reason. So the
  exemption's REASONING survives intact and only its cited example moves; TASK-002
  repoints the comment and changes no assertion. The denylist is CLM-028 of SPEC-067
  and the comment says in terms that widening it is a spec amendment through the
  spec-author agent, never a unilateral edit. Whether `|| echo` should now join the
  denylist is a real question for the founder and a follow-on for the spec-author;
  it is NOT this lane's call.

  ── POST-MERGE OBLIGATION (cannot be verified locally) ────────────────────────
  The wall-time win and the artifact's continued presence on a FAILING run are CI
  properties. After this lands on main, read the next CI run and confirm: exactly one
  "Run the gate" step in the job's step list, the gate step's duration roughly halved
  against a recent pre-fix run, and the `gate-report` artifact still uploaded and
  non-empty. Record the run id at close-out. Do not claim the win before reading it.

phases:
  # ═══════════════════════════════════════════════════════════════════════════
  # Phase 1: RED — two independent, parallel lanes of failing tests
  # ═══════════════════════════════════════════════════════════════════════════
  - id: phase-1
    name: "Phase 1: RED — CLI contract and CI-shape pins, in parallel"
    tasks:
      - id: TASK-001
        type: test
        title: "Pin the --json-out contract: both surfaces from one run, flag interaction, refusal classes, verdict independence (RED)"
        description: |
          Create `cmd/backstop/gate_json_out_test.go` (package main).

          ★ THE RED IS EIGHT OF NINE, NOT NINE OF NINE — DO NOT "FIX" THE NINTH.
          Subtests (a) through (h) MUST FAIL before TASK-003 lands. The RED is direct
          and blunt — the flag does not exist — and it is characterized as such rather
          than force-fitted into a subtler shape: today `gate --json-out <path>` dies in
          Cobra's flag parser with `Error: unknown flag: --json-out` and exit 2
          (MEASURED 2026-08-18). Because that refusal happens before `runGate` is
          entered, those eight fail at RUNTIME, not at compile time — the package still
          builds, which is what keeps this file safe to land in a shared tree ahead of
          the fix.
          Subtest (i), the source pin, is GREEN AT HEAD BY DESIGN and is a REGRESSION
          LOCK, not a RED. VERIFIED 2026-08-18: `runGate` contains exactly one
          `gate.New(` and exactly one `.Run(` today, so the predicate already holds.
          Its job is not to describe missing behaviour but to STOP TASK-003 from
          implementing the file write by re-running the kill chain — the one structural
          mistake that would satisfy every behavioural test in this file while
          reintroducing the exact cost ISSUE-099 exists to remove. A test that locks a
          property already true is the correct shape for that job, and an implementer
          who "makes it fail first" has broken the lock rather than honoured the
          discipline.
          State this split in the file header, per subtest, so the next reader knows
          which tests were red for the right reason and which was never meant to be.

          HARNESS (sharp edges 7, 8): drive the BUILT BINARY through
          `buildBackstopBinary(t)` + `runBackstopStreams(t, bin, dir, args...)`, never
          `runBinary` — a merged `CombinedOutput` buffer makes "the table went to
          stdout while the JSON went to the file" unfalsifiable. Use
          `gitInitRepoWithBackstop(t)` for the project fixture; a bare `gate` there
          exits `ExitViolations` today, which is exactly the discriminating verdict
          CLM-004/005 need. `t.Setenv("NO_COLOR", "1")` wherever stdout text is matched.

          (a) `TestGateJSONOut_WritesTheEnvelopeToFileWhileTheHumanTableStillRendersToStdout`
              — CLM-001. ONE invocation: `gate --json-out report.json`.
              Assert ALL of: stdout contains the human table's markers (`Gate Results`,
              `Total violations:`, `Steps:`); stdout contains NO JSON document (no
              `"schema_version"` substring, and the first non-space byte is not `{`);
              `report.json` EXISTS and `json.Unmarshal`s into a map whose
              `schema_version` is `gate/v1`; and that map carries at least one step in
              `steps`, so the file is a real envelope and not an empty object.

          (b) `TestGateJSONOut_CombinesWithJSONWritingTheSameDocumentToBothSurfaces`
              — CLM-002, CLM-003. ONE invocation: `gate --json --json-out report.json`.
              Assert: the file's bytes are BYTE-IDENTICAL to stdout's bytes (compare
              raw `[]byte`, not parsed maps — the trailing newline is part of the
              contract); stdout parses as gate/v1 JSON; and stdout carries NO human
              table (`Gate Results` absent). Say in the body WHY byte-identity is the
              assertion: two kill-chain runs could not produce identical `generated_at`
              stamps and identical per-step `duration_ms` values, so equality here is
              evidence of ONE result rendered twice, not of two runs agreeing.

          (c) `TestGateJSONOut_RefusesAnEmptyValueBeforeRunningTheKillChain`
              — CLM-006(i). `gate --json-out ""`. Assert exit is `ExitConfigError`;
              stderr names the flag and says a path is required; and — the load-bearing
              leg — stdout does NOT contain `Gate Results`. The absence is the proof
              the refusal was EARLY; an exit-2 that arrives after a 20-minute kill
              chain satisfies the code assertion and defeats the point.

          (d) `TestGateJSONOut_RefusesAMissingParentDirectoryBeforeRunningTheKillChain`
              — CLM-006(ii). `gate --json-out no-such-dir/report.json`. Same three
              legs as (c), with stderr naming the missing DIRECTORY (not merely the
              file), so the operator is told which half of the path is wrong.

          (e) `TestGateJSONOut_ResolvesARelativePathAgainstTheProcessWorkingDirectory`
              — CLM-001. Create `sub/` inside the fixture project, run the binary with
              `cmd.Dir` = that subdirectory (config discovery walks UP from CWD, so the
              gate still finds `backstop.yml`), pass `--json-out report.json`, and
              assert the file lands at `<project>/sub/report.json` and NOT at
              `<project>/report.json`. This is the only shape in which CWD and the
              discovered project root differ, so it is the only one that can falsify
              the resolution rule.

          (f) `TestGateJSONOut_WriteFailureIsAConfigErrorAfterTheTableRenders`
              — CLM-006(iii). `os.MkdirAll(filepath.Join(dir, "report.json"), 0o755)`
              FIRST, then `gate --json-out report.json`. Assert exit is
              `ExitConfigError`; stderr names the path; and — the load-bearing leg —
              stdout DOES contain the full human table, proving the primary surface is
              never suppressed by a secondary destination's failure. NEVER use `chmod`
              to manufacture this failure (sharp edge 6): CI runs as root and a
              read-only directory would go vacuously green there.

          (g) `TestGateJSONOut_ExitCodeIsTheGateVerdictNotTheOutputFlags`
              — CLM-005. Over ONE fixture project, run four invocations: bare `gate`,
              `gate --json`, `gate --json-out <out>/a.json`,
              `gate --json --json-out <out>/b.json`.
              Assert all four exit codes are EQUAL, AND that the shared value is
              non-zero — without the second leg, four vacuous zeros would satisfy the
              first.
              ★ WRITE THE DESTINATIONS OUTSIDE THE PROJECT — a second `t.TempDir()`,
              not the fixture dir. The gate's diff scope INCLUDES UNTRACKED FILES, so
              `a.json` written into the project by run 3 is in scope for run 4, and the
              two runs would then be gating different file sets. That confound is
              invisible while the codes happen to agree and would make this test's
              equality claim mean something other than what it says. The same rule
              applies to (h); (a), (b) and (f) deliberately write INSIDE the project,
              because each of those is a single invocation with nothing downstream of
              it, and (e) must write inside by construction — it is measuring where a
              relative path lands.

          (h) `TestGateJSONOut_WritesTheFileEvenWhenTheGateVerdictFails`
              — CLM-004. THE CI-CRITICAL CLAIM, asserted by name rather than left as a
              side effect of (a). `gate --json-out report.json` over the fixture whose
              verdict is `ExitViolations`: assert exit is `ExitViolations`, the file
              exists, and it parses as a complete gate/v1 envelope. This is the
              property that lets ci.yml's `always()` upload publish a report for
              exactly the run worth diagnosing, and therefore the property the
              two-step retirement rests on.

          (i) `TestGateJSONOut_RunsTheKillChainExactlyOnce`
              — CLM-002. A SOURCE PIN, and labelled as one. Parse
              `cmd/backstop/gate.go` with `go/parser` + `go/ast`, locate the `runGate`
              `*ast.FuncDecl` BY NAME (sharp edge 1), and assert its body contains
              EXACTLY ONE `gate.New(` call and EXACTLY ONE `.Run(` selector call.
              Say why a source pin rather than a measurement: a doubled kill chain is
              observable only as wall time or as engine side effects, neither of which
              a hermetic unit test can assert without flake — while "the file-emitting
              path was implemented by re-running the gate" is a STRUCTURAL mistake that
              a structural pin catches exactly. Pair it in the comment with (b), which
              covers the same claim behaviourally.
              SAY IN THE TEST BODY THAT IT PASSES AT HEAD AND WHY THAT IS CORRECT: it
              is a REGRESSION LOCK on a property that already holds, not a description
              of missing behaviour. Anyone who finds it green before TASK-003 and
              concludes it is broken should read this comment instead of weakening it.
        files:
          - cmd/backstop/gate_json_out_test.go
        claims:
          - CLM-001
          - CLM-002
          - CLM-003
          - CLM-004
          - CLM-005
          - CLM-006
        depends_on: []
        test_names:
          - TestGateJSONOut_WritesTheEnvelopeToFileWhileTheHumanTableStillRendersToStdout
          - TestGateJSONOut_CombinesWithJSONWritingTheSameDocumentToBothSurfaces
          - TestGateJSONOut_RefusesAnEmptyValueBeforeRunningTheKillChain
          - TestGateJSONOut_RefusesAMissingParentDirectoryBeforeRunningTheKillChain
          - TestGateJSONOut_ResolvesARelativePathAgainstTheProcessWorkingDirectory
          - TestGateJSONOut_WriteFailureIsAConfigErrorAfterTheTableRenders
          - TestGateJSONOut_ExitCodeIsTheGateVerdictNotTheOutputFlags
          - TestGateJSONOut_WritesTheFileEvenWhenTheGateVerdictFails
          - TestGateJSONOut_RunsTheKillChainExactlyOnce

      - id: TASK-002
        type: test
        title: "Pin CI's single-invocation shape and reconcile every stale two-invocation explanation (RED)"
