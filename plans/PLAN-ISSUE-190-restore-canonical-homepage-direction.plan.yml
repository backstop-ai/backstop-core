notes: |
  Focused reactive correction sourced from ISSUE-190. The approved mockup supplies
  intent, while commit 083ae5d955ca4216c8abcd778ef8c5c1fd6987bb supplies the
  canonical homepage markup and presentation baseline. Implementation must reconcile
  that baseline with the delivered Seed 4 shell; it must not revert the repository or
  copy mockup-only metadata, path-relative links, href="#" placeholders, or obsolete
  three-link navigation.

  The smallest coherent Core production scope includes the homepage, its presentation
  and sitecheck consumer, plus the declared/locked design-system release and immutable
  release-evidence consumers enumerated below. The already-canonical
  docs/assets/css/backstop-tokens.css remains read-only. The shared Pages/static
  pipeline, source-owned claim and journey markers, root-relative destinations,
  seven-primary/two-utility IA, skip link, required-block IDs, owner boundaries,
  footer, next action, and installed design-system contracts are retained. Nonvisual
  shared-shell attributes may remain where enforcement consumes them, but the
  homepage-only field-guide question/content wrappers and visible scaffold headings
  do not remain: their required contract attributes/IDs move onto the canonical
  homepage elements instead of preserving accidental visual wrappers.

  ISSUE-189 and PLAN-ISSUE-189 are separate and untouched. They own the isolated
  actual-200%-text responsive integration in docs/assets/css/site.css. ISSUE-190 does
  not edit that file: it removes the legacy navigation suppression at its source in
  docs/assets/css/backstop.css and consumes the current site.css reflow behavior.
  If ISSUE-189 has uncommitted site.css work when implementation starts, land or
  isolate that work first, then execute this plan without absorbing or rewriting it.
  The browser RED lane strengthens the same existing assertions but does not change
  ISSUE-189's one-file implementation scope.

  Existing exact tests named by ISSUE-190 remain binding. This plan adds the three
  absent homepage-specific names and strengthens the existing navigation and
  actual-200%-text contracts rather than adding one-off browser helpers or weakening
  any gate. The homepage change fence is route-contract based: it proves the canonical
  exception applies only to `/` while non-home pages retain their existing shared
  shell, avoiding a branch-relative Git-diff test that would become stale.

  PUBLISHED EXTERNAL DEPENDENCY: Core currently declares and locks
