  - id: phase-1
    name: "Phase 1: RED browser and structural reconciliation contracts"
    tasks:
      - id: TASK-001
        type: test
        title: "RED: make the no-JavaScript and 200-percent browser matrix non-vacuous"
        description: |
          Before adding the structural RED tests, strengthen the existing Playwright
          path so the current homepage fails in the browser stage rather than passing
          because hidden navigation is excluded from the focusable count. Reuse
          assertRequiredSurface, assertContentCompleteness,
          assertKeyboardOrderAndBounds, and assertLocalOverflow; do not introduce a
          homepage helper unless the same assertion is genuinely shared by normal and
          actual-200%-root-text cases.

          Require the header Home wordmark to expose normalized visible text
          `./b backstop.sh`; require the seven primary and two utility anchors in exact
          owner order with exact real root-relative hrefs; and require every one of the
          nine anchors to be visible before keyboard traversal. On `/`, assert the
          canonical hero/gate proof, ordered 01/02/03 system sections, and exactly four
          ordered modes Full framework, Artifact workflow, Standards enforcement, and
          Deterministic scaffolding. Explicitly reject the visible field-guide question,
          Why Backstop/Choose your path scaffold headings, and Evaluate/Understand/Adopt
          as the composability replacement. Adapt required-block completeness only as
          needed to support IDs on canonical section containers as well as ordinary page
          headings; retain the >=80-character, visibility, and <=160px gap checks.

          Keep the existing actual-200%-text loop intact and substantive: prove the
          computed root size is baseline*2 within 0.01px, then rerun required-surface,
          content-completeness, keyboard-order/focus-bounds, local-overflow, and <=1px
          document-overflow assertions. Strengthen the exact Go meta-contract tests so
          they fail if any of those calls, the exact 360/768/1440 matrix, JavaScript-off
          posture, nine-link visibility checks, or non-suppression contract disappears.

          Also add TestSiteCheck_ExternalCommandHarnessUsesParametricExecutable to the
          existing pipeline contract suite. It must fail while any executed external
          command supplies a literal executable directly to exec.Command, require the
          executable to arrive through a parameterized helper/data row, and include a
          negative source mutation proving a literal executable is rejected. This RED
          is repaired only in TASK-004; do not move the literal into another command call.

          Retain two separate executable RED receipts before TASK-002. First run
          `go test ./scripts/sitecheck -run
          '^TestSiteCheck_ExternalCommandHarnessUsesParametricExecutable$' -count=1 -v`
          and require that named test to execute and fail on the literal executable call;
          a compile/package/tool failure is not its RED evidence.

          Independently prepare a temporary rendered site with the existing locked
          `JEKYLL_ENV=production bundle exec jekyll build --source docs --destination
          "$browser_root" --trace`, `./scripts/install-design-assets.sh
          .backstop/packs/backstop-ai/backstop-design-system "$browser_root"`, and
          `go run ./scripts/render-public-site-contracts --root "$PWD" --built-root
          "$browser_root" --site-commit "$(git rev-parse HEAD)"` commands. Then run the
          browser directly with `PUBLIC_SITE_ROOT="$browser_root"
          PLAYWRIGHT_OUTPUT_DIR="$browser_state" npx playwright test`. Require a nonzero
          Playwright result naming `/` at 360x800 in the normal and/or actual-200% cell,
          with the hidden/truncated navigation or wrong three-mode content while the
          root-font doubling assertion still executes. Do not use
          `./scripts/verify-public-site.sh` as this browser RED receipt: an earlier Go RED
          must not mask whether Playwright itself ran. A build/render/browser setup
          failure is not RED evidence; clean up both temporary directories and do not
          skip, focus, loosen, or replace an assertion.
        files:
          - tests/public-site.spec.ts
          - tests/public-site-helpers.ts
          - scripts/sitecheck/pipeline_contract_test.go
        claims:
          - CLM-001
          - CLM-002
          - CLM-003
          - CLM-004
        test_names:
          - TestSiteCheck_ChromiumNoJSExactInteractionMatrixPasses
          - TestSiteCheck_LocalOverflowAndNavigationModesPass
          - TestSiteCheck_ActualRootFontRelayoutPasses
          - TestSiteCheck_ExternalCommandHarnessUsesParametricExecutable
        depends_on:
          - TASK-000

      - id: TASK-002
        type: test
        title: "RED: specify canonical homepage structure and the route-local change fence"
        description: |
          After retaining TASK-001's browser RED receipt, add exact
          TestSiteCheck_HomepageCanonicalDirectionPasses,
          TestSiteCheck_HomepageCanonicalDirectionRejectsDriftMatrix, and
          TestSiteCheck_HomepageCanonicalChangeFence to the existing site contract
          suite, and strengthen TestSiteCheck_NavigationMatrixPasses in its existing
          presentation suite. Also strengthen the existing owner-export and eight-corpus
          tests to require the declared/locked release identity and its wordmark mutation
          source to decode to the exact full three-part markup once in the clean homepage.
          Extend only the existing synthetic rendered-site fixture; do not create a
          parallel parser, mutation manifest, or helper file.

          The positive fixture must carry the complete marked wordmark, skip link,
          canonical hero and gate proof, ordered Define/Enforce/Detect sections, exact
          four ordered modes with their distinguishing code/copy, source-owned claim
          and JLINK-001 markers, all nine exact navigation destinations, required-block
          IDs, canonical/root-relative links, footer, and next action. The drift matrix
          independently rejects truncating the wordmark; inserting the field-guide
          question or scaffold headings; reordering/removing a system section; replacing,
          reordering, duplicating, or adding a composability mode; substituting the
          Evaluate/Understand/Adopt rows; removing owner markers; and introducing empty,
          fragment-only, path-relative, alias, or wrong canonical destinations.

          The change-fence test must prove this is a route-local reconciliation: apply
          the canonical-home exception to `/` and independently mutate a non-home route
          toward homepage composition or away from its existing question/page-kind/
          shared-shell contract, requiring the real Verify path to reject it. It must
          not inspect a transient branch diff or encode new local visual policy.
          Navigation coverage must assert exact primary/utility order and labels, not
          merely presentation-file validity or anchor cardinality.

          Add focused delivery-hardening RED tests as part of the same pre-implementation
          lane. TestSiteCheck_RouteCatalogsAreImmutableAndExhaustive must reject mutable
          package-level route/navigation state, mutate one returned slice without changing
          the next result, and prove the redirect lookup remains closed and exhaustive.
          TestSiteCheck_LinkPolicyFixtureAvoidsCredentialShape must require credential-neutral
          fixture-construction identifiers and include a negative source mutation restoring
          `token :=` that the credential rule rejects. It must also retain the existing neutral
          malformed-mail link case and prove the same link-policy rejection without changing
          its href bytes or attributing the original credential finding to those bytes.
          TestDesignSystem_ErrorAndCorpusBranchesReachThreshold adds exact error/finding
          assertions across currently uncovered substantive branches; it is coverage
          input, not a test-level RED claim. TestDeliveryInventory_ISSUE190GovernanceArtifactsAreClosedRows must
          require exact closed role mappings and inventory rows for ISSUE-190 and
          PLAN-ISSUE-190, reject unrelated issue/plan paths, and fail when either row is
          omitted. The route, credential, and inventory tests remain RED until TASK-004;
          compile/setup failures and vacuous line execution are not evidence. CI's
          measured 106/133 statements for scripts/sitecheck/design_system.go is the
          authoritative coverage RED receipt; do not manufacture a failing coverage test.

          RED command (the required receipt, before any implementation): run
          `go test ./scripts/sitecheck -run
          '^(TestSiteCheck_HomepageCanonicalDirectionPasses|TestSiteCheck_HomepageCanonicalDirectionRejectsDriftMatrix|TestSiteCheck_HomepageCanonicalChangeFence|TestSiteCheck_NavigationMatrixPasses|TestSiteCheck_OwnerAcceptanceExportBindingPasses|TestSiteCheck_EightIsolatedProjectRootsAndCleanCorpusPass)$'
          -count=1 -v`. Require the verbose output to show the focused canonical positive/
          drift assertions failing individually against the current homepage and the owner
          export binding/eight-corpus assertions failing because Core still declares v0.1.2
          with the two-span mutation source. Record each expected assertion diagnostic.
          A compile, package, tool, setup, gate, or malformed-fixture failure is not RED.
          The route fence's clean control may pass. After retaining those direct-test RED
          receipts, separately run `go test ./scripts/sitecheck -run
          '^(TestSiteCheck_RouteCatalogsAreImmutableAndExhaustive|TestSiteCheck_LinkPolicyFixtureAvoidsCredentialShape|TestDeliveryInventory_ISSUE190GovernanceArtifactsAreClosedRows)$'
          -count=1 -v` and require all three named tests to execute and fail for their
          intended current defects. Do not include the design-system branch test in that
          RED command. Then run `./bin/backstop gate --file scripts/sitecheck/site_contract_test.go
          --file scripts/sitecheck/presentation_test.go --file
          scripts/sitecheck/design_system_test.go` as cadence; its failure does not replace
          the named `-count=1 -v` evidence.
        files:
          - scripts/sitecheck/site_contract_test.go
          - scripts/sitecheck/presentation_test.go
          - scripts/sitecheck/design_system_test.go
          - scripts/sitecheck/inventory_test.go
        claims:
          - CLM-001
          - CLM-002
          - CLM-003
          - CLM-005
          - CLM-006
          - CLM-007
        test_names:
          - TestSiteCheck_HomepageCanonicalDirectionPasses
          - TestSiteCheck_HomepageCanonicalDirectionRejectsDriftMatrix
          - TestSiteCheck_NavigationMatrixPasses
          - TestSiteCheck_HomepageCanonicalChangeFence
          - TestSiteCheck_OwnerAcceptanceExportBindingPasses
          - TestSiteCheck_EightIsolatedProjectRootsAndCleanCorpusPass
          - TestSiteCheck_RouteCatalogsAreImmutableAndExhaustive
          - TestSiteCheck_LinkPolicyFixtureAvoidsCredentialShape
          - TestDesignSystem_ErrorAndCorpusBranchesReachThreshold
          - TestDeliveryInventory_ISSUE190GovernanceArtifactsAreClosedRows
