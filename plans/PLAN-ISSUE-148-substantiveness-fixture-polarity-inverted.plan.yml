  # Phase 1: RED — pin polarity against the property packval measures
  # ═══════════════════════════════════════════════════════════════════════
  - id: phase-1
    name: "Phase 1: RED — pin fixture polarity against the combined ruleset"
    tasks:
      - id: TASK-001
        type: test
        title: "Executable polarity pin: real pack test, per-rule attribution, and the TestMain counterfactual (RED)"
        description: |
          Create `cmd/backstop/substantiveness_fixture_polarity_test.go`. All
          three tests MUST FAIL before TASK-002. Run them first and RECORD THE
          ACTUAL FAILURE OUTPUT — a plan that only asserts red is not evidence.

          This file lives in `cmd/backstop` because `repoRoot(t)`
          (`pack_gate_test.go`) and `substantivenessSourceDir(repoRoot)`
          (`gate_substantiveness_e2e.go`) already exist there and already resolve
          the pack SOURCE. Do not re-derive either path with a local literal, and
          do not move the test into `pkg/packval` — that would make packval's own
          tests reach up into the repo root.

          Every test calls `requireAstGrepE2E(t)` first. It is `t.Fatalf` by
          design (sharp edge 10) — do not soften it to `t.Skip`.

          HEADER-COMMENT THE FILE WITH THE NON-OBVIOUS PART, because a future
          reader will otherwise "tidy" the fixtures straight back into the
          defect: both rules ship in ONE `ast-grep/sgconfig.yml` (ISSUE-028), so
          packval's per-fixture verdict is "did ANY rule fire", which is why a
          clean fixture may not contain `t.Fatalf`.

          TestSubstantivenessFixtures_RealPackTestPassesPhase3 (CLM-001).
            Drive the SAME pipeline `pack test` drives:
              packval.NewPipeline(absPackDir, packval.PipelineOptions{Mode: "test"}).Run()
            with `absPackDir := substantivenessSourceDir(repoRoot(t))` — ABSOLUTE,
            per sharp edge 5. Assert `result.Status == "pass"`. On failure, print
            EVERY `result.Errors` entry with its Phase, Check, Rule, Claim and
            Message, so the red state is legible without a second run.
            Assert phase3-fixtures specifically reports `pass` in the phase
            results, not merely that the overall status is pass — an overall
            pass that came from phase3 being skipped is exactly the vacuous shape
            this whole DIR-032 cluster exists to prevent.
            PRE-FIX STATE: fails with two
            `phase3-fixtures/semgrep-positive: positive fixture triggered the
            rule (false positive)` errors.

          TestSubstantivenessFixtures_PolarityHoldsAgainstTheCombinedRuleset (CLM-002).
            This is the test that encodes what the issue's body-level reading
            missed, and it must be DATA-DRIVEN from the manifest, not from
            hardcoded paths — otherwise it stops covering a fixture the moment
            someone adds one. Parse `packs/substantiveness/pack.yml` through the
            real manifest reader, walk `content.ruleset.rules[].claims[].fixtures`,
            and for each declared fixture run the pack's combined config directly:
              ast-grep scan --config <absPackDir>/ast-grep/sgconfig.yml --json <fixture>
            (invoke the binary; this test is about the engine's real verdict, not
            about packval's wrapper — that is what test 1 covers, and the two
            must not collapse into one.)
            Then assert, as a subtest per fixture so the failure names the file:
              * every DECLARED POSITIVE fixture yields ZERO results, from ANY
                rule id;
              * every DECLARED NEGATIVE fixture yields at least one result whose
                `ruleId` EQUALS THE ENCLOSING RULE'S OWN ID **and that survives
                discarding every finding whose extracted symbol metavariable
                (`metaVariables.single.PKG.text` in ast-grep's `--json` output)
                is exactly `t`**. A rule that binds no `PKG` — `hollow-test-go`
                does not — has nothing discarded, so own-rule equality alone
                carries it.
            RULE-ID EQUALITY ALONE IS NOT ENOUGH, AND THAT IS THE WHOLE POINT OF
            THE `t` DISCARD. `t.Fatalf` is a `selector_expression` whose operand
            is the receiver `t`, so it fires `referenced-symbol-go` from inside
            ANY substantive Go test, no matter what property the fixture was
            written to demonstrate. Without the discard, `referenced-symbol-go`'s
            negative fixture satisfies rule-id equality on that boilerplate hit
            alone and the subtest is ALREADY GREEN pre-fix — the assertion would
            be accidentally satisfied rather than discriminating. Comment this in
            the test body so nobody weakens it back to bare equality.
            PRE-FIX STATE, MEASURED 2026-08-17 with real ast-grep 0.43.0 against
            `ast-grep/sgconfig.yml` — all four subtests red:
              hollow/positive.go  -> fires `hollow-test-go` (must be zero)   RED
              hollow/negative.go  -> only `referenced-symbol-go` x3, NO
                                     own-rule finding                        RED
              refsym/positive.go  -> fires `referenced-symbol-go` x2
                                     (`PKG: strings`, `PKG: t`)              RED
              refsym/negative.go  -> exactly ONE own-rule finding, `PKG: t`,
                                     which the discard removes, leaving none  RED
            POST-FIX, MEASURED on the TASK-002 bodies: hollow/negative yields
            `hollow-test-go` (no `PKG`), and refsym/negative yields two own-rule
            findings, `PKG: strings` and `PKG: t` — `strings` survives the
