             rather than claimed. This includes
             `TestSubstantivenessFixtures_TestMainExemptionKeepsThePositiveClean`
             — the CLM-003 counterfactual — so this task is where CLM-003's
             discriminating-pin property is verified post-fix, not merely
             asserted in TASK-002's prose.

          4. Confirm by `git status --porcelain packs/substantiveness` that the
