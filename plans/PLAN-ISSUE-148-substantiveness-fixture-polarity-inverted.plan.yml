  ★★ ── THE ISSUE'S STATED FIX MENU IS FALSIFIED BY MEASUREMENT ─────────── ★★
  ISSUE-148 and DIR-032 item 19 both say the defect is "purely which manifest
  key each is filed under" and that EITHER swapping the manifest keys OR
  swapping the file contents resolves it. **Neither does.** Measured
  2026-08-17, both counterfactuals still fail with the same two errors:

      key-swap only (pack.yml positive: <-> negative: paths swapped, bodies
      untouched)                                   -> STILL 2 errors, unchanged

  The reason is a second, unfiled property of this pack that the issue's
  body-level reading could not see:

      BOTH RULES SHARE ONE sgconfig (ISSUE-028), AND packval's `Passed` MEANS
      "THE ENGINE FIRED", NOT "THIS RULE FIRED".

  `phase3.go:97` calls `executor.RunEngine(packDir, binding, []string{ruleSource,
  f.Path})` with `ruleSource` = `ast-grep/sgconfig.yml` — the PROJECT config that
  loads `ruleDirs: [rules]`, i.e. BOTH `hollow-test-go` and
  `referenced-symbol-go`. So a declared POSITIVE (clean) fixture must trigger
  NEITHER rule, and a declared NEGATIVE fixture need only trigger ONE.

  Measured per-fixture against the real combined ruleset (ast-grep 0.43.0),
  BEFORE any fix:

      hollow-test-go/positive.go   -> hollow-test-go fires        (FALSE POSITIVE)
      hollow-test-go/negative.go   -> referenced-symbol-go x3, own rule SILENT
                                                                 (accidental pass)
      referenced-symbol-go/positive.go -> referenced-symbol-go x2 (FALSE POSITIVE)
                                          (PKG: strings, PKG: t)
      referenced-symbol-go/negative.go -> referenced-symbol-go x1, PKG: `t`
                                                                 (accidental pass)

  Read the middle two rows carefully. Both currently-declared NEGATIVE fixtures
  pass for the WRONG REASON, though in two DIFFERENT ways, and the distinction
  decides how CLM-002 must be asserted:
    * `hollow-test-go/negative.go` fires only the SIBLING rule. Its own rule is
      silent, so plain rule-id equality already catches it.
    * `referenced-symbol-go/negative.go` fires its OWN rule id — but on the
      `t.Fatalf` receiver (`PKG: t`), not on the package-qualified call it was
      written to demonstrate. Plain rule-id equality is ALREADY SATISFIED here
      pre-fix, so CLM-002 discards `PKG: t` findings (see the claim ledger) to
      stay discriminating on this arm.
  That is why the run reports exactly 2 errors rather than 4. The negative half
  of this pack has been vacuously green all along, on top of the inversion the
  issue names.

  A plain content swap inherits that same trap in the other direction: a
  substantive Go test asserts with `t.Fatalf`, `t.Fatalf` is a
  `selector_expression` whose operand is the identifier `t`, and
  `referenced-symbol-go` matches exactly that shape inside any `^Test`-named
  function. So a swapped-in "clean" fixture STILL fires, and phase3 still fails.

  ── THE FIX SHAPE THAT ACTUALLY WORKS (measured green, all six phases) ─────
  The four fixture BODIES are re-authored so each is clean or violating
  **against the combined ruleset**. `pack.yml` is NOT edited in-repo at all —
  no key swap, no version bump (see "version policy" below). Measured
  2026-08-17 on a scratch copy carrying exactly these four bodies:

      ./bin/backstop pack test <abs>/<fixed-copy>
      status: pass
      phase1..phase6 all pass          exit 0

  Two mechanisms make the clean fixtures clean, and BOTH are load-bearing:

    (a) THE ASSERTION IN A CLEAN FIXTURE MUST BE AN UNQUALIFIED CALL. A local
        helper named to match the hollow rule's own assertion vocabulary
        (`require|assert|check|verify|expect|must|Fatal|...`) — e.g.
        `mustEqual(...)` — satisfies `hollow-test-go` while being a plain
        identifier call, not a `selector_expression`, so `referenced-symbol-go`
        does not fire. Measured: NO FINDINGS.

    (b) HELPER FUNCTIONS MAY CONTAIN `t.Fatalf` FREELY. `referenced-symbol-go`
        requires `inside: {matches: is-test, stopBy: end}`, and a
        non-`^Test`-named `function_declaration` is not `is-test`, so calls
        inside `mustEqual` are invisible to it. Measured.

