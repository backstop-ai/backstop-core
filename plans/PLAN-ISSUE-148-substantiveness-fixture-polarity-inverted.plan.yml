            Say WHY in the body: this proves the empty-bodied `TestMain` in the
            positive fixture is a genuine discriminating pin on ISSUE-035
            CLM-001's exemption and not inert filler. Without this test, "move
            TestMain into the clean fixture" would be indistinguishable from
            deleting the exemption's coverage.
            PRE-FIX STATE: fails, because the positive fixture does not yet
            contain TestMain at all.
        files:
