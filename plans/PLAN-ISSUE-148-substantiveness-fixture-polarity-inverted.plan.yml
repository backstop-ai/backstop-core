          TestSubstantivenessFixtures_TestMainExemptionKeepsThePositiveClean (CLM-003).
            The falsification test. Copy the pack tree to `t.TempDir()`, STRIP the
            `^TestMain$` exemption from the COPY's
            `ast-grep/rules/hollow-test-go.yml`, and assert that the hollow-test
