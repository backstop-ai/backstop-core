  11. NO AUTONOMOUS PUSH TO THE EXTERNAL REPO. Phase 5 needs a founder go.
  12. SHARED TREE. Other lanes hold uncommitted work. Never `git stash` (bare
      stash sweeps another agent's edits), never run a full `gate --all` or the
