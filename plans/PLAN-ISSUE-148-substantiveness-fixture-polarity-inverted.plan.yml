  ── SHARP EDGES ────────────────────────────────────────────────────────────
   1. THE COMBINED-RULESET TRAP. `Passed` = "the engine fired", and the engine
      is the whole sgconfig. A positive fixture must be clean w.r.t. BOTH rules.
      Measured: key-swap-only leaves the failure completely unchanged.
   2. `t.Fatalf` IS A QUALIFIED CALL. Any assertion of the form `t.X(...)`
      inside a `^Test`-named function fires `referenced-symbol-go`. A clean
      fixture's assertion must be an UNQUALIFIED call whose identifier matches
      the hollow rule's assertion vocabulary.
   3. `TestMain` MUST HAVE AN EMPTY BODY in the positive fixture. `os.Exit(m.Run())`
      fires `referenced-symbol-go` twice. The empty body still discriminates the
      exemption — verified by counterfactual.
   4. HELPERS ARE INVISIBLE TO Q2. A non-`^Test`-named function may hold
      `t.Fatalf` freely, because `inside: matches: is-test` never matches it.
      This is what makes edge 2 survivable.
   5. `pack test` WITH A RELATIVE packDir has a separate, already-filed sandbox
      defect. ALWAYS pass an ABSOLUTE path. `repoRoot(t)` already returns one —
      do not "tidy" it to a relative path.
   6. DO NOT READ `$?` THROUGH A PIPE. `./bin/backstop pack test X | tail` yields
      tail's status. Measured directly: fixed pack exits 0, broken pack exits 1.
   7. THE ZERO-MATCH RESIDUAL IS NOT YOURS TO CLOSE. 3 tests stay red for a
      different cause. File it (TASK-005). Never weaken a fixture or skip a test
      to make them green.
   8. TWO OWNERS. The in-repo copy is a test SOURCE. The gate consumes the
