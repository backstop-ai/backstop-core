  # ═══════════════════════════════════════════════════════════════════════
  # Phase 2: GREEN — re-author the four in-repo fixture bodies
  # ═══════════════════════════════════════════════════════════════════════
  - id: phase-2
    name: "Phase 2: GREEN — re-author the four in-repo fixture bodies"
    tasks:
      - id: TASK-002
        type: implementation
        title: "Re-author all four fixture bodies so each is clean or violating against the combined ruleset"
        description: |
          Rewrite the four fixture files. DO NOT EDIT `packs/substantiveness/pack.yml` —
          not the keys, not the version (see the version policy and the falsified
          fix menu in the notes). The manifest keys stay
          `positive -> positive.go`, `negative -> negative.go`; the BODIES move.

          The four bodies below were MEASURED GREEN through all six packval
          phases on 2026-08-17 with real ast-grep 0.43.0. Reproduce them
          gofmt-formatted (real tabs); the indentation shown here is spaces only
          so this YAML stays valid.

          Each file KEEPS an explanatory comment, and the comment must state the
          CONVENTION explicitly — "positive fixture = the CLEAN case that must
          NOT trigger; negative fixture = the VIOLATING case that MUST trigger"
          (SPEC-014, BUNDLE-005 REQ-011) — because misreading that convention is
          precisely what produced this defect.

          --- testdata/fixtures/rules/hollow-test-go/positive.go -------------
              package hollowtestgo

              import "testing"

              func helper() int { return 1 }

              // mustEqual is NOT Test-named, so referenced-symbol-go's
              // `inside: matches: is-test` never reaches into it — a helper may
              // hold t.Fatalf freely.
              func mustEqual(t *testing.T, got, want int) {
                  if got != want {
                      t.Fatalf("expected %d, got %d", want, got)
                  }
              }

              // POSITIVE = the CLEAN case: must trigger NEITHER rule of the
              // shared sgconfig. The assertion is the UNQUALIFIED call
              // `mustEqual` — its identifier matches the hollow rule's assertion
              // vocabulary (`must`), so this test is not hollow, while staying a
              // plain identifier call rather than a selector_expression, so the
              // Q2 extraction rule does not fire. A `t.Fatalf` here would fire Q2
              // and make this fixture a false positive.
              func TestSubstantiveExample(t *testing.T) {
                  mustEqual(t, helper(), 1)
              }

              // TestMain is Go's harness entry point and is BY DESIGN never
              // assertion-bearing; the hollow rule EXEMPTS it by name (ISSUE-035
              // CLM-001). The body is EMPTY on purpose: `os.Exit(m.Run())` would
              // fire the Q2 rule. Empty, it is clean ONLY because the exemption
              // holds — which is what makes it a real pin on the exemption.
              func TestMain(m *testing.M) {}

          --- testdata/fixtures/rules/hollow-test-go/negative.go -------------
              package hollowtestgo

              import "testing"

              // NEGATIVE = the VIOLATING case: a hollow test (calls a subject,
              // asserts nothing) MUST trigger hollow-test-go. `helper` is
              // declared in positive.go, same package — these files are under
              // testdata/ and are ast-grep targets, never compiled.
              func TestHollowExample(t *testing.T) {
                  helper()
              }

          --- testdata/fixtures/rules/referenced-symbol-go/positive.go -------
              package referencedsymbolgo

              import "testing"

              func localHelper() int { return 1 }

              func mustBeOne(t *testing.T, got int) {
                  if got != 1 {
                      t.Fatalf("expected 1, got %d", got)
                  }
              }

              // POSITIVE = the CLEAN case: no package-qualified call inside a
              // Test-named function, so referenced-symbol-go does not fire; and
              // an assertion-vocabulary call, so hollow-test-go does not either.
              func TestNoQualifiedCall(t *testing.T) {
                  mustBeOne(t, localHelper())
              }

          --- testdata/fixtures/rules/referenced-symbol-go/negative.go -------
              package referencedsymbolgo

              import (
                  "strings"
                  "testing"
              )

              // NEGATIVE = the VIOLATING case: a package-qualified call inside a
              // test MUST produce a referenced-symbol extraction finding.
              func TestReferencesSymbol(t *testing.T) {
                  got := strings.ToUpper("x")
                  if got != "X" {
                      t.Fatalf("expected X, got %s", got)
                  }
              }

          RUN THE THREE MANDATED TESTS AND REPORT THEM GREEN before handing off.
          If any positive fixture still fires, you have almost certainly
          reintroduced a `t.X(...)` call inside a `^Test`-named function — check
          that before touching anything else, and never "fix" it by editing a
          rule.
        files:
          - packs/substantiveness/testdata/fixtures/rules/hollow-test-go/positive.go
          - packs/substantiveness/testdata/fixtures/rules/hollow-test-go/negative.go
          - packs/substantiveness/testdata/fixtures/rules/referenced-symbol-go/positive.go
          - packs/substantiveness/testdata/fixtures/rules/referenced-symbol-go/negative.go
        claims:
          - CLM-001
          - CLM-002
          - CLM-003
          - CLM-006
        depends_on:
          - TASK-001

      - id: TASK-003
        type: verification
        title: "Gate the in-repo fixture correction and prove the pack passes all six phases"
        description: |
          Diff-scoped verification of the in-repo half.

          1. `./bin/backstop gate` — bare, diff-scoped. This is the inner-loop
