  ── THE THIRD DEFECT PLANNING FOUND, WITHOUT WHICH THE ISSUE'S OWN REPRO STILL
     PASSES SILENTLY ───────────────────────────────────────────────────────
  ISSUE-112's repro is "any repo + typescript-substantiveness on a PATH without
  ast-grep". Fixing mechanism 1 as literally written does NOT catch that repro,
  because of WHICH PACK SET the gate provisions over:

      dispatchPacks := excludeDedicatedStepRules(packs)   // gate.go:895
      if provErr := provisionEngines(dispatchPacks); …     // gate.go:902

  `excludeDedicatedStepRules` (pack_gate.go:123-145) strips every rule whose engine
  declares a dedicated-step gate_type — substantiveness, contracts, coverage —
  BEFORE provisioning sees it. A substantiveness pack's ast-grep engine is
  therefore never walked by `provisionEngines` at all, today or after a
  mechanism-1-only fix. The exclusion exists so those rules are not ALSO dispatched
  context-free by the generic findings step; it has nothing to do with whether their
  tool exists, and using it as the provisioning set is the bug. In this very repo
  that hole covers ast-grep for BOTH backstop-ai/go-substantiveness and
  backstop-ai/go-contracts (enumerated below).

  Fix: provision over the FULL installed-pack set (`packs`), not the post-exclusion
  dispatch set. Tool presence is a property of the tool, not of which step dispatches
  it. This is CLM-002 and it is not optional — without it the acceptance fixture the
  issue itself names cannot go red.

  SHARP EDGE (state it, do not "fix" it): `provisionEngines` walks RULES and
  resolves each rule's engine — it does NOT iterate `manifest.Engines` directly.
  A DECLARED-BUT-UNBOUND engine (no rule references it) is therefore never
  probed, and that is CORRECT: an engine nothing routes to will never be
  dispatched, so its tool's absence cannot produce a vacuous green. It is also
  DEPENDED ON by a live fixture — the classifier e2e's bun-coverage case declares
  an engine no rule binds, and switching the walk to `manifest.Engines` would
  start refusing it for a tool the run never intended to invoke. Widening the
  provisioning set (CLM-002) changes WHICH PACKS' rules are walked; it must not
  change that the walk is RULE-driven. Anyone later "simplifying" this to iterate
  Engines is reintroducing a false refusal, and this paragraph is why.

  SECOND-ORDER EFFECT of CLM-002, owned deliberately rather than incidentally:
  today a dedicated-step engine's allowlist trust gate (pack_gate_provision.go:80)
  is reported only at DISPATCH (pack_gate.go:406 coverage, :587 findings — the trust
  gate inside `runCoverageEngine`, declared :395, and inside `runFindingsEngine`,
  declared :573; do not transpose these two, an earlier revision did), because
  provisioning never saw those rules. After this change the SAME verdict is
  reached earlier and reported by the pack_engines step instead. The verdict is
  unchanged — an un-allowlisted tool is refused either way, with the same message
  — only the reporting step moves. No shipped test asserts the old attribution
  (verified this cycle), so nothing goes red; CLM-002 owns this so it is a
  documented consequence, not a surprise a future reader has to reverse-engineer.

  Mechanism 2 independently catches the same repro at dispatch time (the
  substantiveness step reaches `runFindingsEngine` through the SAME
  `resolveDispatchPackEngines()` seam, gate.go:1210, and already turns any dispatch
  error into a `ConfigErr: true` fail step). Belt AND braces is deliberate here: the
  provisioning refusal is EARLY and legible, the dispatch refusal is the
  backstop that no future call-site rewiring can route around.

