          dimension is expected to be able to run it), but confirm it against this repo's
          real pack set with `./bin/backstop gate --all` in TASK-011 rather than assuming.
        files:
          - cmd/backstop/gate.go
        claims:
          - CLM-002
        depends_on:
          - TASK-003

      - id: TASK-005
        type: verification
        title: "Gate the provisioning lane"
        description: |
          Rebuild `bin/backstop`, then run `./bin/backstop gate` (bare, diff-scoped) and,
