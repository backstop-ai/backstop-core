  - id: phase-2
    name: "Phase 2: Unstartable-binary refusal at the gate dispatch path"
    tasks:
      - id: TASK-006
        type: test
        title: "Pin the *exec.Error refusal across the findings and coverage dispatch channels"
        description: |
          New test file driving the REAL dispatch (dispatchPackEngines / runFindingsEngine /
          runCoverageEngine) with a real check.ExecCommandRunner and a command whose argv[0]
          is a binary guaranteed absent from any machine (a fixed nonsense name, e.g.
          "backstop-absent-engine-112"; do NOT mutate PATH and do NOT depend on a real tool
          being missing). Give the binding a NIL Provision so the allowlist trust gate is
          not what fires — the point is the RUN failing:

            - TestDispatch_UnstartableFindingsEngineFailsLoud — the dispatch returns an
              error (errors.As to *check.ConfigError) naming the pack and the declared
              command, and returns NO violations that could read as a clean scan.
            - TestDispatch_UnstartableEngineFailsLoudWithoutCrashGuard — the same binding
              with CrashGuard explicitly FALSE. This is the issue's exact shape and the
              assertion that stops the fix from being folded into the CrashGuard branch.
            - TestDispatch_NonZeroExitWithSarifStillReportsFindings — CLM-006, the
              anti-over-correction: an engine that STARTS, exits non-zero, and prints SARIF
              still yields its findings and no error. Build it from a tiny script the test
              writes into its own temp dir (a real started process, not a stub runner) so
              the started-vs-unstartable distinction is exercised for real.
            - TestDispatch_UnstartableCoverageEngineFailsLoud and
              TestDispatch_UnstartableCoverageProducerFailsLoud — CLM-005, one per
              `_ = runErr` branch of runCoverageEngine (plain command at pack_gate.go:444,
              declared producer at :432). The producer case still needs a producer script
              that EXISTS on disk (the missing-producer error is a different, already-loud
              path) whose declared command cannot start.

          OBSERVE RED at HEAD: each of the four refusal tests must fail with "expected an
          error, got nil" and a zero-length result — that nil IS the vacuous green
          ISSUE-112 reports. Capture the verbatim output for the as-built notes.
        files:
          - cmd/backstop/dispatch_unstartable_engine_test.go
        claims:
          - CLM-004
          - CLM-005
          - CLM-006
        depends_on: []
        test_names:
          - TestDispatch_UnstartableFindingsEngineFailsLoud
          - TestDispatch_UnstartableEngineFailsLoudWithoutCrashGuard
          - TestDispatch_NonZeroExitWithSarifStillReportsFindings
          - TestDispatch_UnstartableCoverageEngineFailsLoud
          - TestDispatch_UnstartableCoverageProducerFailsLoud

      - id: TASK-007
        type: implementation
        title: "Fail loud on an *exec.Error-class run in runFindingsEngine and runCoverageEngine"
        description: |
          Copy the shape pkg/packval/executor.go:85-90 already ships — do not invent a
          second one, and reference it in the comment so the two stay recognizably the same
          check:

              var execErr *exec.Error
              if errors.As(runErr, &execErr) { … fail loud … }

          runFindingsEngine (pack_gate.go, immediately after the RunStdout at :648, BEFORE
          the stdout_artifact read and the convert): return a *check.ConfigError naming the
          pack, the declared command, the tool that could not be started, and the wrapped
          error. This sits AHEAD of the CrashGuard guard at :709 and is INDEPENDENT of it —
          a CrashGuard engine gets this clearer message too, instead of "crashed: non-zero
          exit with no parseable findings", which mis-describes a binary that never ran.

          runCoverageEngine: replace BOTH `_ = runErr` discards (:432 producer, :444 plain
          command) with the same classification. Everything else about those branches is
          preserved — a coverage tool that STARTS and exits non-zero while still emitting a
          usable profile must keep flowing to convert, exactly as the existing comment
          explains. Keep the `configErrorPassthrough` convention on the coverage path so the
          concrete type survives.

          KEY THE REFUSAL ON THE ERROR CLASS, NEVER ON `runErr != nil`. A rule-fed findings
          engine exits non-zero precisely WHEN it has findings; turning every run error
          fatal would red the gate on every real finding. CLM-006 is the test that catches
          that mistake — if it goes red, the branch is keyed wrong.

          Update the comment at pack_gate.go:649-654, which currently says runErr "is not
          fatal on its own" without the unstartable carve-out, and the CrashGuard comment
          at :705-708. Both are the reasoning a future reader will trust.
        files:
