              the probe record, not only the error, so the test states WHICH tools were
              looked for.
            - TestGateProvisioning_ExclusionSetIsNotTheProvisioningSet — the structural
              guard: `excludeDedicatedStepRules` still strips those rules from the
              DISPATCH set (unchanged, it exists for a different reason), while
              provisioning sees them. Asserting both halves is what stops a later
              simplification from re-collapsing the two sets.

          Reach the real wiring — buildGateSteps / the pack_engines step function — rather
          than calling provisionEngines directly; the defect is IN THE CALL SITE, so a test
          that calls provisionEngines with a hand-picked set cannot see it.
          cmd/backstop/gate_buildsteps_test.go is the precedent for driving buildGateSteps
          from a fixture project root.

          OBSERVE RED at HEAD before TASK-004.
        files:
          - cmd/backstop/gate_provision_dedicated_step_test.go
        claims:
          - CLM-002
        depends_on: []
        test_names:
          - TestGateProvisioning_CoversDedicatedStepEngines
          - TestGateProvisioning_ExclusionSetIsNotTheProvisioningSet

      - id: TASK-004
        type: implementation
        title: "Provision over the full installed-pack set at the gate call site"
        description: |
          In the pack_engines step (gate.go:895-909), pass the FULL `packs` slice to
          `provisionEngines`, not `dispatchPacks`. `dispatchPacks` stays exactly as it is
          for the dispatch call below it — the exclusion is about which step dispatches a
          rule, and must not double as the set whose tools exist.

          Rewrite the comment at gate.go:896-901: it currently states the CLM-026/027/028
          model this lane corrects. Say instead that provisioning presence-checks EVERY
          declared engine tool — assume-present and provision-pinned alike — across the
          whole installed-pack set including dedicated-step engines, because tool presence
