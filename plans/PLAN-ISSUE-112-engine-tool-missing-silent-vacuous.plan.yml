  ── CLAIM LEDGER (ISSUE-112 carries no CLM ids; this lane defines them) ────
    CLM-001  `provisionEngines` presence-checks a binding with a NON-NIL Provision
             exactly as it does an assume-present one: the absent binary yields a
             *check.ConfigError (exit 2, errors.As-detectable) that NAMES the tool,
             the declaring pack, and the pinned version, and NO engine is dispatched.
    CLM-002  the presence check reaches engines whose rules route to a dedicated
             gate step (substantiveness / contracts / coverage): the gate provisions
             over the FULL installed-pack set, not the `excludeDedicatedStepRules`
             dispatch set, so ISSUE-112's own repro shape — a substantiveness pack
             whose ast-grep is absent — is refused before any step dispatches. The
             walk stays RULE-driven (an unbound engine is still never probed), and
             this claim also OWNS the consequent move of the allowlist trust
             refusal's reporting step for dedicated-step engines: same verdict,
             same message, now surfaced by pack_engines rather than at dispatch.
    CLM-003  the assume-present branch is UNCHANGED: a nil-Provision Layer-0 tool
             still fails loud with its existing "backstop never auto-provisions"
             wording, the allowlist trust gate still fires BEFORE any presence probe,
             and backstop still installs nothing in either branch.
    CLM-004  at the gate dispatch path, a findings-engine run whose PROCESS NEVER
             STARTED fails loud — naming the pack, the declared command, and the
             underlying error — REGARDLESS of CrashGuard, instead of being read as a
             finding-free run. "Never started" covers BOTH real Go shapes, since a
             findings command may be bare OR path-ful: an `*exec.Error` (bare name,
             LookPath miss) and an `*fs.PathError` with `Op == "fork/exec"` (a
             path-ful command that could not be exec'd — absent, non-executable, or
             a bad interpreter line). One predicate, both shapes.
    CLM-005  the same never-started refusal governs the coverage dispatch channel, on
             BOTH `runCoverageEngine` branches (declared producer and plain command),
             so an unstartable coverage tool cannot yield an empty record set that
             reads as coverage-clean. The PRODUCER branch is the reason the predicate
             is not `*exec.Error`-only: its command is always path-ful and already
             `os.Stat`-guarded, so its only reachable never-started shape is the
             fork/exec `*fs.PathError`.
    CLM-006  NON-REGRESSION, and the assertion that keeps CLM-004 honest: an engine
             that STARTS and exits NON-ZERO while emitting SARIF still reports its
             findings. Non-zero exit remains a legitimate findings signal (it arrives
             as an `*exec.ExitError`, which is neither never-started shape); the new
             refusal must key on the never-started CLASS, never on `runErr != nil`.
    CLM-007  the four defect-pinning tests are rewritten to the corrected contract
             while KEEPING their existing names (continuity, not compulsion — no gate
             dimension enforces them; see the name-continuity section), and each
             retains its still-true angle: the pinned Provision record survives, the
             bespoke EnsureSemgrep install ladder stays off the provisioning path, and
             semgrep's findings path is unchanged. The still-true halves are the
             substance of this claim — a rewrite that dropped them would be a
             regression wearing the same four names.
    CLM-008  END-TO-END: driving the REAL gate wiring (`buildGateSteps`) over a workspace
             with an installed pack whose declared engine binary is absent yields a
             pack_engines StepResult that REFUSES — Status "fail", ConfigErr true (the
             gate's exit-2 class), with the absent tool NAMED in the message — never a
             silent pass, and never an opaque crash. Asserted on the StepResult rather
             than a whole-gate exit code because the fixture workspace ships no
             backstop.lock, so a whole-gate run halts at pack_lock_verification
             (pkg/gate/gate.go:162-165) before pack_engines is reached; see TASK-009.

