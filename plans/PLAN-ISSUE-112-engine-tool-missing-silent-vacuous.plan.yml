    name: "Phase 1: Presence-check provision-pinned engine tools"
    tasks:
      - id: TASK-001
        type: test
        title: "Rewrite the four defect-pinning provisioning tests and add the absent-tool presence tests"
        description: |
          Rewrite the bodies of the four spec-mandated tests that currently assert the
          defective contract, KEEPING THEIR NAMES (see the mandated-name constraint in
          notes — renaming any of them turns artifact_status_drift red):

            - TestProvision_SemgrepStillPinnedAndProvisioned (pack_gate_provision_test.go)
              now asserts that a semgrep-only pack with NOTHING on PATH FAILS LOUD with a
              *check.ConfigError naming `semgrep`; keeps its still-true second half (the
              binding carries a pinned Provision with a non-empty version).
            - TestProvision_IntroducedEngineAutoProvisioned (dispatch_provision_test.go)
              now asserts the same for a semgrep+ast-grep pack; keeps its pinned-record
              loop verbatim.
            - TestProvision_EnsureSemgrepRetired (dispatch_provision_test.go) inverts its
              behavioral fingerprint: provisioning MUST now probe `semgrep` on PATH (the
              recorded resolver sees it) and MUST refuse when it is absent, while STILL
              never installing anything — that is the stronger proof the bespoke
              EnsureSemgrep ladder is off the path. Keep the nil-Provision sibling
              contrast (golangci-lint probed) and the pinned-record assertion.
            - TestSemgrep_OnlyProvisioningChanges (semgrep_unchanged_test.go) half (b)
              inverts to a fail-loud expectation. Half (a) — the pinned Provision record
              — and the CrashGuard assertion are UNTOUCHED: this lane does not change the
              findings path, and that test is the guard on that promise.

          Every rewritten docstring states in one line that the name is retained because a
          shipped spec mandates it, and that ISSUE-112 supersedes the assertion it made.

          Then ADD the new coverage:
            - TestProvision_ProvisionPinnedToolAbsentFailsLoud — the general case over a
              pack-declared provisioned engine (build it with withTestAllowlist so the
              allowlist gate passes and the PRESENCE check is what fires).
            - TestProvision_ProvisionPinnedToolPresentPasses — the anti-vacuous twin: with
              the tool present the same pack provisions cleanly. Without this, the fix is
              satisfiable by refusing everything.
            - TestProvision_AbsentToolErrorNamesPackAndPin — the message NAMES the tool,
              the declaring pack, and the pinned version, and does NOT promise an install.
            - TestProvision_AllowlistRefusalPrecedesPresenceProbe — ordering guard: an
              un-allowlisted provisioned tool is still refused by the allowlist BEFORE any
              presence probe, so TestProvisionEngines_UnallowlistedToolFailsLoudBeforeProvision
              keeps its meaning rather than passing for the new reason.

          OBSERVE ALL OF THESE RED at HEAD with production code untouched before TASK-002.
          The four rewrites failing is the falsification of mechanism 1.
        files:
          - cmd/backstop/pack_gate_provision_test.go
          - cmd/backstop/dispatch_provision_test.go
          - cmd/backstop/semgrep_unchanged_test.go
        claims:
          - CLM-001
          - CLM-003
          - CLM-007
        depends_on: []
        test_names:
          - TestProvision_SemgrepStillPinnedAndProvisioned
          - TestProvision_IntroducedEngineAutoProvisioned
          - TestProvision_EnsureSemgrepRetired
          - TestSemgrep_OnlyProvisioningChanges
          - TestProvision_ProvisionPinnedToolAbsentFailsLoud
          - TestProvision_ProvisionPinnedToolPresentPasses
          - TestProvision_AbsentToolErrorNamesPackAndPin
          - TestProvision_AllowlistRefusalPrecedesPresenceProbe

      - id: TASK-002
        type: implementation
        title: "Presence-check provision-pinned tools in provisionEngines"
        description: |
          Delete the `if binding.Provision != nil { continue }` skip
          (pack_gate_provision.go:85-87) and fold provision-pinned bindings into the same
          required-tool collection the assume-present ones use. Carry ATTRIBUTION with each
          required tool — declaring pack, engine name, and `Provision` (nil for
          assume-present) — so the refusal can name them; the current `map[string]struct{}`
          dedupe loses that. Keep the dedupe (a pack declaring go-build and go-test still
          probes `go` once) and keep the sorted, deterministic probe order.

          PROBE argv[0] of the declared command via the existing `engineToolName`; use
          Provision.Tool/Version only in the MESSAGE (see note 4 — ast-grep vs `sg`). An
          empty command still means "the pack ships its own executable", so it is still
          skipped. The allowlist trust gate stays exactly where it is, ahead of the probe.

          Two message shapes, one per branch, both *check.ConfigError:
            - nil Provision: UNCHANGED wording, including the "backstop never
              auto-provisions it" phrase that dispatch_provision_test.go:67 asserts on.
            - non-nil Provision: names the tool, the declaring pack, the pinned version,
              and states that backstop does not install pack-declared tools — the pin is a
              trust allowlist entry, not an installer. It must NOT promise an install.

          Rewrite the file-header comment block (pack_gate_provision.go:13-28) — it is the
          load-bearing statement of the model that was wrong, and leaving it is how the
          skip comes back. State the corrected split: BOTH kinds are presence-checked and
          fail loud; the Provision record governs TRUST (allowlist + version pin), never
          installation; backstop installs nothing, ever. Cite ISSUE-112.
        files:
          - cmd/backstop/pack_gate_provision.go
        claims:
          - CLM-001
          - CLM-003
          - CLM-007
        depends_on:
