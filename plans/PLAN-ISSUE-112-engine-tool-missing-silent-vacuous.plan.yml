  ── THE DEFECT, MEASURED AT HEAD (872bc9c, 2026-08-15) ─────────────────────
  A findings engine whose tool is ABSENT from PATH passes the gate green having
  scanned nothing. Two independent mechanisms have to fail for that to happen, and
  BOTH are live at HEAD:

  MECHANISM 1 — no presence check at all for provision-pinned tools.
  `provisionEngines` (cmd/backstop/pack_gate_provision.go:85-87) explicitly
  `continue`s past every binding with a non-nil Provision, on the stated theory
  that they are "pinned + auto-provisioned through the declared model". Nothing in
  this codebase installs anything: Provision is a TRUST-ALLOWLIST PIN and nothing
  more (re-confirmed this session by ISSUE-082's work on
  pkg/pack/engine/allowlist.go). So semgrep and ast-grep get NEITHER an install NOR
  a presence check, and flow straight into dispatch.

  MECHANISM 2 — the unstartable binary is discarded at the gate dispatch path.
  `runFindingsEngine` (cmd/backstop/pack_gate.go:648-711) captures `runErr` from
  `runner.RunStdout` and consults it ONLY under `binding.CrashGuard`
  (pack_gate.go:709). For every non-CrashGuard engine — which is every rule-fed
  findings engine, semgrep and ast-grep included, per the explicit CrashGuard
  assertion in cmd/backstop/semgrep_unchanged_test.go:49 (inside
  TestSemgrep_UnchangedSharedEngine, :24) — a "the process never started" error is
  dropped on the floor: empty stdout flows through convert, the LENIENT
  `check.ParsePackFindings` reads zero findings, and the step reports a clean pass.
  `runCoverageEngine` is worse in form: it discards its run error with a literal
  `_ = runErr` on BOTH branches (pack_gate.go:432 producer, pack_gate.go:444 plain
  command).

  ── THE ERROR SHAPE: "NEVER STARTED" IS TWO GO TYPES, NOT ONE ──────────────
  Read this before writing either the test or the check. Go's `exec.Command`
  consults LookPath — and therefore can produce an `*exec.Error` ("executable file
  not found in $PATH") — ONLY when `filepath.Base(name) == name`, i.e. a BARE
  command name with no path separator. A separator-bearing command never goes
  through LookPath at all; when its exec fails, the error is an `*fs.PathError`
  with `Op == "fork/exec"` wrapping the syscall errno (ENOENT, EACCES for a file
  without the exec bit, ENOEXEC for a bad interpreter line).

  That distinction is load-bearing HERE, not academic, because path-ful engine
  commands are real on both channels:
    - the coverage PRODUCER branch is ALWAYS path-ful — `producerPath :=
      filepath.Join(packRoot, …)` (pack_gate.go:424) — and is already `os.Stat`-
      guarded at :425, so a real producer run can NEVER yield an `*exec.Error`.
      A narrow `*exec.Error` check on that branch would be greenable only by a
      stub runner returning a synthetic error, i.e. VACUOUSLY.
    - a findings engine's command can be path-ful too: cmd/backstop/
      bun_dispatch_e2e_test.go:59 rewrites its fixture binding's Command to an
      ABSOLUTE script path. A narrow check would silently miss that whole class.

  SO: the refusal keys on "the process never started", expressed as ONE predicate
  covering BOTH real shapes — an `*exec.Error`, OR an `*fs.PathError` whose `Op`
  is `"fork/exec"`. Not on `runErr != nil` (see CLM-006), and not on the errno
  value (that would bake OS knowledge). One unexported helper in pack_gate.go,
  used by BOTH runFindingsEngine and runCoverageEngine — one authority, not a copy
  per call site.

  pkg/packval/executor.go:85-90 is the SEED of this shape, and does it for
  `backstop pack test` — `errors.As(runErr, &execErr)` on `*exec.Error`, fail
  loud, with the reason spelled out in its own comment ("a broken run, not a
  finding-free pass"). The gate dispatch path — the one `backstop gate` actually
  runs — never got that treatment at all. Take packval's REASONING verbatim; the
  gate's predicate is deliberately WIDER than packval's for the path-ful reason
  above. Note in passing (do NOT fix it here, it is a different lane over a
  different command): packval's own check carries the same narrowness, so a
  path-ful pack engine that cannot start still reads clean under `pack test`.
  That is worth its own issue, filed citing ISSUE-112 — not a scope creep into
  this one.

