  1. `backstop code check` DOES NOT EXIST. The inner loop is `go test`; the gate
     loop is `./bin/backstop gate` (bare = diff-scoped, `--all` = full sweep,
     `--file <path>` = one file, one path per invocation — ISSUE-093 is open).
  2. On PATH here: go, golangci-lint, semgrep, ast-grep (and `sg`), jq. CI installs
     semgrep==1.96.0 and ast-grep 0.43.0 at pinned versions
     (.github/workflows/ci.yml:72-76 and :223-227), so the new presence check is
     satisfied in CI as well as locally. THIS IS A BLAST-RADIUS FACT, NOT A DETAIL:
     if either install step were missing, this fix would turn CI red — correctly,
     but loudly. Re-check both workflow jobs before declaring done.
  3. The provision-pinned tools this repo's installed packs declare, i.e. exactly
     what starts being presence-checked:
       semgrep  1.96.0  backstop-ai/ci-workflows        (gate_type findings)
       ast-grep 0.43.0  backstop-ai/go-contracts        (gate_type contracts)   ← behind the exclusion hole
       ast-grep 0.43.0  backstop-ai/go-substantiveness  (gate_type substantiveness) ← behind the exclusion hole
       grep     *       backstop-ai/go-contracts        (gate_type contracts)
     `grep`'s `*` pin must not trip the presence check (probe presence, never
     version). The nil-Provision tools (go, golangci-lint, go-arch-lint) are already
     presence-checked today and must keep behaving identically.
  4. PROBE argv[0] OF THE DECLARED COMMAND (`engineToolName(binding.Command)`), not
     `Provision.Tool`. argv[0] is what `exec` will actually resolve; Provision.Tool
     is the TRUST key and the two can legitimately differ (ast-grep ships `sg` as a
     second entry point). Probe argv[0]; say so in the docstring so a later reader
     does not "unify" them.
     THE MESSAGE MUST NAME BOTH, and this is not cosmetic — TASK-009's fixture is
     built ON the divergence, so a message that named only one of them would make
     that test's own assertion unwritable. Name (a) the PROBED argv[0] as the thing
     that was not found — it is what the user must actually put on PATH — and (b)
     the Provision.Tool + Version as the trust attribution ("declared by pack X,
     pinned at Y"). When the two are equal the message simply reads naturally; when
     they diverge the reader learns both the missing binary and the pin it rode in
     on. This is what CLM-001's "NAMES the tool, the declaring pack, and the pinned
     version" means: the probed name AND the pin, never the pin alone.
  5. Existing test helpers to reuse, not re-create: `withBinaryResolver`,
     `recordingBinaryResolver`, `onlyRules`, `goToolchainManifest`,
     `builtinTestRegistry`, `withTestAllowlist`/`absentTool`. The `binaryResolver`
     package seam is how absence is simulated without touching the host PATH — never
     mutate PATH. EXCEPTION, and it is a hard one: gate_substantiveness_e2e.go's
     workspace builders are READ-ONLY to this lane — that file is in
     PLAN-ISSUE-113's scope this cycle. TASK-009 hand-builds its workspace instead;
     the reasoning is spelled out there.
  6. Dispatch errors ALREADY surface correctly once returned: the pack_engines step
     (gate.go:915-922) and the substantiveness step (gate.go:1211-1218) both map a
     dispatch error to `ConfigErr: true` + a fail StepResult (exit 2). So CLM-004
     needs NO new plumbing at the step layer — return the error and the loudness is
     already wired. Do not add a second reporting path.
  7. REBUILD `bin/backstop` before any gate run that is meant to prove this change.
     A stale binary gates the old dispatch and its green proves nothing.
  8. Report TRUE exit codes (`echo $?`); never mask a non-zero behind a pipe.

phases:
  - id: phase-1
    name: "Phase 1: Presence-check provision-pinned engine tools"
    tasks:
      - id: TASK-001
        type: test
        title: "Rewrite the four defect-pinning provisioning tests and add the absent-tool presence tests"
        description: |
          Rewrite the bodies of the four tests that currently assert the defective
          contract, KEEPING THEIR NAMES (see the name-continuity constraint in notes —
          no gate dimension enforces these names, so this is a continuity call, not a
          compulsion; do not claim otherwise in a docstring):

            - TestProvision_SemgrepStillPinnedAndProvisioned (pack_gate_provision_test.go)
              now asserts that a semgrep-only pack with NOTHING on PATH FAILS LOUD with a
              *check.ConfigError naming `semgrep`; keeps its still-true second half (the
              binding carries a pinned Provision with a non-empty version).
            - TestProvision_IntroducedEngineAutoProvisioned (dispatch_provision_test.go)
              now asserts the same for a semgrep+ast-grep pack; keeps its pinned-record
              loop verbatim.
            - TestProvision_EnsureSemgrepRetired (dispatch_provision_test.go) inverts its
              behavioral fingerprint: provisioning MUST now probe `semgrep` on PATH (the
              recorded resolver sees it) and MUST refuse when it is absent, while STILL
              never installing anything — that is the stronger proof the bespoke
              EnsureSemgrep ladder is off the path. Keep the nil-Provision sibling
              contrast (golangci-lint probed) and the pinned-record assertion.
            - TestSemgrep_OnlyProvisioningChanges (semgrep_unchanged_test.go) half (b)
              inverts to a fail-loud expectation. Half (a) — the pinned Provision record
              — is UNTOUCHED: this lane does not change the findings path, and that half
              is the guard on that promise. The CrashGuard assertion is a DIFFERENT
              test: it sits at semgrep_unchanged_test.go:49 inside
              TestSemgrep_UnchangedSharedEngine (:24), declared by SPEC-034 CLM-020, and
              is not edited here — leave that whole test alone. It is in this task's file
              scope only because it shares a file.

          Every rewritten docstring states in one line that ISSUE-112 SUPERSEDES the
          assertion the test used to make, and that the name is kept for continuity with
          the SPEC-031/SPEC-034 history a reader will follow. It must NOT say a shipped
          spec mandates the name — SPEC-034 is `replaced` (terminal, excluded from
          artifact_status_drift) and SPEC-031 is `draft` (excluded from
          test_verification), so that sentence would bake a false claim into the source.

          Then ADD the new coverage:
            - TestProvision_ProvisionPinnedToolAbsentFailsLoud — the general case over a
              pack-declared provisioned engine (build it with withTestAllowlist so the
              allowlist gate passes and the PRESENCE check is what fires).
            - TestProvision_ProvisionPinnedToolPresentPasses — the anti-vacuous twin: with
              the tool present the same pack provisions cleanly. Without this, the fix is
              satisfiable by refusing everything.
            - TestProvision_AbsentToolErrorNamesPackAndPin — the message NAMES the tool,
              the declaring pack, and the pinned version, and does NOT promise an install.
            - TestProvision_AllowlistRefusalPrecedesPresenceProbe — ordering guard: an
              un-allowlisted provisioned tool is still refused by the allowlist BEFORE any
              presence probe, so TestProvisionEngines_UnallowlistedToolFailsLoudBeforeProvision
              keeps its meaning rather than passing for the new reason.

          OBSERVE ALL OF THESE RED at HEAD with production code untouched before TASK-002.
          The four rewrites failing is the falsification of mechanism 1.
        files:
          - cmd/backstop/pack_gate_provision_test.go
          - cmd/backstop/dispatch_provision_test.go
          - cmd/backstop/semgrep_unchanged_test.go
        claims:
          - CLM-001
          - CLM-003
          - CLM-007
        depends_on: []
        test_names:
          - TestProvision_SemgrepStillPinnedAndProvisioned
          - TestProvision_IntroducedEngineAutoProvisioned
          - TestProvision_EnsureSemgrepRetired
          - TestSemgrep_OnlyProvisioningChanges
          - TestProvision_ProvisionPinnedToolAbsentFailsLoud
          - TestProvision_ProvisionPinnedToolPresentPasses
          - TestProvision_AbsentToolErrorNamesPackAndPin
          - TestProvision_AllowlistRefusalPrecedesPresenceProbe

      - id: TASK-002
        type: implementation
        title: "Presence-check provision-pinned tools in provisionEngines"
        description: |
          Delete the `if binding.Provision != nil { continue }` skip
          (pack_gate_provision.go:85-87) and fold provision-pinned bindings into the same
          required-tool collection the assume-present ones use. Carry ATTRIBUTION with each
          required tool — declaring pack, engine name, and `Provision` (nil for
          assume-present) — so the refusal can name them; the current `map[string]struct{}`
          dedupe loses that. Keep the dedupe (a pack declaring go-build and go-test still
          probes `go` once) and keep the sorted, deterministic probe order.

          PROBE argv[0] of the declared command via the existing `engineToolName`; use
          Provision.Tool/Version only in the MESSAGE (see note 4 — ast-grep vs `sg`). An
          empty command still means "the pack ships its own executable", so it is still
          skipped. The allowlist trust gate stays exactly where it is, ahead of the probe.

          Two message shapes, one per branch, both *check.ConfigError:
            - nil Provision: UNCHANGED wording, including the "backstop never
              auto-provisions it" phrase that dispatch_provision_test.go:67 asserts on.
            - non-nil Provision: names the tool, the declaring pack, the pinned version,
              and states that backstop does not install pack-declared tools — the pin is a
              trust allowlist entry, not an installer. It must NOT promise an install.

          INFORMATIONAL, no action needed — flagged so a future failure is not a mystery:
          gate_buildsteps_test.go:97 asserts a pack_engines violation message CONTAINS
          "broken pack", over a fixture whose only rule binds `engine: semgrep`
          (:73). semgrep carries a non-nil Provision, so after this task its argv[0] is
          presence-probed at provisioning — which runs BEFORE dispatch, i.e. before the
          broken-pack error that assertion is waiting for. With `semgrep` on PATH (true
          locally and in CI, note 2) the probe passes and the assertion is reached
          unchanged; without it, that test now fails with a "not found on PATH" message
          instead. The assertion became environment-coupled as a side effect of this
          lane. Do NOT weaken it and do NOT add a resolver seam to that test — just know
          that a CI image dropping semgrep would surface here first.

          Rewrite the file-header comment block (pack_gate_provision.go:13-28) — it is the
          load-bearing statement of the model that was wrong, and leaving it is how the
          skip comes back. State the corrected split: BOTH kinds are presence-checked and
          fail loud; the Provision record governs TRUST (allowlist + version pin), never
          installation; backstop installs nothing, ever. Cite ISSUE-112.
        files:
          - cmd/backstop/pack_gate_provision.go
        claims:
          - CLM-001
          - CLM-003
          - CLM-007
        depends_on:
          - TASK-001

      - id: TASK-003
        type: test
        title: "Pin that gate provisioning covers dedicated-step engines"
        description: |
          New test file asserting CLM-002 — the exclusion hole that would otherwise let
          ISSUE-112's own repro pass silently even after TASK-002:

            - TestGateProvisioning_CoversDedicatedStepEngines — a manifest whose ONLY rules
              bind an engine with a dedicated-step gate_type (substantiveness or contracts)
              and a pinned Provision, with the tool ABSENT via the recording binaryResolver
              seam. The gate's provisioning must PROBE that tool and REFUSE. Assert against
              the probe record, not only the error, so the test states WHICH tools were
              looked for.
            - TestGateProvisioning_ExclusionSetIsNotTheProvisioningSet — the structural
              guard: `excludeDedicatedStepRules` still strips those rules from the
              DISPATCH set (unchanged, it exists for a different reason), while
              provisioning sees them. Asserting both halves is what stops a later
              simplification from re-collapsing the two sets.

          Reach the real wiring — buildGateSteps / the pack_engines step function — rather
          than calling provisionEngines directly; the defect is IN THE CALL SITE, so a test
          that calls provisionEngines with a hand-picked set cannot see it.
          cmd/backstop/gate_buildsteps_test.go is the precedent for driving buildGateSteps
          from a fixture project root.

          OBSERVE RED at HEAD before TASK-004. NOTE for whoever runs the green check:
          this test's absent-tool assertion only becomes meetable once BOTH TASK-002
          (provision-pinned bindings are probed at all) and TASK-004 (the full pack set
          reaches provisioning) have landed — which is why TASK-004 depends on both.
        files:
          - cmd/backstop/gate_provision_dedicated_step_test.go
        claims:
          - CLM-002
        depends_on: []
        test_names:
          - TestGateProvisioning_CoversDedicatedStepEngines
          - TestGateProvisioning_ExclusionSetIsNotTheProvisioningSet

      - id: TASK-004
        type: implementation
        title: "Provision over the full installed-pack set at the gate call site"
        description: |
          In the pack_engines step (gate.go:895-909), pass the FULL `packs` slice to
          `provisionEngines`, not `dispatchPacks`. `dispatchPacks` stays exactly as it is
          for the dispatch call below it — the exclusion is about which step dispatches a
          rule, and must not double as the set whose tools exist.

          Rewrite the comment at gate.go:896-901: it currently states the CLM-026/027/028
          model this lane corrects. Say instead that provisioning presence-checks EVERY
          declared engine tool — assume-present and provision-pinned alike — across the
          whole installed-pack set including dedicated-step engines, because tool presence
          is a property of the tool and not of the dispatching step. Cite ISSUE-112.

          Do NOT change the walk itself: `provisionEngines` resolves engines through
          RULES, and an engine no rule binds stays unprobed (see the sharp edge in notes
          — a live classifier-e2e fixture depends on that). This task widens WHICH PACKS'
          rules are walked, nothing else.

          OWNED SIDE EFFECT (document it in the comment, do not treat it as incidental):
          for dedicated-step engines the allowlist trust refusal
          (pack_gate_provision.go:80) now surfaces from the pack_engines step rather than
          from dispatch (pack_gate.go:406 in `runCoverageEngine`, :587 in
          `runFindingsEngine`). Same verdict, same message, earlier reporting step. No
          shipped test asserts the old attribution.

          TRIPWIRE: the comment you write here must NOT contain the substring
          `bridged` — gate_bridge_deletion_test.go:61 scans the whole file for it. See
          the sibling-plans section. Run `grep -n bridged cmd/backstop/gate.go` (must
          print nothing) before handing off to TASK-005.

          Watch for a false refusal: a pack whose dedicated dimension is capability-absent
          still gets its tool probed. That is intended (an installed pack that declares a
          dimension is expected to be able to run it), but confirm it against this repo's
          real pack set with `./bin/backstop gate --all` in TASK-011 rather than assuming.

          SEQUENCING: this depends on TASK-002 as well as TASK-003. TASK-003's
          "pinned Provision, tool ABSENT → refusal" assertion needs BOTH halves live —
          the full pack set reaching `provisionEngines` (this task) AND provision-pinned
          bindings actually being probed (TASK-002). Landing this lane in parallel with
          the 001→002 lane would leave TASK-003 unmeetable at the moment it is checked.
        files:
          - cmd/backstop/gate.go
        claims:
          - CLM-002
        depends_on:
          - TASK-002
          - TASK-003

      - id: TASK-005
        type: verification
        title: "Gate the provisioning lane"
        description: |
          Rebuild `bin/backstop`, then run `./bin/backstop gate` (bare, diff-scoped) and,
          for the two production files this phase touched, `./bin/backstop gate --file
          cmd/backstop/pack_gate_provision.go` and `./bin/backstop gate --file
          cmd/backstop/gate.go` (one path per invocation — repeated --file is silently
          dropped, ISSUE-093). Report true exit codes.

          Before that, confirm the full package is green unfiltered:
          `go test ./cmd/backstop/... -race -count=1`. The four rewritten tests are the
          ones to read closely — they were green for the wrong reason at HEAD and must now
          be green for the right one.
        files:
          - cmd/backstop/pack_gate_provision.go
          - cmd/backstop/gate.go
          - cmd/backstop/pack_gate_provision_test.go
          - cmd/backstop/dispatch_provision_test.go
          - cmd/backstop/gate_provision_dedicated_step_test.go
        claims:
          - CLM-001
          - CLM-002
          - CLM-003
          - CLM-007
        depends_on:
          - TASK-002
          - TASK-004

  - id: phase-2
    name: "Phase 2: Unstartable-binary refusal at the gate dispatch path"
    tasks:
      - id: TASK-006
        type: test
        title: "Pin the never-started refusal across the findings and coverage dispatch channels"
        description: |
          New test file driving the REAL dispatch (dispatchPackEngines / runFindingsEngine /
          runCoverageEngine) with a real check.ExecCommandRunner — NEVER a stub runner
          returning a synthetic error, which is the one way these tests could go green
          vacuously. Every unstartable case is produced by a REAL failed exec.

          BINDING SHAPE — all three constraints are load-bearing, and each has a SILENT,
          MISATTRIBUTED failure mode if got wrong:
            - NIL Provision, so the allowlist trust gate is not what fires
              (checkEngineToolAllowed returns nil immediately for a nil-Provision
              binding, pack_gate.go:813-815) — the point is the RUN failing. NOTE THE
              SCOPE OF THIS INSTRUCTION: it is correct HERE only because this task calls
              the dispatch functions DIRECTLY and never goes through `provisionEngines`.
              It is WRONG for TASK-009, which drives the whole gate — see the explicit
              warning there before copying this binding shape across.
            - NO `convert` script. A declared-but-absent convert hard-errors "broken pack
              … missing convert script" (pack_gate.go:691) — a loud error, but the WRONG
              one, and it fires before the never-started predicate is ever consulted.
            - NO `stdout_artifact`. A declared-but-unproduced artifact hard-errors
              "declared stdout_artifact … not produced" (pack_gate.go:671) — which an
              unstartable binary ALWAYS triggers, so the HEAD-red would read "expected
              nil, got an artifact error" instead of the intended "expected an error, got
              nil", and the green would prove nothing about this lane.
          In short: pack.yml + one rule file, nothing else. An implementer copying a
          binding out of another fixture by habit gets one of the last two wrong.

          TWO REAL WAYS to make a real exec fail; read the error-shape section in notes
          first, then use BOTH (a test that only builds one shape leaves half the defect
          class uncovered):
            (a) BARE absent name — argv[0] is a fixed nonsense command with no path
                separator, e.g. "backstop-absent-engine-112". LookPath misses →
                `*exec.Error`. Do NOT mutate PATH and do NOT depend on a real tool being
                missing on the host.
            (b) PATH-FUL unstartable file — a file the test writes into its own t.TempDir()
                with mode 0o644 (present, but no exec bit). exec fails →
                `*fs.PathError{Op: "fork/exec"}`. This is not a contrived shape: it is
                exactly what a pack whose script lost its exec bit in transit produces.

          The tests:
            - TestDispatch_UnstartableFindingsEngineFailsLoud — BOTH shapes as subtests
              (bare-absent and path-ful-non-executable; the path-ful case mirrors
              bun_dispatch_e2e_test.go:59, which rewrites a fixture binding's Command to an
              absolute script path). Each returns an error (errors.As to
              *check.ConfigError) naming the pack and the declared command, and NO
              violations that could read as a clean scan. Assert the CLASS, not a Go type
              name in a string.
            - TestDispatch_UnstartableEngineFailsLoudWithoutCrashGuard — the same binding
              with CrashGuard explicitly FALSE. This is the issue's exact shape and the
              assertion that stops the fix from being folded into the CrashGuard branch.
            - TestDispatch_NonZeroExitWithSarifStillReportsFindings — CLM-006, the
              anti-over-correction: an engine that STARTS, exits non-zero, and prints SARIF
              still yields its findings and no error. Build it from a tiny EXECUTABLE
              script (mode 0o755) the test writes into its own temp dir — a real started
              process. This is the twin of case (b) above and the pair is what proves the
              predicate discriminates started-vs-never-started rather than
              path-ful-vs-bare: same shape of command, opposite verdict, and the only
              difference is the exec bit.
            - TestDispatch_UnstartableCoverageEngineFailsLoud — CLM-005, the plain-command
              branch (pack_gate.go:444). Use shape (a), the bare absent name.
            - TestDispatch_UnstartableCoverageProducerFailsLoud — CLM-005, the declared
              producer branch (pack_gate.go:432). This case can ONLY use shape (b):
              `producerPath` is `filepath.Join(packRoot, …)` and is already `os.Stat`-
              guarded at :425, so the script MUST exist on disk (a missing producer is a
              different, already-loud error) and must fail at exec — write it under packRoot
              at mode 0o644. A real run here can never produce an `*exec.Error`; asserting
              that type would be unimplementable without a stub.

          OBSERVE RED at HEAD: each refusal case must fail with "expected an error, got nil"
          and a zero-length result — that nil IS the vacuous green ISSUE-112 reports.
          Capture the verbatim output for the as-built notes.
        files:
          - cmd/backstop/dispatch_unstartable_engine_test.go
        claims:
          - CLM-004
          - CLM-005
          - CLM-006
        depends_on: []
        test_names:
          - TestDispatch_UnstartableFindingsEngineFailsLoud
          - TestDispatch_UnstartableEngineFailsLoudWithoutCrashGuard
          - TestDispatch_NonZeroExitWithSarifStillReportsFindings
          - TestDispatch_UnstartableCoverageEngineFailsLoud
          - TestDispatch_UnstartableCoverageProducerFailsLoud

      - id: TASK-007
        type: implementation
        title: "Fail loud on a never-started run in runFindingsEngine and runCoverageEngine"
        description: |
          Add ONE unexported predicate in pack_gate.go — e.g.
          `runNeverStarted(runErr error) bool` — and call it from BOTH runFindingsEngine and
          runCoverageEngine. One authority, not a copy per call site; a second copy is how
          the two branches drift apart.

          The predicate is WIDER than pkg/packval/executor.go:85-90's, deliberately, and its
          doc comment must say why (see the error-shape section in notes). It returns true
          for EITHER real never-started shape:

              var execErr *exec.Error
              if errors.As(runErr, &execErr) { return true }        // bare name, LookPath miss
              var pathErr *fs.PathError
              if errors.As(runErr, &pathErr) && pathErr.Op == "fork/exec" { return true }
              return false                                          // started; ExitError et al. are not our business

          Key it on `Op == "fork/exec"` — NOT on the errno (ENOENT / EACCES / ENOEXEC), which
          would bake OS knowledge, and NOT on a `*exec.ExitError`, which means the process
          DID start (CLM-006). packval's narrow `*exec.Error`-only check is the SEED of this
          shape and the comment should reference it — but state plainly that the gate's
          predicate is wider because gate engine commands are legitimately PATH-FUL (the
          coverage producer at pack_gate.go:424 always is, and is `os.Stat`-guarded at :425,
          so `*exec.Error` is UNREACHABLE on that branch — a narrow check there would be
          greenable only by a stub runner, i.e. vacuously). Do NOT widen packval's own check
          in this lane; it is a different command over a different path and gets its own
          issue.

          runFindingsEngine (pack_gate.go, immediately after the RunStdout at :648, BEFORE
          the stdout_artifact read and the convert): return a *check.ConfigError naming the
          pack, the declared command, the tool that could not be started, and the wrapped
          error. This sits AHEAD of the CrashGuard guard at :709 and is INDEPENDENT of it —
          a CrashGuard engine gets this clearer message too, instead of "crashed: non-zero
          exit with no parseable findings", which mis-describes a binary that never ran.

          runCoverageEngine: replace BOTH `_ = runErr` discards (:432 producer, :444 plain
          command) with the same classification. Everything else about those branches is
          preserved — a coverage tool that STARTS and exits non-zero while still emitting a
          usable profile must keep flowing to convert, exactly as the existing comment
          explains. Keep the `configErrorPassthrough` convention on the coverage path so the
          concrete type survives.

          KEY THE REFUSAL ON THE ERROR CLASS, NEVER ON `runErr != nil`. A rule-fed findings
          engine exits non-zero precisely WHEN it has findings; turning every run error
          fatal would red the gate on every real finding. CLM-006 is the test that catches
          that mistake — if it goes red, the branch is keyed wrong.

          Update the comment at pack_gate.go:649-654, which currently says runErr "is not
          fatal on its own" without the unstartable carve-out, and the CrashGuard comment
          at :705-708. Both are the reasoning a future reader will trust.
        files:
          - cmd/backstop/pack_gate.go
        claims:
          - CLM-004
          - CLM-005
          - CLM-006
        depends_on:
          - TASK-006

      - id: TASK-008
        type: verification
        title: "Gate the dispatch lane"
        description: |
          Rebuild `bin/backstop`, then `./bin/backstop gate --file cmd/backstop/pack_gate.go`
          and bare `./bin/backstop gate`. Report true exit codes.

          Run `go test ./cmd/backstop/... ./pkg/check/... ./pkg/packval/... -race -count=1`
          unfiltered. pkg/packval is included as a blast-radius read, not because it changed:
          it owns the reference implementation this lane copied, and a divergence introduced
          there would be exactly the drift worth catching early.
        files:
          - cmd/backstop/pack_gate.go
          - cmd/backstop/dispatch_unstartable_engine_test.go
        claims:
          - CLM-004
          - CLM-005
          - CLM-006
        depends_on:
          - TASK-007

  - id: phase-3
    name: "Phase 3: End-to-end regression — an absent engine tool is a named refusal"
    tasks:
      - id: TASK-009
        type: test
        title: "E2E: a gate run over a pack whose engine binary is absent refuses loudly and names the tool"
        description: |
          The acceptance fixture ISSUE-112 asks for, expressed in this repo's terms. The
          issue's literal repro ("any repo + typescript-substantiveness without ast-grep")
          is not reproducible here without a TypeScript pack and without removing a tool
          from the host, so build the EQUIVALENT: a locally-installed fixture pack, in a
          temp workspace, declaring a findings/substantiveness engine whose command's
          argv[0] is a fixed absent binary name. Absence is structural (the binary does not
          exist anywhere), never PATH mutation and never a skip.

          ── THE FIXTURE BINDING MUST CARRY A NON-NIL, ALLOWLIST-PINNED Provision ──
          READ THIS BEFORE COPYING TASK-006's BINDING SHAPE. TASK-006 mandates a NIL
          Provision; doing the same here makes this entire task VACUOUS, in the specific
          and easy-to-miss sense that it would be ALREADY RED AT HEAD — the opposite of
          the silent pass this task exists to capture, and a "red-then-green" that never
          had a defect under it.

          WHY, mechanically, at HEAD: `provisionEngines` EXEMPTS a non-nil-Provision
          binding from the presence check and `continue`s past it
          (pack_gate_provision.go:85-87) — that exemption IS mechanism 1, the defect. A
          NIL-Provision binding takes the other branch: its argv[0] is collected into
          `required` (:88-94) and a LookPath miss already returns a *check.ConfigError
          naming the tool (:104-110). So a nil-Provision fixture ALREADY yields
          pack_engines = fail / ConfigErr true / tool named, TODAY, with no production
          change. The mandated "observe the silent pass at HEAD (Status pass, ConfigErr
          false, zero violations)" would be unobtainable, and
          TestE2E_AbsentEngineTool_GateRefusesLoudlyNamingTool would pass at HEAD.

          SO the fixture pack.yml declares, on its one engine:
            - `provision:` with `tool:` + `version:` set to a REAL entry of the
              production trusted-tool allowlist (pkg/pack/engine/allowlist.go:26-27 —
              ast-grep / semgrep). READ THE VERSION FROM
              `engine.TrustedToolAllowlist()` IN THE TEST rather than hardcoding the
              string, so a future pin bump cannot silently convert this test's refusal
              into a version-divergence refusal wearing the same fail+ConfigErr shape.
              This clears `checkEngineToolAllowed` (pack_gate.go:812-826, which feeds
              Provision.Version straight into CheckToolAllowed), so the trust gate is
              NOT what fires — exactly as in TASK-006, but achieved the other way.
            - `command:` whose argv[0] is the FIXED ABSENT binary name (e.g.
              "backstop-absent-engine-112") — DIVERGENT from Provision.Tool. This is
              the argv[0]-vs-Provision.Tool divergence note 4 describes, used here as
              the fixture rather than warned about in the abstract; it is also a real
              shape (a pack may pin `ast-grep` and invoke `sg`). Per note 4 the refusal
              message names BOTH, so "the absent tool NAMED in the message" means the
              PROBED argv[0], not Provision.Tool — assert on argv[0].
          The production allowlist is used directly, with no `withTestAllowlist` seam:
          CLM-008 is the END-TO-END claim, and the one test in this lane that should
          carry no seam at all is this one. If a future change makes the production
          allowlist genuinely unusable here, `withTestAllowlist` + a fixture-allowlisted
          tool (pack_gate_allowlist_test.go:29) is the sanctioned fallback — it costs
          the seam-free property and nothing else.

          ASSERT ON THE STEP RESULT, NOT ON A WHOLE-GATE VERDICT — this is a hard
          constraint, not a style note. The workspace this task builds declares `packs:`
          in backstop.yml and deliberately ships NO `backstop.lock`. `VerifyLock`
          (pkg/pack/distribution/verify.go:32-41) returns a `missing_lockfile` failure
          whenever packs are declared with no lock, so the `pack_lock_verification` step
          FAILS FIRST and the kill chain halts (pkg/gate/gate.go:162-165) before
          `pack_engines` ever runs. A test that ran the whole gate and asserted "non-zero,
          config-error" would therefore PASS FOR THE WRONG REASON — a lock refusal, not
          an absent-tool refusal — and its anti-vacuous twin would be impossible to write
          at all, since a lock-less workspace can never produce a passing whole-gate run.

          So: drive `buildGateSteps(projectRoot, …)` directly, walk the returned steps,
          and make every assertion on the `pack_engines` StepResult (and/or the
          substantiveness StepResult, if the fixture routes there). That is exactly what
          the precedent does — gate_buildsteps_test.go:90-96 walks the steps, runs each
          one, and inspects `res.Status` / `res.ConfigErr` on the one it cares about, over
          a workspace that likewise has no lock (:87 builds the steps; the surrounding
          :50-85 is the hand-written fixture pack). Do NOT add a `backstop.lock` to make a whole-gate run
          work; the per-step assertion is both simpler and strictly more precise about
          WHICH refusal fired.

            - TestE2E_AbsentEngineTool_GateRefusesLoudlyNamingTool — build the workspace,
              drive buildGateSteps, and assert on the pack_engines StepResult: Status
              "fail" with ConfigErr true, the absent tool NAMED in the violation message,
              and ZERO violations of the fabricated-downstream kind. Assert on the
              OUTCOME (a loud named refusal), NOT on which of the two mechanisms
              (provisioning presence check vs dispatch never-started refusal) caught it —
              after this lane both can, and pinning the mechanism would make the test
              brittle against a future rewiring while proving nothing extra.
            - TestE2E_PresentEngineTool_GateStillRuns — the anti-vacuous twin: the same
              workspace shape with a command that DOES start, asserting the pack_engines
              StepResult is NOT a ConfigErr refusal and does not name a missing tool.
              Without it, "the gate refuses" is satisfiable by a gate that refuses
              everything. Note this twin is only writable BECAUSE the assertion is
              per-step — see the lock constraint above.

          FIXTURE BINDING CONSTRAINT — the engine binding must declare NO `convert`
          script and NO `stdout_artifact`. State both explicitly because the failure mode
          is silent and misattributed: `runFindingsEngine` hard-errors "broken pack …
          missing convert script" when a declared convert is absent from the pack dir
          (pack_gate.go:691), and hard-errors "declared stdout_artifact … not produced"
          when a declared artifact file is missing (pack_gate.go:671) — which a binary
          that never ran ALWAYS leaves missing. Either would make the mandated "observe
          the silent pass at HEAD" step below produce a loud error instead of the silent
          green it is meant to capture — the exact opposite of the evidence this task
          exists to record, and both would keep firing after the fix, so the green would
          also prove the wrong thing. An implementer copying a convert- or
          artifact-declaring binding out of another fixture by habit gets this wrong. The
          fixture pack is pack.yml + one rule file, and nothing else. (TASK-006 carries
          the identical two constraints for the identical reason; what it does NOT share
          is the Provision shape — see the non-nil-Provision section above.)

          HOW THE FIXTURE PACK IS INSTALLED — decided, not left to taste, for two reasons:

          (1) DO NOT EDIT cmd/backstop/gate_substantiveness_e2e.go, and do not call its
              `installSubstantivenessLocalPack` (:113) or extend `e2eWorkspace`. That file
              is inside PLAN-ISSUE-113's file scope THIS SAME CYCLE — editing it here is a
              real collision, not a hypothetical one. Read it for the workspace SHAPE if
              useful; write nothing to it. This task's file scope is the single new test
              file, and it must stay that way.

          (2) DO NOT install via `pack add` or any path that runs the packval pipeline.
              packval phase 3 EXECUTES a `tier: complete` scaffold's claim fixtures, and
              pkg/packval/executor.go:85-90 refuses an `*exec.Error` run at INSTALL time — for
              a fixture pack whose whole point is an absent binary, that refusal fires
              before the gate ever runs and the test would assert the wrong mechanism.

          So: the fixture pack declares NO claim fixtures, and the test installs it by
          WRITING DIRECTLY into the temp workspace — `backstop.yml` naming the pack, plus
          `.backstop/packs/<org>/<pack>/` holding `pack.yml` and its rule file. That is the
          shipped pattern at cmd/backstop/gate_buildsteps_test.go:49-59
          (TestBuildGateSteps_PackEngineDispatchFailureYieldsFailStep), which drives the
          REAL buildGateSteps over a hand-written pack dir. Follow it. Keep the whole
          fixture local to this file; do not fork a fourth shared harness.

          For the shape of a real engine driven end to end, dispatch_astgrep_e2e_test.go is
          the reference to READ.

          OBSERVE THE SILENT PASS AT HEAD FIRST: at HEAD, driving buildGateSteps over this
          workspace yields a pack_engines StepResult with Status "pass", ConfigErr false,
          zero violations, and NO mention anywhere of the absent tool — a findings engine
          that never ran, reported as a clean scan. Capture that StepResult verbatim; it
          is the clearest single statement of the defect this plan produces. (Read it off
          the step, not off a whole-gate exit code — per the lock constraint above, a
          whole-gate run over this workspace halts at pack_lock_verification and never
          reaches pack_engines at all, so an exit code here would say nothing about the
          defect.)
        files:
