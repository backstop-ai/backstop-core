        type: test
        title: "E2E: a gate run over a pack whose engine binary is absent refuses loudly and names the tool"
        description: |
          The acceptance fixture ISSUE-112 asks for, expressed in this repo's terms. The
          issue's literal repro ("any repo + typescript-substantiveness without ast-grep")
          is not reproducible here without a TypeScript pack and without removing a tool
          from the host, so build the EQUIVALENT: a locally-installed fixture pack, in a
          temp workspace, declaring a findings/substantiveness engine whose command's
          argv[0] is a fixed absent binary name. Absence is structural (the binary does not
          exist anywhere), never PATH mutation and never a skip.

            - TestE2E_AbsentEngineTool_GateRefusesLoudlyNamingTool — run the real gate over
              that workspace and assert: a non-zero, config-error verdict; the absent tool
              named in the surfaced message; and ZERO violations of the fabricated-downstream
              kind. Assert on the OUTCOME (a loud named refusal), NOT on which of the two
              mechanisms caught it — after this lane both can, and pinning the step would
              make the test brittle against a future rewiring while proving nothing extra.
            - TestE2E_PresentEngineTool_GateStillRuns — the anti-vacuous twin, in the same
              workspace shape with a command that DOES start. Without it, "the gate refuses"
              is satisfiable by a gate that refuses everything.

          The existing e2e harnesses are the model: gate_substantiveness_e2e.go builds a
          workspace with a real locally-installed pack; the dispatch_astgrep_e2e_test.go
          family shows a real engine driven end to end. Reuse them; do not fork a fourth
          harness.

