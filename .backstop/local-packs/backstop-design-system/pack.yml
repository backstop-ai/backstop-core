name: backstop-ai/backstop-design-system
version: "0.1.0"
language: any
archetype: recipes
description: >-
  Backstop's visual system as executable policy. Recipes scaffold the canonical
  Jekyll foundation and landing page; paired rules prevent raw color drift,
  inline styling, and removal of required interaction and motion affordances.
engines:
  semgrep-design:
    command: semgrep --sarif --quiet --scan-unknown-extensions --disable-version-check --metrics=off
    input_mode: rule-flags
    input_flag: "--config"
    scope_kind: file-args
    gate_type: findings
    category: opinion
    provision:
      tool: semgrep
      version: 1.156.0
    field_contract:
      requires:
        - rule_path
        - standard
      forbids:
        - category
        - input_scope
        - validator
recipes:
  jekyll-foundation: recipes/jekyll-foundation
  jekyll-landing-page: recipes/jekyll-landing-page
content:
  ruleset:
    version: "1.0.0"
    rules:
      - id: no-raw-colors
        standard: "Product styles consume named color tokens instead of raw color literals"
        engine: semgrep-design
        rule_path: rules/design-system.yml
        risk_class: style
        claims:
          - id: clm-001
            text: "A raw hex, rgb, rgba, hsl, or hsla value outside the token source creates an ungoverned color decision"
            fixtures:
              positive:
                - fixtures/rules/valid/backstop.css
              negative:
                - fixtures/rules/invalid/backstop-raw-color.css
      - id: no-inline-styles
        standard: "Components receive their appearance from the design-system stylesheet"
        engine: semgrep-design
        rule_path: rules/design-system.yml
        risk_class: style
        claims:
          - id: clm-002
            text: "An inline style bypasses tokens, component recipes, and the shared cascade"
            fixtures:
              positive:
                - fixtures/rules/valid/index.html
              negative:
                - fixtures/rules/invalid/index-inline-style.html
      - id: focus-visible-required
        standard: "Interactive elements expose a keyboard-visible focus state"
        engine: semgrep-design
        rule_path: rules/design-system.yml
        risk_class: correctness
        claims:
          - id: clm-003
            text: "The canonical stylesheet must retain an explicit focus-visible treatment"
            fixtures:
              positive:
                - fixtures/rules/valid/backstop.css
              negative:
                - fixtures/rules/invalid/backstop-no-focus.css
      - id: reduced-motion-required
        standard: "The design system respects the user's reduced-motion preference"
        engine: semgrep-design
        rule_path: rules/design-system.yml
        risk_class: correctness
        claims:
          - id: clm-004
            text: "Motion and smooth scrolling must have a deterministic reduced-motion override"
            fixtures:
              positive:
                - fixtures/rules/valid/backstop.css
              negative:
                - fixtures/rules/invalid/backstop-no-reduced-motion.css
      - id: canonical-wordmark
        standard: "The Backstop wordmark renders the ./b shell mark and .sh domain"
        engine: semgrep-design
        rule_path: rules/design-system.yml
        risk_class: correctness
        claims:
          - id: clm-005
            text: "The canonical wordmark must preserve the shell-native brand identifier"
            fixtures:
              positive:
                - fixtures/rules/valid/index.html
              negative:
                - fixtures/rules/invalid/index-wrong-wordmark.html
