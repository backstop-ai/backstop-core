kind: scaffolding
version: "1.0.0"
ops:
  - id: design-tokens
    kind: create
    target: docs/assets/css/backstop-tokens.css
    payload: payload/backstop-tokens.css
  - id: design-styles
    kind: create
    target: docs/assets/css/backstop.css
    payload: payload/backstop.css
  - id: favicon
    kind: create
    target: docs/assets/favicon.svg
    payload: payload/favicon.svg
enforcement:
  rules:
    - no-raw-colors
    - focus-visible-required
    - reduced-motion-required
