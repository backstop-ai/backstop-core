rules:
  - id: slotly-004
    patterns:
      - pattern-either:
          - pattern: |
              $FIELD: "xoxb-..."
          - pattern: |
              $FIELD: "sk-..."
          - pattern: |
              $FIELD = "xoxb-$..."
          - pattern: |
              $FIELD = "sk-$..."
          - pattern: |
              $VAR := "xoxb-$..."
          - pattern: |
              $VAR := "sk-$..."
    message: >
      Hardcoded secret value detected. Secrets must be loaded from
      environment variables at startup. See standards/config-from-env.standard.md.
    languages: [go]
    severity: ERROR
