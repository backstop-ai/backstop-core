rules:
  - id: slotly-002
    patterns:
      - pattern: |
          json.Unmarshal($BODY, &$PAYLOAD)
          ...
      - pattern-not-inside: |
          $VERIFIER.Ensure()
          ...
          json.Unmarshal($BODY, &$PAYLOAD)
          ...
    message: >
      Slack payload is parsed without prior signature verification.
      Call slack.NewSecretsVerifier, write body bytes, and Ensure() before
      parsing. See standards/slack-signature-verification.standard.md.
    languages: [go]
    severity: ERROR
